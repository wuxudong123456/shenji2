name: audit/财务凭证类/补缴凭证
type: model
description: 从财务凭证类类文档（补缴凭证）中提取结构化元数据。涵盖字段如：入库时间、缴款金额、财政票据编号。文档范围包括：土地收益补缴凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 补缴凭证
  member_count: 1
  member_details:
  - 土地收益补缴凭证
output:
  fields:
  - name: 入库时间
    type: date
    description: 提取 入库时间 的日期值，格式 YYYY-MM-DD
  - name: 缴款金额
    type: number
    description: 提取 缴款金额 的数值（含单位，如万元、吨等）
  - name: 财政票据编号
    type: string
    description: 提取 财政票据编号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 交易日期.交易日期 = '已完成' && (应补土地收益金额.实补金额 IS NULL OR 应补土地收益金额.实补金额 < (市场评估单价.市场评估单价 * 折算比例.折算比例 - 市场评估单价.原购买单价))
  description: 已满5年允许上市交易的保障房，须按规定补交土地收益等价款。表达式筛选已完成交易的记录，然后检查补缴台账中是否缺失补缴记录（IS NULL），或者实补金额低于根据政策计算的应补金额下限。应补金额按（同地段市场评估价×规定的补缴比例-原购买价）计算，实补金额与应补金额的偏差超过5%视为可疑。具体补缴比例依地方政策设定，通常不低于差价的50%。
  audit_item: 经济适用住房和限价商品住房违规上市交易
  suspicion: 经济适用住房上市后未足额补缴土地收益价款
  regulation: "[\n  {\n    \"法规名称\": \"经济适用住房管理办法\",\n    \"法规文号\": \"建住房[2007]258号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十条\",\n    \"内容概述\": \"购买经济适用住房满5年，购房人上市转让经济适用住房的，应按照届时同地段普通商品住房与经济适用住房差价的一定比例向政府交纳土地收益等相关价款，具体交纳比例由市、县人民政府确定，政府可优先回购。\"\
    \n  }\n]"
