name: audit/财务凭证类/支付凭证
type: model
description: 从财务凭证类类文档（支付凭证）中提取结构化元数据。涵盖字段如：仓储费用金额、付款摘要、付款方、付款日期、付款时间、付款账户名称、付款金额、保证金扣留金额。文档范围包括：仓储费用支付凭证、企业支付凭证（银行流水）、利息支付凭证、土地流转费支付凭证、工程支付凭证、工程款支付凭证、支付凭证、现金支付凭证、维修资金支付凭证、绿化资金支付凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 合同
- 工程
- 票据
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 支付凭证
  member_count: 1
  member_details:
  - 仓储费用支付凭证
  - 企业支付凭证（银行流水）
  - 利息支付凭证
  - 土地流转费支付凭证
  - 工程支付凭证
  - 工程款支付凭证
  - 支付凭证
  - 现金支付凭证
  - 维修资金支付凭证
  - 绿化资金支付凭证
  - 财务支付凭证
  - 质量保证金支付凭证
  - 银行支付凭证
  - 首笔工程款支付凭证
