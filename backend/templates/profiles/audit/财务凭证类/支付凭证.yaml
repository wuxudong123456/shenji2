violations:
- expression: 会议费结算方式统计表.现金金额占比 > 0 && (会议费结算方式统计表.现金金额占比 > 0.05 || 会议费报销明细表.金额 >= 1000)
  description: 根据规定，会议费应使用银行转账或公务卡结算，禁止现金方式。凡存在现金结算且现金总额占总费用比例超过5%，或单笔现金支付达到1000元及以上，均构成违规。特殊情况下确需现金支付的应提供书面说明，若无合理说明则判定违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 违规以现金方式结算会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"会议费支付，应当严格按照国库集中支付制度和公务卡管理制度的有关规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\n  }\n]"
- expression: 对于实际发生的采购品目，设支付凭证.支付金额合计为A，明细表.预算金额合计为B。若(B=0 且 A≥制度文件.限额标准) 或 (B>0 且 ABS(A-B)/B > 0.1)，判定为预算编报不完整。
  description: 以采购品目为分组依据。若预算明细表中完全不存在该品目（B=0）且实际采购金额达到限额标准，构成漏报；若预算金额与实际采购金额偏差超过10%，构成金额低估。限额标准按当年政府采购目录执行。
  audit_item: 政府采购预算编制和实施不规范
  suspicion: 政府采购预算编报不完整
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十三条\",\n    \"内容概述\": \"负有编制部门预算职责的部门在编制下一财政年度部门预算时，应当将该财政年度政府采购的项目及资金预算列出，报本级财政部门汇总。\"\n  }\n]"
- expression: (采购合同.合同项目名称 NOT IN (预算明细表.项目编码)) AND (采购合同.合同项目名称 NOT IN (调整审批文件.调整项目名称)) AND (采购合同.合同金额 >= 政府采购限额标准)
  description: 实际采购项目与所有预算项目及追加预算项目逐一匹配，无法匹配且金额达到限额标准的，即属无预算采购。项目关键信息以采购品目与供应商组合或项目名称进行关联比对。
  audit_item: 政府采购预算编制和实施不规范
  suspicion: 未纳入政府采购预算而实施政府采购
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十三条\",\n    \"内容概述\": \"负有编制部门预算职责的部门在编制下一财政年度部门预算时，应当将该财政年度政府采购的项目及资金预算列出，报本级财政部门汇总。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国政府采购法实施条例\",\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十九条\",\n    \"内容概述\": \"\
    采购人应当根据集中采"
- expression: (汇总表.中标单位 IS NOT NULL) && (记录表.公示标题 IS NULL OR 记录表.公示状态 = '未公示') && (支付凭证.收款单位 = 汇总表.中标单位 && 支付凭证.支付金额 > 0)
  description: 评标已完成并确定中标单位，但在指定媒体上未发布中标结果公告，且已向中标单位支付款项，属于未依法公开采购结果。阈值条件：支付金额大于0即视为已执行支付。
  audit_item: 未公开政府采购标准和采购结果
  suspicion: 采购项目未依法公告中标结果
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"中华人民共和国主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十一条、第四十三条\",\n    \"内容概述\": \"政府采购信息应当在政府采购监督管理部门指定的媒体上及时向社会公开发布；采购人应当自政府采购合同签订之日起2个工作日内，将政府采购合同在省级以上人民政府财政部门指定的媒体上公告。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    "
- expression: (记录表.中标供应商名称 = 空 OR 记录表.中标金额 = 空 OR 记录表.评分明细 = 空) || (记录表.公示发布日期 - 汇总表.中标供应商确定日期（评委签字确认日期） > 2个工作日) || (采购合同.合同签订日期
    < 记录表.公示发布日期) || (支付凭证.第一笔采购资金支付日期 < 记录表.公示发布日期)
  description: 公示内容缺失中标单位、金额、评分明细等任一核心要素，即属公示不完整；自中标确定之日起超过2个工作日未发布公告为延迟公示；若合同签订日期或资金支付日期早于公示发布日期，说明可能存在先定后公示、伪造公示时间等严重程序倒置。分项触发即形成疑点。
  audit_item: 未公开政府采购标准和采购结果
  suspicion: 采购人未依法公布政府采购项目的采购结果
  regulation: "[\n  {\n    \"法规名称\": \"政府采购信息发布管理办法\",\n    \"法规文号\": \"财政部令第101号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第八条、第十条\",\n    \"内容概述\": \"中标、成交结果公告内容应当包括采购人和采购代理机构名称、中标供应商名称、地址和中标金额、主要标的概况等；自中标供应商确定之日起2个工作日内，应在指定媒体上公告中标结果。\"\
    \n  }\n]"
- expression: (分包合同.合同金额 / 承包合同.禁止转/分包条款 > 50%) || (其他.缴费单位 != 承包合同.禁止转/分包条款) || (采购合同.采购方 != 承包合同.禁止转/分包条款)
  description: 审计三要素：1.劳务分包占比超过总合同50%，疑似以包代管或整体转包；2.工程施工的主要管理人员社保非总承包单位缴纳，表明其人企分离，工程实质由其他单位管理；3.主要材料设备直接由分包单位或其他单位采购而非总承包，表明总包仅收取管理费，未履行主体结构及核心义务。满足任意条件即触发违规预警。
  audit_item: 某公共建筑合同履行审
  suspicion: 违法转包或违规分包工程
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号（2019年修正）\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第七十八条\",\n    \"内容概述\": \"本条例所称转包，是指承包单位承包建设工程后，不履行合同约定的责任和义务，将其承包的全部建设工程转给他人或者将其承包的全部建设工程肢解以后以分包的名义分别转给其他单位承包的行为。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第29号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"条"
- expression: (支付凭证.实际支付金额 / (申请.发包人审批金额 * (1 - 其他.质保金比例)) < 80%) || (支付凭证.银行到账日期 - 其他.合同约定竣工日期 > 30天)
  description: 衡量建设单位履约支付情况。两个维度：1.支付率不足：累计已付金额除以累计扣留质保金后的应付金额，比率长期低于80%，构成严重拖欠；2.支付延迟：进度款超期支付超过30天（一般合同约定14-28天内支付），定性为建设单位违约，可能引发索赔。
  audit_item: 某公共建筑合同履行审
  suspicion: 未按合同约定支付工程款
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条, 第十五条\",\n    \"内容概述\": \"机关、事业单位从中小企业采购货物、工程、服务，应当自交付之日起30日内支付款项；合同另有约定的，付款期限最长不超过60日。延迟支付的应支付逾期利息。\"\n  },\n\
    \  {\n    \"法规名称\": \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建〔2004〕369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\"\
    ,\n    "
- expression: (应付账款账龄.应付账款账龄 > 365 AND 应付账款账龄.应付金额 > 0) AND ((货币资金余额.货币资金余额 + 货币资金余额.交易性金融资产) / 货币资金余额.流动负债 > 1)
  description: 筛选账龄超过1年的应付账款，同时计算大型企业的现金比率。若现金比率大于1，说明企业具有较强的即期支付能力，此时仍长期拖欠中小企业款项，高度指向利用优势地位恶意拖欠。
  audit_item: 违规收费-拖欠工程款和农民工工资
  suspicion: 大型企业利用优势地位长期拖欠中小企业账款
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"大型企业从中小企业采购货物、工程、服务，应当合理约定付款期限并及时支付款项，不得利用优势地位强迫中小企业接受不合理的付款期限、方式或变相延长付款期限。\"\n  }\n]"
- expression: 分包合同.分包范围 包含主体结构施工 || (分包合同.分包范围 总包合同.总承包范围 的绝大部分 && 项目管理人员社保缴纳单位 != 总包单位) || 工程款支付凭证.收款单位 为 个人且金额巨大并备注‘管理费’
  description: 根据规定，建设工程主体结构不得分包。若分包合同涉及主体结构，直接认定违法分包。若实际关键管理人员非总包单位员工，且主要材料设备款、分包款由总包单位收取后仅扣除一定比例再转付，则存在转包嫌疑。
  audit_item: 重大工程项目全过程审计
  suspicion: 非法转包或违法分包导致工程质量失控
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第七十八条\",\n    \"内容概述\": \"本条例所称转包，是指承包单位承包建设工程后，不履行合同约定的责任和义务，将其承包的全部建设工程转给他人或者将其承包的全部建设工程肢解以后以分包的名义分别转给其他单位承包的行为。……本条例所称违法分包，是指下列行为：（一）总承包单位将建设工程分包给不具备相应资质条件的单位的；……（三）施工总承包单位将建设工程主体结构的施工分包给其他单位的；……\"\
    \n  },\n  {\n    \"法规"
- expression: (首笔工程款支付凭证.支付日期 < 项目资本金到位情况表.首笔资本金到位时间) || (项目施工许可证.发证日期 < 项目资本金到位情况表.首笔资本金到位时间)
  description: 若项目开始建设（以取得施工许可证或支付首笔工程款为标志）的日期，早于项目资本金首次到位的时间，则判定为“未落实资本金就进行建设”的违规行为。
  audit_item: 项目资本金不符合要求
  suspicion: 项目未落实资本金即开工建设
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于加强固定资产投资项目资本金管理的通知\",\n    \"法规文号\": \"国发〔2019〕26号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"投资项目的资本金一次认缴，并根据批准的建设进度按比例逐年到位。项目开工建设前，项目资本金应到位一定比例。\"\n  }\n]"
- expression: 支付明细表.累计已支付金额 / 项目合同.合同金额 > 支付凭证.实际完成工程量百分比 + 合同约定偏差
  description: 工程进度款支付应与实际完成工程量相匹配。表达式将累计支付比例与经确认的实际进度比例进行比较，若支付比例远超进度，超出约定允许偏差（如10%），则认定为超拨。一般无特殊约定时，偏差阈值超过10%即预警。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 未按合同约定进度超拨工程款
  regulation: "[\n  {\n    \"法规名称\": \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建〔2004〕369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"工程进度款根据确定的工程计量结果，承包人向发包人提出支付申请，发包人应按不低于工程价款的60%，不高于工程价款的90%向承包人支付工程进度款，但须强调按实际完成工程量结算。\"\n\
    \  }\n]"
- expression: (资产台账.使用状态 = '闲置' || 闲置资产明细表.闲置时长 >= 365) && (资产使用效率分析表.年使用天数 <= 30 || 资产使用效率分析表.利用率 < 0.05) && (闲置资产专项报告.闲置原因分析不包含'不可抗力'
    && 历史问题整改报告.闲置问题整改状态 = '未整改')
  description: 判定闲置资产并排除不可抗力等合理原因，同时满足连续闲置超过1年、年使用天数低于30天或利用率低于5%的条件，且未被有效整改的，视为严重违规闲置。
  audit_item: 资产管理方面存在的问题
  suspicion: 购置或建成资产长期闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十六条\",\n    \"内容概述\": \"国家出资企业投资应当符合国家产业政策，并按照国家规定进行可行性研究；与他人交易应当公平、有偿，取得合理对价。\"\n  }\n]"
- expression: 经费拨付与使用明细表.实际拨付金额 < 经费拨付与使用明细表.应拨付总额 && 经费拨付与使用明细表.拨付日期 - 经费保障政策文件.拨付时间要求 > 30 || 银行支付凭证.收款账户名称 = '乡镇卫生院' &&
    银行支付凭证.转账日期 - 当前日期 > 15 || 村医补助签收表.实发金额 < 经费保障政策文件.乡村医生岗位补助标准 || 访谈记录.拨款及时性 = '长期欠拨'
  description: 应拨付金额=辖区服务人口数×人均补助标准+乡村医生岗位补助。资金滞留、少拨、迟拨均构成经费保障不足。村医反映作为重要辅证。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 村卫生室公共卫生服务等经费拨付不足或被截留
  regulation: "[\n  {\n    \"法规名称\": \"基本公共卫生服务补助资金管理办法\",\n    \"法规文号\": \"财社〔2019〕113号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十条、第十二条\",\n    \"内容概述\": \"补助资金应当按照服务人口和人均标准足额安排并及时拨付，任何单位和个人不得克扣、截留、挪用。\"\n  },\n  {\n    \"法规名称\": \"\
    关于进一步加强乡村医生队伍建设的实施意见\",\n    \"法规文号\": \"国办发〔2015〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三、明确乡村医生功能和任务，建立乡村医生收入保障机制"
- expression: ((明细表.欠缴金额/应收金额>10%) || (明细表.欠缴金额>50000元)) && (欠缴起始时间>365天) && (催缴记录.法律措施=="无" 或 缺失)
  description: 整体拖欠比例超10%或单笔超5万元且拖欠超1年，同时村集体未采取律师函、诉讼等有效法律措施，即构成违规；严重损害农民收益。
  audit_item: 农村集体经济发展壮大不到位
  suspicion: 长期拖欠农户土地流转费且催收措施不力
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农村土地承包法\",\n    \"法规文号\": \"2018年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第三十九条、第五十五条\",\n    \"内容概述\": \"土地经营权流转的受让方应当按合同约定支付流转费用；任何组织和个人不得截留、扣缴农户的流转收益。因一方违约，另一方可依法请求其承担违约责任。\"\n  }\n]"
- expression: 记录台账.应发金额 - 记录台账.实发金额 > 0 && 当前日期 > 分红条款.支付截止日期
  description: 将协议约定的应发分红与台账及银行流水实际支付进行比对，到期后未足额支付的，即构成未兑现分红。零支付差异为零容忍。
  audit_item: 新型经营主体设立和发展不符合相关规定
  suspicion: 未按协议兑现农户分红
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第57号（2017年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第四十四条\",\n    \"内容概述\": \"可分配盈余主要按照成员与本社的交易量（额）比例返还，合作社应依法依约向成员分配盈余。\"\n  }\n]"
- expression: (支付凭证.发票金额 > 项目合同.单价 * 项目合同.数量 * 1.2) || (支付凭证.开具方为个人 AND 支付凭证.开具方 NOT IN (拆迁补偿协议.被补偿人签字)) || ((项目进度表.累计已拨付资金
    / 项目合同.合同金额) - 项目进度表.实际完工比例 > 0.15)
  description: 工程款支付超过按实际进度计算应付金额的20%，或个人收款缺乏拆迁协议支撑，或资金拨付进度严重超前于实际工程进度15个百分点以上，即触发虚报套取疑点。
  audit_item: 保障性安居工程企业债券使用不合规
  suspicion: 虚报工程进度或成本套取债券资金
  regulation: "[\n  {\n    \"法规名称\": \"保障性安居工程资金管理办法\",\n    \"法规文号\": \"财综〔2019〕31号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"严禁在保障性安居工程专项资金中虚列支出、套取资金，不得以任何形式弄虚作假骗取财政补助。\"\n  }\n]"
- expression: 债券资金使用台账.收款方 IN (关联方清单.关联企业名称) && (合同协议.合同服务内容 IS NULL || 合同协议.合同金额 / 市场公允价 > 1.5 || 合同协议.验收确认日期 IS NULL)
  description: 当收款方为关联企业，且对应合同无实质性服务内容、或合同价格超出市场公允价50%以上、或无成果验收记录，即认定为无商业实质的关联交易，目的在于转移债券资金。
  audit_item: 保障性安居工程企业债券使用不合规
  suspicion: 通过虚构关联交易转移债券资金
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强企业债券存续期监管工作有关问题的通知\",\n    \"法规文号\": \"发改办财金〔2011〕1765号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、（一）\",\n    \"内容概述\": \"严禁通过关联交易、虚构交易等方式变相挪用或抽逃债券资金。\"\n  }\n]"
- expression: (工程款支付进度对比表.实际付款日期 - 工程款支付进度对比表.合同约定付款日期 > 30天) || ((应付账款明细表.账龄 > 180天) && (应付账款明细表.欠款事由 == '工程款' || 应付账款明细表.欠款事由
    == '材料款'))
  description: 判定规则：1. 单个付款节点实际支付日期超出合同约定日期30天以上，视为违规延期支付；2. 在应付账款明细表中，与工程或材料相关的应付款项账龄超过6个月（180天）未支付，视为严重拖欠。符合任一条件即触发疑点。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 工程款项支付超合同约定期限
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"机关、事业单位从中小企业采购货物、工程、服务，应当自货物、工程、服务交付之日起30日内支付款项；合同另有约定的，付款期限最长不得超过60日。不得强制中小企业接受商业汇票等非现金支付方式，不得利用商业汇票等非现金支付方式变相延长付款期限。\"\
    \n  }\n]"
- expression: (项目竣工验收报告.结算报告出具日期 - 项目竣工验收报告.实际竣工验收日期 > 180天) && (投诉举报记录.投诉内容 CONTAINS '结算' || 投诉举报记录.投诉内容 CONTAINS '审计')
  description: 判定规则：项目自竣工验收合格之日起，发包人无故拖延办理竣工结算超过6个月（180天），且同时存在相关投诉记录，视为利用审计程序故意拖延结算。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 以审计未完成为由拖延竣工结算
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十一条\",\n    \"内容概述\": \"机关、事业单位和大型企业不得强制要求以审计机关的审计结果作为结算依据，但合同另有约定或者法律、行政法规另有规定的除外。不得以法定代表人或者主要负责人变更，履行内部付款流程，或者在合同未作约定的情况下以等待竣工验收批复、决算审计等为由，拒绝或者迟延支付中小企业款项。\"\
    \n  }\n]"
- expression: (资金划拨凭证.累计入账总额 / (工程款支付凭证.同期拨付给施工单位的工程进度款总额 * 工程项目合同.人工费用占比)) < 0.8
  description: 判定规则：在项目施工期间，建设方或总包方拨入农民工工资专用账户的累计金额，低于同期应拨付到账的工程进度款中预估人工费总额的80%，视为专户资金划拨不足，存在人工费用被挤占、挪用的风险。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 农民工工资专用账户资金划拨不足
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十七条、第二十九条\",\n    \"内容概述\": \"施工总承包单位应当按照有关规定开设农民工工资专用账户，专项用于支付该工程建设项目农民工工资。建设单位应当按照合同约定及时拨付工程款，并将人工费用及时足额拨付至农民工工资专用账户，人工费用拨付周期不得超过1个月。\"\
    \n  }\n]"
