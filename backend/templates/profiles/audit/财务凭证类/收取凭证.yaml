name: audit/财务凭证类/收取凭证
type: model
description: 从财务凭证类类文档（收取凭证）中提取结构化元数据。涵盖字段如：凭证金额、发票服务内容、实际缴纳保证金金额、投标人名称、收款单位、收款金额、收费依据、收费项目。文档范围包括：投标保证金收取凭证、融资中间费用收取凭证、费用收取凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 凭证
- 票据
- 金额
- 项目
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 收取凭证
  member_count: 1
  member_details:
  - 投标保证金收取凭证
  - 融资中间费用收取凭证
  - 费用收取凭证
output:
  fields:
  - name: 凭证金额
    type: number
    description: 提取 凭证金额 的数值（含单位，如万元、吨等）
  - name: 发票服务内容
    type: string
    description: 提取 发票服务内容 的文本值
  - name: 实际缴纳保证金金额
    type: number
    description: 提取 实际缴纳保证金金额 的数值（含单位，如万元、吨等）
  - name: 投标人名称
    type: string
    description: 提取 投标人名称 的文本值
  - name: 收款单位
    type: number
    description: 提取 收款单位 的数值（含单位，如万元、吨等）
  - name: 收款金额
    type: number
    description: 提取 收款金额 的数值（含单位，如万元、吨等）
  - name: 收费依据
    type: number
    description: 提取 收费依据 的数值（含单位，如万元、吨等）
  - name: 收费项目
    type: number
    description: 提取 收费项目 的数值（含单位，如万元、吨等）
  - name: 收费项目名称
    type: number
    description: 提取 收费项目名称 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 提取 票据类型 的文本值
  - name: 缴纳时间
    type: date
    description: 提取 缴纳时间 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: COUNT(DISTINCT(统计表.各投标人保证金缴纳金额 / 对比表.投标总报价)) > 1 && 招标文件保证金比例统一
  description: 同一标段内，各投标人实际缴纳保证金的比例（保证金金额/投标报价）应一致；若出现不同比例，且招标文件规定了统一比例，即存在差别对待，构成歧视待遇。差异超过2个百分点为严重违规。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 对潜在投标人实行歧视待遇
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  }\n]"
- expression: 收取凭证.收费金额 > 0 AND (收取凭证.收费许可 = '无' OR 收取凭证.票据类型（是否财政票据） NOT 合规财政票据)
  description: 凡存在向农户收取办理‘一卡通’费用的，且无法提供合法收费许可或开具正规财政票据，即属违规收费。
  audit_item: 监管不到位，惠农财政补贴资金被套取骗取、违规使用
  suspicion: 村干部违规收取一卡通办理费用
  regulation: "[\n  {\n    \"法规名称\": \"关于治理向农民乱收费乱罚款和各种摊派问题的通知\",\n    \"法规文号\": \"国办发〔2002〕19号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二\",\n    \"内容概述\": \"严禁向农民收取没有法律法规依据的任何费用，金融机构应免费为农户办理补贴发放银行卡折。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国农业法\"\
    ,\n    \"法规文号\": \"主席令第74号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第六十七条\",\n    \"内容概述\": \"任何机关或者单位不得以任何方式向农民或者农业生产经"
- expression: (融资业务收费明细台账.收费项目 IN ('财务顾问费', '融资咨询费', '资金管理费') && 贷款合同.服务内容条款 IS NULL) || (融资业务收费明细台账.收费项目 IN ('财务顾问费', '融资咨询费',
    '资金管理费') && NOT EXISTS (SELECT 1 FROM 交付成果记录 WHERE 客户名称 = 融资业务收费明细台账.客户名称 AND 服务内容 = 融资业务收费明细台账.收费项目))
  description: 筛选出收费项目为监管明令禁止或需提供实质性服务的费用（如财务顾问费），但贷款合同中未约定具体服务内容，或无法提供任何如服务报告、咨询记录等交付成果的，判定为虚构服务违规收费。
  audit_item: 金融机构或管理单位违规收取不合理融资中间费用
  suspicion: 无实质性服务收取财务顾问费
  regulation: "[\n  {\n    \"法规名称\": \"中国银保监会 工业和信息化部 发展改革委 财政部 人民银行 市场监管总局关于进一步规范信贷融资收费 降低企业融资综合成本的通知\",\n    \"法规文号\": \"\
    银保监发〔2020〕18号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"银行不得收取信贷资金受托支付划拨费。对于已划拨但企业暂未使用的信贷资金，不得收取资金管理费。对于小微企业信贷融资，不得在贷款合同中约定提前还款或延迟用款违约金，取消法人账户透支承诺费和信贷资信证明费。\"\
    \n  },\n  {\n    \"法规名称\": \"商业银行服务价格管理办"
- expression: (融资业务收费明细台账.收费项目 IN ('保险费', '理财产品认购款', '高额账户管理费') && 融资业务收费明细台账.收取时间 < 贷款合同.首次放款日期 && NOT EXISTS (SELECT 1 FROM
    客户自愿购买声明 WHERE 客户名称 = 融资业务收费明细台账.客户名称 AND 产品名称 = 融资业务收费明细台账.收费项目))
  description: 若客户在获得贷款前被强制收取保险费、理财产品认购款或高额账户管理费，且银行无法提供客户自愿购买的声明文件，则判定为捆绑强制收费。收取时间早于放款日期是关键指标，表明企业为获得融资被迫接受附加条件。
  audit_item: 金融机构或管理单位违规收取不合理融资中间费用
  suspicion: 捆绑销售保险或理财产品获取贷款
  regulation: "[\n  {\n    \"法规名称\": \"中国银保监会 工业和信息化部 发展改革委 财政部 人民银行 市场监管总局关于进一步规范信贷融资收费 降低企业融资综合成本的通知\",\n    \"法规文号\": \"\
    银保监发〔2020〕18号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"银行不得在信贷审批时，强制企业购买保险、理财、基金或其他资产管理产品等。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国反不正当竞争法\",\n    \"法规文号\": \"中华人民共和国主席令第二十九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\""
- expression: (融资业务收费明细台账.收费项目 IN ('抵押物评估费', '抵押登记费', '公证费') && 贷款合同.费用承担方条款 != '银行承担') || ( EXISTS (SELECT 1 FROM 客户账户交易流水表
    WHERE 收款方 IN (SELECT 合作方名称 FROM 与合作机构的合作协议 WHERE 返点条款 IS NOT NULL) AND 付款方 = 融资业务收费明细台账.客户名称 AND 交易金额 = 融资中间费用收取凭证.金额
    ))
  description: 监管规定抵押品评估等相关费用应由银行承担。若贷款合同中约定此类费用由企业承担，或虽然形式上由企业支付，但收款方与银行存在利益分成关系，则判定为转嫁成本。通过资金流水追踪收款方与银行的关联关系是发现隐蔽违规的关键。
  audit_item: 金融机构或管理单位违规收取不合理融资中间费用
  suspicion: 向借款企业转嫁抵押评估等费用
  regulation: "[\n  {\n    \"法规名称\": \"中国银保监会 工业和信息化部 发展改革委 财政部 人民银行 市场监管总局关于进一步规范信贷融资收费 降低企业融资综合成本的通知\",\n    \"法规文号\": \"\
    银保监发〔2020〕18号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条第（一）款\",\n    \"内容概述\": \"除银团贷款外，商业银行不得向小微企业收取贷款承诺费、资金管理费，严格限制向小微企业收取财务顾问费、咨询费等费用。银行业金融机构应承担信贷融资各环节的尽职调查、授信审批、贷款发放、资金监管、贷后管理等责任，不得将上述职责转为收费项目。\"\
    \n  },\n  {\n   "
- expression: (融资业务收费明细台账.收费项目 ILIKE '%利率风险%费%' OR 融资业务收费明细台账.收费项目 ILIKE '%资金管理%费%') && (贷款合同.利率条款 = '浮动利率' && NOT EXISTS
    (SELECT 1 FROM 金融机构内部收费管理制度 WHERE 收费项目 = 融资业务收费明细台账.收费项目 AND 定价方法 IS NOT NULL AND 定价方法 != ''))
  description: 在LPR或其它浮动利率贷款中，银行额外收取名为“利率风险管理费”等无公开定价标准的费用。如果银行无法提供该费用的明确计算依据和审批文件，则判定为通过巧立名目的方式变相提高实际贷款利率，突破利率管理要求。
  audit_item: 金融机构或管理单位违规收取不合理融资中间费用
  suspicion: 以利率风险管理费等名义变相提高利率
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国商业银行法\",\n    \"法规文号\": \"中华人民共和国主席令第三十四号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十七条\",\n    \"内容概述\": \"商业银行不得违反规定提高或者降低利率以及采用其他不正当手段，吸收存款，发放贷款。\"\n  },\n  {\n    \"法规名称\": \"中国银保监会 工业和信息化部\
    \ 发展改革委 财政部 人民银行 市场监管总局关于进一步规范信贷融资收费 降低企业融资综合成本的通知\",\n    \"法规文号\": \"银保监发〔2020〕18号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \""
- expression: (融资业务收费明细台账.收费项目 = '提前还款违约金' && 贷款合同.提前还款违约金条款 IS NOT NULL) && ((融资业务收费明细台账.收取金额 / 对应时点的贷款本金余额) > 0.03)
  description: 企业提前还款时，银行收取的违约金超过剩余本金3%的，可能被认定为惩罚性、显失公平的收费。此阈值为审计经验判断标准，具体认定可结合合同中的显著提示义务是否履行、违约金是否远超银行实际损失来综合判断。
  audit_item: 金融机构或管理单位违规收取不合理融资中间费用
  suspicion: 收取显失公平的高额提前还款违约金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"中华人民共和国主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五百八十五条\",\n    \"内容概述\": \"约定的违约金过分高于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以适当减少。\"\n  },\n  {\n    \"法规名称\": \"中国银保监会 工业和信息化部\
    \ 发展改革委 财政部 人民银行 市场监管总局关于进一步规范信贷融资收费 降低企业融资综合成本的通知\",\n    \"法规文号\": \"银保监发〔2020〕18号\",\n    \"效力级别\": \"部门规章\",\n "
