name: audit/财务凭证类/证金凭证
type: model
description: 从财务凭证类类文档（证金凭证）中提取结构化元数据。涵盖字段如：实际缴纳金额。文档范围包括：保证金凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 证金凭证
  member_count: 1
  member_details:
  - 保证金凭证
output:
  fields:
  - name: 实际缴纳金额
    type: number
    description: 提取 实际缴纳金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ((合同.保证金条款 / 合同.合同金额) > 0.1) && (合同.保证金条款 > 0)
  description: 若合同约定或实际收取的履约保证金金额与合同金额的比例超过10%（0.1），且招标文件中无更高法定上限依据，则判定违规。保证金金额大于0时触发计算。
  audit_item: 合同要素提取
  suspicion: 履约保证金比例超出法定上限
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第五十八条\",\n    \"内容概述\": \"招标文件要求中标人提交履约保证金的，中标人应当按照招标文件的要求提交，但履约保证金不得超过中标合同金额的10%。\"\n  }\n]"
