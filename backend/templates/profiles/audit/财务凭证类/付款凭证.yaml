name: audit/财务凭证类/付款凭证
type: model
description: 从财务凭证类类文档（付款凭证）中提取结构化元数据。涵盖字段如：交易对手、交易金额、付款事由、付款企业名称、付款日期、付款用途、付款记录、付款金额。文档范围包括：付款凭证、借款人首付款凭证、收付款凭证、消防维保合同付款凭证、财务付款凭证、银行付款凭证、项目付款凭证、首次付款凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 合同
- 审批
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 付款凭证
  member_count: 1
  member_details:
  - 付款凭证
  - 借款人首付款凭证
  - 收付款凭证
  - 消防维保合同付款凭证
  - 财务付款凭证
  - 银行付款凭证
  - 项目付款凭证
  - 首次付款凭证
