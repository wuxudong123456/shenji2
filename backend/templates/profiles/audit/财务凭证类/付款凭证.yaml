    : \"第九条、第二十六条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，不得以虚假的经济业务事项或者资料进行会计核算。\"\n  }\n]"
- expression: (合同.签订日期 > 合同.约定履约开始日期) || (合同.签订日期 > 合同.约定履约开始日期) || (首次付款凭证.首次付款日期 < 合同.签订日期)
  description: 合同签订日期晚于约定的或实际的履约开始日期，或者首次付款发生在合同签订之前，表明存在先实施后签合同的情况。任一条件成立即触发疑点。
  audit_item: 合同要素提取
  suspicion: 合同签订时间晚于履约开始日期
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。\"\n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n  \
    \  \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条\",\n    \"内容概述\": \"项目单位应当严格执行招标投标法律法规等有关规定，不得将依法应当招标的"
- expression: ((合同台账.供应商 股东/高管 集合 ∩ 合同台账.客户名称 股东/高管 集合)≠∅) && (合同台账.采购标的 == 合同台账.销售标的) && ( (合同台账.销售单价 - 合同台账.采购单价) / 合同台账.采购单价
    ≤ 0.02 ) && ( |合同台账.签订日期 - 合同台账.签订日期| ≤ 30天 )
  description: 判定条件：①采购供应商与销售客户的显名股东或高级管理人员存在交集（≥1人），构成实质关联；②同一标的物一进一出；③贸易毛利率≤2%，远低于正常商业利润，缺乏商业实质；④采购与销售合同签署时间间隔≤30天，呈现资金过账特征。满足全部条件即触发重大虚假贸易疑点，风险等级高。
  audit_item: 虚假贸易审计
  suspicion: 上下游关联方交易缺乏商业实质
  regulation: "[\n  {\n    \"法规名称\": \"关于规范中央企业贸易管理严禁各类虚假贸易的通知\",\n    \"法规文号\": \"国资发财评规〔2023〕74号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"不准参与特定利益关系企业间开展的无商业目的的贸易业务，严禁上下游为同一控制人或存在特定利益关系的空转贸易。\"\n  }\n]"
- expression: ( (合同台账.预付款比例 >= 0.8) && ( NOW() - 合同台账.约定交货日期 > 90天 ) && ( 入库单.对应采购合同编号 记录为空 ) ) || ( (合同台账.收款条件（赊销） == '赊销')
    && ( NOW() - 合同台账.约定交货日期 > 180天 ) && ( 明细账.金额 > 0 ) && ( 出库单.对应销售合同编号 记录为空 ) )
  description: 采购端：预付款比例≥80%，且超过约定交货期90天仍未收到货物，同时系统内无任何对应入库记录，表明资金已付出但实物流未发生，高度疑似融资性贸易。销售端：赊销方式下货物声称已交付超过180天，应收账款仍未收回，且无出库单流转记录，表明货权未真实转移，疑似空转贸易。任一条件满足即触发疑点，预付款情形风险等级高。
  audit_item: 虚假贸易审计
  suspicion: 大额预付款无货物交付或应收账款长期无回收
  regulation: "[\n  {\n    \"法规名称\": \"关于规范中央企业贸易管理严禁各类虚假贸易的通知\",\n    \"法规文号\": \"国资发财评规〔2023〕74号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条、第四条\",\n    \"内容概述\": \"严禁以贸易业务为名从事融资性贸易，严禁开展对交易标的没有控制权的空转贸易。\"\n  }\n]"
- expression: (明细表.未还款余额 > 0) && (借款合同.借款期间 > 365) && (申报收入总额.利息股息红利所得申报记录)
  description: 纳税年度内个人投资者从其投资企业借款，在该纳税年度终了后既不归还，又未用于企业生产经营的，其未归还的借款应视为企业对个人投资者的红利分配，依照“利息、股息、红利所得”项目计征个人所得税。超过365天未归还且无经营用途，即触发。
  audit_item: 违反税收征管规定的行为
