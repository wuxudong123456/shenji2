name: audit/财务凭证类/减免凭证
type: model
description: 从财务凭证类类文档（减免凭证）中提取结构化元数据。涵盖字段如：减免税额、税种、纳税申报年月。文档范围包括：供水工程运行管理单位税务减免凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 减免凭证
  member_count: 1
  member_details:
  - 供水工程运行管理单位税务减免凭证
output:
  fields:
  - name: 减免税额
    type: string
    description: 提取 减免税额 的文本值
  - name: 税种
    type: string
    description: 提取 税种 的文本值
  - name: 纳税申报年月
    type: date
    description: 提取 纳税申报年月 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
