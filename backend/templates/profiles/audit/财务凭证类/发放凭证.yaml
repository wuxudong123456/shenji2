name: audit/财务凭证类/发放凭证
type: model
description: 从财务凭证类类文档（发放凭证）中提取结构化元数据。涵盖字段如：付款方、付款方名称、发放日期、发薪月份、同期当地事业单位同岗位工资标准、姓名、实发工资、实发工资金额。文档范围包括：人才补贴发放凭证、定向医学生待遇发放凭证、工资发放凭证、职工安置补偿金发放凭证、薪酬发放凭证、补贴发放凭证、资金发放凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 审批
- 薪酬
- 补贴
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 发放凭证
  member_count: 1
  member_details:
  - 人才补贴发放凭证
  - 定向医学生待遇发放凭证
  - 工资发放凭证
  - 职工安置补偿金发放凭证
  - 薪酬发放凭证
  - 补贴发放凭证
  - 资金发放凭证
output:
  fields:
  - name: 付款方
    type: number
    description: 提取 付款方 的数值（含单位，如万元、吨等）
  - name: 付款方名称
    type: number
    description: 提取 付款方名称 的数值（含单位，如万元、吨等）
  - name: 发放日期
    type: date
    description: 提取 发放日期 的日期值，格式 YYYY-MM-DD
  - name: 发薪月份
    type: string
    description: 提取 发薪月份 的文本值
  - name: 同期当地事业单位同岗位工资标准
    type: string
    description: 提取 同期当地事业单位同岗位工资标准 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 实发工资
    type: string
    description: 提取 实发工资 的文本值
  - name: 实发工资金额
    type: number
    description: 提取 实发工资金额 的数值（含单位，如万元、吨等）
  - name: 实发金额
    type: number
    description: 提取 实发金额 的数值（含单位，如万元、吨等）
  - name: 审批签章
    type: string
    description: 提取 审批签章 的文本值
  - name: 工资组成
    type: string
    description: 提取 工资组成 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 收款人
    type: number
    description: 提取 收款人 的数值（含单位，如万元、吨等）
  - name: 收款人姓名
    type: number
    description: 提取 收款人姓名 的数值（含单位，如万元、吨等）
  - name: 社保停缴证明
    type: string
    description: 提取 社保停缴证明 的文本值
  - name: 社保缴纳记录
    type: string
    description: 提取 社保缴纳记录 的文本值
  - name: 缴费记录
    type: number
    description: 提取 缴费记录 的数值（含单位，如万元、吨等）
  - name: 职工姓名
    type: string
    description: 提取 职工姓名 的文本值
  - name: 补偿金额
    type: number
    description: 提取 补偿金额 的数值（含单位，如万元、吨等）
  - name: 补贴金额
    type: number
    description: 提取 补贴金额 的数值（含单位，如万元、吨等）
  - name: 资金发放时间
    type: date
    description: 提取 资金发放时间 的日期值，格式 YYYY-MM-DD
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (经济实体股东高管名单.人员姓名 IN (在职人员兼职申报审批表.姓名) AND (在职人员兼职申报审批表.审批状态 != '批准' OR 在职人员兼职申报审批表.兼职单位 != 经济实体股东高管名单.企业名称))
    AND (薪酬发放凭证.收款人姓名 == 经济实体股东高管名单.人员姓名 OR 工资外收入明细表.对方单位 == 经济实体股东高管名单.企业名称 AND 工资外收入明细表.金额 > 0)
  description: 首先识别在职人员在经济实体兼任股东或高管且未履行批准程序，然后判定存在从该实体收取报酬的证据（如银行流水显示顾问费、工资外收入明细中的劳务费等）。两个条件同时满足即构成违规兼职取酬。若仅兼职未发现取酬，仍可能构成违规兼职，另案处理。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 在职人员违规兼职取酬
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十四条\",\n    \"内容概述\": \"违反有关规定在经济组织、社会组织等单位中兼职，或者经批准兼职但获取薪酬、奖金、津贴等额外利益的，依照前款规定处理。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国公职人员政务处分法\",\n    \"法规文号\": \"中华人民共和国主席令第四十六号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十六条\",\n    \"内容概述\"\
    : \"违反规定从"
- expression: (行业协会商会领导成员任职表.任职起始日期 - 离退休人员信息登记表.离职日期) <= 1095 AND (离退休人员返聘审批文件.审批结果 != '批准' OR 离退休人员返聘审批文件.批准兼职单位 != 行业协会商会领导成员任职表.任职单位
    OR 离退休人员返聘审批文件 IS NULL)
  description: 计算退休人员到行业协会商会任职的起始日期与离职日期的相差天数，若小于等于1095天（3年）且无合规审批，则构成违规。审批文件需明确批准该人员在该协会任职，否则触发疑点。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 退（离）休三年内违规到行业协会商会兼职
  regulation: "[\n  {\n    \"法规名称\": \"关于规范退（离）休领导干部在社会团体兼职问题的通知\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"退（离）休领导干部在社会团体兼职，须按干部管理权限审批或备案后方可兼职。除工作特殊需要外，年龄一般不超过70周岁，且兼职不得超过1个。兼职不得领取社会团体的薪酬、奖金、津贴等报酬和获取其他额外利益，也不得领取各种名目的补贴等。原任领导干部职务的退（离）休领导干部在社会团体兼职，届满后连任不超过两届，兼职的任职年龄界限为70周岁。\"\
    \n  },\n  "
- expression: (离退休人员信息登记表.离职日期 <= (当前日期 - 1095)) AND (行业协会商会领导成员任职表.是否领取报酬 == '是' OR 薪酬发放凭证.付款方 IN (行业协会商会领导成员任职表.任职单位) OR
    经济实体股东高管名单.人员姓名 IN (离退休人员信息登记表.姓名) AND 经济实体股东高管名单.企业名称 IN (原任职务管辖地区和业务范围内的企业名单))
  description: 对退休已满3年人员，仍须检查其在行业协会兼职是否违规取酬，或是否在原管辖范围企业违规任职、取酬。表达式判定三类情形：1.在协会兼职但领取报酬；2.从协会或原管辖企业获取薪酬；3.在原管辖业务范围内企业持股或任职。存在任一情形则触发疑点。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 退（离）休三年后违规兼职或变相取酬
  regulation: "[\n  {\n    \"法规名称\": \"关于规范退（离）休领导干部在社会团体兼职问题的通知\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"退（离）休领导干部经批准兼任社会团体职务，兼职不得领取社会团体的薪酬、奖金、津贴等报酬和获取其他额外利益，也不得领取各种名目的补贴等。\"\n  },\n\
    \  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第九十五条\"\
    ,\n  "
- expression: (企业名称、隶属关系、职工人数、资产状况.职工人数 != 企业名称、统一社会信用代码、法定代表人、董事、监事、高级管理人员姓名及身份证号、经营范围、登记注册日期、注册地址、投资人/股东姓名及身份证号、成立日期、股东及高管姓名、法定代表人或股东与村干部关联关系、企业状态、注销日期、施工方股东及关键管理人员、物业公司及业委会成员名单、股东姓名、高级管理人员姓名、实际控制人、承租方股东、注册日期、经营地址、股东信息、单位注册日期、参保员工人数、经营状态.企业名称)
    || (机构名称、改革类型、当前状态、计划完成率、厂办大集体企业改革状态、完成标志、该医疗机构改革状态.完成标志 / 企业名称、隶属关系
  description: 清册企业数与工商注册的分离实体数不一致，表明底数不清；改革完成率低于70%为进度严重滞后；补偿金领取人数少于应安置人数意味着安置未全部落实。任一条件满足即触发疑点。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
  suspicion: 厂办大集体企业底数不清、改革迟滞
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于在全国范围内开展厂办大集体改革工作的指导意见\",\n    \"法规文号\": \"国办发〔2011〕18号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"各企业和地方要全面摸底，制定改革方案，妥善安置职工，确保2015年年底前完成改革任务。\"\n  }\n]"
- expression: (定向医学生待遇发放凭证.实发工资 < 定向医学生待遇发放凭证.同期当地事业单位同岗位工资标准 * 0.9) OR (定向医学生待遇发放凭证.社保缴纳记录 = '未缴')
  description: 定向生实发工资低于协议承诺或当地同类岗位工资的90%，或存在未依法缴纳社会保险的，均视为待遇保障不足；差额越大、欠缴时间越长风险越严重。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不合规
  suspicion: 定向医学生工资待遇或社保未落实兑现
  regulation: "[\n  {\n    \"法规名称\": \"关于做好农村订单定向免费培养医学生就业安置和履约管理工作的通知\",\n    \"法规文号\": \"国卫科教发〔2019〕56号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"三、落实待遇保障措施\",\n    \"内容概述\": \"各地要切实保障定向医学生的工资待遇和社会保险，确保定向生在服务期内享受与当地同类事业单位在编人员同等薪酬待遇，不得以任何理由克扣。\"\
    \n  }\n]"
- expression: 激励类型.激励标准 != null && (发放凭证.补贴金额 < 激励类型.激励标准 || 发放凭证.发放日期 > 激励类型.兑现时限 + 90天 || 表彰文件.表彰名单 为空集)
  description: 政策文件规定了明确的激励金额、兑现时限或表彰计划，但实际发放金额不足、发放时间超出规定时限3个月以上，或连续两个考核年度内无任何表彰记录，判定为激励措施未落实。
  audit_item: 数字乡村建设人才不足
  suspicion: 数字乡村建设人才激励措施未落实
  regulation: "[\n  {\n    \"法规名称\": \"数字乡村发展战略纲要\",\n    \"法规文号\": \"中办发〔2019〕34号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\"\
    : \"第五部分 保障措施\",\n    \"内容概述\": \"完善人才引进、培养、使用和激励机制，加强对数字乡村建设人才的激励保障，确保各项激励政策落实到位。\"\n  }\n]"
- expression: 申领表.申报缴费基数 > 缴纳记录.实际缴费基数 * 1.1 || 申领表.申报缴费基数 > MAX(发放凭证.实发工资金额, 申报记录.申报收入额) * 1.2 || 明细表.支出金额 / 缴费比例 对应的基数 !=
    申领表.申报缴费基数（偏差>5%）
  description: 当申报基数与实际社保系统记录基数相差超过10%，或申报基数明显高于员工真实工资收入20%以上，或补贴金额反推基数与申报基数不一致时，判定为虚增补贴标准。
  audit_item: 虚列就业补助资金支出
  suspicion: 篡改缴费基数虚增社保补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"社会保险补贴标准根据单位实际缴纳的社会保险费确定，缴费基数应符合社会保险征缴规定，不得擅自提高。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国社会保险法\"\
    ,\n    \"法规文号\": \"主席令第三十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第六十条\",\n    \"内容概述\": \"用人单位应当自行申报、按时足额缴纳社会保险费，缴费基数应"
- expression: （申领吸纳就业补贴的身份证号 NOT IN (缴纳记录.身份证号)） || （合同起止日期 < 缴纳记录.首次参保日期 超过 30 天） || （发放凭证.实发工资金额在补贴申报后连续3个月无流水） || （合同起止日期与补贴申报期限不符）
  description: 通过查验劳动合同是否伴随真实用工行为（社保缴纳、工资发放）来判断，若未参保、参保时间滞后超过30天、或补贴期间无任何工资发放记录，则视为虚假用工合同。
  audit_item: 虚列就业补助资金支出
  suspicion: 虚构用工合同骗取吸纳就业补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"吸纳就业困难人员社保补贴或岗位补贴须以建立稳定劳动关系并按规定缴纳社保费为前提，仅凭无实质履行的合同不得申领。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国劳动合同法\"\
    ,\n    \"法规文号\": \"主席令第六十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"建立劳动关系应当订立书面劳动合同，但劳动关"
