name: audit/财务凭证类/财务凭证
type: model
description: 从财务凭证类类文档（财务凭证）中提取结构化元数据。涵盖字段如：事由、付款方、付款方名称、付款金额、会计科目、供应商名称、借方科目、凭证号。文档范围包括：企业保证金缴纳财务凭证、企业支付工程款的财务凭证、企业支付工资的财务凭证、保证金相关财务凭证、审计期间内财务凭证、审计期间财务凭证、管理机构人员支出的财务凭证、管理机构运行经费的财务凭证、财务凭证、车辆购置财务凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 凭证
- 审批
- 票据
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 财务凭证
  member_count: 1
  member_details:
  - 企业保证金缴纳财务凭证
  - 企业支付工程款的财务凭证
  - 企业支付工资的财务凭证
  - 保证金相关财务凭证
  - 审计期间内财务凭证
  - 审计期间财务凭证
  - 管理机构人员支出的财务凭证
  - 管理机构运行经费的财务凭证
  - 财务凭证
  - 车辆购置财务凭证
