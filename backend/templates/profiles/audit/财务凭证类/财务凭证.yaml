violations:
- expression: (预算执行情况对比表.实际支出金额 > 年度预算批复文件.批复的公务接待费预算总额) AND (预算调整审批文件.审批文号 IS NULL OR 预算调整审批文件.审批日期 > 预算执行情况对比表.实际支出日期 OR
    预算调整审批文件.调整金额 < 预算执行情况对比表.超支金额)
  description: 判断实际支出总额是否超出批复预算，且无规范预算调整审批或调整程序滞后。超预算支出且无追加批复即视为违规，阈值无容差。
  audit_item: 公务接待费预算执行不合规
  suspicion: 无预算或超预算列支公务接待费
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条、第七十二条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当严格按照预算执行，未经批准不得调整预算，不得无预算安排支出；超收安排支出需经法定程序。\"\n  },\n  {\n    \"法规名称\"\
    : \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\":\
    \ \"党政"
- expression: (关联单位相关支出明细.摘要 包含 "接待费" OR 关联单位相关支出明细.摘要 包含 "餐费" OR 关联单位相关支出明细.收款方 = '本单位经常消费的酒店' OR 关联单位相关支出明细.收款方 = '本单位')
    AND (合同协议.费用分担条款 为空 OR 未办理资金划转审批) AND 公务接待费明细账.同期接待费变动 < 关联单位相关支出明细.金额
  description: 关联单位账目中出现接待性质支出且收款方指向本单位经常消费场所，同时缺乏合法费用转移依据，或本单位同期接待费异常偏低，极可能为转嫁摊派。
  audit_item: 公务接待费预算执行不合规
  suspicion: 向所属单位或关联方转嫁摊派接待费
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"不得向下级单位以及其他单位、企业、个人转嫁公务活动费用。\"\n  },\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"\
    法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"禁止向下级单位以及其他单位、企业、个人摊派、转嫁公务接待费用。\"\
    \n  }\n"
- expression: (财务凭证.发票金额 / 财务凭证.用餐人数 > 公务接待管理制度.人均餐费标准) || (财务凭证.用餐人数 > 公务接待管理制度.陪餐人数上限) || ((财务凭证.菜单明细 LIKE '%烟%' OR 财务凭证.菜单明细
    LIKE '%酒%' OR 财务凭证.发票内容 LIKE '%烟%' OR 财务凭证.发票内容 LIKE '%酒%') AND 公务接待管理制度.是否禁烟酒 = '是') || (财务凭证.接待事由 IS NULL OR 财务凭证.接待事由
    NOT LIKE '%公务%')
  description: 人均消费超出标准、陪餐人数违规、违规消费烟酒、接待事由非公务，任一条件触发即视为违规。人均标准以单位制度和地方规定中较严者为准。
  audit_item: 公务接待费预算执行不合规
  suspicion: 公务接待费超标准或超范围支出
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"行业规范\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"接待对象按照规定标准自行用餐，确需安排工作餐的，应严格控制陪餐人数，接待对象10人以内的，陪餐人数不得超过3人；超过10人的，不得超过接待对象人数的三分之一。工作餐应当供应家常菜，不得提供高档菜肴和香烟、高档酒水。\"\
    \n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\""
- expression: ((会议费用明细表.摘要 包含 “餐费” OR 会议费用明细表.摘要 包含 “住宿”) OR (培训费用明细表.摘要 包含 “餐费” OR 培训费用明细表.摘要 包含 “住宿”)) && (会议培训支撑材料.签到表
    IS NULL OR 会议培训支撑材料.签到表 = '' OR 会议培训支撑材料.照片 IS NULL OR 会议培训支撑材料.照片 = '' OR 培训活动预决算文件.议程 IS NULL OR 培训活动预决算文件.议程 = '')
    && ((会议费用明细表.餐饮支出 / 会议费用明细表.实际总支出金额 > 0.5 OR 培训费用明细表.餐饮支出 / 培训费用明细表.金额 > 0
  description: 会议或培训中餐饮住宿支出占比过高且缺乏实质性活动佐证，强烈暗示接待费伪装记入。餐饮占比超过50%或人均支出畸高触发异常。
  audit_item: 公务接待费预算执行不合规
  suspicion: 在其他科目隐匿列支公务接待费
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当加强对预算支出的管理，不得擅自改变预算支出的用途。\"\n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n   \
    \ \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条、第二十条\",\n    \"内容概述\": \"严禁以培训、会议等名义变相公款消费，不得在会议费中列支"
- expression: (财务凭证.发票内容 包含 “飞机票”“火车票”“景点门票”“礼品”“住宿费” 且 财务凭证.接待对象名单 非本单位人员) && (财务凭证.报销事由 包含 “接待”) && (财务凭证.报销审批单 中未注明由本单位承担的正当理由)
  description: 接待费报销中出现非本单位人员的交通、住宿、旅游、礼品发票，且无特殊客观情况说明，即属替接待对象承担费用。
  audit_item: 公务接待费预算执行不合规
  suspicion: 违规列支应由接待对象自负的费用
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"行业规范\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"接待对象应当自行负担住宿费、交通费等。接待单位应当严格控制接待范围，不得为接待对象支付个人费用。\"\n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\"\
    ,\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"不得在接待费中列支应当由接待对象承"
- expression: (非税收入收支明细账.支出摘要 包含 “餐费”“接待费”“酒店消费”) && (收款方为餐饮或酒店) && (该笔非税收入未见同步上缴财政的缴库凭证) && (该笔支出未在单位公务接待费明细账中反映)
  description: 非税收入未上缴国库而直接支付接待费用，属坐支行为；若同时未列入单位接待费账，则构成账外坐支，性质更严重。
  audit_item: 公务接待费预算执行不合规
  suspicion: 非税收入未上缴直接用于接待支出
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十六条\",\n    \"内容概述\": \"政府的全部收入应当上缴国家金库，任何部门、单位和个人不得截留、占用、挪用或者拖欠。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n\
    \    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"财政收入执收单位违反规定设立财政收入项目，擅自改变财政收入"
- expression: (会议费用明细表.餐饮支出 > 会议费用明细表.实际总支出金额*0.6 OR 培训费用明细表.餐饮支出 > 培训费用明细表.金额*0.6) AND (会议培训支撑材料.签到表 IS NULL OR 会议培训支撑材料.签到表笔迹雷同
    OR 会议培训支撑材料.签到人员与人员考勤记录矛盾) AND ((会议费用明细表.实际总支出金额/会议费用明细表.参会人数) > 近三年同类活动人均支出*3 OR (培训费用明细表.金额) > 近三年同类活动人均支出*3)
  description: 会议/培训餐饮占比畸高（>60%）、活动佐证材料虚假或缺失、人均支出异常超高，三者叠加表明活动极可能不实，实为接待费转移。
