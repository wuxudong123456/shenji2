    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款审批单
    type: number
    description: 提取 付款审批单 的数值（含单位，如万元、吨等）
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 入账日期
