name: audit/财务凭证类/原始凭证
type: model
description: 从财务凭证类类文档（原始凭证）中提取结构化元数据。涵盖字段如：业务发生证明日期、交易日期、交易金额、付款审批单、供应商名称、入账日期、凭证号、凭证编号。文档范围包括：住房公积金原始凭证、公用经费支出原始凭证、其他应付款原始凭证、原始凭证、土地出让收益科目原始凭证、培训费用报销原始凭证、支出报销原始凭证、福利费原始凭证、费用报销原始凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 凭证
- 合同
- 审批
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 原始凭证
  member_count: 1
  member_details:
  - 住房公积金原始凭证
  - 公用经费支出原始凭证
  - 其他应付款原始凭证
  - 原始凭证
  - 土地出让收益科目原始凭证
  - 培训费用报销原始凭证
  - 支出报销原始凭证
  - 福利费原始凭证
  - 费用报销原始凭证
