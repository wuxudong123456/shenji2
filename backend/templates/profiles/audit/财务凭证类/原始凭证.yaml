violations:
- expression: (原始凭证.原始单据（如学费票据、合同）日期 > 原始凭证.记账凭证做账日期) && (原始凭证.记账凭证做账日期 >= 明细表.确认期间（或记账日期）) || (合同协议.合同约定的服务期/产品交付期/学籍所属期
    > 明细表.确认期间（或记账日期） && 明细表.收入来源 > 明细表.确认金额)
  description: 表达式包含两种风险判断逻辑：1. 原始业务单据（如学费票据）开具日期在未来（下一年度），而记账凭证将其提前到本决算年度进行确认，这违反了权责发生制原则。2. 依据合同约定，收入对应的服务、商品交付主要发生在下一年度（如下学期学费），但在本年度决算中一次性或分期确认了大额收入，且缺乏合理的完工进度证据，判定为提前确认。重点关注年末12月份及次年1月的大额收入凭证。
  audit_item: 决算报表内容不真实
  suspicion: 违规提前确认收入以虚增决算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计账簿，编制财务会计报告。任何单位不得以虚假的经济业务事项或者资料进行会计核算。\"\n  },\n  {\n\
    \    \"法规名称\": \"政府会计准则——基本准则\",\n    \"法规文号\": \"财政部令第78号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"\
    内容概述\":"
- expression: (原始凭证.发票号码 || 明细台账.实际履约进度文件) && 银行对账单.对方账户与关联方清单比对结果 || (明细台账.实际履约进度文件 && 银行对账单.大额转出金额)
  description: 该表达式判定以下典型的虚假支出闭环：付款申请审批单据齐全，但经查验，发票为虚假或无真实交易背景，或合同乙方为空壳公司、关联方。同时，资金在支付后又通过多层转账最终回流至本单位职工、关联方或个人账户。另一种是虽有合同和付款，但无法提供合同约定的服务成果、工程验收单等任何履约证明，支出缺乏商业实质。
  audit_item: 决算报表内容不真实
  suspicion: 通过虚构合同虚列项目支出
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"任何单位不得以虚假的经济业务事项或者资料进行会计核算。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"\
    国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有以虚报、冒领等手段骗取财政资金，或者截留、挪用财政资金等行为的，责令改"
- expression: (原始凭证.业务发生证明日期属于本决算年度) && (明细表.支出确认日期 > 决算报表.报表期间截止日期) && (行对账单.实际付款日期 > 决算报表.报表期间截止日期)
  description: 一项费用已在本年度审计期间实际发生，且单位内部验收、入库等流程已完成，但财务部门故意压单、不进行账务处理，待到下一年度才确认支出并付款。这种将费用‘递延’到下一年度的行为，直接导致本年度决算报表少计了成本和负债。重点关注12月份发生的业务，但其报销审批和账务处理却在次年1月份及以后的业务。
  audit_item: 决算报表内容不真实
  suspicion: 延迟确认当期支出以少计成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价。……各部门、各单位应当按照国务院财政部门制定的政府收支分类科目和预算编制管理要求，真实、准确、完整地反映各项收支。\"\n\
    \  },\n  {\n    \"法规名称\": \"政府会计准则——基本准则\",\n    \"法规文号\": \"财政部令第78号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\"\
    ,\n"
- expression: (应付账款科目余额.验收确认日期 == true || 原始凭证.工程进度报告 >= 应付账款科目余额.合同约定付款节点) && (应付账款科目余额.合同总价 - 应付账款科目余额.已付金额 > 应付账款科目余额.应付账款科目余额)
  description: 根据合同约定，工程项目已达到特定进度（如主体封顶、竣工验收），单位已实质性获得或接受资产，理应按权责发生制确认负债。但账面记录的应付账款却远小于按合同应付未付的金额，差额即为被隐瞒的负债。重点审查已完工程项目的资金缺口，判断是否存在负债低估。
  audit_item: 决算报表内容不真实
  suspicion: 隐瞒工程款导致少计负债
  regulation: "[\n  {\n    \"法规名称\": \"政府会计准则——基本准则\",\n    \"法规文号\": \"财政部令第78号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十一条\",\n    \"内容概述\": \"负债是指政府会计主体过去的经济业务或者事项形成的，预期会导致经济资源流出政府会计主体的现时义务。符合负债定义和确认条件的，应当列入资产负债表。\"\n  },\n  {\n \
    \   \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第十七条\",\n    \"\
    内容概述\": \"各部门"
- expression: 支出科目明细表.费用科目 NOT IN ('住宿费','伙食费','场地及设备租赁费','讲课费','培训资料费','交通费','其他培训相关费用') OR 发票品名报销原始凭证.发票品名 REGEXP '礼品|餐饮|旅游|办公设备|纪念品|会议服务'
    OR (日程安排详情安排文件.日程安排详情 IS NULL AND 支出科目明细表.金额 > 0)
  description: 支出科目超出《培训费管理办法》规定的开支范围；或发票品名出现明显与培训无关的关键词；或培训日程安排空白却发生大额支出，均表明存在超范围列支、混入非培训费用的嫌疑。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 超范围列支培训费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关培训费管理办法\",\n    \"法规文号\": \"财行〔2016〕540号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条\",\n    \"内容概述\": \"明确培训费开支范围为住宿费、伙食费、培训场地费、讲课费、培训资料费、交通费和其他费用，严禁在培训费中列支与培训无关的费用。\"\n  }\n]"
- expression: 明细表.金额 > 0 && (COALESCE(签到表.实际签到人数,0) < 统计表.人数 * 0.3 OR 核查表.异常特征标记（四要件缺失、笔迹雷同、场地矛盾等） == 1) && (明细表.收款方户名 !=
    原始凭证.合同供应商 OR 明细表.收款方户名 LIKE '%个人%')
  description: 培训项目有支出但实际签到人数严重不足（低于应参训人数的30%），或异常特征表标记为1（如通知、签到、日程、照片四要件缺失），且资金支付对象与合同供应商不一致或支付给个人账户，则高度疑为虚构培训套取资金。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 虚列培训费套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第（一）项\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，责令改正，追回有关财政资金，对单位给予警告或者通报批评，对直接负责的主管人员和其他直接责任人员给予记大过处分。\"\n  }\n]"
- expression: (日记账.现金余额 - 盘点记录.实盘现金余额 < 0 && ABS(差异) > 2000 && 无书面说明) || (银行对账单.借贷方金额转账至个人账户 && 金额 > 50000 && 缺少对应业务合同) ||
    (明细台账.备用金 > 100000 && 长期未冲账且无实际库存现金)
  description: 突击盘点发现现金溢余且无合理解释，可能为公款私存。银行转账至个人账户大额无业务支撑，揭示公款被挪用或私存。备用金余额异常且无法盘实，疑为以备用金名义提取现金私存。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 私存私放财政资金或公款
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"单位和个人违反财务管理的规定，私存私放财政资金或者其他公款的，责令改正，调整有关会计账目，追回私存私放的资金，没收违法所得。对单位处3000元以上5万元以下的罚款；对直接负责的主管人员和其他直接责任人员处2000元以上2万元以下的罚款……\"\
    \n  }\n]"
- expression: 现金支取凭证及审批单.发票 > 0 && (经济合同.合同事项 IS NULL || 现金支取凭证及审批单.验收单) && 明细表.金额 > 20000) || (经济合同.乙方信息 != 行对账单.收款人名称 &&
