name: audit/财务凭证类/签收凭证
type: model
description: 从财务凭证类类文档（签收凭证）中提取结构化元数据。涵盖字段如：发放日期、实发日期、实发金额、工人姓名、收款人姓名、签收人签字、金额。文档范围包括：农民工工资签收凭证、补贴发放签收凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 签收凭证
  member_count: 1
  member_details:
  - 农民工工资签收凭证
  - 补贴发放签收凭证
output:
  fields:
  - name: 发放日期
    type: date
    description: 提取 发放日期 的日期值，格式 YYYY-MM-DD
  - name: 实发日期
    type: date
    description: 提取 实发日期 的日期值，格式 YYYY-MM-DD
  - name: 实发金额
    type: number
    description: 提取 实发金额 的数值（含单位，如万元、吨等）
  - name: 工人姓名
    type: string
    description: 提取 工人姓名 的文本值
  - name: 收款人姓名
    type: number
    description: 提取 收款人姓名 的数值（含单位，如万元、吨等）
  - name: 签收人签字
    type: string
    description: 提取 签收人签字 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
