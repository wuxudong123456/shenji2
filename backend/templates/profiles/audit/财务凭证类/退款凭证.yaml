name: audit/财务凭证类/退款凭证
type: model
description: 从财务凭证类类文档（退款凭证）中提取结构化元数据。涵盖字段如：时间、缴款人、金额。文档范围包括：财政退款凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 退款凭证
  member_count: 1
  member_details:
  - 财政退款凭证
output:
  fields:
  - name: 时间
    type: date
    description: 提取 时间 的日期值，格式 YYYY-MM-DD
  - name: 缴款人
    type: number
    description: 提取 缴款人 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 定向生违约处理台账.应追缴金额 > 定向生违约处理台账.实际追缴金额 AND 定向生违约处理台账.处理状态 != '已全额追缴'
  description: 存在违约行为但未足额追缴培养费用和违约金的，即构成违规；重点关注应追缴金额与实际入库金额差额超过1000元且处理状态长期挂账的情形。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不合规
  suspicion: 订单定向医学生违约后未追缴违约金
  regulation: "[\n  {\n    \"法规名称\": \"关于做好农村订单定向免费培养医学生就业安置和履约管理工作的通知\",\n    \"法规文号\": \"国卫科教发〔2019〕56号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"四、加强违约管理\",\n    \"内容概述\": \"各级卫生健康行政部门要严肃履约管理，对违约人员按规定追缴培养费及违约金，并将违约记录纳入个人诚信档案，确保财政资金安全。\"\
    \n  }\n]"
