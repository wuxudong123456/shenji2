name: audit/财务凭证类/费用凭证
type: model
description: 从财务凭证类类文档（费用凭证）中提取结构化元数据。涵盖字段如：付款单位、实际发生费用、报销凭证真实性、收款单位、费用摘要、金额。文档范围包括：下属单位相关费用凭证、关联单位相关费用凭证、农村学校教师培训项目费用凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 凭证
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 费用凭证
  member_count: 1
  member_details:
  - 下属单位相关费用凭证
  - 关联单位相关费用凭证
  - 农村学校教师培训项目费用凭证
output:
  fields:
  - name: 付款单位
    type: number
    description: 提取 付款单位 的数值（含单位，如万元、吨等）
  - name: 实际发生费用
    type: number
    description: 提取 实际发生费用 的数值（含单位，如万元、吨等）
  - name: 报销凭证真实性
    type: string
    description: 提取 报销凭证真实性 的文本值
  - name: 收款单位
    type: number
    description: 提取 收款单位 的数值（含单位，如万元、吨等）
  - name: 费用摘要
    type: number
    description: 提取 费用摘要 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 车辆费用汇总表.实际使用单位 = '本单位' AND (费用分摊协议.协议存在性 = '否' OR 费用凭证.付款单位 = '下属单位' AND 费用凭证.费用摘要 LIKE '%车辆%' AND 费用分摊统计表.费用转出单位
    = '下属单位' AND 费用分摊统计表.转入单位 = '本单位' AND 费用分摊统计表.分摊金额 > 0)
  description: 下属单位账上列支的车辆费用，实际用于本单位，且不存在合规分摊协议，或者本单位收到下属单位转入的车辆费用分摊，表明存在费用转嫁。
  audit_item: 未按规定编制和执行公务用车购置和运行费预算
  suspicion: 向外单位或下属单位转嫁公务用车费用
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"党政机关不得以任何方式换用、借用、占用下属单位或者其他单位的车辆，不得接受企事业单位和个人赠送的车辆，不得向下属单位摊派、报销公务用车费用。\"\n  },\n  {\n   \
    \ \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号（2020年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第七十条\"\
    ,\n  "
