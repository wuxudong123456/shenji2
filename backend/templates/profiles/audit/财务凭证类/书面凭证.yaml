name: audit/财务凭证类/书面凭证
type: model
description: 从财务凭证类类文档（书面凭证）中提取结构化元数据。涵盖字段如：分摊事由、分摊金额、接收单位。文档范围包括：接待费用分摊或转嫁的书面凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 书面凭证
  member_count: 1
  member_details:
  - 接待费用分摊或转嫁的书面凭证
output:
  fields:
  - name: 分摊事由
    type: string
    description: 提取 分摊事由 的文本值
  - name: 分摊金额
    type: number
    description: 提取 分摊金额 的数值（含单位，如万元、吨等）
  - name: 接收单位
    type: string
    description: 提取 接收单位 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (付款方 != 本接待单位) || (收款方 == 本单位 && 转账事由 IN ('赞助','协作','接待') && 付款方 IN (下级,关联单位)) || (费用承担条款 LIKE '%第三方%' AND 费用承担条款
    NOT LIKE '%明确依据%')
  description: 判定逻辑：1.本应由本单位承担的接待费用，其付款记录显示由其他单位支付；2.存在下级或关联企业以“赞助费”、“协作费”等名义向本单位划转资金，且资金额度与某次接待费用吻合；3.签订的接待合同中，无故约定由第三方支付费用。满足任一条件，均表示存在费用转嫁行为。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 向关联单位转嫁接待费用
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规制度\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"党政机关应当严格执行国内公务接待标准，不得向下级单位及其他单位、企业、个人转嫁接待费用。\"\n  },\n  {\n    \"法规名称\": \"党政机关外宾接待管理办法\"\
    ,\n    \"法规文号\": \"财行〔2013〕533号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\": \"各单位应当严格执行外宾接待经费预算，不"
