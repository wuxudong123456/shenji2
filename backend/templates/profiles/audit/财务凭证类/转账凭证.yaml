name: audit/财务凭证类/转账凭证
type: model
description: 从财务凭证类类文档（转账凭证）中提取结构化元数据。涵盖字段如：交易时间、付款人账户、付款方户名、对方户名、对方账户名称、开户行、收款人账户、收款人账户名称。文档范围包括：银行转账凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 转账凭证
  member_count: 1
  member_details:
  - 银行转账凭证
output:
  fields:
  - name: 交易时间
    type: date
    description: 提取 交易时间 的日期值，格式 YYYY-MM-DD
  - name: 付款人账户
    type: number
    description: 提取 付款人账户 的数值（含单位，如万元、吨等）
  - name: 付款方户名
    type: number
    description: 提取 付款方户名 的数值（含单位，如万元、吨等）
  - name: 对方户名
    type: string
    description: 提取 对方户名 的文本值
  - name: 对方账户名称
    type: string
    description: 提取 对方账户名称 的文本值
  - name: 开户行
    type: string
    description: 提取 开户行 的文本值
  - name: 收款人账户
    type: number
    description: 提取 收款人账户 的数值（含单位，如万元、吨等）
  - name: 收款人账户名称
    type: number
    description: 提取 收款人账户名称 的数值（含单位，如万元、吨等）
  - name: 收款方户名
    type: number
    description: 提取 收款方户名 的数值（含单位，如万元、吨等）
  - name: 收款方账号
    type: number
    description: 提取 收款方账号 的数值（含单位，如万元、吨等）
  - name: 收款账号
    type: number
    description: 提取 收款账号 的数值（含单位，如万元、吨等）
  - name: 收款账户名称
    type: number
    description: 提取 收款账户名称 的数值（含单位，如万元、吨等）
  - name: 账号
    type: string
    description: 提取 账号 的文本值
  - name: 转账时间
    type: date
    description: 提取 转账时间 的日期值，格式 YYYY-MM-DD
  - name: 转账金额
    type: number
    description: 提取 转账金额 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 姓名、身份证号、是否参加培训.身份证号 NOT IN (姓名、身份证号、生存状态、户籍地址、姓名、户籍状态、迁出/死亡日期.身份证号) || 姓名、身份证号、生存状态、户籍地址、姓名、户籍状态、迁出/死亡日期.生存状态
    == '死亡' || 姓名、身份证号、是否参加培训.身份证号 NOT IN (姓名、缴纳月份、缴费基数、缴纳人身份证号、累计缴纳月数、身份证号、参保单位、缴费起止年月、实际缴费基数、单位缴纳部分金额、参保状态、首次参保日期、参保职工名单、缴费期间、参保单位名称、缴费起止时间、缴费单位、个人身份、人员身份、单位统一信用代码、人员身份证号、险种、缴费起止日期.身份证号)
    || 姓名
  description: 通过与公安、社保系统数据强制比对，筛选出身份无效、已死亡、无社保参保记录或参保单位与申报单位不一致的申领人；同时对同一身份证号在不同单位同期重复申领进行排查，任一条件满足即判为疑点。
  audit_item: 虚列就业补助资金支出
  suspicion: 虚构就业人员名单骗取补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十一条\",\n    \"内容概述\": \"各地要建立科学规范的资金使用管理机制，严格按范围、标准和程序使用资金，加强监督检查，对虚报冒领等行为依法追责。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有虚报冒领、骗"
- expression: （收款方为企业法人代表个人账户） || （补贴资金到账后30天内同一企业支付给分析表.是否关联方转账凭证.金额 >= 到账金额 * 0.9） || （收款方与申报单位不一致 且 无代收代付授权协议） || （同一地区多家不同申报单位的最终收款方指向同一账户）
  description: 追踪补贴资金末端流向，若发现直接汇入个人账户、短期大额转付给关联方、多家单位资金归集至同一账户等异常回流的特征，即触犯疑点。
  audit_item: 虚列就业补助资金支出
  suspicion: 截留挪用补贴资金转入关联方
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"就业补助资金必须专款专用，任何单位和个人不得截留、挤占、挪用，严禁通过虚假支付、资金回流等方式侵占。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"截留、挪用财政专项资金尚未构成犯罪的，予以追"
- expression: (提取人姓名.购房合同编号 != 核查证明.购房合同编号 || 提取人姓名.婚姻证明编号 != 核查证明.登记日期 || 核查证明.交易状态 = '无效' || 核查证明.婚姻状态 != 提取人姓名.婚姻证明编号)
    && (比对表.提取次数 > 1 || 转账凭证.对方账户名称 != 对方户名 || (分析表.购房所在地 != 分析表.提取人工作地 && 购房所在地 != 户籍地))
  description: 申请材料编号与权威部门核查结果不一致为直接造假标志；若同时满足同一房产多人提取、资金未进入交易方账户或异地购房与工作地、户籍地均无关联等异常特征，则判定为个人利用虚假材料违规提取。阈值为同一房产提取次数>1即触发，异地购房需三地不匹配。
  audit_item: 违规提取住房公积金
  suspicion: 个人使用虚假购房或婚姻证明骗取公积金提取
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十四条、第五十一条\",\n    \"内容概述\": \"第二十四条明确职工可提取住房公积金的七类情形，必须基于真实住房消费；第五十一条规定以欺骗手段提取住房公积金的，责令限期退回，可处罚款，构成犯罪的依法追究刑事责任。\"\n\
    \  }\n]"
- expression: 中介机构关联记录.关联提取申请编号 > 3 && (同一代办人出现次数 >= 3 || 同一联系电话出现次数 >= 3 || 同一IP地址申请数 >= 5) && (转账凭证.收款账户名称 || 资金存在向中介账户转账记录
    || 提取人账户有明确手续费扣减特征)
  description: 同一中介机构或代办人关联多起提取案例，配合使用重复联系方式、IP地址，且资金流中出现非本人收款或向中介机构分账迹象，即可认定为中介机构组织或参与团伙骗提。关联次数阈值设为3起，电话号码和代办人次阈值3次，IP达到5次。
  audit_item: 违规提取住房公积金
  suspicion: 中介机构协助多人伪造材料骗取公积金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第五十一条\",\n    \"内容概述\": \"以欺骗手段提取住房公积金的，由住房公积金管理中心责令限期退回所提取款项，并处以罚款；构成犯罪的，依法追究刑事责任。中介机构协助骗提属于共同违法，应予查处。\"\n  },\n  {\n\
    \    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二百八十条\",\n \
    \   \"内容概"
- expression: (操作.操作类型 = '修改缴存年限' || '修改账户状态' || '删除审批记录') && (操作.操作时间 ∈ 非工作时段) || (记录表.经办人审批通过率 > 全体经办人平均通过率 * 1.5 && 同一经办人关联案例投诉率
    > 20%) || (转账凭证.对方户名 含 提取申请人账户 || 对方户名 含 已知中介账户 && 转账凭证.金额 > 1000)
  description: 内部员工非工作时段系统敏感操作、经办人审批通过率畸高且相关投诉率异常，或经办人银行账户与提取人或中介存在资金往来，均指向经办机构内部参与违规。通过率偏离值设50%以上，投诉率逾20%为异常界限。
  audit_item: 违规提取住房公积金
  suspicion: 经办人员利用职权帮助违规提取公积金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"住房公积金管理中心工作人员玩忽职守、滥用职权、徇私舞弊的，依法给予行政处分；构成犯罪的，依法追究刑事责任。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国刑法\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三百八十三条、第三百八十五条\",\n    \"内容概述\": \"国家工作人员利用职务"
