name: audit/财务凭证类/收支凭证
type: model
description: 从财务凭证类类文档（收支凭证）中提取结构化元数据。涵盖字段如：人工支出、利润分配记录、总收入、材料采购支出、缴费收据金额、运营支出。文档范围包括：农村公益性公墓财务收支凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 采购
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 收支凭证
  member_count: 1
  member_details:
  - 农村公益性公墓财务收支凭证
output:
  fields:
  - name: 人工支出
    type: number
    description: 提取 人工支出 的数值（含单位，如万元、吨等）
  - name: 利润分配记录
    type: string
    description: 提取 利润分配记录 的文本值
  - name: 总收入
    type: number
    description: 提取 总收入 的数值（含单位，如万元、吨等）
  - name: 材料采购支出
    type: number
    description: 提取 材料采购支出 的数值（含单位，如万元、吨等）
  - name: 缴费收据金额
    type: number
    description: 提取 缴费收据金额 的数值（含单位，如万元、吨等）
  - name: 运营支出
    type: number
    description: 提取 运营支出 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (SUM(实际收费记录.实际穴位费,实际收费记录.实际管理费,实际收费记录.实际其他收费项目) > SUM(批复文件.穴位费单价上限,批复文件.管理费单价上限)) || ( (收支凭证.总收入 - 收支凭证.运营支出)
    / 收支凭证.运营支出 > 0.1 )
  description: 当实际各项收费总和超过物价部门批复的最高标准，或根据财务凭证计算的成本利润率超过10%（非营利组织通常控制在5%以内，10%为异常阈值）时，判定存在以公益性名义违规营利的疑点。
  audit_item: 农村公益性殡葬政策未有效落实
  suspicion: 农村公益性公墓违规营利性收费
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推动殡葬改革促进殡葬事业发展的指导意见\",\n    \"法规文号\": \"民发〔2018〕5号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第（六）条\",\n    \"内容概述\": \"加强农村公益性墓地建设管理，坚持公益性，不以营利为目的。收费标准由物价部门会同民政部门合理核定，不得随意提价或变相收费。\"\n  }\n]"
- expression: (实际收费记录.实际穴位费 > 批准收费标准（穴位费、管理费、维护费上限）.穴位费单价上限) || (实际收费记录.实际管理费 > 批准收费标准（穴位费、管理费、维护费上限）.管理费单价上限) || (实际收费记录.实际其他收费项目
    != 批准收费标准（穴位费、管理费、维护费上限）.收费标准内容)
  description: 当核定的穴位费、管理费单价超出批复标准，或额外增设批复之外的项目（如维护基金、绿化费等）进行收费，即触发加价收费疑点。
  audit_item: 农村公益性殡葬政策未有效落实
  suspicion: 加价收取公墓穴位费和管理费
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推动殡葬改革促进殡葬事业发展的指导意见\",\n    \"法规文号\": \"民发〔2018〕5号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第（六）条\",\n    \"内容概述\": \"农村公益性公墓价格实行政府定价或政府指导价，严格按核定标准执行，不得擅自设立收费项目、提高收费标准。\"\n  }\n]"
