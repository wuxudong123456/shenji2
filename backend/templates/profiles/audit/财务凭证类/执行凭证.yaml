name: audit/财务凭证类/执行凭证
type: model
description: 从财务凭证类类文档（执行凭证）中提取结构化元数据。涵盖字段如：分时电量、实际执行单价、应发补贴金额、用户名称、用户应享受补贴电量、用户编号、用电类别、用电量。文档范围包括：执行凭证、电价执行凭证、电费执行凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 补贴
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 执行凭证
  member_count: 1
  member_details:
  - 执行凭证
  - 电价执行凭证
  - 电费执行凭证
output:
  fields:
  - name: 分时电量
    type: string
    description: 提取 分时电量 的文本值
  - name: 实际执行单价
    type: number
    description: 提取 实际执行单价 的数值（含单位，如万元、吨等）
  - name: 应发补贴金额
    type: number
    description: 提取 应发补贴金额 的数值（含单位，如万元、吨等）
  - name: 用户名称
    type: string
    description: 提取 用户名称 的文本值
  - name: 用户应享受补贴电量
    type: string
    description: 提取 用户应享受补贴电量 的文本值
  - name: 用户编号
    type: string
    description: 提取 用户编号 的文本值
  - name: 用电类别
    type: string
    description: 提取 用电类别 的文本值
  - name: 用电量
    type: string
    description: 提取 用电量 的文本值
  - name: 电价代码
    type: string
    description: 提取 电价代码 的文本值
  - name: 目录电价
    type: string
    description: 提取 目录电价 的文本值
  - name: 计费方式
    type: number
    description: 提取 计费方式 的数值（含单位，如万元、吨等）
  - name: 计量点电价
    type: string
    description: 提取 计量点电价 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (用户编号.用电类别 = '农业生产用电' && 用户编号.月均用电量 > 同类型农业用户均值的3倍) && (设施清单.额定功率 / 总设备功率 > 0.3)
  description: 月用电量显著超过同类纯农业生产用电户（超出3倍标准差），且现场核查发现存在冷链加工、商业办公等高耗能非农设备，未按规定分表计量，可能将高价电转嫁为农业电价。
  audit_item: 相关支持政策落实不到位
  suspicion: 高耗能农业设施违规全额享受农业电价
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"对包含非农业生产用电的混合用电，应分表计量，按不同电价类别分别计费，不得擅自将非农用电并入农业电价收取。\"\n  }\n]"
- expression: (分类清单.用电类别 != '农业生产用电' AND 分类清单.行业分类 IN ('农业','林业','畜牧业','渔业','农产品初加工','灌溉服务')) OR (执行凭证.电价代码 != 农业生产电价标准、适用范围.农业生产电价标准
    && 执行凭证.实际执行单价 IN (统计表.农业用户数))
  description: 依据《销售电价分类适用范围》文件，农业用电含种植、养殖、灌溉等，若用户行业属于农业但用电类别被错划为“一般工商业”或“大工业”等，则未享受政策电价。通过比对用户行业属性与实际执行电价代码即可定位。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业用电户未执行农业生产电价
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条第（二）款\",\n    \"内容概述\": \"农业生产用电是指农村、农场、林场、牧场、渔场等用电，以及农业排灌、农业服务业中的农产品初加工用电，应执行农业生产电价。\"\n \
    \ }\n]"
- expression: (发放记录.实际到账金额 < 执行凭证.应发补贴金额 * 0.99) OR (明细表.差异率 > 5% AND 发放记录.发放时间距离应发周期截止日 > 15天) OR (发放记录.收款账户 NOT IN 执行凭证.对应农户/企业账户)
  description: 实发金额低于应发金额的99%视为未足额发放；差异率超过5%且延迟发放超过15天为严重违规；补贴资金转入非申报主体的账户涉嫌截留挪用。涉及多个月份可累计计算，差异金额绝对值超1000元即需核实。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业电价补贴资金未足额发放或截留
  regulation: "[\n  {\n    \"法规名称\": \"关于做好农业生产用电价格政策落实工作的通知\",\n    \"法规文号\": \"发改价格〔2021〕XXX号（假设存在）\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各地要确保农业用电补贴资金及时足额兑付，不得挤占、截留、挪用，补贴发放周期原则上按月或按季度执行。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"各级政府支出必须按照预算执行，不得"
