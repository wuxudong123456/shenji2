name: audit/财务凭证类/住宿凭证
type: model
description: 从财务凭证类类文档（住宿凭证）中提取结构化元数据。涵盖字段如：住宿日期、住宿酒店名称、住宿金额、出差人、目的地。文档范围包括：出差定点住宿凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 差旅
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 住宿凭证
  member_count: 1
  member_details:
  - 出差定点住宿凭证
output:
  fields:
  - name: 住宿日期
    type: date
    description: 提取 住宿日期 的日期值，格式 YYYY-MM-DD
  - name: 住宿酒店名称
    type: string
    description: 提取 住宿酒店名称 的文本值
  - name: 住宿金额
    type: number
    description: 提取 住宿金额 的数值（含单位，如万元、吨等）
  - name: 出差人
    type: string
    description: 提取 出差人 的文本值
  - name: 目的地
    type: string
    description: 提取 目的地 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
