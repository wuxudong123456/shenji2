name: audit/财务凭证类/归集凭证
type: model
description: 从财务凭证类类文档（归集凭证）中提取结构化元数据。涵盖字段如：人员姓名、岗位、工资分摊金额、设备采购合同及用途说明。文档范围包括：研发费用归集凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 人员
- 合同
- 薪酬
- 采购
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 归集凭证
  member_count: 1
  member_details:
  - 研发费用归集凭证
output:
  fields:
  - name: 人员姓名
    type: string
    description: 提取 人员姓名 的文本值
  - name: 岗位
    type: string
    description: 提取 岗位 的文本值
  - name: 工资分摊金额
    type: number
    description: 提取 工资分摊金额 的数值（含单位，如万元、吨等）
  - name: 设备采购合同及用途说明
    type: string
    description: 提取 设备采购合同及用途说明 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (统计台账.项目月度实际研发人数 - 考勤记录.研发人员实际出勤天数) / 统计台账.项目月度实际研发人数 > 0.3 || (工时分摊比例与合同岗位不符) || (设备采购无研发关联性)
  description: 若申报研发人数与实际到岗人数偏差超过30%，或研发人员工时记录与工资分摊计算表不勾稽，或采购的设备与研发方向无实质性关联，即判定存在虚报。该表达式基于人数偏离度和费用归集真实性的组合条件。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 虚报研发费用数据造假
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局 科技部关于完善研究开发费用税前加计扣除政策的通知\",\n    \"法规文号\": \"财税〔2015〕119号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"三（一）\",\n    \"内容概述\": \"企业应按照财务会计制度要求，对研发支出进行会计处理；对研发费用和生产经营费用划分不清的，不得实行加计扣除。\"\n  },\n \
    \ {\n    \"法规名称\": \"中华人民共和国统计法\",\n    \"法规文号\": \"主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七条\",\n    \"内容概述\"\
    : \"国"
