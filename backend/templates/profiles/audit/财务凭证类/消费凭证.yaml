name: audit/财务凭证类/消费凭证
type: model
description: 从财务凭证类类文档（消费凭证）中提取结构化元数据。涵盖字段如：消费地点、消费日期、消费项目、金额。文档范围包括：风景名胜区消费凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 消费凭证
  member_count: 1
  member_details:
  - 风景名胜区消费凭证
output:
  fields:
  - name: 消费地点
    type: number
    description: 提取 消费地点 的数值（含单位，如万元、吨等）
  - name: 消费日期
    type: date
    description: 提取 消费日期 的日期值，格式 YYYY-MM-DD
  - name: 消费项目
    type: number
    description: 提取 消费项目 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (通知文件.通知地点 包含于 风景名胜区名录 OR 通知文件.通知地点 != 单位驻地城市) && (报销凭证.目的地城市 = 通知文件.通知地点) && (会议议程.实际举办时间 < 报销凭证.往返时间 * 0.5
    OR 消费凭证.金额 > 0)
  description: 将会议地点与《关于严禁党政机关到风景名胜区开会的通知》所列名录进行匹配，或与单位驻地城市比对。若会议地点在景区名录内或非驻地城市，且存在以下情形之一：1）会议议程中实际开会时间不足差旅总天数的50%（即大部分时间为游览）；2）出现景区门票、游览车等消费凭证，则判定违规。
  audit_item: 未按规定举办会议
  suspicion: 在驻地外或风景名胜区违规举办会议
  regulation: "[\n  {\n    \"法规名称\": \"关于严禁党政机关到风景名胜区开会的通知\",\n    \"法规文号\": \"厅字〔2014〕50号\",\n    \"效力级别\": \"党内法规\",\n \
    \   \"条款号\": \"第一条\",\n    \"内容概述\": \"各级党政机关一律不得到八达岭－十三陵、承德避暑山庄外八庙、五台山、太湖、普陀山、黄山、九华山、武夷山、庐山、泰山、嵩山、武当山、武陵源（张家界）、白云山、桂林漓江、三亚热带海滨、峨眉山－乐山大佛、九寨沟－黄龙、黄果树、西双版纳、天山天池等21个风景名胜区召开会议。\"\
    \n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文"
