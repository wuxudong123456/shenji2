name: audit/财务凭证类/入账凭证
type: model
description: 从财务凭证类类文档（入账凭证）中提取结构化元数据。涵盖字段如：交易日期、付款时间、入账日期、入账科目、入账金额、对应票据号码、承租人、捐赠收入凭证。文档范围包括：向企业收取费用的入账凭证、收益入账凭证、财务入账凭证、财政部门非税收入专户入账凭证、银行账户入账凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 凭证
- 资产
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 入账凭证
  member_count: 1
  member_details:
  - 向企业收取费用的入账凭证
  - 收益入账凭证
  - 财务入账凭证
  - 财政部门非税收入专户入账凭证
  - 银行账户入账凭证
output:
  fields:
  - name: 交易日期
    type: date
    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 付款时间
    type: date
    description: 提取 付款时间 的日期值，格式 YYYY-MM-DD
  - name: 入账日期
    type: date
    description: 提取 入账日期 的日期值，格式 YYYY-MM-DD
  - name: 入账科目
    type: string
    description: 提取 入账科目 的文本值
  - name: 入账金额
    type: number
    description: 提取 入账金额 的数值（含单位，如万元、吨等）
  - name: 对应票据号码
    type: string
    description: 提取 对应票据号码 的文本值
  - name: 承租人
    type: string
    description: 提取 承租人 的文本值
  - name: 捐赠收入凭证
    type: number
    description: 提取 捐赠收入凭证 的数值（含单位，如万元、吨等）
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 收款单位
    type: number
    description: 提取 收款单位 的数值（含单位，如万元、吨等）
  - name: 收款账户
    type: number
    description: 提取 收款账户 的数值（含单位，如万元、吨等）
  - name: 收费项目名称
    type: number
    description: 提取 收费项目名称 的数值（含单位，如万元、吨等）
  - name: 日期
    type: date
    description: 提取 日期 的日期值，格式 YYYY-MM-DD
  - name: 票据编号
    type: string
    description: 提取 票据编号 的文本值
  - name: 租金金额
    type: number
    description: 提取 租金金额 的数值（含单位，如万元、吨等）
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ((价格资料.市场平均年租金 - 管理表.年租金) / 价格资料.市场平均年租金) * 100 > 30
  description: 判定低价承包的逻辑：将合同年租金与周边同类资产市场平均年租金对比，计算偏低比例。公式为(市场均价-合同价)/市场均价*100%。超过30%视为严重偏离市场价格，存在利益输送或恶意低价发包嫌疑，易导致集体收益流失。
  audit_item: 农村集体资产管理不到位
  suspicion: 集体资产承包合同价格显失公允
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国村民委员会组织法\",\n    \"法规文号\": \"主席令第37号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第八条\",\n    \"内容概述\": \"村民委员会应当尊重并支持集体经济组织依法独立进行经济活动的自主权，保障集体经济组织和村民、承包经营户、联户或者合伙的合法财产权和其他合法权益。\"\n  },\n  {\n   \
    \ \"法规名称\": \"关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n\
    \    \"内容概述"
- expression: (台账表.资产名称 NOT IN 入账凭证.资产名称) || (台账表.使用状态 == '被占用' && 明细表.收入项目 无对应资产租金收入)
  description: 判定无理占用的核心逻辑：1）台账记录的经营性或可租用资产，在租赁合同及收益入账记录中不存在，且资产使用状态显示为被他人使用，即为无偿占用。2) 更为直接的判定是结合收益表，若某资产正在被人使用但集体账户从未收到过该笔租金收入，则坐实了无偿侵占。
  audit_item: 农村集体资产管理不到位
  suspicion: 集体资产被个人无偿占用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第45号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二百六十五条\"\
    ,\n    \"内容概述\": \"集体所有的财产受法律保护，禁止任何组织或者个人侵占、哄抢、私分、破坏。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强农村集体资金资产资源管理的若干意见\",\n   \
    \ \"法规文号\": \"农经发〔2013〕5号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"任何单位和个人不得侵占、平调、挪用集体资产，对于集体资产"
- expression: (分配台账.原接收记录 EXISTS) AND (票据编号.对应票据号码 IS NULL OR 票据编号.对应票据号码 != '公益事业捐赠票据')
  description: 存在捐赠接收记录但未能提供对应的公益事业捐赠票据存根联，或开具的票据非财政部门监制的合规票据，即属违规。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 接受捐赠款物未开具合规捐赠票据
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公益事业捐赠法\",\n    \"法规文号\": \"主席令第19号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"受赠人接受捐赠后，应当向捐赠人出具合法、有效的收据，将受赠财产登记造册，妥善保管。\"\n  },\n  {\n    \"法规名称\": \"公益事业捐赠票据使用管理办法\"\
    ,\n    \"法规文号\": \"财综〔2010〕112号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"公益事业捐赠票据是捐赠人对外捐赠并根据国家有关规定申请捐赠款"
