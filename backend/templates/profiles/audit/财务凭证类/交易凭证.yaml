name: audit/财务凭证类/交易凭证
type: model
description: 从财务凭证类类文档（交易凭证）中提取结构化元数据。涵盖字段如：交易对方、交易对方户名、交易日期、交易金额、产权交易所交易凭证编号、公告期、成交确认书日期、户名。文档范围包括：产权交易凭证、大额交易凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 凭证
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 交易凭证
  member_count: 1
  member_details:
  - 产权交易凭证
  - 大额交易凭证
output:
  fields:
  - name: 交易对方
    type: string
    description: 提取 交易对方 的文本值
  - name: 交易对方户名
    type: string
    description: 提取 交易对方户名 的文本值
  - name: 交易日期
    type: date
    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 产权交易所交易凭证编号
    type: string
    description: 提取 产权交易所交易凭证编号 的文本值
  - name: 公告期
    type: string
    description: 提取 公告期 的文本值
  - name: 成交确认书日期
    type: date
    description: 提取 成交确认书日期 的日期值，格式 YYYY-MM-DD
  - name: 户名
    type: string
    description: 提取 户名 的文本值
  - name: 资金用途
    type: string
    description: 提取 资金用途 的文本值
  - name: 资金用途摘要
    type: string
    description: 提取 资金用途摘要 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (评估范围未包含无形资产 || ABS((实际交易价格-评估价值)/评估价值) > 0.1) && (实际交易价格 < 同期同类资产市场挂牌价 || 交易凭证.公告期 < 20个工作日)
  description: 该表达式用于筛查国有资产流失风险。成立条件1：评估范围不完整（如漏评专利、商誉）或交易价格与评估价值偏差超过10%；成立条件2：交易价格低于市场价或未满足规定公告期。同时满足即触发高等级预警。
  audit_item: 国有企业重点改革任务推进方面存在的问题
  suspicion: 混合所有制改革中产权未按规定评估定价
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国务院国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n  \
