name: audit/财务凭证类/入库凭证
type: model
description: 从财务凭证类类文档（入库凭证）中提取结构化元数据。涵盖字段如：仓储方信息、仓储记录、入库日期、坐标、客户签收日期、摘要、数量、记账日期。文档范围包括：入库凭证、出入库凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 入库凭证
  member_count: 1
  member_details:
  - 入库凭证
  - 出入库凭证
output:
  fields:
  - name: 仓储方信息
    type: string
    description: 提取 仓储方信息 的文本值
  - name: 仓储记录
    type: string
    description: 提取 仓储记录 的文本值
  - name: 入库日期
    type: date
    description: 提取 入库日期 的日期值，格式 YYYY-MM-DD
  - name: 坐标
    type: string
    description: 提取 坐标 的文本值
  - name: 客户签收日期
    type: date
    description: 提取 客户签收日期 的日期值，格式 YYYY-MM-DD
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 记账日期
    type: date
    description: 提取 记账日期 的日期值，格式 YYYY-MM-DD
  - name: 货物名称
    type: string
    description: 提取 货物名称 的文本值
  - name: 货物流转记录
    type: string
    description: 提取 货物流转记录 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (验收单.验收日期 < 明细账.入库日期) && DATEDIFF(明细账.入库日期, 验收单.验收日期) > 5
  description: 验收单日期早于存货系统或明细账记载的入库日期，且间隔天数超过正常入库流程所需的5个工作日，属于不及时入账。跨月或跨年延迟尤需关注。
  audit_item: 未按规定核算资产
  suspicion: 存货验收后跨期延迟入账
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第76号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"企业对于已经发生的交易或者事项，应当及时进行会计确认、计量和报告，不得提前或者延后。\"\n  }\n]"
