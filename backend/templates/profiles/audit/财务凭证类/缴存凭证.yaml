name: audit/财务凭证类/缴存凭证
type: model
description: 从财务凭证类类文档（缴存凭证）中提取结构化元数据。涵盖字段如：缴存日期、缴存账号、缴款人、缴款账户、缴款金额、金额。文档范围包括：银行缴存凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 缴存凭证
  member_count: 1
  member_details:
  - 银行缴存凭证
output:
  fields:
  - name: 缴存日期
    type: date
    description: 提取 缴存日期 的日期值，格式 YYYY-MM-DD
  - name: 缴存账号
    type: string
    description: 提取 缴存账号 的文本值
  - name: 缴款人
    type: number
    description: 提取 缴款人 的数值（含单位，如万元、吨等）
  - name: 缴款账户
    type: number
    description: 提取 缴款账户 的数值（含单位，如万元、吨等）
  - name: 缴款金额
    type: number
    description: 提取 缴款金额 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 收取台账.实收金额 - 缴存凭证.缴款金额 > 0 && 差额 > 5000 OR 台账.实收金额记录为现金收取而银行未体现
  description: 比对租金收取台账记录的实收金额与上缴银行的金额是否一致；若台账记录收取现金但银行缴款记录缺失，或两者差额累计超过5000元，则存在截留或私分嫌疑。结合租户访谈确认实际缴费数额，锁定私分事实。
  audit_item: 挪用或违规使用保障性安居工程专项资金
  suspicion: 截留私分保障房租金收入
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"任何单位和个人不得截留、挤占、挪用公共租赁住房租金收入。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"\
    无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三百八十二条\",\n    \"内容概述\": \"国家工作人员利用职务便利侵吞、窃取、骗取公共财物的，构成贪污罪。\"\n  }\n]"
