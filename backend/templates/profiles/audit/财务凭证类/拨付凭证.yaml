  - 中央及地方财政资金拨付凭证
  - 中央补助资金拨付凭证（文件5）
  - 保费补贴资金拨付凭证
  - 养护资金拨付凭证
  - 农村物流基础设施财政资金拨付凭证
  - 农村饮水安全项目资金拨付凭证
  - 农网改造升级资金拨付凭证
