name: audit/财务凭证类/拨付凭证
type: model
description: 从财务凭证类类文档（拨付凭证）中提取结构化元数据。涵盖字段如：付款方、付款时间、付款金额、入账金额、到账日期、到账时间、到账金额、历年拨付金额。文档范围包括：上级拨付凭证、上级转移支付指标文件或拨付凭证、中央及地方财政资金拨付凭证、中央补助资金拨付凭证（文件5）、保费补贴资金拨付凭证、养护资金拨付凭证、农村物流基础设施财政资金拨付凭证、农村饮水安全项目资金拨付凭证、农网改造升级资金拨付凭证、培训经费拨付凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 培训
- 工程
- 补贴
- 元数据提取
