name: audit/财务凭证类/缴纳凭证
type: model
description: 从财务凭证类类文档（缴纳凭证）中提取结构化元数据。涵盖字段如：保证金实缴金额、单价、实际执行电价、实际补缴记录、是否已享受优惠电价、用水量、用电户号、缴纳日期。文档范围包括：土地出让金缴纳凭证、工资保证金缴纳凭证、新型经营主体用电费用缴纳凭证、水费缴纳凭证、社会保险缴纳凭证、职工社保缴纳凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 缴纳凭证
  member_count: 1
  member_details:
  - 土地出让金缴纳凭证
  - 工资保证金缴纳凭证
  - 新型经营主体用电费用缴纳凭证
  - 水费缴纳凭证
  - 社会保险缴纳凭证
  - 职工社保缴纳凭证
output:
  fields:
  - name: 保证金实缴金额
    type: number
    description: 提取 保证金实缴金额 的数值（含单位，如万元、吨等）
  - name: 单价
    type: number
    description: 提取 单价 的数值（含单位，如万元、吨等）
  - name: 实际执行电价
    type: string
    description: 提取 实际执行电价 的文本值
  - name: 实际补缴记录
    type: string
    description: 提取 实际补缴记录 的文本值
  - name: 是否已享受优惠电价
    type: boolean
    description: 提取 是否已享受优惠电价 的布尔值（是/否）
  - name: 用水量
    type: string
    description: 提取 用水量 的文本值
  - name: 用电户号
    type: string
    description: 提取 用电户号 的文本值
  - name: 缴纳日期
    type: date
    description: 提取 缴纳日期 的日期值，格式 YYYY-MM-DD
  - name: 缴纳金额
    type: number
    description: 提取 缴纳金额 的数值（含单位，如万元、吨等）
  - name: 缴费户名
    type: number
    description: 提取 缴费户名 的数值（含单位，如万元、吨等）
  - name: 缴费月份
    type: number
    description: 提取 缴费月份 的数值（含单位，如万元、吨等）
  - name: 缴费记录
    type: number
    description: 提取 缴费记录 的数值（含单位，如万元、吨等）
  - name: 补缴时间
    type: date
    description: 提取 补缴时间 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (应发工资、实发工资、欠薪月份、欠薪金额.应发工资 - 应发工资、实发工资、欠薪月份、欠薪金额.实发工资) > 0 AND 应发工资、实发工资、欠薪月份、欠薪金额.欠薪月份 >= 1 OR 其他.专户资金余额 < SUM(应发工资、实发工资、欠薪月份、欠薪金额.应发工资
    - 应发工资、实发工资、欠薪月份、欠薪金额.实发工资)
  description: 将劳动合同约定或计薪周期应发工资金额与实际银行流水发放金额进行比对，差额大于零且拖欠超过1个月即触发违规；若专用账户余额不足以覆盖所有拖欠工资总和，说明资金被挪用或未足额缴存，属严重违规。
  audit_item: 违规收费-拖欠工程款和农民工工资
  suspicion: 施工企业未按规定足额支付农民工工资
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条、第二十八条、第三十条\",\n    \"内容概述\": \"施工总承包单位应当开设农民工工资专用账户，专项用于支付农民工工资；施工总承包单位或分包单位应当与农民工签订劳动合同并进行实名制管理；分包单位拖欠农民工工资的，由施工总承包单位先行清偿。\"\
    \n  }\n]"
- expression: (职工社保欠缴明细表.欠缴金额 > 0 && 职工社保欠缴明细表.欠缴年份 <= 2020) && (历史遗留问题专项处理方案.补缴计划 IS NULL || 职工社保缴纳凭证.金额 < 职工社保欠缴明细表.欠缴金额
    * 0.8)
  description: 改革启动年（假定为2020年）前的社保历史欠费未制定补缴计划，或截至审计日实际补缴到账金额低于欠费总额的80%（不含滞纳金），视为历史遗留问题处理不到位，严重损害职工权益。高风险。
  audit_item: 供销合作社综合改革不合规
  suspicion: 职工社保欠缴未补缴
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第四部分（十六）\",\n    \"内容概述\": \"要求对社有企业职工社会保障等遗留问题积极稳妥加以解决，保障职工合法权益。\"\n  }\n]"
- expression: (实际亩均用水量.实际亩均用水量 > 不同作物亩均用水定额.不同作物亩均用水定额) || (农业取水口向非农业用户供水且无相关许可)
  description: 超过本地区发布的用水定额即违规；若发现农业取水用于工业或生活且未办理变更，同样违规。重点关注连续多年超定额的区域。
  audit_item: 大中型灌区运行管护和取水用水不符合相关规定
  suspicion: 灌区超定额或改变用水性质
  regulation: "[\n  {\n    \"法规名称\": \"取水许可和水资源费征收管理条例\",\n    \"法规文号\": \"国务院令第460号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条、第二十八条\",\n    \"内容概述\": \"取水单位应按照许可的用途和定额取水，不得擅自改变用途或超定额。\"\n  }\n]"
- expression: 用电缴纳凭证.实际执行电价（元/度） > 优惠电价标准（元/度）.优惠电价标准（元/度） * 1.1 || (用地登记表.审批状态（批准/否决/退回）='否决' && 用地登记表.否决原因 NOT LIKE '%规划不符%'
    AND NOT LIKE '%生态红线%') || DATEDIFF(day, 用地登记表.受理日期, 用地登记表.办结日期) > 用地审批承诺时限.用地审批承诺时限 * 1.5
  description: 若新型经营主体实际缴纳电费单价高于当地规定的农业生产用电优惠价的110%，或者设施农业用地申请被无正当理由（如非规划或生态红线等硬性原因）否决，或者用地审批耗时超过规定时限的1.5倍，则视为政策落实不到位。优惠电价标准参照各省一般农业生产用电目录电价。
  audit_item: 新型经营主体支持政策落实不到位
  suspicion: 新型农业经营主体用地用电优惠政策落实不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第一条第（三）项\",\n    \"内容概述\": \"农业生产用电是指蔬菜、果树、养蜂、畜牧、水产等种植、养殖业用电，以及农产品初加工用电，执行农业生产电价，价格显著低于一般工商业及其他用电。\"\n\
    \  },\n  {\n    \"法规名称\": \"关于进一步支持设施农业健康发展的通知\",\n    \"法规文号\": \"国土资发〔2014〕127号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\""
- expression: (明细表.缴费月份 IN 档案.待安排工作起止日期 && 明细表.单位缴费金额 = 0) || (明细表.缴费月份 IN 档案.待安排工作起止日期 && NOT 明细表.人员姓名 IN 缴费凭证.缴费记录)
  description: 退役士兵在待安排工作期间，安置地人民政府或接收单位应为其缴纳基本养老保险和医疗保险，单位缴费部分应全额承担。若待安排工作期间月份对应的社保明细中单位缴费金额为零或根本没有社保记录，即视为未享受社保补贴。
  audit_item: 未按规定落实退役士兵安置政策
  suspicion: 待安排工作期间未缴纳社会保险单位部分
  regulation: "[\n  {\n    \"法规名称\": \"退役士兵安置条例\",\n    \"法规文号\": \"国务院、中央军委令第608号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十八条\",\n    \"内容概述\": \"退役士兵待安排工作期间，安置地人民政府应当按照国家有关规定为其接续基本养老保险、基本医疗保险等社会保险关系，所需经费由安置地人民政府承担。\"\n  }\n]"
- expression: ((出让合同.土地取得方式（划拨/出让） == '划拨') && (存在转让行为) && (缴纳凭证.缴纳金额 IS NULL || 缴纳凭证.缴纳金额 == 0)) || ((信息表.权利性质 == '出让') &&
    (批复文件.批复文号 IS NULL))
  description: 划拨土地使用权发生转让，必须经政府批准并补缴土地出让金转为出让性质。若取得方式为划拨但已发生转让却无出让金补缴记录，或不动产登记簿显示权利性质为出让但无对应的政府批复文件，均视为违规改变土地性质。触发条件为划拨地转让未补缴出让金或出让性质无合法审批来源。
  audit_item: 未经批准改变土地用途、性质或容积率
  suspicion: 未经批准擅自改变土地权利性质
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城市房地产管理法\",\n    \"法规文号\": \"主席令第18号（2019年修正）\",\n    \"效力级别\": \"法律\",\n  \
    \  \"条款号\": \"第四十条\",\n    \"内容概述\": \"以划拨方式取得土地使用权的，转让房地产时，应当报有批准权的人民政府审批。准予转让的，应当由受让方办理土地使用权出让手续，并依照国家有关规定缴纳土地使用权出让金。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第32号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \""
