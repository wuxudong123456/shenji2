name: audit/财务凭证类/采购凭证
type: model
description: 从财务凭证类类文档（采购凭证）中提取结构化元数据。涵盖字段如：交货日期、投入使用日期、数量、车辆数量、采购品目、采购日期、金额。文档范围包括：垃圾清运车辆采购凭证、设备采购凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 车辆
- 采购
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 采购凭证
  member_count: 1
  member_details:
  - 垃圾清运车辆采购凭证
  - 设备采购凭证
output:
  fields:
  - name: 交货日期
    type: date
    description: 提取 交货日期 的日期值，格式 YYYY-MM-DD
  - name: 投入使用日期
    type: date
    description: 提取 投入使用日期 的日期值，格式 YYYY-MM-DD
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 车辆数量
    type: number
    description: 提取 车辆数量 的数值（含单位，如万元、吨等）
  - name: 采购品目
    type: string
    description: 提取 采购品目 的文本值
  - name: 采购日期
    type: date
    description: 提取 采购日期 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (规划中转站数量.规划中转站数量 - 验收报告.实际建成中转站数量) / 规划中转站数量.规划中转站数量 > 0.2 || (MAX(运处台账.同一村庄清运间隔天数) > 7) || (日报.出勤车辆 < 规划中转站数量.规划中转站数量
    * 0.6)
  description: 建成率低于80%视为进展慢；同一村庄最长清运间隔超过7天视为不能及时清运；出勤车辆低于配置数量60%表明运力不足，致使垃圾随意堆放。满足任一条件即触发疑点。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 村镇垃圾随意丢弃堆放，清运任务进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当加强农村生活垃圾污染环境的防治，组织、指导对生活垃圾的清扫、收集、运输和处理。\"\n  },\n  {\n    \"法规名称\": \"农村人居环境整治提升五年行动方案（2021-2025年）\"\
    ,\n    \"法规文号\": \"厅字〔2021〕44号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、（六）\",\n    \"内容概述\": \"健全"
- expression: (记录表.状态（在用/闲置/破损） = '闲置' AND (SYSDATE - 记录表.配置日期) > 90) || (记录表.状态（在用/闲置/破损） = '破损' AND 维修记录 IS NULL) || (记录表.配置数量
    < 应配数量 * 0.6) || (日报.垃圾桶满溢报警记录 > 10)
  description: 设施闲置超过3个月视为未有效使用；破损无任何维修记录视为管护缺失；实际配置数量低于规划标准60%为严重不足；垃圾桶满溢报警频繁说明设施配置不足或清运不及时。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 垃圾收集设施未配置、闲置或破损
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当加强农村生活垃圾污染环境的防治，组织、指导对生活垃圾的清扫、收集、运输和处理，并统筹规划、合理布局垃圾收集设施。\"\n  }\n]"
