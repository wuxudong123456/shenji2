name: audit/财务凭证类/拨款凭证
type: model
description: 从财务凭证类类文档（拨款凭证）中提取结构化元数据。涵盖字段如：到账日期、收款单位、贴息金额。文档范围包括：拨款凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 拨款凭证
  member_count: 1
  member_details:
  - 拨款凭证
output:
  fields:
  - name: 到账日期
    type: date
    description: 提取 到账日期 的日期值，格式 YYYY-MM-DD
  - name: 收款单位
    type: number
    description: 提取 收款单位 的数值（含单位，如万元、吨等）
  - name: 贴息金额
    type: number
    description: 提取 贴息金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (贷款台账.贴息应享主体 = '是' AND NOT EXISTS (拨款凭证 WHERE 拨款凭证.收款单位 = 贷款台账.对方账户名称 AND 拨款凭证.贴息金额 >= 贷款台账.贷款金额*贷款台账.贷款利率*政策文件.贴息比例*贴息期限))
    OR (拨款凭证.到账日期 - 贷款台账.交易日期 > 政策文件.发放时限要求（如季度后15个工作日内）) OR (指标文件.支出进度/贴息专项预算额度 < 0.5 AND 当前日期 > 预算年度中间时点)
  description: 符合条件的贷款应获得贴息但未收到拨款或收到金额不足，或贴息到账时间远超规定时限（如按季支付已超期1个月），或财政已安排预算但实际支出进度严重滞后，均判定为落实不到位。
  audit_item: 相关支持政策落实不到位
  suspicion: nan
  regulation: "[\n  {\n    \"法规名称\": \"关于财政支持建立现代乡村产业体系的通知\",\n    \"法规文号\": \"财办〔2021〕XX号（假设）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各级财政要足额安排涉农贷款贴息资金，按时兑现贴息政策，任何单位不得截留、挪用或无故拖延拨付。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第五十八条\",\n    \"内容概述\": \"各级政府财政部门应当加强"
