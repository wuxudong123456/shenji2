name: audit/财务凭证类/上缴凭证
type: model
description: 从财务凭证类类文档（上缴凭证）中提取结构化元数据。涵盖字段如：支付日期、收款账户、金额。文档范围包括：国库集中支付系统资金上缴凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 上缴凭证
  member_count: 1
  member_details:
  - 国库集中支付系统资金上缴凭证
output:
  fields:
  - name: 支付日期
    type: date
    description: 提取 支付日期 的日期值，格式 YYYY-MM-DD
  - name: 收款账户
    type: number
    description: 提取 收款账户 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (对照表.实际上缴日期 > 对照表.规定上缴截止日期) && (结余金额 > 0) && (上缴状态 == '已上缴')
  description: 结余资金确认后，单位应在制度规定时限内（如15个工作日内）将资金上缴国库。当实际上缴日期晚于规定截止日期，且上缴凭证显示已上缴时，判定为上缴不及时。若上缴状态为空或未上缴，则合并其他疑点（如未清理、未上报）。
  audit_item: 结余资金管理不规范
  suspicion: 结余资金未及时上缴国库
  regulation: "[\n  {\n    \"法规名称\": \"中央部门财政拨款结转和结余资金管理办法\",\n    \"法规文号\": \"财预〔2015〕82号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十五条\",\n    \"内容概述\": \"经财政部确认的结余资金，中央部门应在收到确认文件后15个工作日内上缴中央国库。\"\n  }\n]"
