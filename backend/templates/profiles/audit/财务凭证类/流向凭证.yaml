name: audit/财务凭证类/流向凭证
type: model
description: 从财务凭证类类文档（流向凭证）中提取结构化元数据。涵盖字段如：实缴出资的付款方及资金路径、收款方账户、资金流向关联方证据。文档范围包括：资金流向凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 流向凭证
  member_count: 1
  member_details:
  - 资金流向凭证
output:
  fields:
  - name: 实缴出资的付款方及资金路径
    type: number
    description: 提取 实缴出资的付款方及资金路径 的数值（含单位，如万元、吨等）
  - name: 收款方账户
    type: number
    description: 提取 收款方账户 的数值（含单位，如万元、吨等）
  - name: 资金流向关联方证据
    type: string
    description: 提取 资金流向关联方证据 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: SELECT 其他.穿透后的最终受益人国籍/注册地, 投资协议.投资项目最终标的公司及业务描述, 代持协议.代持人 FROM 其他 INNER JOIN 投资协议 ON 投资协议.投资项目最终标的公司及业务描述 =
    投资协议.投资标的 WHERE 其他.穿透后的最终受益人国籍/注册地 IN ('外商投资负面清单中限制/禁止的领域对应的投资主体') AND 其他.控制路径 LIKE '%代持%' AND 代持协议.代持人 != 其他.穿透后的最终受益人国籍/注册地
  description: 该表达式专门用于挖掘隐藏的股权代持。当穿透后的最终受益人国籍显示为《外商投资准入特别管理措施（负面清单）》中禁止或限制投资领域的境外主体，且其投资是通过境内企业或个人代持的方式实现的，即代持方与最终受益人不一致，则构成典型的规避外资准入监管的违规行为。
  audit_item: 违规进行重大投资
  suspicion: 违规决策为外资代持限制性文化机构股权
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国外商投资法\",\n    \"法规文号\": \"中华人民共和国主席令第二十六号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十八条\",\n    \"内容概述\": \"外国投资者投资负面清单规定禁止投资的领域，由国务院商务主管部门责令停止投资活动，限期处分股份、资产或者采取其他必要措施，恢复到实施投资前的状态。\"\n  }\n]"
- expression: (资产评估报告.评估基准日 IS NULL) || (资产交易明细表.交易价格 / 资产评估报告.评估价值 < 0.9) || (资产交易明细表.是否关联方 = '是' && 改革决策文件.公示记录 IS NULL)
    || (改革决策文件.改革方案是否经职工代表大会审议 IS NULL)
  description: 无评估报告直接违规；交易价格低于评估价90%视为异常低价；交易对象为管理层亲属等关联方且未披露或未经职工代表大会审议，存在利益输送嫌疑；缺少职工代表大会决议，程序违规。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 社有企业改革过程中资产交易不公开透明导致资产流失
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产评估管理暂行办法\",\n    \"法规文号\": \"国务院国资委令第12号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条、第二十二条\",\n    \"内容概述\": \"企业改制、产权转让等经济行为应当对相关资产进行评估；评估结果作为交易价格的参考依据，交易价格低于评估结果的90%时，应当暂停交易。\"\n  }\n]"
