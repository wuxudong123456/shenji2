name: audit/财务凭证类/完税凭证
type: model
description: 从财务凭证类类文档（完税凭证）中提取结构化元数据。涵盖字段如：入库税款所属期、税种、金额。文档范围包括：完税凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 完税凭证
  member_count: 1
  member_details:
  - 完税凭证
output:
  fields:
  - name: 入库税款所属期
    type: number
    description: 提取 入库税款所属期 的数值（含单位，如万元、吨等）
  - name: 税种
    type: string
    description: 提取 税种 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (城市维护建设税计税依据、税率、应纳税额.城市维护建设税计税依据 != (实际缴纳增值税额、销项税额、视同销售金额、进项税额、进项税额转出额.实际缴纳增值税额 + 实际缴纳消费税额、应税销售额、计税数量、适用税率.实际缴纳消费税额))
    || (城市维护建设税计税依据、税率、应纳税额.应纳税额 < (实际缴纳增值税额、销项税额、视同销售金额、进项税额、进项税额转出额.实际缴纳增值税额 + 实际缴纳消费税额、应税销售额、计税数量、适用税率.实际缴纳消费税额) * 城市维护建设税计税依据、税率、应纳税额.税率)
  description: 城市维护建设税以纳税人实际缴纳的增值税、消费税税额为计税依据。若附加税申报表中的计税依据小于主税种实际缴纳总额，或计算税额低于法定乘积，则存在少缴。适用税率按7%（市区）、5%（县城、镇）、1%（其他）。
  audit_item: 违反税收征管规定的行为
  suspicion: 未按实际缴纳增值税消费税计缴城市维护建设税
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城市维护建设税法\",\n    \"法规文号\": \"主席令第五十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二条\",\n    \"内容概述\": \"城市维护建设税以纳税人依法实际缴纳的增值税、消费税税额为计税依据。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国城市维护建设税法\",\n    \"\
    法规文号\": \"主席令第五十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"城市维护建设税税率如下：纳税人所在地在市区的，税率为百分之七；在县城、镇的，税率为百"
