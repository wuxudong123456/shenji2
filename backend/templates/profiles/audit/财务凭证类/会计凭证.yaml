violations:
- expression: (原始会计凭证.金额 != 记账凭证.借贷金额) || (原始会计凭证.对方单位 != 银行对账单.交易对手) || (原始会计凭证.金额 != 银行对账单.交易金额) || (记账凭证.凭证编号 IN (财务系统操作日志.操作内容
    WHERE 操作类型 == '修改' AND 操作时间 NOT IN 正常工作时间))
  description: 此表达式用于筛查伪造或变造会计凭证的疑点：1）原始凭证金额与记账凭证金额不符，可能为篡改；2）原始凭证的交易对手与银行流水中的交易对手不一致，可能为虚构交易；3）原始凭证金额与银行流水金额不符，可能交易为虚假或金额被变造；4）记账凭证在非工作时段被修改，存在人为篡改风险。满足任一条件即生成疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 伪造变造会计凭证进行虚假核算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号（2017年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条、第四十二条\",\n    \"内容概述\": \"任何单位和个人不得伪造、变造会计凭证、会计帐簿及其他会计资料，不得提供虚假的财务会计报告。伪造、变造会计凭证、会计帐簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\
    \n  }\n]"
- expression: (重大交易合同.货物/服务交付条款 == 无物流单证 || 无交付记录) && (应付账款明细表.账龄 > 360天) || (原始会计凭证.对方单位 IN (关联方交易披露文件.关联方名称 WHERE 关联方交易披露文件.交易内容
    == NULL) && (银行对账单.交易对手 != 原始会计凭证.对方单位))
  description: 筛查虚构交易以虚增收入的疑点：条件一，合同缺乏关键交付证明且形成长期大额应收款（超过360天），可能为虚假销售；条件二，交易对手为未披露的关联方且资金未直接流向对手方，表明交易可能无商业实质。满足任一组合条件即判定为疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 虚构经济业务交易进行虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条、第十六条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者事项为依据进行会计确认、计量和报告，如实反映符合确认和计量要求的各项会计要素及其他相关信息，保证会计信息真实可靠、内容完整。\"\n  }\n\
    ]"
- expression: (原始会计凭证.凭证日期 > 资产负债表.日期) && (记账凭证.贷方科目 LIKE '%负债%') || (银行对账单.借贷标志 == '贷' AND 银行对账单.金额 > 大额阈值 AND 银行对账单.对方户名
    LIKE '%供应商%贷款%') && (税务申报表.扣除项目 NOT INCLUDE 对应负债利息或费用) || (外部审计报告.调整分录 == 补记负债) && (资产负债表.应付账款.期末余额 == 资产负债表.应付账款.期初余额)
  description: 识别隐匿负债疑点：1）将本应属于报表期间的负债凭证记入下一期（截止性差异）；2）银行已收到贷款资金，但账面未见新增负债，且税务申报无相关融资费用扣除（帐外负债）；3）外部审计师已提示需补记负债，但账面未调整；4）应付账款余额长期不变，可能未记账新产生的应付款项。满足任一条件即判定为疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 企业提供虚假财务会计报告隐匿负债
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号（2017年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条、第二十六条\",\n    \"内容概述\": \"会计凭证、会计账簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定。公司、企业进行会计核算不得有下列行为：随意改变资产、负债、所有者权益的确认标准或者计量方法，虚列、多列、不列或者少列资产、负债、所有者权益。\"\
    \n  }\n]"
- expression: ABS(存货名称、账面结存数量.账面结存数量 - 盘点日期.实盘数量) > 0
  description: 当台账记录的账面结存数量与盘点报告中的实盘数量不一致时，排除经审批的合理处置或自然损耗后，差异即为疑点。差异额不为零即触发。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 存货账面数量与实际盘点数量不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证会计账簿记录与实物及款项的实有数额相符。\"\n  }\n]"
- expression: ABS(日记账.账面余额 - 实盘现金余额.库存现金实存金额) > 0
  description: 现金日记账余额与盘点日调整后实存现金不一致，且无有效原始凭证或合理解释，即为账实不符。排除合理找零误差后差异不为零即触发。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 现金日记账余额与实际库存现金不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证会计账簿记录与实物及款项的实有数额相符。\"\n  }\n]"
- expression: 调节表.企业调节后余额 != 调节表.银行调节后余额
  description: 编制银行余额调节表后，若企业调整后余额与银行调整后余额不相等，说明存在记账差错、未达账项不实或挪用资金等情况，即为账实不符疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 银行存款日记账与银行对账单调节后余额不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证会计账簿记录与实物及款项的实有数额相符。\"\n  }\n]"
- expression: ABS(SUM(内部销售收入.内部销售收入) - SUM(收入金额、确认期间.收入金额)) > 明显阈值
  description: 同一期间两个系统的收入总额存在系统性差异，且无法以合理截止性差异解释，提示存在收入未入账或虚构收入风险。通常设定差异率超过5%或绝对金额显著时为疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 业务系统收入与财务系统收入记录不一致
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与有关资料相互核对，保证会计账簿记录的真实、完整。\"\n  }\n]"
- expression: 利润表.营业收入 != (SUM(主营业务收入贷方合计、销售退回借方合计.主营业务收入贷方合计) - SUM(主营业务收入贷方合计、销售退回借方合计.销售退回借方合计))
  description: 利润表营业收入应与收入明细账计算出的净收入一致，如不相等且无合理重分类调整，则疑点成立。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 利润表营业收入与收入明细账合计不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计报表进行核对，保证会计账簿记录与会计报表的有关内容相符。\"\n  }\n]"
- expression: (会计凭证.实际支付日期 - 指标下达日期.指标下达日期) > 规定拨付天数 || (审批文件.签收日期 - 指标下达日期.指标下达日期) > 规定拨付天数
  description: 比较资金拨付各环节时间差是否超过管理办法规定的时限（例如上级规定为30日）。计算指标下达日至实际支付日或最终签收日的自然天数，超过规定阈值即判定为违规。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 转移支付资金未在规定时限内拨付
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府财政部门必须依照法律、行政法规和国务院财政部门的规章，及时、足额地拨付预算支出资金。\"\n  }\n]"
- expression: 确认支出日期、确认支出金额、支付记录与合同、验收的对应关系、项目名称、支出科目、支出金额、收款单位名称、收款单位银行账号.支出科目 IN ('办公费', '人员补贴', '绩效工资') || 确认支出日期、确认支出金额、支付记录与合同、验收的对应关系、项目名称、支出科目、支出金额、收款单位名称、收款单位银行账号.收款单位名称
    IN (机关行政经费收款单位名称、支出科目、支出金额.机关行政经费收款单位名称)
  description: 筛查转移支付资金支出明细中的异常科目（如办公费、人员补贴等行政性支出）或收款方与机关行政经费供应商/发放对象重叠的记录。若存在此类关联，则高度疑似挤占挪用。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 挤占挪用转移支付资金补充机关行政经费
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"违反规定，使用、骗取财政资金，包括截留、挪用财政资金，或擅自改变财政资金用途的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。\"\n  }\n]"
- expression: (明细表.确认支出日期 >= '年末突击期' && 明细表.确认支出金额 > 预警阈值) || (跟踪表.实际使用资金量 / 拨付台账.拨出金额 < 使用率阈值 && 明细表.确认支出日期)
  description: 此表达式分为两种情况：① 年末（如11月、12月）存在大额密集的支出确认行为，但项目实际工程进度并未同步；② 资金拨付至下级单位账户后，长期（如超过一个季度）实际使用率低于50%，但上级已确认为支出。预警阈值可设为项目平均月度支出额的3倍以上，使用率阈值设为50%。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 为完成预算进度以拨代支转移支付资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十条\",\n    \"内容概述\": \"各级政府财政部门应当在本级预算经批准后，及时批复各部门预算。各部门、各单位应当按照规定的支出用途使用资金，不得虚列支出、转移或者套取预算资金。\"\n  }\n]"
- expression: (合同协议.合同金额 != 实施主体.预算金额 || 发票金额 != 合同协议.合同金额) || (会计凭证.最终收款方名称及账号 != 合同协议.中标方/承包商名称) || 合同协议.验收工程量 > 实际工程量 ||
    项目申报主体无实际运营
  description: 通过多单匹配检查资金支付与业务支撑材料的逻辑一致性。任何金额、主体、工程量不符的情况，或资金最终流向与合同方无关的第三方（特别是关联方或个人账户），均视为骗取、套取资金的疑点。'实际工程量'需通过现场勘查核实。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 虚构项目或虚增工程量骗取转移支付资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"单位和个人有虚报、冒领等手段骗取财政资金的行为的，责令改正，调整有关会计账目，追回违反规定使用、骗取的有关资金，给予警告，没收违法所得。\"\n  }\n]"
- expression: 收费项目明细台账.收费项目名称 IN ['房屋转让手续费','地质成果资料费','河道工程修建维护管理费','河道采砂管理费','测绘成果成图资料费'] && 收费项目明细台账.收费日期 >= '对应政策取消生效日期'
  description: 根据财税〔2017〕20号、发改价格〔2018〕370号等文件，上述收费项目已被明令取消或停征。表达式以收费项目名称匹配国家公布取消清单，且收费日期晚于或等于政策生效日期，即可判定为违规征收。具体取消生效日期视不同项目分别设定，如房屋转让手续费自2017年4月1日起取消。需注意地方试点或特殊豁免情形应单独排除。
  audit_item: 违规收费-违规征收国家已取消或停征的行政事业性收费
  suspicion: 违规征收国家已取消或停征的行政事业性收费
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家发展改革委关于清理规范一批行政事业性收费有关政策的通知\",\n    \"法规文号\": \"财税〔2017〕20号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"全文，尤其附件《取消或停征的行政事业性收费项目》\",\n    \"内容概述\": \"自2017年4月1日起，取消或停征41项中央设立的行政事业性收费，将房屋转让手续费、地质成果资料费等列为取消项目，相关部门和单位不得以任何理由拖延或拒绝执行，不得以其他名目变相继续收费。\"\
    \n  }\n]"
- expression: IF ( (补助台账.补助类型 = "与资产相关" OR 批文.补助用途 LIKE "%购建%") AND (ABS(本期发生额、补助来源.本期发生额 - 补助台账.补助金额) < 0.01) AND (递延收益科目本期贷方发生额.递延收益科目本期贷方发生额
    = 0 OR 递延收益科目本期贷方发生额.无此笔补助记录) ) THEN 疑点；ELSE IF (批文.款项分期确认 = "是" AND 补助台账.本期确认收益金额 = 补助台账.补助全额 AND 批文.期数 > 1) THEN 疑点
  description: 当补助批文明示用途为购建长期资产或台账分类为与资产相关时，企业应将补助款确认为递延收益并分期摊销；若企业当期直接将全额补助计入其他收益或营业外收入，且递延收益科目未记录该补助，则违规。此外，如果批文规定按项目进度分期确认收益，但企业一次性全额确认，也属违规。
  audit_item: 未按规定核算政府补助
  suspicion: 将资本性或跨期补助全额确认当期收益
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第16号——政府补助\",\n    \"法规文号\": \"财会[2017]15号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条、第八条\",\n    \"内容概述\": \"与资产相关的政府补助，应当冲减相关资产的账面价值或确认为递延收益，在相关资产使用寿命内分期计入损益；与收益相关的政府补助用于补偿企业以后期间的相关成本费用或损失的，应确认为递延收益，并在确认相关成本费用或损失的期间计入当期损益或冲减相关成本。\"\
    \n  }\n]"
- expression: ((补助事由（灾害救助、奖励、研发等）.补助用途 LIKE '%建设%' OR '%设备%' OR '%购建%') AND 补助事由（灾害救助、奖励、研发等）.补助类型（与资产/收益相关） = '与收益相关' AND
    日记账.发生额 / 补助事由（灾害救助、奖励、研发等）.补助金额 > 0.5) OR ((补助事由（灾害救助、奖励、研发等）.补助用途 LIKE '%稳岗%' OR '%薪酬%' OR '%补偿日常成本%') AND 补助事由（灾害救助、奖励、研发等）.补助类型（与资产/收益相关）
    = '与资产相关' AND 会计凭证.贷方科目 > 0)
  description: 如果补助批文明确补助用于购建长期资产，企业却将其划分为与收益相关且直接计入当期损益，或补助用途为补偿人工等日常成本，却被划分为与资产相关并分期摊销，均构成分类错误。阈值设定为：资产相关补助错误归类为收益相关且超过50%金额已计入当期收益，或收益相关补助错误归类为资产相关且已确认递延收益。
  audit_item: 未按规定核算政府补助
  suspicion: 政府补助类型划分错误导致损益核算不当
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第16号——政府补助\",\n    \"法规文号\": \"财会[2017]15号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条、第九条\",\n    \"内容概述\": \"企业应当根据政府补助的性质和条件，合理区分与资产相关的政府补助和与收益相关的政府补助。与资产相关的政府补助，是指企业取得的、用于购建或以其他方式形成长期资产的政府补助。与收益相关的政府补助，是指除与资产相关的政府补助之外的政府补助。\"\
    \n  }\n]"
- expression: ((明细表.税收返还类型 = '增值税即征即退') AND (会计凭证.贷方科目 = '应交税费' OR 会计凭证.贷方科目包含'税金') AND (会计凭证.借方科目 = '银行存款') AND (明细账.发生额中未包含该笔金额))
    OR ((会计凭证.摘要 LIKE '%退税%' OR '%返还%') AND (明细账.账龄 > 365天) AND (明细表.已返金额 > 0))
  description: 增值税即征即退等税收返还应按规定确认为其他收益，但企业可能直接冲减应交税费科目，未确认损益；出口退税等款项可能错误挂账在其他应付款长期不结转。表达式检测：有税务返还银行收款，但会计处理贷方为税金冲减而非收益确认，则违规；或者税务返还长期挂账其他应付款超过一年，也属隐匿收益。
  audit_item: 未按规定核算政府补助
  suspicion: 税收返还资金未按规定确认为当期收益
  regulation: "[\n  {\n    \"法规名称\": \"增值税会计处理规定\",\n    \"法规文号\": \"财会[2016]22号\",\n    \"效力级别\": \"部门规范性文件\",\n    \"条款号\"\
    : \"二、账务处理（十）\",\n    \"内容概述\": \"增值税即征即退、先征后退等各项税收返还，应于收到时计入“其他收益”科目。\"\n  }\n]"
- expression: (ABS(DATEDIFF('day', 对应存货品种.凭证日期, 出库单.出库日期)) > 30) || (对应存货品种.凭证日期 < 出库单.出库日期 && 明细表.期末发出商品数量异常增长) || (对应存货品种.凭证日期
    跨年 && 无合理在途说明)
  description: 结转日期与出库日期差异超过30天视为跨期，凭证日期早于出库日期表明提前结转，跨年结转且无合理在途物资说明为推迟结转。同时检查期末发出商品异常增加，可能暗示已发货未及时确认收入并结转成本。
  audit_item: 未按规定确认成本费用
  suspicion: 提前或推迟结转成本费用
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条、第五条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入，并同时或在对应期间结转相应的成本。\"\n  }\n]"
- expression: (采购合同.返利或折扣条款 && 审批单.冲减金额) || (收款记录.付款方名称 && 采购合同.供应商 && 收款记录.金额 && 会计凭证.借方科目 && 会计凭证.贷方科目 && 会计凭证.入账科目（其他收益/递延收益/营业外收入))
  description: 有返利条款但无冲减记录，或供应商返利款项直接计入收益而未调减成本，均属违规。
  audit_item: 未按规定确认成本费用
  suspicion: 未按规定冲减相关成本费用
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条、第七条\",\n    \"内容概述\": \"存货的采购成本包括购买价款、相关税费等；企业采购商品的进货费用金额较小的，可以在发生时直接计入当期销售费用。购货折扣、购货折让，应冲减存货成本或财务费用。\"\n  }\n\
    ]"
- expression: (ABS(会计凭证.金额 - 银行对账单.交易金额) > 0.01) || (会计凭证.对方单位名称 NOT IN (业务合同.签约方) AND 会计凭证.金额 > 10万元) || (会计凭证.附件张数 = 0 AND
    会计凭证.金额 > 1万元) || (Benford首位数字分布检验 P值 < 0.01) || (会计凭证.摘要 CONTAINS '账外''小金库')
  description: 金额与银行流水不符、无真实合同支撑的大额交易、原始凭证缺失、数字分布违背Benford定律或摘要出现敏感词，均触发伪造变造疑点。其中ABS(金额差)>0.01为直接可疑；无合同匹配且金额>10万元为严重可疑；无附件且金额>1万元为一般可疑。
  audit_item: 违反会计管理规定的行为
  suspicion: 伪造、变造会计凭证会计账簿及其他会计资料
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第十三条、第四十三条\",\n    \"内容概述\": \"会计凭证、会计账簿和其他会计资料，必须符合国家统一的会计制度的规定，不得伪造、变造。伪造、变造会计凭证、会计账簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\
    \n  }\n]"
- expression: ((检查记录.渗水痕迹 = '是' OR 检查记录.消防设备状态 = '失效') AND (会计凭证.字迹清晰度 > 10% OR 会计凭证.霉变程度 > 5%)) OR (交接登记表.缺失记录 > 0) OR (保管环境要求（防火、防潮、防盗、防鼠）、归档时限、备份频率.归档时限未定义
    OR 保管环境要求（防火、防潮、防盗、防鼠）、归档时限、备份频率.备份频率 = '无')
  description: 保管环境不达标导致凭证霉变、字迹模糊（损坏率超过10%或霉变超过5%），或交接记录不完整导致资料丢失，或未制定归档与备份制度，均判定为未按规定保管会计资料。
  audit_item: 违反会计管理规定的行为
  suspicion: 未按规定保管会计资料致毁损灭失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第二十三条、第四十二条\",\n    \"内容概述\": \"各单位对会计凭证、会计账簿、财务会计报告和其他会计资料应当建立档案，妥善保管。未按照规定保管会计资料，致使会计资料毁损、灭失的，由县级以上人民政府财政部门给予处罚。\"\
    \n  }\n]"
