name: audit/财务凭证类/会计凭证
type: model
description: 从财务凭证类类文档（会计凭证）中提取结构化元数据。涵盖字段如：业务内容摘要、会计科目、借方科目、借方金额、入账日期、入账期间、入账科目、入账金额。文档范围包括：人员经费支出会计凭证、会计凭证、会计凭证实物、农业保险保费补贴会计凭证、原始会计凭证、就业补助资金会计凭证、政府补助相关会计凭证、生产成本结转至营业成本的会计凭证、财务会计凭证、转移支付资金会计凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 凭证
- 审批
- 票据
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 会计凭证
  member_count: 1
  member_details:
  - 人员经费支出会计凭证
  - 会计凭证
  - 会计凭证实物
  - 农业保险保费补贴会计凭证
  - 原始会计凭证
  - 就业补助资金会计凭证
  - 政府补助相关会计凭证
  - 生产成本结转至营业成本的会计凭证
  - 财务会计凭证
  - 转移支付资金会计凭证
