name: audit/财务凭证类/支出凭证
type: model
description: 从财务凭证类类文档（支出凭证）中提取结构化元数据。涵盖字段如：发票内容、发票日期、发票金额、实际支出金额、报销人、转固后同一项目发生的大额支出。文档范围包括：专项资金支出凭证、后续支出凭证、种业监管专项经费支出凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 票据
- 金额
- 项目
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 支出凭证
  member_count: 1
  member_details:
  - 专项资金支出凭证
  - 后续支出凭证
  - 种业监管专项经费支出凭证
output:
  fields:
  - name: 发票内容
    type: string
    description: 提取 发票内容 的文本值
  - name: 发票日期
    type: date
    description: 提取 发票日期 的日期值，格式 YYYY-MM-DD
  - name: 发票金额
    type: number
    description: 提取 发票金额 的数值（含单位，如万元、吨等）
  - name: 实际支出金额
    type: number
    description: 提取 实际支出金额 的数值（含单位，如万元、吨等）
  - name: 报销人
    type: string
    description: 提取 报销人 的文本值
  - name: 转固后同一项目发生的大额支出
    type: number
    description: 提取 转固后同一项目发生的大额支出 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (审批文件.审批转固日期 < 监理报告.预计完工百分比) && (工程台账.转固后同一项目发生的大额支出) && (监理报告.预计完工百分比 < 95%)
  description: 转固日期早于工程预计主要完工日期，且转固后仍有大量该工程支出发生，监理报告进度未达95%，表明工程未完工即提前结转，虚增固定资产。
  audit_item: 未按规定核算资产
  suspicion: 在建工程未完工提前转为固定资产
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第4号——固定资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"固定资产应在其达到预定可使用状态时，才能正式确认为资产。\"\n  }\n]"
- expression: (明细表.用途摘要 NOT IN ('购书','设备维修','阅读推广','培训') && 明细表.金额 > 0) || (明细表.支出金额 - 采购合同.合同金额 > 0 AND 拨付文件.支出用途 < 0.7)
    || (支出凭证.报销人 != 书屋管理员 && 支出凭证.发票内容 NOT LIKE '%图书%') || (拨付文件.拨付总额 - 明细表.支出金额 > 拨付文件.拨付总额 * 0.2 AND 拨付文件.拨付依据 > 365)
  description: 判定资金违规：资金用途不在规定的购书、维护、活动范围内，体现挪用；资金用于图书的占比低于规定比例（如70%）且存在大额其他支出；报销人与管理员不符且发票内容无关书屋运营，疑似个人消费报销；资金长期结转超过20%且超过1年未使用，表明资金沉淀或闲置。任一条件触发疑点。
  audit_item: 农家书屋建设运营管护不合规
  suspicion: 违规使用农家书屋专项资金
  regulation: "[\n  {\n    \"法规名称\": \"中央补助地方农村文化建设专项资金管理暂行办法\",\n    \"法规文号\": \"财教〔2013〕25号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第七条、第十条\",\n    \"内容概述\": \"专项资金用于农家书屋出版物补充更新、阅读活动等，不得用于办公设备购置、人员经费等与书屋运行无直接关系的支出；资金应专款专用，加快执行进度。\"\n\
    \  }\n]"
