violations:
- expression: (公务接待明细台账.接待场所名称 NOT IN (定点接待场所名录.酒店名称)) && (公务接待明细台账.接待场所名称 IN (高档酒店预警清单) || (公务接待明细台账.接待金额 / 公务接待明细台账.接待人数)
    > 地区公务接待餐费标准)
  description: 接待场所不在定点名录内，且属于审计预设的高档酒店（如五星级、豪华型）清单，或人均消费超出当地公务接待标准（如超出10%），触发违规判定。需结合当地接待标准及酒店价格水平实施。
  audit_item: 公务接待管理不符合规定
  suspicion: 在高档酒店进行公务接待
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"工作餐应当供应家常菜，不得提供鱼翅、燕窝等高档菜肴和用野生保护动物制作的菜肴，不得提供香烟和高档酒水，不得使用私人会所、高消费餐饮场所。\"\n  }\n]"
- expression: 公务接待明细台账.接待场所名称 IN (A级景区名录) && (公务活动方案.考察内容 IS NULL || 公务活动方案.考察内容 NOT LIKE '%景区管理%' || 公务活动方案.考察内容 NOT LIKE
    '%生态保护%') && (费用报销凭证.费用明细 CONTAINS '门票' || 费用报销凭证.费用明细 CONTAINS '导游费')
  description: 当接待场所为A级景区，且活动方案中缺少与景区管理或生态环保等职能直接相关的实质考察内容，同时费用凭证中出现门票、导游费等旅游特征消费时，判定为变相旅游疑点。
  audit_item: 公务接待管理不符合规定
  suspicion: 在A级景区开展公务考察涉嫌变相旅游
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"接待单位不得超标准接待，不得组织旅游和与公务活动无关的参观，不得组织到营业性娱乐、健身场所活动。\"\n  }\n]"
- expression: 公务接待明细台账.活动项目 = '马拉松' && 单位三定方案.主要职能描述 NOT LIKE '%体育%' && 单位三定方案.主要职能描述 NOT LIKE '%文旅%' && 赛事活动通知.主办单位 != 上级体育主管部门
  description: 排除体育、文旅等直接相关职能单位，其余单位以公务名义参与马拉松，且主办方非上级业务指导部门，即认定为活动与职能无关，属于违规列支。
  audit_item: 公务接待管理不符合规定
  suspicion: 以公务名义参加与职能无关的体育赛事
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"不得组织与公务活动无关的参观和活动，不得以任何名义发放纪念品或变相福利。\"\n  }\n]"
- expression: 报销凭证.审批单附置情况 NOT CONTAIN '公务接待审批单' || 公务接待审批单.审批日期 > 接待清单.接待时间 || 公务接待审批单.审批人 NOT IN (有审批权限人员名单)
  description: 报销时缺少审批单，或审批日期晚于接待实际发生日期（事后补批），或审批人不在单位授权审批人清单内，均视为未履行审批程序。
  audit_item: 公务接待管理不符合规定
  suspicion: 接待未按规定履行审批程序
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"接待单位应当根据规定的接待范围，严格接待审批控制，对能够合并的公务接待统筹安排。\"\n  }\n]"
- expression: 报销凭证.支付方式 = '现金' && 报销凭证.报销金额 >= 公务卡强制结算目录.结算起点金额 && 报销凭证.附件完整性 NOT CONTAIN '特殊事项审批单'
  description: 依据当地公务卡强制结算目录，单笔支出达到起点金额（通常500元或1000元）必须使用公务卡，以现金支付且无经批准的例外说明，即认定为违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务接待费用未使用公务卡结算
  regulation: "[\n  {\n    \"法规名称\": \"关于实施中央预算单位公务卡强制结算目录的通知\",\n    \"法规文号\": \"财库〔2011〕160号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"一、二\",\n    \"内容概述\": \"中央预算单位财政授权支付业务中原使用现金结算的公务支出，应按规定使用公务卡结算；凡目录规定的公务支出项目，应使用公务卡结算，原则上不再使用现金。\"\n\
    \  }\n]"
- expression: (公务接待明细台账.对应审批单编号 IS NULL) OR (接待审批单.审批日期 > 公务接待明细台账.接待日期) OR (接待审批单.审批人签字 IS NULL) OR (财务报销凭证.所附审批单情况 IS NULL)
  description: 台账中无对应审批单编号、审批日期晚于实际接待日期(先接待后审批)、审批单无有效签字、报销时未附审批单，满足任一条件即告违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 未履行公务接待审批程序
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第七条、第十四条\",\n    \"内容概述\": \"接待单位应当严格接待审批控制，无公函的公务活动和来访人员一律不予接待；接待费报销凭证应当包括财务票据、派出单位公函和接待清单。\"\n  }\n]"
- expression: (财务报销凭证.住宿发票开具方 NOT IN (定点酒店/餐馆合作协议台账.定点酒店名称)) OR (财务报销凭证.金额 > 定点酒店/餐馆合作协议台账.协议价格 * 1.1) OR (财务报销凭证.所附审批单情况
    != '特殊情况说明' AND 财务报销凭证.住宿发票开具方 NOT IN (定点酒店/餐馆合作协议台账.定点酒店名称))
  description: 入住非协议定点酒店，或实际支付价格超出协议价10%以上且无合理说明，即视为违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 未执行定点住宿制度
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关差旅费管理办法\",\n    \"法规文号\": \"财行〔2013〕531号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条、第十一条\",\n    \"内容概述\": \"出差人员应当到定点饭店住宿，住宿费按照定点饭店的协议价格结算；未按规定等级乘坐交通工具、住宿的，超支部分由个人自理。\"\n  }\n]"
- expression: (礼品发放记录.采购物品名称 LIKE '%购物卡%' OR 礼品发放记录.采购物品名称 LIKE '%高档烟酒%' OR 礼品发放记录.采购物品名称 LIKE '%礼金%') OR (礼品发放记录.单价 > 300)
