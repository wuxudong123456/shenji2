name: audit/财务凭证类/报销凭证
type: model
description: 从财务凭证类类文档（报销凭证）中提取结构化元数据。涵盖字段如：事由、交通费、人均消费、人均费用、住宿发票开具方、住宿费、保险费合计、出差人。文档范围包括：三公经费支出报销凭证、业务招待费报销凭证、会议费用报销凭证、差旅报销凭证、报销凭证、接待费用报销凭证、财务报销凭证、费用报销凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 审批
- 差旅
- 明细
- 票据
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 报销凭证
  member_count: 1
  member_details:
  - 三公经费支出报销凭证
  - 业务招待费报销凭证
  - 会议费用报销凭证
  - 差旅报销凭证
  - 报销凭证
  - 接待费用报销凭证
  - 财务报销凭证
  - 费用报销凭证
