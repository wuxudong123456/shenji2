name: audit/财务凭证类/到位凭证
type: model
description: 从财务凭证类类文档（到位凭证）中提取结构化元数据。涵盖字段如：付款方名称、入账日期、社会资本方实际出资金额、约定出资额、转账金额。文档范围包括：资本金到位凭证、资金到位凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 到位凭证
  member_count: 1
  member_details:
  - 资本金到位凭证
  - 资金到位凭证
output:
  fields:
  - name: 付款方名称
    type: number
    description: 提取 付款方名称 的数值（含单位，如万元、吨等）
  - name: 入账日期
    type: date
    description: 提取 入账日期 的日期值，格式 YYYY-MM-DD
  - name: 社会资本方实际出资金额
    type: number
    description: 提取 社会资本方实际出资金额 的数值（含单位，如万元、吨等）
  - name: 约定出资额
    type: string
    description: 提取 约定出资额 的文本值
  - name: 转账金额
    type: number
    description: 提取 转账金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (SUM(进度表.实际到位金额) < 承诺金额.承诺金额) || (进度表.到位日期 > 承诺金额.承诺到位时限)
  description: 按项目汇总实际到位资金总额，与资金承诺文件中的承诺金额比较，金额不足或最迟一笔资金到账日期晚于承诺时限，均判定为违规。到位率低于100%或存在任何一笔延迟视为可疑。
  audit_item: 投资计划分解下达不合规
  suspicion: 地方配套建设资金未按时足额到位
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十四条\"\
    ,\n    \"内容概述\": \"政府投资项目所需资金应当按照国家有关规定确保落实到位，不得由施工单位垫资建设。\"\n  }\n]"
- expression: (年度政府支出责任 / 一般公共预算支出 > 10%) || (社会资本方实际出资 / 约定出资 < 0.9) || (合同中存在固定回报承诺条款)
  description: PPP项目政府支出责任占比超过一般公共预算支出10%红线，直接违反财经纪律；社会资本方资本金到位率低于90%为出资不实；合同中存在固定回报或政府兜底条款即构成隐性债务。
  audit_item: 项目实施不到位
  suspicion: PPP项目突破财政承受能力红线
  regulation: "[\n  {\n    \"法规名称\": \"政府和社会资本合作项目财政承受能力论证指引\",\n    \"法规文号\": \"财金〔2015〕21号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二十二条、第二十五条\",\n    \"内容概述\": \"每一年度全部PPP项目需要从预算中安排的支出责任，占一般公共预算支出比例应当不超过10%。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于进一步规范地方政府举债融资行为的通知\",\n    \"法规文号\": \"财预〔2017〕50号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"三\",\n    \"内容概述\"\
    : \"地方政"
