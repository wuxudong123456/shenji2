name: audit/财务凭证类/筹集凭证
type: model
description: 从财务凭证类类文档（筹集凭证）中提取结构化元数据。涵盖字段如：捐赠协议、收款收据、缴款单位/个人名称、缴款性质、金额。文档范围包括：资金筹集凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 协议
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 筹集凭证
  member_count: 1
  member_details:
  - 资金筹集凭证
output:
  fields:
  - name: 捐赠协议
    type: string
    description: 提取 捐赠协议 的文本值
  - name: 收款收据
    type: number
    description: 提取 收款收据 的数值（含单位，如万元、吨等）
  - name: 缴款单位-个人名称
    type: number
    description: 提取 缴款单位-个人名称 的数值（含单位，如万元、吨等）
  - name: 缴款性质
    type: number
    description: 提取 缴款性质 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 缴款性质 = '强制' OR (无捐赠协议 AND 收款收据备注`摊派`) OR (EXISTS ( SELECT 1 FROM 企业反馈 WHERE 企业.声明 = '被强制要求捐款' AND 缴款金额 > 0 ))
  description: 通过收款凭证性质、是否有自愿捐赠协议以及外部访谈记录判断是否属强制集资。若缺乏自愿协议或企业/个人举报，可认定为摊派。
  audit_item: 项目建设不符合规定
  suspicion: 强制向单位和个人摊派道路建设资金
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十一条\",\n    \"内容概述\": \"农村公路建设不得增加农民负担，不得损害农民利益，不得采用强制手段向单位和个人集资，不得强行让农民出工、备料。确需农民出资、投劳的，应当由村民委员会征得农民同意。\"\n  },\n\
    \  {\n    \"法规名称\": \"关于坚决制止向企业乱摊派的通知\",\n    \"法规文号\": \"国发〔1988〕25号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"一\"\
    ,\n"
