name: audit/财务凭证类/缴费凭证
type: model
description: 从财务凭证类类文档（缴费凭证）中提取结构化元数据。涵盖字段如：实缴金额、实际缴纳金额、对应审批文号、收款单位、收费单位、收费项目、收费项目名称、日期。文档范围包括：个人缴费凭证、企业缴费凭证、农户缴费凭证、电费缴费凭证、缴费凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 凭证
- 审批
- 金额
- 项目
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 缴费凭证
  member_count: 1
  member_details:
  - 个人缴费凭证
  - 企业缴费凭证
  - 农户缴费凭证
  - 电费缴费凭证
  - 缴费凭证
output:
  fields:
  - name: 实缴金额
    type: number
    description: 提取 实缴金额 的数值（含单位，如万元、吨等）
  - name: 实际缴纳金额
    type: number
    description: 提取 实际缴纳金额 的数值（含单位，如万元、吨等）
  - name: 对应审批文号
    type: string
    description: 提取 对应审批文号 的文本值
  - name: 收款单位
    type: number
    description: 提取 收款单位 的数值（含单位，如万元、吨等）
  - name: 收费单位
    type: number
    description: 提取 收费单位 的数值（含单位，如万元、吨等）
  - name: 收费项目
    type: number
    description: 提取 收费项目 的数值（含单位，如万元、吨等）
  - name: 收费项目名称
    type: number
    description: 提取 收费项目名称 的数值（含单位，如万元、吨等）
  - name: 日期
    type: date
    description: 提取 日期 的日期值，格式 YYYY-MM-DD
  - name: 月用电量
    type: string
    description: 提取 月用电量 的文本值
  - name: 税种
    type: string
    description: 提取 税种 的文本值
  - name: 缴款时间
    type: date
    description: 提取 缴款时间 的日期值，格式 YYYY-MM-DD
  - name: 缴费事由
    type: number
    description: 提取 缴费事由 的数值（含单位，如万元、吨等）
  - name: 缴费凭证编号
    type: number
    description: 提取 缴费凭证编号 的数值（含单位，如万元、吨等）
  - name: 缴费单位
    type: number
    description: 提取 缴费单位 的数值（含单位，如万元、吨等）
  - name: 缴费日期
    type: date
    description: 提取 缴费日期 的日期值，格式 YYYY-MM-DD
  - name: 缴费时间
    type: date
    description: 提取 缴费时间 的日期值，格式 YYYY-MM-DD
  - name: 缴费金额
    type: number
    description: 提取 缴费金额 的数值（含单位，如万元、吨等）
  - name: 费种
    type: number
    description: 提取 费种 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (明细台账.收费项目名称 LIKE '%防雷装置检测%') && (明细表.支付金额 IS NULL OR 明细表.支付金额 = 0) && (政策文件.费用承担主体（财政/企业） == '财政')
  description: 从收费明细台账中筛选收费项目名称包含“防雷装置检测”的记录；若对应财政支付明细中无任何拨付记录或支付金额为零，且政策文件明确该类费用应由财政承担，则判定为违规转嫁。只要存在一条此类记录立即触发疑点。
  audit_item: 违规收费-违规将应由财政资金承担的评估评审费用转嫁给企业承担
  suspicion: 违规将防雷装置检测费转嫁给企业承担
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条\",\n    \"内容概述\": \"政府及其有关部门不得将职责范围内的监管、技术审查、评估评审等费用转嫁给市场主体。\"\n  }\n]"
- expression: (收费项目名称（水土保持方案技术评估评审费）.收费项目名称 LIKE '%水土保持方案%' AND 收费项目名称 LIKE '%评审%') && (明细表.支付金额 IS NULL OR 明细表.支付金额 = 0)
    && (政策文件.费用承担主体（财政/企业） == '财政')
  description: 在收费台账中检索项目名称同时包含“水土保持方案”和“评审”的记录，若对应财政支付明细中无相应支出或支出为零，但政策规定该评审费由财政负担，即判定为违规转嫁。同时关注财政已支付但企业仍被收费的重复收取情形。
  audit_item: 违规收费-违规将应由财政资金承担的评估评审费用转嫁给企业承担
  suspicion: 违规将水土保持方案评估评审费转嫁给企业承担
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条\",\n    \"内容概述\": \"政府及其有关部门不得将职责范围内的监管、技术审查、评估评审等费用转嫁给市场主体。\"\n  }\n]"
- expression: (收费明细台账.收费项目名称（考古勘探费、考古发掘费） LIKE '%考古勘探%' OR 收费明细台账.收费项目名称（考古勘探费、考古发掘费） LIKE '%考古发掘%') && (明细表.支付金额 IS NULL
    OR 明细表.支付金额 = 0) && (政策文件.费用承担主体（财政/土地收储成本/企业） == '财政' || 政策文件.费用承担主体（财政/土地收储成本/企业） == '土地收储成本')
  description: 筛选收费台账中项目名称涉及“考古勘探”或“考古发掘”的企业缴费记录，核实同项目在财政支付明细或土地成本中是否已列支该项费用。若政策规定考古费用应由政府财政或土地收储资金承担，但企业实际支付且无财政、土地成本对应支付记录，则判定为违规转嫁。
  audit_item: 违规收费-违规将应由财政资金承担的评估评审费用转嫁给企业承担
  suspicion: 违规将考古勘探发掘费转嫁给企业承担
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条\",\n    \"内容概述\": \"政府及其有关部门不得将职责范围内的监管、技术审查、评估评审等费用转嫁给市场主体。\"\n  }\n]"
- expression: (电商交易数据台账.月交易笔数 = 0 FOR 连续3个月) OR (设施设备闲置率统计表.总闲置率 > 0.4) OR (运营日志.交易记录 > 15) OR (电费缴费凭证.月用电量 = 0 FOR 连续3个月)
  description: 连续多个月无交易记录、闲置资产原值占比超过40%、重大故障长期未修复、连续数月无电费消耗，任一条件触发均说明站点处于实质性停运或严重闲置状态。
  audit_item: 信息进村入户、电子商务进农村等村级服务站使用效果不佳
  suspicion: 村级服务站长期停止运营或设施设备闲置废弃
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十六条\",\n    \"内容概述\": \"各部门及其所属单位应当及时盘活存量资产，对长期闲置、低效运转的资产，应当采取有效措施进行盘活或处置。\"\n  }\n]"
- expression: 农户姓名.收费金额 > 0 && ( 是否允许收费、收费标准上限.是否允许收费 == 否 || 农户姓名.收费金额 > 是否允许收费、收费标准上限.收费标准上限 )
  description: 根据政策规定，电能表、表箱及入户线等费用已纳入工程投资，电网企业不得以任何名义向农户收取此类费用。收费金额大于0即违规。
  audit_item: 电网改造和供电服务不合规
  suspicion: 安装表箱向农户违规收费
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2016〕2119号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第三十条\",\n    \"内容概述\": \"表箱、电能表及入户线等费用纳入工程投资，严禁向农村电力用户收取任何费用。\"\n  }\n]"
- expression: 缴费凭证.缴费金额 > MIN(国家标准上限, 省级标准上限) * 1.1 || 缴费凭证.缴费金额 / 档案.用地面积 > 地方政府规定标准上限 * 1.2
  description: 实际收取的保证金超过国家/省级规定上限的10%，或单位面积收费超过地方公布标准20%的，视为高额收费，变相增加农业经营者负担。
  audit_item: 相关支持政策落实不到位
  suspicion: 违规收取高额土地复垦保证金
  regulation: "[\n  {\n    \"法规名称\": \"土地复垦条例实施办法\",\n    \"法规文号\": \"国土资源部令第56号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十一条\",\n    \"内容概述\": \"土地复垦义务人应当预存土地复垦费用，预存标准由省级自然资源主管部门制定，不得擅自提高标准或另立名目收费。\"\n  }\n]"
- expression: 申请单位、申请日期、批复日期、审批状态、地块坐标、批准用途、用地面积、土地类型、面积、四至坐标、批准面积、项目类型、用地坐标、要求保证金金额.要求保证金金额 > 保证金收取标准、计算方式.计算方式 * 保证金上限标准或指导标准.保证金上限标准或指导标准
    OR (保证金收取标准、计算方式.保证金收取标准 > 保证金上限标准或指导标准.保证金上限标准或指导标准) OR (实际缴纳金额、缴费单位、项目名称、收费项目名称（人防易地建设费）、金额、收费单位、收费项目名称（不动产登记费）、费种、收费项目、缴费凭证编号、缴费日期、收费项目名称、缴费时间.实际缴纳金额
    > 申请单位、申请日期、批复日期、审批状
  description: 将实际收取的保证金与国家和省级规定的上限对比，若超过上限即为违规。如果地方自行制定的标准已超过上级政策上限，则该地方文件本身也违规。表达式采用实际收取超出审批要求金额也视为加码收费。
  audit_item: 相关支持政策落实不到位
  suspicion: 超标准收取土地复垦保证金增加主体负担
  regulation: "[\n  {\n    \"法规名称\": \"土地复垦条例实施办法\",\n    \"法规文号\": \"国土资源部令第56号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"土地复垦义务人应当按照条例规定缴纳土地复垦费，或者预存土地复垦费用。费用标准由省级价格主管部门会同有关部门制定，不得违反国家有关规定擅自设立收费项目或超标准收费。\"\n  },\n\
    \  {\n    \"法规名称\": \"国务院办公厅关于坚决制止耕地“非农化”行为的通知\",\n    \"法规文号\": \"国办发明电〔2020〕24号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款"
- expression: (认定文件.家庭收入 < 当地低收入标准 && 缴费凭证.税种（个人所得税） == '个人所得税' && 缴费凭证.实缴金额 > 0) || (登记表.房屋信息 == '已分配' && 认定文件.保障类型 IN ('需提供所得税完税证明'))
  description: 当住房保障对象为低收入家庭，政策规定应减免或简化个人所得税相关手续时，若发现保障对象缴纳了个人所得税或资格审核时被强制要求提供完税证明，则视为违规增加负担。
  audit_item: 违规向保障性安居工程项目收取应减免税费
  suspicion: 向住房保障对象违规收取个人所得税
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四条第（二）项\",\n    \"内容概述\": \"规范保障性住房准入审核，不得违规增加审批环节和材料要求，切实减轻保障对象负担。\"\n  }\n]"
- expression: 项目清单.项目类型 IN ('公租房','棚户区改造','经济适用房','保障性租赁住房') AND 缴费凭证.收费项目名称='城市基础设施配套费' AND 缴费凭证.金额>0 AND 缴费凭证.缴费时间>=批复文件.审批时间
    AND 缴费凭证.项目名称=项目清单.项目名称
  description: 当保障性安居工程项目类型符合减免政策，但缴费记录中出现城市基础设施配套费且金额大于0时，判定为违规收费。需结合缴费时间是否在项目审批之后，排除前期补缴等特殊情况。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规向保障性安居工程项目收取应减免城市基础设施配套费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"全额免除保障性安居工程建设项目城市基础设施配套费等各种行政事业性收费和政府性基金。\"\n  }\n]"
- expression: 立项批复.项目性质 IN ('公租房','棚户区改造','经济适用房','保障性租赁住房') AND (立项批复.人防工程配建要求='已配建' OR 审批文件.是否豁免收费=TRUE) AND 缴费凭证.收费项目名称='人防易地建设费'
    AND 缴费凭证.金额>0
  description: 若项目已按规划配建人防工程或人防主管部门已明确豁免易地建设费，但缴费记录中仍存在该费用且金额大于0，即判定违规。需注意甄别因审批程序延迟导致的临时收费后是否全数退还。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规向保障性安居工程项目收取应免人防易地建设费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"免除保障性安居工程建设项目各项行政事业性收费，含人防易地建设费。\"\n  }\n]"
- expression: 登记类型（首次/转移）='首次登记' AND 不动产用途 IN ('保障性住房') AND 缴费凭证.收费项目名称='不动产登记费' AND 缴费凭证.金额>0
  description: 保障性住房项目办理个人首次登记时按规定免收不动产登记费，若仍收取且金额大于0，无论由开发商还是购房者最终承担，均属违规。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规收取保障性安居工程不动产首次登记费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"免除保障性安居工程登记费等行政事业性收费。\"\n  }\n]"
- expression: 征收台账.费种（教育费附加/地方教育附加） IN ('教育费附加','地方教育附加') AND 征收台账.实缴金额>0 AND 项目清单.项目类型 IN ('公租房','棚户区改造','经济适用房') AND 征收台账.纳税人名称=项目清单.建设单位
  description: 根据财税〔2019〕61号等文件，保障性安居工程免收教育费附加和政府性基金，若税务机关对保障房建设企业实际征收，则判定违规。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规征收保障性安居工程建设企业教育费附加
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于保障性安居工程资金投入管理的通知\",\n    \"法规文号\": \"财税〔2019〕61号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"对保障性安居工程项目免征城市基础设施配套费、教育费附加、地方教育附加等政府性基金。\"\n  }\n]"
- expression: 收费台账.费种（污水处理费）='污水处理费' AND 收费台账.金额 > 收费台账.金额 AND 项目清单.项目类型='保障性住房' AND 收费台账.用户名称（项目名称）=项目清单.项目名称
  description: 减免比例依据地方政策确定，例如减半征收则减免比例为50%，若实际缴费大于应缴费金额即视为未足额减免，构成违规。如地方政策为全免，则应缴费金额为0，任何大于0的收费均违规。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规全额收取保障性安居工程项目污水处理费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"免除保障性安居工程政府性基金，污水处理费按政府性基金管理，按规定应予减免。\"\n  }\n]"
- expression: 审批文件.土地性质（划拨/出让）='划拨' AND 审批文件.项目名称='保障性住房' AND 计提台账.基金名称（农田水利建设基金）='农田水利建设基金' AND 计提台账.计提金额>0
  description: 保障房项目使用划拨土地的，按规定免计农田水利建设基金。若计提台账中出现该基金且金额大于0，即构成违规。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规在保障性安居工程划拨用地环节计提农田水利建设基金
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于保障性安居工程资金投入管理的通知\",\n    \"法规文号\": \"财税〔2019〕61号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"保障性安居工程划拨用地免征各项政府性基金，包括农田水利建设基金。\"\n  }\n]"
