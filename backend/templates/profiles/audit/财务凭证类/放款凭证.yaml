name: audit/财务凭证类/放款凭证
type: model
description: 从财务凭证类类文档（放款凭证）中提取结构化元数据。涵盖字段如：收款方名称、放款日期、计息本金、账号。文档范围包括：银行放款凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 放款凭证
  member_count: 1
  member_details:
  - 银行放款凭证
output:
  fields:
  - name: 收款方名称
    type: number
    description: 提取 收款方名称 的数值（含单位，如万元、吨等）
  - name: 放款日期
    type: date
    description: 提取 放款日期 的日期值，格式 YYYY-MM-DD
  - name: 计息本金
    type: string
    description: 提取 计息本金 的文本值
  - name: 账号
    type: string
    description: 提取 账号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ABS(银行放款凭证.执行年利率 - 项目贷款合同补充协议（含利率条款）.约定年利率) > 0.001 || 银行放款凭证.执行年利率 > 银行贷款利率执行对比表.政策规定利率
  description: 将放款凭证或银行计息记录中的实际执行年化利率与合同约定年化利率进行比对，差值绝对值大于0.001%即为可疑。同时，实际执行利率若大于政策规定优惠上限，直接判定违规。需注意不同计息方式（如360天/365天）造成的细微差异应予以剔除。
  audit_item: 保障性安居工程建设项目银行贷款未按规定享受优惠利率
  suspicion: 银行实际执行利率高于合同约定及政策利率
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国商业银行法\",\n    \"法规文号\": \"中华人民共和国主席令第13号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十七条\",\n    \"内容概述\": \"商业银行应当按照中国人民银行规定的利率的上下限，确定贷款利率。\"\n  },\n  {\n    \"法规名称\": \"中国人民银行 中国银行业监督管理委员会关于做好保障性安居工程信贷服务工作的通知\"\
    ,\n    \"法规文号\": \"银发〔2011〕193号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"三\",\n    \"内容概述\": \"对安居工程贷款应执行优"
- expression: 项目贷款合同补充协议（含利率条款）.利率确定方式（固定/浮动） == '浮动' && 央行基准利率调整历史记录.调整日期 < 银行放款凭证.利率调整日期 && 银行放款凭证.利率调整日期 IS NULL || 项目贷款合同补充协议（含利率条款）.利率确定方式（固定/浮动）
    == '浮动' && 银行放款凭证.执行利率 > 项目贷款合同补充协议（含利率条款）.约定利率
  description: 对于约定利率随基准利率浮动的贷款，当央行下调基准利率后，银行应在规定时间内（通常为次年1月1日或利率调整日起）同步下调执行利率。若检查时点实际执行利率仍按原基准计算且高于应执行利率，即为违规。需先确认合同中浮动条款的具体触发条件。
  audit_item: 保障性安居工程建设项目银行贷款未按规定享受优惠利率
  suspicion: 央行降息后未同步下调执行利率
  regulation: "[\n  {\n    \"法规名称\": \"中国人民银行关于调整金融机构存贷款利率的通知\",\n    \"法规文号\": \"银发〔2015〕61号（示例）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"一\",\n    \"内容概述\": \"金融机构应严格按照调整后的利率执行，浮动利率贷款应按合同约定的调整方式及时重定价。\"\n  },\n  {\n    \"法规名称\": \"贷款通则\"\
    ,\n    \"法规文号\": \"中国人民银行令〔1996〕第2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"贷款利率的上下浮动，应当按照中国人民银行"
- expression: 项目资金使用台账.资金支付去向 NOT IN (该项目工程建设相关的施工方、材料供应商等) AND 项目资金使用台账.收款单位 = 银行放款凭证.收款方名称 AND 挪用金额占比>10%
  description: 跟踪贷款资金从受托支付或自主支付账户流出后的真实流向，若大额款项未付至项目合法的施工、采购等交易对手，而是流入关联企业、转贷或商业地产项目，且挪用比例超过贷款总额10%，则可能触发银行取消优惠利率或实际已构成违规。银行一旦发现挪用，应追回优惠利息差额，但实际情况往往未能及时追回，导致项目仍按原优惠利率占用资金。
  audit_item: 保障性安居工程建设项目银行贷款未按规定享受优惠利率
  suspicion: 项目贷款资金挪用导致优惠利率资格丧失
  regulation: "[\n  {\n    \"法规名称\": \"贷款通则\",\n    \"法规文号\": \"中国人民银行令〔1996〕第2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十九条、第二十二条\",\n    \"内容概述\": \"借款人应当按借款合同约定用途使用贷款，不得挤占挪用。贷款人有权对违约使用部分加收利息甚至收回贷款。\"\n  },\n  {\n    \"法规名称\": \"中国银监会关于印发保障性安居工程贷款管理办法的通知\"\
    ,\n    \"法规文号\": \"银监发〔2011〕72号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十二条\",\n    \"内容概述\": \"贷款"
