name: audit/财务凭证类/核销凭证
type: model
description: 从财务凭证类类文档（核销凭证）中提取结构化元数据。涵盖字段如：审批人、审批日期、核销原因、核销客户、核销金额。文档范围包括：应收账款核销凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 审批
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 核销凭证
  member_count: 1
  member_details:
  - 应收账款核销凭证
output:
  fields:
  - name: 审批人
    type: string
    description: 提取 审批人 的文本值
  - name: 审批日期
    type: date
    description: 提取 审批日期 的日期值，格式 YYYY-MM-DD
  - name: 核销原因
    type: string
    description: 提取 核销原因 的文本值
  - name: 核销客户
    type: string
    description: 提取 核销客户 的文本值
  - name: 核销金额
    type: number
    description: 提取 核销金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ((应收账款核销凭证.核销金额 > 0) AND (应收账款核销凭证.催收证明附件 IS NULL OR 应收账款核销凭证.审批人权限 < 制度规定最低权限 OR 应收账款核销凭证.审批链不完整)) OR (应收账款账龄分析表.逾期天数
    > 180 AND 应收账款账龄分析表.客户ID NOT IN (有催收记录客户ID清单))
  description: 核销坏账须附催收证明且审批符合授权矩阵，任一缺失即核销违规；逾期超180天且无任何催收记录，反映回收管理失职，也视为疑点。
  audit_item: 销售业务管理方面存在的问题
  suspicion: 应收账款逾期回收及违规核销
  regulation: "[\n  {\n    \"法规名称\": \"企业内部控制应用指引第9号——销售业务\",\n    \"法规文号\": \"财会〔2010〕11号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十条\",\n    \"内容概述\": \"企业应当加强应收款项的管理，明确应收账款管理的责任部门，实施应收账款账龄分析，对逾期应收账款及时催收；坏账核销必须依据准确、责任清晰、严格履行审批程序。\"\n\
    \  }\n]"
