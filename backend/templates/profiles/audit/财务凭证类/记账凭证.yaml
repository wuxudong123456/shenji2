name: audit/财务凭证类/记账凭证
type: model
description: 从财务凭证类类文档（记账凭证）中提取结构化元数据。涵盖字段如：会计科目、借方科目、借方金额、做账科目、关联原始凭证编号、凭证号、凭证日期、凭证编号。文档范围包括：管理费用记账凭证、记账凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 凭证
- 金额
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 记账凭证
  member_count: 1
  member_details:
  - 管理费用记账凭证
  - 记账凭证
output:
  fields:
  - name: 会计科目
    type: string
    description: 提取 会计科目 的文本值
  - name: 做账科目
    type: string
    description: 提取 做账科目 的文本值
  - name: 关联原始凭证编号
    type: string
    description: 提取 关联原始凭证编号 的文本值
  - name: 凭证号
    type: string
    description: 提取 凭证号 的文本值
  - name: 凭证日期
    type: date
    description: 提取 凭证日期 的日期值，格式 YYYY-MM-DD
  - name: 凭证编号
    type: string
    description: 提取 凭证编号 的文本值
  - name: 制单人
    type: string
    description: 提取 制单人 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 摘要内容
    type: string
    description: 提取 摘要内容 的文本值
  - name: 收入确认期间
    type: number
    description: 提取 收入确认期间 的数值（含单位，如万元、吨等）
  - name: 记账凭证做账日期
    type: date
    description: 提取 记账凭证做账日期 的日期值，格式 YYYY-MM-DD
  - name: 记账凭证日期
    type: date
    description: 提取 记账凭证日期 的日期值，格式 YYYY-MM-DD
  - name: 记账日期
    type: date
    description: 提取 记账日期 的日期值，格式 YYYY-MM-DD
  - name: 费用归属期间
    type: number
    description: 提取 费用归属期间 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (原始会计凭证.金额 != 记账凭证.借贷金额) || (原始会计凭证.对方单位 != 银行对账单.交易对手) || (原始会计凭证.金额 != 银行对账单.交易金额) || (记账凭证.凭证编号 IN (财务系统操作日志.操作内容
    WHERE 操作类型 == '修改' AND 操作时间 NOT IN 正常工作时间))
  description: 此表达式用于筛查伪造或变造会计凭证的疑点：1）原始凭证金额与记账凭证金额不符，可能为篡改；2）原始凭证的交易对手与银行流水中的交易对手不一致，可能为虚构交易；3）原始凭证金额与银行流水金额不符，可能交易为虚假或金额被变造；4）记账凭证在非工作时段被修改，存在人为篡改风险。满足任一条件即生成疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 伪造变造会计凭证进行虚假核算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号（2017年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条、第四十二条\",\n    \"内容概述\": \"任何单位和个人不得伪造、变造会计凭证、会计帐簿及其他会计资料，不得提供虚假的财务会计报告。伪造、变造会计凭证、会计帐簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\
    \n  }\n]"
- expression: (原始会计凭证.凭证日期 > 资产负债表.日期) && (记账凭证.贷方科目 LIKE '%负债%') || (银行对账单.借贷标志 == '贷' AND 银行对账单.金额 > 大额阈值 AND 银行对账单.对方户名
    LIKE '%供应商%贷款%') && (税务申报表.扣除项目 NOT INCLUDE 对应负债利息或费用) || (外部审计报告.调整分录 == 补记负债) && (资产负债表.应付账款.期末余额 == 资产负债表.应付账款.期初余额)
  description: 识别隐匿负债疑点：1）将本应属于报表期间的负债凭证记入下一期（截止性差异）；2）银行已收到贷款资金，但账面未见新增负债，且税务申报无相关融资费用扣除（帐外负债）；3）外部审计师已提示需补记负债，但账面未调整；4）应付账款余额长期不变，可能未记账新产生的应付款项。满足任一条件即判定为疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 企业提供虚假财务会计报告隐匿负债
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号（2017年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条、第二十六条\",\n    \"内容概述\": \"会计凭证、会计账簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定。公司、企业进行会计核算不得有下列行为：随意改变资产、负债、所有者权益的确认标准或者计量方法，虚列、多列、不列或者少列资产、负债、所有者权益。\"\
    \n  }\n]"
- expression: 记账凭证.金额 != 明细分类账.金额
  description: 抽取的记账凭证金额与账簿中过账金额不一致，且无有效的会计调整分录更正说明，即为账证不符。任何凭证金额与过账金额的差异均触发疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 记账凭证金额与账簿记录金额不一致
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计凭证进行核对，保证会计账簿记录与会计凭证的有关内容相符。\"\n  }\n]"
- expression: 记账凭证.摘要内容 != 记账凭证.会计科目
  description: 当摘要描述的经济业务与入账科目按企业会计政策明显不符，如广告费计入办公费，且无合理解释，即判定为分类错误，疑点成立。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 会计凭证摘要与账簿科目归类不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计凭证进行核对，保证会计账簿记录与会计凭证的有关内容相符。\"\n  }\n]"
- expression: (记账日期.发票号 == '假' || 记账日期.供应商名称 IN (明细表.关联方名称) && 记账日期.摘要 == '无') && (流水.收款方名称 != 记账日期.供应商名称 || 流水.收款方名称 IN (明细表.关联方名称)
    && ABS(流水.交易金额) < 记账日期.金额*0.05)
  description: 该表达式用于筛查虚构服务套取资金的行为。核心逻辑：1.发票为假或供应商为关联方，且无法提供服务成果；2.同时满足资金流向异常，如收款方与发票开具方不一致，或资金最终流转回关联方，且回流金额与支付总额高度接近（容差5%以内），触发严重违规疑点。
  audit_item: 违规提取管理费用
  suspicion: 虚列管理费用套取资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十三条、第二十六条\",\n    \"内容概述\": \"会计凭证、会计账簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定。任何单位和个人不得伪造、变造会计凭证、会计账簿及其他会计资料，不得提供虚假的财务会计报告。公司不得有虚列支出、隐瞒收入等行为。\"\
    \n  },\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n "
- expression: 记账凭证.费用归属期间 > 协议台账.合同服务期限止 || (记账凭证.费用归属期间 > 记账凭证.记账日期 && 协议台账.付款约定 != '预付')
  description: 此表达式用于识别提前或滞后确认费用的跨期调节行为。核心逻辑：1.凭证上标明的费用归属期间，晚于合同约定的服务结束日期，即费用所属期间无对应服务，属于提前或滞后违规计提；2.在非预付合同约定下，记账凭证标明的费用归属期间晚于记账日期，表明将未来期间的费用提前计入了当期，属于提前计提。
  audit_item: 违规提取管理费用
  suspicion: 跨期违规计提管理费用
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第30号——财务报表列报\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第七条\",\n    \"内容概述\": \"企业应当以持续经营为基础，根据实际发生的交易和事项，按照《企业会计准则——基本准则》和其他各项会计准则的规定进行确认和计量，在此基础上编制财务报表。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国企业所得税法实施条例\",\n    \"法规文号\": \"国务院令第512号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\"\
    ,\n  "
- expression: (明细账.二级科目 == '管理服务费' || 明细账.二级科目 == '咨询费') && 记账凭证.供应商/收款方名称 IN (关联方名称、关联关系说明、债权人是否为关联方、交易性质、金额、交易金额、交易价格、供应商名称、合同签订日期、交易对手名称、定价依据及公允性说明、交易内容、交易类型.关联方名称)
    && (记账凭证.金额 / 公司收入) > 行业平均管理费率或同类服务单价.行业平均管理费率或同类服务单价 * 2
  description: 该表达式用于筛查向关联方支付远超市场水平的管理费以转移利润的行为。核心逻辑：1.费用的收款方是企业的关联方；2.支付的费用比率（如管理费占收入比）显著高于同行业平均水平，此处设定为2倍标准作为高度可疑阈值。触发此条件的交易很可能存在利益输送。
  audit_item: 违规提取管理费用
  suspicion: 通过关联方支付高额管理费进行利益输送
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业所得税法\",\n    \"法规文号\": \"主席令第六十三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第四十一条\",\n    \"内容概述\": \"企业与其关联方之间的业务往来，不符合独立交易原则而减少企业或者其关联方应纳税收入或者所得额的，税务机关有权按照合理方法调整。\"\n  },\n  {\n    \"法规名称\"\
    : \"中华人民共和国公司法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十一条\",\n    \"内容概述\": \"公司的控股股东、实际控制人、董事、监事、高级管"
