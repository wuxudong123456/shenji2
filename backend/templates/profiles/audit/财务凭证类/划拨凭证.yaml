name: audit/财务凭证类/划拨凭证
type: model
description: 从财务凭证类类文档（划拨凭证）中提取结构化元数据。涵盖字段如：专户账号、交易摘要、交易金额、付款方、付款方账户、划拨周期、划拨金额、实际划拨金额与日期。文档范围包括：地方财政配套资金划拨凭证、资金划拨凭证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务凭证类
- 审计
- 付款
- 金额
- 项目
- 元数据提取
template_class:
  category: 财务凭证类
  member_types:
  - 划拨凭证
  member_count: 1
  member_details:
  - 地方财政配套资金划拨凭证
  - 资金划拨凭证
output:
  fields:
  - name: 专户账号
    type: string
    description: 提取 专户账号 的文本值
  - name: 交易摘要
    type: string
    description: 提取 交易摘要 的文本值
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款方
    type: number
    description: 提取 付款方 的数值（含单位，如万元、吨等）
  - name: 付款方账户
    type: number
    description: 提取 付款方账户 的数值（含单位，如万元、吨等）
  - name: 划拨周期
    type: string
    description: 提取 划拨周期 的文本值
  - name: 划拨金额
    type: number
    description: 提取 划拨金额 的数值（含单位，如万元、吨等）
  - name: 实际划拨金额与日期
    type: date
    description: 提取 实际划拨金额与日期 的日期值，格式 YYYY-MM-DD
  - name: 开户行
    type: string
    description: 提取 开户行 的文本值
  - name: 收款方
    type: number
    description: 提取 收款方 的数值（含单位，如万元、吨等）
  - name: 收款方账户
    type: number
    description: 提取 收款方账户 的数值（含单位，如万元、吨等）
  - name: 累计入账总额
    type: number
    description: 提取 累计入账总额 的数值（含单位，如万元、吨等）
  - name: 账号
    type: string
    description: 提取 账号 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (资金划拨凭证.累计入账总额 / (工程款支付凭证.同期拨付给施工单位的工程进度款总额 * 工程项目合同.人工费用占比)) < 0.8
  description: 判定规则：在项目施工期间，建设方或总包方拨入农民工工资专用账户的累计金额，低于同期应拨付到账的工程进度款中预估人工费总额的80%，视为专户资金划拨不足，存在人工费用被挤占、挪用的风险。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 农民工工资专用账户资金划拨不足
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十七条、第二十九条\",\n    \"内容概述\": \"施工总承包单位应当按照有关规定开设农民工工资专用账户，专项用于支付该工程建设项目农民工工资。建设单位应当按照合同约定及时拨付工程款，并将人工费用及时足额拨付至农民工工资专用账户，人工费用拨付周期不得超过1个月。\"\
    \n  }\n]"
- expression: (资金划拨凭证.收款方 == 劳务分包公司账号) && (工程款支付凭证.收款单位 == 个人账户 && 工程款支付凭证.收款人姓名 IN (农民工实名制管理台账.姓名) && 工程款支付凭证.付款金额 > 200000)
  description: 判定规则：工资专用账户将款项划拨至合法的劳务分包公司账户后，总包单位或分包公司再通过其银行账户将大额资金（单笔或累计超过20万元）转给某个班组长等个人账户，并由其代为发放工资。这种将工资款交给‘包工头’个人、脱离银行直接代发的行为，极易引发挪用和拖欠风险。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 总包单位通过个人账户违规发放工资
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十一条\",\n    \"内容概述\": \"工程建设领域推行分包单位农民工工资委托施工总承包单位代发制度。施工总承包单位根据分包单位编制的工资支付表，通过农民工工资专用账户直接将工资支付到农民工本人的银行账户，并向分包单位提供代发工资凭证。用于支付农民工工资的银行账户所绑定的农民工本人社会保障卡或者银行卡，用人单位或者其他人员不得以任何理由扣押或者变相扣押。\"\
    \n  }\n]"
- expression: (工程项目合同.开工日期 > 2020年5月1日) && (资金划拨凭证.专户开户许可证/协议 IS NULL) || (农民工工资保证金缴纳情况表.保证金缴纳凭证 IS NULL)
  description: 判定规则：1. 《保障农民工工资支付条例》施行（2020年5月1日）后开工的安居工程项目，未取得任何工资专户相关凭证的，视为未开立专用账户；2. 无农民工工资保证金缴纳记录的，视为未按规定存储保证金。符合任一条件均为严重违规。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 未按规定开设或使用农民工工资专用账户
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条、第三十二条\",\n    \"内容概述\": \"施工总承包单位应当按照有关规定开设农民工工资专用账户，专项用于支付该工程建设项目农民工工资。施工总承包单位应当按照有关规定存储工资保证金，专项用于支付为所承包工程提供劳动的农民工被拖欠的工资。\"\
    \n  }\n]"
