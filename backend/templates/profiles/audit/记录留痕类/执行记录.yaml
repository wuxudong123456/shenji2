name: audit/记录留痕类/执行记录
type: model
description: 从记录留痕类类文档（执行记录）中提取结构化元数据。涵盖字段如：业主表决记录、付息金额、公示内容完整性、公示时间、公示渠道、利率调整日期、发票数量、实际执行时间。文档范围包括：业主欠交维修资金的催缴通知书执行记录、农村公路建设“七公开”制度执行记录、利率执行记录、国库集中支付执行记录、图书更新计划执行记录、客户资质审核制度执行记录、操作规范执行记录、预算执行记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 凭证
- 明细
- 票据
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 执行记录
  member_count: 1
  member_details:
  - 业主欠交维修资金的催缴通知书执行记录
  - 农村公路建设“七公开”制度执行记录
  - 利率执行记录
  - 国库集中支付执行记录
  - 图书更新计划执行记录
  - 客户资质审核制度执行记录
  - 操作规范执行记录
  - 预算执行记录
output:
  fields:
  - name: 业主表决记录
    type: string
    description: 提取 业主表决记录 的文本值
  - name: 付息金额
    type: number
    description: 提取 付息金额 的数值（含单位，如万元、吨等）
  - name: 公示内容完整性
    type: string
    description: 提取 公示内容完整性 的文本值
  - name: 公示时间
    type: date
    description: 提取 公示时间 的日期值，格式 YYYY-MM-DD
  - name: 公示渠道
    type: string
    description: 提取 公示渠道 的文本值
  - name: 利率调整日期
    type: date
    description: 提取 利率调整日期 的日期值，格式 YYYY-MM-DD
  - name: 发票数量
    type: number
    description: 提取 发票数量 的数值（含单位，如万元、吨等）
  - name: 实际执行时间
    type: date
    description: 提取 实际执行时间 的日期值，格式 YYYY-MM-DD
  - name: 实际支付金额
    type: number
    description: 提取 实际支付金额 的数值（含单位，如万元、吨等）
  - name: 执行利率
    type: string
    description: 提取 执行利率 的文本值
  - name: 执行年利率
    type: string
    description: 提取 执行年利率 的文本值
  - name: 拨付金额
    type: number
    description: 提取 拨付金额 的数值（含单位，如万元、吨等）
  - name: 支付方式
    type: string
    description: 提取 支付方式 的文本值
  - name: 支出明细摘要
    type: number
    description: 提取 支出明细摘要 的数值（含单位，如万元、吨等）
  - name: 收款人信息
    type: number
    description: 提取 收款人信息 的数值（含单位，如万元、吨等）
  - name: 收款方名称及账号
    type: number
    description: 提取 收款方名称及账号 的数值（含单位，如万元、吨等）
  - name: 日常收集签字表
    type: string
    description: 提取 日常收集签字表 的文本值
  - name: 最后一次催告日期
    type: date
    description: 提取 最后一次催告日期 的日期值，格式 YYYY-MM-DD
  - name: 流程
    type: string
    description: 提取 流程 的文本值
  - name: 续交催告次数
    type: string
    description: 提取 续交催告次数 的文本值
  - name: 计息日期
    type: date
    description: 提取 计息日期 的日期值，格式 YYYY-MM-DD
  - name: 计息本金
    type: string
    description: 提取 计息本金 的文本值
  - name: 资质审核标准
    type: string
    description: 提取 资质审核标准 的文本值
  - name: 资金拨付凭证号
    type: string
    description: 提取 资金拨付凭证号 的文本值
  - name: 验收数量
    type: number
    description: 提取 验收数量 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (明细表.金额 > 0 && 执行记录.拨付金额 > 0) && (验收报告.验收结论 缺失 || 验收报告.实际完成内容 != 申报材料.实施内容 || 关联表.最终收款方 与 申报材料.申报单位 无业务关联) &&
    筛查表.项目内容空泛度评分 > 80
  description: 筛选已拨付资金但验收缺失或实际完成内容与申报严重不符，且资金流向与项目无关方或空壳公司的项目；风险评分基于项目内容空泛度、申报单位资质不匹配、预算与行业标准偏离度等加权计算，超过80分触发严重疑点。
  audit_item: 编制虚假预算
  suspicion: 虚构不存在项目套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号（2014年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第九十三条第一款\",\n    \"内容概述\": \"各级政府及有关部门、单位不得虚列收入和支出；虚列支出包括虚构项目申报预算、套取财政资金的行为。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条第一款\",\n    \"内容概述\": \"\
    以虚报、冒领等手段骗"
- expression: (ABS(申报材料.单价 - 询价记录.同期同类物资/工程市场均价) / 询价记录.同期同类物资/工程市场均价 > 0.3 || 执行记录.验收数量 < 申报材料.申报数量 * 0.8) && 明细表.金额 > 0
  description: 当预算单价较市场均价偏离超过30%，或实际验收数量少于申报数量的80%时，触发疑点；虚增规模可结合工程量测绘数据进一步核实。
  audit_item: 编制虚假预算
  suspicion: 虚增项目规模或单价套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号（2014年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第九十三条第一款\",\n    \"内容概述\": \"预算支出应当真实，不得虚报项目规模、虚增单价，造成虚列支出。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条第一款\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，属于违规行为，应当追"
- expression: 国库集中支付执行记录.支付方式 != '直接支付' || 保费补贴资金拨付凭证.过渡账户信息 IN ('财政专户', '预算单位实有资金账户') || 保险机构保费结算申请.保险公司收款账户 = '现金'
  description: 根据国库集中支付制度，补贴资金应由财政部门直接支付到最终收款人（保险公司），若先拨付到主管部门实有账户再转拨，或采用现金支付，均视为违规。
  audit_item: 农业保险保费补贴未按规定配套、拨付、管理和结算
  suspicion: 保费补贴未执行国库集中支付制度
  regulation: "[\n  {\n    \"法规名称\": \"财政国库管理制度改革方案\",\n    \"法规文号\": \"财库〔2001〕24号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"核心要求\",\n    \"内容概述\": \"财政资金支付实行国库集中支付制度，原则上应采用财政直接支付方式将资金支付到商品和劳务供应者或用款单位。\"\n  },\n  {\n    \"法规名称\": \"中央财政农业保险保费补贴管理办法\"\
    ,\n    \"法规文号\": \"财金〔2021〕113号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"保费补贴资金应通过国库集"
- expression: (公示内容缺失任一项七要素) || (公示渠道未覆盖乡镇政务栏和省级平台) || (公示日期 < 施工进度关键节点)
  description: 七公开要素包括建设计划、补助政策、招标投标、施工管理、质量监管、资金使用、工程验收。缺失任何一项或渠道不符、公示滞后均属违规。
  audit_item: 项目建设管理不符合相关规定
  suspicion: 未落实农村公路建设“七公开”制度
  regulation: "[\n  {\n    \"法规名称\": \"关于推行农村公路建设“七公开”制度的意见\",\n    \"法规文号\": \"交公路发〔2015〕32号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"农村公路建设须公开建设计划、补助政策、招标投标、施工管理、质量监管、资金使用、工程验收等七项内容，并明确公开渠道和时限。\"\n  }\n]"
