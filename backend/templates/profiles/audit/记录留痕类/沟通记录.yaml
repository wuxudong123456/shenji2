name: audit/记录留痕类/沟通记录
type: model
description: 从记录留痕类类文档（沟通记录）中提取结构化元数据。涵盖字段如：内容、参与人、沟通内容、沟通内容关键词、沟通时间、评标前合作记录、首次沟通时间。文档范围包括：招标人与投标人沟通记录、招标过程沟通记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 沟通记录
  member_count: 1
  member_details:
  - 招标人与投标人沟通记录
  - 招标过程沟通记录
output:
  fields:
  - name: 内容
    type: string
    description: 提取 内容 的文本值
  - name: 参与人
    type: string
    description: 提取 参与人 的文本值
  - name: 沟通内容
    type: string
    description: 提取 沟通内容 的文本值
  - name: 沟通内容关键词
    type: string
    description: 提取 沟通内容关键词 的文本值
  - name: 沟通时间
    type: date
    description: 提取 沟通时间 的日期值，格式 YYYY-MM-DD
  - name: 评标前合作记录
    type: string
    description: 提取 评标前合作记录 的文本值
  - name: 首次沟通时间
    type: date
    description: 提取 首次沟通时间 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 异常操作日志记录表.操作描述 CONTAINS ('投标人名单'、'导出报名表') && (访问时间 NOT BETWEEN '09:00:00' AND '18:00:00' || 操作人 NOT IN (可访问标底人员列表、授权人员账号及姓名.授权人员账号及姓名))
  description: 检出非工作时间或非授权人员对投标人名单数据进行查看、导出的异常记录，符合条件的即为涉嫌泄露投标人名称、数量的高疑点行为。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 向他人透露潜在投标人名称及数量
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"招标人向他人透露已获取招标文件的潜在投标人的名称、数量或者可能影响公平竞争的有关招标投标的其他情况的，或者泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款；对单位直接负责的主管人员和其他直接责任人员依法给予处分；构成犯罪的，依法追究刑事责任。\"\
    \n  }\n]"
- expression: ((访问目标文件（标底文件）.访问内容（含评标专家查询） LIKE '%评标专家%' AND 访问时间 < 开标时间) AND 操作人 NOT IN (权限名单.允许查看人员)) || (相似度(投标文件.技术方案,
    招标文件.技术参数要求) > 0.90 AND 投标准备时长 < 3天)
  description: 开标前非授权人员查阅评标专家名单，或投标文件的技术方案与招标要求异常吻合且准备时间极短，均表明存在评标信息或关键技术参数被提前泄露的风险。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 泄露评标专家名单或关键信息影响公平竞争
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"招标人向他人透露已获取招标文件的潜在投标人的名称、数量或者可能影响公平竞争的有关招标投标的其他情况的，或者泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款。\"\n  }\n]"
- expression: (投标人名称、初始报价、最终报价、报价变更率.报价变更率 > 10%) && (沟通时间、涉及投标人、通讯次数.通讯次数 > 0) && (ABS(中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中标日期、评标委员会名单、中标通知书发出时间、中标人、中标联合体成员及分工、联合体协议条款.合同金额
    - 投标人名称、初始报价、最终报价、报价变更率.最终报价) / 中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中
  description: 报价变更率指（最终报价-初始报价）/初始报价的绝对值，超过10%为异常；评标期间指投标截止至中标通知书发出前。若该期间存在私下沟通且合同金额与变更后报价一致（偏差<1%），则判定存在实质性价格谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人私下与投标人协商修改投标报价
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  }\n]"
- expression: (技术方案变动.技术方案变动 == 是) && (变更前后技术参数.变更前后技术参数 != 招标文件技术规格要求) && (评标报告.技术得分 > 0) && (评标报告.澄清说明记录 == 无)
  description: 评标期间指投标截止后至中标通知书发出前；投标人提交了新版投标文件，技术参数发生实质性变更，导致技术得分提高，且评标报告中无正式的澄清记录，视为招标人默许的实质性谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人默许投标人评标后修改技术方案
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n \
    \   \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十二条\",\n    \"内容概述\": \"评标委员会要求投标人澄清的，澄清不得超出投标文件的范围或者改变投标"
- expression: (差异条款.合同条款 >= 1) && (沟通记录.评标前合作记录 == 是) && (处理记录.投诉内容 == 是)
  description: 实质性条款差异指价格、付款条件、工期、技术标准等关键内容发生变化；评标前沟通指招标公告发布前已有接触记录；未中标人投诉中直接指认内定。三项条件同时满足，可认定为内定并违法谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人提前内定中标人并通过谈判变更合同条款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  }\n]"
