name: audit/记录留痕类/抵押记录
type: model
description: 从记录留痕类类文档（抵押记录）中提取结构化元数据。涵盖字段如：抵押权人、抵押登记事项、权证编号。文档范围包括：不动产登记中心抵押记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 登记
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 抵押记录
  member_count: 1
  member_details:
  - 不动产登记中心抵押记录
output:
  fields:
  - name: 抵押权人
    type: string
    description: 提取 抵押权人 的文本值
  - name: 抵押登记事项
    type: string
    description: 提取 抵押登记事项 的文本值
  - name: 权证编号
    type: string
    description: 提取 权证编号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 贷款合同.抵押物权证编号 COUNT_DISTINCT(银行贷款发放明细表.贷款银行 WHERE 抵押物权证编号相同) > 1  &&  不动产登记中心抵押记录.抵押权人集合 > 1  &&  不动产登记中心抵押记录.登记顺序
    != '首次抵押'
  description: 同一不动产权证编号在多个银行的贷款合同中均作为抵押物，且不动产登记中心存在多次抵押登记记录，而非顺位抵押，即构成重复抵押骗取贷款。
  audit_item: 骗取银行贷款或住房公积金项目贷款
  suspicion: 同一保障房项目重复抵押融资
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第45号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四百零四条\"\
    ,\n    \"内容概述\": \"以财产抵押的，抵押权不得对抗正常经营活动中已支付合理价款并取得抵押财产的买受人。同时设立多个抵押权的，按照登记先后确定清偿顺序。\"\n  },\n  {\n    \"法规名称\": \"贷款通则\"\
    ,\n    \"法规文号\": \"中国人民银行令1996年第2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"借款人不得用同一抵押物向多个银"
