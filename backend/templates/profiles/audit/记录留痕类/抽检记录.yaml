name: audit/记录留痕类/抽检记录
type: model
description: 从记录留痕类类文档（抽检记录）中提取结构化元数据。涵盖字段如：判定结果、压力表指针位置、器材编号、安全通道畅通情况、实测厚度、应急灯功能状态、抽检日期、抽检样品名称。文档范围包括：市场监管部门农膜质量抽检记录、现场抽检记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 安全
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 抽检记录
  member_count: 1
  member_details:
  - 市场监管部门农膜质量抽检记录
  - 现场抽检记录
output:
  fields:
  - name: 判定结果
    type: boolean
    description: 提取 判定结果 的布尔值（是/否）
  - name: 压力表指针位置
    type: string
    description: 提取 压力表指针位置 的文本值
  - name: 器材编号
    type: string
    description: 提取 器材编号 的文本值
  - name: 安全通道畅通情况
    type: string
    description: 提取 安全通道畅通情况 的文本值
  - name: 实测厚度
    type: string
    description: 提取 实测厚度 的文本值
  - name: 应急灯功能状态
    type: boolean
    description: 提取 应急灯功能状态 的布尔值（是/否）
  - name: 抽检日期
    type: date
    description: 提取 抽检日期 的日期值，格式 YYYY-MM-DD
  - name: 抽检样品名称
    type: string
    description: 提取 抽检样品名称 的文本值
  - name: 生产企业
    type: string
    description: 提取 生产企业 的文本值
  - name: 铭牌有效期
    type: string
    description: 提取 铭牌有效期 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (机构名称.有效期至 < 当前日期) || (机构名称.压力表状态 = '失效' || '无记录') || (检查日期.复查结果 = '未整改' && 限期整改日期 < 当前日期) || (抽检记录.压力表指针位置不在绿区
    或 应急灯功能状态 = '应急灯不亮') || (机构名称.检查日期距当前 > 30天 且 无合理说明)
  description: 条件一：器材已过有效期；条件二：台账记录显示器材失效或无检查记录；条件三：消防部门下达的整改通知超期未闭环；条件四：现场抽检发现器材功能失效；条件五：未按规定频率（如每月一次）进行维护检查。满足任一视为消防安全隐患疑点。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 消防器材过期或失效存在安全隐患
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国消防法\",\n    \"法规文号\": \"主席令第81号（2021年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十六条、第二十八条\",\n    \"内容概述\": \"单位应当按照国家标准、行业标准配置消防设施、器材，设置消防安全标志，并定期组织检验、维修，确保完好有效；任何单位、个人不得损坏、挪用或者擅自拆除、停用消防设施、器材。\"\
    \n  }\n]"
- expression: (检测报告.实测厚度 < 0.010mm) || (销售台账.标注厚度 < 0.010mm) || (抽检记录.实测厚度 < 0.010mm) || (产品清单.实测厚度 < 0.010mm) && (产品类别 ==
    '农用薄膜')
  description: 依据国家标准，农用薄膜厚度不得小于0.010mm。若质检报告、台账标注厚度、市场监管抽检实测厚度任一小于0.010mm，即判定违规。同时可进一步比对标注厚度与实测厚度，若标注≥0.010mm而实测<0.010mm，则为虚假标注，属于严重违规。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 生产销售厚度小于0.010mm的农膜
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"农用薄膜生产者应当执行农用薄膜相关标准，确保产品质量合格。禁止生产、销售、使用国家明令禁止或者不符合强制性国家标准的农用薄膜。\"\n\
    \  },\n  {\n    \"法规名称\": \"聚乙烯吹塑农用地面覆盖薄膜\",\n    \"法规文号\": \"GB 13735-2017\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\":\
    \ \"4.4 "
