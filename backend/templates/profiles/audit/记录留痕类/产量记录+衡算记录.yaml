name: audit/记录留痕类/产量记录+衡算记录
type: model
description: 从记录留痕类类文档（产量记录、衡算记录）中提取结构化元数据。涵盖字段如：原材料消耗量理论推算固废产生量。文档范围包括：物料衡算记录、生产产量记录等。本模板合并了 2 个相似子类型。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 产量记录
  - 衡算记录
  member_count: 2
  member_details:
  - 物料衡算记录
  - 生产产量记录
output:
  fields:
  - name: 原材料消耗量理论推算固废产生量
    type: string
    description: 提取 原材料消耗量理论推算固废产生量 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (管理台账.产生量 > 0) && ((合同签订方 IS NULL) || (管理台账.产生量 - 管理台账.自行利用量 - 管理台账.委托处置量 > 0.1 * 管理台账.产生量))
  description: 有固废产生但无处置合同，或超过10%的产生量去向不明且无法提供合法利用、处置去向证明，即可疑为擅自倾倒、堆放。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 擅自倾倒、堆放固体废物
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"主席令第五十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"产生、收集、贮存、运输、利用、处置固体废物的单位和个人，应当采取防扬散、防流失、防渗漏或者其他防止污染环境的措施，不得擅自倾倒、堆放、丢弃、遗撒固体废物。\"\n  }\n]"
