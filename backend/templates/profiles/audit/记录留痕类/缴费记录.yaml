name: audit/记录留痕类/缴费记录
type: model
description: 从记录留痕类类文档（缴费记录）中提取结构化元数据。涵盖字段如：个人缴费到账状态、实际缴费金额、用水量、缴费年度、缴费金额、身份证号。文档范围包括：农户缴费记录、社保系统缴费记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 缴费记录
  member_count: 1
  member_details:
  - 农户缴费记录
  - 社保系统缴费记录
output:
  fields:
  - name: 个人缴费到账状态
    type: number
    description: 提取 个人缴费到账状态 的数值（含单位，如万元、吨等）
  - name: 实际缴费金额
    type: number
    description: 提取 实际缴费金额 的数值（含单位，如万元、吨等）
  - name: 用水量
    type: string
    description: 提取 用水量 的文本值
  - name: 缴费年度
    type: date
    description: 提取 缴费年度 的日期值，格式 YYYY-MM-DD
  - name: 缴费金额
    type: number
    description: 提取 缴费金额 的数值（含单位，如万元、吨等）
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (农业用水实际征收标准 > 工业用水征收标准) || (在农业用水免征政策期间仍进行收取) || (各类用水基准费率.各类用水基准费率超出省级价格主管部门核定上限)
  description: 根据国家政策，农业用水水资源费应低于工业用水，特定条件可免征。若实际执行标准高于工业标准、违规收取或超出核定上限，均属违规。
  audit_item: 大中型灌区运行管护和取水用水不符合相关规定
  suspicion: 农业用水水资源费征收标准违规偏高
  regulation: "[\n  {\n    \"法规名称\": \"水资源费征收标准管理办法\",\n    \"法规文号\": \"发改价格〔2013〕29号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条\",\n    \"内容概述\": \"农业用水水资源费标准应低于工业、生活用水，并可根据情况免征，不得高于工业。\"\n  }\n]"
- expression: ((特殊群体身份认定数据库.身份类型 IN ('重度残疾人','特困人员','低保对象') && 认定时间 <= 缴费年度末 && 认定状态有效) AND (社保系统缴费记录.身份证号 IS NULL || 社保系统缴费记录.个人缴费金额
    = 0)) || (养老保险代缴人员名册.代缴金额 < 代缴政策规定的对应缴费档次全额) || (财政代缴资金拨付凭证.拨付金额 < 应代缴总人数 * 缴费档次标准) || (养老保险代缴人员名册.身份证号 NOT IN (社保系统缴费记录.身份证号)
    AND 社保系统缴费记录.缴费年度 = 代缴年度)
  description: 表达式包含四类异常：①特殊群体数据库中符合代缴条件的人员未在社保缴费记录中出现或缴费金额为零，即应代缴未代缴；②代缴名册中实际代缴金额低于政策规定的全额缴费档次，即差额代缴；③财政拨付的代缴专项资金总额不足，无法覆盖按人数和标准计算的所需资金；④代缴名册中的人员在社保系统中无对应缴费记录，形成虚假代缴。以上任一条件满足即提示代缴政策落实不到位。
  audit_item: 防止返贫帮扶政策落实不到位
  suspicion: 未落实城乡居民基本养老保险费代缴政策
  regulation: "[\n  {\n    \"法规名称\": \"关于切实做好社会保险扶贫工作的意见\",\n    \"法规文号\": \"人社部发〔2017〕59号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第二条（三）\",\n    \"内容概述\": \"对建档立卡未标注脱贫的贫困人口、低保对象、特困人员等困难群体，参加城乡居民基本养老保险的，地方人民政府为其代缴部分或全部最低标准养老保险费。\"\n \
    \ },\n  {\n    \"法规名称\": \"人力资源和社会保障部 财政部 国务院扶贫办关于做好社会保险扶贫工作的实施意见\",\n    \"法规文号\": \"人社部发〔2017〕59号配套文件\",\n    \"效力级别\""
