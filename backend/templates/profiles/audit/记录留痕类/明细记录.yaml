name: audit/记录留痕类/明细记录
type: model
description: 从记录留痕类类文档（明细记录）中提取结构化元数据。涵盖字段如：付款单位、支付日期、收款单位、用途、金额。文档范围包括：资金拨付和使用明细记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 付款
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 明细记录
  member_count: 1
  member_details:
  - 资金拨付和使用明细记录
output:
  fields:
  - name: 付款单位
    type: number
    description: 提取 付款单位 的数值（含单位，如万元、吨等）
  - name: 支付日期
    type: date
    description: 提取 支付日期 的日期值，格式 YYYY-MM-DD
  - name: 收款单位
    type: number
    description: 提取 收款单位 的数值（含单位，如万元、吨等）
  - name: 用途
    type: string
    description: 提取 用途 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 资金拨付明细.收款单位 NOT IN (部门年度预算批复文件.预算单位) AND (SELECT COUNT(*) FROM 预算调整审批记录 WHERE 调入单位 = 资金拨付明细.收款单位 AND 调剂金额 =
    资金拨付明细.金额 AND 财政部批复文号 IS NOT NULL) = 0
  description: 筛查收款单位为非预算单位、下属单位或其他部门的资金拨付记录，若无法匹配到经财政部审批的预算调剂批复，即判定为违规。排除正常政府采购、工资发放等常规支出后，重点关注大额、异常转账。
  audit_item: 预算调剂不规范
  suspicion: 未经批准在部门内外调剂预算资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"2018年修正版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第七十三条\",\n    \"内容概述\": \"各级政府、各部门、各单位的支出必须以经批准的预算为依据，未列入预算的不得支出。各部门、各单位应当加强对预算支出的管理，严格执行预算和财政制度，不得擅自扩大支出范围、提高开支标准。\"\n\
    \  },\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第七十二条\""
