name: audit/记录留痕类/原始记录
type: model
description: 从记录留痕类类文档（原始记录）中提取结构化元数据。涵盖字段如：GPS坐标、二氧化氯、仪器使用记录、仪器打印凭条、余氯、单次排水量、回收点逐笔称重记录、坐标。文档范围包括：企业自行监测原始记录、农膜回收称重原始记录、土壤采样原始记录、废水排放监测原始记录、排查工作原始记录、检测原始记录、检测机构原始记录、水质检测原始记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 原始记录
  member_count: 1
  member_details:
  - 企业自行监测原始记录
  - 农膜回收称重原始记录
  - 土壤采样原始记录
  - 废水排放监测原始记录
  - 排查工作原始记录
  - 检测原始记录
  - 检测机构原始记录
  - 水质检测原始记录
output:
  fields:
  - name: GPS坐标
    type: string
    description: 提取 GPS坐标 的文本值
  - name: 二氧化氯
    type: string
    description: 提取 二氧化氯 的文本值
  - name: 仪器使用记录
    type: string
    description: 提取 仪器使用记录 的文本值
  - name: 仪器打印凭条
    type: string
    description: 提取 仪器打印凭条 的文本值
  - name: 余氯
    type: string
    description: 提取 余氯 的文本值
  - name: 单次排水量
    type: string
    description: 提取 单次排水量 的文本值
  - name: 回收点逐笔称重记录
    type: string
    description: 提取 回收点逐笔称重记录 的文本值
  - name: 坐标
    type: string
    description: 提取 坐标 的文本值
  - name: 实际排放浓度
    type: string
    description: 提取 实际排放浓度 的文本值
  - name: 实验室电子原始数据
    type: string
    description: 提取 实验室电子原始数据 的文本值
  - name: 排查人员签字
    type: string
    description: 提取 排查人员签字 的文本值
  - name: 样品流转单
    type: string
    description: 提取 样品流转单 的文本值
  - name: 检测人员签名
    type: string
    description: 提取 检测人员签名 的文本值
  - name: 检测报告编号
    type: string
    description: 提取 检测报告编号 的文本值
  - name: 检测数值
    type: string
    description: 提取 检测数值 的文本值
  - name: 检测方法
    type: string
    description: 提取 检测方法 的文本值
  - name: 检测日期
    type: date
    description: 提取 检测日期 的日期值，格式 YYYY-MM-DD
  - name: 检测项目
    type: string
    description: 提取 检测项目 的文本值
  - name: 检测频次
    type: string
    description: 提取 检测频次 的文本值
  - name: 污染物种类
    type: string
    description: 提取 污染物种类 的文本值
  - name: 照片
    type: string
    description: 提取 照片 的文本值
  - name: 现场检测作业原始表格
    type: string
    description: 提取 现场检测作业原始表格 的文本值
  - name: 现场照片
    type: string
    description: 提取 现场照片 的文本值
  - name: 现场记录方量
    type: string
    description: 提取 现场记录方量 的文本值
  - name: 签字
    type: string
    description: 提取 签字 的文本值
  - name: 结果
    type: boolean
    description: 提取 结果 的布尔值（是/否）
  - name: 自行监测数据
    type: string
    description: 提取 自行监测数据 的文本值
  - name: 菌落总数等消毒剂指标
    type: string
    description: 提取 菌落总数等消毒剂指标 的文本值
  - name: 采样时间
    type: date
    description: 提取 采样时间 的日期值，格式 YYYY-MM-DD
  - name: 采样深度
    type: string
    description: 提取 采样深度 的文本值
  - name: 采样点位坐标
    type: string
    description: 提取 采样点位坐标 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (检测合同.合同约定的检测范围 包含 '斜拉索/吊杆/系杆/钢结构节点/橡胶支座' && 检测报告.检测结论 不包含 对应构件) || (检测报告.实际检测部位清单 不包含 结构受力特性、结构易损性部位、桥梁结构类型、特殊构件设计详图（如斜拉索、吊杆、支座）.特殊构件设计详图（如斜拉索、吊杆、支座）)
  description: 针对缆索承重体系或特殊结构桥梁，常规表观检查无法涉及其核心受力构件。若合同约定或规范要求必须检查，而检测报告无对应构件的任何数据，判定为实质性缺项。
  audit_item: 道路桥梁安全定期检测审计
  suspicion: 特殊结构部位检测缺项
  regulation: "[\n  {\n    \"法规名称\": \"公路桥涵养护规范\",\n    \"法规文号\": \"JTG 5120-2021\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"4.4.2\",\n    \"内容概述\": \"定期检查应根据桥梁结构类型，对桥面系、上部结构、下部结构和附属设施的所有构件进行详细检查。对于缆索、吊杆、支座等特殊构件，应作为重点检查内容。\"\n  },\n  {\n \
    \   \"法规名称\": \"公路桥梁技术状况评定标准\",\n    \"法规文号\": \"JTG/T H21-2011\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"4.1.5\",\n\
    \    \"内容概"
- expression: (监测报告.实际排放浓度 > 许可排放浓度限值.许可排放浓度限值) || (ABS(自行监测数据.自行监测数据 - 检测报告.第三方抽测数据) / 检测报告.第三方抽测数据 > 0.3) || (记录表.治污设施用电量曲线
    出现夜间骤降且伴随排放峰值)
  description: 超标判定直接依据监测报告数据超过许可证限值；疑似篡改数据判定通过企业自行数据与第三方抽查数据差异率超过30%触发；治污设施用电量与排放峰值异常反向关联作为辅助判定依据。风险等级：超标即高风险，数据差异率30%-50%为中风险，大于50%为严重违规。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 大气污染物排放超标或监测数据造假
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国大气污染防治法\",\n    \"法规文号\": \"主席令第三十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十八条、第九十九条\",\n    \"内容概述\": \"向大气排放污染物的，应当符合大气污染物排放标准；超过排放标准排放大气污染物的，由环保部门责令改正或者限制生产、停产整治，并处罚款。\"\n  }\n]"
- expression: (原始记录.实际排放浓度 > 许可证.许可排放浓度限值) || (核算表.年度累计排放量 > 许可证.核定年度排放总量) || (原始记录.污染物种类 NOT IN 许可证.允许排放污染物种类)
  description: 任一种超限行为均构成违规：浓度超标、总量超限、排放未许可的污染物种类。阈值直接对照许可证数值，超过即触发。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 超排污许可证规定排放废水
  regulation: "[\n  {\n    \"法规名称\": \"排污许可管理条例\",\n    \"法规文号\": \"国务院令第736号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十七条\",\n    \"内容概述\": \"排污单位应当遵守排污许可证规定，按照生态环境管理要求运行和维护污染防治设施，建立环境管理制度，严格控制污染物排放。\"\n  }\n]"
- expression: (资质证书有效期.资质证书有效期 < TODAY) || (资质证书有效期.检测项目范围 NOT CONTAIN GB5749-2022要求的日检9项、月检42项、年检106项) || (年度检测总次数.年度检测总次数
    < 规定最低次数) || (检测人员持证数量 < 2)
  description: 1.实验室资质过期无效；2.检测项目覆盖不全：对照《生活饮用水卫生标准》GB5749-2022表1、表2常规指标，日检9项(色度、浑浊度等)、月检42项、年检106项，任一缺失即为能力不足；3.年度检测总次数远低于标准(如日供水1000m3以上水厂日检不少于1次)；4.检测人员无证上岗。这些条件满足任一即判定检测能力不足。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 地方水质检测能力不符合要求
  regulation: "[\n  {\n    \"法规名称\": \"生活饮用水卫生标准\",\n    \"法规文号\": \"GB5749-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"9.2.1\",\n    \"内容概述\": \"供水单位应具备相应的水质检测能力，检测项目及频率应满足日常检测要求，日检9项、月检42项、年检106项。\"\n  },\n  {\n    \"法规名称\": \"生活饮用水卫生监督管理办法\"\
    ,\n    \"法规文号\": \"卫生部令第53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"供水单位供应的饮用水必须符合国家生活饮用水卫"
- expression: (原始记录.检测数值 != 检测报告.检测数值) || ABS(检测报告.检测数值 - 检测报告.检测数值) > 允许偏差 || (检测报告.检测数值连续多日完全相同) || (记录表.余氯检测值 < 0.3 但 检测报告.检测指标达标)
  description: 1.篡改数据：原始记录与正式报告数值不一致；2.与第三方检测结果偏离：同时间、同采样点的自检值与第三方检测值偏差超过20%(或测量不确定度)可判断为造假；3.数据雷同：连续多日检测数值完全一样，不符合水质波动特性；4.逻辑矛盾：消毒剂投加量不足或余氯极低，但菌落总数却合格，违背工艺原理。以上任一条件触发即疑为弄虚作假。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 水质检测数据弄虚作假
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第七十二条\",\n    \"内容概述\": \"饮用水供水单位应当对供水水质负责，确保水质符合国家卫生标准，不得瞒报、谎报或者迟报水质信息。\"\n  },\n  {\n    \"法规名称\": \"检验检测机构监督管理办法\"\
    ,\n    \"法规文号\": \"国家市场监督管理总局令第39号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"检验检测机构不得出具虚假检验检"
- expression: (验收文件.工艺流程 而 验收文件.安装数量=0) || (验收文件.设施型号不符合设计要求的加氯能力) || (加药量、余氯检测值、接触时间、设备运行状态.连续3天无运行记录) || (采样时间、检测项目、结果、签字、检测频次、检测方法、检测日期、检测数值、检测人员签名、仪器使用记录、余氯、二氧化氯、菌落总数等消毒剂指标.余氯
    < 0.3mg/L 且 采样时间、检测项目、结果、签字、检测频次、检测方法、检测日期、检测数值、检测人员签名、仪器使用记录、余氯、二氧化氯、菌落总数等消毒剂指标.菌落总数等消毒剂指标 > 100CFU/mL)
  description: 1.设施缺失：设计文件明确要求安装消毒设备但实际未安装；2.设施规格不符：安装的消毒设备处理能力低于设计值；3.运行异常：连续多日没有运行记录，或消毒剂投加量为零；4.消毒效果不达标：出水余氯值低于国家标准的0.3mg/L(氯消毒)且菌落总数超标，说明消毒设施形同虚设。满足任一条件即可判定。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 净化消毒设施未按要求配备
  regulation: "[\n  {\n    \"法规名称\": \"生活饮用水卫生标准\",\n    \"法规文号\": \"GB5749-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"9.3.1\",\n    \"内容概述\": \"生活饮用水必须经过消毒处理，消毒剂余量应符合要求，氯消毒时出厂水游离余氯不应低于0.3mg/L。\"\n  },\n  {\n    \"法规名称\": \"农村饮水安全工程建设管理办法\"\
    ,\n    \"法规文号\": \"发改农经[2013]2673号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"农村饮水安全工程设计应包括净化、消"
- expression: 文件发布文号、检测项目清单、检测频次、责任人 IS NULL || 文件发布文号、检测项目清单、检测频次、责任人.检测项目清单 != GB5749-2022表1指标 || 文件发布文号、检测项目清单、检测频次、责任人.检测频次
    < 国家最低要求 || 异常发现时间、上报记录、原因分析、整改措施.记录数量持续为0(年度) 但 检测报告存在超标值
  description: 1.制度缺失：无法提供书面的水质检验管理制度文本；2.制度内容不全：未按规定明确日检、月检、年检的具体项目、频次、责任人及操作流程；3.制度执行虚设：有超标数据但无任何异常处置记录，证明制度未落实。以上条件触发疑点。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 供水单位未建立水质检验制度
  regulation: "[\n  {\n    \"法规名称\": \"生活饮用水卫生监督管理办法\",\n    \"法规文号\": \"卫生部令第53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"供水单位应建立水质检验制度，配备检验人员和仪器设备，按规定对水源水、出厂水、管网末梢水进行检验，保证供水水质符合国家卫生标准。\"\n  },\n  {\n    \"法规名称\"\
    : \"生活饮用水卫生标准\",\n    \"法规文号\": \"GB5749-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"9.1.2\",\n    \"内容概述\": \"供水单位应制定并实施水"
- expression: ABS(年度实际回收量、年度农膜使用总量、计算得出的实际回收率、年度或季度实际回收量、回收率计算过程.计算得出的实际回收率 - 上报年度实际回收率、年度、目标回收率、实际完成回收率、差异值.上报年度实际回收率) >
    0.05 || (政策要求年度回收率目标值、目标回收率.政策要求年度回收率目标值 - 年度实际回收量、年度农膜使用总量、计算得出的实际回收率、年度或季度实际回收量、回收率计算过程.计算得出的实际回收率) > 0.10
  description: 触发条件分为两层：（1）台账核实的实际回收率与上报统计表的回收率偏差超过5个百分点，涉嫌数据造假或虚报；（2）台账核实的实际回收率低于政策目标值超过10个百分点，认定为未达标。可进一步核查回收补贴资金的拨付使用情况，若补贴资金闲置或未足额发放，可加重认定违规情节。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 农膜回收利用率未达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"中华人民共和国主席令第四十三号\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第六十五条\",\n    \"内容概述\": \"产生秸秆、废弃农用薄膜、农药包装废弃物等农业固体废物的单位和其他生产经营者，应当采取回收利用和其他防止污染环境的措施。\"\n  },\n  {\n \
    \   \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"中华人民共和国农业农村部令2020年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\"\
    ,\n    \"内容概"
- expression: (COUNT(外部线索点坐标 WHERE 距离(外部线索点坐标, 排查清单及信息系统坐标)所有点最小距离 > 500) > 0) || (文件4.记录点坐标 NOT IN 表2.坐标)
  description: 通过群众举报或卫星遥感获取的疑似堆放点坐标，与排查清单及信息系统的坐标进行500米缓冲区分析，若未匹配则判定为漏报；同时检查原始排查记录是否有对应点未录入信息系统。
  audit_item: 非正规垃圾堆放点清理整治不合规
  suspicion: 瞒报漏报非正规垃圾堆放点
  regulation: "[\n  {\n    \"法规名称\": \"关于做好非正规垃圾堆放点排查和整治工作的通知\",\n    \"法规文号\": \"建办村〔2017〕55号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"二、（一）\",\n    \"内容概述\": \"要求全面排查，做到不留死角、不留盲区，建立完整排查台账。\"\n  }\n]"
- expression: (表2.坐标 IS NULL) || (表2.图片附件 IS NULL) || (表2.验收报告 IS NULL) || (ABS(表2.填报方量 - 表4.实际清运总量) / 表4.实际清运总量 > 0.2)
  description: 检查信息系统必填项（坐标、照片、验收报告）是否缺失；同时对比系统中填报的垃圾方量与垃圾清运登记表汇总的实际清运量，偏差超过20%的点位判定为信息不真实。
  audit_item: 非正规垃圾堆放点清理整治不合规
  suspicion: 堆放点信息系统录入不真实不完整
  regulation: "[\n  {\n    \"法规名称\": \"关于做好非正规垃圾堆放点排查和整治工作的通知\",\n    \"法规文号\": \"建办村〔2017〕55号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"四、（一）\",\n    \"内容概述\": \"要认真填报排查整治信息，确保数据真实、准确、完整，做到一点一档。\"\n  }\n]"
- expression: (调查台账为空) || (MAX(调查台账.调查时间) < '审计年度-5年') || (COUNT(调查台账 WHERE 坐标 IS NULL OR 面积 IS NULL OR 质量等级 IS NULL) > 0)
    || (调查实施方案为空)
  description: 满足以下任一条件即构成违规：1.无调查台账或台账空白；2.最近一次调查时间距审计年度已超过5年，且无更新记录；3.调查台账中大量地块缺少坐标、面积、质量等级等关键字段；4.未编制调查实施方案或未形成正式的调查报告。
  audit_item: 黑土地保护机制不完善
  suspicion: 未对黑土地情况进行调查并建立档案
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第八十七号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"县级以上人民政府应当组织开展黑土地调查，建立黑土地档案，全面掌握黑土地数量、质量、分布和利用状况。\"\n  }\n]"
- expression: (ABS(上报监测值 - 第三方复测值) / 第三方复测值 > 0.15) || (上报监测值相较于历史合理增长区间出现非正常阶跃)
  description: 当某区域上报的土壤有机质含量等指标与第三方独立复测结果之间的相对偏差超过15%，或单一年度数据相较多年平稳趋势出现超过20%的突变且无合理事件支撑时，高度怀疑数据被篡改。
  audit_item: 黑土地保护治理相关任务未完成或完成质量不高
  suspicion: 人为篡改土壤指标监测数据
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国统计法\",\n    \"法规文号\": \"主席令第十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十一条\"\
    ,\n    \"内容概述\": \"作为统计调查对象的国家机关、企业事业单位或者其他组织有下列行为之一的...包括提供不真实或者不完整的统计资料、篡改统计数据的，可依法给予处分或处罚。\"\n  }\n]"
- expression: (发布日期 IS NULL) || (检测项目与频次表 < GB5749规定最低频次) || (采样时间 = 近6个月无检测记录) || (预案版本号 IS NULL) || (演练记录 = 应急演练记录缺失) ||
    (演练记录 > 1年)
  description: 1.无书面检验制度即无法定管理依据；2.制度规定的检测频次低于国家标准，如出厂水日检项目不足9项；3.近半年无任何检测记录，等同于凭肉眼判断水质；4.未编制应急预案或从未开展演练，无法应对突发污染事件。
  audit_item: 水质保障和工程运营管理不到位
  suspicion: 供水单位未建立水质检验及应急处置制度
  regulation: "[\n  {\n    \"法规名称\": \"生活饮用水卫生监督管理办法\",\n    \"法规文号\": \"建设部、卫生部令第53号（2016年修订）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第九条、第十条\",\n    \"内容概述\": \"供水单位应建立水质检验制度，配备检验人员和设备，按照国家规定的检测项目、频次和标准开展水质检测，并建立健全应急预案。\"\n  },\n  {\n\
    \    \"法规名称\": \"生活饮用水卫生标准\",\n    \"法规文号\": \"GB 5749-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"10.1、10.2\",\n\
    \    \"内容"
