name: audit/记录留痕类/许可记录
type: model
description: 从记录留痕类类文档（许可记录）中提取结构化元数据。涵盖字段如：许可状态、违规记录。文档范围包括：市场监管部门许可记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 许可记录
  member_count: 1
  member_details:
  - 市场监管部门许可记录
output:
  fields:
  - name: 许可状态
    type: boolean
    description: 提取 许可状态 的布尔值（是/否）
  - name: 违规记录
    type: string
    description: 提取 违规记录 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (单位名称、许可证状态、发证日期、到期日期.许可证状态 == '无' || 单位名称、许可证状态、发证日期、到期日期.到期日期 < 当前日期 || 实际供餐内容 NOT IN 许可证编号、有效期、经营范围.经营范围)
  description: 供餐单位未取得许可证、许可证已过期或实际供餐内容超出许可证标注经营范围时，判定违规。无证或超范围经营均属重大缺陷。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 供餐单位无证或超范围经营营养餐
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国食品安全法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十五条\",\n    \"内容概述\": \"国家对食品生产经营实行许可制度。从事食品生产、食品销售、餐饮服务，应当依法取得许可。\"\n  }\n]"
