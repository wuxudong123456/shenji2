name: audit/记录留痕类/勘查记录
type: model
description: 从记录留痕类类文档（勘查记录）中提取结构化元数据。涵盖字段如：公共区域使用率、办公人员密度、勘查确认情况、实测工程量、实际入驻企业标识、抽查地块残留地膜估算量、物业水电消耗记录、维修前后现场照片。文档范围包括：现场勘查记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 工程
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 勘查记录
  member_count: 1
  member_details:
  - 现场勘查记录
output:
  fields:
  - name: 公共区域使用率
    type: string
    description: 提取 公共区域使用率 的文本值
  - name: 办公人员密度
    type: string
    description: 提取 办公人员密度 的文本值
  - name: 勘查确认情况
    type: string
    description: 提取 勘查确认情况 的文本值
  - name: 实测工程量
    type: string
    description: 提取 实测工程量 的文本值
  - name: 实际入驻企业标识
    type: string
    description: 提取 实际入驻企业标识 的文本值
  - name: 抽查地块残留地膜估算量
    type: string
    description: 提取 抽查地块残留地膜估算量 的文本值
  - name: 物业水电消耗记录
    type: string
    description: 提取 物业水电消耗记录 的文本值
  - name: 维修前后现场照片
    type: string
    description: 提取 维修前后现场照片 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 结算书.申报工程量 > 竣工图.计算工程量 * 1.05 || (结算书.申报工程量 > 现场勘查记录.实测工程量 * 1.03) || (现场签证单无监理及业主签字确认却进入结算)
  description: 结算申报量超出竣工图计算量5%以上，或超出实际勘查量3%以上，即视为虚报。签证手续不全的工程量不得计入，计入即违规。对土方、拆除等隐蔽工程需重点复核。
  audit_item: 重大工程项目全过程审计
  suspicion: 虚列建设成本或虚报工程量套取资金
  regulation: "[\n  {\n    \"法规名称\": \"基本建设财务规则\",\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十二条\",\n    \"内容概述\": \"项目建设单位应当严格按照合同约定和工程价款结算程序支付工程款。……工程价款结算应当依据合同、设计变更、现场签证等资料，按照工程完成进度据实结算。\"\n  },\n  {\n    \"\
    法规名称\": \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建〔2004〕369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\"\
    : \"工程"
- expression: (统计表.空置面积 / 统计表.载体总面积 > 0.5) AND (统计表.连续空置月数 >= 6) AND (监测报告.培训活动次数 < 4) AND (管理表.入驻企业名称 < 认定标准.应入驻企业数 * 0.3)
  description: 同时满足空置率超过50%、连续空置半年以上、近一年创业服务活动少于4次、实际入驻企业数不足认定基线30%的载体，判定为严重闲置浪费或运营低效。该表达式综合了物理空间使用、服务活跃度、持续周期及入驻规模，避免仅凭单一指标误判。
  audit_item: 创业载体政策执行不到位
  suspicion: 创业载体建成后长期闲置或运营低效
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十四条\"\
    ,\n    \"内容概述\": \"项目单位应当加强政府投资项目资产管理，建立健全项目管理制度，确保项目建成后达到预期效果，不得将项目资产闲置或者低效使用。\"\n  },\n  {\n    \"法规名称\": \"就业补助资金管理办法\"\
    ,\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十条\",\n    \"内容概述\": \"各级财政、人力资源社会保障部门应当"
- expression: 支付凭证.支付金额 > 0 && (施工日志.无记录 || 监理报告.无记录 || 验收报告.缺失 || 现场勘查.无施工痕迹) && (表决文件.同意比例 < 2/3 可选)
  description: 支付已发生，但施工日志、监理报告或验收报告中任一关键文件缺失或内容为空，或现场查勘无对应施工痕迹，即触发疑点。若同时存在表决比例不足或签名造假可加重判定。
  audit_item: 挪用住宅专项维修资金
  suspicion: 虚构维修项目套取维修资金
  regulation: "[\n  {\n    \"法规名称\": \"《住宅专项维修资金管理办法》\",\n    \"法规文号\": \"建设部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"维修资金应当专项用于住宅共用部位、共用设施设备保修期满后的维修和更新、改造，不得挪作他用。\"\n  }\n]"
