name: audit/记录留痕类/核实记录
type: model
description: 从记录留痕类类文档（核实记录）中提取结构化元数据。涵盖字段如：是否实际安装、核实日期、核实结果、照片、证明编号。文档范围包括：入户核实记录、异地缴存证明核实记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 核实记录
  member_count: 1
  member_details:
  - 入户核实记录
  - 异地缴存证明核实记录
output:
  fields:
  - name: 是否实际安装
    type: boolean
    description: 提取 是否实际安装 的布尔值（是/否）
  - name: 核实日期
    type: date
    description: 提取 核实日期 的日期值，格式 YYYY-MM-DD
  - name: 核实结果
    type: boolean
    description: 提取 核实结果 的布尔值（是/否）
  - name: 照片
    type: string
    description: 提取 照片 的文本值
  - name: 证明编号
    type: string
    description: 提取 证明编号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (明细表.发放金额 > 0) && (核实记录.是否实际安装 == '否' || 验收记录.验收状态 == '不合格')
  description: 补助资金已发放到户，但入户核实该户厕具未安装、未投入使用或验收不通过，即判定为“发钱代改”。
  audit_item: 厕所改造实施不规范、质量不达标
  suspicion: 以发放补助资金代替实质性改厕
  regulation: "[\n  {\n    \"法规名称\": \"农村改厕专项资金管理办法\",\n    \"法规文号\": \"财农〔2019〕18号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"补助资金必须专项用于改厕设备和建设，严禁截留、挪用和以拨代支。\"\n  }\n]"
- expression: (异地缴存证明核实记录.核实结果 != '属实') || (DATEDIFF(住房公积金贷款申请清单.申请日期, 异地缴存明细表.缴存开始日期) <= 365 && 异地缴存明细表.缴存单位 != 社保缴纳比对表.参保单位)
    || (异地缴存明细表.缴存期间 与 社保缴纳比对表.参保期间 存在重叠 && 异地缴存明细表.缴存单位 != 社保缴纳比对表.参保单位)
  description: 第一条为证明核实不通过直接判定；第二条为缴存刚满最低期限（12个月）即申请贷款且社保单位与公积金缴存单位不一致，触发骗贷风险；第三条为异地缴存期间本地社保同时缴纳且参保单位不同于缴存单位，具有虚构劳动关系特征。三项满足任一即判定为疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 个人利用虚假异地缴存证明骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，由住房公积金管理中心责令限期退回贷款，并可处骗取金额百分之五以上百分之十以下罚款；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
