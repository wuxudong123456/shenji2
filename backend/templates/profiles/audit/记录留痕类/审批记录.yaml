    \    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第七条、第十一条\",\n    \"内容概述\": \"严格绩效目标管理，未按要求设定绩效目标或审核未通过的"
