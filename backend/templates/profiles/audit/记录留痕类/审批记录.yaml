name: audit/记录留痕类/审批记录
type: model
description: 从记录留痕类类文档（审批记录）中提取结构化元数据。涵盖字段如：不动产用途、中标金额、任职企业、企业名称、供应商名称、公开招聘公告、兼任职务、兼职职务。文档范围包括：不动产登记审批记录、业务招待费报销凭证的审批记录、主管部门的维修资金减免审批记录、二次分配部门年初预算分配方案审批记录、会计政策变更的董事会/管理层审批记录、会计资料销毁审批记录、传统村落保护发展规划编制文件审批记录、供应商/客户合作审批记录、保护区建设/经营活动审批记录、保证金退还审批记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 合同
- 审批
- 车辆
- 金额
- 元数据提取
