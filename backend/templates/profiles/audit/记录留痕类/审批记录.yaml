    \ \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"违反规定开设财政专户或者将"
- expression: 向参股企业流出的异常款项明细表.收款方名称 IN (其他.股东名称) && 向参股企业流出的异常款项明细表.金额 > 0 && (向参股企业流出的异常款项明细表.向参股企业流出的异常款项 NOT IN 审批记录.审批文号
