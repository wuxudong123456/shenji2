    : \"第五条\",\n    \"内容概述\": \"会计机构、会计人员依照本法规定进行会计核算，实行会计监督。任何单位或者个人不得以任何方式授意、指使、强令会计机构、会计人员伪造、变造会计凭证、会计账簿和其他会计资料，提供虚假财务会计报告。\"\
    \n  },\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": "
