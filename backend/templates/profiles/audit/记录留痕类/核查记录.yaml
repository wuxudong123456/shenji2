name: audit/记录留痕类/核查记录
type: model
description: 从记录留痕类类文档（核查记录）中提取结构化元数据。涵盖字段如：实际安装型号、实际完成数量、核查结论、核查记录中实际存栏量/种植面积、现场实际完工状态、租户实际缴费金额、系统后台数据生成方式、缴费方式。文档范围包括：农业保险实地核查记录、实地核查记录、现场核查记录、项目现场核查记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 核查记录
  member_count: 1
  member_details:
  - 农业保险实地核查记录
  - 实地核查记录
  - 现场核查记录
  - 项目现场核查记录
output:
  fields:
  - name: 实际安装型号
    type: string
    description: 提取 实际安装型号 的文本值
  - name: 实际完成数量
    type: number
    description: 提取 实际完成数量 的数值（含单位，如万元、吨等）
  - name: 核查结论
    type: string
    description: 提取 核查结论 的文本值
  - name: 核查记录中实际存栏量-种植面积
    type: string
    description: 提取 核查记录中实际存栏量-种植面积 的文本值
  - name: 现场实际完工状态
    type: boolean
    description: 提取 现场实际完工状态 的布尔值（是/否）
  - name: 租户实际缴费金额
    type: number
    description: 提取 租户实际缴费金额 的数值（含单位，如万元、吨等）
  - name: 系统后台数据生成方式
    type: string
    description: 提取 系统后台数据生成方式 的文本值
  - name: 缴费方式
    type: number
    description: 提取 缴费方式 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (ABS(申报材料.单价 - 询价记录.同期同类物资/工程市场均价) / 询价记录.同期同类物资/工程市场均价 > 0.3 || 执行记录.验收数量 < 申报材料.申报数量 * 0.8) && 明细表.金额 > 0
  description: 当预算单价较市场均价偏离超过30%，或实际验收数量少于申报数量的80%时，触发疑点；虚增规模可结合工程量测绘数据进一步核实。
  audit_item: 编制虚假预算
  suspicion: 虚增项目规模或单价套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号（2014年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第九十三条第一款\",\n    \"内容概述\": \"预算支出应当真实，不得虚报项目规模、虚增单价，造成虚列支出。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条第一款\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，属于违规行为，应当追"
- expression: ((项目建设进度跟踪表.实际进度-项目建设进度跟踪表.计划进度)/项目建设进度跟踪表.计划进度<-0.3 && 项目延期申请及批复记录.批复 IS NULL) || (项目合同及补充协议.计划竣工日期 < 当前日期-180天
    && 项目验收报告.实际验收日期 IS NULL) || (项目资金使用明细表.累计支付比例>=0.8 && 项目建设进度跟踪表.实际完工比例<0.6)
  description: 进度偏差超过-30%且无合规延期批复、或竣工日期超期180天仍未验收、或资金支付比例达80%但实际进度不足60%，均属于严重进度滞后，触发违规认定。
  audit_item: 项目实施管理不到位
  suspicion: 项目建设进度慢、未按时完工或验收
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照国家有关规定和合同约定执行建设工期，不得随意压缩合理工期，项目单位应严格管理，确保项目按期建成发挥效益。\"\n  },\n  {\n    \"法规名称\": \"基本建设财务规则\"\
    ,\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十七条\",\n    \"内容概述\": \"项目单位应按照合同约定和工程进度支付工程"
- expression: (固定资产使用登记表.使用天数/固定资产使用登记表.总天数<0.2) || (设备运行维护日志.月均运行时长<30小时 && 项目投资额>100万元) || (项目效益产出对比分析表.实际产出/设计产能<0.3) ||
    (项目绩效评估报告.实际使用率-项目绩效评估报告.预期使用率<-0.4)
  description: 固定资产年使用率低于20%、高价值设备月均运行时长不足30小时、实际产出不足设计产能30%、或实际使用率低于预期40个百分点以上的，构成闲置或利用率低下。
  audit_item: 项目实施管理不到位
  suspicion: 项目建成后闲置或利用率低下
  regulation: "[\n  {\n    \"法规名称\": \"中央预算内直接投资项目管理办法\",\n    \"法规文号\": \"国家发展改革委令第7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"项目建成后不能正常运营或达不到预期效果的，项目单位应当进行整改，并追究有关责任人的责任，防止形成闲置资产。\"\n  }\n]"
- expression: (项目可行性研究报告.技术要求_CONTAINS '自动采集' OR '实时传输' OR '监测传感器') && (项目设备采购清单.设备功能 != '自动传输' || 项目设备采购清单.传感器数量 < 项目可行性研究报告.技术要求传感器数量)
    && 项目验收报告.验收结论='合格'
  description: 当可研报告明确要求具备自动采集监测传输功能，但实际采购设备达不到相应功能或传感器数量不足，且验收报告仍结论合格时，判定为未按规定配备信息自动化设备。
  audit_item: 项目实施管理不到位
  suspicion: 应配备未配备信息自动采集监测传输设备
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十二条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照批准的建设地点、建设规模和建设内容实施，拟变更建设地点或者拟对建设规模、建设内容作较大变更的，应当按照规定的程序报原审批部门审批。\"\n  }\n]"
- expression: (项目资金使用明细表.收款方名称 != 项目合同.供应商名称 && 项目资金使用明细表.收款方性质='个人') || (项目设备采购清单.验收日期 < 项目设备采购清单.发票日期) || (项目申报材料真实性核查对照表.资质伪造=TRUE)
    || (项目验收报告.验收工程量 > 项目现场核查记录.实际测量工程量*1.1)
  description: 资金去向与合同方不一致、验收日期早于发票日期（时间倒挂）、资质材料伪造、或验收工程量虚报超10%，均构成弄虚作假行为。
  audit_item: 项目实施管理不到位
  suspicion: 项目申报建设环节弄虚作假
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"单位和个人违反国家投资建设项目规定，虚报投资完成额、虚列支出、骗取财政资金的，责令改正，追回有关财政资金，并依法给予处罚。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十七条\",\n    \"内容概述\": \"供应商提供虚假材料谋取中标、成交"
- expression: 收取台账.实收金额 - 缴存凭证.缴款金额 > 0 && 差额 > 5000 OR 台账.实收金额记录为现金收取而银行未体现
  description: 比对租金收取台账记录的实收金额与上缴银行的金额是否一致；若台账记录收取现金但银行缴款记录缺失，或两者差额累计超过5000元，则存在截留或私分嫌疑。结合租户访谈确认实际缴费数额，锁定私分事实。
  audit_item: 挪用或违规使用保障性安居工程专项资金
  suspicion: 截留私分保障房租金收入
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"任何单位和个人不得截留、挤占、挪用公共租赁住房租金收入。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"\
    无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三百八十二条\",\n    \"内容概述\": \"国家工作人员利用职务便利侵吞、窃取、骗取公共财物的，构成贪污罪。\"\n  }\n]"
