name: audit/记录留痕类/查询记录
type: model
description: 从记录留痕类类文档（查询记录）中提取结构化元数据。涵盖字段如：严重违法失信名单信息、产权人、产权取得方式、任职企业名称、任职状态、企业性质、债务人、列入经营异常名录信息。文档范围包括：国家企业信用信息公示系统查询记录、房产登记系统查询记录、查询记录、法院查封/抵押查询记录、行业资质查询记录、被担保/借款方企业性质查询记录、资产抵押登记查询记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 登记
- 资产
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 查询记录
  member_count: 1
  member_details:
  - 国家企业信用信息公示系统查询记录
  - 房产登记系统查询记录
  - 查询记录
  - 法院查封/抵押查询记录
  - 行业资质查询记录
  - 被担保/借款方企业性质查询记录
  - 资产抵押登记查询记录
output:
  fields:
  - name: 严重违法失信名单信息
    type: string
    description: 提取 严重违法失信名单信息 的文本值
  - name: 产权人
    type: string
    description: 提取 产权人 的文本值
  - name: 产权取得方式
    type: string
    description: 提取 产权取得方式 的文本值
  - name: 任职企业名称
    type: string
    description: 提取 任职企业名称 的文本值
  - name: 任职状态
    type: boolean
    description: 提取 任职状态 的布尔值（是/否）
  - name: 企业性质
    type: string
    description: 提取 企业性质 的文本值
  - name: 债务人
    type: string
    description: 提取 债务人 的文本值
  - name: 列入经营异常名录信息
    type: string
    description: 提取 列入经营异常名录信息 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 实际控制人
    type: string
    description: 提取 实际控制人 的文本值
  - name: 抵押权人
    type: string
    description: 提取 抵押权人 的文本值
  - name: 抵押资产名称
    type: string
    description: 提取 抵押资产名称 的文本值
  - name: 抵押金额
    type: number
    description: 提取 抵押金额 的数值（含单位，如万元、吨等）
  - name: 担任职务
    type: string
    description: 提取 担任职务 的文本值
  - name: 是否央企
    type: boolean
    description: 提取 是否央企 的布尔值（是/否）
  - name: 登记时间
    type: date
    description: 提取 登记时间 的日期值，格式 YYYY-MM-DD
  - name: 符合资质条件的潜在投标人数量
    type: number
    description: 提取 符合资质条件的潜在投标人数量 的数值（含单位，如万元、吨等）
  - name: 行政处罚信息
    type: string
    description: 提取 行政处罚信息 的文本值
  - name: 财政部备案系统查询结果
    type: boolean
    description: 提取 财政部备案系统查询结果 的布尔值（是/否）
  - name: 资产编号
    type: string
    description: 提取 资产编号 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 限制期限
    type: string
    description: 提取 限制期限 的文本值
  - name: 限制类型
    type: string
    description: 提取 限制类型 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (变更申请记录.变更理由 == '技术复杂或特殊要求') && (符合资质条件的潜在投标人数量.符合资质条件的潜在投标人数量 >= 5) && (同类项目以往招标方式.同类项目以往招标方式 == '公开招标')
  description: 当申请变更为邀请招标的理由声称“技术复杂，仅有少量潜在投标人”，但审计查询市场显示符合资质的企业数量充足（如≥5家），且同类项目以往均采用公开招标时，判定为虚假理由。阈值5家为审计经验值，可结合具体项目实际情况调整。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 编造虚假理由骗取邀请招标批准
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十一条\",\n    \"内容概述\": \"公开招标应为原则，邀请招标仅限于特殊情况，且需履行批准手续。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\"\
    : \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"明确可以邀请招标的情形，包括技术复杂、只有少量潜在投标人可供选择等，但不得滥用该条款。\""
- expression: (财政部备案系统查询结果.财政部备案系统查询结果 == '无' || 机构名称、证券评估资质、备案编号.证券评估资质 < 业务所需资质) || (选聘方式、评委打分记录、审批文件.选聘方式 == '直接指定' &&
    选聘方式、评委打分记录、审批文件.审批文件) || (企业信用信息查询.评估机构与被审计单位存在股权关联)
  description: 判定评估机构是否具备法定资质、选聘程序是否合规以及是否存在利益冲突。机构未在财政部备案系统登记、资质不满足业务要求、未经公开选聘直接指定且无合规审批、或与被审计单位存在关联关系，均属主体不合规。
  audit_item: 违反国有资产评估相关规定
  suspicion: 国有资产评估主体不合规
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国资产评估法\",\n    \"法规文号\": \"中华人民共和国主席令第46号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十五条、第十六条\",\n    \"内容概述\": \"评估机构应当依法采用合伙或者公司形式，聘用评估专业人员开展评估业务。评估机构应当具备与评估业务范围相适应的专业人员、专业能力和风险防范能力，并依法进行备案。\"\n \
    \ },\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n   "
- expression: (资产编号、争议情况.资产编号 对应 资产编号、处置类型、处置日期、资产原值、处置收入.资产编号) || (资产编号、资产类别、原值、资产状态（查封/抵押等）、资产状态（在库/已处置）、处置日期.资产状态（查封/抵押等）
    IN ('查封','抵押') && 查封/抵押未解除) || (权属人、共有情况、他项权利.他项权利 NOT IN ('无','已解除'))
  description: 当已处置资产的权属存在争议（已在争议登记表中记录），或资产状态显示被查封、抵押等权利受限且未解除，或权属证明文件显示存在未解除的他项权利时，均构成违规处置权属不清资产。
  audit_item: 违规处置国有资产
  suspicion: 违规处置权属不清或有争议的国有资产
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"转让方应当对转让标的进行产权界定和资产评估，产权应当清晰，不存在权属纠纷。\"\n  }\n]"
- expression: (借款对象名称.企业性质 != 央企 && 借款协议 IS NOT NULL) || (担保对象/借款方.企业性质 != 央企 && 担保对象/借款方 IS NOT NULL)
  description: 根据规定，中央企业严禁向非中央企业提供资金拆借及担保（除经专项批准的政策性业务外）。若借款或担保对象的企业性质经查不属于国务院国资委监管的央企，即构成违规。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 违规向非央企企业拆借或提供担保
  regulation: "[\n  {\n    \"法规名称\": \"中央企业违规经营投资责任追究实施办法（试行）\",\n    \"法规文号\": \"国务院国资委令第37号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十三条第（七）项\",\n    \"内容概述\": \"违反规定开展资金拆借、委托贷款等金融业务，或者向非中央企业拆借资金造成损失，应当追究责任。\"\n  }\n]"
- expression: (参与企业的营业执照.经营范围 NOT LIKE '%农产品%' && 参与企业的营业执照.经营范围 NOT LIKE '%电商%') || (资质证书.有效期 < 当前审计基准日) || (国家企业信用信息公示系统查询记录.严重违法失信名单
    = '是') || (企业资质审查结果汇总表.一票否决项命中标记 = '是' && 企业资质审查结果汇总表.最终审批意见 = '是') || (合作协议.约定投资额 > 银行流水.金额 * 1.5)
  description: 营业执照经营范围不含农产品或电商相关即为不符；资质证书过期失效；存在严重失信记录却未一票否决；审查表中命中否决项但获批通过；合作协议承诺投资远超实际到位资金50%以上，表明企业履约能力存疑或虚假承诺。
  audit_item: “互联网+”农产品出村进城工程实施不到位
  suspicion: 试点参与企业不符合申报准入条件
  regulation: "[\n  {\n    \"法规名称\": \"“互联网+”农产品出村进城工程试点工作方案\",\n    \"法规文号\": \"农办市〔2020〕7号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"三、试点企业遴选条件\",\n    \"内容概述\": \"参与试点企业应为具备较强实力的农业龙头企业、电商企业或物流企业，无严重失信记录，经营范围涵盖农产品生产、加工、流通、电商等相关领域。\"\n\
    \  }\n]"
- expression: 资产抵押登记查询记录.债务人 IN ("政府融资平台","政府项目公司") && 资产抵押登记查询记录.抵押权人 == "供销合作社" && (理事会决议文件 IS NULL || 理事会决议文件.表决记录 != "通过")
    && 贷款资金用途明细.最终使用方 != "供销社自身经营"
  description: 供销社以自有资产为政府融资平台或政府项目提供抵押担保，且未经理事会同意、贷款资金也未用于自身为农服务，违反禁止规定。高风险。
  audit_item: 供销合作社综合改革不合规
  suspicion: 社有资产违规为政府融资抵押
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第三部分（十）\",\n    \"内容概述\": \"不得将社有资产纳入地方政府融资平台或用于为政府项目提供担保，确保社有资产安全完整。\"\n  }\n]"
- expression: COUNT(查询记录.任职企业名称 FOR EACH 查询记录.担任职务) > 1 && 查询记录.任职企业名称 IN (其他合作社列表) && 查询记录.任职状态 == '在业'
  description: 理事长在同一期间在其他合作社担任监事、理事等职务，且该合作社处于在业状态，即判定为违规兼职。通过人员姓名、身份证号跨企业比对。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 理事长违规在其他合作社兼职
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n   \
    \ \"条款号\": \"第三十七条\",\n    \"内容概述\": \"农民专业合作社的理事长、理事、经理不得兼任业务性质相同的其他农民专业合作社的理事长、理事、监事、经理。\"\n  }\n]"
- expression: (分配套数、单套售价、分配人姓名、身份证号、房屋编号.身份证号 NOT IN 姓名、身份证号、经审核的集资人名单.身份证号) || (分配对象姓名.签约方为外部自然人或企业且合同价格 ≥ 同期同地段商品房市场价 *
    0.9) || (利润分成条款、委托开发约定中存在“利润分成”或“按比例分配物业”等商业开发条款)
  description: 表现包括将房屋分配给非集资人员、按商品房市场价格对外销售、或与开发商签订具有商业开发性质的分成协议。若出现前述任何情况，即构成违规。价格阈值以低于市场价90%作为疑似异常（变相商品房高价销售），同时合作条款包含利润分成即直接判定。
  audit_item: 违规集资合作建房
  suspicion: 以集资合作建房名义变相实施住房实物分配或商品房开发
  regulation: "[\n  {\n    \"法规名称\": \"经济适用住房管理办法\",\n    \"法规文号\": \"建住房〔2007〕258号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条、第三十二条\",\n    \"内容概述\": \"经济适用住房购房人拥有有限产权，购买不满5年不得直接上市交易；严禁以建设经济适用住房名义变相进行商品房开发，不得将经济适用住房作为福利实物分配。\"\n  }\n]"
