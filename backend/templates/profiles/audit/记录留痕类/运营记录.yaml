name: audit/记录留痕类/运营记录
type: model
description: 从记录留痕类类文档（运营记录）中提取结构化元数据。涵盖字段如：是否提供电商代购代销服务、服务功能列表、站点编号。文档范围包括：村级信息服务站运营记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 运营记录
  member_count: 1
  member_details:
  - 村级信息服务站运营记录
output:
  fields:
  - name: 是否提供电商代购代销服务
    type: boolean
    description: 提取 是否提供电商代购代销服务 的布尔值（是/否）
  - name: 服务功能列表
    type: string
    description: 提取 服务功能列表 的文本值
  - name: 站点编号
    type: string
    description: 提取 站点编号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (方案中协同条款、资源整合内容、站点共建表述.站点共建表述 NOT IN ("协同共建", "数据互通", "站点复用")) OR (站点ID、地理位置、功能重合度、数据互通状态.功能重合度 < 0.3) OR (设备名称、使用时间、用途分类（电商/信息/其他）.用途分类（电商/信息/其他）
    < 0.2) OR (站点编号、服务功能列表、是否提供电商代购代销服务.是否提供电商代购代销服务 = '无')
  description: 工程实施方案若无协同表述，表明顶层设计未整合；两工程实际功能重合站点比例低于30%视为严重割裂；信息设备用于电商的比例低于20%说明设备未赋能电商；信息服务站从未开展电商服务可直接判定未结合。以上条件满足其一即触发疑点。
  audit_item: 农村电子商务发展不到位
  suspicion: 电子商务进农村与信息进村入户工程未有效整合
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于促进农村电子商务加快发展的指导意见\",\n    \"法规文号\": \"国办发〔2015〕78号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三（四）\",\n    \"内容概述\": \"促进农村电子商务与信息进村入户工程有机结合，推动资源整合和信息互通。\"\n  }\n]"
