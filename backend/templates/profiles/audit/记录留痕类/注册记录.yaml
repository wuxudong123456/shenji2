name: audit/记录留痕类/注册记录
type: model
description: 从记录留痕类类文档（注册记录）中提取结构化元数据。涵盖字段如：姓名、执业证书编号、有效期、注册状态、身份证号。文档范围包括：乡村医生执业资格注册记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 注册记录
  member_count: 1
  member_details:
  - 乡村医生执业资格注册记录
output:
  fields:
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 执业证书编号
    type: string
    description: 提取 执业证书编号 的文本值
  - name: 有效期
    type: string
    description: 提取 有效期 的文本值
  - name: 注册状态
    type: boolean
    description: 提取 注册状态 的布尔值（是/否）
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
