name: audit/记录留痕类/巡查记录
type: model
description: 从记录留痕类类文档（巡查记录）中提取结构化元数据。涵盖字段如：巡查人员、巡查发现的问题、巡查日期、整改记录。文档范围包括：现场管护巡查记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 整改
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 巡查记录
  member_count: 1
  member_details:
  - 现场管护巡查记录
output:
  fields:
  - name: 巡查人员
    type: string
    description: 提取 巡查人员 的文本值
  - name: 巡查发现的问题
    type: string
    description: 提取 巡查发现的问题 的文本值
  - name: 巡查日期
    type: date
    description: 提取 巡查日期 的日期值，格式 YYYY-MM-DD
  - name: 整改记录
    type: string
    description: 提取 整改记录 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (巡查记录.巡查发现的问题 < 规定巡查频率（如每周/每月）.规定巡查频率（如每周/每月）*0.5) || (保养记录表.最近一次维保日期 < 当前日期-保养周期*1.5) || (比对表.显示设施完好变化 > 项目总面积的15%)
  description: 巡查次数未达到制度规定的一半，或设备超过1.5个保养周期未维护，或从卫星影像分析设施损毁面积超过15%，即认定管护不到位。若管护资金被挪用则加重违规性质。
  audit_item: 水产养殖补助项目建设运营管护不合规
  suspicion: 水产养殖补助项目后期管护严重缺位
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2020〕4号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"地方各级财政部门和项目主管部门应当加强专项转移支付资金的管理和监督，确保资金安全、规范、有效使用，不得截留、挤占、挪用。\"\n  },\n  {\n    \"法规名称\"\
    : \"项目单位内部管护制度\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"制度相关规定\",\n    \"内容概述\": \"项目单位应建立长效管护机制，明确"
