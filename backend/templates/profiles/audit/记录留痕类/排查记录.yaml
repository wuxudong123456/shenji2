name: audit/记录留痕类/排查记录
type: model
description: 从记录留痕类类文档（排查记录）中提取结构化元数据。涵盖字段如：周边企业排污许可、排污口位置。文档范围包括：污染源排查记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 排查记录
  member_count: 1
  member_details:
  - 污染源排查记录
output:
  fields:
  - name: 周边企业排污许可
    type: string
    description: 提取 周边企业排污许可 的文本值
  - name: 排污口位置
    type: string
    description: 提取 排污口位置 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (采样点位坐标.重金属/污染物指标 > 国家土壤环境质量标准限值) && (周边企业排污许可.整改情况 = '未落实整改') || (地块现状影像.异常堆放斑块 = '存在倾倒垃圾' && 投诉内容.投诉内容 = '存在倾倒垃圾'
    && 违法排污案件处罚决定书.违法排污案件处罚决定书 = '无')
  description: 环境监测报告重金属或有机污染物超标，或影像/投诉反映明显倾倒垃圾，且无有效执法或整改记录，均构成违规。土壤质量标准参照GB 15618。
  audit_item: 违反高标农田建后管护及使用规定的行为
  suspicion: 向高标准农田倾倒污水垃圾
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土壤污染防治法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十八条\"\
    ,\n    \"内容概述\": \"禁止向农用地排放重金属或者其他有毒有害物质含量超标的污水、污泥，以及可能造成土壤污染的清淤底泥、尾矿、矿渣等。\"\n  },\n  {\n    \"法规名称\": \"基本农田保护条例\",\n\
    \    \"法规文号\": \"国务院令第257号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十九条\",\n    \"内容概述\": \"在基本农田保护区周围不得新建产生污染的建设项目；对已有污染"
