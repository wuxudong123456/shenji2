name: audit/记录留痕类/生产记录
type: model
description: 从记录留痕类类文档（生产记录）中提取结构化元数据。涵盖字段如：产品产出时间、首次投产日期。文档范围包括：生产记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 生产记录
  member_count: 1
  member_details:
  - 生产记录
output:
  fields:
  - name: 产品产出时间
    type: date
    description: 提取 产品产出时间 的日期值，格式 YYYY-MM-DD
  - name: 首次投产日期
    type: date
    description: 提取 首次投产日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (验收结论及问题记录.竣工验收合格日期 IS NOT NULL && 工程台账.转固日期 IS NULL) || (DATEDIFF(工程台账.转固日期, 验收结论及问题记录.竣工验收合格日期) > 90) || (生产记录.首次投产日期
    < 工程台账.转固日期)
  description: 工程已验收合格或已实际投产，但迟迟未转固，延迟超过90天或未转固，即存在通过推迟折旧调节利润的嫌疑。
  audit_item: 未按规定核算资产
  suspicion: 在建工程达到预定可使用状态后未及时转固
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第4号——固定资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"自行建造的固定资产，按照建造该项资产达到预定可使用状态前所发生的必要支出构成入账价值。\"\n  }\n]"
