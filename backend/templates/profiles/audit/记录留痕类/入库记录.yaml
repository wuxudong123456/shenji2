name: audit/记录留痕类/入库记录
type: model
description: 从记录留痕类类文档（入库记录）中提取结构化元数据。涵盖字段如：农药名称、出入库单号、数量、日期、规格、领用数量。文档范围包括：农药出入库记录、出入库记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 入库记录
  member_count: 1
  member_details:
  - 农药出入库记录
  - 出入库记录
output:
  fields:
  - name: 农药名称
    type: string
    description: 提取 农药名称 的文本值
  - name: 出入库单号
    type: string
    description: 提取 出入库单号 的文本值
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 日期
    type: date
    description: 提取 日期 的日期值，格式 YYYY-MM-DD
  - name: 规格
    type: string
    description: 提取 规格 的文本值
  - name: 领用数量
    type: number
    description: 提取 领用数量 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (明细账.期末数量 - 盘点报告.实盘数量) > (盘点报告.实盘数量 * 0.1)
  description: 账面期末数量超过实际盘点数量10%且无合理理由，或账上同一批次存货在多个仓位重复记载，疑为虚增。
  audit_item: 未按规定核算资产
  suspicion: 重复计算存货虚增库存
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第81号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"公司、企业进行会计核算不得虚列、多列、不列或者少列资产。\"\n  }\n]"
