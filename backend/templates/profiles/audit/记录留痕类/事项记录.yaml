name: audit/记录留痕类/事项记录
type: model
description: 从记录留痕类类文档（事项记录）中提取结构化元数据。涵盖字段如：调整事项说明。文档范围包括：审计调整事项记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 事项记录
  member_count: 1
  member_details:
  - 审计调整事项记录
output:
  fields:
  - name: 调整事项说明
    type: string
    description: 提取 调整事项说明 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (库存现金实存数.库存现金实存数 != 余额表.现金期末余额) || (银行对账单.期末余额 != 余额表.银行存款期末余额 && 未编制有效调节表) || (银行对账单.调节后余额 != 余额表.银行存款期末余额
    && 无审计调整说明)
  description: 现金盘点实存数与账面不一致，或银行对账单余额与账面银行存款不一致，且未能提供调节表或调节后仍有差异，且无合理审计调整说明，视为账实不符且未查明原因。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 货币资金账实不符且未查明原因
  regulation: "[\n  {\n    \"法规名称\": \"《会计基础工作规范》\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十二条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证账实相符。\"\n  }\n]"
