name: audit/记录留痕类/殡葬记录
type: model
description: 从记录留痕类类文档（殡葬记录）中提取结构化元数据。涵盖字段如：火化日期、逝者身份证号。文档范围包括：民政殡葬记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 殡葬记录
  member_count: 1
  member_details:
  - 民政殡葬记录
output:
  fields:
  - name: 火化日期
    type: date
    description: 提取 火化日期 的日期值，格式 YYYY-MM-DD
  - name: 逝者身份证号
    type: string
    description: 提取 逝者身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (发放明细表.发放日期 > 注销人员数据.死亡日期（注销日期）) && (发放明细表.领取人身份证号 = 注销人员数据.注销人员身份证号)
  description: 若某保障对象在户籍注销或殡葬记录中的死亡日期之后，仍存在待遇发放记录，即判定为死亡后违规继续领取。死亡日期与发放日期相等视为当天发放后死亡，只保留死亡后月末发放等合理延迟。
  audit_item: 向不符合条件的人员发放保障待遇
  suspicion: 死亡人员家属未及时申报仍继续领取社保待遇
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国社会保险法》\",\n    \"法规文号\": \"中华人民共和国主席令第三十五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"参加基本养老保险的个人，因病或者非因工死亡的，其遗属可以领取丧葬补助金和抚恤金；个人死亡的，个人账户余额可以继承，从死亡次月起停发养老待遇。\"\n  }\n]"
