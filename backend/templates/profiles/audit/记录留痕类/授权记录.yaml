name: audit/记录留痕类/授权记录
type: model
description: 从记录留痕类类文档（授权记录）中提取结构化元数据。涵盖字段如：审批人、审批日期、审批权限级别、授权人、授权期限、授权金额上限、被授权人。文档范围包括：授权记录、资金调拨授权记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 审批
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 授权记录
  member_count: 1
  member_details:
  - 授权记录
  - 资金调拨授权记录
output:
  fields:
  - name: 审批人
    type: string
    description: 提取 审批人 的文本值
  - name: 审批日期
    type: date
    description: 提取 审批日期 的日期值，格式 YYYY-MM-DD
  - name: 审批权限级别
    type: string
    description: 提取 审批权限级别 的文本值
  - name: 授权人
    type: string
    description: 提取 授权人 的文本值
  - name: 授权期限
    type: string
    description: 提取 授权期限 的文本值
  - name: 授权金额上限
    type: number
    description: 提取 授权金额上限 的数值（含单位，如万元、吨等）
  - name: 被授权人
    type: string
    description: 提取 被授权人 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (审批文件.审批日期 > 户对账单.实际划款日期) OR (审批文件.审批权限级别 IS NULL OR 审批文件.审批权限级别 < 授权记录.授权金额上限) OR (审批文件.审批人不在授权记录.授权人中)
  description: 审批日期晚于资金实际划出日期（倒签审批），或审批人无相应金额审批权限（越权），或审批人未被授权，均属违规。
  audit_item: 挪用住房公积金
  suspicion: 住房公积金资金调拨审批流程违规
  regulation: "[\n  {\n    \"法规名称\": \"行政事业单位内部控制规范（试行）\",\n    \"法规文号\": \"财会[2012]21号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"单位应当建立健全授权批准控制制度，明确各岗位办理业务和事项的权限范围、审批程序和相应责任。\"\n  }\n]"
