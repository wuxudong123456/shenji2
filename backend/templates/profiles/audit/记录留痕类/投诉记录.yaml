  - name: 停电投诉次数
    type: string
    description: 提取 停电投诉次数 的文本值
  - name: 分配不公反映
    type: string
    description: 提取 分配不公反映 的文本值
  - name: 处理回复
    type: string
    description: 提取 处理回复 的文本值
  - name: 处理情况
    type: string
    description: 提取 处理情况 的文本值
  - name: 处理签批
