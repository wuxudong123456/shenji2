    required: false
violations:
- expression: (技术参数明细.技术参数明细 = 空 OR 技术参数明细.技术参数明细 仅包含‘符合行业标准’‘满足使用需求’等模糊措辞 OR 技术参数明细.技术参数明细 未包含任何具体数值和计量单位) || (评审因素与评审标准（含价格分计算公式）.评审因素与评审标准（含价格分计算公式）
    = 空 OR 评审因素与评审标准（含价格分计算公式）.评审因素与评审标准（含价格分计算公式） 未公开价格分权重、评分公式等任一客观量化标准) || (涉及资格条件、技术参数、评分标准的限制性条款.涉及资格条件、技术参数、评分标准的限制性条款
    = 是 AND 采购文件.对应条款公开 = 否)
  description: 技术参数明细为空或仅含模糊表述，即属于未依法公开具体技术标准；评审标准中如未完整披露价格分计算细节、权重分配等，视为未公开评审标准；通过比对内部决策文件与公开采购文件，发现存在倾向性条款但未在公开文件中载明的，认定为隐匿采购标准。以上任一条件满足即触发疑点。
  audit_item: 未公开政府采购标准和采购结果
  suspicion: 采购人未依法公布政府采购项目的采购标准
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"招标文件应当包括采购项目的商务条件、采购需求、投标人的资格条件、投标报价要求、评标方法、评标标准以及拟签订的合同文本等，采购标准未在招标文件中全面载明即属违法。\"\n\
    \  }\n]"
- expression: (应付账款账龄.应付账款账龄 > 365 AND 应付账款账龄.应付金额 > 0) AND ((货币资金余额.货币资金余额 + 货币资金余额.交易性金融资产) / 货币资金余额.流动负债 > 1)
  description: 筛选账龄超过1年的应付账款，同时计算大型企业的现金比率。若现金比率大于1，说明企业具有较强的即期支付能力，此时仍长期拖欠中小企业款项，高度指向利用优势地位恶意拖欠。
  audit_item: 违规收费-拖欠工程款和农民工工资
  suspicion: 大型企业利用优势地位长期拖欠中小企业账款
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"大型企业从中小企业采购货物、工程、服务，应当合理约定付款期限并及时支付款项，不得利用优势地位强迫中小企业接受不合理的付款期限、方式或变相延长付款期限。\"\n  }\n]"
- expression: DATEDIFF(DAY, MAX(三会会议记录表.召开日期), CURRENT_DATE) > 365 || COUNT(三会会议记录表.会议类型='监事会') = 0
  description: 社员代表大会每年至少召开一次，监事会必须存在并保留独立监督记录。最近一次代表大会距今超过365天或没有任何监事会会议记录即构成违规。
  audit_item: 供销合作社基层社改造不到位
  suspicion: 三会制度不健全或未落实
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"二、拓展经营服务领域，强化为农服务（三）加强基层社建设\",\n    \"内容概述\": \"建立健全社员代表大会、理事会、监事会制度，实行民主管理、民主监督，完善治理结构。\"\n  }\n]"
- expression: (SUM(分配明细表.社员分红金额) / SUM(分配明细表.可分配盈余总额) < 0.6) || (分配制度文件.按交易额返利条款 IS NULL) || (分配明细表.管理层分红金额 / 分配明细表.可分配盈余总额
    > 0.4)
  description: 农民社员分红应不低于可分配盈余的60%，制度中必须规定按交易额返利，管理层分红占比超过40%视为侵占社员利益。满足任一条件即触犯疑点。
  audit_item: 供销合作社基层社改造不到位
  suspicion: 未建立或未规范落实利益分配制度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"二、拓展经营服务领域，强化为农服务（三）加强基层社建设\",\n    \"内容概述\": \"坚持按交易额返利和按股分红相结合，保障农民社员收益，构建与农民的利益联结机制。\"\n  }\n]"
- expression: (SIZE(上级任务通知文件.规定应提供的便民服务项目集 - 服务项目清单.实际服务项目列表) > 0) OR (村民满意度调查汇总表.分项服务投诉率 > 0.2) OR (FOR 某项规定服务 IN 上级任务通知文件.规定应提供的便民服务项目集,
    服务项目清单中连续3个月服务次数 = 0)
  description: 政策要求的关键便民服务项目存在未开列缺失，或者已设置项目但投诉率长期高于20%，或连续3个月无服务记录，均视为服务实质性缺失。
  audit_item: 信息进村入户、电子商务进农村等村级服务站使用效果不佳
  suspicion: 村级服务站未按政策要求提供规定便民服务项目
  regulation: "[\n  {\n    \"法规名称\": \"农业部关于全面推进信息进村入户工程的通知\",\n    \"法规文号\": \"农计发〔2017〕6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"二（三）\",\n    \"内容概述\": \"村级信息服务站应按照要求提供公益服务、便民服务、电子商务服务和培训体验服务，保障基础服务项目全覆盖。\"\n  }\n]"
- expression: ([统计表].各区域实际供电可靠率 < [目标供电可靠率、任务完成时间节点、考核标准、目标综合电压合格率、任务完成时间、考核办法、户均配变容量目标值、完成时限、农牧区全覆盖目标、通电标准].目标供电可靠率) && (当前日期
    > [目标供电可靠率、任务完成时间节点、考核标准、目标综合电压合格率、任务完成时间、考核办法、户均配变容量目标值、完成时限、农牧区全覆盖目标、通电标准].任务完成时间节点)
  description: 实际供电可靠率低于政府或计划文件设定的目标值，且任务完成时间节点已过，即判定为未按期实现任务目标。若实际值低于目标值超过0.5个百分点，可视为严重未达标，需重点核查原因。
  audit_item: 农村电网改造升级任务目标未完成
  suspicion: 供电可靠率未按期实现任务目标
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2013〕678号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十三条\",\n    \"内容概述\": \"项目法人单位应严格按照规划确定的建设目标、任务和时限要求组织实施，确保按期完成农村电网改造升级任务，实现规定的供电可靠率和电压合格率等指标。\"\n  },\n\
    \  {\n    \"法规名称\": \"供电监管办法\",\n    \"法规文号\": \"国家电力监管委员会令第27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条\",\n\
    \    \"内容概述"
- expression: ([报告表].独立检测的电压合格率 < [目标供电可靠率].目标综合电压合格率) && (当前日期 > [目标供电可靠率].任务完成时间节点)
  description: 监测数据表的实际综合电压合格率低于实施方案规定的目标值，且已超过政府限定的任务完成时限，即判定为未完成。若低于目标值3个百分点以上，或末端用户电压偏差超过国家允许范围（如低于198V），可视为严重违规。
  audit_item: 农村电网改造升级任务目标未完成
  suspicion: 综合电压合格率未按期实现任务目标
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2013〕678号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十三条\",\n    \"内容概述\": \"项目应实现规定的电压合格率等电能质量指标，未达标的应分析原因并限期整改。\"\n  },\n  {\n    \"法规名称\": \"供电监管办法\",\n\
    \    \"法规文号\": \"国家电力监管委员会令第27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条、第十二条\",\n    \"内容概述\": \"供电企业应当保证供电电压质量符合国家标准，发现电压"
- expression: (登记表.回收量 / 使用量 < 0.80) || (记录表.残留量（kg/亩） > 1.5) || (发放文件.回收量（kg） > 登记表.使用量 * 1.2)
  description: 根据管理要求，农膜使用者应在使用期限届满前捡拾废旧农膜。审计设定回收率低于80%或田间残留检测超标（如>1.5 kg/亩）为可疑，补贴发放的回收量若显著超出理论使用量（如超出20%），可能存在虚报。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 农膜使用者未捡拾田间非全生物降解农膜废弃物
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"农用薄膜使用者应当在使用期限届满前捡拾田间的非全生物降解农用薄膜废弃物，交至回收网点或回收工作者，不得随意弃置、掩埋或者焚烧。\"\
    \n  }\n]"
- expression: (联单记录.收货方 不在 合规处置企业名录) || (联单台账.最终处置方式（再生/填埋/焚烧） != '资源化利用' && 联单台账.最终处置方式（再生/填埋/焚烧） != '卫生填埋') || (监测报告.二噁英浓度
    > 0.5 ng TEQ/Nm³) || (决定书.违规事实 包含 '焚烧' || '掩埋' || '弃置') || (投诉记录.投诉内容 包含 '烧膜' || '埋膜' || '乱倒' )
  description: 合规处置企业名录由回收协议确定。非资源化利用或卫生填埋的，可能为非法处置；二噁英超标参照《危险废物焚烧污染控制标准》中限值（0.5ng TEQ/Nm³）；其他字段通过关键文本匹配判定。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 随意弃置、掩埋或者焚烧废旧农膜
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"农用薄膜使用者应当在使用期限届满前捡拾田间的非全生物降解农用薄膜废弃物，交至回收网点或回收工作者，不得随意弃置、掩埋或者焚烧。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十条\","
- expression: (维护项目.响应时间 > 7天) || (维护项目.完成状态 < 90%) || (验收报告.整改闭环情况 < 70%) || (维修项目.修复日期 > 365天)
