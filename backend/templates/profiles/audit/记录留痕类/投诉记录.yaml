name: audit/记录留痕类/投诉记录
type: model
description: 从记录留痕类类文档（投诉记录）中提取结构化元数据。涵盖字段如：举报内容、举报日期、停电投诉次数、分配不公反映、处理回复、处理情况、处理签批、处理结果。文档范围包括：12345投诉记录、供应商投诉记录、农户投诉记录、客户投诉记录、投诉记录、拖欠账款投诉记录、政务热线投诉记录、未及时受理的投诉记录、用户投诉记录、畜禽养殖污染投诉记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 补贴
- 采购
- 金额
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 投诉记录
  member_count: 1
  member_details:
  - 12345投诉记录
  - 供应商投诉记录
  - 农户投诉记录
  - 客户投诉记录
  - 投诉记录
  - 拖欠账款投诉记录
  - 政务热线投诉记录
  - 未及时受理的投诉记录
  - 用户投诉记录
  - 畜禽养殖污染投诉记录
  - 社员投诉记录
  - 群众举报投诉记录
