name: audit/记录留痕类/暗访记录
type: model
description: 从记录留痕类类文档（暗访记录）中提取结构化元数据。涵盖字段如：实际公示位置和内容完整度、实际开放时刻、实际收取费用、收费行为记录。文档范围包括：现场暗访记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 暗访记录
  member_count: 1
  member_details:
  - 现场暗访记录
output:
  fields:
  - name: 实际公示位置和内容完整度
    type: string
    description: 提取 实际公示位置和内容完整度 的文本值
  - name: 实际开放时刻
    type: string
    description: 提取 实际开放时刻 的文本值
  - name: 实际收取费用
    type: number
    description: 提取 实际收取费用 的数值（含单位，如万元、吨等）
  - name: 收费行为记录
    type: number
    description: 提取 收费行为记录 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 公示记录表.是否悬挂公示牌 = '否' || 现场暗访记录.实际公示位置和内容完整度 < 0.7 || (现场暗访记录.实际收取费用 - 医保目录价格.诊疗项目定价) != 0
  description: 公示是基本要求，无公示牌或内容缺失即违规；实际收费与公示不符属于价格欺诈疑点。>30%药品无价格判定为公示不全。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 村卫生室未按规定公示医疗服务及药品价格
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国价格法\",\n    \"法规文号\": \"主席令第九十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十三条\",\n    \"内容概述\": \"经营者销售、收购商品和提供服务，应当按照政府价格主管部门的规定明码标价。\"\n  },\n  {\n    \"法规名称\": \"医疗卫生机构信息公开管理办法\",\n    \"\
    法规文号\": \"国家卫生健康委员会令第43号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条、第十三条\",\n    \"内容概述\": \"医疗卫生机构应当主动公开药品价格、医疗服务项目价格等信息，并在"
- expression: (每日开放时间、值班人员.收费项目 存在 && 公示开放时间、免费服务项目 无对应法定收费依据) || (每日开放时间、值班人员.金额 > 0 && 每日开放时间、值班人员.票据号 为空) || (实际公示位置和内容完整度、实际收取费用、实际开放时刻、收费行为记录
    显示实际开放日时长 < 公示开放时间、免费服务项目.公示开放时间 * 0.8) || (公示开放时间、免费服务项目 缺失 明确开放时间或未在显著位置公示)
  description: 出现未经公示的收费项目、收费无正规票据，或实际开放时长低于公告时长80%，或未按规定公示开放时间，均视为违规。
  audit_item: 文化馆（站）等建设运营管护不合规
  suspicion: 文化站违规收费或开放时间不固定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公共文化服务保障法\",\n    \"法规文号\": \"主席令第六十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十一条\",\n    \"内容概述\": \"公共文化设施应当根据其功能、特点，按照国家有关规定，向公众免费或者优惠开放；收费项目应当有法律法规依据并公示。\"\n  },\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\"\
    ,\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条、第十六条\",\n    \"内容概述\": \"文化站应规定开放时间并在显著"
