name: audit/记录留痕类/更新记录
type: model
description: 从记录留痕类类文档（更新记录）中提取结构化元数据。涵盖字段如：变更后预计总成本、变更日期、最后更新时间、水体名称、治理状态。文档范围包括：预计总成本更新记录、黑臭水体治理台账更新记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 更新记录
  member_count: 1
  member_details:
  - 预计总成本更新记录
  - 黑臭水体治理台账更新记录
output:
  fields:
  - name: 变更后预计总成本
    type: string
    description: 提取 变更后预计总成本 的文本值
  - name: 变更日期
    type: date
    description: 提取 变更日期 的日期值，格式 YYYY-MM-DD
  - name: 最后更新时间
    type: date
    description: 提取 最后更新时间 的日期值，格式 YYYY-MM-DD
  - name: 水体名称
    type: string
    description: 提取 水体名称 的文本值
  - name: 治理状态
    type: boolean
    description: 提取 治理状态 的布尔值（是/否）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 累计实际发生成本预计合同总成本完工百分比.完工百分比 != ROUND(累计实际发生成本预计合同总成本完工百分比.累计实际发生成本 / 累计实际发生成本预计合同总成本完工百分比.预计合同总成本, 2) && ABS(累计实际发生成本预计合同总成本完工百分比.完工百分比
    - 测完进度百分比测算方法测算方法及结果.测完进度百分比) > 0.05 && 科目余额差额.科目余额差额
  description: 企业实际发生的累计成本占预计总成本的比例与账面确认的完工进度偏差超过5%，导致收入与成本不配比。
  audit_item: 未按规定确认收入
  suspicion: 未按完工进度及时确认建造合同收入并结转成本
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第15号——建造合同\",\n    \"法规文号\": \"财会[2006]3号（部分有效）\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十八条\",\n    \"内容概述\": \"在建造合同的结果能够可靠估计的情况下，企业应在资产负债表日按完工百分比法确认合同收入和合同费用。\"\n  }\n]"
- expression: (记录留痕类.污染源描述 IS NULL || 记录留痕类.治理措施 IS NULL || 记录留痕类.责任单位 IS NULL) && (记录留痕类.最后更新时间 < 数据表.监测时间 || 拨付凭证.拨付日期 >
    记录留痕类.最后更新时间)
  description: 表达式前半段判断台账完整性，即必填核心字段（污染源、治理措施、责任单位）是否存在缺失；后半段判断动态更新逻辑，即台账最后更新时间是否早于最新水质监测时间（治理后应更新）或早于资金拨付时间（拨付后应有记录）。两部分为“且”条件，同时满足表示台账管理存在严重缺失。
  audit_item: 农村黑臭水体治理不到位
  suspicion: 治理台账要素不全且未动态更新
  regulation: "[\n  {\n    \"法规名称\": \"农村黑臭水体治理工作指南\",\n    \"法规文号\": \"环办土壤〔2019〕826号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"地方各级生态环境部门要建立农村黑臭水体治理台账，实行‘拉条挂账、逐一销号’，台账应包括水体基本信息、污染成因、治理措施、治理成效、责任单位等内容，并根据治理进展情况实行动态更新。\"\
    \n  }\n]"
