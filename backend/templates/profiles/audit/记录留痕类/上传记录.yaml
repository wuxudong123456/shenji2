name: audit/记录留痕类/上传记录
type: model
description: 从记录留痕类类文档（上传记录）中提取结构化元数据。涵盖字段如：平台接收时间、数据内容散列值、经营单位名称。文档范围包括：农药管理信息平台数据上传记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 上传记录
  member_count: 1
  member_details:
  - 农药管理信息平台数据上传记录
output:
  fields:
  - name: 平台接收时间
    type: date
    description: 提取 平台接收时间 的日期值，格式 YYYY-MM-DD
  - name: 数据内容散列值
    type: string
    description: 提取 数据内容散列值 的文本值
  - name: 经营单位名称
    type: string
    description: 提取 经营单位名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 销售台账.销售日期 < 当前日期 - 72小时 && (上传记录.平台接收时间 IS NULL || 上传时间.数据条数 < 销售台账.销售条目数*0.95)
  description: 按规定农药经营者应在销售后72小时内上传数据。若销售台账有记录但上传日志中无对应时间上传记录,或上传数据量明显少于同期销售条目数(如低于95%),则判定未按要求上传或选择性上传。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 农药经营者未上传经营数据至管理信息平台
  regulation: "[\n  {\n    \"法规名称\": \"《农药经营许可管理办法》\",\n    \"法规文号\": \"农业部令2017年第5号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"农药经营者应当将农药经营数据实时或按照农业主管部门规定的时限上传至农药管理信息平台,确保数据完整真实。\"\n  }\n]"
