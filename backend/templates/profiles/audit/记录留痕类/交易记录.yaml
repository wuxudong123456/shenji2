name: audit/记录留痕类/交易记录
type: model
description: 从记录留痕类类文档（交易记录）中提取结构化元数据。涵盖字段如：交易对手方名称、交易金额、付款条件、供应商、到账日期、成交金额、拨付农户日期、涉及功能模块。文档范围包括：乡镇财政所账户交易记录、对方交易记录、异常交易记录、政府采购平台交易记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 付款
- 采购
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 交易记录
  member_count: 1
  member_details:
  - 乡镇财政所账户交易记录
  - 对方交易记录
  - 异常交易记录
  - 政府采购平台交易记录
output:
  fields:
  - name: 交易对手方名称
    type: string
    description: 提取 交易对手方名称 的文本值
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款条件
    type: number
    description: 提取 付款条件 的数值（含单位，如万元、吨等）
  - name: 供应商
    type: string
    description: 提取 供应商 的文本值
  - name: 到账日期
    type: date
    description: 提取 到账日期 的日期值，格式 YYYY-MM-DD
  - name: 成交金额
    type: number
    description: 提取 成交金额 的数值（含单位，如万元、吨等）
  - name: 拨付农户日期
    type: date
    description: 提取 拨付农户日期 的日期值，格式 YYYY-MM-DD
  - name: 涉及功能模块
    type: string
    description: 提取 涉及功能模块 的文本值
  - name: 涉及商家商品
    type: string
    description: 提取 涉及商家商品 的文本值
  - name: 采购方式
    type: string
    description: 提取 采购方式 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (亲属姓名.关联企业 IN (交易记录.交易对手方名称)) && (亲属姓名.关联企业 IN (交易记录.交易对手方名称)) && (合同协议类-销售合同-合同相对方 > 1000000 || 交易记录.付款条件 >
    交易记录.付款条件)
  description: 筛查两家或多家国企领导之间互相照顾对方亲属企业的业务，形成利益互换。以累计采购额100万元或付款条件异常优惠为初步阈值。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 领导人员相互为对方特定关系人提供经营便利
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第四项\",\n    \"内容概述\": \"不得利用职权相互为对方及其配偶、子女和其他特定关系人从事营利性经营活动提供便利条件。\"\n  }\n]"
- expression: (对照表.实际拨付农户日期-对照表.资金到账日期>30) && (流程文件.延期审批单==null || 流程文件.审批结果!="同意延期")
  description: 资金到达财政、主管部门或乡镇账户后，超过30天未拨付至下一环节或受益农户，且无合规的延期审批手续，视为资金滞留。30天阈值依据常见管理要求设定，可根据实际制度调整；超过60天且金额较大为高风险。
  audit_item: 惠农财政补贴资金滞留、闲置
  suspicion: 补贴资金滞留在财政、业务主管部门或乡镇账户
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\"\
    ,\n    \"内容概述\": \"各级政府财政部门必须依照法律、行政法规和国务院财政部门的规定，及时、足额地拨付预算支出资金，加强对预算支出的管理和监督。\"\n  },\n  {\n    \"法规名称\": \"惠农财政补贴资金管理办法及实施细则\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第X条（假设）\",\n    \"内容概述\": \"明确资金拨付各环节时限要求，超过时限需提交延期说"
- expression: 采购方式 == '单一来源采购' && (审批文件.专家论证意见 == NULL || 审批文件.唯一性证明材料 == NULL || 供应商数量 >= 2)
  description: 对于采用单一来源方式采购的项目，必须审查是否附有合规的专家论证意见及能证明技术或渠道唯一性的客观材料。若缺乏上述任一文件，或市场调研发现存在2家及以上潜在合格供应商，则触发违规疑点。
  audit_item: 违规采购彩票设备和技术服务
  suspicion: 单一来源采购论证不充分
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第 68 号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第三十一条\",\n    \"内容概述\": \"符合单一来源采购情形（只能从唯一供应商处采购；发生了不可预见的紧急情况；必须保证原有项目一致性或服务配套）之一的，可以依法采用单一来源方式采购。\"\n  },\n  {\n\
    \    \"法规名称\": \"政府采购非招标采购方式管理办法\",\n    \"法规文号\": \"财政部令第 74 号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十八条\",\n\
    \    \"内容概述\""
