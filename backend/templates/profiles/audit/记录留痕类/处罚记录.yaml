name: audit/记录留痕类/处罚记录
type: model
description: 从记录留痕类类文档（处罚记录）中提取结构化元数据。涵盖字段如：处罚内容、处罚结果、案件类型、涉案主体、违法占地位置、违法行为、面积。文档范围包括：整改处罚记录、渔政执法部门处罚记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 处罚记录
  member_count: 1
  member_details:
  - 整改处罚记录
  - 渔政执法部门处罚记录
output:
  fields:
  - name: 处罚内容
    type: string
    description: 提取 处罚内容 的文本值
  - name: 处罚结果
    type: boolean
    description: 提取 处罚结果 的布尔值（是/否）
  - name: 案件类型
    type: string
    description: 提取 案件类型 的文本值
  - name: 涉案主体
    type: string
    description: 提取 涉案主体 的文本值
  - name: 违法占地位置
    type: string
    description: 提取 违法占地位置 的文本值
  - name: 违法行为
    type: string
    description: 提取 违法行为 的文本值
  - name: 面积
    type: string
    description: 提取 面积 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 实际占用范围红线坐标 NOT IN 批准用地范围红线坐标 OR 占用面积>批准面积*1.05 OR (实际地类='永久基本农田' AND 无相应国务院批准文件)
  description: 超出批准范围用地、超占面积超过5%、违法占用永久基本农田无合法手续，均构成重大土地违规。面积容差取5%以涵盖测量误差。
  audit_item: 现代农业产业园（集群、强镇）规划、设计、立项不科学
  suspicion: 现代农业产业园建设未批先建或少批多占土地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第32号（2019修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十四条\",\n    \"内容概述\": \"建设占用土地，涉及农用地转为建设用地的，应当办理农用地转用审批手续。\"\n  }\n]"
- expression: (查获设备序列号记录表.查获设备序列号 NOT IN (SELECT 序列号 FROM 购买日期购买人设备名称/型号序列号登记台账)) OR (查获设备序列号记录表.当事人 != 购买日期购买人设备名称/型号序列号登记台账.购买人)
    OR (生态损害赔偿金追缴明细表.案件性质 IN ('电鱼','毒鱼','炸鱼') AND 生态损害赔偿金追缴明细表.到账率 < 0.8)
  description: 1. 查获的电捕鱼器等禁用渔具无销售备案记录的，表明来源非法或销售未登记；2. 查获设备的使用人与购买人不一致的，存在冒用资质或非法流转；3. 电毒炸案件生态损害赔偿金到位率低于80%的，反映执法执行缺位，风险较高。
  audit_item: 违法捕捞售卖长江流域水生生物
  suspicion: 非法使用电毒炸等禁用捕鱼工具
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国渔业法\",\n    \"法规文号\": \"中华人民共和国主席令第34号（2013年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第三十条、第四十一条\",\n    \"内容概述\": \"禁止使用炸鱼、毒鱼、电鱼等破坏渔业资源的方法进行捕捞；使用禁用的渔具、捕捞方法进行捕捞的，没收渔获物和违法所得，处以罚款，情节严重的，没收渔船。\"\
    \n  }\n]"
- expression: (登记表.供应商名称 NOT IN (SELECT 企业名称 FROM 档案)) OR (登记表.来源证明 IS NULL AND 登记表.采购品类 IN ('长江野生鱼','野生江鲜','江鱼')) OR (登记表.支付方式
    = '现金' AND 登记表.供应商名称 IN (SELECT 检查商户 FROM 检查台账 WHERE 问题类型 = '无合法来源'))
  description: 1. 采购记录中的供应商无涉渔经营许可的，属于向无资质主体采购；2. 采购声称野生鱼却无任何合法来源证明的，涉嫌收售非法渔获物；3. 对曾被突击检查发现问题的供应商，仍采用现金等不透明支付方式持续交易的，违规风险极高。
  audit_item: 违法捕捞售卖长江流域水生生物
  suspicion: 企业采购加工非法捕捞渔获物
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国长江保护法\",\n    \"法规文号\": \"中华人民共和国主席令第65号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条、第五十四条\",\n    \"内容概述\": \"禁止收购、加工、销售在长江流域重点水域非法捕捞的渔获物；任何单位和个人不得为非法捕捞提供交易服务。\"\n  }\n]"
