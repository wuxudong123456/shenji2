name: audit/记录留痕类/对账记录
type: model
description: 从记录留痕类类文档（对账记录）中提取结构化元数据。涵盖字段如：专户余额、供应商名称、关联方名称、利率、国库余额、对应合同编号、对账差异金额、对账期间。文档范围包括：关联方资金往来对账记录、内部往来款项对账记录、应付账款对账记录、财政专户与国库对账记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 合同
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 对账记录
  member_count: 1
  member_details:
  - 关联方资金往来对账记录
  - 内部往来款项对账记录
  - 应付账款对账记录
  - 财政专户与国库对账记录
output:
  fields:
  - name: 专户余额
    type: number
    description: 提取 专户余额 的数值（含单位，如万元、吨等）
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 关联方名称
    type: string
    description: 提取 关联方名称 的文本值
  - name: 利率
    type: string
    description: 提取 利率 的文本值
  - name: 国库余额
    type: number
    description: 提取 国库余额 的数值（含单位，如万元、吨等）
  - name: 对应合同编号
    type: string
    description: 提取 对应合同编号 的文本值
  - name: 对账差异金额
    type: number
    description: 提取 对账差异金额 的数值（含单位，如万元、吨等）
  - name: 对账期间
    type: string
    description: 提取 对账期间 的文本值
  - name: 差异说明
    type: string
    description: 提取 差异说明 的文本值
  - name: 往来金额
    type: number
    description: 提取 往来金额 的数值（含单位，如万元、吨等）
  - name: 期末应付关联方余额
    type: number
    description: 提取 期末应付关联方余额 的数值（含单位，如万元、吨等）
  - name: 期末应收关联方余额
    type: number
    description: 提取 期末应收关联方余额 的数值（含单位，如万元、吨等）
  - name: 期限
    type: string
    description: 提取 期限 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (非税收入缴库明细表.预算级次 != 预算管理制度.法定级次归属) OR (非税收入缴库明细表.预算科目代码 NOT IN (预算管理制度.科目代码规则)) OR (ABS(非税收入缴库明细表.金额 - 预算执行情况报表.实际入库金额)
    > 合理容差) OR (财政专户与国库对账记录.差异说明 IS NOT NULL AND 财政专户与国库对账记录.差异说明 NOT LIKE '%已更正%')
  description: 通过四类条件发现入库乱象：预算级次错挂（如中央收入入地方库）；科目错误（如一般公共预算收入放入政府性基金科目）；缴库金额与报表差异超出容差；财政专户与国库差异未及时调整。容差一般设为缴库金额的1%或1000元。
  audit_item: 不按照规定的预算级次、预算科目入库
  suspicion: 非税收入未按规定预算级次或科目缴库
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"2018年修正\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十五条\"\
    ,\n    \"内容概述\": \"预算收入征收部门和单位必须依照法律、行政法规的规定，及时、足额征收应征的预算收入，不得擅自减征、免征或者缓征，不得截留、占用或者挪用。\"\n  },\n  {\n    \"法规名称\": \"\
    财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"财政收入执收单位及其工作"
- expression: (明细表.交易类型 = '内部销售' && 底稿.内部交易收入抵销金额 < 明细表.交易金额 * 0.99) || (对账记录.期末应收关联方余额 != 对账记录.期末应付关联方余额)
  description: 关联交易抵销必须完全消除内部交易对合并报表的影响。内部销售收入抵销金额不足原交易金额99%的视为未全额抵销（考虑小额差异）。内部往来款项若存在对账不一致且未调整，表明抵销不完整。
  audit_item: 未按规定编制合并财务报表
  suspicion: 母公司与子公司间关联交易未全额抵销
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第33号——合并财务报表\",\n    \"法规文号\": \"财会〔2014〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二十六条\",\n    \"内容概述\": \"母公司与子公司、子公司相互之间发生的内部交易对合并财务报表的影响应当进行抵销处理，包括内部销售收入和销售成本、内部债权债务等。\"\n  }\n]"
- expression: (明细表.实际付款日期 IS NULL OR 明细表.实际付款日期 > 匹配表.应付未付节点日期) && 明细表.账龄 > 60 && 补充协议.供应商名称（中小企业标识） == '中小企业'
  description: 筛选供应商为中小企业，其应付账款实际未付款或实际付款日期晚于合同（或履约进度）约定的付款日期，且账龄（从约定付款日到审计基准日的天数）超过60天（用于识别非偶发性、短期的合理延迟）的交易，判定为疑似违约拖欠。
  audit_item: 未按规定落实降成本政策措施
  suspicion: 违约拖欠中小企业货物、工程、服务款项
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"机关、事业单位从中小企业采购货物、工程、服务，应当自货物、工程、服务交付之日起30日内支付款项；合同另有约定的，付款期限最长不得超过60日。大型企业从中小企业采购货物、工程、服务，应当按照行业规范、交易习惯合理约定付款期限并及时支付款项。不得强制中小企业接受商业汇票等非现金支付方式，不得利用商业汇票等非现金支付方式变相延长付款期限。\"\
    \n  }\n]"
