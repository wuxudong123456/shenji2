name: audit/记录留痕类/举报记录
type: model
description: 从记录留痕类类文档（举报记录）中提取结构化元数据。涵盖字段如：举报事由、举报内容、举报地址、举报对象、内容、反映‘被要求’捐赠的录音、反映复堆或污染问题的时间、反映强制拆除的投诉内容。文档范围包括：信访举报记录、审计期间内的投诉举报记录、投诉举报记录、投诉或举报记录、村民投诉举报记录、群众投诉举报记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 举报记录
  member_count: 1
  member_details:
  - 信访举报记录
  - 审计期间内的投诉举报记录
  - 投诉举报记录
  - 投诉或举报记录
  - 村民投诉举报记录
  - 群众投诉举报记录
output:
  fields:
  - name: 举报事由
    type: string
    description: 提取 举报事由 的文本值
  - name: 举报内容
    type: string
    description: 提取 举报内容 的文本值
  - name: 举报地址
    type: string
    description: 提取 举报地址 的文本值
  - name: 举报对象
    type: string
    description: 提取 举报对象 的文本值
  - name: 内容
    type: string
    description: 提取 内容 的文本值
  - name: 反映‘被要求’捐赠的录音
    type: string
    description: 提取 反映‘被要求’捐赠的录音 的文本值
  - name: 反映复堆或污染问题的时间
    type: date
    description: 提取 反映复堆或污染问题的时间 的日期值，格式 YYYY-MM-DD
  - name: 反映强制拆除的投诉内容
    type: string
    description: 提取 反映强制拆除的投诉内容 的文本值
  - name: 坐标
    type: string
    description: 提取 坐标 的文本值
  - name: 处理情况
    type: string
    description: 提取 处理情况 的文本值
  - name: 处理状态
    type: boolean
    description: 提取 处理状态 的布尔值（是/否）
  - name: 处理结果
    type: boolean
    description: 提取 处理结果 的布尔值（是/否）
  - name: 处置结果
    type: boolean
    description: 提取 处置结果 的布尔值（是/否）
  - name: 情况描述
    type: string
    description: 提取 情况描述 的文本值
  - name: 投诉事由
    type: string
    description: 提取 投诉事由 的文本值
  - name: 投诉人
    type: string
    description: 提取 投诉人 的文本值
  - name: 投诉内容
    type: string
    description: 提取 投诉内容 的文本值
  - name: 投诉内容是否涉及“不买某报告即退件”
    type: boolean
    description: 提取 投诉内容是否涉及“不买某报告即退件” 的布尔值（是/否）
  - name: 投诉地点
    type: string
    description: 提取 投诉地点 的文本值
  - name: 投诉收费项目
    type: number
    description: 提取 投诉收费项目 的数值（含单位，如万元、吨等）
  - name: 投诉日期
    type: date
    description: 提取 投诉日期 的日期值，格式 YYYY-MM-DD
  - name: 投诉时间
    type: date
    description: 提取 投诉时间 的日期值，格式 YYYY-MM-DD
  - name: 投诉项目
    type: string
    description: 提取 投诉项目 的文本值
  - name: 文字记录
    type: string
    description: 提取 文字记录 的文本值
  - name: 时间
    type: date
    description: 提取 时间 的日期值，格式 YYYY-MM-DD
  - name: 核实处理结果
    type: boolean
    description: 提取 核实处理结果 的布尔值（是/否）
  - name: 涉及人员
    type: string
    description: 提取 涉及人员 的文本值
  - name: 涉及对象
    type: string
    description: 提取 涉及对象 的文本值
  - name: 涉及开发商
    type: string
    description: 提取 涉及开发商 的文本值
  - name: 涉及村干部
    type: string
    description: 提取 涉及村干部 的文本值
  - name: 涉及经办网点及经办人
    type: string
    description: 提取 涉及经办网点及经办人 的文本值
  - name: 涉及项目
    type: string
    description: 提取 涉及项目 的文本值
  - name: 被举报中介机构名称
    type: string
    description: 提取 被举报中介机构名称 的文本值
  - name: 被举报人
    type: string
    description: 提取 被举报人 的文本值
  - name: 被举报人姓名
    type: string
    description: 提取 被举报人姓名 的文本值
  - name: 被举报对象
    type: string
    description: 提取 被举报对象 的文本值
  - name: 被投诉执收单位
    type: string
    description: 提取 被投诉执收单位 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 明细台账.征收项目 NOT IN (征收范围描述.项目名称) OR (明细台账.缴费单位/个人名称 NOT IN (征收范围描述.征收对象))
  description: 当征收台账中出现的项目名称不在财政、物价部门公布的征收范围目录内，或者虽项目名称相符但实际征收对象（如个人、非营利组织）超出了目录规定的对象类型，判定为违规扩大征收范围。
  audit_item: 违反规定征收非税收入
  suspicion: 违规扩大非税收入征收范围
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"非税收入项目由法律、法规、规章设立。设立和征收非税收入，应当依据法 律、法规、规章的规定，并按照管理权限予以批准。任何部门和单位不得违反规定擅自设立非税收入项目或者改变征收范围、标准、对象和期限。\"\
    \n  }\n]"
- expression: ( 办事指南.有无指定供应商说明 && 收费明细.对应审批事项 && 办事指南.办理条件 )
  description: 若在审批所需材料中，被审计单位自行设置的办事指南将某项有偿服务捆绑为受理前置条件，且指定唯一或特定范围的机构提供该服务（即使表面上未写死唯一，但通过技术参数等限制只能某几家满足），同时该服务并非法律法规明确规定必须购买的，则构成捆绑收费。需排除法律法规强制要求的法定检测评估。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 行政审批捆绑购买指定商品服务
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十四条\",\n    \"内容概述\": \"行政审批机关不得将特定的中介服务作为受理的前置条件，不得强制企业接受指定的中介服务。\"\n  },\n  {\n    \"法规名称\": \"国务院关于在市场体系建设中建立公平竞争审查制度的意见\"\
    ,\n    \"法规文号\": \"国发〔2016〕34号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"审查标准-商品和要素自由流动标准\",\n    \"内容概述\": \"不得限定经营"
- expression: ( 其他.项目名称（如‘捐款’‘赞助费’）为‘捐赠’‘赞助’ && 其他.收款方与被审计单位存在关联或为指定账户 ) && ( 缴费企业均系被审计单位管理服务对象 && 会议纪要.目标金额分配表 ) && 流水.收款账户性质（财政专户还是自有账户）
  description: 当以‘自愿捐赠’‘支持地方建设’等名义收款，但实际上存在向管理服务对象下达摊派任务（如文件、会议划定指标），且资金未进入财政专户管理，而是流入单位自有账户或指定社团组织账户，同时付款企业与该机关有审批、监管、检查等利害关系时，判定为变相摊派收费。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 以捐赠赞助名义变相摊派收费
  regulation: "[\n  {\n    \"法规名称\": \"关于治理向企业乱收费、乱罚款和各种摊派等问题的决定\",\n    \"法规文号\": \"中发〔1997〕14号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"严禁向企业摊派、索要赞助和无偿占用企业人财物。\"\n  },\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\"\
    : \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"禁止向市场主体强制或者变相强制摊派、募捐。\"\n  }\n]"
- expression: (记录表.最近一次检修日期距今 > 维护周期要求.维护周期要求) OR (记录表.维修结果记录 IS NULL) OR (举报记录.投诉内容（是否涉及设施损坏）含'设施损坏' && 举报记录.处理情况 == '未修复')
    OR (影像资料.损坏程度评估 > 中等)
  description: 判定规则：①维护周期严重超期或长期无记录；②群众多次投诉设施损坏但未及时修复；③现场勘查发现明显损坏（如围墙倒塌、排水堵塞）视为维护缺失。任何一项触发即构成疑点。
  audit_item: 农村公益性殡葬建设不符合相关规定
  suspicion: 农村公益性墓地设施老化、维护不及时
  regulation: "[\n  {\n    \"法规名称\": \"殡葬管理条例\",\n    \"法规文号\": \"国务院令第225号（2012年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十一条\",\n    \"内容概述\": \"殡葬设施的管理单位应当维护设施完好，保持环境整洁，防止污染环境。\"\n  },\n  {\n    \"法规名称\": \"农村公益性公墓管理办法\",\n    \"法规文号\"\
    : \"无（地方性法规或规范性文件）\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"无\",\n    \"内容概述\": \"公墓管理单位应定期对围墙、道路、排水、消防等设施进行检修，并建立维护档案，"
- expression: (COUNT(清单表.水体名称) < COUNT(数据.疑似黑臭水体图斑坐标)) || (EXISTS(举报记录.投诉地点 NOT IN 清单表.位置坐标))
  description: 将排查清单表中的水体数量与卫星遥感解译的疑似黑臭水体图斑数量进行比对，若清单数量明显少于遥感图斑数量，判定为存在遗漏；同时，将村民投诉记录中的地点与排查清单进行关联，若投诉地点在清单中无对应记录，判定为遗漏。两者为“或”条件，满足其一即生成疑点。
  audit_item: 农村黑臭水体治理不到位
  suspicion: 排查识别黑臭水体遗漏或误报
  regulation: "[\n  {\n    \"法规名称\": \"农村黑臭水体治理工作指南\",\n    \"法规文号\": \"环办土壤〔2019〕826号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三条、第八条\",\n    \"内容概述\": \"省级生态环境部门应组织指导各地以行政村为单位开展排查，摸清辖区农村黑臭水体数量、位置、污染成因等，建立清单。排查应综合采用资料收集、现场调查、群众走访、监测分析等方法。\"\
    \n  }\n]"
- expression: (拆除时间台账.拆除时间 < 确认文件.签字时间) || (签字确认文件缺失) || (举报记录.反映强制拆除的投诉内容 && 无补偿发放记录)
  description: 拆除日期早于农户签字确认日期、或签字文件缺失、或有强制拆除投诉且补偿资金未发放，均构成强制改厕疑点。
  audit_item: 厕所改造实施不规范、质量不达标
  suspicion: 违规强制拆除厕所实施改厕
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国村民委员会组织法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"涉及村民利益的事项，村民委员会必须提请村民会议讨论决定，方可办理。改厕需经村民同意。\"\n  }\n]"
- expression: (明细表.身份证号 重复计数 > 1 且 分配金额 > 0) || (明细表.身份证号 关联 公安死亡人口数据 存在匹配且分配金额 > 0) AND (该村集体经济组织在监督检查台账中无最近两年检查记录 || 对应问题未出现在任何底稿中)
  description: 满足以下任一条件：①同一身份证号多次分配；②死亡人员仍参与分配。同时对应村集体近两年未被检查或检查底稿中未提及此类异常，表明监督检查缺失导致侵害未被发现。
  audit_item: 政策支持落实和监督检查不到位
  suspicion: 监督检查不到位未发现侵害集体经济组织权益行为
  regulation: "[\n  {\n    \"法规名称\": \"农村集体经济组织审计规定\",\n    \"法规文号\": \"农办经〔2008〕8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第五条\",\n    \"内容概述\": \"各级农村经营管理部门应当对农村集体经济组织财务收支、资产运营等情况进行定期审计，及时发现和纠正违法违纪问题。\"\n  }\n]"
- expression: (登记表.审核结果 = '通过' && (审核材料.收入证明 > 当地低保标准 || 库.身份证号 存在於 明细表.身份证号)) || (明细表.补贴金额 > 惠农补贴资金管理办法.补贴标准*1.2)
  description: 当审核通过的人员中，其收入证明或财产状况超出政策保障线，或者身份信息与财政供养人员库匹配，即判定为不符合条件发放；同时若发放金额超过政策规定标准的1.2倍，视为超标准发放，两者均构成违规。
  audit_item: 监管不到位，惠农补贴资金被套取骗取、违规使用
  suspicion: 超范围超标准向不符合条件对象发放补贴
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十三条、第十四条\",\n    \"内容概述\": \"申请最低生活保障，按照下列程序办理：由共同生活的家庭成员向户籍所在地的乡镇人民政府、街道办事处提出书面申请；家庭成员申请有困难的，可以委托村民委员会、居民委员会代为提出申请。乡镇人民政府、街道办事处应当通过入户调查、邻里访问、信函索证、群众评议、信息核查等方式，对申请人的家庭收入状况、财产状况进行调查核实，提出初审意见，在申请人所在村、社区公示后报县级人民政府民政部门审批。"
- expression: 重复身份证号对比表.重复身份证号 申报次数 >=2 || (重复房屋地址对比表.重复房屋地址 申报次数 >=2 && 验收资料.改造前照片 不同年份相同) || (发放金额明细表.身份证号 收款金额累加 > 政策最高补助标准)
  description: 同一身份证号或同一房屋地址在补贴名单中出现两次及以上，或照片信息被复用，则认定为重复享受；同一户获得的补贴总额超出省级最高补助限额的，也视为编造资料重复申报。
  audit_item: 监管不到位，惠农补贴资金被套取骗取、违规使用
  suspicion: 编造资料重复享受农村危房改造补贴
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农村危房改造补助资金管理暂行办法\",\n    \"法规文号\": \"财社〔2016〕216号\",\n    \"效力级别\": \"部门规章\",\n\
