name: audit/记录留痕类/操作记录
type: model
description: 从记录留痕类类文档（操作记录）中提取结构化元数据。涵盖字段如：操作人员、更新日期、活性检测结果。文档范围包括：种质资源繁殖更新操作记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 操作记录
  member_count: 1
  member_details:
  - 种质资源繁殖更新操作记录
output:
  fields:
  - name: 操作人员
    type: string
    description: 提取 操作人员 的文本值
  - name: 更新日期
    type: date
    description: 提取 更新日期 的日期值，格式 YYYY-MM-DD
  - name: 活性检测结果
    type: boolean
    description: 提取 活性检测结果 的布尔值（是/否）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ((监测表.监测时间 > 规定监测频率（如每季度/半年/1年）、繁殖更新周期标准（如3年/5年）.规定监测频率（如每季度/半年/1年） * 3) || (对比表.实际更新日期 - 对比表.计划更新日期 > 365天))
    && (操作记录.休眠期标注 IS NULL || 监测表.异常情况 == '无')
  description: 判定规则：一是监测频率违规，若连续2个规定周期以上（如规定1年1次，则间隔大于3年即为3个周期）没有监测记录，且在操作记录中无休眠期或特殊情况说明；二是繁殖更新逾期，实际更新日期比计划更新日期晚于1年。满足以上任一条件，同时排除种子休眠、保存环境异常等客观技术原因后，即视为工作不及时。
  audit_item: 种质资源保护利用方面不符合相关规定
  suspicion: 入库种质资源监测更新周期严重滞后
  regulation: "[\n  {\n    \"法规名称\": \"《农作物种质资源管理办法》\",\n    \"法规文号\": \"中华人民共和国农业部令第30号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十条\",\n    \"内容概述\": \"种质资源库应当对保存的种质资源定期进行监测，及时进行繁殖更新，保证种质资源的活力和遗传完整性。\"\n  },\n  {\n    \"法规名称\": \"《国家级畜禽遗传资源保护名录管理办法》\"\
    ,\n    \"法规文号\": \"中华人民共和国农业部公告第2061号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"相关技术规范条款\",\n    \"内容概述\": "
