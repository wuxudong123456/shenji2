name: audit/记录留痕类/账务记录
type: model
description: 从记录留痕类类文档（账务记录）中提取结构化元数据。涵盖字段如：对方单位、摘要、支付科目。文档范围包括：企事业单位账务记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 账务记录
  member_count: 1
  member_details:
  - 企事业单位账务记录
output:
  fields:
  - name: 对方单位
    type: string
    description: 提取 对方单位 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 支付科目
    type: string
    description: 提取 支付科目 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (借用单位、出借单位、车辆品牌型号、车牌号、借用起止日期.借用单位 = 某机关单位 AND (借用单位、出借单位、车辆品牌型号、车牌号、借用起止日期.借用起止日期 > 规定期限 OR 借用单位、出借单位、车辆品牌型号、车牌号、借用起止日期.借用起止日期
    IS NULL)) OR (实际支付金额、车辆型号、支付金额、供应商名称、支付单位名称.支付单位名称 LIKE '%企业%' AND 车牌号、车辆型号、价格、排量、购置日期、使用部门、车辆类型（越野车标识）、车辆来源（国产/进口）、采购方式、车辆来源（是否退役转籍）、当前使用部门、名义权属单位、实际使用部门、车辆购置日期、车辆状态.实际使用部门
  description: 机关单位长期借用企事业单位车辆、由企事业单位支付购车款或承担车辆运行费用，均属利用职权违规配备车辆。
  audit_item: 违规配备公务用车
  suspicion: 利用职权调换借用或摊派购车
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十一条\",\n    \"内容概述\": \"党政机关不得以任何方式换用、借用、占用下属单位或者其他单位和个人的车辆，不得接受企事业单位和个人赠送的车辆，不得向企事业单位摊派款项购买车辆。\"\n  }\n]"
