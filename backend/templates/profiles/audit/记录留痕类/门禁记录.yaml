name: audit/记录留痕类/门禁记录
type: model
description: 从记录留痕类类文档（门禁记录）中提取结构化元数据。涵盖字段如：人员进出时间、门禁点位置。文档范围包括：门禁记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 门禁记录
  member_count: 1
  member_details:
  - 门禁记录
output:
  fields:
  - name: 人员进出时间
    type: date
    description: 提取 人员进出时间 的日期值，格式 YYYY-MM-DD
  - name: 门禁点位置
    type: string
    description: 提取 门禁点位置 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (整改验收报告或证明材料.电子文件创建日期 > 整改验收报告或证明材料.文件落款日期 AND ABS(整改验收报告或证明材料.电子文件创建日期 - 整改验收报告或证明材料.文件落款日期) > 1) OR (同一日期签发的整改关键文件数量
    >= 5) OR (管理层会议纪要.会议日期 NOT IN (会议室使用登记表.使用日期) AND 管理层会议纪要.会议日期 != 会议室使用登记表.使用日期)
  description: 通过文件元数据日期逻辑（创建晚于落款为后补）、集中补签异常（同一天签发大量整改文件）、会议时间与物理空间使用记录矛盾来识别材料造假。创建日期晚于落款日期且相差超过1天，排除时区等误差；同一日期签发5份及以上为异常集中；会议时间无对应会议室使用记录则存疑。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 整改佐证材料事后补编或造假
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"审计整改情况应当真实、完整，不得弄虚作假。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017修正）\"\
    ,\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十三条\",\n    \"内容概述\": \"伪造、变造会计凭证、会计帐簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\n  }"
