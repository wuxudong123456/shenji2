name: audit/记录留痕类/走访记录
type: model
description: 从记录留痕类类文档（走访记录）中提取结构化元数据。涵盖字段如：实际身体功能状况描述、未覆盖村落实际用电方式、机构名称、水电表读数、照片、现场情况、走访日期。文档范围包括：实地走访记录、现场走访记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 走访记录
  member_count: 1
  member_details:
  - 实地走访记录
  - 现场走访记录
output:
  fields:
  - name: 实际身体功能状况描述
    type: string
    description: 提取 实际身体功能状况描述 的文本值
  - name: 未覆盖村落实际用电方式
    type: string
    description: 提取 未覆盖村落实际用电方式 的文本值
  - name: 机构名称
    type: string
    description: 提取 机构名称 的文本值
  - name: 水电表读数
    type: string
    description: 提取 水电表读数 的文本值
  - name: 照片
    type: string
    description: 提取 照片 的文本值
  - name: 现场情况
    type: string
    description: 提取 现场情况 的文本值
  - name: 走访日期
    type: date
    description: 提取 走访日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (登记表.登记状态 = '运营中' && 统计表.年均床位利用率 < 0.3) || (明细表.拨付金额 > 0 && 登记表.关停日期 IS NOT NULL && 登记表.登记状态 != '注销')
  description: 条件一：登记为运营中但年均床位利用率低于30%，属于隐性闲置；条件二：机构已关停但财政补贴仍持续拨付，属于资源错配。满足任一条件即触发疑点，其中条件二为严重违规线索。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 农村养老机构建成后长期关停闲置
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十七条\",\n    \"内容概述\": \"养老机构暂停或者终止服务的，应当于暂停或者终止服务60日前，向备案的民政部门提交老年人安置方案，经书面审核同意后实施。未经批准不得擅自停业或者关闭。\"\n  }\n]"
- expression: (分析表.未覆盖行政村数量 > 0) || (分析表.实际覆盖率 < 目标供电可靠率.覆盖率目标)
  description: 只要存在电网未覆盖的行政村（含自然村），或者县域整体覆盖率低于规划目标值，即构成未实现公用电网延伸覆盖的疑点。未覆盖村数和覆盖率缺口越大，风险越高。
  audit_item: 农村电网巩固提升工程存在短板
  suspicion: 公用电网延伸覆盖存在空白区
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级技术原则\",\n    \"法规文号\": \"国能新能〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条\",\n    \"内容概述\": \"要求公用电网应延伸至农村聚居区，基本消除无电人口，满足居民生活和生产用电需求。\"\n  }\n]"
- expression: (核验名单.申报残疾等级 < 库.实际评定等级) && (明细表.补贴项目名称 = "重度残疾人护理补贴")
  description: 残疾等级数字越小代表残疾程度越重，申报等级重于实际等级即表示伪造更严重的残疾程度；同时仍在领取只针对重度残疾的护理补贴，即判定为骗取行为。
  audit_item: 向不符合条件的人员发放保障待遇
  suspicion: 伪造残疾等级骗取重度残疾人护理补贴
  regulation: "[\n  {\n    \"法规名称\": \"《国务院关于全面建立困难残疾人生活补贴和重度残疾人护理补贴制度的意见》\",\n    \"法规文号\": \"国发〔2015〕52号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"二（一）\",\n    \"内容概述\": \"重度残疾人护理补贴主要补助残疾人因残疾产生的额外长期照护支出，对象为残疾等级被评定为一级、二级且需要长期照护的重度残疾人。\"\n\
    \  }\n]"
