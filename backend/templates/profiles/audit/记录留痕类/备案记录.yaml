name: audit/记录留痕类/备案记录
type: model
description: 从记录留痕类类文档（备案记录）中提取结构化元数据。涵盖字段如：人员身份证号、企业名称、企业统一信用代码、减免备案号、减免性质代码、减免金额、劳动合同起止日期、备案日期。文档范围包括：企业用工备案记录、战略规划调整备案记录、政府采购备案记录、机构挂牌情况备案记录、税费减免备案记录、裁员备案记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 合同
- 金额
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 备案记录
  member_count: 1
  member_details:
  - 企业用工备案记录
  - 战略规划调整备案记录
  - 政府采购备案记录
  - 机构挂牌情况备案记录
  - 税费减免备案记录
  - 裁员备案记录
output:
  fields:
  - name: 人员身份证号
    type: string
    description: 提取 人员身份证号 的文本值
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 企业统一信用代码
    type: string
    description: 提取 企业统一信用代码 的文本值
  - name: 减免备案号
    type: string
    description: 提取 减免备案号 的文本值
  - name: 减免性质代码
    type: string
    description: 提取 减免性质代码 的文本值
  - name: 减免金额
    type: number
    description: 提取 减免金额 的数值（含单位，如万元、吨等）
  - name: 劳动合同起止日期
    type: date
    description: 提取 劳动合同起止日期 的日期值，格式 YYYY-MM-DD
  - name: 备案日期
    type: date
    description: 提取 备案日期 的日期值，格式 YYYY-MM-DD
  - name: 备案机构名称
    type: string
    description: 提取 备案机构名称 的文本值
  - name: 备案裁员人数
    type: number
    description: 提取 备案裁员人数 的数值（含单位，如万元、吨等）
  - name: 岗位
    type: string
    description: 提取 岗位 的文本值
  - name: 批准文号
    type: string
    description: 提取 批准文号 的文本值
  - name: 招用人员身份证号
    type: string
    description: 提取 招用人员身份证号 的文本值
  - name: 招用日期
    type: date
    description: 提取 招用日期 的日期值，格式 YYYY-MM-DD
  - name: 用人单位统一信用代码
    type: string
    description: 提取 用人单位统一信用代码 的文本值
  - name: 纳税人识别号
    type: string
    description: 提取 纳税人识别号 的文本值
  - name: 裁员时间
    type: date
    description: 提取 裁员时间 的日期值，格式 YYYY-MM-DD
  - name: 调整备案回执
    type: string
    description: 提取 调整备案回执 的文本值
  - name: 重新报批文件
    type: string
    description: 提取 重新报批文件 的文本值
  - name: 项目编号
    type: string
    description: 提取 项目编号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (采购合同.合同金额 > 审批限额标准、审批层级、所需附件.审批限额标准 && 采购金额区间、对应审批人级别、审批记录.对应审批人级别 < 要求审批级别) || (COUNT(采购合同 BY 供应商, 同类设备, 时间差<90天)
    >= 2 && SUM(合同金额) >= 审批限额标准、审批层级、所需附件.审批限额标准 && 无合并审批记录)
  description: 单笔合同金额超过本级审批权限但未经上级审批；或通过化整为零方式将大额采购拆分为若干小额合同，每笔均未达审批上限，但累计金额超过阈值且无整体报批记录，均属程序违规。
  audit_item: 违反规定配置国有资产
  suspicion: 购置国有资产未按规定程序报批
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"各部门及其所属单位购置规定限额以上的资产，应当经主管部门审核同意后报同级财政部门审批。国家另有规定的，从其规定。\"\n  }\n]"
- expression: (挂牌清单.加挂牌子名称 NOT IN (SELECT 备案机构名称 FROM 备案记录 WHERE 备案状态='有效')) AND (挂牌清单.挂牌日期 IS NOT NULL) OR (挂牌清单.同一机构挂牌数量
    > 1 AND 挂牌清单.同一机构挂牌数量 > (SELECT COUNT(*) FROM 备案记录 WHERE 机构名称 = 挂牌清单.挂牌机构名称 AND 备案状态='有效'))
  description: 办公场所悬挂的机构名称，未经编制部门批准备案，或同一机构加挂牌子数量超出备案批准数量，均属擅自加挂。尤其关注加挂牌子后独立开展业务、开设账户的行为。
  audit_item: 违规设置或变更机构
  suspicion: 擅自加挂机构牌子或变相增设机构
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第九条、第十五条\",\n    \"内容概述\": \"机构名称、牌子的加挂属于机构编制管理事项，未经批准不得擅自加挂；严禁通过加挂牌子变相增设机构或提高机构规格。\"\n  }\n]"
- expression: (企业五年发展战略规划文件.规划文档是否存在 = '否') OR (国资委关于战略规划的批复文件.批复文号 IS NULL) OR (党委会战略决策会议纪要.战略规划议题审议记录 IS NULL) OR (战略规划调整备案记录.调整备案回执
    IS NULL)
  description: 以国资监管程序为标准，企业必须编制书面的五年规划，经董事会等决策机构审议后报国资委备案或审批，重大调整须重新报批。上述任一环节缺失即构成程序违规。
  audit_item: 企业发展战略规划的制定、执行和效果
  suspicion: 未按国资委要求制定企业五年发展战略规划
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强中央企业战略规划管理工作的指导意见\",\n    \"法规文号\": \"国资发规划〔2018〕54号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"二、（一）\",\n    \"内容概述\": \"中央企业应当根据国家发展规划和国有资本布局结构调整要求，科学编制五年发展战略规划，按程序报国资委备案或审批。\"\n  }\n]"
- expression: ((明细表.申报裁员人数 > 备案记录.备案裁员人数) || (名册.在职人数 < 申领条件、补贴标准、发放时限要求.申领条件)) && (明细表.实际发放金额 > 0) || (明细表.发放时间 - 申领条件、补贴标准、发放时限要求.发放时限要求
    > 0)
  description: 企业申报的裁员人数与劳动部门备案不符，或在职人数已低于政策规定的申领条件，但仍获得补贴，构成骗取行为；若发放时间晚于截止日期，构成延迟发放。两者均为未按规定发放。
  audit_item: 落实“六稳”“六保”政策存在的其他问题
  suspicion: 未按规定发放稳岗补贴
  regulation: "[\n  {\n    \"法规名称\": \"《关于失业保险支持企业稳定就业岗位的通知》\",\n    \"法规文号\": \"人社部发〔2019〕34号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条、第三条\",\n    \"内容概述\": \"企业申请稳岗补贴应如实提供裁员情况，补贴须按时足额发放，严禁虚报冒领；对不符合条件的企业不得拨付补贴。\"\n  },\n  {\n    \"\
    法规名称\": \"《失业保险条例》\",\n    \"法规文号\": \"国务院令第258号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"\
    失业保险基金可用于稳"
- expression: ((协议.用地性质 == '划拨' && 项目性质 IN ('经济适用房','公租房','棚改房')) || (政策文件.减免税种 == '城市基础设施配套费' && 项目性质 IN ('经济适用房','公租房','棚改房')))
    && (税费凭证.缴纳金额 > 0 && 税费凭证.票据备注 != '已减免')
  description: 当保障性安居工程项目以划拨方式供地或按规定免征城市基础设施配套费时，若土地出让合同或票据显示实际缴纳了出让金、配套费且未标记减免，则判定为违规。缴纳金额大于0且无对应减免备案记录的，视为违规收取。
  audit_item: 违规向保障性安居工程项目收取应减免税费
  suspicion: 违规向安居工程项目征收土地出让金或配套费
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于解决城市低收入家庭住房困难的若干意见\",\n    \"法规文号\": \"国发〔2007〕24号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第五条第（十九）项\",\n    \"内容概述\": \"经济适用住房和廉租住房建设用地实行行政划拨方式供应，免收城市基础设施配套费等各种行政事业性收费和政府性基金。\"\n  }\n]"
- expression: (项目性质 IN ('经济适用房','公租房','棚改房') && 税费凭证.税种 IN ('契税','印花税') && 税费凭证.实缴金额 > 0 && (备案记录.减免性质代码 == NULL || 税费凭证.减免标志
    != '减免'))
  description: 当保障性安居工程项目属于可享受契税、印花税减免的范围，且实际缴纳该税种金额大于0，但税务系统中无对应的减免备案或票据未注明减免，则判定为违规多征或未减免。
  audit_item: 违规向保障性安居工程项目收取应减免税费
  suspicion: 多征或未减免安居工程项目契税、印花税
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于廉租住房经济适用住房和住房租赁有关税收政策的通知\",\n    \"法规文号\": \"财税〔2008〕24号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第一条、第二条\",\n    \"内容概述\": \"对廉租住房、经济适用住房建设用地免征城镇土地使用税；对廉租住房、经济适用住房经营管理单位免征印花税；对廉租住房、经济适用住房购买人涉及的契税，可给予适当减免。\"\
    \n  }\n]"
- expression: (项目性质 IN ('棚改房','经济适用房') && 税费凭证.税种 IN ('城市维护建设税','教育费附加') && 税费凭证.实缴金额 > 0 && (税务部门提供的税费征收明细表及减免备案记录.减免性质代码
    == NULL || 税费凭证.减免标志 != '免征'))
  description: 棚户区改造等保障性安居工程项目在特定环节可免征城市维护建设税和教育费附加，若实际缴纳金额大于0且无免征标识，则判定为违规。
  audit_item: 违规向保障性安居工程项目收取应减免税费
  suspicion: 违规征收安居工程项目城建税和教育费附加
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于棚户区改造有关税收政策的通知\",\n    \"法规文号\": \"财税〔2013〕101号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"对棚户区改造项目，免征城市维护建设税、教育费附加。\"\n  }\n]"
- expression: 企业用工备案记录.统一信用代码 IN (小微企业名录.统一信用代码) && 社保缴纳记录.人员身份证号 IN (高校毕业生名册.身份证号 WHERE 毕业年度 = 招用年度) && (企业统一信用代码 + 人员身份证号
    NOT IN (SELECT 企业统一信用代码, 补贴人员身份证号 FROM 小微企业社保补贴申领明细表 WHERE 补贴对应年度 = 当前审计年度))
  description: 判断小微企业招用毕业年度高校毕业生并为其缴纳社保，但企业未出现在对应年度社保补贴申领明细中，即存在应享未享疑点。需注意小微企业认定和高校毕业生身份真实性。
  audit_item: 高校毕业生、去产能企业职工等就业扶持政策执行不到位
  suspicion: 小微企业吸纳高校毕业生社保补贴应享未享
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"对招用毕业年度高校毕业生，与之签订1年以上劳动合同并为其缴纳社会保险费的小微企业，给予最长不超过1年的社会保险补贴，不包括高校毕业生个人应缴纳的部分。\"\n  }\n]"
- expression: 社保补贴申领明细表.补贴人员身份证号 NOT IN (SELECT 身份证号 FROM 高校毕业生学历信息 WHERE 毕业年度 = 申领补贴的招用年度) || 社保缴纳记录.缴费起止日期 < 补贴期限 || (企业用工备案.招用日期
    与 补贴年度 时间差 > 1年)
  description: 违规表达式涵盖三种情形：1.补贴对象毕业年度不符合政策要求（非毕业年度），通过学信学历数据比对发现；2.社保缴纳期间与补贴期限不匹配，如缴费时长不足或中断；3.招用日期与补贴期限逻辑矛盾。任一条件成立即为违规享受疑点。
  audit_item: 高校毕业生、去产能企业职工等就业扶持政策执行不到位
  suspicion: 小微企业违规享受高校毕业生社保补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"享受社会保险补贴的小微企业必须招用毕业年度高校毕业生，签订1年以上劳动合同并实际缴纳社保。补贴依实际缴费情况给予，不得重复申领或超期享受。\"\n  }\n]"
- expression: 社保补贴发放汇总表.用人单位统一信用代码 IN (SELECT 用人单位统一信用代码 FROM 社保补贴发放汇总表 GROUP BY 用人单位统一信用代码 HAVING COUNT(DISTINCT 补贴人员身份证号)
    > 0) && (EXISTS (SELECT 1 FROM 企业用工备案记录 WHERE 用人单位统一信用代码 = 社保补贴发放汇总表.用人单位统一信用代码 AND 劳动合同起止日期 IS NULL OR 劳动合同起止日期 < 补贴期限)
    || EXISTS (SELECT 1 FROM 社保缴纳记录 WHERE 补贴人员身份证号 = 社保缴纳记录.人员身份证号 AND (缴
  description: 筛选已申领补贴的用人单位，但所涉人员的劳动合同缺失、社保实际缴纳单位与申领单位不一致、或缴费月数严重不足，甚至分流人员身份与去产能企业不一致，表明存在虚假安置、挂靠参保等骗取补贴行为。
  audit_item: 高校毕业生、去产能企业职工等就业扶持政策执行不到位
  suspicion: 虚假吸纳去产能分流人员骗取就业扶持补贴
  regulation: "[\n  {\n    \"法规名称\": \"关于在化解钢铁煤炭行业过剩产能实现脱困发展过程中做好职工安置工作的意见\",\n    \"法规文号\": \"人社部发〔2016〕32号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第三条（三）\",\n    \"内容概述\": \"用人单位吸纳去产能分流人员并签订劳动合同后方可享受补贴，对弄虚作假、骗取套取资金的，依法追回资金并追究责任。\"\n  }\n\
    ]"
