name: audit/记录留痕类/联单记录
type: model
description: 从记录留痕类类文档（联单记录）中提取结构化元数据。涵盖字段如：发货方、收货方、运输日期、运输车牌、运输重量、运输量。文档范围包括：农膜运输联单记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 联单记录
  member_count: 1
  member_details:
  - 农膜运输联单记录
output:
  fields:
  - name: 发货方
    type: string
    description: 提取 发货方 的文本值
  - name: 收货方
    type: string
    description: 提取 收货方 的文本值
  - name: 运输日期
    type: date
    description: 提取 运输日期 的日期值，格式 YYYY-MM-DD
  - name: 运输车牌
    type: string
    description: 提取 运输车牌 的文本值
  - name: 运输重量
    type: string
    description: 提取 运输重量 的文本值
  - name: 运输量
    type: string
    description: 提取 运输量 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (联单记录.收货方 不在 合规处置企业名录) || (联单台账.最终处置方式（再生/填埋/焚烧） != '资源化利用' && 联单台账.最终处置方式（再生/填埋/焚烧） != '卫生填埋') || (监测报告.二噁英浓度
    > 0.5 ng TEQ/Nm³) || (决定书.违规事实 包含 '焚烧' || '掩埋' || '弃置') || (投诉记录.投诉内容 包含 '烧膜' || '埋膜' || '乱倒' )
  description: 合规处置企业名录由回收协议确定。非资源化利用或卫生填埋的，可能为非法处置；二噁英超标参照《危险废物焚烧污染控制标准》中限值（0.5ng TEQ/Nm³）；其他字段通过关键文本匹配判定。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 随意弃置、掩埋或者焚烧废旧农膜
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"农用薄膜使用者应当在使用期限届满前捡拾田间的非全生物降解农用薄膜废弃物，交至回收网点或回收工作者，不得随意弃置、掩埋或者焚烧。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十条\","
- expression: (销售台账 IS NULL) || (地块编号、种植户、使用量（kg）、回收量（kg）、申报日期、台账存在性、使用量、回收量 IS NULL) || (台账存在性、回收总量 IS NULL) || (台账存在性、联单数量、处置数量、交膜方、收膜方、处理量、最终处置方式（再生/填埋/焚烧）
    IS NULL) || (ABS(销售台账.销售总量 - 发票存根.销售总量) / 发票存根.销售总量 > 0.10) || (地块编号、种植户、使用量（kg）、回收量（kg）、申报日期、台账存在性、使用量、回收量.回收量 > 地块编号、种植户、使用量（kg）、回收量（kg）、申报日期、台账存在性、使用量、回
  description: 任一环节台账缺失即构成违规；台账间逻辑矛盾提示数据不实，如销售台账与发票差异超过10%，回收量大于使用量10%以上，补贴量大于统计回收量10%以上，均视为可疑。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 未建立生产、销售、使用、回收记录或台账
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"农用薄膜生产者、销售者、回收网点、废旧农用薄膜回收再利用企业或其他组织等应当建立农用薄膜回收台账，如实记录废旧农用薄膜的重量、体积、杂质、缴膜人名称及其联系方式、回收时间等内容。台账保存期不少于两年。\"\
    \n  }\n]"
