name: audit/记录留痕类/移交记录
type: model
description: 从记录留痕类类文档（移交记录）中提取结构化元数据。涵盖字段如：实际移交日期、接收单位签章、移交日期。文档范围包括：建设项目资产移交记录、项目移交记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 移交记录
  member_count: 1
  member_details:
  - 建设项目资产移交记录
  - 项目移交记录
output:
  fields:
  - name: 实际移交日期
    type: date
    description: 提取 实际移交日期 的日期值，格式 YYYY-MM-DD
  - name: 接收单位签章
    type: string
    description: 提取 接收单位签章 的文本值
  - name: 移交日期
    type: date
    description: 提取 移交日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 使用台账.实际投入使用日期 < 验收报告.竣工验收合格日期
  description: 建设工程必须经竣工验收合格后方可交付使用。表达式比较实际投入使用日期与竣工验收报告日期，如果投入使用在先，则属于未验先用违规。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 项目未经验收违规投入使用
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"建设工程经验收合格的，方可交付使用。\"\n  }\n]"
- expression: (责任方签字盖章 IS NULL || 协议覆盖范围 = '管护协议未覆盖全部项目') || (拨付金额 = 0 || 拨付金额 < 资金标准) || (责任主体界定 IS NULL)
  description: 协议缺失、覆盖不全、资金未拨付或拨付不足、制度未明确责任主体，任一条件成立即认定管护机制未落实。
  audit_item: 违反高标农田建后管护及使用规定的行为
  suspicion: 高标准农田建后管护责任主体未落实
  regulation: "[\n  {\n    \"法规名称\": \"高标准农田建设通则\",\n    \"法规文号\": \"GB/T 30600-2022\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"6.4.2\",\n    \"内容概述\": \"应建立管护机制，明确管护主体、管护责任和管护资金，落实管护措施。\"\n  },\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\"\
    : \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十七条\",\n    \"内容概述\": \"项目竣工后，应及时办理资产交付手续，明确管护主体，落实管护责任和管"
