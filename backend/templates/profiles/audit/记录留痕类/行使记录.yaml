name: audit/记录留痕类/行使记录
type: model
description: 从记录留痕类类文档（行使记录）中提取结构化元数据。涵盖字段如：同期安全检查、考核评比的频次和结果、资质年检。文档范围包括：行政职权行使记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 安全
- 检查
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 行使记录
  member_count: 1
  member_details:
  - 行政职权行使记录
output:
  fields:
  - name: 同期安全检查
    type: string
    description: 提取 同期安全检查 的文本值
  - name: 考核评比的频次和结果
    type: boolean
    description: 提取 考核评比的频次和结果 的布尔值（是/否）
  - name: 资质年检
    type: string
    description: 提取 资质年检 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ( 签到表.参训单位 && 通知文件.参训要求措辞（如‘必须’‘全员参加’） ) && ( 签到表.参训单位 && 票据.缴费金额 )
  description: 若培训通知明确要求‘必须参训’、‘未参训不得通过考核’等强制性语句，且参加培训的人员与后续接受该机关监督检查、资质续期的对象几乎完全重合，同时培训收费未按经营服务性收费管理规定报批或备案，则判定为利用行政权力强制培训并收费。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 以行政命令强制参加培训并收费
  regulation: "[\n  {\n    \"法规名称\": \"中共中央办公厅 国务院办公厅关于严禁党政机关到风景名胜区开会的通知（含延伸规定精神）\",\n    \"法规文号\": \"厅字〔2014〕50号\",\n   \
    \ \"效力级别\": \"制度文件\",\n    \"条款号\": \"总体要求\",\n    \"内容概述\": \"严禁党政机关以培训等名义变相收费。\"\n  },\n  {\n    \"法规名称\": \"行政事业性收费标准管理办法\"\
    ,\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"行政事业性收费实行目录清单管理，未列"
