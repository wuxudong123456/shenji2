name: audit/记录留痕类/薪酬记录
type: model
description: 从记录留痕类类文档（薪酬记录）中提取结构化元数据。涵盖字段如：姓名、年度薪酬总额、绩效考核得分、职务。文档范围包括：高管薪酬记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 薪酬记录
  member_count: 1
  member_details:
  - 高管薪酬记录
output:
  fields:
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 年度薪酬总额
    type: date
    description: 提取 年度薪酬总额 的日期值，格式 YYYY-MM-DD
  - name: 绩效考核得分
    type: string
    description: 提取 绩效考核得分 的文本值
  - name: 职务
    type: string
    description: 提取 职务 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (法人治理章程.独立董事人数及比例 == 0) || (法人治理章程.董事会/监事会设置 = '监事会缺失') || (激励约束制度文件.绩效考核指标为空) || ((企业年度审计报告.净利润 < 0) AND (高管薪酬记录.年度薪酬总额
    > 0))
  description: 独立董事为零或监事会缺失，表明治理结构不健全；激励约束制度无绩效考核条款或薪酬与业绩无关联，视为约束机制失效。关联度弱负相关可通过计算近3年高管薪酬变化率与净利润变化率的相关系数判定，若企业亏损而高管薪酬持续增长或未明显下降，即触发。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 社有企业法人治理结构和激励约束机制不健全
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十一条、第一百一十七条\"\
    ,\n    \"内容概述\": \"有限责任公司/股份有限公司应设立监事会，规模较小的可设一至二名监事；上市公司应设独立董事，国有独资公司董事会成员中应当有公司职工代表。\"\n  }\n]"
