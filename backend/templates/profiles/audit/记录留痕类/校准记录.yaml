name: audit/记录留痕类/校准记录
type: model
description: 从记录留痕类类文档（校准记录）中提取结构化元数据。涵盖字段如：有效期、校准日期、设备型号。文档范围包括：实验室设备校准记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 校准记录
  member_count: 1
  member_details:
  - 实验室设备校准记录
output:
  fields:
  - name: 有效期
    type: string
    description: 提取 有效期 的文本值
  - name: 校准日期
    type: date
    description: 提取 校准日期 的日期值，格式 YYYY-MM-DD
  - name: 设备型号
    type: string
    description: 提取 设备型号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (检测记录.实际检测项目数 < GB5749-2022要求的106项) || (检测记录.关键指标(重金属、有机物)未检测次数 > 0) || (检测记录.检测数据连续3个月各指标数值完全相同) || (校准记录.设备校准过期超30天)
    || (汇总表.数据上报延迟天数 > 7)
  description: 1.常规检测未覆盖GB5749-2022中常规42项且非常规未委托第三方即违规；2.重金属、农药、消毒副产物等关键风险指标被长期忽略；3.连续3个月检测数值完全一致或呈规律性变化视为数据造假；4.设备未按期校准导致检测结果无效；5.检测结果未按时上传省级监管平台视为过程失控。
  audit_item: 水质保障和工程运营管理不到位
  suspicion: 水质检测评价体系覆盖不全或弄虚作假
  regulation: "[\n  {\n    \"法规名称\": \"生活饮用水卫生标准\",\n    \"法规文号\": \"GB 5749-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"4.1、4.2\",\n    \"内容概述\": \"生活饮用水水质应符合表1~表3的要求，水质检验项目至少包括常规指标42项和非常规指标64项，并规定了最低检测频次。\"\n  },\n  {\n    \"法规名称\":\
    \ \"检验检测机构资质认定能力评价 检验检测机构通用要求\",\n    \"法规文号\": \"RB/T 214-2017\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"4.4.3\",\n\
    \    \"内容概"
