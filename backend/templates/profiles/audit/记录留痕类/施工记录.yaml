name: audit/记录留痕类/施工记录
type: model
description: 从记录留痕类类文档（施工记录）中提取结构化元数据。涵盖字段如：完成日期、施工内容。文档范围包括：整治施工记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 施工记录
  member_count: 1
  member_details:
  - 整治施工记录
output:
  fields:
  - name: 完成日期
    type: date
    description: 提取 完成日期 的日期值，格式 YYYY-MM-DD
  - name: 施工内容
    type: string
    description: 提取 施工内容 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (记录表.销号状态 = '已消除' && 影像资料.当前房屋状态 = '仍有人居住' && 整治措施 != '工程加固或拆除') || (记录表.销号状态 = '已消除' && 专项资金支付记录为空) || (记录表.整治措施
    = '警示牌/观察使用' && 鉴定报告.建议整治措施 = '停止使用/拆除')
  description: 销号但未采取实质性工程措施（仅悬挂警示牌）、销号后仍有人居住且无工程整治、有销号记录但无对应整治资金支付、整治措施与鉴定报告要求严重不符等情况，均视为虚假销号或整治不到位。
  audit_item: 未按要求开展农村房屋安全隐患排查整治
  suspicion: 安全隐患房屋虚假销号或整治不到位
  regulation: "[\n  {\n    \"法规名称\": \"全国自建房安全专项整治工作方案\",\n    \"法规文号\": \"国办发明电〔2022〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第三部分 分类整治\",\n    \"内容概述\": \"对存在安全隐患的房屋，要逐一制定整治方案，明确整治措施和完成时限，实行销号管理，整治完成一户、销号一户，严禁弄虚作假、虚假销号。\"\n  }\n]"
