name: audit/记录留痕类/维护记录
type: model
description: 从记录留痕类类文档（维护记录）中提取结构化元数据。涵盖字段如：产出量、使用人次、使用日期、使用时长、实际监测日处理峰值、巡查日期、损坏描述、更换配件记录。文档范围包括：供水设备维护记录、灌区设施维护记录、维护记录、规模养殖场粪污处理设施运行维护记录、资产维护记录、项目运营维护记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 维护记录
  member_count: 1
  member_details:
  - 供水设备维护记录
  - 灌区设施维护记录
  - 维护记录
  - 规模养殖场粪污处理设施运行维护记录
  - 资产维护记录
  - 项目运营维护记录
output:
  fields:
  - name: 产出量
    type: string
    description: 提取 产出量 的文本值
  - name: 使用人次
    type: string
    description: 提取 使用人次 的文本值
  - name: 使用日期
    type: date
    description: 提取 使用日期 的日期值，格式 YYYY-MM-DD
  - name: 使用时长
    type: string
    description: 提取 使用时长 的文本值
  - name: 实际监测日处理峰值
    type: string
    description: 提取 实际监测日处理峰值 的文本值
  - name: 巡查日期
    type: date
    description: 提取 巡查日期 的日期值，格式 YYYY-MM-DD
  - name: 损坏描述
    type: string
    description: 提取 损坏描述 的文本值
  - name: 更换配件记录
    type: string
    description: 提取 更换配件记录 的文本值
  - name: 最后维护日期
    type: date
    description: 提取 最后维护日期 的日期值，格式 YYYY-MM-DD
  - name: 用电量
    type: string
    description: 提取 用电量 的文本值
  - name: 粪污日处理量
    type: string
    description: 提取 粪污日处理量 的文本值
  - name: 粪污转运接收量
    type: string
    description: 提取 粪污转运接收量 的文本值
  - name: 维修记录
    type: string
    description: 提取 维修记录 的文本值
  - name: 维护单位-责任人签字
    type: string
    description: 提取 维护单位-责任人签字 的文本值
  - name: 设备状态
    type: boolean
    description: 提取 设备状态 的布尔值（是/否）
  - name: 设施状况
    type: string
    description: 提取 设施状况 的文本值
  - name: 运行状态
    type: boolean
    description: 提取 运行状态 的布尔值（是/否）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (验收文件.设备清单 != 维护记录.采购设备数量) || (TODAY - 维护记录.采购日期 > 设计使用年限*365) || (台账表.漏损率 > 0.2) || (台账表.停水时长 > 48)
  description: 1.设备短缺：实际采购数量少于设计要求；2.设备老化：当前日期减去安装日期超过设计使用年限(如水泵、管网一般为15-20年)；3.损失浪费：漏损率(漏损水量/供水总量)根据行业标准，超过20%为严重漏损；4.供水保障不足：月累计停水时长超过48小时(相当于2天)，视为保障不足。满足任一条件即判定为疑点。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 供水设备短缺老化致供水保障不足
  regulation: "[\n  {\n    \"法规名称\": \"农村饮水安全工程建设管理办法\",\n    \"法规文号\": \"发改农经[2013]2673号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二十一条\",\n    \"内容概述\": \"农村饮水安全工程建成后应落实管理主体，建立健全运行管理制度，保障工程正常运行，确保供水安全。\"\n  },\n  {\n    \"法规名称\": \"\
    城镇供水管网漏损控制及评定标准\",\n    \"法规文号\": \"CJJ92-2016\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"4.2.1\",\n    \"内容概述\": \"\
    城镇供水管网基本漏损率不应"
- expression: 职责分工文件缺失 || (职责划分明确度 == "否") || (维护记录.维护单位/责任人签字 与 规定责任人不一致占比 > 20%)
  description: 若无法提供正式职责分工文件，或文件中未清晰界定政府、市场、用水协会各方管护责任边界，或实际维护记录签字人与文件规定责任人比对不一致比例超过20%，则判定为违规。
  audit_item: 大中型灌区运行管护和取水用水不符合相关规定
  suspicion: 灌区管护责任主体未明确划分
  regulation: "[\n  {\n    \"法规名称\": \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条\"\
    ,\n    \"内容概述\": \"政府应当明确农田水利工程运行维护主体，落实管护责任。\"\n  }\n]"
- expression: (ABS(统计表.上报综合利用率 - 效果报告.实际抽检利用率) > 10%) || (统计表.粪污处理利用总量 / 统计表.粪污产生总量 < 政策文件.考核目标值（综合利用率%）) || (维护记录.粪污日处理量汇总
    < 统计表.粪污处理利用总量 * 0.6)
  description: 通过三重逻辑筛查虚报行为：一是统计上报数据与第三方抽检核查结果的偏差率超过10个百分点阈值；二是实际利用总量与产生总量的比值低于国家或省级政策要求的达标线（例如75%或85%）；三是设施实际运行记录的累计处理量远低于上报利用总量的60%，表明设施处理能力或运行状况无法支撑上报数据，判定为严重数据造假。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 畜禽粪污综合利用率数据虚报瞒报
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国畜牧法\",\n    \"法规文号\": \"中华人民共和国主席令第一二四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"畜禽养殖场应当保证畜禽粪污处理利用设施的正常运行，不得弄虚作假。\"\n  },\n  {\n    \"法规名称\": \"畜禽规模养殖污染防治条例\",\n    \"法规文号\"\
    : \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"向环境排放经过处理的畜禽养殖废弃物，应当符合国家和地方规定的污染物排放标准和"
- expression: (维护记录.用电量为0 || 维护记录.运行状态（正常/故障/停用）=='长期停用') && (验收报告.验收通过时间 != 'NULL') || (验收报告.验收影像资料重复率 > 50%)
  description: 筛查设施验收合格但实际未运行或无法运行的“晒太阳工程”。第一个条件判定设施验收通过后，连续数月无用电记录或维护日志标记为长期停用；第二个条件通过检查验收影像资料哈希值或相似度，识别出不同养殖场或同一养殖场不同时期的验收照片重复使用的造假行为。两项满足其一即构成高度可疑。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 规模养殖场粪污处理设施仅名义配套
  regulation: "[\n  {\n    \"法规名称\": \"畜禽规模养殖污染防治条例\",\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"畜禽养殖场、养殖小区应当建设相应的畜禽粪便、污水与雨水分流设施，畜禽粪便、污水的贮存设施，粪污厌氧消化和堆沤、有机肥加工、制取沼气、沼渣沼液分离和输送、污水处理、畜禽尸体处理等综合利用和无害化处理设施。\"\
    \n  },\n  {\n    \"法规名称\": \"环境保护法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十二条\",\n "
- expression: (实际建设的设施类型、型号、额定日处理能力（吨）.额定日处理能力（吨） < 报批的设施类型、处理能力、防渗标准、设计粪污日产生量（吨）、设计处理设施类型及日处理能力（吨）.设计粪污日产生量（吨） * 0.8) ||
    (验收通过时间、验收影像资料、验收设备清单及技术参数、验收时核定的设施处理能力（吨/日）.验收时核定的设施处理能力（吨/日） / 报批的设施类型、处理能力、防渗标准、设计粪污日产生量（吨）、设计处理设施类型及日处理能力（吨）.设计处理设施类型及日处理能力（吨）
    > 1.2) || (补贴金额、发放对象、申领补贴金额、申领依据的设施处理能力.申领依据的设施处理能力 > 粪污日处理量、
  description: 筛查大型养殖场擅自降低环保设施等级或虚报处理能力以套取高额补贴的行为。第一条判定实际安装的设施额定处理能力低于环评要求设计的粪污产生量80%，存在先天能力不足；第二条判定验收报告核定的处理能力反常地远高于环评设计的处理能力，存在验收放水或数据造假；第三条判定申领补贴的依据处理能力是实际运行时监测峰值的1.5倍以上，表明设施根本无法达到申报时的运行负荷。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 大型养殖场设施实际处理能力缩水
  regulation: "[\n  {\n    \"法规名称\": \"畜禽规模养殖污染防治条例\",\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十三条、第三十八条\",\n    \"内容概述\": \"未建设污染防治配套设施、配套设施不合格，或者未委托他人对畜禽养殖废弃物进行综合利用和无害化处理的，畜禽养殖场不得投入生产。\"\n  },\n  {\n    \"\
    法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\"\
    : \"单位和个人弄"
- expression: (修复台账.损毁原因 == '人为' || 修复台账.损毁原因 == '施工影响') && (备案表.用地范围坐标 ∩ 修复台账.损毁位置 != ∅) && (维护记录.设施状况 在 损毁前 为 '完好') && (修复台账.修复费用
    > 0)
  description: 基础设施损毁如与建设项目空间重叠且原记录完好,可推定施工导致损毁;修复费用>0表明损失已发生。若修复费用未由责任方承担,则进一步违规。
  audit_item: 破坏或未有效利用黑土地
  suspicion: 非法占用或损毁黑土地农田基础设施
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"禁止非法占用或者损毁黑土地农田基础设施。任何单位和个人不得破坏黑土地农田防护林、灌溉渠系、田间道路等基础设施。\"\n  },\n  {\n    \"法规名称\":\
    \ \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"任何单位和个人不得擅自损毁、侵占农田"
- expression: (闲置项目利用率统计表.月均使用频次 < 设计标准 * 0.2) || (设备资产台账.设备状态 == '闲置' && 持续天数 > 180) || (ABS(项目验收报告.实际达标情况 - 预期效益指标) / 预期效益指标
    > 0.5)
  description: 判定项目闲置或利用率低的三个量化标准：1.实际使用频次不足设计标准的20%，如月均使用4次以下而设计为20次；2.设备台账中标记为‘闲置’且持续状态超过半年未作调整；3.实际达产率或使用率与验收报告中的预设指标偏差超过50%，表明绩效成果严重不实。
  audit_item: 项目实施管理不到位
  suspicion: 项目建成后闲置或利用率极低
  regulation: "[\n  {\n    \"法规名称\": \"中央部门项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10 号\",\n    \"效力级别\": \"制度文件\",\n   \
    \ \"条款号\": \"第二十七条\",\n    \"内容概述\": \"绩效评价结果应与预算安排、政策调整、改进管理实质性挂钩，体现奖优罚劣和激励相容导向，对低效无效项目要减少或取消资金安排。\"\n  }\n]"
