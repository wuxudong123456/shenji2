name: audit/记录留痕类/演练记录
type: model
description: 从记录留痕类类文档（演练记录）中提取结构化元数据。涵盖字段如：参与人员签到、参与人员范围、参与部门、参演人员、实际演练日期、整改落实情况、演练主题、演练内容。文档范围包括：应急演练记录、演练记录、饮用水安全应急预案演练记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 整改
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 演练记录
  member_count: 1
  member_details:
  - 应急演练记录
  - 演练记录
  - 饮用水安全应急预案演练记录
output:
  fields:
  - name: 参与人员签到
    type: string
    description: 提取 参与人员签到 的文本值
  - name: 参与人员范围
    type: string
    description: 提取 参与人员范围 的文本值
  - name: 参与部门
    type: string
    description: 提取 参与部门 的文本值
  - name: 参演人员
    type: string
    description: 提取 参演人员 的文本值
  - name: 实际演练日期
    type: date
    description: 提取 实际演练日期 的日期值，格式 YYYY-MM-DD
  - name: 整改落实情况
    type: string
    description: 提取 整改落实情况 的文本值
  - name: 演练主题
    type: string
    description: 提取 演练主题 的文本值
  - name: 演练内容
    type: string
    description: 提取 演练内容 的文本值
  - name: 演练场景
    type: string
    description: 提取 演练场景 的文本值
  - name: 演练日期
    type: date
    description: 提取 演练日期 的日期值，格式 YYYY-MM-DD
  - name: 演练时间
    type: date
    description: 提取 演练时间 的日期值，格式 YYYY-MM-DD
  - name: 演练照片-视频
    type: string
    description: 提取 演练照片-视频 的文本值
  - name: 演练类型
    type: string
    description: 提取 演练类型 的文本值
  - name: 演练结论
    type: string
    description: 提取 演练结论 的文本值
  - name: 现场照片
    type: string
    description: 提取 现场照片 的文本值
  - name: 预案名称
    type: string
    description: 提取 预案名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: （项目综合应急预案.编制日期 IS NULL） || （DATEDIFF(当前检查日期, 项目综合应急预案.编制日期) > 365 且 版本号 未更新） || （应急演练计划 为空 或 应急演练计划.计划时间 已过期且
    演练记录及评估报告 无对应记录） || （应急演练记录及评估报告 记录的演练类型 未覆盖 专项应急预案.预案类型 且 年度内至少一次）
  description: 判定规则：1）无应急预案文本；2）预案超过一年未评估更新，环境变化后预案失效；3）未制定年度演练计划或计划过期未执行；4）演练类型未覆盖主要事故风险，如仅有消防演练而缺失坍塌、触电等专项演练。逻辑用||连接任一触发即判违。
  audit_item: 重大工程项目风险预警
  suspicion: 未按规定编制或更新应急预案且未组织演练
  regulation: "[\n  {\n    \"法规名称\": \"生产安全事故应急预案管理办法\",\n    \"法规文号\": \"应急管理部令第2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十六条、第三十三条\",\n    \"内容概述\": \"生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。应急预案应当至少每三年修订一次，出现特定情形应及时修订。\"\
    \n  }\n]"
- expression: (应急预案文件缺失 OR 预案内容未覆盖预警/响应/处置全流程) || (近三年应急演练次数 = 0) || (登记表.当前库存数量 < 登记表.最低储备数量)
  description: 未编制或预案内容严重缺失的；最近三年内未开展任何应急演练的；应急物资库存低于规定最低限额的，均构成应急保障机制不健全的疑点。
  audit_item: 工程建后管护不到位
  suspicion: 农村饮用水安全应急保障机制不健全
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国突发事件应对法\",\n    \"法规文号\": \"主席令第六十九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十七条、第二十六条\",\n    \"内容概述\": \"地方各级人民政府和企事业单位应当制定应急预案，组织应急演练，储备应急物资，建立健全安全管理制度，预防和减少突发事件的发生。\"\n  }\n]"
- expression: (预案.发布日期 == '无') || (演练记录.演练日期 < 当前日期 - 365天) || (报告表.上报时间 - 事故发现时间 > 2小时)
  description: 未制定书面应急预案、一年内未组织开展应急演练，或发生疑似食品安全事故后超过2小时才向相关部门报告，均属重大管理缺陷。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 食品安全应急预案缺失或事故处理延迟
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国食品安全法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零二条、第一百零三条\",\n    \"内容概述\": \"学校等集中用餐单位应当制定食品安全事故应急预案；发生食品安全事故的单位应当在2小时内向事故发生地县级人民政府食品安全监督管理部门和卫生行政部门报告。\"\n  }\n]"
