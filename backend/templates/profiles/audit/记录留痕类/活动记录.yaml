name: audit/记录留痕类/活动记录
type: model
description: 从记录留痕类类文档（活动记录）中提取结构化元数据。涵盖字段如：参与人数、实际开展的行政职能活动、宣传场次、宣传方式、宣传日期、宣传经费投入、宣传覆盖村数、当事人信息。文档范围包括：公安部门违法活动记录、协会业务活动记录、宣传教育活动记录、秸秆禁烧宣传教育活动记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 活动记录
  member_count: 1
  member_details:
  - 公安部门违法活动记录
  - 协会业务活动记录
  - 宣传教育活动记录
  - 秸秆禁烧宣传教育活动记录
output:
  fields:
  - name: 参与人数
    type: number
    description: 提取 参与人数 的数值（含单位，如万元、吨等）
  - name: 实际开展的行政职能活动
    type: string
    description: 提取 实际开展的行政职能活动 的文本值
  - name: 宣传场次
    type: string
    description: 提取 宣传场次 的文本值
  - name: 宣传方式
    type: string
    description: 提取 宣传方式 的文本值
  - name: 宣传日期
    type: date
    description: 提取 宣传日期 的日期值，格式 YYYY-MM-DD
  - name: 宣传经费投入
    type: number
    description: 提取 宣传经费投入 的数值（含单位，如万元、吨等）
  - name: 宣传覆盖村数
    type: string
    description: 提取 宣传覆盖村数 的文本值
  - name: 当事人信息
    type: string
    description: 提取 当事人信息 的文本值
  - name: 案件性质
    type: string
    description: 提取 案件性质 的文本值
  - name: 案发地址
    type: string
    description: 提取 案发地址 的文本值
  - name: 活动次数
    type: string
    description: 提取 活动次数 的文本值
  - name: 立案日期
    type: date
    description: 提取 立案日期 的日期值，格式 YYYY-MM-DD
  - name: 覆盖村数
    type: string
    description: 提取 覆盖村数 的文本值
  - name: 覆盖行政村数
    type: string
    description: 提取 覆盖行政村数 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (剥离清单.未剥离职能 IS NOT NULL AND 剥离清单.未剥离职能 IN 法定行政职能事项.法定行政职能事项) OR (转移协议.委托事项 IN 法定行政职能事项.法定行政职能事项 AND 转移协议.签订日期
    >= 脱钩政策施行日期)
  description: 剥离清单中仍存在法定行政职能且未剥离，或通过委托协议将法定行政职能交由协会行使，无论是否以购买服务名义，均触发违规。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 未剥离行业协会商会行政职能
  regulation: "[\n  {\n    \"法规名称\": \"行业协会商会与行政机关脱钩总体方案\",\n    \"法规文号\": \"中办发〔2015〕39号\",\n    \"效力级别\": \"党内法规/规范性文件\"\
    ,\n    \"条款号\": \"第二条主要任务（二）职能分离\",\n    \"内容概述\": \"剥离行业协会商会现有的行政职能，法律法规另有规定的除外。行政机关不得将其法定职能转移或委托给行业协会商会行使。\"\n  }\n]"
- expression: 制度文件缺失网格化管理制度 || 制度文件缺失工匠培训制度 || (记录表.巡查日期 < 12) || (明细表.金额（是否包含日常巡查、技术采购） < 5%) || (考核记录.培训次数 < 1)
  description: 未建立必要的网格化管理、工匠培训等制度文件；年度日常巡查次数不足12次（月均不足1次）；专项资金中用于动态监管和技术的支出占比低于5%；年度安全培训少于1次等，均表明长效机制未实质运行。
  audit_item: 未按要求开展农村房屋安全隐患排查整治
  suspicion: 未建立健全农村房屋安全长效机制
  regulation: "[\n  {\n    \"法规名称\": \"全国自建房安全专项整治工作方案\",\n    \"法规文号\": \"国办发明电〔2022〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第五部分 建立健全长效机制\",\n    \"内容概述\": \"要求加快建立农村房屋建设管理长效机制，加强日常巡查和网格化管理，健全农村建筑工匠培训制度，充实基层监管力量，保障经费投入。\"\n  }\n\
    ]"
- expression: (火点坐标、火点时间、火点强度、卫星火点坐标、火点影像等级.卫星火点坐标 NOT IN 处罚地点、处罚决定书文号、处罚金额、处罚时间、处罚案件编号、违规地点坐标.违规地点坐标) OR (处罚地点、处罚决定书文号、处罚金额、处罚时间、处罚案件编号、违规地点坐标.处罚金额
    < 法定最低处罚金额) OR (宣传日期、覆盖村数、参与人数、宣传方式、宣传覆盖村数、宣传场次、宣传经费投入.覆盖村数 / 总村数 < 0.9) OR (巡查频次、巡查覆盖村数、发现火点数、处理情况.巡查频次 = 0)
  description: 1. 将卫星火点坐标与处罚台账地点进行空间匹配，存在火点但无对应处罚记录即视为监管缺失；2. 处罚金额低于《大气污染防治法》规定的最低罚款标准（如500元以下）判定为执法不严；3. 禁烧宣传覆盖率不足90%反映预防措施不到位；4.
    月度巡查频次为0则直接认定未履行监管职责。满足任一条件即生成疑点。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 禁烧区违规焚烧秸秆且监管缺位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国大气污染防治法\",\n    \"法规文号\": \"主席令第三十二号（2018年修订）\",\n    \"效力级别\": \"法律\",\n  \
    \  \"条款号\": \"第七十六条、第一百一十九条\",\n    \"内容概述\": \"禁止在人口集中地区、机场周围、交通干线附近等区域露天焚烧秸秆；违反者由县级以上地方人民政府确定的监督管理部门责令改正，并可处五百元以上二千元以下罚款。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步做好秸秆禁烧和综合利用工作的通知\",\n    \"法规文号\": \"环办函〔2019〕670号\",\n    \"效力级别\": \"部门规章\",\n"
- expression: (COUNT(数据.卫星火点坐标) > COUNT(案件台账.违规地点坐标) * 1.2) || (SUM(CASE WHEN 同一地点火点次数 >= 2 AND 案件台账.处罚案件编号 IS NULL THEN 1
    ELSE 0 END) > 0)
  description: 当区域卫星监测火点数量超过已处罚案件数量的1.2倍（即未处罚率超过16.7%），或存在同一坐标点2次及以上焚烧但无任何处罚记录（重复火点未处罚），则判定为焚烧监管缺位，存在瞒报、漏查或执法不到位的情况。阈值1.2为通用审计经验值，可根据当地实际监管能力调整。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 秸秆禁烧监管缺位导致违规焚烧火点多发
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国大气污染防治法\",\n    \"法规文号\": \"中华人民共和国主席令第三十一号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第七十六条、第一百一十九条\",\n    \"内容概述\": \"省、自治区、直辖市人民政府应当划定区域，禁止露天焚烧秸秆、落叶等产生烟尘污染的物质。违反本法规定，在人口集中地区对树木、花草喷洒剧毒、高毒农药，或者露天焚烧秸秆、落叶等产生烟尘污染的物质的，由县级以上地方人民政府确定的监督管理部门责令改正，并可以处五百元以上二千元以下的罚款。\"\
    \n  }\n]"
- expression: (活动记录.案发地址 = 公租房房屋地址 && 案件性质属于‘治安’‘刑事’‘制假售假’等) || (投诉记录.投诉内容包含‘赌博’‘传销’‘加工点’等关键词 && 处理情况 = ‘属实’) || (统计表.月用量超出同户型均值300%
    && 检查记录.检查发现的可疑活动描述包含‘可疑活动’)
  description: 直接从公安机关获取公租房地址关联的违法记录是最直接证据；群众经核实的举报是重要线索来源；水电用量异常超大（如持续高耗电、高耗水）且物业记录有可疑活动描述，往往指向违法加工、群赌等行为。前两项任一满足即构成严重违规；第三项作为辅助筛查，需结合其他证据确认。
  audit_item: 未按规定使用公共租赁住房
  suspicion: 承租人在公租房内从事违法活动
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"承租人不得在公共租赁住房内从事违法活动。\"\n  }\n]"
