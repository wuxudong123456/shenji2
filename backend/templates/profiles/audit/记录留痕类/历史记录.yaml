name: audit/记录留痕类/历史记录
type: model
description: 从记录留痕类类文档（历史记录）中提取结构化元数据。涵盖字段如：调整后基准利率、调整日期。文档范围包括：央行基准利率调整历史记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 历史记录
  member_count: 1
  member_details:
  - 央行基准利率调整历史记录
output:
  fields:
  - name: 调整后基准利率
    type: string
    description: 提取 调整后基准利率 的文本值
  - name: 调整日期
    type: date
    description: 提取 调整日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 项目贷款合同补充协议（含利率条款）.利率确定方式（固定/浮动） == '浮动' && 央行基准利率调整历史记录.调整日期 < 银行放款凭证.利率调整日期 && 银行放款凭证.利率调整日期 IS NULL || 项目贷款合同补充协议（含利率条款）.利率确定方式（固定/浮动）
    == '浮动' && 银行放款凭证.执行利率 > 项目贷款合同补充协议（含利率条款）.约定利率
  description: 对于约定利率随基准利率浮动的贷款，当央行下调基准利率后，银行应在规定时间内（通常为次年1月1日或利率调整日起）同步下调执行利率。若检查时点实际执行利率仍按原基准计算且高于应执行利率，即为违规。需先确认合同中浮动条款的具体触发条件。
  audit_item: 保障性安居工程建设项目银行贷款未按规定享受优惠利率
  suspicion: 央行降息后未同步下调执行利率
  regulation: "[\n  {\n    \"法规名称\": \"中国人民银行关于调整金融机构存贷款利率的通知\",\n    \"法规文号\": \"银发〔2015〕61号（示例）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"一\",\n    \"内容概述\": \"金融机构应严格按照调整后的利率执行，浮动利率贷款应按合同约定的调整方式及时重定价。\"\n  },\n  {\n    \"法规名称\": \"贷款通则\"\
    ,\n    \"法规文号\": \"中国人民银行令〔1996〕第2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"贷款利率的上下浮动，应当按照中国人民银行"
