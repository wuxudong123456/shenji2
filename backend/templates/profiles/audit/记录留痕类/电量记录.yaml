name: audit/记录留痕类/电量记录
type: model
description: 从记录留痕类类文档（电量记录）中提取结构化元数据。涵盖字段如：用户户号、电价类别代码。文档范围包括：电力营销系统优惠电量记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 电量记录
  member_count: 1
  member_details:
  - 电力营销系统优惠电量记录
output:
  fields:
  - name: 用户户号
    type: string
    description: 提取 用户户号 的文本值
  - name: 电价类别代码
    type: string
    description: 提取 电价类别代码 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 用户名称.执行电价 != 农业用电优惠电价标准.农业用电优惠电价标准 && 用户户号.电价类别代码 != 农业用电代码
  description: 锁定“应享未享”疑点。当人工核査表记录或企业实际结算单价未按政策执行农业优惠电价，且供电公司营销系统的客户档案中，该企业的电价类别未被标识为农业用电代码时，即可判定优惠政策未落实。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 涉农企业未享受用电优惠政策
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电力法\",\n    \"法规文号\": \"中华人民共和国主席令第二十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十四条\",\n    \"内容概述\": \"禁止任何单位和个人在电费中加收其他费用；但是，法律、行政法规另有规定的，按照规定执行。地方集资办电在电费中加收费用的，由省、自治区、直辖市人民政府依照国务院有关规定制定办法。\"\
    \n  },\n  {\n    \"法规名称\": \"关于加快建立健全绿色低碳循环发展经济体系的指导意见\",\n    \"法规文号\": \"国发〔2021〕4号\",\n    \"效力级别\": \"制度文件\",\n "
