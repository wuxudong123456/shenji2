name: audit/记录留痕类/日志
type: model
description: 从记录留痕类类文档（日志）中提取结构化元数据。涵盖字段如：IP地址、上传时间、上传流水号、下发的监理通知单编号、与外部系统接口调用记录、交易记录、人员机械记录、使用日期。文档范围包括：住房公积金业务系统操作日志、保管日志、信息管理系统操作日志、信息管理系统数据字典日志、信息系统操作日志（文件10）、信息系统访问日志、值班日志、公积金业务系统收费模块日志、农药经营数据上传日志、原始采集野外调查日志等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 审批
- 工程
- 元数据提取
