  audit_item: 工程质量事故调查
  suspicion: 监理对关键工序未实施旁站
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第三十八条\",\n    \"内容概述\": \"监理工程师应当按照工程监理规范的要求，采取旁站、巡视和平行检验等形式，对建设工程实施监理。\"\n  },\n  {\n    \"法规名称\": \"房屋建筑工程施工旁站监理管理办法\"\
    ,\n    \"法规文号\": \"建市[2002]189号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"在基础工程方面包括：土方回填，混凝土灌注桩浇筑"
- expression: (环评批复日期.实际开工日期 IS NOT NULL) && (环评批复日期.环评批复日期 IS NULL || 环评批复日期.实际开工日期 < 环评批复日期.环评批复日期)
  description: 当项目存在明确的实际开工日期，但环评批复文件缺失，或实际开工日期早于环评批复日期时，判定为未批先建，触发违规。日期比较精确到日，无容差。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得环评批复擅自开工建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2018修正）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第二十五条、第三十一条\",\n    \"内容概述\": \"建设项目的环境影响评价文件未依法经审批部门审查或者审查后未予批准的，建设单位不得开工建设。未批先建的，由县级以上生态环境主管部门责令停止建设，根据违法情节和危害后果处以罚款，并可责令恢复原状。\"\
    \n  }\n]"
- expression: (对照表.实际开工日期 IS NOT NULL) && ((对照表.规划许可证核发日期 IS NULL) || (对照表.实际开工日期 < 对照表.规划许可证核发日期) || (备案文件.实测总建筑面积 > 许可证.许可建筑面积)
    || (备案文件.实际用途 != 许可证.规划用途) || (用地位置.用地性质 != 许可证.规划用途))
  description: 任一条件成立即违规：1.规划许可证缺失；2.实际开工早于规划许可证核发；3.竣工验收实测建筑面积超出许可面积；4.实际建设用途或用地性质与规划许可不符。面积超出无容忍，任何正偏差均违规。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得规划许可或未按规划许可规定建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第74号（2019修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十条、第六十四条\",\n    \"内容概述\": \"在城市、镇规划区内进行工程建设必须申请办理建设工程规划许可证。未取得许可证或未按许可规定建设的，由主管部门责令停止建设；尚可改正的限期改正，无法改正的限期拆除，并可处罚款。\"\
    \n  }\n]"
- expression: (日志.实际开工日期 IS NOT NULL) && (对照表.开工报告批复日期 IS NULL || 日志.实际开工日期 < 对照表.开工报告批复日期)
  description: 对于法规规定必须取得开工报告的项目，若实际开工日期早于开工报告批复日期，或未取得批复即开工，则判定违规。该表达式要求开工报告批复日期必须存在且不晚于实际开工日期。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得开工报告擅自开工
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"中华人民共和国主席令第29号（2019修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第七条\",\n    \"内容概述\": \"按照国务院规定的权限和程序批准开工报告的建筑工程，不再领取施工许可证。此类项目必须获得开工报告批准方可开工建设。\"\n  },\n  {\n    \"法规名称\"\
    : \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条、第三十三条\",\n    \"内容概述\": \"政府投资项目开工建"
- expression: (审批清单.项目年综合能耗设计值 >= 1000 吨标准煤) && ((许可证.核发日期 < 评估报告.批复时间) || (日志.实际开工日期 < 评估报告.批复时间))
  description: 根据《固定资产投资项目节能审查办法》，年综合能耗超过1000吨标煤的项目，必须在施工许可或开工前通过节能审查。表达式通过比较三个核心日期，只要任一法定前置节点日期早于节能审查批复日期，即可判定为“未批先建”违规。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 项目未取得节能审查意见擅自开工建设
  regulation: "[\n  {\n    \"法规名称\": \"固定资产投资项目节能审查办法\",\n    \"法规文号\": \"国家发展和改革委员会令第44号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第三条、第九条\",\n    \"内容概述\": \"国家实行固定资产投资项目节能审查制度。未按规定进行节能审查或审查未通过的项目，建设单位不得开工建设，已建成的不得投入生产使用。\"\n  },\n  {\n\
    \    \"法规名称\": \"中华人民共和国节约能源法\",\n    \"法规文号\": \"中华人民共和国主席令第七十七号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十五条\",\n\
    \    \"内容概"
- expression: (签证单.变更估价 < 签证单.审批日期) || (设计变更或签证发生金额 > 50万) && (其他.变更程序约定（先审批后施工条款）)
  description: 违反基建程序，属于先实施后审批。判定条件之一是签证单上记录的施工完成或隐蔽日期早于各级（监理、业主、财政）最终审批日期。对于超过50万元的大额变更，若档案中缺失事前技术、经济论证及审批文件，视为严重违规，该签证真实性及合理性存疑。
  audit_item: 某公共建筑合同履行审
  suspicion: 工程变更签证未经审批即施工
  regulation: "[\n  {\n    \"法规名称\": \"建设工程监理规范\",\n    \"法规文号\": \"GB/T 50319-2013\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"6.3.1\",\n    \"内容概述\": \"项目监理机构应按约定程序进行工程变更处理。在工程变更实施前，应审查工程变更的可行性和必要性。\"\n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n\
    \    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\",\n    \"内容概述\": \"政府投资项目投资原则上不得超过经核定的投资概算，确需增加投资的"
- expression: 材料进场验收记录.规格 != 施工图纸.设计要求规格 || 材料检测报告.检测结果 < 设计标准要求强度 || 隐蔽工程验收记录.现场配置 与 施工图纸不一致 || 监理日志中明确记录‘材料未检先用’‘规格不符’等
  description: 任何材料规格、等级不符合设计要求，或检测报告显示强度、厚度等核心指标不达标，均视为偷工减料。合同通常规定降级使用需经设计确认，无设计确认的降级使用直接触发违规。
  audit_item: 重大工程项目全过程审计
  suspicion: 施工过程中偷工减料或使用不合格材料
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十八条、第二十九条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。施工单位在施工过程中发现设计文件和图纸有差错的，应当及时提出意见和建议。施工单位必须按照工程设计要求、施工技术标准和合同约定，对建筑材料、建筑构配件、设备和商品混凝土进行检验，检验应当有书面记录和专人签字；未经检验或者检验不合格的，不得使用。\"\
    \n  }\n]"
- expression: （安全专项施工方案.是否要求论证 == '是' && 专家论证意见书.论证会议日期 IS NULL） || （专家论证意见书.论证会议日期 != NULL && 安全专项施工方案.批准日期 > 专家论证意见书.论证会议日期）
    || （危险性较大分部分项工程清单.工程类别 包含 '深基坑'/'高大模板'/'起重吊装' 且 专家论证意见书 无对应记录） || （项目监理日志.分项工程开工审批日期 < 专家论证意见书.论证会议日期）
  description: 判定规则：1）按规定需要论证的方案，未召开专家论证会直接实施；2）方案审批日期晚于论证日期，说明论证流于形式，方案未经论证即获批；3）工程类别属于危险性较大工程但缺失论证记录；4）实际开工时间早于论证时间，属于未论证先施工的严重违规。
  audit_item: 重大工程项目风险预警
  suspicion: 安全专项施工方案未组织专家论证
  regulation: "[\n  {\n    \"法规名称\": \"建设工程安全生产管理条例\",\n    \"法规文号\": \"国务院令第393号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"施工单位应当在施工组织设计中编制安全技术措施和施工现场临时用电方案，对达到一定规模的危险性较大的分部分项工程编制专项施工方案，并附具安全验算结果，经施工单位技术负责人、总监理工程师签字后实施，由专职安全生产管理人员进行现场监督；其中涉及深基坑、地下暗挖工程、高大模板工程的专项施工方案，施工单位还应当组织专家进行论证、审查。\"\
    \n  }\n]"
