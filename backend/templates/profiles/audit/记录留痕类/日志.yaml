violations:
- expression: (原始会计凭证.金额 != 记账凭证.借贷金额) || (原始会计凭证.对方单位 != 银行对账单.交易对手) || (原始会计凭证.金额 != 银行对账单.交易金额) || (记账凭证.凭证编号 IN (财务系统操作日志.操作内容
    WHERE 操作类型 == '修改' AND 操作时间 NOT IN 正常工作时间))
  description: 此表达式用于筛查伪造或变造会计凭证的疑点：1）原始凭证金额与记账凭证金额不符，可能为篡改；2）原始凭证的交易对手与银行流水中的交易对手不一致，可能为虚构交易；3）原始凭证金额与银行流水金额不符，可能交易为虚假或金额被变造；4）记账凭证在非工作时段被修改，存在人为篡改风险。满足任一条件即生成疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 伪造变造会计凭证进行虚假核算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号（2017年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条、第四十二条\",\n    \"内容概述\": \"任何单位和个人不得伪造、变造会计凭证、会计帐簿及其他会计资料，不得提供虚假的财务会计报告。伪造、变造会计凭证、会计帐簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\
    \n  }\n]"
- expression: 异常操作日志记录表.操作描述 CONTAINS ('投标人名单'、'导出报名表') && (访问时间 NOT BETWEEN '09:00:00' AND '18:00:00' || 操作人 NOT IN (可访问标底人员列表、授权人员账号及姓名.授权人员账号及姓名))
  description: 检出非工作时间或非授权人员对投标人名单数据进行查看、导出的异常记录，符合条件的即为涉嫌泄露投标人名称、数量的高疑点行为。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 向他人透露潜在投标人名称及数量
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"招标人向他人透露已获取招标文件的潜在投标人的名称、数量或者可能影响公平竞争的有关招标投标的其他情况的，或者泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款；对单位直接负责的主管人员和其他直接责任人员依法给予处分；构成犯罪的，依法追究刑事责任。\"\
    \n  }\n]"
- expression: ((访问目标文件（标底文件）.访问内容（含评标专家查询） LIKE '%评标专家%' AND 访问时间 < 开标时间) AND 操作人 NOT IN (权限名单.允许查看人员)) || (相似度(投标文件.技术方案,
    招标文件.技术参数要求) > 0.90 AND 投标准备时长 < 3天)
  description: 开标前非授权人员查阅评标专家名单，或投标文件的技术方案与招标要求异常吻合且准备时间极短，均表明存在评标信息或关键技术参数被提前泄露的风险。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 泄露评标专家名单或关键信息影响公平竞争
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"招标人向他人透露已获取招标文件的潜在投标人的名称、数量或者可能影响公平竞争的有关招标投标的其他情况的，或者泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款。\"\n  }\n]"
- expression: ((ABS(比对表.投标总价 - 记录表.最终标底金额) / 记录表.最终标底金额 < 0.02) 的比对表.各投标人名称数量 >= 2) || (日志.访问目标文件（标底文件） = '标底文件' AND 日志.操作人
    NOT IN (记录表.知悉人员清单))
  description: 两家及以上投标人报价与标底偏差率低于2%，或存在非授权人员访问标底文件，即触发泄露标底疑点。偏差率阈值2%基于审计实务中围标、串标典型特征。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 招标人违法泄露标底
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款；对单位直接负责的主管人员和其他直接责任人员依法给予处分；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
- expression: (分析表.差异数量 > 0 && 分析表.差异原因 NOT IN ('已审批销毁','依法移交')) || (检查记录.防火防潮防盗检查结果 = '不合格') || (检查记录.电子备份检查结论 IS NULL OR
    检查记录.电子备份检查结论 > 7天) || (存档清单.资料名称 NOT IN (资料清单.资料名称) AND 登记表.归还日期 IS NULL)
  description: 1. 盘点差异表中存在缺失资料，且无合规销毁或移交记录，视为毁损灭失；2. 保管环境检查不合格，包括物理环境不达标或电子备份缺失/失败，直接判定违规；3. 存档清单中的应保存资料不在现存清单中，且借阅未归还，也视为保管不善丢失。电子备份机制缺失（如连续7日未成功备份）作为灭失风险纳入。
  audit_item: 未按规定保管会计资料，造成会计资料毁损、灭失；隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告
  suspicion: 未按规定保管会计资料造成毁损灭失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十二条\",\n    \"内容概述\": \"未按照规定保管会计资料，致使会计资料毁损、灭失的，由县级以上人民政府财政部门责令限期改正，可以对单位并处三千元以上五万元以下的罚款；对其直接负责的主管人员和其他直接责任人员，可以处二千元以上二万元以下的罚款；属于国家工作人员的，还应当依法给予行政处分；构成犯罪的，依法追究刑事责任。\"\
    \n  },\n  {\n    \"法规名称\": \"会计档案管理办法\",\n    \"法规文号"
- expression: (销毁登记表.销毁日期 - 销毁登记表.资料形成日期 < 计算法定保管年限(默认30年)) || (系统操作日志.操作类型（删除/修改）= '删除' AND 系统操作日志.操作对象 NOT IN (销毁登记表.销毁资料名称))
    || (盘点差异分析表.缺失资料名称 IN ('原始凭证','记账凭证','会计账簿','财务报告') AND 盘点差异分析表.差异原因 NOT IN ('已审批销毁','依法移交') AND 借阅调取登记表.借出状态 != '未归还')
    || (涉事人员询问笔录 LIKE '%故意销毁%' OR '%隐匿%')
  description: 1. 销毁登记表中销毁的资料形成到销毁年限短于法定保管年限（凭证、账簿30年，年报永久），无论审批是否齐全，均构成故意销毁；2. 系统日志存在删除操作且删除对象不在正规销毁清册中，视为隐匿销毁；3. 盘点发现重要会计资料缺失，且无合规销毁记录、无借阅记录，疑为故意隐匿；4.
    询问笔录中相关人员承认隐匿或销毁的直接作为线索。
  audit_item: 未按规定保管会计资料，造成会计资料毁损、灭失；隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告
  suspicion: 隐匿或者故意销毁依法应当保存的会计资料
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十四条\",\n    \"内容概述\": \"隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告，构成犯罪的，依法追究刑事责任。尚不构成犯罪的，由县级以上人民政府财政部门予以通报，可以对单位并处五千元以上十万元以下的罚款；对其直接负责的主管人员和其他直接责任人员，可以处三千元以上五万元以下的罚款；属于国家工作人员的，还应当由其所在单位或者有关单位依法给予撤职直至开除的行政处分；其中的会计人员，五年内不"
- expression: 绩效目标下达日期 IS NULL OR 绩效目标下达日期 > 预算批复日期
  description: 若不存在绩效目标下达记录，或绩效目标下达日期晚于预算批复日期（即使晚1天），均视为未同步批复下达。在实务中，同步批复要求预算和绩效目标在同一文件或同一批次同步下达，时间差应为0。
  audit_item: 部门、单位预算绩效目标下达或调整不合规
  suspicion: 预算绩效目标未与预算同步批复下达
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"各级财政部门要将绩效目标设置作为预算安排的前置条件，加强绩效目标审核，将绩效目标与预算同步批复下达。\"\n  }\n]"
- expression: 申报产值.申报产值 > 评定表.同意的累计完成产值 * 1.05 && 申请表.申请支付金额 > 申报产值.申报产值 * 合同约定的支付比例
  description: 监理审定的累计完成产值若高于质量验收评定核定的产值5%以上，且建设单位据此超额支付进度款（支付金额超过应支付额），可能存在虚报进度、套取资金。5%为审计容忍合理偏差，超过即视为异常。
  audit_item: 大型水利工程进度与成本审计
