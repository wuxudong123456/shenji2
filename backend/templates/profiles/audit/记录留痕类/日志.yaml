    工程进度款结算应"
- expression: MIN(日志.变更实施旁站记录日期, 日志.变更实施旁站记录日期) < MAX(审批表.最终批准日期, 通知单.设计单位出图日期) || (申请单.变更提出日期 IS NULL && 签证单.签证日期 IS NOT
    NULL)
  description: 若实际施工日期早于最终审批日期或设计变更图纸发出日期，即存在未批先建行为；或仅有现场签证而无变更申请单，属于先干后报。当施工或监理记录的变更时间早于审批完成时间，触发疑点；风险等级：差异天数>15天为严重违规。
  audit_item: 工程变更审计评估
  suspicion: 工程变更未经审批擅自实施
  regulation: "[\n  {\n    \"法规名称\": \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建[2004]369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"工程设计变更确定后14天内，如承包人未提出变更工程价款报告，则发包人可根据所掌握的资料决定是否调整合同价款和调整的具体金额。重大工程变更涉及工程价款变更报告和确认的时限应当严格掌握。\"\
    \n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条"
- expression: (ABS(签证单.工程量 - 踏勘记录.尺寸) > 0) || (验收记录.验收部位 != 签证单.签证内容) || (日志.施工内容 != 签证单.签证内容 && 日志.旁站记录 IS NULL)
  description: 签证工程量与实际核查工程量存在正偏差即判定为虚假；隐蔽验收记录部位与签证部位不匹配，或施工日志无对应记录且监理未旁站，均表明签证内容虚假。若工程量虚增比例>15%，属于严重虚报冒领。
  audit_item: 工程变更审计评估
