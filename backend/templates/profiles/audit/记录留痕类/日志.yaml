    \ \"第三十条\",\n    \"内容概述\": \"施工单位必须建立、健全施工质量的检验制度，严格工序管理，作好隐蔽工程的质量检查和记录。隐蔽工程在隐蔽前，施工单位应当通知建设单位和建设工程质量监督机构。\"\n  },\n  {\n\
    \    \"法规名称\": \"建设工程监理规范\",\n    \"法规文号\": \"GB/T 50319-2013\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"5.2.11\",\n\
    \    \"内容概"
