name: audit/记录留痕类/维修记录
type: model
description: 从记录留痕类类文档（维修记录）中提取结构化元数据。涵盖字段如：修复时长、备件供应情况、故障原因、故障发生时间、故障次数、故障设备数量。文档范围包括：信息化设备维护维修记录、设备故障维修记录、设施维修记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 维修记录
  member_count: 1
  member_details:
  - 信息化设备维护维修记录
  - 设备故障维修记录
  - 设施维修记录
output:
  fields:
  - name: 修复时长
    type: string
    description: 提取 修复时长 的文本值
  - name: 备件供应情况
    type: string
    description: 提取 备件供应情况 的文本值
  - name: 故障原因
    type: string
    description: 提取 故障原因 的文本值
  - name: 故障发生时间
    type: date
    description: 提取 故障发生时间 的日期值，格式 YYYY-MM-DD
  - name: 故障次数
    type: string
    description: 提取 故障次数 的文本值
  - name: 故障设备数量
    type: number
    description: 提取 故障设备数量 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (闲置设备原值.闲置设备原值 / 总设备数量.总设备原值) > 0.15 OR (功能名称.功能名称 IN ('资源库','在线教研') AND 功能名称.访问次数 < 5) OR (年度案例数量.年度案例数量 <
    2)
  description: 闲置设备原值占比大于15%表示大量资金形成闲置浪费；核心教学功能学期使用次数低于5次且年度融合教学案例不足2个，表明平台未真正投入教学。任一条件满足即触发疑点。
  audit_item: 教育信息化基本要求未按规定完成
  suspicion: 教育信息化设备闲置及平台功能使用率低
  regulation: "[\n  {\n    \"法规名称\": \"教育信息化2.0行动计划\",\n    \"法规文号\": \"教技〔2018〕6号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"二、基本原则 （二）坚持应用驱动，融合创新\",\n    \"内容概述\": \"强调将信息技术深度融入教育教学全过程，推动常态化应用，提高教育信息化设备和资源的使用效益，发挥教育信息化对教育现代化的支撑引领作用。\"\n \
    \ }\n]"
- expression: 采购合同.实际采购设备品牌型号 NOT IN 设计建设标准及设备型号及功能要求.设备型号及功能要求 OR 使用表.实际完成进度<使用表.计划完成进度*80% OR 维修记录.故障次数>同类型设施行业平均故障次数*3
    OR 资金支付流向缺乏对应采购合同
  description: 完工进度严重滞后、设备以普通充智能、质量缺陷导致异常高故障率，或资金支付与建设内容不匹配，均构成疑点。故障倍数及进度偏差阈值参考建设项目管理常规审计指标。
  audit_item: 现代农业产业园（集群、强镇）规划、设计、立项不科学
  suspicion: 现代农业产业园基础设施虚报或建设不达标
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十四条\"\
    ,\n    \"内容概述\": \"项目单位应当按照有关规定和批复的建设内容、建设规模、建设标准等进行建设，不得擅自增加或减少建设内容。\"\n  }\n]"
- expression: (其他.竣工日期至维护台账.运维起始日期的间隔 > 60天) OR (维护台账.首次投运记录后90天内累计故障停机时间/总运行时间 > 0.3) OR (运维移交条款.运维费用预算及承担主体 / 项目总投资 < 0.03
    AND 项目总投资 > 500万元)
  description: 工程竣工后60天以上未移交运维，或投运初期频繁故障且维修响应滞后，或运维预算占总投资的比重低于3%且投资额较大，说明建设阶段未同步安排运行维护保障，存在脱节风险。
  audit_item: 污水治理项目建设、运营、管护不到位
  suspicion: 污水处理厂站建设与运维脱节导致闲置或停运
  regulation: "[\n  {\n    \"法规名称\": \"城镇排水与污水处理条例\",\n    \"法规文号\": \"国务院令第641号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"城镇排水与污水处理设施竣工验收后，建设单位应当及时向城镇排水主管部门移交完整的竣工资料，并明确维修养护单位，确保建成后正常运行。\"\n  }\n]"
