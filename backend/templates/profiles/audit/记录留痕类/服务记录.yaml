name: audit/记录留痕类/服务记录
type: model
description: 从记录留痕类类文档（服务记录）中提取结构化元数据。涵盖字段如：技术类型、推广面积、支付方式、收费金额、服务区域、服务对象姓名、服务对象身份证号、服务覆盖户数。文档范围包括：农业技术推广服务记录、家庭医生签约服务记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 服务记录
  member_count: 1
  member_details:
  - 农业技术推广服务记录
  - 家庭医生签约服务记录
output:
  fields:
  - name: 技术类型
    type: string
    description: 提取 技术类型 的文本值
  - name: 推广面积
    type: string
    description: 提取 推广面积 的文本值
  - name: 支付方式
    type: string
    description: 提取 支付方式 的文本值
  - name: 收费金额
    type: number
    description: 提取 收费金额 的数值（含单位，如万元、吨等）
  - name: 服务区域
    type: string
    description: 提取 服务区域 的文本值
  - name: 服务对象姓名
    type: string
    description: 提取 服务对象姓名 的文本值
  - name: 服务对象身份证号
    type: string
    description: 提取 服务对象身份证号 的文本值
  - name: 服务覆盖户数
    type: string
    description: 提取 服务覆盖户数 的文本值
  - name: 服务项目
    type: string
    description: 提取 服务项目 的文本值
  - name: 签约对象姓名
    type: string
    description: 提取 签约对象姓名 的文本值
  - name: 签约日期
    type: date
    description: 提取 签约日期 的日期值，格式 YYYY-MM-DD
  - name: 随访日期
    type: date
    description: 提取 随访日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: sum(服务记录.收费金额) > 0 && 服务记录.服务项目 not in (甲乙双方权责.付费服务包内容与收费标准)
  description: 统计实际收费记录中不属于协议文本中付费服务包内容的收费项目，只要发生未约定项目的收费即触发疑点。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 家庭医生违规收取签约外费用
  regulation: "[\n  {\n    \"法规名称\": \"关于推进家庭医生签约服务的指导意见\",\n    \"法规文号\": \"国医改办发〔2016〕1号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"三、（三）\",\n    \"内容概述\": \"家庭医生团队为居民提供约定的签约服务，除按规定收取签约服务费外，不得另行收取其他费用。\"\n  }\n]"
- expression: (签约对象姓名、服务项目、收费金额、支付方式、签约日期、服务对象姓名、服务对象身份证号、随访日期.随访日期 > 甲乙双方权责、免费服务包内容、付费服务包内容与收费标准、服务频次要求、服务项目.服务频次要求) || (档案更新时间、操作人、操作终端IP.操作终端IP集中度
    > 80%)
  description: 利用GPS及时间戳分析，若随访记录虚构（如单日内同一医生名下记录遍布全镇远超交通半径），或档案录入集中在月末突击补录，且无现场服务佐证，判定为服务缩水。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 家庭医生签约服务缩水
  regulation: "[\n  {\n    \"法规名称\": \"关于规范家庭医生签约服务管理的指导意见\",\n    \"法规文号\": \"国卫基层发〔2018〕35号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"二、（四）条\",\n    \"内容概述\": \"家庭医生团队应当根据签约服务协议，为居民提供综合、连续、协同的签约服务，做实履约，杜绝“签而不约”。\"\n  }\n]"
- expression: 报销药品名称、报销金额、报销机构名称、药品明细、总费用、患者身份证号、就诊时间、诊断.就诊时间 > 注销身份证号、外出登记日期.死亡日期或外出登记日期
  description: 发生报销或产生签约服务的日期，晚于参保人被证明的死亡时间或去外地务工时间。这种超自然时空的诊疗证明系统记录完全是虚假的。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 利用死亡或外出人员信息虚假诊疗套保
  regulation: "[\n  {\n    \"法规名称\": \"医疗保障基金使用监督管理条例\",\n    \"法规文号\": \"国务院令第735号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十条、第四十一条\",\n    \"内容概述\": \"严禁通过伪造、变造、隐匿、涂改、销毁医学文书证明等方式，骗取医保基金。个人以骗取医保基金为目的，由医保行政部门责令退回，处骗取金额2倍以上5倍以下罚款。\"\n  }\n\
    ]"
- expression: '[数据表.化肥减量完成率（%）] = ( [数据表.基线化肥用量（吨/亩）] - [数据表.当期化肥用量（吨/亩）] ) / [数据表.基线化肥用量（吨/亩）] < 0.2 || ( [评分表.考核结果] == ''完成''
    && ( [数据表.化肥减量完成率（%）] < 0.2 || ( [情况文件.实际用于果菜茶产区金额（万元）] / [情况文件.资金拨付总额（万元）] < 0.6 ) ) )'
  description: 计算果菜茶优势产区的化肥减量率，若低于20%即判定未达标。同时设置隐蔽违规逻辑：即便考核结果填报为‘完成’，但只要实际减量率小于20%，或项目资金中仅有不足60%真正投向果菜茶产区（即资金被挪作他用），则认定为目标任务未完成且存在违规行为。阈值60%可根据责任书中规定的资金专款专用比例调整。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 果菜茶优势产区化肥用量未减少20%以上
  regulation: "[\n  {\n    \"法规名称\": \"开展果菜茶有机肥替代化肥行动方案\",\n    \"法规文号\": \"农农发〔2017〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n \
    \   \"条款号\": \"第二部分 目标任务\",\n    \"内容概述\": \"到2020年，果菜茶优势产区化肥用量减少20%以上。\"\n  }\n]"
