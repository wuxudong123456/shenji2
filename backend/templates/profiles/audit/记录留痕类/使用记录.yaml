name: audit/记录留痕类/使用记录
type: model
description: 从记录留痕类类文档（使用记录）中提取结构化元数据。涵盖字段如：已计提准备金、拨付日期、拨付路段、拨付金额、数量、最近使用日期、消毒设备名称、用途。文档范围包括：养护资金拨付和使用记录、农村公路管护资金使用记录、资产共享使用记录、资金拨付和使用记录、风险准备金计提和使用记录、食堂设备设施使用记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 资产
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 使用记录
  member_count: 1
  member_details:
  - 养护资金拨付和使用记录
  - 农村公路管护资金使用记录
  - 资产共享使用记录
  - 资金拨付和使用记录
  - 风险准备金计提和使用记录
  - 食堂设备设施使用记录
output:
  fields:
  - name: 已计提准备金
    type: string
    description: 提取 已计提准备金 的文本值
  - name: 拨付日期
    type: date
    description: 提取 拨付日期 的日期值，格式 YYYY-MM-DD
  - name: 拨付路段
    type: string
    description: 提取 拨付路段 的文本值
  - name: 拨付金额
    type: number
    description: 提取 拨付金额 的数值（含单位，如万元、吨等）
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 最近使用日期
    type: date
    description: 提取 最近使用日期 的日期值，格式 YYYY-MM-DD
  - name: 消毒设备名称
    type: string
    description: 提取 消毒设备名称 的文本值
  - name: 用途
    type: string
    description: 提取 用途 的文本值
  - name: 计提比例
    type: number
    description: 提取 计提比例 的数值（含单位，如万元、吨等）
  - name: 调入部门
    type: string
    description: 提取 调入部门 的文本值
  - name: 调出部门
    type: string
    description: 提取 调出部门 的文本值
  - name: 调剂日期
    type: date
    description: 提取 调剂日期 的日期值，格式 YYYY-MM-DD
  - name: 调剂资产名称
    type: string
    description: 提取 调剂资产名称 的文本值
  - name: 资金用途说明
    type: string
    description: 提取 资金用途说明 的文本值
  - name: 运行状态
    type: boolean
    description: 提取 运行状态 的布尔值（是/否）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 申请资料.存量资产核查结论 != '已核查' || (闲置资产名称.数量 > 0 && 申请资料.数量 > 0 && 申请资料.闲置资产不可用说明缺失)
  description: 新增资产购置前必须核查本单位存量资产，若存在同类可调剂的闲置资产，且未提供合理的不可用说明或无调剂记录，即认定新增资产未考虑存量、造成闲置浪费。
  audit_item: 违反规定配置国有资产
  suspicion: 新增资产未考虑存量资产
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"各部门及其所属单位应当加强资产使用管理，对于长期闲置、低效运转或者超标准配置的资产，应当进行调剂。\"\n  }\n]"
- expression: SET_DIFF(验收移交并达到养护标准的路线编码集合, 登记表.列养路段编码).COUNT > 0 || (TABLE(明细表).分配路段编码 无资金分配的路线编码存在于验收合格路线中)
  description: 已竣工并移交的农村公路，未在列养路段登记表中，或养护资金未覆盖，即为有路未养。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 农村公路未纳入列养范围
  regulation: "[\n  {\n    \"法规名称\": \"农村公路养护管理办法\",\n    \"法规文号\": \"交通运输部令2015年第22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"农村公路养护管理应当遵循县道县管、乡村道乡村管的原则，将所有农村公路纳入养护范围。\"\n  }\n]"
- expression: (实际支出金额、支出事由.实际支出金额 < 资金用途说明.预算金额×0.8 && 实际支出金额、支出事由.支出事由 IN ('行政开支','其他非养护类')) OR (合同设计标准（厚度/强度）.验收实测数据 < 合同设计标准（厚度/强度）.合同设计标准（厚度/强度）×0.9
    OR 各项工程实测值（如道路厚度、混凝土强度、灌溉保证率）、抗压强度、吸水率等指标、检测指标名称、设计标准值、实测值、判定结论、检测机构CMA认证编号、防腐/抗压检测值、试验日期、检测结论.检测结论='不合格' AND 各项工程实测值（如道路厚度、混凝土强度、灌溉保证率）、抗压强度、吸水率等指标、检测指标名称、设计标准值
  description: 资金落实：实际支出低于预算80%且存在非养护类支出，判定资金挪用或闲置；工程质量：验收实测厚度低于设计厚度90%即视为严重偷工减料，或质量检测报告不合格项未闭环整改即视为工程质量缺陷。
  audit_item: 安全隐患排查整治不到位
  suspicion: 管护资金挪用致公路及安防工程质量缺陷
  regulation: "[\n  {\n    \"法规名称\": \"农村公路养护管理办法\",\n    \"法规文号\": \"交通运输部令2015年第22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条、第二十条\",\n    \"内容概述\": \"农村公路养护资金应当实行专款专用，任何单位和个人不得截留、挤占和挪用；县级交通运输主管部门应建立健全资金管理制度，加强监管。\"\n  },\n  {\n \
    \   \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十八条\",\n    \"\
    内容概述\": \"施工单"
- expression: 土地出让合同或划拨决定书.约定动工日期 IS NOT NULL AND (施工许可证.发证日期 IS NULL OR DATEDIFF(施工许可证.发证日期, 土地出让合同或划拨决定书.约定动工日期) > 365)
    AND 土地利用现状统计表.地块状态 = '闲置'
  description: 认定规则：国有建设用地使用权人超过有偿使用合同或划拨决定书约定的动工开发日期满一年未动工开发，即视为闲置土地。表达式校验：从土地出让合同中提取约定动工日期，若未取得施工许可证或施工许可证发证日期滞后约定动工日期超过365天，且土地利用现状统计表中地块被标记为闲置状态，则判定为违规闲置。
  audit_item: 保障性安居工程项目土地闲置
  suspicion: 保障性安居工程项目土地闲置
  regulation: "[\n  {\n    \"法规名称\": \"闲置土地处置办法\",\n    \"法规文号\": \"国土资源部令第53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二条\",\n    \"内容概述\": \"本办法所称闲置土地，是指国有建设用地使用权人超过国有建设用地使用权有偿使用合同或者划拨决定书约定、规定的动工开发日期满一年未动工开发的国有建设用地。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第三十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十八条\",\n    \"\
    内容概述\":"
- expression: (明细表.在保余额 / 资产负债表.净资产) > 10 || (使用记录.已计提准备金 < 明细表.在保余额 * 0.01) || (代偿记录.代偿金额 / 明细表.在保余额) > 0.03
  description: 担保放大倍数（在保余额/净资产）超过10倍，或风险准备金计提低于在保余额的1%，或历史代偿率超过3%，任一指标突破则反映担保公司偿付能力不足，无法有效覆盖住房公积金贷款风险。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 担保公司担保放大倍数超限或准备金不足
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条、第十六条\",\n    \"内容概述\": \"融资担保公司的担保责任余额不得超过其净资产的10倍；融资担保公司应当按照国家有关规定提取未到期责任准备金、担保赔偿准备金，确保准备金充足。\"\n  }\n]"
