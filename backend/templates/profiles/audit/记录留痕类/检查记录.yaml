name: audit/记录留痕类/检查记录
type: model
description: 从记录留痕类类文档（检查记录）中提取结构化元数据。涵盖字段如：加工操作合规项、发现农药管理问题、发现占用、发现的具体问题描述、发现问题摘要、处理结果、处罚决定、安全隐患等级。文档范围包括：企业安全生产检查记录、会计档案保管场所检查记录、会计档案保管环境检查记录、农业主管部门监管检查记录、厨房卫生检查记录、土地执法监察检查记录、实地检查记录、家庭农场政策执行情况监督检查记录、村卫生室药品效期检查记录、消防检查记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 安全
- 整改
- 检查
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 检查记录
  member_count: 1
  member_details:
  - 企业安全生产检查记录
  - 会计档案保管场所检查记录
  - 会计档案保管环境检查记录
  - 农业主管部门监管检查记录
  - 厨房卫生检查记录
  - 土地执法监察检查记录
  - 实地检查记录
  - 家庭农场政策执行情况监督检查记录
  - 村卫生室药品效期检查记录
  - 消防检查记录
  - 物业公司入户检查记录
  - 环保部门执法检查记录
  - 环保部门现场检查记录
  - 环保部门监管检查记录
  - 现场检查记录
  - 监理单位检查记录
  - 监督检查记录
  - 禁捕工作现场检查记录
  - 耕地保护执法检查记录
