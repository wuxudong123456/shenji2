name: audit/记录留痕类/平台记录
type: model
description: 从记录留痕类类文档（平台记录）中提取结构化元数据。涵盖字段如：上传数据频次、发票代码、发票号码、开票日期、最近数据时间、状态、采购方式、采购项目编号。文档范围包括：政府采购平台记录、数据平台记录、税务发票查验平台记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 票据
- 采购
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 平台记录
  member_count: 1
  member_details:
  - 政府采购平台记录
  - 数据平台记录
  - 税务发票查验平台记录
output:
  fields:
  - name: 上传数据频次
    type: string
    description: 提取 上传数据频次 的文本值
  - name: 发票代码
    type: string
    description: 提取 发票代码 的文本值
  - name: 发票号码
    type: string
    description: 提取 发票号码 的文本值
  - name: 开票日期
    type: date
    description: 提取 开票日期 的日期值，格式 YYYY-MM-DD
  - name: 最近数据时间
    type: date
    description: 提取 最近数据时间 的日期值，格式 YYYY-MM-DD
  - name: 状态
    type: boolean
    description: 提取 状态 的布尔值（是/否）
  - name: 采购方式
    type: string
    description: 提取 采购方式 的文本值
  - name: 采购项目编号
    type: string
    description: 提取 采购项目编号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (登记清单.车辆来源（国产/进口） = '进口' AND 平台记录.采购方式 NOT IN ('公开招标', '政府集中采购')) OR (购置清单.批准文号 IS NULL AND 登记清单.车辆来源（国产/进口）
    = '进口')
  description: 进口车辆必须履行规定的政府采购程序且取得进口审批，无合规采购方式或无批准文号的进口车均属违规。
  audit_item: 违规配备公务用车
  suspicion: 违反规定进口或购买汽车
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"党政机关应当配备使用国产汽车，带头使用新能源汽车，除特殊情况外不得购置进口汽车。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n \
    \   \"法规文号\": \"主席令第六十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"政府采购实行集中采购和分散采购相结合，纳入集中采购目录的政府采购项目，"
- expression: 验收记录.验收状态='已验收' && (设施台账.近6个月数据上传次数=0 || 设施台账.月均用电量=0)
  description: 已完成验收的计量设施，若近6个月无任何数据上传或无用电记录，说明设施处于闲置或停用状态。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 计量设施建成后闲置未投入使用
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"三、建立健全农业水价形成机制（七）\",\n    \"内容概述\": \"加强计量设施的运行维护和管理，确保其正常运行，为实行计量收费奠定坚实基础。\"\n  }\n]"
- expression: (税务查验.发票状态 IN ('作废','红冲','不存在')) || (ABS(企业会计账簿.原材料成本 / 申报面积 - 行业标准成本) / 行业标准成本 > 0.5) || (银行流水.付款对象 != 会计原始凭证.供应商名称)
    || (项目验收报告.实际产能 < 申报产能 * 0.6)
  description: 若企业入账凭证中的发票经税务平台查验为异常状态，或单位面积原材料成本超出当地同行业平均标准50%以上，或银行流水支付对象与凭证列示供应商名称不符，或项目验收实际产能不及申报产能的60%，即判定为疑点。行业标准成本可参照当地农业部门公布的参考值。
  audit_item: 骗取套取涉农财政专项资金
  suspicion: 企业伪造会计凭证骗取涉农项目补贴
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十三条\",\n    \"内容概述\": \"伪造、变造会计凭证、会计账簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n\
    \    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"企业和个人以虚报、冒领等手段骗取财政资金的，依照本条例处理"
