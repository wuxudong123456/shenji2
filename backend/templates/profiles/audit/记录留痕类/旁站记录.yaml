name: audit/记录留痕类/旁站记录
type: model
description: 从记录留痕类类文档（旁站记录）中提取结构化元数据。涵盖字段如：实际旁站起止时间、旁站部位、现场异常情况记录、记录人、起止时间、部位。文档范围包括：旁站记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 旁站记录
  member_count: 1
  member_details:
  - 旁站记录
output:
  fields:
  - name: 实际旁站起止时间
    type: date
    description: 提取 实际旁站起止时间 的日期值，格式 YYYY-MM-DD
  - name: 旁站部位
    type: string
    description: 提取 旁站部位 的文本值
  - name: 现场异常情况记录
    type: string
    description: 提取 现场异常情况记录 的文本值
  - name: 记录人
    type: string
    description: 提取 记录人 的文本值
  - name: 起止时间
    type: date
    description: 提取 起止时间 的日期值，格式 YYYY-MM-DD
  - name: 部位
    type: string
    description: 提取 部位 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (验收记录.验收日期 为空) || (验收记录.施工单位签字 == 监理单位签字) || (验收记录.验收日期 < 施工日志.完成时间) || (旁站记录.旁站部位 不含 验收记录.验收部位 && 日志.验收参与记录
    不存在)
  description: 隐蔽工程验收记录缺失最直接的表现是验收日期为空；代签表现为施工单位与监理单位为同一人签字；验收日期早于施工完成日期属逻辑异常；监理未对关键部位进行旁站或日志中无相应验收参与记载，则该验收记录真实性存疑。上述任一条件成立均触发疑点。
  audit_item: 工程质量事故调查
  suspicion: 隐蔽工程验收记录缺失或代签
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第三十条\",\n    \"内容概述\": \"施工单位必须建立、健全施工质量的检验制度，严格工序管理，作好隐蔽工程的质量检查和记录。隐蔽工程在隐蔽前，施工单位应当通知建设单位和建设工程质量监督机构。\"\n  },\n  {\n\
    \    \"法规名称\": \"建设工程监理规范\",\n    \"法规文号\": \"GB/T 50319-2013\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"5.2.11\",\n\
    \    \"内容概"
- expression: (旁站记录.旁站部位 不包含 施工日志.部位) || (旁站记录.起止时间 未覆盖 施工日志.关键工序施工起止时间) || (监理日志.旁站情况摘要 == 无 且 旁站记录 为空)
  description: 根据旁站方案要求的部位，若施工日志显示该工序已施工，但旁站记录无对应部位或时间未全程覆盖；或监理日志中无任何旁站记载，则判定旁站缺失。
  audit_item: 工程质量事故调查
  suspicion: 监理对关键工序未实施旁站
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第三十八条\",\n    \"内容概述\": \"监理工程师应当按照工程监理规范的要求，采取旁站、巡视和平行检验等形式，对建设工程实施监理。\"\n  },\n  {\n    \"法规名称\": \"房屋建筑工程施工旁站监理管理办法\"\
    ,\n    \"法规文号\": \"建市[2002]189号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"在基础工程方面包括：土方回填，混凝土灌注桩浇筑"
