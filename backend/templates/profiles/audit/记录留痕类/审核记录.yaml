name: audit/记录留痕类/审核记录
type: model
description: 从记录留痕类类文档（审核记录）中提取结构化元数据。涵盖字段如：公示许可证号、审核人、审核时间、审核结论、店铺名称、最近核验时间。文档范围包括：审核记录、电商平台种子销售资质审核记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 审核记录
  member_count: 1
  member_details:
  - 审核记录
  - 电商平台种子销售资质审核记录
output:
  fields:
  - name: 公示许可证号
    type: string
    description: 提取 公示许可证号 的文本值
  - name: 审核人
    type: string
    description: 提取 审核人 的文本值
  - name: 审核时间
    type: date
    description: 提取 审核时间 的日期值，格式 YYYY-MM-DD
  - name: 审核结论
    type: string
    description: 提取 审核结论 的文本值
  - name: 店铺名称
    type: string
    description: 提取 店铺名称 的文本值
  - name: 最近核验时间
    type: date
    description: 提取 最近核验时间 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (审核记录.公示许可证号 IS NULL) || (审核记录.公示许可证号 NOT IN 档案.许可证号) || (处理清单.下架完成时间 > 3个工作日)
  description: 平台内商家未公示许可证号、公示的许可证号在官方许可档案中不存在或已失效，均属资质审核不合规；自收到投诉举报起至完成下架超过3个工作日，属于监管处置超时。任一情况触发疑点。
  audit_item: 种业市场监管方面不符合相关规定
  suspicion: 种子网络销售资质审核与监管缺失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"中华人民共和国主席令第三十五号（2015年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十七条\",\n    \"内容概述\": \"电子商务平台经营者应当对平台内种子经营者的身份、地址、联系方式、生产经营许可证或者备案信息等进行核验、登记，建立登记档案，并定期核验更新。\"\n  }\n\
    ]"
- expression: (明细表.救助类型='低保' AND 明细表.发放金额>0) AND (比对表.社保缴纳状态='在职' OR ABS(比对表.税务申报收入 - 证明材料.申报收入) > 证明材料.申报收入*0.2 OR 比对表.不动产登记信息
    IS NOT NULL) AND 明细表.身份证号 = 比对表.身份证号
  description: 若低保在保人员实际有在职社保、申报收入与实际收入偏差超20%、或名下有不动产登记，表明收入核定不实，可能存在超额发放。其中，偏差率阈值20%参考常规审计经验，可根据地方细化规定调整。
  audit_item: 社会保障待遇计算、发放错误
  suspicion: 收入核定错误导致低保金超额发放
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十一条、第五十八条\",\n    \"内容概述\": \"申请最低生活保障需如实申报家庭收入财产，县级民政部门应通过信息核对等方式核实；审核审批人员应按规定核实，不得徇私舞弊。\"\n  }\n]"
- expression: DATEDIFF(明细表.发放时间, 审核结论、审核人、审核时间.审批通过时间) > 审批时限、发放时限规定.审批时限 AND 明细表.救助类型='临时救助'
  description: 临时救助资金发放时间与审批通过时间的间隔超过制度规定的上限（如5个工作日），即构成发放超期违规。
  audit_item: 社会保障待遇计算、发放错误
  suspicion: 临时救助金发放周期超期
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十八条\",\n    \"内容概述\": \"对需要紧急救助的生活无着人员，应当及时给予救助；临时救助的具体程序由县级以上民政部门规定，明确审批发放时限。\"\n  }\n]"
