violations:
- expression: (差异条款.合同条款 >= 1) && (沟通记录.评标前合作记录 == 是) && (处理记录.投诉内容 == 是)
  description: 实质性条款差异指价格、付款条件、工期、技术标准等关键内容发生变化；评标前沟通指招标公告发布前已有接触记录；未中标人投诉中直接指认内定。三项条件同时满足，可认定为内定并违法谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人提前内定中标人并通过谈判变更合同条款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  }\n]"
- expression: 涉及服务不及时、无人照护的投诉内容及次数、投诉人名称、投诉事由（乱收费/乱收保证金）、涉事部门、关于推诿扯皮的投诉内容.投诉类型 = '信息泄露' AND 涉及服务不及时、无人照护的投诉内容及次数、投诉人名称、投诉事由（乱收费/乱收保证金）、涉事部门、关于推诿扯皮的投诉内容.处理结果
    = '成立'
  description: 若投诉统计中明确存在信息泄露类投诉且经查属实，即可判定为招标人向特定投标人泄露应当保密的招标信息。如能获得技术方案相似度数据，可补充‘中标人技术方案与招标人内部资料相似度>90%’作为辅助判定。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 招标人向特定投标人泄露招标信息
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十二条\",\n    \"内容概述\": \"招标人不得向他人透露已获取招标文件的潜在投标人的名称、数量以及可能影响公平竞争的有关招标投标的其他情况。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十一条\",\n    \"内容概述\": \"禁止招标人与投标人串通投标，包括招标人"
- expression: (公告.业绩要求 / 限价文件.招标控制价金额 > 2) || (INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本地')>0 || INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本市')>0
    || INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本省')>0) || (INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'特定行业协会')>0)
  description: 判定规则：1. 业绩合同金额门槛超过招标控制价2倍以上，构成明显过高要求；2. 资格条件中包含地域关键词（本地、本市、本省）即构成地域歧视；3. 要求特定行业协会认证等非通用行业认证，指向个别企业。任一条件满足即触发违规疑点。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 以不合理的条件限制或排斥潜在投标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  }\n]"
- expression: COUNT(DISTINCT(统计表.各投标人保证金缴纳金额 / 对比表.投标总报价)) > 1 && 招标文件保证金比例统一
  description: 同一标段内，各投标人实际缴纳保证金的比例（保证金金额/投标报价）应一致；若出现不同比例，且招标文件规定了统一比例，即存在差别对待，构成歧视待遇。差异超过2个百分点为严重违规。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 对潜在投标人实行歧视待遇
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  }\n]"
- expression: INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'必须组成联合体')>0 || INSTR(公告.是否接受独立投标相关条款,'不接受独立投标')>0
  description: 招标文件条款中出现强制联合体措辞，如‘投标人必须组成联合体’、‘不接受独立投标人’等，即构成强制联合体，违反法规。项目不具备必须联合体的法定情形，任何强制要求均属违规。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 强制要求投标人组成联合体共同投标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十七条\",\n    \"内容概述\": \"招标人应当在资格预审公告、招标公告或者投标邀请书中载明是否接受联合体投标。招标人不得强制投标人组成联合体共同投标。\"\n  }\n]"
- expression: INSTR(公告.合同草案条款（排他性义务、后续合作限制）,'中标后不得参与')>0 && INSTR(公告.合同草案条款（排他性义务、后续合作限制）,'后续')>0 || INSTR(公告.合同草案条款（排他性义务、后续合作限制）,'排他性')>0
    || INSTR(公告.合同草案条款（排他性义务、后续合作限制）,'独家')>0
  description: 合同或招标文件合同草案中出现‘中标后不得参与后续同类项目’、‘签订排他性长期协议’、‘独家合作’等限制未来市场竞争的条款，即构成以不合理条件限制竞争，触发违规。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 设置排他性条款限制投标人之间竞争
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人。\"\n  }\n]"
- expression: 明细台账.保证金项目名称 NOT IN (法定保证金项目名称、设立依据、法定保证金比例上限（如质量保证金不超过3%）.法定保证金项目名称) || (收取通知.保证金项目名称 未在单位设定的保证金项目名称、设立依据中载明  &&
    无任何政策文件依据)
  description: 若实际收取的保证金项目名称未出现在国务院或省级公布的涉企保证金目录清单中，或单位无法提供该保证金项目的设立依据文件、政策文件编号，则判定为违规收取无依据保证金。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 违规收取无政策依据的涉企保证金
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于清理规范工程建设领域保证金的通知\",\n    \"法规文号\": \"国办发〔2016〕49号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"全面清理各类保证金。对建筑业企业在工程建设中需缴纳的保证金，除依法依规设立的投标保证金、履约保证金、工程质量保证金、农民工工资保证金外，其他保证金一律取消。\"\
    \n  },\n  {\n    \"法规名称\": \"关于公布涉企保证金目录清单的通知\",\n    \"法规文号\": \"工信部联运行〔2017〕236号\",\n    \"效力级别\": \"部门规章\",\n  "
- expression: (CONTAINS(招标文件.资格条件条款, '本地') || CONTAINS(招标文件.资格条件条款, '本市') || CONTAINS(招标文件.资格条件条款, '本省') || CONTAINS(招标文件.资格条件条款,
    '系统内') || CONTAINS(招标文件.资格条件条款, '所属部门')) && (外地投标人数量 / 总投标人数量 < 0.1 || 外地投标人数量 < 2)
  description: 筛查招标文件资格条件中是否存在地域或部门限制性关键词，同时分析投标人地域分布。外地投标人占比低于10%或数量少于2家视为异常，表明限制条件已实质排斥外地企业。两条同时满足则触发疑点。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 招标文件设置地域或部门限制排斥潜在投标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条第二款\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n\
    \    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十二条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制、排斥潜在投标人或者投标人，包括"
- expression: (中标通知书.中标人 != 推荐中标候选人名单及排名.推荐中标候选人名单及排名) || (各评分项得分.各评分项得分 || 权重与招标文件不一致) || (资质文件.关联关系 && 中标排名非第一)
  description: 筛查中标人不是评标委员会推荐的第一候选人的项目，或评标过程中使用了与招标文件不一致的评分标准，或中标人与招标人存在关联关系却低排名中标。任一条件触发即为违规调整中标结果疑点。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 未按法定程序和评标结果确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
