    type: string
    description: 提取 催收证明附件 的文本值
  - name: 关于保证金差异的投诉内容
    type: string
    description: 提取 关于保证金差异的投诉内容 的文本值
  - name: 关于强制联合体的异议内容
    type: string
    description: 提取 关于强制联合体的异议内容 的文本值
  - name: 关于推诿扯皮的投诉内容
    type: string
    description: 提取 关于推诿扯皮的投诉内容 的文本值
  - name: 关于限制竞争条款的异议内容
