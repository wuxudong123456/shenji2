name: audit/记录留痕类/处理记录
type: model
description: 从记录留痕类类文档（处理记录）中提取结构化元数据。涵盖字段如：催收证明附件、关于保证金差异的投诉内容、关于强制联合体的异议内容、关于推诿扯皮的投诉内容、关于限制竞争条款的异议内容、医疗废物交接记录、后续岗位空缺情况、处理状态。文档范围包括：企业信访处理记录、企业投诉处理记录、保险机构理赔投诉处理记录、医疗废物处理记录、坏账处理记录、投标人异议处理记录、投标人投诉处理记录、投诉举报处理记录、投诉处理记录、拖欠农民工工资投诉处理记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 审批
- 金额
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 处理记录
  member_count: 1
  member_details:
  - 企业信访处理记录
  - 企业投诉处理记录
  - 保险机构理赔投诉处理记录
  - 医疗废物处理记录
  - 坏账处理记录
  - 投标人异议处理记录
  - 投标人投诉处理记录
  - 投诉举报处理记录
  - 投诉处理记录
  - 拖欠农民工工资投诉处理记录
  - 村民对物流服务的投诉处理记录
  - 村民投诉处理记录
  - 渔民投诉举报处理记录
  - 盘亏处理记录
  - 盘盈处理记录
  - 相关投诉或举报处理记录
  - 质疑与投诉处理记录
  - 违约处理记录
