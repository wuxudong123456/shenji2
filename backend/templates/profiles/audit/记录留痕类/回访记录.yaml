name: audit/记录留痕类/回访记录
type: model
description: 从记录留痕类类文档（回访记录）中提取结构化元数据。涵盖字段如：否认知情或签字情况、回访对象。文档范围包括：抽样电话回访记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 回访记录
  member_count: 1
  member_details:
  - 抽样电话回访记录
output:
  fields:
  - name: 否认知情或签字情况
    type: string
    description: 提取 否认知情或签字情况 的文本值
  - name: 回访对象
    type: string
    description: 提取 回访对象 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 表决汇总结果（户数、面积比例）.表决汇总结果（户数、面积比例）/业主姓名、房号、电话.业主姓名 < 2/3 || (回访对象、否认知情或签字情况.否认知情或签字情况 / 回访对象、否认知情或签字情况.回访对象 >=
    0.2)
  description: 维修资金使用事项法定需经专有部分面积占比及人数占比均三分之二以上业主参与表决，并经参与表决的业主过半数同意。算出的同意户数比例不达此标准，或随机电话回访中有至少20%的被抽中业主明确否认参与表决或否认签名，即高度疑似签名造假。
  audit_item: 挪用住宅专项维修资金
  suspicion: 伪造业主表决签名套取维修资金
  regulation: "[\n  {\n    \"法规名称\": \"《住宅专项维修资金管理办法》\",\n    \"法规文号\": \"建设部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条、第二十三条\",\n    \"内容概述\": \"使用维修资金须由业主大会或者相关业主对使用方案进行表决，并达到规定的专有部分面积和人数比例的通过要求。伪造签名属于虚构了合法的决策前提。\"\n  }\n]"
