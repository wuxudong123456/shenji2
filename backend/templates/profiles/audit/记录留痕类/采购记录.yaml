name: audit/记录留痕类/采购记录
type: model
description: 从记录留痕类类文档（采购记录）中提取结构化元数据。涵盖字段如：价格、供应商、单价、型号、实际采购内容与数量、总金额、数量、购买产品品牌。文档范围包括：供水设备采购记录、农户采购记录、礼品采购记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 采购
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 采购记录
  member_count: 1
  member_details:
  - 供水设备采购记录
  - 农户采购记录
  - 礼品采购记录
output:
  fields:
  - name: 价格
    type: number
    description: 提取 价格 的数值（含单位，如万元、吨等）
  - name: 供应商
    type: string
    description: 提取 供应商 的文本值
  - name: 单价
    type: number
    description: 提取 单价 的数值（含单位，如万元、吨等）
  - name: 型号
    type: string
    description: 提取 型号 的文本值
  - name: 实际采购内容与数量
    type: number
    description: 提取 实际采购内容与数量 的数值（含单位，如万元、吨等）
  - name: 总金额
    type: number
    description: 提取 总金额 的数值（含单位，如万元、吨等）
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 购买产品品牌
    type: string
    description: 提取 购买产品品牌 的文本值
  - name: 采购日期
    type: date
    description: 提取 采购日期 的日期值，格式 YYYY-MM-DD
  - name: 采购物品名称
    type: string
    description: 提取 采购物品名称 的文本值
  - name: 采购设备数量
    type: number
    description: 提取 采购设备数量 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 合作合同.是否包含排他性条款 == '唯一指定' || '独家供应' || ( 采购记录.供应商 == 指定供应商 && 采购记录.价格 > 市场同期均价 * 1.3 ) || 合作合同.供应商与供电企业关联关系
  description: 强制指定供应商、利用垄断地位抬高价格或存在利益输送均属违规；价格偏差超过30%为异常阈值。
  audit_item: 电网改造和供电服务不合规
  suspicion: 强制农户在指定厂家购买表后线及设施
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国反垄断法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十七条\",\n    \"内容概述\": \"禁止具有市场支配地位的经营者没有正当理由，限定交易相对人只能与其交易或者只能与其指定的经营者进行交易。\"\n  }\n]"
