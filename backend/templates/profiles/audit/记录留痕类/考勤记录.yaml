name: audit/记录留痕类/考勤记录
type: model
description: 从记录留痕类类文档（考勤记录）中提取结构化元数据。涵盖字段如：出勤工时、参会人员当天打卡或工作记录、外出情形、姓名、所属班组、每日打卡记录、研发人员实际出勤天数、考勤日期。文档范围包括：人员考勤记录、单位考勤记录、考勤记录、项目组成员考勤记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 考勤记录
  member_count: 1
  member_details:
  - 人员考勤记录
  - 单位考勤记录
  - 考勤记录
  - 项目组成员考勤记录
output:
  fields:
  - name: 出勤工时
    type: string
    description: 提取 出勤工时 的文本值
  - name: 参会人员当天打卡或工作记录
    type: string
    description: 提取 参会人员当天打卡或工作记录 的文本值
  - name: 外出情形
    type: string
    description: 提取 外出情形 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 所属班组
    type: string
    description: 提取 所属班组 的文本值
  - name: 每日打卡记录
    type: string
    description: 提取 每日打卡记录 的文本值
  - name: 研发人员实际出勤天数
    type: number
    description: 提取 研发人员实际出勤天数 的数值（含单位，如万元、吨等）
  - name: 考勤日期
    type: date
    description: 提取 考勤日期 的日期值，格式 YYYY-MM-DD
  - name: 请假记录
    type: string
    description: 提取 请假记录 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 进出场时间
    type: date
    description: 提取 进出场时间 的日期值，格式 YYYY-MM-DD
  - name: 门禁记录
    type: string
    description: 提取 门禁记录 的文本值
  - name: 领导干部签到时间
    type: date
    description: 提取 领导干部签到时间 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (聘用协议文件.甲乙双方名称及签章 CONTAINS 领导干部姓名 OR 聘用协议文件.甲乙双方名称及签章 CONTAINS 领导干部化名) && (党员领导干部个人事项报告表.兼职取酬情况 IS NULL OR 党员领导干部个人事项报告表.承包租赁经营活动申报
    IS NULL) && (银行账户流水.交易金额 == 聘用协议文件.酬金/租金金额及支付方式 OR 银行账户流水.交易金额 累计超过 5000元/月) && (银行账户流水.资金用途（顾问费/租金/承包费） IN ['顾问费','租赁费','承包费','咨询费'])
    && (单位考勤记录.请假记录 IS NOT NULL OR 单位
  description: 当存在承包、租赁、聘用协议文件且协议乙方为领导干部本人或其化名，但个人事项报告表未申报该项兼职或经营活动，同时银行流水显示有规律性金额转账（累计月均超5000元作为参考阈值）且备注为经营类款项，并辅以考勤异常，则判定为私自从事经营活动。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 私自以承包、租赁、受聘等方式从事经营活动
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（五）项、第（六）项\",\n    \"内容概述\": \"违反有关规定从事营利活动，有下列行为之一的：（五）违规在经济组织、社会组织等单位中兼职，或者经批准兼职但获取薪酬、奖金、津贴等额外利益；（六）利用参与企业重组改制、定向增发、兼并投资等工作中掌握的信息买卖股票，或者以其他方式非正常获利。私自承包、租赁、受聘属于违规兼职或从事营利活动。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国公务员"
- expression: (会议费用明细表.餐饮支出 > 会议费用明细表.实际总支出金额*0.6 OR 培训费用明细表.餐饮支出 > 培训费用明细表.金额*0.6) AND (会议培训支撑材料.签到表 IS NULL OR 会议培训支撑材料.签到表笔迹雷同
    OR 会议培训支撑材料.签到人员与人员考勤记录矛盾) AND ((会议费用明细表.实际总支出金额/会议费用明细表.参会人数) > 近三年同类活动人均支出*3 OR (培训费用明细表.金额) > 近三年同类活动人均支出*3)
  description: 会议/培训餐饮占比畸高（>60%）、活动佐证材料虚假或缺失、人均支出异常超高，三者叠加表明活动极可能不实，实为接待费转移。
  audit_item: 公务接待费预算执行不合规
  suspicion: 虚构会议培训隐匿接待费开支
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第八条、第二十条\",\n    \"内容概述\": \"严禁以会议、培训等名义进行公款消费，严禁虚列会议费套取资金用于接待。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\"\
    ,\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"各单位应当严格会议费管理，不得虚报、冒领会议费，不"
- expression: (支付台账.实发工资 > 组织计划.计划用工天数 * 1.2) && (支付台账.姓名 NOT IN 考勤记录.姓名) || (支付台账.工时 > 考勤记录.出勤工时 * 1.3)
  description: 当实际支付人工费超出预算的20%时，或工资表中存在未在实名制考勤中登记的‘影子人员’，或计薪工时大幅超过考勤记录的130%时，触发疑点报警。
  audit_item: 工程项目成本异常调查
  suspicion: 人工费虚列或超支
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"用人单位实行农民工劳动用工实名制管理，与招用的农民工书面约定或者通过依法制定的规章制度规定工资支付标准、支付时间、支付方式等内容。\"\n  },\n  {\n    \"法规名称\"\
    : \"基本建设财务规则\",\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\",\n    \"内容概述\": \"项目建设单位应当严格控制建设"
- expression: (统计台账.项目月度实际研发人数 - 考勤记录.研发人员实际出勤天数) / 统计台账.项目月度实际研发人数 > 0.3 || (工时分摊比例与合同岗位不符) || (设备采购无研发关联性)
  description: 若申报研发人数与实际到岗人数偏差超过30%，或研发人员工时记录与工资分摊计算表不勾稽，或采购的设备与研发方向无实质性关联，即判定存在虚报。该表达式基于人数偏离度和费用归集真实性的组合条件。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 虚报研发费用数据造假
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局 科技部关于完善研究开发费用税前加计扣除政策的通知\",\n    \"法规文号\": \"财税〔2015〕119号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"三（一）\",\n    \"内容概述\": \"企业应按照财务会计制度要求，对研发支出进行会计处理；对研发费用和生产经营费用划分不清的，不得实行加计扣除。\"\n  },\n \
    \ {\n    \"法规名称\": \"中华人民共和国统计法\",\n    \"法规文号\": \"主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七条\",\n    \"内容概述\"\
    : \"国"
