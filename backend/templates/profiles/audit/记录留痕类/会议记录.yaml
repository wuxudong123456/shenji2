  audit_item: 乱集资、乱摊派、乱收费
  suspicion: 一事一议筹资表决程序不合规
  regulation: "[\n  {\n    \"法规名称\": \"村民一事一议筹资筹劳管理办法\",\n    \"法规文号\": \"国办发〔2007〕4号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条第二款\",\n    \"内容概述\": \"筹资筹劳事项应经村民会议讨论通过，须有18周岁以上过半数村民参加，所作决定应经到会人员过半数同意并形成书面签字决议。\"\n  }\n]"
- expression: 决议内容、参与人员、公示情况.决议内容不包含水价与收费方式 OR 会议议题、表决结果、参会代表签字.表决结果不包含水价与收费方式
  description: 核查民主议事记录，若未对水价制定或收费方式进行表决、决议内容缺失，或相关会议记录与公示材料不完整，则判定违规。
  audit_item: 农村供水工程管护不到位及运营不规范
  suspicion: 水价制定未经一事一议民主议事程序
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国村民委员会组织法\",\n    \"法规文号\": \"中华人民共和国主席令第三十七号（2018修正）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第二十四条\",\n    \"内容概述\": \"涉及村民利益的下列事项，经村民会议讨论决定方可办理：……（九）村民会议认为应当由村民会议讨论决定的涉及村民利益的其他事项。水价涉及村民利益，需经民主程序。\"\
    \n  }\n]"
- expression: 成员姓名、身份证号、职业分类、成员类型（农民/非农民）、成员总数.职业分类 != '农民' AND NOT EXISTS (户籍性质、职业信息、农民资格证明.农民资格证明)
  description: 筛出成员名册中职业分类非农民的成员，若无法提供农业农村部门认可的农民资格证明（如土地承包合同、务农记录、职业农民认定文件等），则判定为成员身份违规。每个不符合条件的成员单独标记。
  audit_item: 农民专业合作社认定不合规
  suspicion: 农民专业合作社成员身份不符合规定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第83号（2017年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第十二条、第十四条\",\n    \"内容概述\": \"农民专业合作社成员中，农民至少应当占成员总数的百分之八十；成员总数二十人以下的，可以有一个企业、事业单位或者社会组织成员；成员总数超过二十人的，企业、事业单位和社会组织成员不得超过成员总数的百分之五。具有民事行为能力的公民，以及从事与农民专业合作社业务直接有关的生产经营活动的企业、事业单位或者社会组织，可以成为成员。\"\
    \n  }\n]"
