name: audit/记录留痕类/会议记录
type: model
description: 从记录留痕类类文档（会议记录）中提取结构化元数据。涵盖字段如：上会金额、主要意见记录、会议日期、会议时间、会议签到表、会议类型、会议表决结果、会议议题。文档范围包括：一事一议民主议事会议记录、企业“三重一大”决策会议记录、会议记录、党委/纪检部门专题会议记录、党委会会议记录、合作社会议记录、合作社内部会议记录、总经理办公会会议记录、村民代表大会会议记录、村民会议或村民代表会议记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 会议
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 会议记录
  member_count: 1
  member_details:
  - 一事一议民主议事会议记录
  - 企业“三重一大”决策会议记录
  - 会议记录
  - 党委/纪检部门专题会议记录
  - 党委会会议记录
  - 合作社会议记录
  - 合作社内部会议记录
  - 总经理办公会会议记录
  - 村民代表大会会议记录
  - 村民会议或村民代表会议记录
  - 村民会议记录
  - 民主评议会议记录
  - 理事会会议记录
  - 管理层会议记录
  - 营养改善计划专项会议记录
  - 董事会会议记录
  - 行业会议记录
  - 资产处置相关的董事会/股东会决策会议记录
  - 重大经营决策会议记录
  - 重大采购事项集体决策会议记录
