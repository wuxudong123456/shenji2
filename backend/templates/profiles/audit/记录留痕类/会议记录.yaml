violations:
- expression: '领导干部离职审批文件.离职日期 + 3年 >= 当前日期 && (企业法人/高管信息对照表.离职人员关联企业/中介机构名称 IN (SELECT 工商登记信息.企业名称 FROM 工商登记信息 WHERE 工商登记信息.经营范围
    LIKE ''%中介%'' OR 工商登记信息.经营范围 LIKE ''%经纪%'' OR 工商登记信息.经营范围 LIKE ''%咨询%'')) && ((银行资金流水明细表.交易摘要 LIKE ''%服务费%'' OR 银行资金流水明细表.交易摘要
    LIKE ''%佣金%'' OR 银行资金流水明细表.交易摘要 LIKE ''%居间费%'') AND 领导干部离职审批文件.管辖业务范围 '
  description: 在禁业期内，以中间人身份撮合交易并收取费用；通过企业名称或业务类型、银行流水中的佣金类收入、以及与原管辖对象的联系强度（通话频次前20%或直接出现审批加速）建立判违逻辑。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事有偿中介活动
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十六条\",\n    \"内容概述\": \"党员领导干部离职或者退（离）休后违反有关规定从事有偿中介活动，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务处分；情节严重的，给予留党察看处分。\"\n \
    \ },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百零七条\"\
    ,\n    \""
- expression: (承租方/承包人名称、租赁单价、租赁期限、决策方式.承租方/承包人名称 IN (姓名、身份证号、与领导人员关系、特定关系人姓名、特定关系人姓名及其关联企业、特定关系人企业名称、亲属姓名、关联企业名称.特定关系人姓名及其关联企业))
    && (ABS(承租方/承包人名称、租赁单价、租赁期限、决策方式.租赁单价-同期同类资产市场租金或承包费标准.同期同类资产市场租金或承包费标准)/同期同类资产市场租金或承包费标准.同期同类资产市场租金或承包费标准 > 0.3 || 承租方/承包人名称、租赁单价、租赁期限、决策方式.决策方式
    != '公开招租')
  description: 筛查国有资产租赁或承包给领导人员特定关系人且租金明显低于市场价30%以上，或未经过公开招租程序的情况。未进行市场评估或未公开招租直接视为可疑线索。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 国有资产委托租赁承包给特定关系人经营
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第二项\",\n    \"内容概述\": \"不得将国有资产委托、租赁、承包给配偶、子女及其他特定关系人经营。\"\n  }\n]"
- expression: (会议记录.参会人员 IN (应回避人员)) && (会议记录.议题涉及的企业名称 IN (该人员亲属控制企业)) && (会议记录.主动回避记录 == NULL)
  description: 筛查在涉及特定关系人企业的经营决策会议中，相关领导人员未进行回避，直接参与表决或审批。缺乏主动回避记录即为违规。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 未按规定执行任职回避和公务回避
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第六项\",\n    \"内容概述\": \"按照规定应当实行任职回避和公务回避而没有回避。\"\n  }\n]"
- expression: ABS(科目余额表.累计折旧本期发生额 - 按上期折旧方法模拟计提的累计折旧本期发生额) / 利润总额 > 0.05 && (董事会决议 IS NULL || 董事会决议.批准日期 > 企业会计政策文件.变更生效日期)
    && 财务报表附注.会计政策变更说明 NOT LIKE '%折旧方法变更%'
  description: 当企业本期折旧方法与上期不一致，且新旧方法下折旧费用差异对利润总额的影响超过5%，同时未取得董事会有效审批或审批滞后，且财务报告附注未披露变更内容及影响金额时，触发违规疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意改变固定资产折旧方法调节利润
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业进行会计核算不得随意改变资产、负债、所有者权益的确认标准或者计量方法，虚列、多列、不列或者少列资产、负债、所有者权益。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\"\
    ,\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第十五条\",\n    \"内"
- expression: 企业会计政策文件.收入确认标准(本期) != 企业会计政策文件.收入确认标准(上期) && 营业收入明细表.本期收入增长率 > 行业平均增长率*1.5 && (董事会决议 IS NULL || 董事会决议.批准日期
    > 收入确认标准变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE '%收入确认标准变更%'
  description: 当本期收入确认标准较上期发生改变（如由客户签收改为发货确认），且收入增长率远超行业水平，同时缺少董事会审批或审批滞后，未在附注中披露收入确认标准变更详情时，视为违规。
  audit_item: 随意变更会计处理方法
  suspicion: 随意改变收入确认标准虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
