name: audit/记录留痕类/付款记录
type: model
description: 从记录留痕类类文档（付款记录）中提取结构化元数据。涵盖字段如：支付方式、收款方、金额。文档范围包括：付款记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 付款记录
  member_count: 1
  member_details:
  - 付款记录
output:
  fields:
  - name: 支付方式
    type: string
    description: 提取 支付方式 的文本值
  - name: 收款方
    type: number
    description: 提取 收款方 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (采购合同.合同总额 != 入库单.数量) || (管理台账.发票金额 > 付款记录.金额 * 1.2) || (固定资产折旧与摊销明细表.本期折旧 > (固定资产原值 * 税法最低折旧率上限))
  description: 逻辑判断：采购合同、入库单、发票三单金额不一致，或发票金额显著超过实际付款（无真实交易），或折旧摊销超出税法允许上限，均构成虚列成本。其中发票金额超过付款金额20%视为异常。
  audit_item: 违反税收征管规定的行为
  suspicion: 虚列成本费用少缴企业所得税
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业所得税法\",\n    \"法规文号\": \"主席令第六十三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第八条\",\n    \"内容概述\": \"企业实际发生的与取得收入有关的、合理的支出，包括成本、费用、税金、损失和其他支出，准予在计算应纳税所得额时扣除。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国税收征收管理法\"\
    ,\n    \"法规文号\": \"主席令第四十九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第六十三条\",\n    \"内容概述\": \"多列支出属于偷税行为，由税务机关追缴其不"
