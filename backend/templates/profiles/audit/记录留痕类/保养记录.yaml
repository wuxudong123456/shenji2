name: audit/记录留痕类/保养记录
type: model
description: 从记录留痕类类文档（保养记录）中提取结构化元数据。涵盖字段如：维护日期、设备状态。文档范围包括：防火设备维护保养记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 保养记录
  member_count: 1
  member_details:
  - 防火设备维护保养记录
output:
  fields:
  - name: 维护日期
    type: date
    description: 提取 维护日期 的日期值，格式 YYYY-MM-DD
  - name: 设备状态
    type: boolean
    description: 提取 设备状态 的布尔值（是/否）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (编制人数.编制人数 < 批复文件.核定编制人数*0.8) OR (编制人数.专兼职标识 < 编制人数.编制人数*0.6) OR (配置清单.数量 < 配置清单.数量*0.8) OR (配置清单.有效期（灭火器等）/配置清单.数量
    > 0.2) OR (保养记录.维护日期 < 当前日期-180天) OR (配置清单.数量 = 0) OR (名册.资质证书/名册.岗位 < 0.8) OR (使用台账.设备采购支出/使用台账.金额 < 0.5)
  description: 机构编制未达标准的80%，在岗率低于60%，设备数量低于标配的80%，灭火器等过期比例超过20%，近6个月无任何维护记录，无人机等现代化装备为零，持证上岗率不足80%，防火经费中设备采购占比低于50%，均视为配备不到位。
  audit_item: 草原风险防控落实不到位
  suspicion: 草原防火机构、队伍及设备配备不到位
  regulation: "[\n  {\n    \"法规名称\": \"《草原防火条例》\",\n    \"法规文号\": \"国务院令第542号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十三条、第十四条、第十五条\",\n    \"内容概述\": \"县级以上地方政府应根据草原防火需要建立防火组织，配备必要的防火设施、设备和人员；防火设备应定期维护，保证完好有效；防火经费应专款专用。\"\n  }\n]"
