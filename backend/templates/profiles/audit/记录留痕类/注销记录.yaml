name: audit/记录留痕类/注销记录
type: model
description: 从记录留痕类类文档（注销记录）中提取结构化元数据。涵盖字段如：外出登记日期、死亡日期、死亡日期或外出登记日期、注销身份证号。文档范围包括：外出务工人员户籍注销记录、死亡人口户籍注销记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 登记
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 注销记录
  member_count: 1
  member_details:
  - 外出务工人员户籍注销记录
  - 死亡人口户籍注销记录
output:
  fields:
  - name: 外出登记日期
    type: date
    description: 提取 外出登记日期 的日期值，格式 YYYY-MM-DD
  - name: 死亡日期
    type: date
    description: 提取 死亡日期 的日期值，格式 YYYY-MM-DD
  - name: 死亡日期或外出登记日期
    type: date
    description: 提取 死亡日期或外出登记日期 的日期值，格式 YYYY-MM-DD
  - name: 注销身份证号
    type: string
    description: 提取 注销身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 报销药品名称、报销金额、报销机构名称、药品明细、总费用、患者身份证号、就诊时间、诊断.就诊时间 > 注销身份证号、外出登记日期.死亡日期或外出登记日期
  description: 发生报销或产生签约服务的日期，晚于参保人被证明的死亡时间或去外地务工时间。这种超自然时空的诊疗证明系统记录完全是虚假的。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 利用死亡或外出人员信息虚假诊疗套保
  regulation: "[\n  {\n    \"法规名称\": \"医疗保障基金使用监督管理条例\",\n    \"法规文号\": \"国务院令第735号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十条、第四十一条\",\n    \"内容概述\": \"严禁通过伪造、变造、隐匿、涂改、销毁医学文书证明等方式，骗取医保基金。个人以骗取医保基金为目的，由医保行政部门责令退回，处骗取金额2倍以上5倍以下罚款。\"\n  }\n\
    ]"
