name: audit/记录留痕类/代偿记录
type: model
description: 从记录留痕类类文档（代偿记录）中提取结构化元数据。涵盖字段如：代偿日期、代偿金额。文档范围包括：代偿记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 代偿记录
  member_count: 1
  member_details:
  - 代偿记录
output:
  fields:
  - name: 代偿日期
    type: date
    description: 提取 代偿日期 的日期值，格式 YYYY-MM-DD
  - name: 代偿金额
    type: number
    description: 提取 代偿金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (明细表.在保余额 / 资产负债表.净资产) > 10 || (使用记录.已计提准备金 < 明细表.在保余额 * 0.01) || (代偿记录.代偿金额 / 明细表.在保余额) > 0.03
  description: 担保放大倍数（在保余额/净资产）超过10倍，或风险准备金计提低于在保余额的1%，或历史代偿率超过3%，任一指标突破则反映担保公司偿付能力不足，无法有效覆盖住房公积金贷款风险。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 担保公司担保放大倍数超限或准备金不足
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条、第十六条\",\n    \"内容概述\": \"融资担保公司的担保责任余额不得超过其净资产的10倍；融资担保公司应当按照国家有关规定提取未到期责任准备金、担保赔偿准备金，确保准备金充足。\"\n  }\n]"
