name: audit/记录留痕类/支付记录
type: model
description: 从记录留痕类类文档（支付记录）中提取结构化元数据。涵盖字段如：付款金额、收款人、收款账户。文档范围包括：餐费支付记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 付款
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 支付记录
  member_count: 1
  member_details:
  - 餐费支付记录
output:
  fields:
  - name: 付款金额
    type: number
    description: 提取 付款金额 的数值（含单位，如万元、吨等）
  - name: 收款人
    type: number
    description: 提取 收款人 的数值（含单位，如万元、吨等）
  - name: 收款账户
    type: number
    description: 提取 收款账户 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (核查表.核查结论 == '不合格' || 家庭名称、健康证明编号、食品安全培训记录、加工场所照片.食品安全培训记录 == '无' || 家庭名称、健康证明编号、食品安全培训记录、加工场所照片.加工场所照片 == '不达标')
    || 收款人 NOT IN 家庭名称、健康证明编号、食品安全培训记录、加工场所照片.家庭名称
  description: 当托餐家庭核查结论不合格，或备案材料中无健康证明、加工场所卫生条件评价不达标，或餐费实际收款人非备案合规家庭时，判定违规，直接威胁供餐安全。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 托餐家庭不具备资质违规供餐
  regulation: "[\n  {\n    \"法规名称\": \"学校食品安全与营养健康管理规定\",\n    \"法规文号\": \"教育部、国家市场监督管理总局、国家卫生健康委员会令第45号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"学校食堂和供餐单位从业人员应当每年进行健康检查，取得健康证明后方可上岗。加工经营场所应当保持内外环境整洁。\"\n  }\n]"
