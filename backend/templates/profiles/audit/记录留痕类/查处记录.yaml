name: audit/记录留痕类/查处记录
type: model
description: 从记录留痕类类文档（查处记录）中提取结构化元数据。涵盖字段如：倒卖事实、处罚情况。文档范围包括：案件查处记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 查处记录
  member_count: 1
  member_details:
  - 案件查处记录
output:
  fields:
  - name: 倒卖事实
    type: string
    description: 提取 倒卖事实 的文本值
  - name: 处罚情况
    type: string
    description: 提取 处罚情况 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (ABS(SUM(回收数量、去向.回收数量) - SUM(接收单位、数量、接收单位资质.数量)) / SUM(回收数量、去向.回收数量) > 0.05) OR (倒卖事实、处罚情况.倒卖事实 = TRUE) OR (接收单位、数量、接收单位资质.接收单位
    NOT IN (接收单位、数量、接收单位资质.接收单位资质) AND 数量 > 0)
  description: ①回收总量与移交有资质处理单位的数量差异超过5%，且无法提供去向说明，疑似倒卖流失；②案件查处记录中确认存在倒卖行为；③转移联单上的接收单位不具备处理资质，直接表明废弃物被转移给无资质主体。任一条件触发。
  audit_item: 农药化肥减量增效落实方面不符合相关规定
  suspicion: 违规倒卖农药包装废弃物
  regulation: "[\n  {\n    \"法规名称\": \"农药包装废弃物回收处理管理办法\",\n    \"法规文号\": \"生态环境部 农业农村部令2020年第7号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"禁止将农药包装废弃物转移给没有资质的单位或者个人进行处置。\"\n  }\n]"
