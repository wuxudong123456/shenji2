name: audit/记录留痕类/处置记录
type: model
description: 从记录留痕类类文档（处置记录）中提取结构化元数据。涵盖字段如：利用状态、型号、处置方案审批日期、实物存在状态、实际开工日期、抵押物产权证、淘汰处置状态、设备名称。文档范围包括：未批先建项目处置记录、淘汰设备处置记录、贷款抵押物处置记录、闲置校舍再利用方案或处置记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 审批
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 处置记录
  member_count: 1
  member_details:
  - 未批先建项目处置记录
  - 淘汰设备处置记录
  - 贷款抵押物处置记录
  - 闲置校舍再利用方案或处置记录
output:
  fields:
  - name: 利用状态
    type: boolean
    description: 提取 利用状态 的布尔值（是/否）
  - name: 型号
    type: string
    description: 提取 型号 的文本值
  - name: 处置方案审批日期
    type: date
    description: 提取 处置方案审批日期 的日期值，格式 YYYY-MM-DD
  - name: 实物存在状态
    type: boolean
    description: 提取 实物存在状态 的布尔值（是/否）
  - name: 实际开工日期
    type: date
    description: 提取 实际开工日期 的日期值，格式 YYYY-MM-DD
  - name: 抵押物产权证
    type: string
    description: 提取 抵押物产权证 的文本值
  - name: 淘汰处置状态
    type: boolean
    description: 提取 淘汰处置状态 的布尔值（是/否）
  - name: 设备名称
    type: string
    description: 提取 设备名称 的文本值
  - name: 评估报告
    type: string
    description: 提取 评估报告 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (资产清单.闲置起始日期 距当前日期 > 365天 && 记录留痕类-处置记录-处置方案审批日期、利用状态.利用状态 == "闲置") || (资产清单.处置方式 == "出租" && (文件4.审批流程缺失 ||
    资产清单.租金收入 未上缴财政))
  description: 校舍闲置超过一年且无再利用方案，或出租行为未经审批、收益未上缴，均属于违规行为
  audit_item: 小规模学校、寄宿制学校建设管理不规范
  suspicion: 闲置校舍长期未处置或违规出租
  regulation: "[\n  {\n    \"法规名称\": \"教育部关于农村闲置校舍处置工作的指导意见\",\n    \"法规文号\": \"教发〔2006〕4号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"三、处置方式与程序\",\n    \"内容概述\": \"闲置校舍应优先用于教育或社会公益事业，处置收入全额上缴国库，严禁擅自出租\"\n  }\n]"
