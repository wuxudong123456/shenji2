name: audit/记录留痕类/收费记录
type: model
description: 从记录留痕类类文档（收费记录）中提取结构化元数据。涵盖字段如：交易时间、收费项目、缴费主体名称、金额。文档范围包括：不动产登记系统收费记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 收费记录
  member_count: 1
  member_details:
  - 不动产登记系统收费记录
output:
  fields:
  - name: 交易时间
    type: date
    description: 提取 交易时间 的日期值，格式 YYYY-MM-DD
  - name: 收费项目
    type: number
    description: 提取 收费项目 的数值（含单位，如万元、吨等）
  - name: 缴费主体名称
    type: number
    description: 提取 缴费主体名称 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (明细表.缴费主体类型='农村集体经济组织' && 明细表.收费项目 IN ('不动产登记费','工本费','测绘费') && 明细表.实收金额 > 0)
  description: 根据财税〔2019〕45号等政策，对农村集体经济组织办理不动产登记应免收登记费、工本费等。只要存在缴费主体为农村集体经济组织且收费项目属于政策规定免征范围且实际收费金额大于0的记录，即判定为违规，无需设定金额阈值。
  audit_item: 政策支持落实和监督检查不到位
  suspicion: 免收不动产登记费政策落实不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于免征不动产登记费的通知\",\n    \"法规文号\": \"财税〔2019〕45号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第一条\",\n    \"内容概述\": \"对申请办理不动产登记的农村集体经济组织，免征不动产登记费。\"\n  }\n]"
