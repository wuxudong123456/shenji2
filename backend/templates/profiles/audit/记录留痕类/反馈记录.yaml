name: audit/记录留痕类/反馈记录
type: model
description: 从记录留痕类类文档（反馈记录）中提取结构化元数据。涵盖字段如：农民需求类型、反对撤并意见占比、反馈问题、处理结果、已采取措施、投诉事由、投诉内容、投诉内容关键词。文档范围包括：上级部门督办通知整改反馈记录、企业投诉或反馈记录、农户问题反馈记录、农民需求调研报告或意见反馈记录、学生及家长意见反馈记录、结果应用反馈记录、设施闲置或损毁问题整改通知反馈记录、试点县工作推进会议问题反馈记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 整改
- 补贴
- 项目
- 预算
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 反馈记录
  member_count: 1
  member_details:
  - 上级部门督办通知整改反馈记录
  - 企业投诉或反馈记录
  - 农户问题反馈记录
  - 农民需求调研报告或意见反馈记录
  - 学生及家长意见反馈记录
  - 结果应用反馈记录
  - 设施闲置或损毁问题整改通知反馈记录
  - 试点县工作推进会议问题反馈记录
output:
  fields:
  - name: 农民需求类型
    type: string
    description: 提取 农民需求类型 的文本值
  - name: 反对撤并意见占比
    type: string
    description: 提取 反对撤并意见占比 的文本值
  - name: 反馈问题
    type: string
    description: 提取 反馈问题 的文本值
  - name: 处理结果
    type: boolean
    description: 提取 处理结果 的布尔值（是/否）
  - name: 已采取措施
    type: string
    description: 提取 已采取措施 的文本值
  - name: 投诉事由
    type: string
    description: 提取 投诉事由 的文本值
  - name: 投诉内容
    type: string
    description: 提取 投诉内容 的文本值
  - name: 投诉内容关键词
    type: string
    description: 提取 投诉内容关键词 的文本值
  - name: 投诉日期
    type: date
    description: 提取 投诉日期 的日期值，格式 YYYY-MM-DD
  - name: 投诉时间
    type: date
    description: 提取 投诉时间 的日期值，格式 YYYY-MM-DD
  - name: 整改反馈时间
    type: date
    description: 提取 整改反馈时间 的日期值，格式 YYYY-MM-DD
  - name: 整改状态
    type: boolean
    description: 提取 整改状态 的布尔值（是/否）
  - name: 涉及工单编号
    type: string
    description: 提取 涉及工单编号 的文本值
  - name: 涉及的收费项目
    type: number
    description: 提取 涉及的收费项目 的数值（含单位，如万元、吨等）
  - name: 涉及补贴项目
    type: string
    description: 提取 涉及补贴项目 的文本值
  - name: 督办事项
    type: string
    description: 提取 督办事项 的文本值
  - name: 要求完成时限
    type: string
    description: 提取 要求完成时限 的文本值
  - name: 解决时限
    type: string
    description: 提取 解决时限 的文本值
  - name: 诉求记录
    type: string
    description: 提取 诉求记录 的文本值
  - name: 责任主体
    type: string
    description: 提取 责任主体 的文本值
  - name: 责任单位
    type: string
    description: 提取 责任单位 的文本值
  - name: 辍学原因反馈
    type: string
    description: 提取 辍学原因反馈 的文本值
  - name: 问题反馈日期
    type: date
    description: 提取 问题反馈日期 的日期值，格式 YYYY-MM-DD
  - name: 问题描述
    type: string
    description: 提取 问题描述 的文本值
  - name: 预算调整建议
    type: number
    description: 提取 预算调整建议 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 收费明细表.收费项目名称 CONTAINS ('服务费','平台服务费','数据对接服务费') && (收费明细表.收费项目名称 NOT IN (政策文件.服务费类项目允许范围) || 收费明细表.金额 > 0 &&
    财政拨款明细对照表.政府购买服务支出金额 已覆盖同类服务成本)
  description: 当收费项目为服务费类时，若不在政策允许的清单内，或财政已通过政府购买服务等方式支付了该类服务费用但仍向企业重复收取，即构成违规。用于判断是否将行政职责应免费提供的服务转化为有偿服务。
  audit_item: 违规收费-要求企业承担电子政务平台技术维护费、服务费、电子介质成本费等经营服务性费用
  suspicion: 违规收取电子政务平台服务费
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委 财政部关于清理规范电子政务平台收费有关问题的通知\",\n    \"法规文号\": \"发改价格〔2011〕2352号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"全文\",\n    \"内容概述\": \"电子政务平台提供的服务属于公共服务范畴，不得以服务费、接入费等名义向企业收取费用。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政部 国家发展改革委关于清理规范一批行政事业性收费有关政策的通知\",\n    \"法规文号\": \"财税〔2017〕20号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\"\
    ,"
- expression: (收费对象、收费项目名称、收费金额、收费时间、收费项目名称（如数据对接服务费、平台服务费）、收费项目名称（如CA证书费、U盾费）、单价、数量、收费项目（如高级会员费、加急服务费）、金额、收费频次.收费项目名称 CONTAINS
    ('会员','VIP','加急','优先','高级') || 收费条款、技术维护费描述、服务费条款、收费项目描述、合同期限、会员服务条款、付费优先服务条款、捆绑服务项目.付费优先服务条款 包含 ('付费方可使用','不缴费将关闭','必须购买'))
    && (收费对象、收费项目名称、收费金额、收费时间、收费项目名称（如数据对接服务费、平台服务费）、收费项目名称（如CA证书
  description: 当存在会员费、VIP费、加急费等名义的收费，且合同条款或平台权限设置将政府必须提供的基础服务与付费服务捆绑，或企业多次投诉被强制购买会员，即判定为变相违规收费。投诉次数阈值可设定为3次以上以降低误报。
  audit_item: 违规收费-要求企业承担电子政务平台技术维护费、服务费、电子介质成本费等经营服务性费用
  suspicion: 变相收费或捆绑收费
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十条\",\n    \"内容概述\": \"政府及其有关部门应当加强政务服务的规范化、标准化建设，不得设置不合理或者歧视性的准入和退出条件，不得限定购买指定经营者的商品或者服务，不得以任何形式限制或者变相限制市场准入。\"\n \
    \ },\n  {\n    \"法规名称\": \"关于进一步规范行政事业性收费的通知\",\n    \"法规文号\": \"财综〔2010〕12号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二条"
- expression: (图书配备清单.数量 < 上级主管部门关于农家书屋建设的标准文件.规定最低总册数) || (图书配备清单.农业科技类册数占比 < 上级主管部门关于农家书屋建设的标准文件.农业科技类比例) || (图书配备清单.近三年出版册数占比
    < 上级主管部门关于农家书屋建设的标准文件.近三年出版物占比) || (农民需求调研报告或意见反馈记录.农民需求类型 NOT IN 图书配备清单.分类标签) || (图书采购合同.供应商资质 NOT IN 政府采购目录)
  description: 判定图书配备不达标：总册数低于规定最低标准（如1500册）；特定类别（如农业科技类）占比低于标准（如60%）；近三年出版图书占比低于规定（如30%）；调研需求类别在配备图书中完全缺失，表明图书脱离实际需求；采购合同供应商不在合规名录内，可能存在盗版或低价打包劣质书问题。以上条件满足任意一条，判为疑点。
  audit_item: 农家书屋建设运营管护不合规
  suspicion: 农家书屋图书配备不达标或脱离需求
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条、第十三条\"\
    ,\n    \"内容概述\": \"农家书屋图书配置应符合当地农村实际需求，确保藏书量不少于1500册，品种不少于500种；图书应定期更新，确保内容实用、新颖。\"\n  }\n]"
- expression: (情况表.调整前后学校数量 > 0.3 && 调研报告.决策依据（人口数据、地理条件）) || (情况表.调整前后学校数量 > 标准文件.学校服务半径标准) || (反馈记录.反对撤并意见占比 > 0.5 && 调研报告.决策依据（人口数据、地理条件）)
  description: 撤并比例超过30%且缺乏人口数据支撑，或学校服务半径超标，或多数群众反对但未听证，均属布局不合理，疑点触发
  audit_item: 小规模学校、寄宿制学校建设管理不规范
  suspicion: 农村学校布局规划与人口分布不匹配
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于规范农村义务教育学校布局调整的意见\",\n    \"法规文号\": \"国办发〔2012〕48号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、严格规范学校撤并程序\",\n    \"内容概述\": \"确定学校撤并须经过科学论证和严格程序，充分听取群众意见，保障学生就近入学\"\n  }\n]"
- expression: (上级下达指标日期.实际报送日期-上级下达指标日期.名单报送截止日期>0) && (拨入资金日期.实际发放日期-拨入资金日期.应发放名单接收日期>制度规定发放时限)
  description: 名单未在截止日期前报送，且导致实际发放日期晚于应发放日期（即政策既定的发放截止日或常规发放周期），判定为名单报送滞后造成发放延迟。制度规定发放时限一般不超过30天，若未明确规定可按上级文件或以往正常周期推算。
  audit_item: 惠农财政补贴资金滞留、闲置
  suspicion: 发放名单报送滞后导致补贴资金延迟发放
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\"\
    ,\n    \"内容概述\": \"要求及时、足额拨付预算支出资金，发放名单报送作为拨付前提，其滞后导致资金无法及时拨付，构成对及时拨付义务的违反。\"\n  },\n  {\n    \"法规名称\": \"惠农财政补贴资金管理办法及实施细则\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第XX条（假设）\",\n    \"内容概述\": \"规定乡镇、村或业务部门应在每批次申报截止日前完成审核和"
- expression: (明细表.失败原因代码=="账号错误|户名不符|账户不存在") && (当前日期-退回凭证.退回日期>30) && (监测表.资金性质=="未重发")
  description: 银行转账失败后，资金退回至财政或部门账户，若30天内主管部门未启动信息核实与重新发放程序，即形成闲置。30天为发现问题至启动处理的合理期限，各地制度可能有更严要求。退回后超过90天未处置为高风险，金额累计超10万元需重点预警。
  audit_item: 惠农财政补贴资金滞留、闲置
  suspicion: 农户账户信息错误导致补贴资金退回长期闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\"\
    ,\n    \"内容概述\": \"及时、足额拨付预算支出资金，因发放失败导致的资金退回，仍负有及时足额发放的义务，不得无故使资金闲置。\"\n  },\n  {\n    \"法规名称\": \"惠农财政补贴资金管理办法及实施细则\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第XXX条（假设）\",\n    \"内容概述\": \"明确规定因账户信息错误导致发放失败的，应在10个工作日内通知农户"
- expression: (统计表.接电日期 - 统计表.申请日期) > 各类业务法定办理时限（如低压居民15个工作日）.各类业务法定办理时限（如低压居民15个工作日） && 无延期审批手续 || (超期工单数 / 总工单数 > 0.1)
  description: 根据规定，低压居民报装全流程不应超过15个工作日，无正当理由超时即构成违规；超期率超过10%表明业务办理系统性问题。
  audit_item: 电网改造和供电服务不合规
  suspicion: 用电报装业务办理严重超时限
  regulation: "[\n  {\n    \"法规名称\": \"压缩用电报装时间实施方案\",\n    \"法规文号\": \"国能监管〔2017〕110号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"总体要求及分类时限要求\",\n    \"内容概述\": \"低压居民用电报装全流程平均时限压缩至15个工作日以内，高压单电源40个工作日以内，高压双电源55个工作日以内。\"\n  }\n]"
- expression: ( (追踪表.撤并前后辍学人数 - 追踪表.撤并前后辍学人数) / 追踪表.撤并前后辍学人数 > 0.5 && (风险评估等级=="低风险" || 风险评估等级.缺失) ) || (追踪表.辍学原因含"距离远/费用高"
    && 使用台账.交通补助=0)
  description: 撤并后辍学率增幅超过50%且风险评估过于乐观或缺失，或因撤并直接导致辍学但相关补助未落实，判定为违规
  audit_item: 小规模学校、寄宿制学校建设管理不规范
  suspicion: 撤并学校导致学生辍学率显著上升
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强控辍保学提高义务教育巩固水平的通知\",\n    \"法规文号\": \"国办发〔2017〕72号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、健全控辍保学工作机制\",\n    \"内容概述\": \"要求防止因学校撤并导致学生失学辍学，确保不因上学远、上学难而辍学，落实各项资助政策\"\n  }\n]"
