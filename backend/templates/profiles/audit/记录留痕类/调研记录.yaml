name: audit/记录留痕类/调研记录
type: model
description: 从记录留痕类类文档（调研记录）中提取结构化元数据。涵盖字段如：产业发展潜力、人口规模、古建筑或传统风貌保存状况、各村资源禀赋、实际主导产业、实际地形、实际建筑形式、核实后的常住人口数。文档范围包括：实地调研记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 调研记录
  member_count: 1
  member_details:
  - 实地调研记录
output:
  fields:
  - name: 产业发展潜力
    type: string
    description: 提取 产业发展潜力 的文本值
  - name: 人口规模
    type: string
    description: 提取 人口规模 的文本值
  - name: 古建筑或传统风貌保存状况
    type: string
    description: 提取 古建筑或传统风貌保存状况 的文本值
  - name: 各村资源禀赋
    type: string
    description: 提取 各村资源禀赋 的文本值
  - name: 实际主导产业
    type: string
    description: 提取 实际主导产业 的文本值
  - name: 实际地形
    type: string
    description: 提取 实际地形 的文本值
  - name: 实际建筑形式
    type: string
    description: 提取 实际建筑形式 的文本值
  - name: 核实后的常住人口数
    type: string
    description: 提取 核实后的常住人口数 的文本值
  - name: 规划要素与实际匹配项核查清单
    type: string
    description: 提取 规划要素与实际匹配项核查清单 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (文本相似度（%）.文本相似度（%） > 60% || 路网结构相似度（%）.路网结构相似度（%） > 80% || 公共服务设施布局相似度（%）.公共服务设施布局相似度（%） > 80%) && (调研记录.产业规划与实际产业不符
    || 调研记录.用地布局与实际地形冲突 || 调研记录.建筑风貌与实际习惯不匹配)
  description: 通过相邻村庄规划文本相似度、路网与设施布局相似度判断是否有抄袭嫌疑；同时结合实地调研的匹配情况，若规划内容与实地现状严重不符，即使相似度未达阈值也判定为脱离实际。文本相似度>60%或结构相似度>80%且实地匹配率<70%（即存在关键要素冲突）时触发疑点。
  audit_item: 村庄规划编制质量不高
  suspicion: 村庄规划脱离实际或照搬照抄
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"制定和实施城乡规划，应当遵循城乡统筹、合理布局、节约土地、集约发展和先规划后建设的原则，改善生态环境，促进资源、能源节约和综合利用，保护耕地等自然资源和历史文化遗产，保持地方特色、民族特色和传统风貌。\"\
    \n  }\n]"
- expression: (分析表.公共服务设施配置标准方差 < 0.5 || 分析表.产业定位一致性比例 > 80%) || (政策性文件.是否含有强制统一产业定位、统一建设标准的要求 == "是") || (项目清单.运营情况（如民宿入住率）
    > 50%)
  description: 设施配置标准方差<0.5表示各村公共服务设施规模和类型高度趋同，缺乏差异化；产业定位一致性比例>80%表示多数村庄被赋予相同产业方向；上级文件若明确要求所有村庄按同一模板编制，则直接触发疑点。此外，如果统一规划的同类项目（如民宿）闲置率超过50%，也表明一刀切规划脱离实际需求。
  audit_item: 村庄规划编制质量不高
  suspicion: 村庄规划内容一刀切或齐步走
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于建立国土空间规划体系并监督实施的若干意见\",\n    \"法规文号\": \"中发〔2019〕18号\",\n    \"效力级别\": \"\
    制度文件\",\n    \"条款号\": \"第三部分（九）\",\n    \"内容概述\": \"明确村庄规划编制要求，结合实际，因地制宜，突出特色，防止千村一面，避免照搬照抄城市规划手法。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四条\",\n    \"内容概述\"\
    : \"规"
- expression: (统计表.人口流失率 <= 30% && 统计表.划分类型（集聚提升/城郊融合/特色保护/搬迁撤并等） == "搬迁撤并类") || (统计表.常住人口比例 < 30% && 统计表.划分类型（集聚提升/城郊融合/特色保护/搬迁撤并等）
    == "集聚提升类") || (统计表.是否列入保护名录 == "是" && 统计表.划分类型（集聚提升/城郊融合/特色保护/搬迁撤并等） == "搬迁撤并类") || (各类别划分的量化标准（如人口流失率阈值、常住人口比例阈值） !=
    统计表.划分类型（集聚提升/城郊融合/特色保护/搬迁撤并等） && 统计表.无合理说明文件)
  description: 根据《关于统筹推进村庄规划工作的意见》等，人口流失率严重且低于一定水平的村不宜划为搬迁撤并类；常住人口过少且无产业支撑的村不宜划为集聚提升类；传统村落或历史文化名村必须划为特色保护类，不得划为搬迁撤并类。若依据标准重新计算分类与其不一致且无专项合理说明，则构成疑点。
  audit_item: 村庄规划编制质量不高
  suspicion: 村庄类型划分脱离实际
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部办公厅关于加强村庄规划促进乡村振兴的通知\",\n    \"法规文号\": \"自然资办发〔2019〕35号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"二（四）\",\n    \"内容概述\": \"合理确定村庄分类，根据村庄区位条件、资源禀赋等，将村庄分为集聚提升类、城郊融合类、特色保护类、搬迁撤并类，分类施策。\"\n  },\n  {\n \
    \   \"法规名称\": \"关于统筹推进村庄规划工作的意见\",\n    \"法规文号\": \"农规发〔2019〕1号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"三（一）\",\n\
    \    \""
