name: audit/记录留痕类/申报记录
type: model
description: 从记录留痕类类文档（申报记录）中提取结构化元数据。涵盖字段如：任职企业、兼任职务、姓名、所得项目、扣缴义务人名称、收入来源单位、收入金额、收入额。文档范围包括：个人所得税申报记录、个税申报记录、领导人员兼职薪酬申报记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 申报记录
  member_count: 1
  member_details:
  - 个人所得税申报记录
  - 个税申报记录
  - 领导人员兼职薪酬申报记录
output:
  fields:
  - name: 任职企业
    type: string
    description: 提取 任职企业 的文本值
  - name: 兼任职务
    type: string
    description: 提取 兼任职务 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 所得项目
    type: string
    description: 提取 所得项目 的文本值
  - name: 扣缴义务人名称
    type: string
    description: 提取 扣缴义务人名称 的文本值
  - name: 收入来源单位
    type: number
    description: 提取 收入来源单位 的数值（含单位，如万元、吨等）
  - name: 收入金额
    type: number
    description: 提取 收入金额 的数值（含单位，如万元、吨等）
  - name: 收入额
    type: number
    description: 提取 收入额 的数值（含单位，如万元、吨等）
  - name: 申报单位地址
    type: string
    description: 提取 申报单位地址 的文本值
  - name: 申报收入额
    type: number
    description: 提取 申报收入额 的数值（含单位，如万元、吨等）
  - name: 申报月份
    type: string
    description: 提取 申报月份 的文本值
  - name: 申请人姓名
    type: string
    description: 提取 申请人姓名 的文本值
  - name: 纳税人姓名
    type: string
    description: 提取 纳税人姓名 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (离职人员利益往来登记表.利益输送企业名称 IN 关联企业及业务关系企业名录.关联企业名称) AND (离职人员利益往来登记表.发生日期 BETWEEN 离职人员利益往来登记表.离职日期 AND 离职人员利益往来登记表.离职日期+1095天)
    AND (离职人员利益往来登记表.金额 > 0) AND (关联交易明细台账.审批人 = 该离职人员) AND (关联交易明细台账.交易日期在离职前)
  description: 离职人员在离职后三年内从原关联企业获取报酬或物质利益，且该关联企业曾与离职人员任职企业发生业务往来并由其审批，线索即为违规。利益类型包括顾问费、咨询费、无偿提供财物等。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 离职后三年内接受原关联企业利益
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（二）项\",\n    \"内容概述\": \"不得在职或者离职后接受、索取本企业的关联企业、与本企业有业务关系的企业，以及管理和服务对象提供的物质性利益。\"\n  }\n]"
- expression: ((信息.任职企业名称 NOT IN 申报记录.任职企业) AND (信息.董监高姓名 = 申报记录.申请人姓名)) OR ((申报记录.批准意见 = ‘批准’) AND (明细表.发放单位名称 = 信息.任职企业名称)
    AND (明细表.金额 > 0) AND 申报记录.已申报领取薪酬 = ‘否’)
  description: 干部在外部企业担任职务未经审批，或经审批允许兼职但未按规定申报并上缴薪酬，擅自领取工资、奖金、咨询费等收入，即构成违规。审批记录无对应批准即视为未经批准兼职。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 未经批准兼职并擅自领取薪酬
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条第（一）项\",\n    \"内容概述\": \"未经批准不得兼任本企业所出资企业或者其他企业、事业单位、社会团体、中介机构的领导职务，或者经批准兼职的，不得擅自领取薪酬及其他收入。\"\n  }\n]"
- expression: (申报记录.扣缴义务人名称 != 本企业名称 && 申报记录.姓名 IN (登记表.姓名)) && (任职期间 IS NULL OR 登记表.是否申报兼职信息 = '否') && 申报记录.所得项目 IN ('劳务报酬所得','工资薪金所得')
  description: 通过个人所得税申报记录发现管理人员从本企业之外的其他单位取得工资或劳务报酬，但企业在册的兼职台账中无该记录或个人事项报告中未申报此项兼职，即认定违规兼职取酬。劳务报酬所得和工资薪金所得是判断外部雇佣关系的关键。
  audit_item: 违反廉洁从业有关规定问题
  suspicion: 管理人员在外违规兼职并获取报酬
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规\",\n   \
    \ \"条款号\": \"第五条（二）项\",\n    \"内容概述\": \"不得违反规定从事营利性经营活动，包括个人或者借他人名义经商、办企业。\"\n  },\n  {\n    \"法规名称\": \"关于规范国有企业职工持股、投资的意见\"\
    ,\n    \"法规文号\": \"国资发改革〔2008〕139号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"国有企业领导人员不得未经批准兼任本企"
- expression: (统计表.缴费户名 != 租赁合同.承租人姓名) || (缴纳记录.缴纳单位地址 != 房屋地址 && 缴纳月份 >= 6) || (申报记录.申报单位地址 != 房屋地址 && 申报月份 >= 6) || (检查记录.实际居住人姓名
    != 登记表.承租人姓名) || (投诉记录.投诉内容（涉及装修、拆改、隔断等）且处理结果为‘属实’)
  description: 任一条件满足即触发疑点：水电燃气缴费户名与合同承租人不一致，说明实际使用人非承租人；社保或个税缴纳地连续6个月以上不在公租房所在地，表明承租人可能长期不在本地居住，存在转租或空置风险；物业入户检查记录的实际居住人与承租人不同，直接反映转借转租；投诉举报中含转租转借或改变用途内容且已核实，作为线索佐证。多条件同时触发即构成严重违规。
  audit_item: 未按规定使用公共租赁住房
  suspicion: 承租人违规转借转租或改变公租房用途
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"承租人不得转借、转租或者擅自调换所承租公共租赁住房，不得改变所承租公共租赁住房的用途。\"\n  }\n]"
- expression: 申领表.申报缴费基数 > 缴纳记录.实际缴费基数 * 1.1 || 申领表.申报缴费基数 > MAX(发放凭证.实发工资金额, 申报记录.申报收入额) * 1.2 || 明细表.支出金额 / 缴费比例 对应的基数 !=
    申领表.申报缴费基数（偏差>5%）
  description: 当申报基数与实际社保系统记录基数相差超过10%，或申报基数明显高于员工真实工资收入20%以上，或补贴金额反推基数与申报基数不一致时，判定为虚增补贴标准。
  audit_item: 虚列就业补助资金支出
  suspicion: 篡改缴费基数虚增社保补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"社会保险补贴标准根据单位实际缴纳的社会保险费确定，缴费基数应符合社会保险征缴规定，不得擅自提高。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国社会保险法\"\
    ,\n    \"法规文号\": \"主席令第三十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第六十条\",\n    \"内容概述\": \"用人单位应当自行申报、按时足额缴纳社会保险费，缴费基数应"
