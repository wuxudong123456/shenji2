name: audit/记录留痕类/询价记录
type: model
description: 从记录留痕类类文档（询价记录）中提取结构化元数据。涵盖字段如：三家以上供应商报价或市场均价、同期同类物资/工程市场均价、标的、行业指导价、规格型号、询价日期。文档范围包括：市场询价记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 工程
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 询价记录
  member_count: 1
  member_details:
  - 市场询价记录
output:
  fields:
  - name: 三家以上供应商报价或市场均价
    type: string
    description: 提取 三家以上供应商报价或市场均价 的文本值
  - name: 同期同类物资-工程市场均价
    type: string
    description: 提取 同期同类物资-工程市场均价 的文本值
  - name: 标的
    type: string
    description: 提取 标的 的文本值
  - name: 行业指导价
    type: string
    description: 提取 行业指导价 的文本值
  - name: 规格型号
    type: string
    description: 提取 规格型号 的文本值
  - name: 询价日期
    type: date
    description: 提取 询价日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (ABS(申报材料.单价 - 询价记录.同期同类物资/工程市场均价) / 询价记录.同期同类物资/工程市场均价 > 0.3 || 执行记录.验收数量 < 申报材料.申报数量 * 0.8) && 明细表.金额 > 0
  description: 当预算单价较市场均价偏离超过30%，或实际验收数量少于申报数量的80%时，触发疑点；虚增规模可结合工程量测绘数据进一步核实。
  audit_item: 编制虚假预算
  suspicion: 虚增项目规模或单价套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号（2014年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第九十三条第一款\",\n    \"内容概述\": \"预算支出应当真实，不得虚报项目规模、虚增单价，造成虚列支出。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条第一款\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，属于违规行为，应当追"
- expression: （采购合同台账.采购单价 - MAX（市场询价记录.报价））/ MAX（市场询价记录.报价） > 0.10 && (采购比价表.选定理由 不包含 '唯一供应商' 或 采购比价表 IS NULL) && 价格审批单.审批意见
    != '超预算审核通过'
  description: 将采购合同单价与至少三家市场询价中的最高报价比较，超出10%以上，且无合理选定理由或审批手续，视为价格虚高。若因唯一供应商导致价格偏高，需重点审核其唯一性证明是否真实。
  audit_item: 销售与采购合同审计
  suspicion: 采购合同价格明显高于市场可比价格
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第六十四条\",\n    \"内容概述\": \"招标人与投标人串通投标，以不合理高价确定中标人的，中标无效。非招标采购也应遵循价格合理原则。\"\n  },\n  {\n    \"法规名称\": \"企业国有资产监督管理暂行条例\"\
    ,\n    \"法规文号\": \"国务院令第378号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条\",\n    \"内容概述\": \"国有及国有控股企业应当加强财务管理，严控"
