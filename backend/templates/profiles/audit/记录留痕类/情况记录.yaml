name: audit/记录留痕类/情况记录
type: model
description: 从记录留痕类类文档（情况记录）中提取结构化元数据。涵盖字段如：会议地点、实际会期天数、实际开始日期、实际活动内容、实际结束日期、实际起止日期、每日活动内容。文档范围包括：会议实际执行情况记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 会议
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 情况记录
  member_count: 1
  member_details:
  - 会议实际执行情况记录
output:
  fields:
  - name: 会议地点
    type: string
    description: 提取 会议地点 的文本值
  - name: 实际会期天数
    type: number
    description: 提取 实际会期天数 的数值（含单位，如万元、吨等）
  - name: 实际开始日期
    type: date
    description: 提取 实际开始日期 的日期值，格式 YYYY-MM-DD
  - name: 实际活动内容
    type: string
    description: 提取 实际活动内容 的文本值
  - name: 实际结束日期
    type: date
    description: 提取 实际结束日期 的日期值，格式 YYYY-MM-DD
  - name: 实际起止日期
    type: date
    description: 提取 实际起止日期 的日期值，格式 YYYY-MM-DD
  - name: 每日活动内容
    type: string
    description: 提取 每日活动内容 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (实际天数 > 通知发布时间.批准天数) || (报销会议名称.门票 || 报销会议名称.交通费、门票、游览费等非会议支出)
  description: 实际会期比批准天数多出1天及以上即为超天数；若费用明细中出现景区门票、旅游包车、导游费等，无论天数是否超，均构成借会议名义旅游。
  audit_item: 超标准举办会议
  suspicion: 会议超批准天数或借会议名义组织旅游
  regulation: "[\n  {\n    \"法规名称\": \"《党政机关厉行节约反对浪费条例》\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁以培训、考察、会议等名义组织公款旅游。\"\n  },\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\"\
    : \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"会议期间不得组织旅游以及与会议无关的参观活动，严禁以任何名义发放纪念品。\"\
    \n"
- expression: 情况记录.实际会期天数 > 超预算审批记录.批准会议天数
  description: 实际会期超出批准天数即视为违规，包含提前报到、延期离会或延长议程。超出天数≥1天需重点关注，如有组织旅游等非会议活动则加重定性。
  audit_item: 超标准举办会议
  suspicion: 会议实际天数超出批准天数
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十条\",\n    \"内容概述\": \"严禁超出规定时限开会，不得组织与会议无关的参观、游览等活动。\"\n  }\n]"
- expression: (人员名单.单位 != 通知发布时间.通知参会单位及人员范围) || (同或协议.位置 包含 风景区) || (情况记录.实际活动内容 包含 旅游、考察、休闲 且 未在正式议程中)
  description: 参会人员超出规定范围（如家属、无关单位），或在风景区高消费场所办会，或议程外安排旅游休闲活动，任一条件满足即构成超范围。
  audit_item: 超标准举办会议
  suspicion: 超范围举办会议（含无关人员或变相旅游）
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十条\",\n    \"内容概述\": \"严禁到风景名胜区开会，不得借会议名义组织旅游或安排与会议无关的参观活动，不得宴请与会人员或发放纪念品。\"\n  }\n]"
