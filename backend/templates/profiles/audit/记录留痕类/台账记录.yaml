name: audit/记录留痕类/台账记录
type: model
description: 从记录留痕类类文档（台账记录）中提取结构化元数据。涵盖字段如：保证金类型、合同约定的返还期限、同一项目的履约保证金缴纳记录及退还状态、实际缴纳金额、实际退还日期、对应项目名称、工程质量保证金缴纳记录及退还状态、约定返还日期。文档范围包括：保证金缴纳与返还台账记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 合同
- 工程
- 金额
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 台账记录
  member_count: 1
  member_details:
  - 保证金缴纳与返还台账记录
output:
  fields:
  - name: 保证金类型
    type: string
    description: 提取 保证金类型 的文本值
  - name: 合同约定的返还期限
    type: string
    description: 提取 合同约定的返还期限 的文本值
  - name: 同一项目的履约保证金缴纳记录及退还状态
    type: boolean
    description: 提取 同一项目的履约保证金缴纳记录及退还状态 的布尔值（是/否）
  - name: 实际缴纳金额
    type: number
    description: 提取 实际缴纳金额 的数值（含单位，如万元、吨等）
  - name: 实际退还日期
    type: date
    description: 提取 实际退还日期 的日期值，格式 YYYY-MM-DD
  - name: 对应项目名称
    type: string
    description: 提取 对应项目名称 的文本值
  - name: 工程质量保证金缴纳记录及退还状态
    type: boolean
    description: 提取 工程质量保证金缴纳记录及退还状态 的布尔值（是/否）
  - name: 约定返还日期
    type: date
    description: 提取 约定返还日期 的日期值，格式 YYYY-MM-DD
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ((台账记录.保证金类型 = '履约保证金' AND (台账记录.实际缴纳金额 / 清单表.合同金额) > 0.1) OR (台账记录.保证金类型 = '工程质量保证金' AND (台账记录.实际缴纳金额 / 清单表.合同金额)
    > 0.03) OR (台账记录.保证金类型 = '投标保证金' AND (台账记录.实际缴纳金额 / 清单表.中标金额) > 0.02))
  description: 履约保证金上限为合同金额10%，工程质量保证金上限为工程价款结算总额3%（依据建质〔2017〕138号），投标保证金上限为中标金额2%。凡超过对应法定比例，直接判定违规。比例计算以实际缴纳金额与企业计价基数（合同金额/中标金额）的比值为准。
  audit_item: 违规收费-工程建设领域保证金清理规范不到位
  suspicion: 超规定比例预留保证金
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量保证金管理办法\",\n    \"法规文号\": \"建质〔2017〕138号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"发包人应当在招标文件及合同中明确保证金的预留方式、比例及返还期限。保证金总预留比例不得高于工程价款结算总额的3%。\"\n  },\n  {\n    \"法规名称\"\
    : \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第五十八条\",\n    \"内容概述\"\
    : \"招标文件要求中标"
- expression: (台账记录.保证金类型 = '履约保证金' AND 台账记录.实际退还日期 IS NULL AND 清单表.竣工日期 IS NOT NULL AND DATEDIFF(NOW(), 清单表.竣工日期) > 0) AND
    (台账记录.保证金类型 = '工程质量保证金' AND 台账记录.预留开始日期 IS NOT NULL) AND (双方记录所属项目编码相同)
  description: 在工程竣工验收后，履约保证金即应退还；若此时依旧扣留履约保证金未退，同时新的工程质量保证金已开始预留（或原质量保证金持续存留），形成时间上重叠的双重占用。不论合同是否有“转化”条款，只要竣工后两种保证金均被占用，视为违规双重预留。阈值条件为竣工日期已过且两类保证金均存在未退或留存状态。
  audit_item: 违规收费-工程建设领域保证金清理规范不到位
  suspicion: 违规同时预留履约保证金和工程质量保证金
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于清理规范工程建设领域保证金的通知\",\n    \"法规文号\": \"国办发〔2016〕49号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、严格规范保证金的收取和使用\",\n    \"内容概述\": \"除依法设立的投标、履约、工程质量和农民工工资保证金外，任何单位不得擅自设立其他保证金；对保留的保证金，要按规定及时退还，不得超期占用。\"\
    \n  },\n  {\n    \"法规名称\": \"建设工程施工合同（示范文本）\",\n    \"法规文号\": \"GF-2017-0201\",\n    \"效力级别\": \"行业规范\",\n    \"条款"
- expression: (台账记录.实际退还日期 IS NULL AND 台账记录.约定返还日期 IS NOT NULL AND DATEDIFF(NOW(), 台账记录.约定返还日期) > 0) OR (台账记录.实际退还日期 > 台账记录.约定返还日期)
    OR (台账记录.保证金类型 = '工程质量保证金' AND 台账记录.实际退还日期 IS NULL AND 验收报告.竣工日期 IS NOT NULL AND DATEDIFF(NOW(), 验收报告.竣工日期) > 730)
  description: 保证金返还时间超过合同约定或法定最后期限，即构成未及时返还。对于工程质量保证金，法定最长缺陷责任期为24个月（2年），若竣工后超过2年仍未退还，直接判定违规。对于投标保证金、履约保证金，以合同约定时间为准，凡超过一天均违规。退款日期为空且当前日期已超过约定日，也视为逾期。
  audit_item: 违规收费-工程建设领域保证金清理规范不到位
  suspicion: 未及时返还保证金
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量保证金管理办法\",\n    \"法规文号\": \"建质〔2017〕138号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"缺陷责任期届满，承包人向发包人申请返还保证金。发包人接到申请后，应在14天内进行核实，无异议并同意支付的，应将保证金连同利息在核实后14天内返还，逾期未返还的，应承担违约责任。缺陷责任期一般不超过2年。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规"
