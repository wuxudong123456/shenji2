name: audit/记录留痕类/事故记录
type: model
description: 从记录留痕类类文档（事故记录）中提取结构化元数据。涵盖字段如：事故责任方、对母体资质的影响。文档范围包括：产品质量事故记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 事故记录
  member_count: 1
  member_details:
  - 产品质量事故记录
output:
  fields:
  - name: 事故责任方
    type: string
    description: 提取 事故责任方 的文本值
  - name: 对母体资质的影响
    type: string
    description: 提取 对母体资质的影响 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (授权使用费标准.授权使用费标准 = 0 || 使用台账.付费记录 = '无' && 备案使用主体.备案状态 = '未备案') && (使用台账.使用企业名称 in (参股企业名单) && 事故责任方.记录数 > 0)
    || (授权期价值变动.授权期价值变动 < -0.2)
  description: 向参股企业提供字号、资质等无形资产而未收取使用费、未备案或缺少监督，且引发质量事故导致品牌价值下降20%以上的，即构成违规授权且未有效维护权益。
  audit_item: 资产管理方面存在的问题
  suspicion: 违规向参股企业提供字号、资质等无形资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十四条\",\n    \"内容概述\": \"国有独资企业、国有独资公司、国有资本控股公司不得无偿向关联方提供资金、商品、服务或者其他资产，不得以不公平的价格与关联方进行交易。\"\n  }\n]"
