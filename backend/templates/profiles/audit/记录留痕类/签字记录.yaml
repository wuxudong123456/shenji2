name: audit/记录留痕类/签字记录
type: model
description: 从记录留痕类类文档（签字记录）中提取结构化元数据。涵盖字段如：决策事项、决策日期、出席人员、出席人员签字、同意比例、签字真实性、表决结果、议题。文档范围包括：村民签字记录、重大工程决策签字记录、重大投资事项的集体决策签字记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 签字记录
  member_count: 1
  member_details:
  - 村民签字记录
  - 重大工程决策签字记录
  - 重大投资事项的集体决策签字记录
output:
  fields:
  - name: 决策事项
    type: string
    description: 提取 决策事项 的文本值
  - name: 决策日期
    type: date
    description: 提取 决策日期 的日期值，格式 YYYY-MM-DD
  - name: 出席人员
    type: string
    description: 提取 出席人员 的文本值
  - name: 出席人员签字
    type: string
    description: 提取 出席人员签字 的文本值
  - name: 同意比例
    type: number
    description: 提取 同意比例 的数值（含单位，如万元、吨等）
  - name: 签字真实性
    type: string
    description: 提取 签字真实性 的文本值
  - name: 表决结果
    type: boolean
    description: 提取 表决结果 的布尔值（是/否）
  - name: 议题
    type: string
    description: 提取 议题 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (人均摊派金额 > 省级规定限额) || (人均摊派 > 上年农民人均纯收入 * 0.01) || (无村民代表大会决议记录) || (存在强制摊派证据，如投诉或录音)
  description: 向农民筹资必须经村民会议讨论同意，且不超过省级限定标准（如人均100元）及上年纯收入百分之一。违反任一条件即为违规摊派。
  audit_item: 项目建设管理不符合相关规定
  suspicion: 超标准、强制向农民摊派集资修路
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步做好减轻农民负担工作的意见\",\n    \"法规文号\": \"国办发〔2012〕22号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"严禁超标准、超范围向农民筹资筹劳，不得强行以资代劳，筹资筹劳必须经村民会议讨论同意。\"\n  },\n  {\n    \"法规名称\": \"村民一事一议筹资筹劳管理办法\"\
    ,\n    \"法规文号\": \"国办发〔2007〕4号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"筹资筹劳方案须村民会议或村民"
