name: audit/记录留痕类/信访记录
type: model
description: 从记录留痕类类文档（信访记录）中提取结构化元数据。涵盖字段如：投诉内容、涉及人员。文档范围包括：职工投诉或信访记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 信访记录
  member_count: 1
  member_details:
  - 职工投诉或信访记录
output:
  fields:
  - name: 投诉内容
    type: string
    description: 提取 投诉内容 的文本值
  - name: 涉及人员
    type: string
    description: 提取 涉及人员 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (死亡人员统计台账.死亡日期 IS NOT NULL || 民政部门死亡人员信息共享数据.死亡日期 IS NOT NULL) && (住房公积金缴存明细表.账户状态 NOT IN ('销户','冻结','呆滞'))
    && (DATEDIFF(DAY, COALESCE(死亡人员统计台账.死亡日期, 民政部门死亡人员信息共享数据.死亡日期), CURRENT_DATE) > 180)
  description: 违规判定：已掌握死亡信息且死亡超180天，但该职工公积金账户仍未销户或冻结，未启动继承提取程序。表达式采用死亡人员统计台账与民政部门数据双源确保死亡信息可靠，超过6个月视为未及时清理。部分地方政策要求单位在知晓死亡后一定期限内通知继承人办理，审计常用180天作为一般容忍上限。
  audit_item: 住房公积金账户未及时清理
  suspicion: 未向死亡人员家属退还住房公积金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十四条\",\n    \"内容概述\": \"职工死亡或者被宣告死亡的，职工的继承人、受遗赠人可以提取职工住房公积金账户内的存储余额；单位负有协助办理的义务，并应妥善保管资料。\"\n  },\n  {\n    \"法规名称\"\
    : \"住房公积金提取业务标准\",\n    \"法规文号\": \"GB/T 51353-2019\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"4.2.4\",\n    \"内容概述\"\
    : \"死亡提取"
