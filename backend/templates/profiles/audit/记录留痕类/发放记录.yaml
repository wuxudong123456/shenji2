violations:
- expression: (礼品发放记录.采购物品名称 LIKE '%购物卡%' OR 礼品发放记录.采购物品名称 LIKE '%高档烟酒%' OR 礼品发放记录.采购物品名称 LIKE '%礼金%') OR (礼品发放记录.单价 > 300)
    OR (财务报销凭证.报销科目 LIKE '%办公用品%' AND 财务报销凭证.金额 > 2000 AND 财务报销凭证.所附审批单情况 = '无明细清单') OR (礼品收发登记表.领取人签字 IS NULL)
  description: 采购购物卡、高档烟酒等违禁品；礼品单价超过300元（参考标准）；大额办公用品报销无实际采购明细涉嫌伪装礼品支出；礼品发放无领取人签字无法追溯去向，均视为违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务接待中赠送违规礼品
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第十六条\",\n    \"内容概述\": \"接待单位不得以任何名义赠送礼金、有价证券、纪念品和土特产品等。\"\n  }\n]"
- expression: (站点名称、应配人数、实配人数、人员姓名、专兼职标识.实配人数 < 配备人数要求、专兼职规定、不得空岗条款.配备人数要求) || (站点名称、应配人数、实配人数、人员姓名、专兼职标识.实配人数 > 0 && (合同签订日期、合同期限、岗位职责.合同签订日期
    == '缺失' || 考勤月份、出勤天数、缺勤记录.出勤天数 < 0.8))
  description: 配备制度要求每站至少配备1名专职信息员，若统计表显示实配人数为0或配备人员无正式聘用合同，或考勤记录显示月均出勤率低于80%（相当于每月缺勤超过6天），即判定为未实质配备或人员形同虚设。
  audit_item: 数字乡村建设人才不足
  suspicion: 部分村级信息站未配备专职信息员
  regulation: "[\n  {\n    \"法规名称\": \"数字乡村建设相关实施方案\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"村级信息服务站建设要求\"\
    ,\n    \"内容概述\": \"各行政村数字乡村信息服务站应至少配备1名专职信息员，负责设备管理、信息采集和便民服务，不得由村干部简单兼职。\"\n  }\n]"
- expression: (记录留痕类-发放记录-工人姓名、应发日期、实发日期、应发金额、实发金额、缴款单位/个人名称、金额中同一工人连续2个月无发放记录) || (跟踪台账.办结日期 - 受理日期 > 30 天) || (其他杂项类-其他-投诉日期、被投诉单位、拖欠金额.处理状态
    = ‘未解决’ AND 拖欠天数 > 60)
  description: 工资发放记录出现连续2个月及以上断发，或投诉处理周期超过30个自然日，或欠薪问题超过60天仍未解决，均构成长效治理机制缺位。
  audit_item: 新型职业农民培育、农民工技能提升和返乡创业就业不符合相关规定
  suspicion: 拖欠农民工工资且投诉处理机制失效
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三条、第十六条、第四十二条\",\n    \"内容概述\": \"农民工有按时足额获得工资的权利，任何单位和个人不得拖欠农民工工资。用人单位应当按照与农民工书面约定或依法制定的规章制度规定的工资支付周期和具体支付日期足额支付工资。政府部门接到拖欠农民工工资的举报投诉，应当及时依法处理。\"\
    \n  }\n]"
- expression: (统计表.获得贷款企业数/统计表.申请企业数 < 0.5) || (统计表.实际贴息额/统计表.应贴息额 < 0.8) || (发放记录.实际利率 > 政策文件.贴息利率*1.1) || (偿金台账.使用余额/偿金台账.补偿金规模
    < 0.2)
  description: 贷款支持覆盖率低于申请企业的50%，或贴息兑现率低于80%，或企业实际承担的贷款利率超过政策承诺利率的110%，或风险补偿金到位规模不足应设规模的20%，任一条件成立即判定金融扶持政策缺失或落实不到位。
  audit_item: 现代农业产业园（集群、强镇）政策扶持不到位
  suspicion: 现代农业产业园金融扶持政策未建立或执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于金融服务乡村振兴的指导意见\",\n    \"法规文号\": \"银发〔2019〕11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"五、强化金融产品和服务方式创新\",\n    \"内容概述\": \"鼓励银行业金融机构单列涉农信贷计划，下放审批权限，优化审批流程，开发专属金融产品，加大信用贷款投放力度，合理确定贷款利率水平。\"\n  },\n\
    \  {\n    \"法规名称\": \"国务院办公厅关于支持返乡下乡人员创业创新促进农村一二三产业融合发展的意见\",\n    \"法规文号\": \"国办发〔2016〕84号\",\n    \"效力级别\": \"规范性文件\""
- expression: (发放记录.实发补贴额度 / 发放记录.应发补贴额度) < 0.9  ||  (发放记录.发放日期 - 政策规定发放截止日) > 30天  ||  (拨付文件.专项资金拨付总额 - 发放记录.实发补贴额度) > 5000元且占比>10%
  description: 实发金额不足应发金额的90%，或补贴发放延迟超过30天，或财政拨付与终端到账差额超过5000元且比例超10%的，均视为补贴落实不到位。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业用电补贴资金被截留或未足额到位
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于切实加强惠农补贴资金管理的通知\",\n    \"法规文号\": \"财农〔2021〕XX号（示例文号）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"惠农补贴资金必须足额、及时发放到受益主体，严禁截留、挤占、挪用或无故拖延，实行专户管理、封闭运行。\"\n  }\n]"
- expression: 贴息资金预算科目.安排金额 = 0 && 贴息文件.兑现周期 || (贴息文件.兑现周期 - 申报材料.申报贴息额) > 180 天 && 发放记录.发放金额 < 申报材料.申报贴息额 * 0.8
  description: 已出台明确贴息政策但财政未安排对应预算，或兑现延迟超过6个月，或实际发放金额不足应发额的80%，视为贴息政策空转。
  audit_item: 相关支持政策落实不到位
  suspicion: 涉农贷款贴息资金未安排或长期拖欠
  regulation: "[\n  {\n    \"法规名称\": \"财政部 农业农村部关于进一步做好农业相关财政金融政策落实工作的通知\",\n    \"法规文号\": \"财农〔2020〕XX号（示例）\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各级财政要将涉农贷款贴息资金足额纳入年度预算，及时审核拨付，不得无故拖延或降低兑现标准。\"\n  }\n]"
- expression: (发放记录.实际到账金额 < 执行凭证.应发补贴金额 * 0.99) OR (明细表.差异率 > 5% AND 发放记录.发放时间距离应发周期截止日 > 15天) OR (发放记录.收款账户 NOT IN 执行凭证.对应农户/企业账户)
  description: 实发金额低于应发金额的99%视为未足额发放；差异率超过5%且延迟发放超过15天为严重违规；补贴资金转入非申报主体的账户涉嫌截留挪用。涉及多个月份可累计计算，差异金额绝对值超1000元即需核实。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业电价补贴资金未足额发放或截留
  regulation: "[\n  {\n    \"法规名称\": \"关于做好农业生产用电价格政策落实工作的通知\",\n    \"法规文号\": \"发改价格〔2021〕XXX号（假设存在）\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各地要确保农业用电补贴资金及时足额兑付，不得挤占、截留、挪用，补贴发放周期原则上按月或按季度执行。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"各级政府支出必须按照预算执行，不得"
- expression: (COUNT(DISTINCT 申领台账.养殖场名称) / COUNT(DISTINCT 库.养殖场名称)) < 政策文件.覆盖率目标值
  description: 以政策文件规定的覆盖率目标值（如≥80%）为基准，实际参与“先打后补”的规模场数量占全部规模场的比率低于目标值即判定为覆盖率低；若比率低于50%视为严重不达标。
  audit_item: 落实动物防疫不到位
  suspicion: 强制免疫疫苗“先打后补”政策覆盖率低
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国动物防疫法\",\n    \"法规文号\": \"主席令第69号（2021年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
