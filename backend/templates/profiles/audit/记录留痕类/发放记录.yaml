name: audit/记录留痕类/发放记录
type: model
description: 从记录留痕类类文档（发放记录）中提取结构化元数据。涵盖字段如：发放人员姓名及身份证号、发放对象、发放日期、发放时间、发放月份、发放金额、发证日期、受益主体。文档范围包括：低保金发放记录、信息员工资发放记录、农业电价补贴发放记录、农机购置补贴发放记录、农民工工资发放记录、合作社报酬发放记录、征地补偿发放记录、救助资金发放记录（签收名册）、现场施工人员工资发放记录、礼品发放记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 合同
- 薪酬
- 补贴
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 发放记录
  member_count: 1
  member_details:
  - 低保金发放记录
  - 信息员工资发放记录
  - 农业电价补贴发放记录
  - 农机购置补贴发放记录
  - 农民工工资发放记录
  - 合作社报酬发放记录
  - 征地补偿发放记录
  - 救助资金发放记录（签收名册）
  - 现场施工人员工资发放记录
  - 礼品发放记录
  - 职业资格证书发放记录
  - 补贴发放记录
  - 补贴资金发放记录
  - 财政补贴发放记录
  - 购房补贴发放记录
  - 贷款发放记录
  - 资金发放记录
  - 银行贴息发放记录
