name: audit/记录留痕类/工单记录
type: model
description: 从记录留痕类类文档（工单记录）中提取结构化元数据。涵盖字段如：投诉原因、投诉时间。文档范围包括：电网投诉工单记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 工单记录
  member_count: 1
  member_details:
  - 电网投诉工单记录
output:
  fields:
  - name: 投诉原因
    type: string
    description: 提取 投诉原因 的文本值
  - name: 投诉时间
    type: date
    description: 提取 投诉时间 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 供应裕度 = (变压器总容量 - 峰值负荷需求) / 变压器总容量 * 100;  (供应裕度 < 10) || (实际改造户数 > 设计可承载户数 && 电网扩容完成日期 > 煤改电改造完成日期 + 90 天)
  description: 电力供应安全裕度低于10%即存在过载跳闸风险；实际改造户数超出设计容量且配套电网扩容滞后于煤改电工程超过90天，表明规模与能力严重不匹配。
  audit_item: 项目规划统筹衔接不到位
  suspicion: 煤改电规模超出电网承载能力
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条\"\
    ,\n    \"内容概述\": \"可行性研究报告应当从建设规模、建设条件落实等角度论证项目建设可行性，确保项目主要建设条件得到落实。\"\n  }\n]"
