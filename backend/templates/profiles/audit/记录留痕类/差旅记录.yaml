name: audit/记录留痕类/差旅记录
type: model
description: 从记录留痕类类文档（差旅记录）中提取结构化元数据。涵盖字段如：参会人员同期差旅地点。文档范围包括：差旅记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 差旅记录
  member_count: 1
  member_details:
  - 差旅记录
output:
  fields:
  - name: 参会人员同期差旅地点
    type: string
    description: 提取 参会人员同期差旅地点 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (会议费用明细表.餐饮支出 > 会议费用明细表.实际总支出金额*0.6 OR 培训费用明细表.餐饮支出 > 培训费用明细表.金额*0.6) AND (会议培训支撑材料.签到表 IS NULL OR 会议培训支撑材料.签到表笔迹雷同
    OR 会议培训支撑材料.签到人员与人员考勤记录矛盾) AND ((会议费用明细表.实际总支出金额/会议费用明细表.参会人数) > 近三年同类活动人均支出*3 OR (培训费用明细表.金额) > 近三年同类活动人均支出*3)
  description: 会议/培训餐饮占比畸高（>60%）、活动佐证材料虚假或缺失、人均支出异常超高，三者叠加表明活动极可能不实，实为接待费转移。
  audit_item: 公务接待费预算执行不合规
  suspicion: 虚构会议培训隐匿接待费开支
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
