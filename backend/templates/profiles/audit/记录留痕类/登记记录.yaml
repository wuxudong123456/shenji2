name: audit/记录留痕类/登记记录
type: model
description: 从记录留痕类类文档（登记记录）中提取结构化元数据。涵盖字段如：事由、审批人、携带人、设备名称、进出日期。文档范围包括：设备出入登记记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 审批
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 登记记录
  member_count: 1
  member_details:
  - 设备出入登记记录
output:
  fields:
  - name: 事由
    type: string
    description: 提取 事由 的文本值
  - name: 审批人
    type: string
    description: 提取 审批人 的文本值
  - name: 携带人
    type: string
    description: 提取 携带人 的文本值
  - name: 设备名称
    type: string
    description: 提取 设备名称 的文本值
  - name: 进出日期
    type: date
    description: 提取 进出日期 的日期值，格式 YYYY-MM-DD
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ( 机房环境检测报告缺失=true ) OR ( 检测报告.温度（℃） < 18 OR 检测报告.温度（℃） > 26 ) OR ( 检测报告.湿度（%） < 40 OR 检测报告.湿度（%） > 70 ) OR (
    设备出入登记记录缺失=true ) OR ( 记录表.问题未整改数量 > 0 )
  description: 1. 缺少定期环境检测报告表明物理环境监测缺失；2. 温湿度超出标准范围（18-26℃，40%-70%）可能影响设备稳定运行；3. 无设备出入记录或检查记录中存在未整改问题均反映出物理安全管理松懈。满足任一条件即视为存在缺陷。
  audit_item: 网络安全建设方面存在的问题
  suspicion: 信息系统物理环境存在安全缺陷
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国网络安全法\",\n    \"法规文号\": \"主席令第53号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十一条\",\n    \"内容概述\": \"网络运营者应当履行安全保护义务，包括采取物理安全防护措施等。\"\n  },\n  {\n    \"法规名称\": \"信息安全技术 网络安全等级保护基本要求\",\n    \"\
    法规文号\": \"GB/T 22239-2019\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"物理安全部分\",\n    \"内容概述\": \"应设置机房专用区域，对机房出入进行控制和记录，配备温湿度调控、"
