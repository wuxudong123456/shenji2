name: audit/记录留痕类/分工记录
type: model
description: 从记录留痕类类文档（分工记录）中提取结构化元数据。涵盖字段如：保管人、印鉴名称、存放地点、是否分管。文档范围包括：印鉴保管分工记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 分工记录
  member_count: 1
  member_details:
  - 印鉴保管分工记录
output:
  fields:
  - name: 保管人
    type: string
    description: 提取 保管人 的文本值
  - name: 印鉴名称
    type: string
    description: 提取 印鉴名称 的文本值
  - name: 存放地点
    type: string
    description: 提取 存放地点 的文本值
  - name: 是否分管
    type: boolean
    description: 提取 是否分管 的布尔值（是/否）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (票据管理台账.作废登记 != 财务账簿类-簿-使用日期、用途摘要、审批人签字、使用人签字、印鉴名称.使用日期) || (财务账簿类-簿-使用日期、用途摘要、审批人签字、使用人签字、印鉴名称.使用日期 < 80% AND
    财务账簿类-簿-使用日期、用途摘要、审批人签字、使用人签字、印鉴名称.使用日期 > 5) || (记录留痕类-分工记录-印鉴名称、保管人、存放地点、是否分管.保管人 = 记录留痕类-分工记录-印鉴名称、保管人、存放地点、是否分管.保管人)
    || (票据管理台账.核销日期 = '未核销' AND 票据管理台账.核销日期 < 当前日期 - 30天) || (财务账簿类-簿-使用日
  description: 空白票据账实不符；印鉴使用登记不全且累计使用超过5次；财务章和法人章由同一人保管；超过票期30天仍未核销；大额票据（>10万元）使用印鉴无审批签字，均视为管理薄弱。记录完整率＜80%为阈值。
  audit_item: 违反会计管理规定的行为
  suspicion: 票据及银行预留印鉴管理薄弱
  regulation: "[\n  {\n    \"法规名称\": \"支付结算办法\",\n    \"法规文号\": \"银发〔1997〕393号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
