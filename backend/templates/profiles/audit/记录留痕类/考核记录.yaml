name: audit/记录留痕类/考核记录
type: model
description: 从记录留痕类类文档（考核记录）中提取结构化元数据。涵盖字段如：参训人数、合格情况、培训人员姓名、培训内容、培训时长、培训次数、培训项目、实到人数。文档范围包括：乡村建设工匠培训考核记录、信息员培训考核记录、创业就业培训考核记录、培训考核记录、教师培训考核记录、绩效评价考核记录、考核记录、职业技能培训考核记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 培训
- 整改
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 考核记录
  member_count: 1
  member_details:
  - 乡村建设工匠培训考核记录
  - 信息员培训考核记录
  - 创业就业培训考核记录
  - 培训考核记录
  - 教师培训考核记录
  - 绩效评价考核记录
  - 考核记录
  - 职业技能培训考核记录
output:
  fields:
  - name: 参训人数
    type: number
    description: 提取 参训人数 的数值（含单位，如万元、吨等）
  - name: 合格情况
    type: string
    description: 提取 合格情况 的文本值
  - name: 培训人员姓名
    type: string
    description: 提取 培训人员姓名 的文本值
  - name: 培训内容
    type: string
    description: 提取 培训内容 的文本值
  - name: 培训时长
    type: string
    description: 提取 培训时长 的文本值
  - name: 培训次数
    type: string
    description: 提取 培训次数 的文本值
  - name: 培训项目
    type: string
    description: 提取 培训项目 的文本值
  - name: 实到人数
    type: number
    description: 提取 实到人数 的数值（含单位，如万元、吨等）
  - name: 工匠名册条目
    type: string
    description: 提取 工匠名册条目 的文本值
  - name: 年度累计培训学时
    type: date
    description: 提取 年度累计培训学时 的日期值，格式 YYYY-MM-DD
  - name: 整改记录
    type: string
    description: 提取 整改记录 的文本值
  - name: 核定学时
    type: string
    description: 提取 核定学时 的文本值
  - name: 签到人员名单
    type: string
    description: 提取 签到人员名单 的文本值
  - name: 考核成绩
    type: string
    description: 提取 考核成绩 的文本值
  - name: 考核结果
    type: boolean
    description: 提取 考核结果 的布尔值（是/否）
  - name: 考核通过率
    type: string
    description: 提取 考核通过率 的文本值
  - name: 评价报告
    type: string
    description: 提取 评价报告 的文本值
  - name: 课程名称
    type: string
    description: 提取 课程名称 的文本值
  - name: 问题项
    type: string
    description: 提取 问题项 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (名册管理制度文件缺失) || (工程分配记录表中有工匠无资质证书) || (验收报告.持证工匠签名 < 70%) || (登记表.事故涉及的施工方名称 > 0)
  description: 名册管理制度文件缺失视同未建立；工程分配记录中若出现无资质工匠参与施工，直接违规；持证工匠占参与改造总工匠比例低于70%，说明工匠管理失控；因工程质量引发事故且施工方无资质，属于严重管理失职。
  audit_item: 农村危房改造（含农房改善、撤村并居）不符合相关规定
  suspicion: 未建立乡村建设工匠名册管理制度
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部关于加强农村危房改造质量安全管理工作的通知\",\n    \"法规文号\": \"建村〔2017〕47号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各地要建立健全乡村建设工匠管理制度，开展工匠培训，建立名册，实行持证上岗，同时建立黑名单制度，对造成质量安全事故的工匠予以惩戒。\"\n  }\n]"
- expression: (检查日期.记录总数 = 0) OR (DATEDIFF(MAX(检查日期), MIN(检查日期)) / (COUNT(检查日期) - 1) > 180 AND COUNT(检查日期) < 2) OR (工作计划.考核指标
    NOT CONTAINS "农药包装废弃物回收")
  description: ①检查记录表完全空白，表明年度内未开展任何监督检查；②检查频次低于最低要求（如每半年至少1次），年度检查次数不足2次；③年度工作计划未将回收处理纳入监管。满足任一条件即触发疑点。
  audit_item: 农药化肥减量增效落实方面不符合相关规定
  suspicion: 主管部门未履行农药包装废弃物回收处理监管职责
  regulation: "[\n  {\n    \"法规名称\": \"农药包装废弃物回收处理管理办法\",\n    \"法规文号\": \"生态环境部 农业农村部令2020年第7号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第六条、第十九条\",\n    \"内容概述\": \"县级以上地方人民政府农业农村主管部门负责本行政区域内农药包装废弃物回收处理的监督管理，并应当加强监督检查。\"\n  }\n]"
- expression: 制度文件缺失网格化管理制度 || 制度文件缺失工匠培训制度 || (记录表.巡查日期 < 12) || (明细表.金额（是否包含日常巡查、技术采购） < 5%) || (考核记录.培训次数 < 1)
  description: 未建立必要的网格化管理、工匠培训等制度文件；年度日常巡查次数不足12次（月均不足1次）；专项资金中用于动态监管和技术的支出占比低于5%；年度安全培训少于1次等，均表明长效机制未实质运行。
  audit_item: 未按要求开展农村房屋安全隐患排查整治
  suspicion: 未建立健全农村房屋安全长效机制
  regulation: "[\n  {\n    \"法规名称\": \"全国自建房安全专项整治工作方案\",\n    \"法规文号\": \"国办发明电〔2022〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第五部分 建立健全长效机制\",\n    \"内容概述\": \"要求加快建立农村房屋建设管理长效机制，加强日常巡查和网格化管理，健全农村建筑工匠培训制度，充实基层监管力量，保障经费投入。\"\n  }\n\
    ]"
- expression: SELECT COUNT(DISTINCT 表4.安置类型) = 1 || (表1.年龄 > 50 && 表4.安置类型 = '自主创业' && 表6.身份证 IS NULL)
  description: 统计分类实施清单（表4）中安置类型的唯一种类，若仅为1种，表明“一刀切”未分类；同时检查年龄50岁以上渔民被安排自主创业但无相应培训记录的，属于分类与个体特征严重不匹配。
  audit_item: 退捕渔民转产安置不合规
  suspicion: 渔民转产安置方案未分类施策
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强长江流域重点水域禁捕和退捕渔民安置保障工作的通知\",\n    \"法规文号\": \"农办渔〔2021〕16号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"要求根据退捕渔民年龄、技能等特点，分类施策，提供个性化转产就业帮扶，杜绝简单摊派岗位。\"\n  }\n]"
- expression: ( (SELECT COUNT(DISTINCT 表6.身份证) * 1.0 / COUNT(*) FROM 表1) < 0.6 ) || (EXISTS (SELECT 身份证, 培训内容 FROM 表6 GROUP
    BY 身份证, 培训内容 HAVING COUNT(*) > 1))
  description: 计算实际参训人数占退捕渔民总人数的比率，低于60%的判定培训覆盖面不足；同时筛查同一身份证同一培训内容出现多次的记录，判定为虚假培训或重复充数。
  audit_item: 退捕渔民转产安置不合规
  suspicion: 退捕渔民职业技能培训未有效开展
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强长江流域重点水域禁捕和退捕渔民安置保障工作的通知\",\n    \"法规文号\": \"农办渔〔2021〕16号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"要求切实开展退捕渔民职业技能培训，确保培训内容实用、覆盖面广，提升就业转化率，不得虚列培训套取资金。\"\n  }\n]"
