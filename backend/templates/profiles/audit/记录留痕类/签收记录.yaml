name: audit/记录留痕类/签收记录
type: model
description: 从记录留痕类类文档（签收记录）中提取结构化元数据。涵盖字段如：到账确认金额、姓名、实发工资、收款人姓名、收款账号/现金签收、签字日期、签收人、签收日期。文档范围包括：农民工签收记录、被审计单位年度预算批复的正式文件的签收记录、转移支付资金拨付审批文件的签收记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 薪酬
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 签收记录
  member_count: 1
  member_details:
  - 农民工签收记录
  - 被审计单位年度预算批复的正式文件的签收记录
  - 转移支付资金拨付审批文件的签收记录
output:
  fields:
  - name: 到账确认金额
    type: number
    description: 提取 到账确认金额 的数值（含单位，如万元、吨等）
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 实发工资
    type: string
    description: 提取 实发工资 的文本值
  - name: 收款人姓名
    type: number
    description: 提取 收款人姓名 的数值（含单位，如万元、吨等）
  - name: 收款账号-现金签收
    type: number
    description: 提取 收款账号-现金签收 的数值（含单位，如万元、吨等）
  - name: 签字日期
    type: date
    description: 提取 签字日期 的日期值，格式 YYYY-MM-DD
  - name: 签收人
    type: string
    description: 提取 签收人 的文本值
  - name: 签收日期
    type: date
    description: 提取 签收日期 的日期值，格式 YYYY-MM-DD
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 银行转账记录-现金签收笔迹
    type: string
    description: 提取 银行转账记录-现金签收笔迹 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
