name: audit/记录留痕类/入账记录
type: model
description: 从记录留痕类类文档（入账记录）中提取结构化元数据。涵盖字段如：入账日期、入账金额、收据编号、收款凭证号、缴费金额。文档范围包括：公务用车处置收益入账记录、农民缴费收据存根入账记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 凭证
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 入账记录
  member_count: 1
  member_details:
  - 公务用车处置收益入账记录
  - 农民缴费收据存根入账记录
output:
  fields:
  - name: 入账日期
    type: date
    description: 提取 入账日期 的日期值，格式 YYYY-MM-DD
  - name: 入账金额
    type: number
    description: 提取 入账金额 的数值（含单位，如万元、吨等）
  - name: 收据编号
    type: string
    description: 提取 收据编号 的文本值
  - name: 收款凭证号
    type: number
    description: 提取 收款凭证号 的数值（含单位，如万元、吨等）
  - name: 缴费金额
    type: number
    description: 提取 缴费金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (批准处置方式、处置价值、受让方.处置价值 < 批准处置方式、处置价值、受让方.评估价值 * 0.9) AND (未附有 情况说明) OR (批准处置方式、处置价值、受让方.处置价值 IS NULL) OR (批准处置方式、处置价值、受让方.处置价值
    > 入账金额、入账日期、收款凭证号.入账金额) OR (入账金额、入账日期、收款凭证号.入账金额 IS NULL)
  description: 规定车辆处置需进行资产评估并经批准。若最终处置价格显著低于评估价（例如低于90%），且无合理解释，则存在低价转让嫌疑。若实际处置已发生，但处置收益未全额、及时上缴国库或未记入财务账，则判定为截留、挪用处置收入。
  audit_item: 违规管理或使用公务用车
  suspicion: 违规处置公务用车
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"行政事业单位应当将依法处置的资产所产生的收入，按照政府非税收入和国库集中收缴制度的有关规定管理。\"\n  },\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\"\
    ,\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第二十四条\",\n    \"内容概述\": \"对于处置的公务用车，应当通过公开拍卖等"
