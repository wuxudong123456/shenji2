name: audit/记录留痕类/时间记录
type: model
description: 从记录留痕类类文档（时间记录）中提取结构化元数据。涵盖字段如：实际会期起止。文档范围包括：会议实际执行时间记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 时间记录
  member_count: 1
  member_details:
  - 会议实际执行时间记录
output:
  fields:
  - name: 实际会期起止
    type: string
    description: 提取 实际会期起止 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 时间记录.实际会期起止 < 超预算审批记录.审批签批日期 || 审批记录缺失
  description: 会议正式开始日期早于审批单上最后签批日期的，视为先实施后审批；若无法提供任何审批记录，则属于未经审批擅自举办会议，同样违规。
  audit_item: 超标准举办会议
  suspicion: 会议未经适当审批或先实施后补批
  regulation: "[\n  {\n    \"法规名称\": \"《党政机关厉行节约反对浪费条例》\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"会议等公务活动应当严格执行审批程序，从严控制。\"\n  }\n]"
