name: audit/记录留痕类/培训记录
type: model
description: 从记录留痕类类文档（培训记录）中提取结构化元数据。涵盖字段如：人员姓名、从业人员姓名、参加人数、培训内容、培训日期、培训时间、最近培训日期。文档范围包括：垃圾分类宣传培训记录、草原监管人员培训记录、食堂从业人员培训记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 培训
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 培训记录
  member_count: 1
  member_details:
  - 垃圾分类宣传培训记录
  - 草原监管人员培训记录
  - 食堂从业人员培训记录
output:
  fields:
  - name: 人员姓名
    type: string
    description: 提取 人员姓名 的文本值
  - name: 从业人员姓名
    type: string
    description: 提取 从业人员姓名 的文本值
  - name: 参加人数
    type: number
    description: 提取 参加人数 的数值（含单位，如万元、吨等）
  - name: 培训内容
    type: string
    description: 提取 培训内容 的文本值
  - name: 培训日期
    type: date
    description: 提取 培训日期 的日期值，格式 YYYY-MM-DD
  - name: 培训时间
    type: date
    description: 提取 培训时间 的日期值，格式 YYYY-MM-DD
  - name: 最近培训日期
    type: date
    description: 提取 最近培训日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (统计表.分类收集覆盖率 < 专项规划.垃圾分类减量阶段目标 * 0.6) || (统计表.节点任务完成时间 - 专项规划.预期立项时间 > 90天) || (培训记录.培训时间 < 4) || (拨付文件.垃圾分类专项经费拨付金额
    > 0 && 拨付文件.支出明细 / 垃圾分类专项经费拨付金额 > 0.3)
  description: 分类覆盖率不足规划目标的60%，或关键任务延迟超过3个月，或培训次数每季度不足1次，或专项资金中超过30%用于无关接待等非直接工作，均判定为工作未开展或严重滞后。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 垃圾分类减量工作未开展或进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十三条\",\n    \"内容概述\": \"县级以上人民政府应当建立生活垃圾分类制度，统筹生活垃圾分类投放、分类收集、分类运输、分类处理系统。\"\n  },\n  {\n    \"法规名称\": \"住房和城乡建设部等部门关于在全国地级及以上城市全面开展生活垃圾分类工作的通知\"\
    ,\n    \"法规文号\": \"建城〔2019〕56号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"四\",\n    \"内容概述"
