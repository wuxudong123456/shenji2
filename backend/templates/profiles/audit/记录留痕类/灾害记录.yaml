name: audit/记录留痕类/灾害记录
type: model
description: 从记录留痕类类文档（灾害记录）中提取结构化元数据。涵盖字段如：发生年份、发生起止时间、对服务影响、影响区域、灾害发生日期、灾害类型。文档范围包括：农业灾害记录、农业部门灾害记录、气象局历史灾害记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 灾害记录
  member_count: 1
  member_details:
  - 农业灾害记录
  - 农业部门灾害记录
  - 气象局历史灾害记录
output:
  fields:
  - name: 发生年份
    type: string
    description: 提取 发生年份 的文本值
  - name: 发生起止时间
    type: date
    description: 提取 发生起止时间 的日期值，格式 YYYY-MM-DD
  - name: 对服务影响
    type: string
    description: 提取 对服务影响 的文本值
  - name: 影响区域
    type: string
    description: 提取 影响区域 的文本值
  - name: 灾害发生日期
    type: date
    description: 提取 灾害发生日期 的日期值，格式 YYYY-MM-DD
  - name: 灾害类型
    type: string
    description: 提取 灾害类型 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (保险公司理赔台账.出险日期 <> 气象局历史灾害记录.灾害发生日期) || (保险公司理赔台账.灾害类型 NOT IN (农业部门灾害记录.灾害类型)) || (财政补贴资金拨付凭证.理赔资金转入农户账户后3日内向保险公司关联账户转出)
  description: 理赔时段与气象部门记录的灾害发生时间无交集，或理赔灾害类型不在农业部门当年记录的灾种范围内，或理赔资金到账后短期内异常回流至保险公司关联方，均视为虚假理赔疑点。三种情形满足其一即触发，多个情形并存则风险极高。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 保险公司虚假理赔套取保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条第二项\"\
    ,\n    \"内容概述\": \"禁止保险公司通过虚假理赔、虚列费用、虚假退保或者截留、挪用保险金、经营费用等方式，骗取农业保险的保险费补贴。\"\n  }\n]"
- expression: (当前年份 - 实施方案.方案印发日期 >= 3) && (依据文件.修订触发条件建议) && (灾害记录.对服务影响)
  description: 若绩效评价方案超过3年未进行任何修订，且期间发生过明显影响农业生产服务的特殊情形（如旱灾导致灌溉需求激增），但原有指标值与实际需求明显背离，则评价方案缺乏动态适应性。
  audit_item: 农业社会化服务绩效考核不科学
  suspicion: 绩效评价方案长期未修订缺乏动态调整
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分第（九）条\",\n    \"内容概述\": \"建立绩效指标和标准体系动态调整机制，根据实际情况适时修订完善，确保绩效评价的科学性和有效性。\"\n  }\n]"
