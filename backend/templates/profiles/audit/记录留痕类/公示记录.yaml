name: audit/记录留痕类/公示记录
type: model
description: 从记录留痕类类文档（公示记录）中提取结构化元数据。涵盖字段如：公告栏后台发布时间戳记、公示候选人名单、公示内容、公示内容中公益金使用占比描述、公示内容完整性、公示内容明细、公示天数、公示对象。文档范围包括：中标候选人公示记录、惠农补贴政策社会公开公示记录、收费公示记录、政府信息公开公示记录、政府采购项目公示记录、救灾款物分配公示记录、救灾款物接收公示记录、村民公示记录、涉农补贴发放公示记录、第三方评价结果公示记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 明细
- 采购
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 公示记录
  member_count: 1
  member_details:
  - 中标候选人公示记录
  - 惠农补贴政策社会公开公示记录
  - 收费公示记录
  - 政府信息公开公示记录
  - 政府采购项目公示记录
  - 救灾款物分配公示记录
  - 救灾款物接收公示记录
  - 村民公示记录
  - 涉农补贴发放公示记录
  - 第三方评价结果公示记录
  - 补偿公示记录
  - 集体经济组织成员身份确认公示记录
output:
  fields:
  - name: 公告栏后台发布时间戳记
    type: date
    description: 提取 公告栏后台发布时间戳记 的日期值，格式 YYYY-MM-DD
  - name: 公示候选人名单
    type: string
    description: 提取 公示候选人名单 的文本值
  - name: 公示内容
    type: string
    description: 提取 公示内容 的文本值
  - name: 公示内容中公益金使用占比描述
    type: string
    description: 提取 公示内容中公益金使用占比描述 的文本值
  - name: 公示内容完整性
    type: string
    description: 提取 公示内容完整性 的文本值
  - name: 公示内容明细
    type: string
    description: 提取 公示内容明细 的文本值
  - name: 公示天数
    type: number
    description: 提取 公示天数 的数值（含单位，如万元、吨等）
  - name: 公示对象
    type: string
    description: 提取 公示对象 的文本值
  - name: 公示影像
    type: string
    description: 提取 公示影像 的文本值
  - name: 公示方式
    type: string
    description: 提取 公示方式 的文本值
  - name: 公示日期
    type: date
    description: 提取 公示日期 的日期值，格式 YYYY-MM-DD
  - name: 公示时间
    type: date
    description: 提取 公示时间 的日期值，格式 YYYY-MM-DD
  - name: 公示期
    type: string
    description: 提取 公示期 的文本值
  - name: 公示标题
    type: string
    description: 提取 公示标题 的文本值
  - name: 公示渠道
    type: string
    description: 提取 公示渠道 的文本值
  - name: 公示的中标候选人名称
    type: string
    description: 提取 公示的中标候选人名称 的文本值
  - name: 公示范围
    type: string
    description: 提取 公示范围 的文本值
  - name: 公示起止日期
    type: date
    description: 提取 公示起止日期 的日期值，格式 YYYY-MM-DD
  - name: 公示金额
    type: number
    description: 提取 公示金额 的数值（含单位，如万元、吨等）
  - name: 意见征集次数
    type: string
    description: 提取 意见征集次数 的文本值
  - name: 截图-文件号
    type: string
    description: 提取 截图-文件号 的文本值
  - name: 最后一次更新时间
    type: date
    description: 提取 最后一次更新时间 的日期值，格式 YYYY-MM-DD
  - name: 采购标准公示栏目内容或公告截图
    type: string
    description: 提取 采购标准公示栏目内容或公告截图 的文本值
  - name: 链接有效状态
    type: boolean
    description: 提取 链接有效状态 的布尔值（是/否）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 通知书.中标人名称 NOT IN (评标报告.中标候选人名单)
  description: 通过比对确定的中标人是否存在于评标委员会依法推荐并公示的中标候选人名单中。若中标人不在该名单内，则判定为违规，触发4.8.1情形。
  audit_item: 招标人违法确定中标人
  suspicion: 招标人在评标委员会推荐的中标候选人以外确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十七条\",\n    \"内容概述\": \"招标人在评标委员会依法推荐的中标候选人以外确定中标人的，中标无效；责令改正，可以处中标项目金额千分之五以上千分之十以下的罚款。\"\n  }\n]"
- expression: (DATEDIFF(系统当前日期, 公示记录.最后一次更新时间) > 365) || (清单名册类-项目清单-实际执收项目名称、实际执收标准、全量收费项目名称.全量收费项目名称 != 公示记录.公示内容明细)
  description: 触发条件一：距离最后一次公示记录日期已经过去超过一年，说明未按规定定期更新；条件二：财务系统中实际发生的全量收费项目条目数，明显多于在官网或公共服务平台公开列示的收费项目条目数。
  audit_item: 行业协会商会违规收费
  suspicion: 未按要求公示收费项目及标准
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步规范行业协会商会收费的通知\",\n    \"法规文号\": \"国办发〔2020〕21号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"各级各类行业协会商会要全面清理收费项目，按照\\\"能免则免、能减则减\\\"的原则取消不合法、不合理收费项目，并主动通过各级信用信息共享平台、协会商会网站集中公示并定期更新收费项目。\"\
    \n  }\n]"
- expression: (DATEDIFF(实际公开日期, 绩效评价报告出具日期) > 30) OR (公示内容 NOT LIKE '%第三方机构名称%' OR NOT LIKE '%评价标准%' OR NOT LIKE '%评价结果%'
    OR NOT LIKE '%问题及建议%')
  description: 从报告出具日算起超过30个工作日未公开即触发延迟公开疑点；公示内容缺少第三方机构名称、评价标准、结果或问题建议等关键要素之一即触发选择性公开或不完整性疑点。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 未按规定及时充分公开第三方绩效评价信息
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十条第十四项\",\n    \"内容概述\": \"行政机关应当主动公开财政预算、决算信息，包括预算绩效管理相关情况。\"\n  },\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\"\
    ,\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"四、（十六）\",\n    \"内容概述\": \"各级财政部门要推进绩效信息公开，将重"
- expression: 通知书.中标人名称 NOT IN (评标报告.推荐中标候选人名称) && 评标报告.排序 >= 1
  description: 当中标人不在评标委员会依法推荐的任何中标候选人名单中时触发违规。该表达式直接比对中标通知书与评标报告的核心字段，忽略候选人排序，只要不在名单内即构成违规，前提是存在有效推荐的候选人。
  audit_item: 招标人违法确定中标人
  suspicion: 招标人在推荐中标候选人外确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十条\",\n    \"内容概述\": \"招标人根据评标委员会提出的书面评标报告和推荐的中标候选人确定中标人。招标人也可以授权评标委员会直接确定中标人。\"\n  }\n]"
- expression: (SUM(明细表.用于养老服务支出金额) / SUM(明细表.年度总支出)) < 0.55
  description: 将年度内实际用于养老服务业项目的彩票公益金支出与本年度彩票公益金总支出进行比值计算，低于政策规定的55%（或地方细化的比例标准）即构成比例未达标。若存在未按比例计提或分配的情况，同样适用。
  audit_item: 农村养老服务政策实施不规范、建设质量不达标
  suspicion: 彩票公益金用于养老服务业的比例未达到政策要求
  regulation: "[\n  {\n    \"法规名称\": \"民政部关于进一步规范彩票公益金使用管理的通知\",\n    \"法规文号\": \"民发〔2019〕68号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二项\",\n    \"内容概述\": \"地方各级民政部门留成的公益金，应主要用于老年人福利、残疾人福利、儿童福利、社会公益等方面，其中用于老年人福利方面的资金占比不低于55%。\"\n  }\n]"
- expression: 公示记录 缺失 || (公示记录.公示日期 < 政策清单.政策生效日期)
  description: 政策清单应在补贴申报前主动向社会公开，若未公开公示记录，或公开时间晚于政策生效日期，导致农民未能及时知晓补贴政策，影响其申报权的实现，属于未履行公开公示义务。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 未向社会公布惠农补贴政策清单
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（八）\",\n    \"内容概述\": \"各级财政部门要会同业务主管部门及时向社会公布本地区惠农财政补贴政策清单，明确补贴项目、标准、对象和程序等。\"\n  }\n]"
- expression: (ABS(申报明细表.申报面积 - 实测面积) / 实测面积 > 0.2) || (申报明细表.申报对象身份证号 NOT IN (SELECT DISTINCT 身份证号 FROM 银行流水明细 WHERE 账户类型='农户'))
    || (拨付台账.收款账户 != 申报明细表.对应银行账户) || (发放公示记录 IS NULL)
  description: 当申报面积与国土调查或现场实测面积偏差超过20%，或申报对象身份证号码未在银行流水明细中对应为实际收款人，或补贴资金拨付至非申报对象本人账户，或缺少公示记录，则判定为疑点。20%阈值可根据作物种植合理偏差调整，拨付账户不一致且无合理委托说明即判违规。
  audit_item: 骗取套取涉农财政专项资金
  suspicion: 虚报种植面积或对象冒领涉农补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得……（一）以虚报、冒领等手段骗取财政资金……\"\n\
    \  }\n]"
- expression: (公示记录.公示日期 IS NULL) OR (公示记录.公示方式 NOT IN ('政务公开栏','政府网站','村务公开栏')) OR (公示记录.公示内容 NOT LIKE '%渔船编号%' AND NOT LIKE
    '%补偿金额%') OR (公示记录.公示天数 < 7) OR (群众反馈表.反馈问题数 > 0 AND 公示记录.整改状态 = '未整改')
  description: 无公示日期；公示渠道不符合制度规定；公示内容缺少渔船编号、补偿金额等核心信息；公示天数少于7天；反馈问题未整改到位，满足任一条件即属违规。
  audit_item: 补偿制度落实不到位（渔业）
  suspicion: 补偿信息未公开公示
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十九条、第二十条\",\n    \"内容概述\": \"与群众利益密切相关的补偿资金发放等信息应当主动公开，接受社会监督。\"\n  },\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\"\
    ,\n    \"法规文号\": \"农长渔发〔2019〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条第（四）款\",\n "
- expression: (公示期.公示日期 IS NULL) || (公示期.公示期 < 规定公示天数) || (发放台账中同一地址或关联人员集中大量领取且与村干部名单高度重合) || (处理记录.核实结果 = '属实')
  description: 未进行公示或公示期不足法定天数即违规；通过分析发放台账中受益人地址或关联网格，发现与镇村干部及其亲属关联的异常集中领取，结合投诉举报核实优亲厚友。规定公示天数通常不少于7天。
  audit_item: 未及时足额发放待遇
  suspicion: 救灾物资分配未按规定公示或优亲厚友
  regulation: "[\n  {\n    \"法规名称\": \"自然灾害救助条例\",\n    \"法规文号\": \"国务院令第577号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十六条\",\n    \"内容概述\": \"受灾地区人民政府应当对自然灾害救助款物的管理使用情况进行监督检查，并公示救助对象、救助标准、救助款物的数量和使用情况，接受社会监督。\"\n  }\n]"
