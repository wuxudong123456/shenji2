name: audit/记录留痕类/上报记录
type: model
description: 从记录留痕类类文档（上报记录）中提取结构化元数据。涵盖字段如：报送日期、接收凭证日期。文档范围包括：结余资金清理情况上报记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 凭证
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 上报记录
  member_count: 1
  member_details:
  - 结余资金清理情况上报记录
output:
  fields:
  - name: 报送日期
    type: date
    description: 提取 报送日期 的日期值，格式 YYYY-MM-DD
  - name: 接收凭证日期
    type: date
    description: 提取 接收凭证日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (结余资金确认日期.实际上报日期 > 结余资金确认日期.规定上报截止日期) && (结余资金确认日期.结余金额 > 0)
  description: 将结余资金上缴国库时间节点对照表中的实际上报日期与制度规定的上报截止日期进行比较。当实际上报日期晚于规定截止日期，且对应项目结余金额大于零时，判定为未按规定时限上报。规定时限依据财政部制度，通常为项目终止后或年度终了后30日内。
  audit_item: 结余资金管理不规范
  suspicion: 未按规定时限上报结余资金清理情况
  regulation: "[\n  {\n    \"法规名称\": \"中央部门财政拨款结转和结余资金管理办法\",\n    \"法规文号\": \"财预〔2015〕82号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十四条\",\n    \"内容概述\": \"中央部门应在年度终了后30日内，将本部门财政拨款结转和结余资金清理情况报财政部。项目终止或完成后，应及时清理相应结余资金并按规定上报。\"\n  }\n]"
