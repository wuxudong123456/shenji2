name: audit/记录留痕类/分录记录
type: model
description: 从记录留痕类类文档（分录记录）中提取结构化元数据。涵盖字段如：调整金额、重分类分录。文档范围包括：会计调整分录记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 分录记录
  member_count: 1
  member_details:
  - 会计调整分录记录
output:
  fields:
  - name: 调整金额
    type: number
    description: 提取 调整金额 的数值（含单位，如万元、吨等）
  - name: 重分类分录
    type: string
    description: 提取 重分类分录 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 记账凭证.金额 != 明细分类账.金额
  description: 抽取的记账凭证金额与账簿中过账金额不一致，且无有效的会计调整分录更正说明，即为账证不符。任何凭证金额与过账金额的差异均触发疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 记账凭证金额与账簿记录金额不一致
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计凭证进行核对，保证会计账簿记录与会计凭证的有关内容相符。\"\n  }\n]"
- expression: 资产负债表.固定资产净值 != (分类账.固定资产科目余额 - 分类账.累计折旧科目余额)
  description: 资产负债表固定资产项目应按扣除累计折旧及减值准备后的净额列示，与总账直接计算的结果不相等，则表明存在少提折旧、重分类错误或资产虚报。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 资产负债表固定资产项目金额与总账余额不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计报表进行核对，保证会计账簿记录与会计报表的有关内容相符。\"\n  }\n]"
