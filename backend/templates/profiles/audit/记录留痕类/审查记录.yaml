name: audit/记录留痕类/审查记录
type: model
description: 从记录留痕类类文档（审查记录）中提取结构化元数据。涵盖字段如：企业名称、取水许可证号、实际办公地址、审批日期、审批状态、审查人员签字、审查条款号、广告内容。文档范围包括：入驻企业资质审查记录、市场监管部门广告审查记录、强制性标准条文执行审查记录、机井合规性审查记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 审批
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 审查记录
  member_count: 1
  member_details:
  - 入驻企业资质审查记录
  - 市场监管部门广告审查记录
  - 强制性标准条文执行审查记录
  - 机井合规性审查记录
output:
  fields:
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 取水许可证号
    type: string
    description: 提取 取水许可证号 的文本值
  - name: 实际办公地址
    type: string
    description: 提取 实际办公地址 的文本值
  - name: 审批日期
    type: date
    description: 提取 审批日期 的日期值，格式 YYYY-MM-DD
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
  - name: 审查人员签字
    type: string
    description: 提取 审查人员签字 的文本值
  - name: 审查条款号
    type: number
    description: 提取 审查条款号 的数值（含单位，如万元、吨等）
  - name: 广告内容
    type: string
    description: 提取 广告内容 的文本值
  - name: 机井编号
    type: string
    description: 提取 机井编号 的文本值
  - name: 水利部门取水许可审批意见
    type: string
    description: 提取 水利部门取水许可审批意见 的文本值
  - name: 注册地址
    type: string
    description: 提取 注册地址 的文本值
  - name: 环评批复文号
    type: string
    description: 提取 环评批复文号 的文本值
  - name: 用地批准文号
    type: string
    description: 提取 用地批准文号 的文本值
  - name: 社保缴纳人数
    type: number
    description: 提取 社保缴纳人数 的数值（含单位，如万元、吨等）
  - name: 符合性结论
    type: string
    description: 提取 符合性结论 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (设计文件.设计参数（如荷载、防火等级） 不符合 强制性标准对应阈值) && (合格证书.审查结论 == '合格') || (审查记录.符合性结论 == '不符合' && 通知单.批准日期 > 合格证书.签发日期)
  description: 比对设计图纸中的关键参数是否违反工程建设强制性标准中规定的限值（如结构安全系数、消防通道宽度等）。若图纸审查记录显示符合标准，但实际参数不符，或审查发现不符合项但未经正式设计变更即通过审查，均为可疑。
  audit_item: 工程质量事故调查
  suspicion: 设计文件违反工程建设强制性标准
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号（2019年修正）\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第十条\",\n    \"内容概述\": \"建设工程发包单位不得迫使承包方以低于成本的价格竞标，不得任意压缩合理工期。建设单位不得明示或者暗示设计单位或者施工单位违反工程建设强制性标准，降低建设工程质量。\"\
    \n  },\n  {\n    \"法规名称\": \"实施工程建设强制性标准监督规定\",\n    \"法规文号\": \"建设部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二条、第"
- expression: 机井通电工程布局表.实施区域坐标 WITHIN 地下水禁采区划定范围.禁采区边界坐标 AND 机井通电工程布局表.通电状态 == '已通电' AND 机井合规性审查记录.水利部门取水许可审批意见 != '批准'
  description: 机井的坐标落在禁采区多边形内，且已通电，同时水利部门未出具批准取水许可或明确否决，即构成违规。如水利部门已批准但在禁采区划定后仍实施，需结合审批日期和禁采区生效日期判断。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 在地下水禁采区布局机井通电工程
  regulation: "[\n  {\n    \"法规名称\": \"地下水管理条例\",\n    \"法规文号\": \"国务院令第748号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十五条\",\n    \"内容概述\": \"禁止在地下水禁采区开凿新的取水井，不得新增地下水取水量。\"\n  },\n  {\n    \"法规名称\": \"取水许可和水资源费征收管理条例\",\n    \"法规文号\"\
    : \"国务院令第460号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二条、第六条\",\n    \"内容概述\": \"直接从地下取水的单位和个人应当申领取水许可证，禁采区内原则上不予批准。\"\
    \n  }\n]"
- expression: 已通电机井清单.机井编号 = 机井合规性审查记录.机井编号 AND (机井合规性审查记录.取水许可证号 IS NULL OR 机井合规性审查记录.环评批复文号 IS NULL OR 机井合规性审查记录.用地批准文号
    IS NULL) AND 已通电机井清单.通电日期 >= '2020-01-01'
  description: 以机井编号关联，已通电的机井在合规性审查记录中缺少取水许可证、环评批复或用地批准任一法定手续，视为未通过合法合规性审查即通电。通电日期限制在2020年后，以聚焦近年新建项目，可根据实际政策生效时间调整。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 向未通过合法合规性审查的机井通电
  regulation: "[\n  {\n    \"法规名称\": \"取水许可和水资源费征收管理条例\",\n    \"法规文号\": \"国务院令第460号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二条、第三条\",\n    \"内容概述\": \"利用取水工程直接取用地下水的，必须申领取水许可证。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\"\
    : \"中华人民共和国主席令第24号（2018修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\": \"建设对环境有影响的项目，应当编制环境影响报告书或报告表，未"
- expression: (申报面积、入驻企业清单、孵化功能说明.申报面积 < 对照表.最低面积) OR (申报面积、入驻企业清单、孵化功能说明.入驻企业清单.企业总数 < 对照表.最低入驻企业数) OR ( (COUNT(申报面积、入驻企业清单、孵化功能说明.入驻企业清单.企业名称)
    - COUNT(入驻企业工商状态正常且社保缴纳人数>0)) / COUNT(申报面积、入驻企业清单、孵化功能说明.入驻企业清单.企业名称) > 0.2 ) OR (声明.关联企业名称 = True) OR (载体已获得补贴 AND 申报面积、入驻企业清单、孵化功能说明.认定评审得分
    < 合格线)
  description: 触发条件：申报面积或入驻企业数不达标；入驻企业清单中超过20%为虚假空壳企业（工商异常或无社保缴纳）；评审专家与载体股东存在关联关系；在未达到认定标准的情况下已获取补贴资金。满足任一条件视为违规。
  audit_item: 创业载体政策执行不到位
  suspicion: 违规认定创业载体骗取政策补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"各地应严格按规定范围、标准和程序使用就业补助资金，不得擅自扩大支出范围、提高支出标准，不得用于与就业创业无关的支出，确保资金安全规范有效使用。\"\n  },\n  {\n \
    \   \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"\
    内容概述\": \"国"
- expression: (监测清单.内容 CONTAINS ('长江野生' OR '野生江鲜' OR '江鱼')) AND (监测清单.涉事主体 NOT IN (SELECT 企业名称 FROM 档案 WHERE 许可证类型 = '捕捞许可证')
    OR 登记表.来源证明 IS NULL)
  description: 1. 在宣传中使用‘长江野生’等明示或暗示来自长江野生鱼类的用语，若无法提供有效捕捞许可证或渔获物来源证明，视为虚假宣传；2. 即使持有许可，但采购记录中无对应合法野生鱼来源证明的，同样构成虚假宣传。
  audit_item: 违法捕捞售卖长江流域水生生物
  suspicion: 以“长江野生鱼”等为噱头作虚假宣传
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国长江保护法\",\n    \"法规文号\": \"中华人民共和国主席令第65号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十四条\",\n    \"内容概述\": \"餐饮经营者不得以‘长江野生鱼’‘野生江鲜’等为噱头，误导消费者。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国广告法\",\n    \"法规文号\"\
    : \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"广告不得含有虚假或者引人误解的内容，不得欺骗、误导消费者"
