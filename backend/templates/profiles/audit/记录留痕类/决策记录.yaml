name: audit/记录留痕类/决策记录
type: model
description: 从记录留痕类类文档（决策记录）中提取结构化元数据。涵盖字段如：关于费用分摊的讨论内容、决策事项、决策日期、决议内容、决议意见、批复日期、技术参数、涉及资格条件。文档范围包括：会议纪要或决策记录、内部会议纪要或决策记录、相关会议纪要或管理层决策记录、项目立项决策记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 决策记录
  member_count: 1
  member_details:
  - 会议纪要或决策记录
  - 内部会议纪要或决策记录
  - 相关会议纪要或管理层决策记录
  - 项目立项决策记录
output:
  fields:
  - name: 关于费用分摊的讨论内容
    type: number
    description: 提取 关于费用分摊的讨论内容 的数值（含单位，如万元、吨等）
  - name: 决策事项
    type: string
    description: 提取 决策事项 的文本值
  - name: 决策日期
    type: date
    description: 提取 决策日期 的日期值，格式 YYYY-MM-DD
  - name: 决议内容
    type: string
    description: 提取 决议内容 的文本值
  - name: 决议意见
    type: string
    description: 提取 决议意见 的文本值
  - name: 批复日期
    type: date
    description: 提取 批复日期 的日期值，格式 YYYY-MM-DD
  - name: 技术参数
    type: string
    description: 提取 技术参数 的文本值
  - name: 涉及资格条件
    type: string
    description: 提取 涉及资格条件 的文本值
  - name: 评分标准的限制性条款
    type: number
    description: 提取 评分标准的限制性条款 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目总投资额
    type: string
    description: 提取 项目总投资额 的文本值
  - name: 项目行业类别
    type: string
    description: 提取 项目行业类别 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (技术参数明细.技术参数明细 = 空 OR 技术参数明细.技术参数明细 仅包含‘符合行业标准’‘满足使用需求’等模糊措辞 OR 技术参数明细.技术参数明细 未包含任何具体数值和计量单位) || (评审因素与评审标准（含价格分计算公式）.评审因素与评审标准（含价格分计算公式）
    = 空 OR 评审因素与评审标准（含价格分计算公式）.评审因素与评审标准（含价格分计算公式） 未公开价格分权重、评分公式等任一客观量化标准) || (涉及资格条件、技术参数、评分标准的限制性条款.涉及资格条件、技术参数、评分标准的限制性条款
    = 是 AND 采购文件.对应条款公开 = 否)
  description: 技术参数明细为空或仅含模糊表述，即属于未依法公开具体技术标准；评审标准中如未完整披露价格分计算细节、权重分配等，视为未公开评审标准；通过比对内部决策文件与公开采购文件，发现存在倾向性条款但未在公开文件中载明的，认定为隐匿采购标准。以上任一条件满足即触发疑点。
  audit_item: 未公开政府采购标准和采购结果
  suspicion: 采购人未依法公布政府采购项目的采购标准
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"招标文件应当包括采购项目的商务条件、采购需求、投标人的资格条件、投标报价要求、评标方法、评标标准以及拟签订的合同文本等，采购标准未在招标文件中全面载明即属违法。\"\n\
    \  }\n]"
- expression: ( (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='施工' && 估算价>=4000000) || (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='货物'
    && 估算价>=2000000) || (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='服务' && 估算价>=1000000) ) && (公告.公告类型（公开/邀请） != '公开招标') && (变更申请记录
    IS NULL || 变更申请记录.批复意见 != '同意' || 变更申请记录.批复日期 > 公告.发布日期)
  description: 依据资金来源性质与估算价判定项目是否属于依法必须公开招标范畴，同时排除实际招标方式为非公开，且无合法审批变更手续的情形。若变更批复缺失、批复意见不明确或批复时间晚于招标活动开始，均视为违规。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 未经批准擅自将公开招标变更为邀请招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n  \
    \  \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"国有资金占控股或者主导地位的依法必须进行招标的项目，应当公开招标；除技术"
- expression: 收费明细表.收费项目名称 CONTAINS ('建设费','升级费','数据迁移费','系统分摊费') && (电子政务平台运维专项经费预算金额对照表.电子政务平台建设及运维专项拨款金额 >= 年度运维成本总额.年度运维成本总额
    OR 关于费用分摊的讨论内容决议意见.决议意见 包含 '转嫁企业' OR 收费管理制度.条款 提及 '企业分摊') && 收费明细表.金额 > 0
  description: 当存在以系统建设费、升级费、分摊费等名义向企业收费时，若财政已拨付足够的建设运维专项资金，或在内部决策文件中明确提到将财政应承担的费用转嫁给企业分摊，则构成违规。无论财政是否足额拨款，无政策依据的分摊行为均属违规。
  audit_item: 违规收费-要求企业承担电子政务平台技术维护费、服务费、电子介质成本费等经营服务性费用
  suspicion: 转移财政应承担费用
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委 财政部关于清理规范电子政务平台收费有关问题的通知\",\n    \"法规文号\": \"发改价格〔2011〕2352号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"全文\",\n    \"内容概述\": \"电子政务平台的建设和运行维护费用应纳入同级财政预算予以保障，不得以任何形式转嫁给企业或个人。\"\n  },\n  {\n    \"\
    法规名称\": \"预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第五十三条\",\n    \"内容概述\": \"\
    各部门、各单位"
