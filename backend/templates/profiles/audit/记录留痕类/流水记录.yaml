name: audit/记录留痕类/流水记录
type: model
description: 从记录留痕类类文档（流水记录）中提取结构化元数据。涵盖字段如：交易对手、交易对方、交易对方名称、交易摘要、交易日期、交易时间、交易流水号、交易金额。文档范围包括：债券资金专项账户流水记录、电子支付平台流水记录、资金流水记录、银行流水记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 付款
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 流水记录
  member_count: 1
  member_details:
  - 债券资金专项账户流水记录
  - 电子支付平台流水记录
  - 资金流水记录
  - 银行流水记录
output:
  fields:
  - name: 交易对手
    type: string
    description: 提取 交易对手 的文本值
  - name: 交易对方
    type: string
    description: 提取 交易对方 的文本值
  - name: 交易对方名称
    type: string
    description: 提取 交易对方名称 的文本值
  - name: 交易摘要
    type: string
    description: 提取 交易摘要 的文本值
  - name: 交易日期
    type: date
    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 交易时间
    type: date
    description: 提取 交易时间 的日期值，格式 YYYY-MM-DD
  - name: 交易流水号
    type: string
    description: 提取 交易流水号 的文本值
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款日期
    type: date
    description: 提取 付款日期 的日期值，格式 YYYY-MM-DD
  - name: 付款金额
    type: number
    description: 提取 付款金额 的数值（含单位，如万元、吨等）
  - name: 借贷标志
    type: boolean
    description: 提取 借贷标志 的布尔值（是/否）
  - name: 备注信息
    type: string
    description: 提取 备注信息 的文本值
  - name: 对方户名
    type: string
    description: 提取 对方户名 的文本值
  - name: 总包账户向个人账户的大额转账记录
    type: string
    description: 提取 总包账户向个人账户的大额转账记录 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 收款人姓名
    type: number
    description: 提取 收款人姓名 的数值（含单位，如万元、吨等）
  - name: 收款方
    type: number
    description: 提取 收款方 的数值（含单位，如万元、吨等）
  - name: 用途备注
    type: string
    description: 提取 用途备注 的文本值
  - name: 用途摘要
    type: string
    description: 提取 用途摘要 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (费用报销原始凭证.收款单位名称 IN (外部利益关系单位合作协议.合作方名称)) AND (费用报销原始凭证.报销事项摘要 LIKE '%个人%' OR 费用报销原始凭证.金额异常偏高) OR (个人费用转嫁核查对照表.是否确认转嫁
    = TRUE) OR (外部利益关系单位合作协议.合同金额 - 市场评估价 > 外部利益关系单位合作协议.合同金额*0.3 AND 存在资金回流)
  description: 筛查企业向外部利益关系单位支付的费用是否实际用于报销领导人员个人消费。通过比对收款单位与外部关系单位清单，发现异常报销；若转嫁核查表直接确认转嫁，即违规；合作合同溢价超过市场价30%且伴随资金回流，可识别隐蔽转嫁。
  audit_item: 其他违反中央八项规定及其实施细则精神问题
  suspicion: 向外部利益关系单位转嫁应由个人承担的费用
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第五条\",\n    \"内容概述\": \"国有企业领导人员应当忠实履行职责，不得利用职权谋取私利。不得将企业经济往来中的折扣费、中介费、佣金、礼金据为己有，不得利用职务之便为他人谋取利益，其配偶、子女和其他特定关系人收受对方财物。\"\
    \n  }\n]"
- expression: (电子支付平台流水记录.交易对方 IN 外部利益关系单位清单) && (电子支付平台流水记录.备注信息 LIKE '%红包%' OR 电子支付平台流水记录.备注信息 LIKE '%礼金%' OR 电子支付平台流水记录.备注信息
    LIKE '%节日%' OR 电子支付平台流水记录.备注信息 LIKE '%感谢%') && (电子支付平台流水记录.交易对方名称 NOT IN 礼品礼金登记管理制度.已登记礼品礼金清单) && (电子支付平台流水记录.交易金额 > 200)
    || (礼品收受登记台账.登记状态 = '未登记' && 礼品收受登记台账.金额或价值 > 200)
  description: 筛查从外部利益关系单位转入领导人员或其亲属账户的电子红包、转账，与礼品礼金登记记录比对。凡单笔或累计额超过合理小额礼尚往来上限（设定为200元）且未按规定登记上交的，即构成违规。重大节假日密集高频小额红包需累加计算。
  audit_item: 其他违反中央八项规定及其实施细则精神问题
  suspicion: 收受外部单位电子红包或礼品礼金未登记上交
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中共中央印发（2018年修订）\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第八十八条\",\n    \"内容概述\": \"收受可能影响公正执行公务的礼品、礼金、消费卡和有价证券、股权、其他金融产品等财物，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。\"\
    \n  }\n]"
- expression: (财务报表.未分配利润期末 > 财务报表.未分配利润期初 AND 收益分配明细表.分红总额 = 0) OR (兑现台账.应分红金额 != 兑现台账.实际发放金额) OR (兑现台账.实际发放金额 > 0 AND 银行流水.金额合计
    != 兑现台账.实际发放金额) OR (兑现台账.发放日期逾期 > 30天 AND 收益分配方案规定发放期限)
  description: 连续有可分配收益但未分红（以未分配利润增加且分红为零为标志），或应分未足额分配，或发放记录与银行流水不匹配，或发放时间严重逾期，均表明收益分配权未得到有效保障。逾期阈值可根据方案中的约定发放日确定。
  audit_item: 集体经营性资产产权制度改革不到位
  suspicion: 农民集体资产股份收益分配权未得到保障
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四部分第（五）条及第（六）条\",\n    \"内容概述\": \"保障农民集体资产股份权利。组织实施好赋予农民对集体资产股份的占有、收益、有偿退出及抵押、担保、继承权等权能改革试点。\"\n \
    \ }\n]"
