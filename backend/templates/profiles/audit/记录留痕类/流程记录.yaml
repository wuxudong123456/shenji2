name: audit/记录留痕类/流程记录
type: model
description: 从记录留痕类类文档（流程记录）中提取结构化元数据。涵盖字段如：保证金收取审批意见、合同编号、地块编号、定向出让批示、审批人、审批人签字、审批意见、审批日期。文档范围包括：专项资金使用审批流程记录、会议审批流程记录、住房公积金提取及贷款流程记录、内部审批流程记录、合同审批流程记录(OA)、土地出让审批流程记录、担保业务内部审批流程记录、担保业务审批流程记录、接待审批单的审批流程记录、经办人员操作权限审批流程记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 会议
- 合同
- 审批
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 流程记录
  member_count: 1
  member_details:
  - 专项资金使用审批流程记录
  - 会议审批流程记录
  - 住房公积金提取及贷款流程记录
  - 内部审批流程记录
  - 合同审批流程记录(OA)
  - 土地出让审批流程记录
  - 担保业务内部审批流程记录
  - 担保业务审批流程记录
  - 接待审批单的审批流程记录
  - 经办人员操作权限审批流程记录
output:
  fields:
  - name: 保证金收取审批意见
    type: string
    description: 提取 保证金收取审批意见 的文本值
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 定向出让批示
    type: string
    description: 提取 定向出让批示 的文本值
  - name: 审批人
    type: string
    description: 提取 审批人 的文本值
  - name: 审批人签字
    type: string
    description: 提取 审批人签字 的文本值
  - name: 审批意见
    type: string
    description: 提取 审批意见 的文本值
  - name: 审批日期
    type: date
    description: 提取 审批日期 的日期值，格式 YYYY-MM-DD
  - name: 审批时间
    type: date
    description: 提取 审批时间 的日期值，格式 YYYY-MM-DD
  - name: 审批用途
    type: string
    description: 提取 审批用途 的文本值
  - name: 审批签批日期
    type: date
    description: 提取 审批签批日期 的日期值，格式 YYYY-MM-DD
  - name: 审批结果
    type: boolean
    description: 提取 审批结果 的布尔值（是/否）
  - name: 审批节点
    type: string
    description: 提取 审批节点 的文本值
  - name: 审批节点配置
    type: string
    description: 提取 审批节点配置 的文本值
  - name: 审批金额
    type: number
    description: 提取 审批金额 的数值（含单位，如万元、吨等）
  - name: 审核人
    type: string
    description: 提取 审核人 的文本值
  - name: 审核人签字
    type: string
    description: 提取 审核人签字 的文本值
  - name: 审核意见
    type: string
    description: 提取 审核意见 的文本值
  - name: 批准会议天数
    type: number
    description: 提取 批准会议天数 的数值（含单位，如万元、吨等）
  - name: 批准参会人员名单
    type: string
    description: 提取 批准参会人员名单 的文本值
  - name: 批准参会人数
    type: number
    description: 提取 批准参会人数 的数值（含单位，如万元、吨等）
  - name: 批准日期
    type: date
    description: 提取 批准日期 的日期值，格式 YYYY-MM-DD
  - name: 接待事由
    type: string
    description: 提取 接待事由 的文本值
  - name: 流程结束时间
    type: date
