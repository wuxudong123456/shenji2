  - name: 超预算审批记录
    type: number
    description: 提取 超预算审批记录 的数值（含单位，如万元、吨等）
  - name: 退还审批时间
    type: date
    description: 提取 退还审批时间 的日期值，格式 YYYY-MM-DD
  - name: 附件核验记录
    type: string
    description: 提取 附件核验记录 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: SUM(合计实际支出) > 批准预算总额
  description: 将会议所有实际支出加总，与批复的预算总额对比，超出即判定为超预算。若超预算但存在合规的超预算审批文件，可豁免；否则构成违规。
  audit_item: 超标准举办会议
  suspicion: 会议费实际支出超出批复预算
  regulation: "[\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十二条\",\n    \"内容概述\": \"各单位应严格执行会议费预算，对未列入年度会议计划和预算的会议，不得报销费用。\"\n  }\n]"
- expression: 时间记录.实际会期起止 < 超预算审批记录.审批签批日期 || 审批记录缺失
  description: 会议正式开始日期早于审批单上最后签批日期的，视为先实施后审批；若无法提供任何审批记录，则属于未经审批擅自举办会议，同样违规。
  audit_item: 超标准举办会议
  suspicion: 会议未经适当审批或先实施后补批
  regulation: "[\n  {\n    \"法规名称\": \"《党政机关厉行节约反对浪费条例》\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"会议等公务活动应当严格执行审批程序，从严控制。\"\n  }\n]"
- expression: (明细表.实际总支出金额 > 批复文件.批准总预算金额) && (流程记录.超预算审批记录 == null || 流程记录.超预算审批记录 < (明细表.实际总支出金额 - 批复文件.批准总预算金额))
  description: 实际总支出超出批准预算且无有效超预算审批，或审批额度不足以覆盖超出部分即判定为违规。超出比例≥10%为严重，5%-10%为一般
  audit_item: 超标准举办会议
  suspicion: 超预算举办会议
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"各单位会议费预算要细化到具体会议项目，执行中不得突破。会议费支付应当严格按照国库集中支付制度和公务卡管理制度的有关规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\
    \n  }\n]"
- expression: 实际签到人数.实际签到人数 > 超预算审批记录.批准参会人数
  description: 实际签到人数大于批准人数即构成超人数举办会议。超员比例≥20%为严重，10%-20%为一般。注意剔除临时旁听等合理情况。
  audit_item: 超标准举办会议
  suspicion: 实际参会人数超出批准人数
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条\",\n    \"内容概述\": \"各单位应当严格控制会议数量、会期和参会人员规模，会议工作人员控制在会议代表人数的10%以内。\"\n  }\n]"
- expression: 情况记录.实际会期天数 > 超预算审批记录.批准会议天数
  description: 实际会期超出批准天数即视为违规，包含提前报到、延期离会或延长议程。超出天数≥1天需重点关注，如有组织旅游等非会议活动则加重定性。
  audit_item: 超标准举办会议
  suspicion: 会议实际天数超出批准天数
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十条\",\n    \"内容概述\": \"严禁超出规定时限开会，不得组织与会议无关的参观、游览等活动。\"\n  }\n]"
- expression: 报销凭证.报销人员名单 NOT IN (实际签到人数.签到人员姓名) AND 报销凭证.报销人员名单 出现在批准名单中但未签到
  description: 有姓名出现在报销单中但签到表无对应记录，或签到时间明显异常（如一笔签名），即判定为虚列人员套取经费。结合请假记录可排除合理未签到。
  audit_item: 超标准举办会议
  suspicion: 虚列参会人员套取会议经费
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"会计凭证、会计帐簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定。不得伪造、变造会计凭证、会计帐簿及其它会计资料，不得提供虚假的财务会计报告。\"\n  }\n]"
- expression: (资质条件设置与政策要求对比表.违规类型 == '量身定制排他条款') && (信息表[地块编号].竞买人数量 == 1) && (流程记录[地块编号].定向出让批示 == '是' || 竞得单位提前介入土地规划 ==
    '是')
  description: 当资质条款与特定竞买人高度吻合，导致仅有一家符合条件，且存在会议纪要或批示显示定向出让意图，或竞得企业提前参与规划，判定为排他性条款违规。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 量身定制排他性条款
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让人在招标拍卖挂牌出让公告中不得设定影响公平、公正竞争的限制条件，禁止为特定竞买人量身定制条件。\"\n  },\n  {\n    \"法规名称\": \"\
    关于落实工业用地招标拍卖挂牌出让制度有关问题的通知\",\n    \"法规文号\": \"国土资发〔2007〕78号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"\
    内容概述\": \""
- expression: 存在担保合同.合同编号，且（无对应的董事会/股东大会决议记录）或（决议担保事项清单、决议金额、决议日期、出席董事/股东签名.决议日期晚于合同签订日期）或（决议担保事项清单、决议金额、决议日期、出席董事/股东签名.决议金额小于担保合同.担保金额）或（审批节点、审批人、审批意见、审批时间.审批人权限不符合担保审批权限规定（金额阈值、审批层级）.审批层级）
  description: 担保合同若无对应的决议记录；或决议签署日期晚于合同签订日期（先签合同后补程序）；或决议批准的担保金额无法覆盖合同金额；或最终审批人未达到制度规定的权限级别，均触发疑点。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 担保事项未履行董事会或股东大会审批程序
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\",\n\
    \    \"内容概述\": \"公司向其他企业投资或者为他人提供担保，依照公司章程的规定，由董事会或者股东会、股东大会决议；公司章程对投资或者担保的总额及单项投资或者担保的数额有限额规定的，不得超过规定的限额。\"\n  },\n \
    \ {\n    \"法规名称\": \"企业内部控制应用指引第12号——担保业务\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第四条\",\n \
    \   \"内容概述\""
- expression: (流水.交易金额 > 拨付文件.拨付金额*0.1 && 流水.对方账户名称 NOT IN 项目合同供应商名录 && 流水.摘要 IN [‘工资’, ‘办公费’, ‘差旅费’]) || (验收报告.实际支出金额 !=
    拨付文件.资金用途 && 无合规审批记录)
  description: 专项资金拨付后，若单笔或累计转出金额超过拨付金额的10%且收款方为非项目合同供应商，或支付摘要为人工、办公等非项目支出，同时缺少合法的变更审批，即判定存在挤占挪用。结合验收报告，若项目未按计划建设或支出与预算严重不符，进一步确认为挪用。
  audit_item: 财政资金申报、使用等方面存在的问题
  suspicion: 挤占挪用财政专项资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第二项\",\n    \"内容概述\": \"截留、挪用财政资金的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得，对单位给予警告或者通报批评。\"\n  }\n]"
- expression: 流水.资金用途摘要（投资款/分红/经营收入） IN [‘装修’,‘办公家具’,‘差旅费’,‘招待费’] && 拨付文件.资金用途 IN [‘污染防治’,‘技术改造’,‘研发’] && 流水.交易金额 > 0 && 流程记录.审批用途
    != 拨付文件.限定支出范围
  description: 当特定用途专项资金（如污染防治）的支付凭证中出现装修、办公等与预算完全无关的摘要，且审批记录未能体现合规变更，即判定未按规定用途使用，直接触犯资金使用负面清单。
  audit_item: 财政资金申报、使用等方面存在的问题
  suspicion: 违规使用专项用途财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第四项\",\n    \"内容概述\": \"违反规定扩大开支范围，提高开支标准的，责令改正，调整有关会计账目，追回有关财政资金。\"\n  }\n]"
- expression: (销售合同登记台账.合同金额 > 制度规定法务审核门槛 AND 销售合同登记台账.是否法务审核='否') || (销售合同登记台账.签署日期 < 合同审批流程记录.审批完成时间) || (销售合同登记台账.签署人 NOT
    IN (有权签署人列表)) || (合同文本关键条款与标准模板差异条目数 > 0 AND 无特殊条款审批记录)
  description: 合同金额达到须法务审核条件而未审核、签署时间早于审批完成时间、签署人无授权、关键条款改动未经审批，任一条件满足即构成违规。
  audit_item: 销售业务管理方面存在的问题
  suspicion: 未按内部规定签署销售合同
  regulation: "[\n  {\n    \"法规名称\": \"企业内部控制应用指引第16号——合同管理\",\n    \"法规文号\": \"财会〔2010〕11号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十二条\",\n    \"内容概述\": \"企业应当按照规定的权限和程序与对方当事人签署合同。正式对外订立的合同，应当由企业法定代表人或其授权代理人签名并加盖企业公章或合同专用章。\"\n  }\n\
    ]"
- expression: (贷款保证金收取退还台账.保证金收取金额 > 0) && ( (与房地产开发企业签订的按揭合作协议.约定保证金比例 IS NULL) || (与房地产开发企业签订的按揭合作协议.约定保证金比例 == 0) || (与房地产开发企业签订的按揭合作协议.合作楼盘名称
    IS NULL) ) || (贷款保证金收取退还台账.保证金收取金额 / 贷款保证金收取退还台账.贷款金额 > 与房地产开发企业签订的按揭合作协议.约定保证金比例) || (贷款保证金收取退还台账.未退余额 > 0 && (当前日期 -
    贷款保证金收取退还台账.约定退还日期) > 0)
  description: 筛查三类违规：1.无合同依据或合同未约定保证金却实际收取；2.收取金额超过合同约定比例上限；3.贷款结清后超过约定退还日期仍未退还保证金。设定阈值：收取比例上限以合同为准，无约定则视为禁止收取；超期退还判定以约定日期为红线，当前日期大于约定退还日期且余额大于零即触发。
  audit_item: 住房公积金管理机构违规收取费用
  suspicion: 违规向房地产开发企业收取贷款保证金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十条\",\n    \"内容概述\": \"住房公积金管理中心的管理费用，由住房公积金管理中心按照规定的标准编制全年预算支出总额，报本级人民政府财政部门批准后，从住房公积金增值收益中上交本级财政，由本级财政拨付。住房公积金管理中心不得向管理对象收取任何费用。\"\
    \n  },\n  {\n    \"法规名称\": \"关于发展住房公积金个人住房贷款业务的通知\",\n    \"法规文号\": \"建金[2014]148号\",\n    \"效力级别\""
- expression: (业务台账.借款人类型 = '单位' OR 业务台账.贷款用途 NOT IN ('购买自住住房','建造','翻建','大修自住住房')) AND (业务台账.担保方式 != '抵押' OR 业务台账.抵押登记证明编号
    IS NULL) AND 流程记录.审批意见 = '已批准'
  description: 公积金贷款对象仅限于个人缴存职工且用于特定住房消费，不得向企业或无缴存记录的个人发放；同时贷款必须落实抵押担保手续。表达式筛选出借款人为单位或贷款用途不合规且未办理抵押的贷款记录。
  audit_item: 挪用住房公积金
  suspicion: 违规以委托贷款等形式向非公积金缴存人出借资金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第五条\",\n    \"内容概述\": \"住房公积金应当用于职工购买、建造、翻建、大修自住住房，任何单位和个人不得挪作他用。\"\n  },\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\"\
    : \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十一条\",\n    \"内容概述\": \"挪用住房公积金的，追回挪用的住房公积金；有违法所得的，没收违法所得；构成犯罪"
- expression: (支出事由 LIKE '%采购%' OR 支出事由 LIKE '%工程%' OR 支出事由 LIKE '%设备%') AND (流程记录.验收记录 IS NULL OR 发票验真结果 = '虚假' OR ABS(流程记录.合同金额
    - 发票金额) / 流程记录.合同金额 > 0.05) AND 收款方与供应商名称一致
  description: 筛选因采购或工程发生的公积金支出，但合同未验收、发票虚假或金额偏差超5%的记录，识别虚构交易套取资金。
  audit_item: 挪用住房公积金
  suspicion: 虚构采购合同套取住房公积金资金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十一条\",\n    \"内容概述\": \"挪用住房公积金的，追回挪用的住房公积金；有违法所得的，没收违法所得；构成犯罪的，依法追究刑事责任；尚不构成犯罪的，给予行政处分。\"\n  }\n]"
- expression: (业务台账.担保人名称 NOT IN (名录.机构名称)) || (执照.有效期 < 业务台账.担保日期) || (执照.许可范围 NOT LIKE '%住房公积金贷款担保%')
  description: 担保机构未在住房公积金管理中心备案合作名录中，或资质证书已过期，或许可范围未明确包含住房公积金贷款担保业务，任意条件满足即判定为无资质违规经营。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 无担保资质违规开展公积金贷款担保业务
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"设立融资担保公司，应当经监督管理部门批准。未经监督管理部门批准，任何单位和个人不得经营融资担保业务。\"\n  }\n]"
- expression: (发放明细表.身份证号/统一社会信用代码 NOT IN (SELECT 身份证号 FROM 核验记录 WHERE 社保缴纳状态='中断')) || (发放明细表.身份证号/统一社会信用代码 NOT IN (SELECT
    身份证号 FROM 核验记录 WHERE 失业登记有效状态='有效')) || (发放明细表.身份证号/统一社会信用代码 IN (SELECT 统一社会信用代码 FROM 结果 WHERE 企业注销/吊销/经营异常状态 IN ('注销','吊销')))
    || (申请材料.低保证/残疾证等==1)
  description: 违规判定逻辑：发放对象若未在社保系统中显示为中断缴费状态、未在失业登记数据库中处于有效状态、企业已被注销/吊销，或者申请时缺失失业证明、低保证等关键证明，即触发违规预警。多个条件为或关系，满足任意一项即为疑点。
  audit_item: 违规发放资金或补贴
  suspicion: 违规向不符合条件对象发放就业补助资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国就业促进法\",\n    \"法规文号\": \"中华人民共和国主席令第七十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十五条、第四十九条\",\n    \"内容概述\": \"国家实行有利于促进就业的财政政策，就业专项资金必须专款专用，不得挤占挪用；各级人民政府应规范就业专项资金的使用管理，确保资金用于符合条件的补贴对象。\"\n  },\n\
    \  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条、第十七条\""
- expression: (发放台账.营业执照注册日期 - 工商注册日期 < 730天) || (发放台账.统一社会信用代码 IN (SELECT 统一社会信用代码 FROM 工商系统 WHERE 经营范围表是否为首次创业='否')) ||
    (银行流水.资金用途显示为购房、证券投资等非经营交易)
  description: 以贷款申请时间与企业注册时间差是否小于2年（730天）判断是否满足首次创业条件；通过工商系统查证同一主体或关联方是否已有注册企业，排除非首次创业；追踪贴息贷款资金银行流水，若资金转入房地产公司、证券公司等非经营类账户，则表明资金用途违规。满足任意条件即发贴息违规疑点。
  audit_item: 违规发放资金或补贴
  suspicion: 违规向不符合条件对象发放创业担保贷款财政贴息
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加大创业担保贷款贴息力度全力支持重点群体创业就业的通知\",\n    \"法规文号\": \"财金〔2020〕21号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第一条、第五条\",\n    \"内容概述\": \"创业担保贷款贴息对象必须是首次创业或符合特定条件的群体，贷款必须用于生产经营，不得用于偿还债务、金融投资等非创业项目。\"\n\
    \  },\n  {\n    \"法规名称\": \"普惠金融发展专项资金管理办法\",\n    \"法规文号\": \"财金〔2019〕96号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第十六条\""
