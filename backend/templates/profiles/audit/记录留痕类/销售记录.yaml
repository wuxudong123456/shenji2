name: audit/记录留痕类/销售记录
type: model
description: 从记录留痕类类文档（销售记录）中提取结构化元数据。涵盖字段如：养殖场名称、同类产品最近售价、环比变化率、销售单价、销售数量、销售日期、销售点、销量。文档范围包括：投放终端销售记录、销售记录、饲料销售记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 采购
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 销售记录
  member_count: 1
  member_details:
  - 投放终端销售记录
  - 销售记录
  - 饲料销售记录
output:
  fields:
  - name: 养殖场名称
    type: string
    description: 提取 养殖场名称 的文本值
  - name: 同类产品最近售价
    type: string
    description: 提取 同类产品最近售价 的文本值
  - name: 环比变化率
    type: string
    description: 提取 环比变化率 的文本值
  - name: 销售单价
    type: number
    description: 提取 销售单价 的数值（含单位，如万元、吨等）
  - name: 销售数量
    type: number
    description: 提取 销售数量 的数值（含单位，如万元、吨等）
  - name: 销售日期
    type: date
    description: 提取 销售日期 的日期值，格式 YYYY-MM-DD
  - name: 销售点
    type: string
    description: 提取 销售点 的文本值
  - name: 销量
    type: string
    description: 提取 销量 的文本值
  - name: 饲料采购量
    type: string
    description: 提取 饲料采购量 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 存货类别、库龄、跌价准备计提金额、入库日期、物料名称、数量、物料编码、期末数量、库存地点、账面成本、出入库单价、金额.账面成本 > 可变现净值、预计售价、计提金额.可变现净值 && 可变现净值、预计售价、计提金额.计提金额
    < (存货类别、库龄、跌价准备计提金额、入库日期、物料名称、数量、物料编码、期末数量、库存地点、账面成本、出入库单价、金额.账面成本 - 可变现净值、预计售价、计提金额.可变现净值)
  description: 存货成本高于可变现净值时，应当至少按差额计提跌价准备，若计提金额不足，则为低估跌价损失。同时，库龄超过1年且无近期销售的存货未计提，也视为疑似。
  audit_item: 未按规定核算资产
  suspicion: 存货跌价准备计提不充分
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"资产负债表日，存货应当按照成本与可变现净值孰低计量。存货成本高于其可变现净值的，应当计提存货跌价准备。\"\n  }\n]"
- expression: (疫情报告.报告时间 - 疫情报告.疫情发现时间 > 24h) OR (处理台账.病死畜禽种类及数量 > 疫情报告.死亡数量) OR (理赔记录.病死畜禽理赔数量 > 疫情报告.死亡数量 * 1.2)
  description: 报告时间超过发现时间24小时为迟报；无害化处理台账中某养殖场处理数量明显大于已上报疫情死亡数量，且差异超过20%，存在瞒报可能；保险理赔死亡数量若显著高于官方报告死亡数量（超出20%），疑似谎报或漏报。
  audit_item: 落实动物防疫不到位
  suspicion: 瞒报谎报迟报动物疫情
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国动物防疫法\",\n    \"法规文号\": \"主席令第69号（2021年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"从事动物疫病监测、检测、检验检疫、研究、诊疗以及动物饲养、屠宰、捕捞、隔离、运输等活动的单位和个人，发现动物染疫或者疑似染疫的，应当立即向所在地动物疫病预防控制机构或者动物防疫主管部门报告。\"\
    \n  },\n  {\n    \"法规名称\": \"重大动物疫情应急条例\",\n    \"法规文号\": \"国务院令第450号\",\n    \"效力级别\": \"行政法规\",\n    \"条"
- expression: (测日报表.同比涨幅 > 过度下跌预警阈值（如猪粮比）.过度上涨预警阈值 && DATEDIFF(决策文件.投放令签发日期, 测日报表.监测日期) > 过度下跌预警阈值（如猪粮比）.投放响应时限) || (决策文件.计划投放数量
    > 0 && 记录表.投放数量 / 决策文件.计划投放数量 < 0.8)
  description: 当猪肉零售价同比涨幅超过制度规定的过度上涨阈值（如40%）后，超过规定响应时限未作出投放决策，或虽已决策但实际投放量不足计划量的80%，均属违规。
  audit_item: 落实政府猪肉储备政策不到位
  suspicion: 价格过度上涨时未及时投放政府猪肉储备
  regulation: "[\n  {\n    \"法规名称\": \"关于完善政府猪肉储备调节机制 做好猪肉市场保供稳价工作预案\",\n    \"法规文号\": \"发改价格〔2021〕770号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"三、（三）储备投放\",\n    \"内容概述\": \"当猪肉价格出现过度上涨时，地方政府应适时投放政府猪肉储备，增加市场供应，引导价格合理运行，投放数量、价格和区域需满足预案要求，确保投放实效。\"\
    \n  }\n]"
