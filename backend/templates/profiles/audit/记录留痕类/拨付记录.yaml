name: audit/记录留痕类/拨付记录
type: model
description: 从记录留痕类类文档（拨付记录）中提取结构化元数据。涵盖字段如：实际拨付日期、实际拨款金额、年度、建设状态、拨付依据、拨付对象、拨付时间、拨付金额。文档范围包括：主管部门和乡镇实体账户资金拨付记录、主管部门拨付记录、省级财政转移支付资金拨付记录、财政资金拨付记录、资金拨付记录、近五年种业科研经费拨付记录、采购资金拨付记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 拨款
- 采购
- 金额
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 拨付记录
  member_count: 1
  member_details:
  - 主管部门和乡镇实体账户资金拨付记录
  - 主管部门拨付记录
  - 省级财政转移支付资金拨付记录
  - 财政资金拨付记录
  - 资金拨付记录
  - 近五年种业科研经费拨付记录
  - 采购资金拨付记录
output:
  fields:
  - name: 实际拨付日期
    type: date
    description: 提取 实际拨付日期 的日期值，格式 YYYY-MM-DD
  - name: 实际拨款金额
    type: number
    description: 提取 实际拨款金额 的数值（含单位，如万元、吨等）
  - name: 年度
    type: date
    description: 提取 年度 的日期值，格式 YYYY-MM-DD
  - name: 建设状态
    type: boolean
    description: 提取 建设状态 的布尔值（是/否）
  - name: 拨付依据
    type: string
    description: 提取 拨付依据 的文本值
  - name: 拨付对象
    type: string
    description: 提取 拨付对象 的文本值
  - name: 拨付时间
    type: date
    description: 提取 拨付时间 的日期值，格式 YYYY-MM-DD
  - name: 拨付金额
    type: number
    description: 提取 拨付金额 的数值（含单位，如万元、吨等）
  - name: 拨入时间
    type: date
    description: 提取 拨入时间 的日期值，格式 YYYY-MM-DD
  - name: 拨入账户名称
    type: string
    description: 提取 拨入账户名称 的文本值
  - name: 拨入金额
    type: number
    description: 提取 拨入金额 的数值（含单位，如万元、吨等）
  - name: 拨出至农户时间
    type: date
    description: 提取 拨出至农户时间 的日期值，格式 YYYY-MM-DD
  - name: 拨款依据
    type: number
    description: 提取 拨款依据 的数值（含单位，如万元、吨等）
  - name: 拨款进度
    type: number
    description: 提取 拨款进度 的数值（含单位，如万元、吨等）
  - name: 接收方名称
    type: string
    description: 提取 接收方名称 的文本值
  - name: 收款方
    type: number
    description: 提取 收款方 的数值（含单位，如万元、吨等）
  - name: 用途
    type: string
    description: 提取 用途 的文本值
  - name: 用途分类
    type: string
    description: 提取 用途分类 的文本值
  - name: 第一笔采购资金支付日期
    type: date
    description: 提取 第一笔采购资金支付日期 的日期值，格式 YYYY-MM-DD
  - name: 计划投资额
    type: string
    description: 提取 计划投资额 的文本值
  - name: 转移支付指标文号
    type: string
    description: 提取 转移支付指标文号 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 预算单位名称
    type: number
    description: 提取 预算单位名称 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 委托协议.委托事项 IN 职能清单.法定行政职能事项 AND 委托协议.签订日期 >= '2015-07-08' AND 收费清单.收费项目 对应 委托事项
  description: 以委托协议方式将本应由行政机关实施的法定行政职能（如审批、年检、认证）交由协会办理，且协会向服务对象收取费用，无论是否经财政拨款，均属违规。脱钩方案发布后新签此类协议尤其违规。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 违规转移或委托法定职能
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推开行业协会商会与行政机关脱钩改革的实施意见\",\n    \"法规文号\": \"发改经体〔2019〕1063号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"三、脱钩任务和措施（二）职能分离\",\n    \"内容概述\": \"行政机关不得将法定职能转移或委托给行业协会商会，不得以购买服务等名义变相转移职能。\"\n  }\n]"
- expression: 交易流水表.交易对手方账户类型 in ('实体账户','过渡账户','专用账户') && 交易流水表.交易摘要 like '%补贴%' && 明细表.发放时间 - 拨付记录.拨入时间 > 规定时限
  description: 通过银行流水追踪发现补贴资金先流入非农户个人账户的实体账户或过渡账户，且从拨入到实际发放至农户账户的时间超过政策规定时限（如3个工作日或30日），构成违规；过渡账户造成资金停留，存在挪用或延迟风险。
  audit_item: 惠农补贴“一卡通”管理不规范
  suspicion: 补贴资金通过主管部门或乡镇实体账户过渡发放
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财办〔2020〕35号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第三条、第四条\",\n    \"内容概述\": \"补贴资金应通过国库集中支付和‘一卡通’系统直接发放到受益人账户，严禁将资金拨付到主管部门或乡镇中间账户再转付，减少资金流转环节，确保及时足额发放。\"\
    \n  }\n]"
- expression: 接收方名称（乡镇/村） like '%乡镇%' or 接收方名称（乡镇/村） like '%村%' && 资金最终去向 in (惠农补贴项目清单) && 发放金额 != 发放金额
  description: 检查补贴资金拨付路径发现资金流向乡镇或村集体经济组织，且乡镇村自行制作的发放名册金额与上级下达的补贴金额不一致，存在分配调整空间；政策要求直达农户，禁止层层转拨。
  audit_item: 惠农补贴“一卡通”管理不规范
  suspicion: 补贴资金由主管部门拨付到乡镇或村代为发放
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财办〔2020〕35号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第二条、第四条\",\n    \"内容概述\": \"严肃查处补贴资金层层转拨、优亲厚友等行为，补贴资金应由县级财政部门通过一卡通系统统一发放到户，不得将资金拨付至乡镇或村再行发放。\"\
    \n  }\n]"
- expression: 管理制度.经费保障条款 NOT LIKE '%长期稳定支持%' || (拨付记录.拨付金额 > 0.2) || (拨付记录.年度 >= 1) || (拨付记录.拨付金额 < 15%)
  description: 经费管理制度中缺乏对基础性公益性研究的长期稳定支持机制（如至少5年持续投入承诺）则违规；近5年中任何相邻年度拨付中断或年拨付额波动率超过20%，视为不稳定；基础研究经费占比持续低于总研发投入的15%，不符合国际农业科技强国基准，存在机制性缺陷。
  audit_item: 种业科技研发方面不符合相关规定
  suspicion: 未建立长期稳定的基础性公益性研究经费机制
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于全面加强基础科学研究的若干意见\",\n    \"法规文号\": \"国发〔2018〕4号\",\n    \"效力级别\": \"行政法规\",\n \
    \   \"条款号\": \"三、完善基础研究支持体系（八）\",\n    \"内容概述\": \"建立基础研究稳定支持机制，对基础研究机构和基础研究项目给予长期稳定支持，引导地方和企业加大对基础研究的投入，基础研究经费占研发总经费比重应稳步提高。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"2021年修订版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十条\""
