name: audit/记录留痕类/盘点记录
type: model
description: 从记录留痕类类文档（盘点记录）中提取结构化元数据。涵盖字段如：存放地点、实盘数量、实际检测数量、盘点日期、盘点资产数量、盘点金额、盘盈盘亏值、盘盈盘亏情况。文档范围包括：实物库存盘点记录、实际盘点记录、现金盘点记录、资产盘点记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 资产
- 金额
- 验收
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 盘点记录
  member_count: 1
  member_details:
  - 实物库存盘点记录
  - 实际盘点记录
  - 现金盘点记录
  - 资产盘点记录
output:
  fields:
  - name: 存放地点
    type: string
    description: 提取 存放地点 的文本值
  - name: 实盘数量
    type: number
    description: 提取 实盘数量 的数值（含单位，如万元、吨等）
  - name: 实际检测数量
    type: number
    description: 提取 实际检测数量 的数值（含单位，如万元、吨等）
  - name: 盘点日期
    type: date
    description: 提取 盘点日期 的日期值，格式 YYYY-MM-DD
  - name: 盘点资产数量
    type: number
    description: 提取 盘点资产数量 的数值（含单位，如万元、吨等）
  - name: 盘点金额
    type: number
    description: 提取 盘点金额 的数值（含单位，如万元、吨等）
  - name: 盘盈盘亏值
    type: string
    description: 提取 盘盈盘亏值 的文本值
  - name: 盘盈盘亏情况
    type: string
    description: 提取 盘盈盘亏情况 的文本值
  - name: 资产使用状态
    type: boolean
    description: 提取 资产使用状态 的布尔值（是/否）
  - name: 资产状况
    type: string
    description: 提取 资产状况 的文本值
  - name: 资产验收日期
    type: date
    description: 提取 资产验收日期 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (日记账.现金余额 - 盘点记录.实盘现金余额 < 0 && ABS(差异) > 2000 && 无书面说明) || (银行对账单.借贷方金额转账至个人账户 && 金额 > 50000 && 缺少对应业务合同) ||
    (明细台账.备用金 > 100000 && 长期未冲账且无实际库存现金)
  description: 突击盘点发现现金溢余且无合理解释，可能为公款私存。银行转账至个人账户大额无业务支撑，揭示公款被挪用或私存。备用金余额异常且无法盘实，疑为以备用金名义提取现金私存。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 私存私放财政资金或公款
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"单位和个人违反财务管理的规定，私存私放财政资金或者其他公款的，责令改正，调整有关会计账目，追回私存私放的资金，没收违法所得。对单位处3000元以上5万元以下的罚款；对直接负责的主管人员和其他直接责任人员处2000元以上2万元以下的罚款……\"\
    \n  }\n]"
- expression: (SUM(票据存根.金额) - SUM(明细表.金额) > 0) || (银行对账单.借贷方金额 WHERE 摘要为货款/服务费等 - SUM(银行对账单.借贷方金额) > 0 && 差异 > 5000) || (经济合同.合同金额及收款条款
    - 经济合同.合同金额 > 0 && 对应票据已开但未入账)
  description: 票据存根、银行流水、合同等外部证据显示的应入账收入大于账面实际确认的收入，说明收入被截留。阈值5千元筛选实质性差异。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 收入不入账形成账外资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十四号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"公司、企业进行会计核算不得有下列行为：虚列或者隐瞒收入，推迟或者提前确认收入。\"\n  }\n]"
- expression: (盘点记录.实盘数量 - 存货台账.入账原值 > 0) || (经济合同.合同金额 > 10000 && 存货台账.资产编码 IS NULL) || (盘点记录.处置审批及处置收入 > 0 && 分类账.发生额及余额)
  description: 实物盘点超出台账数量，或依据采购合同、付款记录证实有资产购入但台账未登记，均为账外资产。处置资产收益未入账，可能形成新的账外资金或私分。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 存在账外资产未纳入统一核算
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十条\",\n    \"内容概述\": \"各部门及其所属单位应当对下列资产及时予以报废、报损：……资产的处置收入、收益等，应当按照政府非税收入和国库集中收缴制度的有关规定上缴……\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十四号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\"\
    : \""
- expression: (票据存根联金额合计 != 记账联金额合计) || (非税收入台账.票据编号缺失 || 非税收入台账.票据编号不在票据领用登记簿.核销记录内) && (银行对账单.收入金额 > 0 || 现金日记账.收入金额 > 0)
    && 非税收入台账.应缴金额 < 银行对账单.对应收入金额
  description: 当票据存根联金额与记账联金额不符，或收费台账中缺失规范票据编号且存在资金流入时，判定为隐瞒收入。差额即为疑似隐瞒金额，差异率超过10%列为重点疑点。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 未开具非税收入票据隐瞒收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十七条\",\n    \"内容概述\": \"执收单位不得隐匿、转移、截留、坐支、挪用、私分或者变相私分非税收入；非税收入应当依法开具票据，依法及时足额上缴。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政票据管理办法\",\n    \"法规文号\": \"财政部令第70号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条、第十七条\",\n    \"内容概述\": \"财政票据是财务收支和会计核"
- expression: ((SUM(12月支付金额)/全年支付总额) > 0.3) AND (最后5个工作日支付总额/12月支付总额 > 0.4) AND (存在单笔支付金额>全年月均支出3倍的事项)
  description: 12月支出占全年支出比例超过30%为异常；12月最后5个工作日支出占整月比例超过40%表明集中抢付；同时满足单笔支付金额超月均支出3倍的大额事项存在，高度疑似突击花钱。各项阈值可结合单位往年正常水平调整。
  audit_item: 预算执行率不真实
  suspicion: 年底突击花钱虚增预算执行率
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"各部门、各单位应当依法组织预算支出，不得在预算执行中随意变更预算用途，不得无预算安排支出，不得违反规定扩大开支范围、提高开支标准。\"\n  },\n  {\n    \"法规名称\"\
    : \"国务院关于深化预算管理制度改革的决定\",\n    \"法规文号\": \"国发〔2014〕45号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四部分\",\n    \"内容概述"
- expression: (进度表.累计完成量 / 任务书.计划数量 < 0.95) || (盘点记录.实际检测数量 < 单据.库存余额 - 允许损耗) || (检测证明.样品热值 < 标准下限 || 检测证明.甲烷纯度 < 标准下限)
  description: 截至计划完成日期，累计完成量低于计划量的95%，或现场盘点数量明显低于账面库存且超出允许损耗，或关键质量指标（热值、纯度）未达到国家标准，均构成任务未完成。
  audit_item: 落实“六稳”“六保”政策存在的其他问题
  suspicion: 未完成石油、天然气储备任务
  regulation: "[\n  {\n    \"法规名称\": \"《国家石油储备条例》\",\n    \"法规文号\": \"无公开文号，依据《国务院办公厅关于加强石油储备管理的通知》（国办发〔2017〕32号）\",\n   \
    \ \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二条、第八条\",\n    \"内容概述\": \"承担国家石油储备任务的企业应按计划完成实物收储，确保库存数量与质量符合规定，禁止虚报瞒报库存。\"\n\
    \  },\n  {\n    \"法规名称\": \"《天然气储备管理办法（试行）》\",\n    \"法规文号\": \"发改能源规〔2019〕138号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十"
- expression: (资产监管制度文件.风险控制措施条款 为空) || (工作考核机制相关制度.双向评价机制条款 为空) || (近3年考核评价记录.考核执行年度 为空) || (ABS(成员社资产清单.资产总额 - 实际盘点记录.盘点金额)/实际盘点记录.盘点金额
    > 0.05)
  description: 制度文件缺失监管或评价机制条款即判定违规；近3年无考核评价记录视为机制未运行；抽取资产清单与实际盘点差异率超过5%且无合理解释，视为资产监管缺位。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 未建立成员社与联合社双向评价考核机制
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"构建联合社主导的行业指导体系，建立成员社对联合社的工作评价机制，完善联合社对成员社的工作考核机制。\"\n  }\n]"
