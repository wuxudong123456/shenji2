name: audit/记录留痕类/测量记录
type: model
description: 从记录留痕类类文档（测量记录）中提取结构化元数据。涵盖字段如：功能分区独立性检查、实测业务用房面积、实测建筑面积、实测附属设施面积、实测面积、实际功能分区、设备实物与清单比对、项目名称。文档范围包括：实地测量记录、施工现场测量记录、现场测量记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 检查
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 测量记录
  member_count: 1
  member_details:
  - 实地测量记录
  - 施工现场测量记录
  - 现场测量记录
output:
  fields:
  - name: 功能分区独立性检查
    type: string
    description: 提取 功能分区独立性检查 的文本值
  - name: 实测业务用房面积
    type: string
    description: 提取 实测业务用房面积 的文本值
  - name: 实测建筑面积
    type: string
    description: 提取 实测建筑面积 的文本值
  - name: 实测附属设施面积
    type: string
    description: 提取 实测附属设施面积 的文本值
  - name: 实测面积
    type: string
    description: 提取 实测面积 的文本值
  - name: 实际功能分区
    type: string
    description: 提取 实际功能分区 的文本值
  - name: 设备实物与清单比对
    type: string
    description: 提取 设备实物与清单比对 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (批准文号.批准文号缺失) || (对照表.实际人均面积 > 对照表.标准人均面积) || (研究报告.用途 != '办公' && 研究报告.实际功能包含接待中心/宴会厅/游泳池等)
  description: 未取得合法审批文号擅自建设办公用房或楼堂馆所，或人均建筑面积超出国家规定标准，或以技术业务用房名义建设实际具有楼堂馆所性质的项目，均属违规。
  audit_item: 违反规定配置国有资产
  suspicion: 违规建设楼堂馆所或未经批准建设办公用房
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十六条\",\n    \"内容概述\": \"严格控制办公用房建设标准，不得超标准、超规模、超投资建设。严禁以任何理由新建楼堂馆所，严禁以危房改造等名义改扩建楼堂馆所，严禁以建技术业务用房名义搭车新建楼堂馆所。\"\
    \n  }\n]"
- expression: 竣工验收文件.实际竣工面积 < 建设标准文件.最小建筑面积要求 || 实地测量记录.功能分区独立性检查 != '合格' || 达标自查表.无障碍设施配置情况 != '合格' || 竣工验收文件.消防验收意见 != '合格'
    || 竣工验收文件.污水处理设施合格证明 != '合格'
  description: 以《乡镇卫生院建设标准》及地方具体标准为依据，面积低于标准即构成违规；功能分区缺失直接影响服务能力，属重大缺陷。消防、污水、无障碍设施缺一不可。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 乡镇卫生院/村卫生室业务用房面积或功能分区不达标
  regulation: "[\n  {\n    \"法规名称\": \"乡镇卫生院建设标准\",\n    \"法规文号\": \"建标107-2008\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\":\
    \ \"第十五条、第十九条\",\n    \"内容概述\": \"规定乡镇卫生院业务用房面积指标和功能分区要求，包括门诊、急诊、住院、医技等基本用房设置标准。\"\n  },\n  {\n    \"法规名称\": \"村卫生室管理办法（试行）\"\
    ,\n    \"法规文号\": \"国卫基层发〔2014〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条、第十二条\",\n    \"内容概述\": \"村卫生室应当分设诊断室、治疗"
- expression: (面积统计表.实际完成面积 < 绩效自评报告.上报完成面积) || (面积统计表.实际完成面积 < 实施方案.改革目标面积 * 0.9)
  description: 实际完成面积低于自评上报面积，或低于方案确定的目标任务面积的90%，存在虚报完成进度或任务不达标风险。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 虚报农业水价综合改革完成面积
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"五、保障措施（三）\",\n    \"内容概述\": \"各省（区、市）人民政府要把农业水价综合改革任务分解落实到有关部门和地区，明确改革时间表和分步实施计划，细化年度改革目标任务，建立健全工作机制，确保各项改革任务按期完成。\"\
    \n  }\n]"
- expression: (现场测量记录.实测附属设施面积 > 省级设施农业用地政策实施细则.旧标准面积上限) AND (现场测量记录.实测附属设施面积 <= 省级设施农业用地政策实施细则.附属设施允许面积上限) AND (行政处罚决定书.处罚日期
    > 省级设施农业用地政策实施细则.新标准生效日期) AND (行政处罚决定书.所依据的标准文件 = '旧标准文件')
  description: 表达式筛选出附属设施面积虽超过旧标准上限但未超出新标准上限，且新标准已生效后仍依据旧标准进行处罚的案例。表明执法部门未及时更新并适用有利于管理相对人的新政策，存在选择性执法或政策执行偏差。
  audit_item: 农业社会化服务政策扶持不到位
  suspicion: 设施农业用地附属设施面积标准执行错误导致违规处罚
  regulation: "[\n  {\n    \"法规名称\": \"某省设施农业用地管理实施细则\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"关于附属设施面积标准的条款\"\
    ,\n    \"内容概述\": \"新标准将看护房等附属设施允许面积上限由15平方米放宽至22平方米，并明确新标准生效后统一按新标准执行。\"\n  }\n]"
