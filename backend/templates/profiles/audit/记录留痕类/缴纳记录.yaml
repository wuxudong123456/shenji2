name: audit/记录留痕类/缴纳记录
type: model
description: 从记录留痕类类文档（缴纳记录）中提取结构化元数据。涵盖字段如：个人身份、人员身份、人员身份证号、单位统一信用代码、单位缴纳部分金额、参保人数、参保单位、参保单位名称。文档范围包括：人员社保缴纳记录、企业社保缴纳记录、承租人社保缴纳记录、用人单位社保缴纳记录、社保缴纳记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 缴纳记录
  member_count: 1
  member_details:
  - 人员社保缴纳记录
  - 企业社保缴纳记录
  - 承租人社保缴纳记录
  - 用人单位社保缴纳记录
  - 社保缴纳记录
output:
  fields:
  - name: 个人身份
    type: string
    description: 提取 个人身份 的文本值
  - name: 人员身份
    type: string
    description: 提取 人员身份 的文本值
  - name: 人员身份证号
    type: string
    description: 提取 人员身份证号 的文本值
  - name: 单位统一信用代码
    type: string
    description: 提取 单位统一信用代码 的文本值
  - name: 单位缴纳部分金额
    type: number
    description: 提取 单位缴纳部分金额 的数值（含单位，如万元、吨等）
  - name: 参保人数
    type: number
    description: 提取 参保人数 的数值（含单位，如万元、吨等）
  - name: 参保单位
    type: string
    description: 提取 参保单位 的文本值
  - name: 参保单位名称
    type: string
    description: 提取 参保单位名称 的文本值
  - name: 参保状态
    type: boolean
    description: 提取 参保状态 的布尔值（是/否）
  - name: 参保职工名单
    type: string
    description: 提取 参保职工名单 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 实际缴费基数
    type: number
    description: 提取 实际缴费基数 的数值（含单位，如万元、吨等）
  - name: 总包单位关键管理人员社保缴纳单位
    type: string
    description: 提取 总包单位关键管理人员社保缴纳单位 的文本值
  - name: 累计缴纳月数
    type: string
    description: 提取 累计缴纳月数 的文本值
  - name: 缴纳人身份证号
    type: string
    description: 提取 缴纳人身份证号 的文本值
  - name: 缴纳单位地址
    type: string
    description: 提取 缴纳单位地址 的文本值
  - name: 缴纳月份
    type: string
    description: 提取 缴纳月份 的文本值
  - name: 缴费单位
    type: number
    description: 提取 缴费单位 的数值（含单位，如万元、吨等）
  - name: 缴费基数
    type: number
    description: 提取 缴费基数 的数值（含单位，如万元、吨等）
  - name: 缴费期间
    type: number
    description: 提取 缴费期间 的数值（含单位，如万元、吨等）
  - name: 缴费起止年月
    type: date
    description: 提取 缴费起止年月 的日期值，格式 YYYY-MM-DD
  - name: 缴费起止日期
    type: date
    description: 提取 缴费起止日期 的日期值，格式 YYYY-MM-DD
  - name: 缴费起止时间
    type: date
    description: 提取 缴费起止时间 的日期值，格式 YYYY-MM-DD
  - name: 见习单位社保缴纳人员名单
    type: string
    description: 提取 见习单位社保缴纳人员名单 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 险种
    type: string
    description: 提取 险种 的文本值
  - name: 首次参保日期
    type: date
    description: 提取 首次参保日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (投标文件.拟投入人员名单 == '张三' && 缴纳记录.参保单位名称 != 中标机构名称) || (检测报告.主要检测人员姓名 不具有 规范要求的从业资格) || (资质证书.有效期 < 桥梁检测实施日期)
  description: 投标文件中承诺投入的人员与实际在场人员不符，且社保关系未在中标机构；无证人员冒充高级工程师签字；机构资质过期仍承接业务，均属资质违规。
  audit_item: 道路桥梁安全定期检测审计
  suspicion: 检测人员或机构资质挂靠
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十三条\",\n    \"内容概述\": \"投标人不得以他人名义投标或者以其他方式弄虚作假，骗取中标。\"\n  },\n  {\n    \"法规名称\": \"公路水运工程试验检测管理办法\",\n    \"法规文号\"\
    : \"交通运输部令2019年第19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条、第二十八条\",\n    \"内容概述\": \"检测人员不得同时受聘于两个及以上检测机构，检测机构不得转包、违规分"
- expression: 分包合同.分包范围 包含主体结构施工 || (分包合同.分包范围 总包合同.总承包范围 的绝大部分 && 项目管理人员社保缴纳单位 != 总包单位) || 工程款支付凭证.收款单位 为 个人且金额巨大并备注‘管理费’
  description: 根据规定，建设工程主体结构不得分包。若分包合同涉及主体结构，直接认定违法分包。若实际关键管理人员非总包单位员工，且主要材料设备款、分包款由总包单位收取后仅扣除一定比例再转付，则存在转包嫌疑。
  audit_item: 重大工程项目全过程审计
  suspicion: 非法转包或违法分包导致工程质量失控
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第七十八条\",\n    \"内容概述\": \"本条例所称转包，是指承包单位承包建设工程后，不履行合同约定的责任和义务，将其承包的全部建设工程转给他人或者将其承包的全部建设工程肢解以后以分包的名义分别转给其他单位承包的行为。……本条例所称违法分包，是指下列行为：（一）总承包单位将建设工程分包给不具备相应资质条件的单位的；……（三）施工总承包单位将建设工程主体结构的施工分包给其他单位的；……\"\
    \n  },\n  {\n    \"法规"
- expression: 核查清单.申报安置职工人数 > 缴纳记录.累计缴纳月数 || (流水.奖补资金入账金额 > 0 && 流水.后续支付摘要)
  description: 若申报安置的下岗职工人数大于同期企业实际社保参保人数，即可认定为虚报冒领；奖补资金按规定应用于职工分流安置，若在发放后半年内大量资金被转至非安置支出（如偿还借款、转入关联方），则判定违规使用。
  audit_item: 财政资金申报、使用等方面存在的问题
  suspicion: 虚报冒领结构调整专项奖补资金
  regulation: "[\n  {\n    \"法规名称\": \"工业企业结构调整专项奖补资金管理办法\",\n    \"法规文号\": \"财建〔2016〕253号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十四条\",\n    \"内容概述\": \"对弄虚作假、骗取、套取奖补资金的，一经发现，追回资金，并依法追究责任。奖补资金主要用于职工分流安置，不得用于其他支出。\"\n  }\n]"
- expression: COUNT(负责村庄.保洁员姓名) < 应覆盖村庄数 || (发放表.姓名 NOT IN 缴纳记录.姓名) || (发放表.实发工资 > 0 && 发放表.出勤天数 = 0)
  description: 应设立保洁员的村庄实际合同人数小于需要的村庄数，或工资发放人员无社保记录疑为虚列，或有工资发放但无考勤记录判定为“幽灵员工”。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 未设立村庄保洁员或虚列保洁员
  regulation: "[\n  {\n    \"法规名称\": \"住房和城乡建设部等部门关于全面推进农村垃圾治理的指导意见\",\n    \"法规文号\": \"建村〔2015〕170号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、（五）\",\n    \"内容概述\": \"建立村庄保洁制度，建立稳定的村庄保洁队伍，明确保洁员职责和考核办法。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\"\
    ,\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当组织、指导对"
- expression: (信息.户籍所在地 != 本地 && 缴纳记录.累计缴纳月数 < 政策文件.对外来务工人员户籍、居住或社保缴纳年限要求) && (分配名单.承租人身份证号 对应存在分配记录)
  description: 非本地户籍申请人的社保累计缴纳月数未达到政策规定的最低年限，却已获得公租房分配，即构成违规。同时检查居住证连续居住时间是否达标。
  audit_item: 向不符合条件的人员发放保障待遇
  suspicion: 不符合户籍或居住年限违规享受公租房保障
  regulation: "[\n  {\n    \"法规名称\": \"《公共租赁住房管理办法》\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条、第九条\",\n    \"内容概述\": \"申请公共租赁住房，应当符合以下条件：在本地无住房或者住房面积低于规定标准；收入、财产低于规定标准；申请人为外来务工人员的，在本地稳定就业达到规定年限。\"\n \
    \ }\n]"
- expression: (统计表.缴费户名 != 租赁合同.承租人姓名) || (缴纳记录.缴纳单位地址 != 房屋地址 && 缴纳月份 >= 6) || (申报记录.申报单位地址 != 房屋地址 && 申报月份 >= 6) || (检查记录.实际居住人姓名
    != 登记表.承租人姓名) || (投诉记录.投诉内容（涉及装修、拆改、隔断等）且处理结果为‘属实’)
  description: 任一条件满足即触发疑点：水电燃气缴费户名与合同承租人不一致，说明实际使用人非承租人；社保或个税缴纳地连续6个月以上不在公租房所在地，表明承租人可能长期不在本地居住，存在转租或空置风险；物业入户检查记录的实际居住人与承租人不同，直接反映转借转租；投诉举报中含转租转借或改变用途内容且已核实，作为线索佐证。多条件同时触发即构成严重违规。
  audit_item: 未按规定使用公共租赁住房
  suspicion: 承租人违规转借转租或改变公租房用途
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"承租人不得转借、转租或者擅自调换所承租公共租赁住房，不得改变所承租公共租赁住房的用途。\"\n  }\n]"
- expression: 姓名、身份证号、是否参加培训.身份证号 NOT IN (姓名、身份证号、生存状态、户籍地址、姓名、户籍状态、迁出/死亡日期.身份证号) || 姓名、身份证号、生存状态、户籍地址、姓名、户籍状态、迁出/死亡日期.生存状态
    == '死亡' || 姓名、身份证号、是否参加培训.身份证号 NOT IN (姓名、缴纳月份、缴费基数、缴纳人身份证号、累计缴纳月数、身份证号、参保单位、缴费起止年月、实际缴费基数、单位缴纳部分金额、参保状态、首次参保日期、参保职工名单、缴费期间、参保单位名称、缴费起止时间、缴费单位、个人身份、人员身份、单位统一信用代码、人员身份证号、险种、缴费起止日期.身份证号)
    || 姓名
  description: 通过与公安、社保系统数据强制比对，筛选出身份无效、已死亡、无社保参保记录或参保单位与申报单位不一致的申领人；同时对同一身份证号在不同单位同期重复申领进行排查，任一条件满足即判为疑点。
  audit_item: 虚列就业补助资金支出
  suspicion: 虚构就业人员名单骗取补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十一条\",\n    \"内容概述\": \"各地要建立科学规范的资金使用管理机制，严格按范围、标准和程序使用资金，加强监督检查，对虚报冒领等行为依法追责。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有虚报冒领、骗"
- expression: 申领表.申报缴费基数 > 缴纳记录.实际缴费基数 * 1.1 || 申领表.申报缴费基数 > MAX(发放凭证.实发工资金额, 申报记录.申报收入额) * 1.2 || 明细表.支出金额 / 缴费比例 对应的基数 !=
    申领表.申报缴费基数（偏差>5%）
  description: 当申报基数与实际社保系统记录基数相差超过10%，或申报基数明显高于员工真实工资收入20%以上，或补贴金额反推基数与申报基数不一致时，判定为虚增补贴标准。
  audit_item: 虚列就业补助资金支出
  suspicion: 篡改缴费基数虚增社保补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"社会保险补贴标准根据单位实际缴纳的社会保险费确定，缴费基数应符合社会保险征缴规定，不得擅自提高。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国社会保险法\"\
    ,\n    \"法规文号\": \"主席令第三十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第六十条\",\n    \"内容概述\": \"用人单位应当自行申报、按时足额缴纳社会保险费，缴费基数应"
- expression: （申领吸纳就业补贴的身份证号 NOT IN (缴纳记录.身份证号)） || （合同起止日期 < 缴纳记录.首次参保日期 超过 30 天） || （发放凭证.实发工资金额在补贴申报后连续3个月无流水） || （合同起止日期与补贴申报期限不符）
  description: 通过查验劳动合同是否伴随真实用工行为（社保缴纳、工资发放）来判断，若未参保、参保时间滞后超过30天、或补贴期间无任何工资发放记录，则视为虚假用工合同。
  audit_item: 虚列就业补助资金支出
  suspicion: 虚构用工合同骗取吸纳就业补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"吸纳就业困难人员社保补贴或岗位补贴须以建立稳定劳动关系并按规定缴纳社保费为前提，仅凭无实质履行的合同不得申领。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国劳动合同法\"\
    ,\n    \"法规文号\": \"主席令第六十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"建立劳动关系应当订立书面劳动合同，但劳动关"
