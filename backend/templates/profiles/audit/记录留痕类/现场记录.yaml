name: audit/记录留痕类/现场记录
type: model
description: 从记录留痕类类文档（现场记录）中提取结构化元数据。涵盖字段如：实际参加人员、现场照片。文档范围包括：活动现场记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 人员
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 现场记录
  member_count: 1
  member_details:
  - 活动现场记录
output:
  fields:
  - name: 实际参加人员
    type: string
    description: 提取 实际参加人员 的文本值
  - name: 现场照片
    type: string
    description: 提取 现场照片 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (活动方案.时长 / 总行程时长 < 0.3) && (活动方案.地点 IN 旅游城市列表) || (费用报销凭证.住宿费 > 活动方案.时长 + 1) || (活动现场记录.实际参加人员 < 费用报销凭证.报销人员名单)
    || (费用报销凭证.发票内容 包含 '景区门票')
  description: 计算活动方案中明确公务（如会议、参观红色基地）的时间占总外出时间的比例，若低于30%且目的地为旅游城市，或住宿天数远超公务需求，或实际参与人数少于报销人数，或出现景区门票等明显旅游支出，则判定为借公务之名旅游。
  audit_item: 其他违反中央八项规定及其实施细则精神问题
  suspicion: 假借党建、培训等公务活动名义组织公款旅游
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关差旅费管理办法\",\n    \"法规文号\": \"财行〔2013〕531号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十九条\",\n    \"内容概述\": \"出差人员不得向接待单位提出正常公务活动以外的要求，不得在出差期间接受违反规定用公款支付的宴请、游览和非工作需要的参观，不得借出差之机旅游。\"\n  }\n]"
