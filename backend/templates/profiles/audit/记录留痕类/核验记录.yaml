name: audit/记录留痕类/核验记录
type: model
description: 从记录留痕类类文档（核验记录）中提取结构化元数据。涵盖字段如：失业登记有效状态、就业困难认定结果、工商注册状态、社保缴纳状态。文档范围包括：就业/培训人员身份核验记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 登记
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 核验记录
  member_count: 1
  member_details:
  - 就业/培训人员身份核验记录
output:
  fields:
  - name: 失业登记有效状态
    type: boolean
    description: 提取 失业登记有效状态 的布尔值（是/否）
  - name: 就业困难认定结果
    type: boolean
    description: 提取 就业困难认定结果 的布尔值（是/否）
  - name: 工商注册状态
    type: boolean
    description: 提取 工商注册状态 的布尔值（是/否）
  - name: 社保缴纳状态
    type: boolean
    description: 提取 社保缴纳状态 的布尔值（是/否）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (发放明细表.身份证号/统一社会信用代码 NOT IN (SELECT 身份证号 FROM 核验记录 WHERE 社保缴纳状态='中断')) || (发放明细表.身份证号/统一社会信用代码 NOT IN (SELECT
    身份证号 FROM 核验记录 WHERE 失业登记有效状态='有效')) || (发放明细表.身份证号/统一社会信用代码 IN (SELECT 统一社会信用代码 FROM 结果 WHERE 企业注销/吊销/经营异常状态 IN ('注销','吊销')))
    || (申请材料.低保证/残疾证等==1)
  description: 违规判定逻辑：发放对象若未在社保系统中显示为中断缴费状态、未在失业登记数据库中处于有效状态、企业已被注销/吊销，或者申请时缺失失业证明、低保证等关键证明，即触发违规预警。多个条件为或关系，满足任意一项即为疑点。
  audit_item: 违规发放资金或补贴
  suspicion: 违规向不符合条件对象发放就业补助资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国就业促进法\",\n    \"法规文号\": \"中华人民共和国主席令第七十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十五条、第四十九条\",\n    \"内容概述\": \"国家实行有利于促进就业的财政政策，就业专项资金必须专款专用，不得挤占挪用；各级人民政府应规范就业专项资金的使用管理，确保资金用于符合条件的补贴对象。\"\n  },\n\
    \  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条、第十七条\""
