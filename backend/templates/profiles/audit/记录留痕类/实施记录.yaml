name: audit/记录留痕类/实施记录
type: model
description: 从记录留痕类类文档（实施记录）中提取结构化元数据。涵盖字段如：修复日期、培训频次、处理进度、实际开展课时、实际活动开展记录、宣传方式、年度、开展次数。文档范围包括：历史遗留问题专项处理方案实施记录、教育培训制度实施记录、文化站（中心）年度活动计划实施记录、殡葬惠民政策实施记录、管理人员培训计划实施记录、设施维修养护合同实施记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 培训
- 项目
- 验收
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 实施记录
  member_count: 1
  member_details:
  - 历史遗留问题专项处理方案实施记录
  - 教育培训制度实施记录
  - 文化站（中心）年度活动计划实施记录
  - 殡葬惠民政策实施记录
  - 管理人员培训计划实施记录
  - 设施维修养护合同实施记录
output:
  fields:
  - name: 修复日期
    type: date
    description: 提取 修复日期 的日期值，格式 YYYY-MM-DD
  - name: 培训频次
    type: string
    description: 提取 培训频次 的文本值
  - name: 处理进度
    type: string
    description: 提取 处理进度 的文本值
  - name: 实际开展课时
    type: string
    description: 提取 实际开展课时 的文本值
  - name: 实际活动开展记录
    type: string
    description: 提取 实际活动开展记录 的文本值
  - name: 宣传方式
    type: string
    description: 提取 宣传方式 的文本值
  - name: 年度
    type: date
    description: 提取 年度 的日期值，格式 YYYY-MM-DD
  - name: 开展次数
    type: string
    description: 提取 开展次数 的文本值
  - name: 报修日期
    type: date
    description: 提取 报修日期 的日期值，格式 YYYY-MM-DD
  - name: 签到记录
    type: string
    description: 提取 签到记录 的文本值
  - name: 维修项目
    type: string
    description: 提取 维修项目 的文本值
  - name: 覆盖村数
    type: string
    description: 提取 覆盖村数 的文本值
  - name: 课件存档
    type: string
    description: 提取 课件存档 的文本值
  - name: 课程内容
    type: string
    description: 提取 课程内容 的文本值
  - name: 责任人
    type: string
    description: 提取 责任人 的文本值
  - name: 责任部门
    type: string
    description: 提取 责任部门 的文本值
  - name: 资料发放记录
    type: string
    description: 提取 资料发放记录 的文本值
  - name: 验收结论
    type: string
    description: 提取 验收结论 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
