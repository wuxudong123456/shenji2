name: audit/记录留痕类/入境记录
type: model
description: 从记录留痕类类文档（入境记录）中提取结构化元数据。涵盖字段如：出入境日期、出入境日期与目的地、口岸城市、外出情形、姓名、证件号码。文档范围包括：出入境记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 入境记录
  member_count: 1
  member_details:
  - 出入境记录
output:
  fields:
  - name: 出入境日期
    type: date
    description: 提取 出入境日期 的日期值，格式 YYYY-MM-DD
  - name: 出入境日期与目的地
    type: date
    description: 提取 出入境日期与目的地 的日期值，格式 YYYY-MM-DD
  - name: 口岸城市
    type: string
    description: 提取 口岸城市 的文本值
  - name: 外出情形
    type: string
    description: 提取 外出情形 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 证件号码
    type: string
    description: 提取 证件号码 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (人员姓名.证件类型 = '因私' AND 人员姓名.批准状态 = '未批准' 或无审批记录) AND (报销凭证.报销人 = 该人员 AND 报销凭证.报销事由 包含 '因公出国')
  description: 凡持因私证件出国（境）且未经组织审批，或者经审批但事由与公务无关，却在单位报销相关费用的，即为违规。同时需排除因公证件临时办理困难等经特批的例外情况。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 公款报销持因私证件出国费用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国护照法\",\n    \"法规文号\": \"主席令第五十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二条、第十三条\"\
    ,\n    \"内容概述\": \"因公护照和因私护照应当分别使用，因公出国应持因公护照；持因私护照执行公务须按规定审批。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强因公出国（境）管理的若干规定\",\n\
    \    \"法规文号\": \"中办发〔2008〕9号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"严格因公出国（境）证件管理，任何人不得持因私"
- expression: (明细表.消费日期, 明细表.消费城市) 不在 审批文件.计划行程城市 && (明细表.消费日期 与 出入境记录.出入境日期 匹配) && (明细表.费用类别 == '交通' || 明细表.费用类别 == '住宿'
    || 明细表.费用类别 == '餐饮')
  description: 若报销的费用发生日期在出入境记录的境外停留期间，但消费城市不在审批的公务行程计划范围内，且属于交通、住宿、餐饮等刚性支出，则高度怀疑虚列行程或绕道旅游。该表达式需结合出入境记录的精确日期进行时空匹配。
  audit_item: 境外公务未严格落实中央八项规定及实施细则精神
  suspicion: 虚列境外行程套取公务经费
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条、第十三条\",\n    \"内容概述\": \"出国人员应严格按照批准的事由、国家、城市执行，不得擅自更改行程，增加出访国家或城市，不得擅自延长在国外停留时间。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中共中央政治局贯彻落实中央八项规定的实施细则\",\n    \"法规文号\": \"2017年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第三条\",\n    \"内容概述\"\
    : \"严禁以"
