name: audit/记录留痕类/施用记录
type: model
description: 从记录留痕类类文档（施用记录）中提取结构化元数据。涵盖字段如：大肠杆菌值、每批次粪肥检测的重金属含量、腐熟度等。文档范围包括：粪肥还田施用记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 施用记录
  member_count: 1
  member_details:
  - 粪肥还田施用记录
output:
  fields:
  - name: 大肠杆菌值
    type: string
    description: 提取 大肠杆菌值 的文本值
  - name: 每批次粪肥检测的重金属含量
    type: string
    description: 提取 每批次粪肥检测的重金属含量 的文本值
  - name: 腐熟度等
    type: string
    description: 提取 腐熟度等 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (粪肥检测数据表中重金属含量 > 标准限值) || (粪肥检测数据表中病原体指标 > 标准限值) || (环保监测报告中污染超标且溯源指向粪肥还田) || (投诉记录中存在烧苗或地下水污染事件且该区域使用过粪肥)
  description: 检测数据任一项超出《有机肥料》NY 525标准限值即违规；环保监测报告证实污染与粪肥还田存在因果关系则构成严重环境污染事件。
  audit_item: 项目实施不到位
  suspicion: 粪肥还田有害物质超标
  regulation: "[\n  {\n    \"法规名称\": \"有机肥料\",\n    \"法规文号\": \"NY 525-2012\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"4.1、4.2\"\
    ,\n    \"内容概述\": \"规定了有机肥料中重金属（总砷、总汞、总铅、总镉、总铬）的限量指标以及蛔虫卵死亡率和大肠杆菌值等无害化卫生要求。\"\n  },\n  {\n    \"法规名称\": \"畜禽规模养殖污染防治条例\"\
    ,\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十九条\",\n    \"内容概述\": \"从事畜禽养殖活动和畜禽养殖废弃物处理活动，"
