name: audit/记录留痕类/发出记录
type: model
description: 从记录留痕类类文档（发出记录）中提取结构化元数据。涵盖字段如：发布时间、澄清答疑时间、答疑内容。文档范围包括：招标文件发出记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 发出记录
  member_count: 1
  member_details:
  - 招标文件发出记录
output:
  fields:
  - name: 发布时间
    type: date
    description: 提取 发布时间 的日期值，格式 YYYY-MM-DD
  - name: 澄清答疑时间
    type: date
    description: 提取 澄清答疑时间 的日期值，格式 YYYY-MM-DD
  - name: 答疑内容
    type: string
    description: 提取 答疑内容 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 涉及服务不及时、无人照护的投诉内容及次数、投诉人名称、投诉事由（乱收费/乱收保证金）、涉事部门、关于推诿扯皮的投诉内容.投诉类型 = '信息泄露' AND 涉及服务不及时、无人照护的投诉内容及次数、投诉人名称、投诉事由（乱收费/乱收保证金）、涉事部门、关于推诿扯皮的投诉内容.处理结果
    = '成立'
  description: 若投诉统计中明确存在信息泄露类投诉且经查属实，即可判定为招标人向特定投标人泄露应当保密的招标信息。如能获得技术方案相似度数据，可补充‘中标人技术方案与招标人内部资料相似度>90%’作为辅助判定。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 招标人向特定投标人泄露招标信息
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十二条\",\n    \"内容概述\": \"招标人不得向他人透露已获取招标文件的潜在投标人的名称、数量以及可能影响公平竞争的有关招标投标的其他情况。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十一条\",\n    \"内容概述\": \"禁止招标人与投标人串通投标，包括招标人"
