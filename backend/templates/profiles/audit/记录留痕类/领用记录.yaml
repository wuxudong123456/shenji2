name: audit/记录留痕类/领用记录
type: model
description: 从记录留痕类类文档（领用记录）中提取结构化元数据。涵盖字段如：发票代码、发票号码、审批人、开票方纳税识别号、数量、日期、物料编码、用途。文档范围包括：原材料领用记录、库房领用记录、税务机关发票领用记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 审批
- 票据
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 领用记录
  member_count: 1
  member_details:
  - 原材料领用记录
  - 库房领用记录
  - 税务机关发票领用记录
output:
  fields:
  - name: 发票代码
    type: string
    description: 提取 发票代码 的文本值
  - name: 发票号码
    type: string
    description: 提取 发票号码 的文本值
  - name: 审批人
    type: string
    description: 提取 审批人 的文本值
  - name: 开票方纳税识别号
    type: string
    description: 提取 开票方纳税识别号 的文本值
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 日期
    type: date
    description: 提取 日期 的日期值，格式 YYYY-MM-DD
  - name: 物料编码
    type: string
    description: 提取 物料编码 的文本值
  - name: 用途
    type: string
    description: 提取 用途 的文本值
  - name: 领料单号
    type: string
    description: 提取 领料单号 的文本值
  - name: 领用人
    type: string
    description: 提取 领用人 的文本值
  - name: 领用物品
    type: string
    description: 提取 领用物品 的文本值
  - name: 领用状态
    type: boolean
    description: 提取 领用状态 的布尔值（是/否）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (支出明细账.摘要 LIKE '%礼品%' || 购物发票.品名 IN ('购物卡','提货券','高档茶叶','高档酒','燕窝')) && 支出明细账.金额 > 500 && 支出明细账.会计科目 != '工会经费'
    && 库房领用记录.用途 != '职工慰问'
  description: 通过费用摘要或发票品名识别礼品类支出，单笔金额高于500元（可调整），且排除工会正常福利和员工慰问，若与接待清单时间、对象有关联，则判定为赠送。
  audit_item: 公务接待管理不符合规定
  suspicion: 在公务接待中赠送礼品或礼金
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"不得以任何名义赠送礼金、有价证券、纪念品和土特产品等。\"\n  }\n]"
- expression: 验真结果、开票单位、开票方纳税识别号.验真结果 != '真实' OR (验真结果、开票单位、开票方纳税识别号.开票方纳税识别号 != 交易合同.纳税识别号 AND 交易合同.签约方类型 != '个人' AND 发票及附件.金额
    > 5000)
  description: 发票验真结果为假票，或开票方纳税识别号与任意有效合同签约方均不匹配且金额较大（>5000元），表明发票可能来自非法渠道，属代开、虚开发票。
  audit_item: 未按照规定填制、取得原始凭证或者填制、取得的原始凭证不符合规定
  suspicion: 使用未按法定渠道取得的发票报销入账
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国发票管理办法\",\n    \"法规文号\": \"国务院令第587号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"不符合规定的发票，不得作为财务报销凭证，任何单位和个人有权拒收。\"\n  }\n]"
