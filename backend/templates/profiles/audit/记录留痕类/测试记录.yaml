name: audit/记录留痕类/测试记录
type: model
description: 从记录留痕类类文档（测试记录）中提取结构化元数据。涵盖字段如：备份对象、备份类型、备份结果、恢复验证结果、故障定位、植被存活率、测试时间、自愈。文档范围包括：备份系统测试记录、现场功能测试记录、现场设施运行测试记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 测试记录
  member_count: 1
  member_details:
  - 备份系统测试记录
  - 现场功能测试记录
  - 现场设施运行测试记录
output:
  fields:
  - name: 备份对象
    type: string
    description: 提取 备份对象 的文本值
  - name: 备份类型
    type: string
    description: 提取 备份类型 的文本值
  - name: 备份结果
    type: boolean
    description: 提取 备份结果 的布尔值（是/否）
  - name: 恢复验证结果
    type: boolean
    description: 提取 恢复验证结果 的布尔值（是/否）
  - name: 故障定位
    type: string
    description: 提取 故障定位 的文本值
  - name: 植被存活率
    type: string
    description: 提取 植被存活率 的文本值
  - name: 测试时间
    type: date
    description: 提取 测试时间 的日期值，格式 YYYY-MM-DD
  - name: 自愈
    type: string
    description: 提取 自愈 的文本值
  - name: 设备运行状态
    type: boolean
    description: 提取 设备运行状态 的布尔值（是/否）
  - name: 遥控等功能实际测试通过情况
    type: string
    description: 提取 遥控等功能实际测试通过情况 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ( 策略版本缺失=true ) OR ( 验收报告缺失=true ) OR ( 统计表.恢复失败次数 > 0 ) OR ( 记录表.校验完整性状态='异常' )
  description: 1. 策略文档或验收报告缺失直接判定违规；2. 测试记录中恢复失败次数≥1表明灾难恢复能力不可靠；3. 备份数据完整性校验异常代表备份数据不可用。满足任一条件即触发疑点。
  audit_item: 网络安全建设方面存在的问题
  suspicion: 未按规定开展灾难备份建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国网络安全法\",\n    \"法规文号\": \"主席令第53号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十一条\",\n    \"内容概述\": \"网络运营者应当采取数据分类、重要数据备份和加密等措施。\"\n  },\n  {\n    \"法规名称\": \"信息安全技术 信息系统灾难恢复规范\",\n    \"法规文号\"\
    : \"GB/T 20988-2007\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"第6章 灾难恢复需求的确定、第7章 灾难恢复策略的制定\",\n    \"内容概述\": \"信息系统应根据业务影响分析确定"
- expression: ( ( 进度表.各类智能终端实际安装数量 / 研究报告.终端设备安装数量目标 ) < 0.9 ) || ( 进度表.功能投运率 < 1 ) && ( 计划投运日期 <= 当前日期 )
  description: 以可研报告批准的数量和时间为基准，若实际安装完成率低于计划的90%，或已到投运日期但关键功能（如馈线自动化、远程抄表）未全部投运，均视为进度缓慢。偏差10%考虑了正常的实施弹性。
  audit_item: 农村电网巩固提升工程存在短板
  suspicion: 智能配电网建设项目进度严重滞后
  regulation: "[\n  {\n    \"法规名称\": \"国家能源局关于加快推进配电自动化和智能用电信息采集系统建设的通知\",\n    \"法规文号\": \"国能电力〔2016〕290号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"要求按规划稳步推进配电自动化和智能用电信息采集系统建设，确保智能配电网建设任务按期完成。\"\n  }\n]"
- expression: (管护制度.管护责任主体 = '无' || 明细表.支出金额(万元) / 工程总投资 < 0.02) && (测试记录.设备运行状态（正常/损坏） = '损坏' || 测试记录.植被存活率 < 0.6) && (明细表.支出项目（人工、电费、维修）
    NOT LIKE '%运维%')
  description: 该表达式构建了‘制度资金-设施状态’的判定链。首先，管护制度缺失或年运维资金占工程总投资的比例低于2%（表明‘重建设轻管理’）；其次，现场测试发现治理设施（如曝气机、污水站）已损坏或生态修复植物大面积死亡（存活率<60%）；最后，资金审查发现存在无任何运维费用支出的情况。三者同时成立，判定为‘管护不到位’。
  audit_item: 农村黑臭水体治理不到位
  suspicion: 治理工程建成后管护缺失失效
  regulation: "[\n  {\n    \"法规名称\": \"关于深化农村基础设施管护体制改革的指导意见\",\n    \"法规文号\": \"发改农经〔2019〕1645号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、(六)、四、(九)\",\n    \"内容概述\": \"要合理确定管护主体和管护责任，落实管护资金。建立健全农村基础设施管护评价体系，将管护工作成效纳入地方相关领域考核体系。建立差异化的管护投入机制，对非经营性设施，政府应给予适当的管护资金保障。\"\
    \n  }\n]"
