name: audit/记录留痕类/宣传记录
type: model
description: 从记录留痕类类文档（宣传记录）中提取结构化元数据。涵盖字段如：发布时间、宣传方式、覆盖区域。文档范围包括：供电部门政策宣传记录、宣传记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 宣传记录
  member_count: 1
  member_details:
  - 供电部门政策宣传记录
  - 宣传记录
output:
  fields:
  - name: 发布时间
    type: date
    description: 提取 发布时间 的日期值，格式 YYYY-MM-DD
  - name: 宣传方式
    type: string
    description: 提取 宣传方式 的文本值
  - name: 覆盖区域
    type: string
    description: 提取 覆盖区域 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 主体清单.地址 > 0 && (统计表.是否享受优惠 / 主体清单.地址) < 0.5 && 宣传记录.宣传方式 = NULL
  description: 区域内农业主体享受电价优惠的覆盖率低于50%，且供电部门无法提供有效的政策宣传证明材料，表明宣传责任不到位，导致政策落地盲区。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业电价优惠政策宣传缺位致农户未受益
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"行政机关应当主动公开涉及公共利益、需要公众广泛知晓的政策信息，提高政策到达率。\"\n  }\n]"
- expression: (统计表.农业总用户数 > 0 AND 统计表.享受优惠户数 / 统计表.农业总用户数 < 0.5) AND (宣传记录.宣传方式 = FALSE OR 宣传记录.覆盖区域 != 统计表.农业总用户数) AND 政策生效时间距今
    > 6个月
  description: 政策发布超过6个月后，区域内农业用电优惠享受率低于50%，且供电部门无法提供有效的政策宣传记录，说明宣传普及不到位，导致农户因不知情未能享受。可根据当地情况设定阈值，如偏远地区享受率低于30%为严重。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业用电优惠政策宣传不到位导致农户未享受
  regulation: "[\n  {\n    \"法规名称\": \"政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第六条\",\n    \"内容概述\": \"行政机关应当及时、准确地公开政府信息，发现影响或者可能影响社会稳定、扰乱社会管理秩序的虚假或者不完整信息的，应当发布准确的政府信息予以澄清。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于做好农业生产用电价格政策落实工作的通知\",\n    \"法规文号\": \"发改价格〔2021〕XXX号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"\
    内容概"
