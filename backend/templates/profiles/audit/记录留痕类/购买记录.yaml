name: audit/记录留痕类/购买记录
type: model
description: 从记录留痕类类文档（购买记录）中提取结构化元数据。涵盖字段如：购买单位、购买时间、门票类型。文档范围包括：景区门票购买记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 购买记录
  member_count: 1
  member_details:
  - 景区门票购买记录
output:
  fields:
  - name: 购买单位
    type: string
    description: 提取 购买单位 的文本值
  - name: 购买时间
    type: date
    description: 提取 购买时间 的日期值，格式 YYYY-MM-DD
  - name: 门票类型
    type: string
    description: 提取 门票类型 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 公务接待明细台账.接待场所名称 IN (A级景区名录) && (公务活动方案.考察内容 IS NULL || 公务活动方案.考察内容 NOT LIKE '%景区管理%' || 公务活动方案.考察内容 NOT LIKE
    '%生态保护%') && (费用报销凭证.费用明细 CONTAINS '门票' || 费用报销凭证.费用明细 CONTAINS '导游费')
  description: 当接待场所为A级景区，且活动方案中缺少与景区管理或生态环保等职能直接相关的实质考察内容，同时费用凭证中出现门票、导游费等旅游特征消费时，判定为变相旅游疑点。
  audit_item: 公务接待管理不符合规定
  suspicion: 在A级景区开展公务考察涉嫌变相旅游
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"接待单位不得超标准接待，不得组织旅游和与公务活动无关的参观，不得组织到营业性娱乐、健身场所活动。\"\n  }\n]"
