name: audit/记录留痕类/验收记录
type: model
description: 从记录留痕类类文档（验收记录）中提取结构化元数据。涵盖字段如：不合格项、不合格项闭环记录、交付使用日期、位置、关键尺寸偏差、分部分项验收记录、到货验收数量、品牌。文档范围包括：农村客运站点建设验收记录、农村集体资产清产核资验收记录、图书采购验收记录、安全防护设施验收记录、工程质量验收记录、文化设施设备采购合同验收记录、材料进场验收记录、消防设施验收记录、消防验收记录、电力设备验收记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 工程
- 整改
- 检查
- 采购
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 验收记录
  member_count: 1
  member_details:
  - 农村客运站点建设验收记录
  - 农村集体资产清产核资验收记录
  - 图书采购验收记录
  - 安全防护设施验收记录
  - 工程质量验收记录
  - 文化设施设备采购合同验收记录
  - 材料进场验收记录
  - 消防设施验收记录
  - 消防验收记录
  - 电力设备验收记录
  - 竣工验收记录
  - 设备采购验收记录
  - 设施设备采购验收记录
  - 质量验收记录
  - 隐蔽工程验收记录
  - 食堂采购验收记录
  - 验收记录
