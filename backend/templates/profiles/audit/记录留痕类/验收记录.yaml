violations:
- expression: (ABS(签证单.工程量 - 踏勘记录.尺寸) > 0) || (验收记录.验收部位 != 签证单.签证内容) || (日志.施工内容 != 签证单.签证内容 && 日志.旁站记录 IS NULL)
  description: 签证工程量与实际核查工程量存在正偏差即判定为虚假；隐蔽验收记录部位与签证部位不匹配，或施工日志无对应记录且监理未旁站，均表明签证内容虚假。若工程量虚增比例>15%，属于严重虚报冒领。
  audit_item: 工程变更审计评估
  suspicion: 虚假工程变更套取建设资金
  regulation: "[\n  {\n    \"法规名称\": \"建设项目审计处理暂行规定\",\n    \"法规文号\": \"审投发[1996]105号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"建设项目不突破设计概算，对超出设计概算的投资，审计中发现有高估冒算、虚假签证等行为的，应当予以核减，并按规定处理。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"单位和个人有下列骗取财政资金"
- expression: (验收记录.验收日期 为空) || (验收记录.施工单位签字 == 监理单位签字) || (验收记录.验收日期 < 施工日志.完成时间) || (旁站记录.旁站部位 不含 验收记录.验收部位 && 日志.验收参与记录
    不存在)
  description: 隐蔽工程验收记录缺失最直接的表现是验收日期为空；代签表现为施工单位与监理单位为同一人签字；验收日期早于施工完成日期属逻辑异常；监理未对关键部位进行旁站或日志中无相应验收参与记载，则该验收记录真实性存疑。上述任一条件成立均触发疑点。
  audit_item: 工程质量事故调查
  suspicion: 隐蔽工程验收记录缺失或代签
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第三十条\",\n    \"内容概述\": \"施工单位必须建立、健全施工质量的检验制度，严格工序管理，作好隐蔽工程的质量检查和记录。隐蔽工程在隐蔽前，施工单位应当通知建设单位和建设工程质量监督机构。\"\n  },\n  {\n\
    \    \"法规名称\": \"建设工程监理规范\",\n    \"法规文号\": \"GB/T 50319-2013\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"5.2.11\",\n\
    \    \"内容概"
- expression: 材料进场验收记录.规格 != 施工图纸.设计要求规格 || 材料检测报告.检测结果 < 设计标准要求强度 || 隐蔽工程验收记录.现场配置 与 施工图纸不一致 || 监理日志中明确记录‘材料未检先用’‘规格不符’等
  description: 任何材料规格、等级不符合设计要求，或检测报告显示强度、厚度等核心指标不达标，均视为偷工减料。合同通常规定降级使用需经设计确认，无设计确认的降级使用直接触发违规。
  audit_item: 重大工程项目全过程审计
  suspicion: 施工过程中偷工减料或使用不合格材料
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十八条、第二十九条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。施工单位在施工过程中发现设计文件和图纸有差错的，应当及时提出意见和建议。施工单位必须按照工程设计要求、施工技术标准和合同约定，对建筑材料、建筑构配件、设备和商品混凝土进行检验，检验应当有书面记录和专人签字；未经检验或者检验不合格的，不得使用。\"\
    \n  }\n]"
- expression: （安全防护设施验收记录.实测数据 < 安全专项施工方案.防护等级要求） || （安全专项施工方案.材料规格 != 材料进场验收台账.规格型号） || （监理安全巡视记录.发现问题描述 包含 '防护缺失'/'未按方案设置'/'材质不符'
    且 复查情况 == '未整改'） || （现场影像资料.防护设施实际情况 明显与 安全专项施工方案.防护措施清单 不一致）
  description: 判定规则：1）防护设施验收实测数据低于方案设计标准，安全冗余不足；2）进场材料规格与方案要求型号不符，降低防护强度；3）监理发现防护问题且未整改闭环，表明隐患持续存在；4）影像资料直观反映现场与方案描述不一致。任一条件成立即列为疑点。
  audit_item: 重大工程项目风险预警
  suspicion: 施工现场安全防护措施与方案严重不符
  regulation: "[\n  {\n    \"法规名称\": \"建设工程安全生产管理条例\",\n    \"法规文号\": \"国务院令第393号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"施工单位必须在施工现场采取维护安全、防范危险、预防火灾等措施；应当根据建设工程的施工特点、范围，对施工现场易发生重大事故的部位、环节进行监控，制定施工现场生产安全事故应急救援预案。防护设施必须按方案搭设并经验收合格方可使用。\"\
    \n  }\n]"
- expression: (食堂采购清单.食材名称 IN ('海参','燕窝','鲍鱼','高档海鲜','高档茶叶') && 食堂采购清单.单价 > 食材价格对比分析表.市场同期均价 * 1.5) || (食材价格对比分析表.差异率 > 0.5)
    || (领用台账.领用人 NOT IN 食堂工作人员清单 && 领用台账.用途 != '员工正常餐饮') || (食堂采购清单.食材名称 LIKE '%生鲜食材%' && 单价异常高)
  description: 筛查食堂采购的高档食材且价格显著高于市场价，或领用记录显示领导个人领用，或采购品名刻意模糊但单价过高。设定价格偏差超过50%或直接购入高档食材即触发异常，需追溯实际使用去向。
  audit_item: 其他违反中央八项规定及其实施细则精神问题
  suspicion: 食堂高价采购高档食材用于隐性公款吃喝
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第十三条、第十四条\",\n    \"内容概述\": \"严禁用公款大吃大喝或安排与公务无关的宴请；不得提供高档菜肴和用野生保护动物制作的菜肴，不得提供高档烟酒。\"\n  }\n]"
- expression: 设施台账.已建成数量 < 建设计划.计划安装数量 * 0.9 || 验收记录.验收合格数量 < 建设计划.计划安装数量
  description: 实际建成并验收合格的数量低于计划建设数量的90%，或验收合格数量低于计划数，即认定为未完成建设任务。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 计量设施建设任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"三、建立健全农业水价形成机制（七）\",\n    \"内容概述\": \"新建、改扩建工程要同步建设计量设施；尚未配备计量设施的已建工程要抓紧改造。各地要加快配套完善计量设施建设，确保计量供水收费基础。\"\
    \n  }\n]"
- expression: 验收记录.验收状态='已验收' && (设施台账.近6个月数据上传次数=0 || 设施台账.月均用电量=0)
  description: 已完成验收的计量设施，若近6个月无任何数据上传或无用电记录，说明设施处于闲置或停用状态。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 计量设施建成后闲置未投入使用
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"三、建立健全农业水价形成机制（七）\",\n    \"内容概述\": \"加强计量设施的运行维护和管理，确保其正常运行，为实行计量收费奠定坚实基础。\"\n  }\n]"
- expression: (明细表.发放金额 > 0) && (核实记录.是否实际安装 == '否' || 验收记录.验收状态 == '不合格')
  description: 补助资金已发放到户，但入户核实该户厕具未安装、未投入使用或验收不通过，即判定为“发钱代改”。
  audit_item: 厕所改造实施不规范、质量不达标
  suspicion: 以发放补助资金代替实质性改厕
  regulation: "[\n  {\n    \"法规名称\": \"农村改厕专项资金管理办法\",\n    \"法规文号\": \"财农〔2019〕18号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"补助资金必须专项用于改厕设备和建设，严禁截留、挪用和以拨代支。\"\n  }\n]"
- expression: (关键尺寸偏差 > 5%) || (整改清单.出现频次 > 3) || (基础夯实检测 = '' && 发生塌陷)
  description: 验收实测尺寸与图纸偏差超5%、同一施工队反复出现质量问题、或无故缺失基础夯实记录且后期塌陷，均视为施工不规范疑点。
  audit_item: 厕所改造实施不规范、质量不达标
  suspicion: 厕所安装施工不规范
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十八条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。\"\n  }\n]"
- expression: (预期年度效益.实际完成工程量及建筑物清单 != 预期年度效益.批复建设内容) && (变更申请事项.审批批复结论 != '批准')
  description: 通过比对竣工验收的实际建设内容与上级批复的可行性研究报告、初步设计中的规划内容，识别任何差异项。针对每一项差异，必须能在变更批复文件中找到对应的审批记录且结果为“批准”，否则即判定为擅自变更。
  audit_item: 大中型灌区规划、建设不符合相关规定
  suspicion: 未经批准擅自变更建设内容
  regulation: "[\n  {\n    \"法规名称\": \"水利工程建设程序管理暂行规定\",\n    \"法规文号\": \"水利部水建〔2017〕323号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十三条\",\n    \"内容概述\": \"重大设计变更应当报原审批部门批准。未经批准，任何单位和个人不得擅自变更。\"\n  }\n]"
- expression: (核查表.计算所得人均面积 < 3) || (分配记录.实住学生姓名 > 核查台账.实有床位数) || (核查台账.卫生间及淋浴间数量 / 核查表.寄宿生总人数 > 15)
  description: 判定逻辑：1）根据国家基础标准，寄宿制学校生均宿舍面积不得低于3平方米，小于该阈值即违规；2）对比床位分配记录中的实际住宿学生数与台账登记的实有床位数，若学生数大于床位数，说明存在超标住宿；3）公共卫生设施服务人数比超过15人/个，视为生活设施不达标。
  audit_item: 工作开展不到位
