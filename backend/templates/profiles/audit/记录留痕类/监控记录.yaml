name: audit/记录留痕类/监控记录
type: model
description: 从记录留痕类类文档（监控记录）中提取结构化元数据。涵盖字段如：关键时间点温湿度数据、异常报警记录、日期时间、温度、湿度、监控录像覆盖时段、监控点位、签到记录时间戳。文档范围包括：培训过程监控记录、疫苗储存温湿度监控记录、资源库温湿度监控记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 监控记录
  member_count: 1
  member_details:
  - 培训过程监控记录
  - 疫苗储存温湿度监控记录
  - 资源库温湿度监控记录
output:
  fields:
  - name: 关键时间点温湿度数据
    type: date
    description: 提取 关键时间点温湿度数据 的日期值，格式 YYYY-MM-DD
  - name: 异常报警记录
    type: string
    description: 提取 异常报警记录 的文本值
  - name: 日期时间
    type: date
    description: 提取 日期时间 的日期值，格式 YYYY-MM-DD
  - name: 温度
    type: string
    description: 提取 温度 的文本值
  - name: 湿度
    type: string
    description: 提取 湿度 的文本值
  - name: 监控录像覆盖时段
    type: string
    description: 提取 监控录像覆盖时段 的文本值
  - name: 监控点位
    type: string
    description: 提取 监控点位 的文本值
  - name: 签到记录时间戳
    type: date
    description: 提取 签到记录时间戳 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ((监测表.监测时间 > 规定监测频率（如每季度/半年/1年）、繁殖更新周期标准（如3年/5年）.规定监测频率（如每季度/半年/1年） * 3) || (对比表.实际更新日期 - 对比表.计划更新日期 > 365天))
    && (操作记录.休眠期标注 IS NULL || 监测表.异常情况 == '无')
  description: 判定规则：一是监测频率违规，若连续2个规定周期以上（如规定1年1次，则间隔大于3年即为3个周期）没有监测记录，且在操作记录中无休眠期或特殊情况说明；二是繁殖更新逾期，实际更新日期比计划更新日期晚于1年。满足以上任一条件，同时排除种子休眠、保存环境异常等客观技术原因后，即视为工作不及时。
  audit_item: 种质资源保护利用方面不符合相关规定
  suspicion: 入库种质资源监测更新周期严重滞后
  regulation: "[\n  {\n    \"法规名称\": \"《农作物种质资源管理办法》\",\n    \"法规文号\": \"中华人民共和国农业部令第30号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十条\",\n    \"内容概述\": \"种质资源库应当对保存的种质资源定期进行监测，及时进行繁殖更新，保证种质资源的活力和遗传完整性。\"\n  },\n  {\n    \"法规名称\": \"《国家级畜禽遗传资源保护名录管理办法》\"\
    ,\n    \"法规文号\": \"中华人民共和国农业部公告第2061号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"相关技术规范条款\",\n    \"内容概述\": "
- expression: (监控记录.温度（℃） < 2 OR 监控记录.温度（℃） > 8) OR (单据.途中温度记录 IS NULL OR 单据.途中温度记录中有空白断点) OR (采购合同.GMP证书编号 IS NULL)
  description: 口蹄疫等强制免疫疫苗要求2-8℃冷藏，储存温度任一时刻超出此区间即判违规；运输过程必须全程、无断点记录温度，无记录或断点视为冷链断裂；供应商须具备兽药GMP证书，无资质则采购源头不合规。
  audit_item: 落实动物防疫不到位
  suspicion: 强制免疫疫苗采购储运冷链断裂
  regulation: "[\n  {\n    \"法规名称\": \"兽药管理条例\",\n    \"法规文号\": \"国务院令第726号（2020年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条、第二十七条\",\n    \"内容概述\": \"兽药经营企业应当遵守兽药经营质量管理规范，建立仓储保管制度；运输兽药应当采取保护措施，确保兽药质量。\"\n  },\n  {\n    \"法规名称\": \"\
    兽用生物制品经营管理办法\",\n    \"法规文号\": \"农业部令2017年第3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"兽用生物制品在运输、储"
- expression: 实际上课总时长 < 规定总课时 * 0.85 || 参训台账.实际出勤课时 < 规定总课时 * 0.8 || ABS(参训台账.签到记录时间戳 - 监控记录.监控录像覆盖时段) > 15%
  description: 政策规定某职业培训最低课时（如120课时），实际完成不足85%或平均出勤低于80%属严重缩水；考勤与监控记录偏差超过15%涉嫌伪造考勤，可据此追回补贴。
  audit_item: 职业培训政策执行不到位
  suspicion: 职业培训实际时长未达规定标准
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规范性文件\",\n    \"\
    条款号\": \"第十条、第十六条\",\n    \"内容概述\": \"享受培训补贴的机构须按规定的课程和课时完成培训，对弄虚作假、虚报冒领行为将追回资金并追究责任。\"\n  }\n]"
