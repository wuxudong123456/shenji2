name: audit/记录留痕类/理赔记录
type: model
description: 从记录留痕类类文档（理赔记录）中提取结构化元数据。涵盖字段如：养殖场名称、出险报案日期、定损完成日期、平均理赔周期、承保机构名称、投保人、报案日期、拒赔原因。文档范围包括：保险理赔记录、农业保险投保理赔记录、农业保险理赔记录、投保理赔记录、车辆保险理赔记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 金额
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 理赔记录
  member_count: 1
  member_details:
  - 保险理赔记录
  - 农业保险投保理赔记录
  - 农业保险理赔记录
  - 投保理赔记录
  - 车辆保险理赔记录
output:
  fields:
  - name: 养殖场名称
    type: string
    description: 提取 养殖场名称 的文本值
  - name: 出险报案日期
    type: date
    description: 提取 出险报案日期 的日期值，格式 YYYY-MM-DD
  - name: 定损完成日期
    type: date
    description: 提取 定损完成日期 的日期值，格式 YYYY-MM-DD
  - name: 平均理赔周期
    type: string
    description: 提取 平均理赔周期 的文本值
  - name: 承保机构名称
    type: string
    description: 提取 承保机构名称 的文本值
  - name: 投保人
    type: string
    description: 提取 投保人 的文本值
  - name: 报案日期
    type: date
    description: 提取 报案日期 的日期值，格式 YYYY-MM-DD
  - name: 拒赔原因
    type: string
    description: 提取 拒赔原因 的文本值
  - name: 理赔原因
    type: string
    description: 提取 理赔原因 的文本值
  - name: 理赔时间
    type: date
    description: 提取 理赔时间 的日期值，格式 YYYY-MM-DD
  - name: 理赔次数
    type: string
    description: 提取 理赔次数 的文本值
  - name: 理赔金额
    type: number
    description: 提取 理赔金额 的数值（含单位，如万元、吨等）
  - name: 理赔金额到位率
    type: number
    description: 提取 理赔金额到位率 的数值（含单位，如万元、吨等）
  - name: 病死畜禽理赔数量
    type: number
    description: 提取 病死畜禽理赔数量 的数值（含单位，如万元、吨等）
  - name: 结案日期
    type: date
    description: 提取 结案日期 的日期值，格式 YYYY-MM-DD
  - name: 赔付金额
    type: number
    description: 提取 赔付金额 的数值（含单位，如万元、吨等）
  - name: 险种
    type: string
    description: 提取 险种 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (统计表.实保面积 / 统计表.应保面积) < 0.8 || 明细表.资金最终流向 不属于 (基地建设相关支出)
  description: 制种保险覆盖率低于80%判为政策落实不到位，存在信贷资金被挪用至非基地建设用途直接触发违规；若承诺的贴息资金长期未拨付，同样视为未落实。
  audit_item: 国家种子生产基地建设方面不符合相关规定
  suspicion: 基地建设信贷、保险扶持政策未有效落实
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"中华人民共和国主席令第35号(2015年修订)\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第六十二条\",\n    \"内容概述\": \"国家加大对种业发展的支持，对品种选育、生产、示范推广、种质资源保护、种子储备以及制种大县给予扶持。\"\n  }\n]"
- expression: (理赔记录.结案日期 - 理赔记录.出险报案日期) > 规定.法定最长理赔周期 || (理赔台账.赔款支付日期 - 理赔台账.定损完成日期) > 10个工作日
  description: 从农户报案到保险公司结案或实际支付赔款的时间超过《农业保险条例》规定的“达成赔偿协议后10日内支付”或地方规定的整体时限（如60天），构成理赔延迟。
  audit_item: 相关支持政策落实不到位
  suspicion: 政策性农业保险理赔严重超时限
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"保险机构应当在与被保险人达成赔偿协议后10日内，将应赔偿的保险金支付给被保险人。\"\n  }\n]"
- expression: (理赔记录.结案日期 - 理赔记录.报案日期 > 政策文件.理赔时限要求) OR (理赔记录.按时结案量 = '已核定' AND 理赔记录.结案日期 IS NULL AND 当前日期 - 理赔记录.定损完成日期 >
    15) OR (理赔记录.拒赔原因 LIKE '%管理不善%' AND 理赔记录.理赔申请量 IN ('台风','洪水','霜冻') AND 政策文件.覆盖范围要求)
  description: 结案周期超过政策规定的最大时限（如15个工作日）可直接判违；已完成定损但长期不结案的（超15天）也属违规；以“管理不善”等理由拒赔自然灾害导致的损失，涉嫌违规拒赔。
  audit_item: 相关支持政策落实不到位
  suspicion: 政策性农业保险理赔拖延处理
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十二条\"\
    ,\n    \"内容概述\": \"保险机构应当按照合同约定及时足额支付保险金，对达成赔偿协议的应在10日内支付赔款。\"\n  },\n  {\n    \"法规名称\": \"中央财政农业保险保险费补贴管理办法\",\n    \"\
    法规文号\": \"财金〔2016〕123号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十条\",\n    \"内容概述\": \"经办机构不得以不正当理由拖延赔付，应严格执行定损理赔时限要"
- expression: (疫情报告.报告时间 - 疫情报告.疫情发现时间 > 24h) OR (处理台账.病死畜禽种类及数量 > 疫情报告.死亡数量) OR (理赔记录.病死畜禽理赔数量 > 疫情报告.死亡数量 * 1.2)
  description: 报告时间超过发现时间24小时为迟报；无害化处理台账中某养殖场处理数量明显大于已上报疫情死亡数量，且差异超过20%，存在瞒报可能；保险理赔死亡数量若显著高于官方报告死亡数量（超出20%），疑似谎报或漏报。
  audit_item: 落实动物防疫不到位
  suspicion: 瞒报谎报迟报动物疫情
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国动物防疫法\",\n    \"法规文号\": \"主席令第69号（2021年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"从事动物疫病监测、检测、检验检疫、研究、诊疗以及动物饲养、屠宰、捕捞、隔离、运输等活动的单位和个人，发现动物染疫或者疑似染疫的，应当立即向所在地动物疫病预防控制机构或者动物防疫主管部门报告。\"\
    \n  },\n  {\n    \"法规名称\": \"重大动物疫情应急条例\",\n    \"法规文号\": \"国务院令第450号\",\n    \"效力级别\": \"行政法规\",\n    \"条"
