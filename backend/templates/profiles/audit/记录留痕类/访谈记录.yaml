name: audit/记录留痕类/访谈记录
type: model
description: 从记录留痕类类文档（访谈记录）中提取结构化元数据。涵盖字段如：企业反馈收费依据、借款人是否自愿缴纳、关系描述、反映是否被强制收费、反映选举公开性的证言、回收网点便利性反馈、回收补贴实际发放情况、因周期不足导致的遗留工作说明。文档范围包括：关键人员访谈记录、农户访谈记录、审计访谈记录、科研人员访谈记录、访谈记录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 记录留痕类
- 审计
- 拨款
- 补贴
- 金额
- 项目
- 元数据提取
template_class:
  category: 记录留痕类
  member_types:
  - 访谈记录
  member_count: 1
  member_details:
  - 关键人员访谈记录
  - 农户访谈记录
  - 审计访谈记录
  - 科研人员访谈记录
  - 访谈记录
output:
  fields:
  - name: 企业反馈收费依据
    type: number
    description: 提取 企业反馈收费依据 的数值（含单位，如万元、吨等）
  - name: 借款人是否自愿缴纳
    type: number
    description: 提取 借款人是否自愿缴纳 的数值（含单位，如万元、吨等）
  - name: 关系描述
    type: string
    description: 提取 关系描述 的文本值
  - name: 反映是否被强制收费
    type: number
    description: 提取 反映是否被强制收费 的数值（含单位，如万元、吨等）
  - name: 反映选举公开性的证言
    type: string
    description: 提取 反映选举公开性的证言 的文本值
  - name: 回收网点便利性反馈
    type: string
    description: 提取 回收网点便利性反馈 的文本值
  - name: 回收补贴实际发放情况
    type: string
    description: 提取 回收补贴实际发放情况 的文本值
  - name: 因周期不足导致的遗留工作说明
    type: string
    description: 提取 因周期不足导致的遗留工作说明 的文本值
  - name: 实际到账金额
    type: number
    description: 提取 实际到账金额 的数值（含单位，如万元、吨等）
  - name: 实际研发进度
    type: string
    description: 提取 实际研发进度 的文本值
  - name: 强制捆绑情况
    type: string
    description: 提取 强制捆绑情况 的文本值
  - name: 成果名称
    type: string
    description: 提取 成果名称 的文本值
  - name: 拨款及时性
    type: number
    description: 提取 拨款及时性 的数值（含单位，如万元、吨等）
  - name: 是否保管银行卡
    type: boolean
    description: 提取 是否保管银行卡 的布尔值（是/否）
  - name: 是否被诱导或被强制
    type: boolean
    description: 提取 是否被诱导或被强制 的布尔值（是/否）
  - name: 村医自述年-月实际到手补助金额
    type: number
    description: 提取 村医自述年-月实际到手补助金额 的数值（含单位，如万元、吨等）
  - name: 群众佐证
    type: string
    description: 提取 群众佐证 的文本值
  - name: 转化障碍描述
    type: string
    description: 提取 转化障碍描述 的文本值
  - name: 退还障碍
    type: string
    description: 提取 退还障碍 的文本值
  - name: 项目编号
    type: string
    description: 提取 项目编号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (业务主管单位.业务主管单位 IS NOT NULL AND 业务主管单位.业务主管单位 包含 行政机关名称) OR (关系类型、脱钩状态.关系类型 IN ('主办', '主管', '联系', '挂靠') AND 关系类型、脱钩状态.脱钩状态
    != '已完成')
  description: 章程或登记证书中仍列示行政机关为业务主管单位，或关联关系对照表中标明存在主办、主管、联系、挂靠关系且脱钩状态未完成，即触发疑点。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 未取消主办主管挂靠关系
  regulation: "[\n  {\n    \"法规名称\": \"行业协会商会与行政机关脱钩总体方案\",\n    \"法规文号\": \"中办发〔2015〕39号\",\n    \"效力级别\": \"党内法规/规范性文件\"\
    ,\n    \"条款号\": \"第二条主要任务（一）机构分离\",\n    \"内容概述\": \"取消行政机关（包括下属单位）与行业协会商会的主办、主管、联系和挂靠关系，行业协会商会依法直接登记和独立运行。\"\n  }\n]"
- expression: 经费拨付与使用明细表.实际拨付金额 < 经费拨付与使用明细表.应拨付总额 && 经费拨付与使用明细表.拨付日期 - 经费保障政策文件.拨付时间要求 > 30 || 银行支付凭证.收款账户名称 = '乡镇卫生院' &&
    银行支付凭证.转账日期 - 当前日期 > 15 || 村医补助签收表.实发金额 < 经费保障政策文件.乡村医生岗位补助标准 || 访谈记录.拨款及时性 = '长期欠拨'
  description: 应拨付金额=辖区服务人口数×人均补助标准+乡村医生岗位补助。资金滞留、少拨、迟拨均构成经费保障不足。村医反映作为重要辅证。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 村卫生室公共卫生服务等经费拨付不足或被截留
  regulation: "[\n  {\n    \"法规名称\": \"基本公共卫生服务补助资金管理办法\",\n    \"法规文号\": \"财社〔2019〕113号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十条、第十二条\",\n    \"内容概述\": \"补助资金应当按照服务人口和人均标准足额安排并及时拨付，任何单位和个人不得克扣、截留、挪用。\"\n  },\n  {\n    \"法规名称\": \"\
    关于进一步加强乡村医生队伍建设的实施意见\",\n    \"法规文号\": \"国办发〔2015〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三、明确乡村医生功能和任务，建立乡村医生收入保障机制"
- expression: 银行卡号.实发金额 < 银行卡号.应发金额 && (资金最终流向账户与村干部关联性 > 0.7 || 取款网点 >= 5)
  description: 农户实际到手金额少于公示标准的，结合资金集中取现行为判定克扣；取款账户集中度指某一网点或ATM出现同一村多张卡同天取款，且取款人非农户本人，暗示被集中控制。
  audit_item: 监管不到位，惠农财政补贴资金被套取骗取、违规使用
  suspicion: 以收卡借卡代领方式克扣截留补贴
  regulation: "[\n  {\n    \"法规名称\": \"惠农补贴资金“一卡通”管理办法\",\n    \"法规文号\": \"各地实施办法\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\"\
    : \"通常含管理条款\",\n    \"内容概述\": \"补贴必须直接发放到户，严禁任何单位和个人代为保管银行卡、折，不得截留、抵扣补贴。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国农业法\",\n\
    \    \"法规文号\": \"主席令第74号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第六十五条\",\n    \"内容概述\": \"禁止截留、挪用粮食补贴等惠农资金。\"\n  }\n\
    ]"
- expression: 收取凭证.收费金额 > 0 AND (收取凭证.收费许可 = '无' OR 收取凭证.票据类型（是否财政票据） NOT 合规财政票据)
  description: 凡存在向农户收取办理‘一卡通’费用的，且无法提供合法收费许可或开具正规财政票据，即属违规收费。
  audit_item: 监管不到位，惠农财政补贴资金被套取骗取、违规使用
  suspicion: 村干部违规收取一卡通办理费用
  regulation: "[\n  {\n    \"法规名称\": \"关于治理向农民乱收费乱罚款和各种摊派问题的通知\",\n    \"法规文号\": \"国办发〔2002〕19号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二\",\n    \"内容概述\": \"严禁向农民收取没有法律法规依据的任何费用，金融机构应免费为农户办理补贴发放银行卡折。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国农业法\"\
    ,\n    \"法规文号\": \"主席令第74号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第六十七条\",\n    \"内容概述\": \"任何机关或者单位不得以任何方式向农民或者农业生产经"
- expression: 上报年度实际回收率、年度、目标回收率、实际完成回收率、差异值.实际完成回收率 < 政策要求年度回收率目标值、目标回收率.目标回收率
  description: 当年实际农膜回收率低于政策文件规定的目标回收率，即触发疑点。若偏差超过10个百分点，视为严重未达标，需重点核查统计真实性及回收体系建设情况。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 农膜回收利用率未达标
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"地方人民政府应当建立农用薄膜回收利用体系，确定回收目标，促进农用薄膜回收利用。未完成回收目标的，应依法追究相关责任。\"\n  }\n\
    ]"
- expression: (项目名称.计划执行周期（年） < 研究报告.常规育种标准周期（年） * 0.8) || (访谈记录.因周期不足导致的遗留工作说明 >= 2 && 访谈记录.实际研发进度 < 80%)
  description: 当科研项目的计划周期低于对应作物行业标准研发周期的80%时，判定为周期设置严重不足；或者项目出现2次及以上延期且结题时研发完成度低于80%，视为周期不匹配导致进度滞后。
  audit_item: 种业科技研发方面不符合相关规定
  suspicion: 科研项目支持周期与种业研发周期不匹配
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于深化中央财政科技计划（专项、基金等）管理改革的方案\",\n    \"法规文号\": \"国发〔2014〕64号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"第三条（优化整合各类科技计划）\",\n    \"内容概述\": \"科技计划应按照不同类型科学研究活动的特点和规律，实行分类管理，对基础研究、应用研究、试验发展等设置合理的项目实施周期，避免周期过短导致急功近利。\"\
    \n  }\n]"
- expression: 对照表.已转化数量 / 对照表.授权品种权/专利总数 < 30% || (成果授权后3年以上未转化的数量 / 对照表.授权品种权/专利总数 > 0.2) || (发明人收益分配比例 < 50% && 有转化收益但分配不到位)
    || (转化协议.转让/许可合同金额与转化协议.实际到账金额偏差 > 30%)
  description: 已授权品种权或专利的转化率（已转化数/授权总数）低于30%判定为转化不足；“抽屉成果”占比超过20%，即授权3年以上仍无任何转化记录，表明成果与市场脱节；发明人收益分配比例低于《促进科技成果转化法》规定的50%下限，或虽有政策但实际未兑现，视为激励机制缺失；合同金额明显虚高而实际到位率低（偏差>30%），可能存在虚假转化。
  audit_item: 种业科技研发方面不符合相关规定
  suspicion: 种业科研成果转化利用率低下
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国促进科技成果转化法\",\n    \"法规文号\": \"2015年修订版\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十三条、第四十四条\",\n    \"内容概述\": \"科技成果完成单位应当规定或者与科技人员约定奖励和报酬的方式和数额；未规定、也未约定的，将该项职务科技成果转让、许可给他人实施的，从该项科技成果转让净收入或者许可净收入中提取不低于百分之五十的比例，对完成、转化职务科技成果做出重要贡献的人员给予奖励和报酬。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"2021"
- expression: 任命文件.产生方式 != '民主选举' OR 选举记录.有效票数 / 选举记录.选举结果 < 2/3
  description: 职工代表应当通过职工代表大会民主选举产生，若任命文件中产生方式为直接指定、无选举记录或选举投票比例低于三分之二，则视为违规。
  audit_item: 住房公积金决策机构未按规定履职
  suspicion: 职工代表未经民主选举产生
  regulation: "[\n  {\n    \"法规名称\": \"《住房公积金管理条例》\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第八条\",\n    \"内容概述\": \"工会代表和职工代表占三分之一。职工代表应由职工推举产生，确保其能代表职工利益。\"\n  }\n]"
- expression: (贷款保证金收取退还台账.保证金收取金额 > 0) && ( (与房地产开发企业签订的按揭合作协议.约定保证金比例 IS NULL) || (与房地产开发企业签订的按揭合作协议.约定保证金比例 == 0) || (与房地产开发企业签订的按揭合作协议.合作楼盘名称
    IS NULL) ) || (贷款保证金收取退还台账.保证金收取金额 / 贷款保证金收取退还台账.贷款金额 > 与房地产开发企业签订的按揭合作协议.约定保证金比例) || (贷款保证金收取退还台账.未退余额 > 0 && (当前日期 -
    贷款保证金收取退还台账.约定退还日期) > 0)
  description: 筛查三类违规：1.无合同依据或合同未约定保证金却实际收取；2.收取金额超过合同约定比例上限；3.贷款结清后超过约定退还日期仍未退还保证金。设定阈值：收取比例上限以合同为准，无约定则视为禁止收取；超期退还判定以约定日期为红线，当前日期大于约定退还日期且余额大于零即触发。
  audit_item: 住房公积金管理机构违规收取费用
  suspicion: 违规向房地产开发企业收取贷款保证金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十条\",\n    \"内容概述\": \"住房公积金管理中心的管理费用，由住房公积金管理中心按照规定的标准编制全年预算支出总额，报本级人民政府财政部门批准后，从住房公积金增值收益中上交本级财政，由本级财政拨付。住房公积金管理中心不得向管理对象收取任何费用。\"\
    \n  },\n  {\n    \"法规名称\": \"关于发展住房公积金个人住房贷款业务的通知\",\n    \"法规文号\": \"建金[2014]148号\",\n    \"效力级别\""
- expression: (个人公积金贷款手续费收取明细表.手续费金额 > 0) && ( (住房公积金管理中心收费公示文件.公示收费项目 NOT EXISTS) || (手续费收取依据文件.文件文号 IS NULL) || (个人公积金贷款手续费收取明细表.收费名目
    NOT IN (住房公积金管理中心内部收费管理制度.允许收费项目清单) ) || (个人公积金贷款手续费收取明细表.手续费金额 != 0 && 公积金业务系统收费模块日志.收费触发方式 == '强制') )
  description: 触发条件：1.实际收取手续费但收费公示文件中未列示该项目；2.无法提供收费依据文件；3.收费名目不在合法收费清单内；4.业务系统日志显示强制跳过或自动扣费，但无借款人确认环节。重点筛查‘加急费’‘代办费’‘材料审核费’等非常规名目。
  audit_item: 住房公积金管理机构违规收取费用
  suspicion: 违规向个人收取贷款或提取手续费
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
