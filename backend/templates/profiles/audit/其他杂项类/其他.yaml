name: audit/其他杂项类/其他
type: model
description: 从其他杂项类类文档（其他）中提取结构化元数据。涵盖字段如：IP地址、NDVI时序曲线、一般性转移支付金额、三会召开频次规定、不同时期影像对比、不满意原因分类、与免费公开课相似度、专业技术人员配置要求。文档范围包括：不足100人小规模学校学生人数、专家简历、专职文化管理人员岗位职责、业主清册联系方式、业主签名、中央八项规定原文、中央八项规定实施细则原文、主管部门的维修资金减免政策依据、主要管理人员社保、书屋管理人员考勤等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 其他杂项类
- 审计
- 人员
- 付款
- 明细
- 金额
- 元数据提取
