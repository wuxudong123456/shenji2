  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财政部令第98号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第四十九条\",\n    \"内容概述\": \"原始凭证不得涂改、挖补。发现原始凭证有错误的，应当由开出单位重开或者更正，更正处应当加盖开出单位的公章。\"\n  }\n]"
- expression: 其他.错误类型 != '金额错误' AND (其他.是否加盖出具单位公章 = '否' OR 记录文件.审批意见 != '同意' OR 其他.更正方式 = '自行更正')
  description: 非金额错误允许更正，但必须由原出具单位更正并加盖公章，自行更正或未经审批均属违规。
  audit_item: 未按照规定填制、取得原始凭证或者填制、取得的原始凭证不符合规定
  suspicion: 原始凭证非金额错误未按规定更正
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财政部令第98号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"原始凭证有错误的，应当由出具单位重开或者更正，更正处应当加盖出具单位公章。原始凭证金额有错误的，应当由出具单位重开，不得在原始凭证上更正。\"\n  }\n]"
- expression: 错误凭证登记及处理台账.金额错误标志 = '是' AND (错误凭证登记及处理台账.是否重开 = '否' OR 错误凭证登记及处理台账.重开凭证编号 IS NULL OR 更正审批记录文件.处理方式 != '重开')
  description: 原始凭证金额错误必须由出具单位重开，不得在原凭证上更正，缺少重开记录即构成违规。
  audit_item: 未按照规定填制、取得原始凭证或者填制、取得的原始凭证不符合规定
  suspicion: 原始凭证金额错误未重开而直接更正
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财政部令第98号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"原始凭证金额有错误的，应当由出具单位重开，不得在原始凭证上更正。\"\n  }\n]"
- expression: (业务主管单位.业务主管单位 IS NOT NULL AND 业务主管单位.业务主管单位 包含 行政机关名称) OR (关系类型、脱钩状态.关系类型 IN ('主办', '主管', '联系', '挂靠') AND 关系类型、脱钩状态.脱钩状态
    != '已完成')
  description: 章程或登记证书中仍列示行政机关为业务主管单位，或关联关系对照表中标明存在主办、主管、联系、挂靠关系且脱钩状态未完成，即触发疑点。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 未取消主办主管挂靠关系
  regulation: "[\n  {\n    \"法规名称\": \"行业协会商会与行政机关脱钩总体方案\",\n    \"法规文号\": \"中办发〔2015〕39号\",\n    \"效力级别\": \"党内法规/规范性文件\"\
    ,\n    \"条款号\": \"第二条主要任务（一）机构分离\",\n    \"内容概述\": \"取消行政机关（包括下属单位）与行业协会商会的主办、主管、联系和挂靠关系，行业协会商会依法直接登记和独立运行。\"\n  }\n]"
- expression: ((项目状态.项目状态 == '已完成') || (项目状态.项目状态 == '已终止')) && (明细表.清理状态 == '未清理') && (DATEDIFF(当前日期, 批复终止日期.批复终止日期) > 30)
    && (明细表.结余金额 > 0)
  description: 当项目进度台账显示项目已完成或已收到正式终止批复，且结余资金明细表中该项目的清理状态仍为“未清理”，同时项目终止日期距审计日已超过30天（制度规定清理时限），且存在结余金额时，触发疑点。
  audit_item: 结余资金管理不规范
  suspicion: 项目终止或完成后未及时清理结余资金
  regulation: "[\n  {\n    \"法规名称\": \"中央部门财政拨款结转和结余资金管理办法\",\n    \"法规文号\": \"财预〔2015〕82号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十条、第十二条\",\n    \"内容概述\": \"项目目标完成或终止后，剩余资金应及时清理确认为结余资金，并按程序报财政部，不得长期挂账或自行调剂使用。\"\n  }\n]"
- expression: SELECT 会员ID FROM 会费收取标准 WHERE 会计期间=审计期间 AND 会员ID IN (SELECT 会员ID FROM 会费收取标准 GROUP BY 会员ID HAVING COUNT(*) >
    1)
  description: 筛查在同一审计期间内，存在超过1次缴费记录的会员ID。需进一步结合分支机构数据进行合并分析，判断是否为总会与分会重复收费。
  audit_item: 行业协会商会违规收费
  suspicion: 同一会员被重复收取会费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步规范行业协会商会收费的通知\",\n    \"法规文号\": \"国办发〔2020〕21号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"严禁只收费不服务或多头重复收费，会费收取必须合理设定，且不得存在重复收取会费的情况。\"\n  }\n]"
- expression: (其他.一般性转移支付金额/其他.转移支付总额)<0.6 || (统计表.转移支付总额增长率-其他.财政支出总额)>0.15 && (统计表.一般性转移支付占比<-0.05)
  description: 条件一：一般性转移支付占转移支付总额比重低于60%的硬性要求（依据国发〔2014〕71号），触发表明结构失衡；条件二：任一类专项转移支付增长率超过同期地方财政支出增长率15个百分点以上，且一般性转移支付占比出现负向变动5%以上，反映规模与趋势背离政策导向。两者满足任一即生成疑点。
  audit_item: 财政转移支付体系建设不健全
  suspicion: 转移支付规模结构趋势不合理
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于改革和完善中央对地方转移支付制度的意见\",\n    \"法规文号\": \"国发〔2014〕71号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、（一）\",\n    \"内容概述\": \"增加一般性转移支付规模和比例，逐步将一般性转移支付占比提高到60%以上；清理、整合、规范专项转移支付，严控新增项目和资金规模。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\",\n\
    \    \"内容"
- expression: (分析表.实际完成值 < 项目名称、批复目标值.批复目标值 * 0.9) AND (资金类型、接收单位、规定下达截止日、实际下达日期、资金编号、实际下达金额、资金到位率、金额、资金用途.资金到位率 > 0.95)
  description: 资金到位率高于95%，表明资金已基本拨付，但绩效目标实际完成值低于批复目标的90%，说明资金使用效益差或目标设定虚夸。若绩效目标批复文件缺失，则直接认定违规。
  audit_item: 财政转移支付预算下达不及时、不准确
  suspicion: 转移支付资金绩效目标未同步批复或未达标
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各级政府要将绩效目标设置作为预算安排的前置条件，未按要求设定绩效目标或审核未通过的，一律不得安排预算；对绩效目标实现程度和预算执行进度实行‘双监控’。\"\
    \n  }\n]"
