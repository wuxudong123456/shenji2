name: audit/资质证照类/土地证
type: model
description: 从资质证照类类文档（土地证）中提取结构化元数据。涵盖字段如：土地性质。文档范围包括：土地证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资质证照类
- 审计
- 元数据提取
template_class:
  category: 资质证照类
  member_types:
  - 土地证
  member_count: 1
  member_details:
  - 土地证
output:
  fields:
  - name: 土地性质
    type: string
    description: 提取 土地性质 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (验收文件.规划用途 = '养老服务设施' || 土地证.土地性质 = '社会福利') && (登记表.实际用途 != '养老服务' && 登记表.实际用途 != '配套办公') && (审批表 IS NULL OR
    审批表.审批结果 != '同意')
  description: 原规划用途为养老服务设施，实际用途变为非养老服务（如出租商业、仓储、餐饮），且未取得合法用途变更审批，即构成违规改变房屋用途。若存在审批但审批流程不合规（如越权审批）也属违规。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 违规改变农村养老机构房屋用途
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第三十三条\",\n    \"内容概述\": \"养老机构应当依法保障收住老年人的合法权益，未经批准不得擅自改变养老服务设施的使用性质。任何组织或者个人不得侵占、挪用或者擅自拆除养老服务设施。\"\n  }\n]"
