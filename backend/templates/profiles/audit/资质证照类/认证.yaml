name: audit/资质证照类/认证
type: model
description: 从资质证照类类文档（认证）中提取结构化元数据。涵盖字段如：参与危房改造工匠姓名、对应工程规模、工匠姓名、资格证书编号、资质证有效性。文档范围包括：乡村建设工匠资质认证、工匠资质认证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资质证照类
- 审计
- 工程
- 元数据提取
template_class:
  category: 资质证照类
  member_types:
  - 认证
  member_count: 1
  member_details:
  - 乡村建设工匠资质认证
  - 工匠资质认证
output:
  fields:
  - name: 参与危房改造工匠姓名
    type: string
    description: 提取 参与危房改造工匠姓名 的文本值
  - name: 对应工程规模
    type: string
    description: 提取 对应工程规模 的文本值
  - name: 工匠姓名
    type: string
    description: 提取 工匠姓名 的文本值
  - name: 资格证书编号
    type: string
    description: 提取 资格证书编号 的文本值
  - name: 资质证有效性
    type: string
    description: 提取 资质证有效性 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (验收签字完整性（建设方、监理方、村委） == '不完整') || (结构性指标（抗震等级、承重墙强度、基础沉降值） < '6级') || (结构性指标（抗震等级、承重墙强度、基础沉降值） < 设计值*0.85) ||
    (事故发生时间、原因（塌陷/开裂/倾斜）、伤亡人数、对应改造批次、事故涉及的施工方名称.原因（塌陷/开裂/倾斜）.质量问题导致事故次数 > 0)
  description: 验收报告缺少建设方、监理方或村委任一方签字即视为违规验收；抗震等级低于6级违反农村危房改造最低抗震设防要求；承重墙强度低于设计值的85%存在安全隐患；若已发生因质量问题导致的事故，直接判定质量不达标且后果严重。
  audit_item: 农村危房改造（含农房改善、撤村并居）不符合相关规定
  suspicion: 农村危房改造工程质量未满足安全要求
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十六条、第四十条\",\n    \"内容概述\": \"建设工程竣工验收应当具备完整的技术档案和质量合格文件，施工单位对施工质量负责；建设工程在保修范围和保修期限内发生质量问题的，施工单位应当履行保修义务，并对造成的损失承担赔偿责任。\"\
    \n  }\n]"
- expression: (名册管理制度文件缺失) || (工程分配记录表中有工匠无资质证书) || (验收报告.持证工匠签名 < 70%) || (登记表.事故涉及的施工方名称 > 0)
  description: 名册管理制度文件缺失视同未建立；工程分配记录中若出现无资质工匠参与施工，直接违规；持证工匠占参与改造总工匠比例低于70%，说明工匠管理失控；因工程质量引发事故且施工方无资质，属于严重管理失职。
  audit_item: 农村危房改造（含农房改善、撤村并居）不符合相关规定
  suspicion: 未建立乡村建设工匠名册管理制度
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部关于加强农村危房改造质量安全管理工作的通知\",\n    \"法规文号\": \"建村〔2017〕47号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各地要建立健全乡村建设工匠管理制度，开展工匠培训，建立名册，实行持证上岗，同时建立黑名单制度，对造成质量安全事故的工匠予以惩戒。\"\n  }\n]"
