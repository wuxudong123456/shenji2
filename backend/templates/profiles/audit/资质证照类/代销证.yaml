name: audit/资质证照类/代销证
type: model
description: 从资质证照类类文档（代销证）中提取结构化元数据。涵盖字段如：代销证编号、批准销售区域、持证单位。文档范围包括：彩票代销证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资质证照类
- 审计
- 元数据提取
template_class:
  category: 资质证照类
  member_types:
  - 代销证
  member_count: 1
  member_details:
  - 彩票代销证
output:
  fields:
  - name: 代销证编号
    type: string
    description: 提取 代销证编号 的文本值
  - name: 批准销售区域
    type: string
    description: 提取 批准销售区域 的文本值
  - name: 持证单位
    type: string
    description: 提取 持证单位 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (信息.备案状态 != '已备案') || (信息.实际销售区域 != 审查文件.销售范围) || (代销证.代销证编号 == NULL)
  description: 代理商备案信息缺失或未备案，或实际销售区域超出合作协议批准的销售范围，或未取得有效的彩票代销证，均构成违规代理。
  audit_item: 彩票资金筹集审计常见违法违规问题
  suspicion: 违规代理销售彩票
  regulation: "[\n  {\n    \"法规名称\": \"彩票管理条例\",\n    \"法规文号\": \"国务院令第554号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十五条、第十六条\"\
    ,\n    \"内容概述\": \"彩票发行机构、销售机构可以委托其他单位代为销售彩票。委托方应当与受托方签订彩票代销合同，受托方应当取得彩票代销证。代销证应当悬挂于销售场所的显著位置。禁止未经批准擅自销售彩票。\"\n  }\n]"
