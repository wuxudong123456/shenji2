name: audit/资质证照类/用权证
type: model
description: 从资质证照类类文档（用权证）中提取结构化元数据。涵盖字段如：批复日期、用地性质、申请用地面积。文档范围包括：土地使用权证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资质证照类
- 审计
- 元数据提取
template_class:
  category: 资质证照类
  member_types:
  - 用权证
  member_count: 1
  member_details:
  - 土地使用权证
output:
  fields:
  - name: 批复日期
    type: date
    description: 提取 批复日期 的日期值，格式 YYYY-MM-DD
  - name: 用地性质
    type: string
    description: 提取 用地性质 的文本值
  - name: 申请用地面积
    type: string
    description: 提取 申请用地面积 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
