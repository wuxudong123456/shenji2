    description: 提取 农田范围 的文本值
  - name: 原始结构
    type: string
    description: 提取 原始结构 的文本值
  - name: 发生时间
    type: date
    description: 提取 发生时间 的日期值，格式 YYYY-MM-DD
  - name: 受影响地块耕层厚度
    type: string
    description: 提取 受影响地块耕层厚度 的文本值
  - name: 在建-拟建项目图层
