name: audit/影像图件类/图
type: model
description: 从影像图件类类文档（图）中提取结构化元数据。涵盖字段如：养殖场位置、农田范围、原始结构、发生时间、受影响地块耕层厚度、在建/拟建项目图层、地类代码、地质灾害隐患点坐标。文档范围包括：卫星热源图、原始户型图、原始规划总平面图、土地利用总体规划图、土地利用现状图、地质灾害防治规划图、建设项目规划图、永久基本农田划界图、治理区域周边养殖场与农田分布图、用地红线图等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 影像图件类
- 审计
- 项目
- 元数据提取
template_class:
  category: 影像图件类
  member_types:
  - 图
  member_count: 1
  member_details:
  - 卫星热源图
  - 原始户型图
  - 原始规划总平面图
  - 土地利用总体规划图
  - 土地利用现状图
  - 地质灾害防治规划图
  - 建设项目规划图
  - 永久基本农田划界图
  - 治理区域周边养殖场与农田分布图
  - 用地红线图
  - 电压质量监测点分布图
  - 电网布局地理信息图
  - 科技创新发展规划实施路线图
  - 竣工图
  - 绩效管理流程说明或流程图
  - 项目占地红线图
  - 黑土耕地分布图
