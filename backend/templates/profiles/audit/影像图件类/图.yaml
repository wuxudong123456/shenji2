violations:
- expression: (NOT(绩效管理流程说明.内容 LIKE '%运行监控%' AND 绩效管理流程说明.内容 LIKE '%绩效评价%' AND 绩效管理流程说明.内容 LIKE '%结果应用%')) OR (绩效运行监控分析表.记录数
    = 0 AND 绩效评价报告.评价结论 IS NULL)
  description: 制度文件未完整涵盖目标设定、监控、评价、结果应用全部必要环节，或实际执行中未生成关键节点文档记录（如无任何监控记录、评价报告），视为流程不完善。前者检查制度文本完整性，后者检查实际执行痕迹，满足任一条件即触发违规。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 预算绩效管理流程不完善
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第二部分（三）\",\n    \"内容概述\": \"健全绩效运行监控机制，对绩效目标实现程度和预算执行进度实行双监控；健全绩效评价机制和结果应用机制，将评价结果作为预算安排和政策调整的重要依据。\"\
    \n  }\n]"
- expression: 结算书.申报工程量 > 竣工图.计算工程量 * 1.05 || (结算书.申报工程量 > 现场勘查记录.实测工程量 * 1.03) || (现场签证单无监理及业主签字确认却进入结算)
  description: 结算申报量超出竣工图计算量5%以上，或超出实际勘查量3%以上，即视为虚报。签证手续不全的工程量不得计入，计入即违规。对土方、拆除等隐蔽工程需重点复核。
  audit_item: 重大工程项目全过程审计
  suspicion: 虚列建设成本或虚报工程量套取资金
  regulation: "[\n  {\n    \"法规名称\": \"基本建设财务规则\",\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十二条\",\n    \"内容概述\": \"项目建设单位应当严格按照合同约定和工程价款结算程序支付工程款。……工程价款结算应当依据合同、设计变更、现场签证等资料，按照工程完成进度据实结算。\"\n  },\n  {\n    \"\
    法规名称\": \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建〔2004〕369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\"\
    : \"工程"
- expression: (重复建设比对分析表.重叠面积或距离 < 5 && 重复建设比对分析表.功能相似度 > 0.8) || (资金拨付和使用台账.收款单位名称对应不同资金拨付和使用台账.对应项目名称的数量 > 1) || (资金拨付和使用台账.收款单位名称对应不同资金拨付和使用台账.对应项目名称
    && 重复建设比对分析表.功能相似度 > 0.8) || (规划合理性分析文件.新建必要性论证结论 = '必要' && 规划合理性分析文件.区域需求覆盖率 < 0.6)
  description: 两设施间距离小于5公里且功能高度相似视为重复建设；同一地理坐标出现多个项目资金记录直接触发；同一供应商承接相邻同类项目且无功能互补视为拆包重复建设；必要性论证忽略已有低利用率设施仍获批准属于规划决策失当。以上任一条件满足即生成疑点。
  audit_item: “互联网+”农产品出村进城工程实施不到位
  suspicion: 仓储物流基础设施项目存在重复建设
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"政府投资项目不得重复建设，已有类似设施能够满足需求的，不得另行建设。\"\n  }\n]"
- expression: (机井通电工程布局表.实施区域坐标 与 高标准农田建设规划.规划配套电力设施范围 不相交 && 机井通电工程布局表.通电状态 == '是') || (已通电机井清单.位置坐标 与 高标准农田建设规划.规划机井坐标 距离
    > 500米 && 机井通电工程布局表.通电状态 == '是')
  description: 当已通电机井位于规划电网覆盖范围之外，或实际机井位置与规划点位偏差超过500米但仍通电，表明规划与建设严重脱节，导致重复建设或无效投资。阈值500米根据电力接入经济半径设定，超出此距离需额外架设线路，增加不合理支出。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 机井布局与高标准农田规划衔接不畅
  regulation: "[\n  {\n    \"法规名称\": \"全国高标准农田建设规划（2021—2030年）\",\n    \"法规文号\": \"国函〔2021〕86号批复\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第四章第二节\",\n    \"内容概述\": \"高标准农田建设应统筹田、水、路、林、电等工程布局，实现各项设施协调配套。\"\n  },\n  {\n    \"法规名称\": \"高标准农田建设\
    \ 通则\",\n    \"法规文号\": \"GB/T 30600-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"6.3.3\",\n    \"内容概述\": \"农田输配电工程应与田间"
- expression: 监测报告.PM2.5 > 500 μg/m³ && 图.异常高温点坐标 IN (运处台账.清运村庄) || 整改清单.违规焚烧点位置 >= 2
  description: PM2.5极高且对应区域存在热源异常点，或台账记录显示垃圾长期未清运区域同时出现热源点，判定为疑似焚烧；同一地点重复出现焚烧记录视为屡禁不止。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 露天焚烧农村生活垃圾
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十九条\",\n    \"内容概述\": \"禁止随意倾倒、抛撒、堆放或者焚烧生活垃圾。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国大气污染防治法\",\n    \"法规文号\": \"\
    2018年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第八十二条\",\n    \"内容概述\": \"禁止在人口集中地区和其他依法需要特殊保护的区域内焚烧沥青、油毡、橡胶、塑料、皮革、垃圾以及其他产生有"
- expression: (分析表.未覆盖行政村数量 > 0) || (分析表.实际覆盖率 < 目标供电可靠率.覆盖率目标)
  description: 只要存在电网未覆盖的行政村（含自然村），或者县域整体覆盖率低于规划目标值，即构成未实现公用电网延伸覆盖的疑点。未覆盖村数和覆盖率缺口越大，风险越高。
  audit_item: 农村电网巩固提升工程存在短板
  suspicion: 公用电网延伸覆盖存在空白区
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级技术原则\",\n    \"法规文号\": \"国能新能〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条\",\n    \"内容概述\": \"要求公用电网应延伸至农村聚居区，基本消除无电人口，满足居民生活和生产用电需求。\"\n  }\n]"
- expression: (数据表.氨氮浓度 > 2.0 || 数据表.总磷浓度 > 0.4) && (EXISTS(图.排污口位置) || EXISTS(图.农田范围)) && (治理方案.管控措施 NOT LIKE '%控源截污%' ||
    机制文件.责任分工决议 LIKE '%推诿%')
  description: 表达式判定逻辑：1. 治理后的水体水质监测指标（氨氮、总磷）超出地表水V类标准，出现富营养化反弹；2. GIS空间分析确认水体汇水区范围内存在养殖场或农田等污染源；3. 同时，审查治理方案发现未包含对这些污染源的控源截污措施，或跨部门联席会议纪要充分暴露了职责推诿。三者同时满足，高度警示治理与面源管控脱节。
  audit_item: 农村黑臭水体治理不到位
  suspicion: 治理后水质因面源污染反弹
  regulation: "[\n  {\n    \"法规名称\": \"农业农村污染治理攻坚战行动方案(2021-2025年)\",\n    \"法规文号\": \"环土壤〔2022〕8号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、(八)\",\n    \"内容概述\": \"推进农村黑臭水体治理。要统筹农村黑臭水体与农村生活污水、农业面源污染治理，形成合力。对纳入监管清单的黑臭水体，要精准识别污染成因，系统开展控源截污、清淤疏浚、生态修复等工程。\"\
    \n  }\n]"
- expression: (摸底台账.用途（经营/非经营） = '非经营性' && 数据.工商登记地址匹配成功) || (摸底台账.层数 >= 3 && 摸底台账.是否重点排查 = '否') || (摸底台账.居住人数 >= 10 && 摸底台账.是否重点排查
    = '否') || (图.地质灾害隐患点坐标在灾害点200米内 && 摸底台账中无对应记录)
  description: 筛选出：经营性房屋被错误标记为非经营性；层数≥3层或居住人数≥10人但未标记为重点排查对象；位于地质灾害点200米缓冲区内的房屋未纳入排查台账。满足任一条件即视为摸排流于形式。
  audit_item: 未按要求开展农村房屋安全隐患排查整治
  suspicion: 摸排流于形式且重点区域未纳入排查
  regulation: "[\n  {\n    \"法规名称\": \"全国自建房安全专项整治工作方案\",\n    \"法规文号\": \"国办发明电〔2022〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第一部分 全面排查摸底--突出排查重点\",\n    \"内容概述\": \"重点排查3层及以上、人员密集、违规改扩建等容易造成重大安全事故的经营性自建房，以及地质灾害易发区等危险区域房屋。\"\n  }\n\
    ]"
- expression: (处理台账.处理状态 NOT IN ('已复耕','已处罚并结案') || 处理台账.处理状态 IS NULL) || (图.项目红线范围与高标准农田地块重叠 && 发放记录.实际发放金额 IS NULL)
  description: 已发现的违规占用案件未处理完成（未复耕、未结案），或建设项目占用高标准农田但无征地补偿记录或审批文件，均属违规占用。
  audit_item: 违反高标农田建后管护及使用规定的行为
  suspicion: 高标准农田被违规占用
  regulation: "[\n  {\n    \"法规名称\": \"基本农田保护条例\",\n    \"法规文号\": \"国务院令第257号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十七条\",\n    \"内容概述\": \"禁止任何单位和个人在基本农田保护区内建窑、建房、建坟、挖砂、采石、采矿、取土、堆放固体废弃物或者进行其他破坏基本农田的活动。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国土地管理法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十四条\",\n    \"内容概述\": \"建设占用土地，涉及农用地转为建设用地的，应当办理"
- expression: (黑土耕地图斑面积 - (黑土耕地图斑 ∩ 永久基本农田图斑).面积) > 0
  description: 任何黑土耕地地块未被划入永久基本农田即构成违规。严重程度判定：未划入面积≥10公顷或占县域黑土耕地总面积比例>5%为严重违规。该表达式通过空间叠加相交分析计算未划入面积。
  audit_item: 项目和政策落实不到位
  suspicion: 黑土耕地未划入永久基本农田实施保护
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十条\"\
    ,\n    \"内容概述\": \"黑土地应当划入永久基本农田，实行严格保护，任何组织和个人不得擅自占用或者改变其用途。\"\n  }\n]"
- expression: (剥离厚度 < 30) OR (实际利用量/剥离总量 < 0.8) OR (利用去向 NOT IN ('高标准农田建设','耕地复垦','劣地改良','土壤改良'))
  description: 剥离厚度未达到30厘米标准，或剥离土壤实际利用率低于80%，或剥离土壤被出售、填埋等非优先利用方向，均构成违规。三个条件为“或”关系，满足任一即判定为违规。
  audit_item: 项目和政策落实不到位
  suspicion: 建设项目占用黑土地未按规定进行耕层土壤剥离利用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十条\"\
    ,\n    \"内容概述\": \"建设项目占用黑土地的，建设单位应当按照规定的标准对耕作层土壤进行剥离，剥离的土壤优先用于高标准农田建设、劣地改良、土地整治等。\"\n  }\n]"
- expression: (竣工验收测绘报告.上报建成面积 - 土地利用现状图.地块图斑面积 > 0) || (耕地质量等别评定报告.地块等别未提升 && 竣工验收测绘报告.上报建成面积 > 0)
  description: 判定规则：1）将项目竣工测绘报告的上报建成面积，与自然资源部门权威的土地利用现状图叠加分析，若上报面积大于现状图认定的高标准农田图斑面积，即存在虚报嫌疑；2）若某地块已在上报建成面积中，但耕地质量等别评定报告显示其质量等别未达到高标准农田标准（即等别未提升），则预警为该地块以非高标准农田冒充高标准农田进行虚报。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 虚报高标准农田建成面积
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。其中包括以虚报、冒领等手段骗取财政资金。\"\n\
    \  }\n]"
- expression: (项目占地红线图.占用基本农田面积 > 永久基本农田补划台账.实际补划面积) || (补划地块的耕地质量等别评定报告.实测等别 < 被占用地块的原质量等别) || (土地利用现状图.补划地块坡度 > 25)
  description: 判定规则：1）项目建设实际占用的永久基本农田面积，大于实际完成的补划面积，即触犯“占优补劣、占多补少”的违规情形；2）补划地块经过实测的质量等别，低于被占用地块占用前的质量等别，属于典型的“占优补劣”；3）补划地块自身条件不达标，如位于大于25度的陡坡上，不宜耕种，属于虚假补划。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 未按规定补足或补划永久基本农田
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"2019年修正版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十二条\",\n    \"内容概述\": \"国家实行永久基本农田保护制度。……禁止通过擅自调整县级土地利用总体规划、乡（镇）土地利用总体规划等方式规避永久基本农田农用地转用或者土地征收的审批。\"\n  }\n]"
- expression: (报备记录.报修原因包含‘拆除’‘破坏’‘拆改’ && 登记表.是否审批 = ‘否’) || (收支台账.摘要包含‘保证金扣除’ && 收支台账.收入项目名称包含‘违规装修’ && 登记表中无对应审批记录) || (检查记录.检查发现（如违规装修、破坏结构）包含‘违规改建’‘私改墙体’‘增加隔断’等)
    || (投诉记录.投诉内容包含‘违规装修’‘破坏结构’且属实)
  description: 表达式通过四种途径识别未获批的破坏性装修行为：维修记录中出现非正常破损且无装修审批的，表明承租人擅自施工损坏房屋；保证金扣除记录若因违规装修且没有审批追溯，系运营单位已发现并处理的证据；物业检查记录直接记载的违规装修现象、经核实的举报投诉，均可单独触发疑点。符合任一条件即判定为擅自装修或破坏。
  audit_item: 未按规定使用公共租赁住房
  suspicion: 承租人破坏或擅自装修公租房
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"承租人不得破坏或者擅自装修所承租公共租赁住房。\"\n  }\n]"
- expression: (审批表.批准变更用途 != 审批文件.批准用途 && 收支台账.摘要 != 收支台账.收入项目名称) || (照片.实际使用状况描述 != 审批文件.批准用途 && 审批表.审批文号 != 收支台账.金额) ||
    (收支台账.交易对象 != 收支台账.交易对象 && 审批文件.批准用途 != 图.规划功能)
  description: 表达式主要核查所有权人或运营单位是否未经批准或超出批准范围改变公租房及配套设施的保障性用途。通过规划文件与审批变更表比对，发现审批用途与规划不一致，且财务有商业收益，或实际现状与规划不符且无任何审批，或擅自出售配套用房，任一情况均构成违规改变性质用途。
  audit_item: 未按规定使用公共租赁住房
  suspicion: 所有权人或运营单位违规改变公租房性质及用途
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"公共租赁住房的所有权人及其委托的运营单位不得改变公共租赁住房的保障性住房性质、用途及其配套设施的规划用途。\"\n  }\n]"
