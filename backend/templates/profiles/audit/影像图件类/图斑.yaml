name: audit/影像图件类/图斑
type: model
description: 从影像图件类类文档（图斑）中提取结构化元数据。涵盖字段如：占用耕地情况、变更前地类、变更后地类、变更时间、图斑空间信息、土地利用类型、影像坐标、影像解译建设范围。文档范围包括：GIS图斑、卫星遥感图斑、竣工图斑、项目区卫星遥感影像对比图斑等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 影像图件类
- 审计
- 元数据提取
template_class:
  category: 影像图件类
  member_types:
  - 图斑
  member_count: 1
  member_details:
  - GIS图斑
  - 卫星遥感图斑
  - 竣工图斑
  - 项目区卫星遥感影像对比图斑
output:
  fields:
  - name: 占用耕地情况
    type: string
    description: 提取 占用耕地情况 的文本值
  - name: 变更前地类
    type: string
    description: 提取 变更前地类 的文本值
  - name: 变更后地类
    type: string
    description: 提取 变更后地类 的文本值
  - name: 变更时间
    type: date
    description: 提取 变更时间 的日期值，格式 YYYY-MM-DD
  - name: 图斑空间信息
    type: string
    description: 提取 图斑空间信息 的文本值
  - name: 土地利用类型
    type: string
    description: 提取 土地利用类型 的文本值
  - name: 影像坐标
    type: string
    description: 提取 影像坐标 的文本值
  - name: 影像解译建设范围
    type: string
    description: 提取 影像解译建设范围 的文本值
  - name: 毁损范围
    type: string
    description: 提取 毁损范围 的文本值
  - name: 灾前灾后影像
    type: string
    description: 提取 灾前灾后影像 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (地块编号.规划用途=="基本农田" && (地块编号.实际用途=="建设用地" || 未种植粮食)) && 无农用地转用审批手续 && (通知书.执行结果!="已恢复" 或 缺失)
  description: 基本农田被用作非农业建设或非粮化种植，且无合法审批，整改措施未落实，则直接认定；卫星图斑可辅助验证历年变化。
  audit_item: 农村集体经济发展壮大不到位
  suspicion: 流转耕地未按批准用途使用导致非农化非粮化
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"2019年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十七条、第七十五条\",\n    \"内容概述\": \"禁止占用永久基本农田发展林果业和挖塘养鱼；禁止任何单位和个人闲置、荒芜耕地。对违反土地利用总体规划擅自将农用地改为建设用地的，限期拆除并恢复原状。\"\n  },\n  {\n\
    \    \"法规名称\": \"基本农田保护条例\",\n    \"法规文号\": \"国务院令第257号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\"\
    : \"禁"
- expression: (档案.批准用途 IN ('设施农业','养殖','种植') AND 核查报告.实际用途 IN ('工业','仓储','商业','住宅')) OR (指标文件.面积 < 指标文件.下达指标数量 AND 非农项目审批面积
    > 0) OR (图斑.土地利用类型 = '耕地' AND 核查报告.有无非农设施 = '非农设施' AND 整改台账.整改状态 = '未整改')
  description: 核心判定逻辑：审批用途为农业设施但实际建设为工业、商业等非农设施的“大棚房”问题；或农业用地指标总量未足额用于农业，被挪用于非农项目；或占用耕地建设非农设施且未整改。以上条件满足其一即视为违规。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业设施用地指标被挪用或违规使用
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部 农业农村部关于设施农业用地管理有关问题的通知\",\n    \"法规文号\": \"自然资规〔2019〕4号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条、第三条\",\n    \"内容概述\": \"设施农业用地包括农业生产中直接用于作物种植和畜禽水产养殖的设施用地；严禁以设施农业为名占用耕地从事非农建设，不得改变设施农业用地用途。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第"
- expression: (入库数据表.坐标 与 遥感影像图斑.坐标 空间重叠率 < 90%) OR (ABS(入库数据表.上报面积 - 遥感影像图斑.解译面积) / 遥感影像图斑.解译面积 > 0.1) OR (入库数据表.建设内容字段中沟渠、道路等特征
    与 影像可见特征不匹配)
  description: 系统上报坐标与卫星影像实际建设范围重叠率低于90%，或面积偏差超过10%，或上报的建设内容无法在影像上辨认，均判定为数据不实。10%为遥感解译与上报可接受误差上限。
  audit_item: 高标准农田管护使用不符合相关规定
  suspicion: 高标准农田上图入库数据不真实不准确
  regulation: "[\n  {\n    \"法规名称\": \"农田建设统计监测调查制度\",\n    \"法规文号\": \"农建发〔2020〕5号\",\n    \"效力级别\": \"部门规范性文件\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"各级农业农村部门对农田建设数据的真实性、准确性负责，不得虚报、瞒报、拒报、迟报。\"\n  }\n]"
- expression: DATEDIFF(修复进度表.修复完成日期, 修复进度表.毁损登记日期) > 制度文件规定修复时限 OR (修复进度表.修复完成日期 IS NULL AND DATEDIFF(当前日期, 毁损登记日期) > 制度文件规定时限)
  description: 毁损登记后超过规定时限（如15个工作日或30天）未修复完成，或截至目前仍未修复且远超时限，判定为修复不及时。规定时限取自管护制度文件。
  audit_item: 高标准农田管护使用不符合相关规定
  suspicion: 毁损高标准农田未及时修复
  regulation: "[\n  {\n    \"法规名称\": \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十八条\"\
    ,\n    \"内容概述\": \"农田水利设施发生损毁的，管护主体应当及时修复；因自然灾害等特殊原因损毁严重的，县级以上人民政府应当组织修复。\"\n  }\n]"
- expression: (项目实施方案与规划对比分析报告.偏差率 > 15%) || (历年项目验收与规划符合性报告.偏差率 > 15%) || (建设资金流向与规划匹配表.非重点区域投资金额 / 总投资金额 > 30%)
  description: 当实际建设内容与规划要求的偏差率超过15%（如集中连片比例、节水灌溉覆盖率等），或资金投向非规划重点区域的比例超过30%时，判定为规划与建设脱节；阈值可根据地方管理细则调整。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 高标准农田规划与项目建设内容严重不符
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"农田建设项目应当按照批准的初步设计组织实施，涉及建设地点、建设内容、建设规模等重大变更，须按程序报原审批机关批准，不得擅自调整。\"\n  }\n]"
