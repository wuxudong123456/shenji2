name: audit/影像图件类/照片
type: model
description: 从影像图件类类文档（照片）中提取结构化元数据。涵盖字段如：公示栏位置、内容清晰度、园区实际入驻企业类型、在用面积、实际使用状况描述、实际用途影像、拍摄地点、污染点GPS坐标。文档范围包括：实地勘察照片、环保部门现场检查照片、现场照片等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 影像图件类
- 审计
- 元数据提取
template_class:
  category: 影像图件类
  member_types:
  - 照片
  member_count: 1
  member_details:
  - 实地勘察照片
  - 环保部门现场检查照片
  - 现场照片
output:
  fields:
  - name: 公示栏位置
    type: string
    description: 提取 公示栏位置 的文本值
  - name: 内容清晰度
    type: string
    description: 提取 内容清晰度 的文本值
  - name: 园区实际入驻企业类型
    type: string
    description: 提取 园区实际入驻企业类型 的文本值
  - name: 在用面积
    type: string
    description: 提取 在用面积 的文本值
  - name: 实际使用状况描述
    type: string
    description: 提取 实际使用状况描述 的文本值
  - name: 实际用途影像
    type: string
    description: 提取 实际用途影像 的文本值
  - name: 拍摄地点
    type: string
    description: 提取 拍摄地点 的文本值
  - name: 污染点GPS坐标
    type: string
    description: 提取 污染点GPS坐标 的文本值
  - name: 现场照片
    type: string
    description: 提取 现场照片 的文本值
  - name: 维修前中后对比照片
    type: string
    description: 提取 维修前中后对比照片 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 占用场地名称、占用用途、占用期限、是否获批.占用用途 NOT IN ('公共文化服务') && 被占用场地及其附属设施的权属登记、在册资产设备名称、型号、数量、已登记资产名称、登记日期、资产编号、资产盘点前账面数量、金额.资产用途
    == '文化用房' || (占用场地名称、占用用途、占用期限、是否获批.审批文件 IS NULL AND 实际用途 != '空置')
  description: 检查原规划为文化用房的场地，是否被用于仓储、商业经营、办公等非公共文化服务用途。凡是非文化服务类占用，或虽声称有审批但无法提供上级主管部门批准文件的占用，均判定为违规占用。
  audit_item: 文化站（中心）等建设运营管护不符合相关规定
  suspicion: 村综合性文化设施被违规占用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公共文化服务保障法\",\n    \"法规文号\": \"中华人民共和国主席令第六十号\",\n    \"效力级别\": \"法律\",\n   \
    \ \"条款号\": \"第十六条\",\n    \"内容概述\": \"任何单位和个人不得擅自拆除公共文化设施，不得擅自改变公共文化设施的功能、用途或者妨碍其正常运行，不得侵占、挪用公共文化设施。\"\n  }\n]"
- expression: 批准人 == true && (缺失(施工日志记载的每日工程量) || 缺失(维修前中后对比照片) || 缺失(监理确认) || 缺失(补办表决结果))
  description: 已通过紧急程序审批并拨付资金的维修项目，若不能提供施工日志、监理报告、现场照片以及事后补办业主表决的任何一项支持性文件，即可判定为虚假紧急维修挪用资金。
  audit_item: 挪用住宅专项维修资金
  suspicion: 利用虚假紧急维修程序挪用资金
  regulation: "[\n  {\n    \"法规名称\": \"《住宅专项维修资金管理办法》\",\n    \"法规文号\": \"建设部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十四条\",\n    \"内容概述\": \"发生危及房屋安全等紧急情况，需要立即对住宅共用部位、共用设施设备进行维修和更新、改造的，可以凭应急使用方案和相关证明材料，申请列支维修资金，事后应当向业主公示相关情况并补充履行表决手续。\"\
    \n  }\n]"
- expression: (审批表.批准变更用途 != 审批文件.批准用途 && 收支台账.摘要 != 收支台账.收入项目名称) || (照片.实际使用状况描述 != 审批文件.批准用途 && 审批表.审批文号 != 收支台账.金额) ||
    (收支台账.交易对象 != 收支台账.交易对象 && 审批文件.批准用途 != 图.规划功能)
  description: 表达式主要核查所有权人或运营单位是否未经批准或超出批准范围改变公租房及配套设施的保障性用途。通过规划文件与审批变更表比对，发现审批用途与规划不一致，且财务有商业收益，或实际现状与规划不符且无任何审批，或擅自出售配套用房，任一情况均构成违规改变性质用途。
  audit_item: 未按规定使用公共租赁住房
  suspicion: 所有权人或运营单位违规改变公租房性质及用途
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"公共租赁住房的所有权人及其委托的运营单位不得改变公共租赁住房的保障性住房性质、用途及其配套设施的规划用途。\"\n  }\n]"
- expression: (公示记录表.留存情况 == 0) || (公示记录表.公示时间 != '每周' OR 相邻公示时间差 > 7) || (公示记录表.公示内容缺失 '采购单价' OR '供应商名称' OR '食材种类') || (照片.公示栏位置显示
    公示栏设置不醒目或内容已过期)
  description: 无任何公示记录，或未按每周更新，或公示项目中缺少关键信息（单价、供应商），均属未按规定公开。
  audit_item: 营养餐制度执行不到位
  suspicion: 营养餐信息未按规定公开公示
  regulation: "[\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划信息公开公示暂行办法\",\n    \"法规文号\": \"教财〔2012〕4号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第五条、第六条\",\n    \"内容概述\": \"学校应将营养改善计划经费使用情况、食谱、食材采购价格数量等内容，通过校园网、公示栏等方式每周更新公示。\"\n  }\n]"
