name: audit/影像图件类/图层
type: model
description: 从影像图件类类文档（图层）中提取结构化元数据。涵盖字段如：保护区范围面域、项目或矿权范围面域。文档范围包括：GIS地理信息图层等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 影像图件类
- 审计
- 项目
- 元数据提取
template_class:
  category: 影像图件类
  member_types:
  - 图层
  member_count: 1
  member_details:
  - GIS地理信息图层
output:
  fields:
  - name: 保护区范围面域
    type: string
    description: 提取 保护区范围面域 的文本值
  - name: 项目或矿权范围面域
    type: string
    description: 提取 项目或矿权范围面域 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (图层.项目或矿权范围面域 在 图层.保护区范围面域内) && (项目清单.审批日期 > 规划文件.设立日期 || 项目无保护区准入审批文件) || (信息.矿权范围坐标 与 规划文件.保护区边界坐标存在空间重叠 &&
    信息.发证日期 > 规划文件.设立日期)
  description: 通过GIS叠加分析，判断建设项目或矿业权是否在自然保护区、饮用水源保护区等法定保护区域内，并确认项目审批或矿权设立时间是否晚于保护区设立时间。若晚于保护设立日且无特殊批准，即为违规。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 保护区范围内存在违规项目且未清理
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国自然保护区条例\",\n    \"法规文号\": \"国务院令第167号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"禁止在自然保护区内进行砍伐、放牧、狩猎、捕捞、采参、开垦、烧荒、开矿、采石、挖沙等活动。\"\n  },\n  {\n    \"法规名称\": \"饮用水水源保护区污染防治管理规定\"\
    ,\n    \"法规文号\": \"国家环境保护局令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"饮用水水源保护区内禁止设置排污口，禁止"
