name: audit/影像图件类/图件
type: model
description: 从影像图件类类文档（图件）中提取结构化元数据。涵盖字段如：基本农田保护区、生态红线区范围、用地区域划定图层。文档范围包括：国土空间规划图件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 影像图件类
- 审计
- 元数据提取
template_class:
  category: 影像图件类
  member_types:
  - 图件
  member_count: 1
  member_details:
  - 国土空间规划图件
output:
  fields:
  - name: 基本农田保护区
    type: string
    description: 提取 基本农田保护区 的文本值
  - name: 生态红线区范围
    type: string
    description: 提取 生态红线区范围 的文本值
  - name: 用地区域划定图层
    type: string
    description: 提取 用地区域划定图层 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 冲突类型 == '占用基本农田' || 冲突类型 == '位于生态红线内' || (规划调整日期 > 0 && 能源方案修订日期 - 规划调整日期 > 30 天)
  description: 设施选址坐标落入基本农田或生态红线范围，直接判定违规；乡村规划调整后超过30天清洁能源方案未同步修订，视为规划衔接不到位。
  audit_item: 项目规划统筹衔接不到位
  suspicion: 清洁能源设施选址与国土空间规划冲突
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十五条\",\n    \"内容概述\": \"永久基本农田经依法划定后，任何单位和个人不得擅自占用或者改变其用途。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\"\
    : \"主席令第74号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"在城市、镇规划区内进行建筑物、构筑物、道路、管线和其他工程建设的，应当向城乡规划主管部门申请"
- expression: (专项规划文本为空) || (专项规划文本.批复层级 != '省级以上') || (GIS叠加分析(黑土地保护规划图层, 国土空间规划图层).冲突图斑面积 > 0) || (实施进度跟踪表中重点任务完成率 < 50%)
  description: 符合以下任一条件判定违规：1.未编制或出台黑土地保护专项规划；2.专项规划未经省级以上人民政府批复；3.通过GIS空间叠加分析，专项规划中保护区域与国土空间规划中允许建设区或开发区存在重叠图斑，面积大于0；4.规划期已过半但重点任务（如侵蚀沟治理）完成率不足50%。
  audit_item: 黑土地保护机制不完善
  suspicion: 未编制黑土地保护规划或规划之间不衔接
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第八十七号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十二条\",\n    \"内容概述\": \"县级以上人民政府应当编制黑土地保护规划，并报上一级人民政府批准。黑土地保护规划应当与国土空间规划相衔接。\"\n  }\n]"
