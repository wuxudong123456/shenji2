name: audit/清单名册类/机井清单
type: model
description: 从清单名册类类文档（机井清单）中提取结构化元数据。涵盖字段如：位置、位置坐标、改造申请日期、改造计划完成日期、是否符合通电条件、是否纳入规划、未通电原因、机井编号。文档范围包括：使用柴油发电机的机井清单、已通电机井清单、未通电机井清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 机井清单
  member_count: 1
  member_details:
  - 使用柴油发电机的机井清单
  - 已通电机井清单
  - 未通电机井清单
output:
  fields:
  - name: 位置
    type: string
    description: 提取 位置 的文本值
  - name: 位置坐标
    type: string
    description: 提取 位置坐标 的文本值
  - name: 改造申请日期
    type: date
    description: 提取 改造申请日期 的日期值，格式 YYYY-MM-DD
  - name: 改造计划完成日期
    type: date
    description: 提取 改造计划完成日期 的日期值，格式 YYYY-MM-DD
  - name: 是否符合通电条件
    type: boolean
    description: 提取 是否符合通电条件 的布尔值（是/否）
  - name: 是否纳入规划
    type: boolean
    description: 提取 是否纳入规划 的布尔值（是/否）
  - name: 未通电原因
    type: string
    description: 提取 未通电原因 的文本值
  - name: 机井编号
    type: string
    description: 提取 机井编号 的文本值
  - name: 柴油发电机使用状态
    type: boolean
    description: 提取 柴油发电机使用状态 的布尔值（是/否）
  - name: 电价执行标准
    type: string
    description: 提取 电价执行标准 的文本值
  - name: 通电日期
    type: date
    description: 提取 通电日期 的日期值，格式 YYYY-MM-DD
  - name: 通电时间
    type: date
    description: 提取 通电时间 的日期值，格式 YYYY-MM-DD
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 未通电机井清单.是否符合通电条件 == '是' && 未通电机井清单.是否纳入规划 == '是' && 未通电机井清单.机井编号 NOT IN 已通电机井清单.机井编号 && 未通电机井清单.未通电原因 NOT LIKE
    '%不可抗力%' && 电力公司年度资金分配文件.实际支出 < 电力公司年度资金分配文件.机井通电专项预算金额
  description: 当机井已被明确认定为符合通电条件、已纳入高标准农田建设规划，但未出现在已通电清单中，且未通电原因并非不可抗力，同时电力公司预算资金有结余或未足额用于机井通电时，判定为违规。重点排除客观不可抗力、资金已用完但按计划推进等情形。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 符合条件的机井未通电
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\",\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\"\
    : \"国务院规范性文件\",\n    \"条款号\": \"第三条第（五）款\",\n    \"内容概述\": \"要求统一规划布局，完善农田电网等基础设施，确保建成的高标准农田配套电力设施满足农业生产需求。\"\n  },\n\
    \  {\n    \"法规名称\": \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十九条\",\n    \"\
    内容概述\": \""
- expression: (机井通电工程布局表.实施区域坐标 与 高标准农田建设规划.规划配套电力设施范围 不相交 && 机井通电工程布局表.通电状态 == '是') || (已通电机井清单.位置坐标 与 高标准农田建设规划.规划机井坐标 距离
    > 500米 && 机井通电工程布局表.通电状态 == '是')
  description: 当已通电机井位于规划电网覆盖范围之外，或实际机井位置与规划点位偏差超过500米但仍通电，表明规划与建设严重脱节，导致重复建设或无效投资。阈值500米根据电力接入经济半径设定，超出此距离需额外架设线路，增加不合理支出。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 机井布局与高标准农田规划衔接不畅
  regulation: "[\n  {\n    \"法规名称\": \"全国高标准农田建设规划（2021—2030年）\",\n    \"法规文号\": \"国函〔2021〕86号批复\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第四章第二节\",\n    \"内容概述\": \"高标准农田建设应统筹田、水、路、林、电等工程布局，实现各项设施协调配套。\"\n  },\n  {\n    \"法规名称\": \"高标准农田建设\
    \ 通则\",\n    \"法规文号\": \"GB/T 30600-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"6.3.3\",\n    \"内容概述\": \"农田输配电工程应与田间"
- expression: 使用柴油发电机的机井清单.柴油发电机使用状态 == '在用' && （使用柴油发电机的机井清单.改造计划完成日期 < 当前日期 || 使用柴油发电机的机井清单.改造计划完成日期 IS NULL） && 国家和地方农业生产电价政策文件.柴油机井改造最后期限
    < 当前日期 && （电网接入申请记录.受理状态 == '已拒绝' && 电网接入申请记录.拒绝原因 NOT IN ('客观技术限制','安全风险不可消除')）
  description: 当前日期已超过政策规定的柴油机井强制改造截止日期，但机井仍在用柴油发电机且没有有效的改造计划，或者供电公司无理拒绝农户电网接入申请，均构成未改造。需排除因地理条件极端受限、供电半径过长等技术不可行情况。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 利用柴油发电机通电的机井未改造
  regulation: "[\n  {\n    \"法规名称\": \"关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"国务院规范性文件\",\n \
    \   \"条款号\": \"第三条第（三）款\",\n    \"内容概述\": \"加快完善农田水利基础设施，推进机井通电改造，降低农业生产用电成本，禁止违规向农民收取额外费用。\"\n  },\n  {\n    \"法规名称\"\
    : \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格[2013]973号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\",\n\
    \    \"内容概"
- expression: 已通电机井清单.机井编号 = 机井合规性审查记录.机井编号 AND (机井合规性审查记录.取水许可证号 IS NULL OR 机井合规性审查记录.环评批复文号 IS NULL OR 机井合规性审查记录.用地批准文号
    IS NULL) AND 已通电机井清单.通电日期 >= '2020-01-01'
  description: 以机井编号关联，已通电的机井在合规性审查记录中缺少取水许可证、环评批复或用地批准任一法定手续，视为未通过合法合规性审查即通电。通电日期限制在2020年后，以聚焦近年新建项目，可根据实际政策生效时间调整。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 向未通过合法合规性审查的机井通电
  regulation: "[\n  {\n    \"法规名称\": \"取水许可和水资源费征收管理条例\",\n    \"法规文号\": \"国务院令第460号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二条、第三条\",\n    \"内容概述\": \"利用取水工程直接取用地下水的，必须申领取水许可证。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\"\
    : \"中华人民共和国主席令第24号（2018修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\": \"建设对环境有影响的项目，应当编制环境影响报告书或报告表，未"
