name: audit/清单名册类/企业清单
type: model
description: 从清单名册类类文档（企业清单）中提取结构化元数据。涵盖字段如：主营业务关键词、产值、亲属姓名、企业名称、保险险种、免税标识、入库时间、入驻企业名称。文档范围包括：入园企业清单、关联企业清单、特色农业保险参保企业清单、税务部门免税企业清单、税费减免企业清单、返乡创业园入驻企业清单、项目库/名录库准入企业清单、领导人员直系亲属投资入股企业清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 企业清单
  member_count: 1
  member_details:
  - 入园企业清单
  - 关联企业清单
  - 特色农业保险参保企业清单
  - 税务部门免税企业清单
  - 税费减免企业清单
  - 返乡创业园入驻企业清单
  - 项目库/名录库准入企业清单
  - 领导人员直系亲属投资入股企业清单
output:
  fields:
  - name: 主营业务关键词
    type: string
    description: 提取 主营业务关键词 的文本值
  - name: 产值
    type: string
    description: 提取 产值 的文本值
  - name: 亲属姓名
    type: string
    description: 提取 亲属姓名 的文本值
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 保险险种
    type: string
    description: 提取 保险险种 的文本值
  - name: 免税标识
    type: string
    description: 提取 免税标识 的文本值
  - name: 入库时间
    type: date
    description: 提取 入库时间 的日期值，格式 YYYY-MM-DD
  - name: 入驻企业名称
    type: string
    description: 提取 入驻企业名称 的文本值
  - name: 参保企业名称
    type: string
    description: 提取 参保企业名称 的文本值
  - name: 各企业物流需求
    type: string
    description: 提取 各企业物流需求 的文本值
  - name: 应减免税额
    type: string
    description: 提取 应减免税额 的文本值
  - name: 当前经营状态
    type: boolean
    description: 提取 当前经营状态 的布尔值（是/否）
  - name: 投资企业名称
    type: string
    description: 提取 投资企业名称 的文本值
  - name: 投资时间
    type: date
    description: 提取 投资时间 的日期值，格式 YYYY-MM-DD
  - name: 持股比例
    type: number
    description: 提取 持股比例 的数值（含单位，如万元、吨等）
  - name: 注册地
    type: string
    description: 提取 注册地 的文本值
  - name: 注册日期
    type: date
    description: 提取 注册日期 的日期值，格式 YYYY-MM-DD
  - name: 租赁面积
    type: string
    description: 提取 租赁面积 的文本值
  - name: 统一社会信用代码
    type: string
    description: 提取 统一社会信用代码 的文本值
  - name: 资质等级
    type: string
    description: 提取 资质等级 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (企业法人/高管信息对照表.任职起始日期 - 领导干部离职/退休信息登记表.离职日期) < 3年 && 离职人员从业情况申报表.企业性质 IN ('民营企业','外商投资企业','中介机构') && (工商登记信息.注册地址
    ∈ 领导干部离职/退休信息登记表.分管领域 OR 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围) && (社会兼职申报.审批结果 != '批准' OR 社会兼职申报.审批结果 IS NULL)
  description: 禁业期按通常3年设定；若任职起始日期与离职日期间隔小于1095天即为在禁业期内；企业性质须为民营企业、外商投资企业或中介机构之一；业务关联判定采用地区匹配或关键词重合（审计中可设定重合度阈值>60%）；若未履行审批手续或审批不通过即触发疑点。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规接受原管辖范围内企业聘任
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"公务员辞去公职或者退休的，原系领导成员的公务员在离职三年内，不得到与原工作业务直接相关的企业或者其他营利性组织任职，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n \
    \ {\n    \"法规名称\": \"关于进一步规范党政领导干部在企业兼职（任职）问题的意见\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": "
- expression: (工商登记信息.成立日期 >= 领导干部离职审批文件.离职日期 - 缓冲期) && (领导干部离职审批文件.离职日期 + 3年 >= 当前日期 OR 当前日期 - 领导干部离职审批文件.离职日期 <= 3年) &&
    ((工商登记信息.投资人/股东姓名及身份证号 = 领导干部离职审批文件.姓名) OR (工商登记信息.企业名称 = 直系亲属经商办企业备案表.企业名称 AND 工商登记信息.投资人/股东姓名及身份证号 = 直系亲属经商办企业备案表.亲属姓名))
    && (关联企业清单.企业名称 = 工商登记信息.企业名称 AND 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围
  description: 缓冲期可设定为6个月，避免离职前已谋划的合理情形；禁业期以3年为限；企业投资人或实际控制人为本人或直系亲属（代持）；业务关联性通过关键词匹配（如原分管住建，企业主营房地产开发、建筑工程咨询），叠加与原任职单位存在交易或利用原权力获得审批，即触发违规。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事与原职务相关的营利性活动
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"原系领导成员的公务员在离职三年内，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"\
    法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第九十六条\",\n    \"内容概述\": \"离职或者退（离）休后违反有关规定从事与原任职务管辖业务相关的营利活动，视"
- expression: (亲属投资入股企业清单.投资企业名称 IN (供应商/客户名录.企业名称)) && (明细表.交易对手方 == 亲属投资入股企业清单.投资企业名称) && (明细表.交易金额 > 5000000 || ABS(明细表.单价-明细表.同期其他供应商报价)/明细表.同期其他供应商报价
    > 0.1)
  description: 筛查领导人员亲属投资入股企业与本单位发生业务往来的情况，当累计交易金额超过500万元或单笔交易价格偏离市场价10%以上时触发预警。阈值可根据企业规模及行业水平调整。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 特定关系人在关联企业或业务往来企业投资入股
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第一项\",\n    \"内容概述\": \"国有企业领导人员不得在本企业的关联企业、与本企业有业务关系的企业投资入股。\"\n  }\n]"
- expression: (CONTAINS(招标文件.资格条件, '入库') || CONTAINS(招标文件.资格条件, '名录库')) && (项目库或名录库最近更新时间距今 > 两年 || 入库企业数量近两年增长率为0) && (库外符合资质企业数量
    > 3)
  description: 当招标文件要求投标人必须进入某一特定项目库或名录库，且该库长期未更新（超过2年未调整或新增企业为零），同时市场存在3家以上符合基本资质但未入库的企业时，判为拟排斥潜在投标人。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 利用项目库或名录库设置壁垒排斥潜在投标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人或者投标人。\"\n  },\n  {\n    \"法规名称\": \"公平竞争审查制度实施细则\",\n    \"\
    法规文号\": \"国市监反垄规〔2021〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"不得设置不合理或者歧视性的准入和退出条件，排斥或者限制经营者参与招标"
- expression: (农业部门备案清单.服务类型 IN 国家和地方农业社会化服务增值税免征政策文件.免税服务范围) AND (农业企业享受政策资格认定文件.认定结果 = '符合') AND (农业企业增值税申报表.免税销售额 = 0 OR
    农业企业增值税申报表.应纳税额 > 0)
  description: 表达式筛选出已在农业部门备案且资格认定符合免税条件，但在税务申报表中未填报免税销售额或仍缴纳了增值税的企业。当免税销售额为零且应纳税额大于零时，触发疑点，表明企业虽符合免税条件却未能享受免征政策。
  audit_item: 农业社会化服务政策扶持不到位
  suspicion: 农业社会化服务企业增值税免税政策未落实
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国增值税暂行条例\",\n    \"法规文号\": \"国务院令第691号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条第一款\",\n    \"内容概述\": \"农业生产者销售的自产农产品免征增值税。\"\n  },\n  {\n    \"法规名称\": \"财政部 国家税务总局关于全面推开营业税改征增值税试点的通知\",\n \
    \   \"法规文号\": \"财税〔2016〕36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"附件3第一条第（十）项\",\n    \"内容概述\": \"农业机耕、排灌、病虫害防治、植物保护、农牧保险"
- expression: (贷款申请金额.发放金额/贷款申请金额.贷款申请金额 < 50%) || (贷款利率.贷款利率 - 合作协议.约定利率上限 > 0.5) || (企业清单.实际减免税额/企业清单.应减免税额 < 90%) || (应拨付金额.实际到账时间
    - 应拨付金额.应拨付金额 > 30)
  description: 贷款发放率=实际发放贷款总额/符合条件的申请贷款总额，低于50%视为金融支持严重不足；实际贷款利率超过合作协议约定利率上限0.5个百分点视为变相提高融资成本；税费实际减免比例低于应减免金额的90%视为减免落实不到位；补贴资金延迟到账超过30个自然日视为拨付不及时。
  audit_item: 农民工返乡创业政策实施不到位
  suspicion: 创业用地、用电、税费、金融政策支持不到位
  regulation: "[\n  {\n    \"法规名称\": \"财政部 税务总局 人力资源社会保障部 国务院扶贫办关于进一步支持和促进重点群体创业就业有关税收政策的通知\",\n    \"法规文号\": \"财税〔2019〕22号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"符合条件的返乡创业人员从事个体经营的，自办理个体工商户登记当月起，在3年内按每户每年12000元为限额依次扣减相关税费，地方政府应足额落实。\"\
    \n  },\n  {\n    \"法规名称\": \"中国银保监会关于银行业保险业支持返乡入乡创业的通知\",\n    \"法规文号\": \"银保监发〔2021〕43号"
- expression: (参保企业名称.参保企业名称 / 应参保企业总数.应参保企业总数) < 0.6 || (理赔申请笔数.理赔拒付率 > 0.2 && 平均结案周期.平均结案周期 > 60)
  description: 计算特定帮扶产业的保险覆盖率（参保企业数占应参保企业总数的比例），当覆盖率低于60%的及格线时，判定为保险覆盖不足。或者，当保障范围内的理赔拒付率超过20%且平均理赔周期超过60天时，视为保险服务保障不到位。
  audit_item: 帮扶产业配套支持政策不够精准有效
  suspicion: 特色产业保险覆盖范围严重不足
  regulation: "[\n  {\n    \"法规名称\": \"关于加快农业保险高质量发展的指导意见\",\n    \"法规文号\": \"财金〔2019〕102号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"二、(五)\",\n    \"内容概述\": \"稳步扩大大宗农产品保险覆盖面…… 提高小农户农业保险投保率，实现愿保尽保。\"\n  }\n]"
- expression: (规划用地性质.规划用地性质 != 实际用途) || (企业清单.注册日期 / 规划用地性质.规划入驻企业数 < 0.5) || EXISTS(企业清单.注册日期 < 规划用地性质.开园日期)
  description: 实际建设用途与规划用地不符，或入驻率低于50%，或存在企业在创业园正式开园前已完成注册（疑似虚假入驻），均构成建设不合规。
  audit_item: 新型职业农民培育、农民工技能提升和返乡创业就业不符合相关规定
  suspicion: 返乡创业园建设用途不合规或空置率超标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第74号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十三条\",\n    \"内容概述\": \"建设单位应当按照规划条件进行建设；确需变更的，必须向城市、县人民政府城乡规划主管部门提出申请。未按照规划条件建设的，由主管部门责令改正，并处罚款。\"\n  }\n]"
- expression: 功能区位置.间距<1000m OR 各区实际使用面积.各区实际使用面积超出各企业物流需求.各企业物流需求2倍以上 OR 功能区位置.间距>5km AND 交通配套规划.交通配套规划
  description: 功能区规划违反卫生防护距离要求，或面积严重冗余利用率低于50%，或交通配套缺失导致物流成本异常，均判定为布局不科学。距离阈值参照行业设计规范及审计实践。
  audit_item: 现代农业产业园（集群、强镇）规划、设计、立项不科学
