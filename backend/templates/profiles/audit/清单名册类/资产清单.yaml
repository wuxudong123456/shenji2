name: audit/清单名册类/资产清单
type: model
description: 从清单名册类类文档（资产清单）中提取结构化元数据。涵盖字段如：使用状态、净值、出租合同、原值、合同约定期限、处置方式、处置日期、处置状态。文档范围包括：低效无效资产清单、合作社资产清单、成员社资产清单、无形资产清单、资产清单、闲置校舍资产清单、闲置资产清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 合同
- 审批
- 明细
- 资产
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 资产清单
  member_count: 1
  member_details:
  - 低效无效资产清单
  - 合作社资产清单
  - 成员社资产清单
  - 无形资产清单
  - 资产清单
  - 闲置校舍资产清单
  - 闲置资产清单
output:
  fields:
  - name: 使用状态
    type: boolean
    description: 提取 使用状态 的布尔值（是/否）
  - name: 净值
    type: string
    description: 提取 净值 的文本值
  - name: 出租合同
    type: string
    description: 提取 出租合同 的文本值
  - name: 原值
    type: string
    description: 提取 原值 的文本值
  - name: 合同约定期限
    type: string
    description: 提取 合同约定期限 的文本值
  - name: 处置方式
    type: string
    description: 提取 处置方式 的文本值
  - name: 处置日期
    type: date
    description: 提取 处置日期 的日期值，格式 YYYY-MM-DD
  - name: 处置状态
    type: boolean
    description: 提取 处置状态 的布尔值（是/否）
  - name: 存放地点
    type: string
    description: 提取 存放地点 的文本值
  - name: 审批人
    type: string
    description: 提取 审批人 的文本值
  - name: 法律保护期限
    type: string
    description: 提取 法律保护期限 的文本值
  - name: 清查差异
    type: string
    description: 提取 清查差异 的文本值
  - name: 规格型号
    type: string
    description: 提取 规格型号 的文本值
  - name: 账面价值
    type: string
    description: 提取 账面价值 的文本值
  - name: 购置日期
    type: date
    description: 提取 购置日期 的日期值，格式 YYYY-MM-DD
  - name: 购置金额
    type: number
    description: 提取 购置金额 的数值（含单位，如万元、吨等）
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 资产总额
    type: number
    description: 提取 资产总额 的数值（含单位，如万元、吨等）
  - name: 资产明细
    type: string
    description: 提取 资产明细 的文本值
  - name: 资产编号
    type: string
    description: 提取 资产编号 的文本值
  - name: 闲置时长
    type: string
    description: 提取 闲置时长 的文本值
  - name: 闲置起始日期
    type: date
    description: 提取 闲置起始日期 的日期值，格式 YYYY-MM-DD
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 资产清单.闲置时长(天) > 365 && 资产盘点日期.闲置原因分析 IN ('无明确处置计划', '未启动报废流程', '无调剂需求')
  description: 判定逻辑：资产最新状态标记为闲置，且闲置时间超过1年（365天），同时单位未给出合理的处置、报废或调剂方案，认定构成管理失职造成闲置浪费。
  audit_item: 违规使用国有资产
  suspicion: 国有资产长期闲置未处置
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十三条\",\n    \"内容概述\": \"各部门及其所属单位应当对闲置资产进行调剂使用，确实无法调剂的，应当依法采取拍卖等方式处置。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范和加强行政事业单位国有资产管理的指导意见\"\
    ,\n    \"法规文号\": \"财资〔2015〕90号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第三点\",\n    \"内容概述\": \"强化资产使用管理，严"
- expression: 资产清单.处置状态 == '未处置' && (当前日期 - 处置方案.计划处置完成时间 > 365) && 卡片.利用率 < 30%
  description: 资产被列入处置清单后超过1年仍未完成处置，且资产利用率仍低于30%，表明处置进度严重滞后。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
  suspicion: 低效无效资产处置进度缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中央企业资产减值准备财务核销工作规则\",\n    \"法规文号\": \"国资发评价〔2005〕67号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第五条\",\n    \"内容概述\": \"企业对已发生减值的资产应及时确认减值损失，并按规定程序核销或处置，不得长期挂账。\"\n  }\n]"
- expression: (资产类别、原值、开始摊销日期、年限、月摊销额.年限 < 资产清单.法律保护期限 且 无合理技术更新依据) || (资产类别、原值、开始摊销日期、年限、月摊销额.开始摊销日期 < 达到预定用途日期) || (支出台账.资本化金额对应的无形资产未在摊销表中出现)
  description: 摊销年限短于法律年限且无依据，缩短年限多摊费用；开始摊销时间早于可使用状态提前摊销；已形成无形资产却未摊销，均属错误。
  audit_item: 未按规定确认成本费用
  suspicion: 无形资产摊销不正确
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第6号——无形资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条、第十八条\",\n    \"内容概述\": \"使用寿命有限的无形资产，其应摊销金额应在使用寿命内系统合理摊销；企业应至少每年终了对使用寿命进行复核。\"\n  }\n]"
- expression: (资产监管制度文件.风险控制措施条款 为空) || (工作考核机制相关制度.双向评价机制条款 为空) || (近3年考核评价记录.考核执行年度 为空) || (ABS(成员社资产清单.资产总额 - 实际盘点记录.盘点金额)/实际盘点记录.盘点金额
    > 0.05)
  description: 制度文件缺失监管或评价机制条款即判定违规；近3年无考核评价记录视为机制未运行；抽取资产清单与实际盘点差异率超过5%且无合理解释，视为资产监管缺位。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 未建立成员社与联合社双向评价考核机制
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"构建联合社主导的行业指导体系，建立成员社对联合社的工作评价机制，完善联合社对成员社的工作考核机制。\"\n  }\n]"
- expression: 会计凭证.金额 > 50000 && (会计凭证.摘要 == "个人" || 其他.决策程序) && 资产清单.处置方式
  description: 筛查单笔支出超5万元且收款方为个人账户或缺乏成员大会审批决议的记录，同时核对资产清单确认是否属于已审批的资产处置。若无成员大会决议或收款方非供应商，判定为疑似侵占私分资产。
  audit_item: 新型经营主体设立和发展不符合相关规定
  suspicion: 侵占私分合作社资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第57号（2017年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第四十五条\",\n    \"内容概述\": \"农民专业合作社成员大会是本社的权力机构，行使审议批准重大财产处置、对外投资等重大事项的职权。\"\n  }\n]"
- expression: (明细表.收款方 != 合作社对公账户) || (水对账单.对方账户名称 IN 理事长/理事亲属工商登记名单 && 水对账单.交易金额 > 50000 && ABS(资产清单.购置金额 - 水对账单.交易金额) <
    0.1 * 资产清单.购置金额) || (资产清单.资产状态 == '账面无' && 证明文件.资产权属人 != 合作社)
  description: 若补贴资金收款方非合作社对公账户，或大额资金流向理事长等关联个人且与资产购置金额高度吻合，或账面资产无对应的权属证明文件，则判定为涉嫌资产侵占。阈值：金额>5万元且差异率<10%为可疑，需进一步核实关联关系。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 理事长等侵占私分合作社资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n   \
    \ \"条款号\": \"第三十八条\",\n    \"内容概述\": \"农民专业合作社的理事长、理事和管理人员不得侵占、挪用、私分或者以其他方式损害合作社的财产。\"\n  }\n]"
- expression: (资产清单.原值 / 资产清单.原值 > 0.2) || (使用台账.运行时长 / 使用台账.运行时长 < 0.1) || (分析表.单台设备投入产出比（ROI） < 1) || (使用台账.维护记录 && 资产清单.使用状态
    = '闲置')
  description: 闲置资产原值占比超过20%视为严重闲置；设备实际使用率低于设计量的10%为严重低效；投入产出比小于1意味着项目运行后不仅无收益，连运营成本都无法覆盖；资产无任何运行或维护记录且系统状态标记为闲置即为长期闲置。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 产业园资产闲置或效益低下
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价，提高财政资金使用效益。\"\n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n  \
    \  \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有截留、挪用财政资金，或以虚报、冒领等手段骗取财政资"
- expression: (资产清单.闲置起始日期 距当前日期 > 365天 && 记录留痕类-处置记录-处置方案审批日期、利用状态.利用状态 == "闲置") || (资产清单.处置方式 == "出租" && (文件4.审批流程缺失 ||
    资产清单.租金收入 未上缴财政))
  description: 校舍闲置超过一年且无再利用方案，或出租行为未经审批、收益未上缴，均属于违规行为
  audit_item: 小规模学校、寄宿制学校建设管理不规范
  suspicion: 闲置校舍长期未处置或违规出租
  regulation: "[\n  {\n    \"法规名称\": \"教育部关于农村闲置校舍处置工作的指导意见\",\n    \"法规文号\": \"教发〔2006〕4号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"三、处置方式与程序\",\n    \"内容概述\": \"闲置校舍应优先用于教育或社会公益事业，处置收入全额上缴国库，严禁擅自出租\"\n  }\n]"
