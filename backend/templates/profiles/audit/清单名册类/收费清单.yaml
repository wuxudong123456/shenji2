name: audit/清单名册类/收费清单
type: model
description: 从清单名册类类文档（收费清单）中提取结构化元数据。涵盖字段如：收费对象、收费标准、收费项目。文档范围包括：协会服务收费清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 收费清单
  member_count: 1
  member_details:
  - 协会服务收费清单
output:
  fields:
  - name: 收费对象
    type: number
    description: 提取 收费对象 的数值（含单位，如万元、吨等）
  - name: 收费标准
    type: number
    description: 提取 收费标准 的数值（含单位，如万元、吨等）
  - name: 收费项目
    type: number
    description: 提取 收费项目 的数值（含单位，如万元、吨等）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 委托协议.委托事项 IN 职能清单.法定行政职能事项 AND 委托协议.签订日期 >= '2015-07-08' AND 收费清单.收费项目 对应 委托事项
  description: 以委托协议方式将本应由行政机关实施的法定行政职能（如审批、年检、认证）交由协会办理，且协会向服务对象收取费用，无论是否经财政拨款，均属违规。脱钩方案发布后新签此类协议尤其违规。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 违规转移或委托法定职能
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推开行业协会商会与行政机关脱钩改革的实施意见\",\n    \"法规文号\": \"发改经体〔2019〕1063号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"三、脱钩任务和措施（二）职能分离\",\n    \"内容概述\": \"行政机关不得将法定职能转移或委托给行业协会商会，不得以购买服务等名义变相转移职能。\"\n  }\n]"
