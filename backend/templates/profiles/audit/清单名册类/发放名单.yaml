name: audit/清单名册类/发放名单
type: model
description: 从清单名册类类文档（发放名单）中提取结构化元数据。涵盖字段如：发放年度、发放金额、学生姓名、学籍号、家庭经济状况评定结果、补贴金额、领取人身份证号。文档范围包括：助学金发放名单、危房改造补贴发放名单、易地扶贫搬迁补贴发放名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 补贴
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 发放名单
  member_count: 1
  member_details:
  - 助学金发放名单
  - 危房改造补贴发放名单
  - 易地扶贫搬迁补贴发放名单
output:
  fields:
  - name: 发放年度
    type: date
    description: 提取 发放年度 的日期值，格式 YYYY-MM-DD
  - name: 发放金额
    type: number
    description: 提取 发放金额 的数值（含单位，如万元、吨等）
  - name: 学生姓名
    type: string
    description: 提取 学生姓名 的文本值
  - name: 学籍号
    type: string
    description: 提取 学籍号 的文本值
  - name: 家庭经济状况评定结果
    type: boolean
    description: 提取 家庭经济状况评定结果 的布尔值（是/否）
  - name: 补贴金额
    type: number
    description: 提取 补贴金额 的数值（含单位，如万元、吨等）
  - name: 领取人身份证号
    type: string
    description: 提取 领取人身份证号 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (发放名单.领取人身份证号 = 发放名单.领取人身份证号) && (发放周期均在互斥补贴项目列表与禁止兼得规定有效期内)
  description: 根据政策规定，已享受易地扶贫搬迁的农户不得再纳入危房改造补助范围。若同一身份证号同时出现在两个互斥补贴名单中，且发放时间重叠或符合互斥规则，即判定为违规重复享受。
  audit_item: 向不符合条件的人员发放保障待遇
  suspicion: 同时领取政策禁止兼得的多种专项补贴
  regulation: "[\n  {\n    \"法规名称\": \"《关于做好农村低收入群体等重点对象住房安全保障工作的实施意见》\",\n    \"法规文号\": \"建村〔2021〕35号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"三（一）\",\n    \"内容概述\": \"已实施易地扶贫搬迁的农户，不得列为农村危房改造补助对象。\"\n  }\n]"
- expression: 支出科目名称、支出金额、收款方、结算凭证号、凭证号、支出日期、摘要、金额、支出类别.摘要 NOT IN (补助资金限定性用途清单、禁止性支出条款.资金用途正面清单) || (学生姓名、学籍号、发放金额、家庭经济状况评定结果.学生姓名
    IN (教职工姓名、亲属姓名、亲属关系.亲属姓名) && 学生姓名、学籍号、发放金额、家庭经济状况评定结果.家庭经济状况评定结果!='贫困') || (学生姓名、学籍号、发放金额、家庭经济状况评定结果.发放金额 ≠ 应发标准 && 缺少特殊审批记录)
  description: 补助资金支出用途超出管理办法允许的清单范围（如用于办公费、招待费、人员工资等），或者助学金发放对象与教职工亲属交叉且该学生家庭未达到贫困标准，或发放金额与政策标准不符而无合理审批，均判定为资金使用不合规。
  audit_item: 工作开展不到位
  suspicion: 教育补助资金使用范围不合规
  regulation: "[\n  {\n    \"法规名称\": \"城乡义务教育补助经费管理办法\",\n    \"法规文号\": \"财教〔2021〕56号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条、第十四条\",\n    \"内容概述\": \"补助经费应专款专用，严禁用于偿还债务、平衡预算、发放教职工工资福利、公费旅游和用于非教育教学的行政运行等支出；学生资助资金应当及时足额发放给符合条件的学生。\"\
    \n  }\n]"
