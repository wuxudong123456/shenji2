name: audit/清单名册类/设备清单
type: model
description: 从清单名册类类文档（设备清单）中提取结构化元数据。涵盖字段如：书屋功能设施完备性、场地物理状态、型号、实训设备名称、数量、淘汰处置状态、设备名称、设计使用小时数。文档范围包括：农家书屋设备清单、教学设施设备清单、淘汰设备清单、配套设施设备清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 设备清单
  member_count: 1
  member_details:
  - 农家书屋设备清单
  - 教学设施设备清单
  - 淘汰设备清单
  - 配套设施设备清单
output:
  fields:
  - name: 书屋功能设施完备性
    type: string
    description: 提取 书屋功能设施完备性 的文本值
  - name: 场地物理状态
    type: boolean
    description: 提取 场地物理状态 的布尔值（是/否）
  - name: 型号
    type: string
    description: 提取 型号 的文本值
  - name: 实训设备名称
    type: string
    description: 提取 实训设备名称 的文本值
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 淘汰处置状态
    type: boolean
    description: 提取 淘汰处置状态 的布尔值（是/否）
  - name: 设备名称
    type: string
    description: 提取 设备名称 的文本值
  - name: 设计使用小时数
    type: string
    description: 提取 设计使用小时数 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (统计表.检测能效值 < 标准文件.能效限定值) && (设备清单.淘汰处置状态 != "已淘汰")
  description: 在用设备实测能效值低于国家强制标准的最低能效限定值，并且该设备未被列入已淘汰处置清单（即仍在使用），则判定违规。
  audit_item: 节能减排方面存在的问题
  suspicion: 生产或使用低于强制性能效标准的用能设备
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国节约能源法\",\n    \"法规文号\": \"主席令第七十七号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"禁止生产、进口、销售国家明令淘汰或者不符合强制性能源效率标准的用能产品、设备。\"\n  },\n  {\n    \"法规名称\": \"重点用能单位节能管理办法\"\
    ,\n    \"法规文号\": \"国家发展和改革委员会令第15号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十五条\",\n    \"内容概述\": \"重点用能单位不得使用国家明令淘汰的用能设备"
- expression: 设备清单.实际使用小时数 / 设备清单.设计使用小时数 < 0.5 || 设备清单.空置率 > 0.7
  description: 设备综合利用率低于50%视为严重闲置浪费，空置率高于70%视为长期闲置；若设备故障停机时长占应运行时长比例超过30%且维修记录缺失，同样判为效率低下。
  audit_item: 国家种子生产基地建设方面不符合相关规定
  suspicion: 基地配套设施设备闲置或使用效率低下
  regulation: "[\n  {\n    \"法规名称\": \"国家农业综合开发资金和项目管理办法\",\n    \"法规文号\": \"财政部令第84号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十九条\",\n    \"内容概述\": \"项目单位应当严格按照批准的计划实施，不得擅自变更建设地点、规模、标准和主要建设内容。\"\n  }\n]"
