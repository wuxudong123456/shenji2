name: audit/清单名册类/困县名单
type: model
description: 从清单名册类类文档（困县名单）中提取结构化元数据。涵盖字段如：县名、脱贫摘帽年份、试点资格。文档范围包括：国定贫困县名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 困县名单
  member_count: 1
  member_details:
  - 国定贫困县名单
output:
  fields:
  - name: 县名
    type: string
    description: 提取 县名 的文本值
  - name: 脱贫摘帽年份
    type: string
    description: 提取 脱贫摘帽年份 的文本值
  - name: 试点资格
    type: string
    description: 提取 试点资格 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 区县名称、整合资金总额、整合起始年度.区县名称 NOT IN (县名、脱贫摘帽年份、试点资格.县名) && 区县名称、整合资金总额、整合起始年度.整合资金总额 > 0
  description: 依据国办发〔2016〕22号文件，统筹整合财政涉农资金试点限于国定贫困县。非贫困县实施资金整合即为越权行为。若区县名称不在官方贫困县名单内且整合金额大于零，立即触发违规。
  audit_item: 涉农资金统筹整合不规范
  suspicion: 非贫困县超范围统筹整合涉农资金
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于支持贫困县开展统筹整合使用财政涉农资金试点的意见\",\n    \"法规文号\": \"国办发〔2016〕22号\",\n    \"效力级别\"\
    : \"国务院规范性文件\",\n    \"条款号\": \"一、试点范围\",\n    \"内容概述\": \"试点范围限定为连片特困地区县和国家扶贫开发工作重点县，其他县不得自行开展统筹整合。\"\n  }\n]"
