name: audit/清单名册类/渔民名单
type: model
description: 从清单名册类类文档（渔民名单）中提取结构化元数据。涵盖字段如：姓名、户籍地址、渔民ID、身份证号、退捕日期。文档范围包括：退捕渔民名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 渔民名单
  member_count: 1
  member_details:
  - 退捕渔民名单
output:
  fields:
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 户籍地址
    type: string
    description: 提取 户籍地址 的文本值
  - name: 渔民ID
    type: string
    description: 提取 渔民ID 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 退捕日期
    type: date
    description: 提取 退捕日期 的日期值，格式 YYYY-MM-DD
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (渔民名单.年龄 >= 60 && 情况表.养老保险参保状态 IS NULL) || (情况表.医疗保险参保状态 IS NULL) || (渔民名单.家庭收入 < 当地低保标准 && 情况表.低保享受状态 IS NULL)
    || (安置台账.危房鉴定等级 IN ('C','D') && 安置台账.改造申请状态 IS NULL)
  description: 基于退捕渔民名单（表1）左连接社保落实情况表（表2）和危房改造台账（表3），筛选出：年龄60岁以上但无养老保险记录、或无医疗保险记录、或家庭收入低于当地低保标准但未享受低保、或住房鉴定为C/D级危房但无改造完成记录的人员，均属于应享未享违规。其中低保标准参照政策公布线。
  audit_item: 退捕渔民转产安置不合规
  suspicion: 退捕渔民未按规定享受社会保障及危房改造政策
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"要求做好退捕渔民社会保障工作，确保退捕渔民按规定参加基本养老保险、基本医疗保险，将符合条件的困难渔民纳入低保和住房保障。\"\n  }\n]"
- expression: SELECT COUNT(DISTINCT 表4.安置类型) = 1 || (表1.年龄 > 50 && 表4.安置类型 = '自主创业' && 表6.身份证 IS NULL)
  description: 统计分类实施清单（表4）中安置类型的唯一种类，若仅为1种，表明“一刀切”未分类；同时检查年龄50岁以上渔民被安排自主创业但无相应培训记录的，属于分类与个体特征严重不匹配。
  audit_item: 退捕渔民转产安置不合规
  suspicion: 渔民转产安置方案未分类施策
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强长江流域重点水域禁捕和退捕渔民安置保障工作的通知\",\n    \"法规文号\": \"农办渔〔2021〕16号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"要求根据退捕渔民年龄、技能等特点，分类施策，提供个性化转产就业帮扶，杜绝简单摊派岗位。\"\n  }\n]"
- expression: (身份证号、原住址类型、安置类型、补偿总额.安置类型 = '城镇集中安置' && 身份证号、原住址类型、安置类型、补偿总额.产业配套计划 IS NULL) || (身份证号、原住址类型、安置类型、补偿总额.补偿总额
    < 安置原则、补偿标准、产业配套要求.补偿标准)
  description: 筛选湖心岛、江心岛渔民搬迁安置记录中，安置类型为城镇集中安置但无产业配套计划的，或补偿总额低于政策最低标准的，视为未因地制宜安置，可能导致渔民无法适应新环境。
  audit_item: 退捕渔民转产安置不合规
  suspicion: 湖心岛、江心岛渔民搬迁安置未因地制宜
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江流域重点水域禁捕和退捕渔民安置保障工作的意见\",\n    \"法规文号\": \"国办发〔2020〕31号\",\n    \"效力级别\"\
    : \"行政法规\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"要求对湖心岛等特殊区域渔民因地制宜采取安置方式，宜发展乡村旅游等特色产业，不得简单一搬了之，同时应保障合理补偿和后续就业。\"\n\
    \  }\n]"
- expression: ( (SELECT COUNT(DISTINCT 表6.身份证) * 1.0 / COUNT(*) FROM 表1) < 0.6 ) || (EXISTS (SELECT 身份证, 培训内容 FROM 表6 GROUP
    BY 身份证, 培训内容 HAVING COUNT(*) > 1))
  description: 计算实际参训人数占退捕渔民总人数的比率，低于60%的判定培训覆盖面不足；同时筛查同一身份证同一培训内容出现多次的记录，判定为虚假培训或重复充数。
  audit_item: 退捕渔民转产安置不合规
  suspicion: 退捕渔民职业技能培训未有效开展
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强长江流域重点水域禁捕和退捕渔民安置保障工作的通知\",\n    \"法规文号\": \"农办渔〔2021〕16号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"要求切实开展退捕渔民职业技能培训，确保培训内容实用、覆盖面广，提升就业转化率，不得虚列培训套取资金。\"\n  }\n]"
- expression: (渔民名单.审核状态='通过' && 渔民名单.是否符合保障条件='是') && (LEFT JOIN 明细表 ON 渔民名单.渔民ID = 明细表.个人编号 && 明细表.参保状态!='参保')
  description: 将资格审核表中审核通过且符合保障条件的渔民，与参保明细表进行左连接，筛选出在任一养老、医保、低保险种中参保状态不为'参保'的记录。出现此类记录即构成疑点，表明符合条件的退捕渔民未享受应保政策。
  audit_item: 退捕渔民安置不符合规定
  suspicion: 符合条件的退捕渔民未享受社会保险保障
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强长江流域重点水域禁捕和退捕渔民安置保障工作的通知\",\n    \"法规文号\": \"人社部发〔2020〕47号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"明确要求将符合条件的退捕渔民按规定纳入相应的养老保险、医疗保险、低保等社会保障制度，做到应保尽保、应发尽发。\"\n  }\n]"
- expression: 渔民名单.住房安全等级 IN ('C级','D级') && (LEFT JOIN 申请 ON 渔民名单.渔民ID = 申请.申请人ID && (申请.审批状态!='已审批' || 申请.改造完成日期 IS NULL))
  description: 筛选退捕渔民资格审核表中住房安全等级为C级或D级（即房屋存在安全隐患）的记录，并与危房改造审批记录比对，若该渔民未在任何一次危房改造审批中通过审批，或已审批但无完工日期，表明未实际享受危房改造政策。
  audit_item: 退捕渔民安置不符合规定
  suspicion: 符合条件的退捕渔民未享受危房改造政策
  regulation: "[\n  {\n    \"法规名称\": \"住房和城乡建设部、财政部、国务院扶贫办关于决战决胜脱贫攻坚 进一步做好农村危房改造工作的通知\",\n    \"法规文号\": \"建村〔2019〕83号\",\n\
    \    \"效力级别\": \"部门规章\",\n    \"条款号\": \"一、二\",\n    \"内容概述\": \"明确危房改造对象认定标准，要求精准认定危房改造对象，及时将符合条件的建档立卡贫困户等4类重点对象纳入改造范围，实现应改尽改。退捕渔民中符合条件的应同步纳入。\"\
    \n  }\n]"
- expression: 渔民ID、方案内容、转产方向、对接产业.方案内容 NOT CONTAINS ANY('水产养殖','休闲渔业','物流运输','农产品加工','生态管护','电商销售') && (渔民ID、方案内容、转产方向、对接产业.就业状态
    != '已就业')
  description: 检查每个渔民的转产安置方案内容，如果方案中未包含任何与本地水乡特色、退捕渔民适配的产业关键词，并且该渔民目前处于未就业状态，则判定为方案缺乏针对性。关键词可根据地方实际产业目录调整。
  audit_item: 退捕渔民安置不符合规定
  suspicion: 渔民转产安置方案缺乏针对性
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"四、精准帮扶退捕渔民转产转业\",\n    \"内容概述\": \"要求根据退捕渔民的年龄、技能、意愿，结合当地资源禀赋和产业基础，分类施策，制定有针对性的转产转业安置方案。\"\n  }\n]"
- expression: 安置实施进度表.安置方式 NOT IN (专项政策.安置模式选项) || (安置实施进度表.实施状态='已完成' && (ABS(安置实施进度表.拟安置地址 - 安置实施进度表.原居住岛屿) > 50公里 && 专项政策.选址原则!='异地集中安置')
    && (其他.投诉内容 CONTAINS '就学不便' OR '就医不便' OR '不适应'))
  description: 检查安置方式是否在专项政策规定的选项内（如就近安置、生态移民等），若安置方式不符则违规；对于已完成的安置，若安置距离超过50公里且不符合异地集中安置原则，并且有相关配套设施缺失投诉，则判定为未因地制宜。
  audit_item: 退捕渔民安置不符合规定
  suspicion: 湖心岛、江心岛渔民未因地制宜搬迁安置
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强长江流域重点水域禁捕和退捕渔民安置保障工作的通知\",\n    \"法规文号\": \"人社部发〔2020〕47号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"对湖心岛、江心岛渔民要因地制宜，采取就地就近安置或生态移民等方式妥善安置，并同步落实教育、医疗等公共服务。\"\n  }\n]"
- expression: 渔民名单.年龄 BETWEEN 16 AND 60 && 渔民名单.是否有培训意愿='是' && (LEFT JOIN 登记表 ON 渔民名单.渔民ID = 登记表.渔民ID && 登记表.培训日期 IS NULL)
    || (COUNT(登记表.培训项目) / 实施方案.培训计划期次 < 0.3)
  description: 选取年龄在劳动年龄段内、有培训意愿的退捕渔民，若在培训参与登记表中无任何培训记录，或户籍所在地整体培训项目开展期次不足计划30%，则视为未有效开展职业技能培训。
  audit_item: 退捕渔民安置不符合规定
  suspicion: 未对退捕渔民开展职业技能培训
  regulation: "[\n  {\n    \"法规名称\": \"人力资源社会保障部办公厅关于做好退捕渔民职业技能培训工作的通知\",\n    \"法规文号\": \"人社厅函〔2020〕118号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"一、二\",\n    \"内容概述\": \"要求将退捕渔民作为职业培训的重点群体，对有培训意愿的退捕渔民，至少提供1次免费职业技能培训，提升其就业创业能力。\"\n  }\n]"
