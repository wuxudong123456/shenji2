name: audit/清单名册类/目库清单
type: model
description: 从清单名册类类文档（目库清单）中提取结构化元数据。涵盖字段如：前期要件存档情况、技术标准、投资估算、时序安排、项目名称、项目编码。文档范围包括：规划项目库清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 目库清单
  member_count: 1
  member_details:
  - 规划项目库清单
output:
  fields:
  - name: 前期要件存档情况
    type: string
    description: 提取 前期要件存档情况 的文本值
  - name: 技术标准
    type: string
    description: 提取 技术标准 的文本值
  - name: 投资估算
    type: string
    description: 提取 投资估算 的文本值
  - name: 时序安排
    type: string
    description: 提取 时序安排 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目编码
    type: string
    description: 提取 项目编码 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (规划项目库清单记录数 == 0) || (抽样已完工项目与规划项目库关联匹配失败 且 无制度文件证明已入库)
  description: 项目库为空或抽查已完工项目在项目库中无对应记录的占比超过30%，且制度文件缺失或未实际运行，则判定未同步建立项目库。
  audit_item: 项目规划及资金使用不符合规定
  suspicion: 未同步建立农村公路建设规划项目库
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"农村公路建设规划应当建立项目库，实行动态管理，所有建设项目必须来源于项目库。\"\n  }\n]"
- expression: 规划项目库清单为空 || (规划项目库清单.项目编码存在重复) || (抽取30%项目，其中任一项目无工可批复或无环评批复 || 投资估算字段缺失 || 时序安排字段缺失)
  description: 制度文件要求建立项目库但事实上未建立，或项目库清单中无数据；或项目编码不唯一；或抽查项目中缺少立项、环评等前期要件，或缺失关键字段（投资估算、时序安排），即判定违规。
  audit_item: 项目规划及资金使用不符合规定
  suspicion: 未同步建立农村公路建设规划项目库
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"农村公路建设规划应当与国民经济和社会发展规划、土地利用总体规划、城乡规划等内容相衔接，建立规划项目库，实行动态管理。\"\n  }\n]"
- expression: 年度建设项目计划执行表.项目编码 NOT IN (规划项目库清单.项目编码) && (项目调整审批记录中无对应增补入库审批文号 || 无补录论证材料)
  description: 将年度计划项目清单与规划项目库进行比对，若项目编码在项目库中不存在，且无法提供正式的补录审批和完整论证材料，即认定为年度计划包含非入库项目，属于违规。
  audit_item: 项目规划及资金使用不符合规定
  suspicion: 年度计划包含不在规划项目库中的项目
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条、第十二条\",\n    \"内容概述\": \"未纳入规划项目库的项目，不得列入年度计划。农村公路建设项目年度计划应当依据规划项目库编制。\"\n  }\n]"
- expression: 年度计划项目编码 NOT IN (规划项目库项目编码) && 项目调整审批记录中不存在该项目的‘同意增补’记录
  description: 将年度计划项目与规划项目库进行编码关联，筛选出不在库中的项目，再核查这些项目是否有合规的入库增补审批，无审批则违规。
  audit_item: 项目规划及资金使用不符合规定
  suspicion: 年度计划项目超出规划项目库范围
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十五条\",\n    \"内容概述\": \"规划项目库是编制年度计划的基础，未纳入项目库的项目原则上不得列入年度建设计划。\"\n  }\n]"
