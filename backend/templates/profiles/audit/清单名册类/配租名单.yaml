name: audit/清单名册类/配租名单
type: model
description: 从清单名册类类文档（配租名单）中提取结构化元数据。涵盖字段如：家庭成员、承租人身份证号、配租房屋地址。文档范围包括：公租房实物配租名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 配租名单
  member_count: 1
  member_details:
  - 公租房实物配租名单
output:
  fields:
  - name: 家庭成员
    type: string
    description: 提取 家庭成员 的文本值
  - name: 承租人身份证号
    type: string
    description: 提取 承租人身份证号 的文本值
  - name: 配租房屋地址
    type: string
    description: 提取 配租房屋地址 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (住房保障申请家庭信息表.收入 > 住房保障政策文件.准入收入标准) || (不动产登记信息与住房保障名单比对表.房产面积 > 0) || (公租房实物配租名单.同一身份证号存在多条不同区域配租记录) || (家庭收入与个人所得税缴纳比对表.收入反推数据
    > 住房保障政策文件.准入收入标准 && 住房保障申请家庭信息表.申报年收入 < 家庭收入与个人所得税缴纳比对表.收入反推数据*0.7)
  description: 家庭人均年收入超过当地公布的公租房收入准入线；家庭成员名下有任何房产即不符合无房或住房困难条件；同一身份证号在不同城区或不同项目有实物配租记录，存在重复享受；当税务或社保反推收入高于政策收入线，且申报收入低于反推收入的70%时，视为虚假收入申报。以上任一条件满足即触发疑点。
  audit_item: 不符合条件的家庭违规获取住房保障待遇
  suspicion: 家庭收入或房产超标违规获取公租房
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条、第三十一条\",\n    \"内容概述\": \"申请公共租赁住房，应当符合在本地无住房或者住房面积低于规定标准、收入财产低于规定标准等条件；申请人隐瞒有关情况或提供虚假材料的，取消保障资格，并记入信用档案。\"\n\
    \  }\n]"
