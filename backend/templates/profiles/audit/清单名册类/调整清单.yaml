name: audit/清单名册类/调整清单
type: model
description: 从清单名册类类文档（调整清单）中提取结构化元数据。涵盖字段如：价格调整记录、销售退回。文档范围包括：资产负债表日后事项调整清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 调整清单
  member_count: 1
  member_details:
  - 资产负债表日后事项调整清单
output:
  fields:
  - name: 价格调整记录
    type: number
    description: 提取 价格调整记录 的数值（含单位，如万元、吨等）
  - name: 销售退回
    type: string
    description: 提取 销售退回 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (明细账.确认日期 < 单据.客户签收日期) && (合同条约定需验收或安装) || (明细账.确认日期 在资产负债表日后但单据.发货日期在日前) && (期后事项未显示该推迟)
  description: 在合同约定验收条件下，未取得验收便确认收入，属于提前确认；商品已交付却延后至下期确认，属于推迟确认。
  audit_item: 未按规定确认收入
  suspicion: 推迟或提前确认销售收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"对于在某一时点履行的履约义务，企业应当在客户取得相关商品控制权时点确认收入。\"\n  }\n]"
