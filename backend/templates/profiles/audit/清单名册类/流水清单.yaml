name: audit/清单名册类/流水清单
type: model
description: 从清单名册类类文档（流水清单）中提取结构化元数据。涵盖字段如：交易附言、发放账户、时间、金额。文档范围包括：银行代发补贴流水清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 流水清单
  member_count: 1
  member_details:
  - 银行代发补贴流水清单
output:
  fields:
  - name: 交易附言
    type: string
    description: 提取 交易附言 的文本值
  - name: 发放账户
    type: string
    description: 提取 发放账户 的文本值
  - name: 时间
    type: date
    description: 提取 时间 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ABS(SUM(拨付台账.拨付金额) - SUM(流水清单.金额)) > 100 OR 流水清单.收款账户 NOT IN (SELECT 银行账号 FROM 明细表) OR 财务账目.支出明细 LIKE '%补贴返还%'
    OR 财务账目.其他收入 > 0 AND 来源不明
  description: 财政拨付总额与银行实际代发到户总额存在差异（差值>100元），或补贴资金流向非农户账户，或村级账目中出现“补贴款返还”“捐赠”等异常收入，均表明资金可能被截留用于二次分配。
  audit_item: 惠农补贴发放不到位
  suspicion: 截留惠农补贴资金二次分配
  regulation: "[\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"截留、挪用财政资金的，责令改正，调整有关会计账目，追回违反规定使用的财政资金，并对单位给予警告或者通报批评。\"\n  }\n]"
