name: audit/清单名册类/发放清单
type: model
description: 从清单名册类类文档（发放清单）中提取结构化元数据。涵盖字段如：企业名称、保单号、借款人名称、借款金额、发放名目、发放时间、发放金额、发放项目。文档范围包括：企业工资发放清单、低收入群体补贴发放清单、创业担保贷款发放清单、奖金发放清单、畜禽粪污资源化利用装备补贴发放清单、职工福利发放清单、补贴发放清单、财政补贴资金发放清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 薪酬
- 补贴
- 金额
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 发放清单
  member_count: 1
  member_details:
  - 企业工资发放清单
  - 低收入群体补贴发放清单
  - 创业担保贷款发放清单
  - 奖金发放清单
  - 畜禽粪污资源化利用装备补贴发放清单
  - 职工福利发放清单
  - 补贴发放清单
  - 财政补贴资金发放清单
output:
  fields:
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 保单号
    type: string
    description: 提取 保单号 的文本值
  - name: 借款人名称
    type: number
    description: 提取 借款人名称 的数值（含单位，如万元、吨等）
  - name: 借款金额
    type: number
    description: 提取 借款金额 的数值（含单位，如万元、吨等）
  - name: 发放名目
    type: string
    description: 提取 发放名目 的文本值
  - name: 发放时间
    type: date
    description: 提取 发放时间 的日期值，格式 YYYY-MM-DD
  - name: 发放金额
    type: number
    description: 提取 发放金额 的数值（含单位，如万元、吨等）
  - name: 发放项目
    type: string
    description: 提取 发放项目 的文本值
  - name: 员工姓名
    type: string
    description: 提取 员工姓名 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 实际发放金额
    type: number
    description: 提取 实际发放金额 的数值（含单位，如万元、吨等）
  - name: 工种
    type: string
    description: 提取 工种 的文本值
  - name: 户籍所在地
    type: string
    description: 提取 户籍所在地 的文本值
  - name: 月工资
    type: string
    description: 提取 月工资 的文本值
  - name: 申报用途
    type: string
    description: 提取 申报用途 的文本值
  - name: 补贴对象
    type: string
    description: 提取 补贴对象 的文本值
  - name: 补贴退还标志
    type: boolean
    description: 提取 补贴退还标志 的布尔值（是/否）
  - name: 补贴金额
    type: number
    description: 提取 补贴金额 的数值（含单位，如万元、吨等）
  - name: 补贴项目
    type: string
    description: 提取 补贴项目 的文本值
  - name: 贷款发放日期
    type: date
    description: 提取 贷款发放日期 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 领取人签字
    type: string
    description: 提取 领取人签字 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (财务凭证.记账科目 == '福利费' AND (对比表.实际人均福利支出 > 对比表.预算标准 OR 财务凭证.摘要 NOT IN (下达文件.资金用途限定))) OR (财务凭证.支出摘要 CONTAINS ('节日慰问','购物卡','旅游')
    AND 财务凭证.支出事由 IN ('财政专项','行政运行经费') AND 财务凭证.附件完整性)
  description: 直接列支福利费且超标准或超范围，或通过伪装成其他支出（如培训费、会议费）变相发放福利。当福利支出摘要中出现购物卡、旅游等关键词且资金来源为财政专项或公用经费时触发疑点。
  audit_item: 挤占挪用套取财政资金
  suspicion: 挪用财政资金用于职工福利
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员……违反规定使用、骗取财政资金……（四）违反规定扩大开支范围，提高开支标准。\"\n  },\n  {\n    \"法规名称\": \"违规发放津贴补贴行为处分规定\"\
    ,\n    \"法规文号\": \"监察部令第31号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"违反规定自行新设项目或者继续发放已经明令取消的津贴补"
- expression: (农业保险投保明细表.投保面积 > 农业部门种植/养殖面积统计表.统计面积 * 1.2) || (农业保险投保明细表.投保面积/数量 > 投保人身份证明.养殖档案存栏量 * 1.2) || (跨部门保单信息比对差异表.差异比例
    > 0.2)
  description: 当投保面积超出农业部门核实面积的20%以上，或投保牲畜数量超出养殖档案存栏上限的20%，或跨部门差异表中面积/数量偏差率超过20%时，判定为虚构或虚增保险标的。阈值可根据当地实际调整，偏差率越高风险越大。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 虚构或虚增保险标的骗取保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条第一项\"\
    ,\n    \"内容概述\": \"禁止投保人虚构或者虚增保险标的、以同一保险标的多次重复投保，骗取农业保险的保险费补贴。\"\n  }\n]"
- expression: 同一保险标的重复投保清单.重叠保单数 >= 2 && 同一保险标的重复投保清单.重叠时段 == '是'
  description: 通过时空重叠分析，同一地块坐标或同一权属编号在保险期间内同时存在于两家及以上保险公司的有效保单中，且重叠保单数≥2，即可判定重复投保。系统自动生成重复投保清单，重叠保单数越多风险越高。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 同一标的多次重复投保骗取保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条第一项\"\
    ,\n    \"内容概述\": \"禁止投保人以同一保险标的多次重复投保，骗取农业保险保费补贴。\"\n  }\n]"
- expression: (保险公司退保记录表.退保金额 > 0) && (财政补贴资金发放清单.补贴退还标志 == '否')
  description: 当存在有效退保记录，但对应保单的财政补贴资金未按规定扣减或退回财政专户，即保险公司仍全额领取了补贴，即为虚假退保截留资金。该表达式通过退保数据与补贴退回状态比对，直接锁定疑点。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 保险公司虚假退保截留挪用补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条第二项\"\
    ,\n    \"内容概述\": \"禁止保险公司通过虚假退保或者截留、挪用保险金、经营费用等方式骗取保费补贴。\"\n  }\n]"
- expression: 跨部门保单信息比对差异表.差异金额 > 0 && (跨部门保单信息比对差异表.差异类型 IN ('面积超限','撂荒投保','多头补贴')) && (财政补贴资金发放清单.发放时间 > 农业部门种植/养殖面积统计表.数据生成日期)
  description: 跨部门差异表中存在差异金额，且差异属于面积虚增、已撂荒地块投保或多头补贴类型，同时财政补贴发放时点晚于农业部门数据更新日期，表明共享数据未有效利用，造成无效补贴。差异金额大于零即触发疑点。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 部门数据共享不足导致财政资金浪费
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\"\
    ,\n    \"内容概述\": \"国务院财政、农业、林业、保险监督管理等部门应当建立农业保险相关信息的共享机制。\"\n  },\n  {\n    \"法规名称\": \"中央财政农业保险保险费补贴管理办法\",\n    \"\
    法规文号\": \"财金〔2021〕41号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"地方财政部门应会同有关部门加强投保标的真实性、准确性审核，确保财政补"
- expression: 补贴政策文件.补贴标准 < 成本核算资料.各类工程运行维护成本（含大修、日常维护） * 0.6
  description: 制定的精准补贴标准明显低于运行维护成本的60%，补贴难以覆盖基本维护需求，未体现与运行维护成本的直接挂钩。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 精准补贴标准未与运行维护成本挂钩
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"四、建立精准补贴和节水奖励机制（五）\",\n    \"内容概述\": \"补贴标准由各地根据实际差水率、运行维护成本、用水户承受能力等因素合理确定。要确保补贴后农业水价达到运行维护成本水平。\"\n\
    \  }\n]"
- expression: (数据表.分红收入年增长率 < 0.05) || (数据表.本地农民就业占比 < 0.6) || (合作协议.分红比例条款 != 分红记录.年度分红金额) || (数据表.农民工资性收入年增长率 < 0.05)
  description: 分红收入或工资性收入年增长率低于5%视为带动增收效果不显著；本地农民就业比例低于60%表明未优先带动当地农户；协议分红与实际发放不符则直接判定机制执行不到位。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 利益联结机制缺失未带动农民增收
  regulation: "[\n  {\n    \"法规名称\": \"《关于促进农业产业化联合体发展的指导意见》\",\n    \"法规文号\": \"农经发〔2017〕13号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"二、基本原则和任务目标\",\n    \"内容概述\": \"要建立紧密的利益共享机制，保障农民分享产业链增值收益，带动农户增收致富。\"\n  }\n]"
- expression: （申报审批状态 == '通过'） && （实际发放金额 < 审批通过金额） || （ (申报设备名称 in 补贴装备目录) && (申报审批状态 == '驳回' || 申报审批状态 == '搁置') ）
  description: 该表达式包含两种违规情况：1. 审批通过但资金未足额发放；2. 申报设备在补贴目录内但被无故驳回或长期搁置。两种情况均判定为补贴落实不到位。
  audit_item: 畜禽粪污资源化利用方面不符合相关规定
  suspicion: 符合条件的装备未纳入补贴或补贴不到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位的支出必须按照预算执行，不得虚假列支。\"\n  }\n]"
- expression: (低收入群体补贴发放清单.补贴金额 < 政策规定应补金额) || (低收入人群认定标准及名单.身份证号 NOT IN ( SELECT 低收入群体补贴发放清单.身份证号)) || (用户收费明细台账.减免金额 = 0
    && 低收入人群认定名单中包含该用户)
  description: 将低收入人群认定名单与补贴发放清单、收费减免标记进行关联比对，若名单内人员未出现在补贴清单中，或补贴金额不足，或应减免的费用未减免（减免金额为0），均判定为未落实。政策覆盖率应达到100%。
  audit_item: 项目实施不合规
  suspicion: 低收入人群优惠政策落实不到位
  regulation: "[\n  {\n    \"法规名称\": \"污水处理费征收使用管理办法\",\n    \"法规文号\": \"财税〔2014〕151号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"对城镇低保对象家庭，应当按规定减免污水处理费，具体减免标准和办法由地方价格主管部门会同财政、排水主管部门制定。\"\n  }\n]"
- expression: (发放清单.申报用途 != 使用台账.实际用途描述) || (水对账单.贷款资金去向交易对手 NOT IN (设备供应商、原材料供应商、场地出租方) && 水对账单.交易金额 > 贷款金额的60%) || (水对账单.资金回流标志
    == 1) || (证明材料.设备购置发票及实物照片 < 贷款金额的50% && ABS(信息.纳税申报收入增长率) < 5%)
  description: 通过比对贷款申报用途与实际银行流水去向，判断资金是否用于禁止领域。若申报购买设备，但主要资金流向房地产公司、证券公司、个人账户或用于偿还其他贷款，则触发违规。大额现金提取或资金回流至借款人关联账户是高风险信号。同时，贷后经营数据（如纳税、社保）无显著增长，佐证贷款未用于真实经营的违规事实。
  audit_item: 挤占挪用资金（社保）
  suspicion: 违规挪用创业担保贷款至非申报用途
  regulation: "[\n  {\n    \"法规名称\": \"财政部 人力资源社会保障部 中国人民银行关于进一步做好创业担保贷款工作的通知\",\n    \"法规文号\": \"财金〔2023〕18号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"创业担保贷款应用于借款人创业企业的生产经营活动，不得转借他人使用，不得用于购买股票、期货等有价证券和从事股本权益性投资，不得用于违反国家有关法律、法规的用途。\"\
    \n  },\n  {\n    \"法规名称\": \"个人贷款管理暂行办法\",\n    \"法规文号\": \"中国银行业监督管理委员会令2010年第2号\",\n    \"效力级别"
