name: audit/清单名册类/用户清单
type: model
description: 从清单名册类类文档（用户清单）中提取结构化元数据。涵盖字段如：具体位置、大功率设备数量、实际完成改造户数、执行电价标准、改造户数、改造类型、未通电用户数、用户名称。文档范围包括：农业生产用电用户清单、农牧区未通电用户清单、清洁取暖用户清单、煤改电用户清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 用户清单
  member_count: 1
  member_details:
  - 农业生产用电用户清单
  - 农牧区未通电用户清单
  - 清洁取暖用户清单
  - 煤改电用户清单
output:
  fields:
  - name: 具体位置
    type: string
    description: 提取 具体位置 的文本值
  - name: 大功率设备数量
    type: number
    description: 提取 大功率设备数量 的数值（含单位，如万元、吨等）
  - name: 实际完成改造户数
    type: string
    description: 提取 实际完成改造户数 的文本值
  - name: 执行电价标准
    type: string
    description: 提取 执行电价标准 的文本值
  - name: 改造户数
    type: string
    description: 提取 改造户数 的文本值
  - name: 改造类型
    type: string
    description: 提取 改造类型 的文本值
  - name: 未通电用户数
    type: string
    description: 提取 未通电用户数 的文本值
  - name: 用户名称
    type: string
    description: 提取 用户名称 的文本值
  - name: 用户地址
    type: string
    description: 提取 用户地址 的文本值
  - name: 用户身份证号
    type: string
    description: 提取 用户身份证号 的文本值
  - name: 用电类别
    type: string
    description: 提取 用电类别 的文本值
  - name: 计划通电时间
    type: date
    description: 提取 计划通电时间 的日期值，格式 YYYY-MM-DD
  - name: 详细地址
    type: string
    description: 提取 详细地址 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ([用户清单].未通电用户数 > 0) && (当前日期 > [专项计划].完成时限)
  description: 在专项计划明确的全面通电时限过后，若未通电用户清单中仍存在未通电户，即判定为未实现全覆盖。若有资金拨付但未完成线路架设，或存在应通未通的遗漏户，属于严重管理违规。
  audit_item: 农村电网改造升级任务目标未完成
  suspicion: 农牧区用电未实现全覆盖
  regulation: "[\n  {\n    \"法规名称\": \"关于全面解决无电人口用电问题的指导意见\",\n    \"法规文号\": \"发改能源〔2015〕1512号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"各有关地区和电网企业要确保到2015年底解决无电人口用电问题，对偏远地区通过电网延伸或微电网等方式实现全覆盖，不得遗漏。\"\n  },\n \
    \ {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2013〕678号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\"\
    ,\n    "
- expression: 用户清单.实际完成改造户数 < 计划改造总户数.计划改造总户数 * 0.95
  description: 将验收报告及台账中的实际完成户数总和与实施方案中的计划改造总户数对比，若实际完成量低于计划量的95%（允许5%偏差），则判定为任务未完成；偏差越大违规越严重。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 清洁取暖改造任务户数未完成
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位的支出必须按照预算执行，提高财政资金使用效益；未完成清洁取暖改造任务表明财政资金使用未达到预设目标，资金效益低下。\"\n  }\n]"
- expression: 统计上报清洁取暖率 < 实施方案.考核期目标清洁取暖率
  description: 将清洁取暖率统计表中的实际清洁取暖率与实施方案中规定的考核目标值对比，若实际值低于目标值，则判定为清洁取暖率不达标；当实际值大幅低于目标值（如低10个百分点以上）时风险较高。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 清洁取暖率不达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国大气污染防治法\",\n    \"法规文号\": \"中华人民共和国主席令第31号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"国务院有关部门和地方各级人民政府应当采取措施，提高清洁能源使用比重，推进冬季清洁取暖。清洁取暖率未达标表明未有效落实法律要求，未能实现空气改善目标。\"\n  }\n\
    ]"
- expression: (COUNT(用户清单.用户身份证号) > COUNT(DISTINCT 用户清单.用户身份证号)) || (数据表.改造后月均清洁能源用量 = 0 && 明细表.发放金额 > 0) || (用户清单.设备序列号 重复)
  description: 三个触发条件之一出现即判定为弄虚作假嫌疑：同一身份证号多次出现表明重复申报；补贴已发放但对应的能源监测用量为零表明设备未实际使用可能为虚假安装；同一设备序列号出现在不同用户中表明设备台账重复。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 弄虚作假虚报清洁取暖改造任务完成量
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员不得以虚报、冒领等手段骗取财政资金；弄虚作假虚报改造完成量套取补贴属于典型的骗取财政资金行为。\"\n  }\n]"
- expression: (用户清单.用电类别 == '商业用电' || 用户清单.用电类别 == '大工业用电') && (用户清单.执行电价标准 > 农业用电优惠目录类别、优惠电价标准.优惠电价标准)
  description: 筛选出用电登记类别为商业或工业等非农类别，且实际执行电价高于政策规定的农业优惠电价的用户。这些用户可能属于农业生产性质但未被正确分类，导致未能享受优惠电价。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业用电户被错误计收商业电价
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电力法\",\n    \"法规文号\": \"中华人民共和国主席令第二十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十三条\",\n    \"内容概述\": \"用户用电增容收费标准，由国务院物价行政主管部门会同国务院电力管理部门制定。\"\n  },\n  {\n    \"法规名称\": \"关于进一步深化燃煤发电上网电价市场化改革的通知（及各省农业用电目录电价文件）\"\
    ,\n    \"法规文号\": \"发改价格〔2021〕1439号等\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"各地相关条款\",\n    \"内容概述\":"
