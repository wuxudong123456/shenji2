name: audit/清单名册类/积金清单
type: model
description: 从清单名册类类文档（积金清单）中提取结构化元数据。涵盖字段如：单位编号、对应账户编号、管理中心标识、缴存月份、职工身份证号。文档范围包括：单位代缴公积金清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 积金清单
  member_count: 1
  member_details:
  - 单位代缴公积金清单
output:
  fields:
  - name: 单位编号
    type: string
    description: 提取 单位编号 的文本值
  - name: 对应账户编号
    type: string
    description: 提取 对应账户编号 的文本值
  - name: 管理中心标识
    type: string
    description: 提取 管理中心标识 的文本值
  - name: 缴存月份
    type: string
    description: 提取 缴存月份 的文本值
  - name: 职工身份证号
    type: string
    description: 提取 职工身份证号 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (COUNT(信息表 WHERE 账户状态='正常' GROUP BY 身份证号) > 1) && (EXISTS (SELECT 缴存月份 FROM 记录表 WHERE 身份证号 IN (SELECT 身份证号 FROM
    信息表 WHERE 账户状态='正常' GROUP BY 身份证号 HAVING COUNT(*) > 1) GROUP BY 缴存月份 HAVING COUNT(DISTINCT 账户编号) > 1))
  description: 以身份证号为唯一标识，当同一公积金管理中心内同一身份证号下存在2个及以上状态为正常的账户，且至少在一个缴存月份内，这些不同账户均存在缴存记录，则触发违规判定。阈值设为正常账户数>1，且同一月份不同账户缴存记录数≥2，两条件同时满足视为严重违规疑点。
  audit_item: 多个账户重复缴存住房公积金
  suspicion: 同一人在一个公积金管理中心重复设立多个正常缴存账户
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"每个职工只能有一个住房公积金账户。单位应当到住房公积金管理中心办理住房公积金缴存登记，并为本单位职工办理住房公积金账户设立手续。\"\n  }\n]"
- expression: (COUNT(比对表 WHERE 账户状态='正常' GROUP BY 身份证号) > 1) && (EXISTS (SELECT 缴存月份 FROM (SELECT 身份证号, 缴存月份, 管理中心归属 FROM
    信息表) GROUP BY 身份证号, 缴存月份 HAVING COUNT(DISTINCT 管理中心归属) > 1))
  description: 基于跨中心缴存记录比对表，当同一身份证号在2个及以上公积金管理中心均存在正常状态账户，且缴存明细中存在同一缴存月份不同管理中心同时有缴存记录的情况，即判定为跨中心重复缴存违规。若无跨中心比对表，则需通过身份证号+姓名模糊匹配各中心数据，逻辑相同。阈值设为不同管理中心正常账户数>1，且存在月份内多中心缴存重叠。
  audit_item: 多个账户重复缴存住房公积金
  suspicion: 同一人在多个公积金管理中心重复设立正常缴存账户
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"每个职工只能有一个住房公积金账户。单位应当到住房公积金管理中心办理住房公积金缴存登记，并为本单位职工办理住房公积金账户设立手续。\"\n  }\n]"
