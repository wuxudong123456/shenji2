name: audit/清单名册类/问题清单
type: model
description: 从清单名册类类文档（问题清单）中提取结构化元数据。涵盖字段如：佐证材料、冲突类型、审计报告日期、导致返工或效果抵消的损失金额估算、整改完成日期、整改状态、未达标地块坐标、未达标程度。文档范围包括：以往审计问题清单、公路质量抽检问题清单、多项目重叠实施区域冲突问题清单、未达标地块问题清单、监督检查发现问题清单、监督检查问题清单、质量抽检问题清单、风险排查问题清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 整改
- 登记
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 问题清单
  member_count: 1
  member_details:
  - 以往审计问题清单
  - 公路质量抽检问题清单
  - 多项目重叠实施区域冲突问题清单
  - 未达标地块问题清单
  - 监督检查发现问题清单
  - 监督检查问题清单
  - 质量抽检问题清单
  - 风险排查问题清单
output:
  fields:
  - name: 佐证材料
    type: string
    description: 提取 佐证材料 的文本值
  - name: 冲突类型
    type: string
    description: 提取 冲突类型 的文本值
  - name: 审计报告日期
    type: date
    description: 提取 审计报告日期 的日期值，格式 YYYY-MM-DD
  - name: 导致返工或效果抵消的损失金额估算
    type: number
    description: 提取 导致返工或效果抵消的损失金额估算 的数值（含单位，如万元、吨等）
  - name: 整改完成日期
    type: date
    description: 提取 整改完成日期 的日期值，格式 YYYY-MM-DD
  - name: 整改状态
    type: boolean
    description: 提取 整改状态 的布尔值（是/否）
  - name: 未达标地块坐标
    type: string
    description: 提取 未达标地块坐标 的文本值
  - name: 未达标程度
    type: string
    description: 提取 未达标程度 的文本值
  - name: 涉及地区
    type: string
    description: 提取 涉及地区 的文本值
  - name: 涉及村集体
    type: string
    description: 提取 涉及村集体 的文本值
  - name: 涉及金额
    type: number
    description: 提取 涉及金额 的数值（含单位，如万元、吨等）
  - name: 设施缺失项及位置
    type: string
    description: 提取 设施缺失项及位置 的文本值
  - name: 违规事项描述
    type: string
    description: 提取 违规事项描述 的文本值
  - name: 重叠面积
    type: string
    description: 提取 重叠面积 的文本值
  - name: 问题描述
    type: string
    description: 提取 问题描述 的文本值
  - name: 问题根源类别
    type: string
    description: 提取 问题根源类别 的文本值
  - name: 问题登记日期
    type: date
    description: 提取 问题登记日期 的日期值，格式 YYYY-MM-DD
  - name: 问题类型
    type: string
    description: 提取 问题类型 的文本值
  - name: 问题编号
    type: string
    description: 提取 问题编号 的文本值
  - name: 风险等级
    type: string
    description: 提取 风险等级 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 耕地土壤有机质含量监测数据表.有机质含量 < 土壤有机质提升技术规程.有机质目标值
  description: 以地方制定的有机质提升技术规程或考核目标中的有机质含量标准为依据，当监测数据表中任一有效监测点位的土壤有机质含量低于该目标值时，即判定为该点位未达标；若未达标点位数量达到一定比例（如超过10%）或连续年度下降，则认定为耕地土壤有机质含量整体未达标。
  audit_item: 任务目标未完成
  suspicion: 耕地土壤有机质含量未达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当将黑土地保护纳入国民经济和社会发展规划，安排资金，确保黑土地面积不减、质量不降，生态功能不退化。\"\n  }\n]"
- expression: (MAX(金融业务风险排查专项报告（近3年）.报告日期) < DATEADD(YEAR, -1, TODAY()) OR COUNT(金融业务风险排查专项报告（近3年）) = 0) && (SUM(CASE WHEN
    风险排查问题清单.整改状态 = '已完成' THEN 1 ELSE 0 END) * 1.0 / COUNT(风险排查问题清单) < 0.8 || ABS(金融业务风险排查专项报告（近3年）.发现问题数量 - 金融服务业务台账.不良率)
    / 金融服务业务台账.不良率 > 0.2)
  description: 判定标准：最近一次风险排查报告日期距当前超过一年（或报告缺失），且问题整改台账完成率低于80%，或排查发现的问题数量与业务台账计算的不良率、逾期笔数等风险指标偏差率超过20%，表明未真实有效开展排查。
  audit_item: 供销合作社金融服务不规范
  suspicion: 未定期开展金融风险排查并建立台账
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"四、（十三）\",\n    \"内容概述\": \"规范发展农村合作金融，要求供销合作社加强风险防控，建立风险预警和处置机制，定期开展风险排查。\"\n  }\n]"
- expression: 文件存在性.文件存在性 == false || (文件存在性.经营规模量化指标 == '' || 文件存在性.农业收入占比要求 == '') || (审核台账.公示天数 < 5)
  description: 判定县级以上部门认定标准制度是否健全有效。条件1：认定标准文件完全缺失；或条件2：虽有文件但缺失经营规模、收入占比等核心量化指标导致标准虚置；或条件3：认定台账审核记录中公示天数少于法定5个工作日。任意一条触发即为疑点。
  audit_item: 家庭农场认定制度不健全
  suspicion: 县以上农业农村部门未制定家庭农场认定标准
  regulation: "[\n  {\n    \"法规名称\": \"关于实施家庭农场培育计划的指导意见\",\n    \"法规文号\": \"农政发〔2019〕16号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二条第四项\",\n    \"内容概述\": \"明确要求县以上农业农村部门制定家庭农场认定标准，建立名录系统，规范认定程序，并实行动态管理。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国行政许可法\",\n    \"法规文号\": \"主席令第七号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"行政机关作出行政许可决定，依法需要听证、招"
- expression: (明细表.身份证号 重复计数 > 1 且 分配金额 > 0) || (明细表.身份证号 关联 公安死亡人口数据 存在匹配且分配金额 > 0) AND (该村集体经济组织在监督检查台账中无最近两年检查记录 || 对应问题未出现在任何底稿中)
  description: 满足以下任一条件：①同一身份证号多次分配；②死亡人员仍参与分配。同时对应村集体近两年未被检查或检查底稿中未提及此类异常，表明监督检查缺失导致侵害未被发现。
  audit_item: 政策支持落实和监督检查不到位
  suspicion: 监督检查不到位未发现侵害集体经济组织权益行为
  regulation: "[\n  {\n    \"法规名称\": \"农村集体经济组织审计规定\",\n    \"法规文号\": \"农办经〔2008〕8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第五条\",\n    \"内容概述\": \"各级农村经营管理部门应当对农村集体经济组织财务收支、资产运营等情况进行定期审计，及时发现和纠正违法违纪问题。\"\n  }\n]"
- expression: 多项目重叠实施区域冲突问题清单.重叠面积 > 0 && ((跨部门协调会议纪要.协调会议召开次数 = 0) || (DATEDIFF(多项目重叠实施区域冲突问题清单.冲突问题发现时间, 跨部门协调会议纪要.最近一次会议时间)
    > 365))
  description: 存在项目空间重叠且措施冲突（重叠面积大于0），同时缺乏跨部门协调机制（协调会议召开次数为0）或者最近一次协调会议距离问题发现时间已超过1年（365天），证明统筹机制长期失效，冲突风险未能及时化解。
  audit_item: 黑土地保护治理缺少持续性，后期管护不到位
  suspicion: 多项目治理措施统筹不力导致相互冲突
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于探索建立涉农资金统筹整合长效机制的意见\",\n    \"法规文号\": \"国发〔2017〕54号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（三）项\",\n    \"内容概述\": \"要加强部门间的沟通协作，在同一区域集中投入不同渠道资金时，要加强规划统筹和任务分工，防止项目重复建设、措施相互‘打架’，确保资金整合效益最大化。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国乡村振兴促进法\",\n    \"法规文号\": \"中华人民共和国主席令第77号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":"
- expression: (设计文件.安全设施设计项数 - 验收报告.安全设施实际建设项数) > 0 || (设计文件.设计概算金额 - 设计文件.设计概算金额)/设计文件.设计概算金额 > 0.05
  description: 当设计文件中包含的安全设施项数大于验收报告中的实际建设项数，或安全设施结算金额低于概算金额的95%时，判定为未同步建设，存在缩减安全投入嫌疑。临崖临水路段防护设施缺失直接定为高风险。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 未同步建设交通安全防护设施
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设标准\",\n    \"法规文号\": \"JTGB01-2003\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\":\
    \ \"第4.5.2条\",\n    \"内容概述\": \"农村公路应按规定同步建设交通安全设施，安全设施应与主体工程同步设计、同步施工、同步投入使用。\"\n  },\n  {\n    \"法规名称\": \"公路交通安全设施设计规范\"\
    ,\n    \"法规文号\": \"JTG D81-2017\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第1.0.4条\",\n    \"内容概述\": \"公路交通安全设施必须与公路主体工程同时设"
- expression: 问题清单.整改状态 = '未整改' 或 记录表.巡查频率 < 规定标准
  description: 规定巡查标准为县道每周1次、乡道每月2次、村道每月1次。巡查频率低于下限或已发现病害无修复记录，即判定管护措施不到位。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 管护措施落实不到位导致公路质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"农村公路养护管理办法\",\n    \"法规文号\": \"交通运输部令2020年第12号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十五条\",\n    \"内容概述\": \"农村公路养护应当开展日常巡查、定期检测，及时处治病害，确保公路处于良好技术状态。\"\n  }\n]"
