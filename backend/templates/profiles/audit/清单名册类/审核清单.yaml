name: audit/清单名册类/审核清单
type: model
description: 从清单名册类类文档（审核清单）中提取结构化元数据。涵盖字段如：受邀单位资质、核定标准档次、资格类别。文档范围包括：待遇领取人员资格审核清单、投标人资质审核清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 审核清单
  member_count: 1
  member_details:
  - 待遇领取人员资格审核清单
  - 投标人资质审核清单
output:
  fields:
  - name: 受邀单位资质
    type: string
    description: 提取 受邀单位资质 的文本值
  - name: 核定标准档次
    type: string
    description: 提取 核定标准档次 的文本值
  - name: 资格类别
    type: string
    description: 提取 资格类别 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 发放对象身份证号、发放金额、发放日期、领取人身份证号、补贴项目名称、应发放日期、实际发放日期、受益人ID、待遇类型、应发金额、实发金额、发放年月.实发金额 < 发放对象身份证号、发放金额、发放日期、领取人身份证号、补贴项目名称、应发放日期、实际发放日期、受益人ID、待遇类型、应发金额、实发金额、发放年月.应发金额
  description: 当发放明细表中记录的实发金额小于依据政策标准核定的应发金额时，即存在未足额发放。应发金额既可来源于系统计算的应发字段，也可根据资格审核清单中的核定档次和当期政策标准计算得出。
  audit_item: 未及时足额发放待遇
  suspicion: 社会保障待遇未按标准足额发放
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国社会保险法\",\n    \"法规文号\": \"主席令第三十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第七十三条\",\n    \"内容概述\": \"社会保险经办机构应当按时足额支付社会保险待遇。\"\n  }\n]"
