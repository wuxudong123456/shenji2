name: audit/清单名册类/规划清单
type: model
description: 从清单名册类类文档（规划清单）中提取结构化元数据。涵盖字段如：是否纳入清单、村庄名称、村庄编码。文档范围包括：应编尽编村庄规划清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 规划清单
  member_count: 1
  member_details:
  - 应编尽编村庄规划清单
output:
  fields:
  - name: 是否纳入清单
    type: boolean
    description: 提取 是否纳入清单 的布尔值（是/否）
  - name: 村庄名称
    type: string
    description: 提取 村庄名称 的文本值
  - name: 村庄编码
    type: string
    description: 提取 村庄编码 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (信息表.人口数>=500 || 信息表.村庄类型（乡村振兴示范村、传统村落、城郊融合类等） IN ('乡村振兴示范村','传统村落','城郊融合类')) && 信息表.村庄编码 NOT IN (规划清单.村庄编码)
  description: 根据上级政策要求，筛选人口规模达标或属于重点发展/保护类型的村庄，若其编码未出现在应编尽编清单中，即判定为应编未编疑点。人口阈值500人为示例，实际审计中需比对政策文件中的具体条件。
  audit_item: 村庄规划编制缓慢
  suspicion: 有条件、有需求的村庄未纳入规划编制范围
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部办公厅关于加强村庄规划促进乡村振兴的通知\",\n    \"法规文号\": \"自然资办发〔2019〕35号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"二、有序推进村庄规划编制\",\n    \"内容概述\": \"明确有条件、有需求的村庄要做到规划应编尽编，重点做好集聚提升类、城郊融合类、特色保护类等村庄规划编制。\"\n  }\n]"
