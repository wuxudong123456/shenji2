name: audit/清单名册类/签署清单
type: model
description: 从清单名册类类文档（签署清单）中提取结构化元数据。涵盖字段如：使用者信息、签署状态。文档范围包括：农膜使用者回收责任书签署清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 签署清单
  member_count: 1
  member_details:
  - 农膜使用者回收责任书签署清单
output:
  fields:
  - name: 使用者信息
    type: string
    description: 提取 使用者信息 的文本值
  - name: 签署状态
    type: boolean
    description: 提取 签署状态 的布尔值（是/否）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (登记表.农膜使用量 > 0 && 登记表.使用者信息 NOT IN (记录表.使用者信息 WHERE 实交回收量 > 0)) || (检查记录.检查问题描述 CONTAINS('焚烧' || '掩埋' || '弃置')
    && 登记表.使用地块坐标 == 检查记录.污染点GPS坐标) || (签署清单.签署状态（是/否） == '否' && 登记表.农膜使用量 > 0)
  description: 通过三种逻辑判定违规：1）农膜使用量大于零但未查询到其任意正向回收记录的，判定为‘疑未回收’；2）环保检查记录中的违规问题描述与使用者的地块坐标重合，直接锁定‘随意弃置、掩埋或焚烧’的行为主体；3）使用者应签未签回收责任书，且仍在继续使用农膜，说明其未纳入回收管理范围，存在任意处置的高风险。
  audit_item: 废弃农膜回收利用方面不符合相关规定
  suspicion: 农膜使用者非合规处置废旧农膜
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土壤污染防治法\",\n    \"法规文号\": \"中华人民共和国主席令第八号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十条\",\n    \"内容概述\": \"农业投入品生产者、销售者和使用者应当及时回收农药、肥料等农业投入品的包装废弃物和农用薄膜，不得随意弃置、掩埋或者焚烧。\"\n  },\n  {\n    \"法规名称\"\
    : \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部令2020年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\",\n    \"内容概述\": \"\
    农用薄膜使用者应当"
