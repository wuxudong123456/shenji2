- expression: (采购方式 IN ('直接委托','单一来源','询价') AND 合同金额 >= 2000000) OR (同一第三方机构年度合同金额累计 >= 2000000 AND 采购方式 NOT IN ('公开招标','竞争性磋商')
    AND 合同签订日期间隔 <= 90 天) OR (合同金额 != 中标通知书金额)
  description: 单项合同金额达到公开招标限额（默认200万元）但未采用公开招标或竞争性磋商方式时触发；同一第三方机构在短期内多次签约且累计金额超过限额，且未使用公开招标等方式，反映化整为零规避招标；合同金额与中标通知书金额不一致，存在违规变更风险。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 第三方绩效评价服务采购未执行政府购买服务相关规定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"在一个财政年度内，采购人将一个预算项目下的同一品目"
- expression: 项目库.入库状态 == '已入库' && (申报表.审核意见 == '不通过' 或 审核记录.审核结论 == '不通过' 或 审核记录.审核结论 == '退回' )
  description: 若项目库中项目的入库状态为“已入库”，但关联的绩效目标申报表审核意见或审核过程记录表显示审核结论为“不通过”或“退回”，则判定为违规将未通过审核的项目纳入项目库。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 未通过审核的项目进入项目库
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十四条、第十六条\",\n    \"内容概述\": \"绩效目标审核未通过的项目不得纳入项目库，不得安排预算。\"\n  },\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\"\
    ,\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"党内法规/行政法规\",\n    \"条款号\": \"第三部分\",\n    \"内容概述\": \"将绩效目标审核结果作为项目入库和预算安排的"
- expression: (跨年度项目绩效趋势分析表.连续3年绩效评分 < 60 || 项目资金使用效益分析台账.资金使用率连续2年 < 0.5 ) && (低效项目清单及历史整改记录.是否启动退出程序 = '否' || 低效项目清单及历史整改记录.整改措施
    != '停止拨款并退出' ) && 项目清理退出机制相关制度.退出条件阈值 <= 触发值
  description: 项目连续3年绩效评分低于60分（或连续2年资金使用率低于50%），且未按照本单位项目清理退出制度启动退出程序，继续安排预算拨款的，判定为低效项目未及时清理退出。触发条件需符合单位制度中明确的退出标准阈值。
  audit_item: 部门、单位预算绩效目标未完成
  suspicion: 预算绩效低下的项目未及时清理退出
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第十一条\",\n    \"内容概述\": \"强化绩效评价结果应用，将绩效评价结果与预算安排挂钩，对低效无效资金一律削减或取消。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"绩效评价结果应作为改进管理、安排"
- expression: (年度预算项目清单及自评状态标记表.自评状态 = '未自评' || 年度预算项目清单及自评状态标记表.自评状态 = NULL) && 年度预算项目清单及自评状态标记表.项目金额 > 0 && (未开展自评项目清单及原因说明表.未自评原因
    NOT IN ('制度规定可豁免', '项目未执行', '资金未拨付') || 未开展自评项目清单及原因说明表.项目名称 IS NULL)
  description: 筛选自评状态为空或标记为未自评且有实际资金支出的项目，排除因制度规定可豁免、项目未执行、资金未拨付等合理原因未自评的情况。若未自评项目清单缺失或无正当理由说明，则判定为完全未开展自评违规。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 完全未开展项目绩效自评
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条、第七条\",\n    \"内容概述\": \"各部门、各单位应对所有项目支出开展绩效自评，确保自评全覆盖；绩效自评由项目实施单位负责，对预算批复的项目绩效目标完成情况进行自我评价。\"\n  }\n]"
- expression: 年度预算项目清单及自评状态标记表.自评状态 = '未自评' && 年度预算项目清单及自评状态标记表.项目金额 > 0 && 年度预决算报表.实际支出金额 > 0 && 年度预算项目清单及自评状态标记表.项目名称 NOT
    IN (SELECT 项目名称 FROM 绩效自评报告及支撑材料) && (绩效自评覆盖率统计表.项目数量覆盖率 < 100% || 绩效自评覆盖率统计表.金额覆盖率 < 100%)
  description: 将预算项目清单与自评报告项目清单进行比对，找出有实际支出但未自评的项目，并计算项目数量和金额覆盖率。当覆盖率未达到100%且无制度豁免时，即存在选择性自评。重点关注金额大、问题多的项目被故意遗漏的情形。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 选择性开展绩效自评
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"各部门、各单位应对所有项目支出实施绩效自评，确保自评全覆盖。\"\n  },\n  {\n    \"法规名称\": \"关于贯彻落实《中共中央 国务院关于全面实施预算绩效管理的意见》的通知\"\
    ,\n    \"法规文号\": \"财预〔2018〕167号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二部分第（三）项\",\n    \"内容概述\": \"硬化绩效责任约束，部门整"
- expression: (年度预决算报表.资金来源类别 = '中央转移支付' OR 年度预决算报表.资金来源类别 = '省级专项补助') && 年度预决算报表.支出金额 > 0 && 年度预决算报表.项目名称 NOT IN (SELECT
    项目名称 FROM 绩效自评报告及支撑材料) && 上级转移支付指标文件.要求自评 = '是'
  description: 筛选资金来源为上级转移支付且已形成支出的项目，检查其是否包含在自评报告项目清单中。若上级资金管理办法明确要求自评而单位未对其自评，则构成违规。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 未对转移支付资金开展绩效自评
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"地方各级财政部门应当会同有关部门对本级使用的专项转移支付资金的绩效进行自评，并将自评报告报送上级财政部门和主管部门。\"\n  },\n  {\n    \"法规名称\"\
    : \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"\
    转移支付项目按"
- expression: (票据存根联金额合计 != 记账联金额合计) || (非税收入台账.票据编号缺失 || 非税收入台账.票据编号不在票据领用登记簿.核销记录内) && (银行对账单.收入金额 > 0 || 现金日记账.收入金额 > 0)
    && 非税收入台账.应缴金额 < 银行对账单.对应收入金额
  description: 当票据存根联金额与记账联金额不符，或收费台账中缺失规范票据编号且存在资金流入时，判定为隐瞒收入。差额即为疑似隐瞒金额，差异率超过10%列为重点疑点。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 未开具非税收入票据隐瞒收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十七条\",\n    \"内容概述\": \"执收单位不得隐匿、转移、截留、坐支、挪用、私分或者变相私分非税收入；非税收入应当依法开具票据，依法及时足额上缴。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政票据管理办法\",\n    \"法规文号\": \"财政部令第70号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条、第十七条\",\n    \"内容概述\": \"财政票据是财务收支和会计核"
- expression: 银行对账单.账户名称 NOT IN (银行账户开立审批文件.备案账户清单) && 银行对账单.收入摘要 REGEXP '收费|罚没|国有资产|资源费' && (非税收入台账.已缴金额 < 银行对账单.收入金额 OR
    往来款项明细表.应缴财政款_挂账金额 > 0)
  description: 当存在未备案的银行账户且有疑似非税收入流入，同时非税收入台账未反映对应上缴记录或长期挂账应缴款时，判定为通过过渡账户隐瞒收入。关注过渡账户期末余额突然清零等突击缴库异常行为。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 通过过渡账户隐瞒非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十五条\",\n    \"内容概述\": \"执收单位不得隐匿非税收入，非税收入应当全额缴入相应级次国库或财政专户，不得在过渡账户滞留、坐支。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强财政部门和预算单位资金存放管理的指导意见\"\
    ,\n    \"法规文号\": \"财库〔2017〕76号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"严格规范"
- expression: (非经营性收入金额 > 0 && 对应预算收入科目未设置 OR 预算收入金额 = 0) || (非经营性支出金额 > 0 && 对应预算支出科目未设置 OR 预算支出金额 = 0)
  description: 筛查存在实际非经营性收支（如租金、利息、捐赠、上级补助等），但预算中未编列相应科目或金额为零的情况，确认是否漏编。
  audit_item: 预算编制不完整
  suspicion: 非经营性收支未纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"预算由预算收入和预算支出组成。政府的全部收入和支出都应当纳入预算。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n\
    \    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条\",\n    \"内容概述\": \"各部门、各单位应当按照国务院财政部门制定"
