name: audit/清单名册类/项目清单
type: model
description: 从清单名册类类文档（项目清单）中提取结构化元数据。涵盖字段如：交易方式、位置、位置坐标、入库日期、入库时间、入库状态、入库项目的评审论证材料、全部合法收费项目。文档范围包括：不同部门补贴项目清单、中央企业收费项目清单、中央补助项目清单（表1）、中央财政资金支持项目清单、传统村落保护项目清单、低效项目清单、保障性安居工程贷款项目清单、保障性安居工程项目清单、农村学校教师培训项目清单、分布式电源接网工程滞后项目清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 合同
- 培训
- 金额
- 项目
- 元数据提取
