name: audit/清单名册类/标人名单
type: model
description: 从清单名册类类文档（标人名单）中提取结构化元数据。涵盖字段如：各投标人企业性质、所属部门/系统、投标人名称、投标人组成形式、是否在本地有分支机构、是否库内企业、注册地、资质条件。文档范围包括：投标人名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 标人名单
  member_count: 1
  member_details:
  - 投标人名单
output:
  fields:
  - name: 各投标人企业性质
    type: string
    description: 提取 各投标人企业性质 的文本值
  - name: 所属部门-系统
    type: string
    description: 提取 所属部门-系统 的文本值
  - name: 投标人名称
    type: string
    description: 提取 投标人名称 的文本值
  - name: 投标人组成形式
    type: string
    description: 提取 投标人组成形式 的文本值
  - name: 是否在本地有分支机构
    type: boolean
    description: 提取 是否在本地有分支机构 的布尔值（是/否）
  - name: 是否库内企业
    type: boolean
    description: 提取 是否库内企业 的布尔值（是/否）
  - name: 注册地
    type: string
    description: 提取 注册地 的文本值
  - name: 资质条件
    type: string
    description: 提取 资质条件 的文本值
  - name: 资质等级
    type: string
    description: 提取 资质等级 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (CONTAINS(招标文件.资格条件条款, '本地') || CONTAINS(招标文件.资格条件条款, '本市') || CONTAINS(招标文件.资格条件条款, '本省') || CONTAINS(招标文件.资格条件条款,
    '系统内') || CONTAINS(招标文件.资格条件条款, '所属部门')) && (外地投标人数量 / 总投标人数量 < 0.1 || 外地投标人数量 < 2)
  description: 筛查招标文件资格条件中是否存在地域或部门限制性关键词，同时分析投标人地域分布。外地投标人占比低于10%或数量少于2家视为异常，表明限制条件已实质排斥外地企业。两条同时满足则触发疑点。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 招标文件设置地域或部门限制排斥潜在投标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条第二款\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n\
    \    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十二条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制、排斥潜在投标人或者投标人，包括"
- expression: CONTAINS(招标文件.资格条件条款, '设立分公司') || CONTAINS(招标文件.资格条件条款, '设立子公司') || CONTAINS(招标文件.资格条件条款, '本地注册') || CONTAINS(招标文件.资格条件条款,
    '固定办公场所') || CONTAINS(招标文件.资格条件条款, '本地服务机构')
  description: 招标文件资格条件或服务要求中出现任何强制外地企业在本地设立法人机构、分支机构或常驻办公场所的表述，即直接判定为违规疑点。该条件与项目本身技术经济需求无必然联系，构成不合理限制。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 强制要求外地企业设立本地分支机构增加投标成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"招标人有下列行为之一的，属于以不合理条件限制、排斥潜在投标人或者投标人：……（四）以特定行政区域或者特定行业的业绩、奖项作为加分条件或者中标条件；（七）以其他不合理条件限制、排斥潜在投标人或者投标人。\"\
    \n  },\n  {\n    \"法规名称\": \"公平竞争审查制度实施细则\",\n    \"法规文号\": \"国市监反垄规〔2021〕2号\",\n    \"效力级别\": \"部门"
- expression: (CONTAINS(招标文件.资格条件, '入库') || CONTAINS(招标文件.资格条件, '名录库')) && (项目库或名录库最近更新时间距今 > 两年 || 入库企业数量近两年增长率为0) && (库外符合资质企业数量
    > 3)
  description: 当招标文件要求投标人必须进入某一特定项目库或名录库，且该库长期未更新（超过2年未调整或新增企业为零），同时市场存在3家以上符合基本资质但未入库的企业时，判为拟排斥潜在投标人。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 利用项目库或名录库设置壁垒排斥潜在投标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人或者投标人。\"\n  },\n  {\n    \"法规名称\": \"公平竞争审查制度实施细则\",\n    \"\
    法规文号\": \"国市监反垄规〔2021〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"不得设置不合理或者歧视性的准入和退出条件，排斥或者限制经营者参与招标"
