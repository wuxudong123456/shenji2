name: audit/清单名册类/申请清单
type: model
description: 从清单名册类类文档（申请清单）中提取结构化元数据。涵盖字段如：审批人ID、审批时间、审批状态、推荐中介编码、申请人ID、申请日期、贷款状态、贷款申请编号。文档范围包括：住房公积金贷款申请清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 审批
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 申请清单
  member_count: 1
  member_details:
  - 住房公积金贷款申请清单
output:
  fields:
  - name: 审批人ID
    type: string
    description: 提取 审批人ID 的文本值
  - name: 审批时间
    type: date
    description: 提取 审批时间 的日期值，格式 YYYY-MM-DD
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
  - name: 推荐中介编码
    type: string
    description: 提取 推荐中介编码 的文本值
  - name: 申请人ID
    type: string
    description: 提取 申请人ID 的文本值
  - name: 申请日期
    type: date
    description: 提取 申请日期 的日期值，格式 YYYY-MM-DD
  - name: 贷款状态
    type: number
    description: 提取 贷款状态 的数值（含单位，如万元、吨等）
  - name: 贷款申请编号
    type: number
    description: 提取 贷款申请编号 的数值（含单位，如万元、吨等）
  - name: 贷款金额
    type: number
    description: 提取 贷款金额 的数值（含单位，如万元、吨等）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (异地缴存证明核实记录.核实结果 != '属实') || (DATEDIFF(住房公积金贷款申请清单.申请日期, 异地缴存明细表.缴存开始日期) <= 365 && 异地缴存明细表.缴存单位 != 社保缴纳比对表.参保单位)
    || (异地缴存明细表.缴存期间 与 社保缴纳比对表.参保期间 存在重叠 && 异地缴存明细表.缴存单位 != 社保缴纳比对表.参保单位)
  description: 第一条为证明核实不通过直接判定；第二条为缴存刚满最低期限（12个月）即申请贷款且社保单位与公积金缴存单位不一致，触发骗贷风险；第三条为异地缴存期间本地社保同时缴纳且参保单位不同于缴存单位，具有虚构劳动关系特征。三项满足任一即判定为疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 个人利用虚假异地缴存证明骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，由住房公积金管理中心责令限期退回贷款，并可处骗取金额百分之五以上百分之十以下罚款；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
- expression: (中介机构服务合同.服务内容 LIKE '%公积金缴存%' || 中介机构服务合同.服务内容 LIKE '%代缴%') && (住房公积金贷款申请清单.申请人ID 的 社保缴纳比对表.参保单位 != 异地缴存明细表.缴存单位)
    && (异地缴存明细表.缴存基数 > 社保缴纳比对表.参保单位 行业平均水平 3倍 或 缴存基数 = 缴存上限) && (DATEDIFF(住房公积金贷款申请清单.申请日期, 异地缴存明细表.缴存开始日期) <= 180)
  description: 中介合同明确包含代缴或挂靠缴存服务；缴存单位与社保单位不一致；缴存基数畸高或按封顶线缴存；且缴存时间刚好满足最低6个月要求即申请贷款。四项条件同时满足，为典型中介虚构劳动关系骗贷。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 中介机构协助虚构劳动关系骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，责令限期退回贷款，可罚款；构成犯罪的，追究刑事责任。\"\n  },\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"\
    法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"单位应当按时、足额缴存住房公积金，不得逾期缴存或者少缴；职工个人缴存的住"
- expression: (经办人员操作日志表.操作类型 = '修改' && 操作内容 LIKE '%缴存基数%' || 操作内容 LIKE '%缴存月数%') && (操作时间.HOUR NOT BETWEEN 6 AND 20 || 操作时间
    属于 非工作日) && (SELECT 贷款金额 FROM 住房公积金贷款申请清单 WHERE 审批人ID = 操作员ID) > 同类贷款平均金额 * 1.5) || (存在 经办人员银行账户流水.对方账户 与 住房公积金贷款申请清单.申请人ID
    关联的资金记录)
  description: 一是信贷经办人员或系统管理员在非工作时间或节假日修改关键缴存字段，且经手审批的贷款金额明显高于平均水平；二是经办人员个人账户与贷款申请人之间存在异常资金往来。上述任一条件成立，即构成内外勾结骗贷重大疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 经办管理人员内外勾结骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十条\",\n    \"内容概述\": \"住房公积金管理中心未按照规定审批住房公积金贷款，或者有其他违反本条例规定行为的，对主管人员和其他直接责任人员依法给予行政处分。\"\n  },\n  {\n    \"法规名称\": \"\
    住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的"
