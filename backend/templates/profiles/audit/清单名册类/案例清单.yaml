name: audit/清单名册类/案例清单
type: model
description: 从清单名册类类文档（案例清单）中提取结构化元数据。涵盖字段如：专利号/品种权号、受让方信息、实际到账金额、成果名称。文档范围包括：科研成果转化应用案例清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 知识产权
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 案例清单
  member_count: 1
  member_details:
  - 科研成果转化应用案例清单
output:
  fields:
  - name: 专利号-品种权号
    type: string
    description: 提取 专利号-品种权号 的文本值
  - name: 受让方信息
    type: string
    description: 提取 受让方信息 的文本值
  - name: 实际到账金额
    type: number
    description: 提取 实际到账金额 的数值（含单位，如万元、吨等）
  - name: 成果名称
    type: string
    description: 提取 成果名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
