name: audit/清单名册类/建设清单
type: model
description: 从清单名册类类文档（建设清单）中提取结构化元数据。涵盖字段如：化粪池类型、地址、实际建成机构数、建成日期、当前使用状态、户厕/公厕地理坐标、户厕编号、站点ID。文档范围包括：农村公厕建设清单、农村养老机构建设清单、农村户厕建设清单、村级信息服务站建设清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 明细
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 建设清单
  member_count: 1
  member_details:
  - 农村公厕建设清单
  - 农村养老机构建设清单
  - 农村户厕建设清单
  - 村级信息服务站建设清单
output:
  fields:
  - name: 化粪池类型
    type: string
    description: 提取 化粪池类型 的文本值
  - name: 地址
    type: string
    description: 提取 地址 的文本值
  - name: 实际建成机构数
    type: string
    description: 提取 实际建成机构数 的文本值
  - name: 建成日期
    type: date
    description: 提取 建成日期 的日期值，格式 YYYY-MM-DD
  - name: 当前使用状态
    type: boolean
    description: 提取 当前使用状态 的布尔值（是/否）
  - name: 户厕-公厕地理坐标
    type: string
    description: 提取 户厕-公厕地理坐标 的文本值
  - name: 户厕编号
    type: string
    description: 提取 户厕编号 的文本值
  - name: 站点ID
    type: string
    description: 提取 站点ID 的文本值
  - name: 竣工床位数
    type: string
    description: 提取 竣工床位数 的文本值
  - name: 规划机构数
    type: string
    description: 提取 规划机构数 的文本值
  - name: 设备明细
    type: string
    description: 提取 设备明细 的文本值
  - name: 面积
    type: string
    description: 提取 面积 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 村级信息服务站建设清单.面积 < 20 || 村级信息服务站选址审批文件.批复同意地址 != 村级信息服务站建设清单.地址 || (村级信息服务站建设清单.电脑数量 < 1 || 村级信息服务站建设清单.显示屏数量
    < 1)
  description: 服务站面积小于标准面积（如低于20㎡），或实际建设地址与批复地址不一致（含擅自变更选址），或未配备规定设备如电脑、显示屏，视为选址建设不合规。
  audit_item: 信息进村入户工程实施不到位
  suspicion: 村级信息服务站选址建设不合规
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推进信息进村入户工程的实施意见\",\n    \"法规文号\": \"农市发[2016]3号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"第二部分第（一）条\",\n    \"内容概述\": \"村级信息服务站应选址在村民集聚区域，面积不低于20平方米，统一配备电脑、显示屏等必要设备，严禁擅自变更选址。\"\n  }\n]"
- expression: (建设清单.实际建成机构数 / 建设清单.规划机构数) < 0.9
  description: 将实际建成机构数与地方养老服务体系建设规划明确的规划机构数进行比对，当完成率低于90%时，判定为建设数量不足；阈值可根据本级政府考核要求调整为80%或更低，但标准原则上不低于规划目标的90%。
  audit_item: 农村养老服务政策实施不规范、建设质量不达标
  suspicion: 农村养老机构建设数量未达到规划目标
  regulation: "[\n  {\n    \"法规名称\": \"地方养老服务体系建设规划（如某县农村养老服务设施布局规划）\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n \
    \   \"条款号\": \"全文\",\n    \"内容概述\": \"明确规划期内各区域农村养老机构建设数量、床位目标及完成时限，要求分年度落实建设任务，确保养老服务设施供给与老年人口增长相适应。\"\n  }\n]"
- expression: （方案中是否包含运维保障章节、方案发布时间、实施期限、粪污资源化利用要求、禁止直接施用新鲜粪污的规定.实施期限 > 规划覆盖范围、污水管网建设计划、规划期限.规划期限） || （户厕/公厕地理坐标、化粪池类型、建成日期、当前使用状态.户厕/公厕地理坐标
    NOT IN 规划覆盖范围、污水管网建设计划、规划期限.规划覆盖范围） || （验收日期、污水处理设施接入情况、排放去向.排放去向 = '直排周边水体' && 排放口编号、监测日期、氨氮浓度、COD浓度、监测点编号、阴离子表面活性剂浓度.氨氮浓度
    > 5 mg/L）
  description: 判定标准：1.厕所改造未与污水治理规划时序同步，先行改厕后补管网造成脱节；2.厕所坐标点不在污水管网规划覆盖区域内，导致粪液无法纳入管网；3.验收报告显示粪污直排且水质监测数据中氨氮超标。满足任一条件即视为未统筹推进。
  audit_item: 农村厕所粪污治理不符合相关规定
  suspicion: 农村厕所建设未与生活污水治理统筹推进
  regulation: "[\n  {\n    \"法规名称\": \"农村人居环境整治提升五年行动方案（2021—2025年）\",\n    \"法规文号\": \"厅字〔2021〕44号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第二部分“扎实推进农村厕所革命”\",\n    \"内容概述\": \"提出‘加强厕所粪污与生活污水治理的有效衔接，统筹推进、同步实施’的要求，倡导粪污纳入污水管网统一处理。\"\n  }\n]"
- expression: （农户厕所使用问题投诉记录表.当前状态 = '未解决'） && （厕所设施运维巡检记录表.维修状态 != '已完成'） || （COUNT(厕所设施运维巡检记录表 FILTER 故障描述 NOT NULL && 维修完成日期
    IS NULL) > 0） || （DATEDIFF(厕所设施运维巡检记录表.维修完成日期, 农户厕所使用问题投诉记录表.投诉日期) > 7 && 厕所设施维护资金使用台账.关联户厕编号 IS NULL）
  description: 有投诉但无维修完成记录，或维修完成时间距投诉日期超过7天且无资金支出记录，表现为维修响应严重滞后或未实际维修。巡检记录中有故障报备但无后续维修闭环的也视为同类问题。
  audit_item: 农村厕所粪污治理不符合相关规定
  suspicion: 厕具及化粪池损坏后未及时维修
  regulation: "[\n  {\n    \"法规名称\": \"农村人居环境整治提升五年行动方案（2021—2025年）\",\n    \"法规文号\": \"厅字〔2021〕44号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第四部分“建立健全长效管护机制”\",\n    \"内容概述\": \"要求建立群众投诉受理和问题响应机制，及时维修损坏的厕所设施，确保正常使用。\"\n  }\n]"
