name: audit/清单名册类/清单
type: model
description: 从清单名册类类文档（清单）中提取结构化元数据。涵盖字段如：协议有效期、合作采购方式、品种、地址、地点、定点场所名称、清单数量。文档范围包括：农业保险标的清单、定点会议场所合作协议或清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 协议
- 采购
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 清单
  member_count: 1
  member_details:
  - 农业保险标的清单
  - 定点会议场所合作协议或清单
output:
  fields:
  - name: 协议有效期
    type: string
    description: 提取 协议有效期 的文本值
  - name: 合作采购方式
    type: string
    description: 提取 合作采购方式 的文本值
  - name: 品种
    type: string
    description: 提取 品种 的文本值
  - name: 地址
    type: string
    description: 提取 地址 的文本值
  - name: 地点
    type: string
    description: 提取 地点 的文本值
  - name: 定点场所名称
    type: string
    description: 提取 定点场所名称 的文本值
  - name: 清单数量
    type: number
    description: 提取 清单数量 的数值（含单位，如万元、吨等）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (会议名称实际举办地点是否定点场所标注统计表.实际举办地点 NOT IN (定点场所名称地址协议有效期合作采购方式清单.定点场所名称)) && (报销会议名称费用发生日期金额发票号码按人结算费用总额报销人员名单人均费用报销总金额报销金额日期开票方名称场地地址费用金额报销凭证.场地地址
    != 定点场所名称地址协议有效期合作采购方式清单.地址) && (报销会议名称费用发生日期金额发票号码按人结算费用总额报销人员名单人均费用报销总金额报销金额日期开票方名称场地地址费用金额报销凭证.开票方名称 NOT IN (定点场所名称地址协议有效期合作采购方式清单.定点场所名称))
  description: 将实际会议地点与定点场所清单进行比对。若会议地点不在定点清单内，且场地租赁发票的开票方或地址与定点场所不匹配，则判定为在非定点场所举办会议。同时关注无场地发票但存在大额餐饮等关联消费的异常情况。
  audit_item: 未按规定举办会议
  suspicion: 在非定点场所举办会议
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"会议召开场所实行政府定点管理。党政机关会议应当到定点饭店召开，按照协议价格结算费用。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\"\
    ,\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"各单位召开会议应当到定点会议场所召开，按照"
- expression: (ABS(标的清单.投保数量 - 实地核查记录.实际数量) / 实地核查记录.实际数量 > 0.2) || (实地核查记录.核查标志 = '无标的' && 保险合同.保费补贴状态 = '已拨付') || (COUNT(理赔记录.保单号)
    / COUNT(保险标的清单.保单号) > 0.5 && 气象记录.无对应灾害) || (银行流水.理赔款到账后3日内转回保险公司关联账户金额 > 理赔额的0.8)
  description: 投保数量与实地核查实际数量偏差超过20%，或核查确认标的物根本不存在但保费补贴已拨付，或同一区域相同灾害原因导致的理赔率异常偏高且无气象部门灾害记录佐证，或理赔资金在极短时间内回流至保险公司或其关联方，均指向虚构标的骗取补贴。
  audit_item: 骗取套取涉农财政专项资金
  suspicion: 虚构农业保险标的骗取财政保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条\"\
    ,\n    \"内容概述\": \"保险机构经营农业保险业务，有下列行为之一的，由保险监督管理机构责令改正，处五万元以上三十万元以下罚款……（一）编制虚假的农业保险承保、查勘定损、理赔资料，骗取农业保险补贴或者补贴资金……\"\n \
    \ },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\"\
    ,\n"
