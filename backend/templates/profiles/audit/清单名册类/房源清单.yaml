name: audit/清单名册类/房源清单
type: model
description: 从清单名册类类文档（房源清单）中提取结构化元数据。涵盖字段如：空置起始日期。文档范围包括：空置房源清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 房源清单
  member_count: 1
  member_details:
  - 空置房源清单
output:
  fields:
  - name: 空置起始日期
    type: date
    description: 提取 空置起始日期 的日期值，格式 YYYY-MM-DD
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (空置房源统计表.累计空置时长（天） > 365) && (空置房源清单.空置原因说明 NOT IN ('合理装修期','合理轮候期','维修保养期','政策预留期'))
  description: 筛查累计空置天数超过365天且空置原因不属于合理情形的房源，合理空置情形需有明确制度或官方文件依据，如装修期（一般不超过3个月）、轮候期等。累计空置时长由交付可达入住状态日期至分配或实际入住日期计算，若仍未分配则计算至审计基准日。表达式区分刻意闲置与非正常管理滞后，阈值365天依据住房城乡建设部关于竣工后1年内完成分配的要求。
  audit_item: 公共租赁住房未按规定及时分配入住形成空置
  suspicion: 已竣工验收公租房空置超1年未分配
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部办公厅关于加快公共租赁住房分配入住的通知\",\n    \"法规文号\": \"建办保函〔2015〕212号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二、加快分配入住\",\n    \"内容概述\": \"各地要对已竣工的公共租赁住房项目，抓紧制定分配方案，尽快分配入住，原则上要在竣工后1年内完成分配。\"\n  },\n  {\n\
    \    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n  \
    \  \"内容概"
