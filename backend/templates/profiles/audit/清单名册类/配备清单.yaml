name: audit/清单名册类/配备清单
type: model
description: 从清单名册类类文档（配备清单）中提取结构化元数据。涵盖字段如：专业技术人员数、书名、出版年份、分类标签、在编专职监管人员数、所有在册图书的出版年份、持有种子检验员资格证人数、数量。文档范围包括：图书配备清单、种业监管机构人员配备清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 人员
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 配备清单
  member_count: 1
  member_details:
  - 图书配备清单
  - 种业监管机构人员配备清单
output:
  fields:
  - name: 专业技术人员数
    type: string
    description: 提取 专业技术人员数 的文本值
  - name: 书名
    type: string
    description: 提取 书名 的文本值
  - name: 出版年份
    type: string
    description: 提取 出版年份 的文本值
  - name: 分类标签
    type: string
    description: 提取 分类标签 的文本值
  - name: 在编专职监管人员数
    type: string
    description: 提取 在编专职监管人员数 的文本值
  - name: 所有在册图书的出版年份
    type: string
    description: 提取 所有在册图书的出版年份 的文本值
  - name: 持有种子检验员资格证人数
    type: number
    description: 提取 持有种子检验员资格证人数 的数值（含单位，如万元、吨等）
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (图书配备清单.数量 < 上级主管部门关于农家书屋建设的标准文件.规定最低总册数) || (图书配备清单.农业科技类册数占比 < 上级主管部门关于农家书屋建设的标准文件.农业科技类比例) || (图书配备清单.近三年出版册数占比
    < 上级主管部门关于农家书屋建设的标准文件.近三年出版物占比) || (农民需求调研报告或意见反馈记录.农民需求类型 NOT IN 图书配备清单.分类标签) || (图书采购合同.供应商资质 NOT IN 政府采购目录)
  description: 判定图书配备不达标：总册数低于规定最低标准（如1500册）；特定类别（如农业科技类）占比低于标准（如60%）；近三年出版图书占比低于规定（如30%）；调研需求类别在配备图书中完全缺失，表明图书脱离实际需求；采购合同供应商不在合规名录内，可能存在盗版或低价打包劣质书问题。以上条件满足任意一条，判为疑点。
  audit_item: 农家书屋建设运营管护不合规
  suspicion: 农家书屋图书配备不达标或脱离需求
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条、第十三条\"\
    ,\n    \"内容概述\": \"农家书屋图书配置应符合当地农村实际需求，确保藏书量不少于1500册，品种不少于500种；图书应定期更新，确保内容实用、新颖。\"\n  }\n]"
- expression: (DATEDIFF(CURRENT_DATE, 图书更新台账.MAX(入库日期)) > 365) || (图书配备清单.COUNT(出版年份 >= (YEAR(CURRENT_DATE)-3)) / 图书配备清单.COUNT(*)
    < 0.10) || (SUM(专项资金收支明细表.图书采购支出金额) > 0 AND COUNT(图书更新台账.新增书籍ISBN/书名) == 0)
  description: 判定更新不及时：最近一次入库日期距今超过1年（更新周期默认1年）；近3年出版图书占总藏书量比例低于10%（更新比例标准）；有专项资金支出但无新增书籍记录，或专项资金未支出但台账显示更新，存在虚假更新。任意一条满足即为疑点。
  audit_item: 农家书屋建设运营管护不合规
  suspicion: 农家书屋图书更新不及时
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\"\
    ,\n    \"内容概述\": \"农家书屋应当建立图书更新机制，每年更新率不低于10%，确保出版物时效性。\"\n  }\n]"
- expression: (在编专职监管人员数.在编专职监管人员数 / (辖区种子企业数 * 0.3) < 1) || (专业技术人员占比 < 0.5) || (预算批复金额.实际支出金额 / 预算批复金额.预算批复金额 < 0.8) ||
    (设备台账.设备可检测项目 < 应检项目数 * 0.8)
  description: 人员充足率使用参考系数0.3，低于1即视为监管力量不足；专业技术人员占监管人员比例低于50%为能力薄弱；经费到位率低于80%或设备缺失20%以上关键检测项目，均判定为保障不足。任意条件满足即触发疑点。
  audit_item: 种业市场监管方面不符合相关规定
  suspicion: 种业监管机构检测能力或人员经费保障不足
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"中华人民共和国主席令第三十五号（2015年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第六十九条\",\n    \"内容概述\": \"国家加强种子执法能力建设。县级以上地方人民政府应当保障种子执法所需经费，配备与种子市场监管任务相适应的执法人员。省级以上人民政府应当支持种子执法条件和装备建设。\"\
    \n  }\n]"
