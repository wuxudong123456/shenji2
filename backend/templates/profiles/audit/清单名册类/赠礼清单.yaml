name: audit/清单名册类/赠礼清单
type: model
description: 从清单名册类类文档（赠礼清单）中提取结构化元数据。涵盖字段如：单价、接收人、数量、礼品名称。文档范围包括：外宾赠礼清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 赠礼清单
  member_count: 1
  member_details:
  - 外宾赠礼清单
output:
  fields:
  - name: 单价
    type: number
    description: 提取 单价 的数值（含单位，如万元、吨等）
  - name: 接收人
    type: string
    description: 提取 接收人 的文本值
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 礼品名称
    type: string
    description: 提取 礼品名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 礼品名称、单价、数量、接收人.单价 > 同一团组宴请次数上限.单次赠礼金额上限 || (SUM(礼品名称、单价、数量、接收人.单价) / COUNT(礼品名称、单价、数量、接收人.单价) > 同一团组宴请次数上限.年总额标准)
  description: 直接对比礼品采购单价与制度规定的单价上限，超过即为违规。同时，对于向同一团组多人赠礼的情况，可计算人均赠礼成本，若高于规定标准，则视为变相超标。需关注将高价礼品拆分采购、开具“办公用品”“宣传品”等名目发票的规避行为。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 超标准对外赠礼
  regulation: "[\n  {\n    \"法规名称\": \"党政机关外宾接待管理办法\",\n    \"法规文号\": \"财行〔2013〕533号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条第（二）款\",\n    \"内容概述\": \"对外赠礼应当遵循节约从简原则，赠礼对象应为外方团长或重要成员，同一来访外宾团组原则上只赠礼一次，礼品应尽量选择具有民族特色的纪念品、传统手工艺品等，单价不得超过150元。\"\
    \n  }\n]"
