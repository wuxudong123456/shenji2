name: audit/清单名册类/分类目录
type: model
description: 从清单名册类类文档（分类目录）中提取结构化元数据。涵盖字段如：剧毒农药名称、高毒农药名称。文档范围包括：高毒/剧毒农药分类目录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 分类目录
  member_count: 1
  member_details:
  - 高毒/剧毒农药分类目录
output:
  fields:
  - name: 剧毒农药名称
    type: string
    description: 提取 剧毒农药名称 的文本值
  - name: 高毒农药名称
    type: string
    description: 提取 高毒农药名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 使用时间、作物名称、农药名称、稀释倍数或每亩用量、亩用量、使用方法、批次号、使用日期、作物、用量、施药方法、记录表存在性、剂量、方法等字段完整性.农药名称 IN (高毒农药名称、剧毒农药名称.高毒农药名称, 高毒农药名称、剧毒农药名称.剧毒农药名称)
    AND 使用时间、作物名称、农药名称、稀释倍数或每亩用量、亩用量、使用方法、批次号、使用日期、作物、用量、施药方法、记录表存在性、剂量、方法等字段完整性.作物名称 IN ('草莓','叶菜','豆角','黄瓜','番茄','等鲜食瓜果蔬菜')
  description: 判定规则：在直接食用的瓜果蔬菜上使用任何高毒或剧毒农药均属违规，无论剂量大小。作物类型需预先定义高风险鲜食品种列表，如茄果类、瓜类、叶菜类等。注意部分农药可作种衣剂，但如用于浸泡豆种也属违规。
  audit_item: 农药使用管理不符合规定
  suspicion: 在瓜果蔬菜上使用高毒剧毒农药
  regulation: "[\n  {\n    \"法规名称\": \"农药管理条例\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十三条\"\
    ,\n    \"内容概述\": \"禁止在蔬菜、瓜果、茶叶、菌类、中草药材等作物上使用剧毒、高毒农药。\"\n  }\n]"
