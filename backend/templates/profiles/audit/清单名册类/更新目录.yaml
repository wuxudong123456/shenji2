name: audit/清单名册类/更新目录
type: model
description: 从清单名册类类文档（更新目录）中提取结构化元数据。涵盖字段如：更新批次及图书出版年份分布、最近一次更新日期。文档范围包括：出版物更新目录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 更新目录
  member_count: 1
  member_details:
  - 出版物更新目录
output:
  fields:
  - name: 更新批次及图书出版年份分布
    type: string
    description: 提取 更新批次及图书出版年份分布 的文本值
  - name: 最近一次更新日期
    type: date
    description: 提取 最近一次更新日期 的日期值，格式 YYYY-MM-DD
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (MAX(登记台账.图书出版年份列表) - 当前年份 > 3) || (登记台账.近三年新入库图书数量 / 登记台账.藏书总量 < 0.1) || (明细表.图书更新专项资金实际支出金额 = 0 && 账面无结转说明)
  description: 所有在架图书中最迟出版年份距今超过3年，则视为严重更新不及时；近3年新增图书数量占当前藏书总量的比例低于10%，未达到年度更新要求（参照《农家书屋工程建设管理暂行办法》第十条）；或上级拨付的图书更新专项资金长期未使用且无合理结转依据。
  audit_item: 农家书屋建设运营管护不符合相关规定
  suspicion: 农家书屋出版物长期未更新
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"新出印发〔2007〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"农家书屋的出版物根据村民阅读需求适当更新，每年更新补充的出版物一般不少于图书总量的10%。\"\n  }\n]"
