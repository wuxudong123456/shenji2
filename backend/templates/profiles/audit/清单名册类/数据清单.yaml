name: audit/清单名册类/数据清单
type: model
description: 从清单名册类类文档（数据清单）中提取结构化元数据。涵盖字段如：建议措施、必填字段缺失率、户编号、数据总条数、数据更新时间、数据表总记录数、重复记录数、预警原因。文档范围包括：培训对象数据库数据清单、返贫风险监测预警系统数据清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 数据清单
  member_count: 1
  member_details:
  - 培训对象数据库数据清单
  - 返贫风险监测预警系统数据清单
output:
  fields:
  - name: 建议措施
    type: string
    description: 提取 建议措施 的文本值
  - name: 必填字段缺失率
    type: string
    description: 提取 必填字段缺失率 的文本值
  - name: 户编号
    type: string
    description: 提取 户编号 的文本值
  - name: 数据总条数
    type: string
    description: 提取 数据总条数 的文本值
  - name: 数据更新时间
    type: date
    description: 提取 数据更新时间 的日期值，格式 YYYY-MM-DD
  - name: 数据表总记录数
    type: string
    description: 提取 数据表总记录数 的文本值
  - name: 重复记录数
    type: string
    description: 提取 重复记录数 的文本值
  - name: 预警原因
    type: string
    description: 提取 预警原因 的文本值
  - name: 风险等级
    type: string
    description: 提取 风险等级 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (帮扶措施实施台账.措施类型 按村/乡分组后 COUNT(DISTINCT 措施类型) = 1 && 帮扶措施实施台账.覆盖户数 > 10) || (帮扶项目资金使用效益分析表.投入产出比 < 0.5) || (帮扶项目验收材料.实际效益指标
    / 可研预期效益指标 < 0.6) || (返贫风险监测预警系统.风险等级 = '高风险' AND 帮扶措施实施台账.措施类型 NOT IN ('专项医疗救助','综合保障兜底','高投入产业帮扶') )
  description: 表达式判断四条规则：①同一行政村或乡镇内大规模采取完全相同的单一帮扶措施（如全部种植同一种作物、全部参加同质化培训），表明未按户分类施策，存在“一刀切”；②资金使用效益分析显示投入产出比低于0.5，即每投入1元产生的直接经济收益不足0.5元，效益极低；③项目验收实绩达不到可研报告预期指标的60%，成效严重缩水；④对监测系统标注高风险户，未采取针对性强的重投入兜底措施，而是与其他低风险户同策。满足任
  audit_item: 防止返贫帮扶政策落实不到位
  suspicion: 防止返贫帮扶措施搞“一刀切”，成效不实造成资金浪费
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于实现巩固拓展脱贫攻坚成果同乡村振兴有效衔接的意见\",\n    \"法规文号\": \"中发〔2020〕30号\",\n    \"效力级别\"\
    : \"党内法规和规范性文件\",\n    \"条款号\": \"第三部分（九）\",\n    \"内容概述\": \"坚持因地制宜、分类施策，健全防止返贫动态监测和帮扶机制，按照缺什么补什么的原则，根据监测对象的风险类别和发展需求开展针对性帮扶，不搞“一刀切”。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步健全防止返贫动态监测和帮扶机制的通知\",\n    \"法规文号\": \"国乡振发〔2021〕1号\",\n    \"效"
