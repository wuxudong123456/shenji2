name: audit/清单名册类/处理清单
type: model
description: 从清单名册类类文档（处理清单）中提取结构化元数据。涵盖字段如：下架完成时间、投诉时间、问题商品名称。文档范围包括：网络销售种子下架处理清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 处理清单
  member_count: 1
  member_details:
  - 网络销售种子下架处理清单
output:
  fields:
  - name: 下架完成时间
    type: date
    description: 提取 下架完成时间 的日期值，格式 YYYY-MM-DD
  - name: 投诉时间
    type: date
    description: 提取 投诉时间 的日期值，格式 YYYY-MM-DD
  - name: 问题商品名称
    type: string
    description: 提取 问题商品名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (审核记录.公示许可证号 IS NULL) || (审核记录.公示许可证号 NOT IN 档案.许可证号) || (处理清单.下架完成时间 > 3个工作日)
  description: 平台内商家未公示许可证号、公示的许可证号在官方许可档案中不存在或已失效，均属资质审核不合规；自收到投诉举报起至完成下架超过3个工作日，属于监管处置超时。任一情况触发疑点。
  audit_item: 种业市场监管方面不符合相关规定
  suspicion: 种子网络销售资质审核与监管缺失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"中华人民共和国主席令第三十五号（2015年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十七条\",\n    \"内容概述\": \"电子商务平台经营者应当对平台内种子经营者的身份、地址、联系方式、生产经营许可证或者备案信息等进行核验、登记，建立登记档案，并定期核验更新。\"\n  }\n\
    ]"
