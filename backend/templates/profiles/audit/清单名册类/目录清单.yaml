name: audit/清单名册类/目录清单
type: model
description: 从清单名册类类文档（目录清单）中提取结构化元数据。涵盖字段如：准许收费项目列表、已取消资格名称、收费部门、收费项目名称、是否属于减免范围、是否纳入补贴标识、机具品目名称、机具型号。文档范围包括：国家及地方职业资格目录清单、收费目录清单（文件5）、秸秆综合利用相关机具的补贴目录清单、行政事业性收费目录清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 补贴
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 目录清单
  member_count: 1
  member_details:
  - 国家及地方职业资格目录清单
  - 收费目录清单（文件5）
  - 秸秆综合利用相关机具的补贴目录清单
  - 行政事业性收费目录清单
output:
  fields:
  - name: 准许收费项目列表
    type: number
    description: 提取 准许收费项目列表 的数值（含单位，如万元、吨等）
  - name: 已取消资格名称
    type: string
    description: 提取 已取消资格名称 的文本值
  - name: 收费部门
    type: number
    description: 提取 收费部门 的数值（含单位，如万元、吨等）
  - name: 收费项目名称
    type: number
    description: 提取 收费项目名称 的数值（含单位，如万元、吨等）
  - name: 是否属于减免范围
    type: boolean
    description: 提取 是否属于减免范围 的布尔值（是/否）
  - name: 是否纳入补贴标识
    type: boolean
    description: 提取 是否纳入补贴标识 的布尔值（是/否）
  - name: 机具品目名称
    type: string
    description: 提取 机具品目名称 的文本值
  - name: 机具型号
    type: string
    description: 提取 机具型号 的文本值
  - name: 状态
    type: boolean
    description: 提取 状态 的布尔值（是/否）
  - name: 目录文号
    type: string
    description: 提取 目录文号 的文本值
  - name: 资格名称
    type: string
    description: 提取 资格名称 的文本值
  - name: 资格编码
    type: string
    description: 提取 资格编码 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 备注
    type: string
    description: 清单条目的备注信息
    required: false
violations:
- expression: (收费项目明细台账.收费项目名称 IN (行政事业性收费目录清单.收费项目名称) AND 收费项目明细台账.收费性质 = '经营服务性收费') OR (收费许可证.收费性质 = '经营服务性收费' AND 收费许可证.收费项目
    IN (行政事业性收费目录清单.收费项目名称) AND 经营服务性收费项目审批文件.批准文号 IS NULL AND 收费项目性质变更审批记录 IS NULL) OR (收费项目明细台账.收费项目名称 IN (行政事业性收费目录清单.收费项目名称)
    AND 银行账户入账流水.收款账户 NOT LIKE '%财政专户%')
  description: 表达式通过三组条件识别违规转性行为：(1)收费项目属于行政事业性收费目录却标记为经营服务性；(2)收费许可证显示经营服务性但无合法审批文件且无性质变更记录；(3)目录内收费收入未进入财政专户，表明资金被截留；触发任一即判定为疑点。
  audit_item: 不按照规定的预算级次、预算科目入库
  suspicion: 将行政事业性收费违规转为经营服务性收费管理
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于加强政府非税收入管理的通知\",\n    \"法规文号\": \"财综〔2004〕53号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二条第（一）项\",\n    \"内容概述\": \"行政事业性收费必须纳入财政管理，实行收支两条线，严禁将行政事业性收费转为经营服务性收费管理。\"\n  },\n  {\n    \"法规名称\":\
    \ \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第十八条\",\n    \"\
    内容概述\": \"收费项目"
- expression: (培训经费使用明细表.金额 > 0 AND 培训收费审批文件.批准文号 != '已批准') OR (培训经费使用明细表.收费对象 NOT IN 行政事业性收费目录清单.收费项目名称)
  description: 任何未经物价部门审批或未列入收费目录清单而向乡村医生收取培训费的行为均属违规；即使有收费依据，若超标准收费或未提供正规票据也视同违规，可通过票据编号缺失间接发现。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不合规
  suspicion: 向乡村医生违规收取培训费
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第四条\",\n    \"内容概述\": \"行政事业性收费实行目录清单管理，未列入目录清单的行政事业性收费一律不得收取。\"\n  }\n]"
- expression: 实施方案.补贴机具种类范围 NOT IN ('秸秆粉碎还田机', '秸秆打捆机', '青贮饲料收获机', '秸秆腐熟剂喷洒设备') && 机具品目名称、机具型号、是否纳入补贴标识.机具品目名称 NOT IN ('秸秆粉碎还田机',
    '秸秆打捆机', '青贮饲料收获机', '秸秆腐熟剂喷洒设备') && 机具名称、机具型号、补贴金额、补贴机具品目、购买主体.补贴机具品目 NOT IN ('秸秆粉碎还田机', '秸秆打捆机', '青贮饲料收获机', '秸秆腐熟剂喷洒设备')
  description: 判定规则：检查补贴实施方案、目录清单及发放明细中是否包含秸秆还田、青贮等关键处理设备。若以上三类资料中均未体现相关机具品目，则判定为‘未纳入农机购置补贴范围’。可采用关键词模糊匹配方式，如‘秸秆’、‘还田’、‘青贮’等进行文本筛查，命中率为0则触发疑点。
  audit_item: 秸秆综合回收利用方面不符合相关规定
  suspicion: 未将秸秆处理机具纳入农机购置补贴范围
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农业机械化促进法\",\n    \"法规文号\": \"中华人民共和国主席令第16号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十六条\",\n    \"内容概述\": \"中央和地方财政应当对农民和农业生产经营组织购买国家支持推广的先进适用的农业机械给予补贴。\"\n  },\n  {\n    \"法规名称\": \"关于加快推进农作物秸秆综合利用的意见\"\
    ,\n    \"法规文号\": \"国办发〔2008〕105号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"四、加大政策扶持力度\",\n    \"内容概述\": \"要求将秸秆综合"
- expression: 项目清单.项目类型 IN ('公租房','棚户区改造','经济适用房','保障性租赁住房') AND 缴费凭证.收费项目名称='城市基础设施配套费' AND 缴费凭证.金额>0 AND 缴费凭证.缴费时间>=批复文件.审批时间
    AND 缴费凭证.项目名称=项目清单.项目名称
  description: 当保障性安居工程项目类型符合减免政策，但缴费记录中出现城市基础设施配套费且金额大于0时，判定为违规收费。需结合缴费时间是否在项目审批之后，排除前期补缴等特殊情况。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规向保障性安居工程项目收取应减免城市基础设施配套费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"全额免除保障性安居工程建设项目城市基础设施配套费等各种行政事业性收费和政府性基金。\"\n  }\n]"
