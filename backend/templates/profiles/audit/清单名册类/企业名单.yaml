name: audit/清单名册类/企业名单
type: model
description: 从清单名册类类文档（企业名单）中提取结构化元数据。涵盖字段如：主营产品、企业名称、实际执行抵押率、贷款利率、贷款审批额度。文档范围包括：信贷支持企业名单、入园企业名单、秸秆综合利用企业名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 审批
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 企业名单
  member_count: 1
  member_details:
  - 信贷支持企业名单
  - 入园企业名单
  - 秸秆综合利用企业名单
output:
  fields:
  - name: 主营产品
    type: string
    description: 提取 主营产品 的文本值
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 实际执行抵押率
    type: string
    description: 提取 实际执行抵押率 的文本值
  - name: 贷款利率
    type: number
    description: 提取 贷款利率 的数值（含单位，如万元、吨等）
  - name: 贷款审批额度
    type: number
    description: 提取 贷款审批额度 的数值（含单位，如万元、吨等）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (农业企业产值占比 < 0.6) || (企业名单.主营业务类型 != '农业加工' && 农业加工企业产值 < 0.5) || (明细表.资金用途 == '非农')
  description: 农业产值占比阈值设定为低于60%（政策要求产业园农业产值原则上不低于60%），若核心企业属于非农行业且农业加工产值占比低于50%，则判定为严重异化；另，财政补贴资金直接流向主营业务为非农的企业，直接触警。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 现代农业产业园非农异化沦为工业园
  regulation: "[\n  {\n    \"法规名称\": \"《农业农村部 财政部关于开展国家现代农业产业园创建工作的通知》\",\n    \"法规文号\": \"农计发〔2017〕40号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"二、创建条件\",\n    \"内容概述\": \"产业园主导产业产值占产业园总产值的比重原则上不低于60%，且必须是种养业、农产品加工业或休闲农业等涉农产业。\"\n  }\n\
    ]"
- expression: 对比表.核准结果 == '未通过' && 对比表.未核准原因 IN ('证明材料不全', '目录版本不符', '非税收优惠范围') && 企业名单.主营产品 IN ('秸秆制板', '秸秆生物质发电', '秸秆饲料化')
  description: 若从事秸秆综合利用的合规企业申报税收优惠被拒，且驳回原因为‘证明材料不全’或‘目录版本不符’等主观/系统性质的门槛限制，而该企业主营业务明确属于《资源综合利用企业所得税优惠目录》范围，则判定为优惠未落实。重点排查因税务系统内部目录未更新导致的误判。
  audit_item: 秸秆综合回收利用方面不符合相关规定
  suspicion: 秸秆综合利用税收优惠未落实
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于印发《资源综合利用产品和劳务增值税优惠目录》的通知\",\n    \"法规文号\": \"财税〔2015〕78号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第一条及附件\",\n    \"内容概述\": \"利用秸秆等农林剩余物生产的符合条件的资源综合利用产品，可享受增值税即征即退优惠政策。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国企业所得税法实施条例\",\n    \"法规文号\": \"国务院令第714号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九十九条\",\n    \"\
    内容概述"
- expression: 实际均价（元/度）对比表.实际均价（元/度） > 实际均价（元/度）对比表.政策标准均价（元/度） && 实际均价（元/度）对比表.电费计费代码 == '一般工业用电' && 实际均价（元/度）对比表.电费计费代码
    != '农业生产用电'
  description: 如果秸秆加工企业（如生物质发电厂、饲料加工厂）的电费执行类别为‘一般工业用电’（约0.8元/度），而根据规定应执行‘农业生产用电’（约0.5元/度），即实际均价远高于政策标准，且电费计费代码未变更，则判定为用地用电优惠未落实。
  audit_item: 秸秆综合回收利用方面不符合相关规定
  suspicion: 秸秆利用企业非农电价违规计费
  regulation: "[\n  {\n    \"法规名称\": \"关于创新和完善促进绿色发展价格机制的意见\",\n    \"法规文号\": \"发改价格规〔2018〕943号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、（五）完善部分环保行业用电支持政策\",\n    \"内容概述\": \"明确对实行两部制电价的污水、垃圾、农林废弃物资源化利用等环保行业企业，给予用电优惠支持，部分地区明确执行农业生产用电价格。\"\
    \n  }\n]"
- expression: 企业名单.实际执行抵押率 > 政策指导利率.贷款抵押率上限要求
  description: 提取贷款发放详细记录中的‘抵押物评估价值’与‘贷款本金’，计算实际抵押率（贷款本金/抵押物价值）。若该比率显著高于政策执行文件中规定的贷款抵押率上限（例如政策规定最高120%，而银行要求200%），则判定为未落实信贷优惠政策，属于变相提高授信门槛。
  audit_item: 秸秆综合回收利用方面不符合相关规定
  suspicion: 秸秆利用项目信贷门槛设定不合规
  regulation: "[\n  {\n    \"法规名称\": \"关于金融服务乡村振兴的指导意见\",\n    \"法规文号\": \"银发〔2019〕11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十一条\",\n    \"内容概述\": \"鼓励银行业金融机构加大对农村产业融合发展的信贷支持，依法合规拓宽农业农村抵质押物范围，合理确定贷款额度、期限和利率，降低‘三农’信贷担保门槛。\"\n  }\n]"
