name: audit/清单名册类/对象清单
type: model
description: 从清单名册类类文档（对象清单）中提取结构化元数据。涵盖字段如：与本单位业务关联性、发放金额、受益人姓名/单位名称、实际发放金额、对象单位、所属行政村、是否为建档立卡贫困户、服务内容。文档范围包括：接待对象清单、服务对象清单、补助资金发放对象清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 对象清单
  member_count: 1
  member_details:
  - 接待对象清单
  - 服务对象清单
  - 补助资金发放对象清单
output:
  fields:
  - name: 与本单位业务关联性
    type: string
    description: 提取 与本单位业务关联性 的文本值
  - name: 发放金额
    type: number
    description: 提取 发放金额 的数值（含单位，如万元、吨等）
  - name: 受益人姓名-单位名称
    type: string
    description: 提取 受益人姓名-单位名称 的文本值
  - name: 实际发放金额
    type: number
    description: 提取 实际发放金额 的数值（含单位，如万元、吨等）
  - name: 对象单位
    type: string
    description: 提取 对象单位 的文本值
  - name: 所属行政村
    type: string
    description: 提取 所属行政村 的文本值
  - name: 是否为建档立卡贫困户
    type: boolean
    description: 提取 是否为建档立卡贫困户 的布尔值（是/否）
  - name: 服务内容
    type: string
    description: 提取 服务内容 的文本值
  - name: 服务对象姓名-名称
    type: string
    description: 提取 服务对象姓名-名称 的文本值
  - name: 服务面积
    type: string
    description: 提取 服务面积 的文本值
  - name: 经营规模
    type: string
    description: 提取 经营规模 的文本值
  - name: 职务
    type: string
    description: 提取 职务 的文本值
  - name: 补助对象的经营规模
    type: string
    description: 提取 补助对象的经营规模 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (接待事由说明.活动日期 IN 法定节假日列表) OR (接待事由说明.接待事由 LIKE '%探亲%' OR 接待事由说明.接待事由 LIKE '%休假%') OR (接待对象清单.与本单位业务关联性 = '无')
    OR (EXISTS (SELECT * FROM 差旅费报销汇总表 WHERE 差旅费报销汇总表.出差日期 = 接待事由说明.活动日期 AND 差旅费报销汇总表.出差地点 = 接待事由说明.行程地点))
  description: 接待发生在节假日，或事由直接涉及探亲、休假，或接待清单中对象与本单位无任何业务关系，或同一时段有该单位人员的亲属同行差旅记录，均突破公务接待范围。
  audit_item: 公务接待管理不符合规定
  suspicion: 将休假探亲纳入公务接待范围
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"国内公务接待应当严格接待范围，不得将休假、探亲、旅游等活动纳入国内公务接待范围。\"\n  }\n]"
- expression: (COUNT(服务对象清单 WHERE 服务对象清单.经营规模（亩） <= 小农户标准 AND 服务对象清单.服务面积 > 0) / COUNT(服务对象清单) * 100% < 政策要求小农户覆盖率) || (SUM(补助资金发放明细表.补助金额
    WHERE 服务对象清单.是否为建档立卡贫困户 = '是') / SUM(补助资金发放明细表.补助金额) * 100% < 政策要求贫困户补助占比) || (COUNT(服务对象清单 WHERE 服务对象清单.经营规模（亩） > 大户标准)
    / COUNT(服务对象清单) > 30% && 户均补助金额差异率 > 30%)
  description: 该表达式从服务覆盖面和资金流向两个维度判定。1. 小农户覆盖率：享受服务的小农户（经营规模≤20亩）数量占全部服务对象总数的比例，低于政策实施方案中明确的最低覆盖率（如60%），则判违。2. 贫困户补助占比：发放给建档立卡贫困户的补助资金总额占全部补助资金总额的比例，低于政策明确的倾斜要求。3.
    资金聚集度：若服务对象中经营规模超过100亩的大户数量占比超过30%，且计算大户与小户的'户均补助金额
  audit_item: 农业社会化服务实施不合规
  suspicion: 农业社会化服务未突出支持小农户等薄弱环节
  regulation: "[\n  {\n    \"法规名称\": \"农业部办公厅 财政部办公厅关于支持农业生产社会化服务工作的通知\",\n    \"法规文号\": \"农办财〔2017〕41号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"项目任务应突出支持薄弱环节，重点解决小农户办不了、办不好、办了不合算的生产难题，项目资金安排要向小农户和贫困村倾斜。\"\n  }\n\
    ]"
- expression: (ABS(补助资金发放明细表.补助单价 - 农业社会化服务补助标准制定依据文件.各项服务内容的补助单价（元/亩）) > 农业社会化服务补助标准制定依据文件.各项服务内容的补助单价（元/亩） * 10%) || (ANY(补助资金发放明细表.补助金额)
    > AVG(补助资金发放明细表.补助金额) * 3 && 服务对象清单.经营规模（亩） > 100) || (补助资金发放明细表.补助金额 > 农业社会化服务补助标准制定依据文件.补助资金总额 * 30%)
  description: 该表达式从标准执行偏差和资金分配极端化两个维度筛查。1. 标准执行偏差：检查'补助资金发放明细表'中的'补助单价'与'补助标准制定依据文件'中规定的对应服务内容单价是否存在较大偏离，允许10%以内的因差异化未明确导致的计算误差，超出10%则判定为无依据发放补贴。2.
    资金聚集度：筛查单个补助对象（个人或企业）获得的补助总额。若某个经营规模大于100亩的'大户'获取的补助金额，超过了所有补助对象补助
  audit_item: 农业社会化服务实施不合规
  suspicion: 农业社会化服务补助标准不合理或存在“垒大户”现象
  regulation: "[\n  {\n    \"法规名称\": \"农业部办公厅 财政部办公厅关于支持农业生产社会化服务工作的通知\",\n    \"法规文号\": \"农办财〔2017〕41号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"补助标准要科学合理，防止财政补助成为营利的工具。资金安排不能撒胡椒面，也不能垒大户。\"\n  }\n]"
- expression: (受益人姓名/单位名称.实际发放金额 GROUP BY 对象) < (规定的补助比例、应发标准（元/亩/人）.应发标准（元/亩/人）) || (SUM(受益人姓名/单位名称.实际发放金额) < 预算总额、拨付总额.拨付总额)
  description: 根据签收记录汇总个人实际所得，与政策规定的应发标准比对；或汇总下级单位所有实际发放金额，与上级财政下达的拨付总额比对。任一比对结果出现前者小于后者，且无正当理由（如扣除质保金），即判定为未足额发放。
  audit_item: 资金管理使用不符合相关规定
  suspicion: 未足额发放涉农补助资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价，确保资金及时、足额拨付到位。\"\n  }\n]"
- expression: (受益人姓名/单位名称、身份证号/统一社会信用代码、审核状态.审核状态 != '通过') && (受益人姓名/单位名称、发放金额、实际发放金额.受益人姓名/单位名称 IS NOT NULL) || (资质标签（如低保户、合作社）、关联关系人.资质标签
    != 政策规定条件)
  description: 筛选出审核未通过但仍出现在发放清单中的对象，或者其提供的资质证明文件并不符合政策要求的条件（如贫困证明造假、合作社为空壳），即判定为违规分配。
  audit_item: 资金管理使用不符合相关规定
  suspicion: 向不符合条件的对象分配涉农资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员违反规定使用、骗取财政资金的行为，包括截留、挪用、虚报、冒领等，将依法予以处理。\"\n  }\n]"
