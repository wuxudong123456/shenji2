name: audit/清单名册类/实施清单
type: model
description: 从清单名册类类文档（实施清单）中提取结构化元数据。涵盖字段如：各项改良措施的实施记录、安置类型、身份证号。文档范围包括：地力提升工程实施清单、渔民转产安置方案分类实施清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 实施清单
  member_count: 1
  member_details:
  - 地力提升工程实施清单
  - 渔民转产安置方案分类实施清单
output:
  fields:
  - name: 各项改良措施的实施记录
    type: string
    description: 提取 各项改良措施的实施记录 的文本值
  - name: 安置类型
    type: string
    description: 提取 安置类型 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 项目建设实施方案.计划土壤改良措施及面积 > 0 && 土壤改良工程验收报告.实际完成改良面积 == 0 || 土壤改良工程验收报告.实测有机质含量等指标 < 项目建设实施方案.地力提升指标目标值
  description: 实施方案明确要求实施土壤改良，但验收报告显示面积为零或地力指标实测值未达到目标且未整改，即认定未有效实施地力提升工程。目标值与实测值的偏差以主要指标（如有机质含量）为准。
  audit_item: 不符合高标准农田建设相关规定的行为
  suspicion: 未实施土壤改良等地力提升工程
  regulation: "[\n  {\n    \"法规名称\": \"高标准农田建设质量管理办法（试行）\",\n    \"法规文号\": \"农建发〔2021〕1号\",\n    \"效力级别\": \"规范性文件\",\n  \
    \  \"条款号\": \"第十三条\",\n    \"内容概述\": \"耕地地力提升措施应符合国家有关标准要求，不得擅自降低地力提升标准。\"\n  }\n]"
- expression: SELECT COUNT(DISTINCT 表4.安置类型) = 1 || (表1.年龄 > 50 && 表4.安置类型 = '自主创业' && 表6.身份证 IS NULL)
  description: 统计分类实施清单（表4）中安置类型的唯一种类，若仅为1种，表明“一刀切”未分类；同时检查年龄50岁以上渔民被安排自主创业但无相应培训记录的，属于分类与个体特征严重不匹配。
  audit_item: 退捕渔民转产安置不合规
  suspicion: 渔民转产安置方案未分类施策
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强长江流域重点水域禁捕和退捕渔民安置保障工作的通知\",\n    \"法规文号\": \"农办渔〔2021〕16号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"要求根据退捕渔民年龄、技能等特点，分类施策，提供个性化转产就业帮扶，杜绝简单摊派岗位。\"\n  }\n]"
