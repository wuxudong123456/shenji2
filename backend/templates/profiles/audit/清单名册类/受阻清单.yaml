name: audit/清单名册类/受阻清单
type: model
description: 从清单名册类类文档（受阻清单）中提取结构化元数据。涵盖字段如：审批时长、并网批复日期、申请受理日期、项目名称。文档范围包括：分布式光伏/风电项目并网受阻清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 审批
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 受阻清单
  member_count: 1
  member_details:
  - 分布式光伏/风电项目并网受阻清单
output:
  fields:
  - name: 审批时长
    type: string
    description: 提取 审批时长 的文本值
  - name: 并网批复日期
    type: date
    description: 提取 并网批复日期 的日期值，格式 YYYY-MM-DD
  - name: 申请受理日期
    type: date
    description: 提取 申请受理日期 的日期值，格式 YYYY-MM-DD
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 项目名称.审批时长（工作日） > 45
  description: 根据国家规定，电网企业应在受理后45个工作日内完成接入方案确认及接网工程，超出即构成违规。审批时长超过90个工作日的项目，存在人为设置障碍的重大嫌疑。
  audit_item: 农村用能清洁低碳转型不到位
  suspicion: 分布式可再生能源发电并网审批超时限
  regulation: "[\n  {\n    \"法规名称\": \"分布式光伏发电项目管理暂行办法\",\n    \"法规文号\": \"国能新能〔2013〕433号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十四条\",\n    \"内容概述\": \"电网企业应在20个工作日内出具接入意见；对于需要接网工程的，应在45个工作日内完成接入系统方案确认和接网工程实施。\"\n  }\n]"
