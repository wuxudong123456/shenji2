name: audit/清单名册类/用地清单
type: model
description: 从清单名册类类文档（用地清单）中提取结构化元数据。涵盖字段如：地块编号、收回/储备时间、规划用途、面积。文档范围包括：政府储备用地清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 用地清单
  member_count: 1
  member_details:
  - 政府储备用地清单
output:
  fields:
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 收回-储备时间
    type: date
    description: 提取 收回-储备时间 的日期值，格式 YYYY-MM-DD
  - name: 规划用途
    type: string
    description: 提取 规划用途 的文本值
  - name: 面积
    type: string
    description: 提取 面积 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (政府储备用地清单.规划用途 IN ('居住','保障性住房') OR 政府储备用地清单.规划用途 = '保障房优先') && 政府储备用地清单.地块编号 NOT IN (SELECT 地块编号 FROM 保障性安居工程供地明细表)
    && (政府储备用地实际使用情况对比表.实际用途 = '商品住宅' || 政府储备用地实际使用情况对比表.实际用途 = '商业开发' || 土地出让台账.受让人 != '保障房建设主体')
  description: 收回或储备地块规划可用于保障房建设，但未列入保障房供地明细表，且已实际用于商品住宅或商业开发，或受让人非保障房建设单位，即判定为未优先用于保障房。
  audit_item: 保障性安居工程项目建设用地未落实
  suspicion: 储备或收回土地未优先用于保障房建设
  regulation: "[\n  {\n    \"法规名称\": \"关于保障性安居工程用地供应管理的通知\",\n    \"法规文号\": \"国土资发〔2011〕218号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"通知正文相关要求\",\n    \"内容概述\": \"收回的国有建设用地和储备土地应当优先安排用于保障性安居工程建设，不得擅自改变用途或用于商业开发。\"\n  }\n]"
