violations:
- expression: (姓名、原职务、离职时间.新任职企业名称 IN (企业名称、业务关系存续时间)) && (DATEDIFF(离职时间, 新任职起始时间) < 1095) && (新任职企业.业务范围 IN 原企业经营业务类别)
  description: 筛查离职或退休后三年内（1095天）到与原任职企业有业务关系的私营企业、外资企业或中介机构担任职务或投资入股，且从事与原业务相关的经营活动。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 离职或退休后违规在与原企业有业务关系的企业任职或入股
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第七项\",\n    \"内容概述\": \"离职或者退休后三年内，不得在与原任职企业有业务关系的私营企业、外资企业和中介机构担任职务、投资入股，或者在上述企业或者机构从事、代理与原任职企业经营业务相关的经营活动。\"\
    \n  }\n]"
- expression: 实际签到人数.实际签到人数 > 超预算审批记录.批准参会人数
  description: 实际签到人数大于批准人数即构成超人数举办会议。超员比例≥20%为严重，10%-20%为一般。注意剔除临时旁听等合理情况。
  audit_item: 超标准举办会议
  suspicion: 实际参会人数超出批准人数
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条\",\n    \"内容概述\": \"各单位应当严格控制会议数量、会期和参会人员规模，会议工作人员控制在会议代表人数的10%以内。\"\n  }\n]"
- expression: (人员名单.单位 != 通知发布时间.通知参会单位及人员范围) || (同或协议.位置 包含 风景区) || (情况记录.实际活动内容 包含 旅游、考察、休闲 且 未在正式议程中)
  description: 参会人员超出规定范围（如家属、无关单位），或在风景区高消费场所办会，或议程外安排旅游休闲活动，任一条件满足即构成超范围。
  audit_item: 超标准举办会议
  suspicion: 超范围举办会议（含无关人员或变相旅游）
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十条\",\n    \"内容概述\": \"严禁到风景名胜区开会，不得借会议名义组织旅游或安排与会议无关的参观活动，不得宴请与会人员或发放纪念品。\"\n  }\n]"
- expression: 报销凭证.报销人员名单 NOT IN (实际签到人数.签到人员姓名) AND 报销凭证.报销人员名单 出现在批准名单中但未签到
  description: 有姓名出现在报销单中但签到表无对应记录，或签到时间明显异常（如一笔签名），即判定为虚列人员套取经费。结合请假记录可排除合理未签到。
  audit_item: 超标准举办会议
  suspicion: 虚列参会人员套取会议经费
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"会计凭证、会计帐簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定。不得伪造、变造会计凭证、会计帐簿及其它会计资料，不得提供虚假的财务会计报告。\"\n  }\n]"
- expression: (其他.用餐人数 != 明细表.外宾人数 + 明细表.陪同人数) || (其他.用餐人数 > 明细表.外宾人数)
  description: 判定逻辑：将宴请菜单明细表中的用餐人数，与外宾接待明细表中记录的外宾人数与陪同人数之和进行比对。若两者不相等，尤其是宴请菜单人数大于应到人数，则存在虚报人头、套取费用的嫌疑。同时比对报销凭证上的累计消费人次与登记在册的人次是否一致。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 虚增人数套取外宾接待费
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规制度\",\n   \
    \ \"条款号\": \"相关规定\",\n    \"内容概述\": \"接待对象应当按照标准自行用餐，确因工作需要，接待单位可以安排工作餐一次，并严格控制陪餐人数。接待单位不得用公款报销或者支付应由个人负担的费用。\"\n  }\n\
    ]"
- expression: 外宾姓名、接待日期、接待事由、外宾人数、陪同人数、接待总费用、外宾团组名称.陪同人数 / 外宾姓名、接待日期、接待事由、外宾人数、陪同人数、接待总费用、外宾团组名称.外宾人数 > 管理要求.陪同人数比例上限
  description: 设定阈值：例如，制度规定陪同人数不得超过外宾人数的50%（或1:1等具体标准）。通过计算单次接待活动中方陪同人数与外宾人数的比值，若超过制度上限，则判定为超标准安排。需关联人员职务，若陪同人员中包含行政无关或职级不符人员，则问题性质更加严重。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 超标准安排中方陪同人员
  regulation: "[\n  {\n    \"法规名称\": \"党政机关外宾接待管理办法\",\n    \"法规文号\": \"财行〔2013〕533号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"外宾来访期间，我方陪同人员人数应当根据外宾人数和工作需要从严控制。\"\n  }\n]"
- expression: (人员名单.已纳入减免名单的人数及身份信息 < 认定文件.在册低保户、五保户身份证号及人数) || (发放台账.实际发放补贴金额及对应人员 < 应发放金额) || (审批材料.审批通过时间 > 60个工作日) ||
    (明细表.免费穴位标注)
  description: 惠民政策覆盖名单人数少于同期在册困难群众总数，或补贴发放到位率低于95%，或减免审批用时超过60个工作日（远超合理时限），或公益性公墓中本应免费的穴位存在收费记录，均视为未解决基本需求。
  audit_item: 农村公益性殡葬政策未有效落实
  suspicion: 未保障困难群众基本殡葬需求
  regulation: "[\n  {\n    \"法规名称\": \"民政部关于全面推行惠民殡葬政策的指导意见\",\n    \"法规文号\": \"民发〔2012〕211号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三点\",\n    \"内容概述\": \"各地要为城乡低保对象、农村五保供养对象等困难群众免除基本殡葬服务费用，覆盖基本丧葬需求，确保政策惠及所有符合条件的对象。\"\n  }\n]"
- expression: '登记表.年龄 < 对照表.最低年龄 || 登记表.年龄 > 对照表.最高年龄

    示例：登记表.年龄 < 18 || 登记表.年龄 > 60'
  description: 根据新型职业农民培训政策，参训人员年龄一般须在18-60周岁（具体以当地文件为准）。通过身份证号提取出生日期计算周岁年龄，若年龄小于政策下限或大于政策上限，即判定为年龄不符违规。
  audit_item: 培训等政策实施不合规，效果不佳
  suspicion: 新型职业农民培训人员年龄超限
  regulation: "[\n  {\n    \"法规名称\": \"关于做好××年新型职业农民培育工作的通知（示例）\",\n    \"法规文号\": \"农办科〔20××〕××号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"二、（一）\",\n    \"内容概述\": \"新型职业农民培训对象年龄一般不超过60周岁，不低于18周岁。\"\n  }\n]"
- expression: (清单名册.培训课时 < 规定培训课时) || (清单名册.考核结果 = '不合格') || (主体证明.土地承包合同、农机购置证明等 = 无效) || (审批文件.审批流程记录缺失公示、审核环节)
  description: 新型职业农民认定必须经过完整培训并考核合格，且实际从事农业生产经营。若培训课时不达标，或考核不合格，或无法提供土地承包、生产经营等证明，或审批流程不完整，均应视为违规认定。
  audit_item: 培训等政策实施不合规，效果不佳
  suspicion: 不符合条件人员被认定为新型职业农民
  regulation: "[\n  {\n    \"法规名称\": \"新型职业农民认定管理办法（示例）\",\n    \"法规文号\": \"农人发〔20××〕×号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"申请认定新型职业农民须参加规定培训并考核合格，且具备一定规模的生产经营条件。\"\n  }\n]"
- expression: (人员名单.实际在岗人数 > 编制文件.核定编制总数) && (算申报表.预算申报人数 > 编制文件.核定编制总数) && (ABS(人员名单.实际在岗人数 - 算申报表.预算申报人数) <= 1)
  description: 实际在岗总人数超过上级核定编制总数，且日常公用经费预算申报表中所使用的预算人数同样超过编制总数，同时预算申报人数与实际在岗人数基本一致（允许±1人的统计误差）。表明单位在预算编报时未按编制数控制，而是据实以超编人数申报，导致公用经费预算虚增。超编比例超过10%为严重违规。
  audit_item: 生成模拟审计数据
  suspicion: 超编制配置人员虚报公用经费预算
  regulation: "[\n  {\n    \"法规名称\": \"行政单位财务规则\",\n    \"法规文号\": \"财政部令第71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
