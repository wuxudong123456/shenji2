name: audit/清单名册类/人员名单
type: model
description: 从清单名册类类文档（人员名单）中提取结构化元数据。涵盖字段如：享受低保的老年人、人员ID、人员名单、人员姓名、人员类型、人员证照类型要求、供养类型、保障人口数。文档范围包括：中方陪同人员名单、人员名单、创业就业培训参与人员名单、创业就业培训结业人员名单、参会人员名单、参训人员名单、因公出国（境）任务人员名单、培训人员名单、实际在岗人员名单、最低生活保障人员名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 人员
- 培训
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 人员名单
  member_count: 1
  member_details:
  - 中方陪同人员名单
  - 人员名单
  - 创业就业培训参与人员名单
  - 创业就业培训结业人员名单
  - 参会人员名单
  - 参训人员名单
  - 因公出国（境）任务人员名单
  - 培训人员名单
  - 实际在岗人员名单
  - 最低生活保障人员名单
  - 殡葬惠民政策覆盖人员名单（低保户、五保户）
  - 离职退休人员名单
  - 财政供养人员名单
  - 退休人员名单
  - 重点人群职业技能培训参训人员名单
