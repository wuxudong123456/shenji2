name: audit/清单名册类/开立清单
type: model
description: 从清单名册类类文档（开立清单）中提取结构化元数据。涵盖字段如：备案账户名称、备案账户账号、未纳入归集账户名单、账户总数。文档范围包括：银行账户开立清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 开立清单
  member_count: 1
  member_details:
  - 银行账户开立清单
output:
  fields:
  - name: 备案账户名称
    type: string
    description: 提取 备案账户名称 的文本值
  - name: 备案账户账号
    type: string
    description: 提取 备案账户账号 的文本值
  - name: 未纳入归集账户名单
    type: string
    description: 提取 未纳入归集账户名单 的文本值
  - name: 账户总数
    type: string
    description: 提取 账户总数 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 行对账单.对方账户类型 = '个人' && 行对账单.交易金额 > 50000 && 行对账单.交易摘要不含'备用金' && 行对账单.对方账户名称 NOT IN (未纳入归集账户名单.备案账户名称)
  description: 当银行流水中出现单笔超过5万元资金流入个人账户，且该交易缺乏备用金等合法事由，同时该个人账户未经公司正式备案，则疑为公款私存。
  audit_item: 资金管理方面存在的问题
  suspicion: 公款以个人名义开立账户存储
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国商业银行法\",\n    \"法规文号\": \"主席令第34号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十八条\",\n    \"内容概述\": \"企业事业单位可以自主选择一家商业银行的营业场所开立一个办理日常转账结算和现金收付的基本存款账户，不得将单位资金以个人名义开立账户存储。\"\n  }\n]"
- expression: 各账户日均余额、可归集资金、实际归集金额中(实际归集金额 / (各账户日均余额、可归集资金、实际归集金额.各账户日均余额 - 各账户日均余额、可归集资金、实际归集金额.可归集资金) ) < 0.8 && 同时存在高息贷款余额
    > 500万元
  description: 在未受限资金较为充裕的情况下，资金归集率不足80%，且公司外部贷款利息支出显著，即存在资金集中度不高、存贷双高问题。
  audit_item: 资金管理方面存在的问题
  suspicion: 资金集中度不达标
  regulation: "[\n  {\n    \"法规名称\": \"企业内部控制应用指引第6号——资金活动\",\n    \"法规文号\": \"财会[2010]11号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第三条\",\n    \"内容概述\": \"企业应当通过内部资金调度与归集管理，提高资金使用效率，防止资金沉淀，降低融资成本。\"\n  }\n]"
