name: audit/清单名册类/入股清单
type: model
description: 从清单名册类类文档（入股清单）中提取结构化元数据。涵盖字段如：亲属姓名、投资日期、持股比例、被投资企业名称、领导姓名。文档范围包括：企业领导人员及其亲属投资入股清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 入股清单
  member_count: 1
  member_details:
  - 企业领导人员及其亲属投资入股清单
output:
  fields:
  - name: 亲属姓名
    type: string
    description: 提取 亲属姓名 的文本值
  - name: 投资日期
    type: date
    description: 提取 投资日期 的日期值，格式 YYYY-MM-DD
  - name: 持股比例
    type: number
    description: 提取 持股比例 的数值（含单位，如万元、吨等）
  - name: 被投资企业名称
    type: string
    description: 提取 被投资企业名称 的文本值
  - name: 领导姓名
    type: string
    description: 提取 领导姓名 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (信息.股东姓名 IN (项申报表.申报人姓名, 项申报表.配偶及子女姓名)) AND (信息.企业名称 IN (名录.关联企业名称)) AND (项申报表.投资企业名称 不包含 信息.企业名称 OR 项申报表.持股比例
    != 信息.持股比例) AND (信息.出资日期 BETWEEN 领导人员任职开始日期 AND 审计基准日)
  description: 领导人员或其近亲属在关联企业持有股份且未如实申报，或申报持股比例与工商登记不符，同时入股时间发生在任职期间内，触发违规判定。持股比例>0即视为投资入股。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 领导人员违规投资入股关联企业
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第一款\",\n    \"内容概述\": \"国有企业领导人员不得个人从事营利性经营活动和有偿中介活动，或者在本企业的同类经营企业、关联企业和与本企业有业务关系的企业投资入股。\"\n  }\n]"
