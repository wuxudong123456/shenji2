name: audit/清单名册类/剥离清单
type: model
description: 从清单名册类类文档（剥离清单）中提取结构化元数据。涵盖字段如：已剥离职能、未剥离职能。文档范围包括：行政职能剥离清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 剥离清单
  member_count: 1
  member_details:
  - 行政职能剥离清单
output:
  fields:
  - name: 已剥离职能
    type: string
    description: 提取 已剥离职能 的文本值
  - name: 未剥离职能
    type: string
    description: 提取 未剥离职能 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (剥离清单.未剥离职能 IS NOT NULL AND 剥离清单.未剥离职能 IN 法定行政职能事项.法定行政职能事项) OR (转移协议.委托事项 IN 法定行政职能事项.法定行政职能事项 AND 转移协议.签订日期
    >= 脱钩政策施行日期)
  description: 剥离清单中仍存在法定行政职能且未剥离，或通过委托协议将法定行政职能交由协会行使，无论是否以购买服务名义，均触发违规。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 未剥离行业协会商会行政职能
  regulation: "[\n  {\n    \"法规名称\": \"行业协会商会与行政机关脱钩总体方案\",\n    \"法规文号\": \"中办发〔2015〕39号\",\n    \"效力级别\": \"党内法规/规范性文件\"\
    ,\n    \"条款号\": \"第二条主要任务（二）职能分离\",\n    \"内容概述\": \"剥离行业协会商会现有的行政职能，法律法规另有规定的除外。行政机关不得将其法定职能转移或委托给行业协会商会行使。\"\n  }\n]"
