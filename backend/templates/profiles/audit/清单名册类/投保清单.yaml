name: audit/清单名册类/投保清单
type: model
description: 从清单名册类类文档（投保清单）中提取结构化元数据。涵盖字段如：保费金额、投保农户姓名、标的、补贴金额、重叠保单数、重叠时段、重复标的ID、面积/数量。文档范围包括：同一保险标的重复投保清单、投保清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 补贴
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 投保清单
  member_count: 1
  member_details:
  - 同一保险标的重复投保清单
  - 投保清单
output:
  fields:
  - name: 保费金额
    type: number
    description: 提取 保费金额 的数值（含单位，如万元、吨等）
  - name: 投保农户姓名
    type: string
    description: 提取 投保农户姓名 的文本值
  - name: 标的
    type: string
    description: 提取 标的 的文本值
  - name: 补贴金额
    type: number
    description: 提取 补贴金额 的数值（含单位，如万元、吨等）
  - name: 重叠保单数
    type: string
    description: 提取 重叠保单数 的文本值
  - name: 重叠时段
    type: string
    description: 提取 重叠时段 的文本值
  - name: 重复标的ID
    type: string
    description: 提取 重复标的ID 的文本值
  - name: 面积-数量
    type: number
    description: 提取 面积-数量 的数值（含单位，如万元、吨等）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 农业保险保费补贴资金明细表.用途分类 NOT IN ('保费补贴') || 农业保险保费补贴会计凭证.收款方名称及账号 != 保险机构保费结算申请.保险公司收款账户 || 农业保险保费补贴会计凭证.金额 != 投保清单.补贴金额
    || (农业保险保费补贴会计凭证.收款方名称及账号 NOT IN (保险机构保费结算申请.保险公司收款账户) AND 农业保险保费补贴会计凭证.支出摘要 NOT LIKE '%保费补贴%')
  description: 补贴资金必须直接支付至承保机构且用于保单补贴，若收款方为非承保机构、支出用途为工作经费等，或补贴总额与投保清单汇总补贴额不一致，均构成违规。
  audit_item: 农业保险保费补贴未按规定配套、拨付、管理和结算
  suspicion: 保费补贴未专款专用、据实结算
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业保险保费补贴管理办法\",\n    \"法规文号\": \"财金〔2021〕113号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十二条\",\n    \"内容概述\": \"保费补贴资金必须专款专用，全额用于农业保险保费补贴，不得截留、挪用，据实与保险机构结算。\"\n  }\n]"
- expression: 同一保险标的重复投保清单.重叠保单数 >= 2 && 同一保险标的重复投保清单.重叠时段 == '是'
  description: 通过时空重叠分析，同一地块坐标或同一权属编号在保险期间内同时存在于两家及以上保险公司的有效保单中，且重叠保单数≥2，即可判定重复投保。系统自动生成重复投保清单，重叠保单数越多风险越高。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 同一标的多次重复投保骗取保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条第一项\"\
    ,\n    \"内容概述\": \"禁止投保人以同一保险标的多次重复投保，骗取农业保险保费补贴。\"\n  }\n]"
