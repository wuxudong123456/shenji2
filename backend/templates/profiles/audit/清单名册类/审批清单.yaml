name: audit/清单名册类/审批清单
type: model
description: 从清单名册类类文档（审批清单）中提取结构化元数据。涵盖字段如：产业分类、单个项目年综合能耗、审批单位、审批状态、建设单位名称、批复时间、申报产业类别、项目名称。文档范围包括：建设项目审批清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 审批
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 审批清单
  member_count: 1
  member_details:
  - 建设项目审批清单
output:
  fields:
  - name: 产业分类
    type: string
    description: 提取 产业分类 的文本值
  - name: 单个项目年综合能耗
    type: string
    description: 提取 单个项目年综合能耗 的文本值
  - name: 审批单位
    type: string
    description: 提取 审批单位 的文本值
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
  - name: 建设单位名称
    type: string
    description: 提取 建设单位名称 的文本值
  - name: 批复时间
    type: date
    description: 提取 批复时间 的日期值，格式 YYYY-MM-DD
  - name: 申报产业类别
    type: string
    description: 提取 申报产业类别 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目审批时间
    type: date
    description: 提取 项目审批时间 的日期值，格式 YYYY-MM-DD
  - name: 项目年综合能耗设计值
    type: string
    description: 提取 项目年综合能耗设计值 的文本值
  - name: 项目类型
    type: string
    description: 提取 项目类型 的文本值
  - name: 项目编码
    type: string
    description: 提取 项目编码 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 对照表.差异说明 IN (产业目录版本.淘汰类条目明细) && 审批清单.审批状态 == '已批准/核准' && 批复文件.批复结论 > 产业目录版本.准入能耗/排放限值
  description: 将项目申报的产业类别与国家发布的《产业结构调整指导目录》淘汰类目录进行精确比对，若匹配淘汰类条目且在此期间获得审批通过，则直接判定为违规。表达式考虑了政策时效性，只有当批复在政策生效后仍违规批准才触发。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 批准建设列入国家淘汰类产业目录的项目
  regulation: "[\n  {\n    \"法规名称\": \"产业结构调整指导目录（最新版本）\",\n    \"法规文号\": \"国家发展和改革委员会令第29号（示例）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三类 淘汰类 说明部分\",\n    \"内容概述\": \"淘汰类项目禁止投资，各金融机构不得发放贷款，土地管理、城乡规划、环境保护、消防、海关等部门不得办理相关手续。\"\n  },\n  {\n\
    \    \"法规名称\": \"企业投资项目核准和备案管理条例\",\n    \"法规文号\": \"国务院令第673号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条\",\n \
    \   \"内容"
- expression: (批复文件.批复建设产能规模 > (备案文件.核定淘汰产能数量 * 行业规定置换系数)) || (验收证明.政府验收签字 != '已验收' && 审批清单.审批状态 == '已批准')
  description: 依据各行业产能置换实施办法，新项目产能必须以淘汰原有产能为前提，且需满足减量或等量置换比例。若建设产能超出按置换比例折算后的允许值，或申报淘汰的旧产能并未实际关停验收即获批新项目，均构成违规。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 违反产能置换政策违规新增产能
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于化解产能严重过剩矛盾的指导意见\",\n    \"法规文号\": \"国发〔2013〕41号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第二部分第（三）点\",\n    \"内容概述\": \"产能严重过剩行业项目建设，须制定产能置换方案，实施等量或减量置换。\"\n  },\n  {\n    \"法规名称\": \"工业和信息化部关于印发水泥玻璃行业产能置换实施办法的通知\"\
    ,\n    \"法规文号\": \"工信部原〔2021〕80号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第五条\",\n    \"内容概述\": \"明确"
- expression: 建议书.技术路线描述 属于 产业目录版本.限制类条目 && 建议书.设计单位产品能耗 > 产业目录版本.准入能耗/排放限值 && 建议书.项目名称 包含 ('新材料'||'技改'||'特种')
  description: 部分项目通过高技术含量词汇包装规避限制类产业审查。表达式通过交叉比对核心技术参数与限制类工艺特征，若设计能效/排放达不到先进准入标准且工艺实质受限，则不论其申报名称如何均为违规审批。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 以技术改造名义违规审批建设限制类项目
  regulation: "[\n  {\n    \"法规名称\": \"产业结构调整指导目录（最新版本）\",\n    \"法规文号\": \"国家发展和改革委员会令第29号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二类 限制类 说明部分\",\n    \"内容概述\": \"限制类项目禁止新建，确需建设的需按特别程序严格审批，且需满足比淘汰类更严格的标准。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于发布《铝行业规范条件》等文件的公告\",\n    \"法规文号\": \"工业和信息化部公告2020年第XX号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"质量、工艺和装备章节\"\
    ,\n    \""
- expression: (审批清单.项目年综合能耗设计值 >= 1000 吨标准煤) && ((许可证.核发日期 < 评估报告.批复时间) || (日志.实际开工日期 < 评估报告.批复时间))
  description: 根据《固定资产投资项目节能审查办法》，年综合能耗超过1000吨标煤的项目，必须在施工许可或开工前通过节能审查。表达式通过比较三个核心日期，只要任一法定前置节点日期早于节能审查批复日期，即可判定为“未批先建”违规。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 项目未取得节能审查意见擅自开工建设
  regulation: "[\n  {\n    \"法规名称\": \"固定资产投资项目节能审查办法\",\n    \"法规文号\": \"国家发展和改革委员会令第44号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第三条、第九条\",\n    \"内容概述\": \"国家实行固定资产投资项目节能审查制度。未按规定进行节能审查或审查未通过的项目，建设单位不得开工建设，已建成的不得投入生产使用。\"\n  },\n  {\n\
    \    \"法规名称\": \"中华人民共和国节约能源法\",\n    \"法规文号\": \"中华人民共和国主席令第七十七号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十五条\",\n\
    \    \"内容概"
- expression: GROUP BY 审批清单.建设单位名称 & 建议书.项目选址 & 建议书.主要用能工艺 -> 聚合年综合能耗 SUM(评估报告.对应的单体项目能耗数据) > 1000 吨标准煤 && 审批清单.审批状态 == '未进行审查'
    && 审批清单.批复时间彼此间隔 < 12个月
  description: 通过多维度聚合分析破解化整为零伎俩。表达式规则为：若同一投资主体在12个月内，在同一物理区域内以多个仅从名称上看不出关联的小项目名义报批，且各自能耗均未达审查门槛，但合计能耗超过1000吨标煤的审查线，则识别为恶意拆分规避监管。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 通过拆分项目蓄意规避节能审查
  regulation: "[\n  {\n    \"法规名称\": \"固定资产投资项目节能审查办法\",\n    \"法规文号\": \"国家发展和改革委员会令第44号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第六条、第十六条\",\n    \"内容概述\": \"以拆分项目、提供虚假材料等不正当手段通过节能审查的，或未进行节能审查即开工的，均应严肃查处。对未达到节能审查门槛但由多个关联项目组成的整体，应合并核算总能耗。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国节约能源法\",\n    \"法规文号\": \"中华人民共和国主席令第七十七号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":"
