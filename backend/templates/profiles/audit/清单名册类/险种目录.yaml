name: audit/清单名册类/险种目录
type: model
description: 从清单名册类类文档（险种目录）中提取结构化元数据。涵盖字段如：应开展险种名称。文档范围包括：中央及地方农业保险险种目录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 险种目录
  member_count: 1
  member_details:
  - 中央及地方农业保险险种目录
output:
  fields:
  - name: 应开展险种名称
    type: string
    description: 提取 应开展险种名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 中央及地方农业保险险种目录.应开展险种名称 NOT IN (保险机构农业保险产品清单.保险品类名称)
  description: 政策要求必须开展的农业保险险种未出现在保险机构实际推出的产品清单中，即构成保险品类缺失疑点。
  audit_item: 农业保险保费补贴政策落实不到位
  suspicion: 部分农业保险品类未按规定开展
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第七条\"\
    ,\n    \"内容概述\": \"保险机构应当根据农业保险业务特性，开发适合农业生产经营者需求的保险产品。\"\n  },\n  {\n    \"法规名称\": \"中央财政农业保险保险费补贴管理办法\",\n    \"法规文号\"\
    : \"财金〔2021〕94号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"地方财政部门应当会同农业农村等有关部门，根据本地区农业产业发展需要，鼓励开"
