name: audit/清单名册类/邀请名单
type: model
description: 从清单名册类类文档（邀请名单）中提取结构化元数据。涵盖字段如：受邀单位资质、邀请单位数量、邀请日期、邀请范围。文档范围包括：投标人邀请名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 邀请名单
  member_count: 1
  member_details:
  - 投标人邀请名单
output:
  fields:
  - name: 受邀单位资质
    type: string
    description: 提取 受邀单位资质 的文本值
  - name: 邀请单位数量
    type: number
    description: 提取 邀请单位数量 的数值（含单位，如万元、吨等）
  - name: 邀请日期
    type: date
    description: 提取 邀请日期 的日期值，格式 YYYY-MM-DD
  - name: 邀请范围
    type: string
    description: 提取 邀请范围 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (变更申请记录.变更理由 == '技术复杂或特殊要求') && (符合资质条件的潜在投标人数量.符合资质条件的潜在投标人数量 >= 5) && (同类项目以往招标方式.同类项目以往招标方式 == '公开招标')
  description: 当申请变更为邀请招标的理由声称“技术复杂，仅有少量潜在投标人”，但审计查询市场显示符合资质的企业数量充足（如≥5家），且同类项目以往均采用公开招标时，判定为虚假理由。阈值5家为审计经验值，可结合具体项目实际情况调整。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 编造虚假理由骗取邀请招标批准
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十一条\",\n    \"内容概述\": \"公开招标应为原则，邀请招标仅限于特殊情况，且需履行批准手续。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\"\
    : \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"明确可以邀请招标的情形，包括技术复杂、只有少量潜在投标人可供选择等，但不得滥用该条款。\""
- expression: ( (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='施工' && 估算价>=4000000) || (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='货物'
    && 估算价>=2000000) || (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='服务' && 估算价>=1000000) ) && (公告.公告类型（公开/邀请） != '公开招标') && (变更申请记录
    IS NULL || 变更申请记录.批复意见 != '同意' || 变更申请记录.批复日期 > 公告.发布日期)
  description: 依据资金来源性质与估算价判定项目是否属于依法必须公开招标范畴，同时排除实际招标方式为非公开，且无合法审批变更手续的情形。若变更批复缺失、批复意见不明确或批复时间晚于招标活动开始，均视为违规。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 未经批准擅自将公开招标变更为邀请招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n  \
    \  \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"国有资金占控股或者主导地位的依法必须进行招标的项目，应当公开招标；除技术"
