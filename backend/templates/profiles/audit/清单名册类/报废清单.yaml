name: audit/清单名册类/报废清单
type: model
description: 从清单名册类类文档（报废清单）中提取结构化元数据。涵盖字段如：拆解完成日期、渔船编号、证明材料。文档范围包括：渔船拆解报废清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 报废清单
  member_count: 1
  member_details:
  - 渔船拆解报废清单
output:
  fields:
  - name: 拆解完成日期
    type: date
    description: 提取 拆解完成日期 的日期值，格式 YYYY-MM-DD
  - name: 渔船编号
    type: string
    description: 提取 渔船编号 的文本值
  - name: 证明材料
    type: string
    description: 提取 证明材料 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 新建渔船功率.渔船状态 = '报废' && 新建渔船功率.注销日期 IS NULL && 分配表.占用功率 > 0
  description: 渔船在登记台账中状态为“报废”但未办理注销手续，且仍在功率指标分配表中占有功率指标，即认定为僵尸渔船占用双控指标。
  audit_item: 落实渔业资源养护相关政策不到位
  suspicion: 已报废渔船未注销仍占用双控指标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国渔业船舶登记办法\",\n    \"法规文号\": \"农业部令2012年第8号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十八条\",\n    \"内容概述\": \"渔业船舶所有人应当在渔业船舶报废、拆解、灭失或者终止渔业活动后，及时办理注销登记。\"\n  }\n]"
