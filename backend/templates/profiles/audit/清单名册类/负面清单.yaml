name: audit/清单名册类/负面清单
type: model
description: 从清单名册类类文档（负面清单）中提取结构化元数据。涵盖字段如：产品目录、工艺、禁止及限制类投资领域目录、禁止或限制准入的行业、禁止投资领域条目、禁止类业务清单、限制投资领域及股比限制。文档范围包括：企业投资负面清单、外资准入负面清单、市场准入负面清单、行业准入负面清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 负面清单
  member_count: 1
  member_details:
  - 企业投资负面清单
  - 外资准入负面清单
  - 市场准入负面清单
  - 行业准入负面清单
output:
  fields:
  - name: 产品目录
    type: string
    description: 提取 产品目录 的文本值
  - name: 工艺
    type: string
    description: 提取 工艺 的文本值
  - name: 禁止及限制类投资领域目录
    type: string
    description: 提取 禁止及限制类投资领域目录 的文本值
  - name: 禁止或限制准入的行业
    type: string
    description: 提取 禁止或限制准入的行业 的文本值
  - name: 禁止投资领域条目
    type: string
    description: 提取 禁止投资领域条目 的文本值
  - name: 禁止类业务清单
    type: string
    description: 提取 禁止类业务清单 的文本值
  - name: 限制投资领域及股比限制
    type: string
    description: 提取 限制投资领域及股比限制 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 内部管理制度.禁止或限制性规定描述 != null && 上位法规政策文件.负面清单具体项目.contains(内部管理制度.禁止或限制性规定描述)
  description: 检查内部管理制度中的禁止性或限制性条款是否与上位法的'负面清单'或禁止性规定存在包含或完全相反的情况。若内部制度中允许或未禁止上位法明令禁止的事项，判定为违规。表达式中的'!= null'确保存在禁止性条款，'上位法规政策文件['负面清单'].contains()'用于比对是否触及上级红线。
  audit_item: 内控管理制度符合性审计
  suspicion: 内部制度突破上位法禁止性规定
  regulation: "[\n  {\n    \"法规名称\": \"规章制定程序条例\",\n    \"法规文号\": \"国务院令第322号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第八条\",\n    \"内容概述\": \"制定规章不得与法律、行政法规的规定相抵触。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国立法法\",\n    \"法规文号\": \"主席令第三十一号\"\
    ,\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第九十六条、第九十七条\",\n    \"内容概述\": \"下位法违反上位法规定的，由有关机关依法予以改变或者撤销。法律、行政法规、地方性法规、自治条例和单行条例、规章不"
- expression: (资产负债表.资产负债率 > 70%) && ( (投资项目名称、投资方向、投资金额、决策审批层级.投资方向 NOT IN 禁止类业务清单.主业目录) || (业务类型（衍生品、PPP等）、合约规模、风险敞口.业务类型（衍生品、PPP等）
    IN ('衍生品交易','PPP项目','明股实债投资') && 业务类型（衍生品、PPP等）、合约规模、风险敞口.合约规模 > 集团审批限额) )
  description: 资产负债率超过监管指导线（警戒线通常为70%）的企业，严格限制开展非主业投资和高风险业务。若高负债企业违规涉足负面清单业务或超限额开展高风险业务，即判定违规。
  audit_item: 未按规定落实去杠杆政策措施
  suspicion: 高负债企业违规开展非主业投资或高风险业务
  regulation: "[\n  {\n    \"法规名称\": \"中央企业投资监督管理办法\",\n    \"法规文号\": \"国资委令第34号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条、第十七条\",\n    \"内容概述\": \"中央企业应当聚焦主业发展，严格控制非主业投资，高负债企业原则上不得开展新增非主业投资和推高负债率的项目。不得开展超出自身承受能力的高风险投资。\"\n  }\n]"
- expression: ( 受让方名称、最终控制人国籍、标的企业所属行业代码、合规审查结论.标的企业所属行业代码 IN (禁止投资领域条目、限制投资领域及股比限制.禁止投资领域条目) ) && ( 禁止投资领域条目、限制投资领域及股比限制.特殊审批文件文号
    IS NULL || 禁止投资领域条目、限制投资领域及股比限制.特殊审批文件文号 == '' )
  description: 该表达式检测外资受让方是否违规进入禁止类投资领域。首先，将交易标的所属行业代码与国务院发布的最新版《外商投资准入特别管理措施（负面清单）》中的禁止类行业代码进行精确比对。若匹配，则核查企业是否持有国务院等相关最高权限机构的特批文件。若无任何审批文件，直接定性为严重违规。对于限制类领域，则需进一步验证是否有审批，且外资股比是否超出限制。
  audit_item: 违规处置重大资产
  suspicion: 违规向外资方转让禁止领域资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国外商投资法\",\n    \"法规文号\": \"主席令第26号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"外国投资者并购中国境内企业或者以其他方式参与经营者集中的，应当依照反垄断法的规定接受经营者集中审查。外商投资准入负面清单规定禁止投资的领域，外国投资者不得投资。\"\n  },\n \
    \ {\n    \"法规名称\": \"外商投资准入特别管理措施（负面清单）\",\n    \"法规文号\": \"国家发展和改革委员会 商务部令\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"全文\","
- expression: SELECT 投资协议.项目名称, 投资协议.投资标的, 统计表.与主业的关联度描述 FROM 投资协议 INNER JOIN 调查报告 ON 投资协议.投资项目最终标的公司及业务描述 = 调查报告.被投资企业的实际经营范围
    LEFT JOIN 国资委批复的主业范围关键词、主业目录 ON ... WHERE (调查报告.被投资企业的实际经营范围 NOT LIKE '%'||国资委批复的主业范围关键词、主业目录.国资委批复的主业范围关键词||'%' AND 统计表.与主业的关联度描述
    IS NULL) || 调查报告.被投资企业的实际经营范围 REGEXP MATCH (负面清单.禁止及限制类投
  description: 该表达式通过模糊匹配，筛查投资标的公司的工商注册经营范围，与企业经国资委认定的主业范围及《市场准入负面清单》进行比对。若项目既不属于主业，也无法提供合理的投资方向合规性说明以证明其符合战略性新兴产业等高相关度，或者直接触及负面清单中的禁止类领域，则判定为违规。
  audit_item: 违规进行重大投资
  suspicion: 违规决策投资非主业与禁止类项目
  regulation: "[\n  {\n    \"法规名称\": \"关于中央企业加强参股管理有关事项的通知\",\n    \"法规文号\": \"国资发改革〔2019〕126号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"严把主业投资方向。中央企业不得为规避主业监管，通过参股等方式开展中央企业投资项目负面清单规定的商业性房地产等禁止类业务。\"\n  }\n]"
