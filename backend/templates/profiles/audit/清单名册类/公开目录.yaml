name: audit/清单名册类/公开目录
type: model
description: 从清单名册类类文档（公开目录）中提取结构化元数据。涵盖字段如：公开标题、法定主动公开事项列表。文档范围包括：单位信息公开目录、县级政府网站政府信息公开目录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 公开目录
  member_count: 1
  member_details:
  - 单位信息公开目录
  - 县级政府网站政府信息公开目录
output:
  fields:
  - name: 公开标题
    type: string
    description: 提取 公开标题 的文本值
  - name: 法定主动公开事项列表
    type: string
    description: 提取 法定主动公开事项列表 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 《绩效目标与评价结果公开情况对照表》.应公开项='是' && 《绩效目标与评价结果公开情况对照表》.实际公开记录='无'
  description: 根据法规与制度应主动公开的绩效目标或评价结果，在公开对照表中标记为‘应公开’，但实际公开记录为空（无任何公开痕迹），即判定为未公开违规。已扣除经合法保密审查豁免公开的情形。
  audit_item: 部门、单位绩效评价结果未公开
  suspicion: 重点项目绩效评价结果未公开
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十条第（七）项\",\n    \"内容概述\": \"行政机关应主动公开财政预算、决算信息及其他应当主动公开的政府信息，绩效信息作为财政信息公开的重要组成部分，应向社会公开。\"\n  },\n  {\n    \"法规名称\"\
    : \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"\
    各级"
- expression: 《信息公开台账》.公开日期 - 《绩效评价报告》.批复日期 > 20 （工作日）
  description: 以绩效评价报告获正式批复的日期为起算点，至在指定公开平台实际发布的日期，两个日期之间的工作日天数超过20日（不含20日），即构成超期公开。20日为《政府信息公开条例》的一般规定，若单位制度有更严时限，则按制度时限执行。
  audit_item: 部门、单位绩效评价结果未公开
  suspicion: 绩效评价结果超期公开
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"属于主动公开范围的政府信息，应当自该政府信息形成或者变更之日起20个工作日内及时公开。法律、法规对政府信息公开的期限另有规定的，从其规定。\"\n  }\n]"
- expression: (招投标文件.中标公告日期 IS NULL) || (竣工验收报告.验收结论 != null && 信息公开公示材料.对应的资金拨付情况公示 IS NULL) || (信息公开公示材料.公示发布日期 - 项目竣工日期
    > 法定最晚公示期限)
  description: 判定规则：1）实施了招投标但无法查询到中标公告，属于关键信息缺失；2）项目已完成竣工验收，但在信息公开材料中找不到对应项目的资金使用、建设内容等最终结果的公示，属于信息公示不全；3）信息公开的日期与项目实际竣工日期之间间隔远超法定要求（通常为20个工作日），属于延迟公开。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 未按规定公开高标准农田建设项目信息
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"行政机关应当依照本条例第十九条的规定，主动公开本行政机关的机关职能、机构设置、办公地址、办公时间、联系方式、负责人姓名等。\"\n  }\n]"
