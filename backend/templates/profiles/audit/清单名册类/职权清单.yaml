name: audit/清单名册类/职权清单
type: model
description: 从清单名册类类文档（职权清单）中提取结构化元数据。涵盖字段如：审批权限范围、对应服务环节、法定办理程序、行政许可/审批/管理事项名称。文档范围包括：被审计单位行政职权清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 审批
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 职权清单
  member_count: 1
  member_details:
  - 被审计单位行政职权清单
output:
  fields:
  - name: 审批权限范围
    type: string
    description: 提取 审批权限范围 的文本值
  - name: 对应服务环节
    type: string
    description: 提取 对应服务环节 的文本值
  - name: 法定办理程序
    type: string
    description: 提取 法定办理程序 的文本值
  - name: 行政许可-审批-管理事项名称
    type: string
    description: 提取 行政许可-审批-管理事项名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ( 流水.付款方名称 = 信息.高管名单 && 信息.与被审计单位人事关联情况 = '人事或股权关联' && 协议.排他性条款 = '指定/唯一/必须' ) && ( ABS(明细台账.收费标准 - 调查资料.同类服务市场均价)/调查资料.同类服务市场均价
    > 0.3 || 明细台账.服务提供方 != '公开竞争方式确定' )
  description: 当满足以下条件时触发疑点：①收款方为被审计单位下属、控股或存在人事关联的企业；②服务合同明确限定唯一服务提供商或变相排除其他竞争者；③收费标准与同类服务市场均价的偏差率大于30%，或根本未履行招标、竞争性谈判等公开选取程序。三项条件同时满足，即可判定为依托行政权力垄断经营且高价收费。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 依托行政权力垄断经营并高价收费
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十三条\",\n    \"内容概述\": \"行政机关和法律、法规授权的具有管理公共事务职能的组织不得强制或者变相强制市场主体接受中介服务、购买指定商品、参加有偿培训等，不得指定或者变相指定中介服务机构、商品供应商、培训机构。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国反垄断法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条\"\
    ,\n   "
- expression: ( 收费明细台账.对应审批事项 && 服务合同.服务提供方 IN (名录.机构名称) && ABS(服务合同.是否强制或唯一 - 1) = 0 ) && ( ABS(收费明细台账.收费总额 - 流水.收款金额) <
    0.01 )
  description: 触发条件：在办理行政许可、资质认定等事项时，官方明确要求或暗中诱导必须通过特定名录内的中介机构提供服务，且该名录无公开竞争、无同等替代选项；同时，审计期间发现该中介服务的收费记录数量与被审计单位审批业务量呈明显同步变动，表明两者已捆绑。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 利用审批权指定中介服务并收费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步清理规范国务院部门行政审批中介服务的通知\",\n    \"法规文号\": \"国办发〔2015〕31号\",\n    \"效力级别\":\
    \ \"制度文件\",\n    \"条款号\": \"第二条第三项\",\n    \"内容概述\": \"审批部门不得以任何形式指定中介服务机构，对各类中介服务机构提供的服务不得以任何形式附加限制性或歧视性条件。\"\n  },\n\
