name: audit/清单名册类/需求清单
type: model
description: 从清单名册类类文档（需求清单）中提取结构化元数据。涵盖字段如：对接状态、申请日期、需求金额。文档范围包括：企业融资需求清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 需求清单
  member_count: 1
  member_details:
  - 企业融资需求清单
output:
  fields:
  - name: 对接状态
    type: boolean
    description: 提取 对接状态 的布尔值（是/否）
  - name: 申请日期
    type: date
    description: 提取 申请日期 的日期值，格式 YYYY-MM-DD
  - name: 需求金额
    type: number
    description: 提取 需求金额 的数值（含单位，如万元、吨等）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (统计表.获得贷款企业数/统计表.申请企业数 < 0.5) || (统计表.实际贴息额/统计表.应贴息额 < 0.8) || (发放记录.实际利率 > 政策文件.贴息利率*1.1) || (偿金台账.使用余额/偿金台账.补偿金规模
    < 0.2)
  description: 贷款支持覆盖率低于申请企业的50%，或贴息兑现率低于80%，或企业实际承担的贷款利率超过政策承诺利率的110%，或风险补偿金到位规模不足应设规模的20%，任一条件成立即判定金融扶持政策缺失或落实不到位。
  audit_item: 现代农业产业园（集群、强镇）政策扶持不到位
  suspicion: 现代农业产业园金融扶持政策未建立或执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于金融服务乡村振兴的指导意见\",\n    \"法规文号\": \"银发〔2019〕11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"五、强化金融产品和服务方式创新\",\n    \"内容概述\": \"鼓励银行业金融机构单列涉农信贷计划，下放审批权限，优化审批流程，开发专属金融产品，加大信用贷款投放力度，合理确定贷款利率水平。\"\n  },\n\
    \  {\n    \"法规名称\": \"国务院办公厅关于支持返乡下乡人员创业创新促进农村一二三产业融合发展的意见\",\n    \"法规文号\": \"国办发〔2016〕84号\",\n    \"效力级别\": \"规范性文件\""
