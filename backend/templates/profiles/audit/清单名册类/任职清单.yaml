name: audit/清单名册类/任职清单
type: model
description: 从清单名册类类文档（任职清单）中提取结构化元数据。涵盖字段如：姓名、是否在运营企业兼职、职务。文档范围包括：管理机构人员任职清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 任职清单
  member_count: 1
  member_details:
  - 管理机构人员任职清单
output:
  fields:
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 是否在运营企业兼职
    type: boolean
    description: 提取 是否在运营企业兼职 的布尔值（是/否）
  - name: 职务
    type: string
    description: 提取 职务 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (股东名称及股权结构信息.股东名称 contains 开发区管理机构) || (任职清单.姓名 == 运营企业工商登记信息.法定代表人) || (中标单位及委托关系信息.中标单位 == 运营企业 && 中标单位及委托关系信息.委托关系
    == "直接委托" ) && (任职清单.是否在运营企业兼职 == true)
  description: 当运营企业股权结构中出现管理机构直接持股，或管委会工作人员兼任企业法定代表人，同时存在开发项目直接委托给该企业且未经过公开招标，即构成政企不分、垄断经营。
  audit_item: 落实“六稳”“六保”政策存在的其他问题
  suspicion: 开发区运营企业与管理机构未分离
  regulation: "[\n  {\n    \"法规名称\": \"《关于促进开发区改革和创新发展的若干意见》\",\n    \"法规文号\": \"国办发〔2017〕7号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"开发区管理机构应聚焦经济管理和公共服务职能，开发建设运营实行政企分离，原则上不再直接参与具体经营业务。\"\n  },\n  {\n    \"法规名称\"\
    : \"《中华人民共和国公务员法》\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十三条\",\n    \"内容概述\": \"公务员不得从事或者参与营利性"
