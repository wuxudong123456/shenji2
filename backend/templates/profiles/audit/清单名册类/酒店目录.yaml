name: audit/清单名册类/酒店目录
type: model
description: 从清单名册类类文档（酒店目录）中提取结构化元数据。涵盖字段如：协议价格、有效期、酒店名称。文档范围包括：定点酒店目录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 协议
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 酒店目录
  member_count: 1
  member_details:
  - 定点酒店目录
output:
  fields:
  - name: 协议价格
    type: number
    description: 提取 协议价格 的数值（含单位，如万元、吨等）
  - name: 有效期
    type: string
    description: 提取 有效期 的文本值
  - name: 酒店名称
    type: string
    description: 提取 酒店名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (出差审批单 IS NULL) || (住宿费发票.酒店名称 NOT IN (定点酒店目录.酒店名称) && 住宿费发票.住宿金额 > 差旅住宿费地区标准 || 住宿费发票.住宿日期 NOT BETWEEN 出差审批单.批准起止日期)
  description: 无出差审批单、住宿酒店非定点且价格超过当地差旅住宿费标准、或住宿日期与审批日期不符，均构成违规。定点目录和地区标准依据当地财政部门公布的文件。
  audit_item: 公务接待管理不符合规定
  suspicion: 出差未审批或未入住定点酒店
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关差旅费管理办法\",\n    \"法规文号\": \"财行〔2013〕531号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条、第二十条\",\n    \"内容概述\": \"出差人员应当按规定等级乘坐交通工具，按规定标准住宿；未按规定等级乘坐交通工具和住宿的，超支部分由个人自理。各单位应按规定选择定点饭店住宿。\"\n  }\n]"
