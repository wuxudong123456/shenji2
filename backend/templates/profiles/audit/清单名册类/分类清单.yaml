name: audit/清单名册类/分类清单
type: model
description: 从清单名册类类文档（分类清单）中提取结构化元数据。涵盖字段如：户号、户名、月均用电量、用户名称、用户编号、用电类别、行业分类。文档范围包括：用户分类清单、电力用户分类清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 分类清单
  member_count: 1
  member_details:
  - 用户分类清单
  - 电力用户分类清单
output:
  fields:
  - name: 户号
    type: string
    description: 提取 户号 的文本值
  - name: 户名
    type: string
    description: 提取 户名 的文本值
  - name: 月均用电量
    type: string
    description: 提取 月均用电量 的文本值
  - name: 用户名称
    type: string
    description: 提取 用户名称 的文本值
  - name: 用户编号
    type: string
    description: 提取 用户编号 的文本值
  - name: 用电类别
    type: string
    description: 提取 用电类别 的文本值
  - name: 行业分类
    type: string
    description: 提取 行业分类 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (分类清单.用电类别 != '农业生产用电' && (分类清单.用户名称 LIKE '%农业%' || 信息.经营范围 CONTAINS '种植' || '养殖')) && 分类清单.目录电价 > 执行文件.优惠电价标准
  description: 根据用户名称或经营范围可判断为农业主体的，用电类别却划分为商业或工业，实际结算电价高于农业优惠电价，即存在电价执行错误。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业用户电价未执行优惠类别
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"农业生产用电是指用于农业、林业、牧业、渔业生产的用电，应执行相应电价类别，任何单位不得擅自改变用电类别。\"\n  }\n]"
- expression: (用户编号.用电类别 = '农业生产用电' && 用户编号.月均用电量 > 同类型农业用户均值的3倍) && (设施清单.额定功率 / 总设备功率 > 0.3)
  description: 月用电量显著超过同类纯农业生产用电户（超出3倍标准差），且现场核查发现存在冷链加工、商业办公等高耗能非农设备，未按规定分表计量，可能将高价电转嫁为农业电价。
  audit_item: 相关支持政策落实不到位
  suspicion: 高耗能农业设施违规全额享受农业电价
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"对包含非农业生产用电的混合用电，应分表计量，按不同电价类别分别计费，不得擅自将非农用电并入农业电价收取。\"\n  }\n]"
- expression: (分类清单.用电类别 != '农业生产用电' AND 分类清单.行业分类 IN ('农业','林业','畜牧业','渔业','农产品初加工','灌溉服务')) OR (执行凭证.电价代码 != 农业生产电价标准、适用范围.农业生产电价标准
    && 执行凭证.实际执行单价 IN (统计表.农业用户数))
  description: 依据《销售电价分类适用范围》文件，农业用电含种植、养殖、灌溉等，若用户行业属于农业但用电类别被错划为“一般工商业”或“大工业”等，则未享受政策电价。通过比对用户行业属性与实际执行电价代码即可定位。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业用电户未执行农业生产电价
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条第（二）款\",\n    \"内容概述\": \"农业生产用电是指农村、农场、林场、牧场、渔场等用电，以及农业排灌、农业服务业中的农产品初加工用电，应执行农业生产电价。\"\n \
    \ }\n]"
