violations:
- expression: (兼职名单.姓名 IN 名册 AND 兼职名单.审批状态 = '未审批') OR (名册.退休时间 IS NOT NULL AND 兼职名单.任职起始时间 - 名册.退休时间 < 3年 AND 兼职名单.领取报酬 =
    true AND 名册.原职务 关联 兼职名单.兼职协会)
  description: 在职公务员未经批准在协会兼职，或退休公务员在脱钩后3年内到原管辖业务的协会任职并领取薪酬，满足任一条件即生成疑点。退休时间差<3年且存在利益关联的判定为高风险。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 公务员违规在行业协会商会任职兼职
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"中华人民共和国主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十四条、第一百零七条\",\n    \"内容概述\": \"公务员不得在营利性组织中兼任职务；辞去公职或退休后，原系领导成员的公务员在离职三年内不得到与原工作业务直接相关的企业或者其他营利性组织任职。\"\n  }\n]"
- expression: (COUNT(职务名称、职级、人数名册.职级) > 核定领导职数、各岗位最高职级.核定领导职数) OR (存在 职务名称、职级、人数名册.职级 > 核定领导职数、各岗位最高职级.各岗位最高职级)
  description: 同一职级实配人数超过核定领导职数，或领导干部的职级高于岗位规定的最高职级（低职高配），均属违规。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 超职数或超规格配备领导干部
  regulation: "[\n  {\n    \"法规名称\": \"党政领导干部选拔任用工作条例\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第五十三条第（十）项\"\
    ,\n    \"内容概述\": \"不准超职数配备、超机构规格提拔领导干部，或者违反规定擅自设置职务名称。\"\n  }\n]"
- expression: (支付台账.实发工资 > 组织计划.计划用工天数 * 1.2) && (支付台账.姓名 NOT IN 考勤记录.姓名) || (支付台账.工时 > 考勤记录.出勤工时 * 1.3)
  description: 当实际支付人工费超出预算的20%时，或工资表中存在未在实名制考勤中登记的‘影子人员’，或计薪工时大幅超过考勤记录的130%时，触发疑点报警。
  audit_item: 工程项目成本异常调查
  suspicion: 人工费虚列或超支
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"用人单位实行农民工劳动用工实名制管理，与招用的农民工书面约定或者通过依法制定的规章制度规定工资支付标准、支付时间、支付方式等内容。\"\n  },\n  {\n    \"法规名称\"\
    : \"基本建设财务规则\",\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\",\n    \"内容概述\": \"项目建设单位应当严格控制建设"
- expression: 执行台账.实际施工主体名称 != 中标单位名称 && 无合法分包审批记录 && 支付明细表.收款单位名称 != 中标单位名称
  description: 中标单位不履行合同约定的施工义务，将全部工程或肢解后以分包名义转给其他单位或个人施工，自己仅收取管理费。表达式通过比对中标人与实际施工人、收款人与合同签订人是否一致来判定转包。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 中标单位将全部工程转包
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十八条\"\
    ,\n    \"内容概述\": \"禁止承包单位将其承包的全部建筑工程转包给他人，禁止承包单位将其承包的全部建筑工程肢解以后以分包的名义分别转包给他人。\"\n  },\n  {\n    \"法规名称\": \"建设工程质量管理条例\"\
    ,\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第七十八条\",\n    \"内容概述\": \"本条例所称转包，是指承包单位承包建设工程后"
- expression: 算申报表.申报人数（或测算依据人数） > 核定文件.核定编制数 || 算申报表.申报人数（或测算依据人数） > 名册.在编实有人数
  description: 将预算申报表中作为经费测算基础的申报人数与编制部门核定的编制数、人事部门提供的实际在编人数逐一比对。若申报人数大于核定编制数或大于实际在编人数，即存在多报人数套取公用经费的嫌疑；申报人数偏差率超过0%即触发疑点预警，偏差越大违规风险越高。
  audit_item: 审计事项深入研究
  suspicion: 未按人员编制数申报日常公用经费预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号（2014年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第三十二条\",\n    \"内容概述\": \"各部门、各单位编制预算草案，应当真实、准确，按照政府收支分类科目、预算支出标准和要求以及绩效目标管理规定编制；预算编制不实、不准确的，应予纠正。\"\n\
    \  }\n]"
- expression: ((明细表.申报裁员人数 > 备案记录.备案裁员人数) || (名册.在职人数 < 申领条件、补贴标准、发放时限要求.申领条件)) && (明细表.实际发放金额 > 0) || (明细表.发放时间 - 申领条件、补贴标准、发放时限要求.发放时限要求
    > 0)
  description: 企业申报的裁员人数与劳动部门备案不符，或在职人数已低于政策规定的申领条件，但仍获得补贴，构成骗取行为；若发放时间晚于截止日期，构成延迟发放。两者均为未按规定发放。
  audit_item: 落实“六稳”“六保”政策存在的其他问题
  suspicion: 未按规定发放稳岗补贴
  regulation: "[\n  {\n    \"法规名称\": \"《关于失业保险支持企业稳定就业岗位的通知》\",\n    \"法规文号\": \"人社部发〔2019〕34号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条、第三条\",\n    \"内容概述\": \"企业申请稳岗补贴应如实提供裁员情况，补贴须按时足额发放，严禁虚报冒领；对不符合条件的企业不得拨付补贴。\"\n  },\n  {\n    \"\
    法规名称\": \"《失业保险条例》\",\n    \"法规文号\": \"国务院令第258号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"\
    失业保险基金可用于稳"
- expression: ((SELECT COUNT(*) FROM 在编/编外教师名册 WHERE 在编/编外教师名册.教师身份 = '编外') / (SELECT COUNT(*) FROM 在编/编外教师名册) > 0.2) AND
    (连续3年 (乡村教师招聘计划.计划招聘岗位数 - 乡村教师招聘计划.实际录用数 > 0))
  description: 当学校存在核定编制空缺，但连续3年未通过公开招聘补充在编教师，且编外教师占比超过20%时，判定为“有编不补”违规。若空缺编制持续超过3年且编外教师长期承担教学任务，触发高风险预警。
  audit_item: 乡村教师队伍建设不符合要求
  suspicion: 长期聘用编外教师且“有编不补”
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于印发乡村教师支持计划（2015—2020年）的通知\",\n    \"法规文号\": \"国办发〔2015〕43号\",\n    \"效力级别\"\
    : \"行政法规\",\n    \"条款号\": \"第三部分第（三）项\",\n    \"内容概述\": \"严禁在有合格教师来源的情况下“有编不补”、长期使用临聘人员。\"\n  }\n]"
