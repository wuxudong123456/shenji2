name: audit/清单名册类/名册
type: model
description: 从清单名册类类文档（名册）中提取结构化元数据。涵盖字段如：交易量、亲属关系、亲属姓名、人员姓名、人数、代缴年度、代缴金额、任职学校。文档范围包括：乡镇/村发放名册、产业技术培训人员名册、企业用工参保人员名册、全校在籍学生名册（学籍库）、公务员名册、养老保险代缴人员名册、兼职人员名册、劳务人员花名册、去产能分流人员名册、合作社成员名册等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 人员
- 合同
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 名册
  member_count: 1
  member_details:
  - 乡镇/村发放名册
  - 产业技术培训人员名册
  - 企业用工参保人员名册
  - 全校在籍学生名册（学籍库）
  - 公务员名册
  - 养老保险代缴人员名册
  - 兼职人员名册
  - 劳务人员花名册
  - 去产能分流人员名册
  - 合作社成员名册
  - 在编/编外教师名册
  - 在职人员花名册
  - 就业人员名册
  - 带动农户名册
  - 成员花名册
  - 房地产开发企业员工名册
  - 护理人员名册
  - 教职工亲属名册
  - 现场施工人员花名册
  - 社员名册
  - 组织人事部门公职人员名册
  - 补助学生名册
