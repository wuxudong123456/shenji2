name: audit/清单名册类/程量清单
type: model
description: 从清单名册类类文档（程量清单）中提取结构化元数据。涵盖字段如：变更涉及的分部分项工程量及单价、合同单价、合同工程量、实际完成抗灾改造点的设计参数、计划工程量、计划建设面积。文档范围包括：工程量清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 合同
- 工程
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 程量清单
  member_count: 1
  member_details:
  - 工程量清单
output:
  fields:
  - name: 变更涉及的分部分项工程量及单价
    type: number
    description: 提取 变更涉及的分部分项工程量及单价 的数值（含单位，如万元、吨等）
  - name: 合同单价
    type: number
    description: 提取 合同单价 的数值（含单位，如万元、吨等）
  - name: 合同工程量
    type: string
    description: 提取 合同工程量 的文本值
  - name: 实际完成抗灾改造点的设计参数
    type: string
    description: 提取 实际完成抗灾改造点的设计参数 的文本值
  - name: 计划工程量
    type: string
    description: 提取 计划工程量 的文本值
  - name: 计划建设面积
    type: string
    description: 提取 计划建设面积 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: COUNT(审批台账.所有变更编号 GROUP BY 同一分部分项工程) > 1 && SUM(审批台账.累计变更金额) > 施工合同.合同金额*10% && MAX(审批台账.单次变更金额) < (施工合同.合同金额*10%*0.9)
  description: 对同一施工部位或分部分项在短期内多次申报小金额变更，每笔均低于合同价10%的审批门槛，但累计总额超过合同价10%，属于化整为零规避专项审批或重新招标。若单次变更金额均控制在限额的90%以下，且时间间隔小于30天，疑点等级为高。
  audit_item: 工程变更审计评估
  suspicion: 将同一变更项目化整为零规避招标或审批
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n   \
    \ \"法规文号\": \"国家发展和改革委员会令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"本规定第二条至第四条规定范围内的项目，其勘察、设计、施工"
- expression: (＜验收报告.验收结论＞ != '合格') || (＜程量清单.实际完成抗灾改造点的设计参数（杆塔防风等级、地下电缆占比、配电房抗洪标高）＞ < ＜标准.所在地区设防标准要求（如基本风速≥35m/s、配电房地面高程高于百年一遇洪水位）＞)
    || (＜程量清单.实际完成抗灾改造点的设计参数（杆塔防风等级、地下电缆占比、配电房抗洪标高）＞ < ＜标准.所在地区设防标准要求（如基本风速≥35m/s、配电房地面高程高于百年一遇洪水位）＞) || (＜记录台账.近三年因自然灾害导致的停电次数与损失负荷＞
    > 1.5 * 相邻县平均值)
  description: 验收报告有不合格分项、抗灾改造后的设施参数不满足国家或行业技术标准，或该地区因灾停电次数明显高于类似气象条件的相邻区域（1.5倍以上），均判定为抗灾能力不达标。
  audit_item: 农村电网巩固提升工程存在短板
  suspicion: 农村电网抗灾防御能力不达标
  regulation: "[\n  {\n    \"法规名称\": \"配电网防灾技术导则\",\n    \"法规文号\": \"DL/T 5729-2016\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"全文\",\n    \"内容概述\": \"规定了配电网防风、防洪、防雷等防灾技术措施和最低设防标准，要求新建和改造工程严格执行。\"\n  }\n]"
- expression: (实际完成工程量 < 计划工程量) && (实际建设面积 < 上级下达建设任务指标) || (已支付工程量对应进度款占比 >= 95% && 实际完成工程量 < 计划工程量)
  description: 判定规则：1）实际完成的工程量（如渠道长度、道路面积）少于设计或计划工程量，同时实际建成面积低于上级下达的任务指标，直接认定为未完成目标任务；2）虽资金支付比例已达95%以上，但实际工程量仍低于计划，预警为“资金超前支付但工程滞后”，可能存在挪用资金或虚报进度的风险。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 未完成高标准农田建设目标任务
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"项目建设单位应当按照规定程序和批复的初步设计组织项目实施，不得擅自变更建设地点、规模、标准和主要建设内容，确保完成建设任务。\"\n  }\n]"
