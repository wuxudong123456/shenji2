name: audit/清单名册类/审查清单
type: model
description: 从清单名册类类文档（审查清单）中提取结构化元数据。涵盖字段如：不符合条件原因、审查结论、申请单位、项目名称。文档范围包括：项目合规性审查清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 审查清单
  member_count: 1
  member_details:
  - 项目合规性审查清单
output:
  fields:
  - name: 不符合条件原因
    type: string
    description: 提取 不符合条件原因 的文本值
  - name: 审查结论
    type: string
    description: 提取 审查结论 的文本值
  - name: 申请单位
    type: string
    description: 提取 申请单位 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ({配总表.申请单位} NOT IN ({资质审核材料.合格单位名单})) || ({项目合规性审查清单.审查结论} = '不合格' && {配总表.分配金额} > 0) || ({资质审核材料.经营范围} NOT
    LIKE '%{政策要求行业关键词}%' && {配总表.分配金额} > 0)
  description: 三个独立触发条件：分配总表中的单位未出现在资质审核合格名单中；审查清单明确判定不合格但仍获得资金；申报单位经营范围与政策支持的行业不匹配但配置金额>0。满足任一条件即判定为向不符合条件项目分配资金。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 向不符合条件的项目分配资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员擅自扩大支出范围、提高支出标准，或以虚报、冒领等手段骗取财政资金的，应责令改正并追回资金。\"\n  }\n]"
