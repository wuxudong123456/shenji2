name: audit/清单名册类/配置清单
type: model
description: 从清单名册类类文档（配置清单）中提取结构化元数据。涵盖字段如：实际库存数量、数量、有效期、物资名称、设备名称。文档范围包括：防火设备配置清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 配置清单
  member_count: 1
  member_details:
  - 防火设备配置清单
output:
  fields:
  - name: 实际库存数量
    type: number
    description: 提取 实际库存数量 的数值（含单位，如万元、吨等）
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 有效期
    type: string
    description: 提取 有效期 的文本值
  - name: 物资名称
    type: string
    description: 提取 物资名称 的文本值
  - name: 设备名称
    type: string
    description: 提取 设备名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (签订文件.考核指标（巡查频率、火灾次数上限）为空 OR 签订文件.奖惩措施为空) OR (记录表.演练频次要求 < 预案要求次数) OR (记录表.值班日期 > 7) OR (分析表.应急响应启动标志 = '否')
    OR (整改台账.整改完成状态 > 0) OR (配置清单.实际库存数量 < 预案规定物资数量*0.9)
  description: 责任状缺少可量化的巡查频率或奖惩措施，演练次数未达标（假定每年至少1次），值班记录连续超过7天无签字，火灾发生时未按预案启动应急响应，隐患整改未全部闭环，实际库存物资少于预案要求数量的90%，均判定为执行不到位。
  audit_item: 草原风险防控落实不到位
  suspicion: 草原防火责任状和应急预案执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"《草原防火条例》\",\n    \"法规文号\": \"国务院令第542号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十二条、第二十三条、第二十四条\",\n    \"内容概述\": \"县级以上人民政府应当建立草原防火值班制度，组织草原防火检查；草原火灾应急预案应当定期组织演练；草原防火物资储备应当满足预案要求。\"\n  }\n]"
- expression: (编制人数.编制人数 < 批复文件.核定编制人数*0.8) OR (编制人数.专兼职标识 < 编制人数.编制人数*0.6) OR (配置清单.数量 < 配置清单.数量*0.8) OR (配置清单.有效期（灭火器等）/配置清单.数量
    > 0.2) OR (保养记录.维护日期 < 当前日期-180天) OR (配置清单.数量 = 0) OR (名册.资质证书/名册.岗位 < 0.8) OR (使用台账.设备采购支出/使用台账.金额 < 0.5)
  description: 机构编制未达标准的80%，在岗率低于60%，设备数量低于标配的80%，灭火器等过期比例超过20%，近6个月无任何维护记录，无人机等现代化装备为零，持证上岗率不足80%，防火经费中设备采购占比低于50%，均视为配备不到位。
  audit_item: 草原风险防控落实不到位
  suspicion: 草原防火机构、队伍及设备配备不到位
  regulation: "[\n  {\n    \"法规名称\": \"《草原防火条例》\",\n    \"法规文号\": \"国务院令第542号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十三条、第十四条、第十五条\",\n    \"内容概述\": \"县级以上地方政府应根据草原防火需要建立防火组织，配备必要的防火设施、设备和人员；防火设备应定期维护，保证完好有效；防火经费应专款专用。\"\n  }\n]"
