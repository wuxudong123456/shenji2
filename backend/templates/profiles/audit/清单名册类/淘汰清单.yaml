name: audit/清单名册类/淘汰清单
type: model
description: 从清单名册类类文档（淘汰清单）中提取结构化元数据。涵盖字段如：产能、企业名称、实际关停日期、实际关停时间、实际淘汰产能、实际淘汰状态、拟淘汰设备产能、置换来源设备是否纳入淘汰计划。文档范围包括：落后产能淘汰清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 淘汰清单
  member_count: 1
  member_details:
  - 落后产能淘汰清单
output:
  fields:
  - name: 产能
    type: string
    description: 提取 产能 的文本值
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 实际关停日期
    type: date
    description: 提取 实际关停日期 的日期值，格式 YYYY-MM-DD
  - name: 实际关停时间
    type: date
    description: 提取 实际关停时间 的日期值，格式 YYYY-MM-DD
  - name: 实际淘汰产能
    type: string
    description: 提取 实际淘汰产能 的文本值
  - name: 实际淘汰状态
    type: boolean
    description: 提取 实际淘汰状态 的布尔值（是/否）
  - name: 拟淘汰设备产能
    type: string
    description: 提取 拟淘汰设备产能 的文本值
  - name: 置换来源设备是否纳入淘汰计划
    type: boolean
    description: 提取 置换来源设备是否纳入淘汰计划 的布尔值（是/否）
  - name: 计划淘汰产能
    type: string
    description: 提取 计划淘汰产能 的文本值
  - name: 计划淘汰时间
    type: date
    description: 提取 计划淘汰时间 的日期值，格式 YYYY-MM-DD
  - name: 设备名称
    type: string
    description: 提取 设备名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: （标准文件.应淘汰的设备类型 IN 标准文件.应淘汰的设备类型 AND 设备在 验收报告 或 记录表 中显示“在用”） OR （数据表.是否达标标识 = “不达标” AND 淘汰清单.实际淘汰状态 != “已关停”）
    AND 当前日期 > 淘汰清单.计划淘汰时间
  description: 当企业设备属于国家明令淘汰的落后产能但仍在生产运行，或者环保、能耗监测数据持续不达标且该设备未在规定的期限内完成淘汰，即构成违规。表达式通过设备清单与运行记录的匹配以及不达标状态与淘汰状态的矛盾来判定。
  audit_item: 未按规定落实去产能政策措施
  suspicion: 未淘汰不符合环保能耗安全标准的落后产能
  regulation: "[\n  {\n    \"法规名称\": \"产业结构调整指导目录（2019年本）\",\n    \"法规文号\": \"国家发展改革委令第29号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第一类 鼓励类、第二类 限制类、第三类 淘汰类\",\n    \"内容概述\": \"对限制类项目禁止新建，对淘汰类项目限期淘汰，明确落后生产工艺装备和产品的淘汰期限，逾期未淘汰的依法责令停产或关闭。\"\
    \n  },\n  {\n    \"法规名称\": \"国务院关于化解产能严重过剩矛盾的指导意见\",\n    \"法规文号\": \"国发〔2013〕41号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\":"
- expression: SUM(淘汰清单.实际淘汰产能) < 政策文件.目标任务量（按企业、按设备） OR （淘汰清单.实际关停日期 IS NULL AND 统计表.累计完成量 包含该设备） OR （自查报告.企业上报完成量 > 自查报告.政府核定完成量
    AND 差异率 > 10%）
  description: 通过汇总实际关停的产能与政策下达的任务量比对，若实际完成量低于目标任务量，即构成未足量完成。同时，若任务完成统计表显示某设备已关停，但淘汰清单中缺少对应的实际关停日期或关闭证明，则涉嫌虚报完成；企业自查报告与政府考核结果差异超过10%的，需重点核查是否存在虚假淘汰。
  audit_item: 未按规定落实去产能政策措施
  suspicion: 未按期足量完成去产能任务或虚假淘汰
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于钢铁行业化解过剩产能实现脱困发展的意见\",\n    \"法规文号\": \"国发〔2016〕6号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、主要任务（二）\",\n    \"内容概述\": \"各地区、各企业要严格按照目标任务和时间要求，加大化解过剩产能工作力度，确保完成去产能任务。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于做好2018年重点领域化解过剩产能工作的通知\",\n    \"法规文号\": \"发改运行〔2018〕554号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、认真组织开展化解过剩产"
- expression: （备案表.项目名称 LIKE '%技术改造%' AND 备案表.备案产能 - 验收报告.验收时实际建成产能 > 0 AND 明细表.置换比例 < 政策规定比例） OR （备案表.所属行业 IN 限制类、淘汰类生产工艺和装备条目、禁止类、限制类项目清单.限制类
    AND 备案表.备案产能 > 0）
  description: 技术改造项目原则上应不新增产能或在政策允许范围内等量置换。若技改备案产能大于原有产能且未执行产能置换或置换比例不足，即属变相扩产。同时，若项目属于产业结构调整目录限制类而违规备案新增产能，则直接触发违规。
  audit_item: 未按规定落实去产能政策措施
  suspicion: 以技改之名违规扩增落后产能
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于化解产能严重过剩矛盾的指导意见\",\n    \"法规文号\": \"国发〔2013〕41号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"三、（二）严禁建设新增产能项目\",\n    \"内容概述\": \"严禁各地备案和建设新增产能项目，确有必要新建的必须实行产能等量或减量置换。\"\n  },\n  {\n    \"法规名称\":\
    \ \"企业投资项目核准和备案管理条例\",\n    \"法规文号\": \"国务院令第673号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"\
    项目应当符合国家产业政策"
- expression: 新建产能规模、淘汰产能来源及数量、置换比例、新建项目产能、置换来源产能.置换比例 < 各行业置换比例要求（如钢铁置换范围、置换程序：各行业置换比例要求（如钢铁1:1.25）、置换范围、置换程序、各行业置换比例要求（如钢铁置换范围.各行业置换比例要求（如钢铁1:1.25）
    OR （新建产能规模、淘汰产能来源及数量、置换比例、新建项目产能、置换来源产能.置换来源产能 NOT IN 淘汰清单.置换来源设备是否纳入淘汰计划  OR 淘汰清单.实际关停时间 IS NULL） OR 置换来源企业、设备及产能.关停证明文件（拆除照片、公告等）
    IS NULL
  description: 置换比例不得低于政策规定的最低值，置换用的退出产能必须真实关停并提供有效证明。若置换比例不足，或者用于置换的产能未纳入淘汰清单、无实际关停日期、缺少关闭证明，均构成违规。
  audit_item: 未按规定落实去产能政策措施
  suspicion: 产能置换比例不达标或虚假置换
  regulation: "[\n  {\n    \"法规名称\": \"关于做好2018年重点领域化解过剩产能工作的通知\",\n    \"法规文号\": \"发改运行〔2018〕554号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"附件：产能置换实施办法\",\n    \"内容概述\": \"钢铁、水泥、平板玻璃等行业新建项目必须实施产能置换，置换比例分别为：钢铁不低于1:1.25，水泥、平板玻璃不低于1:1.5；置换产能必须真实退出，不得重复使用。\"\
    \n  }\n]"
