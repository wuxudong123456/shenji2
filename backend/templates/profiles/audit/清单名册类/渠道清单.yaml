name: audit/清单名册类/渠道清单
type: model
description: 从清单名册类类文档（渠道清单）中提取结构化元数据。涵盖字段如：渠道标识、渠道类型。文档范围包括：彩票销售渠道清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 渠道清单
  member_count: 1
  member_details:
  - 彩票销售渠道清单
output:
  fields:
  - name: 渠道标识
    type: string
    description: 提取 渠道标识 的文本值
  - name: 渠道类型
    type: string
    description: 提取 渠道类型 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (渠道清单.渠道类型 == '互联网' || 渠道清单.渠道类型 == '电话') && (证明文件.批准文件编号 == NULL || 证明文件.批准渠道 != 渠道清单.渠道标识) && 流水表.交易金额 > 0
  description: 当渠道清单中存在互联网或电话销售类型，但无法提供相应的合规性证明文件，或证明文件批准的渠道与清单渠道不一致，且对应渠道有实际资金流水时，判定为违规销售。存在流水但无批文即为可疑。
  audit_item: 彩票资金筹集审计常见违法违规问题
  suspicion: 违规开展互联网或电话销售彩票业务
  regulation: "[\n  {\n    \"法规名称\": \"彩票管理条例\",\n    \"法规文号\": \"国务院令第554号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三条、第三十八条\"\
    ,\n    \"内容概述\": \"国务院特许发行彩票。未经国务院批准，禁止擅自利用互联网销售彩票。违反规定擅自利用互联网销售彩票的，由财政部门责令改正，没收违法所得，并处罚款。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于严厉查处擅自利用互联网销售彩票的通知\",\n    \"法规文号\": \"财综〔2018〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"全文\",\n    \"内容概述"
