name: audit/清单名册类/管理目录
type: model
description: 从清单名册类类文档（管理目录）中提取结构化元数据。涵盖字段如：存档文件名、存档日期。文档范围包括：补贴档案管理目录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 管理目录
  member_count: 1
  member_details:
  - 补贴档案管理目录
output:
  fields:
  - name: 存档文件名
    type: string
    description: 提取 存档文件名 的文本值
  - name: 存档日期
    type: date
    description: 提取 存档日期 的日期值，格式 YYYY-MM-DD
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (明细表.身份证号 NOT REGEXP '^[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[0-9Xx]$') OR (明细表.身份证号
    出现重复) OR (明细表.银行账号 IS NULL OR 明细表.银行账号 = '') OR (管理目录.存档文件名 未包含 '公示文件' AND '发放明细表' AND '审批表')
  description: 身份证号不符合18位格式或出现重复，银行账号缺失，档案目录中缺少公示文件、发放表或审批表等关键存档资料，均表明数据质量和档案管理存在严重缺陷。
  audit_item: 惠农补贴发放不到位
  suspicion: 惠农补贴发放数据错误或档案缺失
  regulation: "[\n  {\n    \"法规名称\": \"《农业生产发展资金管理办法》\",\n    \"法规文号\": \"财农〔2022〕25号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十二条\",\n    \"内容概述\": \"农业农村部门应加强补贴信息档案管理，确保补贴对象、面积、金额等数据真实、完整、准确，做到资料齐全、归档及时。\"\n  }\n]"
