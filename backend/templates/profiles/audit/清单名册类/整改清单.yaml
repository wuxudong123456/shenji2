name: audit/清单名册类/整改清单
type: model
description: 从清单名册类类文档（整改清单）中提取结构化元数据。涵盖字段如：出现频次、处理情况、复查时间、已发现质量问题描述、整改回复内容、整改时限、整改状态、整改闭合确认。文档范围包括：工程质量问题整改清单、政策落实问题整改清单、施工质量问题整改清单、监督检查问题整改清单、竣工验收问题整改清单、薄弱学校改善项目验收整改清单、质量检查与验收问题整改清单、质量检测问题整改清单、露天焚烧问题整改清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 整改
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 整改清单
  member_count: 1
  member_details:
  - 工程质量问题整改清单
  - 政策落实问题整改清单
  - 施工质量问题整改清单
  - 监督检查问题整改清单
  - 竣工验收问题整改清单
  - 薄弱学校改善项目验收整改清单
  - 质量检查与验收问题整改清单
  - 质量检测问题整改清单
  - 露天焚烧问题整改清单
output:
  fields:
  - name: 出现频次
    type: string
    description: 提取 出现频次 的文本值
  - name: 处理情况
    type: string
    description: 提取 处理情况 的文本值
  - name: 复查时间
    type: date
    description: 提取 复查时间 的日期值，格式 YYYY-MM-DD
  - name: 已发现质量问题描述
    type: string
    description: 提取 已发现质量问题描述 的文本值
  - name: 整改回复内容
    type: string
    description: 提取 整改回复内容 的文本值
  - name: 整改时限
    type: string
    description: 提取 整改时限 的文本值
  - name: 整改状态
    type: boolean
    description: 提取 整改状态 的布尔值（是/否）
  - name: 整改闭合确认
    type: string
    description: 提取 整改闭合确认 的文本值
  - name: 整改闭环时间
    type: date
    description: 提取 整改闭环时间 的日期值，格式 YYYY-MM-DD
  - name: 整改问题
    type: string
    description: 提取 整改问题 的文本值
  - name: 施工单位
    type: string
    description: 提取 施工单位 的文本值
  - name: 维修责任归属
    type: string
    description: 提取 维修责任归属 的文本值
  - name: 责任单位
    type: string
    description: 提取 责任单位 的文本值
  - name: 质量问题描述
    type: string
    description: 提取 质量问题描述 的文本值
  - name: 违规焚烧点位置
    type: string
    description: 提取 违规焚烧点位置 的文本值
  - name: 逾期状态
    type: boolean
    description: 提取 逾期状态 的布尔值（是/否）
  - name: 问题列示及整改结果
    type: boolean
    description: 提取 问题列示及整改结果 的布尔值（是/否）
  - name: 问题描述
    type: string
    description: 提取 问题描述 的文本值
  - name: 问题类型
    type: string
    description: 提取 问题类型 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 检测报告.检测结论 = "不合格" || 整改清单.质量问题描述 = "结构性安全缺陷未整改闭合"
  description: 工程实体质量不满足设计文件或国家强制性标准要求，特别是地基基础和主体结构存在安全问题。表达式直接引用第三方检测报告的不合格结论，或验收遗留问题中存在涉及结构安全的未整改项。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 工程质量低劣存在安全隐患
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十八条、第六十四条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得偷工减料；违反本条例规定，施工单位在施工中偷工减料的，使用不合格的建筑材料、建筑构配件和设备的，责令改正，处工程合同价款2%以上4%以下的罚款。\"\
    \n  }\n]"
- expression: 监测报告.PM2.5 > 500 μg/m³ && 图.异常高温点坐标 IN (运处台账.清运村庄) || 整改清单.违规焚烧点位置 >= 2
  description: PM2.5极高且对应区域存在热源异常点，或台账记录显示垃圾长期未清运区域同时出现热源点，判定为疑似焚烧；同一地点重复出现焚烧记录视为屡禁不止。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 露天焚烧农村生活垃圾
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十九条\",\n    \"内容概述\": \"禁止随意倾倒、抛撒、堆放或者焚烧生活垃圾。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国大气污染防治法\",\n    \"法规文号\": \"\
    2018年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第八十二条\",\n    \"内容概述\": \"禁止在人口集中地区和其他依法需要特殊保护的区域内焚烧沥青、油毡、橡胶、塑料、皮革、垃圾以及其他产生有"
- expression: (关键尺寸偏差 > 5%) || (整改清单.出现频次 > 3) || (基础夯实检测 = '' && 发生塌陷)
  description: 验收实测尺寸与图纸偏差超5%、同一施工队反复出现质量问题、或无故缺失基础夯实记录且后期塌陷，均视为施工不规范疑点。
  audit_item: 厕所改造实施不规范、质量不达标
  suspicion: 厕所安装施工不规范
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十八条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。\"\n  }\n]"
- expression: ABS(实际检测数值（如混凝土厚度强度）.实际检测数值（如混凝土厚度强度） - 投标文件.合同技术条款要求的设计指标) / 投标文件.合同技术条款要求的设计指标 > 15%
  description: 对于影响结构安全或功能实现的关键质量指标，如混凝土厚度、强度、渠道防渗系数等，将第三方或审计现场抽检的实际数值与施工合同中规定的技术指标进行比对，偏差率绝对值超过15%即判定为质量不达标，属于严重偷工减料。
  audit_item: 大中型灌区规划、建设不符合相关规定
  suspicion: 工程建设关键指标偷工减料
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十八条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。\"\n  }\n]"
- expression: (明细表.实际到位金额/预算文件.预算金额 < 0.8) || (拨付延迟天数 > 90) || (挪用金额 > 0) || (ABS(对比表.实际完成值-对比表.绩效目标值)/对比表.绩效目标值 > 0.3)
  description: 财政资金实际到位率低于预算的80%，或资金拨付周期（从预算下达至到账）超过90天，或支出明细与预算项目不匹配存在挪用，或主要绩效指标偏差率超过30%，以上任一条件触发即判定财政扶持政策未落实，资金使用合规性或效果存在突出问题。
  audit_item: 现代农业产业园（集群、强镇）政策扶持不到位
  suspicion: 现代农业产业园财政扶持资金未足额落实
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\"\
    ,\n    \"内容概述\": \"各级政府财政部门应当依照法律、行政法规和国务院财政部门的规定，及时、足额地拨付预算支出资金，加强对预算支出的管理和监督。\"\n  },\n  {\n    \"法规名称\": \"中央财政衔接推进乡村振兴补助资金管理办法\"\
    ,\n    \"法规文号\": \"财农〔2021〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"各地不得擅自扩大资金使用范围，"
- expression: (处罚金额、执行情况、处罚事由、当事人、文书编号.处罚事由 包含 '阻挠' 或 '拒绝配合' 或 '伪造证据') && (问题描述、整改时限、逾期状态、整改回复内容.逾期状态 == '是' && 问题描述、整改时限、逾期状态、整改回复内容.整改回复内容
    包含 '已整改' 但 实际核查 为 '未整改') && (线索编号、涉案主体、涉及土方量、移送时间、线索移送时间、接收单位、处理反馈.处理反馈 为 '签收未处理' 或 '退回')
  description: 以处罚决定书记录的阻挠执法、伪造证据行为直接判定;同时将整改清单中逾期未整改但回复已整改的作为虚假整改阻碍监督;移送线索长期未处理反馈的视为消极阻碍。以上条件满足任一即可触发。
  audit_item: 破坏或未有效利用黑土地
  suspicion: 拒绝、阻碍黑土地保护监督检查
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"任何单位和个人不得拒绝、阻碍对黑土地保护情况依法进行的监督检查。\"\n  }\n]"
- expression: (合同.保修期限字段缺失 || 合同.保修期限 < 2) || (合同.质量保证金比例字段缺失 || 合同.质量保证金比例 < 0.05)
  description: 保修期少于2年或未约定保修期，质量保证金比例低于百分之5或未约定，均构成违规。保修期最低2年与5%比例依据交通运输部令2015年第11号。
  audit_item: 项目建设管理不符合相关规定
  suspicion: 农村公路建设未设定保修期限和质量保证金
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2015年第11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十四条\",\n    \"内容概述\": \"农村公路建设项目应当设定保修期限和质量保证金，保修期限不得少于2年，质量保证金比例不得低于工程结算总额的5%。\"\n  }\n]"
- expression: (台账上报合格率 - 监理或审计复验合格率) > 0.15
  description: 当验收台账记录的上报合格率与第三方监理报告或审计组现场复验得出的合格率之差大于15个百分点时，即表明验收流于形式或数据造假。若复验合格率低于60%，则存在严重质量隐患。
  audit_item: 黑土地保护治理相关任务未完成或完成质量不高
  suspicion: 保护性耕作验收合格率虚高
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"项目竣工验收应对照入库的面积和建设标准，严格核查工程质量，对不合格工程不得通过验收，并追究相关责任。\"\n  }\n]"
- expression: (工程质量问题整改清单.条数 > 0 && 整改状态 IN ["未整改", "逾期未整改"]) || (现场抽查检测各项主要指标不符合设计图纸.质量要求数量 > 0)
  description: 当监理报告或审计抽查发现工程质量问题，且截至审计日相关整改仍未完成或闭环，或者审计现场抽查发现石笼坍塌、植被未存活等实况与设计要求严重不符时，认定为质量不达标。若整改闭环率低于60%或关键结构损毁比例超过30%，则为严重质量事故。
  audit_item: 黑土地保护治理相关任务未完成或完成质量不高
  suspicion: 已完工侵蚀沟治理工程质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十八条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。\"\n  }\n]"
