name: audit/清单名册类/移交清单
type: model
description: 从清单名册类类文档（移交清单）中提取结构化元数据。涵盖字段如：移交日期、竣工日期、项目名称。文档范围包括：管护单位移交清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 移交清单
  member_count: 1
  member_details:
  - 管护单位移交清单
output:
  fields:
  - name: 移交日期
    type: date
    description: 提取 移交日期 的日期值，格式 YYYY-MM-DD
  - name: 竣工日期
    type: date
    description: 提取 竣工日期 的日期值，格式 YYYY-MM-DD
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (竣工验收日期.移交协议签署日期 - 竣工验收日期.竣工验收日期) > 30 || 移交协议缺失 || 资质等级.管护单位资质等级 < 项目要求资质等级
  description: 按照规定农村公路竣工验收后30日内必须完成移交。若间隔天数超过30天、移交协议未签署或管护单位不具备相应养护资质，均构成移交程序违规，造成管护责任悬空。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 农村公路建成后未及时移交管护单位
  regulation: "[\n  {\n    \"法规名称\": \"农村公路养护管理办法\",\n    \"法规文号\": \"交通运输部令2015年第22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"农村公路建设项目竣工验收后，应及时移交养护管理单位，办理交接手续，明确管护责任。\"\n  }\n]"
- expression: 移交清单.延迟天数 > 30 或 竣工验收日期.移交协议签署日期 IS NULL
  description: 依据规定，农村公路竣工验收后30日内应移交管护单位。延迟天数超过30天或未签署移交协议，即构成未按时移交。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 农村公路建成后未及时移交管护单位
  regulation: "[\n  {\n    \"法规名称\": \"农村公路养护管理办法\",\n    \"法规文号\": \"交通运输部令2020年第12号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"农村公路建设项目竣工验收后，应当按照有关规定及时移交管养。\"\n  }\n]"
