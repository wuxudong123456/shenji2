name: audit/清单名册类/人员清单
type: model
description: 从清单名册类类文档（人员清单）中提取结构化元数据。涵盖字段如：姓名、最后在职日期、状态、离职日期、身份证号、退休日期。文档范围包括：人力资源系统在职人员清单、人力资源系统离职人员清单、人力资源系统退休人员清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 人员清单
  member_count: 1
  member_details:
  - 人力资源系统在职人员清单
  - 人力资源系统离职人员清单
  - 人力资源系统退休人员清单
output:
  fields:
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 最后在职日期
    type: date
    description: 提取 最后在职日期 的日期值，格式 YYYY-MM-DD
  - name: 状态
    type: boolean
    description: 提取 状态 的布尔值（是/否）
  - name: 离职日期
    type: date
    description: 提取 离职日期 的日期值，格式 YYYY-MM-DD
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 退休日期
    type: date
    description: 提取 退休日期 的日期值，格式 YYYY-MM-DD
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 备注
    type: string
    description: 清单条目的备注信息
    required: false
violations:
- expression: (住房公积金缴存明细表.缴存状态 = '正常') && (人力资源系统在职人员清单.状态 = '退休') && (DATEDIFF(DAY, 人力资源系统在职人员清单.退休日期, CURRENT_DATE) > 365)
  description: 违规判定规则：退休超12个月但公积金账户仍为正常缴存状态，未办理封存或销户提取。触发器为退休日期与当前日期差超过365天，阈值可依据内部制度调整，如地方政策规定30日内办理，审计中常以超12个月作为严重违规信号。
  audit_item: 住房公积金账户未及时清理
  suspicion: 退休人员住房公积金账户未及时清理
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条、第二十四条\",\n    \"内容概述\": \"第十五条：单位与职工终止劳动关系的，应当自劳动关系终止之日起30日内向住房公积金管理中心办理变更登记，并办理职工住房公积金账户转移或者封存手续。第二十四条：职工离休、退休的，可以提取职工住房公积金账户内的存储余额，单位应予以协助。\"\
    \n  }\n]"
- expression: (人力资源系统在职人员清单.状态 = '离职' || 员工离职交接清单.解除劳动关系日期 IS NOT NULL) && (住房公积金缴存明细表.缴存状态 = '正常') && (DATEDIFF(DAY, COALESCE(人力资源系统在职人员清单.离职日期,
    员工离职交接清单.解除劳动关系日期), CURRENT_DATE) > 30)
  description: 判定规则：员工已离职且劳动关系终止超过30天，但公积金缴存状态仍为“正常”，未按《住房公积金管理条例》要求及时封存。表达式使用COALESCE取最早可得的离职日期，超过30日即触发违规，严重者往往超过90天甚至多年。
  audit_item: 住房公积金账户未及时清理
  suspicion: 离职人员住房公积金账户未及时清理
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条\",\n    \"内容概述\": \"单位与职工终止劳动关系的，应当自劳动关系终止之日起30日内向住房公积金管理中心办理变更登记，并办理职工住房公积金账户转移或者封存手续。\"\n  }\n]"
