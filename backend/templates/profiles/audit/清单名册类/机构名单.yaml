name: audit/清单名册类/机构名单
type: model
description: 从清单名册类类文档（机构名单）中提取结构化元数据。涵盖字段如：医保定点标志、机构名称。文档范围包括：医保定点医疗机构名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 机构名单
  member_count: 1
  member_details:
  - 医保定点医疗机构名单
output:
  fields:
  - name: 医保定点标志
    type: boolean
    description: 提取 医保定点标志 的布尔值（是/否）
  - name: 机构名称
    type: string
    description: 提取 机构名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 机构名单.医保定点标志 = '否' && 许可证.执业许可证状态 = '有效' && INSTR(准入条件、审批时限、必备科室目录.必备科室目录, 许可证.科室设置) > 0
  description: 筛选出执业许可证有效、科室设置符合定点政策要求的乡村医疗机构，但未在医保定点名单中（定点标志为否），即构成疑点。存在任意符合条件的机构即触发。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不合规
  suspicion: 符合规定的乡村医疗机构未纳入医保定点管理
  regulation: "[\n  {\n    \"法规名称\": \"医疗机构医疗保障定点管理暂行办法\",\n    \"法规文号\": \"国家医保局令第2号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条\",\n    \"内容概述\": \"符合条件的医疗机构可提出定点申请，经办机构应及时受理并组织评估，评估通过后应纳入定点管理并签订服务协议。\"\n  }\n]"
