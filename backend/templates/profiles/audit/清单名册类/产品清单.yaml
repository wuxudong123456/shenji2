name: audit/清单名册类/产品清单
type: model
description: 从清单名册类类文档（产品清单）中提取结构化元数据。涵盖字段如：产品名称、保险品类名称、处理情况、实测厚度、承保条件、生产企业。文档范围包括：保险机构农业保险产品清单、农膜质量抽检不合格产品清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 产品清单
  member_count: 1
  member_details:
  - 保险机构农业保险产品清单
  - 农膜质量抽检不合格产品清单
output:
  fields:
  - name: 产品名称
    type: string
    description: 提取 产品名称 的文本值
  - name: 保险品类名称
    type: string
    description: 提取 保险品类名称 的文本值
  - name: 处理情况
    type: string
    description: 提取 处理情况 的文本值
  - name: 实测厚度
    type: string
    description: 提取 实测厚度 的文本值
  - name: 承保条件
    type: string
    description: 提取 承保条件 的文本值
  - name: 生产企业
    type: string
    description: 提取 生产企业 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 中央及地方农业保险险种目录.应开展险种名称 NOT IN (保险机构农业保险产品清单.保险品类名称)
  description: 政策要求必须开展的农业保险险种未出现在保险机构实际推出的产品清单中，即构成保险品类缺失疑点。
  audit_item: 农业保险保费补贴政策落实不到位
  suspicion: 部分农业保险品类未按规定开展
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第七条\"\
    ,\n    \"内容概述\": \"保险机构应当根据农业保险业务特性，开发适合农业生产经营者需求的保险产品。\"\n  },\n  {\n    \"法规名称\": \"中央财政农业保险保险费补贴管理办法\",\n    \"法规文号\"\
    : \"财金〔2021〕94号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"地方财政部门应当会同农业农村等有关部门，根据本地区农业产业发展需要，鼓励开"
- expression: (检测报告.实测厚度 < 0.010mm) || (销售台账.标注厚度 < 0.010mm) || (抽检记录.实测厚度 < 0.010mm) || (产品清单.实测厚度 < 0.010mm) && (产品类别 ==
    '农用薄膜')
  description: 依据国家标准，农用薄膜厚度不得小于0.010mm。若质检报告、台账标注厚度、市场监管抽检实测厚度任一小于0.010mm，即判定违规。同时可进一步比对标注厚度与实测厚度，若标注≥0.010mm而实测<0.010mm，则为虚假标注，属于严重违规。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 生产销售厚度小于0.010mm的农膜
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"农用薄膜生产者应当执行农用薄膜相关标准，确保产品质量合格。禁止生产、销售、使用国家明令禁止或者不符合强制性国家标准的农用薄膜。\"\n\
    \  },\n  {\n    \"法规名称\": \"聚乙烯吹塑农用地面覆盖薄膜\",\n    \"法规文号\": \"GB 13735-2017\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\":\
    \ \"4.4 "
