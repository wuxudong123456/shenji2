name: audit/清单名册类/结算目录
type: model
description: 从清单名册类类文档（结算目录）中提取结构化元数据。涵盖字段如：支出项目、结算起点金额。文档范围包括：公务卡强制结算目录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 结算目录
  member_count: 1
  member_details:
  - 公务卡强制结算目录
output:
  fields:
  - name: 支出项目
    type: number
    description: 提取 支出项目 的数值（含单位，如万元、吨等）
  - name: 结算起点金额
    type: number
    description: 提取 结算起点金额 的数值（含单位，如万元、吨等）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 报销凭证.支付方式 = '现金' && 报销凭证.报销金额 >= 公务卡强制结算目录.结算起点金额 && 报销凭证.附件完整性 NOT CONTAIN '特殊事项审批单'
  description: 依据当地公务卡强制结算目录，单笔支出达到起点金额（通常500元或1000元）必须使用公务卡，以现金支付且无经批准的例外说明，即认定为违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务接待费用未使用公务卡结算
  regulation: "[\n  {\n    \"法规名称\": \"关于实施中央预算单位公务卡强制结算目录的通知\",\n    \"法规文号\": \"财库〔2011〕160号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"一、二\",\n    \"内容概述\": \"中央预算单位财政授权支付业务中原使用现金结算的公务支出，应按规定使用公务卡结算；凡目录规定的公务支出项目，应使用公务卡结算，原则上不再使用现金。\"\n\
    \  }\n]"
