name: audit/清单名册类/资金清单
type: model
description: 从清单名册类类文档（资金清单）中提取结构化元数据。涵盖字段如：余额、因延迟批复导致的结转资金标记、未发放原因、未发放起始年月、资金来源、资金来源类别、资金科目、资金金额。文档范围包括：实际编入决算的资金清单、跨年度预算结转结余资金清单、长期未发放资金清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 资金清单
  member_count: 1
  member_details:
  - 实际编入决算的资金清单
  - 跨年度预算结转结余资金清单
  - 长期未发放资金清单
output:
  fields:
  - name: 余额
    type: number
    description: 提取 余额 的数值（含单位，如万元、吨等）
  - name: 因延迟批复导致的结转资金标记
    type: string
    description: 提取 因延迟批复导致的结转资金标记 的文本值
  - name: 未发放原因
    type: string
    description: 提取 未发放原因 的文本值
  - name: 未发放起始年月
    type: date
    description: 提取 未发放起始年月 的日期值，格式 YYYY-MM-DD
  - name: 资金来源
    type: string
    description: 提取 资金来源 的文本值
  - name: 资金来源类别
    type: string
    description: 提取 资金来源类别 的文本值
  - name: 资金科目
    type: string
    description: 提取 资金科目 的文本值
  - name: 资金金额
    type: number
    description: 提取 资金金额 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目编码
    type: string
    description: 提取 项目编码 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (单位清单.单位编码 NOT IN 单位清单.单位编码) || (说明文件.项目编码 NOT IN 资金清单.项目编码)
  description: 将应编入的单位清单与实际编入的单位清单按单位编码（或统一社会信用代码）进行比对，若存在应编入单位未出现在实际编入清单中，判定为遗漏单位；同理，应编入的资金项目（如专项资金）未出现在实际编入资金清单中，判定为遗漏资金。两者满足任一条件即触发疑点。
  audit_item: 决算报告编报事项不准确
  suspicion: 应纳入决算编报范围的单位或资金遗漏未编入
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"各部门应当按照财政部门的要求，及时向预算单位布置决算编制工作，并督促其准确编制决算。各部门应当将本部门所属各单位全部纳入决算编制范围，认真审核汇总本部门决算，确保数据完整、真实、准确。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第"
- expression: (单位编码、单位名称、单位状态.单位编码 NOT IN 单位编码、单位名称、单位状态.单位编码 AND 单位编码、单位名称、单位状态.单位状态 = '存续') || (项目编码、项目名称、金额、资金来源、资金来源类别.资金来源类别
    NOT IN ('一般公共预算拨款','政府性基金预算拨款','国有资本经营预算拨款'))
  description: 排查两种违规情形：一是单位不在应编报目录中但仍被编入决算（如已撤销单位、非预算单位），用实际单位清单与应编单位清单差集判定，同时排除因机构合并而消失的正常单位；二是将非财政预算资金（如代管社会团体资金、往来款）作为决算资金编报，通过资金来源类别字段识别，只要来源不属于三类法定预算资金即判定为违规编入。
  audit_item: 决算报告编报事项不准确
  suspicion: 将非编报范围单位或资金违规纳入决算编报
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"各部门应当将本部门所属各单位全部纳入决算编制范围，认真审核汇总本部门决算，确保数据完整、真实、准确，不得多报、少报、漏报。\"\n  },\n  {\n    \"法规名称\"\
    : \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十五条\",\n    \"内容概述\": \"\
    编制决算草案，必须符合"
- expression: ${规定时限、实际批复时间.实际批复时间} > ${规定的截止日期.规定的截止日期}
  description: 当对所属单位预算的实际批复日期晚于法规或上级部门明文规定的最晚批复日期时，触发违规判定。规定时限通常为人大批准预算后20日内向本级部门批复，部门在接到批复后15日内向所属单位批复。实际批复时间取批复文件日期或签收记录中的较晚者，任何超期均视为违规。
  audit_item: 违规批复预算
  suspicion: 未按规定时限批复所属单位预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第五十二条\",\n    \"内容概述\": \"各级预算经本级人民代表大会批准后，本级政府财政部门应当在二十日内向本级各部门批复预算。各部门应当在接到本级政府财政部门批复的本部门预算后十五日内向所属各单位批复预算。\"\
    \n  }\n]"
- expression: (当前日期-资金清单.未发放起始年月>730天) && (监测表.沉淀原因分类!=true) && (流程文件.审批结果==null)
  description: 资金连续未发放时间超过730天（2年），且未按规定程序进行清理收回或重新安排使用，即构成资金闲置违规。2年红线依据国办发〔2014〕70号文规定，凡结转资金超2年一律收回财政统筹。若同时产息未上缴，应另案处理。
  audit_item: 惠农财政补贴资金滞留、闲置
  suspicion: 补贴资金闲置超过2年未清理
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步做好盘活财政存量资金工作的通知\",\n    \"法规文号\": \"国办发〔2014〕70号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各部门、各单位要加大结余结转资金统筹使用力度，对结余资金和连续两年未用完的结转资金，一律收回财政统筹使用。\"\n  },\n  {\n    \"法规名称\"\
    : \"惠农财政补贴资金管理办法及实施细则\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第X章关于存量清理的条款\",\n    \"内容概述\"\
    : "
