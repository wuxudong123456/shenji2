name: audit/清单名册类/决策清单
type: model
description: 从清单名册类类文档（决策清单）中提取结构化元数据。涵盖字段如：事项名称、是否经董事会全体审议。文档范围包括：董事会决策清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 决策清单
  member_count: 1
  member_details:
  - 董事会决策清单
output:
  fields:
  - name: 事项名称
    type: string
    description: 提取 事项名称 的文本值
  - name: 是否经董事会全体审议
    type: boolean
    description: 提取 是否经董事会全体审议 的布尔值（是/否）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: （决策清单.事项名称 IN ('重大投资','重大资产处置','重要人事任免')） || （决策清单.决策金额 > 公司组织形态.金额阈值）
  description: 常务委员会决策的事项属于公司经营战略、重大投资或者金额超过董事会授权上限，即构成越权替代。无授权限额但事实承担大部分重大决策的，视为架空董事会。
  audit_item: 完善中国特色现代企业制度方面存在的问题
  suspicion: 设置常务委员会等替代董事会决策重大事项
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"中华人民共和国主席令第十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"董事会对股东会负责，行使决定公司的经营计划和投资方案等职权，董事会职权不得非法授权董事会常设机构代为行使。\"\n  },\n  {\n    \"法规名称\": \"国务院办公厅关于进一步完善国有企业法人治理结构的指导意见\"\
    ,\n    \"法规文号\": \"国办发〔2017〕36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二（三）\",\n    \"内容概述\": "
