name: audit/清单名册类/明细清单
type: model
description: 从清单名册类类文档（明细清单）中提取结构化元数据。涵盖字段如：费用项目名称、金额。文档范围包括：会议费报销明细清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 明细清单
  member_count: 1
  member_details:
  - 会议费报销明细清单
output:
  fields:
  - name: 费用项目名称
    type: number
    description: 提取 费用项目名称 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (发票.货物或应税劳务名称 包含 '礼品'||'纪念品'||'烟酒'||'旅游'||'景点' || 'KTV') || (会议费报销明细清单.费用项目名称 包含 '参观费'||'门票费')
  description: 若在会议费报销发票或明细清单中出现礼品、纪念品、烟酒、旅游景点门票等与会议业务无关的消费项目，直接判定为违规。会议费只允许列支住宿、伙食、会议室租金、文件印刷、交通等必要开支。
  audit_item: 会议费审计
  suspicion: 会议费中夹带与会议无关的费用
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条、第十六条\",\n    \"内容概述\": \"会议费开支范围包括会议住宿费、伙食费、会议室租金、交通费、文件印刷费等，不得列支与会议无关的其他费用，严禁以任何名义发放纪念品。\"\n  }\n]"
