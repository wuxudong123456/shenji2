name: audit/清单名册类/关系名单
type: model
description: 从清单名册类类文档（关系名单）中提取结构化元数据。涵盖字段如：与领导人员关系、关联方名称。文档范围包括：关联方关系名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 人员
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 关系名单
  member_count: 1
  member_details:
  - 关联方关系名单
output:
  fields:
  - name: 与领导人员关系
    type: string
    description: 提取 与领导人员关系 的文本值
  - name: 关联方名称
    type: string
    description: 提取 关联方名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (ABS(分析表.实际成交价格 - 评估报告.评估价值) / 评估报告.评估价值 > 0.2) AND (交易合同.对方单位 IN 关系名单) AND (交易类型 = ‘领导人员卖出’ OR 交易类型 = ‘领导人员买入’)
  description: 企业领导人员与特定关系人交易的资产价格偏离评估价值或市场均价超过20%，即为异常。卖出价格明显低于评估价值（<0.8倍），或买入价格明显高于评估价值（>1.2倍）均触发。特定关系人包括亲属、特定关联方。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 向特定关系人低价出售或高价购买资产
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（三）项\",\n    \"内容概述\": \"不得以明显低于市场的价格向请托人购买或者以明显高于市场的价格向请托人出售房屋、汽车等物品，或者以其他交易形式非法收受请托人财物。\"\n  }\n]"
