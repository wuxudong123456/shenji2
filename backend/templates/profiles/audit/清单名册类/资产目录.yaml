name: audit/清单名册类/资产目录
type: model
description: 从清单名册类类文档（资产目录）中提取结构化元数据。涵盖字段如：禁止抵押资产清单。文档范围包括：禁止抵押资产目录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 资产
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 资产目录
  member_count: 1
  member_details:
  - 禁止抵押资产目录
output:
  fields:
  - name: 禁止抵押资产清单
    type: string
    description: 提取 禁止抵押资产清单 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (抵押物名称 IN (禁止抵押资产清单.禁止抵押资产清单)) || (资产来源（划拨/自有/公益） == '划拨' && 批复文件.批复允许无偿使用的说明文件 == null) || (资产性质说明文件.用途 ==
    '公益设施' && 抵押物名称 != null)
  description: 判定逻辑：1. 将明令禁止抵押的资产（如公益设施、文物、被监管资产）进行了抵押登记；2. 将划拨用地及其附着物未经有权机关批准进行抵押；3. 教育、医疗等公益设施有抵押记录。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规使用禁止抵押国有资产抵押
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"中华人民共和国主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三百九十九条\",\n    \"内容概述\": \"下列财产不得抵押：学校、幼儿园、医院等以公益为目的成立的非营利法人的教育设施、医疗卫生设施和其他公益设施。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国城市房地产管理法\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第七十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十一条\",\n    \"内容概述\": \"设定房地产抵押"
