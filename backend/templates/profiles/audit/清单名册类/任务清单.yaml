name: audit/清单名册类/任务清单
type: model
description: 从清单名册类类文档（任务清单）中提取结构化元数据。涵盖字段如：任务清单编号、允许支持项目类别、同步下达的强制性要求条款、约束性任务列表、约束性任务清单、项目名称、项目编码。文档范围包括：中央财政涉农专项资金任务清单、任务清单、农机购置补贴专项任务清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 任务清单
  member_count: 1
  member_details:
  - 中央财政涉农专项资金任务清单
  - 任务清单
  - 农机购置补贴专项任务清单
output:
  fields:
  - name: 任务清单编号
    type: string
    description: 提取 任务清单编号 的文本值
  - name: 允许支持项目类别
    type: string
    description: 提取 允许支持项目类别 的文本值
  - name: 同步下达的强制性要求条款
    type: number
    description: 提取 同步下达的强制性要求条款 的数值（含单位，如万元、吨等）
  - name: 约束性任务列表
    type: string
    description: 提取 约束性任务列表 的文本值
  - name: 约束性任务清单
    type: string
    description: 提取 约束性任务清单 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目编码
    type: string
    description: 提取 项目编码 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (任务清单编号 IS NULL) || (绩效目标编号 IS NULL)
  description: 检查关联对照表中，每一笔投资计划文号是否均有非空的任务清单文号和绩效目标编号，任一缺失即表示计划中未同步包含任务清单或绩效目标，构成违规。
  audit_item: 投资计划分解下达不合规
  suspicion: 投资计划未与任务清单及绩效目标同步下达
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第二点（三）\",\n    \"内容概述\": \"将绩效目标设置作为预算安排的前置条件，加强绩效目标审核，绩效目标应与预算同步批复下达。\"\n  }\n]"
- expression: 明细表.支出用途 NOT IN (任务清单.允许支持项目类别) || 明细表.支出用途 IN (任务清单.约束性任务列表) && 明细表.金额>0
  description: 中央财政涉农专项资金实行‘大专项+任务清单’管理，资金必须严格按照任务清单安排使用，严禁投向负面清单项目（如楼堂馆所、旅游设施、景观大道等）。出现一笔用途不在任务清单或属于负面清单的支出即触发违规。
  audit_item: 涉农资金统筹整合不规范
  suspicion: 中央涉农专项资金违规投向任务清单范围外项目
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2022〕36号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条、第十二条\",\n    \"内容概述\": \"资金实行任务清单管理，约束性任务不得调整，禁止用于修建楼堂馆所、景观雕塑等无关支出。\"\n  }\n]"
- expression: (投资计划下达正式文件.任务清单编号 is NULL || 投资计划下达正式文件.绩效目标编号 is NULL) || (任务清单与绩效目标匹配表.投资计划文号 is NULL)
  description: 检查投资计划下达文件中是否缺失任务清单编号或绩效目标编号，或者匹配表中无对应投资计划文号记录。任意条件满足，则判定为未同步下达，高风险。
  audit_item: 项目计划分解下达不合规
  suspicion: 投资计划未与任务清单及绩效目标同步下达
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十六条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当和本级预算相衔接。项目单位应当编制项目预算，明确项目绩效目标。\"\n  },\n  {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\"\
    : \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"预算绩效目标应与部门预算同步申报、同步审核、同步批复下达。\"\n\
    \  }"
