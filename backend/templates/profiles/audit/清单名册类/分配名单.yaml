name: audit/清单名册类/分配名单
type: model
description: 从清单名册类类文档（分配名单）中提取结构化元数据。涵盖字段如：分配对象、分配房源编号、分配日期、房屋坐落、承租人身份证号。文档范围包括：公共租赁住房分配名单、公租房分配名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 分配名单
  member_count: 1
  member_details:
  - 公共租赁住房分配名单
  - 公租房分配名单
output:
  fields:
  - name: 分配对象
    type: string
    description: 提取 分配对象 的文本值
  - name: 分配房源编号
    type: string
    description: 提取 分配房源编号 的文本值
  - name: 分配日期
    type: date
    description: 提取 分配日期 的日期值，格式 YYYY-MM-DD
  - name: 房屋坐落
    type: string
    description: 提取 房屋坐落 的文本值
  - name: 承租人身份证号
    type: string
    description: 提取 承租人身份证号 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (信息.户籍所在地 != 本地 && 缴纳记录.累计缴纳月数 < 政策文件.对外来务工人员户籍、居住或社保缴纳年限要求) && (分配名单.承租人身份证号 对应存在分配记录)
  description: 非本地户籍申请人的社保累计缴纳月数未达到政策规定的最低年限，却已获得公租房分配，即构成违规。同时检查居住证连续居住时间是否达标。
  audit_item: 向不符合条件的人员发放保障待遇
  suspicion: 不符合户籍或居住年限违规享受公租房保障
  regulation: "[\n  {\n    \"法规名称\": \"《公共租赁住房管理办法》\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条、第九条\",\n    \"内容概述\": \"申请公共租赁住房，应当符合以下条件：在本地无住房或者住房面积低于规定标准；收入、财产低于规定标准；申请人为外来务工人员的，在本地稳定就业达到规定年限。\"\n \
    \ }\n]"
