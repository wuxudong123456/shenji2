name: audit/清单名册类/备案清单
type: model
description: 从清单名册类类文档（备案清单）中提取结构化元数据。涵盖字段如：企业名称、处置地点、备案日期、备案编号、安全保护等级、废物种类、服务类型、核准处置能力。文档范围包括：信息系统等级保护定级备案清单、农业部门备案清单、工业废物处置单位备案清单、船舶登记管理部门备案清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 安全
- 登记
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 备案清单
  member_count: 1
  member_details:
  - 信息系统等级保护定级备案清单
  - 农业部门备案清单
  - 工业废物处置单位备案清单
  - 船舶登记管理部门备案清单
output:
  fields:
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 处置地点
    type: string
    description: 提取 处置地点 的文本值
  - name: 备案日期
    type: date
    description: 提取 备案日期 的日期值，格式 YYYY-MM-DD
  - name: 备案编号
    type: string
    description: 提取 备案编号 的文本值
  - name: 安全保护等级
    type: string
    description: 提取 安全保护等级 的文本值
  - name: 废物种类
    type: string
    description: 提取 废物种类 的文本值
  - name: 服务类型
    type: string
    description: 提取 服务类型 的文本值
  - name: 核准处置能力
    type: string
    description: 提取 核准处置能力 的文本值
  - name: 登记号
    type: string
    description: 提取 登记号 的文本值
  - name: 系统名称
    type: string
    description: 提取 系统名称 的文本值
  - name: 系统状态
    type: boolean
    description: 提取 系统状态 的布尔值（是/否）
  - name: 船名
    type: string
    description: 提取 船名 的文本值
  - name: 船籍港
    type: string
    description: 提取 船籍港 的文本值
  - name: 船舶所有人
    type: string
    description: 提取 船舶所有人 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ( COUNT(定级报告.系统名称)=0 ) OR ( COUNT(测评报告.系统名称)=0 ) OR ( 测评报告.高风险漏洞数量 - 测评报告.高风险漏洞已整改数量 > 0 )
  description: 1. 缺失定级报告或测评报告直接判定违规；2. 存在测评报告但高风险漏洞未全部整改（差值>0）视同未有效通过测评；3. 系统状态为‘运行中’的均应纳入排查范围，以上条件满足任一即触发疑点。
  audit_item: 网络安全建设方面存在的问题
  suspicion: 信息系统未进行等级保护定级或测评
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国网络安全法\",\n    \"法规文号\": \"主席令第53号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十一条\",\n    \"内容概述\": \"国家实行网络安全等级保护制度。网络运营者应当按照网络安全等级保护制度的要求，履行安全保护义务，保障网络免受干扰、破坏或者未经授权的访问，防止网络数据泄露或者被窃取、篡改。\"\n  },\n\
    \  {\n    \"法规名称\": \"信息安全等级保护管理办法\",\n    \"法规文号\": \"公通字[2007]43号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条、第十六"
- expression: (农业部门备案清单.服务类型 IN 国家和地方农业社会化服务增值税免征政策文件.免税服务范围) AND (农业企业享受政策资格认定文件.认定结果 = '符合') AND (农业企业增值税申报表.免税销售额 = 0 OR
    农业企业增值税申报表.应纳税额 > 0)
  description: 表达式筛选出已在农业部门备案且资格认定符合免税条件，但在税务申报表中未填报免税销售额或仍缴纳了增值税的企业。当免税销售额为零且应纳税额大于零时，触发疑点，表明企业虽符合免税条件却未能享受免征政策。
  audit_item: 农业社会化服务政策扶持不到位
  suspicion: 农业社会化服务企业增值税免税政策未落实
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国增值税暂行条例\",\n    \"法规文号\": \"国务院令第691号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条第一款\",\n    \"内容概述\": \"农业生产者销售的自产农产品免征增值税。\"\n  },\n  {\n    \"法规名称\": \"财政部 国家税务总局关于全面推开营业税改征增值税试点的通知\",\n \
    \   \"法规文号\": \"财税〔2016〕36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"附件3第一条第（十）项\",\n    \"内容概述\": \"农业机耕、排灌、病虫害防治、植物保护、农牧保险"
- expression: (GPS轨迹.停留点坐标位于农村非工业区 && 与环境监测报告.超标点位100米内) || (转移联单.接收单位 NOT IN 备案清单.企业名称) || (交接登记表.废物类别='一般工业固废/危险废物' && 接收地点无环评批复)
  description: 运输车辆GPS在非工业区异常停留且与污染超标点吻合，或转移接收单位无相应备案资质，或在无环评批复的农村地点接收工业固废，即判定为非法倾倒嫌疑。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 在农村地区非法倾倒工业固体废物
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"产生工业固体废物的单位应当采取防止或者减少固体废物污染环境的措施，禁止擅自倾倒、堆放、丢弃、遗撒固体废物。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\"\
    ,\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第八十二条\",\n    \"内容概述\": \"转移危险废物的，必须按照国家"
- expression: (统计表.船号 NOT IN (SELECT 登记号 FROM 备案清单)) OR (记录表.船舶标识 NOT IN (SELECT 登记号 FROM 备案清单) AND 记录表.活动区域 = '禁渔区') OR ((SELECT
    COUNT(*) FROM 统计表 WHERE 船号 NOT IN (SELECT 登记号 FROM 备案清单)) / COUNT(统计表.船号) > 0.15)
  description: 1. 任一在查扣记录或禁渔区夜间监控中出现的船只，若无法在船舶登记清单中找到对应登记号，即构成‘三无’船只疑点；2. 若查扣总量中未登记船只占比超过15%，反映系统性监管漏洞，风险升级。
  audit_item: 违法捕捞售卖长江流域水生生物
  suspicion: “三无”船只违法捕捞
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国渔业法\",\n    \"法规文号\": \"中华人民共和国主席令第34号（2013年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第二十三条、第四十一条\",\n    \"内容概述\": \"国家对捕捞业实行捕捞许可证制度，从事捕捞作业必须取得捕捞许可证；未依法取得捕捞许可证擅自进行捕捞的，没收渔获物和违法所得，处以罚款，情节严重的，没收渔具和渔船。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国长江保护法\",\n    \"法规文号\": \"中华人民共和国主席令第65号\",\n    \"效力级别\": \"法律\",\n    \""
