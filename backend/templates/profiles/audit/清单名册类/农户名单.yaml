name: audit/清单名册类/农户名单
type: model
description: 从清单名册类类文档（农户名单）中提取结构化元数据。涵盖字段如：农户姓名。文档范围包括：表箱安装农户名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 农户名单
  member_count: 1
  member_details:
  - 表箱安装农户名单
output:
  fields:
  - name: 农户姓名
    type: string
    description: 提取 农户姓名 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 农户姓名.收费金额 > 0 && ( 是否允许收费、收费标准上限.是否允许收费 == 否 || 农户姓名.收费金额 > 是否允许收费、收费标准上限.收费标准上限 )
  description: 根据政策规定，电能表、表箱及入户线等费用已纳入工程投资，电网企业不得以任何名义向农户收取此类费用。收费金额大于0即违规。
  audit_item: 电网改造和供电服务不合规
  suspicion: 安装表箱向农户违规收费
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2016〕2119号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第三十条\",\n    \"内容概述\": \"表箱、电能表及入户线等费用纳入工程投资，严禁向农村电力用户收取任何费用。\"\n  }\n]"
