name: audit/清单名册类/清册
type: model
description: 从清单名册类类文档（清册）中提取结构化元数据。涵盖字段如：业主名称、业主姓名、个人缴存比例、企业名称、保管到期日、单位缴存比例、名称、实际销毁日期。文档范围包括：业主清册、业主缴费清册、会计档案销毁清册、住房公积金缴存清册、厂办大集体企业清册等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 资产
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 清册
  member_count: 1
  member_details:
  - 业主清册
  - 业主缴费清册
  - 会计档案销毁清册
  - 住房公积金缴存清册
  - 厂办大集体企业清册
output:
  fields:
  - name: 业主名称
    type: string
    description: 提取 业主名称 的文本值
  - name: 业主姓名
    type: string
    description: 提取 业主姓名 的文本值
  - name: 个人缴存比例
    type: number
    description: 提取 个人缴存比例 的数值（含单位，如万元、吨等）
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 保管到期日
    type: string
    description: 提取 保管到期日 的文本值
  - name: 单位缴存比例
    type: number
    description: 提取 单位缴存比例 的数值（含单位，如万元、吨等）
  - name: 名称
    type: string
    description: 提取 名称 的文本值
  - name: 实际销毁日期
    type: date
    description: 提取 实际销毁日期 的日期值，格式 YYYY-MM-DD
  - name: 形成年度
    type: date
    description: 提取 形成年度 的日期值，格式 YYYY-MM-DD
  - name: 房号
    type: string
    description: 提取 房号 的文本值
  - name: 月缴存额
    type: string
    description: 提取 月缴存额 的文本值
  - name: 正常月缴存额
    type: string
    description: 提取 正常月缴存额 的文本值
  - name: 电话
    type: string
    description: 提取 电话 的文本值
  - name: 缴存基数
    type: string
    description: 提取 缴存基数 的文本值
  - name: 缴存月份
    type: string
    description: 提取 缴存月份 的文本值
  - name: 缴费日期
    type: date
    description: 提取 缴费日期 的日期值，格式 YYYY-MM-DD
  - name: 缴费金额
    type: number
    description: 提取 缴费金额 的数值（含单位，如万元、吨等）
  - name: 职工人数
    type: number
    description: 提取 职工人数 的数值（含单位，如万元、吨等）
  - name: 职工姓名
    type: string
    description: 提取 职工姓名 的文本值
  - name: 资产状况
    type: string
    description: 提取 资产状况 的文本值
  - name: 销毁档案编号
    type: string
    description: 提取 销毁档案编号 的文本值
  - name: 隶属关系
    type: string
    description: 提取 隶属关系 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (企业名称、隶属关系、职工人数、资产状况.职工人数 != 企业名称、统一社会信用代码、法定代表人、董事、监事、高级管理人员姓名及身份证号、经营范围、登记注册日期、注册地址、投资人/股东姓名及身份证号、成立日期、股东及高管姓名、法定代表人或股东与村干部关联关系、企业状态、注销日期、施工方股东及关键管理人员、物业公司及业委会成员名单、股东姓名、高级管理人员姓名、实际控制人、承租方股东、注册日期、经营地址、股东信息、单位注册日期、参保员工人数、经营状态.企业名称)
    || (机构名称、改革类型、当前状态、计划完成率、厂办大集体企业改革状态、完成标志、该医疗机构改革状态.完成标志 / 企业名称、隶属关系
  description: 清册企业数与工商注册的分离实体数不一致，表明底数不清；改革完成率低于70%为进度严重滞后；补偿金领取人数少于应安置人数意味着安置未全部落实。任一条件满足即触发疑点。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
  suspicion: 厂办大集体企业底数不清、改革迟滞
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于在全国范围内开展厂办大集体改革工作的指导意见\",\n    \"法规文号\": \"国办发〔2011〕18号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"各企业和地方要全面摸底，制定改革方案，妥善安置职工，确保2015年年底前完成改革任务。\"\n  }\n]"
- expression: (会计凭证.凭证编号 AND 审批记录.销毁内容 = '无') || (清册.实际销毁日期 < 清册.保管到期日) || (行对账单.未达账项日期 > 6 AND 会计凭证.银行收付款凭证 IS NULL) || (登记表.完整性确认
    AND 会计凭证.册号 > 0)
  description: 凭证编号无故断号且无销毁审批记录；提前销毁未到保管期限的资料；银行长期未达账项无对应的会计记录；交接手续不全导致资料下落不明，均可判定为隐匿或故意销毁。长期未达账阈值为超过6个月。
  audit_item: 违反会计管理规定的行为
  suspicion: 隐匿或故意销毁依法应保存的会计资料
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十四条\",\n    \"内容概述\": \"隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告，构成犯罪的，依法追究刑事责任。尚不构成犯罪的，由县级以上人民政府财政部门予以通报，可以对单位并处五千元以上十万元以下的罚款。\"\
    \n  }\n]"
- expression: 清册.缴费日期 < 分户账.入账日期 - 30天 || ABS(清册.缴费金额 - 分户账.入账金额) > 0.01
  description: 业主缴费30日后仍未在专户银行流水中体现同等金额入账，或某期间内实收总额与存入专户总额存在差异，即视为截留或延迟归集。30天为参考阈值，可依据地方细则调整。
  audit_item: 挪用住宅专项维修资金
  suspicion: 代收机构延迟归集或截留业主缴纳的维修资金
  regulation: "[\n  {\n    \"法规名称\": \"《住宅专项维修资金管理办法》\",\n    \"法规文号\": \"建设部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"商品住宅的业主应当在办理房屋入住手续前，将首期住宅专项维修资金存入住宅专项维修资金专户。已售公有住房的售房单位应当在办理房屋产权登记前，将首期住宅专项维修资金存入住宅专项维修资金专户。代收单位应当在规定期限内将代收的维修资金存入专户。\"\
    \n  }\n]"
- expression: 表决汇总结果（户数、面积比例）.表决汇总结果（户数、面积比例）/业主姓名、房号、电话.业主姓名 < 2/3 || (回访对象、否认知情或签字情况.否认知情或签字情况 / 回访对象、否认知情或签字情况.回访对象 >=
    0.2)
  description: 维修资金使用事项法定需经专有部分面积占比及人数占比均三分之二以上业主参与表决，并经参与表决的业主过半数同意。算出的同意户数比例不达此标准，或随机电话回访中有至少20%的被抽中业主明确否认参与表决或否认签名，即高度疑似签名造假。
  audit_item: 挪用住宅专项维修资金
  suspicion: 伪造业主表决签名套取维修资金
  regulation: "[\n  {\n    \"法规名称\": \"《住宅专项维修资金管理办法》\",\n    \"法规文号\": \"建设部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条、第二十三条\",\n    \"内容概述\": \"使用维修资金须由业主大会或者相关业主对使用方案进行表决，并达到规定的专有部分面积和人数比例的通过要求。伪造签名属于虚构了合法的决策前提。\"\n  }\n]"
- expression: 清册.缴存基数 > MIN(明细表.应发工资总额, 政策文件.当地住房公积金缴存基数上限（上年度职工月平均工资3倍）)
  description: 缴存基数合规上限应为职工当月应发工资总额与当地基数上限中的较小值。若缴存基数大于该较小值，即存在虚增工资基数或突破上限行为。当应发工资总额未超上限时，缴存基数大于工资总额属虚构基数；当工资总额超上限时，缴存基数大于上限属违规突破封顶线。
  audit_item: 违规多缴住房公积金
  suspicion: 违规超基数缴存住房公积金
  regulation: "[\n  {\n    \"法规名称\": \"关于住房公积金管理若干具体问题的指导意见\",\n    \"法规文号\": \"建金管[2005]5号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"缴存住房公积金的月工资基数，原则上不应超过职工工作地所在设区城市统计部门公布的上一年度职工月平均工资的3倍。\"\n  }\n]"
- expression: (清册.单位缴存比例 > 12%) || (清册.个人缴存比例 > 12%) || (清册.单位缴存比例 + 清册.个人缴存比例 > 24%)
  description: 单位或个人任一侧缴存比例超过地方规定的最高上限（通常为12%），或双方合计比例超过24%，均构成超比例缴存。若存在以“补充公积金”名义额外增加比例，需穿透核查实质缴存比例是否突破上限。
  audit_item: 违规多缴住房公积金
  suspicion: 违规超比例缴存住房公积金
  regulation: "[\n  {\n    \"法规名称\": \"关于住房公积金管理若干具体问题的指导意见\",\n    \"法规文号\": \"建金管[2005]5号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"单位和职工缴存比例不应低于5％，原则上不高于12％。采取提高单位住房公积金缴存比例方式发放职工住房补贴的，应当在个人账户中予以注明。\"\n  }\n]"
- expression: SUM(清册.正常月缴存额) + SUM(补缴人员、补缴月份、补缴金额、补缴事由.补缴金额) > (政策文件.月缴存基数上限 × (政策文件.单位和职工缴存比例上限 + 政策文件.单位和职工缴存比例上限) × 12)
  description: 按职工以年度为单位汇总全部正常缴存金额与补缴金额，若合计总额超出政策规定的年度缴存上限（月基数上限×合计最高比例×12个月），即属于通过补缴突破上限。即使补缴事由合理，但合计超限亦属违规。
  audit_item: 违规多缴住房公积金
  suspicion: 通过补缴方式突破缴存上限多缴住房公积金
  regulation: "[\n  {\n    \"法规名称\": \"关于住房公积金管理若干具体问题的指导意见\",\n    \"法规文号\": \"建金管[2005]5号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"住房公积金月缴存基数上限为当地社平工资3倍，缴存比例原则上不高于12%。补缴应基于历史真实工资，不得通过补缴变相突破月缴存额上限或年度上限。\"\n\
    \  },\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\"\
    ,\n    \"内"
