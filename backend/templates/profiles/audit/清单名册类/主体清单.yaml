name: audit/清单名册类/主体清单
type: model
description: 从清单名册类类文档（主体清单）中提取结构化元数据。涵盖字段如：主体名称、享受主体名称、享受期间、合同签订情况、地址、实际享受优惠企业名单、税种、联系方式。文档范围包括：农业主体清单、税收优惠享受主体清单、管护责任主体清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 合同
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 主体清单
  member_count: 1
  member_details:
  - 农业主体清单
  - 税收优惠享受主体清单
  - 管护责任主体清单
output:
  fields:
  - name: 主体名称
    type: string
    description: 提取 主体名称 的文本值
  - name: 享受主体名称
    type: string
    description: 提取 享受主体名称 的文本值
  - name: 享受期间
    type: string
    description: 提取 享受期间 的文本值
  - name: 合同签订情况
    type: string
    description: 提取 合同签订情况 的文本值
  - name: 地址
    type: string
    description: 提取 地址 的文本值
  - name: 实际享受优惠企业名单
    type: string
    description: 提取 实际享受优惠企业名单 的文本值
  - name: 税种
    type: string
    description: 提取 税种 的文本值
  - name: 联系方式
    type: string
    description: 提取 联系方式 的文本值
  - name: 责任主体名称
    type: string
    description: 提取 责任主体名称 的文本值
  - name: 资质类型
    type: string
    description: 提取 资质类型 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (实际享受优惠企业名单.实际享受优惠企业名单 不包含 应享企业.A) && (企业/农户税收优惠申报及审批材料.税务机关审批意见 == “已备案” || 企业/农户税收优惠申报及审批材料.税务机关审批意见 == “已审批”)
  description: 查找“应享未享”疑点。如果一个企业（应享企业.A）符合政策条件且已经完成了申报或备案流程（审批状态为“已备案”或“已审批”），但它却没有出现在税务部门内部的“实际享受优惠企业清单”中，则判定为税收优惠政策在最终征管环节被“卡壳”未落实。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 涉农企业税收优惠政策未落实
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国税收征收管理法\",\n    \"法规文号\": \"中华人民共和国主席令第四十九号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三条\",\n    \"内容概述\": \"税收的开征、停征以及减税、免税、退税、补税，依照法律的规定执行；法律授权国务院规定的，依照国务院制定的行政法规的规定执行。任何机关、单位和个人不得违反法律、行政法规的规定，擅自作出税收开征、停征以及减税、免税、退税、补税和其他同税收法律、行政法规相抵触的决定。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国税收征收管理法\",\n    \"法规文号\": \""
- expression: (企业/农户税收优惠申报及审批材料.资质证明 && 实际享受优惠企业名单.享受主体名称 != 企业/农户税收优惠申报及审批材料.申报主体名称) || (核查表.实际结算电价 > 农业用电优惠电价标准.优惠幅度（减免税种、税率、电价标准）
    && 纳入农业用电名录的主体清单、执行电价标准、更新机制.纳入农业用电名录的主体清单 = 是)
  description: 对符合政策条件的涉农主体，若未出现在税收优惠享受清单中，或虽在名录中但实际结算电价高于规定的优惠电价，即判定为政策未落实。需重点排查应享未享、非农主体违规享受以及政策宣传不到位等情形。当累积未享受金额超过10万元或涉及户数超过总户数的20%，应列为重点核实对象。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 税收、用电支持政策未落实
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于有机肥产品免征增值税的通知\",\n    \"法规文号\": \"财税〔2008〕56号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条、第三条\",\n    \"内容概述\": \"对纳税人生产销售和批发、零售有机肥料、有机-无机复混肥料和生物有机肥免征增值税，纳税人应按规定申请备案，主管税务机关应落实优惠政策。\"\n \
    \ },\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"部门规章\",\n\
    \  "
- expression: 主体清单.地址 > 0 && (统计表.是否享受优惠 / 主体清单.地址) < 0.5 && 宣传记录.宣传方式 = NULL
  description: 区域内农业主体享受电价优惠的覆盖率低于50%，且供电部门无法提供有效的政策宣传证明材料，表明宣传责任不到位，导致政策落地盲区。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业电价优惠政策宣传缺位致农户未受益
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"行政机关应当主动公开涉及公共利益、需要公众广泛知晓的政策信息，提高政策到达率。\"\n  }\n]"
- expression: (管护责任主体清单.责任主体名称 IS NULL) OR (管护责任主体清单.合同签订 = '否') OR (管护责任主体清单.资质不符合制度文件要求) OR (资金拨付明细表中管护经费 = 0)
  description: 管护责任主体清单空白、未签订管护合同、责任主体资质不符合规定（如无水利设施管护能力），或未安排任何管护经费，均认定为管护机制未落实。
  audit_item: 高标准农田管护使用不符合相关规定
  suspicion: 高标准农田未落实管护机制和责任主体
  regulation: "[\n  {\n    \"法规名称\": \"高标准农田建设通则\",\n    \"法规文号\": \"GB/T 30600-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"第11.2条\",\n    \"内容概述\": \"应建立政府主导、多方参与、市场运作的管护机制，明确管护主体、管护责任和管护经费来源。\"\n  }\n]"
