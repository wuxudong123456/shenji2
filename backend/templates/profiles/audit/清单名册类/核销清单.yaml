name: audit/清单名册类/核销清单
type: model
description: 从清单名册类类文档（核销清单）中提取结构化元数据。涵盖字段如：核销原因、核销用户身份证号。文档范围包括：重复申报/虚假用户核销清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 核销清单
  member_count: 1
  member_details:
  - 重复申报/虚假用户核销清单
output:
  fields:
  - name: 核销原因
    type: string
    description: 提取 核销原因 的文本值
  - name: 核销用户身份证号
    type: string
    description: 提取 核销用户身份证号 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (COUNT(用户清单.用户身份证号) > COUNT(DISTINCT 用户清单.用户身份证号)) || (数据表.改造后月均清洁能源用量 = 0 && 明细表.发放金额 > 0) || (用户清单.设备序列号 重复)
  description: 三个触发条件之一出现即判定为弄虚作假嫌疑：同一身份证号多次出现表明重复申报；补贴已发放但对应的能源监测用量为零表明设备未实际使用可能为虚假安装；同一设备序列号出现在不同用户中表明设备台账重复。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 弄虚作假虚报清洁取暖改造任务完成量
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员不得以虚报、冒领等手段骗取财政资金；弄虚作假虚报改造完成量套取补贴属于典型的骗取财政资金行为。\"\n  }\n]"
