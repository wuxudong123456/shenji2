name: audit/清单名册类/采购清单
type: model
description: 从清单名册类类文档（采购清单）中提取结构化元数据。涵盖字段如：供应商名称、供货方、单价、商品名称、型号、实际采购设备型号数量、数量、是否为外来物种标识。文档范围包括：信息化设备采购清单、出版物采购清单、绿化项目苗木采购清单、设施设备采购清单、采购清单、项目设备采购清单、食品采购清单、食堂采购清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 采购
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 采购清单
  member_count: 1
  member_details:
  - 信息化设备采购清单
  - 出版物采购清单
  - 绿化项目苗木采购清单
  - 设施设备采购清单
  - 采购清单
  - 项目设备采购清单
  - 食品采购清单
  - 食堂采购清单
output:
  fields:
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 供货方
    type: string
    description: 提取 供货方 的文本值
  - name: 单价
    type: number
    description: 提取 单价 的数值（含单位，如万元、吨等）
  - name: 商品名称
    type: string
    description: 提取 商品名称 的文本值
  - name: 型号
    type: string
    description: 提取 型号 的文本值
  - name: 实际采购设备型号数量
    type: number
    description: 提取 实际采购设备型号数量 的数值（含单位，如万元、吨等）
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 是否为外来物种标识
    type: boolean
    description: 提取 是否为外来物种标识 的布尔值（是/否）
  - name: 是否具备自动采集传输功能
    type: boolean
    description: 提取 是否具备自动采集传输功能 的布尔值（是/否）
  - name: 更新批次及图书出版年份分布
    type: string
    description: 提取 更新批次及图书出版年份分布 的文本值
  - name: 最近一次更新日期
    type: date
    description: 提取 最近一次更新日期 的日期值，格式 YYYY-MM-DD
  - name: 物料名称
    type: string
    description: 提取 物料名称 的文本值
  - name: 物料编码
    type: string
    description: 提取 物料编码 的文本值
  - name: 规格
    type: string
    description: 提取 规格 的文本值
  - name: 规格型号
    type: string
    description: 提取 规格型号 的文本值
  - name: 设备名称
    type: string
    description: 提取 设备名称 的文本值
  - name: 设备序列号
    type: string
    description: 提取 设备序列号 的文本值
  - name: 询价比价记录
    type: string
    description: 提取 询价比价记录 的文本值
  - name: 采购单位
    type: string
    description: 提取 采购单位 的文本值
  - name: 采购批次号
    type: string
    description: 提取 采购批次号 的文本值
  - name: 采购数量
    type: number
    description: 提取 采购数量 的数值（含单位，如万元、吨等）
  - name: 采购方式
    type: string
    description: 提取 采购方式 的文本值
  - name: 采购日期
    type: date
    description: 提取 采购日期 的日期值，格式 YYYY-MM-DD
  - name: 采购的树种草种名称
    type: string
    description: 提取 采购的树种草种名称 的文本值
  - name: 采购苗木名称
    type: string
    description: 提取 采购苗木名称 的文本值
  - name: 采购设备名称
    type: string
    description: 提取 采购设备名称 的文本值
  - name: 采购金额
    type: number
    description: 提取 采购金额 的数值（含单位，如万元、吨等）
  - name: 食材名称
    type: string
    description: 提取 食材名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (食堂采购清单.食材名称 IN ('海参','燕窝','鲍鱼','高档海鲜','高档茶叶') && 食堂采购清单.单价 > 食材价格对比分析表.市场同期均价 * 1.5) || (食材价格对比分析表.差异率 > 0.5)
    || (领用台账.领用人 NOT IN 食堂工作人员清单 && 领用台账.用途 != '员工正常餐饮') || (食堂采购清单.食材名称 LIKE '%生鲜食材%' && 单价异常高)
  description: 筛查食堂采购的高档食材且价格显著高于市场价，或领用记录显示领导个人领用，或采购品名刻意模糊但单价过高。设定价格偏差超过50%或直接购入高档食材即触发异常，需追溯实际使用去向。
  audit_item: 其他违反中央八项规定及其实施细则精神问题
  suspicion: 食堂高价采购高档食材用于隐性公款吃喝
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第十三条、第十四条\",\n    \"内容概述\": \"严禁用公款大吃大喝或安排与公务无关的宴请；不得提供高档菜肴和用野生保护动物制作的菜肴，不得提供高档烟酒。\"\n  }\n]"
- expression: 同一物料编码 && 同一供应商 && (采购日期间隔滚动30天内) && (SUM(采购金额) >= 招标限额) && (单次采购方式 != "招标" && 单次采购金额 < 招标限额)
  description: 针对同一物料，在30天滚动周期内向同一供应商分多次采购，各次金额均低于招标限额，累计金额却达到或超过制度规定的招标限额，且未采用招标方式，涉嫌化整为零规避招标。具体限额需依照企业制度（如货物200万元）。
  audit_item: 采购管理方面存在的问题
  suspicion: 人为拆分采购规避招标增加采购成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n\
    \    \"法规文号\": \"国家发展改革委令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条、第五条\",\n    \"内容概述\": \"全部或部分使用国有资金投资的项目，达到规定规模标准的"
- expression: (产品质量验收记录表.验收结论 = "不合格" || 产品质量验收记录表.验收结论 为空) && (采购成本对比分析表.合同单价 - 采购成本对比分析表.市场均价) / 采购成本对比分析表.市场均价 > 0.15
  description: 采购货物验收结论为不合格，或无验收记录（验收缺失），同时合同单价高于同期市场均价15%以上，即构成“质次价高”疑点。价差率可根据行业利润率调整，一般>15%表明显著偏离合理区间。
  audit_item: 采购管理方面存在的问题
  suspicion: 采购产品质次价高且验收不合格
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国产品质量法\",\n    \"法规文号\": \"主席令第22号（2018修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"可能危及人体健康和人身、财产安全的工业产品，必须符合国家标准、行业标准。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n \
    \   \"法规文号\": \"主席令第45号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第六百一十条、第六百一十七条\",\n    \"内容概述\": \"卖方交付的标的物不符合质量要求的，买方可以请求承担违约责任"
- expression: (SUM(采购付款明细表.付款金额) > 合同总价 * 1.00) || (采购付款明细表.付款日期 < 合同约定最早付款日期) || (采购付款明细表.本次付款比例 > 合同约定付款比例上限)
  description: 合同项下累计付款总额超出合同总价（任何超付），或首笔/进度款项支付时间早于合同约定的前置条件达成日期，或付款比例突破合同规定的上限，均属违规。需按合同号汇总计算累计付款，精确比对付款条款。
  audit_item: 采购管理方面存在的问题
  suspicion: 违反合同约定多支付采购价款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第45号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五百零九条\"\
    ,\n    \"内容概述\": \"当事人应当按照约定全面履行自己的义务。\"\n  },\n  {\n    \"法规名称\": \"企业内部控制应用指引第7号——采购业务\",\n    \"法规文号\": \"财会〔2010〕11号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"企业应当加强采购付款管理，严格审核采购预算、合同、相关单据凭证和审批程序，按照合同规定及时办理付款"
- expression: 采购清单及合同执行台账.采购金额 >= 制度招标限额标准 && 采购清单及合同执行台账.采购方式 != "招标" && 采购清单及合同执行台账.合同编号 NOT IN (招标过程记录表.项目编号关联的合同编号) &&
    采购清单及合同执行台账.采购方式 != "经审批的单一来源"
  description: 单笔采购金额达到或超过企业制度规定的招标限额（如货物200万元、服务100万元），但采购方式栏显示非招标，且无法在招标过程记录表中查到对应的招标项目编号，同时也无合规的单一来源采购审批文件，即可判定为规避招标。需排除已经过规范审批的单一来源特例。
  audit_item: 采购管理方面存在的问题
  suspicion: 达到招标限额的采购未招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三条、第四条\",\n    \"内容概述\": \"在中华人民共和国境内进行规定范围内的工程、货物、服务采购，达到规定规模标准的必须进行招标，不得规避招标。\"\n  },\n  {\n    \"法规名称\":\
    \ \"必须招标的工程项目规定\",\n    \"法规文号\": \"国家发展改革委令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"\
    全部或者部分使用国有资金投"
- expression: 供应商信息登记表.资质有效期止 < 采购清单及合同执行台账.交易日期 && 采购清单及合同执行台账.交易金额 > 0 && DATEDIFF(YEAR, 供应商信息登记表.资质有效期止, 采购清单及合同执行台账.交易日期)
    >= 1
  description: 供应商的关键资质证书（如食品经营许可、特种设备制造许可、安全生产许可）到期后，企业仍继续与其进行交易，且交易时间距资质过期超过一年（长期），即构成违规。重点关注年度交易额大于50万的高风险供应商。
  audit_item: 采购管理方面存在的问题
  suspicion: 长期向资质失效的供应商采购
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国安全生产法\",\n    \"法规文号\": \"主席令第88号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十三条\",\n    \"内容概述\": \"生产经营单位不得使用应当淘汰的工艺、设备；特种作业人员必须取得相应资格。\"\n  },\n  {\n    \"法规名称\": \"企业内部控制应用指引第7号——采购业务\"\
    ,\n    \"法规文号\": \"财会〔2010〕11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业应当建立供应商评估和准入制度，对供应商资质信"
- expression: (单一来源采购审批备案表.采购金额 >= 制度限额 && 审批理由不包含客观证明材料) || (近三年单一来源采购金额汇总 / 同期采购总额汇总 > 0.15)
  description: 单一来源项目达到规定限额，但审批理由仅为主观描述（如“技术唯一”），缺少专利证明、市场调研报告等客观佐证材料；或者企业近三年单一来源采购金额占采购总额的比例超过15%（参考行业健康度指标），表明滥用单一来源方式。
  audit_item: 采购管理方面存在的问题
  suspicion: 违规开展单一来源采购
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号（2014修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"符合只能从唯一供应商处采购、发生了不可预见紧急情况等情形的，可以依法采用单一来源方式采购。\"\n  },\n  {\n    \"法规名称\": \"关于规范中央企业采购管理工作的指导意见\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第三条第（三）款\",\n    \"内容概述\": \"严格审批单一来源采购，能够通过竞争方式采"
- expression: (信息化设备采购清单.开机次数 < 4) || (教育信息化平台访问量及功能使用频次统计表.活跃用户数/应使用教师总数 < 0.2) || (信息化设备采购清单.采购日期 <= 当前日期 - 6个月 AND 信息化设备采购清单.开机次数
    = 0 AND 设备故障报修.报修日期 IS NULL)
  description: 单台设备月均使用次数不足4次（每周不足1次）视为闲置；平台月度活跃教师占比低于20%视为空转；新购设备半年内既无使用记录又无报修记录判定为未投入使用，属于严重浪费。
  audit_item: 乡村学校薄弱环节改善不符合相关规定
  suspicion: 信息化设备及平台长期闲置浪费
  regulation: "[\n  {\n    \"法规名称\": \"教育部 国家发展改革委 财政部关于深入推进义务教育薄弱环节改善与能力提升工作的意见\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"无\",\n    \"内容概述\": \"明确要求提升信息化设备使用效益，避免闲置浪费，确保设备常态化服务教育教学，将使用效率纳入督导评估。\"\n  }\n]"
- expression: (验收报告.验收结论 != '合格') OR (验收报告.验收结论及问题记录 IS NOT NULL AND 验收报告.验收结论及问题记录 IS NOT NULL) OR (验收报告.各分项达标情况 < 建设标准规范文件.标准配置项（面积、设备、带宽等）)
    OR (设施设备采购清单.实际采购设备型号数量 < 建设标准规范文件.标准配置项（面积、设备、带宽等）) OR (验收报告.各分项达标情况 < 建设标准规范文件.标准配置项（面积、设备、带宽等）)
  description: 验收不合格直接违规；验收合格但实际建设存在面积不足、设备缺项、带宽不达标等情况，或验收问题未整改，均视为建设不规范。
  audit_item: 信息进村入户、电子商务进农村等村级服务站使用效果不佳
