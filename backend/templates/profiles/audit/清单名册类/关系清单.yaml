name: audit/清单名册类/关系清单
type: model
description: 从清单名册类类文档（关系清单）中提取结构化元数据。涵盖字段如：关联关系类型、客户名称。文档范围包括：关联方关系清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 关系清单
  member_count: 1
  member_details:
  - 关联方关系清单
output:
  fields:
  - name: 关联关系类型
    type: string
    description: 提取 关联关系类型 的文本值
  - name: 客户名称
    type: string
    description: 提取 客户名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: （ABS(销售合同台账.销售单价 - 同期同类产品销售价格明细表.同类产品同期平均销售单价) / 同期同类产品销售价格明细表.同类产品同期平均销售单价 > 0.15 ) && (定价审批单.申请折扣率 IS NULL
    OR 定价审批单.审批意见 != '集体决策通过') && 关联方关系清单.客户名称 = 销售合同台账.客户名称
  description: 筛选销售单价低于同期同类产品平均销售单价85%（即偏差率超过15%）的合同，且无集体决策审批记录或审批缺失，同时客户为关联方的交易，判定为异常。阈值15%参考除正常商业折扣外需说明定价公允性的通用标准。若客户非关联方但折扣异常且无合理审批，同样可视为疑点，需结合其他条件判断。
  audit_item: 销售与采购合同审计
  suspicion: 销售合同价格明显低于同期市场均价
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五百零九条\",\n    \"内容概述\": \"当事人应当按照约定全面履行自己的义务。若存在不合理低价交易损害国家利益或企业利益，可能构成违背诚实信用原则。\"\n  },\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\"\
    ,\n    \"法规文号\": \"国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"企业资产交易涉及关联交易的，应当"
