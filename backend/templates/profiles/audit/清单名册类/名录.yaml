name: audit/清单名册类/名录
type: model
description: 从清单名册类类文档（名录）中提取结构化元数据。涵盖字段如：与本企业业务关系存续期间、与被审计单位关联关系、业务关系存续时间、业务类型、主体名称、主体类型、企业名称、传统村落名单。文档范围包括：业务关系企业名录、中介服务机构名录、产业帮扶企业名录、传统村落名录、供应商/客户名录、公积金中心公布的合格担保机构名录、关联企业名录、原企业供应商/客户名录、古树名木保护名录、定点接待场所名录等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 名录
  member_count: 1
  member_details:
  - 业务关系企业名录
  - 中介服务机构名录
  - 产业帮扶企业名录
  - 传统村落名录
  - 供应商/客户名录
  - 公积金中心公布的合格担保机构名录
  - 关联企业名录
  - 原企业供应商/客户名录
  - 古树名木保护名录
  - 定点接待场所名录
  - 新型农业经营主体名录
  - 相关部门保护名录
  - 禁限用农药名录
  - 职工名录
