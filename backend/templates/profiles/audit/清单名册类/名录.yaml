violations:
- expression: (公务接待明细台账.接待场所名称 NOT IN (定点接待场所名录.酒店名称)) && (公务接待明细台账.接待场所名称 IN (高档酒店预警清单) || (公务接待明细台账.接待金额 / 公务接待明细台账.接待人数)
    > 地区公务接待餐费标准)
  description: 接待场所不在定点名录内，且属于审计预设的高档酒店（如五星级、豪华型）清单，或人均消费超出当地公务接待标准（如超出10%），触发违规判定。需结合当地接待标准及酒店价格水平实施。
  audit_item: 公务接待管理不符合规定
  suspicion: 在高档酒店进行公务接待
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"工作餐应当供应家常菜，不得提供鱼翅、燕窝等高档菜肴和用野生保护动物制作的菜肴，不得提供香烟和高档酒水，不得使用私人会所、高消费餐饮场所。\"\n  }\n]"
- expression: (姓名、原职务、离职时间.新任职企业名称 IN (企业名称、业务关系存续时间)) && (DATEDIFF(离职时间, 新任职起始时间) < 1095) && (新任职企业.业务范围 IN 原企业经营业务类别)
  description: 筛查离职或退休后三年内（1095天）到与原任职企业有业务关系的私营企业、外资企业或中介机构担任职务或投资入股，且从事与原业务相关的经营活动。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 离职或退休后违规在与原企业有业务关系的企业任职或入股
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第七项\",\n    \"内容概述\": \"离职或者退休后三年内，不得在与原任职企业有业务关系的私营企业、外资企业和中介机构担任职务、投资入股，或者在上述企业或者机构从事、代理与原任职企业经营业务相关的经营活动。\"\
    \n  }\n]"
- expression: (信息.股东姓名 IN (项申报表.申报人姓名, 项申报表.配偶及子女姓名)) AND (信息.企业名称 IN (名录.关联企业名称)) AND (项申报表.投资企业名称 不包含 信息.企业名称 OR 项申报表.持股比例
    != 信息.持股比例) AND (信息.出资日期 BETWEEN 领导人员任职开始日期 AND 审计基准日)
  description: 领导人员或其近亲属在关联企业持有股份且未如实申报，或申报持股比例与工商登记不符，同时入股时间发生在任职期间内，触发违规判定。持股比例>0即视为投资入股。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 领导人员违规投资入股关联企业
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第一款\",\n    \"内容概述\": \"国有企业领导人员不得个人从事营利性经营活动和有偿中介活动，或者在本企业的同类经营企业、关联企业和与本企业有业务关系的企业投资入股。\"\n  }\n]"
- expression: (离职人员利益往来登记表.利益输送企业名称 IN 关联企业及业务关系企业名录.关联企业名称) AND (离职人员利益往来登记表.发生日期 BETWEEN 离职人员利益往来登记表.离职日期 AND 离职人员利益往来登记表.离职日期+1095天)
    AND (离职人员利益往来登记表.金额 > 0) AND (关联交易明细台账.审批人 = 该离职人员) AND (关联交易明细台账.交易日期在离职前)
  description: 离职人员在离职后三年内从原关联企业获取报酬或物质利益，且该关联企业曾与离职人员任职企业发生业务往来并由其审批，线索即为违规。利益类型包括顾问费、咨询费、无偿提供财物等。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 离职后三年内接受原关联企业利益
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（二）项\",\n    \"内容概述\": \"不得在职或者离职后接受、索取本企业的关联企业、与本企业有业务关系的企业，以及管理和服务对象提供的物质性利益。\"\n  }\n]"
- expression: ( 收费明细台账.对应审批事项 && 服务合同.服务提供方 IN (名录.机构名称) && ABS(服务合同.是否强制或唯一 - 1) = 0 ) && ( ABS(收费明细台账.收费总额 - 流水.收款金额) <
    0.01 )
  description: 触发条件：在办理行政许可、资质认定等事项时，官方明确要求或暗中诱导必须通过特定名录内的中介机构提供服务，且该名录无公开竞争、无同等替代选项；同时，审计期间发现该中介服务的收费记录数量与被审计单位审批业务量呈明显同步变动，表明两者已捆绑。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 利用审批权指定中介服务并收费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步清理规范国务院部门行政审批中介服务的通知\",\n    \"法规文号\": \"国办发〔2015〕31号\",\n    \"效力级别\":\
    \ \"制度文件\",\n    \"条款号\": \"第二条第三项\",\n    \"内容概述\": \"审批部门不得以任何形式指定中介服务机构，对各类中介服务机构提供的服务不得以任何形式附加限制性或歧视性条件。\"\n  },\n\
    \  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十三条\",\n  \
    \  \"内容概述\": "
- expression: (报销凭证.发票号码 连续 AND 报销凭证.金额 > 100000) || (验证报告.验证结果 == '假发票' && 报销凭证.收款银行账号 NOT IN 正常供应商账号库) || (流水单.收款人 IN 名录
    && 流水单.金额 未出现在 其他 中 && 报销凭证.报销摘要 NULL 真实劳务内容)
  description: 连号大额发票（10万以上）高度可疑；查证为虚假发票且资金流入非正常供应账户，直接判定为套取；银行代发流水中有职工收款但未列入奖金发放清单且无合理业务摘要的，即为账外发放奖金。
  audit_item: 违规支付职工薪酬及股份
  suspicion: 虚列支出套取资金发放职工奖金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条、第二十六条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算；不得伪造、变造会计凭证、会计账簿及其他会计资料，不得提供虚假的财务会计报告。\"\n  },\n  {\n    \"\
    法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\"\
    : \"国家机关及"
- expression: 表2.产品名称 IN (名单.禁用农药名单) || (报告.有效成分含量 < 明示值*0.9 || 报告.检测结果) || (登记表.实际数量与账面差异 ABS(账面库存-实盘库存)/账面库存 > 0.2 && 台账.购买方类型
    NOT IN ('授权单位'))
  description: 综合判定:销售品种在禁用名录中直接违规;第三方检测有效成分含量低于标称值90%或未检出即判为劣质或假农药;限用农药销售时购买方非授权单位,且库存盘点差异异常(>20%),可能涉及暗中销售禁限用农药。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 生产销售假农药、劣质农药或禁限用农药
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条、第四十五条、第四十六条\",\n    \"内容概述\": \"禁止生产、销售假农药(以非农药冒充农药或以此种农药冒充他种农药);禁止生产、销售劣质农药(不符合产品质量标准);禁止生产、销售国家明令禁止使用的农药。\"\n\
    \  }\n]"
- expression: 审批台账.借款人姓名 LIKE '%自然人%' && (检查报告.实际资金用途描述 = '企业') && (检查报告.实际资金用途描述 NOT IN (名录.企业名称)) OR (名录.企业名称 IN (审批台账.借款人姓名)
    >= 5)
  description: 当满足以下条件之一时触发：1. 贷款申请人为农户个体，但资金经过其账户后最终转入了某企业账户，且该企业不在官方认定的帮扶企业名录中；2. 或是虽然企业在名录内，但出现了同一个小额信贷企业账户短期内收到超过5名及以上不同借款农户转账的情况，疑似集中归集农户贷款。
  audit_item: 帮扶产业配套支持政策不够精准有效
  suspicion: 小额信贷资金“户贷企用”违规使用
  regulation: "[\n  {\n    \"法规名称\": \"关于深入扎实做好过渡期脱贫人口小额信贷工作的通知\",\n    \"法规文号\": \"银保监发〔2021〕6号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"脱贫人口小额信贷要坚持户借、户用、户还，精准用于贷款户发展生产和开展经营。……坚决杜绝“户贷企用”等违规行为。\"\n  }\n]"
- expression: (参保企业名称.参保企业名称 / 应参保企业总数.应参保企业总数) < 0.6 || (理赔申请笔数.理赔拒付率 > 0.2 && 平均结案周期.平均结案周期 > 60)
  description: 计算特定帮扶产业的保险覆盖率（参保企业数占应参保企业总数的比例），当覆盖率低于60%的及格线时，判定为保险覆盖不足。或者，当保障范围内的理赔拒付率超过20%且平均理赔周期超过60天时，视为保险服务保障不到位。
  audit_item: 帮扶产业配套支持政策不够精准有效
