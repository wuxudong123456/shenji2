name: audit/清单名册类/收费目录+基金目录
type: model
description: 从清单名册类类文档（收费目录、基金目录）中提取结构化元数据。涵盖字段如：取消执行日期、已取消项目名称、法定征收标准、法定项目名称。文档范围包括：政府性基金目录、行政事业性收费目录等。本模板合并了 2 个相似子类型。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 项目
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 收费目录
  - 基金目录
  member_count: 2
  member_details:
  - 政府性基金目录
  - 行政事业性收费目录
output:
  fields:
  - name: 取消执行日期
    type: date
    description: 提取 取消执行日期 的日期值，格式 YYYY-MM-DD
  - name: 已取消项目名称
    type: string
    description: 提取 已取消项目名称 的文本值
  - name: 法定征收标准
    type: string
    description: 提取 法定征收标准 的文本值
  - name: 法定项目名称
    type: string
    description: 提取 法定项目名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
