name: audit/清单名册类/联方清单
type: model
description: 从清单名册类类文档（联方清单）中提取结构化元数据。涵盖字段如：买方名称、关系、关联企业名称、关联关系类型、关联方名称、卖方名称、已披露关联方名单、已披露关联方名称。文档范围包括：企业关联方清单、关联方清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 联方清单
  member_count: 1
  member_details:
  - 企业关联方清单
  - 关联方清单
output:
  fields:
  - name: 买方名称
    type: string
    description: 提取 买方名称 的文本值
  - name: 关系
    type: string
    description: 提取 关系 的文本值
  - name: 关联企业名称
    type: string
    description: 提取 关联企业名称 的文本值
  - name: 关联关系类型
    type: string
    description: 提取 关联关系类型 的文本值
  - name: 关联方名称
    type: string
    description: 提取 关联方名称 的文本值
  - name: 卖方名称
    type: string
    description: 提取 卖方名称 的文本值
  - name: 已披露关联方名单
    type: string
    description: 提取 已披露关联方名单 的文本值
  - name: 已披露关联方名称
    type: string
    description: 提取 已披露关联方名称 的文本值
  - name: 持股比例
    type: number
    description: 提取 持股比例 的数值（含单位，如万元、吨等）
  - name: 股权关系
    type: string
    description: 提取 股权关系 的文本值
  - name: 股权关联关系
    type: string
    description: 提取 股权关联关系 的文本值
  - name: 被投资企业名称
    type: string
    description: 提取 被投资企业名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (资本金专户银行流水台账.对方户名 IN 关联方清单.关联方名称 && 资本金专户银行流水台账.摘要 NOT_LIKE '%工程款%' && 资本金专户银行流水台账.摘要 NOT_LIKE '%设备款%' && 资本金专户银行流水台账.交易金额
    > 项目资本金总额的 0.05) && (贷方科目 IN ('实收资本', '资本公积'))
  description: 资金在作为资本金进入项目公司（计入实收资本/资本公积）后，又以无真实业务背景的名义大额转出至股东或关联方。表达式设定大额标准为单笔或累计超过资本金总额的5%。摘要非工程、设备等正常款项是辅助判断条件。
  audit_item: 项目资本金不符合要求
  suspicion: 以各种形式抽逃、抽走项目资本金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"中华人民共和国主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十五条\",\n    \"内容概述\": \"公司成立后，股东不得抽逃出资。\"\n  }\n]"
- expression: 业务台账.持股比例 > 0 && 业务台账.持股比例 < 100% && (业务台账.担保金额 / 计算表.被担保企业净资产) > 业务台账.持股比例 && (业务台账.是否有反担保标识 != '是')
  description: 对参股企业提供的担保金额与其净资产的比值超过公司持股比例，且未要求其他股东按股权比例共同提供担保，也未取得被担保方相应的反担保，即判定为超股权比例违规担保。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 对参股企业提供担保超出持股比例
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"中央企业应当严格按照持股比例对子公司和参股企业提供担保。严禁对参股企业超股比担保。\"\n  },\n  {\n    \"法规名称\": \"关于规范上市公司对外担保行为的通知\"\
    ,\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"上市公司对外担保必须经董"
- expression: 对照表.毛利率 < 3% && (行对账单.付款方与收款方存在短期内金额相近的反向流转) && (单据.货物流转记录缺失或货物直接从供应商发往最终客户) && (销售合同.风险承担约定未约定实质性存货风险转移条款)
  description: 毛利率极低（<3%）、资金闭环回流、企业不承担货权风险、无实际物流控制，即符合融资性贸易特征。
  audit_item: 未按规定确认收入
  suspicion: 开展融资性贸易虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十四条\",\n    \"内容概述\": \"企业应当根据其在向客户转让商品前是否拥有对该商品的控制权，判断从事交易时身份是主要责任人还是代理人。\"\n  },\n  {\n    \"法规名称\": \"关于进一步排查中央企业融资性贸易业务风险的通知\"\
    ,\n    \"法规文号\": \"国资发财评[2017]63号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"严禁中"
- expression: (交易对手 未 在 关联方清单 中 但通过穿透查询属潜在关联方) && (销售合同.单价 > 关联方与非关联方相同商品价格.非关联方可比价格 * 1.2) && (盈利能力显著高于行业) && (异常交易审批记录缺失或后补)
  description: 交易对手虽未正式披露，但存在潜在关联关系（如家属、协议控制），且价格偏离非关联方均价20%以上，属于向潜在关联方进行的利益输送。
  audit_item: 未按规定确认收入
  suspicion: 通过潜在关联方进行显失公允的交易
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第36号——关联方披露\",\n    \"法规文号\": \"财会[2006]3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三条\",\n    \"内容概述\": \"一方控制、共同控制另一方或对另一方施加重大影响，以及两方或两方以上同受一方控制、共同控制或重大影响的，构成关联方。\"\n  }\n]"
- expression: 交易对手 NOT IN 关联方清单.已披露关联方名单 && (通过穿透发现与企业管理层存在关联) && (销售合同.单价 > 分析表.非关联方可比价格 * 1.2 或 < 分析表.非关联方可比价格 * 0.8)
  description: 交易对手虽未披露为关联方，但实际存在关联关系，且交易价格偏离市场公允价值20%以上，属于规避披露的关联不公允交易。
  audit_item: 未按规定确认收入
  suspicion: 通过未披露关联方进行显失公允的交易
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第36号——关联方披露\",\n    \"法规文号\": \"财会[2006]3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"下列各方构成企业的关联方：……（十）该企业主要投资者个人、关键管理人员或与其关系密切的家庭成员控制、共同控制或施加重大影响的其他企业。\"\n  }\n]"
- expression: ((检测报告.脂肪酸值 == 检测报告.脂肪酸值) && (实际收储库点地址、数量、批次、轮出粮食批号、轮入粮食批号.轮出粮食批号 == 实际收储库点地址、数量、批次、轮出粮食批号、轮入粮食批号.轮入粮食批号 ||
    行驶路线、停留点、装卸地点、轨迹坐标.行驶路线 == 行驶路线、停留点、装卸地点、轨迹坐标.行驶路线)) && (联方清单.买方名称 == 联方清单.卖方名称 || 资金收付方名称、金额、结算日期.资金流向为闭环)
  description: 当轮入新粮质量指标与轮出陈粮完全一致，或出入库批号一致，或运输轨迹显示粮食未离开库区，同时买卖双方为关联方或资金形成闭环，即构成虚假轮换，以陈粮顶新粮骗取轮换差价补贴。
  audit_item: 落实“六稳”“六保”政策存在的其他问题
  suspicion: 虚假轮换以陈顶新套取补贴
  regulation: "[\n  {\n    \"法规名称\": \"《粮食流通管理条例》\",\n    \"法规文号\": \"国务院令第407号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第四十三条\",\n    \"内容概述\": \"禁止以陈顶新、虚假轮换等手段套取财政补贴，对违规企业应责令改正、追回补贴并处罚款。\"\n  },\n  {\n    \"法规名称\": \"《中央储备粮油轮换管理办法》\"\
    ,\n    \"法规文号\": \"国粮发〔2012〕147号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\",\n    \"内容概述\": \"严禁变换名义进行库存不动、批号不变的虚假轮换，一经查实"
- expression: ( 关联方交易明细表.交易对手名称 IN (关联方清单.关联方名称) ) && ( 关联方交易明细表.定价依据及公允性说明 != '独立第三方评估' ) && ( ABS(关联方交易明细表.交易价格 - 评估报告.评估价值)
    / 评估报告.评估价值 > 0.05 )
  description: 本表达式识别与关联方交易且定价不公允的疑点。首先判定交易对手是否为内部清单认定的关联方，然后核查其定价依据是否独立于交易双方。若定价并非基于独立第三方评估，且最终成交价格与独立评估价值偏差超过5%，则高度怀疑该交易为通过非公允价格向关联方输送利益。
  audit_item: 违规处置重大资产
  suspicion: 违规决策通过关联方交易转移资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"国家出资企业的关联方不得利用与国家出资企业之间的交易，谋取不当利益，损害国家出资企业利益。\"\n  },\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\"\
    ,\n    \"法规文号\": \"国务院国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"企业国有资产交易发生关联交易的，应当符合国"
- expression: (担保对象名称、是否集团内企业标识.是否集团内企业标识 == 否 || 关联方清单.股权关系 == 无) && 批准文件.批复文号 == null
  description: 根据制度规定，为集团外企业提供担保必须取得国资委或集团总部书面批准。若被担保对象经股权穿透不属于集团内企业，且无有效批复文件，即构成违规。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 未经批准违规为集团外企业提供担保
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、严格控制融资担保对象\",\n    \"内容概述\": \"中央企业严禁对集团外无股权关系的企业提供任何形式担保。\"\n  }\n]"
- expression: 债券资金使用台账.收款方 IN (关联方清单.关联企业名称) && (合同协议.合同服务内容 IS NULL || 合同协议.合同金额 / 市场公允价 > 1.5 || 合同协议.验收确认日期 IS NULL)
  description: 当收款方为关联企业，且对应合同无实质性服务内容、或合同价格超出市场公允价50%以上、或无成果验收记录，即认定为无商业实质的关联交易，目的在于转移债券资金。
  audit_item: 保障性安居工程企业债券使用不合规
  suspicion: 通过虚构关联交易转移债券资金
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强企业债券存续期监管工作有关问题的通知\",\n    \"法规文号\": \"发改办财金〔2011〕1765号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、（一）\",\n    \"内容概述\": \"严禁通过关联交易、虚构交易等方式变相挪用或抽逃债券资金。\"\n  }\n]"
