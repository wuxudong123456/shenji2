name: audit/清单名册类/兼职名单
type: model
description: 从清单名册类类文档（兼职名单）中提取结构化元数据。涵盖字段如：任职起始时间、兼职协会、兼职职务、原单位职务、姓名、审批状态。文档范围包括：兼职名单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 审批
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 兼职名单
  member_count: 1
  member_details:
  - 兼职名单
output:
  fields:
  - name: 任职起始时间
    type: date
    description: 提取 任职起始时间 的日期值，格式 YYYY-MM-DD
  - name: 兼职协会
    type: string
    description: 提取 兼职协会 的文本值
  - name: 兼职职务
    type: string
    description: 提取 兼职职务 的文本值
  - name: 原单位职务
    type: string
    description: 提取 原单位职务 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (兼职名单.姓名 IN 名册 AND 兼职名单.审批状态 = '未审批') OR (名册.退休时间 IS NOT NULL AND 兼职名单.任职起始时间 - 名册.退休时间 < 3年 AND 兼职名单.领取报酬 =
    true AND 名册.原职务 关联 兼职名单.兼职协会)
  description: 在职公务员未经批准在协会兼职，或退休公务员在脱钩后3年内到原管辖业务的协会任职并领取薪酬，满足任一条件即生成疑点。退休时间差<3年且存在利益关联的判定为高风险。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 公务员违规在行业协会商会任职兼职
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"中华人民共和国主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十四条、第一百零七条\",\n    \"内容概述\": \"公务员不得在营利性组织中兼任职务；辞去公职或退休后，原系领导成员的公务员在离职三年内不得到与原工作业务直接相关的企业或者其他营利性组织任职。\"\n  }\n]"
