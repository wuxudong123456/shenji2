name: audit/清单名册类/监测清单
type: model
description: 从清单名册类类文档（监测清单）中提取结构化元数据。涵盖字段如：内容、发布平台、发布时间、涉事主体。文档范围包括：网络平台野生鱼关键词监测清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 监测清单
  member_count: 1
  member_details:
  - 网络平台野生鱼关键词监测清单
output:
  fields:
  - name: 内容
    type: string
    description: 提取 内容 的文本值
  - name: 发布平台
    type: string
    description: 提取 发布平台 的文本值
  - name: 发布时间
    type: date
    description: 提取 发布时间 的日期值，格式 YYYY-MM-DD
  - name: 涉事主体
    type: string
    description: 提取 涉事主体 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (监测清单.内容 CONTAINS ('长江野生' OR '野生江鲜' OR '江鱼')) AND (监测清单.涉事主体 NOT IN (SELECT 企业名称 FROM 档案 WHERE 许可证类型 = '捕捞许可证')
    OR 登记表.来源证明 IS NULL)
  description: 1. 在宣传中使用‘长江野生’等明示或暗示来自长江野生鱼类的用语，若无法提供有效捕捞许可证或渔获物来源证明，视为虚假宣传；2. 即使持有许可，但采购记录中无对应合法野生鱼来源证明的，同样构成虚假宣传。
  audit_item: 违法捕捞售卖长江流域水生生物
  suspicion: 以“长江野生鱼”等为噱头作虚假宣传
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国长江保护法\",\n    \"法规文号\": \"中华人民共和国主席令第65号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十四条\",\n    \"内容概述\": \"餐饮经营者不得以‘长江野生鱼’‘野生江鲜’等为噱头，误导消费者。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国广告法\",\n    \"法规文号\"\
    : \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"广告不得含有虚假或者引人误解的内容，不得欺骗、误导消费者"
