name: audit/清单名册类/重叠清单
type: model
description: 从清单名册类类文档（重叠清单）中提取结构化元数据。涵盖字段如：客户区域分布、收入金额、毛利水平、重叠业务产品/服务名称。文档范围包括：下属企业与上市公司业务重叠清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 金额
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 重叠清单
  member_count: 1
  member_details:
  - 下属企业与上市公司业务重叠清单
output:
  fields:
  - name: 客户区域分布
    type: string
    description: 提取 客户区域分布 的文本值
  - name: 收入金额
    type: number
    description: 提取 收入金额 的数值（含单位，如万元、吨等）
  - name: 毛利水平
    type: string
    description: 提取 毛利水平 的文本值
  - name: 重叠业务产品-服务名称
    type: string
    description: 提取 重叠业务产品-服务名称 的文本值
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (当前日期 > 承诺书.承诺解决同业竞争的最后期限) && (重叠清单.收入金额 > 0 || 重叠清单.客户区域分布)
  description: 该表达式判断企业在承诺期限到期后，是否仍存在实质性的同业竞争业务。只要重叠业务仍有收入流水或共享同区域客户，即判定为未完成承诺，属于严重失信行为。
  audit_item: 国有企业重点改革任务推进方面存在的问题
  suspicion: 未按承诺时限解决下属企业与上市公司同业竞争
  regulation: "[\n  {\n    \"法规名称\": \"上市公司监管指引第4号——上市公司及其相关方承诺\",\n    \"法规文号\": \"中国证监会公告[2022]16号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"承诺人应当严格履行其作出的各项承诺，不得擅自变更或者豁免。承诺人确需变更或豁免承诺的，应当严格按照相关规定履行决策程序和信息披露义务。\"\
    \n  }\n]"
