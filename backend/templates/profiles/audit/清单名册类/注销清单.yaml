name: audit/清单名册类/注销清单
type: model
description: 从清单名册类类文档（注销清单）中提取结构化元数据。涵盖字段如：渔船编号、证书注销日期。文档范围包括：捕捞证书注销清单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 清单名册类
- 审计
- 元数据提取
template_class:
  category: 清单名册类
  member_types:
  - 注销清单
  member_count: 1
  member_details:
  - 捕捞证书注销清单
output:
  fields:
  - name: 渔船编号
    type: string
    description: 提取 渔船编号 的文本值
  - name: 证书注销日期
    type: date
    description: 提取 证书注销日期 的日期值，格式 YYYY-MM-DD
  - name: 名单名称
    type: string
    description: 名单/清单全称
    required: false
  - name: 编制单位
    type: string
    description: 编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 名单条目数
    type: number
    description: 名单包含的条目/人数
    required: false
  - name: 名单类型
    type: string
    description: 名单类型（人员/单位/物品等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (明细表.补偿款到账日期 - 注销清单.证书注销日期) < 0 || (注销清单.证书注销日期 IS NULL AND 明细表.补偿款到账日期 IS NOT NULL) || (跟踪表.拆解/回收完成日期 IS NULL
    AND 明细表.补偿款到账日期 IS NOT NULL)
  description: 当补偿款到账日期早于捕捞证书注销日期（即先补后销）或证书长期未注销而补偿已发、渔船未实际拆解而补偿已发放时，判定为未同步。时间逻辑错误或环节缺失均视为违规。
  audit_item: 补偿制度落实不到位
  suspicion: 补偿发放与渔船处置、捕捞证书注销未同步开展
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农办长渔〔2019〕1号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条第（一）款\",\n    \"内容概述\": \"要求补偿资金发放与渔船分类处置、捕捞许可证撤回注销等工作同步推进，做到证销船毁、及时补偿，防止一船多补和事后返捕。\"\
    \n  }\n]"
