name: audit/财务票据类/发票
type: model
description: 从财务票据类类文档（发票）中提取结构化元数据。涵盖字段如：交通费、付款方、住宿发票明细、住宿日期、住宿金额、供应商、供应商名称、农药名称。文档范围包括：业务合同或发票、企业首笔生产用电记录或销售发票、会议费发票、会议费用报销凭证的发票、会议费结算发票、住宿费发票、农膜销售发票、农药生产企业原材料采购发票、农药采购发票、原始发票等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务票据类
- 审计
- 付款
- 合同
- 明细
- 票据
- 元数据提取
template_class:
  category: 财务票据类
  member_types:
  - 发票
  member_count: 1
  member_details:
  - 业务合同或发票
  - 企业首笔生产用电记录或销售发票
  - 会议费发票
  - 会议费用报销凭证的发票
  - 会议费结算发票
  - 住宿费发票
  - 农膜销售发票
  - 农药生产企业原材料采购发票
  - 农药采购发票
  - 原始发票
  - 发票
  - 接待费用报销凭证发票
  - 服务合同对应发票
  - 秸秆燃料采购发票
  - 购物发票
  - 资产采购发票
  - 车辆购置发票
  - 销售发票
  - 销售记录或发票
