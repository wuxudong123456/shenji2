violations:
- expression: (出差审批单 IS NULL) || (住宿费发票.酒店名称 NOT IN (定点酒店目录.酒店名称) && 住宿费发票.住宿金额 > 差旅住宿费地区标准 || 住宿费发票.住宿日期 NOT BETWEEN 出差审批单.批准起止日期)
  description: 无出差审批单、住宿酒店非定点且价格超过当地差旅住宿费标准、或住宿日期与审批日期不符，均构成违规。定点目录和地区标准依据当地财政部门公布的文件。
  audit_item: 公务接待管理不符合规定
  suspicion: 出差未审批或未入住定点酒店
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关差旅费管理办法\",\n    \"法规文号\": \"财行〔2013〕531号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条、第二十条\",\n    \"内容概述\": \"出差人员应当按规定等级乘坐交通工具，按规定标准住宿；未按规定等级乘坐交通工具和住宿的，超支部分由个人自理。各单位应按规定选择定点饭店住宿。\"\n  }\n]"
- expression: (支出明细账.摘要 LIKE '%礼品%' || 购物发票.品名 IN ('购物卡','提货券','高档茶叶','高档酒','燕窝')) && 支出明细账.金额 > 500 && 支出明细账.会计科目 != '工会经费'
    && 库房领用记录.用途 != '职工慰问'
  description: 通过费用摘要或发票品名识别礼品类支出，单笔金额高于500元（可调整），且排除工会正常福利和员工慰问，若与接待清单时间、对象有关联，则判定为赠送。
  audit_item: 公务接待管理不符合规定
  suspicion: 在公务接待中赠送礼品或礼金
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"不得以任何名义赠送礼金、有价证券、纪念品和土特产品等。\"\n  }\n]"
- expression: ((DAYOFWEEK(接待公函.接待日期) IN (6,7) || 接待公函.接待日期 IN (法定节假日列表)) && 住宿费发票.地址 DISTANCE 被接待人信息.家庭住址 < 100km) || 接待公函.邀请单位
    IS NOT EXIST
  description: 接待发生在周末或节假日，且住宿地点距被接待人家庭地址不足100公里，或无法查到发函单位真实存在，高度怀疑借公务之名搭车报销个人探亲旅游费用。
  audit_item: 公务接待管理不符合规定
  suspicion: 将个人休假探亲费用纳入公务接待报销
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"接待单位应当严格控制国内公务接待范围，不得用公款报销或者支付应由个人负担的费用。\"\n  }\n]"
- expression: (财务凭证.附件完整性 == FALSE OR 发票.货物或应税劳务名称 == '虚开') OR (信息.参保人数 == 0 AND 信息.实缴资本 < 10万) OR (行对账单.收款方 != 原始合同.签订方 AND
    无合法转包协议) OR (行对账单.资金流水)
  description: 构建四条独立触发条件：附件缺失或虚假发票；供应商为空壳公司（社保人数0且注册资本较低）；资金收款方与合同签订方不一致且无转包手续；资金闭环回流。任一条件成立即属套取资金疑点，需全面核查。
  audit_item: 挤占挪用套取财政资金
  suspicion: 虚列支出套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第九条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计账簿，编制财务会计报告。任何单位不得以虚假的经济业务事项或者资料进行会计核算。\"\n  },\n  {\n   \
    \ \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\"\
    : \"国家机关及"
- expression: (关联台账.对应合同编号 IS NULL AND 发票.金额 > 5000) OR (ABS(发票.金额 - 交易合同.合同金额) / 交易合同.合同金额 > 0.1 AND 明细表.审批意见 NOT LIKE '%补充协议%')
  description: 发票无对应合同且金额较大（>5000元），或发票金额与合同金额偏差率超过10%且报销审批未注明补充协议，表明发票业务可能不实。
  audit_item: 未按照规定填制、取得原始凭证或者填制、取得的原始凭证不符合规定
  suspicion: 使用票面记载事项与实际经济业务不符的发票报销入账
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第九条\"\
    ,\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，不得以虚假的经济业务事项或者资料进行会计核算。\"\n  }\n]"
- expression: 错误凭证登记及处理台账.金额错误标志 = '是' AND (错误凭证登记及处理台账.是否重开 = '否' OR 错误凭证登记及处理台账.重开凭证编号 IS NULL OR 更正审批记录文件.处理方式 != '重开')
  description: 原始凭证金额错误必须由出具单位重开，不得在原凭证上更正，缺少重开记录即构成违规。
  audit_item: 未按照规定填制、取得原始凭证或者填制、取得的原始凭证不符合规定
  suspicion: 原始凭证金额错误未重开而直接更正
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财政部令第98号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"原始凭证金额有错误的，应当由出具单位重开，不得在原始凭证上更正。\"\n  }\n]"
- expression: 缺失(会议通知) || 缺失(参会人员签到表) || 缺失(费用原始明细单据) || 缺失(发票) || (参会人员签到表.签到人数 != 发票.金额 / 人均定额 AND ABS(偏差) > 10%)
  description: 每笔会议费报销必须附有完整的支撑材料。若缺少会议通知、签到表、费用明细、发票中的任一项，直接判为违规。此外，若签到人数与费用结算人数逻辑不匹配（如按人头计算的费用），偏差超过10%，则可能存在虚增人数。
  audit_item: 会议费审计
  suspicion: 会议费报销凭证关键附件缺失
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"会议费报销时应当提供会议审批文件、会议通知及实际参会人员签到表、定点会议场所等会议服务单位提供的费用原始明细单据、电子结算单等凭证。\"\n  }\n]"
- expression: (会议费结算发票.开票单位名称 NOT IN 会议定点场所目录.定点场所名称) && (会议费结算发票.金额/参会天数/参会人数 > 对应类别会议综合定额标准)
  description: 若会议召开地点非政府采购的定点场所目录内，且人均综合费用超过规定的综合定额标准（如一类会议650元/人天），则视为违规奢侈消费。表达式结合非定点与超标准双重条件，因定点管理是为控制费用，脱离定点且超标则问题严重。如果非定点但费用未超标，需结合其他因素进一步判断。
  audit_item: 会议费审计
  suspicion: 在非定点场所召开会议且价格超标
  regulation: "[\n  {\n    \"法规名称\": \"党政机关会议定点管理办法\",\n    \"法规文号\": \"财行〔2015〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条、第十四条\",\n    \"内容概述\": \"各级党政机关举办的会议，除现场会等特殊情况外，均应在定点会议场所召开；会议费开支实行综合定额控制，各项费用之间可以调剂使用。\"\n  }\n]"
- expression: 参会人员签到表.签到人数 <= 3 || (会议费发票.金额 >= 本期同类会议平均金额 * 3) || (银行付款凭证.收款方名称 关联 利益关系人)
  description: 若报销的会议没有任何现场照片、视频等痕迹，且签到人数极少（如≤3人），或单笔会议费金额异常巨大（超出同类会议平均3倍），或收款方与本单位人员存在关联关系，则高度疑似虚假会议套现。
  audit_item: 会议费审计
  suspicion: 虚列会议费套取资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条、第二十六条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，不得以虚假的经济业务事项或者资料进行会计核算。\"\n  }\n]"
- expression: (发票.货物或应税劳务名称 包含 '礼品'||'纪念品'||'烟酒'||'旅游'||'景点' || 'KTV') || (会议费报销明细清单.费用项目名称 包含 '参观费'||'门票费')
  description: 若在会议费报销发票或明细清单中出现礼品、纪念品、烟酒、旅游景点门票等与会议业务无关的消费项目，直接判定为违规。会议费只允许列支住宿、伙食、会议室租金、文件印刷、交通等必要开支。
  audit_item: 会议费审计
  suspicion: 会议费中夹带与会议无关的费用
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条、第十六条\",\n    \"内容概述\": \"会议费开支范围包括会议住宿费、伙食费、会议室租金、交通费、文件印刷费等，不得列支与会议无关的其他费用，严禁以任何名义发放纪念品。\"\n  }\n]"
- expression: (明细表.盘盈/盘亏金额 > 0 && 处理记录.审批意见) || (明细表.期末存货数量*最新采购单价 - 账面金额 > 存货余额的5%) || (毛利率同比上升超过10个百分点 && 无涨价因素)
  description: 盘盈未冲减成本直接增加收益，或通过虚列盘点数量导致存货虚增少转成本；毛利率异常飙升也常为少转成本信号。
  audit_item: 未按规定确认成本费用
  suspicion: 多计期末存货或少转营业成本
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十四条、第十五条\",\n    \"内容概述\": \"企业销售存货，应当将成本结转为当期损益；盘盈的存货应冲减当期管理费用或调整相关成本。\"\n  }\n]"
- expression: (发票.最早用电日期或开票日期 IS NOT NULL) && (备案文件 IS NULL || 备案文件.验收备案日期 > 发票.最早用电日期或开票日期) || (对照表.施工完成时间 IS NULL && 许可证.开工日期
    IS NOT NULL)
  description: 判断标准：1.主体工程实际投产（以首笔用电或销售记录为准）时，环保设施尚未通过竣工验收（无验收备案文件或验收日期晚于投产日期），即违反“同时投产使用”；2.环保设施施工未完成但主体工程已开工，即违反“同时施工”。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 环保设施未与主体工程同时设计、施工、投产使用
  regulation: "[\n  {\n    \"法规名称\": \"建设项目环境保护管理条例\",\n    \"法规文号\": \"国务院令第682号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"建设项目需要配套建设的环境保护设施，必须与主体工程同时设计、同时施工、同时投产使用。\"\n  }\n]"
- expression: (发票.最早用电日期或开票日期 IS NOT NULL) && (验收备案日期、备案验收结论、验收结论 IS NULL || 验收备案日期、备案验收结论、验收结论.验收备案日期 > 发票.最早用电日期或开票日期)
  description: 以实际投产迹象（首笔生产用电或销售发票日期）为依据，若此时未取得环保设施竣工验收备案，或验收日期晚于投产日期，即构成“未验先投”。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 环保设施未经验收即投入生产
  regulation: "[\n  {\n    \"法规名称\": \"建设项目环境保护管理条例\",\n    \"法规文号\": \"国务院令第682号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"编制环境影响报告书、环境影响报告表的建设项目，其配套建设的环境保护设施经验收合格，方可投入生产或者使用；未经验收或者验收不合格的，不得投入生产或者使用。\"\n  }\n]"
- expression: (ABS(会计凭证.金额 - 银行对账单.交易金额) > 0.01) || (会计凭证.对方单位名称 NOT IN (业务合同.签约方) AND 会计凭证.金额 > 10万元) || (会计凭证.附件张数 = 0 AND
    会计凭证.金额 > 1万元) || (Benford首位数字分布检验 P值 < 0.01) || (会计凭证.摘要 CONTAINS '账外''小金库')
  description: 金额与银行流水不符、无真实合同支撑的大额交易、原始凭证缺失、数字分布违背Benford定律或摘要出现敏感词，均触发伪造变造疑点。其中ABS(金额差)>0.01为直接可疑；无合同匹配且金额>10万元为严重可疑；无附件且金额>1万元为一般可疑。
  audit_item: 违反会计管理规定的行为
  suspicion: 伪造、变造会计凭证会计账簿及其他会计资料
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第十三条、第四十三条\",\n    \"内容概述\": \"会计凭证、会计账簿和其他会计资料，必须符合国家统一的会计制度的规定，不得伪造、变造。伪造、变造会计凭证、会计账簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\
    \n  }\n]"
- expression: 流水表.收款方名称 IN (档案.供应商名称) && (档案.实际控制人 IN (登记表.亲属姓名)) && (流水表.交易金额 / 档案.成立日期 < 合理的年均业务承载量) && (发票.服务/货物交付证据 IS
    NULL)
  description: 企业资金流向由管理人员亲属控制的供应商，且作为收款方的供应商成立时间短、经营规模显然与该笔交易金额不符，同时缺少实质性交付证据（如验收单、物流单等），高度疑似无真实商业背景的资金支付，实为利益输送。
  audit_item: 违反廉洁从业有关规定问题
  suspicion: 通过虚构业务向特定关系人输送资金
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规\",\n   \
    \ \"条款号\": \"第六条（三）项\",\n    \"内容概述\": \"不得利用职权为配偶、子女及其他特定关系人从事营利性经营活动提供便利条件。\"\n  }\n]"
- expression: 记录表.稀释倍数或每亩用量 != 农药品种、推荐稀释倍数、单位面积用量、每季最多使用次数、安全间隔期天数.推荐稀释倍数 || 记录表.亩用量 > 农药品种、推荐稀释倍数、单位面积用量、每季最多使用次数、安全间隔期天数.单位面积用量
    || 记录表.每季最多使用次数 > 农药品种、推荐稀释倍数、单位面积用量、每季最多使用次数、安全间隔期天数.每季最多使用次数 || (记录表.使用时间 + 农药品种、推荐稀释倍数、单位面积用量、每季最多使用次数、安全间隔期天数.安全间隔期天数)
    < 登记表.种植/采收日期
  description: 判定规则：任何一项条件满足即视为违规。其中稀释倍数不一致（如标注1000倍，实际500倍）、单位面积用量超标、使用频次超标或安全间隔期不足均触发疑点。注意需统一单位后比对。
  audit_item: 农药使用管理不符合规定
  suspicion: 未按农药标注技术要求使用
  regulation: "[\n  {\n    \"法规名称\": \"农药管理条例\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十四条\"\
    ,\n    \"内容概述\": \"农药使用者应当严格按照农药标签标注的使用范围、使用方法和剂量、使用技术要求和注意事项使用农药，不得扩大使用范围、加大用药剂量或者改变使用方法。\"\n  }\n]"
- expression: 农药采购发票.农药名称 IN (禁用农药名称、限用农药名称及受限作物范围.禁用农药名称) || (记录表.农药名称 IN (禁用农药名称、限用农药名称及受限作物范围.限用农药名称及受限作物范围) AND 记录表.作物名称
    NOT IN (禁用农药名称、限用农药名称及受限作物范围.限用农药名称及受限作物范围)) || 管理台账.农药名称 IN (禁用农药名称、限用农药名称及受限作物范围.禁用农药名称)
  description: 判定规则：采购发票或库存台账中出现禁用农药直接判定违规；使用记录中出现限用农药，但所施用的作物不在清单允许范围内视为违规。禁用清单以国家最新公告为准，无豁免条件。
  audit_item: 农药使用管理不符合规定
  suspicion: 违规使用禁用或限用农药
  regulation: "[\n  {\n    \"法规名称\": \"农药管理条例\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十六条\"\
    ,\n    \"内容概述\": \"任何单位和个人不得生产、经营和使用国家明令禁止使用的农药。\"\n  }\n]"
- expression: (出库台账.出库类型 == "销售" && 出库台账.品名.like("%救灾备荒种子%")) || (出库台账.出库类型 == "调拨" && 审批文件.审批编号.isNull()) || (监测表.储备品种 not.in
    审批文件.调用事由 && 监测表.轮换记录.isNull())
  description: 出库类型为销售且品名含救灾备荒种子关键词即直接判定为违规销售；调拨出库记录必须匹配唯一的审批编号，若为空则属私自调用；实际库存中出现计划外品种且无法提供主管部门批准的轮换或调剂手续，视为擅自变更储备作物种类。三种情形直接触犯储备种子动用红线。
  audit_item: 救灾备荒种子储备方面不符合相关规定
  suspicion: 承储企业违规调用、售卖救灾备荒种子或擅自改变储备品种
  regulation: "[\n  {\n    \"法规名称\": \"国家救灾备荒种子储备管理办法\",\n    \"法规文号\": \"农农发〔2015〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条、第十六条\",\n    \"内容概述\": \"储备种子仅限用于农业救灾、备荒等应急情形，未经省级农业农村主管部门批准，任何单位和个人不得动用、销售或进行商业性经营利用；储备品种需保持相对稳定，轮换须报批。\"\
    \n  }\n]"
- expression: (比对表.实际养殖水面面积 < 核对表.申报面积*0.9) || (核对表.申报产量 > 发票.销售数量*1.3 || 核对表.申报产量 > 数据.年度总用电量/数据.单位面积理论最低用电量*1.5)
  description: 当遥感实测面积不足申报面积的90%，或申报产量超出销售记录的130%且超出基于用电量反推产量的150%时，判定为虚报建设成果或产量。单位面积理论最低用电量可根据当地同类养殖模式设定。多条件同时满足可锁定严重虚报。
  audit_item: 水产养殖补助项目建设运营管护不合规
  suspicion: 虚报水产养殖补助项目建设成果骗取资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号（2011年修订）\",\n    \"效力级别\": \"行政法规\",\n \
    \   \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。……（四）以虚报、冒领等手段骗取财政资金。\"\
    \n  },\n  {\n    \"法规名称\": \"中央财政渔业发展补助资金管理办法\",\n    \"法规文号\": \"财农〔2021〕24号\",\n    \"效力级别\": \"部门规章\",\n    \""
