name: audit/资料材料类/申办材料
type: model
description: 从资料材料类类文档（申办材料）中提取结构化元数据。涵盖字段如：发证日期、许可范围。文档范围包括：建筑工程施工许可证申办材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 申办材料
  member_count: 1
  member_details:
  - 建筑工程施工许可证申办材料
output:
  fields:
  - name: 发证日期
    type: date
    description: 提取 发证日期 的日期值，格式 YYYY-MM-DD
  - name: 许可范围
    type: string
    description: 提取 许可范围 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
