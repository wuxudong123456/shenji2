name: audit/资料材料类/立项资料
type: model
description: 从资料材料类类文档（立项资料）中提取结构化元数据。涵盖字段如：项目内容、项目名称、预算资金来源。文档范围包括：基建工程项目立项资料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 项目
- 预算
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 立项资料
  member_count: 1
  member_details:
  - 基建工程项目立项资料
output:
  fields:
  - name: 项目内容
    type: string
    description: 提取 项目内容 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 预算资金来源
    type: number
    description: 提取 预算资金来源 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (明细表.支出科目 CONTAINS ('基建','工程','装修','楼堂馆所') OR 收款方行业类别 == '建筑业') AND (明细表.项目名称 NOT IN (下达日期.预算项目名称)) AND (行对账单.交易对方名称
    == 基建合同.施工方名称)
  description: 筛查支出明细表中包含基建相关关键词或收款方为建筑业，且项目名称不在预算批复的允许范围内，同时银行流水收款方与基建合同施工单位一致。任一条件触发即视为挪用嫌疑，需进一步核实。
  audit_item: 挤占挪用套取财政资金
  suspicion: 挪用财政资金用于基建工程
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得……（二）截留、挪用财政资金；……\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\",\n    \"\
    内容概述\":"
