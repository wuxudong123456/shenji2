name: audit/资料材料类/原始材料
type: model
description: 从资料材料类类文档（原始材料）中提取结构化元数据。涵盖字段如：公示内容、公示影像或网络截图、公示起止日期、劳动合同单位、婚姻状况、工资卡号、申请人姓名、联系电话。文档范围包括：监测对象公示公告原始材料、贷款申请人提交的原始材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 合同
- 薪酬
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 原始材料
  member_count: 1
  member_details:
  - 监测对象公示公告原始材料
  - 贷款申请人提交的原始材料
output:
  fields:
  - name: 公示内容
    type: string
    description: 提取 公示内容 的文本值
  - name: 公示影像或网络截图
    type: string
    description: 提取 公示影像或网络截图 的文本值
  - name: 公示起止日期
    type: date
    description: 提取 公示起止日期 的日期值，格式 YYYY-MM-DD
  - name: 劳动合同单位
    type: string
    description: 提取 劳动合同单位 的文本值
  - name: 婚姻状况
    type: string
    description: 提取 婚姻状况 的文本值
  - name: 工资卡号
    type: string
    description: 提取 工资卡号 的文本值
  - name: 申请人姓名
    type: string
    description: 提取 申请人姓名 的文本值
  - name: 联系电话
    type: string
    description: 提取 联系电话 的文本值
  - name: 购房合同编号
    type: string
    description: 提取 购房合同编号 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: （《监测对象识别纳入审批表》.行政村意见栏 无 签字 或 日期） || （《民主评议会议记录》.参会人数 < 村户籍人口代表比例要求） || （《监测对象公示公告原始材料》.公示日期差 < 5天） || （《审批表》.审批通过日期
    < 《民主评议会议记录》.评议日期）
  description: 程序违规判定规则：1. 审批表上无村两委负责人签字或有签字无日期，视为程序缺失；2. 民主评议参会代表人数不足，无法代表广泛民意；3. 公示公告的起始日到结束日时间差不足5天（或未达当地政策要求的最短公示期），属于假公示或走过场；4.
    审批通过的日期竟然早于民主评议的开会日期，属于典型的先审批后补程序的时间逻辑错误。以上任一条件成立，均判定为识别程序不合规。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 监测对象识别程序缺失民主评议公示
  regulation: "[\n  {\n    \"法规名称\": \"关于健全防止返贫动态监测和帮扶机制的指导意见\",\n    \"法规文号\": \"中农发〔2021〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"二（三）\",\n    \"内容概述\": \"要严格监测对象识别认定程序，坚持公开公平公正原则，由村‘两委’、驻村工作队、包村干部组织开展入户走访、信息比对、民主评议和公示公告，确保群众知情权、参与权、监督权。\"\
    \n  }\n]"
- expression: (异地缴存证明核实记录.核实结果 != '属实') || (DATEDIFF(住房公积金贷款申请清单.申请日期, 异地缴存明细表.缴存开始日期) <= 365 && 异地缴存明细表.缴存单位 != 社保缴纳比对表.参保单位)
    || (异地缴存明细表.缴存期间 与 社保缴纳比对表.参保期间 存在重叠 && 异地缴存明细表.缴存单位 != 社保缴纳比对表.参保单位)
  description: 第一条为证明核实不通过直接判定；第二条为缴存刚满最低期限（12个月）即申请贷款且社保单位与公积金缴存单位不一致，触发骗贷风险；第三条为异地缴存期间本地社保同时缴纳且参保单位不同于缴存单位，具有虚构劳动关系特征。三项满足任一即判定为疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 个人利用虚假异地缴存证明骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，由住房公积金管理中心责令限期退回贷款，并可处骗取金额百分之五以上百分之十以下罚款；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
- expression: (ABS(购房合同备案信息表.成交价格 - 房屋市场评估报告.评估价值) / 房屋市场评估报告.评估价值 > 0.2) && (贷款资金流向追踪表.收款账户 != 购房合同备案信息表.卖方账户 || 贷款资金流向追踪表.资金最终流向
    关联 购房合同备案信息表.购房人账户) || (SELECT COUNT(*) FROM 购房合同备案信息表 WHERE 房屋地址 = 本房屋地址) > 1
  description: 一是合同成交价格虚高，超出评估价20%以上，且贷款资金未按约定支付给卖方或最终回流至借款人关联账户；二是同一房屋地址在备案信息中有多条记录，涉嫌一房多贷。满足任一条件即为违规疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 个人利用虚假购房合同骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，由住房公积金管理中心责令限期退回贷款，并可处骗取金额百分之五以上百分之十以下罚款；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
- expression: (中介机构服务合同.服务内容 LIKE '%公积金缴存%' || 中介机构服务合同.服务内容 LIKE '%代缴%') && (住房公积金贷款申请清单.申请人ID 的 社保缴纳比对表.参保单位 != 异地缴存明细表.缴存单位)
    && (异地缴存明细表.缴存基数 > 社保缴纳比对表.参保单位 行业平均水平 3倍 或 缴存基数 = 缴存上限) && (DATEDIFF(住房公积金贷款申请清单.申请日期, 异地缴存明细表.缴存开始日期) <= 180)
  description: 中介合同明确包含代缴或挂靠缴存服务；缴存单位与社保单位不一致；缴存基数畸高或按封顶线缴存；且缴存时间刚好满足最低6个月要求即申请贷款。四项条件同时满足，为典型中介虚构劳动关系骗贷。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 中介机构协助虚构劳动关系骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，责令限期退回贷款，可罚款；构成犯罪的，追究刑事责任。\"\n  },\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"\
    法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"单位应当按时、足额缴存住房公积金，不得逾期缴存或者少缴；职工个人缴存的住"
