name: audit/资料材料类/举报材料
type: model
description: 从资料材料类类文档（举报材料）中提取结构化元数据。涵盖字段如：举报人信息、举报内容、举报描述、关于领导干部参与经营活动的举报内容、核查结论、涉及代持线索、涉及企业名称、被举报人。文档范围包括：信访举报材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 举报材料
  member_count: 1
  member_details:
  - 信访举报材料
output:
  fields:
  - name: 举报人信息
    type: string
    description: 提取 举报人信息 的文本值
  - name: 举报内容
    type: string
    description: 提取 举报内容 的文本值
  - name: 举报描述
    type: string
    description: 提取 举报描述 的文本值
  - name: 关于领导干部参与经营活动的举报内容
    type: string
    description: 提取 关于领导干部参与经营活动的举报内容 的文本值
  - name: 核查结论
    type: string
    description: 提取 核查结论 的文本值
  - name: 涉及代持线索
    type: string
    description: 提取 涉及代持线索 的文本值
  - name: 涉及企业名称
    type: string
    description: 提取 涉及企业名称 的文本值
  - name: 被举报人
    type: string
    description: 提取 被举报人 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (党员领导干部个人事项报告表.填报的经商办企业情况 IS NULL OR 党员领导干部个人事项报告表.投资企业名称 NOT CONTAINS 企业名称) AND (工商注册登记信息.股东/发起人姓名及身份证号 = 领导干部身份证号
    OR 工商注册登记信息.法定代表人姓名及身份证号 = 领导干部身份证号) AND (工商注册登记信息.出资比例 > 0) AND (工商注册登记信息.企业状态 = '存续')
