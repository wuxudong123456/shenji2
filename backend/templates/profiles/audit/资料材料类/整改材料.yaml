name: audit/资料材料类/整改材料
type: model
description: 从资料材料类类文档（整改材料）中提取结构化元数据。涵盖字段如：整改结果、既往承包问题描述。文档范围包括：历史审计报告整改材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 整改
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 整改材料
  member_count: 1
  member_details:
  - 历史审计报告整改材料
output:
  fields:
  - name: 整改结果
    type: boolean
    description: 提取 整改结果 的布尔值（是/否）
  - name: 既往承包问题描述
    type: string
    description: 提取 既往承包问题描述 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
