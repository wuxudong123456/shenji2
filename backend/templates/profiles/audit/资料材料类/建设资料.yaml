name: audit/资料材料类/建设资料
type: model
description: 从资料材料类类文档（建设资料）中提取结构化元数据。涵盖字段如：功能清单、系统验收报告。文档范围包括：灌区信息化管理系统建设资料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 验收
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 建设资料
  member_count: 1
  member_details:
  - 灌区信息化管理系统建设资料
output:
  fields:
  - name: 功能清单
    type: string
    description: 提取 功能清单 的文本值
  - name: 系统验收报告
    type: string
    description: 提取 系统验收报告 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (投标文件.信息化建设合同签订及完工日期 IS NULL) || (数据台账.数据更新时间 > 审计日期 - 365天) || (系统验收报告.功能清单 < 规划要求功能数)
  description: 判定依据分为三类且为“或”关系：1. 根本未签订信息化建设合同；2. 虽有系统但数据长期不更新（如更新时间已超过1年，表明系统处于瘫痪或未使用状态）；3. 建成的系统功能模块数量少于项目实施方案或上级规划中要求的功能数量。满足任一条件即判定为未有效开展“一张图”管理。
  audit_item: 大中型灌区规划、建设不符合相关规定
  suspicion: 未开展灌区“一张图”信息化管理
  regulation: "[\n  {\n    \"法规名称\": \"关于大力推进智慧水利建设的指导意见\",\n    \"法规文号\": \"水信息〔2022〕18号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第三条\",\n    \"内容概述\": \"全面推进水利工程智能化改造，加强水利一张图建设与应用，提升水利数字化、网络化、智能化水平。\"\n  }\n]"
