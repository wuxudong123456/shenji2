name: audit/资料材料类/论证材料
type: model
description: 从资料材料类类文档（论证材料）中提取结构化元数据。涵盖字段如：与绩效目标的对应关系、全部预期产出与效益描述、实施条件分析、是否通过专家评审、论证结论、需求分析章节、项目名称、项目预期成果描述。文档范围包括：项目可行性研究报告或立项论证材料、项目立项论证材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 项目
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 论证材料
  member_count: 1
  member_details:
  - 项目可行性研究报告或立项论证材料
  - 项目立项论证材料
output:
  fields:
  - name: 与绩效目标的对应关系
    type: string
    description: 提取 与绩效目标的对应关系 的文本值
  - name: 全部预期产出与效益描述
    type: string
    description: 提取 全部预期产出与效益描述 的文本值
  - name: 实施条件分析
    type: string
    description: 提取 实施条件分析 的文本值
  - name: 是否通过专家评审
    type: boolean
    description: 提取 是否通过专家评审 的布尔值（是/否）
  - name: 论证结论
    type: string
    description: 提取 论证结论 的文本值
  - name: 需求分析章节
    type: string
    description: 提取 需求分析章节 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目预期成果描述
    type: string
    description: 提取 项目预期成果描述 的文本值
  - name: 项目预期成果清单
    type: string
    description: 提取 项目预期成果清单 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (绩效目标申报表.总目标 = '无' OR 绩效目标申报表.总目标 LIKE '%定性描述%') && (预算编制说明及依据材料.设定依据说明 IS NULL OR 项目可行性研究报告或立项论证材料.文件编号 IS
    NULL) && (制度文件.论证审核流程 = '缺失')
  description: 该表达式用于筛查绩效目标设定依据不充分的疑点。当‘绩效目标申报表’中的总目标为空或仅包含无法量化的模糊定性描述（如‘提升’、‘改善’），且‘预算编制说明及依据材料’中未提供任何政策文件、数据等依据，或部门未提供对应的‘项目可行性研究报告’等立项论证材料，同时经核实其内部‘制度文件’缺少对目标设定的论证审核流程要求时，判定为高度可疑，属于目标设定依据不充分违规。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定依据不充分
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"各部门、各单位应当按照国务院财政部门制定的政府收支分类科目、预算支出标准和要求，以及绩效目标管理等预算编制规定，根据其依法履行职能和事业发展的需要以及存量资产情况，编制本部门、本单位预算草案。\"\
    \n  },\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行"
- expression: (绩效目标申报表.产出指标 IS NULL OR 绩效目标申报表.效益指标 IS NULL OR 绩效目标申报表.满意度指标 IS NULL) && (项目可行性研究报告或立项论证材料.项目预期成果清单 != '无'
    OR 年度工作计划.重点工作目标 != '缺失')
  description: 此表达式用于侦测绩效目标覆盖不完整。当‘绩效目标申报表’中财务部规定的核心指标（如产出、效益、满意度）有一项或多项完全缺失（IS NULL），但审核其立项源头，如‘项目可行性研究报告或立项论证材料’中却明确描述了相关的预期成果，或‘年度工作计划’中对该项工作有明确的多维度目标要求，说明申报表未能完整转化应设定的全部目标，构成不完整式违规。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定不完整，缺失核心指标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十一条\",\n    \"内容概述\": \"各部门、各单位应当按照国务院财政部门制定的绩效目标管理办法，设置指向明确、细化量化、合理可行的项目支出绩效目标，并作为编制和安排预算的重要依据。\"\n  },\n  {\n\
    \    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n  \
    \  \"内容概述"
