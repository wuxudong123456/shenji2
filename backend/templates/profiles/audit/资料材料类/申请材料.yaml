name: audit/资料材料类/申请材料
type: model
description: 从资料材料类类文档（申请材料）中提取结构化元数据。涵盖字段如：代办人姓名、企业营业执照、低保证/残疾证等、借款企业名称、失业登记证明、婚姻证明编号、家庭人口数、居住证。文档范围包括：保障待遇申请材料、农村集体经济组织产权登记申请材料、创业担保贷款申请材料、就业补助资金申请材料、殡葬服务费用减免申请材料、职业技能鉴定补贴申请材料、职工住房公积金提取申请材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 人员
- 合同
- 登记
- 金额
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 申请材料
  member_count: 1
  member_details:
  - 保障待遇申请材料
  - 农村集体经济组织产权登记申请材料
  - 创业担保贷款申请材料
  - 就业补助资金申请材料
  - 殡葬服务费用减免申请材料
  - 职业技能鉴定补贴申请材料
  - 职工住房公积金提取申请材料
