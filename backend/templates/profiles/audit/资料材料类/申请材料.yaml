violations:
- expression: (明细表.缴费主体类型='农村集体经济组织' && 明细表.收费项目 IN ('不动产登记费','工本费','测绘费') && 明细表.实收金额 > 0)
  description: 根据财税〔2019〕45号等政策，对农村集体经济组织办理不动产登记应免收登记费、工本费等。只要存在缴费主体为农村集体经济组织且收费项目属于政策规定免征范围且实际收费金额大于0的记录，即判定为违规，无需设定金额阈值。
  audit_item: 政策支持落实和监督检查不到位
  suspicion: 免收不动产登记费政策落实不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于免征不动产登记费的通知\",\n    \"法规文号\": \"财税〔2019〕45号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第一条\",\n    \"内容概述\": \"对申请办理不动产登记的农村集体经济组织，免征不动产登记费。\"\n  }\n]"
- expression: ((数据.年度应税收入 / 核验名单.家庭人口 / 12 > 低保标准金额.低保标准金额) || (信息.权利人身份证号 = 核验名单.保障对象身份证号 && (信息.房屋面积 > 免计面积 || 非唯一住房)) ||
    (信息.车主身份证号 = 核验名单.保障对象身份证号 && 信息.车辆价值 > 限额)) && (核验名单.保障状态 = "在保")
  description: 计算税务系统反映的家庭人均月收入，与当地低保标准比较，超过标准即触发；家庭拥有非基本生活住房或高价值车辆等财产，即使收入未超标也视为不符合财产条件；以上任一情形成立且对象仍在发放低保金，即为违规嫌疑。
  audit_item: 向不符合条件的人员发放保障待遇
  suspicion: 低保对象家庭收入超标仍违规享受低保
  regulation: "[\n  {\n    \"法规名称\": \"《社会救助暂行办法》\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十一条、第十二条\",\n    \"内容概述\": \"最低生活保障以家庭收入和财产状况认定；对家庭人均收入低于当地低保标准且财产符合规定的家庭，给予低保，并实施动态管理，对不符合条件的应停发。\"\n  }\n]"
- expression: (核验名单.申报残疾等级 < 库.实际评定等级) && (明细表.补贴项目名称 = "重度残疾人护理补贴")
  description: 残疾等级数字越小代表残疾程度越重，申报等级重于实际等级即表示伪造更严重的残疾程度；同时仍在领取只针对重度残疾的护理补贴，即判定为骗取行为。
  audit_item: 向不符合条件的人员发放保障待遇
  suspicion: 伪造残疾等级骗取重度残疾人护理补贴
  regulation: "[\n  {\n    \"法规名称\": \"《国务院关于全面建立困难残疾人生活补贴和重度残疾人护理补贴制度的意见》\",\n    \"法规文号\": \"国发〔2015〕52号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"二（一）\",\n    \"内容概述\": \"重度残疾人护理补贴主要补助残疾人因残疾产生的额外长期照护支出，对象为残疾等级被评定为一级、二级且需要长期照护的重度残疾人。\"\n\
    \  }\n]"
- expression: (信息.户籍所在地 != 本地 && 缴纳记录.累计缴纳月数 < 政策文件.对外来务工人员户籍、居住或社保缴纳年限要求) && (分配名单.承租人身份证号 对应存在分配记录)
  description: 非本地户籍申请人的社保累计缴纳月数未达到政策规定的最低年限，却已获得公租房分配，即构成违规。同时检查居住证连续居住时间是否达标。
  audit_item: 向不符合条件的人员发放保障待遇
  suspicion: 不符合户籍或居住年限违规享受公租房保障
  regulation: "[\n  {\n    \"法规名称\": \"《公共租赁住房管理办法》\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条、第九条\",\n    \"内容概述\": \"申请公共租赁住房，应当符合以下条件：在本地无住房或者住房面积低于规定标准；收入、财产低于规定标准；申请人为外来务工人员的，在本地稳定就业达到规定年限。\"\n \
    \ }\n]"
- expression: (发放明细表.身份证号/统一社会信用代码 NOT IN (SELECT 身份证号 FROM 核验记录 WHERE 社保缴纳状态='中断')) || (发放明细表.身份证号/统一社会信用代码 NOT IN (SELECT
    身份证号 FROM 核验记录 WHERE 失业登记有效状态='有效')) || (发放明细表.身份证号/统一社会信用代码 IN (SELECT 统一社会信用代码 FROM 结果 WHERE 企业注销/吊销/经营异常状态 IN ('注销','吊销')))
    || (申请材料.低保证/残疾证等==1)
  description: 违规判定逻辑：发放对象若未在社保系统中显示为中断缴费状态、未在失业登记数据库中处于有效状态、企业已被注销/吊销，或者申请时缺失失业证明、低保证等关键证明，即触发违规预警。多个条件为或关系，满足任意一项即为疑点。
  audit_item: 违规发放资金或补贴
  suspicion: 违规向不符合条件对象发放就业补助资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国就业促进法\",\n    \"法规文号\": \"中华人民共和国主席令第七十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十五条、第四十九条\",\n    \"内容概述\": \"国家实行有利于促进就业的财政政策，就业专项资金必须专款专用，不得挤占挪用；各级人民政府应规范就业专项资金的使用管理，确保资金用于符合条件的补贴对象。\"\n  },\n\
    \  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条、第十七条\""
- expression: (提取人姓名.购房合同编号 != 核查证明.购房合同编号 || 提取人姓名.婚姻证明编号 != 核查证明.登记日期 || 核查证明.交易状态 = '无效' || 核查证明.婚姻状态 != 提取人姓名.婚姻证明编号)
    && (比对表.提取次数 > 1 || 转账凭证.对方账户名称 != 对方户名 || (分析表.购房所在地 != 分析表.提取人工作地 && 购房所在地 != 户籍地))
  description: 申请材料编号与权威部门核查结果不一致为直接造假标志；若同时满足同一房产多人提取、资金未进入交易方账户或异地购房与工作地、户籍地均无关联等异常特征，则判定为个人利用虚假材料违规提取。阈值为同一房产提取次数>1即触发，异地购房需三地不匹配。
  audit_item: 违规提取住房公积金
  suspicion: 个人使用虚假购房或婚姻证明骗取公积金提取
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十四条、第五十一条\",\n    \"内容概述\": \"第二十四条明确职工可提取住房公积金的七类情形，必须基于真实住房消费；第五十一条规定以欺骗手段提取住房公积金的，责令限期退回，可处罚款，构成犯罪的依法追究刑事责任。\"\n\
    \  }\n]"
- expression: 中介机构关联记录.关联提取申请编号 > 3 && (同一代办人出现次数 >= 3 || 同一联系电话出现次数 >= 3 || 同一IP地址申请数 >= 5) && (转账凭证.收款账户名称 || 资金存在向中介账户转账记录
    || 提取人账户有明确手续费扣减特征)
  description: 同一中介机构或代办人关联多起提取案例，配合使用重复联系方式、IP地址，且资金流中出现非本人收款或向中介机构分账迹象，即可认定为中介机构组织或参与团伙骗提。关联次数阈值设为3起，电话号码和代办人次阈值3次，IP达到5次。
  audit_item: 违规提取住房公积金
  suspicion: 中介机构协助多人伪造材料骗取公积金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第五十一条\",\n    \"内容概述\": \"以欺骗手段提取住房公积金的，由住房公积金管理中心责令限期退回所提取款项，并处以罚款；构成犯罪的，依法追究刑事责任。中介机构协助骗提属于共同违法，应予查处。\"\n  },\n  {\n\
    \    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二百八十条\",\n \
    \   \"内容概"
- expression: 申请材料.证书编号 NOT IN (官方数据库.证书编号) || 同一身份证号 在补贴发放明细表中出现次数 > 1
  description: 若申请补贴的证书编号在官方数据库中不存在，或同一人员身份证号对应多次补贴发放记录（排除不同等级补贴），则判定为利用虚假证书或重复申领骗取补贴。严重违规：单批次虚假证书占比超过申请量的20%。
  audit_item: 骗取、套取资金或补贴
  suspicion: 利用虚假证书骗取职业技能鉴定补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"职业技能鉴定补贴资金必须用于对参加职业技能鉴定并取得职业资格证书或专项职业能力证书人员的补贴，任何单位和个人不得伪造证书骗取补贴。\"\n  },\n  {\n    \"法规名称\"\
