name: audit/资料材料类/分析材料
type: model
description: 从资料材料类类文档（分析材料）中提取结构化元数据。涵盖字段如：建议纠正措施、指标实际完成值、监控指标清单、问题发现日期、问题描述。文档范围包括：绩效运行监控分析材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 分析材料
  member_count: 1
  member_details:
  - 绩效运行监控分析材料
output:
  fields:
  - name: 建议纠正措施
    type: string
    description: 提取 建议纠正措施 的文本值
  - name: 指标实际完成值
    type: string
    description: 提取 指标实际完成值 的文本值
  - name: 监控指标清单
    type: string
    description: 提取 监控指标清单 的文本值
  - name: 问题发现日期
    type: date
    description: 提取 问题发现日期 的日期值，格式 YYYY-MM-DD
  - name: 问题描述
    type: string
    description: 提取 问题描述 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
