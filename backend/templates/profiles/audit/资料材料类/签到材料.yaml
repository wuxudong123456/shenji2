name: audit/资料材料类/签到材料
type: model
description: 从资料材料类类文档（签到材料）中提取结构化元数据。涵盖字段如：地点、活动日期、签到记录。文档范围包括：公务活动日志或会议签到材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 签到材料
  member_count: 1
  member_details:
  - 公务活动日志或会议签到材料
output:
  fields:
  - name: 地点
    type: string
    description: 提取 地点 的文本值
  - name: 活动日期
    type: date
    description: 提取 活动日期 的日期值，格式 YYYY-MM-DD
  - name: 签到记录
    type: string
    description: 提取 签到记录 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (明细表.消费日期, 明细表.消费城市) 不在 审批文件.计划行程城市 && (明细表.消费日期 与 出入境记录.出入境日期 匹配) && (明细表.费用类别 == '交通' || 明细表.费用类别 == '住宿'
    || 明细表.费用类别 == '餐饮')
  description: 若报销的费用发生日期在出入境记录的境外停留期间，但消费城市不在审批的公务行程计划范围内，且属于交通、住宿、餐饮等刚性支出，则高度怀疑虚列行程或绕道旅游。该表达式需结合出入境记录的精确日期进行时空匹配。
  audit_item: 境外公务未严格落实中央八项规定及实施细则精神
  suspicion: 虚列境外行程套取公务经费
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条、第十三条\",\n    \"内容概述\": \"出国人员应严格按照批准的事由、国家、城市执行，不得擅自更改行程，增加出访国家或城市，不得擅自延长在国外停留时间。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中共中央政治局贯彻落实中央八项规定的实施细则\",\n    \"法规文号\": \"2017年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第三条\",\n    \"内容概述\"\
    : \"严禁以"
