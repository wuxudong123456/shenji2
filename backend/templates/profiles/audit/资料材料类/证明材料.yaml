violations:
- expression: EXISTS (整改验收报告或证明材料.整改完成情况='已退回' AND 相关财务凭证的账务调整记录.借方科目 IN ('其他补贴','劳务费','福利费','加班费') AND ABS(相关财务凭证的账务调整记录.金额
    - 以往审计报告.涉及金额) / 以往审计报告.涉及金额 <= 0.1 AND 相关财务凭证的账务调整记录.凭证日期 BETWEEN 整改验收报告或证明材料.退回到账日期 AND 整改验收报告或证明材料.退回到账日期+60 AND (相关财务凭证的账务调整记录.摘要
    LIKE '%补贴%' OR 相关财务凭证的账务调整记录.摘要 LIKE '%发放%'))
  description: 比对已退回资金问题，检查退款后60天内是否存在科目为敏感补贴类、金额与原违规金额偏差不超过10%的新支出，且摘要含补贴发放等关键词，若存在则高度涉嫌以新科目变相重发资金，属于虚假整改。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 通过重列支出科目虚假整改已退回资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"被审计单位应当按照规定时间整改审计查出的问题，将整改情况报告审计机关。审计机关应当对整改情况进行跟踪检查。\"\n  }\n]"
- expression: 整改任务进度跟踪表.各问题当前状态 IN ('持续推进','部分整改','未整改') AND (被审计单位整改方案.计划整改完成时间 IS NULL OR (当前日期 - 被审计单位整改方案.计划整改完成时间 > 365))
    AND (MAX(整改任务进度跟踪表.最新更新日期) < 当前日期 - 180 OR COUNT(管理层关于整改的会议纪要.会议日期) = 0)
  description: 问题未关闭且超过承诺整改期限一年仍未完成，或未设定明确时限且近半年内无任何进展更新或管理层讨论记录，即判定为拖延整改。365天覆盖一个完整年度，180天（半年）作为无进展监控阈值。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 整改措施长期无实质进展或无限期拖延
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"被审计单位应当按照规定时间整改审计查出的问题，将整改情况报告审计机关。\"\n  }\n]"
- expression: COUNT(以往审计报告.问题编号) - COUNT(整改验收报告或证明材料.已销号问题清单) > 0 AND (以往审计报告.风险等级 = '高' OR (以往审计报告.风险等级 = '中' AND 以往审计报告.涉及金额
    > 500000)) AND (整改任务进度跟踪表.后续计划标记 IS NULL OR 整改任务进度跟踪表.后续计划标记 = '无')
  description: 存在未整改问题，且未整改的是高风险问题，或中等风险但涉及金额超过50万元，同时被审计单位未提供任何后续处理计划或报备记录，则构成选择性整改。风险等级和金额阈值可根据实际调整。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 选择性整改：仅整改简单问题，回避重大风险问题
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"被审计单位应当全面整改审计查出的问题，不得选择性整改。\"\n  }\n]"
- expression: 以往审计报告.问题类型 IN ('固定资产账实不符','存货盘亏','白条入账','内控缺陷') AND 被审计单位整改方案.整改措施 NOT LIKE '%制度%' AND 被审计单位整改方案.整改措施 NOT LIKE
    '%流程%' AND (被审计单位整改方案.整改措施 LIKE '%补录%' OR 被审计单位整改方案.整改措施 LIKE '%调整%' OR 被审计单位整改方案.整改措施 LIKE '%一次性处理%') AND (相关规章制度.新制定或修订的制度文件编码
    IS NULL OR 相关规章制度.发布日期 > 整改验收报告或证明材料.实际完成日期 + 180)
  description: 对于根源在制度或流程的问题，若整改措施仅通过补录数据、账务调整等一次性操作完成，且在整改完成后6个月内未发布相关制度修订文件，即视为治标不治本。关键是通过关键词匹配排除制度性整改措施。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 整改仅治标不治本，未建立长效制度机制
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"被审计单位应当举一反三，健全长效机制。\"\n  }\n]"
- expression: (整改验收报告或证明材料.电子文件创建日期 > 整改验收报告或证明材料.文件落款日期 AND ABS(整改验收报告或证明材料.电子文件创建日期 - 整改验收报告或证明材料.文件落款日期) > 1) OR (同一日期签发的整改关键文件数量
    >= 5) OR (管理层会议纪要.会议日期 NOT IN (会议室使用登记表.使用日期) AND 管理层会议纪要.会议日期 != 会议室使用登记表.使用日期)
  description: 通过文件元数据日期逻辑（创建晚于落款为后补）、集中补签异常（同一天签发大量整改文件）、会议时间与物理空间使用记录矛盾来识别材料造假。创建日期晚于落款日期且相差超过1天，排除时区等误差；同一日期签发5份及以上为异常集中；会议时间无对应会议室使用记录则存疑。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 整改佐证材料事后补编或造假
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"审计整改情况应当真实、完整，不得弄虚作假。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017修正）\"\
    ,\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十三条\",\n    \"内容概述\": \"伪造、变造会计凭证、会计帐簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\n  }"
- expression: (声明表.投标人间关联关系 ⊆ 招标方人员 || 声明表.股东信息 ⊆ 招标方人员亲属) && 记录表.中标单位 = 该投标单位
  description: 核查招标方负责人及以上领导、经办人员及其近亲属是否在投标单位中持有股份或担任高级管理职务，若与中标单位存在此利害关系且未声明回避，即构成违规。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 允许有利害关系企业参与投标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十四条\",\n    \"内容概述\": \"与招标人存在利害关系可能影响招标公正性的法人、其他组织或者个人，不得参加投标。单位负责人为同一人或者存在控股、管理关系的不同单位，不得参加同一标段投标或者未划分标段的同一招标项目投标。\"\
    \n  }\n]"
- expression: (会议日期、签到表、规划讨论内容、决议签字、应到人数、实到人数、签字人数、表决同意人数、主要意见记录.签字人数 / 会议日期、签到表、规划讨论内容、决议签字、应到人数、实到人数、签字人数、表决同意人数、主要意见记录.应到人数
    < 2/3) || (会议日期、签到表、规划讨论内容、决议签字、应到人数、实到人数、签字人数、表决同意人数、主要意见记录.表决同意人数 / 会议日期、签到表、规划讨论内容、决议签字、应到人数、实到人数、签字人数、表决同意人数、主要意见记录.参加人数
    < 0.5) || (公示起始日期、公示结束日期、公示地点照片、公示内容完整性证据.公示天数 < 30) || (公示起始日
  description: 根据《城乡规划法》，村庄规划须经村民会议或村民代表会议讨论同意，参会人数不得少于应到人数的2/3，赞同人数需超过参会人数的1/2；根据《关于城乡规划公开公示的规定》，公示时间不得少于30日；若公示材料缺失或批复日期早于公示结束日期，表明程序倒置或缺失。满足任一条件即触发疑点。
  audit_item: 村庄规划编制质量不高
  suspicion: 村庄规划未履行民主决策与公示程序
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"村庄规划在报送审批前，应当经村民会议或者村民代表会议讨论同意。\"\n  },\n  {\n    \"法规名称\": \"关于城乡规划公开公示的规定\",\n  \
    \  \"法规文号\": \"建规〔2013〕166号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"村庄规划的公示时间不得少于30日，并应在村庄公共场所进行。\"\
    \n  }"
- expression: 区县名称、整合资金总额、整合起始年度.区县名称 NOT IN (县名、脱贫摘帽年份、试点资格.县名) && 区县名称、整合资金总额、整合起始年度.整合资金总额 > 0
  description: 依据国办发〔2016〕22号文件，统筹整合财政涉农资金试点限于国定贫困县。非贫困县实施资金整合即为越权行为。若区县名称不在官方贫困县名单内且整合金额大于零，立即触发违规。
  audit_item: 涉农资金统筹整合不规范
  suspicion: 非贫困县超范围统筹整合涉农资金
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于支持贫困县开展统筹整合使用财政涉农资金试点的意见\",\n    \"法规文号\": \"国办发〔2016〕22号\",\n    \"效力级别\"\
    : \"国务院规范性文件\",\n    \"条款号\": \"一、试点范围\",\n    \"内容概述\": \"试点范围限定为连片特困地区县和国家扶贫开发工作重点县，其他县不得自行开展统筹整合。\"\n  }\n]"
- expression: 公示日期起止.公示天数 < 7 || 公示内容完整性（含补偿清单、监督电话）.补偿清单明细='是' || 公示内容完整性（含补偿清单、监督电话）.监督电话='是' || 公示渠道.公示渠道数量 < 2
  description: 公示期少于7天、公示内容未包含完整的补偿对象名单及金额、缺少监督举报电话、仅在单一渠道（如只在村委张贴而未上网）公示等，均视为信息未充分公开。任意条件触发即判为违规。
  audit_item: 补偿制度落实不到位
  suspicion: 退捕补偿信息未充分公开公示
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农办长渔〔2019〕1号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条第（二）款\",\n    \"内容概述\": \"要求退捕补偿信息必须坚持公开透明，实行张榜公示，公示期不少于7天，公示内容应包括补偿对象、补偿标准、补偿金额、监督电话等，接受社会监督。\"\
    \n  }\n]"
- expression: (发放清单.申报用途 != 使用台账.实际用途描述) || (水对账单.贷款资金去向交易对手 NOT IN (设备供应商、原材料供应商、场地出租方) && 水对账单.交易金额 > 贷款金额的60%) || (水对账单.资金回流标志
    == 1) || (证明材料.设备购置发票及实物照片 < 贷款金额的50% && ABS(信息.纳税申报收入增长率) < 5%)
  description: 通过比对贷款申报用途与实际银行流水去向，判断资金是否用于禁止领域。若申报购买设备，但主要资金流向房地产公司、证券公司、个人账户或用于偿还其他贷款，则触发违规。大额现金提取或资金回流至借款人关联账户是高风险信号。同时，贷后经营数据（如纳税、社保）无显著增长，佐证贷款未用于真实经营的违规事实。
  audit_item: 挤占挪用资金（社保）
  suspicion: 违规挪用创业担保贷款至非申报用途
  regulation: "[\n  {\n    \"法规名称\": \"财政部 人力资源社会保障部 中国人民银行关于进一步做好创业担保贷款工作的通知\",\n    \"法规文号\": \"财金〔2023〕18号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"创业担保贷款应用于借款人创业企业的生产经营活动，不得转借他人使用，不得用于购买股票、期货等有价证券和从事股本权益性投资，不得用于违反国家有关法律、法规的用途。\"\
    \n  },\n  {\n    \"法规名称\": \"个人贷款管理暂行办法\",\n    \"法规文号\": \"中国银行业监督管理委员会令2010年第2号\",\n    \"效力级别"
- expression: (明细表.救助类型='低保' AND 明细表.发放金额>0) AND (比对表.社保缴纳状态='在职' OR ABS(比对表.税务申报收入 - 证明材料.申报收入) > 证明材料.申报收入*0.2 OR 比对表.不动产登记信息
    IS NOT NULL) AND 明细表.身份证号 = 比对表.身份证号
  description: 若低保在保人员实际有在职社保、申报收入与实际收入偏差超20%、或名下有不动产登记，表明收入核定不实，可能存在超额发放。其中，偏差率阈值20%参考常规审计经验，可根据地方细化规定调整。
  audit_item: 社会保障待遇计算、发放错误
  suspicion: 收入核定错误导致低保金超额发放
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十一条、第五十八条\",\n    \"内容概述\": \"申请最低生活保障需如实申报家庭收入财产，县级民政部门应通过信息核对等方式核实；审核审批人员应按规定核实，不得徇私舞弊。\"\n  }\n]"
- expression: 信息表.户籍状态='死亡' AND 应发对象清单.发放日期 >= (出生日期+1个月)
  description: 若发放台账中存在已死亡人员（死亡日期早于发放日期）的记录，则构成虚报冒领。死亡信息以公安户籍系统为准。
  audit_item: 管理单位违反军人抚恤优待政策
  suspicion: 虚报冒领抚恤优待经费
  regulation: "[\n  {\n    \"法规名称\": \"《军人抚恤优待条例》\",\n    \"法规文号\": \"国务院、中央军事委员会令第709号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"抚恤优待经费应当专款专用，任何单位和个人不得贪污、挪用、截留和私分。\"\n  }\n]"
- expression: 记录表.伤残证明编号 NOT IN (军队伤残鉴定系统.有效编号) OR (证明材料.入伍登记表 = NULL AND 无补充说明文件)
  description: 通过跨部门数据验证，发现审批所附关键证明无有效档案支撑，或缺乏法定必备材料，即构成虚假证明或材料不实。
  audit_item: 管理单位违反军人抚恤优待政策
  suspicion: 违规出具虚假证明办理抚恤待遇
  regulation: "[\n  {\n    \"法规名称\": \"《军人抚恤优待条例》\",\n    \"法规文号\": \"国务院、中央军事委员会令第709号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第四十二条\",\n    \"内容概述\": \"军人抚恤优待管理单位及其工作人员在军人抚恤待遇审批工作中弄虚作假的，由上级主管部门责令改正；情节严重的，对直接负责的主管人员和其他直接责任人员依法给予处分。\"\n\
    \  }\n]"
