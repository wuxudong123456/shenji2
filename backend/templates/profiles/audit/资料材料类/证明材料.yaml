name: audit/资料材料类/证明材料
type: model
description: 从资料材料类类文档（证明材料）中提取结构化元数据。涵盖字段如：产出物描述、代领人姓名、代领银行卡号、伤残证明编号、入伍登记表、公示内容完整性、公示内容完整性证据、公示地点照片。文档范围包括：代领人身份证明材料、成果证明材料、投标单位股权结构证明材料、抚恤对象身份证明材料、救助对象证明材料（文件7）、整改验收报告或证明材料、申报贫困县证明材料、相关项目验收报告或成果证明材料、票据交易背景证明材料、补偿信息公示证明材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 合同
- 整改
- 登记
- 票据
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 证明材料
  member_count: 1
  member_details:
  - 代领人身份证明材料
  - 成果证明材料
  - 投标单位股权结构证明材料
  - 抚恤对象身份证明材料
  - 救助对象证明材料（文件7）
  - 整改验收报告或证明材料
  - 申报贫困县证明材料
  - 相关项目验收报告或成果证明材料
  - 票据交易背景证明材料
  - 补偿信息公示证明材料
  - 规划公示证明材料
  - 资本金来源证明材料
