name: audit/资料材料类/影像资料
type: model
description: 从资料材料类类文档（影像资料）中提取结构化元数据。涵盖字段如：GPS坐标、会议现场照片、占用实物证据、同一角度整治前后照片、围墙、堆放点周边环境、墓穴长宽测量值、实际使用状况描述。文档范围包括：会议影像资料、传统村落挂牌影像资料、影像资料、现场勘察影像资料、现场勘查影像资料、现场影像资料、现场核查影像资料、现场检查影像资料、禁捕工作影像资料、隐蔽工程验收影像资料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 会议
- 检查
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 影像资料
  member_count: 1
  member_details:
  - 会议影像资料
  - 传统村落挂牌影像资料
  - 影像资料
  - 现场勘察影像资料
  - 现场勘查影像资料
  - 现场影像资料
  - 现场核查影像资料
  - 现场检查影像资料
  - 禁捕工作影像资料
  - 隐蔽工程验收影像资料
  - 项目现场核查影像资料
output:
  fields:
  - name: GPS坐标
    type: string
    description: 提取 GPS坐标 的文本值
  - name: 会议现场照片
    type: string
    description: 提取 会议现场照片 的文本值
  - name: 占用实物证据
    type: string
    description: 提取 占用实物证据 的文本值
  - name: 同一角度整治前后照片
    type: string
    description: 提取 同一角度整治前后照片 的文本值
  - name: 围墙
    type: string
    description: 提取 围墙 的文本值
  - name: 堆放点周边环境
    type: string
    description: 提取 堆放点周边环境 的文本值
  - name: 墓穴长宽测量值
    type: string
    description: 提取 墓穴长宽测量值 的文本值
  - name: 实际使用状况描述
    type: string
    description: 提取 实际使用状况描述 的文本值
  - name: 实际占地边界
    type: string
    description: 提取 实际占地边界 的文本值
  - name: 实际完工状态影像
    type: boolean
    description: 提取 实际完工状态影像 的布尔值（是/否）
  - name: 实际用途照片
    type: string
    description: 提取 实际用途照片 的文本值
  - name: 封存现场照片
    type: string
    description: 提取 封存现场照片 的文本值
  - name: 当前房屋状态
    type: boolean
    description: 提取 当前房屋状态 的布尔值（是/否）
  - name: 影像证据
    type: string
    description: 提取 影像证据 的文本值
  - name: 拍摄地点
    type: string
    description: 提取 拍摄地点 的文本值
  - name: 拍摄日期
    type: date
    description: 提取 拍摄日期 的日期值，格式 YYYY-MM-DD
  - name: 拍摄时间
    type: date
    description: 提取 拍摄时间 的日期值，格式 YYYY-MM-DD
  - name: 损坏程度评估
    type: string
    description: 提取 损坏程度评估 的文本值
  - name: 排水
    type: string
    description: 提取 排水 的文本值
  - name: 时间水印
    type: date
    description: 提取 时间水印 的日期值，格式 YYYY-MM-DD
  - name: 显示防护设施实际情况
    type: string
    description: 提取 显示防护设施实际情况 的文本值
  - name: 村落名称
    type: string
    description: 提取 村落名称 的文本值
  - name: 检查日期
    type: date
    description: 提取 检查日期 的日期值，格式 YYYY-MM-DD
  - name: 消防设施损坏证据
    type: string
    description: 提取 消防设施损坏证据 的文本值
  - name: 牌体悬挂照片
    type: string
    description: 提取 牌体悬挂照片 的文本值
  - name: 现场实际完工状态
    type: boolean
    description: 提取 现场实际完工状态 的布尔值（是/否）
  - name: 现场运行状态影像
    type: boolean
    description: 提取 现场运行状态影像 的布尔值（是/否）
  - name: 现状用途
    type: string
    description: 提取 现状用途 的文本值
  - name: 签证签字盖章完整性
    type: string
    description: 提取 签证签字盖章完整性 的文本值
  - name: 维修前中后对比照片
    type: string
    description: 提取 维修前中后对比照片 的文本值
  - name: 维修前后现场照片
    type: string
    description: 提取 维修前后现场照片 的文本值
  - name: 警示标识
    type: string
    description: 提取 警示标识 的文本值
  - name: 设备实际运行状态截图
    type: boolean
    description: 提取 设备实际运行状态截图 的布尔值（是/否）
  - name: 豪华墓特征识别
    type: string
    description: 提取 豪华墓特征识别 的文本值
  - name: 边界标志照片
    type: boolean
    description: 提取 边界标志照片 的布尔值（是/否）
  - name: 违规行为描述
    type: string
    description: 提取 违规行为描述 的文本值
  - name: 道路
    type: string
    description: 提取 道路 的文本值
  - name: 部位
    type: string
    description: 提取 部位 的文本值
  - name: 防渗设施
    type: string
    description: 提取 防渗设施 的文本值
  - name: 隔离设施现状
    type: string
    description: 提取 隔离设施现状 的文本值
  - name: 面积
    type: string
    description: 提取 面积 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: （安全防护设施验收记录.实测数据 < 安全专项施工方案.防护等级要求） || （安全专项施工方案.材料规格 != 材料进场验收台账.规格型号） || （监理安全巡视记录.发现问题描述 包含 '防护缺失'/'未按方案设置'/'材质不符'
    且 复查情况 == '未整改'） || （现场影像资料.防护设施实际情况 明显与 安全专项施工方案.防护措施清单 不一致）
  description: 判定规则：1）防护设施验收实测数据低于方案设计标准，安全冗余不足；2）进场材料规格与方案要求型号不符，降低防护强度；3）监理发现防护问题且未整改闭环，表明隐患持续存在；4）影像资料直观反映现场与方案描述不一致。任一条件成立即列为疑点。
  audit_item: 重大工程项目风险预警
  suspicion: 施工现场安全防护措施与方案严重不符
  regulation: "[\n  {\n    \"法规名称\": \"建设工程安全生产管理条例\",\n    \"法规文号\": \"国务院令第393号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"施工单位必须在施工现场采取维护安全、防范危险、预防火灾等措施；应当根据建设工程的施工特点、范围，对施工现场易发生重大事故的部位、环节进行监控，制定施工现场生产安全事故应急救援预案。防护设施必须按方案搭设并经验收合格方可使用。\"\
    \n  }\n]"
- expression: (检测报告.检测频次 < 规范要求最低频次) OR (影像资料.签证签字盖章完整性 OR 时间水印) OR (证明文件.检验批次 不符全批次必检要求 OR 合格证真伪) OR (管理台账.存在问题数 > 0 AND
    整改状态（已闭环/未闭环） != '已闭环') OR (汇总表.评估结论 = '不合格' AND 检测报告.检测结果 = '合格')
  description: 通过检测频次不足、隐蔽工程记录造假、材料未全检、整改未闭环、第三方与自检结果矛盾等多重条件识别质量作弊。任一条件触发即生成疑点，多个条件同时触发判定为高风险。
  audit_item: 农村供水工程建设不符合相关规定
  suspicion: 工程施工质量过程管理不合规
  regulation: "[\n  {\n    \"法规名称\": \"《建设工程质量管理条例》\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十条、第三十一条\",\n    \"内容概述\": \"施工单位必须对隐蔽工程在隐蔽前进行验收并记录，验收记录应当真实、完整；工程使用的材料、构配件必须进行检验，未经检验或检验不合格的不得使用。\"\n  },\n  {\n\
    \    \"法规名称\": \"《水利工程质量管理规定》\",\n    \"法规文号\": \"水利部令第52号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十八条\",\n    \"\
    内容概述\":"
- expression: (审批台账.审批编号 == NULL OR 权属证明.土地证号 == NULL) && 项目清单.占地面积 > 0 && (对照表.规划用地性质 != '殡葬用地' OR 影像资料.现状用途 == '农用地' OR
    影像资料.现状用途 == '林地')
  description: 判定规则：公墓已建设（项目清单中有占地），但用地审批台账或土地权属证明缺失，且实际占地不符合规划用途或涉及转用未批。触犯任一土地性质不符条件即为严重违规。
  audit_item: 农村公益性殡葬建设不符合相关规定
  suspicion: 农村公益性公墓无建设用地手续违规占地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号（2019年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十四条\",\n    \"内容概述\": \"建设占用土地，涉及农用地转为建设用地的，应当办理农用地转用审批手续。\"\n  },\n  {\n    \"法规名称\": \"殡葬管理条例\",\n\
    \    \"法规文号\": \"国务院令第225号（2012年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"建设殡葬设施，应当履行用地审批和规划许可手续，不"
- expression: (项目清单.占地面积 > 政策文件.单墓穴面积上限) OR (验收报告.墓穴数量 < 政策文件.绿化率标准) OR (明细表.墓穴销售收入 > 0 && 明细表.购买人身份 != '本村村民')
  description: 判定规则：①墓穴面积超出标准上限；②绿化率不达标；③存在对外销售营利行为（公益性公墓禁止营利性经营）。三种情形任意满足其一即构成超标准私建或变相经营。
  audit_item: 农村公益性殡葬建设不符合相关规定
  suspicion: 超标准私建农村公益性公墓
  regulation: "[\n  {\n    \"法规名称\": \"殡葬管理条例\",\n    \"法规文号\": \"国务院令第225号（2012年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"公益性公墓不得对外经营，墓穴面积应当符合省、自治区、直辖市人民政府规定的标准。\"\n  },\n  {\n    \"法规名称\": \"民政部关于进一步深化殡葬改革促进殡葬事业发展的指导意见\"\
    ,\n    \"法规文号\": \"民发〔2009〕170号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"三、（七）\",\n    \"内容概述\": \"严格规范公益性公墓管理，墓"
- expression: (记录表.最近一次检修日期距今 > 维护周期要求.维护周期要求) OR (记录表.维修结果记录 IS NULL) OR (举报记录.投诉内容（是否涉及设施损坏）含'设施损坏' && 举报记录.处理情况 == '未修复')
    OR (影像资料.损坏程度评估 > 中等)
  description: 判定规则：①维护周期严重超期或长期无记录；②群众多次投诉设施损坏但未及时修复；③现场勘查发现明显损坏（如围墙倒塌、排水堵塞）视为维护缺失。任何一项触发即构成疑点。
  audit_item: 农村公益性殡葬建设不符合相关规定
  suspicion: 农村公益性墓地设施老化、维护不及时
  regulation: "[\n  {\n    \"法规名称\": \"殡葬管理条例\",\n    \"法规文号\": \"国务院令第225号（2012年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十一条\",\n    \"内容概述\": \"殡葬设施的管理单位应当维护设施完好，保持环境整洁，防止污染环境。\"\n  },\n  {\n    \"法规名称\": \"农村公益性公墓管理办法\",\n    \"法规文号\"\
    : \"无（地方性法规或规范性文件）\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"无\",\n    \"内容概述\": \"公墓管理单位应定期对围墙、道路、排水、消防等设施进行检修，并建立维护档案，"
- expression: (产生水体、底泥数量(吨).最终去向 = '河岸堆放' || 产生水体、底泥数量(吨).接收单位 IS NULL) && (重金属含量（如镉、汞、铅）.重金属含量（如镉、汞、铅） > 农用污泥污染物控制标准.限值 ||
    影像资料.防渗设施 = '无')
  description: 表达式判定：首先，核对运输记录，底泥最终去向为‘河岸边简易堆放’或缺乏明确的、有资质的接收单位；其次，同时满足底泥检测报告显示污染物含量超标，或现场勘查影像资料证实堆放点无防渗膜等任何防渗漏措施。两者构成“且”关系，判定为违规处置，存在二次污染风险。
  audit_item: 农村黑臭水体治理不到位
  suspicion: 清淤底泥违规堆放导致二次污染
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"中华人民共和国主席令第43号\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第二十条、第二十一条\",\n    \"内容概述\": \"产生、收集、贮存、运输、利用、处置固体废物的单位和其他生产经营者，应当采取防扬散、防流失、防渗漏或者其他防止污染环境的措施。禁止向江河、湖泊、渠道、水库及其最高水位线以下的滩地和岸坡以及法律法规规定的其他地点倾倒、堆放、贮存固体废物。\"\
    \n  }\n]"
- expression: (排查台账.占用状态 = '非文化用途占用' && 排查台账.占用性质 != '临时借用且经审批') || (使用日期、使用行为描述、申请人/单位.使用行为描述 NOT IN ('图书阅览','文化活动','培训讲座','群众文体活动')
    && 使用日期、使用行为描述、申请人/单位.使用行为描述 IS NOT NULL) || (影像资料.实际用途照片 显示非文化功能使用)
  description: 排查台账明确记录为被非文化用途占用，且非经审批的临时借用即触发；或者使用登记表连续出现非文化类活动记录；或者现场影像显示堆放杂物、改为办公用房等情形均视为占用。
  audit_item: 文化馆（站）等建设运营管护不合规
  suspicion: 村级文化室及设施被违规占用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公共文化服务保障法\",\n    \"法规文号\": \"主席令第六十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"任何单位和个人不得擅自拆除公共文化设施，不得擅自改变公共文化设施的功能、用途或者妨碍其正常运行。\"\n  },\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\"\
    ,\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"文化站应确保业务用房使用面积和正常开放，不得挤占、挪作"
- expression: (记录表.销号状态 = '已消除' && 影像资料.当前房屋状态 = '仍有人居住' && 整治措施 != '工程加固或拆除') || (记录表.销号状态 = '已消除' && 专项资金支付记录为空) || (记录表.整治措施
    = '警示牌/观察使用' && 鉴定报告.建议整治措施 = '停止使用/拆除')
  description: 销号但未采取实质性工程措施（仅悬挂警示牌）、销号后仍有人居住且无工程整治、有销号记录但无对应整治资金支付、整治措施与鉴定报告要求严重不符等情况，均视为虚假销号或整治不到位。
