name: audit/资料材料类/核算资料
type: model
description: 从资料材料类类文档（核算资料）中提取结构化元数据。涵盖字段如：各类工程运行维护成本、近三年单位供水成本。文档范围包括：成本核算资料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 工程
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 核算资料
  member_count: 1
  member_details:
  - 成本核算资料
output:
  fields:
  - name: 各类工程运行维护成本
    type: string
    description: 提取 各类工程运行维护成本 的文本值
  - name: 近三年单位供水成本
    type: string
    description: 提取 近三年单位供水成本 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: DATEDIFF(CURRENT_DATE, 批复文件.最新水价批复日期) > 3*365 && (成本核算资料.近三年单位供水成本（全成本） / 收费明细表.当前实际执行水价 > 1.2)
  description: 距离最近一次水价批复已超过3年，且当前供水成本已超出执行水价的20%以上，水价调整严重滞后，导致价格与成本明显倒挂。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 农业水价调整严重滞后
  regulation: "[\n  {\n    \"法规名称\": \"关于建立健全农业水价形成机制的指导意见\",\n    \"法规文号\": \"发改价格〔2017〕2272号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"二、建立健全农业水价形成机制（三）\",\n    \"内容概述\": \"各地要适时调整农业水价，调整周期原则上不少于3年。水价调整要综合考虑供水成本、用户承受能力等因素，促进节约用水。\"\n \
    \ }\n]"
- expression: 补贴政策文件.补贴标准 < 成本核算资料.各类工程运行维护成本（含大修、日常维护） * 0.6
  description: 制定的精准补贴标准明显低于运行维护成本的60%，补贴难以覆盖基本维护需求，未体现与运行维护成本的直接挂钩。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 精准补贴标准未与运行维护成本挂钩
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"四、建立精准补贴和节水奖励机制（五）\",\n    \"内容概述\": \"补贴标准由各地根据实际差水率、运行维护成本、用水户承受能力等因素合理确定。要确保补贴后农业水价达到运行维护成本水平。\"\n\
    \  }\n]"
