name: audit/资料材料类/审核资料
type: model
description: 从资料材料类类文档（审核资料）中提取结构化元数据。涵盖字段如：关联单位、家庭成员、承租人身份证。文档范围包括：承租人资格审核资料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 审核资料
  member_count: 1
  member_details:
  - 承租人资格审核资料
output:
  fields:
  - name: 关联单位
    type: string
    description: 提取 关联单位 的文本值
  - name: 家庭成员
    type: string
    description: 提取 家庭成员 的文本值
  - name: 承租人身份证
    type: string
    description: 提取 承租人身份证 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 合同台账.合同租金单价 < 政策规定同地段、同类别保障房租金标准.政策规定同地段、同类别保障房租金标准 × 0.8 && 审核资料.关联单位/家庭成员属于公职人员
  description: 若合同约定的租金单价低于政府定价的80%，且承租人经筛查为管理单位公职人员或其近亲属，存在利益输送嫌疑。即使无关联人员，低于政府定价20%以上且无合法减免审批也构成违规。
  audit_item: 挪用或违规使用保障性安居工程专项资金
  suspicion: 违规低价出租保障房造成租金损失
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"公共租赁住房租金标准由市、县人民政府根据当地经济发展水平、市场租金水平等因素确定并公布，任何单位和个人不得擅自减免或变相减免租金。\"\n  }\n]"
