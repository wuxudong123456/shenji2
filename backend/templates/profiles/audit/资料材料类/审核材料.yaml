name: audit/资料材料类/审核材料
type: model
description: 从资料材料类类文档（审核材料）中提取结构化元数据。涵盖字段如：低保审批表等、入库时间、创业计划书、单位名称、审核意见、征信报告、户籍证明、承诺内容。文档范围包括：供应商入库审核材料、公共租赁住房申请审核材料、创业担保贷款申请人资质审核材料、村级信息员选聘资格审核材料、补贴对象资格审核材料、项目申报单位资质审核材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 审批
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 审核材料
  member_count: 1
  member_details:
  - 供应商入库审核材料
  - 公共租赁住房申请审核材料
  - 创业担保贷款申请人资质审核材料
  - 村级信息员选聘资格审核材料
  - 补贴对象资格审核材料
  - 项目申报单位资质审核材料
output:
  fields:
  - name: 低保审批表等
    type: string
    description: 提取 低保审批表等 的文本值
  - name: 入库时间
    type: date
    description: 提取 入库时间 的日期值，格式 YYYY-MM-DD
  - name: 创业计划书
    type: string
    description: 提取 创业计划书 的文本值
  - name: 单位名称
    type: string
    description: 提取 单位名称 的文本值
  - name: 审核意见
    type: string
    description: 提取 审核意见 的文本值
  - name: 征信报告
    type: string
    description: 提取 征信报告 的文本值
  - name: 户籍证明
    type: string
    description: 提取 户籍证明 的文本值
  - name: 承诺内容
    type: string
    description: 提取 承诺内容 的文本值
  - name: 提交日期
    type: date
    description: 提取 提交日期 的日期值，格式 YYYY-MM-DD
  - name: 收入证明
    type: number
    description: 提取 收入证明 的数值（含单位，如万元、吨等）
  - name: 残疾证
    type: string
    description: 提取 残疾证 的文本值
  - name: 申请人姓名
    type: string
    description: 提取 申请人姓名 的文本值
  - name: 申请人身份证号-统一社会信用代码
    type: string
    description: 提取 申请人身份证号-统一社会信用代码 的文本值
  - name: 申请时间
    type: date
    description: 提取 申请时间 的日期值，格式 YYYY-MM-DD
  - name: 经营范围
    type: string
    description: 提取 经营范围 的文本值
  - name: 营业执照注册日期
    type: date
    description: 提取 营业执照注册日期 的日期值，格式 YYYY-MM-DD
  - name: 财务状况
    type: string
    description: 提取 财务状况 的文本值
  - name: 资质证书
    type: string
    description: 提取 资质证书 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 选拔程序
    type: string
    description: 提取 选拔程序 的文本值
  - name: 选聘条件
    type: string
    description: 提取 选聘条件 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: ({配总表.申请单位} NOT IN ({资质审核材料.合格单位名单})) || ({项目合规性审查清单.审查结论} = '不合格' && {配总表.分配金额} > 0) || ({资质审核材料.经营范围} NOT
    LIKE '%{政策要求行业关键词}%' && {配总表.分配金额} > 0)
  description: 三个独立触发条件：分配总表中的单位未出现在资质审核合格名单中；审查清单明确判定不合格但仍获得资金；申报单位经营范围与政策支持的行业不匹配但配置金额>0。满足任一条件即判定为向不符合条件项目分配资金。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 向不符合条件的项目分配资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员擅自扩大支出范围、提高支出标准，或以虚报、冒领等手段骗取财政资金的，应责令改正并追回资金。\"\n  }\n]"
- expression: (登记表.审核结果 = '通过' && (审核材料.收入证明 > 当地低保标准 || 库.身份证号 存在於 明细表.身份证号)) || (明细表.补贴金额 > 惠农补贴资金管理办法.补贴标准*1.2)
  description: 当审核通过的人员中，其收入证明或财产状况超出政策保障线，或者身份信息与财政供养人员库匹配，即判定为不符合条件发放；同时若发放金额超过政策规定标准的1.2倍，视为超标准发放，两者均构成违规。
  audit_item: 监管不到位，惠农补贴资金被套取骗取、违规使用
  suspicion: 超范围超标准向不符合条件对象发放补贴
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十三条、第十四条\",\n    \"内容概述\": \"申请最低生活保障，按照下列程序办理：由共同生活的家庭成员向户籍所在地的乡镇人民政府、街道办事处提出书面申请；家庭成员申请有困难的，可以委托村民委员会、居民委员会代为提出申请。乡镇人民政府、街道办事处应当通过入户调查、邻里访问、信函索证、群众评议、信息核查等方式，对申请人的家庭收入状况、财产状况进行调查核实，提出初审意见，在申请人所在村、社区公示后报县级人民政府民政部门审批。"
- expression: 公共租赁住房申请审核材料.提交日期 > 购房合同或产权证明.签订日期 && 公共租赁住房申请审核材料.承诺内容包含 '无自有住房' && 公共租赁住房保障对象基本信息表.保障资格取得日期 > 购房合同或产权证明.签订日期
    && 公共租赁住房保障对象基本信息表.保障状态 == '在保'
  description: 申请人在申请公租房时已签订购房合同或拥有房产，却虚假承诺无房，骗取保障资格。购房合同签订日期早于申请提交日期为关键判定。
  audit_item: 住房保障对象不再符合条件时未及时退出或调整待遇
  suspicion: 通过虚假材料骗取公共租赁住房资格
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十五条\",\n    \"内容概述\": \"申请人隐瞒有关情况或者提供虚假材料申请公共租赁住房的，住房保障主管部门不予受理，给予警告，并记入公共租赁住房管理档案。\"\n  },\n  {\n    \"法规名称\":\
    \ \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"虚报冒领财政资金行为的，"
- expression: (发放台账.营业执照注册日期 - 工商注册日期 < 730天) || (发放台账.统一社会信用代码 IN (SELECT 统一社会信用代码 FROM 工商系统 WHERE 经营范围表是否为首次创业='否')) ||
    (银行流水.资金用途显示为购房、证券投资等非经营交易)
  description: 以贷款申请时间与企业注册时间差是否小于2年（730天）判断是否满足首次创业条件；通过工商系统查证同一主体或关联方是否已有注册企业，排除非首次创业；追踪贴息贷款资金银行流水，若资金转入房地产公司、证券公司等非经营类账户，则表明资金用途违规。满足任意条件即发贴息违规疑点。
  audit_item: 违规发放资金或补贴
  suspicion: 违规向不符合条件对象发放创业担保贷款财政贴息
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加大创业担保贷款贴息力度全力支持重点群体创业就业的通知\",\n    \"法规文号\": \"财金〔2020〕21号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第一条、第五条\",\n    \"内容概述\": \"创业担保贷款贴息对象必须是首次创业或符合特定条件的群体，贷款必须用于生产经营，不得用于偿还债务、金融投资等非创业项目。\"\n\
    \  },\n  {\n    \"法规名称\": \"普惠金融发展专项资金管理办法\",\n    \"法规文号\": \"财金〔2019〕96号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第十六条\""
