name: audit/资料材料类/调查资料
type: model
description: 从资料材料类类文档（调查资料）中提取结构化元数据。涵盖字段如：与捐赠方关联关系、受赠方股权结构、同类服务市场均价、实际控制人、市场最低价、市场最高价。文档范围包括：市场同类服务收费调查资料、捐赠对象背景调查资料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 调查资料
  member_count: 1
  member_details:
  - 市场同类服务收费调查资料
  - 捐赠对象背景调查资料
output:
  fields:
  - name: 与捐赠方关联关系
    type: string
    description: 提取 与捐赠方关联关系 的文本值
  - name: 受赠方股权结构
    type: string
    description: 提取 受赠方股权结构 的文本值
  - name: 同类服务市场均价
    type: string
    description: 提取 同类服务市场均价 的文本值
  - name: 实际控制人
    type: string
    description: 提取 实际控制人 的文本值
  - name: 市场最低价
    type: string
    description: 提取 市场最低价 的文本值
  - name: 市场最高价
    type: string
    description: 提取 市场最高价 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: ( 流水.付款方名称 = 信息.高管名单 && 信息.与被审计单位人事关联情况 = '人事或股权关联' && 协议.排他性条款 = '指定/唯一/必须' ) && ( ABS(明细台账.收费标准 - 调查资料.同类服务市场均价)/调查资料.同类服务市场均价
    > 0.3 || 明细台账.服务提供方 != '公开竞争方式确定' )
  description: 当满足以下条件时触发疑点：①收款方为被审计单位下属、控股或存在人事关联的企业；②服务合同明确限定唯一服务提供商或变相排除其他竞争者；③收费标准与同类服务市场均价的偏差率大于30%，或根本未履行招标、竞争性谈判等公开选取程序。三项条件同时满足，即可判定为依托行政权力垄断经营且高价收费。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 依托行政权力垄断经营并高价收费
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十三条\",\n    \"内容概述\": \"行政机关和法律、法规授权的具有管理公共事务职能的组织不得强制或者变相强制市场主体接受中介服务、购买指定商品、参加有偿培训等，不得指定或者变相指定中介服务机构、商品供应商、培训机构。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国反垄断法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条\"\
    ,\n   "
- expression: (流向证明.最终收款方名称 != 捐赠协议.受赠方名称) OR (核对表.收款方 IN 捐赠协议.捐赠人名称) OR (捐赠协议.附加商业条款 != '') OR (调查资料.实际控制人 IN 交易清单.关联方名称)
  description: 资金收款方与协议受赠方不一致，或存在资金闭环回流，均表明捐赠不真实；协议中含有商业回报条款，借捐赠名义获取对价，属于变相交易；若受赠方与捐赠方存在未披露关联关系，构成利益输送；上述任一条件满足即触发疑点。
  audit_item: 违规对外大额捐赠
  suspicion: 借捐赠之名从事营利活动或转移资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公益事业捐赠法\",\n    \"法规文号\": \"中华人民共和国主席令第十九号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"捐赠应当是自愿和无偿的，不得以捐赠为名从事营利活动。\"\n  },\n  {\n    \"法规名称\": \"关于加强企业对外捐赠财务管理的通知\",\n    \"\
    法规文号\": \"财企〔2003〕95号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"企业对外捐赠后，不得要求受赠方在融资、市场准入、行政许可、占有其他资源等"
