name: audit/资料材料类/申报资料
type: model
description: 从资料材料类类文档（申报资料）中提取结构化元数据。涵盖字段如：审批时间、户主姓名、房屋地址、改造前照片、申报人、申报数量、申报面积、身份证号。文档范围包括：农村危房改造项目申报资料、项目申报资料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 审批
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 申报资料
  member_count: 1
  member_details:
  - 农村危房改造项目申报资料
  - 项目申报资料
output:
  fields:
  - name: 审批时间
    type: date
    description: 提取 审批时间 的日期值，格式 YYYY-MM-DD
  - name: 户主姓名
    type: string
    description: 提取 户主姓名 的文本值
  - name: 房屋地址
    type: string
    description: 提取 房屋地址 的文本值
  - name: 改造前照片
    type: string
    description: 提取 改造前照片 的文本值
  - name: 申报人
    type: string
    description: 提取 申报人 的文本值
  - name: 申报数量
    type: number
    description: 提取 申报数量 的数值（含单位，如万元、吨等）
  - name: 申报面积
    type: string
    description: 提取 申报面积 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (申报面积、申报数量、申报人.申报面积 - 实际使用面积、建设前后影像对比图斑、不同时期影像对比.实际使用面积) / 实际使用面积、建设前后影像对比图斑、不同时期影像对比.实际使用面积 > 20% || (实际流转面积、流转价格、交付日期、合同约定面积、流转面积.流转面积
    != 实际流转面积、流转价格、交付日期、合同约定面积、流转面积.对应面积) || (申报面积、申报数量、申报人.申报人 与 现场暗访记录.实际经营者 不符)
  description: 通过外部数据、第三方数据与申报资料比对，识别弄虚作假。申报面积与遥感影像实测面积偏差超过20%，土地流转合同与租金支付凭证面积不符，或申报主体与实际经营者不符，均视为骗取疑点。
  audit_item: 资金管理使用不符合相关规定
  suspicion: 虚报资料骗取套取涉农资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"单位和个人有下列违反国家有关投资建设项目规定行为之一的，责令改正，调整有关会计账目，追回被截留、挪用、骗取的国家建设资金，给予相应处罚。包括编制虚假材料骗取国家资金的。\"\n \
    \ }\n]"
