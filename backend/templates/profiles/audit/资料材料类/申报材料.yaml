name: audit/资料材料类/申报材料
type: model
description: 从资料材料类类文档（申报材料）中提取结构化元数据。涵盖字段如：上年度农产品网络销售额、任务属性、任务量指标、企业申请时间、保障房申报套数、入驻企业清单、具体实施单位、农户申请信息。文档范围包括：任务指标申报材料、企业商业化育种申报材料、创业载体申报材料、地方优势特色农产品保险申报材料、多部门申报材料、年度涉农项目申报材料、申报材料、税收优惠申报材料、管理人员投资持股申报材料、试点县申报材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 工程
- 明细
- 预算
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
