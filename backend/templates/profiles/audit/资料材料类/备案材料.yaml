name: audit/资料材料类/备案材料
type: model
description: 从资料材料类类文档（备案材料）中提取结构化元数据。涵盖字段如：保险品类名称、允许收费项目、变更记录、合作社名称、品种名称、地点、备案执行的农业电价类别及标准、审定编号。文档范围包括：价格审批备案材料、保险机构农业保险产品备案材料、工商变更备案材料、应急维修项目备案材料、抵押担保合同样本登记备案材料、电力企业电价执行标准备案材料、种子审定登记备案材料、项目开工备案材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 登记
- 金额
- 项目
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 备案材料
  member_count: 1
  member_details:
  - 价格审批备案材料
  - 保险机构农业保险产品备案材料
  - 工商变更备案材料
  - 应急维修项目备案材料
  - 抵押担保合同样本登记备案材料
  - 电力企业电价执行标准备案材料
  - 种子审定登记备案材料
  - 项目开工备案材料
output:
  fields:
  - name: 保险品类名称
    type: string
    description: 提取 保险品类名称 的文本值
  - name: 允许收费项目
    type: number
    description: 提取 允许收费项目 的数值（含单位，如万元、吨等）
  - name: 变更记录
    type: string
    description: 提取 变更记录 的文本值
  - name: 合作社名称
    type: string
    description: 提取 合作社名称 的文本值
  - name: 品种名称
    type: string
    description: 提取 品种名称 的文本值
  - name: 地点
    type: string
    description: 提取 地点 的文本值
  - name: 备案执行的农业电价类别及标准
    type: string
    description: 提取 备案执行的农业电价类别及标准 的文本值
  - name: 审定编号
    type: string
    description: 提取 审定编号 的文本值
  - name: 审定通过日期
    type: date
    description: 提取 审定通过日期 的日期值，格式 YYYY-MM-DD
  - name: 承保条件
    type: string
    description: 提取 承保条件 的文本值
  - name: 收费标准
    type: number
    description: 提取 收费标准 的数值（含单位，如万元、吨等）
  - name: 时间
    type: date
    description: 提取 时间 的日期值，格式 YYYY-MM-DD
  - name: 注册资本
    type: string
    description: 提取 注册资本 的文本值
  - name: 登记备案回执
    type: string
    description: 提取 登记备案回执 的文本值
  - name: 登记时间
    type: date
    description: 提取 登记时间 的日期值，格式 YYYY-MM-DD
  - name: 紧急情况说明
    type: string
    description: 提取 紧急情况说明 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 预估金额
    type: number
    description: 提取 预估金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (其他.营业收入 == 0 FOR LAST 2 YEARS) && (备案材料.经营状态 == '存续') && (登记台账 IS NULL FOR THIS 合作社)
  description: 连续两个年度纳税申报表中营业收入均为零，且合作社工商状态仍为存续，且未列入吊销台账，即判定应吊销未吊销。年度以自然年或成立周年计算。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 未吊销连续两年未经营合作社营业执照
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n   \
    \ \"条款号\": \"第五十四条\",\n    \"内容概述\": \"农民专业合作社连续两年未从事经营活动的，吊销其营业执照。\"\n  }\n]"
- expression: (会议记录.决议事项 CONTAINS '变更' && DATEDIFF(当前日期, 其他.会议决议日期) > 30 && 备案材料.变更记录中无对应事项) || (其他.章程修改记录.经营期限已届满 && 备案材料.登记状态
    != '注销' && 未查询到清算组备案)
  description: 合作社作出变更决议后30日内未申请变更登记，或者经营期限届满未依法进行注销清算，即构成违规。日期差阈值设定为30天。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 合作社未按规定办理变更或注销登记
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社登记管理条例\",\n    \"法规文号\": \"国务院令第498号\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第二十七条、第三十条\",\n    \"内容概述\": \"农民专业合作社登记事项发生变更的，应当自作出变更决议之日起30日内申请变更登记；成立清算组的应自成立之日起10日内备案。\"\n  }\n]"
- expression: (其他.营业收入 FOR LAST 2 YEARS <= 水对账单.支出金额 * 10) && (进度表.已履约金额 == 0) && (备案材料.成立日期 > 3 YEARS AGO)
  description: 成立超过3年，近两年申报收入几乎为零(仅可覆盖微量账户管理费)，且无任何业务合同履行记录，同时满足即判定为空壳化运营。使用收入与手续费倍数关系过滤休眠账户。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 合作社成立后未运营或运营效果不佳导致空壳化
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n   \
    \ \"条款号\": \"第五条\",\n    \"内容概述\": \"农民专业合作社应当遵循为成员谋求共同利益、以服务成员为宗旨。\"\n  }\n]"
- expression: (用户清单.用电类别 == '商业用电' || 用户清单.用电类别 == '大工业用电') && (用户清单.执行电价标准 > 农业用电优惠目录类别、优惠电价标准.优惠电价标准)
  description: 筛选出用电登记类别为商业或工业等非农类别，且实际执行电价高于政策规定的农业优惠电价的用户。这些用户可能属于农业生产性质但未被正确分类，导致未能享受优惠电价。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业用电户被错误计收商业电价
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电力法\",\n    \"法规文号\": \"中华人民共和国主席令第二十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十三条\",\n    \"内容概述\": \"用户用电增容收费标准，由国务院物价行政主管部门会同国务院电力管理部门制定。\"\n  },\n  {\n    \"法规名称\": \"关于进一步深化燃煤发电上网电价市场化改革的通知（及各省农业用电目录电价文件）\"\
    ,\n    \"法规文号\": \"发改价格〔2021〕1439号等\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"各地相关条款\",\n    \"内容概述\":"
- expression: 进度表.首次推广日期 < 备案材料.审定通过日期
  description: 推广日期早于审定通过日期，即构成未审先推。任何此类时间倒置均属严重违规。
  audit_item: 种业市场监管方面不符合相关规定
  suspicion: 种子未审先推违规行为未有效监管
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"中华人民共和国主席令第三十五号（2015年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"应当审定的农作物品种未经审定的，不得发布广告、推广、销售。\"\n  }\n]"
- expression: 批准人 == true && (缺失(施工日志记载的每日工程量) || 缺失(维修前中后对比照片) || 缺失(监理确认) || 缺失(补办表决结果))
  description: 已通过紧急程序审批并拨付资金的维修项目，若不能提供施工日志、监理报告、现场照片以及事后补办业主表决的任何一项支持性文件，即可判定为虚假紧急维修挪用资金。
  audit_item: 挪用住宅专项维修资金
  suspicion: 利用虚假紧急维修程序挪用资金
  regulation: "[\n  {\n    \"法规名称\": \"《住宅专项维修资金管理办法》\",\n    \"法规文号\": \"建设部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十四条\",\n    \"内容概述\": \"发生危及房屋安全等紧急情况，需要立即对住宅共用部位、共用设施设备进行维修和更新、改造的，可以凭应急使用方案和相关证明材料，申请列支维修资金，事后应当向业主公示相关情况并补充履行表决手续。\"\
    \n  }\n]"
