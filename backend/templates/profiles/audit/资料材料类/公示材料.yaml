name: audit/资料材料类/公示材料
type: model
description: 从资料材料类类文档（公示材料）中提取结构化元数据。涵盖字段如：会议议题、依据、公告张贴照片、公示内容、公示内容清单、公示发布日期、公示时间、公示渠道。文档范围包括：一事一议民主议事公示材料、优惠政策宣传公示材料、信息公开公示材料、公示材料、收费公示材料、收费标准公示材料、救助对象公示材料、村庄规划公示材料、村级补贴公示材料、补贴申领公示材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 会议
- 审批
- 金额
- 项目
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 公示材料
  member_count: 1
  member_details:
  - 一事一议民主议事公示材料
  - 优惠政策宣传公示材料
  - 信息公开公示材料
  - 公示材料
  - 收费公示材料
  - 收费标准公示材料
  - 救助对象公示材料
  - 村庄规划公示材料
  - 村级补贴公示材料
  - 补贴申领公示材料
output:
  fields:
  - name: 会议议题
    type: string
    description: 提取 会议议题 的文本值
  - name: 依据
    type: string
    description: 提取 依据 的文本值
  - name: 公告张贴照片
    type: string
    description: 提取 公告张贴照片 的文本值
  - name: 公示内容
    type: string
    description: 提取 公示内容 的文本值
  - name: 公示内容清单
    type: string
    description: 提取 公示内容清单 的文本值
  - name: 公示发布日期
    type: date
    description: 提取 公示发布日期 的日期值，格式 YYYY-MM-DD
  - name: 公示时间
    type: date
    description: 提取 公示时间 的日期值，格式 YYYY-MM-DD
  - name: 公示渠道
    type: string
    description: 提取 公示渠道 的文本值
  - name: 公示的租金标准及缴纳方式说明
    type: string
    description: 提取 公示的租金标准及缴纳方式说明 的文本值
  - name: 公示起止日期
    type: date
    description: 提取 公示起止日期 的日期值，格式 YYYY-MM-DD
  - name: 公示金额
    type: number
    description: 提取 公示金额 的数值（含单位，如万元、吨等）
  - name: 分配方案
    type: string
    description: 提取 分配方案 的文本值
  - name: 参会代表签字
    type: string
    description: 提取 参会代表签字 的文本值
  - name: 发布渠道网址
    type: string
    description: 提取 发布渠道网址 的文本值
  - name: 审批通过名单
    type: string
    description: 提取 审批通过名单 的文本值
  - name: 已公示的收费项目
    type: number
    description: 提取 已公示的收费项目 的数值（含单位，如万元、吨等）
  - name: 标准
    type: string
    description: 提取 标准 的文本值
  - name: 照片时间戳
    type: date
    description: 提取 照片时间戳 的日期值，格式 YYYY-MM-DD
  - name: 表决结果
    type: boolean
    description: 提取 表决结果 的布尔值（是/否）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (村庄规划编制批复文件.批复日期 - 村庄规划公示材料.公示起止日期 < 30天) || (村民会议或村民代表会议记录.规划讨论内容 == null) || (规划公示记录台账.处理率 == 0) || (村庄规划公示材料.照片时间戳
    == true)
  description: 公示期不足30日、会议记录缺失规划讨论、公示反馈意见处理率为0、公示照片存在篡改或时间戳异常，满足任一条件即判定程序违规。公示期<30天为最常见违规触发条件。
  audit_item: 不符合村庄规划编制要求
  suspicion: 村庄规划公示及村民参与程序缺失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十六条\",\n    \"内容概述\": \"城乡规划报送审批前，组织编制机关应当依法将城乡规划草案予以公告，并采取论证会、听证会或者其他方式征求专家和公众的意见。公告的时间不得少于三十日。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国村民委员会组织法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十四条\",\n    \"内容概述\"\
    : \"涉及"
- expression: 涉农收费项目清单.各项收费项目名称 NOT IN (收费公示材料.已公示的收费项目) OR (农机企业缴费台账.收费项目名称 NOT IN (收费公示材料.已公示的收费项目) AND 农机企业缴费台账.收费依据 =
    '合法')
  description: 合法收费项目清单中有项目未在公示材料中出现，或者实际收取的合法项目也未公示，均视为未按规定公示。
  audit_item: 乱集资、乱摊派、乱收费
  suspicion: 涉企收费项目未按规定进行公示
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于全面实行收费公示制度的通知\",\n    \"法规文号\": \"发改价格〔2004〕297号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"全文要求\",\n    \"内容概述\": \"所有按国家规定权限和程序制定的行政事业性收费均应实行公示制度，公示内容包括收费项目、收费标准、收费依据等。\"\n  }\n]"
- expression: SELECT 补贴类型, COUNT(DISTINCT 金额) AS cnt FROM 明细表 GROUP BY 补贴类型, 发放批次, 村组 HAVING cnt = 1 AND (SELECT STDEV(土地面积)
    FROM 信息表 WHERE 明细表.身份证号 = 信息表.身份证号) > 0
  description: 若同一村组、同一补贴类型下，所有农户的发放金额完全一致（唯一值个数为1），而该补贴政策要求按面积、产量等差异化标准发放，且农户的实际面积存在差异（标准差>0），则高度疑似平均分配。
  audit_item: 惠农补贴发放不到位
  suspicion: 按户平均分配惠农补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"《农业生产发展资金管理办法》\",\n    \"法规文号\": \"财农〔2022〕25号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"严禁采取平均分配、轮流享受等方式发放补贴资金，不得与农户实际情况脱钩。\"\n  }\n]"
- expression: (公示材料.公示时间 IS NULL) OR (公示材料.公示时间 > 发放方式、领取人姓名、补贴类型、金额、发放时间、银行账号、领取人身份证号、户主身份证号、银行账户名称、姓名、身份证号、实际发放金额、户编号、应发金额、实发金额、户名、补贴项目名称、收款人姓名、收款账号、发放日期、发放金额、补贴类别、补贴发放账号、农户姓名、发放账号、收款账户、收款人、受益人姓名、受益人身份证号、补贴金额、申报面积、银行卡号.发放时间)
    OR (公示材料.公示内容（是否包含补贴对象、标准、金额） NOT LIKE '%补贴对象%' OR 公示材料.公示内容（是否包含补贴对象、标准、金额） NOT LIKE '
  description: 公示未进行、公示时间晚于资金发放日（事后补公示），或公示内容缺失关键要素（对象、标准、金额），均构成未按规定公开。
  audit_item: 惠农补贴发放不到位
  suspicion: 惠农补贴信息未按规定公示公开
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国政府信息公开条例》\",\n    \"法规文号\": \"国令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二条、第九条\",\n    \"内容概述\": \"涉及公民、法人和其他组织切身利益，需要社会公众广泛知晓的政府信息应当主动公开。惠农补贴发放信息属于重点公开范畴。\"\n  }\n]"
- expression: (低收入群体补贴发放清单.补贴金额 < 政策规定应补金额) || (低收入人群认定标准及名单.身份证号 NOT IN ( SELECT 低收入群体补贴发放清单.身份证号)) || (用户收费明细台账.减免金额 = 0
    && 低收入人群认定名单中包含该用户)
  description: 将低收入人群认定名单与补贴发放清单、收费减免标记进行关联比对，若名单内人员未出现在补贴清单中，或补贴金额不足，或应减免的费用未减免（减免金额为0），均判定为未落实。政策覆盖率应达到100%。
  audit_item: 项目实施不合规
  suspicion: 低收入人群优惠政策落实不到位
  regulation: "[\n  {\n    \"法规名称\": \"污水处理费征收使用管理办法\",\n    \"法规文号\": \"财税〔2014〕151号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"对城镇低保对象家庭，应当按规定减免污水处理费，具体减免标准和办法由地方价格主管部门会同财政、排水主管部门制定。\"\n  }\n]"
- expression: (招投标文件.中标公告日期 IS NULL) || (竣工验收报告.验收结论 != null && 信息公开公示材料.对应的资金拨付情况公示 IS NULL) || (信息公开公示材料.公示发布日期 - 项目竣工日期
    > 法定最晚公示期限)
  description: 判定规则：1）实施了招投标但无法查询到中标公告，属于关键信息缺失；2）项目已完成竣工验收，但在信息公开材料中找不到对应项目的资金使用、建设内容等最终结果的公示，属于信息公示不全；3）信息公开的日期与项目实际竣工日期之间间隔远超法定要求（通常为20个工作日），属于延迟公开。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 未按规定公开高标准农田建设项目信息
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"行政机关应当依照本条例第十九条的规定，主动公开本行政机关的机关职能、机构设置、办公地址、办公时间、联系方式、负责人姓名等。\"\n  }\n]"
- expression: 租赁合同.月租金标准 != 非税收入缴款书.国库实际入账金额 / 月份数 && (租金收取台账.第三方支付平台流水.扣款项名称 LIKE '%手续费%' || 租金收取台账.第三方支付平台流水.扣款项名称 LIKE
    '%服务费%')
  description: 比对租户应缴的月租金标准与最终缴入国库的非税收入金额，若存在差异，且差异金额在缴费渠道流水（如微信、支付宝、银联）中体现为被扣除的“手续费”、“平台服务费”、“管理费”等，即判定为违规截留。非税收入应全额上缴，代收成本应由财政预算另行安排，不得从中扣除。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 以手续费等名义截留部分租金
  regulation: "[\n  {\n    \"法规名称\": \"《政府非税收入管理办法》\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"除财政部另有规定外，执收单位不得擅自将非税收入分成或者转移。非税收入应当全额上缴国库，任何单位和个人不得截留、坐支、挪用。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政部关于加强政府非税收入管理的通知\",\n    \"法规文号\": \"财综〔2004〕53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三点（规范征收行为）\",\n  \
    \  \"内容概"
- expression: 数据表.户籍人口月收入合计数/家庭人口数 < 国家和地方社会救助政策文件.家庭人均收入标准线 && 数据表.机动车登记信息 == 0 && 数据表.房产登记信息（私有房产套数、人均面积） < 国家和地方社会救助政策文件.家庭财产状况标准线
    && 困难群体救助申请材料.最终审批状态（批准/拒绝） != '批准'
  description: 该表达式用于筛查'应保未保'疑点。当家庭人均月收入低于政策低保标准，且无超标车辆、房产等财产，但审核审批文件的最终状态并非'批准'，则判定为疑似违规。触发此条件的所有记录均为高度可疑。若叠加投诉举报台账中存在对应投诉则风险升级。
  audit_item: 未按规定对城乡困难群体给予相应社会救助
  suspicion: 符合低保条件家庭未纳入保障范围
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第九条\",\n    \"内容概述\": \"国家对共同生活的家庭成员人均收入低于当地最低生活保障标准，且符合当地最低生活保障家庭财产状况规定的家庭，给予最低生活保障。\"\n  }\n]"
- expression: (困难群体救助申请材料.申请理由（火灾、交通事故、突发重病等） IN 火灾、交通事故、突发重病等急难型事件， && 困难群体救助申请材料.相关佐证材料 > 0)， && 公示材料.审批结果（拒绝） == '拒绝' &&
    公示材料.审批未通过原因及依据 CONTAINS 程序性、非实质性，例如不符合程序 资金不足 && 发放记录.向该家庭拨付临时救助金的记录 == null
  description: 筛查'紧急救助门槛过高'疑点。当家庭遭遇突发急难事件，证据链完整，但审批结果却以'不符合程序'、'材料不全'等站不住脚的理由拒绝，且该家庭未收到任何救助款时，判定为违规。此疑点重点关注对危急情况处置的僵化行政。
  audit_item: 未按规定对城乡困难群体给予相应社会救助
  suspicion: 严重困难家庭临时救助申请遭无理拒绝
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十七条、第四十八条\",\n    \"内容概述\": \"对因火灾、交通事故等意外事件，家庭成员突发重大疾病等原因，导致基本生活暂时出现严重困难的家庭，或者因生活必需支出突然增加超出家庭承受能力，导致基本生活暂时出现严重困难的最低生活保障家庭，以及遭遇其他特殊困难的家庭，给予临时救助。对情况紧急的，乡镇人民政府、街道办事处、县级人民政府民政部门应当先行救助。紧急情况解除后，按照规定补齐审核审批手续。\"\
    \n  }\n]"
- expression: (COUNT(数据.身份证号 NOT IN (审批台账.身份证号 WHERE 审批台账.审批状态（通过/未通过）='通过') && 数据.累计参保月数 >= 补贴对象条件（证书类型、参保月数要求).参保月数要求) >
    0 && 结余表.结余率 > 0.3) || (COUNT(审批台账.身份证号 WHERE 审批台账.审批状态（通过/未通过）='未通过' AND (审批台账.拒绝原因='材料不全' OR 审批台账.拒绝原因='不符合资格')) / COUNT(审批台账.身份证号
    WHERE 审批台账.审批状态（通过/未通过）='未通过') > 0.5 && 结余表.结余率 > 0.5)
  description: 符合申领条件（取得职业资格证书且参保累计满12个月）的人员未被发放补贴，且年度补贴资金结余率大于30%，视为存在应补未补；或者审批台账中因“材料不全”“不符合资格”等可纠正原因拒绝的比例超过50%且结余率超过50%，表明可能存在人为设置障碍或宣传不到位导致大量人员未成功申领。结余率越高违规风险越大。
  audit_item: 职业技能提升行动方案执行不到位
  suspicion: 符合条件人员未按规定享受技能提升补贴
  regulation: "[\n  {\n    \"法规名称\": \"人力资源社会保障部 财政部关于失业保险支持参保职工提升职业技能有关问题的通知\",\n    \"法规文号\": \"人社部发〔2017〕40号\",\n    \"\
    效力级别\": \"部门规章\",\n    \"条款号\": \"二、申领条件 三、审核程序\",\n    \"内容概述\": \"同时符合依法参加失业保险累计缴费12个月以上、取得职业资格证书或职业技能等级证书的，可申领技能提升补贴；审核应在规定期限内完成，补贴资金直接发放至申请人个人账户。\"\
