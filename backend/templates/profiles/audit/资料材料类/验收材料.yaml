name: audit/资料材料类/验收材料
type: model
description: 从资料材料类类文档（验收材料）中提取结构化元数据。涵盖字段如：任务完成情况、供应商、供应商名称、合作协议中约定的保底收购量或销售额、合同内容、合同编号、合同项目名称、实际培训签到表。文档范围包括：产业项目验收材料、农村房屋综合信息管理平台验收材料、帮扶项目验收材料、成果验收材料、补充耕地验收材料、采购合同验收材料、项目验收材料、验收材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 协议
- 合同
- 培训
- 工程
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 验收材料
  member_count: 1
  member_details:
  - 产业项目验收材料
  - 农村房屋综合信息管理平台验收材料
  - 帮扶项目验收材料
  - 成果验收材料
  - 补充耕地验收材料
  - 采购合同验收材料
  - 项目验收材料
  - 验收材料
