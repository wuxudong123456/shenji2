name: audit/资料材料类/注册资料
type: model
description: 从资料材料类类文档（注册资料）中提取结构化元数据。涵盖字段如：出资证明、工商登记股东名册、注册资金实缴证明、股东名册。文档范围包括：经济实体注册资料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 登记
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 注册资料
  member_count: 1
  member_details:
  - 经济实体注册资料
output:
  fields:
  - name: 出资证明
    type: string
    description: 提取 出资证明 的文本值
  - name: 工商登记股东名册
    type: string
    description: 提取 工商登记股东名册 的文本值
  - name: 注册资金实缴证明
    type: string
    description: 提取 注册资金实缴证明 的文本值
  - name: 股东名册
    type: string
    description: 提取 股东名册 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (决策文件.决策会议记录 == null || 批复文件.资产处置批复文件 == null) || (决策文件.投资金额 > 批复文件.批复金额) || (项目清单.被投资单位名称 IN (关联方清单) && 决策文件.风险评估结论
    != '低风险' && 项目清单.持股比例 > 50%) || (注册资料.工商登记股东名册 IN (SELECT 工商登记股东名册 FROM 注册资料 WHERE 项目清单.资产评估报告编号 == null) ) || (核对表.实收股利
    < 核对表.应收股利 * 0.8 && 投资年限 > 2)
  description: 判定逻辑：1. 投资缺失财政审批或风险评估；2. 投资额超批复；3. 对关联方进行高风险大额投资；4. 投资时未履行资产评估程序；5. 投资超过2年但股利回收率低于80%。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规对外投资国有资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十二条\",\n    \"内容概述\": \"企业对外投资应当依法进行可行性研究和风险评估，并按照规定权限履行审批程序。\"\n  },\n  {\n    \"法规名称\": \"事业单位国有资产管理暂行办法\"\
    ,\n    \"法规文号\": \"财政部令第36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十六条\",\n    \"内容概述\": \"事业单位利用国有资产对外投资，应当进行可行性论证和资产评估"
- expression: (出资证明.资产评估报告编号 == null || 批复文件.批复文号 == null) || (其他.资产编号 IN (SELECT 资产编号 FROM 登记台账 WHERE 权属状态 != '已转移')) ||
    (注册资料.股东名册 NOT IN (上级单位批复人员清单))
  description: 判定逻辑：1. 举办经济实体未进行资产评估或未报财政审批；2. 资产已投入实体营运但产权仍登记在原单位名下未办理转移；3. 实体注册股东与批复人员不符，疑为个人代持国有资产。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规使用国有资产举办经济实体
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"行政事业单位利用国有资产举办经济实体，应当经可行性论证和集体决策，并报主管部门审批。国有资产应当评估作价，及时办理资产转移手续。\"\n  },\n  {\n    \"法规名称\"\
    : \"事业单位国有资产管理暂行办法\",\n    \"法规文号\": \"财政部令第36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十六条\",\n    \"内容概述\": \"\
    事业单位利"
