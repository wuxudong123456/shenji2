name: audit/资料材料类/支撑材料
type: model
description: 从资料材料类类文档（支撑材料）中提取结构化元数据。涵盖字段如：关键数据源、原始数据来源、原始调查问卷汇总、实际完成数、报告内容要素、照片、签到表、通知。文档范围包括：会议培训支撑材料、绩效数据原始支撑材料、绩效自评报告支撑材料、绩效自评支撑材料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 项目
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 支撑材料
  member_count: 1
  member_details:
  - 会议培训支撑材料
  - 绩效数据原始支撑材料
  - 绩效自评报告支撑材料
  - 绩效自评支撑材料
output:
  fields:
  - name: 关键数据源
    type: string
    description: 提取 关键数据源 的文本值
  - name: 原始数据来源
    type: string
    description: 提取 原始数据来源 的文本值
  - name: 原始调查问卷汇总
    type: string
    description: 提取 原始调查问卷汇总 的文本值
  - name: 实际完成数
    type: string
    description: 提取 实际完成数 的文本值
  - name: 报告内容要素
    type: string
    description: 提取 报告内容要素 的文本值
  - name: 照片
    type: string
    description: 提取 照片 的文本值
  - name: 签到表
    type: string
    description: 提取 签到表 的文本值
  - name: 通知
    type: string
    description: 提取 通知 的文本值
  - name: 部门整体绩效指标完成情况
    type: string
    description: 提取 部门整体绩效指标完成情况 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
