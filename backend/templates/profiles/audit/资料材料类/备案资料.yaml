name: audit/资料材料类/备案资料
type: model
description: 从资料材料类类文档（备案资料）中提取结构化元数据。涵盖字段如：协议编号、工时占比、房屋信息、申报研发人员名单、签约双方、签约日期、项目名称。文档范围包括：房地产开发企业购房协议备案资料、税务加计扣除备案资料等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 资料材料类
- 审计
- 人员
- 协议
- 项目
- 元数据提取
template_class:
  category: 资料材料类
  member_types:
  - 备案资料
  member_count: 1
  member_details:
  - 房地产开发企业购房协议备案资料
  - 税务加计扣除备案资料
output:
  fields:
  - name: 协议编号
    type: string
    description: 提取 协议编号 的文本值
  - name: 工时占比
    type: string
    description: 提取 工时占比 的文本值
  - name: 房屋信息
    type: string
    description: 提取 房屋信息 的文本值
  - name: 申报研发人员名单
    type: string
    description: 提取 申报研发人员名单 的文本值
  - name: 签约双方
    type: string
    description: 提取 签约双方 的文本值
  - name: 签约日期
    type: date
    description: 提取 签约日期 的日期值，格式 YYYY-MM-DD
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (统计台账.项目月度实际研发人数 - 考勤记录.研发人员实际出勤天数) / 统计台账.项目月度实际研发人数 > 0.3 || (工时分摊比例与合同岗位不符) || (设备采购无研发关联性)
  description: 若申报研发人数与实际到岗人数偏差超过30%，或研发人员工时记录与工资分摊计算表不勾稽，或采购的设备与研发方向无实质性关联，即判定存在虚报。该表达式基于人数偏离度和费用归集真实性的组合条件。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 虚报研发费用数据造假
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局 科技部关于完善研究开发费用税前加计扣除政策的通知\",\n    \"法规文号\": \"财税〔2015〕119号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"三（一）\",\n    \"内容概述\": \"企业应按照财务会计制度要求，对研发支出进行会计处理；对研发费用和生产经营费用划分不清的，不得实行加计扣除。\"\n  },\n \
    \ {\n    \"法规名称\": \"中华人民共和国统计法\",\n    \"法规文号\": \"主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七条\",\n    \"内容概述\"\
    : \"国"
- expression: (购房合同备案信息表.合同编号 NOT IN (SELECT 合同编号 FROM 房地产开发企业销售台账 WHERE 销售状态 = '真实成交')) || (贷款资金流向追踪表.最终收款账户 属于 房地产开发企业及其关联方账户
    && 购房合同备案信息表.购房人 IN (SELECT 身份证号 FROM 房地产开发企业员工名册))
  description: 第一个条件表示购房合同未在企业正常销售台账中登记，涉嫌虚构销售；第二个条件为贷款资金最终流入房企关联账户，且购房人为本企业员工，表明销售行为实质上是内部虚假操作。满足任一即构成虚假销售骗贷疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 房地产开发企业签订虚假购房协议骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，由住房公积金管理中心责令限期退回贷款，并可处骗取金额百分之五以上百分之十以下罚款；构成犯罪的，依法追究刑事责任。\"\n  },\n  {\n    \"\
    法规名称\": \"关于规范住房公积金个人住房贷款政策有关问题的通知\",\n    \"法规文号\": \"建金〔2010〕179号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"三、\",\n\
    \   "
