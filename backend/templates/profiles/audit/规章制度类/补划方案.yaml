name: audit/规章制度类/补划方案
type: model
description: 从规章制度类类文档（补划方案）中提取结构化元数据。涵盖字段如：拟占用基本农田面积及图斑号、计划补划质量等别、计划补划面积及图斑号。文档范围包括：永久基本农田补划方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 补划方案
  member_count: 1
  member_details:
  - 永久基本农田补划方案
output:
  fields:
  - name: 拟占用基本农田面积及图斑号
    type: string
    description: 提取 拟占用基本农田面积及图斑号 的文本值
  - name: 计划补划质量等别
    type: string
    description: 提取 计划补划质量等别 的文本值
  - name: 计划补划面积及图斑号
    type: string
    description: 提取 计划补划面积及图斑号 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (项目占地红线图.占用基本农田面积 > 永久基本农田补划台账.实际补划面积) || (补划地块的耕地质量等别评定报告.实测等别 < 被占用地块的原质量等别) || (土地利用现状图.补划地块坡度 > 25)
  description: 判定规则：1）项目建设实际占用的永久基本农田面积，大于实际完成的补划面积，即触犯“占优补劣、占多补少”的违规情形；2）补划地块经过实测的质量等别，低于被占用地块占用前的质量等别，属于典型的“占优补劣”；3）补划地块自身条件不达标，如位于大于25度的陡坡上，不宜耕种，属于虚假补划。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 未按规定补足或补划永久基本农田
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"2019年修正版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十二条\",\n    \"内容概述\": \"国家实行永久基本农田保护制度。……禁止通过擅自调整县级土地利用总体规划、乡（镇）土地利用总体规划等方式规避永久基本农田农用地转用或者土地征收的审批。\"\n  }\n]"
