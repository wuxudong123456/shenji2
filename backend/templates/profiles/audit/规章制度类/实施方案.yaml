violations:
- expression: (内部管理制度.责任主体描述 != 上级实施方案.牵头部门规定) || (内部管理制度.跨部门协调机制条款 == null && 上级实施方案.协调机制要求 != null) || (ABS(内部管理制度.资金保障条款
    - 上级实施方案.资金配套比例或来源要求) > 0)
  description: 检查内部制度的实施机制是否与上位要求脱节。表达式包含三个判定逻辑，任一满足即认为存在疑点：1.内部制度指定的责任主体与上级文件明确要求的牵头部门不一致；2.上级要求建立跨部门协调机制，但内部制度中缺失相关内容；3.内部制度规定的资金配套比例与上级要求存在差异。
  audit_item: 内控管理制度符合性审计
  suspicion: 内部制度实施保障机制缺失
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强财政预算执行管理的通知\",\n    \"法规文号\": \"财预〔2014〕85号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"相关条款\",\n    \"内容概述\": \"强化预算执行主体责任，建立健全工作协调机制，确保各项政策落实到位。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"各部门、各单位是本部门、本单位的预算执行主体，负责本部门、本单"
- expression: (统计表.实际完成进度 < 方案中明确的时间节点 || 统计表.实际股权结构 != 方案中明确的时间节点.股权结构调整目标) && (统计表.董事会成员构成及席位 == 0 || 统计表.实际股权结构 < 10%)
  description: 该表达式筛查两类情况：1. 实际进度落后于计划节点或股权结构未达方案要求；2. 在股权已完成变更的情况下，若非国有股东在董事会无席位或表决权比例极低（<10%），则判定为“混而不改”，即资本混合但治理机制未实现融合。
  audit_item: 国有企业重点改革任务推进方面存在的问题
  suspicion: 混合所有制改革推进缓慢或“混而不改”
  regulation: "[\n  {\n    \"法规名称\": \"关于国有企业发展混合所有制经济的意见\",\n    \"法规文号\": \"国发〔2015〕54号\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第四条\",\n    \"内容概述\": \"规范混合所有制企业法人治理结构，混合所有制企业要建立健全现代企业制度，明晰产权，同股同权，依法保护各类股东权益。\"\n  }\n]"
- expression: 剥离企业办社会职能进度跟踪表.计划完成率 < 100% && (当前日期 - 改革完成时间节点责任部门.改革完成时间节点 > 0) && 医疗机构执业许可证.登记性质 仍为 '企业办'
  description: 进度跟踪表中教育医疗机构改革完成率未达100%，且当前日期已超过实施方案规定的最晚完成时间，同时医疗机构执业许可证仍登记为企业办性质，表明改革滞后或未完成。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
  suspicion: 教育医疗机构改革滞缓或未按方案推进
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于印发加快剥离国有企业办社会职能和解决历史遗留问题工作方案的通知\",\n    \"法规文号\": \"国发〔2016〕19号\",\n    \"效力级别\"\
    : \"行政法规\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"加快剥离国有企业办社会职能，针对教育、医疗机构等实行分类改革，确保2020年年底前基本完成。\"\n  }\n]"
- expression: (账龄区间.账龄区间（如3年以上） > 30%) || (存货分类周转统计表.存货周转天数 > 0.2) || (年度压降目标（金额或占比）.年度压降目标（金额或占比） > 期末两金总额.期末两金总额)
  description: 触发条件一：3年以上长账龄应收账款占全部应收账款的比例超过30%，反映压控失效。触发条件二：存货周转天数同比增加超过20%，反映存货积压加剧。触发条件三：实际压降金额未达到企业自己设定的年度压控目标。以上任一条件触发皆表示两金压控未达标。
  audit_item: 未按规定落实降成本政策措施
  suspicion: 应收账款和存货“两金”压控未达标
  regulation: "[\n  {\n    \"法规名称\": \"中央企业降杠杆减负债指导意见\",\n    \"法规文号\": \"国资发财管[2017]119号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"-\",\n    \"内容概述\": \"要求中央企业加强应收账款和存货管理，严控“两金”占用，加快资金周转，提升资产运营效率。\"\n  },\n  {\n    \"法规名称\": \"降低实体经济企业成本工作方案\"\
    ,\n    \"法规文号\": \"国发〔2016〕48号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"-\",\n    \"内容概述\": \"政府引导企业加强资金管理，通过加快应收账款回收、"
- expression: (报告正文.审计评价段文字内容 CONTAINS '认真贯彻落实' && 底稿.问题数量 > 5) || (报告正文.审计评价段文字内容 CONTAINS '较好' || 意见书.对审计评价的异议内容)
  description: 当报告中评价使用正面定性词但审计发现问题较多（例如超过5个），或评价与被审计单位反馈意见明显矛盾时，判定评价可能失当。
  audit_item: 审计文书校验
  suspicion: 审计评价超出审计范围或自相矛盾
  regulation: "[\n  {\n    \"法规名称\": \"国家审计准则\",\n    \"法规文号\": \"审计署令第8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一百一十二条\"\
    ,\n    \"内容概述\": \"审计评价应当基于审计获取的审计证据，坚持实事求是，不得超越审计职权和范围，做到客观公正、审慎恰当。\"\n  }\n]"
- expression: 竣工验收报告.实际完成建设面积 < 立项批复文件.批复建设面积 || 竣工验收报告.实际完成高效节水灌溉面积 < 立项批复文件.批复高效节水灌溉面积
  description: 项目实际完成的核心量化指标（如建设面积、高效节水灌溉面积）低于批复的目标任务，即构成未完成建设目标。通常以验收报告为准，若实际完成面积低于批复面积超过1%或未达到高效节水灌溉考核要求，判定为违规。
  audit_item: 不符合高标准农田建设相关规定的行为
  suspicion: 未完成高标准农田建设目标任务
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"项目建设单位应当严格按照项目实施计划组织项目实施，按期完成任务。\"\n  }\n]"
- expression: 项目建设实施方案.计划土壤改良措施及面积 > 0 && 土壤改良工程验收报告.实际完成改良面积 == 0 || 土壤改良工程验收报告.实测有机质含量等指标 < 项目建设实施方案.地力提升指标目标值
  description: 实施方案明确要求实施土壤改良，但验收报告显示面积为零或地力指标实测值未达到目标且未整改，即认定未有效实施地力提升工程。目标值与实测值的偏差以主要指标（如有机质含量）为准。
  audit_item: 不符合高标准农田建设相关规定的行为
  suspicion: 未实施土壤改良等地力提升工程
  regulation: "[\n  {\n    \"法规名称\": \"高标准农田建设质量管理办法（试行）\",\n    \"法规文号\": \"农建发〔2021〕1号\",\n    \"效力级别\": \"规范性文件\",\n  \
    \  \"条款号\": \"第十三条\",\n    \"内容概述\": \"耕地地力提升措施应符合国家有关标准要求，不得擅自降低地力提升标准。\"\n  }\n]"
- expression: (质量检测报告.检测指标名称 = '道路厚度' AND 质量检测报告.实测值 < 质量检测报告.设计标准值) || (质量检测报告.检测指标名称 = '混凝土强度' AND 质量检测报告.实测值 < 质量检测报告.设计标准值)
    || (质量检测报告.检测指标名称 = '灌溉保证率' AND 质量检测报告.实测值 < 质量检测报告.设计标准值)
  description: 工程质量核心指标任意一项实测值低于设计要求，且监理整改记录未显示已完成整改或整改验收不合格，即判定为质量不达标。涉及道路、水利等关键设施。
  audit_item: 不符合高标准农田建设相关规定的行为
  suspicion: 建设标准低、质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"高标准农田建设质量管理办法（试行）\",\n    \"法规文号\": \"农建发〔2021〕1号\",\n    \"效力级别\": \"规范性文件\",\n  \
    \  \"条款号\": \"第二十一条\",\n    \"内容概述\": \"工程质量未达到设计要求和合同约定标准的，项目法人应当要求施工单位返工处理，并承担相应责任。\"\n  }\n]"
- expression: 三通工程项目进度表（含完成时间、验收状态）.实际完成时间 IS NULL || 三通工程项目进度表（含完成时间、验收状态）.实际完成时间 > 三通工程项目进度表（含完成时间、验收状态）.计划完成时间 || 三通工程项目进度表（含完成时间、验收状态）.验收状态
    = '未通过' || LENGTH(薄弱学校改善项目验收报告.整改问题) > 0
  description: 项目进度表中未填写实际完成时间、实际完成时间晚于方案规定时限、验收结论为不合格或存在逾期未整改问题，均判定为未完成三通工程建设。
  audit_item: 乡村学校薄弱环节改善不符合相关规定
  suspicion: 未按期完成三通工程建设
  regulation: "[\n  {\n    \"法规名称\": \"教育部 国家发展改革委 财政部关于深入推进义务教育薄弱环节改善与能力提升工作的意见\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"无\",\n    \"内容概述\": \"要求各地按照规划时间表完成信息化基础设施建设，实现宽带网络校校通、优质资源班班通、网络学习空间人人通，确保所有项目学校达到标准要求。\"\n \
    \ }\n]"
- expression: (COUNT(CASE WHEN 订单定向医学生分配去向登记表.单位层级 = '县级以下' THEN 1 END) / COUNT(订单定向医学生分配去向登记表.毕业生姓名)) * 100 < 80
  description: 若当年度订单定向毕业生分配到县级以下农村基层医疗卫生机构的比例低于80%，即判定为政策未倾斜，阈值可依据各省实施方案调整。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不合规
  suspicion: 订单定向医学生分配未向农村基层倾斜
  regulation: "[\n  {\n    \"法规名称\": \"关于做好农村订单定向免费培养医学生就业安置和履约管理工作的通知\",\n    \"法规文号\": \"国卫科教发〔2019〕56号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"二、切实做好就业安置工作\",\n    \"内容概述\": \"订单定向医学生毕业后应按照入学前签署的定向就业协议，到协议约定的农村基层医疗卫生机构服务；各地要将定向生就业安置与基层卫生人才补充同步推进，确保人尽其用。\"\
    \n  }\n]"
- expression: 保护任务完成进度跟踪表.实际完成面积 < 年度黑土地保护任务分解表.计划面积
  description: 将进度跟踪表按区域或年度汇总的实际完成面积与任务分解表中对应分区的计划面积累加值进行比对，当实际完成面积小于计划面积时，触发疑点，完成率低于100%即判定为面积任务未完成，偏差越大问题越严重。
  audit_item: 任务目标未完成
  suspicion: 黑土地保护面积任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当将黑土地保护纳入国民经济和社会发展规划，安排资金，确保黑土地面积不减、质量不降，生态功能不退化。\"\n  }\n]"
- expression: (设备采购供应商清单.采购占比 = 100% AND 设备采购供应商清单.是否用户自选 = '否') OR (设备采购供应商清单.采购占比 = 100% AND 用户投诉工单数据库.内容 包含 '强制购买') OR
    (电力设施供应商合作协议.排他性约定 包含 '必须向乙方采购') OR (设备采购单价 > 市场均价 * 1.3)
  description: 判定逻辑：任一条件满足即视为违规。1.某一区域（如一个乡镇）内所有农户新装或改造设备采购均来自同一供应商且无用户自主选择记录；2.用户投诉工单中出现强制消费描述经核实属实；3.合作协议中订有不公平排他条款，限制用户从其他渠道购买；4.指定设备单价明显高于同期市场均价30%以上。
  audit_item: 供电服务不合规
  suspicion: 强制农户购买指定厂家设备
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国反垄断法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十七条\",\n    \"内容概述\": \"禁止具有市场支配地位的经营者没有正当理由，限定交易相对人只能与其进行交易或者只能与其指定的经营者进行交易。\"\n  },\n  {\n    \"法规名称\": \"优化营商环境条例\"\
    ,\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十六条\",\n    \"内容概述\": \"任何单位和个人不得强制或者变相强制市场主体接受中介服务、"
- expression: (同一馈线年故障停电次数 > 6) AND (投诉工单.同区域停电投诉 > 3 AND 投诉工单.处理结果 ≠ '已彻底解决') OR (电压监测点.低电压占比 > 5% AND 该区域无对应改造项目记录 ) OR
    (改造方案.项目实际竣工日期 IS NULL 且 计划竣工日期已过去180天以上)
  description: 判定：1.某馈线年故障停电次数超过6次，且该区域已有3次以上投诉且未显示“已彻底解决”，视为整治不到位；2.某监测点月低电压时间占比超过5%，且未在改造方案中发现相匹配的整改项目；3.已列入改造计划的项目逾期半年以上仍未竣工。上述任一满足即触发。
  audit_item: 供电服务不合规
  suspicion: 频繁停电与低电压整改不力
  regulation: "[\n  {\n    \"法规名称\": \"供电监管办法\",\n    \"法规文号\": \"国家能源局令第1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\"\
    ,\n    \"内容概述\": \"供电企业应当对用户投诉的低电压、频繁停电等电能质量问题及时核查、处理，并采取措施予以解决。\"\n  },\n  {\n    \"法规名称\": \"农村电网改造升级管理办法\",\n    \"\
    法规文号\": \"发改能源规〔2020〕641号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十四条\",\n    \"内容概述\": \"项目单位应按规定进度完成改造升级任务，加强工程管理，确"
- expression: 村级信息服务站建设清单.面积 < 20 || 村级信息服务站选址审批文件.批复同意地址 != 村级信息服务站建设清单.地址 || (村级信息服务站建设清单.电脑数量 < 1 || 村级信息服务站建设清单.显示屏数量
    < 1)
  description: 服务站面积小于标准面积（如低于20㎡），或实际建设地址与批复地址不一致（含擅自变更选址），或未配备规定设备如电脑、显示屏，视为选址建设不合规。
  audit_item: 信息进村入户工程实施不到位
  suspicion: 村级信息服务站选址建设不合规
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推进信息进村入户工程的实施意见\",\n    \"法规文号\": \"农市发[2016]3号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"第二部分第（一）条\",\n    \"内容概述\": \"村级信息服务站应选址在村民集聚区域，面积不低于20平方米，统一配备电脑、显示屏等必要设备，严禁擅自变更选址。\"\n  }\n]"
- expression: (面积统计表.实际完成面积 < 绩效自评报告.上报完成面积) || (面积统计表.实际完成面积 < 实施方案.改革目标面积 * 0.9)
