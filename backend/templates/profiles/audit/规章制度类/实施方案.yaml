name: audit/规章制度类/实施方案
type: model
description: 从规章制度类类文档（实施方案）中提取结构化元数据。涵盖字段如：三通工程建设完成时限、两工程协同推进的顶层设计要求、产业布局指标、产值目标分解、任务分解区域分布、任务属性说明、任务清单、保护目标。文档范围包括：上级实施方案、两金压控工作实施方案、乡村教师信息化培训计划与实施方案、乡村教师生活补助政策实施方案、乡村绿化美化专项规划实施方案、产业项目实施方案、传统村落保护整体实施方案、传统村落保护项目实施方案、信息进村入户工程实施方案、修复实施方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 台账
- 工程
- 明细
- 元数据提取
