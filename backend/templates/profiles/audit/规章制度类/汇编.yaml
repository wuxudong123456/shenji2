name: audit/规章制度类/汇编
type: model
description: 从规章制度类类文档（汇编）中提取结构化元数据。涵盖字段如：开放时长要求、接待管理相关章节、收费管理规定、用途管制条款、禁止性规定。文档范围包括：单位内部控制制度汇编、文化站运营管理制度汇编等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 汇编
  member_count: 1
  member_details:
  - 单位内部控制制度汇编
  - 文化站运营管理制度汇编
output:
  fields:
  - name: 开放时长要求
    type: string
    description: 提取 开放时长要求 的文本值
  - name: 接待管理相关章节
    type: string
    description: 提取 接待管理相关章节 的文本值
  - name: 收费管理规定
    type: number
    description: 提取 收费管理规定 的数值（含单位，如万元、吨等）
  - name: 用途管制条款
    type: number
    description: 提取 用途管制条款 的数值（含单位，如万元、吨等）
  - name: 禁止性规定
    type: string
    description: 提取 禁止性规定 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 公务接待管理制度文件 IS NULL || (公务接待管理制度文件.主要内容 NOT CONTAIN '接待范围' || 公务接待管理制度文件.主要内容 NOT CONTAIN '接待标准' || 公务接待管理制度文件.主要内容
    NOT CONTAIN '审批程序' || 公务接待管理制度文件.主要内容 NOT CONTAIN '报销要件')
  description: 单位未制定专门的公务接待管理办法，或虽制定但缺少接待范围、标准、审批程序、报销要求等核心要素中的任意两项，即构成制度不健全。
  audit_item: 公务接待管理不符合规定
  suspicion: 未建立或健全公务接待管理制度
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"各级党政机关应当建立健全公务接待管理制度，完善公务接待审批控制、预算管理和财务报销制度，并严格执行。\"\n  }\n]"
- expression: (排查台账.占用状态 = '非文化用途占用' && 排查台账.占用性质 != '临时借用且经审批') || (使用日期、使用行为描述、申请人/单位.使用行为描述 NOT IN ('图书阅览','文化活动','培训讲座','群众文体活动')
    && 使用日期、使用行为描述、申请人/单位.使用行为描述 IS NOT NULL) || (影像资料.实际用途照片 显示非文化功能使用)
  description: 排查台账明确记录为被非文化用途占用，且非经审批的临时借用即触发；或者使用登记表连续出现非文化类活动记录；或者现场影像显示堆放杂物、改为办公用房等情形均视为占用。
  audit_item: 文化馆（站）等建设运营管护不合规
  suspicion: 村级文化室及设施被违规占用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公共文化服务保障法\",\n    \"法规文号\": \"主席令第六十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"任何单位和个人不得擅自拆除公共文化设施，不得擅自改变公共文化设施的功能、用途或者妨碍其正常运行。\"\n  },\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\"\
    ,\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"文化站应确保业务用房使用面积和正常开放，不得挤占、挪作"
- expression: (每日开放时间、值班人员.收费项目 存在 && 公示开放时间、免费服务项目 无对应法定收费依据) || (每日开放时间、值班人员.金额 > 0 && 每日开放时间、值班人员.票据号 为空) || (实际公示位置和内容完整度、实际收取费用、实际开放时刻、收费行为记录
    显示实际开放日时长 < 公示开放时间、免费服务项目.公示开放时间 * 0.8) || (公示开放时间、免费服务项目 缺失 明确开放时间或未在显著位置公示)
  description: 出现未经公示的收费项目、收费无正规票据，或实际开放时长低于公告时长80%，或未按规定公示开放时间，均视为违规。
  audit_item: 文化馆（站）等建设运营管护不合规
  suspicion: 文化站违规收费或开放时间不固定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公共文化服务保障法\",\n    \"法规文号\": \"主席令第六十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十一条\",\n    \"内容概述\": \"公共文化设施应当根据其功能、特点，按照国家有关规定，向公众免费或者优惠开放；收费项目应当有法律法规依据并公示。\"\n  },\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\"\
    ,\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条、第十六条\",\n    \"内容概述\": \"文化站应规定开放时间并在显著"
