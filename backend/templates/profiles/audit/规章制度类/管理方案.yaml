name: audit/规章制度类/管理方案
type: model
description: 从规章制度类类文档（管理方案）中提取结构化元数据。涵盖字段如：任务清单、内部调剂利率、归集目标比例、归集频次、整合范围、责任主体。文档范围包括：资金整合与统筹管理方案、资金集中管理方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 管理方案
  member_count: 1
  member_details:
  - 资金整合与统筹管理方案
  - 资金集中管理方案
output:
  fields:
  - name: 任务清单
    type: string
    description: 提取 任务清单 的文本值
  - name: 内部调剂利率
    type: string
    description: 提取 内部调剂利率 的文本值
  - name: 归集目标比例
    type: number
    description: 提取 归集目标比例 的数值（含单位，如万元、吨等）
  - name: 归集频次
    type: string
    description: 提取 归集频次 的文本值
  - name: 整合范围
    type: string
    description: 提取 整合范围 的文本值
  - name: 责任主体
    type: string
    description: 提取 责任主体 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 各账户日均余额、可归集资金、实际归集金额中(实际归集金额 / (各账户日均余额、可归集资金、实际归集金额.各账户日均余额 - 各账户日均余额、可归集资金、实际归集金额.可归集资金) ) < 0.8 && 同时存在高息贷款余额
    > 500万元
  description: 在未受限资金较为充裕的情况下，资金归集率不足80%，且公司外部贷款利息支出显著，即存在资金集中度不高、存贷双高问题。
  audit_item: 资金管理方面存在的问题
  suspicion: 资金集中度不达标
  regulation: "[\n  {\n    \"法规名称\": \"企业内部控制应用指引第6号——资金活动\",\n    \"法规文号\": \"财会[2010]11号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第三条\",\n    \"内容概述\": \"企业应当通过内部资金调度与归集管理，提高资金使用效率，防止资金沉淀，降低融资成本。\"\n  }\n]"
- expression: 明细台账.资金用途 NOT IN 整合范围、任务清单、责任主体.任务清单 OR (同一区域分组下 MAX(明细台账.项目进度) - MIN(明细台账.项目进度) > 30)
  description: 资金实际用途不在整合方案规定的任务清单内，或同一区域内不同来源资金的项目实施进度差异超过30天，表明统筹整合执行不到位。
  audit_item: 违反高标准农田项目规划和管理规定的行为
  suspicion: 项目资金统筹整合不到位
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于探索建立涉农资金统筹整合长效机制的意见\",\n    \"法规文号\": \"国发〔2017〕54号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"二（一）\",\n    \"内容概述\": \"实行‘大专项+任务清单’管理，约束性任务与指导性任务分类明确，推动资金统筹使用，防止碎片化。\"\n  }\n]"
