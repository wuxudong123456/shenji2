name: audit/规章制度类/养护计划
type: model
description: 从规章制度类类文档（养护计划）中提取结构化元数据。涵盖字段如：已实施的修复部位及工程量。文档范围包括：上一期养护计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 工程
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 养护计划
  member_count: 1
  member_details:
  - 上一期养护计划
output:
  fields:
  - name: 已实施的修复部位及工程量
    type: string
    description: 提取 已实施的修复部位及工程量 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (检测报告.养护加固建议章节.优先级 == '紧急' && 已实施的修复部位及工程量.方案状态 != '已实施') || (检测报告.养护加固建议章节.措施 == '裂缝封闭' && 病害统计.裂缝宽度 > 1.5mm)
    || (检测报告.养护加固建议章节 仅包含 '日常养护' && 病害统计.结构受力裂缝 存在)
  description: 对于重度荷载裂缝（宽度>1.5mm），仅建议封闭是表面治标。往期建议的紧急修复未实施且本次评级未下降，说明建议与实施脱节。若严重害存在却只建议清扫、清理伸缩缝等非结构性养护，存在应付式建议嫌疑。
  audit_item: 道路桥梁安全定期检测审计
  suspicion: 养护加固建议脱离实际
  regulation: "[\n  {\n    \"法规名称\": \"公路桥涵养护规范\",\n    \"法规文号\": \"JTG 5120-2021\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"5.3\",\n    \"内容概述\": \"针对检查中发现的病害，应综合分析原因，提出具体、可操作的维修保养或加固改造技术建议，并确定实施的优先次序。\"\n  },\n  {\n    \"法规名称\": \"工程咨询行业管理办法\"\
    ,\n    \"法规文号\": \"国家发展改革委令第9号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"咨询成果文件必须符合客观实际情况，不得隐瞒"
