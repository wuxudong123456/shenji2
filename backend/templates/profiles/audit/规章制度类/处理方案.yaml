name: audit/规章制度类/处理方案
type: model
description: 从规章制度类类文档（处理方案）中提取结构化元数据。涵盖字段如：堆存点选址要求、挂账化解措施、社保欠费处理措施、补缴计划、责任人、责任部门、防渗措施设计。文档范围包括：历史遗留问题专项处理方案、清淤底泥处理方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 处理方案
  member_count: 1
  member_details:
  - 历史遗留问题专项处理方案
  - 清淤底泥处理方案
output:
  fields:
  - name: 堆存点选址要求
    type: string
    description: 提取 堆存点选址要求 的文本值
  - name: 挂账化解措施
    type: string
    description: 提取 挂账化解措施 的文本值
  - name: 社保欠费处理措施
    type: number
    description: 提取 社保欠费处理措施 的数值（含单位，如万元、吨等）
  - name: 补缴计划
    type: string
    description: 提取 补缴计划 的文本值
  - name: 责任人
    type: string
    description: 提取 责任人 的文本值
  - name: 责任部门
    type: string
    description: 提取 责任部门 的文本值
  - name: 防渗措施设计
    type: string
    description: 提取 防渗措施设计 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 财务挂账明细表（含账龄分析）.账龄 > 3 && 财务挂账明细表（含账龄分析）.核销状态 = "未处理" && (历史遗留问题专项处理方案.挂账化解措施 IS NULL || 历史遗留问题专项处理方案.补缴计划 <
    财务挂账明细表（含账龄分析）.挂账金额 * 0.5)
  description: 账龄超过3年且无明确处理方案，或方案计划处理金额不足挂账总额的50%，判定为历史遗留问题处理不到位，存在挂账长期不清理风险。高风险。
  audit_item: 供销合作社综合改革不合规
  suspicion: 财务挂账长期挂账未处理
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第四部分（十六）\",\n    \"内容概述\": \"要求按照有关政策规定，对历史形成的亏损挂账、金融债务、社有企业职工社会保障等遗留问题，积极稳妥加以解决；对确实无法收回的资产和债权，按规定程序核销。\"\
    \n  }\n]"
- expression: (职工社保欠缴明细表.欠缴金额 > 0 && 职工社保欠缴明细表.欠缴年份 <= 2020) && (历史遗留问题专项处理方案.补缴计划 IS NULL || 职工社保缴纳凭证.金额 < 职工社保欠缴明细表.欠缴金额
    * 0.8)
  description: 改革启动年（假定为2020年）前的社保历史欠费未制定补缴计划，或截至审计日实际补缴到账金额低于欠费总额的80%（不含滞纳金），视为历史遗留问题处理不到位，严重损害职工权益。高风险。
  audit_item: 供销合作社综合改革不合规
  suspicion: 职工社保欠缴未补缴
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第四部分（十六）\",\n    \"内容概述\": \"要求对社有企业职工社会保障等遗留问题积极稳妥加以解决，保障职工合法权益。\"\n  }\n]"
- expression: (产生水体、底泥数量(吨).最终去向 = '河岸堆放' || 产生水体、底泥数量(吨).接收单位 IS NULL) && (重金属含量（如镉、汞、铅）.重金属含量（如镉、汞、铅） > 农用污泥污染物控制标准.限值 ||
    影像资料.防渗设施 = '无')
  description: 表达式判定：首先，核对运输记录，底泥最终去向为‘河岸边简易堆放’或缺乏明确的、有资质的接收单位；其次，同时满足底泥检测报告显示污染物含量超标，或现场勘查影像资料证实堆放点无防渗膜等任何防渗漏措施。两者构成“且”关系，判定为违规处置，存在二次污染风险。
  audit_item: 农村黑臭水体治理不到位
  suspicion: 清淤底泥违规堆放导致二次污染
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"中华人民共和国主席令第43号\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第二十条、第二十一条\",\n    \"内容概述\": \"产生、收集、贮存、运输、利用、处置固体废物的单位和其他生产经营者，应当采取防扬散、防流失、防渗漏或者其他防止污染环境的措施。禁止向江河、湖泊、渠道、水库及其最高水位线以下的滩地和岸坡以及法律法规规定的其他地点倾倒、堆放、贮存固体废物。\"\
    \n  }\n]"
