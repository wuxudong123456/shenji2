name: audit/规章制度类/技术规程
type: model
description: 从规章制度类类文档（技术规程）中提取结构化元数据。涵盖字段如：技术措施规范、有机质目标值、监测点密度标准、监测频次要求。文档范围包括：土壤有机质提升技术规程、耕地质量监测技术规程等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 技术规程
  member_count: 1
  member_details:
  - 土壤有机质提升技术规程
  - 耕地质量监测技术规程
output:
  fields:
  - name: 技术措施规范
    type: string
    description: 提取 技术措施规范 的文本值
  - name: 有机质目标值
    type: string
    description: 提取 有机质目标值 的文本值
  - name: 监测点密度标准
    type: string
    description: 提取 监测点密度标准 的文本值
  - name: 监测频次要求
    type: string
    description: 提取 监测频次要求 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 耕地土壤有机质含量监测数据表.有机质含量 < 土壤有机质提升技术规程.有机质目标值
  description: 以地方制定的有机质提升技术规程或考核目标中的有机质含量标准为依据，当监测数据表中任一有效监测点位的土壤有机质含量低于该目标值时，即判定为该点位未达标；若未达标点位数量达到一定比例（如超过10%）或连续年度下降，则认定为耕地土壤有机质含量整体未达标。
  audit_item: 任务目标未完成
  suspicion: 耕地土壤有机质含量未达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当将黑土地保护纳入国民经济和社会发展规划，安排资金，确保黑土地面积不减、质量不降，生态功能不退化。\"\n  }\n]"
- expression: (SELECT COUNT(*) FROM 监测数据 WHERE 项目ID = 目标项目ID AND 监测日期 在考核周期内) = 0 OR (项目区面积 / (SELECT COUNT(DISTINCT 监测点编号)
    FROM 监测数据 WHERE 项目ID = 目标项目ID) > 1000)
  description: 考核周期内（如年度）无任何耕地质量监测记录，或平均每1000亩监测点少于1个，判定为未按规定开展监测。1000亩/点依据《耕地质量监测技术规程》最低要求。
  audit_item: 高标准农田管护使用不符合相关规定
  suspicion: 高标准农田未开展耕地质量监测
  regulation: "[\n  {\n    \"法规名称\": \"耕地质量调查监测与评价办法\",\n    \"法规文号\": \"农业农村部令2016年第2号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十一条\",\n    \"内容概述\": \"县级以上地方人民政府农业农村主管部门应当按照耕地质量监测技术规程要求，设立监测点，开展耕地质量监测。\"\n  }\n]"
