name: audit/规章制度类/养护办法
type: model
description: 从规章制度类类文档（养护办法）中提取结构化元数据。涵盖字段如：养护主体定义、清单引述条款、责任划分条款。文档范围包括：农村公路管理养护办法等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 养护办法
  member_count: 1
  member_details:
  - 农村公路管理养护办法
output:
  fields:
  - name: 养护主体定义
    type: string
    description: 提取 养护主体定义 的文本值
  - name: 清单引述条款
    type: number
    description: 提取 清单引述条款 的数值（含单位，如万元、吨等）
  - name: 责任划分条款
    type: number
    description: 提取 责任划分条款 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: FILE(责任清单.文件存在性) IS NULL || (责任划分条款中无明确交通局、乡镇政府、村委会养护责任边界) || (记录表.涉及部门中同一路段存在多个部门重复列支记录 || 记录表.未解决事项标记中存在长期未解决争议事项且无上级裁定)
  description: 判定权责体系是否健全：1.权责清单缺失直接违规；2.养护办法未明确各级责任主体边界；3.跨部门协调记录显示多头管理或管理空白且未解决。任一条件触发即为疑点。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 农村公路管理养护权责不清缺乏统筹
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于深化农村公路管理养护体制改革的意见\",\n    \"法规文号\": \"国办发〔2019〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条（三）\",\n    \"内容概述\": \"明确地方各级人民政府和有关部门的农村公路管理养护权力和责任清单，实行农村公路管理养护责任制。\"\n  }\n]"
- expression: FILE(责任清单.文件存在性) IS NULL || (FILE(养护办法.清单引述条款)未引用或明确权责清单) || (FILE(责任清单.细化到岗位的职责描述)中未细化到具体岗位职责)
  description: 未出台权责清单文件，或制发文件但职责笼统未细化到养护巡查、资金拨付等具体岗位，均视为未有效制定清单。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 未制定农村公路管理养护权力和责任清单
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于深化农村公路管理养护体制改革的意见\",\n    \"法规文号\": \"国办发〔2019〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条（五）\",\n    \"内容概述\": \"地方各级人民政府要制定相关部门、乡镇人民政府的农村公路管理养护权力和责任清单，细化到具体岗位。\"\n  }\n]"
