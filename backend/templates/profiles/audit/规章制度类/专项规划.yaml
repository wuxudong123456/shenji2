name: audit/规章制度类/专项规划
type: model
description: 从规章制度类类文档（专项规划）中提取结构化元数据。涵盖字段如：专项规划编制日期、产业配套要求、供电方案要求、垃圾分类减量阶段目标、安置原则、审批日期、行政村名、补偿标准。文档范围包括：乡村绿化美化专项规划、充电基础设施专项规划（村级）、农村客运专项规划、农村生活垃圾治理专项规划、湖心岛、江心岛渔民搬迁安置专项规划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 审批
- 项目
- 验收
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 专项规划
  member_count: 1
  member_details:
  - 乡村绿化美化专项规划
  - 充电基础设施专项规划（村级）
  - 农村客运专项规划
  - 农村生活垃圾治理专项规划
  - 湖心岛、江心岛渔民搬迁安置专项规划
output:
  fields:
  - name: 专项规划编制日期
    type: date
    description: 提取 专项规划编制日期 的日期值，格式 YYYY-MM-DD
  - name: 产业配套要求
    type: string
    description: 提取 产业配套要求 的文本值
  - name: 供电方案要求
    type: string
    description: 提取 供电方案要求 的文本值
  - name: 垃圾分类减量阶段目标
    type: string
    description: 提取 垃圾分类减量阶段目标 的文本值
  - name: 安置原则
    type: string
    description: 提取 安置原则 的文本值
  - name: 审批日期
    type: date
    description: 提取 审批日期 的日期值，格式 YYYY-MM-DD
  - name: 行政村名
    type: string
    description: 提取 行政村名 的文本值
  - name: 补偿标准
    type: string
    description: 提取 补偿标准 的文本值
  - name: 覆盖建制村数
    type: string
    description: 提取 覆盖建制村数 的文本值
  - name: 规划中转站数量
    type: number
    description: 提取 规划中转站数量 的数值（含单位，如万元、吨等）
  - name: 规划充电桩数量
    type: number
    description: 提取 规划充电桩数量 的数值（含单位，如万元、吨等）
  - name: 规划完成时限
    type: string
    description: 提取 规划完成时限 的文本值
  - name: 规划客运站点位置及数量
    type: number
    description: 提取 规划客运站点位置及数量 的数值（含单位，如万元、吨等）
  - name: 规划替代或扩建方案
    type: string
    description: 提取 规划替代或扩建方案 的文本值
  - name: 规划清运覆盖村数
    type: string
    description: 提取 规划清运覆盖村数 的文本值
  - name: 规划的绿化项目清单及坐标
    type: string
    description: 提取 规划的绿化项目清单及坐标 的文本值
  - name: 预期立项时间
    type: date
    description: 提取 预期立项时间 的日期值，格式 YYYY-MM-DD
  - name: 验收标准
    type: string
    description: 提取 验收标准 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (规划中转站数量.规划中转站数量 - 验收报告.实际建成中转站数量) / 规划中转站数量.规划中转站数量 > 0.2 || (MAX(运处台账.同一村庄清运间隔天数) > 7) || (日报.出勤车辆 < 规划中转站数量.规划中转站数量
    * 0.6)
  description: 建成率低于80%视为进展慢；同一村庄最长清运间隔超过7天视为不能及时清运；出勤车辆低于配置数量60%表明运力不足，致使垃圾随意堆放。满足任一条件即触发疑点。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 村镇垃圾随意丢弃堆放，清运任务进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当加强农村生活垃圾污染环境的防治，组织、指导对生活垃圾的清扫、收集、运输和处理。\"\n  },\n  {\n    \"法规名称\": \"农村人居环境整治提升五年行动方案（2021-2025年）\"\
    ,\n    \"法规文号\": \"厅字〔2021〕44号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、（六）\",\n    \"内容概述\": \"健全"
- expression: (扩容计划立项日期.剩余库容 / 设计总库容 < 0.05) && (扩容计划立项日期.扩容计划立项日期 IS NULL || 专项规划.规划替代或扩建方案 IS NULL) && (每日清运趟次.日进场垃圾量 >
    0)
  description: 当剩余库容不足5%（接近饱和），且无扩容计划或替代方案立项，同时仍在继续接收垃圾，即判定为存在饱和风险未及时应对，可能导致未来垃圾无处可去甚至超量填埋。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 垃圾填埋场趋于饱和未及时扩容
  regulation: "[\n  {\n    \"法规名称\": \"城镇生活垃圾卫生填埋场运行维护技术规程\",\n    \"法规文号\": \"CJJ 93-2011\",\n    \"效力级别\": \"行业规范\",\n \
    \   \"条款号\": \"3.2.6\",\n    \"内容概述\": \"填埋场达到设计使用年限或填埋容量达到设计库容时，应及时封场并同步建设新的处理设施或采取替代方案。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"\
    县级以上人民政府应当统筹安"
- expression: (统计表.分类收集覆盖率 < 专项规划.垃圾分类减量阶段目标 * 0.6) || (统计表.节点任务完成时间 - 专项规划.预期立项时间 > 90天) || (培训记录.培训时间 < 4) || (拨付文件.垃圾分类专项经费拨付金额
    > 0 && 拨付文件.支出明细 / 垃圾分类专项经费拨付金额 > 0.3)
  description: 分类覆盖率不足规划目标的60%，或关键任务延迟超过3个月，或培训次数每季度不足1次，或专项资金中超过30%用于无关接待等非直接工作，均判定为工作未开展或严重滞后。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 垃圾分类减量工作未开展或进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十三条\",\n    \"内容概述\": \"县级以上人民政府应当建立生活垃圾分类制度，统筹生活垃圾分类投放、分类收集、分类运输、分类处理系统。\"\n  },\n  {\n    \"法规名称\": \"住房和城乡建设部等部门关于在全国地级及以上城市全面开展生活垃圾分类工作的通知\"\
    ,\n    \"法规文号\": \"建城〔2019〕56号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"四\",\n    \"内容概述"
- expression: (对比表.实际建成桩数 / 专项规划.规划充电桩数量) < 0.5 AND 当前日期 >= 专项规划.规划完成时限
  description: 截至规划截止日期，实际建成充电桩数量不足规划数量的50%，表明专项规划执行严重滞后，基层落实不力。若完成率为0%，列为典型无作为。
  audit_item: 农村用能清洁低碳转型不到位
  suspicion: 村级充电桩建设进度严重滞后于规划目标
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加快电动汽车充电基础设施建设的指导意见\",\n    \"法规文号\": \"国办发〔2015〕73号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条（加大建设力度）\",\n    \"内容概述\": \"各地要将充电基础设施专项规划有关内容纳入城乡规划，明确各类充电设施的建设规模和进度安排，确保按期建成。\"\n  }\n]"
- expression: 桩编号.月度充电量（kWh） = 0 AND 桩编号.使用次数 >= 3 AND 桩编号.接入电源类型 != '专用变压器'
  description: 充电桩连续3个月无任何充电记录，且接入的是普通公用照明电路而非专用变压器，可判定因电力配套不足导致设施闲置，形成“僵尸桩”，属于财政资金浪费。
  audit_item: 农村用能清洁低碳转型不到位
  suspicion: 村级充电桩因电力配套不足沦为闲置设施
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条\"\
    ,\n    \"内容概述\": \"政府投资项目应当保障建设条件，确保项目建成后有效运行，避免形成闲置资产。\"\n  }\n]"
- expression: 专项规划编制日期、审批日期、规划的绿化项目清单及坐标.审批日期 > 规划文本中绿化用地布局专章、规划图斑坐标.批复日期 + 365天 || (实际已实施绿化项目名称、坐标、面积、地类、农田周边林带现状林木数量、断带长度.坐标
    ⊄ 规划文本中绿化用地布局专章、规划图斑坐标.规划图斑坐标)
  description: 专项规划应在总体规划批复后一年内完成衔接，否则视为规划脱节；实际绿化项目的实施范围若未落入总体规划划定的绿化用地图斑内，即存在未纳入规划或违规占用其他用地风险。
  audit_item: 村容村貌整体提升不符合相关规定
  suspicion: 乡村绿化美化未纳入国土空间总体规划编制
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十二条、第二十七条\",\n    \"内容概述\": \"城乡规划应当依据国民经济和社会发展规划，并与土地利用总体规划相衔接；乡规划、村庄规划应当从农村实际出发，尊重村民意愿，体现地方和农村特色。\"\n  },\n  {\n \
    \   \"法规名称\": \"中共中央 国务院关于建立国土空间规划体系并监督实施的若干意见\",\n    \"法规文号\": \"中发〔2019〕18号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\"\
    : \""
- expression: (身份证号、原住址类型、安置类型、补偿总额.安置类型 = '城镇集中安置' && 身份证号、原住址类型、安置类型、补偿总额.产业配套计划 IS NULL) || (身份证号、原住址类型、安置类型、补偿总额.补偿总额
    < 安置原则、补偿标准、产业配套要求.补偿标准)
  description: 筛选湖心岛、江心岛渔民搬迁安置记录中，安置类型为城镇集中安置但无产业配套计划的，或补偿总额低于政策最低标准的，视为未因地制宜安置，可能导致渔民无法适应新环境。
  audit_item: 退捕渔民转产安置不合规
  suspicion: 湖心岛、江心岛渔民搬迁安置未因地制宜
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江流域重点水域禁捕和退捕渔民安置保障工作的意见\",\n    \"法规文号\": \"国办发〔2020〕31号\",\n    \"效力级别\"\
    : \"行政法规\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"要求对湖心岛等特殊区域渔民因地制宜采取安置方式，宜发展乡村旅游等特色产业，不得简单一搬了之，同时应保障合理补偿和后续就业。\"\n\
    \  }\n]"
- expression: (项目设计文件中客运站点设计内容缺失 || 施工合同中无客运站点施工计划) || (公路竣工日期 IS NOT NULL && (客运站点竣工日期 IS NULL || 客运站点竣工日期 > 公路竣工日期 + 90天))
  description: 设计或施工阶段缺失客运站点，或公路竣工验收后超过90天客运站点仍未竣工，判定为未同步。90天为合理施工宽限期，可根据项目规模调整。
  audit_item: 项目建设养护未实现政策目标
  suspicion: 农村客运站点未与公路同步设计施工交付
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十五条\",\n    \"内容概述\": \"农村公路建设项目应当加强质量管理，按照有关标准和设计要求，同步建设交通安全、防护、排水等附属设施，并与主体工程同步设计、同步施工、同步投入使用。\"\n  }\n]"
- expression: (实际运营线路数 < 计划线路数 * 0.8) || (线路停运数量 > 0) || (日均载客量 < 0.2 * 车辆核定载客数 && 补贴到位率 < 100%)
  description: 线路开通率低于计划的80%或存在停运线路即触发疑点；日均载客量低于满载的20%且财政补贴未足额到位判定为无效益运营，补贴到位率=实拨金额/应拨金额。
  audit_item: 项目建设养护未实现政策目标
  suspicion: 农村客运线路开通率低或停运无收益
  regulation: "[\n  {\n    \"法规名称\": \"关于稳步推进城乡交通运输一体化提升公共服务水平的指导意见\",\n    \"法规文号\": \"交运发〔2016〕184号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第（四）条\",\n    \"内容概述\": \"要求完善农村客运服务网络，提高建制村通客车比例，保障已开通线路稳定运行，建立运营补贴机制。\"\n  }\n]"
