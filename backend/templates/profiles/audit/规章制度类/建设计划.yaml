name: audit/规章制度类/建设计划
type: model
description: 从规章制度类类文档（建设计划）中提取结构化元数据。涵盖字段如：型号、建设地点、建设期限、计划安装数量。文档范围包括：建设计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 建设计划
  member_count: 1
  member_details:
  - 建设计划
output:
  fields:
  - name: 型号
    type: string
    description: 提取 型号 的文本值
  - name: 建设地点
    type: string
    description: 提取 建设地点 的文本值
  - name: 建设期限
    type: string
    description: 提取 建设期限 的文本值
  - name: 计划安装数量
    type: number
    description: 提取 计划安装数量 的数值（含单位，如万元、吨等）
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 设施台账.已建成数量 < 建设计划.计划安装数量 * 0.9 || 验收记录.验收合格数量 < 建设计划.计划安装数量
  description: 实际建成并验收合格的数量低于计划建设数量的90%，或验收合格数量低于计划数，即认定为未完成建设任务。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 计量设施建设任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"三、建立健全农业水价形成机制（七）\",\n    \"内容概述\": \"新建、改扩建工程要同步建设计量设施；尚未配备计量设施的已建工程要抓紧改造。各地要加快配套完善计量设施建设，确保计量供水收费基础。\"\
    \n  }\n]"
