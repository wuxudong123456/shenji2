violations:
- expression: (姓名、原职务、离职时间.新任职企业名称 IN (企业名称、业务关系存续时间)) && (DATEDIFF(离职时间, 新任职起始时间) < 1095) && (新任职企业.业务范围 IN 原企业经营业务类别)
  description: 筛查离职或退休后三年内（1095天）到与原任职企业有业务关系的私营企业、外资企业或中介机构担任职务或投资入股，且从事与原业务相关的经营活动。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 离职或退休后违规在与原企业有业务关系的企业任职或入股
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第七项\",\n    \"内容概述\": \"离职或者退休后三年内，不得在与原任职企业有业务关系的私营企业、外资企业和中介机构担任职务、投资入股，或者在上述企业或者机构从事、代理与原任职企业经营业务相关的经营活动。\"\
    \n  }\n]"
- expression: 预算单位、公务接待费预算金额.公务接待费预算金额 > 公务接待费决算支出金额.公务接待费决算支出金额 * (1 - 规定压缩比例或上限标准.规定压缩比例或上限标准)
  description: 假设地方政府规定压缩比例为10%，则表达式为：本年度预算金额 > 上年度决算支出 * 0.9。若实际压缩比例不同，须替换对应数值。计算结果成立且单位未能提供合规预算调整审批文件及正当理由，则确认为未按规定压缩预算。
  audit_item: 未按规定编制公务接待费预算
  suspicion: 未按规定压缩公务接待费预算
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第十一条\",\n    \"内容概述\": \"县级以上人民政府应当将公务接待费纳入预算管理，严格控制公务接待费支出，按规定压缩。\"\n  },\n  {\n    \"法规名称\": \"地方政府或上级部门关于公务接待费的管理规定\"\
    ,\n    \"法规文号\": \"无（依据具体地方文件）\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"相关压缩比例条款\",\n    \"内容概述\": \"明确年度公务接待费预算在上"
- expression: ${规定时限、实际批复时间.实际批复时间} > ${规定的截止日期.规定的截止日期}
  description: 当对所属单位预算的实际批复日期晚于法规或上级部门明文规定的最晚批复日期时，触发违规判定。规定时限通常为人大批准预算后20日内向本级部门批复，部门在接到批复后15日内向所属单位批复。实际批复时间取批复文件日期或签收记录中的较晚者，任何超期均视为违规。
  audit_item: 违规批复预算
  suspicion: 未按规定时限批复所属单位预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第五十二条\",\n    \"内容概述\": \"各级预算经本级人民代表大会批准后，本级政府财政部门应当在二十日内向本级各部门批复预算。各部门应当在接到本级政府财政部门批复的本部门预算后十五日内向所属各单位批复预算。\"\
    \n  }\n]"
- expression: (${分配方案.已分配金额} / ${分配方案.可分配总金额} * 100) < ${规定.明确的分配率指标（如≥90%）}
  description: 计算年初已分配预算金额占可分配预算总额的百分比，若低于法规或上级部门规定的最低分配率（如90%），则判定为违规。分配金额及总金额以预算批复年初数为准，不包含年中调整追加部分。规定分配率通常为“不低于90%”，实际分配率低于此即触发。
  audit_item: 违规批复预算
  suspicion: 年初预算分配率低于规定比例
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于进一步做好预算执行工作的指导意见\",\n    \"法规文号\": \"财预〔2010〕11号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条第（一）款\",\n    \"内容概述\": \"各部门要加快细化预算和预算批复进度，努力提高年初预算到位率，年初预算到位率原则上不低于90%。\"\n  }\n]"
- expression: (登记清单.车辆来源（国产/进口） = '进口' AND 平台记录.采购方式 NOT IN ('公开招标', '政府集中采购')) OR (购置清单.批准文号 IS NULL AND 登记清单.车辆来源（国产/进口）
    = '进口')
  description: 进口车辆必须履行规定的政府采购程序且取得进口审批，无合规采购方式或无批准文号的进口车均属违规。
  audit_item: 违规配备公务用车
  suspicion: 违反规定进口或购买汽车
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"党政机关应当配备使用国产汽车，带头使用新能源汽车，除特殊情况外不得购置进口汽车。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n \
    \   \"法规文号\": \"主席令第六十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"政府采购实行集中采购和分散采购相结合，纳入集中采购目录的政府采购项目，"
- expression: (车辆原所属机构、处置方式、接收单位、交接日期.处置方式 = '转交国内单位' AND 车辆原所属机构、处置方式、接收单位、交接日期.接收单位 NOT IN (规定的上交接收单位列表)) OR (车牌号、车辆来源（是否退役转籍）、当前使用部门、车辆型号、价格、排量、购置日期、使用部门、车辆类型（越野车标识）、车辆来源（国产/进口）、采购方式、名义权属单位、实际使用部门、车辆购置日期、车辆状态.车辆来源（是否退役转籍）
    = '退役车辆' AND 入账日期、来源说明、车辆编号、使用状态、权属单位.来源说明 LIKE '%捐赠%' AND NOT EXISTS (车辆原所属机构、处置方式、接收单位、
  description: 退役车辆未按规定上交而违规转给关联单位，或通过虚假捐赠、改装等方式变相继续使用进口车，均构成变相违规。
  audit_item: 违规配备公务用车
  suspicion: 变相进口或未上交退役车辆
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"党政机关应当按规定对公务用车进行报废、更新和处置；国外机构退役车辆应按规定上交或处置，不得擅自留用或转移给关联单位。\"\n  }\n]"
- expression: (零余额账户流水.对方账户 = 实有资金账户账号) AND (零余额账户流水.交易金额 > 0) AND (零余额账户流水.摘要 NOT IN ('归还垫款','归还原渠道资金','上缴财政款') OR 资金划拨审批记录.审批签字缺失)
  description: 当零余额账户发生向本单位或关联实有资金账户的转账，且摘要非合规的归还垫款或上缴财政等特定事项，或审批手续不完整，即构成违规划转。无审批记录直接判定为严重违规。
  audit_item: 预算执行率不真实
  suspicion: 违规从零余额账户向实有资金账户划转资金
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于进一步加强和规范国库集中支付管理的通知\",\n    \"法规文号\": \"财库〔2013〕105号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"预算单位零余额账户资金不得违反规定向本单位其他账户划转，不得用于向本单位实有资金账户归集资金。\"\n  },\n  {\n    \"法规名称\":\
    \ \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"违反规定开设财政专户或者将"
- expression: 购置合同.实际购置价格 > 负责人用车配备标准(含价格、排量).负责人用车配备标准(含价格、排量) || 购置合同.发动机排量 > 负责人用车配备标准(含价格、排量).负责人用车配备标准(含价格、排量) || 资产台账.使用状态
    == '待报废' && 资产台账.使用状态 < 负责人用车配备标准(含价格、排量).负责人用车配备标准(含价格、排量)
  description: 判定规则：1.将车辆实际购置价格与企业内部制度或上级主管部门规定的价格上限进行比对，超出即违规；2.将车辆实际发动机排量与制度规定的排量上限比对，超出即违规；3.核查车辆是否未达到规定最低使用年限即提前报废更新。
  audit_item: 未严格落实中央八项规定及实施细则精神
  suspicion: 超标准配备公务用车
