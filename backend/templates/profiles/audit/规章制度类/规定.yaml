name: audit/规章制度类/规定
type: model
description: 从规章制度类类文档（规定）中提取结构化元数据。涵盖字段如：三公经费审批流程、三区两通道设置标准、上交时限、价格上限、优先审批条款、优惠电价标准、低压/高压报装各环节时限标准、利用方向要求。文档范围包括：三公经费管理规定、上级部门关于预算批复时限的明文规定、上级部门或财政部门关于二次分配率的规定、专项资金使用规定、以工代赈项目管理规定、公务用车价格限制规定、公务用车配置及使用管理规定、农业用地优惠政策的地方性规定、农业用电优惠政策的地方性规定、发热诊室建设专项规定等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 培训
- 审批
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 规定
  member_count: 1
  member_details:
  - 三公经费管理规定
  - 上级部门关于预算批复时限的明文规定
  - 上级部门或财政部门关于二次分配率的规定
  - 专项资金使用规定
  - 以工代赈项目管理规定
  - 公务用车价格限制规定
  - 公务用车配置及使用管理规定
  - 农业用地优惠政策的地方性规定
  - 农业用电优惠政策的地方性规定
  - 发热诊室建设专项规定
  - 国外机构退役车辆管理规定
  - 地方政府压缩规定
  - 学校公用经费使用管理规定
  - 教师培训经费管理专项规定
  - 易成瘾药品和处方药管理规定
  - 用电报装服务时效规定
  - 监管政策规定
  - 相关土壤剥离利用规定
  - 离职/退休人员从业限制管理规定
  - 计划下达时间节点的内部制度或上级规定
  - 车辆进口采购审批权限管理规定
  - 零余额账户管理规定
  - 预算科目划分规定
