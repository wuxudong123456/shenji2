name: audit/规章制度类/建设规划
type: model
description: 从规章制度类类文档（建设规划）中提取结构化元数据。涵盖字段如：两工程协同推进的顶层设计要求、主导产业类型、产业定位、农业产值占比要求、功能分区、实际建成数量、应整合系统清单、建筑面积。文档范围包括：农产品市场网络建设规划、农村养老服务体系建设规划、农村电子商务系统建设规划、年度建设规划、建设规划、文化站建设规划、返乡创业园建设规划、高标准农田建设规划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 工程
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 建设规划
  member_count: 1
  member_details:
  - 农产品市场网络建设规划
  - 农村养老服务体系建设规划
  - 农村电子商务系统建设规划
  - 年度建设规划
  - 建设规划
  - 文化站建设规划
  - 返乡创业园建设规划
  - 高标准农田建设规划
output:
  fields:
  - name: 两工程协同推进的顶层设计要求
    type: string
    description: 提取 两工程协同推进的顶层设计要求 的文本值
  - name: 主导产业类型
    type: string
    description: 提取 主导产业类型 的文本值
  - name: 产业定位
    type: string
    description: 提取 产业定位 的文本值
  - name: 农业产值占比要求
    type: string
    description: 提取 农业产值占比要求 的文本值
  - name: 功能分区
    type: string
    description: 提取 功能分区 的文本值
  - name: 实际建成数量
    type: number
    description: 提取 实际建成数量 的数值（含单位，如万元、吨等）
  - name: 应整合系统清单
    type: string
    description: 提取 应整合系统清单 的文本值
  - name: 建筑面积
    type: string
    description: 提取 建筑面积 的文本值
  - name: 建设区域
    type: string
    description: 提取 建设区域 的文本值
  - name: 开园日期
    type: date
    description: 提取 开园日期 的日期值，格式 YYYY-MM-DD
  - name: 总建筑面积
    type: string
    description: 提取 总建筑面积 的文本值
  - name: 整合时间表
    type: date
    description: 提取 整合时间表 的日期值，格式 YYYY-MM-DD
  - name: 时间节点
    type: date
    description: 提取 时间节点 的日期值，格式 YYYY-MM-DD
  - name: 有效期
    type: string
    description: 提取 有效期 的文本值
  - name: 规划入驻企业数
    type: string
    description: 提取 规划入驻企业数 的文本值
  - name: 规划印发日期
    type: date
    description: 提取 规划印发日期 的日期值，格式 YYYY-MM-DD
  - name: 规划发布时间
    type: date
    description: 提取 规划发布时间 的日期值，格式 YYYY-MM-DD
  - name: 规划建设机构数量
    type: number
    description: 提取 规划建设机构数量 的数值（含单位，如万元、吨等）
  - name: 规划整合目标
    type: string
    description: 提取 规划整合目标 的文本值
  - name: 规划期限
    type: string
    description: 提取 规划期限 的文本值
  - name: 规划机井坐标
    type: string
    description: 提取 规划机井坐标 的文本值
  - name: 规划用地性质
    type: string
    description: 提取 规划用地性质 的文本值
  - name: 规划站点数量
    type: number
    description: 提取 规划站点数量 的数值（含单位，如万元、吨等）
  - name: 规划节点数量
    type: number
    description: 提取 规划节点数量 的数值（含单位，如万元、吨等）
  - name: 规划配套电力设施范围
    type: string
    description: 提取 规划配套电力设施范围 的文本值
  - name: 计划建设内容
    type: string
    description: 提取 计划建设内容 的文本值
  - name: 计划开工-竣工时间
    type: date
    description: 提取 计划开工-竣工时间 的日期值，格式 YYYY-MM-DD
  - name: 计划投资额
    type: string
    description: 提取 计划投资额 的文本值
  - name: 选址位置
    type: string
    description: 提取 选址位置 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (农产品市场网络节点布局统计表.实际建成节点数 / 农产品市场网络建设规划.规划节点数量 < 0.6) || (农产品市场网络合作方协议.配送时效 > 48)
  description: 节点建成率低于60%即规划未有效落地；平均配送时效超过48小时（行业标准）反映网络未实质发挥连接产地与消费终端的作用。两者满足其一即为规划建设不到位。
  audit_item: 为农服务职责履行不到位
  suspicion: 未规划建设联结产地到消费终端的农产品市场网络
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"（十）\",\n    \"内容概述\": \"积极发展农产品流通服务，加快建设产地收集市场和冷链物流体系，形成联结产地到消费终端的农产品市场网络。\"\n  }\n]"
- expression: (信息系统整合情况对照表.系统编号 / 农村电子商务系统建设规划.应整合系统清单) < 0.8 || (数据共享交换统计表.成功/失败次数 / 数据共享交换统计表.交换频次 > 0.05)
  description: 整合完成率低于80%，或数据交换失败率超过5%，均视为系统整合不力、数据共享不充分，存在信息孤岛风险。完成率越低、失败率越高则违规程度越严重。
  audit_item: 信息系统在线服务支撑和保障不足
  suspicion: 农村电商系统整合率低存在信息孤岛
  regulation: "[\n  {\n    \"法规名称\": \"政务信息资源共享管理暂行办法\",\n    \"法规文号\": \"国发〔2016〕51号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"政务信息资源以共享为原则，不共享为例外。各政务部门应按规定编制政务信息资源目录，明确共享条件，推动数据共享。\"\n  },\n  {\n    \"法规名称\": \"\
    促进大数据发展行动纲要\",\n    \"法规文号\": \"国发〔2015〕50号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三部分第(二)项\",\n    \"内容概述\": \"\
    大力推动政府信息系统"
- expression: (工程项目协同实施对比表.村级站点位置 < 500) && (工程项目协同实施对比表.站点功能清单 无交集) || ((工程项目协同实施对比表.资金投入明细 + 信息进村入户工程合同文件.资金预算) - 工程项目协同实施对比表.资金投入明细)
    / 工程项目协同实施对比表.资金投入明细 > 0.2
  description: 两类工程在同一行政村500米内设置独立站点且功能无任何共享整合，或重复购置设备导致资金重复投入率超过20%，均构成工程未有机结合的问题。距离与功能无交集同时满足或资金重复率超标即触发。
  audit_item: 信息系统在线服务支撑和保障不足
  suspicion: 电商与信息进村入户工程未有效协同
  regulation: "[\n  {\n    \"法规名称\": \"农业部关于全面推进信息进村入户工程的实施意见\",\n    \"法规文号\": \"农市发〔2016〕3号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三部分第(二)项\",\n    \"内容概述\": \"坚持统筹规划，整合资源。充分利用现有农村信息化设施和条件，统筹整合涉农信息服务资源，避免重复建设，提高资金使用效率。\"\n  },\n  {\n\
    \    \"法规名称\": \"关于开展电子商务进农村综合示范工作的通知\",\n    \"法规文号\": \"财办建〔2015〕60号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四部分保障措"
- expression: (机井通电工程布局表.实施区域坐标 与 高标准农田建设规划.规划配套电力设施范围 不相交 && 机井通电工程布局表.通电状态 == '是') || (已通电机井清单.位置坐标 与 高标准农田建设规划.规划机井坐标 距离
    > 500米 && 机井通电工程布局表.通电状态 == '是')
  description: 当已通电机井位于规划电网覆盖范围之外，或实际机井位置与规划点位偏差超过500米但仍通电，表明规划与建设严重脱节，导致重复建设或无效投资。阈值500米根据电力接入经济半径设定，超出此距离需额外架设线路，增加不合理支出。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 机井布局与高标准农田规划衔接不畅
  regulation: "[\n  {\n    \"法规名称\": \"全国高标准农田建设规划（2021—2030年）\",\n    \"法规文号\": \"国函〔2021〕86号批复\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第四章第二节\",\n    \"内容概述\": \"高标准农田建设应统筹田、水、路、林、电等工程布局，实现各项设施协调配套。\"\n  },\n  {\n    \"法规名称\": \"高标准农田建设\
    \ 通则\",\n    \"法规文号\": \"GB/T 30600-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"6.3.3\",\n    \"内容概述\": \"农田输配电工程应与田间"
- expression: (建设清单.实际建成机构数 / 建设清单.规划机构数) < 0.9
  description: 将实际建成机构数与地方养老服务体系建设规划明确的规划机构数进行比对，当完成率低于90%时，判定为建设数量不足；阈值可根据本级政府考核要求调整为80%或更低，但标准原则上不低于规划目标的90%。
  audit_item: 农村养老服务政策实施不规范、建设质量不达标
  suspicion: 农村养老机构建设数量未达到规划目标
  regulation: "[\n  {\n    \"法规名称\": \"地方养老服务体系建设规划（如某县农村养老服务设施布局规划）\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n \
    \   \"条款号\": \"全文\",\n    \"内容概述\": \"明确规划期内各区域农村养老机构建设数量、床位目标及完成时限，要求分年度落实建设任务，确保养老服务设施供给与老年人口增长相适应。\"\n  }\n]"
- expression: (建设规划文件缺失 || 实际建成数量 < 建设规划.规划站点数量 * 0.5) || (运营台账.月均回收量 < 测算表.区域可回收物年理论产生量 * 0.2) || (专项资金中无再生资源回收相关支出)
  description: 无体系建设规划或建成率低于50%，或实际回收量远低于理论产生量的20%，或财政资金未对回收体系进行任何投入，即判定体系未实质建立。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 再生资源回收利用体系未建立
  regulation: "[\n  {\n    \"法规名称\": \"《再生资源回收管理办法》\",\n    \"法规文号\": \"商务部令2007年第8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"国家鼓励各类市场主体在城乡结合部和农村地区建立再生资源回收网络，拓展回收渠道。\"\n  }\n]"
- expression: (核查表.达标状态 = '不达标') || (建设规划.建筑面积 < 标准文件.最小建筑面积) || (采购合同.数量 < 标准文件.设备配置种类及数量下限) || (建设规划.选址位置 > 标准文件.选址标准距离)
  description: 当核查表中任一主要指标（建筑面积、功能分区、设备配备）被标记为不达标即触发疑点；或建筑面积小于标准规定的最小值；或实际采购并验收的设备种类/数量低于标准配置要求；或选址距离超过标准允许的最大半径（如无具体数字，可用‘远离居民区’定性转化为未满足选址要求）。
  audit_item: 文化馆（站）等建设运营管护不合规
  suspicion: 综合文化站建设选址及设备配备不达标
  regulation: "[\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\",\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第九条、第十条\",\n    \"内容概述\": \"文化站建设应选址在人口集中、交通便利的地方；建筑面积和功能设置应符合国家有关规定；文化站应配备必需的设备和器材。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国公共文化服务保障法\",\n    \"法规文号\": \"主席令第六十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十五条\",\n    \"内容概述\": \"地方各级人民政府应当加强乡镇（街"
- expression: (规划用地性质.规划用地性质 != 实际用途) || (企业清单.注册日期 / 规划用地性质.规划入驻企业数 < 0.5) || EXISTS(企业清单.注册日期 < 规划用地性质.开园日期)
  description: 实际建设用途与规划用地不符，或入驻率低于50%，或存在企业在创业园正式开园前已完成注册（疑似虚假入驻），均构成建设不合规。
  audit_item: 新型职业农民培育、农民工技能提升和返乡创业就业不符合相关规定
  suspicion: 返乡创业园建设用途不合规或空置率超标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第74号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十三条\",\n    \"内容概述\": \"建设单位应当按照规划条件进行建设；确需变更的，必须向城市、县人民政府城乡规划主管部门提出申请。未按照规划条件建设的，由主管部门责令改正，并处罚款。\"\n  }\n]"
- expression: (农业企业产值占比 < 0.6) || (企业名单.主营业务类型 != '农业加工' && 农业加工企业产值 < 0.5) || (明细表.资金用途 == '非农')
  description: 农业产值占比阈值设定为低于60%（政策要求产业园农业产值原则上不低于60%），若核心企业属于非农行业且农业加工产值占比低于50%，则判定为严重异化；另，财政补贴资金直接流向主营业务为非农的企业，直接触警。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 现代农业产业园非农异化沦为工业园
  regulation: "[\n  {\n    \"法规名称\": \"《农业农村部 财政部关于开展国家现代农业产业园创建工作的通知》\",\n    \"法规文号\": \"农计发〔2017〕40号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"二、创建条件\",\n    \"内容概述\": \"产业园主导产业产值占产业园总产值的比重原则上不低于60%，且必须是种养业、农产品加工业或休闲农业等涉农产业。\"\n  }\n\
    ]"
- expression: ( EXTRACT(YEAR FROM CURRENT_DATE) - EXTRACT(YEAR FROM 规划发布时间.规划发布时间) > 5 ) OR ( 项目清单.项目启动时间 < 规划发布时间.规划发布时间
    )
  description: 若规划发布时间距今超过5年未修订，或存在项目开工时间早于规划发布时间，即判定为未及时编制或修订规划，存在未批先建风险。
  audit_item: 违反高标准农田项目规划和管理规定的行为
  suspicion: 未及时编制或修订高标准农田建设规划
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"县级以上地方人民政府农业农村主管部门负责编制本地区农田建设规划，经本级人民政府批准后发布实施，并报上级农业农村主管部门备案。\"\n  }\n]"
- expression: (规划编制时间节点对照表.有效期截止日 < 审计基准日期 - 180天) && (规划编制时间节点对照表.修订文件印发日期 IS NULL || 规划编制时间节点对照表.修订文件印发日期 > 审计基准日期)
