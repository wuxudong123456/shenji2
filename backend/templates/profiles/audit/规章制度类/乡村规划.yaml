name: audit/规章制度类/乡村规划
type: model
description: 从规章制度类类文档（乡村规划）中提取结构化元数据。涵盖字段如：用地类型、规划建设区。文档范围包括：乡村规划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 乡村规划
  member_count: 1
  member_details:
  - 乡村规划
output:
  fields:
  - name: 用地类型
    type: string
    description: 提取 用地类型 的文本值
  - name: 规划建设区
    type: string
    description: 提取 规划建设区 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 冲突类型 == '占用基本农田' || 冲突类型 == '位于生态红线内' || (规划调整日期 > 0 && 能源方案修订日期 - 规划调整日期 > 30 天)
  description: 设施选址坐标落入基本农田或生态红线范围，直接判定违规；乡村规划调整后超过30天清洁能源方案未同步修订，视为规划衔接不到位。
  audit_item: 项目规划统筹衔接不到位
  suspicion: 清洁能源设施选址与国土空间规划冲突
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十五条\",\n    \"内容概述\": \"永久基本农田经依法划定后，任何单位和个人不得擅自占用或者改变其用途。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\"\
    : \"主席令第74号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"在城市、镇规划区内进行建筑物、构筑物、道路、管线和其他工程建设的，应当向城乡规划主管部门申请"
