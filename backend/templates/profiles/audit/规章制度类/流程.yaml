name: audit/规章制度类/流程
type: model
description: 从规章制度类类文档（流程）中提取结构化元数据。涵盖字段如：低压/高压报装各环节时限标准、单位内部各级审批权限划分、审批时限规定、资格审核程序、退休办理与公积金停缴衔接流程、预算编制审批环节及控制措施。文档范围包括：保障待遇发放审批流程、内部用地审批流程、用电报装服务流程、经费使用审批流程、补贴对象资格审核流程、退休人员管理操作流程等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 审批
- 预算
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 流程
  member_count: 1
  member_details:
  - 保障待遇发放审批流程
  - 内部用地审批流程
  - 用电报装服务流程
  - 经费使用审批流程
  - 补贴对象资格审核流程
  - 退休人员管理操作流程
output:
  fields:
  - name: 低压-高压报装各环节时限标准
    type: string
    description: 提取 低压-高压报装各环节时限标准 的文本值
  - name: 单位内部各级审批权限划分
    type: string
    description: 提取 单位内部各级审批权限划分 的文本值
  - name: 审批时限规定
    type: string
    description: 提取 审批时限规定 的文本值
  - name: 资格审核程序
    type: string
    description: 提取 资格审核程序 的文本值
  - name: 退休办理与公积金停缴衔接流程
    type: string
    description: 提取 退休办理与公积金停缴衔接流程 的文本值
  - name: 预算编制审批环节及控制措施
    type: number
    description: 提取 预算编制审批环节及控制措施 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 农业用户用电报装申请.实际总时长 > 用电报装服务流程.低压/高压报装各环节时限标准（受理、勘验、答复方案、装表接电） OR 农业用户用电报装申请.业务环节耗时 > 用电报装服务流程.低压/高压报装各环节时限标准（受理、勘验、答复方案、装表接电）
    * 1.5
  description: 判定：报装全流程办理时长超出监管规定时限，即判定为超期。常见规定如低压居民报装不超过8个工作日、低压非居民不超过15个工作日等。若某环节（如勘验）耗时超过规定时限的150%，亦单独预警，提示存在人为拖延。
  audit_item: 供电服务不合规
  suspicion: 用电报装超时限办理
  regulation: "[\n  {\n    \"法规名称\": \"供电监管办法\",\n    \"法规文号\": \"国家能源局令第1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\"\
    ,\n    \"内容概述\": \"供电企业应当按照国家规定的时限办理用电业务，低压居民用户不超过8个工作日，低压非居民用户不超过15个工作日，高压单电源用户不超过30个工作日等。\"\n  }\n]"
- expression: (人员名单.实际在岗人数 > 编制文件.核定编制总数) && (算申报表.预算申报人数 > 编制文件.核定编制总数) && (ABS(人员名单.实际在岗人数 - 算申报表.预算申报人数) <= 1)
  description: 实际在岗总人数超过上级核定编制总数，且日常公用经费预算申报表中所使用的预算人数同样超过编制总数，同时预算申报人数与实际在岗人数基本一致（允许±1人的统计误差）。表明单位在预算编报时未按编制数控制，而是据实以超编人数申报，导致公用经费预算虚增。超编比例超过10%为严重违规。
  audit_item: 生成模拟审计数据
  suspicion: 超编制配置人员虚报公用经费预算
  regulation: "[\n  {\n    \"法规名称\": \"行政单位财务规则\",\n    \"法规文号\": \"财政部令第71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第十三条\",\n    \"内容概述\": \"行政单位编制预算，应当综合考虑机构设置、人员编制和实际人数等因素，不得以超编人数作为预算编制基数，确保预算真实性。\"\n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\"\
    ,\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"党政机关应当遵循先有预算、后有支出的"
- expression: ((发放明细表.实际发放金额 != 补贴发放时间要求、标准、补贴类型、补贴对象资格条件.标准 * 信息表.土地面积) AND (发放明细表.补贴类型 = '面积类补贴')) OR (发放明细表.领取人身份证号 NOT
    IN (信息表.身份证号))
  description: 比对政策规定的应发金额与实际发放金额，若金额不一致或补贴对象资格不符合政策条件（如非实际耕种者、非符合面积门槛农户等），则判定为违规。阈值设为金额偏差绝对值大于0.01元。
  audit_item: 惠农补贴发放不到位
  suspicion: 擅自调整惠农补贴标准或对象
  regulation: "[\n  {\n    \"法规名称\": \"《农业生产发展资金管理办法》\",\n    \"法规文号\": \"财农〔2022〕25号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"农业生产发展资金应严格按照规定的补贴对象、补贴标准和补贴方式发放，不得擅自扩大或缩小补贴范围，不得擅自改变补贴标准。\"\n  }\n]"
- expression: (公示材料.公示时间 IS NULL) OR (公示材料.公示时间 > 发放方式、领取人姓名、补贴类型、金额、发放时间、银行账号、领取人身份证号、户主身份证号、银行账户名称、姓名、身份证号、实际发放金额、户编号、应发金额、实发金额、户名、补贴项目名称、收款人姓名、收款账号、发放日期、发放金额、补贴类别、补贴发放账号、农户姓名、发放账号、收款账户、收款人、受益人姓名、受益人身份证号、补贴金额、申报面积、银行卡号.发放时间)
    OR (公示材料.公示内容（是否包含补贴对象、标准、金额） NOT LIKE '%补贴对象%' OR 公示材料.公示内容（是否包含补贴对象、标准、金额） NOT LIKE '
  description: 公示未进行、公示时间晚于资金发放日（事后补公示），或公示内容缺失关键要素（对象、标准、金额），均构成未按规定公开。
  audit_item: 惠农补贴发放不到位
  suspicion: 惠农补贴信息未按规定公示公开
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国政府信息公开条例》\",\n    \"法规文号\": \"国令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二条、第九条\",\n    \"内容概述\": \"涉及公民、法人和其他组织切身利益，需要社会公众广泛知晓的政府信息应当主动公开。惠农补贴发放信息属于重点公开范畴。\"\n  }\n]"
- expression: (审批台账.审批机关 IN ('县级人民政府') && 规划地块文本.地块类型（基本农田/一般耕地/建设用地等） IN ('基本农田', '永久基本农田')) || (审批台账.审批机关 IN ('市级自然资源部门')
    && 审批台账.批准面积 > 35 单位=公顷 && 审批台账.土地类型（农用地/未利用地/建设用地） == '农用地') || (审批台账.审批文号 存在多次拆分记录 && SUM(审批台账.批准面积) > 对应上级机关审批权限面积阈值)
  description: 表达式核心是判断审批主体与法定权限的适配性。分支1：若审批机关为县级，却批准了基本农田类型的用地，直接触犯国务院专属权限，为严重越权。分支2：针对农用地转用，若市级审批机关一次性批准面积超过《土地管理法》规定的35公顷上限，即超权限审批。分支3：识别化整为零策略，通过追踪同一年度同一项目或同一区域立项的多宗地块，若累计审批面积超过本应上报的上级机关审批阈值，则构成实质上的超越权限。
  audit_item: 未办理土地变更手续非法占用土地
  suspicion: 违规超越审批权限审批土地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"征收下列土地的，由国务院批准：（一）永久基本农田；（二）永久基本农田以外的耕地超过三十五公顷的；（三）其他土地超过七十公顷的。征收前款规定以外的土地的，由省、自治区、直辖市人民政府批准。征收农用地的，应当依照本法第四十四条的规定先行办理农用地转用审批。其中，经国务院批准农用地转用的，同时办理征地审批手续，不再另行办理征地审批；经省、自治区、直辖市人民政府在征地批准权限"
- expression: DATEDIFF(发放对象身份证号、发放金额、发放日期、领取人身份证号、补贴项目名称、应发放日期、实际发放日期、受益人ID、待遇类型、应发金额、实发金额、发放年月.实际发放日期, 发放对象身份证号、发放金额、发放日期、领取人身份证号、补贴项目名称、应发放日期、实际发放日期、受益人ID、待遇类型、应发金额、实发金额、发放年月.应发放日期)
    > 政策规定发放时限阈值 && 延迟天数.原因说明 NOT LIKE '%不可抗力%' && 延迟天数.原因说明 NOT LIKE '%经批准%'
  description: 政策规定如低保金应于每月10日前发放到户，实际发放日期超过次月10日即为延迟。排除因不可抗力或经正式批准的系统升级、资金划拨延迟等合理理由，否则判定为违规延迟发放。
  audit_item: 未及时足额发放待遇
  suspicion: 社会保障待遇未按规定时限发放
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"低保金应当按月发放，于每月10日前发放到户。\"\n  }\n]"
