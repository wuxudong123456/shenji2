name: audit/规章制度类/项目规划
type: model
description: 从规章制度类类文档（项目规划）中提取结构化元数据。涵盖字段如：实施区域四至坐标。文档范围包括：各部门项目规划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 项目规划
  member_count: 1
  member_details:
  - 各部门项目规划
output:
  fields:
  - name: 实施区域四至坐标
    type: string
    description: 提取 实施区域四至坐标 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 多项目重叠实施区域冲突问题清单.重叠面积 > 0 && ((跨部门协调会议纪要.协调会议召开次数 = 0) || (DATEDIFF(多项目重叠实施区域冲突问题清单.冲突问题发现时间, 跨部门协调会议纪要.最近一次会议时间)
    > 365))
  description: 存在项目空间重叠且措施冲突（重叠面积大于0），同时缺乏跨部门协调机制（协调会议召开次数为0）或者最近一次协调会议距离问题发现时间已超过1年（365天），证明统筹机制长期失效，冲突风险未能及时化解。
  audit_item: 黑土地保护治理缺少持续性，后期管护不到位
  suspicion: 多项目治理措施统筹不力导致相互冲突
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于探索建立涉农资金统筹整合长效机制的意见\",\n    \"法规文号\": \"国发〔2017〕54号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（三）项\",\n    \"内容概述\": \"要加强部门间的沟通协作，在同一区域集中投入不同渠道资金时，要加强规划统筹和任务分工，防止项目重复建设、措施相互‘打架’，确保资金整合效益最大化。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国乡村振兴促进法\",\n    \"法规文号\": \"中华人民共和国主席令第77号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":"
