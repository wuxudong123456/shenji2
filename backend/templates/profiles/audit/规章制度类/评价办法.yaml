name: audit/规章制度类/评价办法
type: model
description: 从规章制度类类文档（评价办法）中提取结构化元数据。涵盖字段如：资金管理考核指标。文档范围包括：企业绩效评价办法等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 评价办法
  member_count: 1
  member_details:
  - 企业绩效评价办法
output:
  fields:
  - name: 资金管理考核指标
    type: string
    description: 提取 资金管理考核指标 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 货币资金明细账.期末余额 / 总资产 > 0.3 && (财务费用明细账.利息收入 / 货币资金明细账.日均余额) < 同期银行活期存款利率 && 企业绩效评价办法.资金管理考核指标 < 0.5
  description: 当企业货币资金占总资产比例超过30%，且资金收益率低于银行活期存款利率，同时资金使用计划执行率不足50%时，表明大量资金闲置未有效运用，可能影响国有资本保值增值目标。
  audit_item: 企业经营资产分析
  suspicion: 货币资金存量过高存在资金闲置风险
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十条\",\n    \"内容概述\": \"国家出资企业应当提高国有资本经营效率，实现国有资本保值增值，防止国有资产损失。\"\n  },\n  {\n    \"法规名称\": \"关于加强国有企业资金管理的指导意见\",\n\
    \    \"法规文号\": \"国资发财评规〔2020〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"企业应加强资金集中管理，合理安排资金使用，严禁资金闲置浪"
