name: audit/规章制度类/管理计划
type: model
description: 从规章制度类类文档（管理计划）中提取结构化元数据。涵盖字段如：危废管理计划及制度要求。文档范围包括：环境管理计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 管理计划
  member_count: 1
  member_details:
  - 环境管理计划
output:
  fields:
  - name: 危废管理计划及制度要求
    type: string
    description: 提取 危废管理计划及制度要求 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: ((环评文件.危废种类 > 0) && (台账建立情况 IS NULL || 台账建立情况.记录完整性))
  description: 环评文件或生产工艺确认有危险废物产生的单位，未建立或未能提供符合规范的危废管理台账，即构成违规。关键信息缺失指未记录产生量、种类、去向、贮存情况等。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 未按规定建立危险废物管理台账
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"主席令第五十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第七十八条\",\n    \"内容概述\": \"产生危险废物的单位，应当按照国家有关规定制定危险废物管理计划，建立危险废物管理台账，如实记录有关信息。\"\n  }\n]"
