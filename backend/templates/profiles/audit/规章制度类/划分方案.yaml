name: audit/规章制度类/划分方案
type: model
description: 从规章制度类类文档（划分方案）中提取结构化元数据。涵盖字段如：事权事项对应管理办法要求、事权事项清单、事权划分事项、对应支出责任、支出责任划分。文档范围包括：中央与地方财政事权和支出责任划分方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 划分方案
  member_count: 1
  member_details:
  - 中央与地方财政事权和支出责任划分方案
output:
  fields:
  - name: 事权事项对应管理办法要求
    type: string
    description: 提取 事权事项对应管理办法要求 的文本值
  - name: 事权事项清单
    type: string
    description: 提取 事权事项清单 的文本值
  - name: 事权划分事项
    type: string
    description: 提取 事权划分事项 的文本值
  - name: 对应支出责任
    type: number
    description: 提取 对应支出责任 的数值（含单位，如万元、吨等）
  - name: 支出责任划分
    type: number
    description: 提取 支出责任划分 的数值（含单位，如万元、吨等）
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (其他.一般性转移支付金额/其他.转移支付总额)<0.6 || (统计表.转移支付总额增长率-其他.财政支出总额)>0.15 && (统计表.一般性转移支付占比<-0.05)
  description: 条件一：一般性转移支付占转移支付总额比重低于60%的硬性要求（依据国发〔2014〕71号），触发表明结构失衡；条件二：任一类专项转移支付增长率超过同期地方财政支出增长率15个百分点以上，且一般性转移支付占比出现负向变动5%以上，反映规模与趋势背离政策导向。两者满足任一即生成疑点。
  audit_item: 财政转移支付体系建设不健全
  suspicion: 转移支付规模结构趋势不合理
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于改革和完善中央对地方转移支付制度的意见\",\n    \"法规文号\": \"国发〔2014〕71号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、（一）\",\n    \"内容概述\": \"增加一般性转移支付规模和比例，逐步将一般性转移支付占比提高到60%以上；清理、整合、规范专项转移支付，严控新增项目和资金规模。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\",\n\
    \    \"内容"
- expression: (项目清单.审批机关标识 NOT IN ('国务院','财政部') && 项目清单.金额>0) || (审批文件.设立依据文号 NOT IN (有效政策文号列表) || 审批文件.设立依据文号 IS NULL) ||
    (汇总表.综合绩效得分<60 && 汇总表.评价年度>=YEAR(NOW())-1) || (项目清单.项目名称 SIMILARITY 已存在项目名称 >0.8 && 项目清单.事权事项清单 = 已存在项目事权领域)
  description: 条件一：项目审批机关非国务院或财政部，且资金量大于零，为违规设立；条件二：设立依据文号未引用有效政策文件或依据缺失；条件三：最近两个年度内绩效评价综合得分低于60分，表明项目设立不合理或目标偏离；条件四：同一事权领域存在文本相似度超过80%的多个项目，构成重复设立。满足任一条件即触发疑点。
  audit_item: 财政转移支付体系建设不健全
  suspicion: 转移支付项目设立不合规或不合理
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条、第五条\",\n    \"内容概述\": \"第四条设立了专项转移支付项目应当依据法律、行政法规和国务院的规定；第五条明确未经国务院批准，各部门和地方政府不得设立专项转移支付项目，不得改变资金用途。\"\n\
    \  },\n  {\n    \"法规名称\": \"国务院关于深化预算管理制度改革的决定\",\n    \"法规文号\": \"国发〔2014〕45号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \""
- expression: (情况文件.管理办法印发日期 - 项目清单.首次拨款年度) > 180 || (情况文件.管理办法印发日期 IS NULL && 项目清单.设立时间 > DATE_SUB(CURDATE(), INTERVAL 6
    MONTH)) || (情况文件.管理办法完整文本 NOT CONTAIN '分配标准' || 情况文件.管理办法完整文本 NOT CONTAIN '绩效评价' || 情况文件.管理办法完整文本 NOT CONTAIN '监督检查')
  description: 条件一：资金管理办法印发日期晚于资金首次下达日期180天以上，超期未制定视为违规；条件二：项目设立超过6个月仍未出台任何管理办法，设定为疑点；条件三：管理办法未包含分配标准、绩效评价、监督检查等必备要素，为不完备。满足任一条件即判定管理办法制定不规范或及时性缺失。
  audit_item: 财政转移支付体系建设不健全
  suspicion: 转移支付资金管理办法制定不及时或不完善
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十三条\",\n    \"内容概述\": \"省级财政部门应当会同有关部门，结合本地区实际，制定完善专项转移支付资金管理办法，报财政部备案。管理办法应包括资金分配、使用、监督和绩效评价等内容。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条、第五十七条\""
