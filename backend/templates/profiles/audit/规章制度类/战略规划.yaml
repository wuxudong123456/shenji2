name: audit/规章制度类/战略规划
type: model
description: 从规章制度类类文档（战略规划）中提取结构化元数据。涵盖字段如：战略定位与核心业务描述。文档范围包括：企业3-5年战略规划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 战略规划
  member_count: 1
  member_details:
  - 企业3-5年战略规划
output:
  fields:
  - name: 战略定位与核心业务描述
    type: string
    description: 提取 战略定位与核心业务描述 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 行业类别、国有资本分布金额.国有资本分布金额/行业类别、国有资本分布金额.国有资本分布金额 < 0.8 && 项目名称、投资金额、行业归属、项目行业分类、资金来源.投资金额/项目名称、投资金额、行业归属、项目行业分类、资金来源.投资金额
    > 0.1
  description: 主业行业资本占比低于80%视为布局分散；非主业投资金额占比超过10%即触发预警，两者同时满足表明国有资本未向核心主业集中，存在偏离定位风险。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
  suspicion: 国有资本布局偏离主责主业定位
  regulation: "[\n  {\n    \"法规名称\": \"关于国有企业功能界定与分类的指导意见\",\n    \"法规文号\": \"国资发研究〔2015〕170号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"商业类国有企业要以增强国有经济活力、放大国有资本功能、实现国有资产保值增值为主要目标，按照市场化要求实行商业化运作，依法独立自主开展生产经营活动，实现优胜劣汰、有序进退。主业处于关系国家安全、国民经济命脉的重要行业和关键领域、主要承担重大专项任务的商业类国有企业，要保持国有资本控股地位，支持非国有资本参股。\"\
    \n  }\n]"
