name: audit/规章制度类/收储方案
type: model
description: 从规章制度类类文档（收储方案）中提取结构化元数据。涵盖字段如：考古工作完成情况、费用列支说明。文档范围包括：土地出让文件或收储方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 收储方案
  member_count: 1
  member_details:
  - 土地出让文件或收储方案
output:
  fields:
  - name: 考古工作完成情况
    type: string
    description: 提取 考古工作完成情况 的文本值
  - name: 费用列支说明
    type: number
    description: 提取 费用列支说明 的数值（含单位，如万元、吨等）
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (收费明细台账.收费项目名称（考古勘探费、考古发掘费） LIKE '%考古勘探%' OR 收费明细台账.收费项目名称（考古勘探费、考古发掘费） LIKE '%考古发掘%') && (明细表.支付金额 IS NULL
    OR 明细表.支付金额 = 0) && (政策文件.费用承担主体（财政/土地收储成本/企业） == '财政' || 政策文件.费用承担主体（财政/土地收储成本/企业） == '土地收储成本')
  description: 筛选收费台账中项目名称涉及“考古勘探”或“考古发掘”的企业缴费记录，核实同项目在财政支付明细或土地成本中是否已列支该项费用。若政策规定考古费用应由政府财政或土地收储资金承担，但企业实际支付且无财政、土地成本对应支付记录，则判定为违规转嫁。
  audit_item: 违规收费-违规将应由财政资金承担的评估评审费用转嫁给企业承担
  suspicion: 违规将考古勘探发掘费转嫁给企业承担
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条\",\n    \"内容概述\": \"政府及其有关部门不得将职责范围内的监管、技术审查、评估评审等费用转嫁给市场主体。\"\n  }\n]"
