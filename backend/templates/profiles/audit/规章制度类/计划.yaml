name: audit/规章制度类/计划
type: model
description: 从规章制度类类文档（计划）中提取结构化元数据。涵盖字段如：关键节点、年度分解目标值、应监控的关键指标范围、监控周期、覆盖项目清单、规模养殖场总数、设施装备配套率考核目标值。文档范围包括：年度畜禽粪污资源化利用实施方案或计划、绩效运行监控工作方案/计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 项目
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 计划
  member_count: 1
  member_details:
  - 年度畜禽粪污资源化利用实施方案或计划
  - 绩效运行监控工作方案/计划
output:
  fields:
  - name: 关键节点
    type: string
    description: 提取 关键节点 的文本值
  - name: 年度分解目标值
    type: date
    description: 提取 年度分解目标值 的日期值，格式 YYYY-MM-DD
  - name: 应监控的关键指标范围
    type: string
    description: 提取 应监控的关键指标范围 的文本值
  - name: 监控周期
    type: string
    description: 提取 监控周期 的文本值
  - name: 覆盖项目清单
    type: string
    description: 提取 覆盖项目清单 的文本值
  - name: 规模养殖场总数
    type: string
    description: 提取 规模养殖场总数 的文本值
  - name: 设施装备配套率考核目标值
    type: string
    description: 提取 设施装备配套率考核目标值 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: COUNT(绩效运行监控报告) == 0 && SUM(预算执行进度统计表.支出金额) > 0
  description: 当预算执行进度统计表中存在资金支出记录，但对应的绩效运行监控报告数量为零时，触发违规。说明单位在有预算执行的情况下未开展任何绩效运行监控，直接判定为未开展监控。
  audit_item: 部门、单位预算绩效运行监控不合规
  suspicion: 未开展预算绩效运行监控
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（五）款\",\n    \"内容概述\": \"各级政府及各部门各单位要建立绩效运行监控机制，加强对绩效目标实现程度和预算执行进度的跟踪管理，发现问题及时督促整改。\"\n  }\n]"
- expression: (COUNT(绩效目标申报表.绩效指标) - COUNT(绩效运行监控报告.监控指标)) > 0 && COUNT(绩效目标申报表.绩效指标) > 0
  description: 将绩效目标申报表中设定的全部绩效指标与监控报告中实际纳入监控的指标进行比对，若存在差异（即目标申报表中的指标未被监控），且目标申报表指标总数大于0，则判定为监控不全面。监控指标缺失即构成违规，不设容差。
  audit_item: 部门、单位预算绩效运行监控不合规
  suspicion: 绩效运行监控不全面
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（五）款\",\n    \"内容概述\": \"要对绩效目标实现程度和预算执行进度实行‘双监控’，确保绩效目标如期保质保量实现。\"\n  },\n  {\n    \"法规名称\": \"\
    项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"绩效运行监控是全过程预算绩效"
- expression: (ABS(统计表.上报综合利用率 - 效果报告.实际抽检利用率) > 10%) || (统计表.粪污处理利用总量 / 统计表.粪污产生总量 < 政策文件.考核目标值（综合利用率%）) || (维护记录.粪污日处理量汇总
    < 统计表.粪污处理利用总量 * 0.6)
  description: 通过三重逻辑筛查虚报行为：一是统计上报数据与第三方抽检核查结果的偏差率超过10个百分点阈值；二是实际利用总量与产生总量的比值低于国家或省级政策要求的达标线（例如75%或85%）；三是设施实际运行记录的累计处理量远低于上报利用总量的60%，表明设施处理能力或运行状况无法支撑上报数据，判定为严重数据造假。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 畜禽粪污综合利用率数据虚报瞒报
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国畜牧法\",\n    \"法规文号\": \"中华人民共和国主席令第一二四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"畜禽养殖场应当保证畜禽粪污处理利用设施的正常运行，不得弄虚作假。\"\n  },\n  {\n    \"法规名称\": \"畜禽规模养殖污染防治条例\",\n    \"法规文号\"\
    : \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"向环境排放经过处理的畜禽养殖废弃物，应当符合国家和地方规定的污染物排放标准和"
- expression: (维护记录.用电量为0 || 维护记录.运行状态（正常/故障/停用）=='长期停用') && (验收报告.验收通过时间 != 'NULL') || (验收报告.验收影像资料重复率 > 50%)
  description: 筛查设施验收合格但实际未运行或无法运行的“晒太阳工程”。第一个条件判定设施验收通过后，连续数月无用电记录或维护日志标记为长期停用；第二个条件通过检查验收影像资料哈希值或相似度，识别出不同养殖场或同一养殖场不同时期的验收照片重复使用的造假行为。两项满足其一即构成高度可疑。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 规模养殖场粪污处理设施仅名义配套
  regulation: "[\n  {\n    \"法规名称\": \"畜禽规模养殖污染防治条例\",\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"畜禽养殖场、养殖小区应当建设相应的畜禽粪便、污水与雨水分流设施，畜禽粪便、污水的贮存设施，粪污厌氧消化和堆沤、有机肥加工、制取沼气、沼渣沼液分离和输送、污水处理、畜禽尸体处理等综合利用和无害化处理设施。\"\
    \n  },\n  {\n    \"法规名称\": \"环境保护法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十二条\",\n "
