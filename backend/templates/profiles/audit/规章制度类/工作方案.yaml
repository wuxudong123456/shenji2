name: audit/规章制度类/工作方案
type: model
description: 从规章制度类类文档（工作方案）中提取结构化元数据。涵盖字段如：投诉处置时限要求、时间节点、本地区应编村庄纳入标准、村庄名单、统筹协调机制、衔接接口条款、计划压减户数、计划完成时间。文档范围包括：本地区村庄规划编制工作方案、法人层级压缩专项工作方案、统筹工作方案、网络交易监管专项工作方案、非正规垃圾堆放点整治工作方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 工作方案
  member_count: 1
  member_details:
  - 本地区村庄规划编制工作方案
  - 法人层级压缩专项工作方案
  - 统筹工作方案
  - 网络交易监管专项工作方案
  - 非正规垃圾堆放点整治工作方案
output:
  fields:
  - name: 投诉处置时限要求
    type: string
    description: 提取 投诉处置时限要求 的文本值
  - name: 时间节点
    type: date
    description: 提取 时间节点 的日期值，格式 YYYY-MM-DD
  - name: 本地区应编村庄纳入标准
    type: string
    description: 提取 本地区应编村庄纳入标准 的文本值
  - name: 村庄名单
    type: string
    description: 提取 村庄名单 的文本值
  - name: 统筹协调机制
    type: string
    description: 提取 统筹协调机制 的文本值
  - name: 衔接接口条款
    type: number
    description: 提取 衔接接口条款 的数值（含单位，如万元、吨等）
  - name: 计划压减户数
    type: string
    description: 提取 计划压减户数 的文本值
  - name: 计划完成时间
    type: date
    description: 提取 计划完成时间 的日期值，格式 YYYY-MM-DD
  - name: 计划完成时间节点
    type: date
    description: 提取 计划完成时间节点 的日期值，格式 YYYY-MM-DD
  - name: 计划整治点位清单
    type: string
    description: 提取 计划整治点位清单 的文本值
  - name: 计划注销企业的统一社会信用代码
    type: string
    description: 提取 计划注销企业的统一社会信用代码 的文本值
  - name: 责任部门职责划分
    type: string
    description: 提取 责任部门职责划分 的文本值
  - name: 资质核验周期要求
    type: string
    description: 提取 资质核验周期要求 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (监控表.压减方式 == "注销" && 监控表.工商注销通知书文号 == null) || (已标识为压减完成 && 监控表.穿透后的实际控制层级及剩余企业数 > 目标层级数 && 穿透后仍存在关联业务往来)
  description: 表达式筛查两类核心造假情形：1.上报通过“注销”方式完成压减，但在工商系统中未查到注销公告，无法提供注销凭证；2.虽然名义上完成了层级或户数压减，但通过穿透股权结构发现其实际控制的企业层级并未减少，或“已注销”企业仍有开票、资金流水等经营行为。
  audit_item: 国有企业重点改革任务推进方面存在的问题
  suspicion: 法人层级压缩不力存在“假注销、真存续”壳公司
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推动国有企业改革压缩管理层级减少法人户数的指导意见\",\n    \"法规文号\": \"国资发改革〔2017〕42号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二条、第四条\",\n    \"内容概述\": \"明确清理整合目标任务，有效压缩管理层级，减少法人户数，消除‘壳公司’，坚决防止已清理企业‘死灰复燃’。\"\n  }\n]"
- expression: (信息表.人口数>=500 || 信息表.村庄类型（乡村振兴示范村、传统村落、城郊融合类等） IN ('乡村振兴示范村','传统村落','城郊融合类')) && 信息表.村庄编码 NOT IN (规划清单.村庄编码)
  description: 根据上级政策要求，筛选人口规模达标或属于重点发展/保护类型的村庄，若其编码未出现在应编尽编清单中，即判定为应编未编疑点。人口阈值500人为示例，实际审计中需比对政策文件中的具体条件。
  audit_item: 村庄规划编制缓慢
  suspicion: 有条件、有需求的村庄未纳入规划编制范围
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部办公厅关于加强村庄规划促进乡村振兴的通知\",\n    \"法规文号\": \"自然资办发〔2019〕35号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"二、有序推进村庄规划编制\",\n    \"内容概述\": \"明确有条件、有需求的村庄要做到规划应编尽编，重点做好集聚提升类、城郊融合类、特色保护类等村庄规划编制。\"\n  }\n]"
- expression: (审核记录.公示许可证号 IS NULL) || (审核记录.公示许可证号 NOT IN 档案.许可证号) || (处理清单.下架完成时间 > 3个工作日)
  description: 平台内商家未公示许可证号、公示的许可证号在官方许可档案中不存在或已失效，均属资质审核不合规；自收到投诉举报起至完成下架超过3个工作日，属于监管处置超时。任一情况触发疑点。
  audit_item: 种业市场监管方面不符合相关规定
  suspicion: 种子网络销售资质审核与监管缺失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"中华人民共和国主席令第三十五号（2015年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十七条\",\n    \"内容概述\": \"电子商务平台经营者应当对平台内种子经营者的身份、地址、联系方式、生产经营许可证或者备案信息等进行核验、登记，建立登记档案，并定期核验更新。\"\n  }\n\
    ]"
- expression: (DATEDIFF(DAY, 进度表.计划完成日期, 审计基准日) > 180) && (进度表.实际完成量 < 进度表.计划完成量 || 验收报告.验收结论 != '合格' || 验收报告 IS NULL)
  description: 筛选出计划完成日期距审计基准日已超过180天，但实际完成量未达计划量或验收未合格的堆放点，标记为进展严重滞后。合理延期审批手续已存档的除外。
  audit_item: 非正规垃圾堆放点清理整治不合规
  suspicion: 非正规垃圾堆放点整治进展严重滞后
  regulation: "[\n  {\n    \"法规名称\": \"关于做好非正规垃圾堆放点排查和整治工作的通知\",\n    \"法规文号\": \"建办村〔2017〕55号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"三、（三）\",\n    \"内容概述\": \"各地要制定整治工作实施方案，明确时间表，倒排工期，确保按期完成，实行滚动销号制度。\"\n  }\n]"
- expression: (正式文件 IS NULL) || (正式文件.规划文本中是否包含与改厕、垃圾处理衔接的专门章节或表述) || (分工表.污水管网敷设完成时间 > 分工表.各行政村厕所改造任务完成时间 + 90天) || (会议纪要.会议召开频次
    < 2次/年)
  description: 未制定统筹工作方案；或规划文本完全缺失与厕所改造、垃圾处理的衔接内容；或任务分工表中同一村庄的污水管网铺设完成时间晚于户厕改造完成时间超过90天，导致改厕后粪污无法接入管网，造成衔接脱节；或一年内跨部门专题协调会议次数少于2次，反映统筹协作流于形式。满足任一条件即触发疑点。
  audit_item: 污水治理规划不符合规定
  suspicion: 污水治理规划未与垃圾治理、厕所革命统筹衔接
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进农村生活污水治理的指导意见\",\n    \"法规文号\": \"环办土壤〔2021〕24号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条第（三）项\",\n    \"内容概述\": \"统筹考虑农村生活污水治理与改厕、村庄清洁、生活垃圾治理等协同推进，协调安排相关建设任务。\"\n  }\n]"
