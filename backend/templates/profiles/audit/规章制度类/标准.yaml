name: audit/规章制度类/标准
type: model
description: 从规章制度类类文档（标准）中提取结构化元数据。涵盖字段如：业绩评分标准、价格上限、优待金标准、低保类型、保洁频次要求、保管期限、入库审核流程、其他配置限制。文档范围包括：任务清单分类标准、低收入人群认定标准、公务用车配备标准、养老机构设施建设国家标准、养老机构设施建设地方标准、再生资源回收网点建设标准、农业保险政策考核标准、农村公厕管护标准、农膜回收利用相关政策文件考核标准、各级政府惠农补贴执行标准等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 培训
- 补贴
- 项目
- 元数据提取
