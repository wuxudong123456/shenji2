- expression: (管理费用支出明细表.费用科目 == '会议费' && (管理费用支出明细表.支出金额 / 费用报销凭证.业务发生日期 / 费用报销凭证.报销人员名单 > 培训费支出标准文件.各项费用人均单次或单日最高限额 * 1.1))
    || (管理费用支出明细表.费用科目 == '接待费' && 费用报销凭证.发票内容 == '餐饮费' && (管理费用支出明细表.支出金额 / 费用报销凭证.报销人员名单 > 培训费支出标准文件.各项费用人均单次或单日最高限额 * 1.2))
    || (管理费用支出明细表.费用科目 == '补贴' && 补贴发放名册.实发金额 > 补贴发放标准.标准)
  description: 该表达式通过量化阈值判断超标行为：1）会议费，若实际人均日支出超出规定标准10%以上，则触发超标疑点；2）餐饮类接待费，若人均支出超出规定标准20%以上，视为严重超标；3）补贴，只要实际发放名册中的金额大于制度明文规定的标准，即刻判定为违规。表达式要求必须能通过签到表、接待清单等附件核实实际人数，确保计算的准确性。
  audit_item: 住房公积金管理费用支出不合规
  suspicion: 超标准列支接待费、会议费、培训费及补贴
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金财务管理办法\",\n    \"法规文号\": \"财综字〔1999〕59号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十一条\",\n    \"内容概述\": \"公积金管理机构应在编报年度预算时列明各项费用明细标准，并严格执行，不得超预算、超标准支出。\"\n  },\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\"\
    ,\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"接待对象应当按照规定标准自行用餐。确因工作需"
- expression: (比对表.实际检测值 < 比对表.标准要求值) || (证明文件.保质期截止日 < 物资接收日期) || (证明文件.生产许可证号 == null || 证明文件.合格证编号 == null)
  description: 存在以下任一情况即判定为接收不合格物资：①关键质量指标检测值低于行业或合同约定标准（如口罩过滤效率<95%）；②物资接收时已超过保质期；③缺少必要的生产许可证或合格证。
  audit_item: 社会捐赠款物接收管理不合规
  suspicion: 接收质量不合格的捐赠物资
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号（2016年）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十五条\",\n    \"内容概述\": \"慈善组织接受捐赠，应当查验捐赠物资是否符合安全、卫生、环保等标准；不符合标准的，不得接受。\"\n  }\n]"
