violations:
- expression: (内部管理制度.具体支持性条款 激发 上位法规政策文件.允许或鼓励发展的方向的相反方向) || (内部管理制度.具体条款内容 != 上位法规政策文件.技术标准编号) || (内部管理制度.差异化落地措施描述 违背 上位法规政策文件.法定内涵与外延)
  description: 审查内部制度对上位政策的支持性拓展或差异化适配是否‘跑偏’。表达式逻辑：1.内部制度的条款虽然对上位政策进行了细化，但方向与上位政策初衷相悖（如养老服务体系本应细化社区设施标准，却将资源全部导向高端养老地产）；2.内部制度引用的技术标准低于或与上位政策指定的强制性标准不一致，如食品安全监管未采用国家强制标准；3.地方的差异化适配措施不合理，损害了公平性或造成新的风险。
  audit_item: 内控管理制度符合性审计
  suspicion: 内部制度违反应当性规定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国标准化法\",\n    \"法规文号\": \"主席令第七十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十五条\",\n    \"内容概述\": \"不符合强制性标准的产品、服务，不得生产、销售、进口或者提供。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国反垄断法\",\n    \"法规文号\": \"\
    主席令第一一六号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十一条至第四十五条\",\n    \"内容概述\": \"行政机关和法律、法规授权的具有管理公共事务职能的组织不得滥用行政权力，制定含有排除、限"
- expression: COUNT(登记清单.车牌号) > 核定编制数.核定编制数 || (登记清单.价格 > 标准.价格上限 && 记录表.是否特批 != '是') || (登记清单.排量 > 标准.排量上限 && 记录表.是否特批 !=
    '是')
  description: 实有车辆数超过核定编制数即违规；车辆单价或排量超出当地规定上限，且无合规特批手续的，判定为超标准配备。
  audit_item: 违规配备公务用车
  suspicion: 超编制超标准配备公务用车
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条、第九条、第十条\",\n    \"内容概述\": \"公务用车编制根据机构设置和人员编制确定，不得超编制配备；公务用车配备标准由省级主管部门制定，党政机关不得超标准配备；确因特殊情况需超标准配备的，须报省级公务用车主管部门审批。\"\
    \n  }\n]"
- expression: (公告.供应商资格条件（所有制要求、注册资金、营业额、业绩要求） CONTAINS ('国有企业' OR '所有制') OR (公告.供应商资格条件（所有制要求、注册资金、营业额、业绩要求） > 项目预算金额 * 2)
    OR (公告.供应商资格条件（所有制要求、注册资金、营业额、业绩要求） > 项目预算金额 * 5) OR (公告.技术参数 指向特定品牌/专利 且 无 '或同等性能产品' 表述)) AND (信息表.所有制性质 > 0.8) AND (信息表.所有潜在市场供应主体信息
    > 10)
  description: 筛查招标文件是否明确要求所有制性质，或设定远超项目实际需求的注册资金（>预算2倍）、营业额（>预算5倍）等条件，技术参数是否唯一指向特定品牌。同时，当中标结果中国有企业占比超过80%，且市场上存在大量符合条件的民营供应商时，可判定为歧视性条件。
  audit_item: 违反建设管理相关政策规定-政府采购活动中设置不合理的条件对供应商实行差别待遇或者歧视待遇
  suspicion: 以所有制、规模或品牌产地等条件实行歧视待遇
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十二条\",\n    \"内容概述\": \"采购人不得以不合理的条件对供应商实行差别待遇或者歧视待遇。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\"\
    : \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"以所有制形式、注册资本、营业收入等规模条件，或者以特定行业、特定行政区域、特定品牌的业"
- expression: (检测报告.具体部位使用的检测方法 使用 '钢尺/读数显微镜' && 对应病害位置 == '主梁关键受力区') || (检测报告.具体部位使用的检测方法 使用 '频率法' && 未附 '标定参数' ) || (设备台账.校准有效期
    < 检测实施日期)
  description: 钢结构疲劳裂缝检测精度要求高，使用钢尺无法捕获微观裂纹；索力测试若无标定参数则计算模型不可靠。使用过期或未经校准的设备出具的数据为无效数据。
  audit_item: 道路桥梁安全定期检测审计
  suspicion: 检测方法未达标准要求
  regulation: "[\n  {\n    \"法规名称\": \"公路桥梁承载能力检测评定规程\",\n    \"法规文号\": \"JTG/T J21-2011\",\n    \"效力级别\": \"行业规范\",\n   \
    \ \"条款号\": \"5.2/5.3\",\n    \"内容概述\": \"详细规定了结构几何参数、裂缝宽度、混凝土强度、索力等的检测方法及精度要求，例如裂缝宽度应采用读数显微镜或裂缝测宽仪，钢构件裂纹应采用磁粉探伤或超声检测。\"\
    \n  }\n]"
- expression: (接待清单.人均费用 > 标准.宴请费上限) || (接待清单.接待人数 > 审批文件.批准接待人数 * 1.5) || (接待清单.场所类型 属于 '高档餐厅' 或 '娱乐场所' 等禁止类别)
  description: 同时检查三个条件：人均费用超出该国宴请标准上限，或实际接待人数超出批准人数的50%，或消费场所为高档餐厅、娱乐场所等明确禁止地点，满足任一条件即视为违规。高档场所可结合米其林星级、黑珍珠钻级等外部数据判定。
  audit_item: 境外公务未严格落实中央八项规定及实施细则精神
  suspicion: 超标准安排境外公务接待
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
