name: audit/规章制度类/技术指南
type: model
description: 从规章制度类类文档（技术指南）中提取结构化元数据。涵盖字段如：排查主体、禁养区划定范围上限、覆盖范围要求、识别标准。文档范围包括：农村黑臭水体排查技术指南、划定技术指南等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 技术指南
  member_count: 1
  member_details:
  - 农村黑臭水体排查技术指南
  - 划定技术指南
output:
  fields:
  - name: 排查主体
    type: string
    description: 提取 排查主体 的文本值
  - name: 禁养区划定范围上限
    type: string
    description: 提取 禁养区划定范围上限 的文本值
  - name: 覆盖范围要求
    type: string
    description: 提取 覆盖范围要求 的文本值
  - name: 识别标准
    type: string
    description: 提取 识别标准 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (COUNT(清单表.水体名称) < COUNT(数据.疑似黑臭水体图斑坐标)) || (EXISTS(举报记录.投诉地点 NOT IN 清单表.位置坐标))
  description: 将排查清单表中的水体数量与卫星遥感解译的疑似黑臭水体图斑数量进行比对，若清单数量明显少于遥感图斑数量，判定为存在遗漏；同时，将村民投诉记录中的地点与排查清单进行关联，若投诉地点在清单中无对应记录，判定为遗漏。两者为“或”条件，满足其一即生成疑点。
  audit_item: 农村黑臭水体治理不到位
  suspicion: 排查识别黑臭水体遗漏或误报
  regulation: "[\n  {\n    \"法规名称\": \"农村黑臭水体治理工作指南\",\n    \"法规文号\": \"环办土壤〔2019〕826号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三条、第八条\",\n    \"内容概述\": \"省级生态环境部门应组织指导各地以行政村为单位开展排查，摸清辖区农村黑臭水体数量、位置、污染成因等，建立清单。排查应综合采用资料收集、现场调查、群众走访、监测分析等方法。\"\
    \n  }\n]"
- expression: (禁养区内合规养殖场关停数 / 禁养区内养殖场总数 > 0.2) || (实际划定面积 / 技术指南规定面积上限 > 1.3) || (补偿标准 < 地方政府规定标准 && 仍实施搬迁)
  description: 合规养殖场被迫关停比例超过20%可能反映划定不合理；划定面积超出技术指南上限30%以上为显著扩大；补偿低于标准且仍实施属侵害权益。
  audit_item: 项目实施不到位
  suspicion: 禁养区随意扩大致合规养殖场关停
  regulation: "[\n  {\n    \"法规名称\": \"畜禽养殖禁养区划定技术指南\",\n    \"法规文号\": \"环办水体〔2016〕99号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"四、划定范围\",\n    \"内容概述\": \"明确规定禁养区包括饮用水水源保护区、风景名胜区、自然保护区的核心区和缓冲区等，不得随意扩大范围。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国畜牧法\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"禁止在划定的禁养区域内建设畜禽养"
