name: audit/规章制度类/操作规范
type: model
description: 从规章制度类类文档（操作规范）中提取结构化元数据。涵盖字段如：作用时间、信息登记要素要求、入库时限要求、建档标准、建档立卡完成时限、消毒剂浓度、消毒方式、消毒液配比标准。文档范围包括：保险机构理赔操作规范、养老机构消毒操作规范、操作规范、退捕渔民建档立卡操作规范、项目上图入库操作规范、餐具消毒操作规范等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 登记
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 操作规范
  member_count: 1
  member_details:
  - 保险机构理赔操作规范
  - 养老机构消毒操作规范
  - 操作规范
  - 退捕渔民建档立卡操作规范
  - 项目上图入库操作规范
  - 餐具消毒操作规范
output:
  fields:
  - name: 作用时间
    type: date
    description: 提取 作用时间 的日期值，格式 YYYY-MM-DD
  - name: 信息登记要素要求
    type: string
    description: 提取 信息登记要素要求 的文本值
  - name: 入库时限要求
    type: string
    description: 提取 入库时限要求 的文本值
  - name: 建档标准
    type: string
    description: 提取 建档标准 的文本值
  - name: 建档立卡完成时限
    type: string
    description: 提取 建档立卡完成时限 的文本值
  - name: 消毒剂浓度
    type: string
    description: 提取 消毒剂浓度 的文本值
  - name: 消毒方式
    type: string
    description: 提取 消毒方式 的文本值
  - name: 消毒液配比标准
    type: string
    description: 提取 消毒液配比标准 的文本值
  - name: 消毒责任人
    type: string
    description: 提取 消毒责任人 的文本值
  - name: 温度
    type: string
    description: 提取 温度 的文本值
  - name: 灰土分类要求说明
    type: string
    description: 提取 灰土分类要求说明 的文本值
  - name: 规定消毒频次
    type: string
    description: 提取 规定消毒频次 的文本值
  - name: 规定理赔时限
    type: string
    description: 提取 规定理赔时限 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (其他.支付时间 - 其他.报案时间) > 60天 && 无合理延期审批 || (其他.支付时间 - 达成协议时间) > 10天 || 规定理赔时限.投诉记录及处理结果中合理拒赔占比 > 20%
  description: 自报案至支付超60天且无合规延期手续，或达成赔偿协议后超10天未支付，或投诉记录中经核查合理拒赔比例超过20%，均视为理赔不及时或不合理。
  audit_item: 农业保险保费补贴政策落实不到位
  suspicion: 保险机构未及时支付农业保险理赔款
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\"\
    ,\n    \"内容概述\": \"保险机构应当及时履行赔偿义务。保险机构应当自与被保险人达成赔偿协议之日起10日内，将应赔偿的保险金支付给被保险人。\"\n  }\n]"
- expression: (操作规范文件缺失) || (灰土收集重量.灰土收集重量 < 理论产生量 * 0.3) || (冬季垃圾清运量中灰土占比估算 > 20% && 无灰土单独收集台账)
  description: 未制定灰土单独收集规范，或灰土收集率低于理论产生量的30%，或冬季垃圾中灰土占比明显偏高（>20%）却无单独收集记录，均表明灰土未有效分类。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 燃煤地区灰土未单独分类收集
  regulation: "[\n  {\n    \"法规名称\": \"《农村生活垃圾治理导则》\",\n    \"法规文号\": \"建村〔2018〕101号\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"第4.3.2条\",\n    \"内容概述\": \"在北方以燃煤为主要能源的地区，灰土应实行单独收集，就地就近资源化利用，不得混入生活垃圾。\"\n  }\n]"
- expression: DATEDIFF(验收报告.入库日期, 验收报告.验收完成日期) > 30
  description: 入库日期与验收完成日期的间隔超过30天，即未在规定时限内上图入库。
  audit_item: 违反高标准农田项目规划和管理规定的行为
  suspicion: 已建成高标准农田未及时上图入库
  regulation: "[\n  {\n    \"法规名称\": \"高标准农田建设质量管理办法（试行）\",\n    \"法规文号\": \"农建发〔2021〕1号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十五条\",\n    \"内容概述\": \"项目竣工验收后，县级农业农村部门应当在30个工作日内将项目信息上图入库。\"\n  }\n]"
- expression: (退捕渔民信息登记.审核通过时间 > 退捕渔民建档立卡操作规范.建档立卡完成时限) || (ABS(退捕渔民信息登记.审核通过时间 - 退捕渔民信息登记.登记时间) > 15) || (COUNT(退捕渔民信息登记.渔民身份信息)
    > 2 && 退捕渔民信息登记.审核通过时间 > 退捕渔民建档立卡操作规范.建档立卡完成时限) || (退捕渔民补偿协议.协议签订时间 > 退捕渔民建档立卡操作规范.建档立卡完成时限 + 30)
  description: 建档立卡规定时限来源于操作规范或上级文件。若渔民信息登记明细表中，最终审核通过日期超过该时限，即判为未按时完成。审核流程中村、镇、县等环节平均滞留天数超过15天，表明流程拖沓。同一渔民信息因质量问题被退回修改超过2次且最终完成时间已超期，属典型的因返工导致延迟。补偿协议签订时间超出建档立卡完成时限30天以上，说明建档完成后补偿工作滞后，整体时效性差。
  audit_item: 任务目标未按时完成（长江全面禁捕）
  suspicion: 退捕渔民建档立卡工作未按时完成
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发<长江流域重点水域禁捕和退捕渔民安置保障工作实施方案>的通知\",\n    \"法规文号\": \"农办计财〔2020〕13号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、（二）项\",\n    \"内容概述\": \"要求各地按照统一标准，及时完成退捕渔民建档立卡工作，做到不落一船、不落一户、不落一人。\"\n\
    \  }\n]"
- expression: (记录表.消毒方式 NOT IN 操作规范.消毒方式) || (记录表.检测结果 == '不合格' && 记录表.整改措施 == '无') || (记录表.检测日期 < 1次/月)
  description: 消毒使用方式不符合操作规范要求，检测结果不合格未启动整改，或每月消毒效果检测少于1次，均属违规，反映系统性消毒管理缺失。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 餐具清洗消毒不合规
  regulation: "[\n  {\n    \"法规名称\": \"餐饮服务食品安全操作规范\",\n    \"法规文号\": \"国家市场监督管理总局公告2018年第12号\",\n    \"效力级别\": \"行业规范\",\n\
    \    \"条款号\": \"10.1.3、10.1.4\",\n    \"内容概述\": \"餐用具使用后应及时清洗消毒，鼓励采用热力消毒方式，消毒后的餐饮具应符合GB14934要求，并定期进行消毒效果检测。\"\n  }\n]"
