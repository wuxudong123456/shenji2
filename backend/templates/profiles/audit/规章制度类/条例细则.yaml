name: audit/规章制度类/条例细则
type: model
description: 从规章制度类类文档（条例细则）中提取结构化元数据。涵盖字段如：选举程序要求。文档范围包括：条例细则等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 条例细则
  member_count: 1
  member_details:
  - 条例细则
output:
  fields:
  - name: 选举程序要求
    type: string
    description: 提取 选举程序要求 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 任命文件.产生方式 != '民主选举' OR 选举记录.有效票数 / 选举记录.选举结果 < 2/3
  description: 职工代表应当通过职工代表大会民主选举产生，若任命文件中产生方式为直接指定、无选举记录或选举投票比例低于三分之二，则视为违规。
  audit_item: 住房公积金决策机构未按规定履职
  suspicion: 职工代表未经民主选举产生
  regulation: "[\n  {\n    \"法规名称\": \"《住房公积金管理条例》\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第八条\",\n    \"内容概述\": \"工会代表和职工代表占三分之一。职工代表应由职工推举产生，确保其能代表职工利益。\"\n  }\n]"
