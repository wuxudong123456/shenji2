name: audit/规章制度类/旁站方案
type: model
description: 从规章制度类类文档（旁站方案）中提取结构化元数据。涵盖字段如：旁站人员安排、旁站工序清单。文档范围包括：监理旁站方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 人员
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 旁站方案
  member_count: 1
  member_details:
  - 监理旁站方案
output:
  fields:
  - name: 旁站人员安排
    type: string
    description: 提取 旁站人员安排 的文本值
  - name: 旁站工序清单
    type: string
    description: 提取 旁站工序清单 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (旁站记录.旁站部位 不包含 施工日志.部位) || (旁站记录.起止时间 未覆盖 施工日志.关键工序施工起止时间) || (监理日志.旁站情况摘要 == 无 且 旁站记录 为空)
  description: 根据旁站方案要求的部位，若施工日志显示该工序已施工，但旁站记录无对应部位或时间未全程覆盖；或监理日志中无任何旁站记载，则判定旁站缺失。
  audit_item: 工程质量事故调查
  suspicion: 监理对关键工序未实施旁站
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第三十八条\",\n    \"内容概述\": \"监理工程师应当按照工程监理规范的要求，采取旁站、巡视和平行检验等形式，对建设工程实施监理。\"\n  },\n  {\n    \"法规名称\": \"房屋建筑工程施工旁站监理管理办法\"\
    ,\n    \"法规文号\": \"建市[2002]189号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"在基础工程方面包括：土方回填，混凝土灌注桩浇筑"
