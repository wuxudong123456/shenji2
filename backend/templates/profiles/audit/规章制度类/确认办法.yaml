name: audit/规章制度类/确认办法
type: model
description: 从规章制度类类文档（确认办法）中提取结构化元数据。涵盖字段如：特殊群体处理规则、确认标准。文档范围包括：集体经济组织成员身份确认办法等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 确认办法
  member_count: 1
  member_details:
  - 集体经济组织成员身份确认办法
output:
  fields:
  - name: 特殊群体处理规则
    type: string
    description: 提取 特殊群体处理规则 的文本值
  - name: 确认标准
    type: string
    description: 提取 确认标准 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (成员台账.成员身份状态 != '已确认' AND 成员台账.户籍类别='本村户籍') OR (成员台账.确认依据 NOT IN ('户籍、土地承包、贡献等') AND 确认办法.确认标准存在矛盾) OR (公示记录.公示天数
    < 7 AND 成员确认办法.公示要求天数 >= 7) OR (成员台账.成员身份状态='已确认' AND 成员台账.身份证号无关联户籍记录)
  description: 符合确认条件（如本村户籍、享有土地承包权）但未确认，或确认依据不符合政策要求，或公示天数不足，或疑似虚假确认（无关联户籍记录）时，视为成员身份确认不精准。公示天数阈值以各地规定为准，一般不少于7天。
  audit_item: 集体经营性资产产权制度改革不到位
  suspicion: 集体经济组织成员身份未确认或确认不精准
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四部分第（二）条\",\n    \"内容概述\": \"确认农村集体经济组织成员身份。依据有关法律法规，按照尊重历史、兼顾现实、程序规范、群众认可的原则，统筹考虑户籍关系、农村土地承包关系、对集体积累的贡献等因素，协调平衡各方利益。\"\
    \n  }\n]"
