name: audit/规章制度类/技术规范
type: model
description: 从规章制度类类文档（技术规范）中提取结构化元数据。涵盖字段如：压实度等技术参数、取水泵站坐标、材料规格型号、混凝土标号、渠道衬砌厚度、管网最不利点水压、繁殖更新周期标准、结构尺寸参数。文档范围包括：保护性耕作技术规范、工程项目技术规范、种质资源入库监测技术规范、项目设计技术规范等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 验收
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 技术规范
  member_count: 1
  member_details:
  - 保护性耕作技术规范
  - 工程项目技术规范
  - 种质资源入库监测技术规范
  - 项目设计技术规范
output:
  fields:
  - name: 压实度等技术参数
    type: string
    description: 提取 压实度等技术参数 的文本值
  - name: 取水泵站坐标
    type: string
    description: 提取 取水泵站坐标 的文本值
  - name: 材料规格型号
    type: string
    description: 提取 材料规格型号 的文本值
  - name: 混凝土标号
    type: string
    description: 提取 混凝土标号 的文本值
  - name: 渠道衬砌厚度
    type: string
    description: 提取 渠道衬砌厚度 的文本值
  - name: 管网最不利点水压
    type: string
    description: 提取 管网最不利点水压 的文本值
  - name: 繁殖更新周期标准
    type: string
    description: 提取 繁殖更新周期标准 的文本值
  - name: 结构尺寸参数
    type: string
    description: 提取 结构尺寸参数 的文本值
  - name: 规定监测频率
    type: string
    description: 提取 规定监测频率 的文本值
  - name: 设计技术标准
    type: string
    description: 提取 设计技术标准 的文本值
  - name: 验收合格标准
    type: string
    description: 提取 验收合格标准 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: ((监测表.监测时间 > 规定监测频率（如每季度/半年/1年）、繁殖更新周期标准（如3年/5年）.规定监测频率（如每季度/半年/1年） * 3) || (对比表.实际更新日期 - 对比表.计划更新日期 > 365天))
    && (操作记录.休眠期标注 IS NULL || 监测表.异常情况 == '无')
  description: 判定规则：一是监测频率违规，若连续2个规定周期以上（如规定1年1次，则间隔大于3年即为3个周期）没有监测记录，且在操作记录中无休眠期或特殊情况说明；二是繁殖更新逾期，实际更新日期比计划更新日期晚于1年。满足以上任一条件，同时排除种子休眠、保存环境异常等客观技术原因后，即视为工作不及时。
  audit_item: 种质资源保护利用方面不符合相关规定
  suspicion: 入库种质资源监测更新周期严重滞后
  regulation: "[\n  {\n    \"法规名称\": \"《农作物种质资源管理办法》\",\n    \"法规文号\": \"中华人民共和国农业部令第30号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十条\",\n    \"内容概述\": \"种质资源库应当对保存的种质资源定期进行监测，及时进行繁殖更新，保证种质资源的活力和遗传完整性。\"\n  },\n  {\n    \"法规名称\": \"《国家级畜禽遗传资源保护名录管理办法》\"\
    ,\n    \"法规文号\": \"中华人民共和国农业部公告第2061号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"相关技术规范条款\",\n    \"内容概述\": "
- expression: (台账上报合格率 - 监理或审计复验合格率) > 0.15
  description: 当验收台账记录的上报合格率与第三方监理报告或审计组现场复验得出的合格率之差大于15个百分点时，即表明验收流于形式或数据造假。若复验合格率低于60%，则存在严重质量隐患。
  audit_item: 黑土地保护治理相关任务未完成或完成质量不高
  suspicion: 保护性耕作验收合格率虚高
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"项目竣工验收应对照入库的面积和建设标准，严格核查工程质量，对不合格工程不得通过验收，并追究相关责任。\"\n  }\n]"
