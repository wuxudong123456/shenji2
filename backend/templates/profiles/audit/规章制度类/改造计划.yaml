name: audit/规章制度类/改造计划
type: model
description: 从规章制度类类文档（改造计划）中提取结构化元数据。涵盖字段如：承诺改造座数。文档范围包括：危桥改造计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 改造计划
  member_count: 1
  member_details:
  - 危桥改造计划
output:
  fields:
  - name: 承诺改造座数
    type: string
    description: 提取 承诺改造座数 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (危桥清单.实际完成日期 > 危桥清单.计划完成日期 + 365天) OR (危桥清单.当前状态='设计阶段' AND 计划完成日期已过期) OR (验收报告.改造后技术等级 IN ('四类','五类') OR 验收报告.是否满足设计承载力要求)
  description: 实际完成日期晚于计划日期超过一年视为严重逾期；仍停留在设计阶段且计划已过期表明任务未实质推进；改造后仍为四类或五类桥梁，或承载力不达标，即改造不成功。
  audit_item: 安全隐患排查整治不到位
  suspicion: 危桥改造任务逾期未完成或改造不达标
  regulation: "[\n  {\n    \"法规名称\": \"公路安全保护条例\",\n    \"法规文号\": \"国务院令第593号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十六条\",\n    \"内容概述\": \"公路管理机构应当对技术等级为四类、五类的桥梁采取改建、关闭等措施，及时消除安全隐患。\"\n  }\n]"
