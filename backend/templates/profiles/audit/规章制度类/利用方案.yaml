name: audit/规章制度类/利用方案
type: model
description: 从规章制度类类文档（利用方案）中提取结构化元数据。涵盖字段如：实际运营记录、规划处理规模、规定清掏频率、集中转运路线、预计产出。文档范围包括：粪污资源化利用方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 利用方案
  member_count: 1
  member_details:
  - 粪污资源化利用方案
output:
  fields:
  - name: 实际运营记录
    type: string
    description: 提取 实际运营记录 的文本值
  - name: 规划处理规模
    type: string
    description: 提取 规划处理规模 的文本值
  - name: 规定清掏频率
    type: string
    description: 提取 规定清掏频率 的文本值
  - name: 集中转运路线
    type: string
    description: 提取 集中转运路线 的文本值
  - name: 预计产出
    type: string
    description: 提取 预计产出 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (处理台账.清掏间隔天数 > 利用方案.规定清掏频率 * 1.5) || (调查表.清掏服务是否及时 == "否" && 调查表.粪污倾倒地点 != "指定处理站") || (处理台账.粪污去向 != "集中处理站"
    && 处理台账.粪污去向 != "资源化利用点")
  description: 判定条件：1.台账显示实际清掏间隔超过制度规定最大间隔的1.5倍；2.农户反映清掏不及时且随意倾倒至非指定地点；3.台账记录粪污去向非规定集中处理站点。满足任一组合触发疑点。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 户厕粪污清掏不及时且随意倾倒
  regulation: "[\n  {\n    \"法规名称\": \"关于推进农村“厕所革命”专项行动的指导意见\",\n    \"法规文号\": \"农社发〔2018〕2号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"建立健全粪污收集处理体系，严禁随意倾倒粪渣粪液，确保粪污无害化处理和资源化利用。\"\n  }\n]"
- expression: (SUM(处理台账.清掏量) - SUM(处理台账.接收量) > 0.2 * SUM(清掏量)) || (利用方案.实际运营记录 == NULL || 利用方案.预计产出（沼气/堆肥） == 0) || (明细表.运营补贴支出
    == 0)
  description: 判定条件：1.清掏总量与处理站接收量差异超过清掏总量的20%，说明大量粪污未入处理站；2.资源化利用方案无任何实际运营记录或产出为零；3.无运营补贴支出，表明集中处理站未运行。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 粪污未集中收集和资源化利用
  regulation: "[\n  {\n    \"法规名称\": \"畜禽规模养殖污染防治条例\",\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"推动畜禽粪便等废弃物资源化利用，但一般也适用农村粪污资源化利用方向，要求集中收集处理。\"\n  },\n  {\n    \"法规名称\": \"关于推进农村“厕所革命”专项行动的指导意见\"\
    ,\n    \"法规文号\": \"农社发〔2018〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"推进粪污资源化利用，统筹建设无害化处理和"
