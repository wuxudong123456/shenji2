name: audit/规章制度类/搭配方案
type: model
description: 从规章制度类类文档（搭配方案）中提取结构化元数据。涵盖字段如：各类食物供给量、能量目标、蛋白质供能比。文档范围包括：膳食营养搭配方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 搭配方案
  member_count: 1
  member_details:
  - 膳食营养搭配方案
output:
  fields:
  - name: 各类食物供给量
    type: string
    description: 提取 各类食物供给量 的文本值
  - name: 能量目标
    type: string
    description: 提取 能量目标 的文本值
  - name: 蛋白质供能比
    type: string
    description: 提取 蛋白质供能比 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (评估表.能量达标率 < 90%) || (评估表.蛋白质供能比 < 12% || 评估表.蛋白质供能比 > 14%) || (评估表.蔬菜种类数 < 3种)
  description: 参照《学生餐营养指南》WS/T 554-2017，能量供给应达到推荐量的90%及以上，蛋白质供能比宜为12%-14%，每日蔬菜种类不少于3种。连续不达标即构成膳食营养违规。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 供餐模式与营养搭配不科学
  regulation: "[\n  {\n    \"法规名称\": \"学生餐营养指南\",\n    \"法规文号\": \"WS/T 554-2017\",\n    \"效力级别\": \"行业标准\",\n    \"条款号\"\
    : \"4.1、4.2\",\n    \"内容概述\": \"学生餐一日三餐应满足能量和营养素推荐摄入量，蛋白质供能比宜为12%-14%，食物种类应多样化，每天应包括谷薯杂豆类、蔬菜水果类等。\"\n  }\n]"
