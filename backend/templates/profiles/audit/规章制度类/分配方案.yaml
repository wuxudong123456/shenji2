violations:
- expression: ({采集表.因素名称} NOT IN ({管理办法.规定的分配因素清单})) || ({采集表.权重设置} NOT BETWEEN {管理办法.各因素权重范围} AND {管理办法.资金上限}) || ({说明文件.实际采用的评分因素}
    IS NULL) && ({分配方案.审议通过的分配因素} IS NULL)
  description: 以上级管理办法规定的因素清单和权重范围为基准，采集表中出现的因素或权重若超出授权，且会议纪要无合规审批记录，即判为违规。缺少评分规则专家论证等合理性说明，同样触发疑点。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 分配因素不合规或评分规则不科学
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条、第十一条\",\n    \"内容概述\": \"专项转移支付应科学设置资金分配方法；采用因素法等，因素选择、权重设定应当科学合理。\"\n  }\n]"
- expression: (({调整前后因素名称、权重值、调整原因、审批记录.调整原因} IS NULL || {调整前后因素名称、权重值、调整原因、审批记录.审批记录} IS NULL) && ABS({调整前后因素名称、权重值、调整原因、审批记录.权重值}
    - {调整前后因素名称、权重值、调整原因、审批记录.权重值})/{调整前后因素名称、权重值、调整原因、审批记录.权重值} > 0.1) || ({不同处室/地区对同一项目的口径定义.不同处室/地区对同一项目的口径定义} != {各年度规定因素、口径、权重.口径})
    || ({各年度规定因素、口径、权重} 对比同类型项目同一因素权重差异 > 20% && 无政策文
  description: 权重调整缺乏原因或审批且变化率超过10%视为随意变更；不同单位对同一事项口径定义不一致，导致分配不公；历年同类项目相同因素权重波动超过20%且无政策依据，判定为政策执行不一致。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 分配因素、口径、权重随意变更不一致
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十五条\",\n    \"内容概述\": \"专项转移支付预算分配应按规定因素和权重执行，不得擅自变更；确需调整的，应报经批准。\"\n  }\n]"
- expression: (${分配方案.已分配金额} / ${分配方案.可分配总金额} * 100) < ${规定.明确的分配率指标（如≥90%）}
  description: 计算年初已分配预算金额占可分配预算总额的百分比，若低于法规或上级部门规定的最低分配率（如90%），则判定为违规。分配金额及总金额以预算批复年初数为准，不包含年中调整追加部分。规定分配率通常为“不低于90%”，实际分配率低于此即触发。
  audit_item: 违规批复预算
  suspicion: 年初预算分配率低于规定比例
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于进一步做好预算执行工作的指导意见\",\n    \"法规文号\": \"财预〔2010〕11号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条第（一）款\",\n    \"内容概述\": \"各部门要加快细化预算和预算批复进度，努力提高年初预算到位率，年初预算到位率原则上不低于90%。\"\n  }\n]"
- expression: 绩效考评指标得分明细表.考评等级 = '不合格' && 次年资金分配方案.获得补助的机构名称 包含 绩效考评指标得分明细表.被考评机构名称
  description: 上年绩效考评结果为不合格的培训机构，次年仍在资金分配中获得补助，表明考评结果未与资金分配挂钩。
  audit_item: 任务目标未完成、管理不规范（新型职业农民培训）
  suspicion: 培育工作绩效考评结果应用不到位
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十六条\",\n    \"内容概述\": \"绩效评价结果应作为资金分配、项目安排的重要依据，对考评不合格的项目单位应调减或暂停安排资金。\"\n  }\n]"
- expression: (农业用电指标分配与实际用量对比表.实际供电量 / 农业用电指标分配与实际用量对比表.计划分配电量（万千瓦时） < 0.85) AND (农业用电指标分配与实际用量对比表.月份 NOT IN (非农忙季节)) OR
    (电力调度负荷分配方案.限电序位 中 农业限电优先级高于一般工业) AND (农业用电指标分配与实际用量对比表.同期工业用电量同比未降或反升)
  description: 判定：1.在非灾害、非检修等客观原因下，农业实际供电量低于计划指标的85%，且该月为农忙季节（如春灌、秋收），视为指标被压缩；2.有序用电调度方案中，农业被错误地列为优先限电对象，且同期工业用电未受制，表明分配不公。
  audit_item: 供电服务不合规
  suspicion: 违规压缩农业用电分配指标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电力法\",\n    \"法规文号\": \"主席令第23号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十七条\"\
    ,\n    \"内容概述\": \"电力供应与使用办法由国务院依照本法的规定制定。供电企业在抢险救灾等紧急情况下，可依法采取限电措施，但要优先保证居民生活用电、重要用户用电以及农业生产季节性用电。\"\n  },\n  {\n   \
    \ \"法规名称\": \"有序用电管理办法\",\n    \"法规文号\": \"发改运行〔2011〕832号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    \"\
    内容概述\""
- expression: (注入比例核算表.注入金额 / 注入比例核算表.年度收益总额 < 0.2) || EXISTS (SELECT 1 FROM 基金账户银行流水, 基金注入记录 WHERE 基金账户银行流水.交易摘要 = '转出' AND
    基金账户银行流水.金额 = 基金注入记录.实际注入基金账户金额 AND 基金账户银行流水.交易日期 > 基金注入记录.入账日期 AND 基金账户银行流水.交易日期 <= 基金注入记录.入账日期 + 5)
