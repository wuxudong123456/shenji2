name: audit/规章制度类/分配方案
type: model
description: 从规章制度类类文档（分配方案）中提取结构化元数据。涵盖字段如：上级补助金额、业主份额计算方式、中央资金规定用途、分配人、分配对象、分配对象姓名、分配房源编号、分配数量。文档范围包括：专项资金分配方案、中央专项资金分配方案、二次分配部门年初预算分配方案、住房分配方案、公共租赁住房分配方案、增值收益计算与分配方案、对外投资收益分配方案、就业补助资金分配方案、年度财政资金预算分配方案、彩票公益金分配方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 工程
- 金额
- 项目
- 预算
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
