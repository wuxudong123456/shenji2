  - 增值收益计算与分配方案
  - 对外投资收益分配方案
  - 就业补助资金分配方案
  - 年度财政资金预算分配方案
  - 彩票公益金分配方案
  - 惠农补贴资金分配方案
  - 户均配变容量规划与分配方案
  - 收益分配方案
  - 本级预算分配方案
  - 次年资金分配方案
  - 款物分配方案
  - 电力调度负荷分配方案
