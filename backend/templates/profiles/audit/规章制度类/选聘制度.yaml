name: audit/规章制度类/选聘制度
type: model
description: 从规章制度类类文档（选聘制度）中提取结构化元数据。涵盖字段如：选拔程序、选聘条件。文档范围包括：村级信息员选聘制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 选聘制度
  member_count: 1
  member_details:
  - 村级信息员选聘制度
output:
  fields:
  - name: 选拔程序
    type: string
    description: 提取 选拔程序 的文本值
  - name: 选聘条件
    type: string
    description: 提取 选聘条件 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (信息员档案表.学历 < '高中' 或 '中专') || (信息员档案表.聘用方式 != '公开竞聘') || (信息员档案表.兼职站点数 > 1 && 站点间距 > 5公里)
  description: 信息员学历不达标，或未经过公开竞聘程序直接任命，或一人兼任多个相距较远的站点无法保证在岗履职，均属选聘违规。
  audit_item: 信息进村入户工程实施不到位
  suspicion: 村级信息员选聘不符合要求
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推进信息进村入户工程的实施意见\",\n    \"法规文号\": \"农市发[2016]3号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"第二部分第（二）条\",\n    \"内容概述\": \"信息员应具备高中以上文化程度，通过公开竞聘选聘，原则上实行一人一村，不得优亲厚友，确保能够履行服务职责。\"\n  }\n]"
