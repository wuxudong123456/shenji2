name: audit/规章制度类/设计方案
type: model
description: 从规章制度类类文档（设计方案）中提取结构化元数据。涵盖字段如：主色调、外立面材质、建筑名称、建筑风格描述、设计高度。文档范围包括：新建公共设施建筑设计方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 设计方案
  member_count: 1
  member_details:
  - 新建公共设施建筑设计方案
output:
  fields:
  - name: 主色调
    type: string
    description: 提取 主色调 的文本值
  - name: 外立面材质
    type: string
    description: 提取 外立面材质 的文本值
  - name: 建筑名称
    type: string
    description: 提取 建筑名称 的文本值
  - name: 建筑风格描述
    type: string
    description: 提取 建筑风格描述 的文本值
  - name: 设计高度
    type: string
    description: 提取 设计高度 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (新建公共设施建筑设计方案.设计高度 > 传统村落保护条例.建筑高度管控数值) || (新建公共设施建筑设计方案.外立面材质 IN 传统村落保护条例.禁用材质列表) || (风貌协调性评估登记表.评估结论 == '严重不协调')
  description: 若新建建筑设计方案的建筑高度超出地方实施细则规定的限高，或外立面使用了如玻璃幕墙、光面瓷砖等与传统风貌严重冲突的禁用材质，或经专家评估后结论为'严重不协调'，满足任一条件均判定为风貌不符违规。
  audit_item: 传统村落保护不到位
  suspicion: 新建建筑设计严重偏离传统风貌
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部 文化部 国家文物局 财政部关于切实加强中国传统村落保护的指导意见\",\n    \"法规文号\": \"建村〔2014〕61号\",\n    \"\
    效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"在传统村落内进行新建、扩建、改建活动，应符合保护发展规划要求，保持村落传统格局和历史风貌。建筑高度、体量、色彩、材质等应与核心保护区风貌相协调。\"\
    \n  }\n]"
