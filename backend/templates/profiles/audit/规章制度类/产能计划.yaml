name: audit/规章制度类/产能计划
type: model
description: 从规章制度类类文档（产能计划）中提取结构化元数据。涵盖字段如：承诺完成时间、承诺淘汰设备及产能。文档范围包括：企业去产能计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 产能计划
  member_count: 1
  member_details:
  - 企业去产能计划
output:
  fields:
  - name: 承诺完成时间
    type: date
    description: 提取 承诺完成时间 的日期值，格式 YYYY-MM-DD
  - name: 承诺淘汰设备及产能
    type: string
    description: 提取 承诺淘汰设备及产能 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: SUM(淘汰清单.实际淘汰产能) < 政策文件.目标任务量（按企业、按设备） OR （淘汰清单.实际关停日期 IS NULL AND 统计表.累计完成量 包含该设备） OR （自查报告.企业上报完成量 > 自查报告.政府核定完成量
    AND 差异率 > 10%）
  description: 通过汇总实际关停的产能与政策下达的任务量比对，若实际完成量低于目标任务量，即构成未足量完成。同时，若任务完成统计表显示某设备已关停，但淘汰清单中缺少对应的实际关停日期或关闭证明，则涉嫌虚报完成；企业自查报告与政府考核结果差异超过10%的，需重点核查是否存在虚假淘汰。
  audit_item: 未按规定落实去产能政策措施
  suspicion: 未按期足量完成去产能任务或虚假淘汰
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于钢铁行业化解过剩产能实现脱困发展的意见\",\n    \"法规文号\": \"国发〔2016〕6号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、主要任务（二）\",\n    \"内容概述\": \"各地区、各企业要严格按照目标任务和时间要求，加大化解过剩产能工作力度，确保完成去产能任务。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于做好2018年重点领域化解过剩产能工作的通知\",\n    \"法规文号\": \"发改运行〔2018〕554号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、认真组织开展化解过剩产"
