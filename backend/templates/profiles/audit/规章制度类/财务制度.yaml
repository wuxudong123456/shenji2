name: audit/规章制度类/财务制度
type: model
description: 从规章制度类类文档（财务制度）中提取结构化元数据。涵盖字段如：用途限定条款、结余款管理规定。文档范围包括：食堂结余款管理相关财务制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 财务制度
  member_count: 1
  member_details:
  - 食堂结余款管理相关财务制度
output:
  fields:
  - name: 用途限定条款
    type: number
    description: 提取 用途限定条款 的数值（含单位，如万元、吨等）
  - name: 结余款管理规定
    type: number
    description: 提取 结余款管理规定 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (食堂结余款管理相关财务制度.用途限定条款 包含 '零利润') && (食堂财务收支明细.支出项目 包含 '教职工福利' || 食堂财务收支明细.支出项目 包含 '其他非伙食支出')
  description: 食堂结余款制度明确规定遵循“零利润”原则或结余仅用于改善学生伙食，但财务支出明细中出现用于教职工福利、办公经费等非学生伙食相关支出，即判定为挪用。
  audit_item: 食堂建设管理不符合规定
  suspicion: 食堂结余款被挪用
  regulation: "[\n  {\n    \"法规名称\": \"学校食品安全与营养健康管理规定\",\n    \"法规文号\": \"教育部、国家市场监督管理总局、国家卫生健康委员会令第45号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"学校食堂应当坚持公益性原则，不以营利为目的。学校自主经营的食堂，其结余款应当用于改善学生伙食，不得用于非食堂经营服务方面的支出。\"\
    \n  },\n  {\n    \"法规名称\": \"农村义务教育学校食堂管理暂行办法\",\n    \"法规文号\": \"教财〔2012〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第"
