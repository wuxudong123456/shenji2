name: audit/规章制度类/总体规划
type: model
description: 从规章制度类类文档（总体规划）中提取结构化元数据。涵盖字段如：城镇开发边界、审批文件、永久基本农田、生态保护红线、禁止建设区域规定、编制单位、规划版本号、规划编制要素。文档范围包括：国土空间总体规划、土地利用总体规划、市县高标准农田建设总体规划、电网改造总体规划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 审批
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 总体规划
  member_count: 1
  member_details:
  - 国土空间总体规划
  - 土地利用总体规划
  - 市县高标准农田建设总体规划
  - 电网改造总体规划
output:
  fields:
  - name: 城镇开发边界
    type: string
    description: 提取 城镇开发边界 的文本值
  - name: 审批文件
    type: string
    description: 提取 审批文件 的文本值
  - name: 永久基本农田
    type: string
    description: 提取 永久基本农田 的文本值
  - name: 生态保护红线
    type: string
    description: 提取 生态保护红线 的文本值
  - name: 禁止建设区域规定
    type: string
    description: 提取 禁止建设区域规定 的文本值
  - name: 编制单位
    type: string
    description: 提取 编制单位 的文本值
  - name: 规划版本号
    type: string
    description: 提取 规划版本号 的文本值
  - name: 规划编制要素
    type: string
    description: 提取 规划编制要素 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: ABS(村庄规划与上位规划指标对照表.建设用地总规模等约束性指标及偏差值 - 村庄规划与上位规划指标对照表.建设用地总规模等约束性指标及偏差值) / 村庄规划与上位规划指标对照表.建设用地总规模等约束性指标及偏差值
    > 0.05 || (项目清单.规划用地性质 >= 3) || (文本.重点项目布局坐标 > 100米)
  description: 关键约束性指标偏差超过5%即视为不衔接；若超过3个建设项目的用地性质与国土空间总体规划定位冲突，或基础设施布局与专项规划坐标距离偏差大于100米（或明显无法衔接），则构成不衔接疑点。
  audit_item: 村庄规划编制质量不高
  suspicion: 村庄规划与上位或专项规划不衔接
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"城市总体规划、镇总体规划以及乡规划和村庄规划的编制，应当依据国民经济和社会发展规划，并与土地利用总体规划相衔接。\"\n  },\n  {\n    \"法规名称\":\
    \ \"自然资源部办公厅关于加强村庄规划促进乡村振兴的通知\",\n    \"法规文号\": \"自然资办发〔2019〕35号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二（五）\",\n\
    \    \"内容概述"
- expression: 规划编制要素（负荷预测、技术标准、投资估算、公众参与记录）、审批文件.规划编制要素（负荷预测、技术标准、投资估算、公众参与记录）未包含负荷预测或技术标准或公众参与记录 || (项目名称、实施地点、建设规模、实际完成情况、项目实际开工/完工状态.实施地点
    != 规划编制要素（负荷预测、技术标准、投资估算、公众参与记录）、审批文件.审批文件 && 无规划变更批复) || (规划编制年份 + 规划周期 < 当前年份 && 仍执行旧规划)
  description: 规划编制须包含必要要素并履行审批程序；实际实施范围与规划不符且无变更手续视为违规；执行已过期的规划编制。
  audit_item: 电网改造和供电服务不合规
  suspicion: 电网改造规划编制不符合要求
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2016〕2119号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第八条\",\n    \"内容概述\": \"农村电网改造升级规划应依据地方经济社会发展规划编制，明确发展目标、重点任务、技术原则、投资规模等，并履行审批与公开程序。\"\n  }\n]"
- expression: 土地利用现状变更调查表.地类名称 IN ('林地','商业服务业用地','工业用地','住宅用地') AND 空间重叠(土地利用现状变更调查表.图斑坐标, 入库数据表.项目坐标) = true
  description: 高标准农田坐标范围内出现林地或建设用地类图斑，判定为“非农化”违规。绿化造林、建设停车场、厂房等均属此类。
  audit_item: 高标准农田管护使用不符合相关规定
  suspicion: 违规占用高标准农田进行非农化建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十七条\"\
    ,\n    \"内容概述\": \"禁止占用永久基本农田发展林果业和挖塘养鱼；非农业建设必须节约使用土地，可以利用荒地的不得占用耕地。\"\n  }\n]"
- expression: (政府批准规划的红头文件或备案回执.批准文件文号 IS NULL || 政府批准规划的红头文件或备案回执.批准日期 IS NULL) || (规划备案情况统计表.备案状态 != '已备案' || 规划备案情况统计表.备案日期
    IS NULL)
  description: 规划必须经本级人民政府正式批准，并完成向上级主管部门的备案；缺少批准文件或未取得有效备案记录，均认定为审批备案程序缺失违规。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 高标准农田建设规划未经政府批准或未按规定备案
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第八条\",\n    \"内容概述\": \"市、县级农田建设规划须经本级人民政府批准后，报省级农业农村部门备案。未经批准和备案的规划，不能作为项目立项的依据。\"\n  }\n]"
