name: audit/规章制度类/准入制度
type: model
description: 从规章制度类类文档（准入制度）中提取结构化元数据。涵盖字段如：准入条件、审批流程。文档范围包括：医保定点医疗机构准入制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 审批
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 准入制度
  member_count: 1
  member_details:
  - 医保定点医疗机构准入制度
output:
  fields:
  - name: 准入条件
    type: string
    description: 提取 准入条件 的文本值
  - name: 审批流程
    type: string
    description: 提取 审批流程 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 机构名称 IN (许可证.准入条件) AND 机构名称 NOT IN (纳入定点管理的医疗机构名称)
  description: 筛选出已获执业许可、符合准入条件但未被纳入定点管理的卫生室，属于行政流程违规。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 符合条件村卫生室未纳入医保定点
  regulation: "[\n  {\n    \"法规名称\": \"国家医保局令第2号\",\n    \"法规文号\": \"国家医疗保障局令 第2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条、第十条\",\n    \"内容概述\": \"符合法定条件的医疗机构均可按规定程序自愿提出医保定点申请，经办机构不得以任何理由拒绝符合条件医疗机构的申请。\"\n  }\n]"
