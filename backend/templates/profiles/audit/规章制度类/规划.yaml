name: audit/规章制度类/规划
type: model
description: 从规章制度类类文档（规划）中提取结构化元数据。涵盖字段如：土地性质证明、规划许可证。文档范围包括：地方政府关于返乡创业园建设的规划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 规划
  member_count: 1
  member_details:
  - 地方政府关于返乡创业园建设的规划
output:
  fields:
  - name: 土地性质证明
    type: string
    description: 提取 土地性质证明 的文本值
  - name: 规划许可证
    type: string
    description: 提取 规划许可证 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (勘察记录.在用面积/情况表.规划可出租面积 < 60%) || (情况表.转租记录/情况表.规划可出租面积 > 10%) || (规划.土地性质证明缺失)
  description: 入驻率=已签约入驻返乡创业企业实际使用面积/园区规划可出租面积，低于60%视为园区闲置严重；违规转租指将创业园场地出租给非返乡创业项目或非创业者自营项目，转租面积占比超10%视为严重改变用途；缺少土地性质合规审批或规划许可视为建设程序违规。
  audit_item: 农民工返乡创业政策实施不到位
  suspicion: 返乡创业园建设不合规
  regulation: "[\n  {\n    \"法规名称\": \"关于结合新型城镇化开展支持农民工等人员返乡创业试点工作的通知\",\n    \"法规文号\": \"发改就业〔2015〕2811号\",\n    \"效力级别\"\
    : \"部门规范性文件\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"试点地区建设的返乡创业园要专门用于支持返乡创业项目，不得擅自改变用途或将场地转租给非返乡创业主体。\"\n  }\n]"
