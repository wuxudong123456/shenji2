name: audit/规章制度类/审核制度
type: model
description: 从规章制度类类文档（审核制度）中提取结构化元数据。涵盖字段如：公示时限、审核流程、流程、资质审核标准。文档范围包括：公租房申请审核制度、客户资质审核制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 审核制度
  member_count: 1
  member_details:
  - 公租房申请审核制度
  - 客户资质审核制度
output:
  fields:
  - name: 公示时限
    type: string
    description: 提取 公示时限 的文本值
  - name: 审核流程
    type: string
    description: 提取 审核流程 的文本值
  - name: 流程
    type: string
    description: 提取 流程 的文本值
  - name: 资质审核标准
    type: string
    description: 提取 资质审核标准 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (燃气销售流向登记表.客户ID NOT IN (客户资质台账.客户ID WHERE 资质类型='燃气经营许可证')) || (客户资质台账.有效期起 > 燃气销售流向登记表.销售日期 OR 客户资质台账.有效期止 <
    燃气销售流向登记表.销售日期)
  description: 销售记录对应的客户在资质台账中不存在有效的燃气经营许可证，或资质有效期未覆盖销售日期，即判定为违规。未取得资质包括无证和资质过期。
  audit_item: 销售业务管理方面存在的问题
  suspicion: 违规向未取得资质单位或个人销售燃气
  regulation: "[\n  {\n    \"法规名称\": \"城镇燃气管理条例\",\n    \"法规文号\": \"国务院令第666号（2016年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十八条第（八）项\",\n    \"内容概述\": \"燃气经营者不得向未取得燃气经营许可证的单位或者个人提供用于经营的燃气。\"\n  }\n]"
- expression: (住房保障申请家庭信息表.收入 > 住房保障政策文件.准入收入标准) || (不动产登记信息与住房保障名单比对表.房产面积 > 0) || (公租房实物配租名单.同一身份证号存在多条不同区域配租记录) || (家庭收入与个人所得税缴纳比对表.收入反推数据
    > 住房保障政策文件.准入收入标准 && 住房保障申请家庭信息表.申报年收入 < 家庭收入与个人所得税缴纳比对表.收入反推数据*0.7)
  description: 家庭人均年收入超过当地公布的公租房收入准入线；家庭成员名下有任何房产即不符合无房或住房困难条件；同一身份证号在不同城区或不同项目有实物配租记录，存在重复享受；当税务或社保反推收入高于政策收入线，且申报收入低于反推收入的70%时，视为虚假收入申报。以上任一条件满足即触发疑点。
  audit_item: 不符合条件的家庭违规获取住房保障待遇
  suspicion: 家庭收入或房产超标违规获取公租房
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条、第三十一条\",\n    \"内容概述\": \"申请公共租赁住房，应当符合在本地无住房或者住房面积低于规定标准、收入财产低于规定标准等条件；申请人隐瞒有关情况或提供虚假材料的，取消保障资格，并记入信用档案。\"\n\
    \  }\n]"
