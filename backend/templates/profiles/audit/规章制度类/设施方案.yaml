name: audit/规章制度类/设施方案
type: model
description: 从规章制度类类文档（设施方案）中提取结构化元数据。涵盖字段如：交通配套规划。文档范围包括：基础设施方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 设施方案
  member_count: 1
  member_details:
  - 基础设施方案
output:
  fields:
  - name: 交通配套规划
    type: string
    description: 提取 交通配套规划 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 功能区位置.间距<1000m OR 各区实际使用面积.各区实际使用面积超出各企业物流需求.各企业物流需求2倍以上 OR 功能区位置.间距>5km AND 交通配套规划.交通配套规划
  description: 功能区规划违反卫生防护距离要求，或面积严重冗余利用率低于50%，或交通配套缺失导致物流成本异常，均判定为布局不科学。距离阈值参照行业设计规范及审计实践。
  audit_item: 现代农业产业园（集群、强镇）规划、设计、立项不科学
  suspicion: 现代农业产业园规划布局不科学
  regulation: "[\n  {\n    \"法规名称\": \"国家现代农业产业园创建认定管理办法\",\n    \"法规文号\": \"农办规〔2021〕18号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二章 申报条件 第八条\",\n    \"内容概述\": \"产业园规划布局应科学合理，功能分区明确，生产、加工、物流、研发、服务等功能板块相对集中、有机衔接。\"\n  }\n]"
