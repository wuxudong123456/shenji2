name: audit/规章制度类/化解方案
type: model
description: 从规章制度类类文档（化解方案）中提取结构化元数据。涵盖字段如：化解总目标、资金来源说明。文档范围包括：债务化解方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 化解方案
  member_count: 1
  member_details:
  - 债务化解方案
output:
  fields:
  - name: 化解总目标
    type: string
    description: 提取 化解总目标 的文本值
  - name: 资金来源说明
    type: string
    description: 提取 资金来源说明 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: ( (进度表.计划还款金额 - 进度表.实际还款金额) / 进度表.计划还款金额 > 0.2 ) OR (进度表.化解状态 = '已化解' AND NOT EXISTS (SELECT 1 FROM 使用凭证 WHERE
    使用凭证.收款户名 = 进度表.债权人 AND 使用凭证.付款金额 >= 进度表.实际还款金额 AND 使用凭证.付款时间 <= 进度表.还款日期)) OR ( ABS(进度表.实际还款金额 - (SELECT SUM(付款金额) FROM
    使用凭证 WHERE 收款户名 = 进度表.债权人 AND 用途摘要 LIKE '%化债%')) > 1000 )
  description: 判定逻辑：1. 当期（或累计）还款计划完成率低于80%即视为化解进度严重滞后；2. 台账标记“已化解”但在债务人银行流水中找不到向原债权人支付化债资金记录，构成虚假化债；3. 实际支付金额与台账记录还款额偏差超过1000元且无法提供正当理由，疑似化债资金被截留或挪用。满足任一条件视为化债不到位。
  audit_item: 村级债务管理不规范
  suspicion: 旧债化解进度缓慢或虚假化债
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于坚决制止发生新的乡村债务有关问题的通知\",\n    \"法规文号\": \"国办发〔2005〕39号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"要积极稳妥地化解乡村债务，建立偿债机制，逐年消化旧债，严禁借新债还旧债。\"\n  },\n  {\n    \"法规名称\": \"农业部关于进一步加强村级债务管理工作的通知\"\
    ,\n    \"法规文号\": \"农经发〔2011〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"要制定切实可行的化债"
