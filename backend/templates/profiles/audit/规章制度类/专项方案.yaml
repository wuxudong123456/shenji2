name: audit/规章制度类/专项方案
type: model
description: 从规章制度类类文档（专项方案）中提取结构化元数据。涵盖字段如：人员到位时限、建成截止日期、编制人数、装备配置标准、计划编制人数。文档范围包括：专业执法队伍建设专项方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 人员
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 专项方案
  member_count: 1
  member_details:
  - 专业执法队伍建设专项方案
output:
  fields:
  - name: 人员到位时限
    type: string
    description: 提取 人员到位时限 的文本值
  - name: 建成截止日期
    type: date
    description: 提取 建成截止日期 的日期值，格式 YYYY-MM-DD
  - name: 编制人数
    type: number
    description: 提取 编制人数 的数值（含单位，如万元、吨等）
  - name: 装备配置标准
    type: string
    description: 提取 装备配置标准 的文本值
  - name: 计划编制人数
    type: number
    description: 提取 计划编制人数 的数值（含单位，如万元、吨等）
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (执法人员资质审核备案表.实际在岗人数 < 专业执法队伍建设专项方案.编制人数 * 0.8) || (执法人员资质审核备案表.持执法证人数 / 执法人员资质审核备案表.实际在岗人数 < 1) || (执法装备采购验收单据.验收合格率
    < 1) && (DATEDIFF(CURRENT_DATE, 专业执法队伍建设专项方案.建成截止日期, 'day') > 30)
  description: 执法队伍建成标志为：在岗人数达到编制数80%以上、全部在岗人员持证上岗、装备采购到位率100%。三项任一未达标且在方案规定截止日期后超过30天仍不满足，即判定为未按时建成。编制数空缺率超过20%或存在无证人员执法为严重违规。
  audit_item: 任务目标未按时完成
  suspicion: 未按时建成专业执法队伍
  regulation: "[\n  {\n    \"法规名称\": \"关于深化农业综合行政执法改革的指导意见\",\n    \"法规文号\": \"中办发〔2018〕61号\",\n    \"效力级别\": \"制度文件\",\n\
    \    \"条款号\": \"第二部分“建强执法队伍”\",\n    \"内容概述\": \"要求各地按照核定编制配齐执法人员，严格实行持证上岗和资格管理制度，配备必要的执法装备，确保综合执法能力满足履职需要。\"\n  }\n]"
- expression: (NVL(执法人员资质审核备案表.实际在岗人数, 0) < 专业执法队伍建设专项方案.计划编制人数 || NVL(执法装备采购验收单据.装备采购数量, 0) < 专业执法队伍建设专项方案.装备配置标准) && SYSDATE
    > 分阶段禁捕目标的时间节点安排表.队伍建设完成截止日期 && 延期申请或未完成情况说明文件.有效延期批复 IS NULL
  description: 在规划的截止日期，实际在岗执法人员数量或已验收合格的关键装备数量未达到专项方案要求，且无有效延期批复，即构成未按时建成。持证率低于80%或装备到位率低于70%为严重未达标。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 未按时建成专业执法队伍
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"无明确条款\",\n    \"内容概述\": \"要求加快组建专业化的渔政执法队伍，配齐执法船艇、无人机等装备，确保禁捕水域执法力量全覆盖。\"\n  }\n]"
