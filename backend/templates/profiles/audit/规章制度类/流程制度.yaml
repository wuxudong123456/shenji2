name: audit/规章制度类/流程制度
type: model
description: 从规章制度类类文档（流程制度）中提取结构化元数据。涵盖字段如：不合格工程交付禁止条款、发放时限规定、审批时限、岗位人员、规定审批节点、规定的备案时限要求、超概算上报规定条款、验收与交付管理规定。文档范围包括：发放流程制度（文件3）、建设单位内部审批流程制度、拨付流程制度、相关备案流程制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 人员
- 审批
- 工程
- 验收
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 流程制度
  member_count: 1
  member_details:
  - 发放流程制度（文件3）
  - 建设单位内部审批流程制度
  - 拨付流程制度
  - 相关备案流程制度
output:
  fields:
  - name: 不合格工程交付禁止条款
    type: number
    description: 提取 不合格工程交付禁止条款 的数值（含单位，如万元、吨等）
  - name: 发放时限规定
    type: string
    description: 提取 发放时限规定 的文本值
  - name: 审批时限
    type: string
    description: 提取 审批时限 的文本值
  - name: 岗位人员
    type: string
    description: 提取 岗位人员 的文本值
  - name: 规定审批节点
    type: string
    description: 提取 规定审批节点 的文本值
  - name: 规定的备案时限要求
    type: string
    description: 提取 规定的备案时限要求 的文本值
  - name: 超概算上报规定条款
    type: number
    description: 提取 超概算上报规定条款 的数值（含单位，如万元、吨等）
  - name: 验收与交付管理规定
    type: string
    description: 提取 验收与交付管理规定 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: ((批复文件.批准的概算总金额 - 研究报告.项目总投资额) / 研究报告.项目总投资额 > 0.1) && (申请.批复文号 IS NULL)
  description: 初步设计概算超出可研估算10%以上时，必须向原审批部门报告并取得批准。若建设单位无法提供对应的调整概算批复文件，即视为违规，其超支部分未经合法审批。
  audit_item: 建设项目初步设计概算投资超过可研批准估算%及以上未报告审批部门
  suspicion: 初步设计概算超可研估算10%以上未报批
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十三条\"\
    ,\n    \"内容概述\": \"政府投资项目投资概算超过可行性研究报告批准的投资估算10%的，项目单位应当向投资主管部门或者其他有关部门报告，投资主管部门或者其他有关部门可以要求项目单位重新报送可行性研究报告。\"\n  }\n]"
- expression: 明细表.实际交付日期 IS NOT NULL AND (验收报告.验收日期 IS NULL OR 明细表.实际交付日期 < 验收报告.验收日期)
  description: 若项目存在明确的交付使用记录（如交房、移交物业等），但竣工验收报告显示验收日期在交付之后或根本没有组织竣工验收，则构成未组织验收擅自交付的违规行为。同时，若尾款支付日期早于验收日期，也可作为交付迹象辅助判定。
  audit_item: 建设项目初步设计概算投资超过可研批准估算%及以上未报告审批部门
  suspicion: 建设工程竣工后未组织验收擅自交付使用
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"建设单位收到建设工程竣工报告后，应当组织设计、施工、工程监理等有关单位进行竣工验收。建设工程经验收合格的，方可交付使用。\"\n  }\n]"
- expression: 验收报告.验收结论 = '不合格' AND 明细表.实际交付日期 IS NOT NULL
  description: 竣工验收报告明确结论为不合格，但项目已有实际交付使用记录（如交房记录、物业移交、用户入住等），直接违反不得交付使用的强制性规定。无任何容差或辩解空间。
  audit_item: 建设项目初步设计概算投资超过可研批准估算%及以上未报告审批部门
  suspicion: 建设工程竣工验收不合格擅自交付使用
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"建设工程经验收合格的，方可交付使用；验收不合格的，不得交付使用。\"\n  }\n]"
- expression: DATEDIFF(明细表.发放时间, 审核结论、审核人、审核时间.审批通过时间) > 审批时限、发放时限规定.审批时限 AND 明细表.救助类型='临时救助'
  description: 临时救助资金发放时间与审批通过时间的间隔超过制度规定的上限（如5个工作日），即构成发放超期违规。
  audit_item: 社会保障待遇计算、发放错误
  suspicion: 临时救助金发放周期超期
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十八条\",\n    \"内容概述\": \"对需要紧急救助的生活无着人员，应当及时给予救助；临时救助的具体程序由县级以上民政部门规定，明确审批发放时限。\"\n  }\n]"
- expression: (审批记录.审批日期 > 日志.支付指令发起人与审批人) || (审批记录.签批意见 == 审批记录.审批人) || (审批记录.批准期限 > 0)
  description: 支付日期早于审批日期为逆程序操作；同一人兼任发起岗和审批岗为不相容岗位未分离；审批记录缺少规定环节签字（如集体决策）即构成违规。
  audit_item: 财政部门未按规定分配下达保障性安居工程专项资金
  suspicion: 专项资金分配审批流程不合规
  regulation: "[\n  {\n    \"法规名称\": \"行政事业单位内部控制规范（试行）\",\n    \"法规文号\": \"财会〔2012〕21号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条、第十八条\",\n    \"内容概述\": \"单位应当建立不相容岗位相互分离、相互监督的机制；重大资金拨付应执行授权审批控制，严禁逆程序操作。\"\n  }\n]"
