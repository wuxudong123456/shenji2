name: audit/规章制度类/公示制度
type: model
description: 从规章制度类类文档（公示制度）中提取结构化元数据。涵盖字段如：公示内容要求、公示内容要素、公示制度、公示时限要求、公示期限要求、公示渠道、制度文件名称、印发文号。文档范围包括：公益放映公示制度、补贴公示制度、补贴对象资格审核公示制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 公示制度
  member_count: 1
  member_details:
  - 公益放映公示制度
  - 补贴公示制度
  - 补贴对象资格审核公示制度
output:
  fields:
  - name: 公示内容要求
    type: string
    description: 提取 公示内容要求 的文本值
  - name: 公示内容要素
    type: string
    description: 提取 公示内容要素 的文本值
  - name: 公示制度
    type: string
    description: 提取 公示制度 的文本值
  - name: 公示时限要求
    type: string
    description: 提取 公示时限要求 的文本值
  - name: 公示期限要求
    type: string
    description: 提取 公示期限要求 的文本值
  - name: 公示渠道
    type: string
    description: 提取 公示渠道 的文本值
  - name: 制度文件名称
    type: string
    description: 提取 制度文件名称 的文本值
  - name: 印发文号
    type: string
    description: 提取 印发文号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (公示内容、公示起始日期、公示截止日期、公示平台、公示照片、截图等佐证 IS NULL) || (公示内容、公示起始日期、公示截止日期、公示平台、公示照片、截图等佐证.公示起始日期 + 制度规定的公示天数 > 补贴项目、发放标准、发放金额、发放日期、发放对象姓名、身份证号、补贴金额、发放状态、收款账号、补贴批次、姓名、银行账号、补贴面积、审批签字、银行回单.发放日期)
    || (公示内容、公示起始日期、公示截止日期、公示平台、公示照片、截图等佐证.公示内容 NOT LIKE '%补贴对象%' OR NOT LIKE '%补贴标准%' OR NOT LIKE '%补贴金额%')
  description: 判定条件1：无法提供公示信息登记表，视为未公示。判定条件2：公示结束日期晚于资金发放日期，即未按规定提前公示（一般要求至少公示7天），程序违规。判定条件3：公示内容缺少政策规定必须包含的对象、标准、金额等关键信息，属于公示不完整。满足任一条件即构成疑点。
  audit_item: 惠农财政补贴发放不到位
  suspicion: 惠农补贴信息未按规定公示公开
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"行政机关应当依照本条例第十九条的规定，主动公开本行政机关的下列政府信息：……（五）行政事业性收费项目及其依据、标准；（六）政府集中采购项目的目录、标准及实施情况……以及涉及公民、法人或者其他组织切身利益的惠农补贴发放信息。\"\
    \n  }\n]"
- expression: （公示制度.公示制度缺失）||（公示制度.回执审核制度缺失）||（公示制度.奖励制度缺失）||（公示制度.社会监督举报制度是否涵盖缺失）
  description: 检查制度文件清单中是否包含公益放映公示制度、放映回执审核制度、放映单位奖励制度、社会监督及举报制度等四项核心制度。任意一项书面制度缺失即构成疑点。
  audit_item: 送戏曲（电影）下乡等活动开展不符合相关规定
  suspicion: 未建立公益放映管理所必需的四项制度
  regulation: "[\n  {\n    \"法规名称\": \"农村电影公益放映场次补贴管理实施细则\",\n    \"法规文号\": \"财教〔2008〕282号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十二条、第十三条\",\n    \"内容概述\": \"各地应当建立放映公示制度，接受群众监督；建立放映回执审核制度，确保场次真实；建立放映单位考核奖励制度，提高放映质量；公布举报电话，接受社会监督。\"\
    \n  }\n]"
