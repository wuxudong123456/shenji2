name: audit/规章制度类/配备制度
type: model
description: 从规章制度类类文档（配备制度）中提取结构化元数据。涵盖字段如：不得空岗条款、专兼职规定、配备人数要求。文档范围包括：村级信息站人员配备制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 配备制度
  member_count: 1
  member_details:
  - 村级信息站人员配备制度
output:
  fields:
  - name: 不得空岗条款
    type: number
    description: 提取 不得空岗条款 的数值（含单位，如万元、吨等）
  - name: 专兼职规定
    type: string
    description: 提取 专兼职规定 的文本值
  - name: 配备人数要求
    type: number
    description: 提取 配备人数要求 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (站点名称、应配人数、实配人数、人员姓名、专兼职标识.实配人数 < 配备人数要求、专兼职规定、不得空岗条款.配备人数要求) || (站点名称、应配人数、实配人数、人员姓名、专兼职标识.实配人数 > 0 && (合同签订日期、合同期限、岗位职责.合同签订日期
    == '缺失' || 考勤月份、出勤天数、缺勤记录.出勤天数 < 0.8))
  description: 配备制度要求每站至少配备1名专职信息员，若统计表显示实配人数为0或配备人员无正式聘用合同，或考勤记录显示月均出勤率低于80%（相当于每月缺勤超过6天），即判定为未实质配备或人员形同虚设。
  audit_item: 数字乡村建设人才不足
  suspicion: 部分村级信息站未配备专职信息员
  regulation: "[\n  {\n    \"法规名称\": \"数字乡村建设相关实施方案\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"村级信息服务站建设要求\"\
    ,\n    \"内容概述\": \"各行政村数字乡村信息服务站应至少配备1名专职信息员，负责设备管理、信息采集和便民服务，不得由村干部简单兼职。\"\n  }\n]"
