name: audit/规章制度类/相关制度
type: model
description: 从规章制度类类文档（相关制度）中提取结构化元数据。涵盖字段如：三通工程建设完成时限、低效项目认定标准、内容要求、准备金计提比例要求、减免上限标准、创新服务内容要求、制度名称、参与方签字确认。文档范围包括：住房公积金贷款担保业务相关制度、信息公开相关制度、信息化系统工作机制相关制度、公共租赁住房相关制度、农民工返乡创业相关制度、参股企业投后管理相关制度、国家和地方住宅专项维修资金相关制度、对外投资决策相关制度、工作考核机制相关制度、工作评价相关制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 审批
- 工程
- 金额
- 项目
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 相关制度
  member_count: 1
  member_details:
  - 住房公积金贷款担保业务相关制度
  - 信息公开相关制度
  - 信息化系统工作机制相关制度
  - 公共租赁住房相关制度
  - 农民工返乡创业相关制度
  - 参股企业投后管理相关制度
  - 国家和地方住宅专项维修资金相关制度
  - 对外投资决策相关制度
  - 工作考核机制相关制度
  - 工作评价相关制度
  - 市级乡村学校薄弱环节改善相关制度
  - 新型职业农民培训相关制度
  - 相关制度
  - 省级乡村学校薄弱环节改善相关制度
  - 租金管理相关制度
  - 第三方评价管理相关制度
  - 被审计单位相关制度
  - 防止返贫监测相关制度
  - 项目清理退出机制相关制度
