violations:
- expression: (跨年度项目绩效趋势分析表.连续3年绩效评分 < 60 || 项目资金使用效益分析台账.资金使用率连续2年 < 0.5 ) && (低效项目清单及历史整改记录.是否启动退出程序 = '否' || 低效项目清单及历史整改记录.整改措施
    != '停止拨款并退出' ) && 项目清理退出机制相关制度.退出条件阈值 <= 触发值
  description: 项目连续3年绩效评分低于60分（或连续2年资金使用率低于50%），且未按照本单位项目清理退出制度启动退出程序，继续安排预算拨款的，判定为低效项目未及时清理退出。触发条件需符合单位制度中明确的退出标准阈值。
  audit_item: 部门、单位预算绩效目标未完成
  suspicion: 预算绩效低下的项目未及时清理退出
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第十一条\",\n    \"内容概述\": \"强化绩效评价结果应用，将绩效评价结果与预算安排挂钩，对低效无效资金一律削减或取消。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"绩效评价结果应作为改进管理、安排"
- expression: 部门内部绩效评价规章制度.文件存在性 = '否' OR (部门内部绩效评价规章制度.细化程度 = '直接套用通用模板' AND 绩效评价指标体系表.指标来源 = '全部通用') OR 第三方评价管理相关制度.存在性
    = '否'
  description: 部门未制定本部门绩效评价实施细则或操作规范，或者文件虽存在但完全照搬上级通用条款无任何本行业、本单位细化指标，或委托第三方评价但缺失选聘与质量管理制度，均视为规章制度不健全。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 未制定本部门绩效评价规章制度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第二部分（二）\",\n    \"内容概述\": \"各部门各单位要健全绩效指标和标准体系，制定本部门本单位绩效评价规章制度，完善评价操作流程，提高评价的针对性和有效性。\"\n  }\n]"
- expression: (股东名称、认缴出资额、实缴出资额、我方持股比例.我方持股比例 >= 20% && 股东名称、认缴出资额、实缴出资额、我方持股比例.是否派驻董事 = '否') || (股东名称、认缴出资额、实缴出资额、我方持股比例.是否取得财务报表
    = '否' && 股东名称、认缴出资额、实缴出资额、我方持股比例.投资年限 > 1)
  description: 持股比例达到20%以上但未向参股企业派驻董事，或者投资超过1年仍未能定期取得经审计财务报表的，认定为投后管控严重缺失。此类情况表明企业未对参股企业实施有效监管，存在信息黑洞。
  audit_item: 投融资管理方面存在的问题
  suspicion: 对参股企业投后管控缺失，只投不管
  regulation: "[\n  {\n    \"法规名称\": \"关于深化国有企业改革的指导意见\",\n    \"法规文号\": \"中发〔2015〕22号\",\n    \"效力级别\": \"制度文件\",\n    \"\
    条款号\": \"第六部分\",\n    \"内容概述\": \"强化对参股企业的监督管理，依法行使股东权利，防止国有资产流失，确保出资人到位的管理。\"\n  },\n  {\n    \"法规名称\": \"企业国有资产法\",\n\
    \    \"法规文号\": \"中华人民共和国主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第16条\",\n    \"内容概述\": \"国家出资企业对其出资企业应当按照出资比例享有资产收益、重大"
- expression: ( 相关制度.核心岗位职责分离说明=true ) OR ( 会议纪要.参会人员=0 ) OR ( 预案.演练日期=0 ) OR ( 理工单.审批人='未审批' )
  description: 1. 缺少信息化系统工作机制相关制度直接判定违规；2. 会议纪要或演练记录为空表明工作机制未实际运行；3. 变更工单中存在未审批即执行的情况代表变更管理缺失。任一条件满足即视为未建立有效工作机制。
  audit_item: 网络安全建设方面存在的问题
  suspicion: 未建立有效的信息化系统工作机制
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国网络安全法\",\n    \"法规文号\": \"主席令第53号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十一条\",\n    \"内容概述\": \"网络运营者应当制定内部安全管理制度和操作规程，确定网络安全负责人，落实网络安全保护责任。\"\n  },\n  {\n    \"法规名称\": \"信息安全技术 网络安全等级保护基本要求\"\
    ,\n    \"法规文号\": \"GB/T 22239-2019\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"安全管理制度要求（管理要求部分）\",\n    \"内容概述\": \"应建立日常管理"
- expression: SELECT 项目台账.项目名称, 项目台账.投资金额, 项目台账.投资决策日期 FROM 项目台账 LEFT JOIN 会议纪要 ON 项目台账.项目名称 = 会议纪要.项目名称 WHERE 项目台账.投资金额 >
    (投资金额分级审批标准.集体决策主体要求) AND 会议纪要.项目名称 IS NULL || 会议纪要.出席人员签字 NOT IN (投资金额分级审批标准.集体决策主体要求) || 会议纪要.出席人员签字 < (投资金额分级审批标准.集体决策主体要求)
    || 跟踪表.决策会议环节状态 != '已完成'
  description: 该表达式用于筛查金额超过制度规定门槛的重大投资项目，在会议纪要中无对应记录、签字人非规定决策主体、签字人数不足或流程跟踪表中决策环节未完成的情况。上述任一条件触发即判定为疑点，显示该项目可能未经合法集体决策程序。
  audit_item: 违规进行重大投资
  suspicion: 未经集体决策擅自进行对外投资
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进国有企业贯彻落实“三重一大”决策制度的意见\",\n    \"法规文号\": \"中办发〔2010〕17号\",\n    \"效力级别\": \"\
    制度文件\",\n    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"凡属重大决策、重要人事任免、重大项目安排和大额度资金运作事项必须由领导班子集体作出决定。重大项目安排事项包括重大投资项目。\"\n\
    \  }\n]"
- expression: (资产监管制度文件.风险控制措施条款 为空) || (工作考核机制相关制度.双向评价机制条款 为空) || (近3年考核评价记录.考核执行年度 为空) || (ABS(成员社资产清单.资产总额 - 实际盘点记录.盘点金额)/实际盘点记录.盘点金额
    > 0.05)
  description: 制度文件缺失监管或评价机制条款即判定违规；近3年无考核评价记录视为机制未运行；抽取资产清单与实际盘点差异率超过5%且无合理解释，视为资产监管缺位。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 未建立成员社与联合社双向评价考核机制
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"构建联合社主导的行业指导体系，建立成员社对联合社的工作评价机制，完善联合社对成员社的工作考核机制。\"\n  }\n]"
- expression: 维修资金减免审批台账.减免金额 > 0 AND (维修资金减免审批台账.批准文号 IS NULL OR 主管部门的维修资金减免审批记录.政策依据文号 NOT IN (SELECT 有效依据 FROM 制度合规减免清单)
    OR 维修资金减免审批台账.减免金额/相关制度.减免上限标准 > 0.3)
  description: 存在未经合法审批的减免记录，或减免理由不在制度规定的合规减免情形内，或单户减免比例超过应缴金额30%且无特殊政策支撑的，判定为违规减免。
  audit_item: 住宅专项维修资金归集不到位
  suspicion: 主管部门违规减免住宅专项维修资金
  regulation: "[\n  {\n    \"法规名称\": \"物业管理条例\",\n    \"法规文号\": \"国务院令第379号（2018年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"住宅物业业主应当按照国家有关规定交纳专项维修资金。\"\n  },\n  {\n    \"法规名称\": \"住宅专项维修资金管理办法\",\n    \"法规文号\": \"\
    建设部、财政部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"未按本办法规定交存首期住宅专项维修资金的，开发建设单位不得将房屋交付购买人。\"\
    \n"
- expression: 维修资金专户收支余额汇总表.分户余额 / 维修资金专户收支余额汇总表.首期交存总额 < 0.3 AND (欠交/未续交维修资金的欠费周期统计表.续交通知时间 IS NULL OR DATEDIFF(当前日期, 欠交/未续交维修资金的欠费周期统计表.续交通知时间)
    > 60 AND 欠交/未续交维修资金的欠费周期统计表.实际续交金额 < 欠交/未续交维修资金的欠费周期统计表.续交应缴金额)
  description: 业主分户账面余额不足首期交存额的30%时，须启动续交程序。若未在规定时点（如余额跌破阈值后60日内）发出续交通知，或发出通知后超过60日仍未补足续交金额的，判定为未按规定续交。
  audit_item: 住宅专项维修资金归集不到位
  suspicion: 未按规定启动续交住宅专项维修资金
  regulation: "[\n  {\n    \"法规名称\": \"住宅专项维修资金管理办法\",\n    \"法规文号\": \"建设部、财政部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"业主分户账面住宅专项维修资金余额不足首期交存额30%的，应当及时续交。成立业主大会的，续交方案由业主大会决定。未成立业主大会的，续交按照首期标准执行。\"\n  }\n\
    ]"
- expression: 租金缴存凭证.缴存银行账号 != 规定专户账号.规定专户账号 && 财务凭证.租金收入入账科目 != '保障房租金收入专户'
  description: 核对实际存放租金收入的银行账户是否与制度规定的财政专户一致；若租金存入单位基本户或通用非税账户，且未设立专户核算，即判定未实行专户管理，存在挪用风险。
  audit_item: 挪用或违规使用保障性安居工程专项资金
  suspicion: 保障房租金收入未实行专户管理
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"公共租赁住房租金收入应当按照政府非税收入管理的规定缴入同级国库，实行“收支两条线”管理。\"\n  },\n  {\n    \"法规名称\": \"政府非税收入管理办法\"\
    ,\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\": \"非税收入应当由执收单位通过非税收入收缴系统上缴财政，"
- expression: (业务台账.担保人名称 NOT IN (名录.机构名称)) || (执照.有效期 < 业务台账.担保日期) || (执照.许可范围 NOT LIKE '%住房公积金贷款担保%')
  description: 担保机构未在住房公积金管理中心备案合作名录中，或资质证书已过期，或许可范围未明确包含住房公积金贷款担保业务，任意条件满足即判定为无资质违规经营。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 无担保资质违规开展公积金贷款担保业务
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"设立融资担保公司，应当经监督管理部门批准。未经监督管理部门批准，任何单位和个人不得经营融资担保业务。\"\n  }\n]"
- expression: (担保公司.实收资本 < 资质要求.最低注册资本要求) || (流水.交易日期 - 验资报告.实缴日期 <= 60 && 流水.贷方金额 >= 验资报告.验资金额*0.9 && 流水.对方户名 IN (股东名册))
  description: 实收资本低于当地公积金中心规定的担保公司最低注册资本限额（如地方要求1亿元），或验资后60日内有大额资金转回股东账户且金额达到或超过验资金额的90%，即认定为资本不实或抽逃出资。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 担保公司注册资本不实或低于监管标准
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"设立融资担保公司应当符合最低限额的实缴注册资本要求，具体限额由省、自治区、直辖市根据本地实际确定，但不得低于人民币2000万元。\"\n  }\n]"
- expression: (明细表.在保余额 / 资产负债表.净资产) > 10 || (使用记录.已计提准备金 < 明细表.在保余额 * 0.01) || (代偿记录.代偿金额 / 明细表.在保余额) > 0.03
  description: 担保放大倍数（在保余额/净资产）超过10倍，或风险准备金计提低于在保余额的1%，或历史代偿率超过3%，任一指标突破则反映担保公司偿付能力不足，无法有效覆盖住房公积金贷款风险。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 担保公司担保放大倍数超限或准备金不足
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条、第十六条\",\n    \"内容概述\": \"融资担保公司的担保责任余额不得超过其净资产的10倍；融资担保公司应当按照国家有关规定提取未到期责任准备金、担保赔偿准备金，确保准备金充足。\"\n  }\n]"
- expression: (ABS(公示金额及数量.公示金额及数量 - 统计报表.统计期间接受捐赠总额) > 0) || (公示金额及数量.公示日期 - 分配台账.接收日期 > 30) || (公示金额及数量.公示内容摘要 IS NULL)
  description: 公示金额与统计报表总额不一致即不准确；接收日期与公示日期间隔超过30天为不及时；分配去向信息缺失为不完整。三者任一触发判定违规。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 捐赠信息公开不及时不准确不完整
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十二条\"\
    ,\n    \"内容概述\": \"慈善组织应当依法履行信息公开义务。信息公开应当真实、完整、及时。\"\n  }\n]"
