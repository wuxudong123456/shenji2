name: audit/规章制度类/规章制度
type: model
description: 从规章制度类类文档（规章制度）中提取结构化元数据。涵盖字段如：内容要点、发布日期、文件存在性、文号、新制定或修订的制度文件编码、是否引用行业标准、细化程度、责任追究章节。文档范围包括：相关规章制度、部门内部绩效评价规章制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 规章制度
  member_count: 1
  member_details:
  - 相关规章制度
  - 部门内部绩效评价规章制度
output:
  fields:
  - name: 内容要点
    type: string
    description: 提取 内容要点 的文本值
  - name: 发布日期
    type: date
    description: 提取 发布日期 的日期值，格式 YYYY-MM-DD
  - name: 文件存在性
    type: string
    description: 提取 文件存在性 的文本值
  - name: 文号
    type: string
    description: 提取 文号 的文本值
  - name: 新制定或修订的制度文件编码
    type: string
    description: 提取 新制定或修订的制度文件编码 的文本值
  - name: 是否引用行业标准
    type: boolean
    description: 提取 是否引用行业标准 的布尔值（是/否）
  - name: 细化程度
    type: string
    description: 提取 细化程度 的文本值
  - name: 责任追究章节
    type: string
    description: 提取 责任追究章节 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 绩效管理责任分工相关文件.存在性 = '否' OR (绩效管理责任分工相关文件.是否明确考核与问责条款 = '否') OR (绩效评价问题整改台账.问题项目数 > 0 AND 绩效评价问题整改台账.问责记录 = '无')
  description: 若未制定责任分工文件，或虽有分工但未提及绩效考核与问责措施，或者存在绩效评价不合格项目却无任何问责和整改记录，说明责任约束制度缺失。三者满足任一即判违规。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 未建立绩效管理责任约束制度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第五部分（十四）\",\n    \"内容概述\": \"强化绩效管理责任约束，明确各部门各单位全面实施预算绩效管理的主体责任，建立绩效问责机制，对绩效管理不力、导致财政资金损失浪费的，依法依规追究责任人责任。\"\
    \n  }\n]"
- expression: 部门内部绩效评价规章制度.文件存在性 = '否' OR (部门内部绩效评价规章制度.细化程度 = '直接套用通用模板' AND 绩效评价指标体系表.指标来源 = '全部通用') OR 第三方评价管理相关制度.存在性
    = '否'
  description: 部门未制定本部门绩效评价实施细则或操作规范，或者文件虽存在但完全照搬上级通用条款无任何本行业、本单位细化指标，或委托第三方评价但缺失选聘与质量管理制度，均视为规章制度不健全。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 未制定本部门绩效评价规章制度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第二部分（二）\",\n    \"内容概述\": \"各部门各单位要健全绩效指标和标准体系，制定本部门本单位绩效评价规章制度，完善评价操作流程，提高评价的针对性和有效性。\"\n  }\n]"
- expression: 以往审计报告.问题类型 IN ('固定资产账实不符','存货盘亏','白条入账','内控缺陷') AND 被审计单位整改方案.整改措施 NOT LIKE '%制度%' AND 被审计单位整改方案.整改措施 NOT LIKE
    '%流程%' AND (被审计单位整改方案.整改措施 LIKE '%补录%' OR 被审计单位整改方案.整改措施 LIKE '%调整%' OR 被审计单位整改方案.整改措施 LIKE '%一次性处理%') AND (相关规章制度.新制定或修订的制度文件编码
    IS NULL OR 相关规章制度.发布日期 > 整改验收报告或证明材料.实际完成日期 + 180)
  description: 对于根源在制度或流程的问题，若整改措施仅通过补录数据、账务调整等一次性操作完成，且在整改完成后6个月内未发布相关制度修订文件，即视为治标不治本。关键是通过关键词匹配排除制度性整改措施。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 整改仅治标不治本，未建立长效制度机制
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"被审计单位应当举一反三，健全长效机制。\"\n  }\n]"
