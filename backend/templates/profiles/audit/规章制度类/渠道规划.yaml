name: audit/规章制度类/渠道规划
type: model
description: 从规章制度类类文档（渠道规划）中提取结构化元数据。涵盖字段如：专用运输车辆配备数量、规划运输半径。文档范围包括：利用渠道规划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 车辆
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 渠道规划
  member_count: 1
  member_details:
  - 利用渠道规划
output:
  fields:
  - name: 专用运输车辆配备数量
    type: number
    description: 提取 专用运输车辆配备数量 的数值（含单位，如万元、吨等）
  - name: 规划运输半径
    type: string
    description: 提取 规划运输半径 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (月度外运量 / 月度产生量 < 0.7) || (月末库存量 / 月度产生量 > 0.3) || (运输半径 > 50 && 未配置专用车辆)
  description: 当月外运比例低于70%或月末积压率超过30%表明渠道严重不畅；运输半径超过50公里且缺乏专用设备，则规划脱离实际，易导致随意倾倒风险。
  audit_item: 项目实施不到位
  suspicion: 粪肥运输能力不足导致积压滞留
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加快推进畜禽养殖废弃物资源化利用的意见\",\n    \"法规文号\": \"国办发〔2017〕48号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、（八）\",\n    \"内容概述\": \"支持建设沼液田间输送管网、粪肥专用输送管道等设施，推广机械化施用。完善运输体系，降低运输成本。\"\n  },\n  {\n    \"法规名称\"\
    : \"畜禽规模养殖污染防治条例\",\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"畜禽粪便还田利"
