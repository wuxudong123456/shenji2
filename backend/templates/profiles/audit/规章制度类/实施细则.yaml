violations:
- expression: 核查清单.申报安置职工人数 > 缴纳记录.累计缴纳月数 || (流水.奖补资金入账金额 > 0 && 流水.后续支付摘要)
  description: 若申报安置的下岗职工人数大于同期企业实际社保参保人数，即可认定为虚报冒领；奖补资金按规定应用于职工分流安置，若在发放后半年内大量资金被转至非安置支出（如偿还借款、转入关联方），则判定违规使用。
  audit_item: 财政资金申报、使用等方面存在的问题
  suspicion: 虚报冒领结构调整专项奖补资金
  regulation: "[\n  {\n    \"法规名称\": \"工业企业结构调整专项奖补资金管理办法\",\n    \"法规文号\": \"财建〔2016〕253号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十四条\",\n    \"内容概述\": \"对弄虚作假、骗取、套取奖补资金的，一经发现，追回资金，并依法追究责任。奖补资金主要用于职工分流安置，不得用于其他支出。\"\n  }\n]"
- expression: (渔船登记注销明细表.已封存渔船数量 / 渔船登记注销明细表.渔船总登记数 * 100 < 100) && (DATEDIFF(CURRENT_DATE, 捕捞渔船封存管理实施细则.渔船封存截止日期, 'day')
    > 0)
