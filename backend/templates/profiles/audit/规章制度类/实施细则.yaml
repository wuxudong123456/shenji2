name: audit/规章制度类/实施细则
type: model
description: 从规章制度类类文档（实施细则）中提取结构化元数据。涵盖字段如：一事一议筹资筹劳规定、三公经费相关规定、上级与下级配套资金比例要求、下放审批事项范围、事后补审要求、享受优惠的适用对象、人均住房面积上限、代缴对象范围。文档范围包括：三重一大决策制度实施细则、上级财政转移支付实施细则、产能置换政策实施细则、企业会计档案管理制度实施细则、传统村落保护地方实施细则、住房保障对象动态管理实施细则、住房保障政策实施细则、住房公积金管理条例地方实施细则、保障待遇相关政策文件实施细则、养老保险代缴政策实施细则等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 审批
- 金额
- 项目
- 元数据提取
