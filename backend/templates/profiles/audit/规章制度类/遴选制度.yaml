name: audit/规章制度类/遴选制度
type: model
description: 从规章制度类类文档（遴选制度）中提取结构化元数据。涵盖字段如：评价指标、量化标准。文档范围包括：保险机构遴选制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 遴选制度
  member_count: 1
  member_details:
  - 保险机构遴选制度
output:
  fields:
  - name: 评价指标
    type: string
    description: 提取 评价指标 的文本值
  - name: 量化标准
    type: string
    description: 提取 量化标准 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 保险机构遴选制度.量化标准 IS NULL || CORREL(保险机构遴选制度.考核评分结果, 农业保险理赔案件登记.农户满意度) < 0.3 || (招标文件.招标方式 = '直接指定' AND INSTR(招标文件.招标方式说明章节,'审批')
    = 0)
  description: 遴选制度缺乏客观量化指标，或考核结果与理赔时效等真实服务数据关联性极低（相关系数低于0.3），或未经法定程序直接指定承保机构，即构成机制不健全。
  audit_item: 农业保险保费补贴政策落实不到位
  suspicion: 保险机构遴选考核机制不健全
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条\"\
    ,\n    \"内容概述\": \"农业保险经营机构的选择，应当依法采用公平竞争的方式确定。\"\n  },\n  {\n    \"法规名称\": \"中央财政农业保险保险费补贴管理办法\",\n    \"法规文号\": \"财金〔2021〕94号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十九条\",\n    \"内容概述\": \"地方财政部门应当建立健全农业保险经营机构评选考核机制，细化评价标准，确保公平公正，并将"
