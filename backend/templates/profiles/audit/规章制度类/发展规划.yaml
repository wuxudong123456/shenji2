name: audit/规章制度类/发展规划
type: model
description: 从规章制度类类文档（发展规划）中提取结构化元数据。涵盖字段如：产业链各环节目标、人口分布、保留教学点数量、印发日期、核心任务分解、用地规划、经济发展目标、规划发布状态。文档范围包括：三产融合发展规划、地方教育发展规划、政府发展规划、科技创新发展规划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 发展规划
  member_count: 1
  member_details:
  - 三产融合发展规划
  - 地方教育发展规划
  - 政府发展规划
  - 科技创新发展规划
output:
  fields:
  - name: 产业链各环节目标
    type: string
    description: 提取 产业链各环节目标 的文本值
  - name: 人口分布
    type: string
    description: 提取 人口分布 的文本值
  - name: 保留教学点数量
    type: number
    description: 提取 保留教学点数量 的数值（含单位，如万元、吨等）
  - name: 印发日期
    type: date
    description: 提取 印发日期 的日期值，格式 YYYY-MM-DD
  - name: 核心任务分解
    type: string
    description: 提取 核心任务分解 的文本值
  - name: 用地规划
    type: string
    description: 提取 用地规划 的文本值
  - name: 经济发展目标
    type: string
    description: 提取 经济发展目标 的文本值
  - name: 规划发布状态
    type: boolean
    description: 提取 规划发布状态 的布尔值（是/否）
  - name: 规划服务半径
    type: string
    description: 提取 规划服务半径 的文本值
  - name: 预期融合指标
    type: string
    description: 提取 预期融合指标 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (要求制定专项规划或方案的条款.要求制定专项规划或方案的条款) || (文本.是否单设科技创新章节 && 要求制定专项规划或方案的条款.要求制定专项规划或方案的条款) || (文本.关键指标完备性 > 0.3)
  description: 若经检查无正式发布的科技创新规划，或五年规划中未按上级要求设置专门章节，或已发布的规划中核心要素（如投入目标、重大工程、成果转化指标等）缺失超过30%，即视为未按规定制定规划。缺失率通过关键词提取对比标准模板计算。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 未制定科技创新和发展规划
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国科学技术进步法\",\n    \"法规文号\": \"主席令第八十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五条\",\n    \"内容概述\": \"县级以上地方各级人民政府应当将科学技术进步工作纳入国民经济和社会发展规划，制定科学技术发展规划，保障科学技术进步与经济建设和社会发展相协调。\"\n  },\n  {\n    \"\
    法规名称\": \"国务院关于印发国家重大科技基础设施建设中长期规划（2012—2030年）的通知\",\n    \"法规文号\": \"国发〔2013〕8号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\""
- expression: (情况表.调整前后学校数量 > 0.3 && 调研报告.决策依据（人口数据、地理条件）) || (情况表.调整前后学校数量 > 标准文件.学校服务半径标准) || (反馈记录.反对撤并意见占比 > 0.5 && 调研报告.决策依据（人口数据、地理条件）)
  description: 撤并比例超过30%且缺乏人口数据支撑，或学校服务半径超标，或多数群众反对但未听证，均属布局不合理，疑点触发
  audit_item: 小规模学校、寄宿制学校建设管理不规范
  suspicion: 农村学校布局规划与人口分布不匹配
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于规范农村义务教育学校布局调整的意见\",\n    \"法规文号\": \"国办发〔2012〕48号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、严格规范学校撤并程序\",\n    \"内容概述\": \"确定学校撤并须经过科学论证和严格程序，充分听取群众意见，保障学生就近入学\"\n  }\n]"
- expression: (分析表.各环节交易占比 < 0.3) || (合同协议.采购量 < 0.5) || (结构表.农业相关收入 < 0.3) || (评价文件.实际达成指标 < 0)
  description: 一二三产企业间交易额占总营收比例低于30%表明产业链关联度弱；深加工企业本地原料采购率低于50%说明种养与加工脱节；企业农业相关收入（种养、加工、休闲农业）占比低于30%说明企业偏离农业主业；绩效评价中三产融合指标未达标直接判定。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 一二三产业关联度低未形成融合发展
  regulation: "[\n  {\n    \"法规名称\": \"《关于推进农村一二三产业融合发展的指导意见》\",\n    \"法规文号\": \"国办发〔2015〕93号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、发展多类型农村产业融合方式\",\n    \"内容概述\": \"鼓励通过延伸产业链、打造供应链、提升价值链等方式，推动种养业与加工流通、休闲旅游等深度融合。\"\n  }\n]"
- expression: 规划编制要素（负荷预测、技术标准、投资估算、公众参与记录）、审批文件.规划编制要素（负荷预测、技术标准、投资估算、公众参与记录）未包含负荷预测或技术标准或公众参与记录 || (项目名称、实施地点、建设规模、实际完成情况、项目实际开工/完工状态.实施地点
    != 规划编制要素（负荷预测、技术标准、投资估算、公众参与记录）、审批文件.审批文件 && 无规划变更批复) || (规划编制年份 + 规划周期 < 当前年份 && 仍执行旧规划)
  description: 规划编制须包含必要要素并履行审批程序；实际实施范围与规划不符且无变更手续视为违规；执行已过期的规划编制。
  audit_item: 电网改造和供电服务不合规
  suspicion: 电网改造规划编制不符合要求
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2016〕2119号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第八条\",\n    \"内容概述\": \"农村电网改造升级规划应依据地方经济社会发展规划编制，明确发展目标、重点任务、技术原则、投资规模等，并履行审批与公开程序。\"\n  }\n]"
