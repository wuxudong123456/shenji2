name: audit/规章制度类/薪酬手册
type: model
description: 从规章制度类类文档（薪酬手册）中提取结构化元数据。涵盖字段如：各类补贴标准及项目清单、批准薪酬总额、绩效工资上限、薪酬结构项目。文档范围包括：国资监管部门批准的薪酬手册等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 薪酬
- 补贴
- 项目
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 薪酬手册
  member_count: 1
  member_details:
  - 国资监管部门批准的薪酬手册
output:
  fields:
  - name: 各类补贴标准及项目清单
    type: string
    description: 提取 各类补贴标准及项目清单 的文本值
  - name: 批准薪酬总额
    type: number
    description: 提取 批准薪酬总额 的数值（含单位，如万元、吨等）
  - name: 绩效工资上限
    type: string
    description: 提取 绩效工资上限 的文本值
  - name: 薪酬结构项目
    type: string
    description: 提取 薪酬结构项目 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (企业领导人员薪酬发放台账.实际年薪 > 国资监管部门批准的薪酬手册.批准薪酬总额) || (补贴发放审批单.补贴项目名称 NOT IN (国资监管部门批准的薪酬手册.各类补贴标准及项目清单)) || (补贴发放审批单.补贴金额
    > 国资监管部门批准的薪酬手册.各类补贴标准及项目清单) || (个人所得税申报与薪酬发放差异表.差异额 > 0)
  description: 将实际发放的薪酬及补贴与国资监管部门批准的薪酬手册逐项比对。任何超出批准总额的发放、不在批准范围内的补贴项目、金额超出单项标准的部分均触发违规。个税申报收入与实际发放存在差异且无正当理由（如年终奖计税方式差异等），视为违规发放的线索。
  audit_item: 其他违反中央八项规定及其实施细则精神问题
  suspicion: 超核定薪酬手册标准发放领导人员薪酬或补贴
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"无（中共中央纪委、中共中央组织部、监察部、国务院国资委等联合发布）\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第四条、第六条\",\n    \"内容概述\": \"国有企业领导人员应当切实维护国家和出资人利益，不得违反规定获取个人利益；不得违反规定发放薪酬、津贴、补贴等。\"\n  }\n\
    ]"
