name: audit/规章制度类/审批制度
type: model
description: 从规章制度类类文档（审批制度）中提取结构化元数据。涵盖字段如：发放范围、各岗位补贴项目、支出审批流程、收支两条线管理要求、标准、楼盘合作准入条件、资金使用范围、资金来源要求。文档范围包括：内部住房公积金贷款审批制度、单位内部经费支出审批制度、补贴发放审批制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 审批
- 补贴
- 项目
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 审批制度
  member_count: 1
  member_details:
  - 内部住房公积金贷款审批制度
  - 单位内部经费支出审批制度
  - 补贴发放审批制度
output:
  fields:
  - name: 发放范围
    type: string
    description: 提取 发放范围 的文本值
  - name: 各岗位补贴项目
    type: string
    description: 提取 各岗位补贴项目 的文本值
  - name: 支出审批流程
    type: number
    description: 提取 支出审批流程 的数值（含单位，如万元、吨等）
  - name: 收支两条线管理要求
    type: string
    description: 提取 收支两条线管理要求 的文本值
  - name: 标准
    type: string
    description: 提取 标准 的文本值
  - name: 楼盘合作准入条件
    type: string
    description: 提取 楼盘合作准入条件 的文本值
  - name: 资金使用范围
    type: string
    description: 提取 资金使用范围 的文本值
  - name: 资金来源要求
    type: string
    description: 提取 资金来源要求 的文本值
  - name: 项目审查要点
    type: string
    description: 提取 项目审查要点 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 非税收入台账.已缴金额 < 非税收入台账.应缴金额 && 银行对账单.支出金额 ≈ (非税收入台账.应缴金额 - 非税收入台账.已缴金额) && 银行对账单.支出用途 IN ('工程款','采购款','办公费','装修费','工资奖金')
  description: 当非税收入未足额缴库且差额部分被用于单位各项经费支出，表明资金被挤占挪用。应进一步核实支出审批单是否注明资金来源于非税收入。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 挤占挪用应缴非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十六条\",\n    \"内容概述\": \"非税收入必须全额上缴国库或财政专户，任何单位和个人不得截留、坐支、挪用、私分。\"\n  }\n]"
- expression: 记账凭证.借方科目 IN ('管理费用','商品和服务支出','业务活动费用') && 记账凭证.贷方科目 IN ('应缴财政款','其他应付款-非税收入','非税收入') && 非税收入台账.已缴金额 < 非税收入台账.应缴金额
  description: 通过检查会计分录，若发现将非税收入类科目直接与费用类科目对冲，且未足额缴库，即可判定坐支或冲抵支出。关注“其他收入”直接冲减“管理费用”的异常账务处理。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 非税收入直接冲抵经费支出
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十六条\",\n    \"内容概述\": \"非税收入实行收支两条线管理，执收单位不得将非税收入直接用于冲抵经费支出、转为经营服务性收入等。\"\n  },\n  {\n    \"法规名称\": \"行政单位财务规则\"\
    ,\n    \"法规文号\": \"财政部令第71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"行政单位的各项收入应当全部纳入单位预算，统一管理，不"
- expression: 审批文件.预售许可证 IS NULL OR 合同台账.贷款发放日期 < 审批文件.预售许可证 OR 申请表.房屋性质 NOT IN ('普通住宅')
  description: 满足任一条件即判定违规：①项目未取得《商品房预售许可证》；②贷款发放日期早于预售许可证取得日期，存在无证先售；③房屋性质为商业公寓、小产权房等非普通住宅，超出公积金贷款支持范围。均为严重违规行为。
  audit_item: 违规发放住房公积金贷款
  suspicion: 违规向不符合条件项目发放住房公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"关于规范住房公积金个人住房贷款政策有关问题的通知\",\n    \"法规文号\": \"建金[2010]179号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"住房公积金个人住房贷款只能用于缴存职工购买、建造、翻建、大修普通自住住房，严禁用于购买非普通自住住房、商业用房等。\"\n  }\n]"
