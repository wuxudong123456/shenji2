name: audit/规章制度类/要求
type: model
description: 从规章制度类类文档（要求）中提取结构化元数据。涵盖字段如：发放时限、名单报送时限、审批流程、审核公示时限、必填章节清单、注册所需资料明细、特殊事项解释阈值规则、规定拨付时限。文档范围包括：公共资源交易平台登记要求、决算报表填报说明规范要求、市级平台登记要求、补贴资金发放时间节点要求等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 审批
- 明细
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 要求
  member_count: 1
  member_details:
  - 公共资源交易平台登记要求
  - 决算报表填报说明规范要求
  - 市级平台登记要求
  - 补贴资金发放时间节点要求
output:
  fields:
  - name: 发放时限
    type: string
    description: 提取 发放时限 的文本值
  - name: 名单报送时限
    type: string
    description: 提取 名单报送时限 的文本值
  - name: 审批流程
    type: string
    description: 提取 审批流程 的文本值
  - name: 审核公示时限
    type: string
    description: 提取 审核公示时限 的文本值
  - name: 必填章节清单
    type: string
    description: 提取 必填章节清单 的文本值
  - name: 注册所需资料明细
    type: string
    description: 提取 注册所需资料明细 的文本值
  - name: 特殊事项解释阈值规则
    type: string
    description: 提取 特殊事项解释阈值规则 的文本值
  - name: 规定拨付时限
    type: string
    description: 提取 规定拨付时限 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 统一社会信用代码在多平台登记次数 > 1 && (不同平台要求提交资料相似度 > 80%) && (各平台登记时间间隔 < 3个月)
  description: 筛查同一企业在多个公共资源交易平台或不同层级平台被要求重复注册，且各平台要求提交的资料高度重复（营业执照、资质证书等），登记时间集中，表明存在重复登记负担，违规增设市场准入程序。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 要求投标人重复办理登记或重复提交相同资质材料
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十九条第二款\",\n    \"内容概述\": \"招标人不得要求投标人提供与招标项目无关的证明材料。\"\n  },\n  {\n    \"法规名称\": \"公平竞争审查制度实施细则\",\n    \"法规文号\"\
    : \"国市监反垄规〔2021〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"不得要求经营者在本地设立分支机构或者重复办理登记备案。\"\n\
    \  }\n]"
