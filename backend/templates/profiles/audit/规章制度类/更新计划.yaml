name: audit/规章制度类/更新计划
type: model
description: 从规章制度类类文档（更新计划）中提取结构化元数据。涵盖字段如：计划更新册数、计划更新周期。文档范围包括：图书更新计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 更新计划
  member_count: 1
  member_details:
  - 图书更新计划
output:
  fields:
  - name: 计划更新册数
    type: string
    description: 提取 计划更新册数 的文本值
  - name: 计划更新周期
    type: string
    description: 提取 计划更新周期 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (DATEDIFF(CURRENT_DATE, 图书更新台账.MAX(入库日期)) > 365) || (图书配备清单.COUNT(出版年份 >= (YEAR(CURRENT_DATE)-3)) / 图书配备清单.COUNT(*)
    < 0.10) || (SUM(专项资金收支明细表.图书采购支出金额) > 0 AND COUNT(图书更新台账.新增书籍ISBN/书名) == 0)
  description: 判定更新不及时：最近一次入库日期距今超过1年（更新周期默认1年）；近3年出版图书占总藏书量比例低于10%（更新比例标准）；有专项资金支出但无新增书籍记录，或专项资金未支出但台账显示更新，存在虚假更新。任意一条满足即为疑点。
  audit_item: 农家书屋建设运营管护不合规
  suspicion: 农家书屋图书更新不及时
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\"\
    ,\n    \"内容概述\": \"农家书屋应当建立图书更新机制，每年更新率不低于10%，确保出版物时效性。\"\n  }\n]"
