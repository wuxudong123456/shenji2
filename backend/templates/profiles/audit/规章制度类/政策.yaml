- expression: (明细表.发放项目 IN ('加班费','绩效奖','津贴','补贴','奖金')) && (明细表.资金来源 = '彩票发行费' || 明细表.资金来源 = '彩票公益金') && (明细表.发放金额 > 政策.规定标准
    || 政策.审批意见 IS NULL)
