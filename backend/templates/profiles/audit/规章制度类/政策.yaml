    ,\n    \"条款号\": \"二、(四)\",\n    \"内容概述\": \"优先保证粮食等主要农产品生产所需机具和深松整地、免耕播种、高效植保、节水灌溉、高效施肥、秸秆还田离田、残膜回收、畜禽粪污资源化利用、病死畜禽无害化处理等支持农业绿色发展机具的补贴需要。\"\
