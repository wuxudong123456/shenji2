- expression: 机具种类范围.补贴机具种类范围 LIKE '%秸秆%' AND ( SELECT COUNT(*) FROM 机具名称 WHERE 机具名称 LIKE '%秸秆%' OR 机具名称 LIKE '%打捆%' OR 机具名称
