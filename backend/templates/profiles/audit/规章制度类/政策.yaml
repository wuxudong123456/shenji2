name: audit/规章制度类/政策
type: model
description: 从规章制度类类文档（政策）中提取结构化元数据。涵盖字段如：个别计提规则、使用寿命确定依据、供电可靠率最低标准、保证金上限标准或指导标准、变更生效日期、同期同类非关联客户平均售价、坏账准备计提方法、处理标准。文档范围包括：企业会计政策、企业摊销政策、农机购置补贴政策、发放政策、国家或省级政策、地方奖补政策、坏账政策、江心岛渔民搬迁安置专项政策、湖心岛渔民搬迁安置专项政策、电力保障专项政策等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 补贴
- 金额
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 政策
  member_count: 1
  member_details:
  - 企业会计政策
  - 企业摊销政策
  - 农机购置补贴政策
  - 发放政策
  - 国家或省级政策
  - 地方奖补政策
  - 坏账政策
  - 江心岛渔民搬迁安置专项政策
  - 湖心岛渔民搬迁安置专项政策
  - 电力保障专项政策
  - 畜禽规模养殖用地相关政策
  - 销售价格政策
output:
  fields:
  - name: 个别计提规则
    type: string
    description: 提取 个别计提规则 的文本值
  - name: 使用寿命确定依据
    type: string
    description: 提取 使用寿命确定依据 的文本值
  - name: 供电可靠率最低标准
    type: string
    description: 提取 供电可靠率最低标准 的文本值
  - name: 保证金上限标准或指导标准
    type: string
    description: 提取 保证金上限标准或指导标准 的文本值
  - name: 变更生效日期
    type: date
    description: 提取 变更生效日期 的日期值，格式 YYYY-MM-DD
  - name: 同期同类非关联客户平均售价
    type: string
    description: 提取 同期同类非关联客户平均售价 的文本值
  - name: 坏账准备计提方法
    type: string
    description: 提取 坏账准备计提方法 的文本值
  - name: 处理标准
    type: string
    description: 提取 处理标准 的文本值
  - name: 存货发出计价方法
    type: string
    description: 提取 存货发出计价方法 的文本值
  - name: 安置模式选项
    type: string
    description: 提取 安置模式选项 的文本值
  - name: 折扣率上限
    type: string
    description: 提取 折扣率上限 的文本值
  - name: 折旧方法
    type: string
    description: 提取 折旧方法 的文本值
  - name: 收入确认具体标准
    type: number
    description: 提取 收入确认具体标准 的数值（含单位，如万元、吨等）
  - name: 政策规定的农业设施用地目录
    type: string
    description: 提取 政策规定的农业设施用地目录 的文本值
  - name: 时点
    type: string
    description: 提取 时点 的文本值
  - name: 机具品目
    type: string
    description: 提取 机具品目 的文本值
  - name: 残值率
    type: string
    description: 提取 残值率 的文本值
  - name: 比例
    type: number
    description: 提取 比例 的数值（含单位，如万元、吨等）
  - name: 比例或上限金额
    type: number
    description: 提取 比例或上限金额 的数值（含单位，如万元、吨等）
  - name: 渔民意愿征询规定
    type: string
    description: 提取 渔民意愿征询规定 的文本值
  - name: 电压合格率要求
    type: string
    description: 提取 电压合格率要求 的文本值
  - name: 电网覆盖率目标
    type: string
    description: 提取 电网覆盖率目标 的文本值
  - name: 研发支出资本化条件
    type: number
    description: 提取 研发支出资本化条件 的数值（含单位，如万元、吨等）
  - name: 补贴对象
    type: string
    description: 提取 补贴对象 的文本值
  - name: 补贴机具种类范围
    type: string
    description: 提取 补贴机具种类范围 的文本值
  - name: 补贴标准
    type: string
    description: 提取 补贴标准 的文本值
  - name: 规定标准
    type: string
    description: 提取 规定标准 的文本值
  - name: 选址原则
    type: string
    description: 提取 选址原则 的文本值
  - name: 配套要求
    type: string
    description: 提取 配套要求 的文本值
  - name: 预期信用损失率
    type: string
    description: 提取 预期信用损失率 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 地方奖补政策.比例或上限金额 > 上级规定文件.同类项目补贴比例上限 OR (地方奖补政策.补贴标准 / 地方奖补政策.比例或上限金额) > 上级规定文件.同类项目补贴比例上限
  description: 若地方自行制定的补贴标准中，补贴金额占项目总投资的比例或绝对额度超出了国家或省级文件明确的补贴上限，即为违规。例如，上级规定最高不得超过30%，地方实际补贴达到50%。
  audit_item: 上位与下位政策法规检查
  suspicion: 地方财政补贴比例超出上位政策规定的上限
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于改革和完善中央对地方转移支付制度的意见\",\n    \"法规文号\": \"国发〔2014〕71号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"严格控制专项转移支付的地方财政配套资金负担，不得超出地方实际承受能力擅自提高配套比例。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\"\
    ,\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十六条\",\n    \"内容概述\": \"各级政府支出的统筹安排应当符合上级政府的规定"
- expression: ABS(科目余额表.累计折旧本期发生额 - 按上期折旧方法模拟计提的累计折旧本期发生额) / 利润总额 > 0.05 && (董事会决议 IS NULL || 董事会决议.批准日期 > 企业会计政策文件.变更生效日期)
    && 财务报表附注.会计政策变更说明 NOT LIKE '%折旧方法变更%'
  description: 当企业本期折旧方法与上期不一致，且新旧方法下折旧费用差异对利润总额的影响超过5%，同时未取得董事会有效审批或审批滞后，且财务报告附注未披露变更内容及影响金额时，触发违规疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意改变固定资产折旧方法调节利润
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业进行会计核算不得随意改变资产、负债、所有者权益的确认标准或者计量方法，虚列、多列、不列或者少列资产、负债、所有者权益。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\"\
    ,\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第十五条\",\n    \"内"
- expression: 企业会计政策文件.收入确认标准(本期) != 企业会计政策文件.收入确认标准(上期) && 营业收入明细表.本期收入增长率 > 行业平均增长率*1.5 && (董事会决议 IS NULL || 董事会决议.批准日期
    > 收入确认标准变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE '%收入确认标准变更%'
  description: 当本期收入确认标准较上期发生改变（如由客户签收改为发货确认），且收入增长率远超行业水平，同时缺少董事会审批或审批滞后，未在附注中披露收入确认标准变更详情时，视为违规。
  audit_item: 随意变更会计处理方法
  suspicion: 随意改变收入确认标准虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业不得随意改变收入确认时间，虚列或者隐瞒收入，编制虚假利润。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"\
    财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条、第六条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。会"
- expression: 企业会计政策文件.存货计价方法(本期) != 企业会计政策文件.存货计价方法(上期) && ABS(主营业务成本明细表.本期销售成本 - 按上期方法计算的销售成本) / 利润总额 > 0.05 && (董事会决议 IS
    NULL || 董事会决议.批准日期 > 变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE '%存货计价方法变更%'
  description: 当企业本期存货计价方法改变，且对销售成本的影响超过利润总额5%，同时无董事会审批或审批滞后，且未在附注中披露时，触发疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意变更存货计价方法调节销售成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业不得随意改变费用、成本的确认标准或者计量方法，导致多列、少列成本。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\"\
    : \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条、第二十二条\",\n    \"内容概述\": \"企业应当采用先进先出法、加权平均法或者个别计价法确定发出存货的实"
- expression: 坏账准备计提明细表.本期平均计提比例(按账龄加权) != 上期平均计提比例 && (董事会决议 IS NULL || 董事会决议.批准日期 > 变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE
    '%坏账准备计提比例变更%' && ABS(本期计提金额 - 按上期比例测算的计提金额) / 利润总额 > 0.05
  description: 若坏账准备计提比例发生变动，且影响利润总额超过5%，同时无董事会审批或审批滞后，未在附注中披露时，判定为违规。
  audit_item: 随意变更会计处理方法
  suspicion: 随意变更坏账准备计提比例且未披露
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业不得随意改变费用的确认标准或者计量方法，虚列或者少列费用。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\"\
    : \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条、第四十七条\",\n    \"内容概述\": \"企业应当以预期信用损失为基础计提坏账准备，会计政策变更"
- expression: 企业会计政策文件.研发支出资本化条件(本期) != 上期资本化条件 && (研发支出辅助账.本期资本化金额增长率 > 同期研发投入增长率*2) && (董事会决议 IS NULL || 董事会决议.批准日期 > 政策变更生效日期)
    && 财务报表附注.会计政策变更说明 NOT LIKE '%研发支出资本化政策变更%'
  description: 若本期研发支出资本化条件放宽，导致资本化金额异常增长，且缺少董事会审批或审批滞后，未在附注中披露，则触发疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意调整研发费用资本化政策虚增资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"不得随意改变费用的确认标准或者计量方法，导致虚增资产、虚减费用。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第6号——无形资产\",\n    \"法规文号\": \"\
    财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条、第八条、第九条\",\n    \"内容概述\": \"企业内部研发项目研究阶段支出应当费用化，开发阶段支出满足条件方可资本化"
- expression: (信用报告.破产公告 = '破产' && 计提表.实际计提比例 < 0.95) || (计提表.实际计提比例 < 政策.预期信用损失率)
  description: 对已破产客户未100%计提坏账，或组合计提比例低于企业自身制定的预期信用损失率，均属计提不足。
  audit_item: 未按规定核算资产
  suspicion: 坏账准备计提严重不足
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\": \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四十六条至第四十八条\",\n    \"内容概述\": \"企业应采用预期信用损失模型对金融资产计提减值准备，合理反映信用风险。\"\n  }\n]"
- expression: (资产类别、原值、开始摊销日期、年限、月摊销额.年限 < 资产清单.法律保护期限 且 无合理技术更新依据) || (资产类别、原值、开始摊销日期、年限、月摊销额.开始摊销日期 < 达到预定用途日期) || (支出台账.资本化金额对应的无形资产未在摊销表中出现)
  description: 摊销年限短于法律年限且无依据，缩短年限多摊费用；开始摊销时间早于可使用状态提前摊销；已形成无形资产却未摊销，均属错误。
  audit_item: 未按规定确认成本费用
  suspicion: 无形资产摊销不正确
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第6号——无形资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条、第十八条\",\n    \"内容概述\": \"使用寿命有限的无形资产，其应摊销金额应在使用寿命内系统合理摊销；企业应至少每年终了对使用寿命进行复核。\"\n  }\n]"
- expression: ((同期同类非关联客户平均售价 - 职工持股企业交易明细表.单价) / 同期同类非关联客户平均售价 > 制度允许最大折扣率) AND (销售折扣与让利审批记录表.审批人权限 < 制度要求层级 OR 销售折扣与让利审批记录表.审批人
    IS NULL)
  description: 关联交易价格低于同期同类非关联均价，且让利幅度超出制度规定上限，同时缺少相应层级审批或无审批，构成违规让利。
  audit_item: 销售业务管理方面存在的问题
  suspicion: 违规向职工持股企业让利
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有企业职工持股、投资的意见\",\n    \"法规文号\": \"国资发改革〔2008〕139号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第（十二）条\",\n    \"内容概述\": \"国有企业应当建立健全关联交易管理制度，对与职工持股、投资企业的关联交易，按照商业原则和国际惯例进行，不得给予职工持股、投资企业不当利益。\"\n  }\n\
    ]"
- expression: (制度文件.变更条件 == '' || 审批记录.变更理由 不包含 '法律法规要求' && 审批记录.变更理由 不包含 '更可靠计量') && (审批记录 IS NULL || 审批记录.审批日期 > 实际执行日期)
    && (台账.同性质变更年度次数 > 1 || ABS(测算表.对当期利润影响数 / 上一会计年度净利润) > 0.05)
  description: 同时满足以下条件视为可疑：1.无准则允许的正当理由（如法律强制要求或能提供更可靠信息）；2.审批程序缺失或先执行后补批；3.变更频繁（一年内同一政策多次变更）或影响利润超过上年净利润5%。
  audit_item: 随意变更或未按规定变更会计政策、会计处理方法
  suspicion: 随意变更会计政策且无合理理由
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条、第六条\",\n    \"内容概述\": \"企业采用的会计政策，前后各期应当保持一致，不得随意变更；确需变更的，应当在变更原因符合准则规定（法律、行政法规或国家统一会计制度等要求，或变更能提供更可靠、更相关的会计信息）时方可变更，并履行相应审批程序。\"\
    \n  }\n]"
- expression: (电力设施台账.变压器容量 / 电力设施台账.供电户数 < 规定户均容量下限) OR (电压质量监测点数据统计表.电压值 < 198 且 连续出现次数 > 5) OR (停电故障登记.月均停电次数 > 同省非特殊地区均值
    * 1.5) OR (电网覆盖率 < 电力保障专项政策.电网覆盖率目标)
  description: 判定逻辑：1.脱贫地区或革命老区户均配变容量低于国家或省级标准（如2千伏安/户）；2.电压监测点末端电压低于198V（220V的-10%）连续一个月出现超过5次；3.月均停电频率显著高于周边非特殊地区50%以上；4.电网覆盖率未达到专项政策承诺值。满足任一条件则为保障不到位。
