name: audit/规章制度类/施工方案
type: model
description: 从规章制度类类文档（施工方案）中提取结构化元数据。涵盖字段如：HDPE膜检测报告、变更前原设计内容、安全防护措施清单、审核人、批准日期、方案名称、方案审批、是否要求论证。文档范围包括：安全专项施工方案、防渗工程专项施工方案、项目施工方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 安全
- 审批
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 施工方案
  member_count: 1
  member_details:
  - 安全专项施工方案
  - 防渗工程专项施工方案
  - 项目施工方案
output:
  fields:
  - name: HDPE膜检测报告
    type: string
    description: 提取 HDPE膜检测报告 的文本值
  - name: 变更前原设计内容
    type: string
    description: 提取 变更前原设计内容 的文本值
  - name: 安全防护措施清单
    type: string
    description: 提取 安全防护措施清单 的文本值
  - name: 审核人
    type: string
    description: 提取 审核人 的文本值
  - name: 批准日期
    type: date
    description: 提取 批准日期 的日期值，格式 YYYY-MM-DD
  - name: 方案名称
    type: string
    description: 提取 方案名称 的文本值
  - name: 方案审批
    type: string
    description: 提取 方案审批 的文本值
  - name: 是否要求论证
    type: boolean
    description: 提取 是否要求论证 的布尔值（是/否）
  - name: 材料规格
    type: string
    description: 提取 材料规格 的文本值
  - name: 编制人
    type: string
    description: 提取 编制人 的文本值
  - name: 规划建成面积
    type: string
    description: 提取 规划建成面积 的文本值
  - name: 设置部位
    type: string
    description: 提取 设置部位 的文本值
  - name: 设计渠道长度
    type: string
    description: 提取 设计渠道长度 的文本值
  - name: 设计道路面积
    type: string
    description: 提取 设计道路面积 的文本值
  - name: 防护等级要求
    type: string
    description: 提取 防护等级要求 的文本值
  - name: 防护类型
    type: string
    description: 提取 防护类型 的文本值
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: （安全专项施工方案.是否要求论证 == '是' && 专家论证意见书.论证会议日期 IS NULL） || （专家论证意见书.论证会议日期 != NULL && 安全专项施工方案.批准日期 > 专家论证意见书.论证会议日期）
    || （危险性较大分部分项工程清单.工程类别 包含 '深基坑'/'高大模板'/'起重吊装' 且 专家论证意见书 无对应记录） || （项目监理日志.分项工程开工审批日期 < 专家论证意见书.论证会议日期）
  description: 判定规则：1）按规定需要论证的方案，未召开专家论证会直接实施；2）方案审批日期晚于论证日期，说明论证流于形式，方案未经论证即获批；3）工程类别属于危险性较大工程但缺失论证记录；4）实际开工时间早于论证时间，属于未论证先施工的严重违规。
  audit_item: 重大工程项目风险预警
  suspicion: 安全专项施工方案未组织专家论证
  regulation: "[\n  {\n    \"法规名称\": \"建设工程安全生产管理条例\",\n    \"法规文号\": \"国务院令第393号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"施工单位应当在施工组织设计中编制安全技术措施和施工现场临时用电方案，对达到一定规模的危险性较大的分部分项工程编制专项施工方案，并附具安全验算结果，经施工单位技术负责人、总监理工程师签字后实施，由专职安全生产管理人员进行现场监督；其中涉及深基坑、地下暗挖工程、高大模板工程的专项施工方案，施工单位还应当组织专家进行论证、审查。\"\
    \n  }\n]"
- expression: （安全防护设施验收记录.实测数据 < 安全专项施工方案.防护等级要求） || （安全专项施工方案.材料规格 != 材料进场验收台账.规格型号） || （监理安全巡视记录.发现问题描述 包含 '防护缺失'/'未按方案设置'/'材质不符'
    且 复查情况 == '未整改'） || （现场影像资料.防护设施实际情况 明显与 安全专项施工方案.防护措施清单 不一致）
  description: 判定规则：1）防护设施验收实测数据低于方案设计标准，安全冗余不足；2）进场材料规格与方案要求型号不符，降低防护强度；3）监理发现防护问题且未整改闭环，表明隐患持续存在；4）影像资料直观反映现场与方案描述不一致。任一条件成立即列为疑点。
  audit_item: 重大工程项目风险预警
  suspicion: 施工现场安全防护措施与方案严重不符
  regulation: "[\n  {\n    \"法规名称\": \"建设工程安全生产管理条例\",\n    \"法规文号\": \"国务院令第393号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"施工单位必须在施工现场采取维护安全、防范危险、预防火灾等措施；应当根据建设工程的施工特点、范围，对施工现场易发生重大事故的部位、环节进行监控，制定施工现场生产安全事故应急救援预案。防护设施必须按方案搭设并经验收合格方可使用。\"\
    \n  }\n]"
- expression: (文件7 IS NULL) || (文件5.防渗验收项缺失) || (文件10.任何检测点污染指标 > GB16889-2008标准限值)
  description: 防渗专项施工方案及监理报告缺失，或验收报告中无防渗工程质量验收记录，或后期环境监测显示土壤、地下水任意指标超出《生活垃圾填埋场污染控制标准》限值，均视为清理整治不到位。
  audit_item: 非正规垃圾堆放点清理整治不合规
  suspicion: 整治不到位未实施防渗处理
  regulation: "[\n  {\n    \"法规名称\": \"关于做好非正规垃圾堆放点排查和整治工作的通知\",\n    \"法规文号\": \"建办村〔2017〕55号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"三、（一）\",\n    \"内容概述\": \"整治后场地应达到无害化要求，防止污染扩散。\"\n  },\n  {\n    \"法规名称\": \"生活垃圾填埋场污染控制标准\",\n   \
    \ \"法规文号\": \"GB 16889-2008\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"5.3\",\n    \"内容概述\": \"生活垃圾填埋场应设置防渗系统，并建设渗滤液收集导排系统。\"\
    \n "
