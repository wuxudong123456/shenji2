violations:
- expression: (会议费报销明细表.会议名称 NOT IN 年度会议费预算申报表.会议名称) && 会议费报销明细表.实际支出金额 > 0 || (SUM(会议费报销明细表.实际支出金额) > 年度会议费预算申报表.批复预算金额 *
    1.1 && 预算调整审批记录表.调整金额 IS NULL)
  description: 筛查两类违规：一是存在实际报销的会议但未在年度预算申报表中列报，即会议脱离预算管控；二是所有会议费实际总支出超出批复预算10%以上，且无任何预算调整审批记录，表明预算约束失效。两条件满足任一即触发疑点。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 未将会议费全部纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条\",\n    \"内容概述\": \"会议费预算要细化到具体会议项目，执行中不得突破。会议费应纳入部门预算，并单独列示。\"\n  }\n]"
- expression: （会议费预算编制与执行对比表.分项实际支出金额 > 会议费预算编制与执行对比表.分项预算金额 * 1.2） || （会议费报销明细表.费用科目 IN ['住宿费','资料印刷费','设备租赁费'] && 年度会议费预算申报表.预算明细科目
    NOT INCLUDE 会议费报销明细表.费用科目）
  description: 若某项费用实际支出超出预算20%以上，或实际发生了住宿费、资料费等必要支出但预算申报时未列示该科目，判定为预算编制不完整。预算编制应涵盖会议必要的全部费用构成，缺失关键科目即构成违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 会议费预算编制不完整
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条\",\n    \"内容概述\": \"各单位应当按照规定编制会议费预算，详细列示会议名称、主要内容、时间、地点、代表人数、工作人员数、所需经费及列支渠道等。\"\n  }\n]"
- expression: (下属单位会议费支出明细表.会议费支出摘要 LIKE '%上级会议%' || 会议费转嫁/分摊台账.分摊金额 > 0) && (下属单位/关联方会议费分摊协议.分摊方 IS NULL || 银行流水.用途 = '会议分摊费')
  description: 若下属单位账面出现与上级单位会议相关的费用支出，或无正式分摊协议但资金已划转，或分摊台账显示存在分摊行为，则判定为转嫁或摊派会议费。重点确认分摊是否经正式协议且合规，缺乏协议或资金流向明确为会议分摊费即构成违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 向下属机构、企事业单位、地方转嫁或摊派会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"会议费由召开单位承担，不得向参会人员收取，不得以任何方式向下属机构、企事业单位、地方转嫁或摊派。\"\n  }\n]"
- expression: 会议费结算方式统计表.现金金额占比 > 0 && (会议费结算方式统计表.现金金额占比 > 0.05 || 会议费报销明细表.金额 >= 1000)
  description: 根据规定，会议费应使用银行转账或公务卡结算，禁止现金方式。凡存在现金结算且现金总额占总费用比例超过5%，或单笔现金支付达到1000元及以上，均构成违规。特殊情况下确需现金支付的应提供书面说明，若无合理说明则判定违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 违规以现金方式结算会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"会议费支付，应当严格按照国库集中支付制度和公务卡管理制度的有关规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\n  }\n]"
- expression: 公务接待明细台账.接待场所名称 IS NULL || TRIM(公务接待明细台账.接待场所名称) = ''
  description: 当接待场所字段为空或空白时直接判定违规，因为缺失关键要素，无法验证接待合规性。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务接待清单未记录具体场所信息
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"接待费报销凭证应当包括财务票据、派出单位公函和接待清单。接待清单应包括接待对象的单位、姓名、职务和公务活动项目、时间、场所、费用等内容。\"\n  }\n]"
- expression: (明细表.资金来源性质 = "财政专项拨款" && 余额表.各级科目余额 != "财政拨款收入—项目支出") || (明细表.使用会计科目 IN ("其他应付款","其他应收款") && 管理办法.核算科目要求)
  description: 财政专项资金未在规定的收入科目或支出科目核算，而错误列入往来款等科目，导致决算报表无法真实反映专项资金收支，即构成科目列报错误。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 专项资金列报科目错误
  regulation: "[\n  {\n    \"法规名称\": \"《政府会计制度——行政事业单位会计科目和报表》\",\n    \"法规文号\": \"财会〔2017〕25号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三部分 会计科目使用说明\",\n    \"内容概述\": \"财政拨款收入等专项资金应按规定科目单独核算，不得与其他资金混淆核算。\"\n  }\n]"
- expression: (批复文件.批复要求评价的项目清单 - COUNT(评价报告.报告名称)) > 0 || (SUM(评价报告.预算执行率) / SUM(资金规模要求.资金规模要求) < 1)
  description: 根据政策文件，凡达到一定金额的转移支付项目均应开展绩效评价；如存在未开展评价的项目，或已评价项目资金覆盖率未达到100%，即构成违规。
  audit_item: 财政转移支付资金政策绩效评价不规范
  suspicion: 对财政转移支付项目未开展绩效评价
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"各部门、各单位应当对预算资金和项目支出全面开展绩效自评，确保评价范围全覆盖。\"\n  }\n]"
- expression: 资金分配明细表.实际下达日期 > 资金分配明细表.规定下达截止日
  description: 制度要求自收到上级转移支付资金后X日内分解下达至下级或项目单位（具体时限依据管理办法，如一般转移支付30日内、专项转移支付90日内），实际下达日期超过规定截止日即为违规。延迟天数>0触发疑点。
  audit_item: 财政转移支付预算下达不及时、不准确
  suspicion: 转移支付资金未在规定时限内下达
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六十三条\",\n    \"内容概述\": \"中央对地方一般性转移支付在全国人民代表大会批准预算后30日内下达，专项转移支付在批准后90日内下达；省、自治区、直辖市政府接到中央转移支付后30日内下达。\"\n  }\n]"
- expression: ({采集表.因素名称} NOT IN ({管理办法.规定的分配因素清单})) || ({采集表.权重设置} NOT BETWEEN {管理办法.各因素权重范围} AND {管理办法.资金上限}) || ({说明文件.实际采用的评分因素}
    IS NULL) && ({分配方案.审议通过的分配因素} IS NULL)
  description: 以上级管理办法规定的因素清单和权重范围为基准，采集表中出现的因素或权重若超出授权，且会议纪要无合规审批记录，即判为违规。缺少评分规则专家论证等合理性说明，同样触发疑点。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 分配因素不合规或评分规则不科学
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条、第十一条\",\n    \"内容概述\": \"专项转移支付应科学设置资金分配方法；采用因素法等，因素选择、权重设定应当科学合理。\"\n  }\n]"
- expression: ({配总表.分配金额} > {管理办法.资金上限}) || ({配总表.项目类别} NOT IN ({管理办法.补助范围}) && {配总表.分配金额} > 0) || ({统计表.超出金额} > 0)
  description: 实际分配金额超出管理办法明确的同类别资金上限即为超标准；项目类别不属于管理办法划定的补助范围却获得资金即为超范围；超标准分配情况统计表中有记录直接判定违规。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 超标准或超范围分配资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员擅自提高支出标准、扩大支出范围的，责令改正，追回资金，并予处罚。\"\n  }\n]"
- expression: 租赁场所 NOT IN 定点饭店名单.定点饭店名单 || (租赁价格 > 定点饭店名单.对应协议价格)
  description: 选择非定点饭店或未执行政府采购协议价的，视为场地选择违规；在定点饭店消费但价格高于协议价且无合理解释，同样违规。
  audit_item: 超标准举办会议
  suspicion: 会议在非定点饭店召开或场地费未执行协议价格
  regulation: "[\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十三条\",\n    \"内容概述\": \"会议在定点饭店召开，按照协议价格结算费用。未定点饭店不能出具会议费发票的，不得报销。\"\n  }\n]"
- expression: (会计凭证.实际支付日期 - 指标下达日期.指标下达日期) > 规定拨付天数 || (审批文件.签收日期 - 指标下达日期.指标下达日期) > 规定拨付天数
  description: 比较资金拨付各环节时间差是否超过管理办法规定的时限（例如上级规定为30日）。计算指标下达日至实际支付日或最终签收日的自然天数，超过规定阈值即判定为违规。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 转移支付资金未在规定时限内拨付
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府财政部门必须依照法律、行政法规和国务院财政部门的规章，及时、足额地拨付预算支出资金。\"\n  }\n]"
- expression: (统计表.年初结转余额 > 0 && 对应项目本年仍申报并获得新增资金) || (所有项目上年总结转余额 > 0 && 本年预算未反映统筹使用安排)
  description: 当单位在上年末存在未用完的结转资金，下一年度仍为同一事项或类似项目重复申请并获得新增转移支付资金，而没有优先使用结余资金，或者预算编制文件中未包含统筹使用结余资金的安排，则构成违规。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 预算安排未统筹使用存量结余结转资金
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于深化预算管理制度改革的决定\",\n    \"法规文号\": \"国发〔2014〕45号\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第四条第（二）款\",\n    \"内容概述\": \"健全预算编制与结转结余资金管理相结合的机制，对上一年预算的结转资金，应当用于下年结转项目的支出；对连续两年未用完的结转资金，应当作为结余资金管理，由财政部门收回统筹使用。\"\
    \n  }\n]"
- expression: (跟踪表.备案/核准编号 IS NULL OR 跟踪表.实际完成日 IS NULL) && 评估报告.报告出具日期 <= 跟踪表.交易实施日 OR (跟踪表.实际完成日 < 评估报告.报告出具日期) OR (ABS(实际完成日
    - 评估报告出具日) > 设定时限阈值)
  description: 评估报告出具后、交易实施前未完成备案/核准，或备案/核准日期早于报告出具日期（时间倒置），或完成日期与报告出具日间隔超过规定时限（如10个工作日），均属违规。阈值参照被审计单位内部制度及国家规定。
  audit_item: 违反国有资产评估相关规定
  suspicion: 国有资产评估未经核准或未按规定备案
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产评估管理暂行办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第12号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十七条、第二十条\",\n    \"内容概述\": \"第十七条：资产评估项目的核准按照下列程序执行：...（三）国有资产监督管理机构或其所出资企业自收到核准申请后，在20个工作日内完成核准...第二十条：企业收到资产评估机构出具的评估报告后，应当逐级上报备案，自评估基准日起8个月内提出备案申请。\"\
    \n  }\n]"
- expression: 外宾姓名、接待日期、接待事由、外宾人数、陪同人数、接待总费用、外宾团组名称.陪同人数 / 外宾姓名、接待日期、接待事由、外宾人数、陪同人数、接待总费用、外宾团组名称.外宾人数 > 管理要求.陪同人数比例上限
  description: 设定阈值：例如，制度规定陪同人数不得超过外宾人数的50%（或1:1等具体标准）。通过计算单次接待活动中方陪同人数与外宾人数的比值，若超过制度上限，则判定为超标准安排。需关联人员职务，若陪同人员中包含行政无关或职级不符人员，则问题性质更加严重。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 超标准安排中方陪同人员
  regulation: "[\n  {\n    \"法规名称\": \"党政机关外宾接待管理办法\",\n    \"法规文号\": \"财行〔2013〕533号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"外宾来访期间，我方陪同人员人数应当根据外宾人数和工作需要从严控制。\"\n  }\n]"
- expression: 礼品名称、单价、数量、接收人.单价 > 同一团组宴请次数上限.单次赠礼金额上限 || (SUM(礼品名称、单价、数量、接收人.单价) / COUNT(礼品名称、单价、数量、接收人.单价) > 同一团组宴请次数上限.年总额标准)
  description: 直接对比礼品采购单价与制度规定的单价上限，超过即为违规。同时，对于向同一团组多人赠礼的情况，可计算人均赠礼成本，若高于规定标准，则视为变相超标。需关注将高价礼品拆分采购、开具“办公用品”“宣传品”等名目发票的规避行为。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 超标准对外赠礼
  regulation: "[\n  {\n    \"法规名称\": \"党政机关外宾接待管理办法\",\n    \"法规文号\": \"财行〔2013〕533号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条第（二）款\",\n    \"内容概述\": \"对外赠礼应当遵循节约从简原则，赠礼对象应为外方团长或重要成员，同一来访外宾团组原则上只赠礼一次，礼品应尽量选择具有民族特色的纪念品、传统手工艺品等，单价不得超过150元。\"\
    \n  }\n]"
- expression: (${分配方案.已分配金额} / ${分配方案.可分配总金额} * 100) < ${规定.明确的分配率指标（如≥90%）}
  description: 计算年初已分配预算金额占可分配预算总额的百分比，若低于法规或上级部门规定的最低分配率（如90%），则判定为违规。分配金额及总金额以预算批复年初数为准，不包含年中调整追加部分。规定分配率通常为“不低于90%”，实际分配率低于此即触发。
  audit_item: 违规批复预算
  suspicion: 年初预算分配率低于规定比例
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于进一步做好预算执行工作的指导意见\",\n    \"法规文号\": \"财预〔2010〕11号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条第（一）款\",\n    \"内容概述\": \"各部门要加快细化预算和预算批复进度，努力提高年初预算到位率，年初预算到位率原则上不低于90%。\"\n  }\n]"
- expression: (采购方式 IN ('直接委托','单一来源','询价') AND 合同金额 >= 2000000) OR (同一第三方机构年度合同金额累计 >= 2000000 AND 采购方式 NOT IN ('公开招标','竞争性磋商')
    AND 合同签订日期间隔 <= 90 天) OR (合同金额 != 中标通知书金额)
  description: 单项合同金额达到公开招标限额（默认200万元）但未采用公开招标或竞争性磋商方式时触发；同一第三方机构在短期内多次签约且累计金额超过限额，且未使用公开招标等方式，反映化整为零规避招标；合同金额与中标通知书金额不一致，存在违规变更风险。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 第三方绩效评价服务采购未执行政府购买服务相关规定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"在一个财政年度内，采购人将一个预算项目下的同一品目"
- expression: 结转资金使用明细表.支出用途 != 部门年度预算批复文件.用途 AND (SELECT COUNT(*) FROM 预算调整审批记录 WHERE 原项目 = 结转资金使用明细表.项目名称 AND 新用途 = 结转资金使用明细表.支出用途
    AND 财政部批复文号 IS NOT NULL) = 0
  description: 将结转资金支出用途与该项目原批复预算用途比对，若不一致且缺少财政部重新批准的调剂文件，即判定为违规。重点关注两年以上未用完的结转资金，防止突击花销或变相分配。
  audit_item: 预算调剂不规范
  suspicion: 未经批准调剂使用结转资金
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强地方财政结余结转资金管理的通知\",\n    \"法规文号\": \"财预〔2013〕372号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"明确结转结余资金的管理要求，规定结余资金以及连续两年未用完的结转资金，一律收回本级财政统筹使用，不得擅自调剂用于其他支出。\"\n  },\n  {\n\
    \    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第七十二条\",\n \
    \   \"内容概述\""
- expression: (CONTAINS(招标文件.资格条件, '入库') || CONTAINS(招标文件.资格条件, '名录库')) && (项目库或名录库最近更新时间距今 > 两年 || 入库企业数量近两年增长率为0) && (库外符合资质企业数量
    > 3)
  description: 当招标文件要求投标人必须进入某一特定项目库或名录库，且该库长期未更新（超过2年未调整或新增企业为零），同时市场存在3家以上符合基本资质但未入库的企业时，判为拟排斥潜在投标人。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 利用项目库或名录库设置壁垒排斥潜在投标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人或者投标人。\"\n  },\n  {\n    \"法规名称\": \"公平竞争审查制度实施细则\",\n    \"\
    法规文号\": \"国市监反垄规〔2021〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"不得设置不合理或者歧视性的准入和退出条件，排斥或者限制经营者参与招标"
