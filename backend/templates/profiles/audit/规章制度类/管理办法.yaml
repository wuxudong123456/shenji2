name: audit/规章制度类/管理办法
type: model
description: 从规章制度类类文档（管理办法）中提取结构化元数据。涵盖字段如：一事一议筹资筹劳规定、三公经费相关规定、上级与下级配套资金比例要求、上缴时限、上缴比例规定、下达时限条款、不再符合条件的具体情形及腾退时限、专户管理要求。文档范围包括：上级财政转移支付管理办法、专项资金管理办法、中央专项资金管理办法、中央及地方农业保险保费补贴管理办法、中央及地方财政转移支付管理办法、中央涉农财政专项资金管理办法、中央管理办法、企业章程或社会责任管理办法、企业负责人履职待遇业务支出管理办法、会议费管理办法等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 招投标
- 元数据提取
