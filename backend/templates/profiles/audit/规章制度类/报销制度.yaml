name: audit/规章制度类/报销制度
type: model
description: 从规章制度类类文档（报销制度）中提取结构化元数据。涵盖字段如：个人自费项目、现金使用范围及限额规定。文档范围包括：差旅费报销制度、费用报销制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 项目
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 报销制度
  member_count: 1
  member_details:
  - 差旅费报销制度
  - 费用报销制度
output:
  fields:
  - name: 个人自费项目
    type: number
    description: 提取 个人自费项目 的数值（含单位，如万元、吨等）
  - name: 现金使用范围及限额规定
    type: string
    description: 提取 现金使用范围及限额规定 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (财务凭证.发票内容 包含 “飞机票”“火车票”“景点门票”“礼品”“住宿费” 且 财务凭证.接待对象名单 非本单位人员) && (财务凭证.报销事由 包含 “接待”) && (财务凭证.报销审批单 中未注明由本单位承担的正当理由)
  description: 接待费报销中出现非本单位人员的交通、住宿、旅游、礼品发票，且无特殊客观情况说明，即属替接待对象承担费用。
  audit_item: 公务接待费预算执行不合规
  suspicion: 违规列支应由接待对象自负的费用
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"行业规范\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"接待对象应当自行负担住宿费、交通费等。接待单位应当严格控制接待范围，不得为接待对象支付个人费用。\"\n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\"\
    ,\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"不得在接待费中列支应当由接待对象承"
- expression: 日记账.贷方金额 > 50000 && (日记账.摘要为'采购款'或'工程款'或'劳务费'等对公业务) && (无对应合规大额现金支付审批单 || 支付金额审批单.支付事由明显不实)
  description: 超出企业现金使用限额，以现金支付大额对公款项，缺少真实审批手续，存在逃避监管、偷逃税款嫌疑。
  audit_item: 资金管理方面存在的问题
  suspicion: 违规大额现金支付
  regulation: "[\n  {\n    \"法规名称\": \"现金管理暂行条例\",\n    \"法规文号\": \"国务院令第12号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第五条、第六条\",\n    \"内容概述\": \"开户单位可以在下列范围内使用现金：职工工资、津贴；个人劳务报酬等。向个人收购农副产品和其他物资的价款等。超出规定范围、限额的支付应当通过开户银行进行转账结算。\"\n  }\n]"
