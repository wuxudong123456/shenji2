name: audit/规章制度类/专项计划
type: model
description: 从规章制度类类文档（专项计划）中提取结构化元数据。涵盖字段如：地域范围、计划通电户数、资金拨付总额。文档范围包括：农牧区电力覆盖专项计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 专项计划
  member_count: 1
  member_details:
  - 农牧区电力覆盖专项计划
output:
  fields:
  - name: 地域范围
    type: string
    description: 提取 地域范围 的文本值
  - name: 计划通电户数
    type: string
    description: 提取 计划通电户数 的文本值
  - name: 资金拨付总额
    type: number
    description: 提取 资金拨付总额 的数值（含单位，如万元、吨等）
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: ([用户清单].未通电用户数 > 0) && (当前日期 > [专项计划].完成时限)
  description: 在专项计划明确的全面通电时限过后，若未通电用户清单中仍存在未通电户，即判定为未实现全覆盖。若有资金拨付但未完成线路架设，或存在应通未通的遗漏户，属于严重管理违规。
  audit_item: 农村电网改造升级任务目标未完成
  suspicion: 农牧区用电未实现全覆盖
  regulation: "[\n  {\n    \"法规名称\": \"关于全面解决无电人口用电问题的指导意见\",\n    \"法规文号\": \"发改能源〔2015〕1512号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"各有关地区和电网企业要确保到2015年底解决无电人口用电问题，对偏远地区通过电网延伸或微电网等方式实现全覆盖，不得遗漏。\"\n  },\n \
    \ {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2013〕678号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\"\
    ,\n    "
