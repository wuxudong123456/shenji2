name: audit/规章制度类/培训计划
type: model
description: 从规章制度类类文档（培训计划）中提取结构化元数据。涵盖字段如：医生姓名、培训主题、培训人员姓名、培训内容、培训年度、培训日期、培训课程主题、实到人数。文档范围包括：乡村医生培训计划、乡村教师信息化培训计划、人员培训计划、信息员培训计划、创业就业培训计划、培训计划、管理人员培训计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 人员
- 培训
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 培训计划
  member_count: 1
  member_details:
  - 乡村医生培训计划
  - 乡村教师信息化培训计划
  - 人员培训计划
  - 信息员培训计划
  - 创业就业培训计划
  - 培训计划
  - 管理人员培训计划
output:
  fields:
  - name: 医生姓名
    type: string
    description: 提取 医生姓名 的文本值
  - name: 培训主题
    type: string
    description: 提取 培训主题 的文本值
  - name: 培训人员姓名
    type: string
    description: 提取 培训人员姓名 的文本值
  - name: 培训内容
    type: string
    description: 提取 培训内容 的文本值
  - name: 培训年度
    type: date
    description: 提取 培训年度 的日期值，格式 YYYY-MM-DD
  - name: 培训日期
    type: date
    description: 提取 培训日期 的日期值，格式 YYYY-MM-DD
  - name: 培训课程主题
    type: string
    description: 提取 培训课程主题 的文本值
  - name: 实到人数
    type: number
    description: 提取 实到人数 的数值（含单位，如万元、吨等）
  - name: 年度
    type: date
    description: 提取 年度 的日期值，格式 YYYY-MM-DD
  - name: 应到人数
    type: number
    description: 提取 应到人数 的数值（含单位，如万元、吨等）
  - name: 应参训人数
    type: number
    description: 提取 应参训人数 的数值（含单位，如万元、吨等）
  - name: 应覆盖人数
    type: number
    description: 提取 应覆盖人数 的数值（含单位，如万元、吨等）
  - name: 计划培训次数
    type: string
    description: 提取 计划培训次数 的文本值
  - name: 计划培训课时
    type: string
    description: 提取 计划培训课时 的文本值
  - name: 课时要求
    type: string
    description: 提取 课时要求 的文本值
  - name: 课程内容
    type: string
    description: 提取 课程内容 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (乡村教师信息化培训签到表.实到人数/乡村教师信息化培训计划.应参训人数 < 0.8) || (乡村教师信息化培训签到表.考核成绩 < 60) || (专项资金使用明细表.培训费用支出金额 < 计划预算的50% &&
    乡村教师信息化培训签到表.实到人数 > 0)
  description: 培训参与率低于80%视为覆盖不足；考核平均分未达60分表明培训效果不达标；培训经费执行率低于50%但有签到记录，暗示培训造假或走过场。
  audit_item: 乡村学校薄弱环节改善不符合相关规定
  suspicion: 乡村教师信息化培训开展不实
  regulation: "[\n  {\n    \"法规名称\": \"教育部关于实施全国中小学教师信息技术应用能力提升工程2.0的意见\",\n    \"法规文号\": \"教师〔2019〕1号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"无\",\n    \"内容概述\": \"要求建立教师信息化培训考核机制，确保培训学时达标、内容实用、考核有效，并将培训成效纳入学校考评。\"\n  }\n]"
- expression: SUM(乡村医生培训计划.学时) FILTER (乡村医生培训计划.培训年度 BETWEEN 当前年份-3 AND 当前年份-1) GROUP BY 乡村医生培训计划.医生姓名 < 240
  description: 以近三年为一周期，若某乡村医生累计培训学时不足240小时（年均80小时≈2周），即判定为培训不足；如无培训记录直接认定违规；重点核查必修课覆盖情况。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不合规
  suspicion: 乡村医生继续培训频次或时长不达标
  regulation: "[\n  {\n    \"法规名称\": \"乡村医生从业管理条例\",\n    \"法规文号\": \"国务院令第386号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第三十一条\",\n    \"内容概述\": \"县级以上地方人民政府卫生行政主管部门应当根据乡村医生培训规划，每两年至少对乡村医生进行一次培训，并负责考核；乡村医生经培训考核合格，方可继续执业。\"\n  }\n]"
- expression: (信息员档案表.参训次数 < 信息员培训计划.应到人数 * 0.8) || (信息员档案表.考核成绩 < 60 && 信息员档案表.聘用方式 = '继续聘用') || (信息员培训计划.课程目录 !包含 '设备操作'
    || 信息员培训计划.课程目录 !包含 '电商平台使用')
  description: 参训率不足80%，或考核不合格仍留任，或培训内容缺失核心实操课程，均表明培训管理流于形式、有效性不足。
  audit_item: 信息进村入户工程实施不到位
  suspicion: 村级信息员培训管理不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推进信息进村入户工程的实施意见\",\n    \"法规文号\": \"农市发[2016]3号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"第二部分第（二）条\",\n    \"内容概述\": \"应建立信息员常态化培训机制，培训内容须涵盖设备操作、电商服务等实操技能，培训不合格者不得上岗或继续聘用。\"\n  }\n]"
- expression: (培训计划.培训课程主题 < 60%) || (调研报告.覆盖乡镇数 < 50%)
  description: 行业匹配度指参训人员本人所属行业与所参加培训课程主题一致的人数/参训总人数，低于60%为培训内容严重脱节；培训覆盖率=接受过培训的返乡创业人员数/登记的返乡创业人员总数，低于50%为覆盖面不足。
  audit_item: 农民工返乡创业政策实施不到位
  suspicion: 未开展针对性创业就业培训
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于支持农民工等人员返乡创业的意见\",\n    \"法规文号\": \"国办发〔2015〕47号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第三条（五）\",\n    \"内容概述\": \"根据返乡创业人员的需求和本地产业特点，依托现有资源，有针对性地开展创业培训、创业指导。\"\n  }\n]"
- expression: (明细表.参训人次 < 计划培训次数.应覆盖人数) || (评估表.合格率 < 0.7) || (登记台账.月均使用次数 < 4 && 明细表.培训日期 > 当前日期 - 90天)
  description: 培训覆盖率未达100%，或参训人员考核合格率低于70%，或在最近一次培训结束后90天内设备月均使用次数仍不足4次（即平均每周不足1次），均表明培训无效或管理缺失，导致设备无人会用、无人使用。
  audit_item: 数字乡村建设人才不足
  suspicion: 培训管理不到位导致数字设备设施无人使用
  regulation: "[\n  {\n    \"法规名称\": \"关于加快推进乡村人才振兴的意见\",\n    \"法规文号\": \"中办发〔2021〕27号\",\n    \"效力级别\": \"制度文件\",\n    \"\
    条款号\": \"三、（九）加强乡村公共服务人才队伍建设\",\n    \"内容概述\": \"面向乡村公共服务人才广泛开展数字化技能培训，确保培训内容与实际岗位需求相匹配，强化培训考核与效果评估，保障培训实效。\"\n  }\n]"
- expression: 培训内容.年度累计培训学时_GROUP_BY_NAME < 72
  description: 以专职管理人员姓名为分组依据，汇总其在培训考核记录中的年度总培训学时，总学时低于72小时（即行业通用年度培训标准）的，判定为培训不足。
  audit_item: 文化站（中心）等建设运营管护不符合相关规定
  suspicion: 专职文化管理人员培训学时不足
  regulation: "[\n  {\n    \"法规名称\": \"关于加快构建现代公共文化服务体系的意见\",\n    \"法规文号\": \"中办发〔2015〕2号\",\n    \"效力级别\": \"制度文件\",\n \
    \   \"条款号\": \"第十五条\",\n    \"内容概述\": \"完善基层公共文化服务人才培训制度，加强基层文化骨干培训，提升服务能力。\"\n  }\n]"
- expression: 参训人员统计表.参训人员 < 政策要求最低培训课时 || (年度.课程内容 缺失 近X个年度记录)
  description: 以《乡镇综合文化站管理办法》等要求的年培训课时为基准（如每年不少于48学时），若专职人员年参训课时未达标，或缺少培训计划记录，即判定为培训不足。
  audit_item: 文化馆（站）等建设运营管护不合规
  suspicion: 专职文化管理人员培训不足
  regulation: "[\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\",\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第十四条\",\n    \"内容概述\": \"县级文化主管部门应当加强对文化站工作人员的培训，文化站工作人员应当定期参加业务培训。\"\n  },\n  {\n    \"法规名称\": \"关于加快构建现代公共文化服务体系的意见\"\
    ,\n    \"法规文号\": \"中办发〔2015〕2号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"相关部分\",\n    \"内容概述\": \"加强基层文化队伍培训，提升服务能力，实行培训上岗"
