name: audit/规章制度类/件和制度
type: model
description: 从规章制度类类文档（件和制度）中提取结构化元数据。涵盖字段如：监测覆盖率要求、监测频次要求。文档范围包括：农业社会化服务相关政策文件和制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 件和制度
  member_count: 1
  member_details:
  - 农业社会化服务相关政策文件和制度
output:
  fields:
  - name: 监测覆盖率要求
    type: string
    description: 提取 监测覆盖率要求 的文本值
  - name: 监测频次要求
    type: string
    description: 提取 监测频次要求 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (COUNT(农业主管部门监测检查记录表.检查日期) < 农业主管部门监测工作实施方案或通知.年度监测计划频次) || ((COUNT(DISTINCT 农业主管部门监测检查记录表.被检查组织) / 农业社会化服务组织基础信息表.组织总数)
    < 农业主管部门监测工作实施方案或通知.抽查比例)
  description: 实际监测次数低于政策或方案规定的最低监测频次（如年度至少2次全面检查），或者被抽查组织数量占全部组织总数比例低于规定抽查比例（如不低于30%）时，判定监测不到位。优先以实施方案中的量化指标为准，若无明确比例，参照行业通行的30%红线。
  audit_item: 农业社会化服务管理不到位
  suspicion: 农业社会化服务监测频次与覆盖面不达标
  regulation: "[\n  {\n    \"法规名称\": \"关于加快发展农业社会化服务的指导意见\",\n    \"法规文号\": \"农经发〔2021〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"第三条（十）\",\n    \"内容概述\": \"建立健全服务组织名录库，实行服务组织名录库动态管理，加强服务组织动态监测，及时掌握服务组织数量、能力、业绩、信誉等情况。\"\n  }\n]"
