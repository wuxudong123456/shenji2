  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关培训费管理办法\",\n    \"法规文号\": \"财行〔2016〕540号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条\",\n    \"内容概述\": \"明确培训费开支范围为住宿费、伙食费、培训场地费、讲课费、培训资料费、交通费和其他费用，严禁在培训费中列支与培训无关的费用。\"\n  }\n]"
- expression: (分类表.费用类别（住宿、交通、伙食补助等） = '住宿' AND 分类表.报销金额 > 管理制度.住宿费标准上限（按国家/地区）) OR (分类表.费用类别（住宿、交通、伙食补助等） = '交通' AND 分类表.舱位等级
    > 管理制度.交通工具等级标准) OR (分类表.费用类别（住宿、交通、伙食补助等） = '伙食补助' AND 分类表.报销金额 > 管理制度.伙食补助标准 * 其他.停留天数)
  description: 住宿费、伙食补助等根据出访国家/地区按规定标准上限比对，超出即违规；交通工具舱位等级需符合规定（如厅局级以下人员乘坐经济舱），超出即违规。外币金额需按报销当日汇率折算后与标准比较。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 超标准列支因公出国（境）费用
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条、第八条、第九条\",\n    \"内容概述\": \"住宿费、伙食费、公杂费等支出均按国家规定标准执行，严禁超标准安排住宿和乘坐交通工具，各职级人员乘坐交通工具等级有严格限定。\"\n  }\n]"
- expression: (单据.支付方式（转账/现金） = '现金' AND 单据.金额 > 管理制度.公务卡强制结算起点金额) OR (单据.收款方类型（对公/个人） = '个人' AND 单据.金额 > 对公支付起点 AND 无合同约定付个人)
  description: 大额出国费用（如超过公务卡强制结算起点1000元或单位规定阈值）通过现金支付，或直接转账至个人账户而非服务提供方对公账户，均违反支付管理规定，存在资金被挪用或虚报风险。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 出国费用支付方式不合规
  regulation: "[\n  {\n    \"法规名称\": \"公务卡强制结算目录\",\n    \"法规文号\": \"财库〔2011〕160号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"全文\",\n    \"内容概述\": \"预算单位因公出国（境）费用等大额支出，应当使用公务卡结算，不得使用现金支付，强制结算起点一般为1000元。\"\n  },\n  {\n    \"法规名称\": \"现金管理暂行条例\"\
    ,\n    \"法规文号\": \"国务院令第12号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"开户单位之间的经济往来，除按条例规定的范围可以使用现金外"
- expression: (公告.业绩要求 / 限价文件.招标控制价金额 > 2) || (INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本地')>0 || INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本市')>0
    || INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本省')>0) || (INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'特定行业协会')>0)
  description: 判定规则：1. 业绩合同金额门槛超过招标控制价2倍以上，构成明显过高要求；2. 资格条件中包含地域关键词（本地、本市、本省）即构成地域歧视；3. 要求特定行业协会认证等非通用行业认证，指向个别企业。任一条件满足即触发违规疑点。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 以不合理的条件限制或排斥潜在投标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  }\n]"
- expression: COUNT(DISTINCT(统计表.各投标人保证金缴纳金额 / 对比表.投标总报价)) > 1 && 招标文件保证金比例统一
  description: 同一标段内，各投标人实际缴纳保证金的比例（保证金金额/投标报价）应一致；若出现不同比例，且招标文件规定了统一比例，即存在差别对待，构成歧视待遇。差异超过2个百分点为严重违规。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 对潜在投标人实行歧视待遇
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  }\n]"
- expression: INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'必须组成联合体')>0 || INSTR(公告.是否接受独立投标相关条款,'不接受独立投标')>0
  description: 招标文件条款中出现强制联合体措辞，如‘投标人必须组成联合体’、‘不接受独立投标人’等，即构成强制联合体，违反法规。项目不具备必须联合体的法定情形，任何强制要求均属违规。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 强制要求投标人组成联合体共同投标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十七条\",\n    \"内容概述\": \"招标人应当在资格预审公告、招标公告或者投标邀请书中载明是否接受联合体投标。招标人不得强制投标人组成联合体共同投标。\"\n  }\n]"
- expression: (银行对账单.交易摘要 CONTAINS ('理财','申购','赎回','结构性存款') AND 银行对账单.交易对方（金融机构） IN ('银行','券商','信托等金融机构列表')) AND (银行对账单.对方账户类型
    IN ('财政专户','零余额账户','国库集中支付户')) AND (管理制度.财政资金投资理财的禁止规定 == FALSE)
  description: 筛查银行流水中与金融机构发生的理财类交易，且交易账户为财政性资金专户，并且单位内部制度或上级文件明确禁止购买理财。当三项条件均满足时，判定为违规。
  audit_item: 挤占挪用套取财政资金
  suspicion: 违规使用财政资金购买理财产品
  regulation: "[\n  {\n    \"法规名称\": \"财政专户管理办法\",\n    \"法规文号\": \"财库〔2013〕46号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第十二条\",\n    \"内容概述\": \"财政专户资金应按规定用途使用，不得挪作他用，不得违规用于投资理财。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强财政部门和预算单位资金存放管理的指导意见\"\
    ,\n    \"法规文号\": \"财库〔2017〕76号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、主要措施\",\n    \"内容概述\": \"严格规范资金存放管理，不得违规投资理财，确保财"
- expression: 明细台账.保证金项目名称 NOT IN (法定保证金项目名称、设立依据、法定保证金比例上限（如质量保证金不超过3%）.法定保证金项目名称) || (收取通知.保证金项目名称 未在单位设定的保证金项目名称、设立依据中载明  &&
    无任何政策文件依据)
  description: 若实际收取的保证金项目名称未出现在国务院或省级公布的涉企保证金目录清单中，或单位无法提供该保证金项目的设立依据文件、政策文件编号，则判定为违规收取无依据保证金。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 违规收取无政策依据的涉企保证金
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于清理规范工程建设领域保证金的通知\",\n    \"法规文号\": \"国办发〔2016〕49号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"全面清理各类保证金。对建筑业企业在工程建设中需缴纳的保证金，除依法依规设立的投标保证金、履约保证金、工程质量保证金、农民工工资保证金外，其他保证金一律取消。\"\
    \n  },\n  {\n    \"法规名称\": \"关于公布涉企保证金目录清单的通知\",\n    \"法规文号\": \"工信部联运行〔2017〕236号\",\n    \"效力级别\": \"部门规章\",\n  "
