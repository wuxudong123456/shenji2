name: audit/规章制度类/管理制度
type: model
description: 从规章制度类类文档（管理制度）中提取结构化元数据。涵盖字段如：一次性器械目录、三公经费审批流程、专家回避制度规定、乡村教师优先条款、交通工具等级标准、人均宿舍面积标准、人均餐费标准、从业人员上岗要求。文档范围包括：一次性医疗器械和卫生材料采购管理制度、乡村建设工匠名册管理制度、乡镇及主管部门财务管理制度、人事管理制度、企业会计档案管理制度、企业内部采购管理制度、企业固定资产管理制度、企业负债管理制度、企业财务管理制度、优抚对象动态管理制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 人员
- 审批
- 金额
- 项目
- 元数据提取
