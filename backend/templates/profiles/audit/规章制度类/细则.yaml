name: audit/规章制度类/细则
type: model
description: 从规章制度类类文档（细则）中提取结构化元数据。涵盖字段如：地方补贴清单。文档范围包括：地方出台的相关配套清单或细则等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 补贴
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 细则
  member_count: 1
  member_details:
  - 地方出台的相关配套清单或细则
output:
  fields:
  - name: 地方补贴清单
    type: string
    description: 提取 地方补贴清单 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: （申报设备名称 in 补贴装备目录） && （申报设备名称 not in 地方补贴清单） && （申报审批状态 == '驳回'）
  description: 当企业申报的设备符合上级主管部门制定的补贴目录，但不符合地方自行制定的清单，并被以此为由驳回申请时，判定为违规。这通常属于地方增设门槛、架空上级政策。
  audit_item: 畜禽粪污资源化利用方面不符合相关规定
  suspicion: 以地方目录为由拒绝执行省级以上补贴政策
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加快推进畜禽养殖废弃物资源化利用的意见\",\n    \"法规文号\": \"国办发〔2017〕48号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"四（九）\",\n    \"内容概述\": \"要完善以绿色生态为导向的农业补贴制度，加大畜禽养殖废弃物资源化利用装备购置补贴力度。地方不得在中央和省级确定的补贴目录外增设限制条件。\"\n  }\n\
    ]"
