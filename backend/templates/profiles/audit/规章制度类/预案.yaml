name: audit/规章制度类/预案
type: model
description: 从规章制度类类文档（预案）中提取结构化元数据。涵盖字段如：从业人员上岗要求、停水报告机制、医疗机构对接机制、危险源辨识清单、发布日期、备用供水方案、应急响应流程、应急措施。文档范围包括：专项应急预案、供水应急预案、农村饮用水安全应急预案、应急预案、社会捐赠专项应急预案、项目综合应急预案、食品安全事故应急预案、食堂应急预案、饮用水安全应急预案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 人员
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 预案
  member_count: 1
  member_details:
  - 专项应急预案
  - 供水应急预案
  - 农村饮用水安全应急预案
  - 应急预案
  - 社会捐赠专项应急预案
  - 项目综合应急预案
  - 食品安全事故应急预案
  - 食堂应急预案
  - 饮用水安全应急预案
output:
  fields:
  - name: 从业人员上岗要求
    type: string
    description: 提取 从业人员上岗要求 的文本值
  - name: 停水报告机制
    type: string
    description: 提取 停水报告机制 的文本值
  - name: 医疗机构对接机制
    type: string
    description: 提取 医疗机构对接机制 的文本值
  - name: 危险源辨识清单
    type: string
    description: 提取 危险源辨识清单 的文本值
  - name: 发布日期
    type: date
    description: 提取 发布日期 的日期值，格式 YYYY-MM-DD
  - name: 备用供水方案
    type: string
    description: 提取 备用供水方案 的文本值
  - name: 应急响应流程
    type: string
    description: 提取 应急响应流程 的文本值
  - name: 应急措施
    type: string
    description: 提取 应急措施 的文本值
  - name: 应急组织架构
    type: string
    description: 提取 应急组织架构 的文本值
  - name: 报告流程
    type: string
    description: 提取 报告流程 的文本值
  - name: 演练记录
    type: string
    description: 提取 演练记录 的文本值
  - name: 版本号
    type: string
    description: 提取 版本号 的文本值
  - name: 紧急调拨时效承诺标准
    type: string
    description: 提取 紧急调拨时效承诺标准 的文本值
  - name: 编制日期
    type: date
    description: 提取 编制日期 的日期值，格式 YYYY-MM-DD
  - name: 责任人及联系方式
    type: string
    description: 提取 责任人及联系方式 的文本值
  - name: 超标处置流程
    type: string
    description: 提取 超标处置流程 的文本值
  - name: 针对事故类型
    type: string
    description: 提取 针对事故类型 的文本值
  - name: 预案内容
    type: string
    description: 提取 预案内容 的文本值
  - name: 预案发布单位
    type: string
    description: 提取 预案发布单位 的文本值
  - name: 预案名称
    type: string
    description: 提取 预案名称 的文本值
  - name: 预案版本号
    type: string
    description: 提取 预案版本号 的文本值
  - name: 预案类型
    type: string
    description: 提取 预案类型 的文本值
  - name: 预警分级标准
    type: string
    description: 提取 预警分级标准 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: （项目综合应急预案.编制日期 IS NULL） || （DATEDIFF(当前检查日期, 项目综合应急预案.编制日期) > 365 且 版本号 未更新） || （应急演练计划 为空 或 应急演练计划.计划时间 已过期且
    演练记录及评估报告 无对应记录） || （应急演练记录及评估报告 记录的演练类型 未覆盖 专项应急预案.预案类型 且 年度内至少一次）
  description: 判定规则：1）无应急预案文本；2）预案超过一年未评估更新，环境变化后预案失效；3）未制定年度演练计划或计划过期未执行；4）演练类型未覆盖主要事故风险，如仅有消防演练而缺失坍塌、触电等专项演练。逻辑用||连接任一触发即判违。
  audit_item: 重大工程项目风险预警
  suspicion: 未按规定编制或更新应急预案且未组织演练
  regulation: "[\n  {\n    \"法规名称\": \"生产安全事故应急预案管理办法\",\n    \"法规文号\": \"应急管理部令第2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十六条、第三十三条\",\n    \"内容概述\": \"生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。应急预案应当至少每三年修订一次，出现特定情形应及时修订。\"\
    \n  }\n]"
- expression: ( 相关制度.核心岗位职责分离说明=true ) OR ( 会议纪要.参会人员=0 ) OR ( 预案.演练日期=0 ) OR ( 理工单.审批人='未审批' )
  description: 1. 缺少信息化系统工作机制相关制度直接判定违规；2. 会议纪要或演练记录为空表明工作机制未实际运行；3. 变更工单中存在未审批即执行的情况代表变更管理缺失。任一条件满足即视为未建立有效工作机制。
  audit_item: 网络安全建设方面存在的问题
  suspicion: 未建立有效的信息化系统工作机制
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国网络安全法\",\n    \"法规文号\": \"主席令第53号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十一条\",\n    \"内容概述\": \"网络运营者应当制定内部安全管理制度和操作规程，确定网络安全负责人，落实网络安全保护责任。\"\n  },\n  {\n    \"法规名称\": \"信息安全技术 网络安全等级保护基本要求\"\
    ,\n    \"法规文号\": \"GB/T 22239-2019\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"安全管理制度要求（管理要求部分）\",\n    \"内容概述\": \"应建立日常管理"
- expression: 预案内容.预案内容 IS NULL OR 预案内容.演练时间 IS NULL OR 物资名称、数量、存放地点.物资名称 < 基本应急物资种类清单
  description: 未制定应急预案或未开展演练，或应急物资储备不满足基本要求（如无备用电源、水处理药剂等），即判定违规。
  audit_item: 农村供水工程管护不到位及运营不规范
  suspicion: 饮用水安全应急保障机制不健全
  regulation: "[\n  {\n    \"法规名称\": \"水利部关于进一步加强农村饮水安全工程运行管护工作的指导意见\",\n    \"法规文号\": \"水农〔2015〕134号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"三、健全应急保障机制\",\n    \"内容概述\": \"应制定供水安全应急预案，储备必要的应急物资，定期组织应急演练，提高突发事件的处置能力。\"\n  }\n]"
- expression: (应急预案文件缺失 OR 预案内容未覆盖预警/响应/处置全流程) || (近三年应急演练次数 = 0) || (登记表.当前库存数量 < 登记表.最低储备数量)
  description: 未编制或预案内容严重缺失的；最近三年内未开展任何应急演练的；应急物资库存低于规定最低限额的，均构成应急保障机制不健全的疑点。
  audit_item: 工程建后管护不到位
  suspicion: 农村饮用水安全应急保障机制不健全
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国突发事件应对法\",\n    \"法规文号\": \"主席令第六十九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十七条、第二十六条\",\n    \"内容概述\": \"地方各级人民政府和企事业单位应当制定应急预案，组织应急演练，储备应急物资，建立健全安全管理制度，预防和减少突发事件的发生。\"\n  }\n]"
- expression: (统计表.实际发放日期 - 登记台账.接收日期 > 紧急调拨时效承诺标准.紧急调拨时效承诺标准) || (管理台账.期末库存数量 > 0 && (当前日期 - 管理台账.入库日期 > 30天) && 管理台账.物资名称
    != 闲置物资) || (审批表.审批日期 - 审批表.申请日期 > 24小时)
  description: 该表达式用于识别三类不合规行为：1.(实际发放日期-接收日期)超过应急预案承诺天数，则触发分配流程不及时疑点；2.非闲置物资库存超过30天未分配，可能存在积压；3.紧急物资调拨审批耗时超过24小时，说明应急响应不及时。
  audit_item: 社会捐赠款物使用不合规
  suspicion: 捐赠款物分配不及时
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"中华人民共和国主席令第43号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十五条\",\n    \"内容概述\": \"慈善组织应当合理设计慈善项目，优化实施流程，降低运行成本，提高慈善财产使用效益。\"\n  },\n  {\n    \"法规名称\": \"救灾捐赠管理办法\",\n   \
    \ \"法规文号\": \"民政部令第35号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十七条\",\n    \"内容概述\": \"对救灾捐赠款物，应当根据救灾工作的实际需要和捐赠人的意愿，及时分配和使"
- expression: (预案.发布日期 == '无') || (演练记录.演练日期 < 当前日期 - 365天) || (报告表.上报时间 - 事故发现时间 > 2小时)
  description: 未制定书面应急预案、一年内未组织开展应急演练，或发生疑似食品安全事故后超过2小时才向相关部门报告，均属重大管理缺陷。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 食品安全应急预案缺失或事故处理延迟
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国食品安全法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零二条、第一百零三条\",\n    \"内容概述\": \"学校等集中用餐单位应当制定食品安全事故应急预案；发生食品安全事故的单位应当在2小时内向事故发生地县级人民政府食品安全监督管理部门和卫生行政部门报告。\"\n  }\n]"
- expression: (发布日期 IS NULL) || (检测项目与频次表 < GB5749规定最低频次) || (采样时间 = 近6个月无检测记录) || (预案版本号 IS NULL) || (演练记录 = 应急演练记录缺失) ||
    (演练记录 > 1年)
  description: 1.无书面检验制度即无法定管理依据；2.制度规定的检测频次低于国家标准，如出厂水日检项目不足9项；3.近半年无任何检测记录，等同于凭肉眼判断水质；4.未编制应急预案或从未开展演练，无法应对突发污染事件。
  audit_item: 水质保障和工程运营管理不到位
  suspicion: 供水单位未建立水质检验及应急处置制度
  regulation: "[\n  {\n    \"法规名称\": \"生活饮用水卫生监督管理办法\",\n    \"法规文号\": \"建设部、卫生部令第53号（2016年修订）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第九条、第十条\",\n    \"内容概述\": \"供水单位应建立水质检验制度，配备检验人员和设备，按照国家规定的检测项目、频次和标准开展水质检测，并建立健全应急预案。\"\n  },\n  {\n\
    \    \"法规名称\": \"生活饮用水卫生标准\",\n    \"法规文号\": \"GB 5749-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"10.1、10.2\",\n\
    \    \"内容"
