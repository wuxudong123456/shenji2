name: audit/规章制度类/工作计划
type: model
description: 从规章制度类类文档（工作计划）中提取结构化元数据。涵盖字段如：实际考核完成日期、年度工作计划中提及家庭农场制度建设的内容、年度工作计划中档案建设任务、是否包含农药包装废弃物回收监管任务、考核指标、计划总人数、计划考核完成日期。文档范围包括：农业农村部门年度工作计划、年度农业社会化服务工作计划、年度工作计划、新型职业农民培育年度工作计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 工作计划
  member_count: 1
  member_details:
  - 农业农村部门年度工作计划
  - 年度农业社会化服务工作计划
  - 年度工作计划
  - 新型职业农民培育年度工作计划
output:
  fields:
  - name: 实际考核完成日期
    type: date
    description: 提取 实际考核完成日期 的日期值，格式 YYYY-MM-DD
  - name: 年度工作计划中提及家庭农场制度建设的内容
    type: date
    description: 提取 年度工作计划中提及家庭农场制度建设的内容 的日期值，格式 YYYY-MM-DD
  - name: 年度工作计划中档案建设任务
    type: date
    description: 提取 年度工作计划中档案建设任务 的日期值，格式 YYYY-MM-DD
  - name: 是否包含农药包装废弃物回收监管任务
    type: boolean
    description: 提取 是否包含农药包装废弃物回收监管任务 的布尔值（是/否）
  - name: 考核指标
    type: string
    description: 提取 考核指标 的文本值
  - name: 计划总人数
    type: number
    description: 提取 计划总人数 的数值（含单位，如万元、吨等）
  - name: 计划考核完成日期
    type: date
    description: 提取 计划考核完成日期 的日期值，格式 YYYY-MM-DD
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 年度目标任务分解与完成情况对比表.实际完成人数 < 年度目标任务分解与完成情况对比表.计划培训人数 && 未完成目标原因分析统计表.上级批复文件编号 IS NULL
  description: 实际完成人数低于计划培训人数，且未提供经上级批复的调整或延期说明文件，即判定为目标任务未完成。完成率低于80%为严重未完成，触发重点核查。
  audit_item: 任务目标未完成、管理不规范
  suspicion: 新型职业农民培育年度目标任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"新型职业农民培育工程实施方案\",\n    \"法规文号\": \"农办科〔2022〕X号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三部分 任务落实与考核\",\n    \"内容概述\": \"各项目县须严格按照下达的年度培训任务组织实施，确保任务完成率100%，对未完成任务的单位进行通报并调减下年度资金。\"\n  }\n]"
- expression: (省级农业社会化服务绩效评价实施方案.评价启动日期 - 项目资金下达文件.资金下达日期 > 60) || (年度农业社会化服务工作计划.实际考核完成日期 - 年度农业社会化服务工作计划.计划考核完成日期 > 60)
  description: 资金下达后超过60天仍未启动绩效评价，或实际完成考核时间超出计划截止日期60天以上，视为考核工作严重滞后。
  audit_item: 农业社会化服务绩效考核不科学
  suspicion: 绩效评价工作严重滞后未按时启动
  regulation: "[\n  {\n    \"法规名称\": \"农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"地方各级农业农村部门应当加强项目绩效管理，建立健全绩效评价指标体系，及时组织开展绩效评价工作。\"\n  }\n]"
- expression: (检查日期.记录总数 = 0) OR (DATEDIFF(MAX(检查日期), MIN(检查日期)) / (COUNT(检查日期) - 1) > 180 AND COUNT(检查日期) < 2) OR (工作计划.考核指标
    NOT CONTAINS "农药包装废弃物回收")
  description: ①检查记录表完全空白，表明年度内未开展任何监督检查；②检查频次低于最低要求（如每半年至少1次），年度检查次数不足2次；③年度工作计划未将回收处理纳入监管。满足任一条件即触发疑点。
  audit_item: 农药化肥减量增效落实方面不符合相关规定
  suspicion: 主管部门未履行农药包装废弃物回收处理监管职责
  regulation: "[\n  {\n    \"法规名称\": \"农药包装废弃物回收处理管理办法\",\n    \"法规文号\": \"生态环境部 农业农村部令2020年第7号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第六条、第十九条\",\n    \"内容概述\": \"县级以上地方人民政府农业农村主管部门负责本行政区域内农药包装废弃物回收处理的监督管理，并应当加强监督检查。\"\n  }\n]"
- expression: 意见.文件存在性 == false || 意见.发文日期 - 其他.发文日期 > 365 && (意见.是否包含财政扶持条款 == false || 意见.是否包含土地保障条款 == false || 意见.是否包含认定程序条款
    == false || 意见.是否包含动态管理条款 == false)
  description: 判定省级部门是否按规定出台指导意见。条件1：省级文件完全不存在；或条件2：省级文件发布超过国家上位文件一年以上，且文件缺少财政、土地、认定程序、动态管理等任一关键要素。满足任一条件即视为制度不健全。
  audit_item: 家庭农场认定制度不健全
  suspicion: 省级农业农村部门未按规定出台家庭农场发展指导意见
  regulation: "[\n  {\n    \"法规名称\": \"关于实施家庭农场培育计划的指导意见\",\n    \"法规文号\": \"农政发〔2019〕16号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二条第四项\",\n    \"内容概述\": \"要求各地结合实际出台省级家庭农场培育计划或指导意见，明确财政、用地、金融等扶持政策，建立健全认定标准和登记名录制度。\"\n  }\n]"
- expression: 家庭农场档案建立情况统计表.已建档数量 / 家庭农场档案建立情况统计表.已认定家庭农场总数 < 0.95 || (家庭农场档案建立情况统计表.档案最后更新时间 - 当前日期 > 365) || (抽查样本中缺少[经营者身份信息,
    土地流转合同复印件]字段的比例 > 0.2)
  description: 判定档案管理是否健全。风险1（深度风险）：全县建档率低于95%；或风险2（更新风险）：存在超过一年未更新的档案；或风险3（质量风险）：抽查档案缺失经营者身份证明、土地流转合同等关键必收材料的比例超过20%。任一条件触发则视为档案管理制度执行严重不到位。
  audit_item: 家庭农场认定制度不健全
  suspicion: 县级农业农村部门未建立规范的家庭农场档案
  regulation: "[\n  {\n    \"法规名称\": \"关于实施家庭农场培育计划的指导意见\",\n    \"法规文号\": \"农政发〔2019〕16号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二条第四项\",\n    \"内容概述\": \"健全家庭农场名录系统，及时把符合条件的种养大户、专业大户等规模农业经营户纳入名录，实行动态管理，确保信息完整准确。\"\n  }\n]"
