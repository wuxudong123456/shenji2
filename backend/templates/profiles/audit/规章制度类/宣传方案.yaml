name: audit/规章制度类/宣传方案
type: model
description: 从规章制度类类文档（宣传方案）中提取结构化元数据。涵盖字段如：宣传方式、覆盖村数。文档范围包括：殡葬惠民政策宣传方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 宣传方案
  member_count: 1
  member_details:
  - 殡葬惠民政策宣传方案
output:
  fields:
  - name: 宣传方式
    type: string
    description: 提取 宣传方式 的文本值
  - name: 覆盖村数
    type: string
    description: 提取 覆盖村数 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (宣传覆盖率、群众知晓率（如有）.宣传覆盖率 < 80%) || (宣传方式、覆盖村数.开展次数 = 0) || (专项补贴收入、实际支出、专项资金预算额、实际支出额、结余额.专项资金结余率 > 0.5 && 投诉内容中涉及加价收费的记录、反映不知晓政策的投诉记录.申领人数
    / 应保人数 < 0.3)
  description: 宣传覆盖村（社区）比例低于80%、全年无宣传实施记录，或殡葬补贴专项资金年底结余率超过50%且实际申领补贴的困难群众比例低于30%时，判定为宣传不到位，导致政策知晓率低、执行率低。
  audit_item: 农村公益性殡葬政策未有效落实
  suspicion: 殡葬惠民政策宣传执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推动殡葬改革促进殡葬事业发展的指导意见\",\n    \"法规文号\": \"民发〔2018〕5号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第（五）条\",\n    \"内容概述\": \"加大宣传引导力度，深入解读殡葬改革政策和惠民殡葬措施，提高群众知晓率和参与度，确保政策家喻户晓。\"\n  }\n]"
