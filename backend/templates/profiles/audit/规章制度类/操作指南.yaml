name: audit/规章制度类/操作指南
type: model
description: 从规章制度类类文档（操作指南）中提取结构化元数据。涵盖字段如：处置方式规范、注销时限要求、联动部门。文档范围包括：捕捞证书注销操作指南等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 操作指南
  member_count: 1
  member_details:
  - 捕捞证书注销操作指南
output:
  fields:
  - name: 处置方式规范
    type: string
    description: 提取 处置方式规范 的文本值
  - name: 注销时限要求
    type: string
    description: 提取 注销时限要求 的文本值
  - name: 联动部门
    type: string
    description: 提取 联动部门 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (注销台账.处置完成日期 IS NOT NULL AND 注销台账.证书注销日期 IS NULL) OR (注销台账.证书注销日期 - 注销台账.处置完成日期 > 30) OR (注销台账.处置方式 NOT IN ('拆解','销毁','回收','无害化处理'))
    OR (拆解证明.拆解日期 IS NOT NULL AND 注销台账.处置方式 != '拆解')
  description: 渔船已完成处置但捕捞证书未注销；证书注销日期晚于处置完成日超过30天；处置方式不符合操作指南规定的类型；已有拆解证明但台账记录的处置方式并非拆解，均属违规。
