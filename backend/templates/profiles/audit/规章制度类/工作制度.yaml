name: audit/规章制度类/工作制度
type: model
description: 从规章制度类类文档（工作制度）中提取结构化元数据。涵盖字段如：动态更新频率要求、应建档总数、应建档渔民总数、建档标准、建档立卡截止日期、档案应当包含的要素清单、档案管理制度颁发日期。文档范围包括：县级家庭农场建档工作制度、退捕渔民建档立卡工作制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 工作制度
  member_count: 1
  member_details:
  - 县级家庭农场建档工作制度
  - 退捕渔民建档立卡工作制度
output:
  fields:
  - name: 动态更新频率要求
    type: string
    description: 提取 动态更新频率要求 的文本值
  - name: 应建档总数
    type: string
    description: 提取 应建档总数 的文本值
  - name: 应建档渔民总数
    type: string
    description: 提取 应建档渔民总数 的文本值
  - name: 建档标准
    type: string
    description: 提取 建档标准 的文本值
  - name: 建档立卡截止日期
    type: date
    description: 提取 建档立卡截止日期 的日期值，格式 YYYY-MM-DD
  - name: 档案应当包含的要素清单
    type: string
    description: 提取 档案应当包含的要素清单 的文本值
  - name: 档案管理制度颁发日期
    type: date
    description: 提取 档案管理制度颁发日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (退捕渔民信息登记台账.已建档渔民数 / 退捕渔民建档立卡工作制度.应建档渔民总数 * 100 < 100) && (DATEDIFF(CURRENT_DATE, 退捕渔民建档立卡工作制度.建档立卡截止日期, 'day')
    > 30)
  description: 在建档立卡制度规定的截止日期之后，若实际建档完成率仍未达到100%，且超期天数超过30天，即判定为未按时完成。建档完成率=已建档数÷应建档总数×100%。
  audit_item: 任务目标未按时完成
  suspicion: 未按时完成退捕渔民建档立卡工作
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农办计财〔2019〕8号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条“精准识别退捕渔船渔民”\",\n    \"内容概述\": \"要求各地对退捕渔船和渔民进行精准识别，建档立卡，做到一船一档、一户一档，为实施补偿和转产安置提供依据。\"\
    \n  }\n]"
- expression: NVL(退捕渔民信息登记台账.已建档数量, 0) / 退捕渔民建档立卡工作制度.应建档总数 < 1.0 && SYSDATE > 分阶段禁捕目标的时间节点安排表.建档完成截止日期 && 延期申请或未完成情况说明文件.有效延期批复
    IS NULL
  description: 截至规定截止日期，实际建档数量未达到应建档总数，且无经批准的延期手续，即构成未按时完成。若建档率低于90%或虚假建档（如身份证重复率>0.5%），判定为严重违规。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 未按时完成退捕渔民建档立卡工作
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"无明确条款\",\n    \"内容概述\": \"要求抓紧完成退捕渔民建档立卡工作，确保信息准确完整，为后续补偿和安置提供依据。\"\n  }\n]"
- expression: 家庭农场档案建立情况统计表.已建档数量 / 家庭农场档案建立情况统计表.已认定家庭农场总数 < 0.95 || (家庭农场档案建立情况统计表.档案最后更新时间 - 当前日期 > 365) || (抽查样本中缺少[经营者身份信息,
    土地流转合同复印件]字段的比例 > 0.2)
  description: 判定档案管理是否健全。风险1（深度风险）：全县建档率低于95%；或风险2（更新风险）：存在超过一年未更新的档案；或风险3（质量风险）：抽查档案缺失经营者身份证明、土地流转合同等关键必收材料的比例超过20%。任一条件触发则视为档案管理制度执行严重不到位。
  audit_item: 家庭农场认定制度不健全
  suspicion: 县级农业农村部门未建立规范的家庭农场档案
  regulation: "[\n  {\n    \"法规名称\": \"关于实施家庭农场培育计划的指导意见\",\n    \"法规文号\": \"农政发〔2019〕16号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二条第四项\",\n    \"内容概述\": \"健全家庭农场名录系统，及时把符合条件的种养大户、专业大户等规模农业经营户纳入名录，实行动态管理，确保信息完整准确。\"\n  }\n]"
