name: audit/规章制度类/编制指南
type: model
description: 从规章制度类类文档（编制指南）中提取结构化元数据。涵盖字段如：产业引导目录、分类施策准则、方案编制要求。文档范围包括：渔民转产安置方案编制指南等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 编制指南
  member_count: 1
  member_details:
  - 渔民转产安置方案编制指南
output:
  fields:
  - name: 产业引导目录
    type: string
    description: 提取 产业引导目录 的文本值
  - name: 分类施策准则
    type: string
    description: 提取 分类施策准则 的文本值
  - name: 方案编制要求
    type: string
    description: 提取 方案编制要求 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 渔民ID、方案内容、转产方向、对接产业.方案内容 NOT CONTAINS ANY('水产养殖','休闲渔业','物流运输','农产品加工','生态管护','电商销售') && (渔民ID、方案内容、转产方向、对接产业.就业状态
    != '已就业')
  description: 检查每个渔民的转产安置方案内容，如果方案中未包含任何与本地水乡特色、退捕渔民适配的产业关键词，并且该渔民目前处于未就业状态，则判定为方案缺乏针对性。关键词可根据地方实际产业目录调整。
  audit_item: 退捕渔民安置不符合规定
  suspicion: 渔民转产安置方案缺乏针对性
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"四、精准帮扶退捕渔民转产转业\",\n    \"内容概述\": \"要求根据退捕渔民的年龄、技能、意愿，结合当地资源禀赋和产业基础，分类施策，制定有针对性的转产转业安置方案。\"\n  }\n]"
