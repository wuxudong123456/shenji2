name: audit/规章制度类/核算制度
type: model
description: 从规章制度类类文档（核算制度）中提取结构化元数据。涵盖字段如：制造费用分配方法及标准。文档范围包括：企业成本核算制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 核算制度
  member_count: 1
  member_details:
  - 企业成本核算制度
output:
  fields:
  - name: 制造费用分配方法及标准
    type: number
    description: 提取 制造费用分配方法及标准 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (ABS(直接人工成本分配率计算表.各产品分摊的制造费用 - (各生产线实际工时或机器工时.各生产线实际工时或机器工时/各生产线实际工时或机器工时.各生产线实际工时或机器工时)*制造费用分摊) / 各产品分摊的制造费用
    > 0.1) || (费用项目、金额、归属期间.金额 > 0)
  description: 实际分配额与按统一标准重新计算之差超出10%，或制造费用中混入了应计入管理/销售费用的项目，即构成违规。
  audit_item: 未按规定确认成本费用
  suspicion: 制造费用归集和分配不正确
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"制造费用应当按合理方法分配计入产品成本，分配方法一经确定不得随意变更；非正常消耗的直接材料、直接人工和制造费用不计入存货成本。\"\n  },\n  {\n    \"法规名称\"\
    : \"企业产品成本核算制度（试行）\",\n    \"法规文号\": \"财会〔2013〕17号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十二条\",\n    \"内容概述\"\
    : \""
