name: audit/规章制度类/薪酬制度
type: model
description: 从规章制度类类文档（薪酬制度）中提取结构化元数据。涵盖字段如：加班审批流程、工时单价。文档范围包括：企业薪酬制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 审批
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 薪酬制度
  member_count: 1
  member_details:
  - 企业薪酬制度
output:
  fields:
  - name: 加班审批流程
    type: string
    description: 提取 加班审批流程 的文本值
  - name: 工时单价
    type: number
    description: 提取 工时单价 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (记录表.工时数 / 产日报表.实际开工台时 > 1.5) || (ABS(记录表.工资额 - 产日报表.产量*薪酬制度.工时单价) / (产日报表.产量*薪酬制度.工时单价) > 0.2) || (记录表.员工工号
    > 16)
  description: 记录工时与机器实际开工台时比超1.5倍疑虚增；工资额偏离产量与定额工时乘积20%以上；同一人日工时超16小时明显不合理。三者满足其一即触发疑点。
  audit_item: 未按规定确认成本费用
  suspicion: 虚构工时多计成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条、第十七条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，不得以虚假的经济业务事项或者资料进行会计核算。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则——基本准则\"\
    ,\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条、第三十三条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者"
