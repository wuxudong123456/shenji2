name: audit/规章制度类/考评办法
type: model
description: 从规章制度类类文档（考评办法）中提取结构化元数据。涵盖字段如：结果应用措施、结果运用条款。文档范围包括：培育工作绩效考评办法等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 考评办法
  member_count: 1
  member_details:
  - 培育工作绩效考评办法
output:
  fields:
  - name: 结果应用措施
    type: boolean
    description: 提取 结果应用措施 的布尔值（是/否）
  - name: 结果运用条款
    type: number
    description: 提取 结果运用条款 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 绩效考评指标得分明细表.考评等级 = '不合格' && 次年资金分配方案.获得补助的机构名称 包含 绩效考评指标得分明细表.被考评机构名称
  description: 上年绩效考评结果为不合格的培训机构，次年仍在资金分配中获得补助，表明考评结果未与资金分配挂钩。
  audit_item: 任务目标未完成、管理不规范（新型职业农民培训）
  suspicion: 培育工作绩效考评结果应用不到位
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十六条\",\n    \"内容概述\": \"绩效评价结果应作为资金分配、项目安排的重要依据，对考评不合格的项目单位应调减或暂停安排资金。\"\n  }\n]"
- expression: 绩效考评指标得分明细表.考评等次 = '不合格' && EXISTS (补贴申领审核.收款单位 = 绩效考评指标得分明细表.被考评单位/机构 AND 补贴申领审核.拨付年度 >= 绩效考评指标得分明细表.考评年度+1)
  description: 上年度考评结果为“不合格”的单位，若次年度仍获得同类型项目拨款且整改报告未体现资格暂停，即判定为结果应用不到位。
  audit_item: 任务目标未完成、管理不规范
  suspicion: 培育工作绩效考评结果应用不到位
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业新型职业农民培训补助资金绩效管理办法\",\n    \"法规文号\": \"财农〔2021〕X号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"绩效评价结果应与资金分配、项目安排挂钩，对评价较差或不合格的单位，减少或暂停下一年度资金安排。\"\n  }\n]"
