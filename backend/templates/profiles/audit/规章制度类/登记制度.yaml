name: audit/规章制度类/登记制度
type: model
description: 从规章制度类类文档（登记制度）中提取结构化元数据。涵盖字段如：两票制发票、户籍人口、户籍迁入记录、户籍迁入迁出记录、进药渠道备案清单。文档范围包括：不动产登记制度、药品采购备案登记制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 票据
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 登记制度
  member_count: 1
  member_details:
  - 不动产登记制度
  - 药品采购备案登记制度
output:
  fields:
  - name: 两票制发票
    type: string
    description: 提取 两票制发票 的文本值
  - name: 户籍人口
    type: string
    description: 提取 户籍人口 的文本值
  - name: 户籍迁入记录
    type: string
    description: 提取 户籍迁入记录 的文本值
  - name: 户籍迁入迁出记录
    type: string
    description: 提取 户籍迁入迁出记录 的文本值
  - name: 进药渠道备案清单
    type: string
    description: 提取 进药渠道备案清单 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (药品名称.采购渠道 not in 平台药品名称.配送企业) || (药品名称.销售单价 > 药品名称.采购单价 * 1.00 )
  description: 一是采购渠道不在省集采平台上（私自采购），二是销售单价大于采购进价（加价销售），违背零差率政策。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 私自采购并加价销售基药
  regulation: "[\n  {\n    \"法规名称\": \"关于印发巩固完善基本药物制度和基层运行新机制的意见\",\n    \"法规文号\": \"国办发〔2013〕14号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、（四）条\",\n    \"内容概述\": \"政府办基层医疗卫生机构全部配备和使用基本药物，并按购进价格实行零差率销售。\"\n  }\n]"
