name: audit/规章制度类/设置方案+架构方案
type: model
description: 从规章制度类类文档（设置方案、架构方案）中提取结构化元数据。涵盖字段如：各岗位职责对应编制类型、实际岗位类型、岗位设置、编制类型、领导岗位职数及职级层次。文档范围包括：单位岗位设置方案、单位组织架构方案等。本模板合并了
  2 个相似子类型。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 设置方案
  - 架构方案
  member_count: 2
  member_details:
  - 单位岗位设置方案
  - 单位组织架构方案
output:
  fields:
  - name: 各岗位职责对应编制类型
    type: string
    description: 提取 各岗位职责对应编制类型 的文本值
  - name: 实际岗位类型
    type: string
    description: 提取 实际岗位类型 的文本值
  - name: 岗位设置
    type: string
    description: 提取 岗位设置 的文本值
  - name: 编制类型
    type: string
    description: 提取 编制类型 的文本值
  - name: 领导岗位职数及职级层次
    type: string
    description: 提取 领导岗位职数及职级层次 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
