name: audit/规章制度类/政策制度
type: model
description: 从规章制度类类文档（政策制度）中提取结构化元数据。涵盖字段如：任务完成时间、任务完成时间节点、农牧区全覆盖目标、完成时限、户均配变容量目标值、目标供电可靠率、目标综合电压合格率、考核办法。文档范围包括：政府文件或政策制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 政策制度
  member_count: 1
  member_details:
  - 政府文件或政策制度
output:
  fields:
  - name: 任务完成时间
    type: date
    description: 提取 任务完成时间 的日期值，格式 YYYY-MM-DD
  - name: 任务完成时间节点
    type: date
    description: 提取 任务完成时间节点 的日期值，格式 YYYY-MM-DD
  - name: 农牧区全覆盖目标
    type: string
    description: 提取 农牧区全覆盖目标 的文本值
  - name: 完成时限
    type: string
    description: 提取 完成时限 的文本值
  - name: 户均配变容量目标值
    type: string
    description: 提取 户均配变容量目标值 的文本值
  - name: 目标供电可靠率
    type: string
    description: 提取 目标供电可靠率 的文本值
  - name: 目标综合电压合格率
    type: string
    description: 提取 目标综合电压合格率 的文本值
  - name: 考核办法
    type: string
    description: 提取 考核办法 的文本值
  - name: 考核标准
    type: string
    description: 提取 考核标准 的文本值
  - name: 通电标准
    type: string
    description: 提取 通电标准 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: ([统计表].各区域实际供电可靠率 < [目标供电可靠率、任务完成时间节点、考核标准、目标综合电压合格率、任务完成时间、考核办法、户均配变容量目标值、完成时限、农牧区全覆盖目标、通电标准].目标供电可靠率) && (当前日期
    > [目标供电可靠率、任务完成时间节点、考核标准、目标综合电压合格率、任务完成时间、考核办法、户均配变容量目标值、完成时限、农牧区全覆盖目标、通电标准].任务完成时间节点)
  description: 实际供电可靠率低于政府或计划文件设定的目标值，且任务完成时间节点已过，即判定为未按期实现任务目标。若实际值低于目标值超过0.5个百分点，可视为严重未达标，需重点核查原因。
  audit_item: 农村电网改造升级任务目标未完成
  suspicion: 供电可靠率未按期实现任务目标
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2013〕678号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十三条\",\n    \"内容概述\": \"项目法人单位应严格按照规划确定的建设目标、任务和时限要求组织实施，确保按期完成农村电网改造升级任务，实现规定的供电可靠率和电压合格率等指标。\"\n  },\n\
    \  {\n    \"法规名称\": \"供电监管办法\",\n    \"法规文号\": \"国家电力监管委员会令第27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条\",\n\
    \    \"内容概述"
- expression: ([报告表].独立检测的电压合格率 < [目标供电可靠率].目标综合电压合格率) && (当前日期 > [目标供电可靠率].任务完成时间节点)
  description: 监测数据表的实际综合电压合格率低于实施方案规定的目标值，且已超过政府限定的任务完成时限，即判定为未完成。若低于目标值3个百分点以上，或末端用户电压偏差超过国家允许范围（如低于198V），可视为严重违规。
  audit_item: 农村电网改造升级任务目标未完成
  suspicion: 综合电压合格率未按期实现任务目标
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2013〕678号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十三条\",\n    \"内容概述\": \"项目应实现规定的电压合格率等电能质量指标，未达标的应分析原因并限期整改。\"\n  },\n  {\n    \"法规名称\": \"供电监管办法\",\n\
    \    \"法规文号\": \"国家电力监管委员会令第27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条、第十二条\",\n    \"内容概述\": \"供电企业应当保证供电电压质量符合国家标准，发现电压"
- expression: (对比表.实际完成户均容量 < 分配方案.目标户均容量) && (当前日期 > 政策制度.任务完成时间节点)
  description: 根据实际安装投运的配变总容量除以实际接入用户数计算得到的实际户均配变容量，若低于规划方案设定的目标值，且任务期限已过，即构成未完成任务。若低于目标值超过0.3kVA，或存在虚报配变台数行为，属严重违规。
  audit_item: 农村电网改造升级任务目标未完成
  suspicion: 户均配变容量未按期实现任务目标
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2013〕678号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十七条\",\n    \"内容概述\": \"农村电网改造升级应按照相关技术标准执行，确保配变容量等满足农村用电需求增长，项目验收应核查户均配变容量是否达到批复方案要求。\"\n  },\n  {\n  \
    \  \"法规名称\": \"农村电网改造升级技术原则\",\n    \"法规文号\": \"国能新能〔2015〕242号\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"7.2.2\",\n\
    \    \"内容概述\":"
- expression: ([用户清单].未通电用户数 > 0) && (当前日期 > [专项计划].完成时限)
  description: 在专项计划明确的全面通电时限过后，若未通电用户清单中仍存在未通电户，即判定为未实现全覆盖。若有资金拨付但未完成线路架设，或存在应通未通的遗漏户，属于严重管理违规。
  audit_item: 农村电网改造升级任务目标未完成
  suspicion: 农牧区用电未实现全覆盖
  regulation: "[\n  {\n    \"法规名称\": \"关于全面解决无电人口用电问题的指导意见\",\n    \"法规文号\": \"发改能源〔2015〕1512号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"各有关地区和电网企业要确保到2015年底解决无电人口用电问题，对偏远地区通过电网延伸或微电网等方式实现全覆盖，不得遗漏。\"\n  },\n \
    \ {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2013〕678号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\"\
    ,\n    "
