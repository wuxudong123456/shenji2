name: audit/规章制度类/站点规划
type: model
description: 从规章制度类类文档（站点规划）中提取结构化元数据。涵盖字段如：位置、应建站点数量、规划站点数量。文档范围包括：农村客运站点规划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 站点规划
  member_count: 1
  member_details:
  - 农村客运站点规划
output:
  fields:
  - name: 位置
    type: string
    description: 提取 位置 的文本值
  - name: 应建站点数量
    type: number
    description: 提取 应建站点数量 的数值（含单位，如万元、吨等）
  - name: 规划站点数量
    type: number
    description: 提取 规划站点数量 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 规划站点数量.实际建成站点数量 < 应建站点数量 || 配置率.配置率 < 1 || 500米服务半径覆盖率.500米服务半径覆盖率 < 规划目标值
  description: 依据客运站点规划和实施方案，若实际建成站点数少于规划应建数，或通客车线路未按标准设置招呼站，或站点设施缺失，或服务半径覆盖率低于规划目标，即判定未同步建设客运站点。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 通客车农村公路未配套建设客运站点
  regulation: "[\n  {\n    \"法规名称\": \"农村道路旅客运输班线通行条件审核规则\",\n    \"法规文号\": \"交运发〔2014〕258号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第七条\",\n    \"内容概述\": \"开通农村客运班线的农村公路应当同步建设或者设置客运站点设施，方便群众候车。\"\n  }\n]"
- expression: 统计表.配置率 < 1
  description: 凡通客车的农村公路，应按规划配建招呼站或候车亭，配置率=已建站点数/应建站点数，小于1即存在未建设情况。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 通客车农村公路未建设客运站点
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"通客车的农村公路，应当根据需要同步建设农村客运站点（招呼站），并与公路主体工程同步设计、同步施工、同步投入使用。\"\n  }\n]"
