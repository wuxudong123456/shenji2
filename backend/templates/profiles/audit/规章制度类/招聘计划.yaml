name: audit/规章制度类/招聘计划
type: model
description: 从规章制度类类文档（招聘计划）中提取结构化元数据。涵盖字段如：空缺岗位数、计划招聘岗位数。文档范围包括：乡村教师招聘计划等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 招聘计划
  member_count: 1
  member_details:
  - 乡村教师招聘计划
output:
  fields:
  - name: 空缺岗位数
    type: string
    description: 提取 空缺岗位数 的文本值
  - name: 计划招聘岗位数
    type: string
    description: 提取 计划招聘岗位数 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: ((SELECT COUNT(*) FROM 在编/编外教师名册 WHERE 在编/编外教师名册.教师身份 = '编外') / (SELECT COUNT(*) FROM 在编/编外教师名册) > 0.2) AND
    (连续3年 (乡村教师招聘计划.计划招聘岗位数 - 乡村教师招聘计划.实际录用数 > 0))
  description: 当学校存在核定编制空缺，但连续3年未通过公开招聘补充在编教师，且编外教师占比超过20%时，判定为“有编不补”违规。若空缺编制持续超过3年且编外教师长期承担教学任务，触发高风险预警。
  audit_item: 乡村教师队伍建设不符合要求
  suspicion: 长期聘用编外教师且“有编不补”
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于印发乡村教师支持计划（2015—2020年）的通知\",\n    \"法规文号\": \"国办发〔2015〕43号\",\n    \"效力级别\"\
    : \"行政法规\",\n    \"条款号\": \"第三部分第（三）项\",\n    \"内容概述\": \"严禁在有合格教师来源的情况下“有编不补”、长期使用临聘人员。\"\n  }\n]"
