name: audit/规章制度类/方案
type: model
description: 从规章制度类类文档（方案）中提取结构化元数据。涵盖字段如：内设机构职责分工说明。文档范围包括：单位部门职责‘三定’方案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 方案
  member_count: 1
  member_details:
  - 单位部门职责‘三定’方案
output:
  fields:
  - name: 内设机构职责分工说明
    type: string
    description: 提取 内设机构职责分工说明 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (内部管理制度.责任主体描述 != 上级实施方案.牵头部门规定) || (内部管理制度.跨部门协调机制条款 == null && 上级实施方案.协调机制要求 != null) || (ABS(内部管理制度.资金保障条款
    - 上级实施方案.资金配套比例或来源要求) > 0)
  description: 检查内部制度的实施机制是否与上位要求脱节。表达式包含三个判定逻辑，任一满足即认为存在疑点：1.内部制度指定的责任主体与上级文件明确要求的牵头部门不一致；2.上级要求建立跨部门协调机制，但内部制度中缺失相关内容；3.内部制度规定的资金配套比例与上级要求存在差异。
  audit_item: 内控管理制度符合性审计
  suspicion: 内部制度实施保障机制缺失
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强财政预算执行管理的通知\",\n    \"法规文号\": \"财预〔2014〕85号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"相关条款\",\n    \"内容概述\": \"强化预算执行主体责任，建立健全工作协调机制，确保各项政策落实到位。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"各部门、各单位是本部门、本单位的预算执行主体，负责本部门、本单"
