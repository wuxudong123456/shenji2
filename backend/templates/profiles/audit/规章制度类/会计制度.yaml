name: audit/规章制度类/会计制度
type: model
description: 从规章制度类类文档（会计制度）中提取结构化元数据。涵盖字段如：会计账簿设置要求、账簿种类规定。文档范围包括：企业会计制度等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 规章制度类
- 审计
- 元数据提取
template_class:
  category: 规章制度类
  member_types:
  - 会计制度
  member_count: 1
  member_details:
  - 企业会计制度
output:
  fields:
  - name: 会计账簿设置要求
    type: string
    description: 提取 会计账簿设置要求 的文本值
  - name: 账簿种类规定
    type: string
    description: 提取 账簿种类规定 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (备案表.备案账簿种类 NOT IN ('总账','明细账','现金日记账','银行日记账')) || (簿.总账启用记录 IS NULL) || (簿.现金日记账记录 IS NULL) || (簿.银行日记账记录
    IS NULL) || (簿.账簿编码连续性 = '否')
  description: 备案表未包含法定必须设立的账簿种类；或实际未能提供总账、现金日记账、银行存款日记账中的任何一种；或账簿编号出现断号，均视为未按规定设置会计账簿。三种条件满足其一即触发疑点。
  audit_item: 违反会计管理规定的行为
  suspicion: 未按规定设置会计账簿
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第十五条、第四十二条第一款\",\n    \"内容概述\": \"各单位必须依法设置会计账簿，并保证其真实、完整。不依法设置会计账簿的，由县级以上人民政府财政部门予以处罚。\"\n  }\n]"
