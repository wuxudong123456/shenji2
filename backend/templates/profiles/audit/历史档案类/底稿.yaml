name: audit/历史档案类/底稿
type: model
description: 从历史档案类类文档（底稿）中提取结构化元数据。涵盖字段如：专家复核意见、估计依据、公允价值、内部交易成本抵销金额、内部交易收入抵销金额、内部债权债务抵销金额、参数来源说明、发现的主要问题。文档范围包括：代编决算数据的工作底稿、动态因素调整测算底稿、合并工作底稿、复核工作底稿、审计工作底稿、截留挪用专项检查工作底稿、监督检查原始底稿、绩效评价工作底稿、资产减值测试底稿、预计负债测算底稿等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 历史档案类
- 审计
- 检查
- 金额
- 元数据提取
template_class:
  category: 历史档案类
  member_types:
  - 底稿
  member_count: 1
  member_details:
  - 代编决算数据的工作底稿
  - 动态因素调整测算底稿
  - 合并工作底稿
  - 复核工作底稿
  - 审计工作底稿
  - 截留挪用专项检查工作底稿
  - 监督检查原始底稿
  - 绩效评价工作底稿
  - 资产减值测试底稿
  - 预计负债测算底稿
output:
  fields:
  - name: 专家复核意见
    type: string
    description: 提取 专家复核意见 的文本值
  - name: 估计依据
    type: string
    description: 提取 估计依据 的文本值
  - name: 公允价值
    type: string
    description: 提取 公允价值 的文本值
  - name: 内部交易成本抵销金额
    type: number
    description: 提取 内部交易成本抵销金额 的数值（含单位，如万元、吨等）
  - name: 内部交易收入抵销金额
    type: number
    description: 提取 内部交易收入抵销金额 的数值（含单位，如万元、吨等）
  - name: 内部债权债务抵销金额
    type: number
    description: 提取 内部债权债务抵销金额 的数值（含单位，如万元、吨等）
  - name: 参数来源说明
    type: string
    description: 提取 参数来源说明 的文本值
  - name: 发现的主要问题
    type: string
    description: 提取 发现的主要问题 的文本值
  - name: 受益对象名单
    type: string
    description: 提取 受益对象名单 的文本值
  - name: 可收回金额
    type: number
    description: 提取 可收回金额 的数值（含单位，如万元、吨等）
  - name: 合并范围判断底稿
    type: string
    description: 提取 合并范围判断底稿 的文本值
  - name: 对应事项的审定金额
    type: number
    description: 提取 对应事项的审定金额 的数值（含单位，如万元、吨等）
  - name: 底稿中金额单位标记
    type: number
    description: 提取 底稿中金额单位标记 的数值（含单位，如万元、吨等）
  - name: 建议措施
    type: string
    description: 提取 建议措施 的文本值
  - name: 引用数据源
    type: string
    description: 提取 引用数据源 的文本值
  - name: 是否提出建议
    type: boolean
    description: 提取 是否提出建议 的布尔值（是/否）
  - name: 核实状态标记
    type: boolean
    description: 提取 核实状态标记 的布尔值（是/否）
  - name: 核查意见
    type: string
    description: 提取 核查意见 的文本值
  - name: 检查日期
    type: date
    description: 提取 检查日期 的日期值，格式 YYYY-MM-DD
  - name: 法规索引
    type: string
    description: 提取 法规索引 的文本值
  - name: 测算公式
    type: string
    description: 提取 测算公式 的文本值
  - name: 测算方法
    type: string
    description: 提取 测算方法 的文本值
  - name: 测算过程及调整依据
    type: string
    description: 提取 测算过程及调整依据 的文本值
  - name: 测试结论
    type: string
    description: 提取 测试结论 的文本值
  - name: 纳入合并的实体清单
    type: string
    description: 提取 纳入合并的实体清单 的文本值
  - name: 线索记录
    type: string
    description: 提取 线索记录 的文本值
  - name: 计提金额
    type: number
    description: 提取 计提金额 的数值（含单位，如万元、吨等）
  - name: 计算假设
    type: string
    description: 提取 计算假设 的文本值
  - name: 计算过程底稿
    type: string
    description: 提取 计算过程底稿 的文本值
  - name: 调查问卷统计结果
    type: boolean
    description: 提取 调查问卷统计结果 的布尔值（是/否）
  - name: 资金拨付记录
    type: string
    description: 提取 资金拨付记录 的文本值
  - name: 问题编号
    type: string
    description: 提取 问题编号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: (计算过程底稿.引用数据源 == true || 调整批复文件.无法提供所属单位基础财务资料) && (代编数据 与 该单位去年同期数 或 调整批复文件.年初预算批复数 存在简单线性关系 【例如：代编金额 == 调整批复文件.年初预算批复数
    * 100%】)
  description: 当一个所属单位的决算数据是由主管部门代编时，审计需检查其依据是否充分。若工作底稿中引用的数据源不是该单位实际发生的凭证、账簿，而是主观估计、行政计划数，或者直接用年初预算数、去年同期数乘以一个系数来充当决算数，都属于无依据估列。这种做法用“算出来”的决算代替了“做出来”的决算。
  audit_item: 决算报表内容不真实
  suspicion: 无依据估列代编所属单位决算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当对预算支出情况开展绩效评价。……应当真实、准确、完整地反映各项收支。\"\n  },\n  {\n    \"法规名称\": \"部门决算管理制度\",\n\
    \    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第十条、第十七条\",\n    \"内容概述\": \"基层预算单位应当按照财政部门、上级主管部门的管理要"
- expression: (流水.交易金额 > 100000 && (流水.收款方 IN (个人账户, 疑似关联企业) || 流水.摘要 NOT LIKE '%上缴%' )) || (明细表.处置收入 + 出借台账.实收租金 - 流水.收款账户
    > 0.05 * (明细表.处置收入 + 出借台账.实收租金) ) || (合同.合同乙方 != 流水.付款方 && 流水.收入金额)
  description: 识别隐藏、截留、挪用行为的特征：大额资金（>10万元）流入个人或关联企业账户；实际收入台账金额与银行账户入账总额差异超过5%；合同签订方与银行回款方不一致且资金未进入单位正规账户。任一条件触发即列为疑点。
  audit_item: 国有资产收入管理不合规
  suspicion: 隐瞒截留挪用国有资产收入行为
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"国有资产收入应当按照政府非税收入管理规定及时足额上缴国库，严禁截留、挪用。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n  \
    \  \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条、第六条\",\n    \"内容概述\": \"对隐瞒、截留、挪用应当上缴的财政收入等行为，责令改正，追回资金"
- expression: (评价报告.受益人数 - 底稿.受益对象名单) / 底稿.受益对象名单 > 0.1 || (评价报告.任务完成情况 - 对比表.实际完成值) > 0.1 || (评价报告.满意度评分 > 90 && 底稿.调查问卷统计结果
    > 20)
  description: 评价报告数据与原始底稿数据偏差超过10%，或满意度评分与投诉率存在逻辑矛盾，即判定疑点。受益人数虚增、完成率篡改、满意度虚高均视为不真实。
  audit_item: 财政转移支付资金政策绩效评价不规范
  suspicion: 绩效评价结果数据不真实不准确
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"绩效评价结果应当客观、公正、准确、完整，不得弄虚作假。\"\n  }\n]"
- expression: (({调整前后因素名称、权重值、调整原因、审批记录.调整原因} IS NULL || {调整前后因素名称、权重值、调整原因、审批记录.审批记录} IS NULL) && ABS({调整前后因素名称、权重值、调整原因、审批记录.权重值}
    - {调整前后因素名称、权重值、调整原因、审批记录.权重值})/{调整前后因素名称、权重值、调整原因、审批记录.权重值} > 0.1) || ({不同处室/地区对同一项目的口径定义.不同处室/地区对同一项目的口径定义} != {各年度规定因素、口径、权重.口径})
    || ({各年度规定因素、口径、权重} 对比同类型项目同一因素权重差异 > 20% && 无政策文
  description: 权重调整缺乏原因或审批且变化率超过10%视为随意变更；不同单位对同一事项口径定义不一致，导致分配不公；历年同类项目相同因素权重波动超过20%且无政策依据，判定为政策执行不一致。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 分配因素、口径、权重随意变更不一致
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十五条\",\n    \"内容概述\": \"专项转移支付预算分配应按规定因素和权重执行，不得擅自变更；确需调整的，应报经批准。\"\n  }\n]"
- expression: ABS(评估值 - 同行业同类资产市场均价) > 0.2 || (评估报告中关键参数（折现率、成新率、可比案例） < 0.06 或 > 0.15) || (资产名称包含无形资产 AND 评估方法未采用收益法) ||
    (分析表.偏差率 > 0.3)
  description: 通过设定量化阈值识别评估结果异常。评估增值率偏离行业均值超过20个百分点，或折现率取值超出市场惯例区间，或无形资产未采用收益法，或同类资产单价差异超过30%，均视为失实疑点。
  audit_item: 违反国有资产评估相关规定
  suspicion: 国有资产评估结果严重失实
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国资产评估法\",\n    \"法规文号\": \"中华人民共和国主席令第46号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十条、第三十二条\",\n    \"内容概述\": \"第二十条：评估机构应当依法独立、客观、公正开展业务，建立健全质量控制制度，保证评估报告的真实性、合法性和合理性。第三十二条：委托人或者评估报告使用人应当按照法律规定和评估报告载明的使用范围使用评估报告。\"\
    \n  },\n  {\n    \"法规名称\": \"企业国有资产评估管理暂行办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第12号\",\n   "
- expression: 固定资产卡片台账.使用状态 = '闲置' || 产能利用率统计表.利用率 < 0.3 && (固定资产卡片台账.净值 - 资产减值测试底稿.可收回金额) > 0 && 资产减值测试底稿.测试结论 != '已计提减值准备'
  description: 对于已明确闲置或连续12个月产能利用率不足30%的固定资产，若其账面净值高于可收回金额且企业未计提任何减值准备，表明存在资产价值虚增、粉饰财务状况的问题。
  audit_item: 企业经营资产分析
  suspicion: 固定资产闲置未计提减值造成资产虚增
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第8号——资产减值\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条、第六条\",\n    \"内容概述\": \"企业应当在资产负债表日判断资产是否存在可能发生减值的迹象，存在减值迹象的，应当估计其可收回金额，并计提相应的资产减值准备。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n    \"内容概述\": \"\
    各单位不得虚列资产、"
- expression: (合并范围内子公司名单、未纳入合并范围的被投资单位清单及原因说明.包含(子公司) && 持股比例、表决权比例、重大事项决策条款（如一致同意、否决权）.持股比例 >= 0.5 && (持股比例、表决权比例、重大事项决策条款（如一致同意、否决权）.重大事项决策条款（如一致同意、否决权）
    = '全体股东一致同意' || 实际控制权评估文件.母公司委派董事人数 < 0.5))
  description: 持股比例≥50%视为名义控制，但需结合董事会席位和决策条款判断实质控制。若章程规定重大经营决策需全体股东一致同意或母公司委派董事未过半数，则母公司无法单方面控制，不应合并。触发条件：上述条件同时满足。
  audit_item: 未按规定编制合并财务报表
  suspicion: 将无实际控制权的公司纳入合并范围
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第33号——合并财务报表\",\n    \"法规文号\": \"财会〔2014〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第七条、第八条\",\n    \"内容概述\": \"合并财务报表的合并范围应当以控制为基础予以确定。控制是指投资方拥有对被投资方的权力，通过参与被投资方的相关活动而享有可变回报，并且有能力运用对被投资方的权力影响其回报金额。\"\
    \n  }\n]"
- expression: ((子公司持股比例变动记录 >= 0.5 && 收购日期 <= 资产负债表日 - 1 && !合并范围内子公司名单.该实体) || (协议控制条款 && !合并范围内子公司名单.该实体))
  description: 判断实际控制的标准：持股比例达到50%以上且购买日在报告年度内，或者虽无直接持股但通过协议安排（如VIE、一致行动人）能够控制，均应纳入合并范围。若未纳入，则违规。
  audit_item: 未按规定编制合并财务报表
  suspicion: 未将具有实际控制权的公司纳入合并范围
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第33号——合并财务报表\",\n    \"法规文号\": \"财会〔2014〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第七条、第十三条\",\n    \"内容概述\": \"母公司应当将其控制的所有子公司（包括基于协议控制等）纳入合并财务报表。合并范围应当以控制为基础确定，不得故意遗漏。\"\n  }\n]"
- expression: (明细表.交易类型 = '内部销售' && 底稿.内部交易收入抵销金额 < 明细表.交易金额 * 0.99) || (对账记录.期末应收关联方余额 != 对账记录.期末应付关联方余额)
  description: 关联交易抵销必须完全消除内部交易对合并报表的影响。内部销售收入抵销金额不足原交易金额99%的视为未全额抵销（考虑小额差异）。内部往来款项若存在对账不一致且未调整，表明抵销不完整。
  audit_item: 未按规定编制合并财务报表
  suspicion: 母公司与子公司间关联交易未全额抵销
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第33号——合并财务报表\",\n    \"法规文号\": \"财会〔2014〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
