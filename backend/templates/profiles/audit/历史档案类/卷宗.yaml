name: audit/历史档案类/卷宗
type: model
description: 从历史档案类类文档（卷宗）中提取结构化元数据。涵盖字段如：侵权案件品种、处罚事由、处罚决定、处罚决定书、处罚决定书编号、当事人、执法视频记录保存情况、执行情况。文档范围包括：历年种子违法案件卷宗、土地违法案件处理卷宗、林业行政执法处罚卷宗、案件卷宗、渔政执法部门案件卷宗、理赔案件卷宗等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 历史档案类
- 审计
- 金额
- 元数据提取
template_class:
  category: 历史档案类
  member_types:
  - 卷宗
  member_count: 1
  member_details:
  - 历年种子违法案件卷宗
  - 土地违法案件处理卷宗
  - 林业行政执法处罚卷宗
  - 案件卷宗
  - 渔政执法部门案件卷宗
  - 理赔案件卷宗
output:
  fields:
  - name: 侵权案件品种
    type: string
    description: 提取 侵权案件品种 的文本值
  - name: 处罚事由
    type: string
    description: 提取 处罚事由 的文本值
  - name: 处罚决定
    type: string
    description: 提取 处罚决定 的文本值
  - name: 处罚决定书
    type: string
    description: 提取 处罚决定书 的文本值
  - name: 处罚决定书编号
    type: string
    description: 提取 处罚决定书编号 的文本值
  - name: 当事人
    type: string
    description: 提取 当事人 的文本值
  - name: 执法视频记录保存情况
    type: string
    description: 提取 执法视频记录保存情况 的文本值
  - name: 执行情况
    type: string
    description: 提取 执行情况 的文本值
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 文书编号
    type: string
    description: 提取 文书编号 的文本值
  - name: 是否涉及阻挠执法
    type: boolean
    description: 提取 是否涉及阻挠执法 的布尔值（是/否）
  - name: 查勘定损报告
    type: string
    description: 提取 查勘定损报告 的文本值
  - name: 查处结果
    type: boolean
    description: 提取 查处结果 的布尔值（是/否）
  - name: 案件发生主体
    type: string
    description: 提取 案件发生主体 的文本值
  - name: 案件类型
    type: string
    description: 提取 案件类型 的文本值
  - name: 沟通记录
    type: string
    description: 提取 沟通记录 的文本值
  - name: 涉案主体
    type: string
    description: 提取 涉案主体 的文本值
  - name: 涉案土方量
    type: string
    description: 提取 涉案土方量 的文本值
  - name: 涉案工具
    type: string
    description: 提取 涉案工具 的文本值
  - name: 涉案树木种类
    type: string
    description: 提取 涉案树木种类 的文本值
  - name: 立案日期
    type: date
    description: 提取 立案日期 的日期值，格式 YYYY-MM-DD
  - name: 罚款金额及复垦要求
    type: number
    description: 提取 罚款金额及复垦要求 的数值（含单位，如万元、吨等）
  - name: 违法主体
    type: string
    description: 提取 违法主体 的文本值
  - name: 违法事实
    type: string
    description: 提取 违法事实 的文本值
  - name: 违法事实描述
    type: string
    description: 提取 违法事实描述 的文本值
  - name: 违法行为
    type: string
    description: 提取 违法行为 的文本值
  - name: 违法面积
    type: string
    description: 提取 违法面积 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
violations:
- expression: 专项指标批复面积、用途、用地主体.用途=='帮扶产业'(实际供地面积、实际土地使用者、实际建设用途、宗地界址点坐标、审批时间.实际土地使用者 不在 企业名称、帮扶产业类型、统一社会信用代码、应参保企业总数内 || 实际供地面积、实际土地使用者、实际建设用途、宗地界址点坐标、审批时间.实际建设用途
    !='产业类')
  description: 当批准的专项用地指标被非帮扶产业名录内的企业使用，或者土地虽然划拨给帮扶企业，但实际建设的项目并非农产品加工、仓储、冷链等对口产业，而是用于商品房、商业综合体等非农开发时，判定为违规挪用用地指标。
  audit_item: 帮扶产业配套支持政策不够精准有效
  suspicion: 帮扶专项用地指标被违规挪用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十四条、第六十二条\"\
    ,\n    \"内容概述\": \"涉及农用地转为建设用地的，应当办理农用地转用审批手续。建设占用土地，应当符合土地利用总体规划和用途管制要求。\"\n  }\n]"
- expression: (审批文件.项目规划坐标 ∩ 基本农田保护图斑、地块编号、保护面积、永久基本农田图斑坐标、面积、保护期限、基本农田图斑面积及边界.永久基本农田图斑坐标).面积 > 0 && 审批文件.农用地转用批复文号 = NULL
  description: 项目用地与永久基本农田图斑存在空间重叠且未取得合法农用地转用手续，即构成严重违规；涉及耕地红线，面积即使很小也触发疑点。
  audit_item: 村容村貌整体提升不符合相关规定
  suspicion: 占用耕地及永久基本农田违规绿化造林
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第四十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十七条、第四十四条\",\n    \"内容概述\": \"非农业建设必须节约使用土地，禁止占用耕地建窑、建坟或者擅自在耕地上建房、挖砂、采石、采矿、取土等；建设占用土地，涉及农用地转为建设用地的，应当办理农用地转用审批手续。\"\n\
    \  },\n  {\n    \"法规名称\": \"基本农田保护条例\",\n    \"法规文号\": \"国务院令第257号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十七条\"\
    ,\n   "
- expression: 采购清单.采购苗木名称 含 '古树' || 采购清单.规格（胸径、树龄） > 30cm && 记录文件.采挖许可证编号 = NULL || 名录.古树名木编号 出现在 采购清单.供货方中
  description: 采购苗木中包含古树名木直接违规；胸径超过30厘米的大树采挖移植若无审批手续视为违规；古树名木名录中的树木被用于绿化项目，无论有无审批均属非法，因古树严禁采挖。
  audit_item: 村容村貌整体提升不符合相关规定
  suspicion: 违规采挖移植天然大树古树名木
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国森林法\",\n    \"法规文号\": \"主席令第三十九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十条、第七十六条\",\n    \"内容概述\": \"禁止采伐、采挖古树名木；采挖移植非古树名木的大树，必须符合有关规定并办理审批手续；非法采挖、移植的，由林业主管部门责令停止违法行为，限期恢复植被或补种树木，并处罚款。\"\n\
    \  },\n  {\n    \"法规名称\": \"中华人民共和国野生植物保护条例\",\n    \"法规文号\": \"国务院令第204号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十六条\","
- expression: (理赔记录.结案日期 - 理赔记录.出险报案日期) > 规定.法定最长理赔周期 || (理赔台账.赔款支付日期 - 理赔台账.定损完成日期) > 10个工作日
  description: 从农户报案到保险公司结案或实际支付赔款的时间超过《农业保险条例》规定的“达成赔偿协议后10日内支付”或地方规定的整体时限（如60天），构成理赔延迟。
  audit_item: 相关支持政策落实不到位
  suspicion: 政策性农业保险理赔严重超时限
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"保险机构应当在与被保险人达成赔偿协议后10日内，将应赔偿的保险金支付给被保险人。\"\n  }\n]"
- expression: (年度检查主体数量 / 辖区登记主体总数) < 1
  description: 依据《农作物种子质量监督抽查管理办法》每年至少进行一次监督抽查的规定，所有登记种子生产经营主体均应在年度内被检查至少一次。覆盖率低于100%即构成监管频次违规。
  audit_item: 种业市场监管方面不符合相关规定
  suspicion: 种业监管检查频次或覆盖率不达标
  regulation: "[\n  {\n    \"法规名称\": \"农作物种子质量监督抽查管理办法\",\n    \"法规文号\": \"农业部令2005年第50号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十条\",\n    \"内容概述\": \"县级以上地方人民政府农业行政主管部门应当根据实际，每年至少进行一次监督抽查。\"\n  }\n]"
- expression: (档案.许可品种名称 IN 品种权证书.品种名称) && (档案.企业名称 NOT IN (品种权证书.品种权人 ∪ 品种权证书.被许可人)) || (抽检台账.DNA指纹检测结果 != 抽检台账.标签标注品种)
  description: 未经品种权人或其授权许可的主体生产授权品种，或实际检测出的品种与标签标注品种不符，均属于套牌侵权。两个条件满足其一即可判定。
  audit_item: 种业市场监管方面不符合相关规定
  suspicion: 种子套牌侵权行为未有效查处
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"中华人民共和国主席令第三十五号（2015年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"任何单位或者个人未经植物新品种权所有人许可，不得生产、繁殖或者销售该授权品种的繁殖材料，不得为商业目的将该授权品种的繁殖材料重复使用于生产另一品种的繁殖材料。\"\
    \n  }\n]"
