name: audit/历史档案类/档案
type: model
description: 从历史档案类类文档（档案）中提取结构化元数据。涵盖字段如：GPS坐标、GPS定位、与管理人员亲属关系标识、个人有关事项报告核查记录、企业名称、伤残等级、供应商名称、供应商股东及高管信息。文档范围包括：企业实际贷款合同档案、伤残等级鉴定档案、农产品电商培训活动档案、厕所改造前后对比档案、古树名木挂牌记录档案、合作供应商背景调查档案、同类项目历史招标档案、地籍档案、处方笺留存档案、安全教育培训档案等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 历史档案类
- 审计
- 人员
- 合同
- 培训
- 审批
- 元数据提取
