violations:
- expression: (党员领导干部个人事项报告表.填报的经商办企业情况 IS NULL OR 党员领导干部个人事项报告表.投资企业名称 NOT CONTAINS 企业名称) AND (工商注册登记信息.股东/发起人姓名及身份证号 = 领导干部身份证号
    OR 工商注册登记信息.法定代表人姓名及身份证号 = 领导干部身份证号) AND (工商注册登记信息.出资比例 > 0) AND (工商注册登记信息.企业状态 = '存续')
  description: 依据个人报告表与工商登记信息比对，如果领导干部未在报告表中申报任何经商办企业记录，但在工商注册登记中直接登记为股东或法定代表人且持股比例大于0，则视为违反规定个人独资或与他人合资合股经商办企业。同时排除企业已注销等状态。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 个人独资或与他人合资合股经办企业
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（一）项\",\n    \"内容概述\": \"违反有关规定从事营利活动，经商办企业的，视情节给予警告直至开除党籍处分。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n\
    \    \"法规文号\": \"主席令第二十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十九条第十六项\",\n    \"内容概述\": \"公务员不得违反有关规定从事或者参与营利性活动，在企业或者其他"
- expression: (变更申请记录.变更理由 == '技术复杂或特殊要求') && (符合资质条件的潜在投标人数量.符合资质条件的潜在投标人数量 >= 5) && (同类项目以往招标方式.同类项目以往招标方式 == '公开招标')
  description: 当申请变更为邀请招标的理由声称“技术复杂，仅有少量潜在投标人”，但审计查询市场显示符合资质的企业数量充足（如≥5家），且同类项目以往均采用公开招标时，判定为虚假理由。阈值5家为审计经验值，可结合具体项目实际情况调整。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 编造虚假理由骗取邀请招标批准
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十一条\",\n    \"内容概述\": \"公开招标应为原则，邀请招标仅限于特殊情况，且需履行批准手续。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\"\
    : \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"明确可以邀请招标的情形，包括技术复杂、只有少量潜在投标人可供选择等，但不得滥用该条款。\""
- expression: 坏账准备计提明细表.本期平均计提比例(按账龄加权) != 上期平均计提比例 && (董事会决议 IS NULL || 董事会决议.批准日期 > 变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE
    '%坏账准备计提比例变更%' && ABS(本期计提金额 - 按上期比例测算的计提金额) / 利润总额 > 0.05
  description: 若坏账准备计提比例发生变动，且影响利润总额超过5%，同时无董事会审批或审批滞后，未在附注中披露时，判定为违规。
  audit_item: 随意变更会计处理方法
  suspicion: 随意变更坏账准备计提比例且未披露
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业不得随意改变费用的确认标准或者计量方法，虚列或者少列费用。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\"\
    : \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条、第四十七条\",\n    \"内容概述\": \"企业应当以预期信用损失为基础计提坏账准备，会计政策变更"
- expression: （项目综合应急预案.编制日期 IS NULL） || （DATEDIFF(当前检查日期, 项目综合应急预案.编制日期) > 365 且 版本号 未更新） || （应急演练计划 为空 或 应急演练计划.计划时间 已过期且
    演练记录及评估报告 无对应记录） || （应急演练记录及评估报告 记录的演练类型 未覆盖 专项应急预案.预案类型 且 年度内至少一次）
  description: 判定规则：1）无应急预案文本；2）预案超过一年未评估更新，环境变化后预案失效；3）未制定年度演练计划或计划过期未执行；4）演练类型未覆盖主要事故风险，如仅有消防演练而缺失坍塌、触电等专项演练。逻辑用||连接任一触发即判违。
  audit_item: 重大工程项目风险预警
  suspicion: 未按规定编制或更新应急预案且未组织演练
