name: audit/政策文件类/确权文件
type: model
description: 从政策文件类类文档（确权文件）中提取结构化元数据。涵盖字段如：地块编号、户主姓名、确权面积。文档范围包括：土地确权文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 确权文件
  member_count: 1
  member_details:
  - 土地确权文件
output:
  fields:
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 户主姓名
    type: string
    description: 提取 户主姓名 的文本值
  - name: 确权面积
    type: string
    description: 提取 确权面积 的文本值
violations:
- expression: (申报面积、核验面积、面积差异率.申报面积 > 确权面积、地块编号、户主姓名.确权面积*1.1) && (发放方式、领取人姓名、补贴类型、金额、发放时间、银行账号、领取人身份证号、户主身份证号、银行账户名称、姓名、身份证号、实际发放金额、户编号、应发金额、实发金额、户名、补贴项目名称、收款人姓名、收款账号、发放日期、发放金额、补贴类别、补贴发放账号、农户姓名、发放账号、收款账户、收款人、受益人姓名、受益人身份证号、补贴金额、申报面积、银行卡号.受益人姓名
    在村干部名单中 || 发放方式、领取人姓名、补贴类型、金额、发放时间、银行账号、领取人身份证号、户主身份证号、银行账户名称、姓名、身份证号、
  description: 申报面积超过确权面积10%以上且多出的补贴资金汇入村干部或同一人控制的多个银行卡，且补贴到账后短期内被集中取现或转入村干部账户的，判定为虚报面积骗取补贴。村干部独自或假借农户名义虚增面积，将套取资金归集至个人控制账户。
  audit_item: 监管不到位，惠农补贴资金被套取骗取、违规使用
  suspicion: 村集体虚报面积假借农户名义骗补耕地地力保护补贴
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二百六十六条\"\
