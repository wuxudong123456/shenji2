name: audit/政策文件类/承诺文件
type: model
description: 从政策文件类类文档（承诺文件）中提取结构化元数据。涵盖字段如：各问题是否纳入整改范围、地方承诺配套金额及到位时间、实际划拨金额与日期、对应问题编号、承诺到位时限、承诺退赔金额及方式、承诺配套金额、承诺金额。文档范围包括：地方建设资金承诺文件、地方财政配套资金承诺文件、地方配套资金承诺文件、被审计单位承诺文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 整改
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 承诺文件
  member_count: 1
  member_details:
  - 地方建设资金承诺文件
  - 地方财政配套资金承诺文件
  - 地方配套资金承诺文件
  - 被审计单位承诺文件
output:
  fields:
  - name: 各问题是否纳入整改范围
    type: boolean
    description: 提取 各问题是否纳入整改范围 的布尔值（是/否）
  - name: 地方承诺配套金额及到位时间
    type: date
    description: 提取 地方承诺配套金额及到位时间 的日期值，格式 YYYY-MM-DD
  - name: 实际划拨金额与日期
    type: date
    description: 提取 实际划拨金额与日期 的日期值，格式 YYYY-MM-DD
  - name: 对应问题编号
    type: string
    description: 提取 对应问题编号 的文本值
  - name: 承诺到位时限
    type: string
    description: 提取 承诺到位时限 的文本值
  - name: 承诺退赔金额及方式
    type: number
    description: 提取 承诺退赔金额及方式 的数值（含单位，如万元、吨等）
  - name: 承诺配套金额
    type: number
    description: 提取 承诺配套金额 的数值（含单位，如万元、吨等）
  - name: 承诺金额
    type: number
    description: 提取 承诺金额 的数值（含单位，如万元、吨等）
  - name: 配套到位时间节点
    type: date
    description: 提取 配套到位时间节点 的日期值，格式 YYYY-MM-DD
  - name: 问题编号
    type: string
    description: 提取 问题编号 的文本值
violations:
- expression: (承诺配套金额 / 承诺配套金额 < 1) || (承诺配套金额 < 规定地方配套比例或最低配套额度要求) || (配套到位时间节点 > 180)
  description: 地方财政部门实际拨入农家书屋专户的配套资金占承诺金额的比例不足100%，或未达到上级政策文件规定的最低配套标准，或资金拨付时间严重滞后（超过承诺节点半年以上），即构成配套不到位。
  audit_item: 农家书屋建设运营管护不符合相关规定
  suspicion: 地方农家书屋配套资金不到位
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程实施意见\",\n    \"法规文号\": \"新出联〔2007〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第五条\",\n    \"内容概述\": \"各地要结合实际切实落实农家书屋工程建设所需资金，确保地方配套资金足额到位，鼓励多渠道筹集资金。\"\n  }\n]"
- expression: (SUM(进度表.实际到位金额) < 承诺金额.承诺金额) || (进度表.到位日期 > 承诺金额.承诺到位时限)
  description: 按项目汇总实际到位资金总额，与资金承诺文件中的承诺金额比较，金额不足或最迟一笔资金到账日期晚于承诺时限，均判定为违规。到位率低于100%或存在任何一笔延迟视为可疑。
  audit_item: 投资计划分解下达不合规
  suspicion: 地方配套建设资金未按时足额到位
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十四条\"\
    ,\n    \"内容概述\": \"政府投资项目所需资金应当按照国家有关规定确保落实到位，不得由施工单位垫资建设。\"\n  }\n]"
- expression: (中央与地方财政投入对比表.地方实际到位金额 / 中央与地方财政投入对比表.(中央实际到位金额+地方实际到位金额) < 0.3) || (中央与地方财政投入对比表.地方资金到位时间 - 中央与地方财政投入对比表.中央资金首笔拨付时间
    > 730)
  description: 地方配套资金到位比例低于总投入的30%，反映地方财政投入严重不足，过度依赖中央资金；地方配套资金到位时间滞后于中央首笔资金拨付时间超过2年（730天），表明地方承诺资金配套严重失信，影响项目正常实施进度。
  audit_item: 黑土地保护治理缺少持续性，后期管护不到位
  suspicion: 地方配套资金投入严重不足且拨付滞后
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"地方政府应当将上级政府提前下达的转移支付预计数编入本级预算，地方预算必须完整反映上级各项补助收入，并确保配套资金的足额安排。\"\n  },\n  {\n    \"法规名称\"\
    : \"黑土地保护利用规划等相关政策文件\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"通常按项目资金管理办法规定\",\n    \"内容概述\"\
    : \"地方财政"
