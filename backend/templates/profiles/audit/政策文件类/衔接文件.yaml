name: audit/政策文件类/衔接文件
type: model
description: 从政策文件类类文档（衔接文件）中提取结构化元数据。涵盖字段如：规划户均配变容量目标值、规划项目清单及完成时限。文档范围包括：农村电网规划与能源发展规划衔接文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 衔接文件
  member_count: 1
  member_details:
  - 农村电网规划与能源发展规划衔接文件
output:
  fields:
  - name: 规划户均配变容量目标值
    type: string
    description: 提取 规划户均配变容量目标值 的文本值
  - name: 规划项目清单及完成时限
    type: string
    description: 提取 规划项目清单及完成时限 的文本值
violations:
- expression: 区域（行政村）.户均配变容量（kVA） < 2.0
  description: 根据国家要求农村户均配变容量应不低于2kVA（千伏安），低于该阈值即判定为电网供电能力不达标，影响清洁能源接入与电气化水平提升；其中容量低于1.5kVA为严重不足。
  audit_item: 农村用能清洁低碳转型不到位
  suspicion: 农村户均配变容量低于国家标准
  regulation: "[\n  {\n    \"法规名称\": \"关于实施新一轮农村电网改造升级工程的意见\",\n    \"法规文号\": \"国办发〔2016〕9号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第二条（主要目标）\",\n    \"内容概述\": \"到2020年，全国农村电网供电可靠率达到99.8%，户均配变容量不低于2千伏安。\"\n  }\n]"
- expression: (项目状态.实际竣工日期 IS NULL OR 项目状态.实际竣工日期 > 项目状态.计划完成日期 + 90天) AND 分析表.负荷增长率 > 10%
  description: 项目未在计划完成日期后90天内竣工且所在区域用电负荷增长率超过10%，表明改造未跟上需求增长。滞后项目越多，网源规划衔接不到位越严重；若超期180天以上且负荷缺口持续扩大，列为重大违规。
  audit_item: 农村用能清洁低碳转型不到位
  suspicion: 农网改造升级项目未按规划期限完成
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2010〕2520号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二十八条\",\n    \"内容概述\": \"项目单位应严格按照批复的建设内容和进度实施，确保按期建成投产。\"\n  }\n]"
