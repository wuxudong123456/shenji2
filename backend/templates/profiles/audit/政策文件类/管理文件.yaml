name: audit/政策文件类/管理文件
type: model
description: 从政策文件类类文档（管理文件）中提取结构化元数据。涵盖字段如：专用账户开户状态、各农户定额水量、各用水户定额水量、禁用农药名单、限用农药名单及使用条件。文档范围包括：定额管理文件、工资保证金专用账户管理文件、禁限用农药名录管理文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 管理文件
  member_count: 1
  member_details:
  - 定额管理文件
  - 工资保证金专用账户管理文件
  - 禁限用农药名录管理文件
output:
  fields:
  - name: 专用账户开户状态
    type: boolean
    description: 提取 专用账户开户状态 的布尔值（是/否）
  - name: 各农户定额水量
    type: string
    description: 提取 各农户定额水量 的文本值
  - name: 各用水户定额水量
    type: string
    description: 提取 各用水户定额水量 的文本值
  - name: 禁用农药名单
    type: string
    description: 提取 禁用农药名单 的文本值
  - name: 限用农药名单及使用条件
    type: string
    description: 提取 限用农药名单及使用条件 的文本值
violations:
- expression: 用水量统计表.各用水户实际用水量 > 定额管理文件.各用水户定额水量 AND 加价记录表.是否有超定额加价记录 = '否'
  description: 存在实际用水量超过定额的情况，但超定额加价收费记录表中无对应加价收费记录，表明未执行超定额累进加价制度。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 未执行农业用水超定额累进加价制度
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"三、建立健全农业水价形成机制（八）\",\n    \"内容概述\": \"实行农业用水定额管理，逐步实行超定额累进加价制度。对超过定额的用水量，要实行累进加价。\"\n  }\n]"
- expression: 奖励清单.奖励对象姓名 NOT IN (用水量统计表.各农户实际用水量及种植面积 WHERE (定额管理文件.各用水户定额水量 - 用水量统计表.各户实际用水量) > 0) OR 奖励清单.节水量 > (定额管理文件.各用水户定额水量
    - 用水量统计表.各户实际用水量)
  description: 列入奖励名单的对象未实际发生节水或节水量不符，或者奖励对象不在实际种植户名单内，表明奖励资金未精准投向实际节水主体。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 节水奖励发放对象不精准
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"四、建立精准补贴和节水奖励机制（六）\",\n    \"内容概述\": \"探索建立节水奖励机制。根据节水量对采取节水措施、调整种植结构节水的规模经营主体、农民用水合作组织和农户给予奖励，提高用水户主动节水的积极性。\"\
    \n  }\n]"
