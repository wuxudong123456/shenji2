name: audit/政策文件类/验收文件
type: model
description: 从政策文件类类文档（验收文件）中提取结构化元数据。涵盖字段如：位置描述、供水规模、保护区范围、净化消毒设施设计清单、功能类型、取水口位置、合同技术标准条款、合同签订日期。文档范围包括：传统村落保护区标志设置验收文件、公路工程竣工验收文件、养老机构房屋竣工验收文件、农村供水工程竣工验收文件、农药包装废弃物贮存设施环保验收文件、净化消毒设施安装验收文件、四类服务验收文件、基地工程项目验收文件、建设合同验收文件、政府采购验收文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 合同
- 验收
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 验收文件
  member_count: 1
  member_details:
  - 传统村落保护区标志设置验收文件
  - 公路工程竣工验收文件
  - 养老机构房屋竣工验收文件
  - 农村供水工程竣工验收文件
  - 农药包装废弃物贮存设施环保验收文件
  - 净化消毒设施安装验收文件
  - 四类服务验收文件
  - 基地工程项目验收文件
  - 建设合同验收文件
  - 政府采购验收文件
  - 文化站验收文件
  - 物流设施建设验收文件
  - 监测设备验收文件
  - 竣工验收文件
  - 返乡创业园建设验收文件
  - 项目竣工验收文件
  - 项目验收文件
  - 验收文件
