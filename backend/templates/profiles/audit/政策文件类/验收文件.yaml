violations:
- expression: (保证金条款约定的项目名称.保证金类型 IN ('履约保证金','质量保证金') AND (审批记录.实际退款日期 - 验收文件.验收合格日期 (工作日)) > 5) OR (未中标且 (审批记录.实际退款日期 -
    中标通知书发出日期 (工作日)) > 5)
  description: 根据法规和优化营商环境要求，履约保证金应在项目验收合格后按约定及时退还，通常不得超5个工作日；未中标供应商的投标保证金应在中标通知书发出后5个工作日内退还。超出上述时限即构成未及时退还，需重点关注长期挂账未退的保证金。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 未按时退还投标或履约保证金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十三条、第四十八条\",\n    \"内容概述\": \"采购人或者采购代理机构应当自中标通知书发出之日起5个工作日内退还未中标供应商的投标保证金，自政府采购合同签订之日起5个工作日内退还中标供应商的投标保证金。履约保证金应在供应商履行完合同约定的义务后，及时退还。\"\
    \n  },\n  {\n    \"法规名称\": \"关于促进政府采购公平竞争优化营商环境的通知\",\n    \"法规文号\": \"财库〔2019〕38号\","
- expression: 竣工验收文件.实际竣工面积 < 建设标准文件.最小建筑面积要求 || 实地测量记录.功能分区独立性检查 != '合格' || 达标自查表.无障碍设施配置情况 != '合格' || 竣工验收文件.消防验收意见 != '合格'
    || 竣工验收文件.污水处理设施合格证明 != '合格'
  description: 以《乡镇卫生院建设标准》及地方具体标准为依据，面积低于标准即构成违规；功能分区缺失直接影响服务能力，属重大缺陷。消防、污水、无障碍设施缺一不可。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 乡镇卫生院/村卫生室业务用房面积或功能分区不达标
  regulation: "[\n  {\n    \"法规名称\": \"乡镇卫生院建设标准\",\n    \"法规文号\": \"建标107-2008\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\":\
    \ \"第十五条、第十九条\",\n    \"内容概述\": \"规定乡镇卫生院业务用房面积指标和功能分区要求，包括门诊、急诊、住院、医技等基本用房设置标准。\"\n  },\n  {\n    \"法规名称\": \"村卫生室管理办法（试行）\"\
    ,\n    \"法规文号\": \"国卫基层发〔2014〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条、第十二条\",\n    \"内容概述\": \"村卫生室应当分设诊断室、治疗"
- expression: (验收文件.设备清单 != 维护记录.采购设备数量) || (TODAY - 维护记录.采购日期 > 设计使用年限*365) || (台账表.漏损率 > 0.2) || (台账表.停水时长 > 48)
  description: 1.设备短缺：实际采购数量少于设计要求；2.设备老化：当前日期减去安装日期超过设计使用年限(如水泵、管网一般为15-20年)；3.损失浪费：漏损率(漏损水量/供水总量)根据行业标准，超过20%为严重漏损；4.供水保障不足：月累计停水时长超过48小时(相当于2天)，视为保障不足。满足任一条件即判定为疑点。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 供水设备短缺老化致供水保障不足
  regulation: "[\n  {\n    \"法规名称\": \"农村饮水安全工程建设管理办法\",\n    \"法规文号\": \"发改农经[2013]2673号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二十一条\",\n    \"内容概述\": \"农村饮水安全工程建成后应落实管理主体，建立健全运行管理制度，保障工程正常运行，确保供水安全。\"\n  },\n  {\n    \"法规名称\": \"\
    城镇供水管网漏损控制及评定标准\",\n    \"法规文号\": \"CJJ92-2016\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"4.2.1\",\n    \"内容概述\": \"\
    城镇供水管网基本漏损率不应"
- expression: (验收文件.工艺流程 而 验收文件.安装数量=0) || (验收文件.设施型号不符合设计要求的加氯能力) || (加药量、余氯检测值、接触时间、设备运行状态.连续3天无运行记录) || (采样时间、检测项目、结果、签字、检测频次、检测方法、检测日期、检测数值、检测人员签名、仪器使用记录、余氯、二氧化氯、菌落总数等消毒剂指标.余氯
    < 0.3mg/L 且 采样时间、检测项目、结果、签字、检测频次、检测方法、检测日期、检测数值、检测人员签名、仪器使用记录、余氯、二氧化氯、菌落总数等消毒剂指标.菌落总数等消毒剂指标 > 100CFU/mL)
  description: 1.设施缺失：设计文件明确要求安装消毒设备但实际未安装；2.设施规格不符：安装的消毒设备处理能力低于设计值；3.运行异常：连续多日没有运行记录，或消毒剂投加量为零；4.消毒效果不达标：出水余氯值低于国家标准的0.3mg/L(氯消毒)且菌落总数超标，说明消毒设施形同虚设。满足任一条件即可判定。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 净化消毒设施未按要求配备
  regulation: "[\n  {\n    \"法规名称\": \"生活饮用水卫生标准\",\n    \"法规文号\": \"GB5749-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"9.3.1\",\n    \"内容概述\": \"生活饮用水必须经过消毒处理，消毒剂余量应符合要求，氯消毒时出厂水游离余氯不应低于0.3mg/L。\"\n  },\n  {\n    \"法规名称\": \"农村饮水安全工程建设管理办法\"\
    ,\n    \"法规文号\": \"发改农经[2013]2673号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"农村饮水安全工程设计应包括净化、消"
- expression: 政府批文 IS NULL || 批文.保护区范围坐标 != 取水口实际缓冲区域 || (取水口投产日期 > 批文.批复日期+365天)
  description: 1.未划定：无政府关于该水源地保护区的正式批文；2.范围不符：在取水口周围应划定的一级、二级保护区范围未按规定(如一级保护区半径30米)落实；3.划定延迟：工程投产后超过一年仍未完成保护区划定，违反法定要求。满足任一条件即判定为违规。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 饮用水水源保护区未依法划定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第六十三条\",\n    \"内容概述\": \"县级以上人民政府应当划定饮用水水源保护区，报省级人民政府批准，并设立明确的地理界标和警示标志。\"\n  },\n  {\n    \"法规名称\": \"饮用水水源保护区污染防治管理规定\"\
    ,\n    \"法规文号\": \"国家环境保护局、卫生部、建设部、水利部、地矿部（89）环管字第201号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    "
- expression: (清单表.距取水口距离 < 保护区法定最小距离) || (排查报告.污染源整治状态='未整治' 且 距离取水口 < 500米) || (存在工业排污口且验收文件.处理工艺是否针对特定污染物未包含相应深度处理)
  description: 1.保护区内违规存在污染源：如养殖场、工厂排污口、垃圾填埋场等位于一级或二级保护区内；2.已知污染风险长期未整治：排查报告中标记为需整治但状态为未整改；3.工艺适应不足：存在特殊污染物(如重金属、氟化物)但净水工艺仅为常规处理，无法有效去除。满足任一条件即存在污染风险。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 水源保护区存在污染风险未整治
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第六十五条\",\n    \"内容概述\": \"禁止在饮用水水源一级保护区内新建、改建、扩建与供水设施和保护水源无关的建设项目；已建成的，由县级以上人民政府责令拆除或者关闭。\"\n  },\n  {\n    \"\
    法规名称\": \"饮用水水源保护区污染防治管理规定\",\n    \"法规文号\": \"（89）环管字第201号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"\
    内容概述\""
- expression: 许可证 IS NULL || 许可证.有效期 < TODAY || 许可证.许可范围 NOT IN ('集中式供水','生活饮用水供应') || 供水规模与许可证登记规模不符
  description: 1.无证经营：无法提供有效的卫生许可证；2.许可证过期：当前日期超过证书有效期截止日；3.超范围经营：许可证未明确包括集中式供水，或登记的供水规模小于实际规模；4.证件与实体不符。满足任一条件即违规。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 集中式供水单位无有效卫生许可证
  regulation: "[\n  {\n    \"法规名称\": \"生活饮用水卫生监督管理办法\",\n    \"法规文号\": \"卫生部令第53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"集中式供水单位必须取得县级以上地方人民政府卫生行政部门签发的卫生许可证，方可供水。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国行政许可法\",\n\
    \    \"法规文号\": \"主席令第7号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第八十一条\",\n    \"内容概述\": \"公民、法人或者其他组织未经行政许可，擅自从事依法应当取得行政许可的活动的，"
- expression: (验收文件.规划用途 = '养老服务设施' || 土地证.土地性质 = '社会福利') && (登记表.实际用途 != '养老服务' && 登记表.实际用途 != '配套办公') && (审批表 IS NULL OR
    审批表.审批结果 != '同意')
  description: 原规划用途为养老服务设施，实际用途变为非养老服务（如出租商业、仓储、餐饮），且未取得合法用途变更审批，即构成违规改变房屋用途。若存在审批但审批流程不合规（如越权审批）也属违规。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 违规改变农村养老机构房屋用途
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第三十三条\",\n    \"内容概述\": \"养老机构应当依法保障收住老年人的合法权益，未经批准不得擅自改变养老服务设施的使用性质。任何组织或者个人不得侵占、挪用或者擅自拆除养老服务设施。\"\n  }\n]"
- expression: COUNT(网点名称、位置、服务能力、是否共享[是否共享="是"])/COUNT(网点名称、位置、服务能力、是否共享) < 0.5 OR 签约方.协议中共享条款内容 NOT IN ("共享","共用","协同") OR
    政策文件类-验收文件-设施位置坐标、功能类型、验收规模.设施位置坐标距离 < 500 AND 政策文件类-验收文件-设施位置坐标、功能类型、验收规模.功能类型相同 OR 各企业分摊费用、共配线路节省比例.各企业分摊费用 < 各企业分摊费用、共配线路节省比例.共配线路节省比例
  description: 共享网点占比低于50%判定为共享不足；合作协议缺失共享条款或未明确仓储配送网络共享，表明机制未建立；同一区域500米内存在同类设施视为重复建设；物流成本分摊未体现共配效益（降幅<10%）说明共享未实际运营。以上任一条件满足即触发疑点。
  audit_item: 农村电子商务发展不到位
  suspicion: 农村物流服务网络及设施未实现共享
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进电子商务与快递物流协同发展的意见\",\n    \"法规文号\": \"国办发〔2018〕1号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三（五）\",\n    \"内容概述\": \"推动快递物流园区建设，实现仓储、配送设施资源共享，避免重复建设。\"\n  }\n]"
- expression: (检查记录.检查日期 距当前日期 > 365天 或 检查记录.检查记录为空) && (统计表.实际回收率 < 0.3) || (记录表.整改状态 = '未完成' 且 验收文件.验收结论 != '通过')
  description: 主管部门最近一年内未开展现场检查且辖区回收率低于30%；或对已发现的环境安全隐患未督促完成整改、贮存设施未通过验收仍投入使用，均视为监管责任未履行。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 主管部门未依规履行农药包装废弃物回收处理监管责任
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第五条\",\n    \"内容概述\": \"县级以上地方人民政府农业主管部门负责本行政区域内的农药监督管理工作，应依法对本地区农药生产、经营、使用进行监督管理。\"\n  }\n]"
- expression: (验收文件.验收结论 != '通过' 或 验收文件 缺失) && (记录表.发现问题描述 包含 '防渗漏' 或 '未分类') || (数据表.泄漏记录次数 > 0) || (检查记录.针对贮存隐患的整改要求及闭环状态
    包含 '贮存' 且 记录表.整改状态 = '未完成')
  description: 贮存设施未经环保验收合格便投入使用，或检查中发现未采取防渗漏、分类存放等基本防护措施，或监测数据出现泄漏且未有效整改，均认定为未妥善保存，存在污染隐患。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 回收的农药包装废弃物未能妥善保存
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国固体废物污染环境防治法》\",\n    \"法规文号\": \"主席令第四十三号（2020年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第八十一条\",\n    \"内容概述\": \"收集、贮存危险废物，应当按照危险废物特性分类进行，并采取符合国家环境保护标准的防护措施，禁止混合贮存不相容的危险废物。\"\n  }\n]"
- expression: (竣工验收日期.移交协议签署日期 - 竣工验收日期.竣工验收日期) > 30 || 移交协议缺失 || 资质等级.管护单位资质等级 < 项目要求资质等级
  description: 按照规定农村公路竣工验收后30日内必须完成移交。若间隔天数超过30天、移交协议未签署或管护单位不具备相应养护资质，均构成移交程序违规，造成管护责任悬空。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 农村公路建成后未及时移交管护单位
  regulation: "[\n  {\n    \"法规名称\": \"农村公路养护管理办法\",\n    \"法规文号\": \"交通运输部令2015年第22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"农村公路建设项目竣工验收后，应及时移交养护管理单位，办理交接手续，明确管护责任。\"\n  }\n]"
- expression: 移交清单.延迟天数 > 30 或 竣工验收日期.移交协议签署日期 IS NULL
  description: 依据规定，农村公路竣工验收后30日内应移交管护单位。延迟天数超过30天或未签署移交协议，即构成未按时移交。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 农村公路建成后未及时移交管护单位
  regulation: "[\n  {\n    \"法规名称\": \"农村公路养护管理办法\",\n    \"法规文号\": \"交通运输部令2020年第12号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"农村公路建设项目竣工验收后，应当按照有关规定及时移交管养。\"\n  }\n]"
- expression: (验收文件.竣工日期 IS NOT NULL) AND (评价报告.报告名称 IS NULL OR DATEDIFF(DAY, 验收文件.竣工日期, 评价报告.报告编制时间) > 180)
  description: 项目已竣工验收但无对应绩效评价报告，或报告出具日期晚于竣工日期180天以上，即视为未按规定开展绩效评价工作。180天为常见制度要求期限，可依据具体规定调整。
  audit_item: 资金绩效管理不到位
  suspicion: 项目完成后未开展绩效评价
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十一条、第二十一条\",\n    \"内容概述\": \"项目支出绩效评价应于项目执行完毕后按规定及时开展；部门和单位应组织对项目绩效目标实现情况进行自评，并出具绩效自评报告。\"\n  }\n]"
- expression: 村落.村落名称 NOT IN (SELECT 村落名称 FROM 村落名称标志设置状态验收日期位置描述标志内容 WHERE 标志设置状态 = '已设置' AND 标志内容包含保护要求信息)
  description: 已列入传统村落名录的村落，均应在主要出入口设置标志牌，并载明保护要求。凡未设置或标志内容缺失保护要求，直接判定违规。
  audit_item: 违反传统村落保护相关政策的行为
  suspicion: 未按规定设置传统村落保护区标志
  regulation: "[\n  {\n    \"法规名称\": \"《历史文化名城名镇名村保护条例》\",\n    \"法规文号\": \"国务院令第524号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二十条\",\n    \"内容概述\": \"城市、县人民政府应在历史文化街区、名镇、名村核心保护范围的主要出入口设置标志牌，记载名称、保护范围、保护责任人等信息。\"\n  }\n]"
- expression: (ABS(汇总表.上报数据 - 汇总表.原始数据记录) / 汇总表.原始数据记录 > 0.1) OR (汇总表.监测时间 < 标准文件.规定的监测频次与指标要求 * 0.8) OR (缺失关键指标(汇总表.监测指标)的汇总表.监测时间占比
    > 0.2) OR (资质证书.证书有效期 < 汇总表.监测时间)
  description: 上报数据与系统原始数据偏差超过10%、监测频次不足标准的80%、总磷/总氮等核心指标缺失率超过20%、监测人员无证上岗，任一条件均构成监测违规。
  audit_item: 污水治理项目建设、运营、管护不到位
  suspicion: 污水处理厂水质监测数据造假或监测不规范
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十三条\",\n    \"内容概述\": \"重点排污单位应当安装自动监测设备，与生态环境主管部门监控设备联网，保证监测设备正常运行，监测数据应当真实准确，严禁篡改、伪造。\"\n  }\n]"
