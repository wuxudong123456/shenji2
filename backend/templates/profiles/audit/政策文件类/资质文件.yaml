name: audit/政策文件类/资质文件
type: model
description: 从政策文件类类文档（资质文件）中提取结构化元数据。涵盖字段如：业绩、中标人本地分支机构营业执照、中标人资质、人员资质、供应商名称、关联关系、分包单位名称、分包单位资质等级及有效期。文档范围包括：中标人资质文件、乡村医疗机构资质文件、供应商资质文件、分包单位资质文件、管护单位资质文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 人员
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 资质文件
  member_count: 1
  member_details:
  - 中标人资质文件
  - 乡村医疗机构资质文件
  - 供应商资质文件
  - 分包单位资质文件
  - 管护单位资质文件
output:
  fields:
  - name: 业绩
    type: string
    description: 提取 业绩 的文本值
  - name: 中标人本地分支机构营业执照
    type: string
    description: 提取 中标人本地分支机构营业执照 的文本值
  - name: 中标人资质
    type: string
    description: 提取 中标人资质 的文本值
  - name: 人员资质
    type: string
    description: 提取 人员资质 的文本值
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 关联关系
    type: string
    description: 提取 关联关系 的文本值
  - name: 分包单位名称
    type: string
    description: 提取 分包单位名称 的文本值
  - name: 分包单位资质等级及有效期
    type: string
    description: 提取 分包单位资质等级及有效期 的文本值
  - name: 办公场所证明
    type: string
    description: 提取 办公场所证明 的文本值
  - name: 机构名称
    type: string
    description: 提取 机构名称 的文本值
  - name: 管护单位资质等级
    type: string
    description: 提取 管护单位资质等级 的文本值
  - name: 设施配备
    type: string
    description: 提取 设施配备 的文本值
  - name: 资质等级
    type: string
    description: 提取 资质等级 的文本值
violations:
- expression: CONTAINS(招标文件.资格条件条款, '设立分公司') || CONTAINS(招标文件.资格条件条款, '设立子公司') || CONTAINS(招标文件.资格条件条款, '本地注册') || CONTAINS(招标文件.资格条件条款,
    '固定办公场所') || CONTAINS(招标文件.资格条件条款, '本地服务机构')
  description: 招标文件资格条件或服务要求中出现任何强制外地企业在本地设立法人机构、分支机构或常驻办公场所的表述，即直接判定为违规疑点。该条件与项目本身技术经济需求无必然联系，构成不合理限制。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 强制要求外地企业设立本地分支机构增加投标成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"招标人有下列行为之一的，属于以不合理条件限制、排斥潜在投标人或者投标人：……（四）以特定行政区域或者特定行业的业绩、奖项作为加分条件或者中标条件；（七）以其他不合理条件限制、排斥潜在投标人或者投标人。\"\
    \n  },\n  {\n    \"法规名称\": \"公平竞争审查制度实施细则\",\n    \"法规文号\": \"国市监反垄规〔2021〕2号\",\n    \"效力级别\": \"部门"
- expression: (中标通知书.中标人 != 推荐中标候选人名单及排名.推荐中标候选人名单及排名) || (各评分项得分.各评分项得分 || 权重与招标文件不一致) || (资质文件.关联关系 && 中标排名非第一)
  description: 筛查中标人不是评标委员会推荐的第一候选人的项目，或评标过程中使用了与招标文件不一致的评分标准，或中标人与招标人存在关联关系却低排名中标。任一条件触发即为违规调整中标结果疑点。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 未按法定程序和评标结果确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十条、第四十六条\",\n    \"内容概述\": \"招标人应当确定排名第一的中标候选人为中标人；招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十九条、第五十五条\",\n    \"内容概述\": \"评标委员会成员不得私"
- expression: (竣工验收日期.移交协议签署日期 - 竣工验收日期.竣工验收日期) > 30 || 移交协议缺失 || 资质等级.管护单位资质等级 < 项目要求资质等级
  description: 按照规定农村公路竣工验收后30日内必须完成移交。若间隔天数超过30天、移交协议未签署或管护单位不具备相应养护资质，均构成移交程序违规，造成管护责任悬空。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 农村公路建成后未及时移交管护单位
  regulation: "[\n  {\n    \"法规名称\": \"农村公路养护管理办法\",\n    \"法规文号\": \"交通运输部令2015年第22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"农村公路建设项目竣工验收后，应及时移交养护管理单位，办理交接手续，明确管护责任。\"\n  }\n]"
- expression: 移交清单.延迟天数 > 30 或 竣工验收日期.移交协议签署日期 IS NULL
  description: 依据规定，农村公路竣工验收后30日内应移交管护单位。延迟天数超过30天或未签署移交协议，即构成未按时移交。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 农村公路建成后未及时移交管护单位
  regulation: "[\n  {\n    \"法规名称\": \"农村公路养护管理办法\",\n    \"法规文号\": \"交通运输部令2020年第12号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"农村公路建设项目竣工验收后，应当按照有关规定及时移交管养。\"\n  }\n]"
