name: audit/政策文件类/变更文件
type: model
description: 从政策文件类类文档（变更文件）中提取结构化元数据。涵盖字段如：实际建设地点、竣工日期、管网布置图、设计处理能力。文档范围包括：设计变更文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 变更文件
  member_count: 1
  member_details:
  - 设计变更文件
output:
  fields:
  - name: 实际建设地点
    type: string
    description: 提取 实际建设地点 的文本值
  - name: 竣工日期
    type: date
    description: 提取 竣工日期 的日期值，格式 YYYY-MM-DD
  - name: 管网布置图
    type: string
    description: 提取 管网布置图 的文本值
  - name: 设计处理能力
    type: string
    description: 提取 设计处理能力 的文本值
