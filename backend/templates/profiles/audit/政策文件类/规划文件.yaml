    法规名称\": \"乡镇卫生院建设标准\",\n    \"法规文号\": \"建标107-2008\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第二章 建设规模与项目构成\",\n    \"\
    内容概述\""
