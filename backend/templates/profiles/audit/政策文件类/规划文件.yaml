    ,\n    \"条款号\": \"二、（一）\",\n    \"内容概述\": \"中央企业应当根据国家发展规划和国有资本布局结构调整要求，科学编制五年发展战略规划，按程序报国资委备案或审批。\"\n  }\n]"
- expression: (图层.项目或矿权范围面域 在 图层.保护区范围面域内) && (项目清单.审批日期 > 规划文件.设立日期 || 项目无保护区准入审批文件) || (信息.矿权范围坐标 与 规划文件.保护区边界坐标存在空间重叠 &&
