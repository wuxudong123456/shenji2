- expression: (实施方案.灌区投资区域 与 高标准农田规划图斑.建设范围 重叠面积占比 < 50%) && (高标准农田规划图斑.建设范围内明细表.分区域的资金投向量 < 总投资60%)
  description: 政策要求应优先支持高标准农田范围内的灌区建设。若灌区投资区域与已划定的高标准农田建设范围的图斑重叠面积（GIS叠置分析得出）占灌区总面积比例低于50%，或者落在高标准农田范围内的资金投入占总投资的比重小于60%，则表明投资方向偏离了政策优先序。
  audit_item: 大中型灌区规划、建设不符合相关规定
  suspicion: 未优先支持高标准农田区域的灌区建设
  regulation: "[\n  {\n    \"法规名称\": \"全国高标准农田建设规划（2021—2030年）\",\n    \"法规文号\": \"国函〔2021〕86号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第五章保障措施第一节\",\n    \"内容概述\": \"优先将大中型灌区有效灌溉面积建成高标准农田，加强灌区骨干工程与田间工程的衔接配套。\"\n  }\n]"
