  description: 通过GIS叠加分析，判断建设项目或矿业权是否在自然保护区、饮用水源保护区等法定保护区域内，并确认项目审批或矿权设立时间是否晚于保护区设立时间。若晚于保护设立日且无特殊批准，即为违规。
