name: audit/政策文件类/规划文件
type: model
description: 从政策文件类类文档（规划文件）中提取结构化元数据。涵盖字段如：业务板块占比、主导产业定位、交通、优先改造区域说明、保护区是否规划纳入管网覆盖范围、保护区边界坐标、保护范围、保护要求。文档范围包括：专项规划文件、中期财政规划文件、产业规划文件、企业五年发展战略规划文件、农村公路建设五年规划文件、农村寄递物流服务网络建设规划文件、农村生活污水治理专项规划文件、医疗卫生服务体系规划文件、国土空间相关专项规划文件、国家和地方教育信息化建设规划文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 规划文件
  member_count: 1
  member_details:
