violations:
- expression: ST_Intersects(产业规划文件.规划产业用地范围, 生态红线划定文件.生态保护红线边界坐标) = TRUE
  description: 利用空间分析，若产业发展规划拟占用地块与生态保护红线划定区域存在空间重叠，则判定违规。适用于GIS数据可获取情形。
  audit_item: 上位与下位政策法规检查
  suspicion: 产业规划布局突破生态保护红线
  regulation: "[\n  {\n    \"法规名称\": \"关于在国土空间规划中统筹划定落实三条控制线的指导意见\",\n    \"法规文号\": \"厅字〔2019〕48号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"生态保护红线内，自然保护地核心保护区原则上禁止人为活动，其他区域严格禁止开发性、生产性建设活动。\"\n  },\n  {\n    \"法规名称\"\
    : \"中华人民共和国环境保护法\",\n    \"法规文号\": \"主席令第9号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十九条\",\n    \"内容概述\": \"国家在重点生态功能区、生态环"
- expression: (重大项目选址坐标、规划用地性质、项目建设规模.重大项目选址坐标 INTERSECTS 禁止建设区边界坐标、生态保护红线范围、允许用地类型.禁止建设区边界坐标) || (重大项目选址坐标、规划用地性质、项目建设规模.规划用地性质
    NOT IN 禁止建设区边界坐标、生态保护红线范围、允许用地类型.允许用地类型) && 冲突项目名称、冲突类型（用地性质冲突、生态红线重叠）、处理状态.处理状态 != '已取消'
  description: 利用GIS空间分析，判断地方规划的重大项目地理位置是否落入国家级空间规划划定的禁止建设区或生态保护红线，或用地性质与允许类型不一致。若存在冲突且项目未调整取消，则判定为规划不衔接导致项目无法落地。
  audit_item: 违反建设管理相关政策规定-重大工程项目推进缓慢
  suspicion: 地方规划与国家级空间规划冲突导致项目无法落地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四条、第七条\",\n    \"内容概述\": \"城乡规划的制定和实施应遵循统一规划、合理布局、协调发展的原则；经依法批准的城乡规划，必须严格执行，不得擅自改变。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于建立国土空间规划体系并监督实施的若干意见\",\n    \"法规文号\": \"中发〔2019〕18号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"九、维护规划的严肃性和权威性\"\
    ,\n "
- expression: 对照表.财政安排资金 IS NULL || (对照表.计划投资金额 - 对照表.财政安排资金) / 对照表.计划投资金额 > 0.2
  description: 当财政安排资金字段为空（即无对应财政保障）时，直接判定为不衔接；或者财政安排资金缺口超过计划投资额的20%时，视为衔接不到位，存在重大资金风险。
  audit_item: 违反政府投资计划管理相关政策规定
  suspicion: 三年滚动政府投资计划与中期财政规划衔接不符
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于实行中期财政规划管理的意见\",\n    \"法规文号\": \"国发〔2015〕3号\",\n    \"效力级别\": \"制度文件\",\n   \
    \ \"条款号\": \"三、(二)\",\n    \"内容概述\": \"中期财政规划要与政府投资规划等相衔接，强化财政规划对年度预算的约束，合理安排政府投资规模和结构。\"\n  }\n]"
- expression: (同业对标数据比较表.非主业投资占比 > 0.1) || (同业对标数据比较表.主业收入占比 < 0.7) || (重大投资项目可行性研究报告.投资行业归属 IN (国家相关产业政策文件.鼓励类/限制类/淘汰类产业目录))
    || (同业对标数据比较表.研发投入占营收比例 < 市场调研报告.平均研发投入强度 * 0.8)
  description: 1.非主业投资占比超过10%或主业收入占比低于70%为关注线，触发预警；2.投资行业直接属于国家产业政策限制类或淘汰类即构成违规；3.对于高新技术企业，若研发投入占比低于同期同行业平均水平的80%，可能偏离国家创新驱动战略。
  audit_item: 企业发展战略规划的制定、执行和效果
  suspicion: 发展战略未聚焦主业或违反国家产业政策
  regulation: "[\n  {\n    \"法规名称\": \"中央企业投资监督管理办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第34号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十条\",\n    \"内容概述\": \"中央企业应当聚焦主业，严格控制非主业投资，非主业投资应当符合企业发展战略规划，且不得超过国资委核定的比例。\"\n  }\n]"
- expression: (战略目标分解及完成情况对照表.目标完成率 < 0.8) || (ABS(核心指标完成率趋势分析表.连续三年核心指标完成率趋势) < -0.1 && 战略目标分解及完成情况对照表.目标完成率 < 同业对标数据比较表.行业平均完成水平)
    || (重大项目执行进度跟踪表.滞后天数 > 项目总工期的20% && 战略目标分解及完成情况对照表.未达标指标项)
  description: 1.规划期内设定的国家级战略指标（如研发突破数、产能利用率）完成率低于80%为可疑；2.若完成率连续三年下滑且低于行业均值，说明执行持续恶化；3.关键支撑项目进度延误超过20%且直接导致战略目标未达成，视为执行层面重大缺陷。
  audit_item: 企业发展战略规划的制定、执行和效果
  suspicion: 战略规划核心目标未按期完成或未达预期
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强中央企业战略规划管理工作的指导意见\",\n    \"法规文号\": \"国资发规划〔2018〕54号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"四、（三）\",\n    \"内容概述\": \"中央企业应建立战略规划执行评估机制，对规划目标完成情况进行动态跟踪和考核，对未完成目标的责任人按相关规定进行问责。\"\n  }\n]"
- expression: (企业五年发展战略规划文件.规划文档是否存在 = '否') OR (国资委关于战略规划的批复文件.批复文号 IS NULL) OR (党委会战略决策会议纪要.战略规划议题审议记录 IS NULL) OR (战略规划调整备案记录.调整备案回执
    IS NULL)
  description: 以国资监管程序为标准，企业必须编制书面的五年规划，经董事会等决策机构审议后报国资委备案或审批，重大调整须重新报批。上述任一环节缺失即构成程序违规。
  audit_item: 企业发展战略规划的制定、执行和效果
