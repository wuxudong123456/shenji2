    条款号\": \"第十五条、第十七条、第二十四条\",\n    \"内容概述\": \"公共机构应当制定年度节能目标和实施方案；安排节能资金，开展能源消费统计和审计；加强对用能系统的管理，开展节能教育和岗位培训。\"\n  }\n]"
