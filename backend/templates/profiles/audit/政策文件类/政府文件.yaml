name: audit/政策文件类/政府文件
type: model
description: 从政策文件类类文档（政府文件）中提取结构化元数据。涵盖字段如：划定日期、区块坐标、处置措施、政企分离要求、职责划分、闲置原因分类、闲置认定日期。文档范围包括：土地处理相关政府文件、土地闲置认定相关政府文件、开发区管理机构与运营企业分离的政府文件、永久基本农田划定及调整的政府文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 政府文件
  member_count: 1
  member_details:
  - 土地处理相关政府文件
  - 土地闲置认定相关政府文件
  - 开发区管理机构与运营企业分离的政府文件
  - 永久基本农田划定及调整的政府文件
output:
  fields:
  - name: 划定日期
    type: date
    description: 提取 划定日期 的日期值，格式 YYYY-MM-DD
  - name: 区块坐标
    type: string
    description: 提取 区块坐标 的文本值
  - name: 处置措施
    type: string
    description: 提取 处置措施 的文本值
  - name: 政企分离要求
    type: string
    description: 提取 政企分离要求 的文本值
  - name: 职责划分
    type: string
    description: 提取 职责划分 的文本值
  - name: 闲置原因分类
    type: string
    description: 提取 闲置原因分类 的文本值
  - name: 闲置认定日期
    type: date
    description: 提取 闲置认定日期 的日期值，格式 YYYY-MM-DD
violations:
- expression: (股东名称及股权结构信息.股东名称 contains 开发区管理机构) || (任职清单.姓名 == 运营企业工商登记信息.法定代表人) || (中标单位及委托关系信息.中标单位 == 运营企业 && 中标单位及委托关系信息.委托关系
    == "直接委托" ) && (任职清单.是否在运营企业兼职 == true)
  description: 当运营企业股权结构中出现管理机构直接持股，或管委会工作人员兼任企业法定代表人，同时存在开发项目直接委托给该企业且未经过公开招标，即构成政企不分、垄断经营。
  audit_item: 落实“六稳”“六保”政策存在的其他问题
  suspicion: 开发区运营企业与管理机构未分离
  regulation: "[\n  {\n    \"法规名称\": \"《关于促进开发区改革和创新发展的若干意见》\",\n    \"法规文号\": \"国办发〔2017〕7号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"开发区管理机构应聚焦经济管理和公共服务职能，开发建设运营实行政企分离，原则上不再直接参与具体经营业务。\"\n  },\n  {\n    \"法规名称\"\
    : \"《中华人民共和国公务员法》\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十三条\",\n    \"内容概述\": \"公务员不得从事或者参与营利性"
- expression: (NOW_DATE - 项目清单.建成时间 > 365天) && (比对表.划入日期 IS NULL || 比对表.划入日期 - 项目清单.建成时间 > 365天)
  description: 高标准农田建成后超过1年仍未划入永久基本农田，或实际划入日期晚于建成日期1年以上，构成未及时划入违规。建成时间以验收报告中确定的日期为准。
  audit_item: 违反高标农田建后管护及使用规定的行为
  suspicion: 已建成高标准农田未及时划入永久基本农田
  regulation: "[\n  {\n    \"法规名称\": \"基本农田保护条例\",\n    \"法规文号\": \"国务院令第257号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条第二款\",\n    \"内容概述\": \"已建成的高标准农田应当及时划入基本农田保护区，具体期限由省级人民政府规定。\"\n  },\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\"\
    ,\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"三（八）\",\n    \"内容概述\": \"建成的高标准农田要划为永"
- expression: 土地出让合同或划拨决定书.约定动工日期 IS NOT NULL AND (施工许可证.发证日期 IS NULL OR DATEDIFF(施工许可证.发证日期, 土地出让合同或划拨决定书.约定动工日期) > 365)
    AND 土地利用现状统计表.地块状态 = '闲置'
  description: 认定规则：国有建设用地使用权人超过有偿使用合同或划拨决定书约定的动工开发日期满一年未动工开发，即视为闲置土地。表达式校验：从土地出让合同中提取约定动工日期，若未取得施工许可证或施工许可证发证日期滞后约定动工日期超过365天，且土地利用现状统计表中地块被标记为闲置状态，则判定为违规闲置。
  audit_item: 保障性安居工程项目土地闲置
  suspicion: 保障性安居工程项目土地闲置
  regulation: "[\n  {\n    \"法规名称\": \"闲置土地处置办法\",\n    \"法规文号\": \"国土资源部令第53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二条\",\n    \"内容概述\": \"本办法所称闲置土地，是指国有建设用地使用权人超过国有建设用地使用权有偿使用合同或者划拨决定书约定、规定的动工开发日期满一年未动工开发的国有建设用地。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第三十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十八条\",\n    \"\
    内容概述\":"
