name: audit/政策文件类/内控文件
type: model
description: 从政策文件类类文档（内控文件）中提取结构化元数据。涵盖字段如：保密措施、信息形成时间、内幕信息知情人名单。文档范围包括：企业上市/并购重组相关内控文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 内控文件
  member_count: 1
  member_details:
  - 企业上市/并购重组相关内控文件
output:
  fields:
  - name: 保密措施
    type: string
    description: 提取 保密措施 的文本值
  - name: 信息形成时间
    type: date
    description: 提取 信息形成时间 的日期值，格式 YYYY-MM-DD
  - name: 内幕信息知情人名单
    type: string
    description: 提取 内幕信息知情人名单 的文本值
violations:
- expression: ((流水.账户持有人姓名 IN (领导人员配偶子女)) AND (流水.买入日期 BETWEEN 时间表.意向形成日 AND 时间表.公告日-1日) AND (流水.股票代码 = 本企业或并购标的股票)) OR (授权费用审批记录.授权费用
    < 评估报告.无形资产公允价值*0.5 AND 无形资产使用审批记录.授权对象名称为领导人员相关企业)
  description: 配偶、子女等在重大信息形成后、公告前突击买入本企业或相关上市公司股票，即推定为内幕交易。无形资产以明显不公允的价格授权给领导人员关联企业，亦属违规，定价低于公允价值50%触发。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 利用内幕信息或无形资产为关系人谋利
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（五）项\",\n    \"内容概述\": \"不得利用企业上市或者上市公司并购、重组、定向增发等过程中的内幕消息、商业秘密以及企业的知识产权、业务渠道等无形资产或者资源，为本人或者配偶、子女及其他特定关系人谋取利益。\"\
    \n  }\n]"
