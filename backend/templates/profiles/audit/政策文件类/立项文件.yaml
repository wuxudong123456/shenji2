name: audit/政策文件类/立项文件
type: model
description: 从政策文件类类文档（立项文件）中提取结构化元数据。涵盖字段如：关键路径节点时间、初步设计批复日期、批复总工期、技术可行性证明、计划竣工日期、项目可行性报告、项目名称。文档范围包括：研发项目立项文件、科研项目立项文件、重大基础设施项目立项文件、项目立项文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 立项文件
  member_count: 1
  member_details:
  - 研发项目立项文件
  - 科研项目立项文件
  - 重大基础设施项目立项文件
  - 项目立项文件
output:
  fields:
  - name: 关键路径节点时间
    type: date
    description: 提取 关键路径节点时间 的日期值，格式 YYYY-MM-DD
  - name: 初步设计批复日期
    type: date
    description: 提取 初步设计批复日期 的日期值，格式 YYYY-MM-DD
  - name: 批复总工期
    type: string
    description: 提取 批复总工期 的文本值
  - name: 技术可行性证明
    type: string
    description: 提取 技术可行性证明 的文本值
  - name: 计划竣工日期
    type: date
    description: 提取 计划竣工日期 的日期值，格式 YYYY-MM-DD
  - name: 项目可行性报告
    type: string
    description: 提取 项目可行性报告 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
violations:
- expression: 企业会计政策文件.研发支出资本化条件(本期) != 上期资本化条件 && (研发支出辅助账.本期资本化金额增长率 > 同期研发投入增长率*2) && (董事会决议 IS NULL || 董事会决议.批准日期 > 政策变更生效日期)
    && 财务报表附注.会计政策变更说明 NOT LIKE '%研发支出资本化政策变更%'
  description: 若本期研发支出资本化条件放宽，导致资本化金额异常增长，且缺少董事会审批或审批滞后，未在附注中披露，则触发疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意调整研发费用资本化政策虚增资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"不得随意改变费用的确认标准或者计量方法，导致虚增资产、虚减费用。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第6号——无形资产\",\n    \"法规文号\": \"\
    财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条、第八条、第九条\",\n    \"内容概述\": \"企业内部研发项目研究阶段支出应当费用化，开发阶段支出满足条件方可资本化"
- expression: ((日志.关键路径节点时间 - 日志.关键路径节点时间) / 批复总工期.批复总工期) > 0.2 || (批复总工期.计划竣工日期 && 日志.巡检日期 > 批复总工期.计划竣工日期 && 申请.审批状态)
  description: 关键路径延误率>20%或合同工期已满仍未能竣工且无有效延期审批，直接判定为进展缓慢。实物工程量完成率与计划完成率偏差也是辅助判断指标，但以工期偏离为准。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 重大基础设施项目进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十九条\"\
    ,\n    \"内容概述\": \"建筑工程发包单位应当按照约定的日期开工，按期完成。因故不能按期开工或者竣工的，应当及时办理延期手续。\"\n  },\n  {\n    \"法规名称\": \"财政部关于印发《基本建设项目建设成本管理规定》的通知\"\
    ,\n    \"法规文号\": \"财建〔2016〕504号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"建设单位应加强项目工期管"
- expression: (实施方案.批复日期 - 立项文件.初步设计批复日期) > 60
  description: 根据《灌区管理办法》要求，初步设计批复后60日内应完成实施方案审批。使用日期计算差值，超过60天即构成逾期审批违规。正数为逾期天数，数值越大违规越严重。
  audit_item: 大中型灌区规划、建设不符合相关规定
  suspicion: 实施方案未按规定时限批复
  regulation: "[\n  {\n    \"法规名称\": \"灌区管理办法\",\n    \"法规文号\": \"水利部令第31号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\"\
    ,\n    \"内容概述\": \"灌区续建配套与节水改造项目实施方案应在初步设计批复后60日内完成审批。\"\n  }\n]"
- expression: (项目名称.计划执行周期（年） < 研究报告.常规育种标准周期（年） * 0.8) || (访谈记录.因周期不足导致的遗留工作说明 >= 2 && 访谈记录.实际研发进度 < 80%)
  description: 当科研项目的计划周期低于对应作物行业标准研发周期的80%时，判定为周期设置严重不足；或者项目出现2次及以上延期且结题时研发完成度低于80%，视为周期不匹配导致进度滞后。
  audit_item: 种业科技研发方面不符合相关规定
  suspicion: 科研项目支持周期与种业研发周期不匹配
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于深化中央财政科技计划（专项、基金等）管理改革的方案\",\n    \"法规文号\": \"国发〔2014〕64号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"第三条（优化整合各类科技计划）\",\n    \"内容概述\": \"科技计划应按照不同类型科学研究活动的特点和规律，实行分类管理，对基础研究、应用研究、试验发展等设置合理的项目实施周期，避免周期过短导致急功近利。\"\
    \n  }\n]"
