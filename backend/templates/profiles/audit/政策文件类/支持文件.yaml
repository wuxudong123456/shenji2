name: audit/政策文件类/支持文件
type: model
description: 从政策文件类类文档（支持文件）中提取结构化元数据。涵盖字段如：培训内容规范、技术培训覆盖率要求。文档范围包括：帮扶产业政策支持文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 培训
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 支持文件
  member_count: 1
  member_details:
  - 帮扶产业政策支持文件
output:
  fields:
  - name: 培训内容规范
    type: string
    description: 提取 培训内容规范 的文本值
  - name: 技术培训覆盖率要求
    type: string
    description: 提取 技术培训覆盖率要求 的文本值
violations:
- expression: (ABS(名册.实际参训人数 / 数据表.目标产业劳动力总数) < 0.8) || (名册.培训后考核评估分数 < 60 占比 > 0.3)
  description: 技术培训覆盖率低于80%或参训人员考核评估分数低于60分的比例超过30%，均视为技术帮扶短板、培训流于形式。覆盖率阈值依据扶贫项目普遍要求的全覆盖或高覆盖率标准设定，合格率阈值依据常见审计预警线设定。
  audit_item: 帮扶产业发展基础不牢
  suspicion: 帮扶产业技术培训流于形式且效果不达标
