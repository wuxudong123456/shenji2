name: audit/政策文件类/披露文件
type: model
description: 从政策文件类类文档（披露文件）中提取结构化元数据。涵盖字段如：交易内容、交易金额、关系、关联关系、关联方名称、已披露关联方名单、已披露关联方名称、股权关系。文档范围包括：关联方交易披露文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 披露文件
  member_count: 1
  member_details:
  - 关联方交易披露文件
output:
  fields:
  - name: 交易内容
    type: string
    description: 提取 交易内容 的文本值
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 关系
    type: string
    description: 提取 关系 的文本值
  - name: 关联关系
    type: string
    description: 提取 关联关系 的文本值
  - name: 关联方名称
    type: string
    description: 提取 关联方名称 的文本值
  - name: 已披露关联方名单
    type: string
    description: 提取 已披露关联方名单 的文本值
  - name: 已披露关联方名称
    type: string
    description: 提取 已披露关联方名称 的文本值
  - name: 股权关系
    type: string
    description: 提取 股权关系 的文本值
violations:
- expression: (重大交易合同.货物/服务交付条款 == 无物流单证 || 无交付记录) && (应付账款明细表.账龄 > 360天) || (原始会计凭证.对方单位 IN (关联方交易披露文件.关联方名称 WHERE 关联方交易披露文件.交易内容
    == NULL) && (银行对账单.交易对手 != 原始会计凭证.对方单位))
  description: 筛查虚构交易以虚增收入的疑点：条件一，合同缺乏关键交付证明且形成长期大额应收款（超过360天），可能为虚假销售；条件二，交易对手为未披露的关联方且资金未直接流向对手方，表明交易可能无商业实质。满足任一组合条件即判定为疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 虚构经济业务交易进行虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条、第十六条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者事项为依据进行会计确认、计量和报告，如实反映符合确认和计量要求的各项会计要素及其他相关信息，保证会计信息真实可靠、内容完整。\"\n  }\n\
    ]"
