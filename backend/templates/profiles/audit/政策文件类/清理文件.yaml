name: audit/政策文件类/清理文件
type: model
description: 从政策文件类类文档（清理文件）中提取结构化元数据。涵盖字段如：取消日期、已取消资格名称、状态。文档范围包括：职业资格目录清单相关清理文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 清理文件
  member_count: 1
  member_details:
  - 职业资格目录清单相关清理文件
output:
  fields:
  - name: 取消日期
    type: date
    description: 提取 取消日期 的日期值，格式 YYYY-MM-DD
  - name: 已取消资格名称
    type: string
    description: 提取 已取消资格名称 的文本值
  - name: 状态
    type: boolean
    description: 提取 状态 的布尔值（是/否）
violations:
- expression: (设置清单.对应国家目录资格编码 IS NULL) AND (设置清单.项目名称 REGEXP '(师|员|工程师|管理师|规划师|咨询师)') AND (设置清单.批准机关 != '人力资源和社会保障部' AND
    设置清单.批准文号 NOT IN (省级以上人社部门有效批文库) OR 设置清单.批准文号 IS NULL)
  description: 若单位现行职业资格项目无法匹配国家目录有效编码（即不在国家目录内），且项目名称包含典型职业资格后缀词，同时批准机关并非人社部或无有效批文，即判定为疑似改头换面设立已取消资格。实践中可结合已取消资格核心词库计算名称文本相似度，相似度≥80%触发严重预警。
  audit_item: 职业资格鉴定政策执行不到位
  suspicion: 变相设立已清理取消的职业资格项目
  regulation: "[\n  {\n    \"法规名称\": \"人力资源社会保障部关于公布国家职业资格目录的通知\",\n    \"法规文号\": \"人社部发〔2017〕68号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条、第二条\",\n    \"内容概述\": \"国家按照规定的条件和程序将职业资格纳入国家目录，实行清单式管理，目录之外一律不得许可和认定职业资格，目录之内除准入类职业资格外一律不得与就业创业挂钩。\"\
    \n  },\n  {\n    \"法规名称\": \"国务院办公厅关于清理规范各类职业资格相关活动的通知\",\n    \"法规文号\": \"国办发〔2007〕73号\",\n    \"效力级别\": \"行政"
- expression: (明细表.收费项目名称 IN (已取消资格名称)) AND (明细表.收费日期 > 取消日期) AND (明细表.收费金额 > 0)
  description: 将实际收费项目名称与已明文取消的职业资格清单进行精确匹配或关键词包含匹配，若收费行为发生在该资格正式取消日期之后且存在实质收费金额，即构成违规收费。‘IN’列表应包含所有已取消资格的原官方名称及常见变体名称。
  audit_item: 职业资格鉴定政策执行不到位
  suspicion: 对已取消职业资格项目继续鉴定并违规收费
  regulation: "[\n  {\n    \"法规名称\": \"人力资源社会保障部关于公布国家职业资格目录的通知\",\n    \"法规文号\": \"人社部发〔2017〕68号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各地、各部门未经批准不得在目录之外自行设置国家职业资格，严禁在目录之外开展职业资格许可和认定工作，严禁将目录之外的职业资格与就业创业、职称评审等挂钩。\"\
    \n  },\n  {\n    \"法规名称\": \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号"
