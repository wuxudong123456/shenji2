violations:
- expression: ABS({因素名称.数据值} - {差异说明.真实值}) > 0 || ({因素名称.数据时间节点} 距离分配年度 > 3) || ({验证数据差异结论.验证数据差异结论} = '不可接受' && {分配金额.分配金额}
    使用该因素数据值计算)
  description: 数据采集值与校验真实值存在任何绝对值差异，或引用数据年份距分配年度超过3年（时效性超标），或第三方验证报告判定数据不可信且该数据被用于计算金额，均判定为基础数据错误导致分配偏差。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 分配引用基础数据错误
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条、第五十七条\"\
    ,\n    \"内容概述\": \"各级政府预算编制应依据真实、准确的数据；各部门应完整、准确地向财政部门提供预算编制所需数据。\"\n  }\n]"
- expression: (资产编号、争议情况.资产编号 对应 资产编号、处置类型、处置日期、资产原值、处置收入.资产编号) || (资产编号、资产类别、原值、资产状态（查封/抵押等）、资产状态（在库/已处置）、处置日期.资产状态（查封/抵押等）
    IN ('查封','抵押') && 查封/抵押未解除) || (权属人、共有情况、他项权利.他项权利 NOT IN ('无','已解除'))
  description: 当已处置资产的权属存在争议（已在争议登记表中记录），或资产状态显示被查封、抵押等权利受限且未解除，或权属证明文件显示存在未解除的他项权利时，均构成违规处置权属不清资产。
  audit_item: 违规处置国有资产
  suspicion: 违规处置权属不清或有争议的国有资产
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"转让方应当对转让标的进行产权界定和资产评估，产权应当清晰，不存在权属纠纷。\"\n  }\n]"
- expression: (资质证书有效期截止日期 < 合同签订日期) OR (经营范围 NOT LIKE '%绩效评价%' AND 经营范围 NOT LIKE '%绩效管理%' AND 经营范围 NOT LIKE '%预算绩效%') OR
    (独立性声明中关联关系字段 = '存在关联' OR 利益冲突声明 = '未回避') OR (资质审核记录表.审核结论 = '不通过' AND 项目仍委托)
  description: 资质证书在合同签订日已过期或经营范围明显不含绩效评价类业务视为不具备条件；独立性声明中承认存在关联关系但未回避，或审核未通过却仍获得委托，反映机构不独立或流程失控。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 委托的第三方机构不具备绩效评价资质或存在独立性缺陷
  regulation: "[\n  {\n    \"法规名称\": \"关于委托第三方机构参与预算绩效管理的指导意见\",\n    \"法规文号\": \"财预〔2021〕6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"第三方机构应当具有独立承担民事责任的能力，具备提供服务所必需的设施、人员和专业技术能力，具有良好的信誉。\"\n  },\n  {\n    \"法规名称\"\
    : \"政府购买服务管理办法\",\n    \"法规文号\": \"财政部令第102号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十二条\",\n    \"内容概述\": \"购买主体应当依法确定承接"
- expression: 基本支出预算明细表.单位代码 IN (经费自理单位证明.单位代码集合) && 基本支出预算明细表.资金来源 = '财政拨款' && 支出类型 IN ('人员经费','公用经费')
  description: 经费自理单位（自收自支或企业化管理）不应再由财政保障基本支出，若仍为其安排人员经费、公用经费等基本支出财政拨款，即构成违规。
  audit_item: 预算编制不规范
  suspicion: 为经费自理单位编列基本支出预算
