name: audit/政策文件类/证明文件
type: model
description: 从政策文件类类文档（证明文件）中提取结构化元数据。涵盖字段如：上年度农产品网络销售额、专业承包等级、专业能力证明、专业资格证书有效期、专利证书、业务范围、交付房源编号、交易项目编号。文档范围包括：互联网/电话销售彩票的合规性证明文件、产权交易所出具的进场交易证明文件、供应商资质证明文件、公共租赁住房实际交付使用证明文件、关联企业股权结构证明文件、农药包装废弃物处置单位的资质证明文件、参训人员身份证明文件、合作社资产权属证明文件、地方水质检测实验室资质证明文件、基础数据来源合法性证明文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 人员
- 审批
- 知识产权
- 项目
- 元数据提取
