  suspicion: 成员虚假出资或出资方式不合规
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第83号（2017年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"设立农民专业合作社应当向工商行政管理部门提交出资清单等文件。成员以其账户内记载的出资额和公积金份额为限对农民专业合作社承担责任，出资应当真实、足额。\"\
    \n  }\n]"
- expression: (许可证有效期、许可处理范围（类别、能力）、合法资质单位清单.许可证有效期 < 当前日期) || (处理量、产出物检测结果.实际处理温度 < 贮存设施防渗漏、防雨、防扬散标准、处理工艺参数标准（如焚烧温度、停留时间）.最低温度)
    || (处理量、产出物检测结果.处理量 > 许可证有效期、许可处理范围（类别、能力）、合法资质单位清单.许可能力上限) || (处理量、产出物检测结果.产出物检测结果 > 标准限值)
  description: 处置单位资质过期、处理工艺参数（如焚烧温度）未达到技术标准、超许可能力处理、或资源化产品残留超标，均构成资源化利用不合规，未依法进行无害化处理。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 农药包装废弃物资源化利用不合规
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国固体废物污染环境防治法》\",\n    \"法规文号\": \"主席令第四十三号（2020年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第八十条、第八十二条\",\n    \"内容概述\": \"从事危险废物利用、处置经营活动须取得许可证并按证经营；资源化利用的产品应当符合国家规定的产品质量标准。\"\n  }\n]"
- expression: (记录表.收款方名称 不为空 且 收款方名称 不在 处理合同.合同约定接收单位 列表) && (记录表.金额 > 0) || (交接单.接收方 不在 证明文件.合法资质单位清单 内) || (台账表.处理去向 !=
    处理合同.合同约定接收单位)
  description: 存在向非合同约定或非资质的个人/单位支付大额款项，转运接收方与资质单位不符，或台账去向与合同约定不一致，均表明存在违规倒卖或非法转交行为。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 违规倒卖农药包装废弃物
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国固体废物污染环境防治法》\",\n    \"法规文号\": \"主席令第四十三号（2020年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第八十条\",\n    \"内容概述\": \"禁止将危险废物提供或者委托给无许可证的单位或者其他生产经营者从事收集、贮存、利用、处置活动。\"\n  }\n]"
- expression: (记录表.处理方式 = "资源化利用" AND 备案表.许可证编号 IS NULL) OR (检测报告.有害物质残留量 > 标准限值) OR (记录表.处理方式 = "资源化利用" AND 记录表.产物去向 = "生产食品接触材料")
    OR (记录表.处理方式 != "资源化利用" AND 记录表.处理方式 != "无害化处理" AND 记录表.处理数量 > 0) OR (记录表.处理方式 = "无害化处理" AND 证明文件 IS NULL)
  description: ①有资源化利用行为但企业无危险废物经营许可证；②资源化产品检测不合格仍作为产品出售；③未资源化利用的废弃物未进入无害化处理，直接填埋或丢弃；④声称无害化处理但无法提供有效证明。任一条件即判违规。
  audit_item: 农药化肥减量增效落实方面不符合相关规定
  suspicion: 农药包装废弃物资源化利用或无害化处理不合规
  regulation: "[\n  {\n    \"法规名称\": \"农药包装废弃物回收处理管理办法\",\n    \"法规文号\": \"生态环境部 农业农村部令2020年第7号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十三条、第十四条\",\n    \"内容概述\": \"鼓励资源化利用，资源化利用单位应具备技术能力和条件，不得生产危害人体健康和生态环境的产品；资源化利用以外的，应进行无害化处理。\"\n  }\n\
    ]"
- expression: (明细表.收款方 != 合作社对公账户) || (水对账单.对方账户名称 IN 理事长/理事亲属工商登记名单 && 水对账单.交易金额 > 50000 && ABS(资产清单.购置金额 - 水对账单.交易金额) <
    0.1 * 资产清单.购置金额) || (资产清单.资产状态 == '账面无' && 证明文件.资产权属人 != 合作社)
  description: 若补贴资金收款方非合作社对公账户，或大额资金流向理事长等关联个人且与资产购置金额高度吻合，或账面资产无对应的权属证明文件，则判定为涉嫌资产侵占。阈值：金额>5万元且差异率<10%为可疑，需进一步核实关联关系。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 理事长等侵占私分合作社资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n   \
    \ \"条款号\": \"第三十八条\",\n    \"内容概述\": \"农民专业合作社的理事长、理事和管理人员不得侵占、挪用、私分或者以其他方式损害合作社的财产。\"\n  }\n]"
