name: audit/政策文件类/职能文件
type: model
description: 从政策文件类类文档（职能文件）中提取结构化元数据。涵盖字段如：培训是否属于法定免费服务职责。文档范围包括：单位职能文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 培训
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 职能文件
  member_count: 1
  member_details:
  - 单位职能文件
output:
  fields:
  - name: 培训是否属于法定免费服务职责
    type: number
    description: 提取 培训是否属于法定免费服务职责 的数值（含单位，如万元、吨等）
violations:
- expression: 培训通知.收费标准 > 0 && (许可证.有效期限 != '有效' OR 许可证.收费标准 < 培训通知.收费标准) && 明细表.付款方 IN ('所属单位','企业','社会人员') && 职能文件.培训是否属于法定免费服务职责
    == '法定免费培训'
  description: 行政机关或事业单位在其法定职责范围内举办培训并收取费用，但无有效的收费许可或实际收费标准高于批复标准，且付款方为下属单位或企业的，即构成违规收费。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 违规向企事业单位收取培训费
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2016〕1223号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第四条、第五条\",\n    \"内容概述\": \"行政事业性收费实行中央和省两级审批管理，未按规定审批的不得收费；行政机关履行行政职能提供服务的，不得收取费用。\"\n  }\n]"
