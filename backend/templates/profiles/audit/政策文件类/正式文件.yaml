name: audit/政策文件类/正式文件
type: model
description: 从政策文件类类文档（正式文件）中提取结构化元数据。涵盖字段如：下达日期、下达金额、任务清单编号、发文日期、垃圾处理衔接的专门章节或表述、应下达金额、批复日期、技术路线。文档范围包括：下达资金指标正式文件、农村污水治理规划正式文件、被审计单位年度预算批复的正式文件、财政部门下达转移支付预算的正式文件、防火机构职责分工的正式文件、防火机构设立的正式文件、项目投资计划下达的正式文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 明细
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 正式文件
  member_count: 1
  member_details:
  - 下达资金指标正式文件
  - 农村污水治理规划正式文件
  - 被审计单位年度预算批复的正式文件
  - 财政部门下达转移支付预算的正式文件
  - 防火机构职责分工的正式文件
  - 防火机构设立的正式文件
  - 项目投资计划下达的正式文件
output:
  fields:
  - name: 下达日期
    type: date
    description: 提取 下达日期 的日期值，格式 YYYY-MM-DD
  - name: 下达金额
    type: number
    description: 提取 下达金额 的数值（含单位，如万元、吨等）
  - name: 任务清单编号
    type: string
    description: 提取 任务清单编号 的文本值
  - name: 发文日期
    type: date
    description: 提取 发文日期 的日期值，格式 YYYY-MM-DD
  - name: 垃圾处理衔接的专门章节或表述
    type: string
    description: 提取 垃圾处理衔接的专门章节或表述 的文本值
  - name: 应下达金额
    type: number
    description: 提取 应下达金额 的数值（含单位，如万元、吨等）
  - name: 批复日期
    type: date
    description: 提取 批复日期 的日期值，格式 YYYY-MM-DD
  - name: 技术路线
    type: string
    description: 提取 技术路线 的文本值
  - name: 投资估算
    type: string
    description: 提取 投资估算 的文本值
  - name: 文号
    type: string
    description: 提取 文号 的文本值
  - name: 机构名称
    type: string
    description: 提取 机构名称 的文本值
  - name: 签发日期
    type: date
    description: 提取 签发日期 的日期值，格式 YYYY-MM-DD
  - name: 绩效目标编号
    type: string
    description: 提取 绩效目标编号 的文本值
  - name: 编制单位
    type: string
    description: 提取 编制单位 的文本值
  - name: 编制日期
    type: date
    description: 提取 编制日期 的日期值，格式 YYYY-MM-DD
  - name: 职责描述
    type: string
    description: 提取 职责描述 的文本值
  - name: 覆盖范围
    type: string
    description: 提取 覆盖范围 的文本值
  - name: 规划文本
    type: string
    description: 提取 规划文本 的文本值
  - name: 规划文本中是否包含与改厕
    type: boolean
    description: 提取 规划文本中是否包含与改厕 的布尔值（是/否）
  - name: 规划目标年限
    type: string
    description: 提取 规划目标年限 的文本值
  - name: 规定用途
    type: string
    description: 提取 规定用途 的文本值
  - name: 附件-资金分配明细表
    type: string
    description: 提取 附件-资金分配明细表 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目编码
    type: string
    description: 提取 项目编码 的文本值
violations:
- expression: 资金分配明细表.实际下达日期 > 资金分配明细表.规定下达截止日
  description: 制度要求自收到上级转移支付资金后X日内分解下达至下级或项目单位（具体时限依据管理办法，如一般转移支付30日内、专项转移支付90日内），实际下达日期超过规定截止日即为违规。延迟天数>0触发疑点。
  audit_item: 财政转移支付预算下达不及时、不准确
  suspicion: 转移支付资金未在规定时限内下达
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六十三条\",\n    \"内容概述\": \"中央对地方一般性转移支付在全国人民代表大会批准预算后30日内下达，专项转移支付在批准后90日内下达；省、自治区、直辖市政府接到中央转移支付后30日内下达。\"\n  }\n]"
- expression: DATEDIFF(签收台账.签收日期, 明细表.实际下达日期) > 3
  description: 签收日期与实际下达日期间隔超过3天，表明资金文件虽已印发但未及时送达接收单位，形成‘发文早、到位晚’的虚假及时下达。3天为通用合理送达时限，可根据当地管理制度调整。
  audit_item: 财政转移支付预算下达不及时、不准确
  suspicion: 转移支付资金发出后未及时签收（虚假及时下达）
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六十三条\",\n    \"内容概述\": \"要求转移支付资金在规定期限内下达，资金实际到达接收单位的时间也应在时限内，不得仅以发文时间作为下达时点。\"\n  }\n]"
- expression: (明细表.接收单位 IS NULL) OR (明细表.接收单位 LIKE '%等%') OR (明细表.接收单位 LIKE '%相关单位%') OR (NOT EXISTS (SELECT 1 FROM 附件-资金分配明细表
    WHERE 附件-资金分配明细表.资金编号 = 明细表.资金编号 AND 附件-资金分配明细表.接收单位明细不为空))
  description: 接收单位字段缺失、模糊或不附带分配明细表，表明预算未细化至具体单位或项目，违反预算细化要求，易导致资金挪用。表达式综合检查字段值。
  audit_item: 财政转移支付预算下达不及时、不准确
  suspicion: 转移支付资金下达对象不明确导致挪用
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"专项转移支付预算应当分地区、分项目编制，落实到具体项目，并细化到预算单位。\"\n  }\n]"
- expression: ${规定时限、实际批复时间.实际批复时间} > ${规定的截止日期.规定的截止日期}
  description: 当对所属单位预算的实际批复日期晚于法规或上级部门明文规定的最晚批复日期时，触发违规判定。规定时限通常为人大批准预算后20日内向本级部门批复，部门在接到批复后15日内向所属单位批复。实际批复时间取批复文件日期或签收记录中的较晚者，任何超期均视为违规。
  audit_item: 违规批复预算
  suspicion: 未按规定时限批复所属单位预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第五十二条\",\n    \"内容概述\": \"各级预算经本级人民代表大会批准后，本级政府财政部门应当在二十日内向本级各部门批复预算。各部门应当在接到本级政府财政部门批复的本部门预算后十五日内向所属各单位批复预算。\"\
    \n  }\n]"
- expression: (规划文本 IS NULL) || (政府批复文号 IS NULL || 批复日期 = '') || (编制日期 > 项目实际开工日期) || (技术路线出现其他地区地名或与本地区缺水/山区等特征明显矛盾)
  description: 无正式规划文本；或虽有规划但无合法批复文件及日期；或规划编制时间晚于治理项目开工日期，倒挂操作；或技术路线表述照搬照抄，出现不符合本地特征的方案，如严重缺水地区规划大量水冲式厕所。满足任一条件即触发违规。
  audit_item: 污水治理规划不符合规定
  suspicion: 未编制或形式上编制农村污水治理规划
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进农村生活污水治理的指导意见\",\n    \"法规文号\": \"环办土壤〔2021〕24号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条第（三）项\",\n    \"内容概述\": \"以县域为单位，科学编制农村生活污水治理规划（方案），明确治理目标、时序、技术路线、建设任务、运行维护和资金筹措等内容。\"\n  }\n]"
- expression: (投资计划下达正式文件.任务清单编号 is NULL || 投资计划下达正式文件.绩效目标编号 is NULL) || (任务清单与绩效目标匹配表.投资计划文号 is NULL)
  description: 检查投资计划下达文件中是否缺失任务清单编号或绩效目标编号，或者匹配表中无对应投资计划文号记录。任意条件满足，则判定为未同步下达，高风险。
  audit_item: 项目计划分解下达不合规
  suspicion: 投资计划未与任务清单及绩效目标同步下达
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十六条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当和本级预算相衔接。项目单位应当编制项目预算，明确项目绩效目标。\"\n  },\n  {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\"\
    : \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"预算绩效目标应与部门预算同步申报、同步审核、同步批复下达。\"\n\
    \  }"
- expression: (正式文件.发文日期 > 规定截止日期) && (无正当理由延期审批文件不存在)
  description: 规定截止日期为管理办法要求的下达最后期限（如中央预算批准后30日内）；实际发文日期晚于该日期且无上级批准延期文件即构成超期；超期30天以上为严重违规。
  audit_item: 财政部门未按规定分配下达保障性安居工程专项资金
  suspicion: 中央财政部门超期分配下达专项资金
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程补助资金管理办法\",\n    \"法规文号\": \"财综〔2022〕1号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十条\",\n    \"内容概述\": \"财政部应在收到中央预算批准后30日内，将补助资金分解下达至省级财政部门。\"\n  }\n]"
- expression: (流水表.收款方 NOT IN 合规安居工程项目单位清单) || (流水表.用途摘要 NOT LIKE '%保障房%' && 支付金额>100万) || (SUM(应下达金额) - SUM(支付金额) > 截留阈值)
  description: 合规清单为各地住建部门或项目单位；用途未包含保障房关键字且大额的为可疑；应拨付与已拨付至项目金额差额超过5%且无在途说明的，视为截留。
  audit_item: 财政部门未按规定分配下达保障性安居工程专项资金
  suspicion: 中央财政部门截留或挪用专项资金
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程补助资金管理办法\",\n    \"法规文号\": \"财综〔2022〕1号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十五条\",\n    \"内容概述\": \"补助资金必须专项用于保障性安居工程，任何单位不得截留、挪用、挤占。\"\n  }\n]"
- expression: (正式文件 IS NULL) || (正式文件.规划文本中是否包含与改厕、垃圾处理衔接的专门章节或表述) || (分工表.污水管网敷设完成时间 > 分工表.各行政村厕所改造任务完成时间 + 90天) || (会议纪要.会议召开频次
    < 2次/年)
  description: 未制定统筹工作方案；或规划文本完全缺失与厕所改造、垃圾处理的衔接内容；或任务分工表中同一村庄的污水管网铺设完成时间晚于户厕改造完成时间超过90天，导致改厕后粪污无法接入管网，造成衔接脱节；或一年内跨部门专题协调会议次数少于2次，反映统筹协作流于形式。满足任一条件即触发疑点。
  audit_item: 污水治理规划不符合规定
  suspicion: 污水治理规划未与垃圾治理、厕所革命统筹衔接
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进农村生活污水治理的指导意见\",\n    \"法规文号\": \"环办土壤〔2021〕24号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条第（三）项\",\n    \"内容概述\": \"统筹考虑农村生活污水治理与改厕、村庄清洁、生活垃圾治理等协同推进，协调安排相关建设任务。\"\n  }\n]"
- expression: (签订文件.签订层级（省、市、县、乡） <> {省,市,县,乡}) || (文本.预案编制情况不存在 || 文本.响应分级为空 || 文本.处置流程为空 || 文本.资源调配内容为空)
  description: 责任状未覆盖全部应签订层级（省、市、县、乡任一层级缺失），或未制定应急预案，或已制定预案但缺少响应分级、处置流程、资源调配等核心内容，均直接判定违规。
  audit_item: 草原风险防控落实不到位
  suspicion: 草原防火预警机制建设不到位
  regulation: "[\n  {\n    \"法规名称\": \"《草原防火条例》\",\n    \"法规文号\": \"国务院令第542号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十条、第二十一条\",\n    \"内容概述\": \"草原防火实行地方各级人民政府行政首长负责制；县级以上人民政府应与下级政府逐级签订草原防火责任书；县级以上人民政府应制定草原火灾应急预案。\"\n  }\n]"
