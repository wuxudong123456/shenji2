name: audit/政策文件类/摊派文件
type: model
description: 从政策文件类类文档（摊派文件）中提取结构化元数据。涵盖字段如：依据、摊派项目、文件编号、金额。文档范围包括：摊派文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 摊派文件
  member_count: 1
  member_details:
  - 摊派文件
output:
  fields:
  - name: 依据
    type: string
    description: 提取 依据 的文本值
  - name: 摊派项目
    type: string
    description: 提取 摊派项目 的文本值
  - name: 文件编号
    type: string
    description: 提取 文件编号 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
violations:
- expression: ((分析表.支出同比增长率 < 地方财政经常性收入同比增长率) OR (分析表.支出占公共预算比例 < 上年比重)) AND (组织台账.支出科目 LIKE '%环卫%' OR '%道路%' OR '%公共设施%')
    AND (组织台账.资金来源（自筹/拨款）='自筹')
  description: 当财政决算中农村公共服务支出增幅低于财政经常性收入增幅，或其在预算中占比下降，且同期集体经济组织账目存在应由财政承担的公共服务支出（如环卫、道路等）自筹资金支付时，判定为支出不达标或负担转嫁。
  audit_item: 政策支持落实和监督检查不到位
  suspicion: 农村公共服务支出未达规定增幅或转嫁负担
