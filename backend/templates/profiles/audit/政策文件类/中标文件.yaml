name: audit/政策文件类/中标文件
type: model
description: 从政策文件类类文档（中标文件）中提取结构化元数据。涵盖字段如：地块编号、成交总价、楼面价、起始价。文档范围包括：土地竞拍中标文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 中标文件
  member_count: 1
  member_details:
  - 土地竞拍中标文件
output:
  fields:
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 成交总价
    type: string
    description: 提取 成交总价 的文本值
  - name: 楼面价
    type: string
    description: 提取 楼面价 的文本值
  - name: 起始价
    type: string
    description: 提取 起始价 的文本值
violations:
- expression: ((中标文件.楼面价/数据.区域楼面均价) > 1.5) && (溢价率 > 100%)
  description: 溢价率=（成交总价-起始价）/起始价。当溢价率超过100%且成交楼面价超过同期同区域同类地块楼面均价1.5倍时，视为异常高价竞地。房地产主业国企参与此类竞拍，直接推高地价预期，助长房价，与国家去库存和稳地价政策相抵触。
  audit_item: 未按规定落实去库存政策措施
  suspicion: 房地产主业企业异常高价竞地推高房价
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步做好房地产市场调控工作有关问题的通知\",\n    \"法规文号\": \"国办发〔2011〕1号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"相关条文\",\n    \"内容概述\": \"要求加强土地出让管理，坚决防止出现高价地，对存在捂地、捂盘行为的房地产开发企业应暂停其土地竞买资格，确保房地产市场平稳健康发展。\"\n\
    \  }\n]"
