name: audit/政策文件类/环评文件
type: model
description: 从政策文件类类文档（环评文件）中提取结构化元数据。涵盖字段如：危废种类、预测产生量。文档范围包括：环评文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 环评文件
  member_count: 1
  member_details:
  - 环评文件
output:
  fields:
  - name: 危废种类
    type: string
    description: 提取 危废种类 的文本值
  - name: 预测产生量
    type: string
    description: 提取 预测产生量 的文本值
violations:
- expression: ((环评文件.危废种类 > 0) && (台账建立情况 IS NULL || 台账建立情况.记录完整性))
  description: 环评文件或生产工艺确认有危险废物产生的单位，未建立或未能提供符合规范的危废管理台账，即构成违规。关键信息缺失指未记录产生量、种类、去向、贮存情况等。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 未按规定建立危险废物管理台账
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"主席令第五十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第七十八条\",\n    \"内容概述\": \"产生危险废物的单位，应当按照国家有关规定制定危险废物管理计划，建立危险废物管理台账，如实记录有关信息。\"\n  }\n]"
