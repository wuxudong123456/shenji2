name: audit/政策文件类/预算文件
type: model
description: 从政策文件类类文档（预算文件）中提取结构化元数据。涵盖字段如：安排金额、工程计划进度、拆迁补偿核算、拨付金额、支出功能分类、收款单位、材料名称、纳入中长期财政规划的执行情况。文档范围包括：中央及地方财政资金预算文件、农村公路管护资金预算文件、年度经费预算文件、本级政府年度预算文件、本级财政预算文件、项目概预算文件、项目预算文件、预算文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 工程
- 明细
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 预算文件
  member_count: 1
  member_details:
  - 中央及地方财政资金预算文件
  - 农村公路管护资金预算文件
  - 年度经费预算文件
  - 本级政府年度预算文件
  - 本级财政预算文件
  - 项目概预算文件
  - 项目预算文件
  - 预算文件
output:
  fields:
  - name: 安排金额
    type: number
    description: 提取 安排金额 的数值（含单位，如万元、吨等）
  - name: 工程计划进度
    type: string
    description: 提取 工程计划进度 的文本值
  - name: 拆迁补偿核算
    type: string
    description: 提取 拆迁补偿核算 的文本值
  - name: 拨付金额
    type: number
    description: 提取 拨付金额 的数值（含单位，如万元、吨等）
  - name: 支出功能分类
    type: number
    description: 提取 支出功能分类 的数值（含单位，如万元、吨等）
  - name: 收款单位
    type: number
    description: 提取 收款单位 的数值（含单位，如万元、吨等）
  - name: 材料名称
    type: string
    description: 提取 材料名称 的文本值
  - name: 纳入中长期财政规划的执行情况
    type: string
    description: 提取 纳入中长期财政规划的执行情况 的文本值
  - name: 节能减排预算科目
    type: number
    description: 提取 节能减排预算科目 的数值（含单位，如万元、吨等）
  - name: 该项目是否列入当年本级财政预算的决议文号
    type: number
    description: 提取 该项目是否列入当年本级财政预算的决议文号 的数值（含单位，如万元、吨等）
  - name: 贴息资金预算科目
    type: number
    description: 提取 贴息资金预算科目 的数值（含单位，如万元、吨等）
  - name: 资金用途
    type: string
    description: 提取 资金用途 的文本值
  - name: 项目成本明细
    type: string
    description: 提取 项目成本明细 的文本值
  - name: 项目支出明细
    type: number
    description: 提取 项目支出明细 的数值（含单位，如万元、吨等）
  - name: 预算单价
    type: number
    description: 提取 预算单价 的数值（含单位，如万元、吨等）
  - name: 预算科目
    type: number
    description: 提取 预算科目 的数值（含单位，如万元、吨等）
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 预算项目名称
    type: number
    description: 提取 预算项目名称 的数值（含单位，如万元、吨等）
violations:
- expression: 统计表.收款协会 IN 行业协会商会名单 AND (统计表.拨款依据 LIKE '%行业管理%' OR 预算文件.预算科目 IN ('行政事业经费', '专项业务费', '行业管理专项经费')) AND 统计表.拨款金额
    > 0 AND (服务合同 IS NULL OR 服务合同.服务内容 NOT IN 政府购买服务目录)
  description: 财政部门直接向协会拨款，拨款用途或预算科目涉及行政管理、行业管理，且无规范的政府购买服务合同或服务不在目录内，即属违规。金额阈值>0。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 违规为行业协会商会安排财政资金
  regulation: "[\n  {\n    \"法规名称\": \"行业协会商会与行政机关脱钩总体方案\",\n    \"法规文号\": \"中办发〔2015〕39号\",\n    \"效力级别\": \"党内法规/规范性文件\"\
    ,\n    \"条款号\": \"第三条配套政策（三）财政支持\",\n    \"内容概述\": \"财政部门不得向行业协会商会安排财政资金。确需委托其提供的服务，可通过政府购买服务方式实施。\"\n  }\n]"
- expression: 材料采购合同.采购单价 > 信息.同期市场均价 * 1.1 && 材料采购合同.签订日期 < 验收单.验收日期
  description: 当采购合同单价超出同期市场均价的110%时，视为价格异常；同时满足合同签订日期早于材料进场验收日期，排除时间错配，初步判定为虚高采购价格。
  audit_item: 工程项目成本异常调查
  suspicion: 材料采购单价异常偏高
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第五十一条\",\n    \"内容概述\": \"招标人应当自收到评标报告之日起3日内公示中标候选人，公示期不得少于3日。投标人或者其他利害关系人对评标结果有异议的，应当在中标候选人公示期间提出。\"\n  },\n\
    \  {\n    \"法规名称\": \"基本建设财务规则\",\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\",\n   \
    \ \"内容概述\": "
- expression: (清单表.项目名称 NOT LIKE '%小区%' AND 清单表.项目名称 NOT LIKE '%学校%' AND 清单表.项目名称 NOT LIKE '%道路%' AND 清单表.建设内容 IS NULL) ||
    ABS(分析表.计划金额 - 分析表.预算金额) / 分析表.计划金额 > 0.05
  description: 当项目名称仅为大类概括（如“城市基础设施建设”）且未明确具体建设地点、规模时，视为未细化；计划金额与预算金额差异率超过5%时，视为与预算脱节。两者满足任一即判定为违规线索。
  audit_item: 违反政府投资计划管理相关政策规定
  suspicion: 政府投资年度计划未细化或与预算脱节
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当明确项目名称、建设内容及规模、建设工期、项目总投资、年度投资额及资金来源等事项；政府投资年度计划应当和本级预算相衔接。\"\n  }\n]"
- expression: (规划文件.是否包含量化能耗目标) || (培训制度.签到记录<应参训人数*0.8) || (预算文件.预算金额==0) || ((明细表.实际支出金额/预算文件.预算金额)<0.8)
  description: 缺少专项规划或规划无量化目标、培训覆盖率低于80%、未编制专项预算、或预算执行率低于80%，均视为制度管理缺失或执行不到位。
  audit_item: 节能减排方面存在的问题
  suspicion: 未按规定建立节能环保专项规划、培训制度及经费预算
  regulation: "[\n  {\n    \"法规名称\": \"公共机构节能条例\",\n    \"法规文号\": \"国务院令第531号（2017年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十五条、第十七条、第二十四条\",\n    \"内容概述\": \"公共机构应当制定年度节能目标和实施方案；安排节能资金，开展能源消费统计和审计；加强对用能系统的管理，开展节能教育和岗位培训。\"\n  }\n]"
- expression: (明细表.实际到位金额/预算文件.预算金额 < 0.8) || (拨付延迟天数 > 90) || (挪用金额 > 0) || (ABS(对比表.实际完成值-对比表.绩效目标值)/对比表.绩效目标值 > 0.3)
  description: 财政资金实际到位率低于预算的80%，或资金拨付周期（从预算下达至到账）超过90天，或支出明细与预算项目不匹配存在挪用，或主要绩效指标偏差率超过30%，以上任一条件触发即判定财政扶持政策未落实，资金使用合规性或效果存在突出问题。
  audit_item: 现代农业产业园（集群、强镇）政策扶持不到位
  suspicion: 现代农业产业园财政扶持资金未足额落实
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\"\
    ,\n    \"内容概述\": \"各级政府财政部门应当依照法律、行政法规和国务院财政部门的规定，及时、足额地拨付预算支出资金，加强对预算支出的管理和监督。\"\n  },\n  {\n    \"法规名称\": \"中央财政衔接推进乡村振兴补助资金管理办法\"\
    ,\n    \"法规文号\": \"财农〔2021〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"各地不得擅自扩大资金使用范围，"
- expression: 贴息资金预算科目.安排金额 = 0 && 贴息文件.兑现周期 || (贴息文件.兑现周期 - 申报材料.申报贴息额) > 180 天 && 发放记录.发放金额 < 申报材料.申报贴息额 * 0.8
  description: 已出台明确贴息政策但财政未安排对应预算，或兑现延迟超过6个月，或实际发放金额不足应发额的80%，视为贴息政策空转。
  audit_item: 相关支持政策落实不到位
  suspicion: 涉农贷款贴息资金未安排或长期拖欠
  regulation: "[\n  {\n    \"法规名称\": \"财政部 农业农村部关于进一步做好农业相关财政金融政策落实工作的通知\",\n    \"法规文号\": \"财农〔2020〕XX号（示例）\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各级财政要将涉农贷款贴息资金足额纳入年度预算，及时审核拨付，不得无故拖延或降低兑现标准。\"\n  }\n]"
