name: audit/政策文件类/追认文件
type: model
description: 从政策文件类类文档（追认文件）中提取结构化元数据。涵盖字段如：签名、补办表决结果。文档范围包括：事后业主表决追认文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 追认文件
  member_count: 1
  member_details:
  - 事后业主表决追认文件
output:
  fields:
  - name: 签名
    type: string
    description: 提取 签名 的文本值
  - name: 补办表决结果
    type: boolean
    description: 提取 补办表决结果 的布尔值（是/否）
violations:
- expression: 批准人 == true && (缺失(施工日志记载的每日工程量) || 缺失(维修前中后对比照片) || 缺失(监理确认) || 缺失(补办表决结果))
  description: 已通过紧急程序审批并拨付资金的维修项目，若不能提供施工日志、监理报告、现场照片以及事后补办业主表决的任何一项支持性文件，即可判定为虚假紧急维修挪用资金。
  audit_item: 挪用住宅专项维修资金
  suspicion: 利用虚假紧急维修程序挪用资金
  regulation: "[\n  {\n    \"法规名称\": \"《住宅专项维修资金管理办法》\",\n    \"法规文号\": \"建设部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十四条\",\n    \"内容概述\": \"发生危及房屋安全等紧急情况，需要立即对住宅共用部位、共用设施设备进行维修和更新、改造的，可以凭应急使用方案和相关证明材料，申请列支维修资金，事后应当向业主公示相关情况并补充履行表决手续。\"\
    \n  }\n]"
