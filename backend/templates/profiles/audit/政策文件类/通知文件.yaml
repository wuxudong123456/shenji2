name: audit/政策文件类/通知文件
type: model
description: 从政策文件类类文档（通知文件）中提取结构化元数据。涵盖字段如：下发单位、下达日期、中央/省级资金及要求的地方配套金额、优待金标准、会议名称、会议日期、会议议程、原计划用途。文档范围包括：上级任务通知文件、会议通知文件、培训通知文件、实际举办会议通知文件、年度涉农资金动态调整通知文件、投资计划下达通知文件、抚恤金发放标准的调整通知文件、收费通知文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 会议
- 培训
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 通知文件
  member_count: 1
  member_details:
  - 上级任务通知文件
  - 会议通知文件
  - 培训通知文件
  - 实际举办会议通知文件
  - 年度涉农资金动态调整通知文件
  - 投资计划下达通知文件
  - 抚恤金发放标准的调整通知文件
  - 收费通知文件
output:
  fields:
  - name: 下发单位
    type: string
    description: 提取 下发单位 的文本值
  - name: 下达日期
    type: date
    description: 提取 下达日期 的日期值，格式 YYYY-MM-DD
  - name: 中央-省级资金及要求的地方配套金额
    type: number
    description: 提取 中央-省级资金及要求的地方配套金额 的数值（含单位，如万元、吨等）
  - name: 优待金标准
    type: string
    description: 提取 优待金标准 的文本值
  - name: 会议名称
    type: string
    description: 提取 会议名称 的文本值
  - name: 会议日期
    type: date
    description: 提取 会议日期 的日期值，格式 YYYY-MM-DD
  - name: 会议议程
    type: string
    description: 提取 会议议程 的文本值
  - name: 原计划用途
    type: string
    description: 提取 原计划用途 的文本值
  - name: 参会单位
    type: string
    description: 提取 参会单位 的文本值
  - name: 参训要求措辞
    type: string
    description: 提取 参训要求措辞 的文本值
  - name: 发布年份
    type: string
    description: 提取 发布年份 的文本值
  - name: 发文日期
    type: date
    description: 提取 发文日期 的日期值，格式 YYYY-MM-DD
  - name: 地点
    type: string
    description: 提取 地点 的文本值
  - name: 培训主题
    type: string
    description: 提取 培训主题 的文本值
  - name: 培训承办方
    type: string
    description: 提取 培训承办方 的文本值
  - name: 实施单位
    type: string
    description: 提取 实施单位 的文本值
  - name: 实际举办时间
    type: date
    description: 提取 实际举办时间 的日期值，格式 YYYY-MM-DD
  - name: 实际会议名称
    type: string
    description: 提取 实际会议名称 的文本值
  - name: 实际地点
    type: string
    description: 提取 实际地点 的文本值
  - name: 建设任务下达指标
    type: string
    description: 提取 建设任务下达指标 的文本值
  - name: 抚恤金月标准
    type: string
    description: 提取 抚恤金月标准 的文本值
  - name: 捆绑要求描述
    type: string
    description: 提取 捆绑要求描述 的文本值
  - name: 收费项目
    type: number
    description: 提取 收费项目 的数值（含单位，如万元、吨等）
  - name: 文号
    type: string
    description: 提取 文号 的文本值
  - name: 时间
    type: date
    description: 提取 时间 的日期值，格式 YYYY-MM-DD
  - name: 规定应提供的便民服务项目集
    type: string
    description: 提取 规定应提供的便民服务项目集 的文本值
  - name: 议程
    type: string
    description: 提取 议程 的文本值
  - name: 调整依据
    type: string
    description: 提取 调整依据 的文本值
  - name: 费用自理条款
    type: number
    description: 提取 费用自理条款 的数值（含单位，如万元、吨等）
  - name: 适用对象条件
    type: string
    description: 提取 适用对象条件 的文本值
  - name: 通知地点
    type: string
    description: 提取 通知地点 的文本值
  - name: 附件清单
    type: string
    description: 提取 附件清单 的文本值
  - name: 项目编号
    type: string
    description: 提取 项目编号 的文本值
  - name: 驻地城市
    type: string
    description: 提取 驻地城市 的文本值
  - name: 通知标题
    type: string
    description: 通知/通告标题
    required: false
  - name: 发文单位
    type: string
    description: 发文/发布单位
    required: false
  - name: 主送单位
    type: string
    description: 主送/抄送单位
    required: false
  - name: 通知内容
    type: string
    description: 通知核心内容摘要
    required: false
  - name: 执行要求
    type: string
    description: 执行要求/注意事项
    required: false
violations:
- expression: (通知文件.会议名称 NOT IN (签批意见、批准文号、批准期限、审批人、审批意见、审批日期.计划会议名称) OR 签批意见、批准文号、批准期限、审批人、审批意见、审批日期.审批号 IS NULL OR 签批意见、批准文号、批准期限、审批人、审批意见、审批日期.审批日期
    > 通知文件.实际举办时间) && 报销凭证.报销会议名称 = 通知文件.会议名称
  description: 将实际举办的会议与年度/月度会议计划及审批记录进行左关联，若实际会议无对应的计划记录，或虽有记录但审批缺失（审批号为空），或审批日期晚于会议举办日期（即先开会后补批），且该会议已发生费用报销，则判定为未经审批或计划外举办会议。
  audit_item: 未按规定举办会议
  suspicion: 未经审批或计划外举办会议
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十条\",\n    \"内容概述\": \"党政机关应当精简会议，严格执行会议费开支范围和标准。严格会议审批程序，严格控制会议数量、会期和规模。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\"\
    ,\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"各单位应当严格会议审批制度，"
- expression: (会议名称实际举办地点是否定点场所标注统计表.实际举办地点 NOT IN (定点场所名称地址协议有效期合作采购方式清单.定点场所名称)) && (报销会议名称费用发生日期金额发票号码按人结算费用总额报销人员名单人均费用报销总金额报销金额日期开票方名称场地地址费用金额报销凭证.场地地址
    != 定点场所名称地址协议有效期合作采购方式清单.地址) && (报销会议名称费用发生日期金额发票号码按人结算费用总额报销人员名单人均费用报销总金额报销金额日期开票方名称场地地址费用金额报销凭证.开票方名称 NOT IN (定点场所名称地址协议有效期合作采购方式清单.定点场所名称))
  description: 将实际会议地点与定点场所清单进行比对。若会议地点不在定点清单内，且场地租赁发票的开票方或地址与定点场所不匹配，则判定为在非定点场所举办会议。同时关注无场地发票但存在大额餐饮等关联消费的异常情况。
  audit_item: 未按规定举办会议
  suspicion: 在非定点场所举办会议
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"会议召开场所实行政府定点管理。党政机关会议应当到定点饭店召开，按照协议价格结算费用。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\"\
    ,\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"各单位召开会议应当到定点会议场所召开，按照"
- expression: (通知文件.通知地点 包含于 风景名胜区名录 OR 通知文件.通知地点 != 单位驻地城市) && (报销凭证.目的地城市 = 通知文件.通知地点) && (会议议程.实际举办时间 < 报销凭证.往返时间 * 0.5
    OR 消费凭证.金额 > 0)
  description: 将会议地点与《关于严禁党政机关到风景名胜区开会的通知》所列名录进行匹配，或与单位驻地城市比对。若会议地点在景区名录内或非驻地城市，且存在以下情形之一：1）会议议程中实际开会时间不足差旅总天数的50%（即大部分时间为游览）；2）出现景区门票、游览车等消费凭证，则判定违规。
  audit_item: 未按规定举办会议
  suspicion: 在驻地外或风景名胜区违规举办会议
  regulation: "[\n  {\n    \"法规名称\": \"关于严禁党政机关到风景名胜区开会的通知\",\n    \"法规文号\": \"厅字〔2014〕50号\",\n    \"效力级别\": \"党内法规\",\n \
    \   \"条款号\": \"第一条\",\n    \"内容概述\": \"各级党政机关一律不得到八达岭－十三陵、承德避暑山庄外八庙、五台山、太湖、普陀山、黄山、九华山、武夷山、庐山、泰山、嵩山、武当山、武陵源（张家界）、白云山、桂林漓江、三亚热带海滨、峨眉山－乐山大佛、九寨沟－黄龙、黄果树、西双版纳、天山天池等21个风景名胜区召开会议。\"\
    \n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文"
- expression: 通知文件.费用自理条款 && 批复文件.批准总预算金额 < 批准总预算金额
  description: 若会议通知中明确住宿、餐饮等费用由参会单位自理，但主办单位预算中未对该费用全额保障，实质是将本应由主办单位承担的会议费摊派给参会方，构成转嫁费用。
  audit_item: 超标准举办会议
  suspicion: 向参会单位转嫁会议费用变相规避预算
  regulation: "[\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十二条\",\n    \"内容概述\": \"各单位会议费支付，应当严格按照……不得向参会人员收取，不得以任何方式向下属机构、企事业单位、地方转嫁或摊派会议费。\"\n  }\n]"
- expression: ( 签到表.参训单位 && 通知文件.参训要求措辞（如‘必须’‘全员参加’） ) && ( 签到表.参训单位 && 票据.缴费金额 )
  description: 若培训通知明确要求‘必须参训’、‘未参训不得通过考核’等强制性语句，且参加培训的人员与后续接受该机关监督检查、资质续期的对象几乎完全重合，同时培训收费未按经营服务性收费管理规定报批或备案，则判定为利用行政权力强制培训并收费。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 以行政命令强制参加培训并收费
  regulation: "[\n  {\n    \"法规名称\": \"中共中央办公厅 国务院办公厅关于严禁党政机关到风景名胜区开会的通知（含延伸规定精神）\",\n    \"法规文号\": \"厅字〔2014〕50号\",\n   \
    \ \"效力级别\": \"制度文件\",\n    \"条款号\": \"总体要求\",\n    \"内容概述\": \"严禁党政机关以培训等名义变相收费。\"\n  },\n  {\n    \"法规名称\": \"行政事业性收费标准管理办法\"\
    ,\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"行政事业性收费实行目录清单管理，未列"
- expression: 信访投诉处理台账.投诉内容 LIKE '%不交XX费就不给办%' AND 收费通知文件.捆绑要求描述 LIKE '%必须缴纳%' AND 相关公共服务政策文件.公共服务项目办理条件 NOT LIKE '%'||收费通知文件.收费项目||'%'
  description: 通过投诉线索和收费通知，发现一项公共服务的办理被强制以缴纳另一无关收费为前提，且该收费项目无政策关联时，认定为捆绑收费。
  audit_item: 乱集资、乱摊派、乱收费
  suspicion: 强制捆绑无关联收费项目作为公共服务前置条件
  regulation: "[\n  {\n    \"法规名称\": \"农民承担费用和劳务管理条例\",\n    \"法规文号\": \"国务院令第92号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三条\",\n    \"内容概述\": \"除依法承担的税费外，要求农民无偿提供财力、物力和劳务的，均为乱摊派，农民有权拒绝。\"\n  }\n]"
- expression: (村民需求调研报告 IS NULL) OR ( (COUNT(村民需求调研报告.调研需求项目列表 ∩ 服务项目清单.实际服务项目列表) / COUNT(村民需求调研报告.调研需求项目列表)) < 0.6 )
  description: 缺失需求调研报告直接判定违规；若存在调研报告，计算需求项目匹配率，低于60%表明未紧扣实际需求建设，成效不佳。
  audit_item: 信息进村入户、电子商务进农村等村级服务站使用效果不佳
  suspicion: 村级服务站建设未开展需求调研导致功能与村民需求不匹配
  regulation: "[\n  {\n    \"法规名称\": \"农业部关于全面推进信息进村入户工程的通知\",\n    \"法规文号\": \"农计发〔2017〕6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"二（二）\",\n    \"内容概述\": \"信息进村入户工程建设必须坚持需求导向、因地制宜，避免简单分配任务、盲目建设，确保建设内容符合当地实际需求。\"\n  }\n]"
- expression: (配套资金拨付凭证.实际到账金额 < 上级任务通知文件.中央/省级资金及要求的地方配套金额) OR (资金使用明细.拨付金额 < 要求配套比例) OR (资金使用明细.对应工程节点 > 项目建设启动日期 + 30天)
  description: 地方实际配套资金小于任务文件要求的金额，或配套资金在总支出中占比未达到规定比例，或资金拨付严重滞后，均构成配套不足。缺口率>30%为严重程度。
  audit_item: 信息进村入户、电子商务进农村等村级服务站使用效果不佳
  suspicion: 地方配套资金未足额到位影响服务站正常运营
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\"\
    ,\n    \"内容概述\": \"各级政府、各部门、各单位的支出必须按照批准的预算执行，不得虚假列支，确保预算资金足额、及时拨付。\"\n  }\n]"
- expression: (SIZE(上级任务通知文件.规定应提供的便民服务项目集 - 服务项目清单.实际服务项目列表) > 0) OR (村民满意度调查汇总表.分项服务投诉率 > 0.2) OR (FOR 某项规定服务 IN 上级任务通知文件.规定应提供的便民服务项目集,
    服务项目清单中连续3个月服务次数 = 0)
  description: 政策要求的关键便民服务项目存在未开列缺失，或者已设置项目但投诉率长期高于20%，或连续3个月无服务记录，均视为服务实质性缺失。
  audit_item: 信息进村入户、电子商务进农村等村级服务站使用效果不佳
  suspicion: 村级服务站未按政策要求提供规定便民服务项目
  regulation: "[\n  {\n    \"法规名称\": \"农业部关于全面推进信息进村入户工程的通知\",\n    \"法规文号\": \"农计发〔2017〕6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"二（三）\",\n    \"内容概述\": \"村级信息服务站应按照要求提供公益服务、便民服务、电子商务服务和培训体验服务，保障基础服务项目全覆盖。\"\n  }\n]"
- expression: DATEDIFF(day, 时间表.批复日期, 时间表.计划下达日期) > 30
  description: 比较投资计划实际下达日期与上级批复日期的时间差，超过制度规定时限（如30个自然日）即触发违规。具体时限阈值以投资计划管理制度文件中的规定为准，若无明确规定则采用30日常用审计标准。
  audit_item: 投资计划分解下达不合规
  suspicion: 未按规定时限下达投资计划
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当和本级预算相衔接，并按照预算管理要求及时分解下达，确保项目按期执行。\"\n  }\n]"
- expression: (登记表.备案日期 IS NULL) || (登记表.备案日期 > 通知文件.下达日期)
  description: 将项目库备案信息登记表中的备案日期与计划下达日期进行比对，若不存在备案记录或备案日期晚于投资计划正式下达日期，即视为未及时备案。需注意排除因系统数据同步延迟造成的合理时差，但一般不应超过3个工作日。
  audit_item: 投资计划分解下达不合规
  suspicion: 项目库未及时备案计划分解情况
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十二条\"\
    ,\n    \"内容概述\": \"政府投资项目应当依托国家重大建设项目库等项目库系统，规范项目信息管理，及时报送并更新项目建设、资金等信息。\"\n  }\n]"
- expression: (任务清单编号 IS NULL) || (绩效目标编号 IS NULL)
  description: 检查关联对照表中，每一笔投资计划文号是否均有非空的任务清单文号和绩效目标编号，任一缺失即表示计划中未同步包含任务清单或绩效目标，构成违规。
  audit_item: 投资计划分解下达不合规
  suspicion: 投资计划未与任务清单及绩效目标同步下达
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第二点（三）\",\n    \"内容概述\": \"将绩效目标设置作为预算安排的前置条件，加强绩效目标审核，绩效目标应与预算同步批复下达。\"\n  }\n]"
- expression: (调整记录台账.调整金额 IS NOT NULL AND ABS(调整记录台账.调整金额) > 0) && (审批记录.审批单号 IS NULL || 审批记录.审批层级 != 管理制度文件.调整审批权限)
  description: 筛选出所有发生了金额或用途调整的计划，若调整记录无对应的审批单号（即未经审批），或审批层级低于制度规定的权限（如大规模调整未经发改委审批），则判定为随意调整。调整幅度超过原计划金额20%且无有效审批的，视为严重违规。
  audit_item: 投资计划分解下达不合规
  suspicion: 未经审批擅自调整已下达投资计划
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当严格执行，任何单位和个人不得擅自变更。确需调整的，应当按照规定的权限和程序审批，并报原审批部门备案。\"\n  }\n]"
- expression: (调整依据.发布年份 < 当前年份) || (明细表.资金分配基数 连续N年 == 固定值) && (ABS(明细表.分配面积或数量 - 数据.地块面积) > 阈值)
  description: 检查是否按规定每年发布调整通知。若多年未发布通知，或资金分配基数、面积多年保持不变，且与国土部门确权数据存在显著差异（如面积偏差超过10%），则判定为未实施动态调整。
  audit_item: 资金管理使用不符合相关规定
  suspicion: 涉农资金未实施年度动态调整
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"各级预算应当根据年度经济社会发展目标、国家宏观调控总体要求和跨年度预算平衡的需要，参考上一年预算执行情况、有关支出绩效评价结果和本年度收支预测，按照规定程序征求有关方面意见后，进行编制。\"\
    \n  }\n]"
