name: audit/政策文件类/情况文件
type: model
description: 从政策文件类类文档（情况文件）中提取结构化元数据。涵盖字段如：受益作物类型、实际拨付金额、实际用于果菜茶产区金额、支出明细、管理办法印发日期、管理办法完整文本、补贴发放面积、补贴金额。文档范围包括：相关项目资金使用情况文件、财政转移支付资金管理办法制定情况文件、资金使用情况文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 明细
- 补贴
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 情况文件
  member_count: 1
  member_details:
  - 相关项目资金使用情况文件
  - 财政转移支付资金管理办法制定情况文件
  - 资金使用情况文件
output:
  fields:
  - name: 受益作物类型
    type: string
    description: 提取 受益作物类型 的文本值
  - name: 实际拨付金额
    type: number
    description: 提取 实际拨付金额 的数值（含单位，如万元、吨等）
  - name: 实际用于果菜茶产区金额
    type: number
    description: 提取 实际用于果菜茶产区金额 的数值（含单位，如万元、吨等）
  - name: 支出明细
    type: number
    description: 提取 支出明细 的数值（含单位，如万元、吨等）
  - name: 管理办法印发日期
    type: date
    description: 提取 管理办法印发日期 的日期值，格式 YYYY-MM-DD
  - name: 管理办法完整文本
    type: string
    description: 提取 管理办法完整文本 的文本值
  - name: 补贴发放面积
    type: string
    description: 提取 补贴发放面积 的文本值
  - name: 补贴金额
    type: number
    description: 提取 补贴金额 的数值（含单位，如万元、吨等）
  - name: 资金下达日期
    type: date
    description: 提取 资金下达日期 的日期值，格式 YYYY-MM-DD
  - name: 资金拨付总额
    type: number
    description: 提取 资金拨付总额 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
violations:
- expression: (情况文件.管理办法印发日期 - 项目清单.首次拨款年度) > 180 || (情况文件.管理办法印发日期 IS NULL && 项目清单.设立时间 > DATE_SUB(CURDATE(), INTERVAL 6
    MONTH)) || (情况文件.管理办法完整文本 NOT CONTAIN '分配标准' || 情况文件.管理办法完整文本 NOT CONTAIN '绩效评价' || 情况文件.管理办法完整文本 NOT CONTAIN '监督检查')
  description: 条件一：资金管理办法印发日期晚于资金首次下达日期180天以上，超期未制定视为违规；条件二：项目设立超过6个月仍未出台任何管理办法，设定为疑点；条件三：管理办法未包含分配标准、绩效评价、监督检查等必备要素，为不完备。满足任一条件即判定管理办法制定不规范或及时性缺失。
  audit_item: 财政转移支付体系建设不健全
  suspicion: 转移支付资金管理办法制定不及时或不完善
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十三条\",\n    \"内容概述\": \"省级财政部门应当会同有关部门，结合本地区实际，制定完善专项转移支付资金管理办法，报财政部备案。管理办法应包括资金分配、使用、监督和绩效评价等内容。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条、第五十七条\""
- expression: '[数据表.化肥减量完成率（%）] = ( [数据表.基线化肥用量（吨/亩）] - [数据表.当期化肥用量（吨/亩）] ) / [数据表.基线化肥用量（吨/亩）] < 0.2 || ( [评分表.考核结果] == ''完成''
    && ( [数据表.化肥减量完成率（%）] < 0.2 || ( [情况文件.实际用于果菜茶产区金额（万元）] / [情况文件.资金拨付总额（万元）] < 0.6 ) ) )'
  description: 计算果菜茶优势产区的化肥减量率，若低于20%即判定未达标。同时设置隐蔽违规逻辑：即便考核结果填报为‘完成’，但只要实际减量率小于20%，或项目资金中仅有不足60%真正投向果菜茶产区（即资金被挪作他用），则认定为目标任务未完成且存在违规行为。阈值60%可根据责任书中规定的资金专款专用比例调整。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 果菜茶优势产区化肥用量未减少20%以上
  regulation: "[\n  {\n    \"法规名称\": \"开展果菜茶有机肥替代化肥行动方案\",\n    \"法规文号\": \"农农发〔2017〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n \
    \   \"条款号\": \"第二部分 目标任务\",\n    \"内容概述\": \"到2020年，果菜茶优势产区化肥用量减少20%以上。\"\n  }\n]"
- expression: 实际完成工程量 < 计划任务量
  description: 当进度表中的实际完成工程量低于实施方案所确定的计划任务量时，直接判定任务未完成；若完成率低于80%，则认定为严重滞后，需追溯资金拨付及责任主体原因。
  audit_item: 黑土地保护治理相关任务未完成或完成质量不高
  suspicion: 农田基础设施建设任务未按期完成
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"主席令第一一三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第二十三条\",\n    \"内容概述\": \"县级以上人民政府应当加强黑土地农田基础设施建设，持续提高黑土地耕地质量，确保高标准农田建设任务按期完成。\"\n  }\n]"
- expression: (申报面积 - 核验面积) > 0 && (申报面积 - 核验面积) / 申报面积 > 0.05
  description: 当保护性耕作实施面积的申报数据大于实地核验或遥感认定数据，且虚报比例超过5%时，认定为蓄意虚报。若虚报面积绝对值超过500亩或虚报率大于20%，则属严重违规，极大概率存在骗补。
  audit_item: 黑土地保护治理相关任务未完成或完成质量不高
  suspicion: 虚报保护性耕作实施面积骗取补贴
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员以虚报、冒领等手段骗取财政资金，或违反规定扩大开支范围、提高开支标准的，应给予处罚处分。\"\n  }\n]"
