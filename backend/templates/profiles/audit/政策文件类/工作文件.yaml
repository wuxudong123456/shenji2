name: audit/政策文件类/工作文件
type: model
description: 从政策文件类类文档（工作文件）中提取结构化元数据。涵盖字段如：可研报告批复日期、项目编码。文档范围包括：直接投资项目前期工作文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 工作文件
  member_count: 1
  member_details:
  - 直接投资项目前期工作文件
output:
  fields:
  - name: 可研报告批复日期
    type: date
    description: 提取 可研报告批复日期 的日期值，格式 YYYY-MM-DD
  - name: 项目编码
    type: string
    description: 提取 项目编码 的文本值
violations:
- expression: 直接投资项目前期工作文件.可研报告批复日期 > 年度投资计划分解下达表.计划下达日期
  description: 判断项目可行性研究报告批复（立项）日期是否晚于将该项目列入年度投资计划的下达日期。若批复日期晚于计划下达日期，则说明项目在未取得合规身份的情况下违规被列入计划。
  audit_item: 项目计划分解下达不合规
  suspicion: 直接投资项目前期工作未完成即列入年度投资计划
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条、第十一条\"\
    ,\n    \"内容概述\": \"政府投资项目应当编制项目建议书、可行性研究报告等，并按照规定审批。投资主管部门应当根据国民经济和社会发展规划、中期财政规划等，审查项目建设的必要性、可行性。审批通过后方可列入投资计划。\"\n  }\n\
    ]"
