name: audit/政策文件类/权限文件
type: model
description: 从政策文件类类文档（权限文件）中提取结构化元数据。涵盖字段如：审批层级、审批时限规定、正常流程规定、重大采购金额阈值。文档范围包括：保障待遇发放审批权限文件、采购管理制度审批权限文件、预算编制流程及审批权限文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 审批
- 采购
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 权限文件
  member_count: 1
  member_details:
  - 保障待遇发放审批权限文件
  - 采购管理制度审批权限文件
  - 预算编制流程及审批权限文件
output:
  fields:
  - name: 审批层级
    type: string
    description: 提取 审批层级 的文本值
  - name: 审批时限规定
    type: string
    description: 提取 审批时限规定 的文本值
  - name: 正常流程规定
    type: string
    description: 提取 正常流程规定 的文本值
  - name: 重大采购金额阈值
    type: number
    description: 提取 重大采购金额阈值 的数值（含单位，如万元、吨等）
violations:
- expression: (申报表.审核意见 == '不通过' 或 审核记录.审核结论 == '不合格') && 安排表.安排状态 == '已安排预算'
  description: 若项目绩效目标审核意见为“不通过”或审核过程记录显示“不合格”，但该项目却出现在年度预算安排计划表中且状态为“已安排预算”，则判定为审核不合格即进入预算安排流程。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 审核不合格即进入预算安排流程
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"2014年修正\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条\"\
    ,\n    \"内容概述\": \"各部门、各单位应当按照绩效目标管理等预算绩效管理要求编制预算草案。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条、第十七条\",\n    \"内容概述\": \"绩效目标审核不合格的项目不得进入预算安排环节，需修改完善后重新审核。\"\n  "
