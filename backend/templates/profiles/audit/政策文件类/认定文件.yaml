name: audit/政策文件类/认定文件
type: model
description: 从政策文件类类文档（认定文件）中提取结构化元数据。涵盖字段如：五保户身份证号及人数、企业名称、保障类型、在册低保户、实际投资损失金额、家庭收入、已认定的投资性房地产清单、损失原因分析。文档范围包括：住房保障对象的资格认定文件、农业企业享受政策资格认定文件、农村五保供养对象资格认定文件、垦区职工身份认定文件、城乡低保户资格认定文件、投资性房地产认定文件、投资损失责任认定文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 认定文件
  member_count: 1
  member_details:
  - 住房保障对象的资格认定文件
  - 农业企业享受政策资格认定文件
  - 农村五保供养对象资格认定文件
  - 垦区职工身份认定文件
  - 城乡低保户资格认定文件
  - 投资性房地产认定文件
  - 投资损失责任认定文件
output:
  fields:
  - name: 五保户身份证号及人数
    type: number
    description: 提取 五保户身份证号及人数 的数值（含单位，如万元、吨等）
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 保障类型
    type: string
    description: 提取 保障类型 的文本值
  - name: 在册低保户
    type: string
    description: 提取 在册低保户 的文本值
  - name: 实际投资损失金额
    type: number
    description: 提取 实际投资损失金额 的数值（含单位，如万元、吨等）
  - name: 家庭收入
    type: number
    description: 提取 家庭收入 的数值（含单位，如万元、吨等）
  - name: 已认定的投资性房地产清单
    type: string
    description: 提取 已认定的投资性房地产清单 的文本值
  - name: 损失原因分析
    type: string
    description: 提取 损失原因分析 的文本值
  - name: 申请人姓名
    type: string
    description: 提取 申请人姓名 的文本值
  - name: 社保缴纳记录
    type: string
    description: 提取 社保缴纳记录 的文本值
  - name: 职工名单
    type: string
    description: 提取 职工名单 的文本值
  - name: 认定结果
    type: boolean
    description: 提取 认定结果 的布尔值（是/否）
violations:
- expression: 出租合同.租赁期 > 0 && 出租合同.租赁资产名称 NOT IN (认定文件.已认定的投资性房地产清单) && 明细账.使用状态 = '出租'
  description: 已出租的房屋应当确认为投资性房地产，若仍在固定资产列报，则分类错误，后续计量方式可能不符合准则规定。
  audit_item: 未按规定核算资产
  suspicion: 已出租房产未重分类为投资性房地产
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第3号——投资性房地产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二条、第六条\",\n    \"内容概述\": \"投资性房地产是指为赚取租金或资本增值而持有的房地产；已出租的建筑物应当适用本准则。\"\n  }\n]"
- expression: (农业部门备案清单.服务类型 IN 国家和地方农业社会化服务增值税免征政策文件.免税服务范围) AND (农业企业享受政策资格认定文件.认定结果 = '符合') AND (农业企业增值税申报表.免税销售额 = 0 OR
    农业企业增值税申报表.应纳税额 > 0)
  description: 表达式筛选出已在农业部门备案且资格认定符合免税条件，但在税务申报表中未填报免税销售额或仍缴纳了增值税的企业。当免税销售额为零且应纳税额大于零时，触发疑点，表明企业虽符合免税条件却未能享受免征政策。
  audit_item: 农业社会化服务政策扶持不到位
  suspicion: 农业社会化服务企业增值税免税政策未落实
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国增值税暂行条例\",\n    \"法规文号\": \"国务院令第691号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条第一款\",\n    \"内容概述\": \"农业生产者销售的自产农产品免征增值税。\"\n  },\n  {\n    \"法规名称\": \"财政部 国家税务总局关于全面推开营业税改征增值税试点的通知\",\n \
    \   \"法规文号\": \"财税〔2016〕36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"附件3第一条第（十）项\",\n    \"内容概述\": \"农业机耕、排灌、病虫害防治、植物保护、农牧保险"
- expression: (人员名单.已纳入减免名单的人数及身份信息 < 认定文件.在册低保户、五保户身份证号及人数) || (发放台账.实际发放补贴金额及对应人员 < 应发放金额) || (审批材料.审批通过时间 > 60个工作日) ||
    (明细表.免费穴位标注)
  description: 惠民政策覆盖名单人数少于同期在册困难群众总数，或补贴发放到位率低于95%，或减免审批用时超过60个工作日（远超合理时限），或公益性公墓中本应免费的穴位存在收费记录，均视为未解决基本需求。
  audit_item: 农村公益性殡葬政策未有效落实
  suspicion: 未保障困难群众基本殡葬需求
  regulation: "[\n  {\n    \"法规名称\": \"民政部关于全面推行惠民殡葬政策的指导意见\",\n    \"法规文号\": \"民发〔2012〕211号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三点\",\n    \"内容概述\": \"各地要为城乡低保对象、农村五保供养对象等困难群众免除基本殡葬服务费用，覆盖基本丧葬需求，确保政策惠及所有符合条件的对象。\"\n  }\n]"
- expression: (表5.申请人身份证号 NOT IN (垦区职工名单)) || (表5.改造前后对比照片相同或无验收签字) || (表5.同一房屋地址重复申请) || (表1.该家庭已享受其他住房保障补贴)
  description: 申领人非垦区在职或退休职工，身份不符；危房改造验收资料缺失或照片显示无明显改造痕迹，表明未实际改造；同一地址在不同年份或不同项目重复出现；家庭已享受过其他保障性住房补贴，重复享受应禁止。任一条件触发疑点。
  audit_item: 不符合条件的家庭违规获取住房保障待遇
  suspicion: 非垦区职工或未实际改造骗取垦区危房补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业部 国家发展改革委 住房城乡建设部关于做好农垦危房改造工作的意见\",\n    \"法规文号\": \"农垦发〔2011〕3号\",\n    \"效力级别\"\
    : \"部门规范性文件\",\n    \"条款号\": \"三、严格对象审核\",\n    \"内容概述\": \"严格审核申请对象资格，垦区危房改造资金必须用于垦区职工危房改造，不得虚报冒领。\"\n  }\n]"
- expression: (认定文件.家庭收入 < 当地低收入标准 && 缴费凭证.税种（个人所得税） == '个人所得税' && 缴费凭证.实缴金额 > 0) || (登记表.房屋信息 == '已分配' && 认定文件.保障类型 IN ('需提供所得税完税证明'))
  description: 当住房保障对象为低收入家庭，政策规定应减免或简化个人所得税相关手续时，若发现保障对象缴纳了个人所得税或资格审核时被强制要求提供完税证明，则视为违规增加负担。
  audit_item: 违规向保障性安居工程项目收取应减免税费
  suspicion: 向住房保障对象违规收取个人所得税
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四条第（二）项\",\n    \"内容概述\": \"规范保障性住房准入审核，不得违规增加审批环节和材料要求，切实减轻保障对象负担。\"\n  }\n]"
