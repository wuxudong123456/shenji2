name: audit/政策文件类/机制文件
type: model
description: 从政策文件类类文档（机制文件）中提取结构化元数据。涵盖字段如：会议议题、信息共享要求、协调机制运行规则、响应启动条件、响应流程、城乡生均公用经费基准定额、投放价格规定、投放响应时限。文档范围包括：农村低收入群体住房安全动态监测机制文件、地方政府义务教育经费保障机制文件、市场价格预警触发机制文件、跨部门协同治理机制文件、跨部门协调机制文件、部门间协调机制文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 会议
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 机制文件
  member_count: 1
  member_details:
  - 农村低收入群体住房安全动态监测机制文件
  - 地方政府义务教育经费保障机制文件
  - 市场价格预警触发机制文件
  - 跨部门协同治理机制文件
  - 跨部门协调机制文件
  - 部门间协调机制文件
output:
  fields:
  - name: 会议议题
    type: string
    description: 提取 会议议题 的文本值
  - name: 信息共享要求
    type: string
    description: 提取 信息共享要求 的文本值
  - name: 协调机制运行规则
    type: string
    description: 提取 协调机制运行规则 的文本值
  - name: 响应启动条件
    type: string
    description: 提取 响应启动条件 的文本值
  - name: 响应流程
    type: string
    description: 提取 响应流程 的文本值
  - name: 城乡生均公用经费基准定额
    type: number
    description: 提取 城乡生均公用经费基准定额 的数值（含单位，如万元、吨等）
  - name: 投放价格规定
    type: number
    description: 提取 投放价格规定 的数值（含单位，如万元、吨等）
  - name: 投放响应时限
    type: string
    description: 提取 投放响应时限 的文本值
  - name: 时限要求
    type: string
    description: 提取 时限要求 的文本值
  - name: 是否明确农村倾斜条款
    type: number
    description: 提取 是否明确农村倾斜条款 的数值（含单位，如万元、吨等）
  - name: 最终决议
    type: string
    description: 提取 最终决议 的文本值
  - name: 监测周期
    type: string
    description: 提取 监测周期 的文本值
  - name: 讨论议题
    type: string
    description: 提取 讨论议题 的文本值
  - name: 责任分工决议
    type: string
    description: 提取 责任分工决议 的文本值
  - name: 责任部门
    type: string
    description: 提取 责任部门 的文本值
  - name: 资金保障条款
    type: number
    description: 提取 资金保障条款 的数值（含单位，如万元、吨等）
  - name: 过度上涨预警阈值
    type: string
    description: 提取 过度上涨预警阈值 的文本值
  - name: 过度下跌预警阈值
    type: string
    description: 提取 过度下跌预警阈值 的文本值
violations:
- expression: 跨部门重复申报项目对比分析表.相似度评分 > 0.7 && 跨部门重复申报项目对比分析表.归口部门 != 涉农专项资金分配明细表.归口部门 && 跨部门重复申报项目对比分析表.项目名称 相近
  description: 当同一项目或承担单位在不同部门专项中相似度评分超过0.7时，表明存在高度重复，且归口部门不同，触发多头管理、交叉重复疑点。相似度评分可采用TF-IDF余弦相似度计算。
  audit_item: “大专项+任务清单”管理不到位
  suspicion: 涉农资金多头管理交叉重复使用
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于探索建立涉农资金统筹整合长效机制的意见\",\n    \"法规文号\": \"国发〔2017〕54号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、（五）\",\n    \"内容概述\": \"要求打破部门分割，建立涉农资金统筹整合机制，避免多头管理、交叉重复，对边界不清的资金进行整合，统一项目管理和资金分配。\"\n  }\n]"
- expression: (对比表.农村生均公用经费拨款金额 <= 对比表.城镇生均公用经费拨款金额) || (分配表.农村学校分配金额 / 分配表.总分配金额 < 政策要求农村最低占比)
  description: 农村生均公用经费拨款未高于城镇水平，或转移支付资金中农村学校分配比例低于省级政策明确要求的农村最低占比（如60%），则判定为未落实农村倾斜政策；需结合地域经济水平，若经济社会发展水平相近但农村拨款更低，视为严重违规。
  audit_item: 农村义务教育师资配备及经费保障方面不符合相关规定
  suspicion: 义务教育经费投入未向农村地区倾斜
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于进一步完善城乡义务教育经费保障机制的通知\",\n    \"法规文号\": \"国发〔2015〕67号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、主要内容（一）\",\n    \"内容概述\": \"统一城乡义务教育学校生均公用经费基准定额，中央和地方按比例分担，重点向农村地区倾斜，适当提高寄宿制学校、规模较小学校公用经费补助水平。\"\n\
    \  }\n]"
- expression: (机制文件.响应流程 = '') || (机制文件.监测周期 = '') || (信息表.最新危险等级鉴定日期 - 库.数据更新日期 > 12个月) || (信息表.低收入群体标识 = '是' AND 库.危险等级
    IN ('C','D') AND 信息表.是否纳入改造计划 = '否')
  description: 动态监测机制文件缺失或未明确监测周期，直接判定未建立长效机制；低收入群体危房信息若超过12个月未更新，或已鉴定为C/D级危房但未纳入改造计划，均表明动态监测未实质运行，存在保障漏洞。
  audit_item: 农村危房改造（含农房改善、撤村并居）不符合相关规定
  suspicion: 未建立低收入群体住房安全动态监测长效机制
  regulation: "[\n  {\n    \"法规名称\": \"关于做好农村低收入群体等重点对象住房安全保障工作的实施意见\",\n    \"法规文号\": \"建村〔2021〕35号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"各地要建立农村低收入群体住房安全动态监测机制，及时发现并改造新增危房，确保保障对象住房安全。\"\n  }\n]"
- expression: (数据表.氨氮浓度 > 2.0 || 数据表.总磷浓度 > 0.4) && (EXISTS(图.排污口位置) || EXISTS(图.农田范围)) && (治理方案.管控措施 NOT LIKE '%控源截污%' ||
    机制文件.责任分工决议 LIKE '%推诿%')
  description: 表达式判定逻辑：1. 治理后的水体水质监测指标（氨氮、总磷）超出地表水V类标准，出现富营养化反弹；2. GIS空间分析确认水体汇水区范围内存在养殖场或农田等污染源；3. 同时，审查治理方案发现未包含对这些污染源的控源截污措施，或跨部门联席会议纪要充分暴露了职责推诿。三者同时满足，高度警示治理与面源管控脱节。
  audit_item: 农村黑臭水体治理不到位
  suspicion: 治理后水质因面源污染反弹
  regulation: "[\n  {\n    \"法规名称\": \"农业农村污染治理攻坚战行动方案(2021-2025年)\",\n    \"法规文号\": \"环土壤〔2022〕8号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、(八)\",\n    \"内容概述\": \"推进农村黑臭水体治理。要统筹农村黑臭水体与农村生活污水、农业面源污染治理，形成合力。对纳入监管清单的黑臭水体，要精准识别污染成因，系统开展控源截污、清淤疏浚、生态修复等工程。\"\
    \n  }\n]"
- expression: (日报表.猪粮比价 < 机制文件.过度下跌预警阈值（如猪粮比） && DATEDIFF(决策文件.投放令签发日期, 日报表.监测日期) > 机制文件.时限要求) || (日报表.猪粮比价 < 机制文件.过度下跌预警阈值（如猪粮比）
    && 决策文件 == NULL)
  description: 当价格监测数据达到过度下跌预警阈值（如猪粮比低于5:1）后，未在规定时限内（如7个工作日）作出收储决策或未形成任何决策文件，即判定为未按规定实施临时收储。
  audit_item: 落实政府猪肉储备政策不到位
  suspicion: 价格过度下跌时未启动临时储备收储
  regulation: "[\n  {\n    \"法规名称\": \"关于完善政府猪肉储备调节机制 做好猪肉市场保供稳价工作预案\",\n    \"法规文号\": \"发改价格〔2021〕770号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"三、（二）临时储备收储\",\n    \"内容概述\": \"当猪粮比价进入过度下跌一级预警区间时，由地方人民政府负责启动临时储备收储，收储数量、时间、价格等由各地根据预案具体确定，并规定响应启动时限和资金保障。\"\
    \n  }\n]"
- expression: (测日报表.同比涨幅 > 过度下跌预警阈值（如猪粮比）.过度上涨预警阈值 && DATEDIFF(决策文件.投放令签发日期, 测日报表.监测日期) > 过度下跌预警阈值（如猪粮比）.投放响应时限) || (决策文件.计划投放数量
    > 0 && 记录表.投放数量 / 决策文件.计划投放数量 < 0.8)
  description: 当猪肉零售价同比涨幅超过制度规定的过度上涨阈值（如40%）后，超过规定响应时限未作出投放决策，或虽已决策但实际投放量不足计划量的80%，均属违规。
  audit_item: 落实政府猪肉储备政策不到位
  suspicion: 价格过度上涨时未及时投放政府猪肉储备
  regulation: "[\n  {\n    \"法规名称\": \"关于完善政府猪肉储备调节机制 做好猪肉市场保供稳价工作预案\",\n    \"法规文号\": \"发改价格〔2021〕770号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"三、（三）储备投放\",\n    \"内容概述\": \"当猪肉价格出现过度上涨时，地方政府应适时投放政府猪肉储备，增加市场供应，引导价格合理运行，投放数量、价格和区域需满足预案要求，确保投放实效。\"\
    \n  }\n]"
- expression: 多项目重叠实施区域冲突问题清单.重叠面积 > 0 && ((跨部门协调会议纪要.协调会议召开次数 = 0) || (DATEDIFF(多项目重叠实施区域冲突问题清单.冲突问题发现时间, 跨部门协调会议纪要.最近一次会议时间)
    > 365))
  description: 存在项目空间重叠且措施冲突（重叠面积大于0），同时缺乏跨部门协调机制（协调会议召开次数为0）或者最近一次协调会议距离问题发现时间已超过1年（365天），证明统筹机制长期失效，冲突风险未能及时化解。
  audit_item: 黑土地保护治理缺少持续性，后期管护不到位
  suspicion: 多项目治理措施统筹不力导致相互冲突
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于探索建立涉农资金统筹整合长效机制的意见\",\n    \"法规文号\": \"国发〔2017〕54号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（三）项\",\n    \"内容概述\": \"要加强部门间的沟通协作，在同一区域集中投入不同渠道资金时，要加强规划统筹和任务分工，防止项目重复建设、措施相互‘打架’，确保资金整合效益最大化。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国乡村振兴促进法\",\n    \"法规文号\": \"中华人民共和国主席令第77号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":"
