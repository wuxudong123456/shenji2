name: audit/政策文件类/招标文件
type: model
description: 从政策文件类类文档（招标文件）中提取结构化元数据。涵盖字段如：★条款、业绩条件、业绩要求、中标人确定规则、中标结果、中标通知书、付款条件、付款节点及比例。文档范围包括：各子项目招标文件、学校食堂承包合同招标文件、招标文件、第三方机构招标文件、采购合同招标文件、项目招标文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 付款
- 合同
- 工程
- 招投标
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 招标文件
  member_count: 1
  member_details:
  - 各子项目招标文件
  - 学校食堂承包合同招标文件
  - 招标文件
  - 第三方机构招标文件
  - 采购合同招标文件
  - 项目招标文件
