violations:
- expression: ((访问目标文件（标底文件）.访问内容（含评标专家查询） LIKE '%评标专家%' AND 访问时间 < 开标时间) AND 操作人 NOT IN (权限名单.允许查看人员)) || (相似度(投标文件.技术方案,
    招标文件.技术参数要求) > 0.90 AND 投标准备时长 < 3天)
  description: 开标前非授权人员查阅评标专家名单，或投标文件的技术方案与招标要求异常吻合且准备时间极短，均表明存在评标信息或关键技术参数被提前泄露的风险。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 泄露评标专家名单或关键信息影响公平竞争
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"招标人向他人透露已获取招标文件的潜在投标人的名称、数量或者可能影响公平竞争的有关招标投标的其他情况的，或者泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款。\"\n  }\n]"
- expression: (批复文件.投资估算金额 >= 项目清单.限额标准) && (招标文件.招标方式 == '邀请招标') && (申请.批复文件编号 IS NULL || 跟踪表.审批节点 != '已完成')
  description: 当项目满足依法必须公开招标的规模标准（如施工合同估算价400万元以上），而实际采用邀请招标，且无法提供合规的审批文件或审批流程未完成时，判定为违规。金额标准依据国家发改委16号令等规定，具体阈值需根据该类项目现行有效规定设定。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 未经批准擅自将公开招标改为邀请招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十一条\",\n    \"内容概述\": \"国家重点项目和地方重点项目应当进行公开招标，确需采用邀请招标方式的，须经国务院发展计划部门或者省、自治区、直辖市人民政府批准。\"\n  },\n  {\n    \"法规名称\": \"\
    必须招标的工程项目规定\",\n    \"法规文号\": \"国家发展和改革委员会令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"规定必须招标的工程项"
- expression: (SUM(招标文件.合同估算价) >= 项目清单.限额标准) && (招标文件.招标方式 全部为 '邀请招标' 或 '竞争性谈判') && (招标文件.建设内容 存在功能关联或地理相邻) && (招标文件.立项时间
    相近)
  description: 将同一工程或存在功能关联的整体项目，拆分为多个低于强制公开招标限额的子项目，各子项目均采用非公开方式采购，且立项时间集中、最终由同一承包商或关联企业中标。金额标准依据现行法规，关联性根据建设规划、选址、设计文件综合判断。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 拆分项目化整为零规避公开招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n    \"法规文号\"\
    : \"国家发展和改革委员会令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条、第五条\",\n    \"内容概述\": \"明确必须招标的项目范围及规模标准，禁止通过拆分方式规避。\"\
    \n "
- expression: 招标文件.计价方式 == '固定总价' && 文本.价格形式 != '固定总价'
  description: 当招标文件明确要求采用固定总价合同时，正式合同却采用单价可调或其他计价方式，即构成实质性内容背离，触犯法规。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 合同价格条款与招标文件实质性偏离
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n]"
- expression: 文本.服务期限条款 < 招标文件.服务期限 && 缺少合规变更审批
  description: 合同约定的服务年数少于招标文件规定的年数，且无正当变更审批，属于关键服务内容缩水。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 合同服务期限与招标文件要求不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n]"
- expression: 文本.预付款比例 > 招标文件.预付款比例 || (招标文件.付款节点及比例（如验收后付至90%） != 文本.付款条件)
  description: 招标文件明确验收后支付高比例，合同改为更前置的高比例预付款，显著改变资金支付风险分配，背离实质性内容。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 合同付款条件与招标文件重大背离
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n]"
- expression: 补充协议.调整后的装修标准 != 招标文件.装修标准（国标） && 补充协议.签订时间 > 合同签订时间 && 缺少合规变更审批
  description: 补充协议擅自降低招标文件确定的国家标准为地方标准，属于通过补充协议背离实质性内容，且无正当审批流程，构成阴阳合同。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 签订补充协议降低技术标准背离招标文件
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n]"
