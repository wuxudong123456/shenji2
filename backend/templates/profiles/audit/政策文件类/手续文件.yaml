name: audit/政策文件类/手续文件
type: model
description: 从政策文件类类文档（手续文件）中提取结构化元数据。涵盖字段如：价值、借用期限、名称、审批文号、批准文号、批复日期、规格、调入车辆。文档范围包括：前期手续文件、资产移交手续文件、车辆借用手续文件、车辆调拨手续文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 审批
- 资产
- 车辆
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 手续文件
  member_count: 1
  member_details:
  - 前期手续文件
  - 资产移交手续文件
  - 车辆借用手续文件
  - 车辆调拨手续文件
output:
  fields:
  - name: 价值
    type: string
    description: 提取 价值 的文本值
  - name: 借用期限
    type: string
    description: 提取 借用期限 的文本值
  - name: 名称
    type: string
    description: 提取 名称 的文本值
  - name: 审批文号
    type: string
    description: 提取 审批文号 的文本值
  - name: 批准文号
    type: string
    description: 提取 批准文号 的文本值
  - name: 批复日期
    type: date
    description: 提取 批复日期 的日期值，格式 YYYY-MM-DD
  - name: 规格
    type: string
    description: 提取 规格 的文本值
  - name: 调入车辆
    type: string
    description: 提取 调入车辆 的文本值
  - name: 调出车辆
    type: string
    description: 提取 调出车辆 的文本值
  - name: 资产编号
    type: string
    description: 提取 资产编号 的文本值
violations:
- expression: (登记台账类.车牌号 IN 登记表.车牌号) AND ((手续文件 IS NULL) OR (登记表.用车时间 > 手续文件.借用期限) OR (登记台账类.车辆费用预算归属 != 登记台账类.权属单位))
  description: 若单位公务用车台账中包含下属或其他单位的资产车辆，且无合规的调拨或借用审批文件，或实际使用期限严重超出批准期限（如超过1个月未续期），或相关运行费用未向原单位列支或补偿，则判定为违规占用。
  audit_item: 违规管理或使用公务用车
  suspicion: 违规占用下属或其他单位车辆
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"党政机关不得以任何方式换用、借用、占用下属单位或者其他单位和个人的车辆，不得接受企事业单位和个人赠送的车辆。\"\n  }\n]"
- expression: 投资计划申请表.申报日期 < 前期手续文件.批复日期（针对任一必需要件） || 要件办理状态 = '未完成'
  description: 投资计划申报日期必须晚于所有法定前置审批手续（如可研、环评、用地等）的批准日期，若申报时任一要件状态为“未完成”或申报日期早于批复日期，即构成违规。
  audit_item: 项目计划申报不合规
  suspicion: 前期手续不完备即申报涉农投资计划
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条、第二十条\"\
    ,\n    \"内容概述\": \"项目单位应当依法办理相关前期审批手续，项目达到规定的开工条件后方可开工建设；申报投资计划时应当已完成可行性研究报告批复及必要的环评等手续。\"\n  }\n]"
