violations:
- expression: (支付凭证.摘要 LIKE '%拨付%' OR 支付凭证.摘要 LIKE '%转拨%' OR 支付凭证.经济分类科目 IN ('转移性支出','对附属单位补助支出')) AND 支付凭证.支付日期 BETWEEN '当年-11-01'
    AND '当年-12-31' AND (项目进度报告 IS NULL OR 项目进度报告.完工百分比 < 50%) AND (收款方银行流水.资金转出日期 IS NULL OR DATEDIFF(收款方银行流水.资金转出日期, 收款方银行流水.收款日期)
    > 30)
  description: 年末支付凭证中支付摘要出现拨付类字样或经济分类为转移性支出，收款项目对应的实际完工进度不足50%或缺乏验收材料，且资金在收款方账户停留超过30天未实际使用，构成以拨作支。若项目进度报告缺失，直接判定为高风险。
  audit_item: 预算执行率不真实
  suspicion: 以拨作支虚列预算支出
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当对预算支出情况开展绩效评价，不得虚列支出。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\"\
    : \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员违反规定以虚报、冒领等手段骗取财政资金，或者违反规定挪用、截"
- expression: (验收日期、消防验收编号、防潮等级、库房完好性.消防验收编号 == "未通过" || 验收日期、消防验收编号、防潮等级、库房完好性.防潮等级 < 批准库点名称、地址、库容、资质有效期.要求等级) && (实际收储库点地址、数量、批次、轮出粮食批号、轮入粮食批号.实际收储库点地址
    != 批准库点名称、地址、库容、资质有效期.批准库点地址) && (补贴对象、补贴库点编号、补贴金额、补贴计算基数（库存数量）、补贴标准、发放金额.补贴库点编号 == 批准库点名称、地址、库容、资质有效期.批准库点编号)
  description: 当库点硬件未通过消防验收或防潮等级不达标，同时实际收储地址与批准地址不符，但财政补贴仍按批准库点拨付时，即构成在不符合条件库点收储并骗取补贴。
  audit_item: 落实“六稳”“六保”政策存在的其他问题
  suspicion: 在不符条件库点收储政策性粮油
  regulation: "[\n  {\n    \"法规名称\": \"《中央储备粮管理条例》\",\n    \"法规文号\": \"国务院令第388号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十四条\",\n    \"内容概述\": \"承储中央储备粮的企业应当具备相应的仓储设施条件，符合国家有关消防安全、防潮防雨等规定，未经批准不得擅自变更储存地点。\"\n  },\n  {\n    \"法规名称\": \"\
    《关于进一步强化国家政策性粮食收储管理工作的通知》\",\n    \"法规文号\": \"国粮电〔2015〕8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、严格库点资格审核\",\n\
    \    \"内容概"
- expression: ABS(实物台账.账面库存数量 - 抽检台账.库存核查结果（实物侧量）) / 实物台账.账面库存数量 > 0.03 && 拨付文件.补贴计算基数（库存数量） == 实物台账.账面库存数量
  description: 以现场监盘核实的实际库存与账面库存差异超过3%（考虑合理损耗），且财政补贴依据的基数仍采用账面虚高库存计算，即判定为账实不符且多领补贴。多领补贴金额=(账面库存-实盘库存)×补贴标准。
  audit_item: 落实“六稳”“六保”政策存在的其他问题
  suspicion: 政策性粮油账实不符、多领财政补贴
  regulation: "[\n  {\n    \"法规名称\": \"《关于进一步加强中央储备粮油库存管理的通知》\",\n    \"法规文号\": \"国粮发〔2015〕24号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"承储企业必须保证账实相符，不得虚报库存，财政补贴必须以实有库存为依据，对虚报库存骗取补贴的应全额追回并处理。\"\n  },\n  {\n    \"\
    法规名称\": \"《粮食流通管理条例》\",\n    \"法规文号\": \"国务院令第407号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\":\
    \ \"政策性粮食存储企业"
- expression: (流水.交易金额 > 拨付文件.拨付金额*0.1 && 流水.对方账户名称 NOT IN 项目合同供应商名录 && 流水.摘要 IN [‘工资’, ‘办公费’, ‘差旅费’]) || (验收报告.实际支出金额 !=
    拨付文件.资金用途 && 无合规审批记录)
  description: 专项资金拨付后，若单笔或累计转出金额超过拨付金额的10%且收款方为非项目合同供应商，或支付摘要为人工、办公等非项目支出，同时缺少合法的变更审批，即判定存在挤占挪用。结合验收报告，若项目未按计划建设或支出与预算严重不符，进一步确认为挪用。
  audit_item: 财政资金申报、使用等方面存在的问题
  suspicion: 挤占挪用财政专项资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第二项\",\n    \"内容概述\": \"截留、挪用财政资金的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得，对单位给予警告或者通报批评。\"\n  }\n]"
- expression: 资金闲置率 = (统计表.期末结余金额 / 拨付文件.累计到账金额) * 100% ; 资金闲置率 > 50% && 统计表.结转年限 >= 2 && 验收报告.项目完工状态 = '未开工'
  description: 依据预算管理规定，连续两年未使用的结转资金应收回。当项目获批后超两年未开工且专户资金结余率超过50%，即推定为资金闲置。若款项仅产生利息而无任何项目支出，闲置性质更加明确。
  audit_item: 财政资金申报、使用等方面存在的问题
  suspicion: 财政资金长期闲置未用
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十七条\",\n    \"内容概述\": \"对结余资金和连续两年未用完的结转资金，预算尚未分配到部门的，由下级财政交回上级财政；已分配到部门的，由同级财政收回。\"\n  }\n]"
- expression: 流水.资金用途摘要（投资款/分红/经营收入） IN [‘装修’,‘办公家具’,‘差旅费’,‘招待费’] && 拨付文件.资金用途 IN [‘污染防治’,‘技术改造’,‘研发’] && 流水.交易金额 > 0 && 流程记录.审批用途
    != 拨付文件.限定支出范围
  description: 当特定用途专项资金（如污染防治）的支付凭证中出现装修、办公等与预算完全无关的摘要，且审批记录未能体现合规变更，即判定未按规定用途使用，直接触犯资金使用负面清单。
  audit_item: 财政资金申报、使用等方面存在的问题
  suspicion: 违规使用专项用途财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第四项\",\n    \"内容概述\": \"违反规定扩大开支范围，提高开支标准的，责令改正，调整有关会计账目，追回有关财政资金。\"\n  }\n]"
- expression: COUNT(同一项目名称跨部门申报) > 1 || (验收报告.分产业实际产值 < 申报材料.申报投资额*0.3 && 验收报告.实际完成投资额 < 申报预算额*0.5)
  description: 当同一项目名称或高度相似内容在多个部门获得资金即构成重复申报；若项目验收时实际产能提升或固定资产增加不足申报承诺的30%或50%，说明项目内容虚假或严重缩水，可认定为虚假申报套取。
  audit_item: 财政资金申报、使用等方面存在的问题
  suspicion: 虚假重复申报套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第四项\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，责令改正，追回有关财政资金。\"\n  }\n]"
- expression: SUM(项目资金拨付文件.基层社项目金额) / SUM(项目资金拨付文件.资金拨付总额（万元）) < 0.7 || SUM(资金使用明细.培训费) = 0
  description: 联合社对基层社的专项资金占比应不低于70%，且必须安排农民培训等指定用途。占比低于70%或未安排培训经费等指定支出即视为未落实资源倾斜。
  audit_item: 供销合作社基层社改造不到位
  suspicion: 各级联合社资源未向基层社倾斜
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"二、拓展经营服务领域，强化为农服务（三）加强基层社建设\",\n    \"内容概述\": \"各级联合社要加强指导和服务，把工作重心下沉到基层社，资源向基层社倾斜，支持基层社改革发展。\"\n  }\n\
    ]"
- expression: (保费补贴资金拨付进度表.实际拨付日期 - 保费补贴资金拨付进度表.应拨付日期) > 90天 || (保险机构保费结算申请.申请日期 - 保费补贴资金拨付文件.拨付审批日期) > 30天 AND 无正当理由延期说明
  description: 应拨付日期按管理办法要求或申请受理后规定工作日计算；超过90天未拨付或正常审批流程严重超期均视为严重拖欠。
  audit_item: 农业保险保费补贴未按规定配套、拨付、管理和结算
  suspicion: 保费补贴拨付不及时，长期拖欠保险机构保费
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业保险保费补贴管理办法\",\n    \"法规文号\": \"财金〔2021〕113号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十五条\",\n    \"内容概述\": \"地方财政部门应按规定及时审核拨付保费补贴资金，不得无故拖延，确保保险机构足额及时收到补贴。\"\n  }\n]"
- expression: 保费补贴资金使用台账.年末结余金额 > 0 AND 保费补贴资金使用台账.是否上缴 = '未上缴' AND 农业保险保费补贴资金明细表.结余 / 农业保险保费补贴资金明细表.年度收入总额 > 0.15
  description: 年末结余资金连续两年为正且结余率超过15%，且未按规定程序申请继续使用或上缴国库，即构成闲置未收回。
  audit_item: 农业保险保费补贴未按规定配套、拨付、管理和结算
  suspicion: 保费补贴长期闲置未按规定收回
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业保险保费补贴管理办法\",\n    \"法规文号\": \"财金〔2021〕113号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十七条\",\n    \"内容概述\": \"保费补贴结余资金应按规定及时上缴国库或经批准结转使用，不得长期挂账或挪用。\"\n  }\n]"
- expression: (明细表.用途摘要 NOT IN ('购书','设备维修','阅读推广','培训') && 明细表.金额 > 0) || (明细表.支出金额 - 采购合同.合同金额 > 0 AND 拨付文件.支出用途 < 0.7)
    || (支出凭证.报销人 != 书屋管理员 && 支出凭证.发票内容 NOT LIKE '%图书%') || (拨付文件.拨付总额 - 明细表.支出金额 > 拨付文件.拨付总额 * 0.2 AND 拨付文件.拨付依据 > 365)
  description: 判定资金违规：资金用途不在规定的购书、维护、活动范围内，体现挪用；资金用于图书的占比低于规定比例（如70%）且存在大额其他支出；报销人与管理员不符且发票内容无关书屋运营，疑似个人消费报销；资金长期结转超过20%且超过1年未使用，表明资金沉淀或闲置。任一条件触发疑点。
  audit_item: 农家书屋建设运营管护不合规
  suspicion: 违规使用农家书屋专项资金
  regulation: "[\n  {\n    \"法规名称\": \"中央补助地方农村文化建设专项资金管理暂行办法\",\n    \"法规文号\": \"财教〔2013〕25号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第七条、第十条\",\n    \"内容概述\": \"专项资金用于农家书屋出版物补充更新、阅读活动等，不得用于办公设备购置、人员经费等与书屋运行无直接关系的支出；资金应专款专用，加快执行进度。\"\n\
    \  }\n]"
- expression: COUNT(负责村庄.保洁员姓名) < 应覆盖村庄数 || (发放表.姓名 NOT IN 缴纳记录.姓名) || (发放表.实发工资 > 0 && 发放表.出勤天数 = 0)
  description: 应设立保洁员的村庄实际合同人数小于需要的村庄数，或工资发放人员无社保记录疑为虚列，或有工资发放但无考勤记录判定为“幽灵员工”。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 未设立村庄保洁员或虚列保洁员
  regulation: "[\n  {\n    \"法规名称\": \"住房和城乡建设部等部门关于全面推进农村垃圾治理的指导意见\",\n    \"法规文号\": \"建村〔2015〕170号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、（五）\",\n    \"内容概述\": \"建立村庄保洁制度，建立稳定的村庄保洁队伍，明确保洁员职责和考核办法。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\"\
    ,\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当组织、指导对"
- expression: (统计表.分类收集覆盖率 < 专项规划.垃圾分类减量阶段目标 * 0.6) || (统计表.节点任务完成时间 - 专项规划.预期立项时间 > 90天) || (培训记录.培训时间 < 4) || (拨付文件.垃圾分类专项经费拨付金额
    > 0 && 拨付文件.支出明细 / 垃圾分类专项经费拨付金额 > 0.3)
  description: 分类覆盖率不足规划目标的60%，或关键任务延迟超过3个月，或培训次数每季度不足1次，或专项资金中超过30%用于无关接待等非直接工作，均判定为工作未开展或严重滞后。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 垃圾分类减量工作未开展或进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十三条\",\n    \"内容概述\": \"县级以上人民政府应当建立生活垃圾分类制度，统筹生活垃圾分类投放、分类收集、分类运输、分类处理系统。\"\n  },\n  {\n    \"法规名称\": \"住房和城乡建设部等部门关于在全国地级及以上城市全面开展生活垃圾分类工作的通知\"\
    ,\n    \"法规文号\": \"建城〔2019〕56号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"四\",\n    \"内容概述"
- expression: "((明细表.资金到账日期 IS NOT NULL) AND\n (明细表.拨付日期 IS NULL OR\n  (明细表.拨付日期 - 明细表.资金到账日期) > 拨付文件.规定拨付时限（工作日）))\nOR\n\
    (统计表.闲置年限 >= 2 AND 统计表.清理状态 != '已清理')"
  description: 判定逻辑：(1)资金已到达财政或部门账户，但拨付日期为空或实际拨付日期与到账日期的间隔超过政策文件规定的拨付时限，视为违规滞留；(2)结余资金闲置2年以上且未按规定清理上缴，属于长期闲置。风险等级：拨付超期30天内为低风险，超30天至90天为中风险，超90天为高风险；闲置超2年直接认定为严重违规。
  audit_item: 惠农补贴资金滞留、延压发放或长时间闲置
  suspicion: 补贴资金滞留在财政或职能部门账户超期未拨付
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财办〔2020〕37号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第三部分（规范补贴资金发放流程）\",\n    \"内容概述\": \"各级财政部门应按规定时限分解下达补贴资金，加快预算执行进度；任何单位和个人不得挤占、截留、滞留补贴资金。\"\n\
    \  }\n]"
- expression: "((审核台账.主管部门审核完成日期 - 审核台账.乡镇上报日期) > 拨付文件.名单报送时限) \n||\n((明细表.失败日期 IS NOT NULL) AND (明细表.失败日期 - 审核台账.发放名单生成日期\
    \ > 拨付文件.发放时限))\n||\n(记录表.办结日期 IS NULL AND (当前日期 - 记录表.登记日期) > 30)"
  description: 判定逻辑：(1)从名单申报到审核完成的耗用工作日超过政策规定的报送时限，即为报送延迟；(2)发放名单生成后，因名单未传递导致银行首次发放失败日期间隔超出规定发放时限；(3)因名单错漏产生的异常情况超过30天未解决。风险等级：超时限30%以内为一般，超30%~100%为较重，超100%为严重。
  audit_item: 惠农补贴资金滞留、延压发放或长时间闲置
  suspicion: 补贴对象名单未及时报送导致补贴发放延迟
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财办〔2020〕37号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第三部分（规范补贴资金发放流程）\",\n    \"内容概述\": \"各地应明确补贴申报、审核、公示、发放各环节的工作时限，相关部门和单位应在规定时限内完成审核和名单报送工作，确保按时发放。\"\
    \n  }\n]"
- expression: "(统计表.闲置年限 >= 2 AND 统计表.清理状态 != '已清理')\n||\n(明细表.科目名称 LIKE '%惠农补贴%' \n   AND 明细表.余额 > 0 \n   AND (当前日期 - 明细表.最后交易日期)\
    \ > 730)"
  description: 判定逻辑：从结余统计表直接筛选闲置2年以上且未清理的资金；从账户流水表发现惠农补贴专户余额超过2年无变动且未上缴财政的款项。两项条件满足其一即构成闲置未清理。风险等级：闲置2-3年且金额较小为关注，闲置3年以上或金额较大为严重。
  audit_item: 惠农补贴资金滞留、延压发放或长时间闲置
  suspicion: 未发放的惠农补贴结余资金闲置超2年未清理
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于进一步做好盘活财政存量资金工作的通知\",\n    \"法规文号\": \"国发〔2014〕70号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条（清理结余结转资金）\",\n    \"内容概述\": \"各级财政部门要清理部门预算结余资金和连续结转超过两年的结转资金，将其收回总预算统筹安排。\"\n  },\n  {\n    \"\
    法规名称\": \"财政部关于推进地方盘活财政存量资金有关事项的通知\",\n    \"法规文号\": \"财预〔2015〕15号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"一、（二）\"\
    ,\n    \""
- expression: (审批记录.提取金额 / 明细台账.拨付金额) > 管理办法.管理费提取比例上限 || 审批记录.审批人签字 IS NULL || (明细表.支出用途 NOT IN 管理办法.允许支出范围 AND 明细表.支出金额
    / 审批记录.提取金额 > 0.3)
  description: 判定条件一：提取比例超过制度规定的上限（例如常见标准为5%或2%），直接判定违规；条件二：提取管理费无有效审批记录，构成擅自提取；条件三：管理费支出中与项目无关的开支（如招待费、福利费、购车）占比超过30%，视为名义上提管理费实为截留挪用的高风险特征。满足任一条件即标记为疑点。
  audit_item: 截留挪用涉农财政专项资金
  suspicion: 违规超比例或虚构名目提取涉农专项资金管理费
  regulation: "[\n  {\n    \"法规名称\": \"农业专项转移支付资金管理办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第X条（示例：关于管理费提取比例和用途的规定）\"\
    ,\n    \"内容概述\": \"涉农专项资金管理费提取不得超过规定比例，必须经过审批，专项用于项目管理相关支出，严禁用于人员经费、福利、购置车辆等与项目无关的支出。\"\n  }\n]"
- expression: (统计表.收费项目 IS NOT NULL AND 票据.票据类型 != '财政监制收据') || (服务内容约定.服务内容约定 IS NULL) || (统计表.实际收取金额 > 统计表.收费标准 * 1.1) ||
    (票据.收款单位 != 法定的非税收入汇缴账户)
  description: 判定条件一：向企业收费但未开具正规财政监制收据，直接表明为违规收费；条件二：合同未约定任何服务内容却收取“服务费”“保证金”，虚构名目；条件三：实际收费金额超出合同或标准10%以上，存在附加收费；条件四：收费资金未上缴财政而是进入单位自有账户，形成截留。满足任一条件即触发疑点。
  audit_item: 截留挪用涉农财政专项资金
  suspicion: 无依据向农机生产或销售企业收取费用
  regulation: "[\n  {\n    \"法规名称\": \"农业专项转移支付资金管理办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第X条（关于禁止向项目实施主体收费的规定）\"\
    ,\n    \"内容概述\": \"任何单位和个人不得以任何名义向申请或使用涉农专项转移支付资金的农机生产、销售企业收取管理费、赞助费、保证金等，不得设置与项目无关的收费条件。\"\n  }\n]"
- expression: (资金用途、拨付对象.资金用途 != 明细表.支出摘要 && 明细表.金额 > 补贴标准*0.1) || (审批表.资金用途变更审批记录 && 明细表.收款方名称 != '农户' && 明细表.金额 > 50000)
  description: 比对分配方案中明确的惠农用途与实际支出凭证的摘要，若不一致且金额偏离超过补贴标准的10%，视为可疑；或者存在未经上级审批的资金用途变更且金额超过5万元的大额转账至非农户账户，触发违规警报。
  audit_item: 监管不到位，惠农补贴资金被套取骗取、违规使用
  suspicion: 乡镇主管部门挤占挪用惠农补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员违反规定，擅自占有、使用、处置国有资产的，或截留、挪用财政资金的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。对单位给予警告或者通报批评。对直接负责的主管人员和其他直接责任人员给予记大过处分；情节较重的，给予降级或者撤职处分；情节严重的，给予开除处分。\"\
    \n  }\n]"
- expression: (发放记录.实发补贴额度 / 发放记录.应发补贴额度) < 0.9  ||  (发放记录.发放日期 - 政策规定发放截止日) > 30天  ||  (拨付文件.专项资金拨付总额 - 发放记录.实发补贴额度) > 5000元且占比>10%
  description: 实发金额不足应发金额的90%，或补贴发放延迟超过30天，或财政拨付与终端到账差额超过5000元且比例超10%的，均视为补贴落实不到位。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业用电补贴资金被截留或未足额到位
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于切实加强惠农补贴资金管理的通知\",\n    \"法规文号\": \"财农〔2021〕XX号（示例文号）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"惠农补贴资金必须足额、及时发放到受益主体，严禁截留、挤占、挪用或无故拖延，实行专户管理、封闭运行。\"\n  }\n]"
