name: audit/政策文件类/拨付文件
type: model
description: 从政策文件类类文档（拨付文件）中提取结构化元数据。涵盖字段如：专项资金总额、专项资金拨付总额、保洁员经费拨付金额、发放金额、受益作物类型、名单报送时限、垃圾分类专项经费拨付金额、基层社项目金额。文档范围包括：专项资金拨付文件、中央和地方财政资金拨付文件、保费补贴资金拨付文件、农家书屋专项资金拨付文件、农村客运财政补贴资金拨付文件、垃圾处理财政专项资金拨付文件、补贴资金拨付文件、财政专项资金拨付文件、财政补贴资金拨付文件、财政资金拨付文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 审批
- 拨款
- 明细
- 补贴
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 拨付文件
  member_count: 1
  member_details:
  - 专项资金拨付文件
  - 中央和地方财政资金拨付文件
  - 保费补贴资金拨付文件
  - 农家书屋专项资金拨付文件
  - 农村客运财政补贴资金拨付文件
  - 垃圾处理财政专项资金拨付文件
  - 补贴资金拨付文件
  - 财政专项资金拨付文件
  - 财政补贴资金拨付文件
  - 财政资金拨付文件
  - 财政部门资金拨付文件
  - 资金拨付文件
  - 项目资金拨付文件
