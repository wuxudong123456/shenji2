name: audit/政策文件类/内部文件
type: model
description: 从政策文件类类文档（内部文件）中提取结构化元数据。涵盖字段如：摊派任务分解表、赞助通知。文档范围包括：政府会议纪要或内部文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 内部文件
  member_count: 1
  member_details:
  - 政府会议纪要或内部文件
output:
  fields:
  - name: 摊派任务分解表
    type: string
    description: 提取 摊派任务分解表 的文本值
  - name: 赞助通知
    type: string
    description: 提取 赞助通知 的文本值
violations:
- expression: (农机企业缴费台账.收费项目名称 IN ('赞助','捐赠','支持费')) && (农机企业缴费台账.收费依据 IS NULL) && (企业财务账簿.对方科目 LIKE '%政府%' OR 企业财务账簿.对方科目
    LIKE '%下属单位账户%') && (政府会议纪要或内部文件.摊派任务分解表 IS NOT NULL OR 政府会议纪要或内部文件.赞助通知 IS NOT NULL)
  description: 当企业缴费以赞助、捐赠等名义支付，无任何合同或政策依据，且资金流入政府或关联单位账户，并发现政府内部摊派文件时，认定为强制摊派。
  audit_item: 乱集资、乱摊派、乱收费
  suspicion: 以赞助名义向农机企业强制摊派费用
  regulation: "[\n  {\n    \"法规名称\": \"禁止向企业摊派暂行条例\",\n    \"法规文号\": \"国务院令第29号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第四条\",\n    \"内容概述\": \"国家禁止在法律、法规的规定之外向企业征收各种摊派费用。\"\n  }\n]"
