name: audit/政策文件类/编制文件
type: model
description: 从政策文件类类文档（编制文件）中提取结构化元数据。涵盖字段如：下属单位清单、专业技术人员配置要求、人员经费预算批复数、单位性质、单位编码、各岗位编制数、国有资产收入预算科目金额、基层单位核定编制数。文档范围包括：上级核定的人员编制文件、传统村落保护发展规划编制文件、农村殡葬设施建设规划编制文件、单位机构编制文件、国土空间总体规划编制文件、机构编制委员会核定的编制文件、种业监管机构人员编制文件、预算编制文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 人员
- 审批
- 资产
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 编制文件
  member_count: 1
  member_details:
  - 上级核定的人员编制文件
  - 传统村落保护发展规划编制文件
  - 农村殡葬设施建设规划编制文件
  - 单位机构编制文件
  - 国土空间总体规划编制文件
  - 机构编制委员会核定的编制文件
  - 种业监管机构人员编制文件
  - 预算编制文件
output:
  fields:
  - name: 下属单位清单
    type: string
    description: 提取 下属单位清单 的文本值
  - name: 专业技术人员配置要求
    type: string
    description: 提取 专业技术人员配置要求 的文本值
  - name: 人员经费预算批复数
    type: number
    description: 提取 人员经费预算批复数 的数值（含单位，如万元、吨等）
  - name: 单位性质
    type: string
    description: 提取 单位性质 的文本值
  - name: 单位编码
    type: string
    description: 提取 单位编码 的文本值
  - name: 各岗位编制数
    type: string
    description: 提取 各岗位编制数 的文本值
  - name: 国有资产收入预算科目金额
    type: number
    description: 提取 国有资产收入预算科目金额 的数值（含单位，如万元、吨等）
  - name: 基层单位核定编制数
    type: string
    description: 提取 基层单位核定编制数 的文本值
  - name: 批准编制种类
    type: string
    description: 提取 批准编制种类 的文本值
  - name: 村落名称
    type: string
    description: 提取 村落名称 的文本值
  - name: 核定编制总数
    type: string
    description: 提取 核定编制总数 的文本值
  - name: 编制人数
    type: number
    description: 提取 编制人数 的数值（含单位，如万元、吨等）
  - name: 编制使用范围
    type: string
    description: 提取 编制使用范围 的文本值
  - name: 编制单位
    type: string
    description: 提取 编制单位 的文本值
  - name: 编制管理部门批复的管理单位清单
    type: string
    description: 提取 编制管理部门批复的管理单位清单 的文本值
  - name: 行政编制总额
    type: number
    description: 提取 行政编制总额 的数值（含单位，如万元、吨等）
  - name: 规划公示记录
    type: string
    description: 提取 规划公示记录 的文本值
  - name: 规划图斑坐标
    type: string
    description: 提取 规划图斑坐标 的文本值
  - name: 规划审批文件
    type: string
    description: 提取 规划审批文件 的文本值
  - name: 规划文本
    type: string
    description: 提取 规划文本 的文本值
  - name: 规划文本中绿化用地布局专章
    type: string
    description: 提取 规划文本中绿化用地布局专章 的文本值
  - name: 规划编制完成日期
    type: date
    description: 提取 规划编制完成日期 的日期值，格式 YYYY-MM-DD
  - name: 非税收入-国有资本经营收益预算金额
    type: number
    description: 提取 非税收入-国有资本经营收益预算金额 的数值（含单位，如万元、吨等）
violations:
- expression: 统计表.实有人数 > 统计表.核定编制数
  description: 单位实际在岗人数超过机构编制部门核定的编制总数，即触发超编使用疑点，差值大于0均属违规。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 擅自超编使用工作人员
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十八条\",\n    \"内容概述\": \"地方各级人民政府行政机构应当严格执行机构编制管理规定，不得在核定的编制外使用工作人员。\"\n  }\n]"
- expression: 存在 信息表.编制类型 NOT IN (核定编制总数.批准编制种类)
  description: 若在岗人员所登记的编制类型不在编办正式批准的编制种类范围内，则认定为擅自增加编制种类。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 擅自增加编制种类
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十六条\",\n    \"内容概述\": \"机构编制管理机关应当按照编制的不同类别和使用范围审批编制。地方各级人民政府行政机构应当使用行政编制，事业单位应当使用事业编制，不得混用、挤占、挪用或者自行设定其他类别的编制。\"\
    \n  }\n]"
- expression: SUM(统计表.实有人数 WHERE 编制类型='行政编制') > 编制文件.行政编制总额
  description: 单位实际占用的行政编制人员总数超过上级核定的行政编制总额，即构成突破编制总额的违规行为。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 突破行政编制总额增加编制
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十七条\",\n    \"内容概述\": \"机构编制管理机关应当根据工作需要和精干的原则，在规定的编制限额内，及时审批编制。地方各级人民政府行政机构不得超出编制限额使用工作人员。\"\n  }\n]"
- expression: 存在 姓名、岗位、编制类型、进入方式、编制归属单位、现工作单位、录用时间.岗位 != 姓名、岗位、编制类型、进入方式、编制归属单位、现工作单位、录用时间.编制类型
  description: 将某一类编制用于规定范围之外的岗位，例如将行政执法编制用于后勤管理岗位，即构成改变编制使用范围。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 改变编制使用范围
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十八条\",\n    \"内容概述\": \"地方各级人民政府行政机构不得在核定的编制外使用工作人员，不得混用、挤占、挪用编制。\"\n  }\n]"
- expression: 存在 信息表.编制归属单位 != 信息表.现工作单位 && (专项台账.批准手续 || 专项台账.借调期限 > 规范期限)
  description: 人员编制在基层单位但实际在上级单位工作，且存在无审批借调或超出规定借调期限的，即构成挤占挪用基层编制。规范期限可参照有关借调文件规定，通常为6个月或1年。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 挤占挪用基层编制
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十八条\",\n    \"内容概述\": \"地方各级人民政府行政机构不得混用、挤占、挪用编制。\"\n  }\n]"
- expression: 部门预算汇总表.单位编码 NOT IN (机构编制文件.授权管理单位编码集合) && 部门预算汇总表.资金总额 > 0
  description: 筛选部门预算中列示但不在本部门三定方案授权管理范围内的单位，且确已安排预算资金，即视为将非所属预算单位纳入预算的违规行为。
  audit_item: 预算编制不规范
  suspicion: 将非所属预算单位纳入部门预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十三条\"\
    ,\n    \"内容概述\": \"各部门编制本部门预算、决算草案，组织和监督本部门预算的执行。部门预算由本部门及其所属各单位预算组成，不得将非所属单位纳入预算。\"\n  }\n]"
- expression: 预算编制责任部门签字确认表.签字单位 != 对应的预算单位名称 && 对应的预算单位属于下属单位
  description: 下属单位的预算编制责任签字由上级部门代替，且该下属单位具备独立预算申报资格，即判定为代报代编。
  audit_item: 预算编制不规范
  suspicion: 代报代编所属单位预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"各部门应当根据本级政府财政部门的预算编制要求，制定本部门预算编制方案，组织所属各单位编制预算，不得代报代编所属单位预算。\"\n  }\n]"
- expression: 基本支出预算明细表.单位代码 IN (经费自理单位证明.单位代码集合) && 基本支出预算明细表.资金来源 = '财政拨款' && 支出类型 IN ('人员经费','公用经费')
  description: 经费自理单位（自收自支或企业化管理）不应再由财政保障基本支出，若仍为其安排人员经费、公用经费等基本支出财政拨款，即构成违规。
  audit_item: 预算编制不规范
  suspicion: 为经费自理单位编列基本支出预算
  regulation: "[\n  {\n    \"法规名称\": \"事业单位财务规则\",\n    \"法规文号\": \"财政部令第108号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第五条\",\n    \"内容概述\": \"事业单位的各项收入全部纳入单位预算，统一核算，统一管理。经费自理单位支出应由自有资金保障，不得编制财政拨款基本支出预算。\"\n  }\n]"
- expression: (传统村落保护发展规划编制文件.规划编制完成日期 IS NULL) || (DATEDIFF(传统村落保护发展规划编制文件.规划编制完成日期, 传统村落保护项目清单.列入名录日期) > 730) || (传统村落保护发展规划编制文件.审批通过日期
    IS NULL)
  description: 判定规则：列入中国传统村落名录后2年内（730天）未完成保护发展规划编制或审批，则视为违规。规划编制完成日期或审批通过日期为空直接判定为异常。
  audit_item: 传统村落保护不到位
  suspicion: 未按规定时限编制传统村落保护发展规划
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部 文化部 国家文物局 财政部关于切实加强中国传统村落保护的指导意见\",\n    \"法规文号\": \"建村〔2014〕61号\",\n    \"\
    效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"传统村落保护发展规划应在列入名录后2年内完成编制和审批。\"\n  }\n]"
- expression: 规划文本 == NULL OR (规划文本.规划审批文件 == NULL && 会议纪要.议题包含'公墓建设' && 会议纪要.规划依据论述 == NULL)
  description: 判定规则：缺乏法定的殡葬设施建设专项规划，或项目立项审批中未引用规划依据。规划编制文件缺失为A类风险；有文件但无审批文号且项目已建设为B类风险。
  audit_item: 农村公益性殡葬建设不符合相关规定
  suspicion: 未编制农村殡葬设施建设规划
  regulation: "[\n  {\n    \"法规名称\": \"殡葬管理条例\",\n    \"法规文号\": \"国务院令第225号（2012年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"各级人民政府应当将殡葬设施建设纳入城乡建设规划和基本建设计划，编制殡葬设施建设规划，并依法审批。\"\n  }\n]"
- expression: (人员名单.实际在岗人数 > 编制文件.核定编制总数) && (算申报表.预算申报人数 > 编制文件.核定编制总数) && (ABS(人员名单.实际在岗人数 - 算申报表.预算申报人数) <= 1)
  description: 实际在岗总人数超过上级核定编制总数，且日常公用经费预算申报表中所使用的预算人数同样超过编制总数，同时预算申报人数与实际在岗人数基本一致（允许±1人的统计误差）。表明单位在预算编报时未按编制数控制，而是据实以超编人数申报，导致公用经费预算虚增。超编比例超过10%为严重违规。
  audit_item: 生成模拟审计数据
  suspicion: 超编制配置人员虚报公用经费预算
  regulation: "[\n  {\n    \"法规名称\": \"行政单位财务规则\",\n    \"法规文号\": \"财政部令第71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第十三条\",\n    \"内容概述\": \"行政单位编制预算，应当综合考虑机构设置、人员编制和实际人数等因素，不得以超编人数作为预算编制基数，确保预算真实性。\"\n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\"\
    ,\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"党政机关应当遵循先有预算、后有支出的"
- expression: 专项规划编制日期、审批日期、规划的绿化项目清单及坐标.审批日期 > 规划文本中绿化用地布局专章、规划图斑坐标.批复日期 + 365天 || (实际已实施绿化项目名称、坐标、面积、地类、农田周边林带现状林木数量、断带长度.坐标
    ⊄ 规划文本中绿化用地布局专章、规划图斑坐标.规划图斑坐标)
  description: 专项规划应在总体规划批复后一年内完成衔接，否则视为规划脱节；实际绿化项目的实施范围若未落入总体规划划定的绿化用地图斑内，即存在未纳入规划或违规占用其他用地风险。
  audit_item: 村容村貌整体提升不符合相关规定
  suspicion: 乡村绿化美化未纳入国土空间总体规划编制
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十二条、第二十七条\",\n    \"内容概述\": \"城乡规划应当依据国民经济和社会发展规划，并与土地利用总体规划相衔接；乡规划、村庄规划应当从农村实际出发，尊重村民意愿，体现地方和农村特色。\"\n  },\n  {\n \
    \   \"法规名称\": \"中共中央 国务院关于建立国土空间规划体系并监督实施的若干意见\",\n    \"法规文号\": \"中发〔2019〕18号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\"\
    : \""
