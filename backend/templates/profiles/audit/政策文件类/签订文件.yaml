name: audit/政策文件类/签订文件
type: model
description: 从政策文件类类文档（签订文件）中提取结构化元数据。涵盖字段如：协议覆盖范围、奖惩措施、签订层级、签订日期、考核指标、责任主体、责任方签字盖章。文档范围包括：管护协议签订文件、草原防火责任状签订文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 协议
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 签订文件
  member_count: 1
  member_details:
  - 管护协议签订文件
  - 草原防火责任状签订文件
output:
  fields:
  - name: 协议覆盖范围
    type: string
    description: 提取 协议覆盖范围 的文本值
  - name: 奖惩措施
    type: string
    description: 提取 奖惩措施 的文本值
  - name: 签订层级
    type: string
    description: 提取 签订层级 的文本值
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 考核指标
    type: string
    description: 提取 考核指标 的文本值
  - name: 责任主体
    type: string
    description: 提取 责任主体 的文本值
  - name: 责任方签字盖章
    type: string
    description: 提取 责任方签字盖章 的文本值
violations:
- expression: (责任方签字盖章 IS NULL || 协议覆盖范围 = '管护协议未覆盖全部项目') || (拨付金额 = 0 || 拨付金额 < 资金标准) || (责任主体界定 IS NULL)
  description: 协议缺失、覆盖不全、资金未拨付或拨付不足、制度未明确责任主体，任一条件成立即认定管护机制未落实。
  audit_item: 违反高标农田建后管护及使用规定的行为
  suspicion: 高标准农田建后管护责任主体未落实
  regulation: "[\n  {\n    \"法规名称\": \"高标准农田建设通则\",\n    \"法规文号\": \"GB/T 30600-2022\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"6.4.2\",\n    \"内容概述\": \"应建立管护机制，明确管护主体、管护责任和管护资金，落实管护措施。\"\n  },\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\"\
    : \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十七条\",\n    \"内容概述\": \"项目竣工后，应及时办理资产交付手续，明确管护主体，落实管护责任和管"
- expression: (签订文件.签订层级（省、市、县、乡） <> {省,市,县,乡}) || (文本.预案编制情况不存在 || 文本.响应分级为空 || 文本.处置流程为空 || 文本.资源调配内容为空)
  description: 责任状未覆盖全部应签订层级（省、市、县、乡任一层级缺失），或未制定应急预案，或已制定预案但缺少响应分级、处置流程、资源调配等核心内容，均直接判定违规。
  audit_item: 草原风险防控落实不到位
  suspicion: 草原防火预警机制建设不到位
  regulation: "[\n  {\n    \"法规名称\": \"《草原防火条例》\",\n    \"法规文号\": \"国务院令第542号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十条、第二十一条\",\n    \"内容概述\": \"草原防火实行地方各级人民政府行政首长负责制；县级以上人民政府应与下级政府逐级签订草原防火责任书；县级以上人民政府应制定草原火灾应急预案。\"\n  }\n]"
- expression: (签订文件.考核指标（巡查频率、火灾次数上限）为空 OR 签订文件.奖惩措施为空) OR (记录表.演练频次要求 < 预案要求次数) OR (记录表.值班日期 > 7) OR (分析表.应急响应启动标志 = '否')
    OR (整改台账.整改完成状态 > 0) OR (配置清单.实际库存数量 < 预案规定物资数量*0.9)
  description: 责任状缺少可量化的巡查频率或奖惩措施，演练次数未达标（假定每年至少1次），值班记录连续超过7天无签字，火灾发生时未按预案启动应急响应，隐患整改未全部闭环，实际库存物资少于预案要求数量的90%，均判定为执行不到位。
  audit_item: 草原风险防控落实不到位
  suspicion: 草原防火责任状和应急预案执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"《草原防火条例》\",\n    \"法规文号\": \"国务院令第542号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十二条、第二十三条、第二十四条\",\n    \"内容概述\": \"县级以上人民政府应当建立草原防火值班制度，组织草原防火检查；草原火灾应急预案应当定期组织演练；草原防火物资储备应当满足预案要求。\"\n  }\n]"
