name: audit/政策文件类/成立文件
type: model
description: 从政策文件类类文档（成立文件）中提取结构化元数据。涵盖字段如：成立日期、管委会职责及组成要求。文档范围包括：管委会成立文件、膳食委员会成立文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 成立文件
  member_count: 1
  member_details:
  - 管委会成立文件
  - 膳食委员会成立文件
output:
  fields:
  - name: 成立日期
    type: date
    description: 提取 成立日期 的日期值，格式 YYYY-MM-DD
  - name: 管委会职责及组成要求
    type: string
    description: 提取 管委会职责及组成要求 的文本值
violations:
- expression: 成员任命文件.SUM(代表类型='政府负责人' OR 职务包含('建设','财政','人民银行','审计')) / 成员任命文件.COUNT(*) > 0.333
  description: 根据《住房公积金管理条例》第八条，人民政府负责人和建设、财政、人民银行等有关部门负责人及专家合计不得超过三分之一。此处计算政府负责人及有关部门负责人占比，超过33.3%即构成人员组成不合规。
  audit_item: 住房公积金决策机构未按规定履职
  suspicion: 住房公积金管委会政府官员占比超标
  regulation: "[\n  {\n    \"法规名称\": \"《住房公积金管理条例》\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第八条\",\n    \"内容概述\": \"住房公积金管理委员会的成员中，人民政府负责人和建设、财政、人民银行等有关部门负责人以及有关专家占三分之一，工会代表和职工代表占三分之一，单位代表占三分之一。\"\
    \n  }\n]"
- expression: (成立日期.委员名单 == null) || (成立日期.身份类别（家长/教师/村委会代表） < 50%) || (会议日期、参会人员、议题、决议、签字.会议日期 == 0) || (会议日期、参会人员、议题、决议、签字.议题
    < 1次/季) || (家长知晓率、参与率、满意度评分.家长知晓率 < 60%)
  description: 未成立委员会，或成立但家长代表不足一半，或无任何会议记录，或会议频次不足每季度1次，或家长普遍不知晓委员会，均视为未发挥作用。
  audit_item: 营养餐制度执行不到位
  suspicion: 膳食委员会形同虚设未发挥监督作用
  regulation: "[\n  {\n    \"法规名称\": \"学校食品安全与营养健康管理规定\",\n    \"法规文号\": \"教育部令第45号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"学校应当建立膳食委员会，由学生代表、家长代表、教师代表等组成，参与学校食品安全和营养健康管理。\"\n  },\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划实施细则\"\
    ,\n    \"法规文号\": \"教财〔2012〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条\",\n    \"内容概述\": \"学校应成立膳食管理委员会，吸收家"
