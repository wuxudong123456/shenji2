name: audit/政策文件类/落实文件
type: model
description: 从政策文件类类文档（落实文件）中提取结构化元数据。涵盖字段如：任务属性说明、减免条件及幅度、分解任务量总和、方案是否分解到具体地点/实施主体、细化任务量。文档范围包括：税费减免政策落实文件、项目实施方案的任务分解落实文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 落实文件
  member_count: 1
  member_details:
  - 税费减免政策落实文件
  - 项目实施方案的任务分解落实文件
output:
  fields:
  - name: 任务属性说明
    type: string
    description: 提取 任务属性说明 的文本值
  - name: 减免条件及幅度
    type: string
    description: 提取 减免条件及幅度 的文本值
  - name: 分解任务量总和
    type: string
    description: 提取 分解任务量总和 的文本值
  - name: 方案是否分解到具体地点-实施主体
    type: boolean
    description: 提取 方案是否分解到具体地点-实施主体 的布尔值（是/否）
  - name: 细化任务量
    type: string
    description: 提取 细化任务量 的文本值
violations:
- expression: (贷款申请金额.发放金额/贷款申请金额.贷款申请金额 < 50%) || (贷款利率.贷款利率 - 合作协议.约定利率上限 > 0.5) || (企业清单.实际减免税额/企业清单.应减免税额 < 90%) || (应拨付金额.实际到账时间
    - 应拨付金额.应拨付金额 > 30)
  description: 贷款发放率=实际发放贷款总额/符合条件的申请贷款总额，低于50%视为金融支持严重不足；实际贷款利率超过合作协议约定利率上限0.5个百分点视为变相提高融资成本；税费实际减免比例低于应减免金额的90%视为减免落实不到位；补贴资金延迟到账超过30个自然日视为拨付不及时。
  audit_item: 农民工返乡创业政策实施不到位
  suspicion: 创业用地、用电、税费、金融政策支持不到位
  regulation: "[\n  {\n    \"法规名称\": \"财政部 税务总局 人力资源社会保障部 国务院扶贫办关于进一步支持和促进重点群体创业就业有关税收政策的通知\",\n    \"法规文号\": \"财税〔2019〕22号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"符合条件的返乡创业人员从事个体经营的，自办理个体工商户登记当月起，在3年内按每户每年12000元为限额依次扣减相关税费，地方政府应足额落实。\"\
    \n  },\n  {\n    \"法规名称\": \"中国银保监会关于银行业保险业支持返乡入乡创业的通知\",\n    \"法规文号\": \"银保监发〔2021〕43号"
