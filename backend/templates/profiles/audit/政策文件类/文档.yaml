name: audit/政策文件类/文档
type: model
description: 从政策文件类类文档（文档）中提取结构化元数据。涵盖字段如：RPO指标、RTO指标、不同付费等级对应的功能权限清单、备份频率、存储位置、实际对接状态、应急处置流程、招投标文件。文档范围包括：关键节点审批文档、冷链设备操作规程文档、平台功能权限配置文档、接口对接文档、灾难备份和恢复策略文档等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 审批
- 验收
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 文档
  member_count: 1
  member_details:
  - 关键节点审批文档
  - 冷链设备操作规程文档
  - 平台功能权限配置文档
  - 接口对接文档
  - 灾难备份和恢复策略文档
output:
  fields:
  - name: RPO指标
    type: string
    description: 提取 RPO指标 的文本值
  - name: RTO指标
    type: string
    description: 提取 RTO指标 的文本值
  - name: 不同付费等级对应的功能权限清单
    type: number
    description: 提取 不同付费等级对应的功能权限清单 的数值（含单位，如万元、吨等）
  - name: 备份频率
    type: string
    description: 提取 备份频率 的文本值
  - name: 存储位置
    type: string
    description: 提取 存储位置 的文本值
  - name: 实际对接状态
    type: boolean
    description: 提取 实际对接状态 的布尔值（是/否）
  - name: 应急处置流程
    type: string
    description: 提取 应急处置流程 的文本值
  - name: 招投标文件
    type: string
    description: 提取 招投标文件 的文本值
  - name: 接口定义字段
    type: string
    description: 提取 接口定义字段 的文本值
  - name: 操作步骤描述
    type: string
    description: 提取 操作步骤描述 的文本值
  - name: 数据交换标准
    type: string
    description: 提取 数据交换标准 的文本值
  - name: 文件存在标识
    type: string
    description: 提取 文件存在标识 的文本值
  - name: 环评批复
    type: string
    description: 提取 环评批复 的文本值
  - name: 用地审批
    type: string
    description: 提取 用地审批 的文本值
  - name: 立项批复
    type: string
    description: 提取 立项批复 的文本值
  - name: 竣工验收报告
    type: string
    description: 提取 竣工验收报告 的文本值
  - name: 策略版本
    type: string
    description: 提取 策略版本 的文本值
  - name: 覆盖系统范围
    type: string
    description: 提取 覆盖系统范围 的文本值
  - name: 覆盖设备类型清单
    type: string
    description: 提取 覆盖设备类型清单 的文本值
  - name: 责任人
    type: string
    description: 提取 责任人 的文本值
violations:
- expression: (收费对象、收费项目名称、收费金额、收费时间、收费项目名称（如数据对接服务费、平台服务费）、收费项目名称（如CA证书费、U盾费）、单价、数量、收费项目（如高级会员费、加急服务费）、金额、收费频次.收费项目名称 CONTAINS
    ('会员','VIP','加急','优先','高级') || 收费条款、技术维护费描述、服务费条款、收费项目描述、合同期限、会员服务条款、付费优先服务条款、捆绑服务项目.付费优先服务条款 包含 ('付费方可使用','不缴费将关闭','必须购买'))
    && (收费对象、收费项目名称、收费金额、收费时间、收费项目名称（如数据对接服务费、平台服务费）、收费项目名称（如CA证书
  description: 当存在会员费、VIP费、加急费等名义的收费，且合同条款或平台权限设置将政府必须提供的基础服务与付费服务捆绑，或企业多次投诉被强制购买会员，即判定为变相违规收费。投诉次数阈值可设定为3次以上以降低误报。
  audit_item: 违规收费-要求企业承担电子政务平台技术维护费、服务费、电子介质成本费等经营服务性费用
  suspicion: 变相收费或捆绑收费
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十条\",\n    \"内容概述\": \"政府及其有关部门应当加强政务服务的规范化、标准化建设，不得设置不合理或者歧视性的准入和退出条件，不得限定购买指定经营者的商品或者服务，不得以任何形式限制或者变相限制市场准入。\"\n \
    \ },\n  {\n    \"法规名称\": \"关于进一步规范行政事业性收费的通知\",\n    \"法规文号\": \"财综〔2010〕12号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二条"
- expression: ( 策略版本缺失=true ) OR ( 验收报告缺失=true ) OR ( 统计表.恢复失败次数 > 0 ) OR ( 记录表.校验完整性状态='异常' )
  description: 1. 策略文档或验收报告缺失直接判定违规；2. 测试记录中恢复失败次数≥1表明灾难恢复能力不可靠；3. 备份数据完整性校验异常代表备份数据不可用。满足任一条件即触发疑点。
  audit_item: 网络安全建设方面存在的问题
  suspicion: 未按规定开展灾难备份建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国网络安全法\",\n    \"法规文号\": \"主席令第53号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十一条\",\n    \"内容概述\": \"网络运营者应当采取数据分类、重要数据备份和加密等措施。\"\n  },\n  {\n    \"法规名称\": \"信息安全技术 信息系统灾难恢复规范\",\n    \"法规文号\"\
    : \"GB/T 20988-2007\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"第6章 灾难恢复需求的确定、第7章 灾难恢复策略的制定\",\n    \"内容概述\": \"信息系统应根据业务影响分析确定"
- expression: (任务名称、计划完成率、实际完成率、各任务实际完成时间、实际完成进度百分比.实际完成率 < 任务名称、计划完成率、实际完成率、各任务实际完成时间、实际完成进度百分比.计划完成率) && (当前日期 > 任务清单、责任部门、计划产出成果.计划完成时间节点)
    || (任务名称、计划完成率、实际完成率、各任务实际完成时间、实际完成进度百分比.滞后天数 > 90 && 项目名称、收款单位、付款金额、付款日期、首次付款日期、支付金额.资金到位率 < 50% && 协调事项、责任单位.问题描述 >=
    3)
  description: 表达式包含两层逻辑：第一层为任一任务实际完成率低于计划完成率且已超过计划完成日期，直接判定为推进缓慢；第二层为严重滞后场景——滞后天数超过90天、资金到位率不足50%且问题反馈记录达3次以上，表明管理工作严重缺位。风险等级根据滞后时长及影响范围划分。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 试点县工作推进缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业资源及生态保护补助资金管理办法\",\n    \"法规文号\": \"财农〔2022〕30号（注：示例文号，以现行有效版本为准）\",\n    \"\
    效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条、第十六条\",\n    \"内容概述\": \"资金使用单位应按规定及时推进项目建设，加强预算执行管理；地方财政部门应加快资金拨付进度，对未按时完成任务或进度严重滞后的，可核减后续资金安排并追究责任。\"\
    \n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n "
- expression: (仓储保鲜冷链技术标准文件.存在标识 == 0) || (冷链设备操作规程文档.存在标识 == 0) || (COUNT(冷链设备配置与运行台账.设备型号 DISTINCT) > COUNT(冷链设备操作规程文档.覆盖设备型号
    DISTINCT)) || (AVG(操作规程执行检查记录表.合规率) < 0.7)
  description: 技术标准文件或操作规程文档任一缺失即违规；已配置的设备型号数量大于操作规程覆盖的设备型号数量，即部分设备无操作规程；检查记录合规率低于70%，反映规程未有效执行或规程本身不可操作。
  audit_item: 项目建设组织实施不到位
  suspicion: 未制定冷链技术标准或操作规程
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国安全生产法\",\n    \"法规文号\": \"中华人民共和国主席令第88号（2021年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第三十六条\",\n    \"内容概述\": \"生产经营单位应当教育和督促从业人员严格执行本单位的安全生产规章制度和安全操作规程，并向从业人员如实告知作业场所和工作岗位存在的危险因素、防范措施及事故应急措施。未制定操作规程违反此规定。\"\
    \n  }\n]"
