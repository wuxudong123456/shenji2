name: audit/政策文件类/样本
type: model
description: 从政策文件类类文档（样本）中提取结构化元数据。涵盖字段如：借方科目、凭证摘要、抵押物评估报告、权属证明、营业外收入金额、记账凭证摘要、记账日期、贷方科目。文档范围包括：会计凭证抽查样本、抵押担保合同样本等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 凭证
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 样本
  member_count: 1
  member_details:
  - 会计凭证抽查样本
  - 抵押担保合同样本
output:
  fields:
  - name: 借方科目
    type: string
    description: 提取 借方科目 的文本值
  - name: 凭证摘要
    type: string
    description: 提取 凭证摘要 的文本值
  - name: 抵押物评估报告
    type: string
    description: 提取 抵押物评估报告 的文本值
  - name: 权属证明
    type: string
    description: 提取 权属证明 的文本值
  - name: 营业外收入金额
    type: number
    description: 提取 营业外收入金额 的数值（含单位，如万元、吨等）
  - name: 记账凭证摘要
    type: string
    description: 提取 记账凭证摘要 的文本值
  - name: 记账日期
    type: date
    description: 提取 记账日期 的日期值，格式 YYYY-MM-DD
  - name: 贷方科目
    type: string
    description: 提取 贷方科目 的文本值
  - name: 附件日期
    type: date
    description: 提取 附件日期 的日期值，格式 YYYY-MM-DD
  - name: 附件类型
    type: string
    description: 提取 附件类型 的文本值
violations:
- expression: ABS(记账日期.记账日期 - 业务实质发生日期) > 会计分期截止容忍度
  description: 业务实质发生日期取自合同生效日、法院判决生效日、资产交割日等客观证据；会计分期截止容忍度通常为0天（即不可跨期），除非存在跨期调整的合理依据。若记账日期早于或晚于实质发生日期，即触发疑点。
  audit_item: 未按规定核算收益及营业外收支
  suspicion: 提前或推迟确认营业外收支
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"企业应当以权责发生制为基础进行会计确认、计量和报告。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\":\
    \ \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。\"\
    \n  }\n]"
- expression: 资产处置收益计算表.处置作价 - 资产处置收益计算表.资产账面净值 - 资产处置收益计算表.相关税费 < ABS(样本.贷方科目 - 样本.借方科目)
  description: 该逻辑检查是否将资产处置总价款直接计入营业收入或未冲减资产账面价值。正确的处理应为按净额（售价-账面价值-税费）确认资产处置损益，并分别冲销固定资产原值和累计折旧。若利润表项目的发生额大于计算出的净收益，则存在净额法误用为总额法的嫌疑。
  audit_item: 未按规定核算收益及营业外收支
  suspicion: 资产处置收益未按净额法确认
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第4号——固定资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十三条\",\n    \"内容概述\": \"企业出售、转让、报废固定资产或发生固定资产毁损，应当将处置收入扣除账面价值和相关税费后的金额计入当期损益。\"\n  }\n]"
- expression: 明细表.债权人是否为关联方 == '关联方' && 重组协议.重组后债务公允价值 < 重组协议.原债务金额 && 样本.营业外收入金额 > 0
  description: 根据会计准则，与关联方发生的债务豁免，若交易不具有商业实质，其产生的利得应视为权益性交易，计入资本公积而非营业外收入。该表达式用于筛查将关联方债务豁免不当确认为利润的违规行为。若上述“且”条件同时满足，即触发疑点。
  audit_item: 未按规定核算收益及营业外收支
  suspicion: 虚构或不当确认债务重组收益
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第12号——债务重组\",\n    \"法规文号\": \"财会〔2019〕9号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十一条\",\n    \"内容概述\": \"将债务转为权益工具方式进行债务重组的，债务人应当在所清偿债务符合终止确认条件时予以终止确认。债务人初始确认权益工具时应当按照权益工具的公允价值计量。所清偿债务账面价值与权益工具确认金额之间的差额，应当计入当期损益。\"\
    \n  },\n  {\n    \"法规名称\": \"关于做好执行企业会计准则的企业2012年年报工作的通知\",\n    \"法规文号\": \"财会〔2012〕25"
- expression: (缺失制度列表包含 '风险准备金制度' OR 缺失制度列表包含 '审贷决策流程制度' OR 缺失制度列表包含 '信息披露制度' OR 缺失制度列表包含 '动态监测制度') AND (准备金账户.余额 < 准备金制度.要求应计提金额*0.8
    OR 监测表.核心指标缺失数 > 3 OR 抵押合同.权属证明缺失= '是')
  description: 判定：必备的风控制度（风险准备金制度、审贷决策制度、信息披露制度、动态监测制度）中任一项缺失，且在实际运行中，风险准备金账户余额未达到制度规定金额的80%、或监测指标动态表中关键指标缺失超过3个、或抵押合同缺失权属证明，即判定制度体系不健全且执行失效。
  audit_item: 供销合作社金融服务不规范
  suspicion: 审贷决策及风险准备等关键制度缺失
  regulation: "[\n  {\n    \"法规名称\": \"农村资金互助社管理暂行规定\",\n    \"法规文号\": \"银监发〔2007〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"农村资金互助社应当建立审慎经营机制，建立贷款管理制度、内部审计制度、风险准备金制度和信息披露制度等。\"\n  }\n]"
