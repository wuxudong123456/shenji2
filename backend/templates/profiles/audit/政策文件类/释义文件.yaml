name: audit/政策文件类/释义文件
type: model
description: 从政策文件类类文档（释义文件）中提取结构化元数据。涵盖字段如：标准术语解释。文档范围包括：官方释义文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 释义文件
  member_count: 1
  member_details:
  - 官方释义文件
output:
  fields:
  - name: 标准术语解释
    type: string
    description: 提取 标准术语解释 的文本值
violations:
- expression: 内部管理制度.使用的特定法律、行业、经济术语 ∩ 上位法规政策文件.负面清单具体项目 != ∅ && 内部管理制度.具体条款内容 != 上位法规政策文件.法定内涵与外延
  description: 表达式逻辑：当内部管理制度与上位法使用了相同的术语，但其所指的概念、主体、范围或程序与法定解释不一致时，判定为疑点。例如，将上位法中的‘行政处罚’误写为‘行政处分’，或者将‘财政专项资金’的概念曲解为可用于单位日常公用经费。需要建立常见的易混淆术语库进行比对。
  audit_item: 内控管理制度符合性审计
  suspicion: 内部制度核心术语与上位法冲突
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国行政处罚法\",\n    \"法规文号\": \"主席令第七十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二章、第三章\",\n    \"内容概述\": \"对行政处罚的种类和设定、实施机关、管辖和适用做了明确规定，任何内部制度不得擅自扩大或缩小‘行政处罚’的概念与权限，更不可将其与‘行政处分’混淆。\"\n  },\n  {\n  \
    \  \"法规名称\": \"关于加强行政规范性文件制定和监督管理工作的通知\",\n    \"法规文号\": \"国办发〔2018〕37号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第二部分\"\
    ,\n "
