name: audit/政策文件类/制定文件
type: model
description: 从政策文件类类文档（制定文件）中提取结构化元数据。涵盖字段如：有无地方标准、标准限值、目录发布日期、目录覆盖产业及职业清单。文档范围包括：地方排放标准制定文件、重点产业职业培训需求指导目录制定文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 制定文件
  member_count: 1
  member_details:
  - 地方排放标准制定文件
  - 重点产业职业培训需求指导目录制定文件
output:
  fields:
  - name: 有无地方标准
    type: boolean
    description: 提取 有无地方标准 的布尔值（是/否）
  - name: 标准限值
    type: string
    description: 提取 标准限值 的文本值
  - name: 目录发布日期
    type: date
    description: 提取 目录发布日期 的日期值，格式 YYYY-MM-DD
  - name: 目录覆盖产业及职业清单
    type: string
    description: 提取 目录覆盖产业及职业清单 的文本值
violations:
- expression: (要求覆盖的重点产业清单.要求覆盖的重点产业清单 - 目录覆盖产业及职业清单.目录覆盖产业及职业清单) 非空 || (当前日期 - 目录覆盖产业及职业清单.目录发布日期) > 目录更新周期规定.目录更新周期规定
  description: 政策通常要求每年更新目录且须覆盖本地区重点新兴产业和紧缺职业；若目录缺失政策要求的产业类别或发布滞后超过一个更新周期（如365天），即判定违规。
  audit_item: 职业培训政策执行不到位
  suspicion: 未按规定制定或更新职业培训需求指导目录
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于推行终身职业技能培训制度的意见\",\n    \"法规文号\": \"国发〔2018〕11号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第三部分（七）\",\n    \"内容概述\": \"建立并定期发布重点产业职业培训需求指导目录，提高培训针对性和有效性。\"\n  }\n]"
- expression: (划定文件.饮用水源保护区、重点生态功能区范围及管控要求 OR 划定文件.饮用水源保护区、重点生态功能区范围及管控要求) AND (制定文件.有无地方标准、标准限值（COD、氨氮、总磷等） OR (制定文件.标准限值（COD、氨氮、总磷等）
    = 排放文件.国家一级A/B标准限值 AND 未达到功能水质目标))
  description: 根据上位法要求，对于饮用水源地等需要特殊保护的水体，地方应制定严于国家标准的排放标准。若存在敏感区域但未出台地方标准，或标准与国标相同且无法满足水质功能要求，即判定为未有效制定标准。
  audit_item: 污水治理项目建设、运营、管护不到位
  suspicion: 未制定地方污水排放标准导致宽松管控
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"省、自治区、直辖市人民政府对国家排放标准中未作规定的项目，可以制定地方标准；对已作规定的项目，可以制定严于国家标准的地方排放标准。\"\n  }\n]"
