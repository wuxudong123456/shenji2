name: audit/政策文件类/分解文件
type: model
description: 从政策文件类类文档（分解文件）中提取结构化元数据。涵盖字段如：任务分解的颗粒度、任务量、优先级、分区计划户数、分解指标、分解至下级单位的目标人数、分解至各级单位的目标供电可靠率、向市县下达指标日期。文档范围包括：农村黑臭水体治理任务分解文件、就业见习年度目标任务分解文件、年度工作计划或任务分解文件、政府清洁取暖改造任务分解文件、新型职业农民培育年度任务分解文件、目标责任书或任务分解文件、省级指标分解文件、黑臭水体治理任务分解文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 分解文件
  member_count: 1
  member_details:
  - 农村黑臭水体治理任务分解文件
  - 就业见习年度目标任务分解文件
  - 年度工作计划或任务分解文件
  - 政府清洁取暖改造任务分解文件
  - 新型职业农民培育年度任务分解文件
  - 目标责任书或任务分解文件
  - 省级指标分解文件
  - 黑臭水体治理任务分解文件
output:
  fields:
  - name: 任务分解的颗粒度
    type: string
    description: 提取 任务分解的颗粒度 的文本值
  - name: 任务量
    type: string
    description: 提取 任务量 的文本值
  - name: 优先级
    type: string
    description: 提取 优先级 的文本值
  - name: 分区计划户数
    type: string
    description: 提取 分区计划户数 的文本值
  - name: 分解指标
    type: string
    description: 提取 分解指标 的文本值
  - name: 分解至下级单位的目标人数
    type: number
    description: 提取 分解至下级单位的目标人数 的数值（含单位，如万元、吨等）
  - name: 分解至各级单位的目标供电可靠率
    type: string
    description: 提取 分解至各级单位的目标供电可靠率 的文本值
  - name: 向市县下达指标日期
    type: date
    description: 提取 向市县下达指标日期 的日期值，格式 YYYY-MM-DD
  - name: 周边污染源排查情况
    type: string
    description: 提取 周边污染源排查情况 的文本值
  - name: 完成时限
    type: string
    description: 提取 完成时限 的文本值
  - name: 年度工作任务列表
    type: date
    description: 提取 年度工作任务列表 的日期值，格式 YYYY-MM-DD
  - name: 收到中央资金日期
    type: date
    description: 提取 收到中央资金日期 的日期值，格式 YYYY-MM-DD
  - name: 时间节点
    type: date
    description: 提取 时间节点 的日期值，格式 YYYY-MM-DD
  - name: 是否包含具体活动
    type: boolean
    description: 提取 是否包含具体活动 的布尔值（是/否）
  - name: 治理时限
    type: string
    description: 提取 治理时限 的文本值
  - name: 治理范围
    type: string
    description: 提取 治理范围 的文本值
  - name: 省级目标总人数
    type: number
    description: 提取 省级目标总人数 的数值（含单位，如万元、吨等）
  - name: 考核期目标清洁取暖率
    type: string
    description: 提取 考核期目标清洁取暖率 的文本值
  - name: 计划完成时间节点
    type: date
    description: 提取 计划完成时间节点 的日期值，格式 YYYY-MM-DD
  - name: 计划销号水体数量
    type: number
    description: 提取 计划销号水体数量 的数值（含单位，如万元、吨等）
  - name: 责任主体
    type: string
    description: 提取 责任主体 的文本值
  - name: 责任人
    type: string
    description: 提取 责任人 的文本值
  - name: 重点工作任务名称
    type: string
    description: 提取 重点工作任务名称 的文本值
  - name: 重点工作目标分解指标
    type: string
    description: 提取 重点工作目标分解指标 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
violations:
- expression: (绩效目标申报表.产出指标 IS NULL OR 绩效目标申报表.效益指标 IS NULL OR 绩效目标申报表.满意度指标 IS NULL) && (项目可行性研究报告或立项论证材料.项目预期成果清单 != '无'
    OR 年度工作计划.重点工作目标 != '缺失')
  description: 此表达式用于侦测绩效目标覆盖不完整。当‘绩效目标申报表’中财务部规定的核心指标（如产出、效益、满意度）有一项或多项完全缺失（IS NULL），但审核其立项源头，如‘项目可行性研究报告或立项论证材料’中却明确描述了相关的预期成果，或‘年度工作计划’中对该项工作有明确的多维度目标要求，说明申报表未能完整转化应设定的全部目标，构成不完整式违规。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定不完整，缺失核心指标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十一条\",\n    \"内容概述\": \"各部门、各单位应当按照国务院财政部门制定的绩效目标管理办法，设置指向明确、细化量化、合理可行的项目支出绩效目标，并作为编制和安排预算的重要依据。\"\n  },\n  {\n\
    \    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n  \
    \  \"内容概述"
- expression: (本年预算金额 / 上年预算金额 - 1) / (本年产出任务数量 / 上年产出任务数量 - 1) < 0.5 && 本年预算金额 > 上年预算金额
  description: 此表达式用于检测资金与任务量变动的协同性。计算预算增长率与任务量增长率的比值（弹性系数）。当预算增长但任务量增长显著滞后，即弹性系数小于0.5（例如，预算增长100%，任务量仅增长10%，比值为0.1），且本年预算确实增加时，判定为“资金量与任务数不匹配”。这说明资金增加缺乏对应的实物工作量支撑。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标与任务计划数不匹配
  regulation: "[\n  {\n    \"法规名称\": \"关于加强和改进中央部门项目支出预算管理的通知\",\n    \"法规文号\": \"财预〔2015〕82号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"项目绩效目标应与预算资金量、项目任务量相匹配。在预算编制和评审中，要对绩效目标与资金规模的合理性、相关性进行重点审核。\"\n  },\n  {\n   \
    \ \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条\",\n    \"\
    内容概述\": \"绩效"
- expression: (绩效目标申报表.目标层级 = 1) && (绩效目标申报表.总目标 LIKE '%改善环境%' OR 绩效目标申报表.总目标 LIKE '%提升服务%') && (年度工作计划.任务分解颗粒度 = '粗放')
  description: 检查目标是否仅有一个宏大笼统的总目标，而没有分层级的细化指标。当申报表仅有一级目标，总目标文本中出现“改善”、“提升”、“加强”等无法衡量具体方向和内容的动词，并且配套的年度工作计划中对实现该目标的步骤描述颗粒度极为粗放（例：仅为‘一季度开展、二季度推进’），则认定为未细化。这违反了目标
    SMART 原则中的 Specific 和 Measurable。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定过于笼统未细化
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十四条\",\n    \"内容概述\": \"绩效指标应当定量指标与定性指标相结合，优先使用定量指标。绩效目标的设置应当细化量化，并将其分解为清晰、可衡量的绩效指标。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"\
    绩效目标要能清晰"
- expression: ([统计表].各区域实际供电可靠率 < [目标供电可靠率、任务完成时间节点、考核标准、目标综合电压合格率、任务完成时间、考核办法、户均配变容量目标值、完成时限、农牧区全覆盖目标、通电标准].目标供电可靠率) && (当前日期
    > [目标供电可靠率、任务完成时间节点、考核标准、目标综合电压合格率、任务完成时间、考核办法、户均配变容量目标值、完成时限、农牧区全覆盖目标、通电标准].任务完成时间节点)
  description: 实际供电可靠率低于政府或计划文件设定的目标值，且任务完成时间节点已过，即判定为未按期实现任务目标。若实际值低于目标值超过0.5个百分点，可视为严重未达标，需重点核查原因。
  audit_item: 农村电网改造升级任务目标未完成
  suspicion: 供电可靠率未按期实现任务目标
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2013〕678号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十三条\",\n    \"内容概述\": \"项目法人单位应严格按照规划确定的建设目标、任务和时限要求组织实施，确保按期完成农村电网改造升级任务，实现规定的供电可靠率和电压合格率等指标。\"\n  },\n\
    \  {\n    \"法规名称\": \"供电监管办法\",\n    \"法规文号\": \"国家电力监管委员会令第27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条\",\n\
    \    \"内容概述"
- expression: ABS(情况表.实际完成人数 - 情况表.目标人数) / 情况表.目标人数 > 0.1
  description: 该表达式用于判定任务缺口率超过10%的单位。当某地区或基地的实际完成人数与目标人数的偏差率（缺口率）高于10%时，视为严重未完成目标任务；缺口率在0~10%之间的为一般性未达标。同时可结合资金使用率进一步分析，若资金使用率明显偏低，则印证岗位开发不足、执行不力。
  audit_item: 百万青年就业见习计划执行不到位
  suspicion: 未按规定完成就业见习年度目标任务
  regulation: "[\n  {\n    \"法规名称\": \"关于实施三年百万青年见习计划的通知\",\n    \"法规文号\": \"人社部函〔2018〕186号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"各地要根据本通知要求，结合本地实际，制定具体实施方案，分解落实年度目标任务，确保见习计划顺利实施。要加强工作督导，对见习计划完成情况定期通报，对组织不力、任务完成不好的单位予以督促整改。\"\
    \n  }\n]"
- expression: (收款凭证.实际到账日期 - 分解文件.收到中央资金日期) > 管理办法.省级分解下达规定时限（如30日内） && (无统筹规划正式文件或不可抗力说明)
  description: 规定时限通常为省级收到中央资金后30日内；超期即构成滞留；滞留超过60天或跨年滞留的为严重违规。
  audit_item: 财政部门未按规定分配下达保障性安居工程专项资金
  suspicion: 省级财政部门层层滞留中央下达专项资金
  regulation: "[\n  {\n    \"法规名称\": \"省级财政保障性安居工程专项资金管理办法\",\n    \"法规文号\": \"某省财综〔2022〕X号\",\n    \"效力级别\": \"制度文件\",\n\
    \    \"条款号\": \"第十二条\",\n    \"内容概述\": \"省级财政部门应在收到中央补助资金后30日内，全部分解下达至市县财政部门。\"\n  }\n]"
