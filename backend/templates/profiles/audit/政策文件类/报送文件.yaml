name: audit/政策文件类/报送文件
type: model
description: 从政策文件类类文档（报送文件）中提取结构化元数据。涵盖字段如：天数、年度、计划内团组编号及名称、计划团组编号列表、计划报送年度、预算金额、预计人数。文档范围包括：年度出国（境）计划报送文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 预算
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 报送文件
  member_count: 1
  member_details:
  - 年度出国（境）计划报送文件
output:
  fields:
  - name: 天数
    type: number
    description: 提取 天数 的数值（含单位，如万元、吨等）
  - name: 年度
    type: date
    description: 提取 年度 的日期值，格式 YYYY-MM-DD
  - name: 计划内团组编号及名称
    type: string
    description: 提取 计划内团组编号及名称 的文本值
  - name: 计划团组编号列表
    type: string
    description: 提取 计划团组编号列表 的文本值
  - name: 计划报送年度
    type: date
    description: 提取 计划报送年度 的日期值，格式 YYYY-MM-DD
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 预计人数
    type: number
    description: 提取 预计人数 的数值（含单位，如万元、吨等）
