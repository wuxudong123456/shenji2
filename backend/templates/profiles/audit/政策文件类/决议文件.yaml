name: audit/政策文件类/决议文件
type: model
description: 从政策文件类类文档（决议文件）中提取结构化元数据。涵盖字段如：关于交易方式的决策讨论、关于资金保值增值的决议内容、决议事项、决议内容、决议担保事项清单、决议文号、决议日期、决议签名。文档范围包括：业主大会与业委会决议文件、决议文件、合作社决议文件、村集体资产租赁/处置会议决议文件、理事会决议文件、职工代表大会决议文件、股东会决议文件、股东大会关于担保事项的决议文件、董事会关于担保事项的决议文件、董事会决议文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 人员
- 审批
- 资产
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 决议文件
  member_count: 1
  member_details:
  - 业主大会与业委会决议文件
  - 决议文件
  - 合作社决议文件
  - 村集体资产租赁/处置会议决议文件
  - 理事会决议文件
  - 职工代表大会决议文件
  - 股东会决议文件
  - 股东大会关于担保事项的决议文件
  - 董事会关于担保事项的决议文件
  - 董事会决议文件
  - 资产处置相关的董事会/股东会决策决议文件
output:
  fields:
  - name: 关于交易方式的决策讨论
    type: string
    description: 提取 关于交易方式的决策讨论 的文本值
  - name: 关于资金保值增值的决议内容
    type: string
    description: 提取 关于资金保值增值的决议内容 的文本值
  - name: 决议事项
    type: string
    description: 提取 决议事项 的文本值
  - name: 决议内容
    type: string
    description: 提取 决议内容 的文本值
  - name: 决议担保事项清单
    type: string
    description: 提取 决议担保事项清单 的文本值
  - name: 决议文号
    type: string
    description: 提取 决议文号 的文本值
  - name: 决议日期
    type: date
    description: 提取 决议日期 的日期值，格式 YYYY-MM-DD
  - name: 决议签名
    type: string
    description: 提取 决议签名 的文本值
  - name: 决议通过的年金方案内容
    type: string
    description: 提取 决议通过的年金方案内容 的文本值
  - name: 决议金额
    type: number
    description: 提取 决议金额 的数值（含单位，如万元、吨等）
  - name: 出席人员签名
    type: string
    description: 提取 出席人员签名 的文本值
  - name: 出席董事-股东签名
    type: string
    description: 提取 出席董事-股东签名 的文本值
  - name: 参会人数
    type: number
    description: 提取 参会人数 的数值（含单位，如万元、吨等）
  - name: 涉及变更的内容
    type: string
    description: 提取 涉及变更的内容 的文本值
  - name: 表决比例
    type: number
    description: 提取 表决比例 的数值（含单位，如万元、吨等）
  - name: 表决结果
    type: boolean
    description: 提取 表决结果 的布尔值（是/否）
  - name: 表决记录
    type: string
    description: 提取 表决记录 的文本值
  - name: 豁免进场申请的审批记录
    type: string
    description: 提取 豁免进场申请的审批记录 的文本值
  - name: 资产处置决议内容
    type: string
    description: 提取 资产处置决议内容 的文本值
violations:
- expression: 存在担保合同.合同编号，且（无对应的董事会/股东大会决议记录）或（决议担保事项清单、决议金额、决议日期、出席董事/股东签名.决议日期晚于合同签订日期）或（决议担保事项清单、决议金额、决议日期、出席董事/股东签名.决议金额小于担保合同.担保金额）或（审批节点、审批人、审批意见、审批时间.审批人权限不符合担保审批权限规定（金额阈值、审批层级）.审批层级）
  description: 担保合同若无对应的决议记录；或决议签署日期晚于合同签订日期（先签合同后补程序）；或决议批准的担保金额无法覆盖合同金额；或最终审批人未达到制度规定的权限级别，均触发疑点。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 担保事项未履行董事会或股东大会审批程序
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\",\n\
    \    \"内容概述\": \"公司向其他企业投资或者为他人提供担保，依照公司章程的规定，由董事会或者股东会、股东大会决议；公司章程对投资或者担保的总额及单项投资或者担保的数额有限额规定的，不得超过规定的限额。\"\n  },\n \
    \ {\n    \"法规名称\": \"企业内部控制应用指引第12号——担保业务\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第四条\",\n \
    \   \"内容概述\""
- expression: ( 跟踪表.决策文号 IS NULL  OR  跟踪表.决策文号 == '' )  || ( 跟踪表.决策主体类型 != 管理制度.决策权限划分条款 ) || ( ABS( DATEDIFF( 文件.合同签署日期,  跟踪表.决策通过日期
    ) ) < 0  ) || ( 记录表.审批通过日期  <  跟踪表.决策通过日期 )
  description: 本表达式检测四种违规场景：1.决策文号为空，代表程序缺失；2.决策主体类型与内部制度规定的权限不符，例如应由股东会决策的事项由董事会代行；3.合同签署日期早于决策通过日期，属于典型的“先斩后奏”程序倒置，差值为负；4.关键业务审批节点完成日期早于正式决策日期，侧面印证决策程序为事后补办。满足任一条件即判定为疑点。
  audit_item: 违规处置重大资产
  suspicion: 未按规定履行决策程序转让资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十条、第三十一条、第三十二条\",\n    \"内容概述\": \"国家出资企业进行重大投资、为他人提供大额担保、转让重大财产等重大事项，应当遵守法律、行政法规以及企业章程的规定，不得损害出资人和债权人的权益，并需经其履行出资人职责的机构或股东会、董事会决定。\"\
    \n  }\n]"
- expression: ( 资产项目名称、资产类型（股权/实物/债权）、交易方式（进场/协议）、最终受让方、资产原值、账面净值、处置日期.资产类型（股权/实物/债权） IN ('股权', '增资') || 资产项目名称、资产类型（股权/实物/债权）、交易方式（进场/协议）、最终受让方、资产原值、账面净值、处置日期.资产原值
    > 管理制度.强制进场交易的资产类型及金额标准 ) && ( 资产项目名称、资产类型（股权/实物/债权）、交易方式（进场/协议）、最终受让方、资产原值、账面净值、处置日期.交易方式（进场/协议） != '公开挂牌进场交易' ) && (
    交易项目编号、挂牌公告起止日期、成交方式（竞价/协议）.交易
  description: 根据32号令规定，国有产权转让、国有企业增资等行为原则上需在依法设立的产权交易机构公开进行。表达式首先筛选出法规或内部制度明确规定必须进场交易的项目，然后核查其是否具备合法的进场交易证明。若其交易方式为非公开挂牌，且无法提供由省级以上国资监管机构出具或认可的有效进场交易凭证或豁免批复文件，即判定为违规。
  audit_item: 违规处置重大资产
  suspicion: 未按规定进场交易违规处置资产
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国务院国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第四条、第十三条\",\n    \"内容概述\": \"企业国有资产交易应当在依法设立的产权交易机构中公开进行，国家法律法规另有规定的从其规定。产权转让原则上通过产权市场公开进行。\"\n  }\n]"
- expression: (担保合同.签订日期 < 决议文件.决议日期) || (担保合同.担保金额 > 其他.金额限额 && 决议文件.审批层级 != 其他.审批层级) || (其他.需经董事会或风控委员会审批的条件 == true &&
    批准文件.批复文号 == null)
  description: 判定规则：1. 合同签订日期早于决议日期，表明存在先操作后审批；2. 担保金额超过制度规定的该层级审批限额（如总经理权限1亿，实际担保2亿），且决议机构层级不符；3. 根据公司章程或上级规定须报国资委/集团审批而未取得书面批复，即视为违规。以上任一条件满足则触发疑点。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 未按规定履行决策程序对外担保或借款
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进国有企业贯彻落实“三重一大”决策制度的意见\",\n    \"法规文号\": \"中办发〔2010〕17号\",\n    \"效力级别\": \"\
    制度文件\",\n    \"条款号\": \"二、‘三重一大’事项的主要范围\",\n    \"内容概述\": \"重大决策、重要人事任免、重大项目安排和大额度资金运作事项必须由领导班子集体作出决定，不得以传阅、会签或个别征求意见等方式代替。\"\
    \n  }\n]"
- expression: ((应发工资、基本工资、津贴补贴、职工姓名、代扣个人所得税、代扣社保个人部分、实发工资、应发合计、工资总额、工资总额合计、职工工资总额、岗位级别.企业缴费金额 / 应发工资、基本工资、津贴补贴、职工姓名、代扣个人所得税、代扣社保个人部分、实发工资、应发合计、工资总额、工资总额合计、职工工资总额、岗位级别.缴费基数)
    > 企业缴费比例上限、个人缴费比例上限、民主程序通过说明.企业缴费比例上限) || (SUM(应发工资、基本工资、津贴补贴、职工姓名、代扣个人所得税、代扣社保个人部分、实发工资、应发合计、工资总额、工资总额合计、职工工资总额、岗位级别.企业缴费金额)
    / SUM(应发工资、基本工资
  description: 企业缴费比例超过备案文件的上限；或企业缴费总额超过上年度职工工资总额的8%（政策上限）；或高管缴费比例明显高于普通员工（差距超过3个百分点），可能构成违规或歧视性利益输送。
  audit_item: 违规支付职工薪酬及股份
  suspicion: 超标准列支补充养老保险（企业年金）
  regulation: "[\n  {\n    \"法规名称\": \"企业年金办法\",\n    \"法规文号\": \"人力资源和社会保障部令第36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十一条\",\n    \"内容概述\": \"企业缴费每年不超过本企业职工工资总额的8%。企业和职工个人缴费合计不超过本企业职工工资总额的12%。具体所需费用，由企业和职工一方协商确定。\"\n  },\n  {\n  \
    \  \"法规名称\": \"企业年金办法\",\n    \"法规文号\": \"人力资源和社会保障部令第36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n    \"\
    内容概述\": \"企业"
- expression: 资产抵押登记查询记录.债务人 IN ("政府融资平台","政府项目公司") && 资产抵押登记查询记录.抵押权人 == "供销合作社" && (理事会决议文件 IS NULL || 理事会决议文件.表决记录 != "通过")
    && 贷款资金用途明细.最终使用方 != "供销社自身经营"
  description: 供销社以自有资产为政府融资平台或政府项目提供抵押担保，且未经理事会同意、贷款资金也未用于自身为农服务，违反禁止规定。高风险。
  audit_item: 供销合作社综合改革不合规
  suspicion: 社有资产违规为政府融资抵押
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第三部分（十）\",\n    \"内容概述\": \"不得将社有资产纳入地方政府融资平台或用于为政府项目提供担保，确保社有资产安全完整。\"\n  }\n]"
- expression: (盘活方式、盘活率、已盘活数量.盘活率<60% || 闲置起始日期>365天) && (决议日期、决议内容、表决结果.决议内容 缺失 || 决议日期 为空) && 资产名称、资产状态、闲置起始日期.资产状态=="闲置"
  description: 盘活率低于60%或闲置超过1年，且无会议决议或无任何租赁、合作开发合同，则判定为未采取有效形式盘活；盘活率=已盘活资产数/闲置资产总数×100%。
  audit_item: 农村集体经济发展壮大不到位
  suspicion: 闲置集体资产未有效盘活导致损失浪费
  regulation: "[\n  {\n    \"法规名称\": \"农业部关于进一步加强农村集体资金资产资源管理的意见\",\n    \"法规文号\": \"农经发〔2013〕4号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"农村集体经济组织应建立健全资产台账，对闲置资产通过租赁、承包、合作开发等方式盘活，防止资产流失和浪费。\"\n  }\n]"
- expression: 明细表.交易类型 == '转账支出' && (明细表.交易对手名称 CONTAIN ('理财'||'基金'||'证券'||'信托')) && 缺失(决议文件.关于资金保值增值的决议内容)
  description: 专户资金向外转出且收款账户名称包含理财、基金、证券、信托等字样，同时不能提供经业主大会双三分之二表决同意的投资决议，即可判定为违规挪用。
  audit_item: 挪用住宅专项维修资金
  suspicion: 违规使用维修资金购买高风险理财产品
  regulation: "[\n  {\n    \"法规名称\": \"《住宅专项维修资金管理办法》\",\n    \"法规文号\": \"建设部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"维修资金应当专项用于住宅共用部位、共用设施设备保修期满后的维修和更新、改造，不得挪作他用。\"\n  }\n]"
