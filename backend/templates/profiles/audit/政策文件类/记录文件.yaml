name: audit/政策文件类/记录文件
type: model
description: 从政策文件类类文档（记录文件）中提取结构化元数据。涵盖字段如：中介机构名称、会议纪要、决策依据、变动类型、培训内容是否覆盖废弃物回收流程、处理方式、审批意见、工商注册号。文档范围包括：中介机构备案及合作记录文件、农药使用环节的培训记录文件、农药销售培训记录文件、更正审批记录文件、林木采挖移植执法记录文件、监测对象动态调整工作记录文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 会议
- 培训
- 审批
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 记录文件
  member_count: 1
  member_details:
  - 中介机构备案及合作记录文件
  - 农药使用环节的培训记录文件
  - 农药销售培训记录文件
  - 更正审批记录文件
  - 林木采挖移植执法记录文件
  - 监测对象动态调整工作记录文件
output:
  fields:
  - name: 中介机构名称
    type: string
    description: 提取 中介机构名称 的文本值
  - name: 会议纪要
    type: string
    description: 提取 会议纪要 的文本值
  - name: 决策依据
    type: string
    description: 提取 决策依据 的文本值
  - name: 变动类型
    type: string
    description: 提取 变动类型 的文本值
  - name: 培训内容是否覆盖废弃物回收流程
    type: boolean
    description: 提取 培训内容是否覆盖废弃物回收流程 的布尔值（是/否）
  - name: 处理方式
    type: string
    description: 提取 处理方式 的文本值
  - name: 审批意见
    type: string
    description: 提取 审批意见 的文本值
  - name: 工商注册号
    type: string
    description: 提取 工商注册号 的文本值
  - name: 录入时间
    type: date
    description: 提取 录入时间 的日期值，格式 YYYY-MM-DD
  - name: 新增-退出名单
    type: string
    description: 提取 新增-退出名单 的文本值
  - name: 更新时间
    type: date
    description: 提取 更新时间 的日期值，格式 YYYY-MM-DD
  - name: 更正申请内容
    type: string
    description: 提取 更正申请内容 的文本值
  - name: 最后更新时间
    type: date
    description: 提取 最后更新时间 的日期值，格式 YYYY-MM-DD
  - name: 来源地点
    type: string
    description: 提取 来源地点 的文本值
  - name: 申请事项
    type: string
    description: 提取 申请事项 的文本值
  - name: 纳入-退出名单
    type: string
    description: 提取 纳入-退出名单 的文本值
  - name: 被采挖树木种类
    type: string
    description: 提取 被采挖树木种类 的文本值
  - name: 触发事件
    type: string
    description: 提取 触发事件 的文本值
  - name: 调整原因
    type: string
    description: 提取 调整原因 的文本值
  - name: 资质状态
    type: boolean
    description: 提取 资质状态 的布尔值（是/否）
violations:
- expression: 其他.错误类型 != '金额错误' AND (其他.是否加盖出具单位公章 = '否' OR 记录文件.审批意见 != '同意' OR 其他.更正方式 = '自行更正')
  description: 非金额错误允许更正，但必须由原出具单位更正并加盖公章，自行更正或未经审批均属违规。
  audit_item: 未按照规定填制、取得原始凭证或者填制、取得的原始凭证不符合规定
  suspicion: 原始凭证非金额错误未按规定更正
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财政部令第98号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"原始凭证有错误的，应当由出具单位重开或者更正，更正处应当加盖出具单位公章。原始凭证金额有错误的，应当由出具单位重开，不得在原始凭证上更正。\"\n  }\n]"
- expression: 错误凭证登记及处理台账.金额错误标志 = '是' AND (错误凭证登记及处理台账.是否重开 = '否' OR 错误凭证登记及处理台账.重开凭证编号 IS NULL OR 更正审批记录文件.处理方式 != '重开')
  description: 原始凭证金额错误必须由出具单位重开，不得在原凭证上更正，缺少重开记录即构成违规。
  audit_item: 未按照规定填制、取得原始凭证或者填制、取得的原始凭证不符合规定
  suspicion: 原始凭证金额错误未重开而直接更正
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财政部令第98号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"原始凭证金额有错误的，应当由出具单位重开，不得在原始凭证上更正。\"\n  }\n]"
- expression: (统计表.农药采购量 > 0) && (台账表.记录行数 = 0) && (管理制度文件.回收设施配置要求 不包含 '回收桶' 或 '回收点') || (统计表.实际回收率 < 0.3) && (台账表.处理去向字段
    缺失 或 为空)
  description: 当存在持续的农药采购行为，但回收台账无任何记录且制度中未设置回收设施时，或者回收率低于30%且台账去向信息空缺，判定为未履行回收处理义务。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 农药包装废弃物未进行回收处理
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十八条、第四十条\",\n    \"内容概述\": \"农药经营者应履行农药包装废弃物回收义务；农药经营者应建立农药采购、销售台账，并如实记录废弃物回收情况。\"\n  }\n]"
- expression: 采购清单.采购苗木名称 含 '古树' || 采购清单.规格（胸径、树龄） > 30cm && 记录文件.采挖许可证编号 = NULL || 名录.古树名木编号 出现在 采购清单.供货方中
  description: 采购苗木中包含古树名木直接违规；胸径超过30厘米的大树采挖移植若无审批手续视为违规；古树名木名录中的树木被用于绿化项目，无论有无审批均属非法，因古树严禁采挖。
  audit_item: 村容村貌整体提升不符合相关规定
  suspicion: 违规采挖移植天然大树古树名木
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国森林法\",\n    \"法规文号\": \"主席令第三十九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十条、第七十六条\",\n    \"内容概述\": \"禁止采伐、采挖古树名木；采挖移植非古树名木的大树，必须符合有关规定并办理审批手续；非法采挖、移植的，由林业主管部门责令停止违法行为，限期恢复植被或补种树木，并处罚款。\"\n\
    \  },\n  {\n    \"法规名称\": \"中华人民共和国野生植物保护条例\",\n    \"法规文号\": \"国务院令第204号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十六条\","
- expression: （《返贫重点人群基础信息登记表》.收入字段空缺率 > 10%） || （《返贫重点人群基础信息登记表》.致贫风险类型 与 民政/医保外部数据.救助类型 不匹配） || （《防止返贫监测相关政策文件及制度》.风险认定标准
    缺失） || （《预警信息处置反馈记录表》.预警信息 无对应《返贫重点人群基础信息登记表》记录）
  description: 筛查逻辑：1. 基础信息登记表中收入等关键字段空缺率高，表明底数不清；2. 已享受低保、大病救助的外部人员未在监测台账中体现，说明摸排存在盲区；3. 本地监测范围文件未界定风险认定标准，属于制度性缺失；4. 医保等部门推送的预警信息未纳入监测台账，证明快速发现机制与底数更新脱节。以上任一条件满足即触发疑点。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 返贫重点人群底数不清信息遗漏
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国乡村振兴促进法\",\n    \"法规文号\": \"中华人民共和国主席令第七十七号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十五条\",\n    \"内容概述\": \"县级以上地方人民政府应当建立健全易返贫致贫人口动态监测预警和帮扶机制，对易返贫致贫人口及时发现、及时帮扶，守住防止规模性返贫底线。\"\n  },\n  {\n  \
    \  \"法规名称\": \"关于健全防止返贫动态监测和帮扶机制的指导意见\",\n    \"法规文号\": \"中农发〔2021〕11号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"二（一）\"\
    ,\n "
- expression: （《监测标准与地方实际对比分析表》.本地监测对象占脱贫人口比例 - 周边同类地区均值）的绝对值 > 2% && （相关会议纪要 无 上级规模指导意见） &&  （《帮扶措施落实情况台账》 中 已帮扶户数 / 纳入对象户数
    < 60%）
  description: 该表达式综合判定规模合理性：1. 本地监测比例与周边同类地区均值偏离度大于2个百分点，视为异常；2. 若规模确定缺乏上级指导性文件或数据调研支撑，属人为硬性摊派；3. 辅助验证逻辑：若监测规模过大，往往伴随帮扶资源不足，已帮扶占比会显著偏低。以上三个条件同时成立时，触发严重违规疑点。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 人为设定监测对象规模脱离实际
  regulation: "[\n  {\n    \"法规名称\": \"关于健全防止返贫动态监测和帮扶机制的指导意见\",\n    \"法规文号\": \"中农发〔2021〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"二（二）\",\n    \"内容概述\": \"要综合考量收入支出、‘两不愁三保障’及饮水安全等因素，实事求是确定监测对象，不搞‘一刀切’，不盲目追求‘零风险’，也不随意扩大监测范围。\"\n  }\n\
    ]"
- expression: （当前日期 -《返贫重点人群基础信息登记表》.标注为“监测中”状态的最后更新时间） > 365天 || （《灾害通报》.受影响农户名单 NOT IN 《监测对象动态调整工作记录文件》.新增名单 && 灾害发生时间距今
    > 30天） || （《预警信息处置反馈记录表》.处置完成时间 - 预警触发时间 > 15个工作日）
  description: 判定依据：1. 已纳入监测的对象超过1年无任何动态更新记录，视为“一纳了之”缺乏有效跟踪；2. 发生洪灾、疫情等突发风险事件后，受影响农户在30天内仍未反映在动态调整的新增记录中，说明响应迟滞；3. 收到预警信息后超过15个工作日才完成核实处置，违反快速响应时限要求。以上任一情况触发违规。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 未及时动态调整更新监测名单
  regulation: "[\n  {\n    \"法规名称\": \"关于健全防止返贫动态监测和帮扶机制的指导意见\",\n    \"法规文号\": \"中农发〔2021〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"三（一）\",\n    \"内容概述\": \"要坚持日常走访与集中排查相结合，做到监测对象动态调整常态化、长效化。对因灾因病因疫等导致基本生活出现严重困难的农户，要开辟‘绿色通道’，第一时间核实确认，及时纳入监测帮扶。\"\
    \n  }\n]"
- expression: 中介机构关联记录.关联提取申请编号 > 3 && (同一代办人出现次数 >= 3 || 同一联系电话出现次数 >= 3 || 同一IP地址申请数 >= 5) && (转账凭证.收款账户名称 || 资金存在向中介账户转账记录
    || 提取人账户有明确手续费扣减特征)
  description: 同一中介机构或代办人关联多起提取案例，配合使用重复联系方式、IP地址，且资金流中出现非本人收款或向中介机构分账迹象，即可认定为中介机构组织或参与团伙骗提。关联次数阈值设为3起，电话号码和代办人次阈值3次，IP达到5次。
  audit_item: 违规提取住房公积金
  suspicion: 中介机构协助多人伪造材料骗取公积金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第五十一条\",\n    \"内容概述\": \"以欺骗手段提取住房公积金的，由住房公积金管理中心责令限期退回所提取款项，并处以罚款；构成犯罪的，依法追究刑事责任。中介机构协助骗提属于共同违法，应予查处。\"\n  },\n  {\n\
    \    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二百八十条\",\n \
    \   \"内容概"
