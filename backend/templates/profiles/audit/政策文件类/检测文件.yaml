name: audit/政策文件类/检测文件
type: model
description: 从政策文件类类文档（检测文件）中提取结构化元数据。涵盖字段如：实测质量数据、标准符合性说明、项目名称。文档范围包括：项目质量检测文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 检测文件
  member_count: 1
  member_details:
  - 项目质量检测文件
output:
  fields:
  - name: 实测质量数据
    type: string
    description: 提取 实测质量数据 的文本值
  - name: 标准符合性说明
    type: string
    description: 提取 标准符合性说明 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
