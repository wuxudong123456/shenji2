name: audit/政策文件类/合同文件
type: model
description: 从政策文件类类文档（合同文件）中提取结构化元数据。涵盖字段如：中标人名称、中标联合体成员及分工、付款方式、保修期限条款、协同接口要求、合同对应项目编码、合同线路桩号、合同金额。文档范围包括：信息进村入户工程合同文件、农村公路建设项目合同文件、合同文件、安居工程项目合同文件、电子商务进农村工程合同文件、项目合同文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 付款
- 协议
- 合同
- 审批
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 合同文件
  member_count: 1
  member_details:
  - 信息进村入户工程合同文件
  - 农村公路建设项目合同文件
  - 合同文件
  - 安居工程项目合同文件
  - 电子商务进农村工程合同文件
  - 项目合同文件
output:
  fields:
  - name: 中标人名称
    type: string
    description: 提取 中标人名称 的文本值
  - name: 中标联合体成员及分工
    type: string
    description: 提取 中标联合体成员及分工 的文本值
  - name: 付款方式
    type: number
    description: 提取 付款方式 的数值（含单位，如万元、吨等）
  - name: 保修期限条款
    type: number
    description: 提取 保修期限条款 的数值（含单位，如万元、吨等）
  - name: 协同接口要求
    type: string
    description: 提取 协同接口要求 的文本值
  - name: 合同对应项目编码
    type: string
    description: 提取 合同对应项目编码 的文本值
  - name: 合同线路桩号
    type: string
    description: 提取 合同线路桩号 的文本值
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 土地使用权取得合同
    type: string
    description: 提取 土地使用权取得合同 的文本值
  - name: 完工期限
    type: string
    description: 提取 完工期限 的文本值
  - name: 实施范围
    type: string
    description: 提取 实施范围 的文本值
  - name: 工期
    type: string
    description: 提取 工期 的文本值
  - name: 建设内容
    type: string
    description: 提取 建设内容 的文本值
  - name: 建设合同签订时间及金额
    type: date
    description: 提取 建设合同签订时间及金额 的日期值，格式 YYYY-MM-DD
  - name: 战略合作排他条款
    type: number
    description: 提取 战略合作排他条款 的数值（含单位，如万元、吨等）
  - name: 数据共享义务
    type: string
    description: 提取 数据共享义务 的文本值
  - name: 最终技术规格
    type: string
    description: 提取 最终技术规格 的文本值
  - name: 正式合同中的竞业限制条款
    type: number
    description: 提取 正式合同中的竞业限制条款 的数值（含单位，如万元、吨等）
  - name: 用地审批文号
    type: string
    description: 提取 用地审批文号 的文本值
  - name: 签约主体
    type: string
    description: 提取 签约主体 的文本值
  - name: 签约主体名称
    type: string
    description: 提取 签约主体名称 的文本值
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 系统协同接口条款
    type: number
    description: 提取 系统协同接口条款 的数值（含单位，如万元、吨等）
  - name: 联合体协议条款
    type: number
    description: 提取 联合体协议条款 的数值（含单位，如万元、吨等）
  - name: 质量保证金比例约定
    type: number
    description: 提取 质量保证金比例约定 的数值（含单位，如万元、吨等）
  - name: 资金预算
    type: number
    description: 提取 资金预算 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目编号
    type: string
    description: 提取 项目编号 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 法定代表人
    type: string
    description: 法定代表人/授权代表
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: 通知书.中标人名称 NOT IN (评标报告.中标候选人名单)
  description: 通过比对确定的中标人是否存在于评标委员会依法推荐并公示的中标候选人名单中。若中标人不在该名单内，则判定为违规，触发4.8.1情形。
  audit_item: 招标人违法确定中标人
  suspicion: 招标人在评标委员会推荐的中标候选人以外确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十七条\",\n    \"内容概述\": \"招标人在评标委员会依法推荐的中标候选人以外确定中标人的，中标无效；责令改正，可以处中标项目金额千分之五以上千分之十以下的罚款。\"\n  }\n]"
- expression: 评标报告.结论（是否否决所有投标） == '否决所有投标' && 中标通知书.中标人名称 IS NOT NULL && 记录表.重新招标审批文件编号 == false
  description: 当评标委员会依法否决所有投标后，招标人必须重新招标。若存在中标通知书（即招标人自行确定了中标人）且无合规的重新招标审批文件，则判定违规，对应4.8.2情形。
  audit_item: 招标人违法确定中标人
  suspicion: 招标项目在所有投标被否决后自行确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十七条\",\n    \"内容概述\": \"依法必须进行招标的项目在所有投标被评标委员会否决后自行确定中标人的，中标无效；责令改正，可以处中标项目金额千分之五以上千分之十以下的罚款。\"\n  }\n]"
- expression: (技术方案变动.技术方案变动 == 是) && (变更前后技术参数.变更前后技术参数 != 招标文件技术规格要求) && (评标报告.技术得分 > 0) && (评标报告.澄清说明记录 == 无)
  description: 评标期间指投标截止后至中标通知书发出前；投标人提交了新版投标文件，技术参数发生实质性变更，导致技术得分提高，且评标报告中无正式的澄清记录，视为招标人默许的实质性谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人默许投标人评标后修改技术方案
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n \
    \   \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十二条\",\n    \"内容概述\": \"评标委员会要求投标人澄清的，澄清不得超出投标文件的范围或者改变投标"
- expression: 通知书.中标人名称 NOT IN (评标报告.推荐中标候选人名称) && 评标报告.排序 >= 1
  description: 当中标人不在评标委员会依法推荐的任何中标候选人名单中时触发违规。该表达式直接比对中标通知书与评标报告的核心字段，忽略候选人排序，只要不在名单内即构成违规，前提是存在有效推荐的候选人。
  audit_item: 招标人违法确定中标人
  suspicion: 招标人在推荐中标候选人外确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十条\",\n    \"内容概述\": \"招标人根据评标委员会提出的书面评标报告和推荐的中标候选人确定中标人。招标人也可以授权评标委员会直接确定中标人。\"\n  }\n]"
- expression: 否决投标人名称、否决原因、被否决投标人数量.被否决投标人数量 = 招标文件.投标人数量要求 && 中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中标日期、评标委员会名单、中标通知书发出时间、中标人、中标联合体成员及分工、联合体协议条款.中标人名称
    IS NOT NULL
  description: 当评标委员会否决所有投标后，该项目不应产生任何中标通知书。若存在中标通知书或已签订合同，即表明招标人在未依法重新招标的情况下直接确定了中标人，构成违规。
  audit_item: 招标人违法确定中标人
  suspicion: 所有投标被否决后自行确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十二条\",\n    \"内容概述\": \"评标委员会经评审，认为所有投标都不符合招标文件要求的，可以否决所有投标。依法必须进行招标的项目的所有投标被否决的，招标人应当依照本法重新招标。\"\n  }\n]"
- expression: (信息系统整合情况对照表.系统编号 / 农村电子商务系统建设规划.应整合系统清单) < 0.8 || (数据共享交换统计表.成功/失败次数 / 数据共享交换统计表.交换频次 > 0.05)
  description: 整合完成率低于80%，或数据交换失败率超过5%，均视为系统整合不力、数据共享不充分，存在信息孤岛风险。完成率越低、失败率越高则违规程度越严重。
  audit_item: 信息系统在线服务支撑和保障不足
  suspicion: 农村电商系统整合率低存在信息孤岛
  regulation: "[\n  {\n    \"法规名称\": \"政务信息资源共享管理暂行办法\",\n    \"法规文号\": \"国发〔2016〕51号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"政务信息资源以共享为原则，不共享为例外。各政务部门应按规定编制政务信息资源目录，明确共享条件，推动数据共享。\"\n  },\n  {\n    \"法规名称\": \"\
    促进大数据发展行动纲要\",\n    \"法规文号\": \"国发〔2015〕50号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三部分第(二)项\",\n    \"内容概述\": \"\
    大力推动政府信息系统"
- expression: (工程项目协同实施对比表.村级站点位置 < 500) && (工程项目协同实施对比表.站点功能清单 无交集) || ((工程项目协同实施对比表.资金投入明细 + 信息进村入户工程合同文件.资金预算) - 工程项目协同实施对比表.资金投入明细)
    / 工程项目协同实施对比表.资金投入明细 > 0.2
  description: 两类工程在同一行政村500米内设置独立站点且功能无任何共享整合，或重复购置设备导致资金重复投入率超过20%，均构成工程未有机结合的问题。距离与功能无交集同时满足或资金重复率超标即触发。
  audit_item: 信息系统在线服务支撑和保障不足
  suspicion: 电商与信息进村入户工程未有效协同
  regulation: "[\n  {\n    \"法规名称\": \"农业部关于全面推进信息进村入户工程的实施意见\",\n    \"法规文号\": \"农市发〔2016〕3号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三部分第(二)项\",\n    \"内容概述\": \"坚持统筹规划，整合资源。充分利用现有农村信息化设施和条件，统筹整合涉农信息服务资源，避免重复建设，提高资金使用效率。\"\n  },\n  {\n\
    \    \"法规名称\": \"关于开展电子商务进农村综合示范工作的通知\",\n    \"法规文号\": \"财办建〔2015〕60号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四部分保障措"
- expression: (合同.保修期限字段缺失 || 合同.保修期限 < 2) || (合同.质量保证金比例字段缺失 || 合同.质量保证金比例 < 0.05)
  description: 保修期少于2年或未约定保修期，质量保证金比例低于百分之5或未约定，均构成违规。保修期最低2年与5%比例依据交通运输部令2015年第11号。
  audit_item: 项目建设管理不符合相关规定
  suspicion: 农村公路建设未设定保修期限和质量保证金
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2015年第11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十四条\",\n    \"内容概述\": \"农村公路建设项目应当设定保修期限和质量保证金，保修期限不得少于2年，质量保证金比例不得低于工程结算总额的5%。\"\n  }\n]"
