name: audit/政策文件类/分配文件
type: model
description: 从政策文件类类文档（分配文件）中提取结构化元数据。涵盖字段如：分配标准、分配金额、分项目指标、实际支出、已安排项目清单、机井通电专项预算金额、补贴项目、预算总指标。文档范围包括：年度财政补贴资金分配文件、电力公司年度资金分配文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 补贴
- 金额
- 项目
- 预算
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 分配文件
  member_count: 1
  member_details:
  - 年度财政补贴资金分配文件
  - 电力公司年度资金分配文件
output:
  fields:
  - name: 分配标准
    type: string
    description: 提取 分配标准 的文本值
  - name: 分配金额
    type: number
    description: 提取 分配金额 的数值（含单位，如万元、吨等）
  - name: 分项目指标
    type: string
    description: 提取 分项目指标 的文本值
  - name: 实际支出
    type: number
    description: 提取 实际支出 的数值（含单位，如万元、吨等）
  - name: 已安排项目清单
    type: string
    description: 提取 已安排项目清单 的文本值
  - name: 机井通电专项预算金额
    type: number
    description: 提取 机井通电专项预算金额 的数值（含单位，如万元、吨等）
  - name: 补贴项目
    type: string
    description: 提取 补贴项目 的文本值
  - name: 预算总指标
    type: number
    description: 提取 预算总指标 的数值（含单位，如万元、吨等）
violations:
- expression: 未通电机井清单.是否符合通电条件 == '是' && 未通电机井清单.是否纳入规划 == '是' && 未通电机井清单.机井编号 NOT IN 已通电机井清单.机井编号 && 未通电机井清单.未通电原因 NOT LIKE
    '%不可抗力%' && 电力公司年度资金分配文件.实际支出 < 电力公司年度资金分配文件.机井通电专项预算金额
  description: 当机井已被明确认定为符合通电条件、已纳入高标准农田建设规划，但未出现在已通电清单中，且未通电原因并非不可抗力，同时电力公司预算资金有结余或未足额用于机井通电时，判定为违规。重点排除客观不可抗力、资金已用完但按计划推进等情形。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 符合条件的机井未通电
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\",\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\"\
    : \"国务院规范性文件\",\n    \"条款号\": \"第三条第（五）款\",\n    \"内容概述\": \"要求统一规划布局，完善农田电网等基础设施，确保建成的高标准农田配套电力设施满足农业生产需求。\"\n  },\n\
    \  {\n    \"法规名称\": \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十九条\",\n    \"\
    内容概述\": \""
- expression: （记录表.调整后标准 != 是否明确免费办理、补贴项目名称、核定标准、执行期限、补贴对象资格条件.核定标准 && 记录表.审批状态 != '已审批'） || （明细表.发放标准 != 是否明确免费办理、补贴项目名称、核定标准、执行期限、补贴对象资格条件.核定标准
    && 记录表 中无相同补贴项目且审批状态='已审批'的记录）
  description: 判定条件1：调整后标准与政策核定标准不一致，且审批状态非'已审批'，即存在未经审批擅自调整标准的行为。判定条件2：实际发放标准与政策核定标准不一致，且无法提供已审批的调整记录，视为违规调整。两个条件为或关系，满足其一即构成疑点。
  audit_item: 惠农财政补贴发放不到位
  suspicion: 擅自调整惠农补贴标准
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2017〕41号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十条\",\n    \"内容概述\": \"各级财政部门和农业主管部门应当加强对农业生产发展资金的管理和监督，不得擅自扩大或缩小资金使用范围，调整补助标准。\"\n  }\n]"
- expression: 审核台账.审核状态='通过' && 补贴项目明细表.发放状态 IS NULL） || （ABS(审核台账.应发金额 - 补贴项目明细表.发放金额) > 0.01） || （退回登记表.重新发放状态 != '已处理'
    && 退回登记表.退回金额 > 0）
  description: 判定条件1：资格审核通过的记录在发放明细表中不存在或发放状态为空，即为应发未发或漏发。判定条件2：审核台账中的应发金额与发放明细表中的实发金额不等（绝对值大于0.01元，排除角分误差），即为少发或多发。判定条件3：发放失败退回的资金未在合理期限内重新发放处理，形成实际漏发。上述条件任意满足一条即构成违规疑点。
  audit_item: 惠农财政补贴发放不到位
  suspicion: 惠农补贴资金应发未发、漏发或多发、少发
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。……（二）截留、挪用财政资金；（三）滞留应当下拨的财政资金……\"\
    \n  }\n]"
