name: audit/政策文件类/考核文件
type: model
description: 从政策文件类类文档（考核文件）中提取结构化元数据。涵盖字段如：完成情况评价、考核对象责任界定、考核扣分项、考核指标、责任追溯条款。文档范围包括：上级部门关于公路养护的考核文件、上级部门考核文件、耕地质量保护目标责任考核文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 考核文件
  member_count: 1
  member_details:
  - 上级部门关于公路养护的考核文件
  - 上级部门考核文件
  - 耕地质量保护目标责任考核文件
output:
  fields:
  - name: 完成情况评价
    type: string
    description: 提取 完成情况评价 的文本值
  - name: 考核对象责任界定
    type: string
    description: 提取 考核对象责任界定 的文本值
  - name: 考核扣分项
    type: string
    description: 提取 考核扣分项 的文本值
  - name: 考核指标
    type: string
    description: 提取 考核指标 的文本值
  - name: 责任追溯条款
    type: number
    description: 提取 责任追溯条款 的数值（含单位，如万元、吨等）
violations:
- expression: 保护任务完成进度跟踪表.实际完成面积 < 年度黑土地保护任务分解表.计划面积
  description: 将进度跟踪表按区域或年度汇总的实际完成面积与任务分解表中对应分区的计划面积累加值进行比对，当实际完成面积小于计划面积时，触发疑点，完成率低于100%即判定为面积任务未完成，偏差越大问题越严重。
  audit_item: 任务目标未完成
  suspicion: 黑土地保护面积任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当将黑土地保护纳入国民经济和社会发展规划，安排资金，确保黑土地面积不减、质量不降，生态功能不退化。\"\n  }\n]"
- expression: FILE(责任清单.文件存在性) IS NULL || (责任划分条款中无明确交通局、乡镇政府、村委会养护责任边界) || (记录表.涉及部门中同一路段存在多个部门重复列支记录 || 记录表.未解决事项标记中存在长期未解决争议事项且无上级裁定)
  description: 判定权责体系是否健全：1.权责清单缺失直接违规；2.养护办法未明确各级责任主体边界；3.跨部门协调记录显示多头管理或管理空白且未解决。任一条件触发即为疑点。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 农村公路管理养护权责不清缺乏统筹
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于深化农村公路管理养护体制改革的意见\",\n    \"法规文号\": \"国办发〔2019〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条（三）\",\n    \"内容概述\": \"明确地方各级人民政府和有关部门的农村公路管理养护权力和责任清单，实行农村公路管理养护责任制。\"\n  }\n]"
- expression: FILE(责任清单.文件存在性) IS NULL || (FILE(养护办法.清单引述条款)未引用或明确权责清单) || (FILE(责任清单.细化到岗位的职责描述)中未细化到具体岗位职责)
  description: 未出台权责清单文件，或制发文件但职责笼统未细化到养护巡查、资金拨付等具体岗位，均视为未有效制定清单。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 未制定农村公路管理养护权力和责任清单
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于深化农村公路管理养护体制改革的意见\",\n    \"法规文号\": \"国办发〔2019〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条（五）\",\n    \"内容概述\": \"地方各级人民政府要制定相关部门、乡镇人民政府的农村公路管理养护权力和责任清单，细化到具体岗位。\"\n  }\n]"
