name: audit/政策文件类/许可文件
type: model
description: 从政策文件类类文档（许可文件）中提取结构化元数据。涵盖字段如：审批日期、批准文号、批准面积、收费标准、收费项目、有效期止、有效期起、法定审批时限。文档范围包括：危险化学品销售许可文件、地方政府土地规划许可文件、安居工程项目销售许可文件、收费许可文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 审批
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 许可文件
  member_count: 1
  member_details:
  - 危险化学品销售许可文件
  - 地方政府土地规划许可文件
  - 安居工程项目销售许可文件
  - 收费许可文件
output:
  fields:
  - name: 审批日期
    type: date
    description: 提取 审批日期 的日期值，格式 YYYY-MM-DD
  - name: 批准文号
    type: string
    description: 提取 批准文号 的文本值
  - name: 批准面积
    type: string
    description: 提取 批准面积 的文本值
  - name: 收费标准
    type: number
    description: 提取 收费标准 的数值（含单位，如万元、吨等）
  - name: 收费项目
    type: number
    description: 提取 收费项目 的数值（含单位，如万元、吨等）
  - name: 有效期止
    type: string
    description: 提取 有效期止 的文本值
  - name: 有效期起
    type: string
    description: 提取 有效期起 的文本值
  - name: 法定审批时限
    type: string
    description: 提取 法定审批时限 的文本值
  - name: 用途
    type: string
    description: 提取 用途 的文本值
  - name: 许可范围
    type: string
    description: 提取 许可范围 的文本值
  - name: 许可证编号
    type: string
    description: 提取 许可证编号 的文本值
  - name: 销售环节增值税缴纳情况
    type: string
    description: 提取 销售环节增值税缴纳情况 的文本值
violations:
- expression: 培训记录表.收费金额 > 0 && (收费许可文件.批准文号 IS NULL || 培训记录表.收费金额 > 收费许可文件.收费标准 || 培训制度文件.是否规定免费 == true)
  description: 收费需严格符合许可标准和制度要求，无收费许可、超标准收费、或者政策明确免费却收费的，均视为违规。
  audit_item: 乡镇、村公共卫生医生配备、培训、经费保障等不符合相关规定
