name: audit/政策文件类/比价文件
type: model
description: 从政策文件类类文档（比价文件）中提取结构化元数据。涵盖字段如：同期同类物资市场均价、询价来源。文档范围包括：市场调研报告或同类物资比价文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 比价文件
  member_count: 1
  member_details:
  - 市场调研报告或同类物资比价文件
output:
  fields:
  - name: 同期同类物资市场均价
    type: string
    description: 提取 同期同类物资市场均价 的文本值
  - name: 询价来源
    type: string
    description: 提取 询价来源 的文本值
violations:
- expression: ( (ABS(采购台账.单价 - 比价文件.同期同类物资市场均价)/比价文件.同期同类物资市场均价 > 0.10) || (验收单.验收结论 = '合格' && 检测报告.检测指标结果 = '否') || (验收单.实际到货规格
    != 采购合同.规格型号) )
  description: 第一个条件判断采购单价较同期同类市场均价溢价超过10%；第二个条件识别验收环节舞弊，即质量检测不合格但验收单仍签署合格；第三个条件判断实际到货规格与合同约定不符，属于以次充好。任一条件成立即产生疑点。
  audit_item: 违规开展重大物资（服务）采购
  suspicion: 采购物资价格虚高且质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产法\",\n    \"法规文号\": \"主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十九条\"\
    ,\n    \"内容概述\": \"国家出资企业应当建立健全内部监督管理和风险控制制度，防止国有资产损失。\"\n  },\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\"\
    : \"中纪发〔2004〕25号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第六条第（二）款\",\n    \"内容概述\": \"不得利用职权进行关联交易，以明显不合理的价格购买商品或者服务。\"\
    \n  },"
