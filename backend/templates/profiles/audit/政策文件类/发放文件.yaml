name: audit/政策文件类/发放文件
type: model
description: 从政策文件类类文档（发放文件）中提取结构化元数据。涵盖字段如：回收量、补贴名单、补贴对象、补贴数量、补贴金额。文档范围包括：政府回收补贴发放文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 补贴
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 发放文件
  member_count: 1
  member_details:
  - 政府回收补贴发放文件
output:
  fields:
  - name: 回收量
    type: string
    description: 提取 回收量 的文本值
  - name: 补贴名单
    type: string
    description: 提取 补贴名单 的文本值
  - name: 补贴对象
    type: string
    description: 提取 补贴对象 的文本值
  - name: 补贴数量
    type: number
    description: 提取 补贴数量 的数值（含单位，如万元、吨等）
  - name: 补贴金额
    type: number
    description: 提取 补贴金额 的数值（含单位，如万元、吨等）
violations:
- expression: (登记表.回收量 / 使用量 < 0.80) || (记录表.残留量（kg/亩） > 1.5) || (发放文件.回收量（kg） > 登记表.使用量 * 1.2)
  description: 根据管理要求，农膜使用者应在使用期限届满前捡拾废旧农膜。审计设定回收率低于80%或田间残留检测超标（如>1.5 kg/亩）为可疑，补贴发放的回收量若显著超出理论使用量（如超出20%），可能存在虚报。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 农膜使用者未捡拾田间非全生物降解农膜废弃物
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"农用薄膜使用者应当在使用期限届满前捡拾田间的非全生物降解农用薄膜废弃物，交至回收网点或回收工作者，不得随意弃置、掩埋或者焚烧。\"\
    \n  }\n]"
- expression: (销售台账 IS NULL) || (地块编号、种植户、使用量（kg）、回收量（kg）、申报日期、台账存在性、使用量、回收量 IS NULL) || (台账存在性、回收总量 IS NULL) || (台账存在性、联单数量、处置数量、交膜方、收膜方、处理量、最终处置方式（再生/填埋/焚烧）
    IS NULL) || (ABS(销售台账.销售总量 - 发票存根.销售总量) / 发票存根.销售总量 > 0.10) || (地块编号、种植户、使用量（kg）、回收量（kg）、申报日期、台账存在性、使用量、回收量.回收量 > 地块编号、种植户、使用量（kg）、回收量（kg）、申报日期、台账存在性、使用量、回
  description: 任一环节台账缺失即构成违规；台账间逻辑矛盾提示数据不实，如销售台账与发票差异超过10%，回收量大于使用量10%以上，补贴量大于统计回收量10%以上，均视为可疑。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 未建立生产、销售、使用、回收记录或台账
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"农用薄膜生产者、销售者、回收网点、废旧农用薄膜回收再利用企业或其他组织等应当建立农用薄膜回收台账，如实记录废旧农用薄膜的重量、体积、杂质、缴膜人名称及其联系方式、回收时间等内容。台账保存期不少于两年。\"\
    \n  }\n]"
