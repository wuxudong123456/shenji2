name: audit/政策文件类/成果文件
type: model
description: 从政策文件类类文档（成果文件）中提取结构化元数据。涵盖字段如：报告/成果内容、整合章节、服务提供方、服务期间、用地布局、规划类型标识。文档范围包括：多规合一规划整合成果文件、服务成果文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 成果文件
  member_count: 1
  member_details:
  - 多规合一规划整合成果文件
  - 服务成果文件
output:
  fields:
  - name: 报告-成果内容
    type: string
    description: 提取 报告-成果内容 的文本值
  - name: 整合章节
    type: string
    description: 提取 整合章节 的文本值
  - name: 服务提供方
    type: string
    description: 提取 服务提供方 的文本值
  - name: 服务期间
    type: string
    description: 提取 服务期间 的文本值
  - name: 用地布局
    type: string
    description: 提取 用地布局 的文本值
  - name: 规划类型标识
    type: string
    description: 提取 规划类型标识 的文本值
violations:
- expression: (多规合一规划整合成果文件.规划类型标识 != '多规合一') || (村庄规划编制批复文件.批复意见 NOT LIKE '%多规合一%') || (土地利用现状分类统计表.冲突图斑 IS NOT NULL)
  description: 若整合成果文件未体现多规合一属性，或批复文件未要求整合，或现状地类与规划用途存在矛盾记录，均判定为未实现多规合一。冲突记录数>0为直接证据。
  audit_item: 不符合村庄规划编制要求
  suspicion: 村庄规划未实现多规合一
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于建立国土空间规划体系并监督实施的若干意见\",\n    \"法规文号\": \"中发〔2019〕18号\",\n    \"效力级别\": \"\
    规范性文件\",\n    \"条款号\": \"第二条第（六）款\",\n    \"内容概述\": \"在城镇开发边界外的乡村地区，以一个或几个行政村为单元，由乡镇政府组织编制'多规合一'的实用性村庄规划，作为详细规划，报上一级政府审批。\"\
    \n  }\n]"
- expression: (记账日期.发票号 == '假' || 记账日期.供应商名称 IN (明细表.关联方名称) && 记账日期.摘要 == '无') && (流水.收款方名称 != 记账日期.供应商名称 || 流水.收款方名称 IN (明细表.关联方名称)
    && ABS(流水.交易金额) < 记账日期.金额*0.05)
  description: 该表达式用于筛查虚构服务套取资金的行为。核心逻辑：1.发票为假或供应商为关联方，且无法提供服务成果；2.同时满足资金流向异常，如收款方与发票开具方不一致，或资金最终流转回关联方，且回流金额与支付总额高度接近（容差5%以内），触发严重违规疑点。
  audit_item: 违规提取管理费用
  suspicion: 虚列管理费用套取资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十三条、第二十六条\",\n    \"内容概述\": \"会计凭证、会计账簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定。任何单位和个人不得伪造、变造会计凭证、会计账簿及其他会计资料，不得提供虚假的财务会计报告。公司不得有虚列支出、隐瞒收入等行为。\"\
    \n  },\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n "
