name: audit/政策文件类/管理办法文件
type: model
description: 从政策文件类类文档（管理办法文件）中提取结构化元数据。涵盖字段如：使用范围条款、决策程序条款、办法是否存在、账户管理要求。文档范围包括：基金管理办法文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 管理办法文件
  member_count: 1
  member_details:
  - 基金管理办法文件
output:
  fields:
  - name: 使用范围条款
    type: number
    description: 提取 使用范围条款 的数值（含单位，如万元、吨等）
  - name: 决策程序条款
    type: number
    description: 提取 决策程序条款 的数值（含单位，如万元、吨等）
  - name: 办法是否存在
    type: boolean
    description: 提取 办法是否存在 的布尔值（是/否）
  - name: 账户管理要求
    type: string
    description: 提取 账户管理要求 的文本值
violations:
- expression: (基金管理办法文件.办法是否存在 = '否') || (收支明细表.支出用途 NOT IN {规定用途集合}) || (收支明细表.审批人 IS NULL) || (银行流水.账户独立性 = '否')
  description: 基金管理办法缺失直接违规；支出用途超出规定范围、缺少审批流程、账户混用均认定为管理混乱。大额支出标准参照本级财政或内部规定（如单笔50万元以上）。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 合作发展基金运行和管理办法缺失或执行混乱
  regulation: "[\n  {\n    \"法规名称\": \"中华全国供销合作总社章程\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第三十条\"\
    ,\n    \"内容概述\": \"合作发展基金应当制定管理办法，实行专户管理、专款专用，主要用于基层社建设和为农服务项目。\"\n  }\n]"
