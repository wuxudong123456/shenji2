name: audit/政策文件类/方案文件
type: model
description: 从政策文件类类文档（方案文件）中提取结构化元数据。涵盖字段如：分配依据、权重设置。文档范围包括：分配方案文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 方案文件
  member_count: 1
  member_details:
  - 分配方案文件
output:
  fields:
  - name: 分配依据
    type: string
    description: 提取 分配依据 的文本值
  - name: 权重设置
    type: string
    description: 提取 权重设置 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 预算金额
    type: number
    description: 预算总金额（含币种）
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
violations:
- expression: (明细表.各市县实际分配金额 / 明细表.各地实际分配金额 > 1.5) && (数据.各市县棚改户数、公租房缺口等 < 分配依据、权重设置*0.8) && (无专项转移支付倾斜政策依据)
  description: 人均分配金额通过人口和分配金额计算；若某地人均资金远超全省均值且任务量占比明显偏低，又无政策倾斜依据，则存在分配不公；可进一步用基尼系数辅助判断。
  audit_item: 财政部门未按规定分配下达保障性安居工程专项资金
  suspicion: 省级财政部门分配资金显失公平
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程补助资金管理办法\",\n    \"法规文号\": \"财综〔2022〕1号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第八条\",\n    \"内容概述\": \"省级财政应按照公平公正原则，结合本地区实际，合理分配中央下达的补助资金，重点向保障性安居工程任务重、财政困难地区倾斜。\"\n  }\n]"
