name: audit/政策文件类/法律文件
type: model
description: 从政策文件类类文档（法律文件）中提取结构化元数据。涵盖字段如：担保事项、担保合同编号、担保日期、担保金额、被担保人。文档范围包括：担保合同附属法律文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 合同
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 法律文件
  member_count: 1
  member_details:
  - 担保合同附属法律文件
output:
  fields:
  - name: 担保事项
    type: string
    description: 提取 担保事项 的文本值
  - name: 担保合同编号
    type: string
    description: 提取 担保合同编号 的文本值
  - name: 担保日期
    type: date
    description: 提取 担保日期 的日期值，格式 YYYY-MM-DD
  - name: 担保金额
    type: number
    description: 提取 担保金额 的数值（含单位，如万元、吨等）
  - name: 被担保人
    type: string
    description: 提取 被担保人 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 审判机关
    type: string
    description: 审判机关/出具机关
    required: false
  - name: 裁判日期
    type: date
    description: 裁判/出具日期，格式 YYYY-MM-DD
    required: false
  - name: 案由
    type: string
    description: 案件案由/争议类型
    required: false
  - name: 裁判结果
    type: string
    description: 裁判/处理结果摘要
    required: false
