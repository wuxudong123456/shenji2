name: audit/政策文件类/划定文件
type: model
description: 从政策文件类类文档（划定文件）中提取结构化元数据。涵盖字段如：保护期限、保护面积、划定依据、划定边界、地块编号、基本农田保护图斑、基本农田图斑面积及边界、永久基本农田图斑坐标。文档范围包括：保护区划定文件、永久基本农田划定文件、生态保护红线划定文件、生态红线划定文件、禁养区划定文件、粮食生产功能区划定文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 划定文件
  member_count: 1
  member_details:
  - 保护区划定文件
  - 永久基本农田划定文件
  - 生态保护红线划定文件
  - 生态红线划定文件
  - 禁养区划定文件
  - 粮食生产功能区划定文件
output:
  fields:
  - name: 保护期限
    type: string
    description: 提取 保护期限 的文本值
  - name: 保护面积
    type: string
    description: 提取 保护面积 的文本值
  - name: 划定依据
    type: string
    description: 提取 划定依据 的文本值
  - name: 划定边界
    type: string
    description: 提取 划定边界 的文本值
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 基本农田保护图斑
    type: string
    description: 提取 基本农田保护图斑 的文本值
  - name: 基本农田图斑面积及边界
    type: string
    description: 提取 基本农田图斑面积及边界 的文本值
  - name: 永久基本农田图斑坐标
    type: string
    description: 提取 永久基本农田图斑坐标 的文本值
  - name: 生态保护红线边界坐标
    type: string
    description: 提取 生态保护红线边界坐标 的文本值
  - name: 粮食种植比例要求
    type: number
    description: 提取 粮食种植比例要求 的数值（含单位，如万元、吨等）
  - name: 红线边界坐标
    type: string
    description: 提取 红线边界坐标 的文本值
  - name: 重点生态功能区范围及管控要求
    type: string
    description: 提取 重点生态功能区范围及管控要求 的文本值
  - name: 面积
    type: string
    description: 提取 面积 的文本值
  - name: 饮用水源保护区
    type: string
    description: 提取 饮用水源保护区 的文本值
violations:
- expression: ST_Intersects(产业规划文件.规划产业用地范围, 生态红线划定文件.生态保护红线边界坐标) = TRUE
  description: 利用空间分析，若产业发展规划拟占用地块与生态保护红线划定区域存在空间重叠，则判定违规。适用于GIS数据可获取情形。
  audit_item: 上位与下位政策法规检查
  suspicion: 产业规划布局突破生态保护红线
  regulation: "[\n  {\n    \"法规名称\": \"关于在国土空间规划中统筹划定落实三条控制线的指导意见\",\n    \"法规文号\": \"厅字〔2019〕48号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"生态保护红线内，自然保护地核心保护区原则上禁止人为活动，其他区域严格禁止开发性、生产性建设活动。\"\n  },\n  {\n    \"法规名称\"\
    : \"中华人民共和国环境保护法\",\n    \"法规文号\": \"主席令第9号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十九条\",\n    \"内容概述\": \"国家在重点生态功能区、生态环"
- expression: (审批文件.项目规划坐标 ∩ 基本农田保护图斑、地块编号、保护面积、永久基本农田图斑坐标、面积、保护期限、基本农田图斑面积及边界.永久基本农田图斑坐标).面积 > 0 && 审批文件.农用地转用批复文号 = NULL
  description: 项目用地与永久基本农田图斑存在空间重叠且未取得合法农用地转用手续，即构成严重违规；涉及耕地红线，面积即使很小也触发疑点。
  audit_item: 村容村貌整体提升不符合相关规定
  suspicion: 占用耕地及永久基本农田违规绿化造林
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第四十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十七条、第四十四条\",\n    \"内容概述\": \"非农业建设必须节约使用土地，禁止占用耕地建窑、建坟或者擅自在耕地上建房、挖砂、采石、采矿、取土等；建设占用土地，涉及农用地转为建设用地的，应当办理农用地转用审批手续。\"\n\
    \  },\n  {\n    \"法规名称\": \"基本农田保护条例\",\n    \"法规文号\": \"国务院令第257号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十七条\"\
    ,\n   "
- expression: 农田区块面积、林带长度、现状控制率、达标判定.现状控制率 < 0.85
  description: 根据高标准农田建设及农田防护林技术标准，基本农田林网控制率（林带长度/农田周长或面积折算比值）应不低于85%，低于此标准即判定不达标。
  audit_item: 村容村貌整体提升不符合相关规定
  suspicion: 基本农田林网控制率未达到规定标准
  regulation: "[\n  {\n    \"法规名称\": \"国家农业综合开发高标准农田建设规划\",\n    \"法规文号\": \"农发〔2013〕3号\",\n    \"效力级别\": \"行业规范\",\n    \"\
    条款号\": \"建设标准部分\",\n    \"内容概述\": \"农田林网控制率应达到85%以上，生态防护效益显著。\"\n  },\n  {\n    \"法规名称\": \"高标准农田建设 通则\",\n    \"法规文号\"\
    : \"GB/T 30600-2022\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"4.3\",\n    \"内容概述\": \"农田防护与生态环境保持应使林网控制率不低于85%，满足防风固沙、改善农田小"
- expression: (对比表.是否占压基本农田 == '是') && (比对表.实际养殖水面面积 < 项目总面积的30% || 比对表.显示设施完好变化 == '是')
  description: 当项目用地坐标与永久基本农田图斑重叠，且在同一地块上水稻实际种植面积比例低于30%（稻渔综合种养要求水稻为主要种植），或者出现固化养殖池等永久性破坏耕作层的设施，即认定为假借稻渔名义违规占用基本农田。
  audit_item: 水产养殖补助项目建设运营管护不合规
  suspicion: 假借稻渔综合种养名义占用永久基本农田
  regulation: "[\n  {\n    \"法规名称\": \"基本农田保护条例\",\n    \"法规文号\": \"国务院令第257号（2011年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十七条、第三十三条\",\n    \"内容概述\": \"禁止任何单位和个人在基本农田保护区内建窑、建房、建坟、挖砂、采石、采矿、取土、堆放固体废弃物或者进行其他破坏基本农田的活动。违反本条例规定，占用基本农田建窑、建房、建坟、挖砂、采石、采矿、取土、堆放固体废弃物或者从事其他活动破坏基本农田，毁坏种植条件的，由县级以上人民政府土地行政主管部门责令改正或者治理，恢复原种植条件，处占用基本农田的耕地开垦费1倍以上"
- expression: (禁养区内合规养殖场关停数 / 禁养区内养殖场总数 > 0.2) || (实际划定面积 / 技术指南规定面积上限 > 1.3) || (补偿标准 < 地方政府规定标准 && 仍实施搬迁)
  description: 合规养殖场被迫关停比例超过20%可能反映划定不合理；划定面积超出技术指南上限30%以上为显著扩大；补偿低于标准且仍实施属侵害权益。
  audit_item: 项目实施不到位
  suspicion: 禁养区随意扩大致合规养殖场关停
  regulation: "[\n  {\n    \"法规名称\": \"畜禽养殖禁养区划定技术指南\",\n    \"法规文号\": \"环办水体〔2016〕99号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"四、划定范围\",\n    \"内容概述\": \"明确规定禁养区包括饮用水水源保护区、风景名胜区、自然保护区的核心区和缓冲区等，不得随意扩大范围。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国畜牧法\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"禁止在划定的禁养区域内建设畜禽养"
- expression: GIS_Intersect(规划线路坐标, 基本农田范围 || 生态保护红线范围) == True && 项目用地审批文件为空
  description: 利用GIS叠加分析，若规划线路占用永久基本农田或生态保护红线，且未能提供合法的农用地转用审批或用地预审文件，则判定违规。所有冲突点均触发疑点。
  audit_item: 项目规划及资金使用不符合规定
  suspicion: 农村公路建设规划与土地利用总体规划冲突
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"2019年修正版主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十四条\",\n    \"内容概述\": \"建设占用土地，涉及农用地转为建设用地的，应当办理农用地转用审批手续。\"\n  },\n  {\n    \"法规名称\": \"关于划定并严守生态保护红线的若干意见\"\
    ,\n    \"法规文号\": \"厅字〔2017〕2号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"生态保护红线原则上按禁止开发区域的要求进行管理，严禁不符"
- expression: 空间重叠(作物种植结构统计表.地块坐标, 入库数据表.项目坐标) AND (SUM(CASE WHEN 作物类型 NOT IN ('小麦','水稻','玉米','大豆','薯类') THEN 种植面积 ELSE 0
    END) / 总种植面积) > 0.1
  description: 在粮食主产区高标准农田范围内，非粮食作物（如花卉、苗木、经济林果）种植面积占比超过10%（即粮食作物面积<90%），判定为“非粮化”。10%根据粮食生产功能区要求设定。
  audit_item: 高标准农田管护使用不符合相关规定
  suspicion: 粮食主产区高标准农田非粮化
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于防止耕地“非粮化”稳定粮食生产的意见\",\n    \"法规文号\": \"国办发〔2020〕44号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第二条第（四）项\",\n    \"内容概述\": \"粮食生产功能区要严格用于粮食生产，引导每年至少生产一季粮食，防止过度“非粮化”。\"\n  }\n]"
- expression: (划定文件.饮用水源保护区、重点生态功能区范围及管控要求 OR 划定文件.饮用水源保护区、重点生态功能区范围及管控要求) AND (制定文件.有无地方标准、标准限值（COD、氨氮、总磷等） OR (制定文件.标准限值（COD、氨氮、总磷等）
    = 排放文件.国家一级A/B标准限值 AND 未达到功能水质目标))
  description: 根据上位法要求，对于饮用水源地等需要特殊保护的水体，地方应制定严于国家标准的排放标准。若存在敏感区域但未出台地方标准，或标准与国标相同且无法满足水质功能要求，即判定为未有效制定标准。
  audit_item: 污水治理项目建设、运营、管护不到位
  suspicion: 未制定地方污水排放标准导致宽松管控
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"省、自治区、直辖市人民政府对国家排放标准中未作规定的项目，可以制定地方标准；对已作规定的项目，可以制定严于国家标准的地方排放标准。\"\n  }\n]"
