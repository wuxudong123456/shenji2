name: audit/政策文件类/公示文件
type: model
description: 从政策文件类类文档（公示文件）中提取结构化元数据。涵盖字段如：免费服务项目、公示内容完整度、公示受益人名单、公示收费项目、公示渠道、公示的开放时间、公示的收费标准、公示记录。文档范围包括：住房公积金管理中心收费公示文件、受益人公示文件、开放时间公示文件、收益分配管理制度公示文件、收费项目公示文件、文化站收费公示文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 公示文件
  member_count: 1
  member_details:
  - 住房公积金管理中心收费公示文件
  - 受益人公示文件
  - 开放时间公示文件
  - 收益分配管理制度公示文件
  - 收费项目公示文件
  - 文化站收费公示文件
output:
  fields:
  - name: 免费服务项目
    type: number
    description: 提取 免费服务项目 的数值（含单位，如万元、吨等）
  - name: 公示内容完整度
    type: string
    description: 提取 公示内容完整度 的文本值
  - name: 公示受益人名单
    type: string
    description: 提取 公示受益人名单 的文本值
  - name: 公示收费项目
    type: number
    description: 提取 公示收费项目 的数值（含单位，如万元、吨等）
  - name: 公示渠道
    type: string
    description: 提取 公示渠道 的文本值
  - name: 公示的开放时间
    type: date
    description: 提取 公示的开放时间 的日期值，格式 YYYY-MM-DD
  - name: 公示的收费标准
    type: number
    description: 提取 公示的收费标准 的数值（含单位，如万元、吨等）
  - name: 公示记录
    type: string
    description: 提取 公示记录 的文本值
  - name: 收费项目及依据
    type: number
    description: 提取 收费项目及依据 的数值（含单位，如万元、吨等）
  - name: 最终受益人-使用单位
    type: string
    description: 提取 最终受益人-使用单位 的文本值
  - name: 服务项目与免费基本功能的划分
    type: number
    description: 提取 服务项目与免费基本功能的划分 的数值（含单位，如万元、吨等）
violations:
- expression: (收费对象、收费项目名称、收费金额、收费时间、收费项目名称（如数据对接服务费、平台服务费）、收费项目名称（如CA证书费、U盾费）、单价、数量、收费项目（如高级会员费、加急服务费）、金额、收费频次.收费项目名称 CONTAINS
    ('会员','VIP','加急','优先','高级') || 收费条款、技术维护费描述、服务费条款、收费项目描述、合同期限、会员服务条款、付费优先服务条款、捆绑服务项目.付费优先服务条款 包含 ('付费方可使用','不缴费将关闭','必须购买'))
    && (收费对象、收费项目名称、收费金额、收费时间、收费项目名称（如数据对接服务费、平台服务费）、收费项目名称（如CA证书
  description: 当存在会员费、VIP费、加急费等名义的收费，且合同条款或平台权限设置将政府必须提供的基础服务与付费服务捆绑，或企业多次投诉被强制购买会员，即判定为变相违规收费。投诉次数阈值可设定为3次以上以降低误报。
  audit_item: 违规收费-要求企业承担电子政务平台技术维护费、服务费、电子介质成本费等经营服务性费用
  suspicion: 变相收费或捆绑收费
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十条\",\n    \"内容概述\": \"政府及其有关部门应当加强政务服务的规范化、标准化建设，不得设置不合理或者歧视性的准入和退出条件，不得限定购买指定经营者的商品或者服务，不得以任何形式限制或者变相限制市场准入。\"\n \
    \ },\n  {\n    \"法规名称\": \"关于进一步规范行政事业性收费的通知\",\n    \"法规文号\": \"财综〔2010〕12号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二条"
- expression: (审批文件.价格主管部门审批文号 IS NULL AND 公示文件.收费项目 IS NOT NULL) OR ABS(时间转换(公示文件.值班日志记录的实际开放时间 - 公示文件.值班日志记录的实际开放时间) / 3600000
    - 时间转换(公示文件.公示的开放时间) / 3600000) > 1
  description: 条件一（违规收费）：检查公示的收费项目是否具备物价部门合法批文，无批文即违规。条件二（开放时间不达标）：将系统化后的实际日均开放时长与公示的时长进行比较，若差异超过1小时，或随机核查日期的开门/关门时间与公示不符，即判定为开放时间不固定、不明确。
  audit_item: 文化站（中心）等建设运营管护不符合相关规定
  suspicion: 文化站违规收费或开放时间不达标
  regulation: "[\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\",\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第十五条\",\n    \"内容概述\": \"文化站应当免费或者优惠向公众开放，开放时间应当适应公众需求，并提前向社会公布。\"\n  }\n]"
- expression: (个人公积金贷款手续费收取明细表.手续费金额 > 0) && ( (住房公积金管理中心收费公示文件.公示收费项目 NOT EXISTS) || (手续费收取依据文件.文件文号 IS NULL) || (个人公积金贷款手续费收取明细表.收费名目
    NOT IN (住房公积金管理中心内部收费管理制度.允许收费项目清单) ) || (个人公积金贷款手续费收取明细表.手续费金额 != 0 && 公积金业务系统收费模块日志.收费触发方式 == '强制') )
  description: 触发条件：1.实际收取手续费但收费公示文件中未列示该项目；2.无法提供收费依据文件；3.收费名目不在合法收费清单内；4.业务系统日志显示强制跳过或自动扣费，但无借款人确认环节。重点筛查‘加急费’‘代办费’‘材料审核费’等非常规名目。
  audit_item: 住房公积金管理机构违规收取费用
  suspicion: 违规向个人收取贷款或提取手续费
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十条\",\n    \"内容概述\": \"住房公积金管理中心的管理费用由财政拨付，不得向管理对象收取任何费用。\"\n  },\n  {\n    \"法规名称\": \"关于发展住房公积金个人住房贷款业务的通知\",\n  \
    \  \"法规文号\": \"建金[2014]148号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三部分\",\n    \"内容概述\": \"取消住房公积金个人住房贷款保险、公证、新房评估和强制性机构担保"
- expression: (单据.受益人姓名 IN (核查表.受益人姓名)) || (分配方案.分配人 == 分配方案.受益人名单) || (说明表.分配理由 == 无正当理由 && 说明表.物资价值 > 设定阈值)
  description: 该表达式用于识别分配环节的优亲厚友行为。首先，将签收单上的受益人姓名与工作人员亲属名单比对，若存在亲属关系则直接触发疑点。其次，若分配人与审批人，或分配人与受益人为同一人，违反了不相容职务分离原则，高度可疑。最后，针对理由牵强的高价值物资特批分配，需重点审查以判断是否存在利益输送。
  audit_item: 社会捐赠款物使用不合规
  suspicion: 违规优亲厚友分配捐赠物资
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"中华人民共和国主席令第43号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十八条\",\n    \"内容概述\": \"慈善组织确定慈善受益人，应当坚持公开、公平、公正的原则，不得指定慈善组织管理人员的利害关系人作为受益人。\"\n  },\n  {\n    \"法规名称\": \"关于规范基金会行为的若干规定（试行）\"\
    ,\n    \"法规文号\": \"民发〔2012〕124号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二部分第（四）项\",\n    \"内容概述\": \"基金会不得"
- expression: (单据.签收单位 ∉ 捐赠协议.指定用途) || (说明表.接收单位 存在 商业合作关系 && 说明表.分配理由 == 无公益性质说明) || (单据.签收单位对捐赠财产进行了销售或收费)
  description: 该表达式用于识别捐赠财产被挪作私用或商业输送。一是签收单位不在捐赠协议约定的受益范围内，属于改变用途。二是向存在商业合作关系的企业分配高价值物资且无合理公益理由，涉嫌利益输送。三是受益单位将本应免费的捐赠物资进行销售或收费，属于变相侵吞。
  audit_item: 社会捐赠款物使用不合规
  suspicion: 违规向相关利益人分配捐赠财产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公益事业捐赠法\",\n    \"法规文号\": \"中华人民共和国主席令第19号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"受赠人应当依照国家有关规定，建立健全财务会计制度，将受赠财产的使用、管理情况及时向社会公开，并接受监督。不得擅自改变捐赠财产的用途。如果确需改变用途的，应当征得捐赠人的同意。\"\
    \n  },\n  {\n    \"法规名称\": \"慈善组织信息公开办法\",\n    \"法规文号\": \"民政部令第61号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、"
