name: audit/政策文件类/确认文件
type: model
description: 从政策文件类类文档（确认文件）中提取结构化元数据。涵盖字段如：回收责任条款、户主签名、有效期、签字时间、责任书签订主体。文档范围包括：村民同意改厕的签字确认文件、责任主体确认文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 确认文件
  member_count: 1
  member_details:
  - 村民同意改厕的签字确认文件
  - 责任主体确认文件
output:
  fields:
  - name: 回收责任条款
    type: number
    description: 提取 回收责任条款 的数值（含单位，如万元、吨等）
  - name: 户主签名
    type: string
    description: 提取 户主签名 的文本值
  - name: 有效期
    type: string
    description: 提取 有效期 的文本值
  - name: 签字时间
    type: date
    description: 提取 签字时间 的日期值，格式 YYYY-MM-DD
  - name: 责任书签订主体
    type: string
    description: 提取 责任书签订主体 的文本值
violations:
- expression: COUNT(回收数量等.记录行数) = 0 OR (SUM(销售台账.销售数量（包装单位）) - SUM(回收数量等.回收数量)) / SUM(销售台账.销售数量（包装单位）) > 0.7
  description: ①回收台账无任何记录，完全未开展回收工作；②以农药销售包装数量作为理论产生量，若实际回收量与理论量偏差率超过70%，即回收量不足理论量的30%，判定为未有效回收。
  audit_item: 农药化肥减量增效落实方面不符合相关规定
  suspicion: 农药包装废弃物未进行回收处理
  regulation: "[\n  {\n    \"法规名称\": \"农药包装废弃物回收处理管理办法\",\n    \"法规文号\": \"生态环境部 农业农村部令2020年第7号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"农药生产者、经营者、使用者应当积极履行农药包装废弃物回收处理义务，及时回收农药包装废弃物。\"\n  }\n]"
- expression: (拆除时间台账.拆除时间 < 确认文件.签字时间) || (签字确认文件缺失) || (举报记录.反映强制拆除的投诉内容 && 无补偿发放记录)
  description: 拆除日期早于农户签字确认日期、或签字文件缺失、或有强制拆除投诉且补偿资金未发放，均构成强制改厕疑点。
  audit_item: 厕所改造实施不规范、质量不达标
  suspicion: 违规强制拆除厕所实施改厕
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国村民委员会组织法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"涉及村民利益的事项，村民委员会必须提请村民会议讨论决定，方可办理。改厕需经村民同意。\"\n  }\n]"
