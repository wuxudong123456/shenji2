name: audit/政策文件类/审查文件
type: model
description: 从政策文件类类文档（审查文件）中提取结构化元数据。涵盖字段如：代理商名称、各投标人企业性质、投标人组成形式、被拒绝投标人的不合格原因、资质审批状态、资质条件、资质等级。文档范围包括：代理商资质审查文件、投标人资质审查文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 审批
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 审查文件
  member_count: 1
  member_details:
  - 代理商资质审查文件
  - 投标人资质审查文件
output:
  fields:
  - name: 代理商名称
    type: string
    description: 提取 代理商名称 的文本值
  - name: 各投标人企业性质
    type: string
    description: 提取 各投标人企业性质 的文本值
  - name: 投标人组成形式
    type: string
    description: 提取 投标人组成形式 的文本值
  - name: 被拒绝投标人的不合格原因
    type: string
    description: 提取 被拒绝投标人的不合格原因 的文本值
  - name: 资质审批状态
    type: boolean
    description: 提取 资质审批状态 的布尔值（是/否）
  - name: 资质条件
    type: string
    description: 提取 资质条件 的文本值
  - name: 资质等级
    type: string
    description: 提取 资质等级 的文本值
violations:
- expression: (公告.业绩要求 / 限价文件.招标控制价金额 > 2) || (INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本地')>0 || INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本市')>0
    || INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本省')>0) || (INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'特定行业协会')>0)
  description: 判定规则：1. 业绩合同金额门槛超过招标控制价2倍以上，构成明显过高要求；2. 资格条件中包含地域关键词（本地、本市、本省）即构成地域歧视；3. 要求特定行业协会认证等非通用行业认证，指向个别企业。任一条件满足即触发违规疑点。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 以不合理的条件限制或排斥潜在投标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  }\n]"
- expression: INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'必须组成联合体')>0 || INSTR(公告.是否接受独立投标相关条款,'不接受独立投标')>0
  description: 招标文件条款中出现强制联合体措辞，如‘投标人必须组成联合体’、‘不接受独立投标人’等，即构成强制联合体，违反法规。项目不具备必须联合体的法定情形，任何强制要求均属违规。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 强制要求投标人组成联合体共同投标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十七条\",\n    \"内容概述\": \"招标人应当在资格预审公告、招标公告或者投标邀请书中载明是否接受联合体投标。招标人不得强制投标人组成联合体共同投标。\"\n  }\n]"
- expression: (信息.备案状态 != '已备案') || (信息.实际销售区域 != 审查文件.销售范围) || (代销证.代销证编号 == NULL)
  description: 代理商备案信息缺失或未备案，或实际销售区域超出合作协议批准的销售范围，或未取得有效的彩票代销证，均构成违规代理。
  audit_item: 彩票资金筹集审计常见违法违规问题
  suspicion: 违规代理销售彩票
  regulation: "[\n  {\n    \"法规名称\": \"彩票管理条例\",\n    \"法规文号\": \"国务院令第554号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十五条、第十六条\"\
    ,\n    \"内容概述\": \"彩票发行机构、销售机构可以委托其他单位代为销售彩票。委托方应当与受托方签订彩票代销合同，受托方应当取得彩票代销证。代销证应当悬挂于销售场所的显著位置。禁止未经批准擅自销售彩票。\"\n  }\n]"
