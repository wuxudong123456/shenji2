violations:
- expression: 公务接待管理制度文件 IS NULL || (公务接待管理制度文件.主要内容 NOT CONTAIN '接待范围' || 公务接待管理制度文件.主要内容 NOT CONTAIN '接待标准' || 公务接待管理制度文件.主要内容
    NOT CONTAIN '审批程序' || 公务接待管理制度文件.主要内容 NOT CONTAIN '报销要件')
  description: 单位未制定专门的公务接待管理办法，或虽制定但缺少接待范围、标准、审批程序、报销要求等核心要素中的任意两项，即构成制度不健全。
  audit_item: 公务接待管理不符合规定
  suspicion: 未建立或健全公务接待管理制度
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"各级党政机关应当建立健全公务接待管理制度，完善公务接待审批控制、预算管理和财务报销制度，并严格执行。\"\n  }\n]"
- expression: 公务接待管理制度文件 IS NULL OR 公务接待管理制度文件.接待标准条款 IS NULL OR 公务接待管理制度文件.审批权限条款 IS NULL OR 公务接待管理制度文件.禁止事项条款 IS NULL
  description: 制度文件缺失，或制度中未包含接待标准、审批流程、禁止事项等核心条款，即判定为制度不健全。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务接待管理制度不健全
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第四条、第五条\",\n    \"内容概述\": \"各级党政机关应当建立健全公务接待管理制度，明确接待范围、标准、审批程序、经费管理、监督检查等内容。\"\n  }\n]"
- expression: (支出日期、摘要、金额、供应商、会议名称、日期、餐饮支出、实际总支出金额、各项费用明细、餐饮费总额、住宿费总额、场地费总额、参会人数、报销人数、报销金额、住宿天数、餐饮天数、场地租赁天数、各分项实际支出、合计实际支出、餐饮费金额、用餐人数、用餐次数、按人结算的费用项目（住宿间夜数、餐券数）及对应人数、住宿费金额、住宿人数.餐饮费总额
    / 支出日期、摘要、金额、供应商、会议名称、日期、餐饮支出、实际总支出金额、各项费用明细、餐饮费总额、住宿费总额、场地费总额、参会人数、报销人数、报销金额、住宿天数、餐饮天数、场地租赁天数、各分项实际支出、合计实际支出、餐饮费金额、用餐人数、用餐次数、按人结算的费
  description: 计算各项人均费用并与制度标准比较，任意一项超过标准即触发疑点。涉及发票拆分、虚报人数的应结合签到人数校正。
  audit_item: 超标准举办会议
  suspicion: 会议费用超出规定标准
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条、第十一条\",\n    \"内容概述\": \"会议费开支范围包括会议住宿费、伙食费、会议场地租金等，各项费用有综合定额标准，各单位应当在综合定额标准以内结算报销。\"\n  }\n]"
- expression: SUM(明细表.人数) GROUP BY 年度 > 统计表.计划人数上限 || SUM(明细表.天数) GROUP BY 年度 > 统计表.计划天数上限 || SUM(明细表.费用总额) GROUP BY 年度 >
    统计表.计划预算上限
  description: 对团组明细表按年度汇总实际人数、总天数、总费用，分别与量化管理指标执行情况统计表中的对应计划上限比较，任何一项超出上限即构成违规。可设定超出比例预警（如超出10%为一般违规，超出30%为严重违规）。
  audit_item: 违反出国团组管理相关规定
  suspicion: 因公出国超量化管理指标
  regulation: "[\n  {\n    \"法规名称\": \"《关于进一步规范省部级以下国家工作人员因公临时出国的意见》\",\n    \"法规文号\": \"中办发〔2013〕16号\",\n    \"效力级别\": \"\
    规范性文件\",\n    \"条款号\": \"三、实行量化管理\",\n    \"内容概述\": \"各地区各部门要对因公临时出国的批次、人数、天数及经费实行总量控制和量化管理，不得突破上级批准的量化指标。\"\n  }\n]"
- expression: (批准接待人数、人员名单、变卖审批决议、审批人签字、审批日期、合作制条款、民主管理要求、申请时间、审批通过时间为空 || 批准接待人数、人员名单、变卖审批决议、审批人签字、审批日期、合作制条款、民主管理要求、申请时间、审批通过时间.审批日期
    > 合同签订日期) || (合同签订日期 < 招租公告发布日期) || (资产编号 IN (SELECT 资产编号 FROM 登记台账 WHERE 是否可出租标识 = '否')) || (年化租金 < 市场参考价 * 0.8 && 承租方
    IN (关联方清单)) || (实际入账金额 < 合同约定收益金额 * 0.9)
