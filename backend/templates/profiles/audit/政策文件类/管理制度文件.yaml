name: audit/政策文件类/管理制度文件
type: model
description: 从政策文件类类文档（管理制度文件）中提取结构化元数据。涵盖字段如：主要内容、产权归属条款、人员配置、人均住宿标准、人均餐费标准、保管标准、停缴规定、公开招租规定。文档范围包括：上级或本级政府发布的预算绩效管理制度文件、企业住房公积金管理制度文件、企业农药包装废弃物回收管理制度文件、企业农药管理制度文件、企业投资管理制度文件、住房公积金管理制度文件、公务接待管理制度文件、公司会议管理制度文件、农户农药包装废弃物回收管理制度文件、农村饮水工程产权管理制度文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 人员
- 台账
- 培训
- 审批
- 元数据提取
