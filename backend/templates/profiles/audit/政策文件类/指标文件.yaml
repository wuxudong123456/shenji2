name: audit/政策文件类/指标文件
type: model
description: 从政策文件类类文档（指标文件）中提取结构化元数据。涵盖字段如：下达指标数量、拨付总额、指标面积、支出进度、用地类型、用途限定、贴息专项预算额度、适用范围。文档范围包括：上级下达农业用地指标文件、指标文件、财政下达指标文件、财政指标文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 预算
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 指标文件
  member_count: 1
  member_details:
  - 上级下达农业用地指标文件
  - 指标文件
  - 财政下达指标文件
  - 财政指标文件
output:
  fields:
  - name: 下达指标数量
    type: number
    description: 提取 下达指标数量 的数值（含单位，如万元、吨等）
  - name: 拨付总额
    type: number
    description: 提取 拨付总额 的数值（含单位，如万元、吨等）
  - name: 指标面积
    type: string
    description: 提取 指标面积 的文本值
  - name: 支出进度
    type: number
    description: 提取 支出进度 的数值（含单位，如万元、吨等）
  - name: 用地类型
    type: string
    description: 提取 用地类型 的文本值
  - name: 用途限定
    type: string
    description: 提取 用途限定 的文本值
  - name: 贴息专项预算额度
    type: number
    description: 提取 贴息专项预算额度 的数值（含单位，如万元、吨等）
  - name: 适用范围
    type: string
    description: 提取 适用范围 的文本值
  - name: 面积
    type: string
    description: 提取 面积 的文本值
  - name: 预算总额
    type: number
    description: 提取 预算总额 的数值（含单位，如万元、吨等）
violations:
- expression: SUM(统计表.审批用途='农业设施' 的统计表.批复面积) < 指标文件.指标面积 * 0.8  ||  (统计表.审批用途='工业'或'商业' 且 指标文件.适用范围为设施农业指标)
  description: 实际安排的农业设施用地面积不足下达指标的80%，或者存在将农业设施用地指标用于工业、商业等项目，即构成指标挪用。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业设施用地指标被挪用至非农项目
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部 农业农村部关于设施农业用地管理有关问题的通知\",\n    \"法规文号\": \"自然资规〔2019〕4号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条、第二条\",\n    \"内容概述\": \"设施农业用地属于农用地，严禁擅自改变土地用途，严禁以设施农业为名从事非农建设；各地不得擅自缩减设施农业用地供应规模。\"\n  }\n\
    ]"
- expression: (档案.批准用途 IN ('设施农业','养殖','种植') AND 核查报告.实际用途 IN ('工业','仓储','商业','住宅')) OR (指标文件.面积 < 指标文件.下达指标数量 AND 非农项目审批面积
    > 0) OR (图斑.土地利用类型 = '耕地' AND 核查报告.有无非农设施 = '非农设施' AND 整改台账.整改状态 = '未整改')
  description: 核心判定逻辑：审批用途为农业设施但实际建设为工业、商业等非农设施的“大棚房”问题；或农业用地指标总量未足额用于农业，被挪用于非农项目；或占用耕地建设非农设施且未整改。以上条件满足其一即视为违规。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业设施用地指标被挪用或违规使用
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部 农业农村部关于设施农业用地管理有关问题的通知\",\n    \"法规文号\": \"自然资规〔2019〕4号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条、第三条\",\n    \"内容概述\": \"设施农业用地包括农业生产中直接用于作物种植和畜禽水产养殖的设施用地；严禁以设施农业为名占用耕地从事非农建设，不得改变设施农业用地用途。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第"
- expression: (贷款台账.贴息应享主体 = '是' AND NOT EXISTS (拨款凭证 WHERE 拨款凭证.收款单位 = 贷款台账.对方账户名称 AND 拨款凭证.贴息金额 >= 贷款台账.贷款金额*贷款台账.贷款利率*政策文件.贴息比例*贴息期限))
    OR (拨款凭证.到账日期 - 贷款台账.交易日期 > 政策文件.发放时限要求（如季度后15个工作日内）) OR (指标文件.支出进度/贴息专项预算额度 < 0.5 AND 当前日期 > 预算年度中间时点)
  description: 符合条件的贷款应获得贴息但未收到拨款或收到金额不足，或贴息到账时间远超规定时限（如按季支付已超期1个月），或财政已安排预算但实际支出进度严重滞后，均判定为落实不到位。
  audit_item: 相关支持政策落实不到位
  suspicion: nan
  regulation: "[\n  {\n    \"法规名称\": \"关于财政支持建立现代乡村产业体系的通知\",\n    \"法规文号\": \"财办〔2021〕XX号（假设）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各级财政要足额安排涉农贷款贴息资金，按时兑现贴息政策，任何单位不得截留、挪用或无故拖延拨付。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第五十八条\",\n    \"内容概述\": \"各级政府财政部门应当加强"
- expression: (受益人姓名/单位名称.实际发放金额 GROUP BY 对象) < (规定的补助比例、应发标准（元/亩/人）.应发标准（元/亩/人）) || (SUM(受益人姓名/单位名称.实际发放金额) < 预算总额、拨付总额.拨付总额)
  description: 根据签收记录汇总个人实际所得，与政策规定的应发标准比对；或汇总下级单位所有实际发放金额，与上级财政下达的拨付总额比对。任一比对结果出现前者小于后者，且无正当理由（如扣除质保金），即判定为未足额发放。
  audit_item: 资金管理使用不符合相关规定
  suspicion: 未足额发放涉农补助资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价，确保资金及时、足额拨付到位。\"\n  }\n]"
