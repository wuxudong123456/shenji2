name: audit/政策文件类/表决文件
type: model
description: 从政策文件类类文档（表决文件）中提取结构化元数据。涵盖字段如：业主姓名、参与表决户数、同意户数及比例、房号、表决意见。文档范围包括：表决文件原件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 表决文件
  member_count: 1
  member_details:
  - 表决文件原件
output:
  fields:
  - name: 业主姓名
    type: string
    description: 提取 业主姓名 的文本值
  - name: 参与表决户数
    type: string
    description: 提取 参与表决户数 的文本值
  - name: 同意户数及比例
    type: number
    description: 提取 同意户数及比例 的数值（含单位，如万元、吨等）
  - name: 房号
    type: string
    description: 提取 房号 的文本值
  - name: 表决意见
    type: string
    description: 提取 表决意见 的文本值
