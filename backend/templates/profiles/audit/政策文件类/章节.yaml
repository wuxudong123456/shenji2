name: audit/政策文件类/章节
type: model
description: 从政策文件类类文档（章节）中提取结构化元数据。涵盖字段如：缴纳审核要求。文档范围包括：财务管理制度中公积金缴纳相关章节等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 章节
  member_count: 1
  member_details:
  - 财务管理制度中公积金缴纳相关章节
output:
  fields:
  - name: 缴纳审核要求
    type: string
    description: 提取 缴纳审核要求 的文本值
violations:
- expression: (员工编号、缴纳时间、缴纳金额.缴纳时间 > 员工编号、入职日期、退休日期、职务状态.退休日期 AND 员工编号、入职日期、退休日期、职务状态.退休日期 IS NOT NULL) OR (员工编号、缴纳时间、缴纳金额.缴纳时间
    >= 员工编号、养老金发放日期.养老金发放日期)
  description: 当公积金缴纳时间晚于员工退休日期，或养老金已发放后仍有公积金缴纳记录，即判定为违规。退休日期以员工基本信息表记录为准，养老金发放日期作为补充验证。两条子条件为“或”关系，任一成立即触发疑点。
  audit_item: 退休人员未停缴住房公积金
  suspicion: 退休人员未停缴住房公积金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
