name: audit/政策文件类/表彰文件
type: model
description: 从政策文件类类文档（表彰文件）中提取结构化元数据。涵盖字段如：奖励形式、表彰名单、表彰年度。文档范围包括：表彰文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 表彰文件
  member_count: 1
  member_details:
  - 表彰文件
output:
  fields:
  - name: 奖励形式
    type: string
    description: 提取 奖励形式 的文本值
  - name: 表彰名单
    type: string
    description: 提取 表彰名单 的文本值
  - name: 表彰年度
    type: date
    description: 提取 表彰年度 的日期值，格式 YYYY-MM-DD
violations:
- expression: 激励类型.激励标准 != null && (发放凭证.补贴金额 < 激励类型.激励标准 || 发放凭证.发放日期 > 激励类型.兑现时限 + 90天 || 表彰文件.表彰名单 为空集)
  description: 政策文件规定了明确的激励金额、兑现时限或表彰计划，但实际发放金额不足、发放时间超出规定时限3个月以上，或连续两个考核年度内无任何表彰记录，判定为激励措施未落实。
  audit_item: 数字乡村建设人才不足
  suspicion: 数字乡村建设人才激励措施未落实
  regulation: "[\n  {\n    \"法规名称\": \"数字乡村发展战略纲要\",\n    \"法规文号\": \"中办发〔2019〕34号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\"\
    : \"第五部分 保障措施\",\n    \"内容概述\": \"完善人才引进、培养、使用和激励机制，加强对数字乡村建设人才的激励保障，确保各项激励政策落实到位。\"\n  }\n]"
