name: audit/政策文件类/条件文件
type: model
description: 从政策文件类类文档（条件文件）中提取结构化元数据。涵盖字段如：地块编号、宗地编号、是否打包出让说明、现状条件说明、规划用途。文档范围包括：土地出让规划条件文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 条件文件
  member_count: 1
  member_details:
  - 土地出让规划条件文件
output:
  fields:
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 宗地编号
    type: string
    description: 提取 宗地编号 的文本值
  - name: 是否打包出让说明
    type: boolean
    description: 提取 是否打包出让说明 的布尔值（是/否）
  - name: 现状条件说明
    type: string
    description: 提取 现状条件说明 的文本值
  - name: 规划用途
    type: string
    description: 提取 规划用途 的文本值
violations:
- expression: EXISTS(SELECT 1 FROM 关系表 WHERE 关系表.出让公告编号 = 登记表.公告编号) OR (出让合同.合同条款 LIKE '%同时竞得%' OR '%整体开发%' OR '%打包出让%')
  description: 若捆绑地块关联关系表存在对应出让公告记录，则认定为捆绑出让；或在合同条款中检索‘同时竞得’‘整体开发’‘打包出让’等强制关联竞买关键词。满足任一条件即判定为疑点。
  audit_item: 违规捆绑或以“毛地”方式出让土地
  suspicion: 违规将两宗以上地块捆绑出让土地
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步规范土地出让管理工作的通知\",\n    \"法规文号\": \"国土资发〔2003〕400号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"严禁将两宗以上地块捆绑出让，严禁以各种名义规避招标拍卖挂牌出让。\"\n  }\n]"
- expression: (登记表.现状条件字段 IN ('毛地','未完成拆迁','未通平')) OR (跟踪表.拆迁完成时间 > 登记表.出让时间) OR (出让合同.合同条款 LIKE '%竞得人负责拆迁%' OR '%拆迁补偿由受让人承担%')
  description: 出让时登记表中现状条件标注为‘毛地’或‘未完成拆迁’；或拆迁进度表记载的拆迁完成时间晚于实际出让时间；或合同中存在将拆迁责任及费用违规转嫁给受让人的条款。任一条件成立即构成疑点。
  audit_item: 违规捆绑或以“毛地”方式出让土地
  suspicion: 违规以“毛地”方式出让土地
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有土地使用权出让收支管理的通知\",\n    \"法规文号\": \"财综〔2006〕68号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第一条\",\n    \"内容概述\": \"实行‘净地’出让，拟出让的土地应当是完成拆迁补偿安置等前期工作的‘净地’，具备开发建设条件。\"\n  }\n]"
