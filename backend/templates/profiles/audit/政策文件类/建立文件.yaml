name: audit/政策文件类/建立文件
type: model
description: 从政策文件类类文档（建立文件）中提取结构化元数据。涵盖字段如：项目库建立批复日期。文档范围包括：农村公路规划项目库建立文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 建立文件
  member_count: 1
  member_details:
  - 农村公路规划项目库建立文件
output:
  fields:
  - name: 项目库建立批复日期
    type: date
    description: 提取 项目库建立批复日期 的日期值，格式 YYYY-MM-DD
violations:
- expression: FILE(项目库建立批复日期) IS NULL || TABLE(项目库记录条数、最早项目入库时间、库内项目编号).项目库记录条数 == 0 || TABLE(项目库记录条数、最早项目入库时间、库内项目编号).最早项目入库时间
    > FILE(首个年度计划编制年月、计划年份、发文号、审批记录、计划项目编号、项目名称).首个年度计划编制年月
  description: 项目库未建立或为空，或项目库建立时间晚于第一个年度计划编制时间，表明未形成前置规划储备，年度计划缺乏依据。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 未同步建立农村公路建设规划项目库
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"县级以上地方人民政府交通运输主管部门应当根据农村公路建设规划建立项目库，实行项目库管理。\"\n  }\n]"
