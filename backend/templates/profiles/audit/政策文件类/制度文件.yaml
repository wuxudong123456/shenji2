name: audit/政策文件类/制度文件
type: model
description: 从政策文件类类文档（制度文件）中提取结构化元数据。涵盖字段如：一票否决项、一般性转移支付占比目标、上报时限规定、上缴时限、上缴比例规定、下达时限条款、专户管理要求、专户设置要求。文档范围包括：三会制度文件、三重一大决策制度文件、上级部门绩效评价相关制度文件、乡村医生培训制度文件、价格公示制度文件、任务清单编制与管理的相关制度文件、任职回避和公务回避制度文件、企业会计政策书面制度文件、企业会计政策变更书面制度文件、企业去杠杆政策相关制度文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 薪酬
- 元数据提取
