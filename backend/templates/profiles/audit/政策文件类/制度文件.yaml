violations:
- expression: (被审计单位实际公开的“三公”经费文件.公开日期 - 被审计单位“三公”经费预算批复文件.批复日期) > 地方政府或部门关于“三公”经费公开的相关制度文件.规定公开时限
  description: 实际公开日期取公开文件印发日期或网站发布记录的最早日期，预算批复日期为批复文件落款日期；制度规定时限如《预算法》规定的20日内。差值超过规定天数即为违规，超期天数越多风险越高。
  audit_item: “三公”经费预算公开不符合规定
  suspicion: “三公”经费预算未按时公开
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十四条\",\n    \"内容概述\": \"经本级政府财政部门批复的部门预算、决算及报表，应当在批复后二十日内由各部门向社会公开。\"\n  },\n  {\n    \"法规名称\": \"《中华人民共和国政府信息公开条例》\"\
    ,\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"行政机关应当主动公开财政预算、决算信息。\"\
    \n  },\n  "
- expression: 被审计单位实际公开的“三公”经费文件.发布平台名称 NOT IN (地方政府或部门关于“三公”经费公开的相关制度文件.法定公开平台清单（如政府门户网站、财政专栏）) OR (被审计单位实际公开的“三公”经费文件.发布平台名称
    IN ('内部网站','微信公众号','朋友圈') AND 被审计单位实际公开的“三公”经费文件.发布平台名称 NOT IN (地方政府或部门关于“三公”经费公开的相关制度文件.法定公开平台清单（如政府门户网站、财政专栏）))
  description: 法定公开平台一般指地方政府门户网站、财政厅（局）官方网站或预决算公开统一平台等。仅在社交媒体等非法定渠道公开，导致信息获取受限，属于渠道不合规。
  audit_item: “三公”经费预算公开不符合规定
  suspicion: “三公”经费预算公开渠道不合规
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国政府信息公开条例》\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二十四条\",\n    \"内容概述\": \"行政机关应当加强政府信息资源的规范化、标准化、信息化管理，通过统一的政府信息公开平台集中发布信息。\"\n  },\n  {\n    \"法规名称\": \"《地方预决算公开操作规程》\"\
    ,\n    \"法规文号\": \"财预〔2016〕143号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"地方各部门应当在政府门户网站或"
- expression: (会议记录.参会人员 IN (应回避人员)) && (会议记录.议题涉及的企业名称 IN (该人员亲属控制企业)) && (会议记录.主动回避记录 == NULL)
  description: 筛查在涉及特定关系人企业的经营决策会议中，相关领导人员未进行回避，直接参与表决或审批。缺乏主动回避记录即为违规。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 未按规定执行任职回避和公务回避
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第六项\",\n    \"内容概述\": \"按照规定应当实行任职回避和公务回避而没有回避。\"\n  }\n]"
- expression: 对于实际发生的采购品目，设支付凭证.支付金额合计为A，明细表.预算金额合计为B。若(B=0 且 A≥制度文件.限额标准) 或 (B>0 且 ABS(A-B)/B > 0.1)，判定为预算编报不完整。
  description: 以采购品目为分组依据。若预算明细表中完全不存在该品目（B=0）且实际采购金额达到限额标准，构成漏报；若预算金额与实际采购金额偏差超过10%，构成金额低估。限额标准按当年政府采购目录执行。
  audit_item: 政府采购预算编制和实施不规范
  suspicion: 政府采购预算编报不完整
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十三条\",\n    \"内容概述\": \"负有编制部门预算职责的部门在编制下一财政年度部门预算时，应当将该财政年度政府采购的项目及资金预算列出，报本级财政部门汇总。\"\n  }\n]"
- expression: (结余资金确认日期.实际上报日期 > 结余资金确认日期.规定上报截止日期) && (结余资金确认日期.结余金额 > 0)
  description: 将结余资金上缴国库时间节点对照表中的实际上报日期与制度规定的上报截止日期进行比较。当实际上报日期晚于规定截止日期，且对应项目结余金额大于零时，判定为未按规定时限上报。规定时限依据财政部制度，通常为项目终止后或年度终了后30日内。
  audit_item: 结余资金管理不规范
  suspicion: 未按规定时限上报结余资金清理情况
  regulation: "[\n  {\n    \"法规名称\": \"中央部门财政拨款结转和结余资金管理办法\",\n    \"法规文号\": \"财预〔2015〕82号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十四条\",\n    \"内容概述\": \"中央部门应在年度终了后30日内，将本部门财政拨款结转和结余资金清理情况报财政部。项目终止或完成后，应及时清理相应结余资金并按规定上报。\"\n  }\n]"
- expression: (其他.一般性转移支付金额/其他.转移支付总额)<0.6 || (统计表.转移支付总额增长率-其他.财政支出总额)>0.15 && (统计表.一般性转移支付占比<-0.05)
  description: 条件一：一般性转移支付占转移支付总额比重低于60%的硬性要求（依据国发〔2014〕71号），触发表明结构失衡；条件二：任一类专项转移支付增长率超过同期地方财政支出增长率15个百分点以上，且一般性转移支付占比出现负向变动5%以上，反映规模与趋势背离政策导向。两者满足任一即生成疑点。
  audit_item: 财政转移支付体系建设不健全
  suspicion: 转移支付规模结构趋势不合理
