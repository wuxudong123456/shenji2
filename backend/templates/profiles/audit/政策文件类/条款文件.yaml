name: audit/政策文件类/条款文件
type: model
description: 从政策文件类类文档（条款文件）中提取结构化元数据。涵盖字段如：交易价格、交易金额、付款方式与期限、付款条件、付款节点及对应进度比例、优先支持条款、倾斜对象、农用地转用审批主体。文档范围包括：倾斜性条款文件、合同约定的付款条款文件、土地管理法实施条例相关条款文件、土地管理法相关条款文件、资产交易条款文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 付款
- 合同
- 审批
- 补贴
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 条款文件
  member_count: 1
  member_details:
  - 倾斜性条款文件
  - 合同约定的付款条款文件
  - 土地管理法实施条例相关条款文件
  - 土地管理法相关条款文件
  - 资产交易条款文件
output:
  fields:
  - name: 交易价格
    type: number
    description: 提取 交易价格 的数值（含单位，如万元、吨等）
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款方式与期限
    type: number
    description: 提取 付款方式与期限 的数值（含单位，如万元、吨等）
  - name: 付款条件
    type: number
    description: 提取 付款条件 的数值（含单位，如万元、吨等）
  - name: 付款节点及对应进度比例
    type: number
    description: 提取 付款节点及对应进度比例 的数值（含单位，如万元、吨等）
  - name: 优先支持条款
    type: number
    description: 提取 优先支持条款 的数值（含单位，如万元、吨等）
  - name: 倾斜对象
    type: string
    description: 提取 倾斜对象 的文本值
  - name: 农用地转用审批主体
    type: string
    description: 提取 农用地转用审批主体 的文本值
  - name: 受让方全称
    type: string
    description: 提取 受让方全称 的文本值
  - name: 各级审批权限规定
    type: string
    description: 提取 各级审批权限规定 的文本值
  - name: 合同签约日期
    type: date
    description: 提取 合同签约日期 的日期值，格式 YYYY-MM-DD
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 征地审批主体
    type: string
    description: 提取 征地审批主体 的文本值
  - name: 技术转让附加条款
    type: number
    description: 提取 技术转让附加条款 的数值（含单位，如万元、吨等）
  - name: 补贴标准提高幅度
    type: string
    description: 提取 补贴标准提高幅度 的文本值
  - name: 转让标的行业描述
    type: string
    description: 提取 转让标的行业描述 的文本值
  - name: 预付款比例
    type: number
    description: 提取 预付款比例 的数值（含单位，如万元、吨等）
violations:
- expression: (财政授权支付明细表.累计支付金额/合同总金额) > (项目进度报告.实际完工百分比 + 0.1) AND 项目进度报告.实际完工百分比 < 90%
  description: 当累计支付比例超过项目实际完工比例10个百分点以上，且项目尚未竣工（完工<90%）时，判定为超进度付款。偏差10%以内为预警，超过20%为严重违规。须同时排除合同约定有合理预付款条款的情况。
  audit_item: 预算执行率不真实
  suspicion: 未按项目进度提前支付合同款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"各部门、各单位应当加强对预算支出的管理，严格按照预算规定的支出用途使用资金，按照项目进度和合同约定拨付资金。\"\n  },\n  {\n    \"法规名称\": \"基本建设财务规则\"\
    ,\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"项目建设单位应当严格按照合同约定和工程价"
- expression: (审批台账.审批机关 IN ('县级人民政府') && 规划地块文本.地块类型（基本农田/一般耕地/建设用地等） IN ('基本农田', '永久基本农田')) || (审批台账.审批机关 IN ('市级自然资源部门')
    && 审批台账.批准面积 > 35 单位=公顷 && 审批台账.土地类型（农用地/未利用地/建设用地） == '农用地') || (审批台账.审批文号 存在多次拆分记录 && SUM(审批台账.批准面积) > 对应上级机关审批权限面积阈值)
  description: 表达式核心是判断审批主体与法定权限的适配性。分支1：若审批机关为县级，却批准了基本农田类型的用地，直接触犯国务院专属权限，为严重越权。分支2：针对农用地转用，若市级审批机关一次性批准面积超过《土地管理法》规定的35公顷上限，即超权限审批。分支3：识别化整为零策略，通过追踪同一年度同一项目或同一区域立项的多宗地块，若累计审批面积超过本应上报的上级机关审批阈值，则构成实质上的超越权限。
  audit_item: 未办理土地变更手续非法占用土地
  suspicion: 违规超越审批权限审批土地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"征收下列土地的，由国务院批准：（一）永久基本农田；（二）永久基本农田以外的耕地超过三十五公顷的；（三）其他土地超过七十公顷的。征收前款规定以外的土地的，由省、自治区、直辖市人民政府批准。征收农用地的，应当依照本法第四十四条的规定先行办理农用地转用审批。其中，经国务院批准农用地转用的，同时办理征地审批手续，不再另行办理征地审批；经省、自治区、直辖市人民政府在征地批准权限"
