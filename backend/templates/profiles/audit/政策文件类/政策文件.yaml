  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"非税收入项目应当依法设立。已明确取消、停征、减征、免征或者缓征的非税收入项目，执收单位应当严格按照规定执行。\"\n  }\n]"
- expression: (征收台账.实际缴款人名称 NOT IN (明细表.规定征收对象)) || (征收台账.实际征收单价/金额 > 明细表.规定收费标准) || (征收台账.实际征收单价/金额 > 政策文件.法定收费标准上限)
  description: 该表达式用于发现征收环节的两种违规越权行为：一是实际缴款人不属于政策批准的征收对象范围；二是征收标准超过了法定上限或本单位制定的内部标准。只要满足任一条件，即构成违规。其中，收费标准混淆了法定上限与内部标准，但凡超过任一标准即触发告警。
  audit_item: 违反规定设立非税收入
  suspicion: 扩大非税收入征收对象与提高收费标准
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"执收单位应当严格按照规定的非税收入项目、征收对象、征收标准、征收期限以及减免缓政策进行征收，不得擅自扩大征收范围、提高征收标准。\"\n  }\n]"
- expression: (绩效目标申报表.总目标 = '无' OR 绩效目标申报表.总目标 LIKE '%定性描述%') && (预算编制说明及依据材料.设定依据说明 IS NULL OR 项目可行性研究报告或立项论证材料.文件编号 IS
    NULL) && (制度文件.论证审核流程 = '缺失')
  description: 该表达式用于筛查绩效目标设定依据不充分的疑点。当‘绩效目标申报表’中的总目标为空或仅包含无法量化的模糊定性描述（如‘提升’、‘改善’），且‘预算编制说明及依据材料’中未提供任何政策文件、数据等依据，或部门未提供对应的‘项目可行性研究报告’等立项论证材料，同时经核实其内部‘制度文件’缺少对目标设定的论证审核流程要求时，判定为高度可疑，属于目标设定依据不充分违规。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定依据不充分
