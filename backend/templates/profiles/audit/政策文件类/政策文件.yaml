    \n  },\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行"
- expression: (申报评价标准.优 >= 历史实际完成最差值) || (申报评价标准.合格 < 政策文件.最低要求标准)
  description: 此表达式排查评价标准‘低定高评’的问题。第一种情况，评价标准过于宽松：如果申报的优秀线（如完成任务80%即优秀），甚至低于本单位过去三年最差年份的实际完成值，说明该标准形同虚设，起不到任何激励约束作用。第二种情况，评价标准过低：如果部门自行设定的合格线（如满意度60%即合格），显著低于上级政策文件或行业通用的最低服务标准（如80%），属于刻意降低及格门槛，以掩盖实际绩效的低下。两者均构成评价标准不
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效评价标准设定过低或过高不合理
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
