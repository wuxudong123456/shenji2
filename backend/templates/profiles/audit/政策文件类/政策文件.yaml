name: audit/政策文件类/政策文件
type: model
description: 从政策文件类类文档（政策文件）中提取结构化元数据。涵盖字段如：三同步具体条款要求、上级政策要求条款、上级部门要求统计频率、上缴时限要求、上限金额、不动产登记费减免条件、主管部门监管职责条款、主要污染物减排率。文档范围包括：上位法规政策文件、上级主管部门关于预算绩效管理的政策文件、上级单位关于为农服务创新的政策文件、上级政府关于债务管理的政策文件、上级政府关于村庄规划编制的政策文件、上级政策文件、上级部门关于新型职业农民认定的政策文件、上级部门关于资产管理的政策文件、上级部门绩效管理政策文件、下位政策文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 培训
- 登记
- 补贴
- 金额
- 元数据提取
