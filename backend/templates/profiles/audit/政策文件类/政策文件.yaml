    \ {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\"\
    ,\n   "
- expression: 部门/单位发布的预算绩效管理制度文件.文件存在性 = '不存在' || 部门/单位发布的预算绩效管理制度文件.发布日期 IS NULL
  description: 若该部门未以正式发文形式发布任何预算绩效管理制度文件，或声称有制度但无法提供正式发文日期和文号，即判定为未建立制度，违规成立。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 未按规定建立预算绩效管理制度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第二部分（二）\",\n    \"内容概述\": \"各部门各单位要结合本部门本单位职责、行业发展规划，完善预算绩效管理制度，健全绩效指标和标准体系，将绩效管理融入预算编制、执行、监督全过程。\"\n\
    \  }\n]"
- expression: (NOT(绩效管理流程说明.内容 LIKE '%运行监控%' AND 绩效管理流程说明.内容 LIKE '%绩效评价%' AND 绩效管理流程说明.内容 LIKE '%结果应用%')) OR (绩效运行监控分析表.记录数
    = 0 AND 绩效评价报告.评价结论 IS NULL)
  description: 制度文件未完整涵盖目标设定、监控、评价、结果应用全部必要环节，或实际执行中未生成关键节点文档记录（如无任何监控记录、评价报告），视为流程不完善。前者检查制度文本完整性，后者检查实际执行痕迹，满足任一条件即触发违规。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 预算绩效管理流程不完善
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第二部分（三）\",\n    \"内容概述\": \"健全绩效运行监控机制，对绩效目标实现程度和预算执行进度实行双监控；健全绩效评价机制和结果应用机制，将评价结果作为预算安排和政策调整的重要依据。\"\
    \n  }\n]"
- expression: 部门内部绩效评价规章制度.文件存在性 = '否' OR (部门内部绩效评价规章制度.细化程度 = '直接套用通用模板' AND 绩效评价指标体系表.指标来源 = '全部通用') OR 第三方评价管理相关制度.存在性
    = '否'
  description: 部门未制定本部门绩效评价实施细则或操作规范，或者文件虽存在但完全照搬上级通用条款无任何本行业、本单位细化指标，或委托第三方评价但缺失选聘与质量管理制度，均视为规章制度不健全。
  audit_item: 部门、单位预算绩效管理制度不健全
