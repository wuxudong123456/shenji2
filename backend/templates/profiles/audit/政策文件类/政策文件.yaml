  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第二部分（二）\",\n    \"内容概述\": \"各部门各单位要健全绩效指标和标准体系，制定本部门本单位绩效评价规章制度，完善评价操作流程，提高评价的针对性和有效性。\"\n  }\n]"
