name: audit/政策文件类/规范文件
type: model
description: 从政策文件类类文档（规范文件）中提取结构化元数据。涵盖字段如：乡村医生可开具证明类型、允许设立的账户类型、制度文件名称、剂型、剂型规格、印发文号、各类证明开具权限清单、回执审核制度。文档范围包括：农业农村部门相关制度规范文件、农村客运服务规范文件、医学证明开具管理规范文件、原始凭证管理规范文件、国家/地方建设标准规范文件、建设标准规范文件、改厕技术标准与规范文件、用药规范文件、管理规范文件、补贴资金账户管理规范文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 规范文件
  member_count: 1
  member_details:
  - 农业农村部门相关制度规范文件
  - 农村客运服务规范文件
  - 医学证明开具管理规范文件
  - 原始凭证管理规范文件
  - 国家/地方建设标准规范文件
  - 建设标准规范文件
  - 改厕技术标准与规范文件
  - 用药规范文件
  - 管理规范文件
  - 补贴资金账户管理规范文件
  - 部门/单位内部预算绩效目标审核流程规范文件
output:
  fields:
  - name: 乡村医生可开具证明类型
    type: string
    description: 提取 乡村医生可开具证明类型 的文本值
  - name: 允许设立的账户类型
    type: string
    description: 提取 允许设立的账户类型 的文本值
  - name: 制度文件名称
    type: string
    description: 提取 制度文件名称 的文本值
  - name: 剂型
    type: string
    description: 提取 剂型 的文本值
  - name: 剂型规格
    type: string
    description: 提取 剂型规格 的文本值
  - name: 印发文号
    type: string
    description: 提取 印发文号 的文本值
  - name: 各类证明开具权限清单
    type: string
    description: 提取 各类证明开具权限清单 的文本值
  - name: 回执审核制度
    type: string
    description: 提取 回执审核制度 的文本值
  - name: 多站合一要求
    type: string
    description: 提取 多站合一要求 的文本值
  - name: 奖励制度
    type: string
    description: 提取 奖励制度 的文本值
  - name: 审核岗位职责规定
    type: string
    description: 提取 审核岗位职责规定 的文本值
  - name: 审核标准
    type: string
    description: 提取 审核标准 的文本值
  - name: 审核流程设置要求
    type: string
    description: 提取 审核流程设置要求 的文本值
  - name: 强制性技术参数
    type: string
    description: 提取 强制性技术参数 的文本值
  - name: 推荐技术参数
    type: string
    description: 提取 推荐技术参数 的文本值
  - name: 标准名称
    type: string
    description: 提取 标准名称 的文本值
  - name: 标准编号
    type: string
    description: 提取 标准编号 的文本值
  - name: 标准配置项
    type: string
    description: 提取 标准配置项 的文本值
  - name: 禁用技术列表
    type: string
    description: 提取 禁用技术列表 的文本值
  - name: 站点间距标准
    type: string
    description: 提取 站点间距标准 的文本值
  - name: 章程必备条款清单
    type: number
    description: 提取 章程必备条款清单 的数值（含单位，如万元、吨等）
  - name: 签字样本
    type: string
    description: 提取 签字样本 的文本值
  - name: 组织机构规范要求
    type: string
    description: 提取 组织机构规范要求 的文本值
  - name: 药品通用名
    type: string
    description: 提取 药品通用名 的文本值
  - name: 覆盖人口半径要求
    type: string
    description: 提取 覆盖人口半径要求 的文本值
  - name: 规格
    type: string
    description: 提取 规格 的文本值
violations:
- expression: 申报表.审核意见 == '通过' && (申报表.绩效目标内容 不包含量化指标 或 审核记录.审核要素完整性 != '完整' 或 审核记录.审核人员资质 != 符合制度要求)
  description: 若绩效目标申报表审核意见为“通过”，但绩效目标描述未包含可量化指标（如覆盖率、使用率等）或审核过程记录显示审核要素不完整、审核人员未达到制度规定的资质，则判定为审核不规范，可能存在形式化审核。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 未按规定审核预算绩效目标
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"党内法规/行政法规\"\
    ,\n    \"条款号\": \"第三部分\",\n    \"内容概述\": \"明确要求各部门各单位编制预算时要设置全面、可衡量的绩效目标，并严格审核绩效目标。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条、第十四条\",\n    \"内容概述\": \"绩效目标应清晰、量"
- expression: (汇总表.批准标准参数（如设计使用年限、材料规格、排放标准） < 标准编号.强制性技术参数（如抗震设防烈度、环保排放浓度、防火等级）) OR (项目合同.合同技术条款中的实际执行标准参数 < 汇总表.批准标准参数（如设计使用年限、材料规格、排放标准）)
    OR (验收报告.实测质量数据 < 汇总表.批准标准参数（如设计使用年限、材料规格、排放标准）)
  description: 三重判定：1.审批环节即降低强制性标准（批准值低于国家强制值）；2.合同约定进一步低于批准标准（执行值低于批准值）；3.实际建设成果未达到批准标准（验收实测值低于批准值）。任一环节成立即可认定为降低标准违规。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 降低建设标准批准建设项目
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十条\",\n    \"内容概述\": \"建设单位不得明示或者暗示设计单位或者施工单位违反工程建设强制性标准，降低建设工程质量。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国标准化法\",\n\
    \    \"法规文号\": \"中华人民共和国主席令第78号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十五条\",\n    \"内容概述\": \"不符合强制性标准的产品、服务，不得生产、销售、进口或者提供。"
- expression: (验收报告.验收结论 != '合格') OR (验收报告.验收结论及问题记录 IS NOT NULL AND 验收报告.验收结论及问题记录 IS NOT NULL) OR (验收报告.各分项达标情况 < 建设标准规范文件.标准配置项（面积、设备、带宽等）)
    OR (设施设备采购清单.实际采购设备型号数量 < 建设标准规范文件.标准配置项（面积、设备、带宽等）) OR (验收报告.各分项达标情况 < 建设标准规范文件.标准配置项（面积、设备、带宽等）)
  description: 验收不合格直接违规；验收合格但实际建设存在面积不足、设备缺项、带宽不达标等情况，或验收问题未整改，均视为建设不规范。
  audit_item: 信息进村入户、电子商务进农村等村级服务站使用效果不佳
  suspicion: 村级服务站建设未达到规定标准
  regulation: "[\n  {\n    \"法规名称\": \"农业部关于全面推进信息进村入户工程的通知\",\n    \"法规文号\": \"农计发〔2017〕6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"三（一）\",\n    \"内容概述\": \"各地应统一制定并严格执行益农信息社建设标准和规范，确保站点硬件配置、场地面积、网络环境等全面达标。\"\n  }\n]"
- expression: (EXISTS (SELECT * FROM 重复建设站点坐标比对表 A, 重复建设站点坐标比对表 B WHERE 距离(A.站点坐标, B.站点坐标) < 5公里 AND (A.管理归属部门 != B.管理归属部门)
    AND 多站合一整合情况对比表.整合标志 != true))
  description: 地理距离小于5公里且管理分散、功能高度重叠的服务站点未进行整合，违背“多站合一、一点多能”政策要求。
  audit_item: 信息进村入户、电子商务进农村等村级服务站使用效果不佳
  suspicion: 同一区域重复建设服务站未实现资源整合
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进基层综合性文化服务中心建设的指导意见\",\n    \"法规文号\": \"国办发〔2015〕74号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"二（四）\",\n    \"内容概述\": \"统筹整合各级各类面向基层的公共资源，推动不同部门、不同用途的服务设施共建共享，实现‘多站合一、一点多能’。\"\n  }\n]"
- expression: (登记台账.证明类型 NOT IN 规范文件.乡村医生可开具证明类型) || (COUNT(登记台账.证明编号 BY 开具医生, 周) > 10)
  description: 若出现乡村医生无权开具的证明类型（如死亡证明、残疾等级证明等），或同一医生一周内开具同类证明超过10份，均视为违规出具医学证明疑点。需结合签名比对和患者核实确认。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不合规
  suspicion: 乡村医生违规出具医学证明
  regulation: "[\n  {\n    \"法规名称\": \"乡村医生从业管理条例\",\n    \"法规文号\": \"国务院令第386号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十七条\",\n    \"内容概述\": \"乡村医生不得出具与执业范围无关或者与执业范围不相符的医学证明，不得出具虚假医学证明文件。\"\n  }\n]"
- expression: (其他.成员权利条款.缺失 OR 其他.组织机构设置.缺失 OR 其他.盈余分配条款.缺失) OR (会议记录.赞成票比例 < 0.6667) OR (NOT EXISTS 监事会设置)
  description: 章程必须包含成员权利、组织机构、盈余分配等法定必备条款；合作社必须设立成员大会、理事会、监事会（执行监事）；重大事项如合并、分立、解散、修改章程等需经成员大会三分之二以上表决权通过。任意条件不满足即视为违规。
  audit_item: 农民专业合作社认定不合规
  suspicion: 合作社章程缺失法定条款或组织机构违规
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第83号（2017年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第十五条、第二十二条\",\n    \"内容概述\": \"农民专业合作社章程应当载明成员资格、权利和义务、组织机构及其产生办法、职权、任期、议事规则、盈余分配等事项。成员大会关于合并、分立、解散、修改章程等重大事项的决议，应当由本社成员表决权总数的三分之二以上通过。\"\
    \n  }\n]"
- expression: (对照表.选用技术模式 = '水冲式' AND 高寒/冻土区域划分、降水分布、地质类型.高寒/冻土区域划分 = '是') OR (对照表.地质类型字段 NOT IN ('稳定岩层') AND 对照表.选用技术模式 =
    '砖砌化粪池')
  description: 在冻土深度超过管道埋深的地区仍选用水冲式厕所，或者在地质沉降区、膨胀土区域选用刚性化粪池结构，说明技术选择未考虑地理气候因素。
  audit_item: 厕所改造规划设计等不符合规定
  suspicion: 改厕技术模式未因地制宜
  regulation: "[\n  {\n    \"法规名称\": \"农村户厕卫生规范\",\n    \"法规文号\": \"GB 19379-2012\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"第4章\",\n    \"内容概述\": \"农村户厕建设应结合当地自然地理、气候条件、风俗习惯、经济发展水平等因素，选择适宜的技术模式。\"\n  }\n]"
- expression: 拨付路径.接收账户 IN ('主管部门实体账户','乡镇过渡账户') && (审批文件.批准使用范围 != '合规审批' || 拨付路径.拨付时间 > 审批文件.有效期限)
  description: 除经省级以上财政部门批准的特殊情况外，不得通过实体账户或过渡账户转发补贴资金。即使已批准，也必须在有效期内专款专用。若无审批手续或逾期仍在使用，即属违规。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 补贴资金拨付至实体账户或过渡账户发放
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（六）\",\n    \"内容概述\": \"除按规定设立的代发专户外，补贴资金不得通过主管部门、乡镇政府等实体账户或过渡账户层层转拨，严禁以拨代支。\"\n  }\n]"
- expression: (站点最小覆盖半径 > 2000米) || (相邻站点间距 < 300米 AND 前后站平均间距 > 800米) || (投诉站点不合理比例 > 20%)
  description: 依据《农村客运服务规范》等行业标准，单站点覆盖半径大于2千米为覆盖盲区；相邻站点间距过小（<300米）且与全线平均站距偏差过大，表明设置密集不合理；群众投诉比例超过20%反映突出矛盾。
  audit_item: 项目建设养护未实现政策目标
  suspicion: 农村客运班线停靠站点设置不合理
  regulation: "[\n  {\n    \"法规名称\": \"农村道路旅客运输班线通行条件审核规则\",\n    \"法规文号\": \"交运发〔2014〕258号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"农村客运站点设置应科学合理，保障覆盖人口聚集区，通行线路应具备安全通行条件，停靠站点设置要方便群众、兼顾效率。\"\n  }\n]"
