name: audit/政策文件类/指导文件
type: model
description: 从政策文件类类文档（指导文件）中提取结构化元数据。涵盖字段如：允许浮动幅度、对清单制定的具体要求、指定处置点清单、指导基准、运输路线要求。文档范围包括：上级单位关于企业治理的指导文件、省级统一补偿指导文件、粪污资源化利用指导文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 指导文件
  member_count: 1
  member_details:
  - 上级单位关于企业治理的指导文件
  - 省级统一补偿指导文件
  - 粪污资源化利用指导文件
output:
  fields:
  - name: 允许浮动幅度
    type: string
    description: 提取 允许浮动幅度 的文本值
  - name: 对清单制定的具体要求
    type: string
    description: 提取 对清单制定的具体要求 的文本值
  - name: 指定处置点清单
    type: string
    description: 提取 指定处置点清单 的文本值
  - name: 指导基准
    type: string
    description: 提取 指导基准 的文本值
  - name: 运输路线要求
    type: string
    description: 提取 运输路线要求 的文本值
violations:
- expression: （对照表.是否制定清单 == '否'） ||（清单有无制定.清单事项覆盖面（是否包含重大决策、重要人事任免、重大项目安排、大额度资金运作等） == 0） ||（清单有无制定.清单事项覆盖面（是否包含重大决策、重要人事任免、重大项目安排、大额度资金运作等）
    || 未区分集团与子公司差异化事项）
  description: 未提供清单文件、清单事项为空或未结合企业实际明确重大事项量化标准（如无投资金额下限），即视为未真正制定。若集团与重要子公司共用同一清单且未做差异化细化，同样构成违规。
  audit_item: 完善中国特色现代企业制度方面存在的问题
  suspicion: 未结合实际制定党委前置研究事项清单
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党国有企业基层组织工作条例（试行）\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十一条\",\n    \"内容概述\": \"国有企业党委（党组）应当结合实际制定研究讨论的企业重大经营管理事项清单，理清党委（党组）与董事会、监事会、经理层等其他治理主体的权责边界。\"\n  }\n]"
- expression: （登记台账.处置去向 NOT IN （指导文件.指定处置点清单）） || （ABS（登记台账.清运量 - 记录表.接收量） / 登记台账.清运量 > 0.2） || （登记台账.接收单位签章 IS NULL）
  description: 处置去向非文件指定的无害化处理点，或清运量与无害化处理接收量偏差率超过20%，或接收联单无签章，均表明粪污未按规定进入正规处理渠道，存在随意倾倒的高风险。
  audit_item: 农村厕所粪污治理不符合相关规定
  suspicion: 户厕粪污清掏随意倾倒造成环境污染
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土壤污染防治法\",\n    \"法规文号\": \"主席令第八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"禁止向农用地排放重金属或者其他有毒有害物质含量超标的污水、污泥，以及可能造成土壤污染的清淤底泥、尾矿、矿渣等。\"\n  },\n  {\n    \"法规名称\": \"农村厕所粪污无害化处理与资源化利用指南\"\
    ,\n    \"法规文号\": \"农办社〔2020〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条“清掏与转运管理”\",\n    \"内容概述\": \"应建立"
- expression: ((MAX(对比表.补偿标准金额) - MIN(对比表.补偿标准金额)) / AVG(对比表.补偿标准金额) > 0.3 AND (指导文件 IS NULL OR 指导文件.允许浮动幅度 < 实际差异率)) OR (相邻地区.补偿标准差异
    > 0.3 AND 对比表.相邻地区备注 IS NULL)
  description: 省内各县补偿标准变异系数超过0.3且无省级指导文件或实际差异超出允许幅度；相邻地区间标准差异率大于30%且无合理解释文件支撑，则视为未做到省域内基本平衡。
  audit_item: 补偿制度落实不到位（渔业）
  suspicion: 省域内补偿标准差距失衡
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分第（八）条\",\n    \"内容概述\": \"要求合理确定补偿标准，做到省域内基本平衡。\"\n  },\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\"\
    ,\n    \"法规文号\": \"农长渔发〔2019〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容"
