name: audit/政策文件类/电价文件
type: model
description: 从政策文件类类文档（电价文件）中提取结构化元数据。涵盖字段如：农业生产电价标准、适用范围。文档范围包括：优惠电价文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 电价文件
  member_count: 1
  member_details:
  - 优惠电价文件
output:
  fields:
  - name: 农业生产电价标准
    type: string
    description: 提取 农业生产电价标准 的文本值
  - name: 适用范围
    type: string
    description: 提取 适用范围 的文本值
violations:
- expression: (分类清单.用电类别 != '农业生产用电' AND 分类清单.行业分类 IN ('农业','林业','畜牧业','渔业','农产品初加工','灌溉服务')) OR (执行凭证.电价代码 != 农业生产电价标准、适用范围.农业生产电价标准
    && 执行凭证.实际执行单价 IN (统计表.农业用户数))
  description: 依据《销售电价分类适用范围》文件，农业用电含种植、养殖、灌溉等，若用户行业属于农业但用电类别被错划为“一般工商业”或“大工业”等，则未享受政策电价。通过比对用户行业属性与实际执行电价代码即可定位。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业用电户未执行农业生产电价
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条第（二）款\",\n    \"内容概述\": \"农业生产用电是指农村、农场、林场、牧场、渔场等用电，以及农业排灌、农业服务业中的农产品初加工用电，应执行农业生产电价。\"\n \
    \ }\n]"
