name: audit/政策文件类/决算文件
type: model
description: 从政策文件类类文档（决算文件）中提取结构化元数据。涵盖字段如：决算金额、实际支出、批复金额、拨付时限、计划拨付金额、议程、预算资金用途分类、预算金额。文档范围包括：会议预决算文件、培训活动预决算文件、抚恤优待经费决算文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 决算
- 金额
- 预算
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 决算文件
  member_count: 1
  member_details:
  - 会议预决算文件
  - 培训活动预决算文件
  - 抚恤优待经费决算文件
output:
  fields:
  - name: 决算金额
    type: number
    description: 提取 决算金额 的数值（含单位，如万元、吨等）
  - name: 实际支出
    type: number
    description: 提取 实际支出 的数值（含单位，如万元、吨等）
  - name: 批复金额
    type: number
    description: 提取 批复金额 的数值（含单位，如万元、吨等）
  - name: 拨付时限
    type: string
    description: 提取 拨付时限 的文本值
  - name: 计划拨付金额
    type: number
    description: 提取 计划拨付金额 的数值（含单位，如万元、吨等）
  - name: 议程
    type: string
    description: 提取 议程 的文本值
  - name: 预算资金用途分类
    type: number
    description: 提取 预算资金用途分类 的数值（含单位，如万元、吨等）
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
violations:
- expression: ((会议费用明细表.摘要 包含 “餐费” OR 会议费用明细表.摘要 包含 “住宿”) OR (培训费用明细表.摘要 包含 “餐费” OR 培训费用明细表.摘要 包含 “住宿”)) && (会议培训支撑材料.签到表
    IS NULL OR 会议培训支撑材料.签到表 = '' OR 会议培训支撑材料.照片 IS NULL OR 会议培训支撑材料.照片 = '' OR 培训活动预决算文件.议程 IS NULL OR 培训活动预决算文件.议程 = '')
    && ((会议费用明细表.餐饮支出 / 会议费用明细表.实际总支出金额 > 0.5 OR 培训费用明细表.餐饮支出 / 培训费用明细表.金额 > 0
  description: 会议或培训中餐饮住宿支出占比过高且缺乏实质性活动佐证，强烈暗示接待费伪装记入。餐饮占比超过50%或人均支出畸高触发异常。
  audit_item: 公务接待费预算执行不合规
  suspicion: 在其他科目隐匿列支公务接待费
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当加强对预算支出的管理，不得擅自改变预算支出的用途。\"\n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n   \
    \ \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条、第二十条\",\n    \"内容概述\": \"严禁以培训、会议等名义变相公款消费，不得在会议费中列支"
- expression: (会议费用明细表.餐饮支出 > 会议费用明细表.实际总支出金额*0.6 OR 培训费用明细表.餐饮支出 > 培训费用明细表.金额*0.6) AND (会议培训支撑材料.签到表 IS NULL OR 会议培训支撑材料.签到表笔迹雷同
    OR 会议培训支撑材料.签到人员与人员考勤记录矛盾) AND ((会议费用明细表.实际总支出金额/会议费用明细表.参会人数) > 近三年同类活动人均支出*3 OR (培训费用明细表.金额) > 近三年同类活动人均支出*3)
  description: 会议/培训餐饮占比畸高（>60%）、活动佐证材料虚假或缺失、人均支出异常超高，三者叠加表明活动极可能不实，实为接待费转移。
  audit_item: 公务接待费预算执行不合规
  suspicion: 虚构会议培训隐匿接待费开支
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第八条、第二十条\",\n    \"内容概述\": \"严禁以会议、培训等名义进行公款消费，严禁虚列会议费套取资金用于接待。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\"\
    ,\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"各单位应当严格会议费管理，不得虚报、冒领会议费，不"
