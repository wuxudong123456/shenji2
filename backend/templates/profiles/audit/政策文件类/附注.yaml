name: audit/政策文件类/附注
type: model
description: 从政策文件类类文档（附注）中提取结构化元数据。涵盖字段如：会计政策变更披露段-追溯调整数据、会计政策变更段落全文、会计政策变更说明、关联交易往来、关联交易成本、关联交易收入、变更原因、合并范围内子公司名单。文档范围包括：企业所得税申报表附注、合并财务报表附注、最近三年财务报告附注原件、财务报表附注等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 附注
  member_count: 1
  member_details:
  - 企业所得税申报表附注
  - 合并财务报表附注
  - 最近三年财务报告附注原件
  - 财务报表附注
output:
  fields:
  - name: 会计政策变更披露段-追溯调整数据
    type: string
    description: 提取 会计政策变更披露段-追溯调整数据 的文本值
  - name: 会计政策变更段落全文
    type: string
    description: 提取 会计政策变更段落全文 的文本值
  - name: 会计政策变更说明
    type: string
    description: 提取 会计政策变更说明 的文本值
  - name: 关联交易往来
    type: string
    description: 提取 关联交易往来 的文本值
  - name: 关联交易成本
    type: string
    description: 提取 关联交易成本 的文本值
  - name: 关联交易收入
    type: number
    description: 提取 关联交易收入 的数值（含单位，如万元、吨等）
  - name: 变更原因
    type: string
    description: 提取 变更原因 的文本值
  - name: 合并范围内子公司名单
    type: string
    description: 提取 合并范围内子公司名单 的文本值
  - name: 坏账准备政策说明
    type: string
    description: 提取 坏账准备政策说明 的文本值
  - name: 存货计价方法说明
    type: string
    description: 提取 存货计价方法说明 的文本值
  - name: 差错更正披露段-更正性质
    type: string
    description: 提取 差错更正披露段-更正性质 的文本值
  - name: 应纳税所得额
    type: string
    description: 提取 应纳税所得额 的文本值
  - name: 影响金额
    type: number
    description: 提取 影响金额 的数值（含单位，如万元、吨等）
  - name: 收入确认政策说明
    type: number
    description: 提取 收入确认政策说明 的数值（含单位，如万元、吨等）
  - name: 政策变更说明
    type: string
    description: 提取 政策变更说明 的文本值
  - name: 未纳入合并范围的被投资单位清单及原因说明
    type: string
    description: 提取 未纳入合并范围的被投资单位清单及原因说明 的文本值
  - name: 研发支出会计政策说明
    type: number
    description: 提取 研发支出会计政策说明 的数值（含单位，如万元、吨等）
  - name: 追溯金额
    type: number
    description: 提取 追溯金额 的数值（含单位，如万元、吨等）
violations:
- expression: (测算表.累计影响数 <> 0 && (比较报表.期初未分配利润调整额 != 测算表.期初留存收益调减额 || 比较报表.上期损益调整额 == 0)) || (测算表.累计影响数 <> 0 && 附注.追溯调整披露内容
    IS NULL)
  description: 若变更存在影响数但比较报表期初未分配利润或上期损益未同步调整，或附注未披露任何追溯调整信息，则触发疑点。允许小额差异（因计算尾差），但偏差绝对值超过利润总额1%需重点核查。
  audit_item: 随意变更或未按规定变更会计政策、会计处理方法
  suspicion: 会计政策变更未按规定追溯调整前期数据
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第七条、第十四条\",\n    \"内容概述\": \"会计政策变更采用追溯调整法，应当将累积影响数调整列报前期最早期初留存收益，其他相关项目的期初余额和列报前期披露的其他比较数据也应当一并调整；并在附注中披露追溯调整对前期相关损益、权益项目的影响金额。\"\
    \n  }\n]"
- expression: (更正明细表.更正方法 == '直接计入当期损益' && 更正明细表.差错金额 / 近三年平均净利润 > 0.05 && 更正专项说明.差错性质 == '重大前期差错') || (台账.差错归类 == '重大差错'
    && 附注.追溯重述披露 IS NULL && 更正明细表.更正科目 无 '以前年度损益调整')
  description: 两项条件满足其一即触发：1.差错金额超过近三年平均净利润5%的重大前期差错，却未通过以前年度损益调整追溯重述，直接计入当期；2.台账归类为重大差错，但附注无追溯重述说明，且更正分录未涉及‘以前年度损益调整’科目。
  audit_item: 随意变更或未按规定变更会计政策、会计处理方法
  suspicion: 重大会计差错未追溯重述而直接计入当期损益
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十一条、第十二条\",\n    \"内容概述\": \"企业应当区分会计估计变更和会计差错更正；对于前期差错，应当采用追溯重述法进行更正，视同该差错从未发生，调整列报前期最早期初财务报表相关项目及其金额；重要的前期差错应当在其发现当期的财务报表附注中披露其性质和更正金额。\"\
    \n  }\n]"
- expression: 对照表.变更性质 == '否' || 对照表.变更原因 == '否' || 对照表.影响金额 == '否' || (测算表.累计影响数 <> 0 && 附注.影响金额描述 IS NULL) || (附注.披露内容 包含
    '无重大影响' && 测算表.累计影响数 / 总资产 > 0.01)
  description: 对照表中准则要求披露的四大项（性质、原因、影响金额、无法追溯原因）任一项未披露，即触发疑点；或附注声称无重大影响，但测算表显示影响金额超过总资产1%，属于披露不充分。
  audit_item: 随意变更或未按规定变更会计政策、会计处理方法
  suspicion: 会计政策变更未在财务报告附注中充分披露
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第30号——财务报表列报\",\n    \"法规文号\": \"财会〔2014〕7号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第三十九条\",\n    \"内容概述\": \"企业应当在附注中披露会计政策变更的性质、内容和原因，当期和各个列报前期财务报表中受影响的项目名称和调整金额；无法进行追溯调整的，说明该事实和原因以及开始应用变更后的会计政策的时点、具体应用情况。\"\
    \n  },\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\",\n    \"法规文号\": \"财会〔2006〕3号\",\n   "
