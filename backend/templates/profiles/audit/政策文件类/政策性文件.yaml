name: audit/政策文件类/政策性文件
type: model
description: 从政策文件类类文档（政策性文件）中提取结构化元数据。涵盖字段如：是否含有强制统一产业定位、统一建设标准的要求。文档范围包括：上级相关政策性文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 政策性文件
  member_count: 1
  member_details:
  - 上级相关政策性文件
output:
  fields:
  - name: 是否含有强制统一产业定位
    type: boolean
    description: 提取 是否含有强制统一产业定位 的布尔值（是/否）
  - name: 统一建设标准的要求
    type: string
    description: 提取 统一建设标准的要求 的文本值
violations:
- expression: (分析表.公共服务设施配置标准方差 < 0.5 || 分析表.产业定位一致性比例 > 80%) || (政策性文件.是否含有强制统一产业定位、统一建设标准的要求 == "是") || (项目清单.运营情况（如民宿入住率）
    > 50%)
  description: 设施配置标准方差<0.5表示各村公共服务设施规模和类型高度趋同，缺乏差异化；产业定位一致性比例>80%表示多数村庄被赋予相同产业方向；上级文件若明确要求所有村庄按同一模板编制，则直接触发疑点。此外，如果统一规划的同类项目（如民宿）闲置率超过50%，也表明一刀切规划脱离实际需求。
  audit_item: 村庄规划编制质量不高
  suspicion: 村庄规划内容一刀切或齐步走
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于建立国土空间规划体系并监督实施的若干意见\",\n    \"法规文号\": \"中发〔2019〕18号\",\n    \"效力级别\": \"\
    制度文件\",\n    \"条款号\": \"第三部分（九）\",\n    \"内容概述\": \"明确村庄规划编制要求，结合实际，因地制宜，突出特色，防止千村一面，避免照搬照抄城市规划手法。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四条\",\n    \"内容概述\"\
    : \"规"
