name: audit/政策文件类/职责文件
type: model
description: 从政策文件类类文档（职责文件）中提取结构化元数据。涵盖字段如：岗位名称、岗位所需专业技能要求、岗位职责、指定责任人、机构名称、物资管理岗位名称、监管要求、职责分工。文档范围包括：保护管理机构人员职责文件、捐赠管理人员岗位职责文件、文化管理人员岗位职责文件、环保部门监管职责文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 职责文件
  member_count: 1
  member_details:
  - 保护管理机构人员职责文件
  - 捐赠管理人员岗位职责文件
  - 文化管理人员岗位职责文件
  - 环保部门监管职责文件
output:
  fields:
  - name: 岗位名称
    type: string
    description: 提取 岗位名称 的文本值
  - name: 岗位所需专业技能要求
    type: string
    description: 提取 岗位所需专业技能要求 的文本值
  - name: 岗位职责
    type: string
    description: 提取 岗位职责 的文本值
  - name: 指定责任人
    type: string
    description: 提取 指定责任人 的文本值
  - name: 机构名称
    type: string
    description: 提取 机构名称 的文本值
  - name: 物资管理岗位名称
    type: string
    description: 提取 物资管理岗位名称 的文本值
  - name: 监管要求
    type: string
    description: 提取 监管要求 的文本值
  - name: 职责分工
    type: string
    description: 提取 职责分工 的文本值
violations:
- expression: (检查日期.记录总数 = 0) OR (DATEDIFF(MAX(检查日期), MIN(检查日期)) / (COUNT(检查日期) - 1) > 180 AND COUNT(检查日期) < 2) OR (工作计划.考核指标
    NOT CONTAINS "农药包装废弃物回收")
  description: ①检查记录表完全空白，表明年度内未开展任何监督检查；②检查频次低于最低要求（如每半年至少1次），年度检查次数不足2次；③年度工作计划未将回收处理纳入监管。满足任一条件即触发疑点。
  audit_item: 农药化肥减量增效落实方面不符合相关规定
  suspicion: 主管部门未履行农药包装废弃物回收处理监管职责
  regulation: "[\n  {\n    \"法规名称\": \"农药包装废弃物回收处理管理办法\",\n    \"法规文号\": \"生态环境部 农业农村部令2020年第7号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第六条、第十九条\",\n    \"内容概述\": \"县级以上地方人民政府农业农村主管部门负责本行政区域内农药包装废弃物回收处理的监督管理，并应当加强监督检查。\"\n  }\n]"
- expression: (人员配置.专职人员数量 / 人员配置.所辖村落数量 < 0.1) && (问题整改台账.超期天数 > 0.2)
  description: 专职人员人均负责村落数超过10个（比值<0.1）且问题整改超期率超过20%，视为保障不足、履职不力。若专职人员数量为0，直接判为严重违规。
  audit_item: 违反传统村落保护相关政策的行为
  suspicion: 传统村落保护管理机构和人员保障不足、履职不到位
  regulation: "[\n  {\n    \"法规名称\": \"《关于切实加强中国传统村落保护的指导意见》\",\n    \"法规文号\": \"建村〔2014〕61号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"四、保障措施（三）\",\n    \"内容概述\": \"各地要明确传统村落保护管理机构，配备专职人员，保障工作经费。\"\n  }\n]"
- expression: (是否明确专人管理条款.是否明确专人管理条款 = TRUE) || (物资管理岗位名称、指定责任人.指定责任人 IS NULL) || (经手人签名、审核人签名、领用人签名、登记日期、物资名称数量、物资编号、关联台账记录号.经手人签名
    IS NULL || 经手人签名、审核人签名、领用人签名、登记日期、物资名称数量、物资编号、关联台账记录号.审核人签名 IS NULL || 经手人签名、审核人签名、领用人签名、登记日期、物资名称数量、物资编号、关联台账记录号.领用人签名
    IS NULL)
  description: 任一条件触发即视为违规：制度文件未明确专人管理；岗位职责未指定具体责任人；出入库登记表存在签字缺失。该类问题反映管理责任不清、手续不全，可能导致物资失控。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 捐赠物资未落实专人管理且出入库手续不健全
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公益事业捐赠法\",\n    \"法规文号\": \"主席令第19号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"受赠人应当建立健全财务会计制度和受赠财产的使用制度，加强对受赠财产的管理。\"\n  }\n]"
