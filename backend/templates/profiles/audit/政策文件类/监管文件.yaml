name: audit/政策文件类/监管文件
type: model
description: 从政策文件类类文档（监管文件）中提取结构化元数据。涵盖字段如：公积金贷款使用检查记录、整改情况、日常监管发现问题。文档范围包括：住建部门监管文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 整改
- 检查
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 监管文件
  member_count: 1
  member_details:
  - 住建部门监管文件
output:
  fields:
  - name: 公积金贷款使用检查记录
    type: number
    description: 提取 公积金贷款使用检查记录 的数值（含单位，如万元、吨等）
  - name: 整改情况
    type: string
    description: 提取 整改情况 的文本值
  - name: 日常监管发现问题
    type: string
    description: 提取 日常监管发现问题 的文本值
violations:
- expression: (支出明细表.收款单位 NOT IN (项目立项批复文件.建设内容)) && (支出明细表.支出类别 IN ('市政道路','工资发放','偿还旧债') ) || (支出明细表.金额 > 1000000 && 支出明细表.用途说明
    NOT LIKE '%棚改%' && 支出明细表.用途说明 NOT LIKE '%保障房%') && (匹配表.累计支付比例 - 匹配表.实际工程进度 > 0.2)
  description: 判定规则：1)收款方非参建名录且支出类别为市政道路、工资、还债等非工程支出，直接判为挪用；2)单笔大于100万元的支付，用途与棚改或保障房不相关，且资金支付比例高于工程进度20个百分点以上，表明资金已拨付但工程严重滞后，存在截留挪用。满足任一条件触发高风险。
  audit_item: 挪用或违规使用保障性安居工程银行贷款或住房公积金项目贷款
  suspicion: 政策性银行贷款挪用于非保障房项目
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三（六）\",\n    \"内容概述\": \"对保障性安居工程贷款实行封闭管理、专款专用，严禁截留、挤占、挪用。\"\n  },\n  {\n    \"法规名称\": \"国家发展改革委关于印发《中央预算内投资保障性安居工程专项管理暂行办法》的通知\"\
    ,\n    \"法规文号\": \"发改投资规〔2019〕1098号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    "
- expression: (批准贷款项目清单.批准贷款项目清单 NOT CONTAIN 明细表.收款单位) || (明细表.收款单位 NOT LIKE '%保障房建设%' && 明细表.用途 IN ('绿化工程','市政设施','股权投资'))
    || (购房合同.借款人姓名 重复次数 > 3 && 购房合同.备案价格 > 同地段市场均价 * 1.3) || (记录表.还款来源账户 NOT IN (住房公积金专户,项目销售收入账户))
  description: 判定规则：1)资金使用未对应审批清单内的项目，直接违规；2)支出收款方非保障房建设相关单位，且用途为绿化、市政等非住房项目；3)多名借款人笔迹相似、备案价畸高（高出市场价30%以上），疑似虚假购房套取；4)还款来源非项目自身收入或公积金专户，可能挪用贷款偿还其他债务。满足任一条件即触发疑点。
  audit_item: 挪用或违规使用保障性安居工程银行贷款或住房公积金项目贷款
  suspicion: 住房公积金项目贷款挪作他用
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二十四条、第二十六条、第二十九条\",\n    \"内容概述\": \"住房公积金贷款应当用于购买、建造、翻建、大修自住住房，增值收益可用于廉租住房建设补充资金；项目贷款必须专项用于经批准的保障性住房建设项目。\"\
    \n  },\n  {\n    \"法规名称\": \"关于印发《利用住房公积金发放保障性住房建设项目贷款管理办法》的通知\",\n    \"法规文号\": \"建金〔2010〕156号\",\n    \"效力级别\": \""
