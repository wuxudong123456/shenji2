name: audit/政策文件类/排放文件
type: model
description: 从政策文件类类文档（排放文件）中提取结构化元数据。涵盖字段如：国家一级A/B标准限值。文档范围包括：国家标准排放文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 排放文件
  member_count: 1
  member_details:
  - 国家标准排放文件
output:
  fields:
  - name: 国家一级A-B标准限值
    type: string
    description: 提取 国家一级A-B标准限值 的文本值
violations:
- expression: (划定文件.饮用水源保护区、重点生态功能区范围及管控要求 OR 划定文件.饮用水源保护区、重点生态功能区范围及管控要求) AND (制定文件.有无地方标准、标准限值（COD、氨氮、总磷等） OR (制定文件.标准限值（COD、氨氮、总磷等）
    = 排放文件.国家一级A/B标准限值 AND 未达到功能水质目标))
  description: 根据上位法要求，对于饮用水源地等需要特殊保护的水体，地方应制定严于国家标准的排放标准。若存在敏感区域但未出台地方标准，或标准与国标相同且无法满足水质功能要求，即判定为未有效制定标准。
  audit_item: 污水治理项目建设、运营、管护不到位
  suspicion: 未制定地方污水排放标准导致宽松管控
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"省、自治区、直辖市人民政府对国家排放标准中未作规定的项目，可以制定地方标准；对已作规定的项目，可以制定严于国家标准的地方排放标准。\"\n  }\n]"
