name: audit/政策文件类/入伙文件
type: model
description: 从政策文件类类文档（入伙文件）中提取结构化元数据。涵盖字段如：费用承担约定。文档范围包括：销售/入伙文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 入伙文件
  member_count: 1
  member_details:
  - 销售/入伙文件
output:
  fields:
  - name: 费用承担约定
    type: number
    description: 提取 费用承担约定 的数值（含单位，如万元、吨等）
violations:
- expression: 登记类型（首次/转移）='首次登记' AND 不动产用途 IN ('保障性住房') AND 缴费凭证.收费项目名称='不动产登记费' AND 缴费凭证.金额>0
  description: 保障性住房项目办理个人首次登记时按规定免收不动产登记费，若仍收取且金额大于0，无论由开发商还是购房者最终承担，均属违规。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规收取保障性安居工程不动产首次登记费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"免除保障性安居工程登记费等行政事业性收费。\"\n  }\n]"
