name: audit/政策文件类/应用文件
type: model
description: 从政策文件类类文档（应用文件）中提取结构化元数据。涵盖字段如：结果应用措施、结果运用条款。文档范围包括：培育工作绩效考评结果应用文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 应用文件
  member_count: 1
  member_details:
  - 培育工作绩效考评结果应用文件
output:
  fields:
  - name: 结果应用措施
    type: boolean
    description: 提取 结果应用措施 的布尔值（是/否）
  - name: 结果运用条款
    type: number
    description: 提取 结果运用条款 的数值（含单位，如万元、吨等）
