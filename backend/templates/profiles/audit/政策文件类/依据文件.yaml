name: audit/政策文件类/依据文件
type: model
description: 从政策文件类类文档（依据文件）中提取结构化元数据。涵盖字段如：会议纪要、修订触发条件建议、全省统一测算方法、内容要求、分配公式或办法、单位名称、单位性质、单位编码。文档范围包括：信息公开政策依据文件、农业社会化服务补助标准制定依据文件、分配依据文件、应取消未取消项目的政策依据文件、应编入决算的依据文件、手续费收取依据文件、村庄分类认定依据文件、涉农专项资金分配决策依据文件、省级市级补偿标准制定依据文件、省级补偿标准制定依据文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 会议
- 补贴
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 依据文件
  member_count: 1
  member_details:
  - 信息公开政策依据文件
  - 农业社会化服务补助标准制定依据文件
  - 分配依据文件
  - 应取消未取消项目的政策依据文件
  - 应编入决算的依据文件
  - 手续费收取依据文件
  - 村庄分类认定依据文件
  - 涉农专项资金分配决策依据文件
  - 省级市级补偿标准制定依据文件
  - 省级补偿标准制定依据文件
  - 管理费提取依据文件
  - 绩效考核指标设计依据文件
  - 非税收入项目征收依据文件
