violations:
- expression: (项目清单.项目期限 IS NOT NULL && 项目清单.项目期限 < CURDATE() && 项目清单.当前状态='正常执行') || (依据文件.废止文号 IN 项目清单.设立时间 && 项目清单.当前状态!='已取消')
    || (汇总表.终止建议='建议取消' && 汇总表.评价年度>=YEAR(NOW())-2 && 项目清单.当前状态 NOT LIKE '%取消%') || (明细表.结余额>0 && 项目清单.当前状态='正常' && 项目清单.金额=0)
  description: 条件一：项目清单中设定的执行期限已届满但状态仍为正常执行；条件二：上级已明确废止政策涉及的项目，状态未调整为取消；条件三：近两年绩效评价报告明确提出终止建议，但项目仍未取消；条件四：近两年未拨付资金、尚有结余且项目状态为正常的僵尸项目。满足任一条件视为应取消未取消。
  audit_item: 财政转移支付体系建设不健全
  suspicion: 应取消的转移支付项目未及时取消
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十七条\",\n    \"内容概述\": \"建立健全专项转移支付定期评估和退出机制，对绩效评价结果不佳或政策目标已实现的项目，应当及时取消或调整。\"\n  },\n  {\n    \"法规名称\": \"\
    国务院关于深化预算管理制度改革的决定\",\n    \"法规文号\": \"国发〔2014〕45号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三、（一）\",\n    \"内容概述\"\
    : \"建立健全专项"
- expression: (ABS(补助资金发放明细表.补助单价 - 农业社会化服务补助标准制定依据文件.各项服务内容的补助单价（元/亩）) > 农业社会化服务补助标准制定依据文件.各项服务内容的补助单价（元/亩） * 10%) || (ANY(补助资金发放明细表.补助金额)
    > AVG(补助资金发放明细表.补助金额) * 3 && 服务对象清单.经营规模（亩） > 100) || (补助资金发放明细表.补助金额 > 农业社会化服务补助标准制定依据文件.补助资金总额 * 30%)
  description: 该表达式从标准执行偏差和资金分配极端化两个维度筛查。1. 标准执行偏差：检查'补助资金发放明细表'中的'补助单价'与'补助标准制定依据文件'中规定的对应服务内容单价是否存在较大偏离，允许10%以内的因差异化未明确导致的计算误差，超出10%则判定为无依据发放补贴。2.
    资金聚集度：筛查单个补助对象（个人或企业）获得的补助总额。若某个经营规模大于100亩的'大户'获取的补助金额，超过了所有补助对象补助
  audit_item: 农业社会化服务实施不合规
  suspicion: 农业社会化服务补助标准不合理或存在“垒大户”现象
  regulation: "[\n  {\n    \"法规名称\": \"农业部办公厅 财政部办公厅关于支持农业生产社会化服务工作的通知\",\n    \"法规文号\": \"农办财〔2017〕41号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"补助标准要科学合理，防止财政补助成为营利的工具。资金安排不能撒胡椒面，也不能垒大户。\"\n  }\n]"
- expression: (评分表.指标权重实际值 < 0.2) && (评分表.指标权重实际值 > 0.5)
  description: 若绩效评价方案中反映服务质量（如技术指导实效、农户增产率）的指标权重合计低于20%，而仅体现规模扩张的覆盖率指标权重超过50%，则权重设置严重失衡，重数量轻质量。
  audit_item: 农业社会化服务绩效考核不科学
  suspicion: 绩效评价方案指标权重偏向严重失衡
  regulation: "[\n  {\n    \"法规名称\": \"农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"绩效评价指标体系应当科学合理，突出产出和效益，权重设置应当体现各指标的重要程度。\"\n  }\n]"
- expression: (当前年份 - 实施方案.方案印发日期 >= 3) && (依据文件.修订触发条件建议) && (灾害记录.对服务影响)
  description: 若绩效评价方案超过3年未进行任何修订，且期间发生过明显影响农业生产服务的特殊情形（如旱灾导致灌溉需求激增），但原有指标值与实际需求明显背离，则评价方案缺乏动态适应性。
  audit_item: 农业社会化服务绩效考核不科学
  suspicion: 绩效评价方案长期未修订缺乏动态调整
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分第（九）条\",\n    \"内容概述\": \"建立绩效指标和标准体系动态调整机制，根据实际情况适时修订完善，确保绩效评价的科学性和有效性。\"\n  }\n]"
- expression: (统计表.人口流失率 <= 30% && 统计表.划分类型（集聚提升/城郊融合/特色保护/搬迁撤并等） == "搬迁撤并类") || (统计表.常住人口比例 < 30% && 统计表.划分类型（集聚提升/城郊融合/特色保护/搬迁撤并等）
    == "集聚提升类") || (统计表.是否列入保护名录 == "是" && 统计表.划分类型（集聚提升/城郊融合/特色保护/搬迁撤并等） == "搬迁撤并类") || (各类别划分的量化标准（如人口流失率阈值、常住人口比例阈值） !=
    统计表.划分类型（集聚提升/城郊融合/特色保护/搬迁撤并等） && 统计表.无合理说明文件)
  description: 根据《关于统筹推进村庄规划工作的意见》等，人口流失率严重且低于一定水平的村不宜划为搬迁撤并类；常住人口过少且无产业支撑的村不宜划为集聚提升类；传统村落或历史文化名村必须划为特色保护类，不得划为搬迁撤并类。若依据标准重新计算分类与其不一致且无专项合理说明，则构成疑点。
  audit_item: 村庄规划编制质量不高
  suspicion: 村庄类型划分脱离实际
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部办公厅关于加强村庄规划促进乡村振兴的通知\",\n    \"法规文号\": \"自然资办发〔2019〕35号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"二（四）\",\n    \"内容概述\": \"合理确定村庄分类，根据村庄区位条件、资源禀赋等，将村庄分为集聚提升类、城郊融合类、特色保护类、搬迁撤并类，分类施策。\"\n  },\n  {\n \
    \   \"法规名称\": \"关于统筹推进村庄规划工作的意见\",\n    \"法规文号\": \"农规发〔2019〕1号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"三（一）\",\n\
    \    \""
- expression: 关联表.分配决策依据 == '否' OR CORREL(关联表.上年绩效评分, 关联表.本次分配金额) < 0.3
  description: 查核资金分配文件中是否明确说明依据绩效评价结果，或通过计算同一项目连续两年绩效评分与分配金额的相关系数（R²），若R²<0.3说明分配与绩效基本脱钩。同时检查是否存在绩效评级为'差'但仍获同等甚至更多资金的项目。
  audit_item: 绩效管理不到位
  suspicion: 涉农专项资金分配未考虑绩效评价结果
  regulation: "[\n  {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"绩效评价结果应当作为下一年度预算安排的重要依据，绩效好的优先保障，绩效差的应当调减或取消预算。\"\n  }\n]"
- expression: 补偿计算公式、参数设置（材质系数、尺寸系数、年限系数）.参数设置（材质系数、尺寸系数、年限系数） IS NULL OR 补偿计算公式、参数设置（材质系数、尺寸系数、年限系数）.参数设置（材质系数、尺寸系数、年限系数）
    IS NULL OR 补偿计算公式、参数设置（材质系数、尺寸系数、年限系数）.参数设置（材质系数、尺寸系数、年限系数） IS NULL OR (SELECT COUNT(DISTINCT 补偿金额) FROM 身份证号、渔船编号、补偿金额、收款账户、地区、补偿款到账日期、姓名
    WHERE 渔船参数组合相同) <=1
  description: 政策文件中未明确设定材质、大小、使用年限等补偿系数即视为标准缺失；当材质、尺寸、年限均相同的渔船出现补偿金额无差异时，表明未体现差异化补偿，触发疑点。
  audit_item: 补偿制度落实不到位
  suspicion: 补偿标准未考虑渔船材质、大小、使用年限等关键参数
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农办长渔〔2019〕1号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条第（一）款\",\n    \"内容概述\": \"规定补偿标准应综合考虑渔船材质、船长、船龄、作业类型等因素，合理制定差异化补偿方案，确保补偿公平合理。\"\
    \n  }\n]"
- expression: STDEV(对比表.地区) / AVG(对比表.地区) > 0.15
  description: 计算省内各县（区）补偿基准单价的变异系数（CV），当CV>15%时，表明地区间补偿标准差距过大，未做到省域内基本平衡。同时，若经济水平相似的地区补偿标准差距超过20%，单独列为严重不平衡疑点。
  audit_item: 补偿制度落实不到位
  suspicion: 补偿标准制定不合理，省域内地区间差异过大
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"明确要求统筹协调禁捕补偿标准，确保省域内补偿标准基本平衡，避免因地区差异过大引发社会矛盾。\"\n  },\n  {\n    \"法规名称\"\
    : \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农办长渔〔2019〕1号\",\n    \"效力级别\": \"部门规章\",\n  "
- expression: 上年度绩效评级 IN ('不合格','差') && (本年度分配金额 >= 上年度分配金额 * 0.9)
  description: 对于上年度绩效评价结果为“不合格”或“差”的项目实施单位，当年继续安排涉农专项资金且金额未作实质性削减（削减幅度小于10%视为未应用绩效结果），判定资金分配未考虑绩效评价结果。
  audit_item: 资金绩效管理不到位
  suspicion: 涉农专项资金分配未挂钩绩效评价结果
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分“强化绩效评价结果应用”\",\n    \"内容概述\": \"将绩效评价结果与预算安排和政策调整挂钩，对绩效好的优先保障，对绩效差的削减预算或取消项目，形成奖优罚劣的机制。\"\n  }\n\
    ]"
