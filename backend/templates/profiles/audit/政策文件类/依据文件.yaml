    description: 提取 会议纪要 的文本值
  - name: 修订触发条件建议
    type: string
    description: 提取 修订触发条件建议 的文本值
  - name: 全省统一测算方法
    type: string
    description: 提取 全省统一测算方法 的文本值
  - name: 内容要求
    type: string
    description: 提取 内容要求 的文本值
  - name: 分配公式或办法
    type: string
    description: 提取 分配公式或办法 的文本值
  - name: 单位名称
    type: string
    description: 提取 单位名称 的文本值
  - name: 单位性质
