name: audit/政策文件类/任命文件
type: model
description: 从政策文件类类文档（任命文件）中提取结构化元数据。涵盖字段如：产生方式、代表类型、任职期起止时间、单位、成员姓名、职务、职工代表姓名。文档范围包括：任命文件、成员任命文件、董监事任命文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 任命文件
  member_count: 1
  member_details:
  - 任命文件
  - 成员任命文件
  - 董监事任命文件
output:
  fields:
  - name: 产生方式
    type: string
    description: 提取 产生方式 的文本值
  - name: 代表类型
    type: string
    description: 提取 代表类型 的文本值
  - name: 任职期起止时间
    type: date
    description: 提取 任职期起止时间 的日期值，格式 YYYY-MM-DD
  - name: 单位
    type: string
    description: 提取 单位 的文本值
  - name: 成员姓名
    type: string
    description: 提取 成员姓名 的文本值
  - name: 职务
    type: string
    description: 提取 职务 的文本值
  - name: 职工代表姓名
    type: string
    description: 提取 职工代表姓名 的文本值
violations:
- expression: （实际在任董事人数、实际在任监事人数、空缺人数.实际在任董事人数 < 公司组织形态、董事会职权范围、是否设立常务委员会及其授权限制、规定的董事会人数、监事会人数、对外捐赠的决策权限、决策权限条款、重大对外投资审批权限归属（董事会/股东会）、金额标准、衍生品交易审批权限规定、金额阈值、需经董事会或风控委员会审批的条件.规定的董事会人数）
    || （实际在任董事人数、实际在任监事人数、空缺人数.实际在任监事人数 < 公司组织形态、董事会职权范围、是否设立常务委员会及其授权限制、规定的董事会人数、监事会人数、对外捐赠的决策权限、决策权限条款、重大对外投资审批权限归属（董事会/股东会）、金额标准、衍生品
  description: 实际在任人数低于章程规定的最低人数，即构成违规。长期缺席或任期期满未及时补选的，一并计入空缺。
  audit_item: 完善中国特色现代企业制度方面存在的问题
  suspicion: 董事会或监事会人数未达到公司章程规定数量
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"中华人民共和国主席令第十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十四条、第五十一条\",\n    \"内容概述\": \"有限责任公司设董事会，其成员为三人至十三人；监事会的成员不得少于三人。公司章程可规定具体人数，不得低于法定下限。\"\n  }\n]"
- expression: 成员任命文件.SUM(代表类型='政府负责人' OR 职务包含('建设','财政','人民银行','审计')) / 成员任命文件.COUNT(*) > 0.333
  description: 根据《住房公积金管理条例》第八条，人民政府负责人和建设、财政、人民银行等有关部门负责人及专家合计不得超过三分之一。此处计算政府负责人及有关部门负责人占比，超过33.3%即构成人员组成不合规。
  audit_item: 住房公积金决策机构未按规定履职
  suspicion: 住房公积金管委会政府官员占比超标
  regulation: "[\n  {\n    \"法规名称\": \"《住房公积金管理条例》\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第八条\",\n    \"内容概述\": \"住房公积金管理委员会的成员中，人民政府负责人和建设、财政、人民银行等有关部门负责人以及有关专家占三分之一，工会代表和职工代表占三分之一，单位代表占三分之一。\"\
    \n  }\n]"
- expression: 任命文件.产生方式 != '民主选举' OR 选举记录.有效票数 / 选举记录.选举结果 < 2/3
  description: 职工代表应当通过职工代表大会民主选举产生，若任命文件中产生方式为直接指定、无选举记录或选举投票比例低于三分之二，则视为违规。
  audit_item: 住房公积金决策机构未按规定履职
  suspicion: 职工代表未经民主选举产生
  regulation: "[\n  {\n    \"法规名称\": \"《住房公积金管理条例》\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第八条\",\n    \"内容概述\": \"工会代表和职工代表占三分之一。职工代表应由职工推举产生，确保其能代表职工利益。\"\n  }\n]"
