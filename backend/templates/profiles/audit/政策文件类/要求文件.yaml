name: audit/政策文件类/要求文件
type: model
description: 从政策文件类类文档（要求文件）中提取结构化元数据。涵盖字段如：捐赠物资明细、特殊要求、要求外地企业设立分支机构的文件规定。文档范围包括：外地企业设立分支机构强制要求文件、捐赠协议或捐赠方书面要求文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 明细
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 要求文件
  member_count: 1
  member_details:
  - 外地企业设立分支机构强制要求文件
  - 捐赠协议或捐赠方书面要求文件
output:
  fields:
  - name: 捐赠物资明细
    type: string
    description: 提取 捐赠物资明细 的文本值
  - name: 特殊要求
    type: string
    description: 提取 特殊要求 的文本值
  - name: 要求外地企业设立分支机构的文件规定
    type: string
    description: 提取 要求外地企业设立分支机构的文件规定 的文本值
violations:
- expression: CONTAINS(招标文件.资格条件条款, '设立分公司') || CONTAINS(招标文件.资格条件条款, '设立子公司') || CONTAINS(招标文件.资格条件条款, '本地注册') || CONTAINS(招标文件.资格条件条款,
    '固定办公场所') || CONTAINS(招标文件.资格条件条款, '本地服务机构')
  description: 招标文件资格条件或服务要求中出现任何强制外地企业在本地设立法人机构、分支机构或常驻办公场所的表述，即直接判定为违规疑点。该条件与项目本身技术经济需求无必然联系，构成不合理限制。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 强制要求外地企业设立本地分支机构增加投标成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"招标人有下列行为之一的，属于以不合理条件限制、排斥潜在投标人或者投标人：……（四）以特定行政区域或者特定行业的业绩、奖项作为加分条件或者中标条件；（七）以其他不合理条件限制、排斥潜在投标人或者投标人。\"\
    \n  },\n  {\n    \"法规名称\": \"公平竞争审查制度实施细则\",\n    \"法规文号\": \"国市监反垄规〔2021〕2号\",\n    \"效力级别\": \"部门"
- expression: (分配台账.台账是否存在 = 0) || (分配台账.捐赠方名称 IS NULL || 分配台账.物资名称 IS NULL || 分配台账.分配去向 IS NULL)
  description: 未建立台账（记录数为0）或台账关键字段缺失，即无法实现捐赠物资的全流程追溯，属于严重不合规。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 捐赠物资未登记造册及未建立台账
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十八条\"\
    ,\n    \"内容概述\": \"慈善组织应当对募集的财产登记造册，严格管理，专款专用。\"\n  }\n]"
