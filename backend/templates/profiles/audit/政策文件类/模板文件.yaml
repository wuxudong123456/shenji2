name: audit/政策文件类/模板文件
type: model
description: 从政策文件类类文档（模板文件）中提取结构化元数据。涵盖字段如：上年对比数据要求、必填明细项。文档范围包括：“三公”经费预算公开的上级部门或财政部规定的模板文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 明细
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 模板文件
  member_count: 1
  member_details:
  - “三公”经费预算公开的上级部门或财政部规定的模板文件
output:
  fields:
  - name: 上年对比数据要求
    type: string
    description: 提取 上年对比数据要求 的文本值
  - name: 必填明细项
    type: string
    description: 提取 必填明细项 的文本值
violations:
- expression: “三公”经费公开内容与规定模板对比表.缺失项目 LIKE '%因公出国（境）费%' || “三公”经费公开内容与规定模板对比表.缺失项目 LIKE '%公务用车购置及运行费%' || “三公”经费公开内容与规定模板对比表.缺失项目
    LIKE '%公务接待费%' || “三公”经费公开内容与规定模板对比表.不规范项目 LIKE '%未列示上年对比数据%' || “三公”经费公开内容与规定模板对比表.不规范项目 LIKE '%未说明增减变化原因%'
  description: 财政部模板要求必须按三项明细分别列示金额，且应提供与上年预算的对比说明。缺少任一项必填内容或对比数据即为体例违规，影响信息完整性。
  audit_item: “三公”经费预算公开不符合规定
  suspicion: “三公”经费预算公开体例不符合规定
  regulation: "[\n  {\n    \"法规名称\": \"《地方预决算公开操作规程》\",\n    \"法规文号\": \"财预〔2016〕143号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"公开内容应当包括因公出国（境）费、公务用车购置及运行费、公务接待费三项，并说明增减变化原因。\"\n  },\n  {\n    \"法规名称\": \"《关于推进部门所属单位预算公开工作的指导意见》\"\
    ,\n    \"法规文号\": \"财预〔2021〕27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"单位预算公开应当遵循统一"
