name: audit/政策文件类/分工文件
type: model
description: 从政策文件类类文档（分工文件）中提取结构化元数据。涵盖字段如：任务清单与实施方案的对应关系、各任务主责部门、文件印发日期、模糊表述占比、职责描述、责任主体名单、责任人、责任划分条款。文档范围包括：厕所运维管理责任单位分工文件、灌区管理机构职责分工文件、部门职责分工文件、项目任务分解与责任分工文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 分工文件
  member_count: 1
  member_details:
  - 厕所运维管理责任单位分工文件
  - 灌区管理机构职责分工文件
  - 部门职责分工文件
  - 项目任务分解与责任分工文件
output:
  fields:
  - name: 任务清单与实施方案的对应关系
    type: string
    description: 提取 任务清单与实施方案的对应关系 的文本值
  - name: 各任务主责部门
    type: string
    description: 提取 各任务主责部门 的文本值
  - name: 文件印发日期
    type: date
    description: 提取 文件印发日期 的日期值，格式 YYYY-MM-DD
  - name: 模糊表述占比
    type: string
    description: 提取 模糊表述占比 的文本值
  - name: 职责描述
    type: string
    description: 提取 职责描述 的文本值
  - name: 责任主体名单
    type: string
    description: 提取 责任主体名单 的文本值
  - name: 责任人
    type: string
    description: 提取 责任人 的文本值
  - name: 责任划分条款
    type: number
    description: 提取 责任划分条款 的数值（含单位，如万元、吨等）
  - name: 责任单位名称
    type: string
    description: 提取 责任单位名称 的文本值
  - name: 部门职责划分
    type: string
    description: 提取 部门职责划分 的文本值
  - name: 配合部门
    type: string
    description: 提取 配合部门 的文本值
violations:
- expression: （实施方案.方案中是否包含运维保障章节 == true） || （分工文件.文件印发日期 IS NULL） || （COUNT(记录表) = 0） || （SUM(使用台账.金额 FILTER 支出项目='运维')
    = 0 && 明细表.资金用途分类 != '含运维'）
  description: 判定逻辑：1.改造方案中缺失运维机制设计；2.未明确运维责任单位；3.从未开展设施巡检；4.运维资金预算或支出为零。任一条件成立即视为未建立有效运行维护机制。
  audit_item: 农村厕所粪污治理不符合相关规定
  suspicion: 未建立农村厕所运行维护机制
  regulation: "[\n  {\n    \"法规名称\": \"农村人居环境整治提升五年行动方案（2021—2025年）\",\n    \"法规文号\": \"厅字〔2021〕44号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第四部分“建立健全长效管护机制”\",\n    \"内容概述\": \"明确要求明确责任主体、建立管护队伍、保障管护经费，逐步建立有制度、有标准、有队伍、有经费、有监督的农村厕所长效管护机制。\"\n\
    \  }\n]"
- expression: 职责分工文件缺失 || (职责划分明确度 == "否") || (维护记录.维护单位/责任人签字 与 规定责任人不一致占比 > 20%)
  description: 若无法提供正式职责分工文件，或文件中未清晰界定政府、市场、用水协会各方管护责任边界，或实际维护记录签字人与文件规定责任人比对不一致比例超过20%，则判定为违规。
  audit_item: 大中型灌区运行管护和取水用水不符合相关规定
  suspicion: 灌区管护责任主体未明确划分
  regulation: "[\n  {\n    \"法规名称\": \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条\"\
    ,\n    \"内容概述\": \"政府应当明确农田水利工程运行维护主体，落实管护责任。\"\n  }\n]"
- expression: (同一任务主责部门数量 > 1 && 牵头协调机制 == '无') || (关键环节责任部门 == '未明确') || (争议事项数量 >= 3 && 未闭环率 > 0.5)
  description: 同一任务存在多个主责部门且未指定牵头协调机制的，或关键环节（如资金拨付、竣工验收）无明确责任部门，或跨部门争议事项多且过半未解决，均判定为责任分工不明。
  audit_item: 项目规划统筹衔接不到位
  suspicion: 项目职责分工存在多头管理或空白
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\"\
    ,\n    \"内容概述\": \"政府投资项目实行项目法人责任制，项目法人对项目全过程负责。各相关部门应当依法在各自职责范围内对项目进行监督管理，防止多头管理和责任缺位。\"\n  }\n]"
- expression: (项目实施方案及审批文件.存在标识 == 0) || ((项目实施方案及审批文件.建设目标缺失?1:0) + (项目实施方案及审批文件.进度计划缺失?1:0) + (项目实施方案及审批文件.预算缺失?1:0) + (项目实施方案及审批文件.责任分工缺失?1:0)
    >= 3) || (项目实施方案及审批文件.模糊表述占比 > 0.3)
  description: 方案文件缺失即违规；文件存在但核心要素（建设目标、进度计划、预算、责任分工）缺失数量达到3个及以上；或方案中模糊描述（如“其他事项”等）占比超过30%，均视为方案严重不细化。
  audit_item: 项目建设组织实施不到位
  suspicion: 未编制实施方案或内容严重不细化
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资项目开工建设应当符合规定建设条件，项目单位应当加强项目实施管理，严格按照批准的建设地点、建设规模和建设内容实施，未编制细化实施方案影响项目规范执行。\"\n  }\n]"
- expression: (各任务主责部门、配合部门、责任人、部门职责划分.部门职责划分 == true) || (会议时间、议题、决定事项、责任方.议题 CONTAINS '推诿' OR '扯皮' AND 未解决标志 == true) ||
    (合同主体、责任条款、违约条款、合同期限、退出约定条款.责任条款存在模糊或缺失) || (反馈问题描述、责任部门、完成时限、问题数、已整改数、整改完成率.超期未整改率 > 30%)
  description: 职责划分不明导致无人负责；会议记录显示推诿且无后续解决措施；供餐合同未明确食品质量、安全责任；问题长期未整改，均视为管理不到位。
  audit_item: 营养餐制度执行不到位
  suspicion: 营养餐管理职责推诿扯皮
  regulation: "[\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划实施细则\",\n    \"法规文号\": \"教财〔2012〕2号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第六条\",\n    \"内容概述\": \"各有关部门要各司其职，各负其责，加强协调配合，不得推诿扯皮。\"\n  },\n  {\n    \"法规名称\": \"食品安全法\",\n    \"法规文号\"\
    : \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"县级以上地方人民政府对本行政区域的食品安全监督管理工作负责，统一领导、组织、协调本行政区域的食品"
