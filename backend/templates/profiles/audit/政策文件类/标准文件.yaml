name: audit/政策文件类/标准文件
type: model
description: 从政策文件类类文档（标准文件）中提取结构化元数据。涵盖字段如：不同作物亩均用水定额、不足100人按100人核定政策条款、产能规模阈值、人口覆盖要求、从业年限要求、体育器材配置标准、信息化设备配置标准、信息登记要素要求。文档范围包括：三通工程（通网络、通资源、通应用）建设标准文件、上级主管部门关于农家书屋建设的标准文件、仓储保鲜冷链技术标准文件、以工代赈项目劳务报酬比例标准文件、会议费支出标准文件、保护性耕作验收标准文件、信息进村入户工程建设标准文件、僵尸企业认定标准文件、养老保险等政策执行标准文件、农业生产用电电价执行标准文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 招投标
- 登记
- 补贴
- 金额
- 元数据提取
