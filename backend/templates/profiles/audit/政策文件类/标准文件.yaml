  regulation: "[\n  {\n    \"法规名称\": \"国务院关于进一步完善城乡义务教育经费保障机制的通知\",\n    \"法规文号\": \"国发〔2015〕67号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条（三）\",\n    \"内容概述\": \"统一城乡义务教育学校生均公用经费基准定额。中央确定全国统一的基准定额，地方可结合实际提高标准。所需资金由中央和地方按比例分担。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国义务教育法\",\n    \"法规文号\": \"主席令第4号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十三条\"\
    ,\n "
- expression: 学校名称、实际学生人数.实际学生人数 < 100 && 学校名称、实际学生人数.拨款到账金额 != 100 * 不足100人按100人核定政策条款、生均基准定额.生均基准定额
  description: 对实际在校生不足100人的农村小规模学校，应按100人核算公用经费总额（即100人×基准定额）。若实际拨款金额不等于应拨款总额，则视为未达标。注意排除因学生数动态变动造成的微小偏差，可设定差额绝对值大于100元为异常。
  audit_item: 农村义务教育经费保障落实不到位
  suspicion: 不足100人的小规模学校公用经费未按100人核定
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于全面加强乡村小规模学校和乡镇寄宿制学校建设的指导意见\",\n    \"法规文号\": \"国办发〔2018〕27号\",\n    \"效力级别\"\
    : \"行政法规\",\n    \"条款号\": \"第三条（一）\",\n    \"内容概述\": \"落实对乡村小规模学校按100人拨付公用经费政策，确保学校正常运转。\"\n  }\n]"
- expression: (核查表.是否公示 = '否') || (入住合同.约定收费项目 NOT IN (管理制度.允许收费项目)) || (ABS(入住合同.各项收费标准 - 管理制度.对应收费标准上限) > 0 且 无超标准审批文件)
    || (调查表.收费投诉内容 >= 1 && 投诉内容涉及隐藏收费或标准不符)
  description: 条件一：公示核查表记录为未公示即触发；条件二：合同约定收费项目超出制度允许范围；条件三：实际收费金额超过制度上限且无特批文件；条件四：老人满意度调查中反馈收费与公示不一致。任一条件成立即为疑点。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 农村养老机构收费项目及标准未公示
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
