    \ \"部门规章\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"农用薄膜生产者应当执行农用薄膜相关标准，确保产品质量合格。禁止生产、销售、使用国家明令禁止或者不符合强制性国家标准的农用薄膜。\"\n\
    \  },\n  {\n    \"法规名称\": \"聚乙烯吹塑农用地面覆盖薄膜\",\n    \"法规文号\": \"GB 13735-2017\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\":\
    \ \"4.4 "
- expression: (验收文件.验收结论 != '通过' 或 验收文件 缺失) && (记录表.发现问题描述 包含 '防渗漏' 或 '未分类') || (数据表.泄漏记录次数 > 0) || (检查记录.针对贮存隐患的整改要求及闭环状态
    包含 '贮存' 且 记录表.整改状态 = '未完成')
  description: 贮存设施未经环保验收合格便投入使用，或检查中发现未采取防渗漏、分类存放等基本防护措施，或监测数据出现泄漏且未有效整改，均认定为未妥善保存，存在污染隐患。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 回收的农药包装废弃物未能妥善保存
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国固体废物污染环境防治法》\",\n    \"法规文号\": \"主席令第四十三号（2020年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第八十一条\",\n    \"内容概述\": \"收集、贮存危险废物，应当按照危险废物特性分类进行，并采取符合国家环境保护标准的防护措施，禁止混合贮存不相容的危险废物。\"\n  }\n]"
- expression: (许可证有效期、许可处理范围（类别、能力）、合法资质单位清单.许可证有效期 < 当前日期) || (处理量、产出物检测结果.实际处理温度 < 贮存设施防渗漏、防雨、防扬散标准、处理工艺参数标准（如焚烧温度、停留时间）.最低温度)
    || (处理量、产出物检测结果.处理量 > 许可证有效期、许可处理范围（类别、能力）、合法资质单位清单.许可能力上限) || (处理量、产出物检测结果.产出物检测结果 > 标准限值)
  description: 处置单位资质过期、处理工艺参数（如焚烧温度）未达到技术标准、超许可能力处理、或资源化产品残留超标，均构成资源化利用不合规，未依法进行无害化处理。
  audit_item: 农药包装废弃物回收使用管理不符合规定
