    项目名称、采购金额、采购方式、采购品目、供应商、合同签订日期、邀请招标供应商数量、采购组织形式、是否进口产品.采购组织形式 != '集中采购' AND (项目名称、审批意见、批准部门 IS NULL OR 项目名称、审批意见、批准部门.审批意见
    != '同意')
  description: 对照集中采购目录，凡属目录内品目且满足限额标准的项目，必须委托集中采购机构采购。若实际组织形式非集中采购，又无财政部门批准分散采购的有效文件，则构成违规。
  audit_item: 政府采购组织管理不规范
  suspicion: 纳入集中采购目录项目未实行集中采购
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"采购人采购纳入集中采购目录的政府采购项目，必须委托集中采购机构代理采购；采购未纳入集中采购目录的政府采购项目，可以自行采购，也可以委托集中采购机构在委托的范围内代理采购。\"\n  }\n\
    ]"
- expression: 明细表.采购金额 >= 限额标准 AND 明细表.采购方式 NOT IN ('公开招标', '邀请招标', '竞争性谈判', '竞争性磋商', '询价', '单一来源采购') OR (明细表.采购金额 >= 公开招标数额标准
    AND 明细表.采购方式 != '公开招标' AND (审批文件 IS NULL OR 审批文件.审批意见 != '同意'))
  description: 首先判断是否达到政府采购限额标准（通常为货物服务50万元、工程60万元等），达到限额必须采用法定采购方式；任意选择目录外或自创采购方式即为违规。其次，若金额超过公开招标数额标准，必须采用公开招标，其他方式需审批。表达式通过两层条件全面筛查采购方式滥用。
  audit_item: 政府采购组织管理不规范
  suspicion: 达到政府采购限额标准未按规定方式采购
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十六条、第二十七条\",\n    \"内容概述\": \"政府采购采用公开招标、邀请招标、竞争性谈判、询价、单一来源采购等方式；达到公开招标数额标准的，应当采用公开招标方式采购，因特殊情况需采用公开招标以外方式的，应提前获得批准。\"\
    \n  }\n]"
- expression: (清单表.单价 > 标准文件.配置标准单价上限) || (清单表.数量 > 标准文件.配置标准数量上限 && 审批单.豁免审批文件编号 == null)
  description: 将实际配置资产单价或数量与财政/行业配置标准上限逐一比对，单价超出或数量超出且无合规豁免审批文件时，判定为超标准配置国有资产。
  audit_item: 违反规定配置国有资产
  suspicion: 超标准配置国有资产
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十一条\",\n    \"内容概述\": \"各部门及其所属单位应当根据依法履行职能和事业发展的需要，结合资产存量、资产配置标准、绩效目标和财政承受能力配置资产，资产配置重大事项应当经可行性研究和集体决策。\"\n  }\n\
    ]"
- expression: (ABS(分析表.百公里油耗或电耗 - 标准文件.标准百公里能耗上限) / 标准文件.标准百公里能耗上限 > 0.15) OR (用车台账.排量 > 1.8 AND 用车台账.购入日期 > 限定日期)
  description: 汽油车实际百公里油耗超过标准油耗15%以上，或新能源车实际百公里电耗超出标准电耗15%以上，视为能耗控制不达标。若车辆本身排量或价格超过国家规定的配备标准，直接从源头上违反能耗控制原则。限定日期参照各级车改后的新购车辆标准。
  audit_item: 违规管理或使用公务用车
  suspicion: 未按规定控制公务车能耗
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十四条\",\n    \"内容概述\": \"党政机关应当加强公务用车使用管理，严格按照规定用途使用公务用车，降低使用和维修保养成本……实行单车能耗核算。\"\n  }\n]"
- expression: (验收报告.现场实测单位能耗值 > 评估报告.设计能效指标 * 1.05) || (记录表.采购规格 < 评估报告.设计能效指标) || (评估报告.围护结构传热系数设计值 > 标准文件.各项节能限值标准)
  description: 表达式构建了三层穿透核查：一是实测能耗超出设计值5%以上，陷入‘会算账不会过日子’的偷工减料嫌疑；二是采购的设备能效等级低于设计承诺；三是关键材料检测结果直接不满足国家强制标准限值。任何一层条件成立均触发违规疑点。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 擅自变更节能设计导致能效指标不达标
  regulation: "[\n  {\n    \"法规名称\": \"民用建筑节能条例\",\n    \"法规文号\": \"国务院令第530号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条、第二十条\",\n    \"内容概述\": \"建设单位不得明示或者暗示设计单位、施工单位违反民用建筑节能强制性标准进行设计、施工；不得擅自变更节能设计，降低节能标准。\"\n  },\n  {\n    \"法规名称\"\
    : \"公共建筑节能设计标准\",\n    \"法规文号\": \"GB 50189-2015\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"各章节限值条款\",\n    \"内容概述\"\
    : \"规定了公共建筑"
- expression: (企业名称、利润总额、经营现金流、资产负债率.利润总额 < 0 && 企业名称、利润总额、经营现金流、资产负债率.经营现金流 < 0 && 企业名称、利润总额、经营现金流、资产负债率.资产负债率 > 85%) &&
    (上报处置状态、完成标志.上报处置状态 == '已完成' && 注销登记日期、法院受理文号.不存在) || (上报处置状态、完成标志.上报收入 != 实际收入、纳税情况.实际收入 && ABS(差异率) > 10%)
  description: 企业满足僵尸标准但未完成法定处置程序即上报已完成，或通过虚增收入粉饰为“非僵尸”企业，均属弄虚作假。收入差异率超过10%即为明显异常。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
  suspicion: 僵尸企业处置弄虚作假或推进不力
  regulation: "[\n  {\n    \"法规名称\": \"中央企业处置“僵尸企业”工作指引\",\n    \"法规文号\": \"国资发财管〔2016〕285号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"严禁虚报处置进度，不得通过违规融资、虚增收入等方式将僵尸企业“脱僵”，应依法依规通过关闭撤销、破产清算、兼并重组等方式实现市场出清。\"\n  }\n]"
- expression: 实发工资人数（在编）.发放项目名称 NOT IN 允许发放的津补贴项目名称、发放标准、发放范围.允许发放的津补贴项目名称 || (实发工资人数（在编）.发放项目名称 == 允许发放的津补贴项目名称、发放标准、发放范围.允许发放的津补贴项目名称
    && 实发工资人数（在编）.发放金额 > 允许发放的津补贴项目名称、发放标准、发放范围.发放标准)
  description: 判定规则：1. 检查实际发放的津补贴项目是否在企业制度或上级批准的合规清单内；2. 对于合规清单内的项目，检查其发放金额是否超出规定的标准上限。两个条件满足其一即判定违规。
  audit_item: 未严格落实中央八项规定及实施细则精神
  suspicion: 违规发放津贴补贴或福利
  regulation: "[\n  {\n    \"法规名称\": \"违规发放津贴补贴行为处分规定\",\n    \"法规文号\": \"中华人民共和国监察部、人力资源和社会保障部令第31号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"违反规定自行新设项目或者继续发放已经明令取消的津贴补贴的；超过规定标准、范围发放津贴补贴的，给予处分。\"\n  },\n  {\n   \
    \ \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第四十二条\",\n  \
    \  \"内容概述\": "
- expression: （标准文件.应淘汰的设备类型 IN 标准文件.应淘汰的设备类型 AND 设备在 验收报告 或 记录表 中显示“在用”） OR （数据表.是否达标标识 = “不达标” AND 淘汰清单.实际淘汰状态 != “已关停”）
    AND 当前日期 > 淘汰清单.计划淘汰时间
  description: 当企业设备属于国家明令淘汰的落后产能但仍在生产运行，或者环保、能耗监测数据持续不达标且该设备未在规定的期限内完成淘汰，即构成违规。表达式通过设备清单与运行记录的匹配以及不达标状态与淘汰状态的矛盾来判定。
  audit_item: 未按规定落实去产能政策措施
  suspicion: 未淘汰不符合环保能耗安全标准的落后产能
  regulation: "[\n  {\n    \"法规名称\": \"产业结构调整指导目录（2019年本）\",\n    \"法规文号\": \"国家发展改革委令第29号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第一类 鼓励类、第二类 限制类、第三类 淘汰类\",\n    \"内容概述\": \"对限制类项目禁止新建，对淘汰类项目限期淘汰，明确落后生产工艺装备和产品的淘汰期限，逾期未淘汰的依法责令停产或关闭。\"\
    \n  },\n  {\n    \"法规名称\": \"国务院关于化解产能严重过剩矛盾的指导意见\",\n    \"法规文号\": \"国发〔2013〕41号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\":"
- expression: (统计表.检测能效值 < 标准文件.能效限定值) && (设备清单.淘汰处置状态 != "已淘汰")
  description: 在用设备实测能效值低于国家强制标准的最低能效限定值，并且该设备未被列入已淘汰处置清单（即仍在使用），则判定违规。
  audit_item: 节能减排方面存在的问题
  suspicion: 生产或使用低于强制性能效标准的用能设备
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国节约能源法\",\n    \"法规文号\": \"主席令第七十七号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"禁止生产、进口、销售国家明令淘汰或者不符合强制性能源效率标准的用能产品、设备。\"\n  },\n  {\n    \"法规名称\": \"重点用能单位节能管理办法\"\
    ,\n    \"法规文号\": \"国家发展和改革委员会令第15号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十五条\",\n    \"内容概述\": \"重点用能单位不得使用国家明令淘汰的用能设备"
- expression: 三通工程项目进度表（含完成时间、验收状态）.实际完成时间 IS NULL || 三通工程项目进度表（含完成时间、验收状态）.实际完成时间 > 三通工程项目进度表（含完成时间、验收状态）.计划完成时间 || 三通工程项目进度表（含完成时间、验收状态）.验收状态
    = '未通过' || LENGTH(薄弱学校改善项目验收报告.整改问题) > 0
  description: 项目进度表中未填写实际完成时间、实际完成时间晚于方案规定时限、验收结论为不合格或存在逾期未整改问题，均判定为未完成三通工程建设。
  audit_item: 乡村学校薄弱环节改善不符合相关规定
  suspicion: 未按期完成三通工程建设
  regulation: "[\n  {\n    \"法规名称\": \"教育部 国家发展改革委 财政部关于深入推进义务教育薄弱环节改善与能力提升工作的意见\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"无\",\n    \"内容概述\": \"要求各地按照规划时间表完成信息化基础设施建设，实现宽带网络校校通、优质资源班班通、网络学习空间人人通，确保所有项目学校达到标准要求。\"\n \
    \ }\n]"
- expression: 竣工验收文件.实际竣工面积 < 建设标准文件.最小建筑面积要求 || 实地测量记录.功能分区独立性检查 != '合格' || 达标自查表.无障碍设施配置情况 != '合格' || 竣工验收文件.消防验收意见 != '合格'
    || 竣工验收文件.污水处理设施合格证明 != '合格'
  description: 以《乡镇卫生院建设标准》及地方具体标准为依据，面积低于标准即构成违规；功能分区缺失直接影响服务能力，属重大缺陷。消防、污水、无障碍设施缺一不可。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 乡镇卫生院/村卫生室业务用房面积或功能分区不达标
  regulation: "[\n  {\n    \"法规名称\": \"乡镇卫生院建设标准\",\n    \"法规文号\": \"建标107-2008\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\":\
    \ \"第十五条、第十九条\",\n    \"内容概述\": \"规定乡镇卫生院业务用房面积指标和功能分区要求，包括门诊、急诊、住院、医技等基本用房设置标准。\"\n  },\n  {\n    \"法规名称\": \"村卫生室管理办法（试行）\"\
    ,\n    \"法规文号\": \"国卫基层发〔2014〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条、第十二条\",\n    \"内容概述\": \"村卫生室应当分设诊断室、治疗"
- expression: 用电客户收费明细表.执行电价代码 NOT IN (农业生产用电电价执行标准文件.农业排灌、养殖、种植等各子类电价代码及单价) AND 用电客户收费明细表.行业分类代码 IN ('A01','A02','A05') AND
    用电客户收费明细表.实收电价 > (国家及地方电价政策文件.电价水平 * 1.1)
  description: 判定条件：用电客户收费明细表中，行业分类为农林牧渔业（代码A01种植、A02林业、A05畜牧业等）的用户，其执行电价代码不在农业电价代码集合内，且实收电费超出标准电价110%以上，则视为违规按非农业电价收费。行业分类代码依据国民经济行业分类，实际审计可结合用电地址与电网公司内部用电性质标签交叉验证。
  audit_item: 供电服务不合规
  suspicion: 农业生产电价执行违规
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电力法\",\n    \"法规文号\": \"主席令第23号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十四条\"\
    ,\n    \"内容概述\": \"禁止任何单位和个人在电费中加收其他费用；禁止供电企业在收取电费时，代收其他费用。\"\n  },\n  {\n    \"法规名称\": \"销售电价管理暂行办法\",\n    \"法规文号\"\
    : \"发改价格〔2005〕514号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"农业生产用电价格应在合理补偿成本的基础上，逐步与工业用电价格并轨，各类"
- expression: (图书配备清单.数量 < 上级主管部门关于农家书屋建设的标准文件.规定最低总册数) || (图书配备清单.农业科技类册数占比 < 上级主管部门关于农家书屋建设的标准文件.农业科技类比例) || (图书配备清单.近三年出版册数占比
    < 上级主管部门关于农家书屋建设的标准文件.近三年出版物占比) || (农民需求调研报告或意见反馈记录.农民需求类型 NOT IN 图书配备清单.分类标签) || (图书采购合同.供应商资质 NOT IN 政府采购目录)
  description: 判定图书配备不达标：总册数低于规定最低标准（如1500册）；特定类别（如农业科技类）占比低于标准（如60%）；近三年出版图书占比低于规定（如30%）；调研需求类别在配备图书中完全缺失，表明图书脱离实际需求；采购合同供应商不在合规名录内，可能存在盗版或低价打包劣质书问题。以上条件满足任意一条，判为疑点。
  audit_item: 农家书屋建设运营管护不合规
  suspicion: 农家书屋图书配备不达标或脱离需求
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条、第十三条\"\
    ,\n    \"内容概述\": \"农家书屋图书配置应符合当地农村实际需求，确保藏书量不少于1500册，品种不少于500种；图书应定期更新，确保内容实用、新颖。\"\n  }\n]"
- expression: 实际拨付到账金额 / 学生人数 < 城乡统一基准定额（或农村标准）
  description: 以学校为计算单元，若某校生均实际拨付金额低于国家或省级规定的基准定额，则判定为保障不足。基准定额可采用当年最新公布标准，如小学生均650元、初中850元等。
