  description: 还田利用登记表中明确标注未经处理，或来源是非处理厂且处理厂无出料记录，或抽检处理厂出料指标未达标而仍用于农用，均视为违规。蛔虫卵死亡率、粪大肠菌群值需满足国家标准。
  audit_item: 农村厕所粪污治理不符合相关规定
