name: audit/政策文件类/部署文件
type: model
description: 从政策文件类类文档（部署文件）中提取结构化元数据。涵盖字段如：监督检查工作部署记录、问题通报记录。文档范围包括：党委/纪检部门专题会议部署文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 检查
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 部署文件
  member_count: 1
  member_details:
  - 党委/纪检部门专题会议部署文件
output:
  fields:
  - name: 监督检查工作部署记录
    type: string
    description: 提取 监督检查工作部署记录 的文本值
  - name: 问题通报记录
    type: string
    description: 提取 问题通报记录 的文本值
violations:
- expression: (制度文件.文件存在状态 == false) || (制度文件.制度内容文本.indexOf("三重一大") == -1 && 制度文件.制度内容文本.indexOf("招标采购") == -1 && 制度文件.制度内容文本.indexOf("资金使用")
    == -1) || (制度文件.最近修订日期 < 中央八项规定最新修订日期 && 制度文件.内容未覆盖新增风险领域) || (分工表.是否明确“三重一大”事项分工 == false)
  description: 判定制度缺失或内容不完整：1.制度文件不存在直接判定为违规；2.制度内容中同时缺失“三重一大”“招标采购”“资金使用”三个核心关键词，说明未覆盖关键经济领域；3.制度修订日期滞后于中央八项规定最新修订日期且未更新风险领域，视为滞后；4.责任分工表未明确“一岗双责”及“三重一大”具体分工则责任不落实。
  audit_item: 在经济活动中落实党风廉政建设责任方面存在的问题
  suspicion: 未建立健全党风廉政建设专项制度
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党党内监督条例\",\n    \"法规文号\": \"中发〔2016〕26号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"党委（党组）应当加强对领导干部的日常管理监督，掌握其思想、工作、作风、生活状况。建立健全党的领导干部廉洁档案，对党风廉政方面存在的问题做到早发现、早提醒、早处置。\"\n  },\n\
    \  {\n    \"法规名称\": \"关于实行党风廉政建设责任制的规定\",\n    \"法规文号\": \"中发〔2010〕19号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第七条\"\
    ,"
- expression: (工作台账.发现问题数量 < 监督检查工作部署记录.监督检查工作部署记录) || (工作台账.检查对象 / 工作台账.检查对象 < 0.9) || (落实清单.整改完成时间 - 落实清单.整改完成时间 > 30天)
    || (审批文件.合同金额 >= 100万 && 工作台账.检查结果摘要)
  description: 判定监督检查不到位：1.实际检查次数未达到本单位制度规定的年度检查频次；2.检查覆盖率低于90%（已检查单位数/应检查单位数<0.9），存在监督盲区；3.发现问题后整改超时，下达整改至完成时间差超过30天，整改拖沓；4.大额经济活动（≥100万）未纳入监督检查台账，存在监督缺失。以上条件满足任意一条即触发疑点。
  audit_item: 在经济活动中落实党风廉政建设责任方面存在的问题
  suspicion: 未严格实施党风廉政建设监督检查
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党党内监督条例\",\n    \"法规文号\": \"中发〔2016〕26号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"纪律检查机关必须把维护党的政治纪律和政治规矩放在首位，坚决纠正和查处上有政策、下有对策，有令不行、有禁不止，口是心非、阳奉阴违等行为。\"\n  },\n  {\n    \"\
    法规名称\": \"关于实行党风廉政建设责任制的规定\",\n    \"法规文号\": \"中发〔2010〕19号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第十九条\",\n    \"\
    内容概述\":"
