name: audit/政策文件类/设计文件
type: model
description: 从政策文件类类文档（设计文件）中提取结构化元数据。涵盖字段如：交通安全设施设计内容、供水规模、保护区范围、净化消毒设施设计清单、取水口位置、取水泵站坐标、图号、图名。文档范围包括：交通安全及防护设施设计文件、农村供水工程设计文件、农村公路建设项目设计文件、初步设计文件、工程项目设计文件、施工图设计文件、桥梁设计文件、项目设计文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 安全
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 设计文件
  member_count: 1
  member_details:
  - 交通安全及防护设施设计文件
  - 农村供水工程设计文件
  - 农村公路建设项目设计文件
  - 初步设计文件
  - 工程项目设计文件
  - 施工图设计文件
  - 桥梁设计文件
  - 项目设计文件
output:
  fields:
  - name: 交通安全设施设计内容
    type: string
    description: 提取 交通安全设施设计内容 的文本值
  - name: 供水规模
    type: string
    description: 提取 供水规模 的文本值
  - name: 保护区范围
    type: string
    description: 提取 保护区范围 的文本值
  - name: 净化消毒设施设计清单
    type: string
    description: 提取 净化消毒设施设计清单 的文本值
  - name: 取水口位置
    type: string
    description: 提取 取水口位置 的文本值
  - name: 取水泵站坐标
    type: string
    description: 提取 取水泵站坐标 的文本值
  - name: 图号
    type: string
    description: 提取 图号 的文本值
  - name: 图名
    type: string
    description: 提取 图名 的文本值
  - name: 安全设施设计项数
    type: string
    description: 提取 安全设施设计项数 的文本值
  - name: 工艺流程
    type: string
    description: 提取 工艺流程 的文本值
  - name: 批复日期
    type: date
    description: 提取 批复日期 的日期值，格式 YYYY-MM-DD
  - name: 投资概算
    type: string
    description: 提取 投资概算 的文本值
  - name: 服务人口
    type: string
    description: 提取 服务人口 的文本值
  - name: 材料规格型号
    type: string
    description: 提取 材料规格型号 的文本值
  - name: 构件重要性等级
    type: string
    description: 提取 构件重要性等级 的文本值
  - name: 概算金额
    type: number
    description: 提取 概算金额 的数值（含单位，如万元、吨等）
  - name: 水源类型
    type: string
    description: 提取 水源类型 的文本值
  - name: 水源论证结论
    type: string
    description: 提取 水源论证结论 的文本值
  - name: 管网最不利点水压
    type: string
    description: 提取 管网最不利点水压 的文本值
  - name: 结构尺寸参数
    type: string
    description: 提取 结构尺寸参数 的文本值
  - name: 设备型号
    type: string
    description: 提取 设备型号 的文本值
  - name: 设备清单
    type: string
    description: 提取 设备清单 的文本值
  - name: 设计供水量
    type: string
    description: 提取 设计供水量 的文本值
  - name: 设计参数
    type: string
    description: 提取 设计参数 的文本值
  - name: 设计图中的安全设施
    type: string
    description: 提取 设计图中的安全设施 的文本值
  - name: 设计技术标准
    type: string
    description: 提取 设计技术标准 的文本值
  - name: 设计概算金额
    type: number
    description: 提取 设计概算金额 的数值（含单位，如万元、吨等）
  - name: 设计说明
    type: string
    description: 提取 设计说明 的文本值
  - name: 设计说明中客运站点内容
    type: string
    description: 提取 设计说明中客运站点内容 的文本值
violations:
- expression: (设计文件.设计参数（如荷载、防火等级） 不符合 强制性标准对应阈值) && (合格证书.审查结论 == '合格') || (审查记录.符合性结论 == '不符合' && 通知单.批准日期 > 合格证书.签发日期)
  description: 比对设计图纸中的关键参数是否违反工程建设强制性标准中规定的限值（如结构安全系数、消防通道宽度等）。若图纸审查记录显示符合标准，但实际参数不符，或审查发现不符合项但未经正式设计变更即通过审查，均为可疑。
  audit_item: 工程质量事故调查
  suspicion: 设计文件违反工程建设强制性标准
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号（2019年修正）\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第十条\",\n    \"内容概述\": \"建设工程发包单位不得迫使承包方以低于成本的价格竞标，不得任意压缩合理工期。建设单位不得明示或者暗示设计单位或者施工单位违反工程建设强制性标准，降低建设工程质量。\"\
    \n  },\n  {\n    \"法规名称\": \"实施工程建设强制性标准监督规定\",\n    \"法规文号\": \"建设部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二条、第"
- expression: (许可证.发证日期 < 批复文件.批复日期) || (设计文件.批复日期 < 研究报告.批复日期) || (项目清单.实际开工日期 < 意见书.批复日期) || (许可证.发证日期 IS NULL && 项目清单.实际开工日期
    IS NOT NULL) || (评价报告.批复日期 < 批复文件.批复日期)
  description: 该表达式用于判定审批程序倒置或未批先建。主要逻辑包括：1) 规划许可证日期早于立项批复日期，表明程序倒置；2) 初设批复早于可研批复，违反基本建设程序；3) 实际开工日期早于用地审批文件日期，构成未批先建；4) 未取得规划许可证但已有实际开工记录，属于严重违法行为；5)
    环评批复早于立项批复，通常不符合逻辑，涉嫌程序违规。所有条件满足其一即触发疑点。
  audit_item: 未按规定办理项目审批等手续
  suspicion: 未批先建或程序倒置违规
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条、第十三条\"\
    ,\n    \"内容概述\": \"政府投资项目必须严格执行基本建设程序，项目单位不得在开工前缺失任何法定审批手续，不得在审批手续办结前开工建设。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\"\
    ,\n    \"法规文号\": \"主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"在城市、镇规划区内进行建筑物、构筑物、道路、"
- expression: (检测报告.标度分值 > 60 && 检测报告.标度分值 >= 4) || (检测报告.综合评定等级 == '2类' && 检测报告.同部位病害历史标度数据 >= 4 且 无维修记录) || (计算书.权重分配 !=
    标准权重值 && ABS(计算书.部件得分 - 标准综合得分) > 5)
  description: 部件得分为严重缺损但权重被人为调低，或直接将四五类构件（标度≥4）评定为二类桥。若同一病害在前次报告中被标为严重，本次反且评级更好且无修复记录，涉嫌造假。
  audit_item: 道路桥梁安全定期检测审计
  suspicion: 安全状况评定虚高
  regulation: "[\n  {\n    \"法规名称\": \"公路桥梁技术状况评定标准\",\n    \"法规文号\": \"JTG/T H21-2011\",\n    \"效力级别\": \"行业规范\",\n    \"\
    条款号\": \"4.1.6及4.2\",\n    \"内容概述\": \"桥梁技术状况评定等级划分标准明确，规定了单项指标标度与综合评定的对应关系，主要部件评分达到4类或5类时，全桥应严格按最差部件评定等级，严禁任意加权平均掩盖严重病害。\"\
    \n  }\n]"
- expression: (项目设计文件中客运站点设计内容缺失 || 施工合同中无客运站点施工计划) || (公路竣工日期 IS NOT NULL && (客运站点竣工日期 IS NULL || 客运站点竣工日期 > 公路竣工日期 + 90天))
  description: 设计或施工阶段缺失客运站点，或公路竣工验收后超过90天客运站点仍未竣工，判定为未同步。90天为合理施工宽限期，可根据项目规模调整。
  audit_item: 项目建设养护未实现政策目标
  suspicion: 农村客运站点未与公路同步设计施工交付
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十五条\",\n    \"内容概述\": \"农村公路建设项目应当加强质量管理，按照有关标准和设计要求，同步建设交通安全、防护、排水等附属设施，并与主体工程同步设计、同步施工、同步投入使用。\"\n  }\n]"
- expression: (检测报告.实测值 < 设计文件.设计技术标准 * 0.95) || (记录表.抽检批次 / 抽检批次 > 0.15) || (整改台账.问题描述 > 0) || (日志.关键工序旁站记录 >= 1 && 检测报告.检测结论
    == '合格')
  description: 表达式定义四种违规模块：1）任一关键性能指标（如管材抗压强度、混凝土厚度）实测值低于设计标准95%即判定不合格；2）施工过程抽检不合格比例超过15%视为过程管理失当；3）问题整改台账中存在未闭环事项直接认定缺陷未消除；4）监理日志缺失关键工序（如打压试验、旁站）记录但验收结论仍为合格，可判定验收造假。各项以逻辑或连接，满足任一即触发疑点。
  audit_item: 工程建设和资金使用不符合规定
  suspicion: 工程质量不符合相关质量要求
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十八条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。\"\n  },\n  {\n    \"法规名称\": \"农村饮水安全工程建设管理办法\"\
    ,\n    \"法规文号\": \"发改农经[2013]2673号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"农村饮水安全工程所需管材、设备等，应严格按照有关"
- expression: (受益清单.与最近取水点直线距离 > 800) || (水源保护区划定.设计供水能力 / 统计表.日均需水量 < 1.0) || (水源保护区划定.周边污染源种类及距离 < 30) || (统计表.规划供水户数 /
    统计表.户籍人口数 < 0.8)
  description: 表达式设定了四项布局合理性判定规则：1）任一受益户至取水点的距离超过800米，违反取水半径标准；2）供水能力与日均需水量之比小于1.0，存在供需缺口；3）取水点与最近污染源距离小于30米，违反卫生防护要求；4）实际供水覆盖率（已通水户数/户籍人口）低于80%，表明选址盲区或设计遗漏。
  audit_item: 工程建设和资金使用不符合规定
  suspicion: 取水点布局不合理
  regulation: "[\n  {\n    \"法规名称\": \"农村饮水安全评价准则\",\n    \"法规文号\": \"T/CHES 18-2018\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"第4.1条\",\n    \"内容概述\": \"人力取水方便程度：人力取水往返时间不超过20分钟，或取水水平距离不超过800米。\"\n  },\n  {\n    \"法规名称\": \"村镇供水工程技术规范\",\n \
    \   \"法规文号\": \"SL 310-2019\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第3.0.5条\",\n    \"内容概述\": \"取水构筑物与污染源的距离应符合现行相关标准，水源保护"
- expression: (设计文件.安全设施设计项数 - 验收报告.安全设施实际建设项数) > 0 || (设计文件.设计概算金额 - 设计文件.设计概算金额)/设计文件.设计概算金额 > 0.05
  description: 当设计文件中包含的安全设施项数大于验收报告中的实际建设项数，或安全设施结算金额低于概算金额的95%时，判定为未同步建设，存在缩减安全投入嫌疑。临崖临水路段防护设施缺失直接定为高风险。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 未同步建设交通安全防护设施
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设标准\",\n    \"法规文号\": \"JTGB01-2003\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\":\
    \ \"第4.5.2条\",\n    \"内容概述\": \"农村公路应按规定同步建设交通安全设施，安全设施应与主体工程同步设计、同步施工、同步投入使用。\"\n  },\n  {\n    \"法规名称\": \"公路交通安全设施设计规范\"\
    ,\n    \"法规文号\": \"JTG D81-2017\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第1.0.4条\",\n    \"内容概述\": \"公路交通安全设施必须与公路主体工程同时设"
- expression: 对照表.实际完成设施类型 = '否'
  description: 对照设计文件与验收结果，凡设计文件明确要求建设但验收报告中对应设施数量为零或未通过验收的路段，判定为未同步建设。
  audit_item: 质量不达标、管理养护不到位
  suspicion: 未同步建设交通安全防护设施
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"农村公路建设应当同步建设交通安全、排水、防护、绿化等附属设施，并与主体工程同时设计、同时施工、同时投入使用。\"\n  }\n]"
