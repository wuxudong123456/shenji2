name: audit/政策文件类/建设文件
type: model
description: 从政策文件类类文档（建设文件）中提取结构化元数据。涵盖字段如：响应责任单位、处置时限规定、预警触发条款。文档范围包括：快速发现响应机制建设文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 建设文件
  member_count: 1
  member_details:
  - 快速发现响应机制建设文件
output:
  fields:
  - name: 响应责任单位
    type: string
    description: 提取 响应责任单位 的文本值
  - name: 处置时限规定
    type: string
    description: 提取 处置时限规定 的文本值
  - name: 预警触发条款
    type: number
    description: 提取 预警触发条款 的数值（含单位，如万元、吨等）
violations:
- expression: （《快速发现响应机制建设文件》 缺失） || （《预警信息处置反馈记录表》 中 （入户核实完成时间 - 接报时间） > 15个工作日） || （《线上申报系统或热线记录》 中 存在 超过10个工作日 仍为“待受理”状态的记录）
  description: 判定标准：1. 无法提供成文的机制建设文件，系统运转无据可依。2. 从发现预警到完成入户核实的全流程超15个工作日，响应效率低下。3. 线上渠道形同虚设，存在大量长期未受理的群众自主申报信息。满足任一情况，即认定快速发现和响应机制未建立或未有效运行。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 未建立或运行快速发现响应机制
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部关于进一步健全防止返贫监测帮扶机制的通知\",\n    \"法规文号\": \"农办发〔2023〕6号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"二\",\n    \"内容概述\": \"拓宽农户自主申报渠道，优化干部排查、部门筛查等方式，建立“多网合一”的快速发现机制，明确各环节办理时限，确保群众诉求及时发现、快速响应、及时办结。\"\n\
    \  }\n]"
