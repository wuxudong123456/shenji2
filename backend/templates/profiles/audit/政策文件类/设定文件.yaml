name: audit/政策文件类/设定文件
type: model
description: 从政策文件类类文档（设定文件）中提取结构化元数据。涵盖字段如：任务数量描述、目标内容、资金规模。文档范围包括：绩效目标设定文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 设定文件
  member_count: 1
  member_details:
  - 绩效目标设定文件
output:
  fields:
  - name: 任务数量描述
    type: number
    description: 提取 任务数量描述 的数值（含单位，如万元、吨等）
  - name: 目标内容
    type: string
    description: 提取 目标内容 的文本值
  - name: 资金规模
    type: string
    description: 提取 资金规模 的文本值
violations:
- expression: 目标内容.目标内容 LIKE '%改善%' || 目标内容.目标内容 NOT LIKE '%数量%' || (资金总额.任务产出量 * 资金总额.亩均投资额/人均补贴标准等比值 - 目标内容.资金规模) / 目标内容.资金规模
    > 0.2
  description: 目标设定文件若仅有定性描述而缺乏定量产出指标，或资金与任务量的比值（如亩均投资额）偏离同类项目合理范围±20%以上，则判定为目标与资金脱节。'单位投入标准'可根据行业定额或历史均值确定。
  audit_item: 绩效管理不到位
  suspicion: 绩效目标未与资金规模匹配制定
  regulation: "[\n  {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"绩效目标要符合国民经济和社会发展规划、部门职能及事业发展规划，并与相应的财政支出范围、方向、效果紧密相关。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"各部门、各单位应当按照财政部门的"
