violations:
- expression: (亲属投资入股企业清单.投资企业名称 IN (供应商/客户名录.企业名称)) && (明细表.交易对手方 == 亲属投资入股企业清单.投资企业名称) && (明细表.交易金额 > 5000000 || ABS(明细表.单价-明细表.同期其他供应商报价)/明细表.同期其他供应商报价
    > 0.1)
  description: 筛查领导人员亲属投资入股企业与本单位发生业务往来的情况，当累计交易金额超过500万元或单笔交易价格偏离市场价10%以上时触发预警。阈值可根据企业规模及行业水平调整。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 特定关系人在关联企业或业务往来企业投资入股
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第一项\",\n    \"内容概述\": \"国有企业领导人员不得在本企业的关联企业、与本企业有业务关系的企业投资入股。\"\n  }\n]"
- expression: ((访问目标文件（标底文件）.访问内容（含评标专家查询） LIKE '%评标专家%' AND 访问时间 < 开标时间) AND 操作人 NOT IN (权限名单.允许查看人员)) || (相似度(投标文件.技术方案,
    招标文件.技术参数要求) > 0.90 AND 投标准备时长 < 3天)
  description: 开标前非授权人员查阅评标专家名单，或投标文件的技术方案与招标要求异常吻合且准备时间极短，均表明存在评标信息或关键技术参数被提前泄露的风险。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 泄露评标专家名单或关键信息影响公平竞争
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"招标人向他人透露已获取招标文件的潜在投标人的名称、数量或者可能影响公平竞争的有关招标投标的其他情况的，或者泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款。\"\n  }\n]"
- expression: (投标人名称、初始报价、最终报价、报价变更率.报价变更率 > 10%) && (沟通时间、涉及投标人、通讯次数.通讯次数 > 0) && (ABS(中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中标日期、评标委员会名单、中标通知书发出时间、中标人、中标联合体成员及分工、联合体协议条款.合同金额
    - 投标人名称、初始报价、最终报价、报价变更率.最终报价) / 中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中
  description: 报价变更率指（最终报价-初始报价）/初始报价的绝对值，超过10%为异常；评标期间指投标截止至中标通知书发出前。若该期间存在私下沟通且合同金额与变更后报价一致（偏差<1%），则判定存在实质性价格谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人私下与投标人协商修改投标报价
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  }\n]"
- expression: (技术方案变动.技术方案变动 == 是) && (变更前后技术参数.变更前后技术参数 != 招标文件技术规格要求) && (评标报告.技术得分 > 0) && (评标报告.澄清说明记录 == 无)
  description: 评标期间指投标截止后至中标通知书发出前；投标人提交了新版投标文件，技术参数发生实质性变更，导致技术得分提高，且评标报告中无正式的澄清记录，视为招标人默许的实质性谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人默许投标人评标后修改技术方案
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n \
    \   \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十二条\",\n    \"内容概述\": \"评标委员会要求投标人澄清的，澄清不得超出投标文件的范围或者改变投标"
- expression: (采购方式.采购方式 == 竞争性谈判) && (采购方式.项目预算 >= 公开招标限额标准) && (谈判轮次.谈判轮次 >= 2) && (谈判轮次.服务范围变更 == 是)
  description: 公开招标限额标准依据现行法规（如政府采购限额标准）；项目预算达到标准但未公开招标，采用竞争性谈判方式，且谈判中要求投标人多轮调整价格或服务内容，属于规避公开招标并实质性谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 利用多轮报价变相进行实质性谈判
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\"\
    ,\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容"
- expression: 涉及服务不及时、无人照护的投诉内容及次数、投诉人名称、投诉事由（乱收费/乱收保证金）、涉事部门、关于推诿扯皮的投诉内容.投诉类型 = '信息泄露' AND 涉及服务不及时、无人照护的投诉内容及次数、投诉人名称、投诉事由（乱收费/乱收保证金）、涉事部门、关于推诿扯皮的投诉内容.处理结果
    = '成立'
  description: 若投诉统计中明确存在信息泄露类投诉且经查属实，即可判定为招标人向特定投标人泄露应当保密的招标信息。如能获得技术方案相似度数据，可补充‘中标人技术方案与招标人内部资料相似度>90%’作为辅助判定。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 招标人向特定投标人泄露招标信息
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十二条\",\n    \"内容概述\": \"招标人不得向他人透露已获取招标文件的潜在投标人的名称、数量以及可能影响公平竞争的有关招标投标的其他情况。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十一条\",\n    \"内容概述\": \"禁止招标人与投标人串通投标，包括招标人"
- expression: (文本.付款条件 != 公告.商务条款（付款比例、履约保证金、违约责任）) || (文本.合同期限 < 投标文件.服务期限承诺) || (文本.合同总价 != 通知书.中标金额) || (文本.违约责任 != 公告.商务条款（付款比例、履约保证金、违约责任）)
    || (通知书.合同签订时间 > 通知书.发出日期 + 30天)
  description: 该表达式用于筛查合同实质性条款与招投标文件不一致的行为。实质性内容包括：付款条件、服务质量期限、合同金额、违约责任等。任意一项不符即触发疑点。同时，若合同签订日期超出中标通知书发出后30日，也判定违规。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 招标人与中标人订立背离实质性内容的合同
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n\
    ]"
- expression: (文本.变更后的技术标准 < 公告.技术标准与规格) || (文本.品牌 != 投标文件.投标品牌及型号) || (ABS(文本.工程量或单价) > 15%) || (文本.合同期限 < 审批文件.审批日期) ||
    (匹配表.收款单位账户信息 != 中标人.名称)
  description: 筛查通过补充协议等方式在合同签订后另行订立背离实质性内容协议的行为。典型表现包括：降低技术标准或更换品牌、变更工程量超15%、审批流程倒置等。若出现向非中标单位付款，高度预示违规转包。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 招标人与中标人订立背离实质性内容的协议
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n\
    ]"
- expression: 招标文件.计价方式 == '固定总价' && 文本.价格形式 != '固定总价'
