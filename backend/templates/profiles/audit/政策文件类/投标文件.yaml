name: audit/政策文件类/投标文件
type: model
description: 从政策文件类类文档（投标文件）中提取结构化元数据。涵盖字段如：中标候选人公示发布日期、中标公告日期、中标数量、中标结果公示信息、中标金额、付款条件响应、信息化建设合同签订及完工日期、分包计划。文档范围包括：中标人投标文件、投标文件、招投标文件、招标投标文件、服务组织招投标文件、治理工程招投标文件、项目招投标文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 付款
- 合同
- 工程
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 投标文件
  member_count: 1
  member_details:
  - 中标人投标文件
  - 投标文件
  - 招投标文件
  - 招标投标文件
  - 服务组织招投标文件
  - 治理工程招投标文件
  - 项目招投标文件
