name: audit/政策文件类/技术规范文件
type: model
description: 从政策文件类类文档（技术规范文件）中提取结构化元数据。涵盖字段如：农药品种、单位面积用量、发酵停留时间要求、安全间隔期天数、应配备设备清单、推荐稀释倍数、数据传输要求、无害化标准指标。文档范围包括：上图入库技术规范文件、农药使用技术规范文件、技术规范文件、无害化处理技术规范文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 安全
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 技术规范文件
  member_count: 1
  member_details:
  - 上图入库技术规范文件
  - 农药使用技术规范文件
  - 技术规范文件
  - 无害化处理技术规范文件
output:
  fields:
  - name: 农药品种
    type: string
    description: 提取 农药品种 的文本值
  - name: 单位面积用量
    type: string
    description: 提取 单位面积用量 的文本值
  - name: 发酵停留时间要求
    type: date
    description: 提取 发酵停留时间要求 的日期值，格式 YYYY-MM-DD
  - name: 安全间隔期天数
    type: number
    description: 提取 安全间隔期天数 的数值（含单位，如万元、吨等）
  - name: 应配备设备清单
    type: string
    description: 提取 应配备设备清单 的文本值
  - name: 推荐稀释倍数
    type: string
    description: 提取 推荐稀释倍数 的文本值
  - name: 数据传输要求
    type: string
    description: 提取 数据传输要求 的文本值
  - name: 无害化标准指标
    type: string
    description: 提取 无害化标准指标 的文本值
  - name: 每季最多使用次数
    type: string
    description: 提取 每季最多使用次数 的文本值
  - name: 规定录入时限
    type: string
    description: 提取 规定录入时限 的文本值
violations:
- expression: 记录表.稀释倍数或每亩用量 != 农药品种、推荐稀释倍数、单位面积用量、每季最多使用次数、安全间隔期天数.推荐稀释倍数 || 记录表.亩用量 > 农药品种、推荐稀释倍数、单位面积用量、每季最多使用次数、安全间隔期天数.单位面积用量
    || 记录表.每季最多使用次数 > 农药品种、推荐稀释倍数、单位面积用量、每季最多使用次数、安全间隔期天数.每季最多使用次数 || (记录表.使用时间 + 农药品种、推荐稀释倍数、单位面积用量、每季最多使用次数、安全间隔期天数.安全间隔期天数)
    < 登记表.种植/采收日期
  description: 判定规则：任何一项条件满足即视为违规。其中稀释倍数不一致（如标注1000倍，实际500倍）、单位面积用量超标、使用频次超标或安全间隔期不足均触发疑点。注意需统一单位后比对。
  audit_item: 农药使用管理不符合规定
  suspicion: 未按农药标注技术要求使用
  regulation: "[\n  {\n    \"法规名称\": \"农药管理条例\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十四条\"\
    ,\n    \"内容概述\": \"农药使用者应当严格按照农药标签标注的使用范围、使用方法和剂量、使用技术要求和注意事项使用农药，不得扩大使用范围、加大用药剂量或者改变使用方法。\"\n  }\n]"
- expression: (第三方抽测数据.粪大肠菌群值 > 10^-4 || 第三方抽测数据.寄生虫卵沉降率 < 95%) || (调查表.是否使用未处理粪污 == "是" && 处理台账.无害化处理标识 == "未经处理") || (技术规范文件.发酵停留时间要求
    > 处理台账.接收量)
  description: 判定条件：1.检测报告显示粪大肠菌群值大于10^-4或寄生虫卵沉降率低于95%，不满足无害化标准；2.调查表中农户反馈直接使用未处理粪污且台账记录印证其未经过处理；3.实际发酵时间短于规范要求。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 未经无害化处理粪污直接浇灌农作物
  regulation: "[\n  {\n    \"法规名称\": \"粪便无害化卫生要求\",\n    \"法规文号\": \"GB 7959-2012\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"4.1\",\n    \"内容概述\": \"用于农业的粪便必须经无害化处理，粪大肠菌群值≤10^-4，寄生虫卵沉降率≥95%，不得检出活虫卵和致病菌。\"\n  }\n]"
- expression: DATEDIFF(入库数据表.入库日期, 竣工验收报告.竣工验收日期) > 规定录入时限
  description: 项目竣工验收后超过技术规范规定时限（如90日）仍未录入全国农田建设监测监管平台，判定为未及时上图入库。规定录入时限取自农业农村部技术规范，默认90天。
  audit_item: 高标准农田管护使用不符合相关规定
  suspicion: 高标准农田未及时上图入库
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\",\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\"\
    : \"国务院规范性文件\",\n    \"条款号\": \"第六条第（十六）项\",\n    \"内容概述\": \"建立健全高标准农田建设监测监管机制，及时将高标准农田建设信息上图入库，实现有据可查、全程监控、精准管理。\"\n\
    \  }\n]"
- expression: (技术规范文件.应配备设备清单 != 设备采购合同.实际采购设备清单) || (设备资产台账.在册设备 中缺少 技术规范文件.关键设备名称) || (运行数据记录表.数据完整性 == '长期空白' || 运行数据记录表.数据采集间隔
    > 技术规范文件.传输频率要求 * 1.5)
  description: 三条路径判定：1.采购合同中的设备型号、数量与技术规范文件要求不符，属于源头配备不到位；2.资产台账中对规范要求的核心设备存在缺项，属于实施中偷工减料；3.运行数据记录表长期无数据或采集间隔远大于规范要求的频率（如要求每小时采集，实际24小时一条），反推设备可能未真正运行或功能不达标。
  audit_item: 项目实施管理不到位
  suspicion: 未按技术规范配备信息自动采集设备
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第709号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第五十七条\",\n    \"内容概述\": \"招标人和中标人应当依照招标投标法和本条例的规定签订书面合同，合同的标的、价款、质量、履行期限等主要条款应当与招标文件和中标人的投标文件的内容一致。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\
    \n  }\n]"
