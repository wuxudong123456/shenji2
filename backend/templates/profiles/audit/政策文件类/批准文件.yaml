name: audit/政策文件类/批准文件
type: model
description: 从政策文件类类文档（批准文件）中提取结构化元数据。涵盖字段如：合法收费项目清单及标准、地类、定价依据、应缴时间节点、批准对象、批准执收单位名称、批准收费项目、批准日期。文档范围包括：企业债券发行或新股增资的批准文件、国资委/集团总部批准文件、征地拆迁批准文件、收费项目批准文件、用地批准文件、董事会/股东会关联交易批准文件、非税收入征收标准批准文件、非税收入执收单位批准文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 批准文件
  member_count: 1
  member_details:
  - 企业债券发行或新股增资的批准文件
  - 国资委/集团总部批准文件
  - 征地拆迁批准文件
  - 收费项目批准文件
  - 用地批准文件
  - 董事会/股东会关联交易批准文件
  - 非税收入征收标准批准文件
  - 非税收入执收单位批准文件
output:
  fields:
  - name: 合法收费项目清单及标准
    type: number
    description: 提取 合法收费项目清单及标准 的数值（含单位，如万元、吨等）
  - name: 地类
    type: string
    description: 提取 地类 的文本值
  - name: 定价依据
    type: string
    description: 提取 定价依据 的文本值
  - name: 应缴时间节点
    type: date
    description: 提取 应缴时间节点 的日期值，格式 YYYY-MM-DD
  - name: 批准对象
    type: string
    description: 提取 批准对象 的文本值
  - name: 批准执收单位名称
    type: string
    description: 提取 批准执收单位名称 的文本值
  - name: 批准收费项目
    type: number
    description: 提取 批准收费项目 的数值（含单位，如万元、吨等）
  - name: 批准日期
    type: date
    description: 提取 批准日期 的日期值，格式 YYYY-MM-DD
  - name: 批准标准
    type: string
    description: 提取 批准标准 的文本值
  - name: 批准用地范围红线坐标
    type: string
    description: 提取 批准用地范围红线坐标 的文本值
  - name: 批准金额
    type: number
    description: 提取 批准金额 的数值（含单位，如万元、吨等）
  - name: 批准面积
    type: string
    description: 提取 批准面积 的文本值
  - name: 批复对象
    type: string
    description: 提取 批复对象 的文本值
  - name: 批复文号
    type: string
    description: 提取 批复文号 的文本值
  - name: 批复日期
    type: date
    description: 提取 批复日期 的日期值，格式 YYYY-MM-DD
  - name: 授权征收项目
    type: string
    description: 提取 授权征收项目 的文本值
  - name: 有效期间
    type: string
    description: 提取 有效期间 的文本值
  - name: 有效期限
    type: string
    description: 提取 有效期限 的文本值
  - name: 核准文号
    type: string
    description: 提取 核准文号 的文本值
  - name: 正常征收标准
    type: string
    description: 提取 正常征收标准 的文本值
  - name: 浮动比例
    type: number
    description: 提取 浮动比例 的数值（含单位，如万元、吨等）
  - name: 用地类型
    type: string
    description: 提取 用地类型 的文本值
  - name: 监管机构批复
    type: string
    description: 提取 监管机构批复 的文本值
  - name: 表决情况
    type: string
    description: 提取 表决情况 的文本值
  - name: 计费方式
    type: number
    description: 提取 计费方式 的数值（含单位，如万元、吨等）
  - name: 计费标准及收费依据
    type: number
    description: 提取 计费标准及收费依据 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目用地规划区域
    type: string
    description: 提取 项目用地规划区域 的文本值
violations:
- expression: (SUM(簿.金额) - SUM(明细表.入账金额) > 0) || (行对账单.借贷方金额 WHERE 交易对手非官方备案账户 - 分类账.本期发生额 > 0 && 行对账单.借贷方金额 > 100000)
  description: 收入票据存根金额大于账面确认的收入，表明部分收入未入账，可能在账外核算。银行对账单出现单位未记录的收款，且收款账户未经备案，提示存在账外资金循环，大额（>10万元）风险更高。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 未在法定账簿统一登记核算经济业务
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十四号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十六条\",\n    \"内容概述\": \"各单位发生的各项经济业务事项应当在依法设置的会计账簿上统一登记、核算，不得违反本法和国家统一的会计制度的规定私设会计账簿登记、核算。\"\n  }\n]"
- expression: (票据存根.收费项目 NOT IN 合法收费项目清单及标准.批准收费项目) || (票据存根.金额 > 合法收费项目清单及标准.计费标准及收费依据*数量) || (SUM(票据存根.金额) - SUM(明细表.金额)
    > 0 && 收款银行账户非单位零余额账户或汇缴专户)
  description: 擅自设立收费项目或超标准收费，且收入未缴入法定账户，即构成违规收费账外存放。票据存根中未经批准的项目、超标准收费的差额，均指向账外资金。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 违规收费罚款摊派资金账外存放
  regulation: "[\n  {\n    \"法规名称\": \"违反行政事业性收费和罚没收入收支两条线管理规定行政处分暂行规定\",\n    \"法规文号\": \"国务院令第281号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"对违反规定擅自设立行政事业性收费项目或者设置罚没处罚的，对直接负责的主管人员和其他直接责任人员给予降级或者撤职处分。违反规定，将行政事业性收费、罚没收入截留、挪用、坐收坐支的，给予记大过处分；情节严重的，给予降级或者撤职处分。\"\
    \n  }\n]"
- expression: (信息表.单位名称 NOT IN (批准文件.批准执收单位名称) AND 信息表.执收权限截止日 >= 明细台账.征收日期) OR (协议文件 IS NULL AND 明细台账.执收单位 <> 批准文件.批准执收单位名称)
    OR (协议文件.协议有效期 < 明细台账.征收日期)
  description: 判定逻辑：1)实际征收单位不在财政部门批准的执收单位清单内，且征收时该单位权限名义上有效，属擅自变更；2)存在委托征收但无正式协议或批准文件；3)跨部门协作协议已超期仍继续征收。任意条件满足即视为违规。
  audit_item: 违反规定征收非税收入
  suspicion: 未经批准擅自改变非税收入执收单位
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"非税收入由法律、法规、规章规定的部门、单位征收；法律、法规、规章未规定征收部门、单位的，由财政部门直接征收；财政部门可以依法委托其他部门、单位征收。未经批准，不得擅自改变非税收入执收单位。\"\
    \n  }\n]"
- expression: (明细台账.征收金额 / 明细台账.计费数量) > (批准文件.批准标准（计费单位、单价） * 1.1) OR (明细台账.实收金额 < 批准文件.正常征收标准 AND 减免审批台账中无对应有效记录) OR (明细台账.实收金额
    > 批准文件.正常征收标准 AND 无合法调整文件)
  description: 允许标准上浮幅度设为10%（可按实际政策调整）。当实际收费标准超出批准标准上浮上限，或低于批准标准下限且无合法减免审批，或高于上限且无有效调整批准，均判定违规。擅自提高标准为常见加重负担行为，擅自降低标准可能导致财政收入流失。
  audit_item: 违反规定征收非税收入
  suspicion: 擅自提高或降低非税收入征收标准
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定擅自设立非税收入项目或者改变征收范围、标准、对象和期限。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n\
    \    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"单位和个人违反财政收入票据管理规定，或者有虚报、冒领、骗取财政收入"
- expression: (明细台账.实收日期 < 明细台账.应收时间) OR (ABS(明细台账.实收金额 - 批准文件.正常征收标准) > 批准文件.正常征收标准*0.10) OR (明细台账.实收金额 > 明细台账.应缴金额*1.05)
  description: 提前征收：实收日期早于政策或合同约定的应缴开始日期。多征：累计实收金额超出按进度应缴金额10%以上，或单次实收金额超出应缴金额5%且无合理解释。分期缴纳项目如一次性收取，按多征处理。
  audit_item: 违反规定征收非税收入
  suspicion: 多征或提前征收非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定擅自改变征收范围、标准、对象和期限。包括不得提前征收、多征非税收入。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范非税收入征收管理的通知\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"严禁采取一次性、集中等方式提前征收非税收入，严禁超标准、超范"
- expression: (审批台账.审批机关 NOT IN ('省级人民政府', '法律规定的有权机关') AND 明细台账.减免标识 IN ('减征','免征','缓征')) OR (明细台账.应缴金额 - 明细台账.实缴金额 > 0 AND
    审批台账.申请项目 IS NULL)
  description: 非税收入减免缓征权限通常由法律、法规或省级人民政府决定。若审批机关不在合法有权机关列表内，视为越权审批；若实缴金额小于应缴金额且无法提供合法审批记录，则视为擅自减免。合法的临时性缓缴政策需与台账记录相互印证。
  audit_item: 违反规定征收非税收入
  suspicion: 违规减征、免征、缓征非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定擅自改变征收范围、标准、对象和期限，包括减征、免征、缓征。减免非税收入应当按照管理权限报批。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十五条\",\n    \"内容概述\": \"预算收入征收部门和单位，必须依照法律、行"
- expression: (记录表.接收方名称 in (文件清单) && (记录表.转移费用 = 0 || 资产使用条款.费用约定 = '无偿使用')) && (批准文件.批准状态 != '已批准' || 评估报告.评估价值 != 资产使用条款.费用约定)
  description: 向职工持股企业调拨资产且未收取任何费用或无对价约定，同时缺少董事会关联交易批准或评估定价依据缺失的，直接构成违规无偿提供资产。
  audit_item: 资产管理方面存在的问题
  suspicion: 无偿向职工持股企业提供资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十四条\",\n    \"内容概述\": \"国有独资企业、国有独资公司、国有资本控股公司不得无偿向关联方提供资金、商品、服务或者其他资产，不得以不公平的价格与关联方进行交易。\"\n  }\n]"
- expression: (担保合同.签订日期 < 决议文件.决议日期) || (担保合同.担保金额 > 其他.金额限额 && 决议文件.审批层级 != 其他.审批层级) || (其他.需经董事会或风控委员会审批的条件 == true &&
    批准文件.批复文号 == null)
  description: 判定规则：1. 合同签订日期早于决议日期，表明存在先操作后审批；2. 担保金额超过制度规定的该层级审批限额（如总经理权限1亿，实际担保2亿），且决议机构层级不符；3. 根据公司章程或上级规定须报国资委/集团审批而未取得书面批复，即视为违规。以上任一条件满足则触发疑点。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 未按规定履行决策程序对外担保或借款
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进国有企业贯彻落实“三重一大”决策制度的意见\",\n    \"法规文号\": \"中办发〔2010〕17号\",\n    \"效力级别\": \"\
    制度文件\",\n    \"条款号\": \"二、‘三重一大’事项的主要范围\",\n    \"内容概述\": \"重大决策、重要人事任免、重大项目安排和大额度资金运作事项必须由领导班子集体作出决定，不得以传阅、会签或个别征求意见等方式代替。\"\
    \n  }\n]"
- expression: (担保对象名称、是否集团内企业标识.是否集团内企业标识 == 否 || 关联方清单.股权关系 == 无) && 批准文件.批复文号 == null
  description: 根据制度规定，为集团外企业提供担保必须取得国资委或集团总部书面批准。若被担保对象经股权穿透不属于集团内企业，且无有效批复文件，即构成违规。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 未经批准违规为集团外企业提供担保
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、严格控制融资担保对象\",\n    \"内容概述\": \"中央企业严禁对集团外无股权关系的企业提供任何形式担保。\"\n  }\n]"
- expression: (开工报告.实际开工日期 < 评价报告.批复日期) || (开工报告.实际开工日期 < 许可证.发证日期) || (开工报告.实际开工日期 < 许可证.发证日期) || (开工报告.实际开工日期 < 批准文件.批准日期)
  description: 实际开工日期早于任一法定前置许可的批准日期，即构成未批先建。重点关注环境影响评价和施工许可证的取得时间，二者为法定开工必要条件。
  audit_item: 违规开展重大工程建设
  suspicion: 未履行法定建设程序即开工建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\": \"主席令第48号（2018修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"建设单位未依法报批建设项目环境影响报告书、报告表，擅自开工建设的，由县级以上生态环境主管部门责令停止建设，处建设项目总投资额百分之一以上百分之五以下的罚款，并可以责令恢复原状。\"\
    \n  }\n]"
- expression: ( (核准文号.核准文号 IS NULL) AND (跟踪表.支出金额 > 0) ) OR ( 跟踪表.用途说明 NOT IN (核准文号.募集资金披露用途) ) OR ( (跟踪表.收款方名称 为 关联方) AND
    (跟踪表.发行价格 < 对比表.每股净资产) )
  description: 违规表达式包含三种情形：①未取得外部监管机构的注册或核准批复，也未履行内部董事会或股东会决议，便实际发行债券或新股并收到资金；②募集资金到账后，其支出用途与核准文件中披露的项目建设、补充流动资金等用途严重不符，挪作高风险投资；③增资扩股中，关联方以明显低于每股净资产的价格参与认购，涉嫌利益输送。任一条件成立即列为疑点。
