name: audit/政策文件类/分析文件
type: model
description: 从政策文件类类文档（分析文件）中提取结构化元数据。涵盖字段如：区域需求覆盖率、已有设施分布、新建必要性论证结论。文档范围包括：规划合理性分析文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 分析文件
  member_count: 1
  member_details:
  - 规划合理性分析文件
output:
  fields:
  - name: 区域需求覆盖率
    type: string
    description: 提取 区域需求覆盖率 的文本值
  - name: 已有设施分布
    type: string
    description: 提取 已有设施分布 的文本值
  - name: 新建必要性论证结论
    type: string
    description: 提取 新建必要性论证结论 的文本值
violations:
- expression: (重复建设比对分析表.重叠面积或距离 < 5 && 重复建设比对分析表.功能相似度 > 0.8) || (资金拨付和使用台账.收款单位名称对应不同资金拨付和使用台账.对应项目名称的数量 > 1) || (资金拨付和使用台账.收款单位名称对应不同资金拨付和使用台账.对应项目名称
    && 重复建设比对分析表.功能相似度 > 0.8) || (规划合理性分析文件.新建必要性论证结论 = '必要' && 规划合理性分析文件.区域需求覆盖率 < 0.6)
  description: 两设施间距离小于5公里且功能高度相似视为重复建设；同一地理坐标出现多个项目资金记录直接触发；同一供应商承接相邻同类项目且无功能互补视为拆包重复建设；必要性论证忽略已有低利用率设施仍获批准属于规划决策失当。以上任一条件满足即生成疑点。
  audit_item: “互联网+”农产品出村进城工程实施不到位
  suspicion: 仓储物流基础设施项目存在重复建设
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"政府投资项目不得重复建设，已有类似设施能够满足需求的，不得另行建设。\"\n  }\n]"
