name: audit/政策文件类/禁令文件
type: model
description: 从政策文件类类文档（禁令文件）中提取结构化元数据。涵盖字段如：禁令内容概要。文档范围包括：禁令文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 禁令文件
  member_count: 1
  member_details:
  - 禁令文件
output:
  fields:
  - name: 禁令内容概要
    type: string
    description: 提取 禁令内容概要 的文本值
violations:
- expression: (许可证.容积率 < 1.0 && 其他.实际建设形态 IN ('独栋别墅', '联排别墅')) || (出让合同.禁止性条款 LIKE '%禁止别墅%' && 许可证.建筑密度 < 30%)
  description: 容积率低于1.0且实际建筑形态为独栋或联排别墅，或土地出让合同明确禁止别墅开发而实际建筑密度低于30%，视为违规建设别墅。以‘康养社区’、‘颐养中心’等名义报批但实际建成低密独栋住宅的，均属此类。
  audit_item: 未按规定落实去库存政策措施
  suspicion: 以虚假名义违规建设别墅类项目
  regulation: "[\n  {\n    \"法规名称\": \"关于发布实施《限制用地项目目录（2012年本）》和《禁止用地项目目录（2012年本）》的通知\",\n    \"法规文号\": \"国土资发〔2012〕98号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"《禁止用地项目目录》中“别墅类房地产开发项目”\",\n    \"内容概述\": \"禁止用地项目目录明确将别墅类房地产开发项目列为禁止用地项目，任何单位不得批准供地。\"\
    \n  }\n]"
