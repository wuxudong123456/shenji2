name: audit/政策文件类/任职文件
type: model
description: 从政策文件类类文档（任职文件）中提取结构化元数据。涵盖字段如：任命职务、任职日期、姓名、职务、职级、身份证号。文档范围包括：其他管理人员任职文件、理事长任职文件、领导干部任职文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 任职文件
  member_count: 1
  member_details:
  - 其他管理人员任职文件
  - 理事长任职文件
  - 领导干部任职文件
output:
  fields:
  - name: 任命职务
    type: string
    description: 提取 任命职务 的文本值
  - name: 任职日期
    type: date
    description: 提取 任职日期 的日期值，格式 YYYY-MM-DD
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 职务
    type: string
    description: 提取 职务 的文本值
  - name: 职级
    type: string
    description: 提取 职级 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
violations:
- expression: (COUNT(职务名称、职级、人数名册.职级) > 核定领导职数、各岗位最高职级.核定领导职数) OR (存在 职务名称、职级、人数名册.职级 > 核定领导职数、各岗位最高职级.各岗位最高职级)
  description: 同一职级实配人数超过核定领导职数，或领导干部的职级高于岗位规定的最高职级（低职高配），均属违规。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 超职数或超规格配备领导干部
  regulation: "[\n  {\n    \"法规名称\": \"党政领导干部选拔任用工作条例\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第五十三条第（十）项\"\
    ,\n    \"内容概述\": \"不准超职数配备、超机构规格提拔领导干部，或者违反规定擅自设置职务名称。\"\n  }\n]"
- expression: COUNT(查询记录.任职企业名称 FOR EACH 查询记录.担任职务) > 1 && 查询记录.任职企业名称 IN (其他合作社列表) && 查询记录.任职状态 == '在业'
  description: 理事长在同一期间在其他合作社担任监事、理事等职务，且该合作社处于在业状态，即判定为违规兼职。通过人员姓名、身份证号跨企业比对。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 理事长违规在其他合作社兼职
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n   \
    \ \"条款号\": \"第三十七条\",\n    \"内容概述\": \"农民专业合作社的理事长、理事、经理不得兼任业务性质相同的其他农民专业合作社的理事长、理事、监事、经理。\"\n  }\n]"
- expression: (任职文件.身份证号 IN 名册.身份证号) && (登记表.是否审批 != '已审批' || 登记表 IS NULL) && (工资表.发放金额 > 0)
  description: 合作社任职人员身份证号与公职人员库匹配，且未履行审批程序或存在领取报酬行为，即判定为违规兼职。触发条件：身份匹配且（无审批记录或领取报酬）。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 公务人员违规担任合作社职务
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"中华人民共和国主席令第二十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十九条\",\n    \"内容概述\": \"公务员不得违反有关规定从事或者参与营利性活动，在企业或者其他营利性组织中兼任职务。\"\n  }\n]"
