name: audit/政策文件类/卡片
type: model
description: 从政策文件类类文档（卡片）中提取结构化元数据。涵盖字段如：使用状况、利用率。文档范围包括：固定资产卡片等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 卡片
  member_count: 1
  member_details:
  - 固定资产卡片
output:
  fields:
  - name: 使用状况
    type: string
    description: 提取 使用状况 的文本值
  - name: 利用率
    type: string
    description: 提取 利用率 的文本值
violations:
- expression: 资产清单.处置状态 == '未处置' && (当前日期 - 处置方案.计划处置完成时间 > 365) && 卡片.利用率 < 30%
  description: 资产被列入处置清单后超过1年仍未完成处置，且资产利用率仍低于30%，表明处置进度严重滞后。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
  suspicion: 低效无效资产处置进度缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中央企业资产减值准备财务核销工作规则\",\n    \"法规文号\": \"国资发评价〔2005〕67号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第五条\",\n    \"内容概述\": \"企业对已发生减值的资产应及时确认减值损失，并按规定程序核销或处置，不得长期挂账。\"\n  }\n]"
