violations:
- expression: (单位清单.单位编码 NOT IN 单位清单.单位编码) || (说明文件.项目编码 NOT IN 资金清单.项目编码)
  description: 将应编入的单位清单与实际编入的单位清单按单位编码（或统一社会信用代码）进行比对，若存在应编入单位未出现在实际编入清单中，判定为遗漏单位；同理，应编入的资金项目（如专项资金）未出现在实际编入资金清单中，判定为遗漏资金。两者满足任一条件即触发疑点。
  audit_item: 决算报告编报事项不准确
  suspicion: 应纳入决算编报范围的单位或资金遗漏未编入
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"各部门应当按照财政部门的要求，及时向预算单位布置决算编制工作，并督促其准确编制决算。各部门应当将本部门所属各单位全部纳入决算编制范围，认真审核汇总本部门决算，确保数据完整、真实、准确。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第"
- expression: ({采集表.因素名称} NOT IN ({管理办法.规定的分配因素清单})) || ({采集表.权重设置} NOT BETWEEN {管理办法.各因素权重范围} AND {管理办法.资金上限}) || ({说明文件.实际采用的评分因素}
    IS NULL) && ({分配方案.审议通过的分配因素} IS NULL)
  description: 以上级管理办法规定的因素清单和权重范围为基准，采集表中出现的因素或权重若超出授权，且会议纪要无合规审批记录，即判为违规。缺少评分规则专家论证等合理性说明，同样触发疑点。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 分配因素不合规或评分规则不科学
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条、第十一条\",\n    \"内容概述\": \"专项转移支付应科学设置资金分配方法；采用因素法等，因素选择、权重设定应当科学合理。\"\n  }\n]"
- expression: (审批表.前置条件清单（如环评批复、用地预审、规划许可）及文件编号 > 审批表.审批日期) OR (审批表.前置条件清单（如环评批复、用地预审、规划许可）及文件编号 IS NULL AND 说明文件.必须取得顺序要求)
    OR (验收报告.实际开工日期 < 审批表.前置条件清单（如环评批复、用地预审、规划许可）及文件编号)
  description: 条件1：关键前置文件（如环评批复）的批准日期晚于项目立项审批日期；条件2：立项审批表中必填的前置文件编号缺失；条件3：项目实际开工日期早于前置条件取得日期，表明未批先建。三者满足任一即构成违规。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 未取得法定前置审批条件违规批准建设项目
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\": \"中华人民共和国主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十五条\",\n    \"内容概述\": \"建设项目的环境影响评价文件未依法经审批部门审查或者审查后未予批准的，建设单位不得开工建设。\"\n  },\n  {\n    \"法规名称\": \"政府投资条例\"\
    ,\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十二条\",\n    \"内容概述\": \"项目单位应当依法办理相关审批手续，在取得规定的前置审批文件"
- expression: (损失浪费事项统计台账.损失金额 > 企业净资产×0.005) || (重大项目执行进度跟踪表.超概算比例 > 0.2 && 未经追加审批) || (资源配置效率分析表.产能利用率 < 0.4) || (重大投资项目可行性研究报告.预期市场收益
    / 重大投资项目可行性研究报告.项目预期收益 < 0.5)
  description: 1.单个战略相关项目造成的损失超过净资产的0.5%即触发重大损失预警；2.超概算20%以上且缺少有效的追加审批，表明投资失控；3.建成后产能利用率不足40%，说明资产闲置浪费严重；4.实际收益不到可研预期的一半，反映决策严重失误。
  audit_item: 企业发展战略规划的制定、执行和效果
  suspicion: 战略规划执行中存在重大损失浪费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于建立国有企业违规经营投资责任追究制度的意见\",\n    \"法规文号\": \"国办发〔2016〕63号\",\n    \"效力级别\": \"\
    国务院规范性文件\",\n    \"条款号\": \"二、（一）\",\n    \"内容概述\": \"在投资并购方面，未按规定进行可行性研究或风险分析、投资概算严重偏离实际、项目管理混乱致使资产损失等情形，应当追究有关人员责任。\"\
    \n  }\n]"
- expression: 财务报表.资产负债率 > 制度文件.分层设定负债率指标的要求 && !分解表.子企业名称.contains(该子公司名称)
  description: 当某一子公司资产负债率超出集团统一规定或该层级应有的管控标准，而该子公司未被纳入考核指标分解表覆盖范围时，判定为违规。旨在发现通过规避考核而放任高风险子企业杠杆失控的问题。
  audit_item: 未按规定落实去杠杆政策措施
  suspicion: 未按规定将子企业资产负债率纳入考核
  regulation: "[\n  {\n    \"法规名称\": \"中央企业资产负债率分类管控工作方案\",\n    \"法规文号\": \"国资发财管〔2019〕132号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条第（二）款\",\n    \"内容概述\": \"中央企业应将各级子企业资产负债率纳入管控体系，实施分类管理和考核，不得遗漏重要子企业，确保全级次杠杆水平可控。\"\n  }\n]"
- expression: DATEDIFF(禁捕工作月度进度统计表.实际完成日期, 分阶段禁捕目标的时间节点安排表.计划完成日期, 'day') > 90
  description: 对比各阶段任务的实际完成日期与计划完成日期，若滞后天数超过90天，则判定为重大滞后。已审批的合理延期天数可从滞后天数中扣除，但延期申请需经上级部门批复同意。
  audit_item: 任务目标未按时完成
  suspicion: 分阶段禁捕任务推进滞后
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分“实施重点水域禁捕”\",\n    \"内容概述\": \"要求2019年底前完成水生生物保护区渔民退捕，2020年底前完成长江干流和重要支流除保护区以外水域的渔民退捕，各地需严格按时间节点推进禁捕工作。\"\
    \n  }\n]"
- expression: (退捕渔民信息登记台账.已建档渔民数 / 退捕渔民建档立卡工作制度.应建档渔民总数 * 100 < 100) && (DATEDIFF(CURRENT_DATE, 退捕渔民建档立卡工作制度.建档立卡截止日期, 'day')
    > 30)
  description: 在建档立卡制度规定的截止日期之后，若实际建档完成率仍未达到100%，且超期天数超过30天，即判定为未按时完成。建档完成率=已建档数÷应建档总数×100%。
  audit_item: 任务目标未按时完成
  suspicion: 未按时完成退捕渔民建档立卡工作
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农办计财〔2019〕8号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条“精准识别退捕渔船渔民”\",\n    \"内容概述\": \"要求各地对退捕渔船和渔民进行精准识别，建档立卡，做到一船一档、一户一档，为实施补偿和转产安置提供依据。\"\
    \n  }\n]"
- expression: (渔船登记注销明细表.已封存渔船数量 / 渔船登记注销明细表.渔船总登记数 * 100 < 100) && (DATEDIFF(CURRENT_DATE, 捕捞渔船封存管理实施细则.渔船封存截止日期, 'day')
    > 0)
  description: 在封存管理实施细则规定的截止日期后，若已封存渔船数量未达到登记总数100%，即判定为未按时完成。表达式未设定宽限期，因渔船封存是禁捕生效的基本前提，必须按时完成。
  audit_item: 任务目标未按时完成
  suspicion: 未按时完成捕捞渔船全部封存
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分“实施重点水域禁捕”\",\n    \"内容概述\": \"要求科学划定禁捕区域，加快渔船退捕和封存处置，确保如期实现禁捕。\"\n  }\n]"
- expression: (NVL(禁捕工作月度进度统计表.实际完成日期, '2099-12-31') - 分阶段禁捕目标的时间节点安排表.计划完成日期) > 0 && 延期申请或未完成情况说明文件.有效延期批复 IS NULL && 禁捕工作月度进度统计表.完成比例
    < 100
  description: 实际完成日期晚于计划完成日期，且无上级批准的延期文件，同时阶段完成比例未达100%，判定为推进滞后。超期3个月以上为严重滞后。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 分阶段实现长江全面禁捕工作推进慢
