name: audit/政策文件类/说明文件
type: model
description: 从政策文件类类文档（说明文件）中提取结构化元数据。涵盖字段如：不可抗力证明、与原管辖业务关联说明、主营业务关键词、会议纪要、保费补贴标准、协调机制说明、占用场地名称、占用期限。文档范围包括：业务范围说明文件、信贷保险政策执行情况说明文件、分配因素评分规则说明文件、国有资产资产性质说明文件、多规合一平台衔接说明文件、子企业资产负债率考核纳入情况说明文件、就业补助资金结转结余情况说明文件、应编入决算的资金范围说明文件、延期申请或未完成情况说明文件、建设项目审批流程说明文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 会议
- 明细
- 补贴
- 资产
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 说明文件
  member_count: 1
  member_details:
  - 业务范围说明文件
  - 信贷保险政策执行情况说明文件
  - 分配因素评分规则说明文件
  - 国有资产资产性质说明文件
  - 多规合一平台衔接说明文件
  - 子企业资产负债率考核纳入情况说明文件
  - 就业补助资金结转结余情况说明文件
  - 应编入决算的资金范围说明文件
  - 延期申请或未完成情况说明文件
  - 建设项目审批流程说明文件
  - 文化设施被占用情况说明文件
  - 用电优惠政策执行情况说明文件
  - 绩效指标分解与量化说明文件
  - 资产处置专项说明文件
  - 资金整合使用情况说明文件
  - 部门间规划衔接性说明文件
  - 项目进度延期说明文件
