name: audit/政策文件类/核定文件
type: model
description: 从政策文件类类文档（核定文件）中提取结构化元数据。涵盖字段如：保险费率、允许排放污染物种类、单位名称、单套面积上限、核定产能、核定单价上限、核定年度排放总量、核定编制数。文档范围包括：保险机构农业保险费率核定文件、公务用车编制核定文件、排放总量核定文件、政府关于经济适用住房的价格核定文件、煤矿生产能力核定文件、编制核定文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 核定文件
  member_count: 1
  member_details:
  - 保险机构农业保险费率核定文件
  - 公务用车编制核定文件
  - 排放总量核定文件
  - 政府关于经济适用住房的价格核定文件
  - 煤矿生产能力核定文件
  - 编制核定文件
output:
  fields:
  - name: 保险费率
    type: number
    description: 提取 保险费率 的数值（含单位，如万元、吨等）
  - name: 允许排放污染物种类
    type: string
    description: 提取 允许排放污染物种类 的文本值
  - name: 单位名称
    type: string
    description: 提取 单位名称 的文本值
  - name: 单套面积上限
    type: string
    description: 提取 单套面积上限 的文本值
  - name: 核定产能
    type: string
    description: 提取 核定产能 的文本值
  - name: 核定单价上限
    type: number
    description: 提取 核定单价上限 的数值（含单位，如万元、吨等）
  - name: 核定年度排放总量
    type: date
    description: 提取 核定年度排放总量 的日期值，格式 YYYY-MM-DD
  - name: 核定编制数
    type: string
    description: 提取 核定编制数 的文本值
  - name: 矿井名称
    type: string
    description: 提取 矿井名称 的文本值
violations:
- expression: COUNT(登记清单.车牌号) > 核定编制数.核定编制数 || (登记清单.价格 > 标准.价格上限 && 记录表.是否特批 != '是') || (登记清单.排量 > 标准.排量上限 && 记录表.是否特批 !=
    '是')
  description: 实有车辆数超过核定编制数即违规；车辆单价或排量超出当地规定上限，且无合规特批手续的，判定为超标准配备。
  audit_item: 违规配备公务用车
  suspicion: 超编制超标准配备公务用车
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条、第九条、第十条\",\n    \"内容概述\": \"公务用车编制根据机构设置和人员编制确定，不得超编制配备；公务用车配备标准由省级主管部门制定，党政机关不得超标准配备；确因特殊情况需超标准配备的，须报省级公务用车主管部门审批。\"\
    \n  }\n]"
- expression: SUM(日期、原煤产量（吨）.原煤产量（吨） GROUP BY 年) > 矿井名称、核定产能（万吨/年）.核定产能（万吨/年） * 1.1 OR （日期、原煤产量（吨）.原煤产量（吨） > 矿井名称、核定产能（万吨/年）.核定产能（万吨/年）/12
    * 1.1 FOR 某月） AND 处罚日期、超产比例、处罚措施 IS EMPTY
  description: 煤矿年产量超过核定产能10%即属超能力生产，月产量超过核定月产能的10%且未被处罚记录覆盖的，表明企业有意隐瞒超产。表达式同时检查总量和月均超产，并关联处罚记录判断是否存在监管缺失。
  audit_item: 未按规定落实去产能政策措施
  suspicion: 煤矿企业超核定能力违规生产
  regulation: "[\n  {\n    \"法规名称\": \"煤矿生产能力管理办法和核定标准\",\n    \"法规文号\": \"安监总煤监〔2014〕112号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十四条\",\n    \"内容概述\": \"煤矿应当按照核定生产能力组织生产，严禁超能力生产，年度原煤产量不得超过核定生产能力的110%。\"\n  },\n  {\n    \"法规名称\": \"\
    国务院关于预防煤矿生产安全事故的特别规定\",\n    \"法规文号\": \"国务院令第446号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"\
    煤矿超能力、超强度或"
- expression: 算申报表.申报人数（或测算依据人数） > 核定文件.核定编制数 || 算申报表.申报人数（或测算依据人数） > 名册.在编实有人数
  description: 将预算申报表中作为经费测算基础的申报人数与编制部门核定的编制数、人事部门提供的实际在编人数逐一比对。若申报人数大于核定编制数或大于实际在编人数，即存在多报人数套取公用经费的嫌疑；申报人数偏差率超过0%即触发疑点预警，偏差越大违规风险越高。
  audit_item: 审计事项深入研究
  suspicion: 未按人员编制数申报日常公用经费预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号（2014年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第三十二条\",\n    \"内容概述\": \"各部门、各单位编制预算草案，应当真实、准确，按照政府收支分类科目、预算支出标准和要求以及绩效目标管理规定编制；预算编制不实、不准确的，应予纠正。\"\n\
    \  }\n]"
- expression: (验收报告.实际竣工面积 > 90) || (登记表.单套售价 > 核定文件.核定单价上限 * 1.05) || (核算表.单方造价超出当地经适房造价指导标准30%以上)
  description: 经济适用住房建设须严格执行面积标准（一般不超过90平方米）和价格核定。若单套面积超标、销售价突破核定上限或建设成本异常偏高，即触发疑点。采用超面积、溢价超5%、成本超指导标准30%等量化阈值判定。
  audit_item: 违规集资合作建房
  suspicion: 未按经济适用住房规定建设或销售
  regulation: "[\n  {\n    \"法规名称\": \"经济适用住房管理办法\",\n    \"法规文号\": \"建住房〔2007〕258号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条、第二十条\",\n    \"内容概述\": \"经济适用住房单套建筑面积控制在60平方米左右，政府应根据情况确定建设规模和各种套型比例；销售价格以保本微利为原则，实行政府指导价，不得擅自提价。\"\n  }\n]"
