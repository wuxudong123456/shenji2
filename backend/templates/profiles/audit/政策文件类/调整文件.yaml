name: audit/政策文件类/调整文件
type: model
description: 从政策文件类类文档（调整文件）中提取结构化元数据。涵盖字段如：专项资金拨付计划、人员经费预算批复数、发文日期、国有资产收入预算科目金额、年内调整预算数、批准人/签字人、批复概算总投资、调整内容。文档范围包括：政策调整文件、近三年社会救助对象动态调整文件、项目概算调整文件、预算调整文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 人员
- 资产
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 调整文件
  member_count: 1
  member_details:
  - 政策调整文件
  - 近三年社会救助对象动态调整文件
  - 项目概算调整文件
  - 预算调整文件
output:
  fields:
  - name: 专项资金拨付计划
    type: string
    description: 提取 专项资金拨付计划 的文本值
  - name: 人员经费预算批复数
    type: number
    description: 提取 人员经费预算批复数 的数值（含单位，如万元、吨等）
  - name: 发文日期
    type: date
    description: 提取 发文日期 的日期值，格式 YYYY-MM-DD
  - name: 国有资产收入预算科目金额
    type: number
    description: 提取 国有资产收入预算科目金额 的数值（含单位，如万元、吨等）
  - name: 年内调整预算数
    type: number
    description: 提取 年内调整预算数 的数值（含单位，如万元、吨等）
  - name: 批准人-签字人
    type: string
    description: 提取 批准人-签字人 的文本值
  - name: 批复概算总投资
    type: string
    description: 提取 批复概算总投资 的文本值
  - name: 调整内容
    type: string
    description: 提取 调整内容 的文本值
  - name: 调整原因
    type: string
    description: 提取 调整原因 的文本值
  - name: 调整名单
    type: string
    description: 提取 调整名单 的文本值
  - name: 调整时间
    type: date
    description: 提取 调整时间 的日期值，格式 YYYY-MM-DD
  - name: 非税收入-国有资本经营收益预算金额
    type: number
    description: 提取 非税收入-国有资本经营收益预算金额 的数值（含单位，如万元、吨等）
  - name: 项目预算金额
    type: number
    description: 提取 项目预算金额 的数值（含单位，如万元、吨等）
violations:
- expression: (社会救助资金发放明细表.身份证号 IN (死亡人员信息库.身份证号)) || (社会救助资金发放明细表.身份证号 IN (财政供养人员信息库.身份证号)) || (脱贫人口与救助对象交叉比对清单.退出时间 IS NOT
    NULL && 社会救助资金发放明细表.发放时间 > DATEADD(DAY, 30, 脱贫人口与救助对象交叉比对清单.退出时间) && 社会救助资金发放明细表.发放状态 = '正常') || (特殊群体身份认定数据库.身份类型 = '低保'
    && 家庭收入核查信息.实际收入 > 当地低保标准 * 1.2 && 社会救助资金发放明细表.发放状态 = '正常')
  description: 表达式包含四条或条件规则：①救助对象身份证号存在于死亡人员库中，判定为死亡冒领；②身份证号存在于财政供养人员库中，判定为公职人员违规享受；③脱贫交叉清单中已记录退出时间，且发放时间超出退出后30天缓冲期仍正常发放，判定为应退未退；④低保对象实际收入超过低保标准1.2倍以上仍持续发放，判定为收入超标未退出。阈值1.2倍为收入合规弹性上限，缓冲期30天参照动态调整一般时限。满足任一条件即生成疑点。
  audit_item: 防止返贫帮扶政策落实不到位
  suspicion: 社会救助资金发放对象不合规
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十一条、第十三条\",\n    \"内容概述\": \"申请最低生活保障需按规定程序审核；县级民政部门及乡镇、街道应对低保家庭实行动态管理，定期核查保障对象家庭财产与收入，对不再符合条件的及时清退。\"\n  },\n  {\n \
    \   \"法规名称\": \"关于进一步加强和改进最低生活保障工作的意见\",\n    \"法规文号\": \"国发〔2012〕45号\",\n    \"效力级别\": \"国务院规范性文件\",\n    \"条款号\": \"\
    第三条\",\n"
- expression: (执行跟踪表.决策内容 IN ('贷款额度调整','利率调整','缴存比例调整') AND 执行跟踪表.审批人 != '住房公积金管理委员会' AND 执行跟踪表.关联会议记录编号 IS NULL)
  description: 涉及贷款额度、利率、缴存比例等重大政策调整必须经管委会集体决议。若调整文件批准人为个人（如主任）且无法匹配到对应的会议决议记录，则视为未经集体决议即执行。
  audit_item: 住房公积金决策机构未按规定履职
  suspicion: 重大事项未经管委会集体决议而执行
  regulation: "[\n  {\n    \"法规名称\": \"《住房公积金管理条例》\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第九条、第十条\",\n    \"内容概述\": \"管委会负责确定住房公积金的最高贷款额度，审批住房公积金归集、使用计划及其执行情况报告，重大事项须经集体审议。\"\n  }\n]"
