name: audit/政策文件类/专项文件
type: model
description: 从政策文件类类文档（专项文件）中提取结构化元数据。涵盖字段如：保费补贴比例、保障水平、应保品种、理赔标准及时限要求。文档范围包括：农业保险支持政策的国家专项文件、农业保险支持政策的地方专项文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 补贴
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 专项文件
  member_count: 1
  member_details:
  - 农业保险支持政策的国家专项文件
  - 农业保险支持政策的地方专项文件
output:
  fields:
  - name: 保费补贴比例
    type: number
    description: 提取 保费补贴比例 的数值（含单位，如万元、吨等）
  - name: 保障水平
    type: string
    description: 提取 保障水平 的文本值
  - name: 应保品种
    type: string
    description: 提取 应保品种 的文本值
  - name: 理赔标准及时限要求
    type: string
    description: 提取 理赔标准及时限要求 的文本值
violations:
- expression: (明细台账.保费总额 - 明细台账.实际缴纳保费) / 明细台账.保费总额 < 保费补贴比例、应保品种、保障水平、理赔标准及时限要求.保费补贴比例 * 0.9 || 明细台账.理赔支付日期 IS NULL AND 明细台账.报案日期
    < GETDATE()-90 || (明细台账.统一社会信用代码 NOT IN (明细台账.统一社会信用代码) && 明细台账.种植/养殖品种 IN 保费补贴比例、应保品种、保障水平、理赔标准及时限要求.应保品种)
  description: 若新型经营主体获得的保费补贴实际到账比例低于政策规定比例的90%，或出险后超过90天仍未赔付，或本应纳入保险覆盖范围的新型主体未出现在任何投保记录中，均判定为政策落实不到位。补贴比例、赔付时限和应保品种以地方专项文件规定为准。
  audit_item: 新型经营主体支持政策落实不到位
  suspicion: 农业保险支持政策落实不到位
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号（2016修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十三条、第十七条\",\n    \"内容概述\": \"各级财政按照规定给予农业保险费补贴，保险机构应当在与被保险人达成赔偿协议后10日内，将赔偿保险金支付给被保险人；任何单位和个人不得非法干预保险机构履行赔偿义务。\"\n\
    \  }\n]"
