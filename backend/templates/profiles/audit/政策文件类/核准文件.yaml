name: audit/政策文件类/核准文件
type: model
description: 从政策文件类类文档（核准文件）中提取结构化元数据。涵盖字段如：备案/核准编号、批准日期、项目批准日期。文档范围包括：企业投资项目备案证或核准文件、核准文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 核准文件
  member_count: 1
  member_details:
  - 企业投资项目备案证或核准文件
  - 核准文件
output:
  fields:
  - name: 备案-核准编号
    type: string
    description: 提取 备案-核准编号 的文本值
  - name: 批准日期
    type: date
    description: 提取 批准日期 的日期值，格式 YYYY-MM-DD
  - name: 项目批准日期
    type: date
    description: 提取 项目批准日期 的日期值，格式 YYYY-MM-DD
violations:
- expression: (跟踪表.备案/核准编号 IS NULL OR 跟踪表.实际完成日 IS NULL) && 评估报告.报告出具日期 <= 跟踪表.交易实施日 OR (跟踪表.实际完成日 < 评估报告.报告出具日期) OR (ABS(实际完成日
    - 评估报告出具日) > 设定时限阈值)
  description: 评估报告出具后、交易实施前未完成备案/核准，或备案/核准日期早于报告出具日期（时间倒置），或完成日期与报告出具日间隔超过规定时限（如10个工作日），均属违规。阈值参照被审计单位内部制度及国家规定。
  audit_item: 违反国有资产评估相关规定
  suspicion: 国有资产评估未经核准或未按规定备案
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产评估管理暂行办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第12号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十七条、第二十条\",\n    \"内容概述\": \"第十七条：资产评估项目的核准按照下列程序执行：...（三）国有资产监督管理机构或其所出资企业自收到核准申请后，在20个工作日内完成核准...第二十条：企业收到资产评估机构出具的评估报告后，应当逐级上报备案，自评估基准日起8个月内提出备案申请。\"\
    \n  }\n]"
- expression: (环评批复日期 IS NULL) || (许可证.开工日期 < 环评批复日期.环评批复日期)
  description: 若环评批复文件缺失，即项目未依法开展环境影响评价；若施工许可证载明的开工日期早于环评批复日期，则属于“未批先建”。两者满足其一即构成违规。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 未取得环评批复擅自开工建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\": \"主席令第二十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十五条\",\n    \"内容概述\": \"建设项目的环境影响评价文件未依法经审批部门审查或者审查后未予批准的，建设单位不得开工建设。\"\n  }\n]"
