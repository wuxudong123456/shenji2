name: audit/政策文件类/文件
type: model
description: 从政策文件类类文档（文件）中提取结构化元数据。涵盖字段如：是否要求制定收费标准、核准日期。文档范围包括：各级政府关于农村公益性殡葬政策的文件、项目核准（备案）文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 文件
  member_count: 1
  member_details:
  - 各级政府关于农村公益性殡葬政策的文件
  - 项目核准（备案）文件
output:
  fields:
  - name: 是否要求制定收费标准
    type: number
    description: 提取 是否要求制定收费标准 的数值（含单位，如万元、吨等）
  - name: 核准日期
    type: date
    description: 提取 核准日期 的日期值，格式 YYYY-MM-DD
violations:
- expression: ( 跟踪表.决策文号 IS NULL  OR  跟踪表.决策文号 == '' )  || ( 跟踪表.决策主体类型 != 管理制度.决策权限划分条款 ) || ( ABS( DATEDIFF( 文件.合同签署日期,  跟踪表.决策通过日期
    ) ) < 0  ) || ( 记录表.审批通过日期  <  跟踪表.决策通过日期 )
  description: 本表达式检测四种违规场景：1.决策文号为空，代表程序缺失；2.决策主体类型与内部制度规定的权限不符，例如应由股东会决策的事项由董事会代行；3.合同签署日期早于决策通过日期，属于典型的“先斩后奏”程序倒置，差值为负；4.关键业务审批节点完成日期早于正式决策日期，侧面印证决策程序为事后补办。满足任一条件即判定为疑点。
  audit_item: 违规处置重大资产
  suspicion: 未按规定履行决策程序转让资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十条、第三十一条、第三十二条\",\n    \"内容概述\": \"国家出资企业进行重大投资、为他人提供大额担保、转让重大财产等重大事项，应当遵守法律、行政法规以及企业章程的规定，不得损害出资人和债权人的权益，并需经其履行出资人职责的机构或股东会、董事会决定。\"\
    \n  }\n]"
- expression: ( (分析表.评估价值 - 分析表.实际交易价格) / 分析表.评估价值 ) > 0.1  && 文件.交易价格审批层级 不符合 管理制度.价格审批权限
  description: 设定交易价格低于评估价值10%为异常阈值。当差异率超过10%，且该折价幅度未按内部管理规定经过对应层级（如董事会或股东会）的特殊审批，则判定为违规低价转让。该表达式需在评估报告在合同签署时处于有效期内（通常为1年）的前提下使用。
  audit_item: 违规处置重大资产
  suspicion: 违规决策低价转让国有资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十五条\",\n    \"内容概述\": \"国有资产转让应当以依法评估的、经履行出资人职责的机构认可或者由履行出资人职责的机构报经本级人民政府核准的价格为依据，合理确定最低转让价格。\"\n  },\n  {\n    \"法规名称\"\
    : \"国有资产评估管理办法\",\n    \"法规文号\": \"国务院令第91号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三条、第四条\",\n    \"内容概述\": \"国有资产占有"
- expression: ( 关联方交易明细表.交易对手名称 IN (关联方清单.关联方名称) ) && ( 关联方交易明细表.定价依据及公允性说明 != '独立第三方评估' ) && ( ABS(关联方交易明细表.交易价格 - 评估报告.评估价值)
    / 评估报告.评估价值 > 0.05 )
  description: 本表达式识别与关联方交易且定价不公允的疑点。首先判定交易对手是否为内部清单认定的关联方，然后核查其定价依据是否独立于交易双方。若定价并非基于独立第三方评估，且最终成交价格与独立评估价值偏差超过5%，则高度怀疑该交易为通过非公允价格向关联方输送利益。
  audit_item: 违规处置重大资产
  suspicion: 违规决策通过关联方交易转移资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"国家出资企业的关联方不得利用与国家出资企业之间的交易，谋取不当利益，损害国家出资企业利益。\"\n  },\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\"\
    ,\n    \"法规文号\": \"国务院国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"企业国有资产交易发生关联交易的，应当符合国"
- expression: ( 受让方名称、最终控制人国籍、标的企业所属行业代码、合规审查结论.标的企业所属行业代码 IN (禁止投资领域条目、限制投资领域及股比限制.禁止投资领域条目) ) && ( 禁止投资领域条目、限制投资领域及股比限制.特殊审批文件文号
    IS NULL || 禁止投资领域条目、限制投资领域及股比限制.特殊审批文件文号 == '' )
  description: 该表达式检测外资受让方是否违规进入禁止类投资领域。首先，将交易标的所属行业代码与国务院发布的最新版《外商投资准入特别管理措施（负面清单）》中的禁止类行业代码进行精确比对。若匹配，则核查企业是否持有国务院等相关最高权限机构的特批文件。若无任何审批文件，直接定性为严重违规。对于限制类领域，则需进一步验证是否有审批，且外资股比是否超出限制。
  audit_item: 违规处置重大资产
  suspicion: 违规向外资方转让禁止领域资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国外商投资法\",\n    \"法规文号\": \"主席令第26号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"外国投资者并购中国境内企业或者以其他方式参与经营者集中的，应当依照反垄断法的规定接受经营者集中审查。外商投资准入负面清单规定禁止投资的领域，外国投资者不得投资。\"\n  },\n \
    \ {\n    \"法规名称\": \"外商投资准入特别管理措施（负面清单）\",\n    \"法规文号\": \"国家发展和改革委员会 商务部令\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"全文\","
- expression: (开工报告.实际开工日期 < 评价报告.批复日期) || (开工报告.实际开工日期 < 许可证.发证日期) || (开工报告.实际开工日期 < 许可证.发证日期) || (开工报告.实际开工日期 < 批准文件.批准日期)
  description: 实际开工日期早于任一法定前置许可的批准日期，即构成未批先建。重点关注环境影响评价和施工许可证的取得时间，二者为法定开工必要条件。
  audit_item: 违规开展重大工程建设
  suspicion: 未履行法定建设程序即开工建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\": \"主席令第48号（2018修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"建设单位未依法报批建设项目环境影响报告书、报告表，擅自开工建设的，由县级以上生态环境主管部门责令停止建设，处建设项目总投资额百分之一以上百分之五以下的罚款，并可以责令恢复原状。\"\
    \n  }\n]"
- expression: (批准收费标准.文件不存在) || (批准收费标准.收费标准内容 IS NULL) || (批准收费标准.收费标准内容 = '') && (实际收费记录.实际收费项目及金额 > 0)
  description: 若无法提供物价部门正式批复的收费标准文件，或文件中未列明任何具体收费项目及金额，且公墓实际存在收费行为，则直接判定为未制定收费标准。
  audit_item: 农村公益性殡葬政策未有效落实
  suspicion: 未制定农村公益性安葬设施收费标准
  regulation: "[\n  {\n    \"法规名称\": \"殡葬管理条例\",\n    \"法规文号\": \"国务院令第628号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条、第十条\"\
    ,\n    \"内容概述\": \"农村公益性墓地的墓穴用地不得出售给村民以外人员，其收费标准应当经县级以上地方人民政府价格主管部门会同民政部门核定。\"\n  }\n]"
- expression: (成员台账.成员身份状态 != '已确认' AND 成员台账.户籍类别='本村户籍') OR (成员台账.确认依据 NOT IN ('户籍、土地承包、贡献等') AND 确认办法.确认标准存在矛盾) OR (公示记录.公示天数
    < 7 AND 成员确认办法.公示要求天数 >= 7) OR (成员台账.成员身份状态='已确认' AND 成员台账.身份证号无关联户籍记录)
  description: 符合确认条件（如本村户籍、享有土地承包权）但未确认，或确认依据不符合政策要求，或公示天数不足，或疑似虚假确认（无关联户籍记录）时，视为成员身份确认不精准。公示天数阈值以各地规定为准，一般不少于7天。
  audit_item: 集体经营性资产产权制度改革不到位
  suspicion: 集体经济组织成员身份未确认或确认不精准
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四部分第（二）条\",\n    \"内容概述\": \"确认农村集体经济组织成员身份。依据有关法律法规，按照尊重历史、兼顾现实、程序规范、群众认可的原则，统筹考虑户籍关系、农村土地承包关系、对集体积累的贡献等因素，协调平衡各方利益。\"\
    \n  }\n]"
