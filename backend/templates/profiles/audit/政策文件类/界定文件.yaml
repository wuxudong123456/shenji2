name: audit/政策文件类/界定文件
type: model
description: 从政策文件类类文档（界定文件）中提取结构化元数据。涵盖字段如：主业目录、养护与新建的工程量界定标准、国资委批复的主业范围关键词。文档范围包括：主业范围界定文件、普通公路养护与新建项目分类界定文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 工程
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 界定文件
  member_count: 1
  member_details:
  - 主业范围界定文件
  - 普通公路养护与新建项目分类界定文件
output:
  fields:
  - name: 主业目录
    type: string
    description: 提取 主业目录 的文本值
  - name: 养护与新建的工程量界定标准
    type: string
    description: 提取 养护与新建的工程量界定标准 的文本值
  - name: 国资委批复的主业范围关键词
    type: string
    description: 提取 国资委批复的主业范围关键词 的文本值
violations:
- expression: SELECT 投资协议.项目名称, 投资协议.投资标的, 统计表.与主业的关联度描述 FROM 投资协议 INNER JOIN 调查报告 ON 投资协议.投资项目最终标的公司及业务描述 = 调查报告.被投资企业的实际经营范围
    LEFT JOIN 国资委批复的主业范围关键词、主业目录 ON ... WHERE (调查报告.被投资企业的实际经营范围 NOT LIKE '%'||国资委批复的主业范围关键词、主业目录.国资委批复的主业范围关键词||'%' AND 统计表.与主业的关联度描述
    IS NULL) || 调查报告.被投资企业的实际经营范围 REGEXP MATCH (负面清单.禁止及限制类投
  description: 该表达式通过模糊匹配，筛查投资标的公司的工商注册经营范围，与企业经国资委认定的主业范围及《市场准入负面清单》进行比对。若项目既不属于主业，也无法提供合理的投资方向合规性说明以证明其符合战略性新兴产业等高相关度，或者直接触及负面清单中的禁止类领域，则判定为违规。
  audit_item: 违规进行重大投资
  suspicion: 违规决策投资非主业与禁止类项目
  regulation: "[\n  {\n    \"法规名称\": \"关于中央企业加强参股管理有关事项的通知\",\n    \"法规文号\": \"国资发改革〔2019〕126号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"严把主业投资方向。中央企业不得为规避主业监管，通过参股等方式开展中央企业投资项目负面清单规定的商业性房地产等禁止类业务。\"\n  }\n]"
- expression: 资金使用对比表.项目性质 IN ('新建','扩建') && 资金使用对比表.资金来源 = '成品油税费改革转移支付'
  description: 筛查普通公路养护与新建项目资金使用对比表中，资金来源为成品油税费改革转移支付且项目性质属于新建或扩建的记录，若存在即判定违规。
  audit_item: 项目建设养护资金管理使用不规范
  suspicion: 成品油转移支付违规用于公路新建项目
  regulation: "[\n  {\n    \"法规名称\": \"《成品油税费改革转移支付资金管理办法》\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"规定资金使用范围的相关条款\",\n    \"内容概述\": \"成品油税费改革转移支付资金专项用于交通基础设施养护等规定用途，不得用于公路新建项目。\"\n  }\n]"
