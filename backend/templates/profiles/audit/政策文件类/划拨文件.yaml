name: audit/政策文件类/划拨文件
type: model
description: 从政策文件类类文档（划拨文件）中提取结构化元数据。涵盖字段如：划拨决定书、划拨资产名称、划拨金额/评估价值、批准机关、指定用途、补偿方案。文档范围包括：政府划拨文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 资产
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 划拨文件
  member_count: 1
  member_details:
  - 政府划拨文件
output:
  fields:
  - name: 划拨决定书
    type: string
    description: 提取 划拨决定书 的文本值
  - name: 划拨资产名称
    type: string
    description: 提取 划拨资产名称 的文本值
  - name: 划拨金额-评估价值
    type: number
    description: 提取 划拨金额-评估价值 的数值（含单位，如万元、吨等）
  - name: 批准机关
    type: string
    description: 提取 批准机关 的文本值
  - name: 指定用途
    type: string
    description: 提取 指定用途 的文本值
  - name: 补偿方案
    type: string
    description: 提取 补偿方案 的文本值
violations:
- expression: 批复文件.批准转增金额 > 0 && ( (COALESCE(SUM(明细账.贷方金额) FILTER (WHERE 摘要 ~ 批复文件.批复文号), 0) + COALESCE(SUM(明细账.贷方金额) FILTER
    (WHERE 摘要 ~ 批复文件.批复文号), 0)) < 批复文件.批准转增金额 || EXISTS (SELECT 1 FROM 明细账 WHERE 摘要 ~ 批复文件.批复文号 AND 金额 > 0) || EXISTS (SELECT
    1 FROM 明细账 WHERE 摘要 ~ 批复文件.批复文号 AND 贷方金额 > 0) )
  description: 政府批复明确要求将特定国有权益转增资本金时，若实收资本和资本公积中对应的贷方增加合计未达到批复金额，或相关资金被错误记入营业外收入、其他应付款等科目，即判定为未按规定转增资本金。差异大于0或损益/负债科目出现对应金额即触发疑点。
  audit_item: 未按规定核算所有者权益
  suspicion: 国有权益未按规定转增资本金
  regulation: "[\n  {\n    \"法规名称\": \"企业财务通则\",\n    \"法规文号\": \"财政部令第41号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\"\
    ,\n    \"内容概述\": \"企业应当加强资本管理。国家以各种形式投入企业的资本，应当由国有资产监督管理机构监督企业按照规定转增注册资本或者增加资本公积。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第16号——政府补助\"\
    ,\n    \"法规文号\": \"财会〔2017〕15号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"企业收到政府投入的资本性款"
- expression: (社有资产变动登记台账.变动类型 = "划拨" && 社有资产变动登记台账.接收方 IN ("城投公司","政府平台公司","政府职能部门")) && (社有资产变动登记台账.作价金额 IS NULL || 社有资产变动登记台账.作价金额
    / 政府划拨文件.划拨金额/评估价值 < 0.3) && 重大资产处置决策会议纪要.会议决议内容 IS NULL
  description: 资产被划拨给政府背景实体，且作价金额为0或不足评估价值的30%，且无社员代表大会同意决议，认定构成平调或侵占社有资产。高风险。
  audit_item: 供销合作社综合改革不合规
  suspicion: 政府无偿划拨社有资产
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第三部分（十）\",\n    \"内容概述\": \"任何部门和单位不得平调、侵占供销合作社财产，不得将社有资产纳入地方政府融资平台或用于为政府项目提供担保。\"\n  }\n]"
