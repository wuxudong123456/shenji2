name: audit/政策文件类/设立文件
type: model
description: 从政策文件类类文档（设立文件）中提取结构化元数据。涵盖字段如：专兼职标识、发布日期、文件文号、编制人数、负责村庄、责任主体名单、责任划分条款。文档范围包括：村庄保洁员岗位设立文件、灌区管理机构设立文件、省级农田建设评审专家库设立文件、防火机构设立文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 设立文件
  member_count: 1
  member_details:
  - 村庄保洁员岗位设立文件
  - 灌区管理机构设立文件
  - 省级农田建设评审专家库设立文件
  - 防火机构设立文件
output:
  fields:
  - name: 专兼职标识
    type: string
    description: 提取 专兼职标识 的文本值
  - name: 发布日期
    type: date
    description: 提取 发布日期 的日期值，格式 YYYY-MM-DD
  - name: 文件文号
    type: string
    description: 提取 文件文号 的文本值
  - name: 编制人数
    type: number
    description: 提取 编制人数 的数值（含单位，如万元、吨等）
  - name: 负责村庄
    type: string
    description: 提取 负责村庄 的文本值
  - name: 责任主体名单
    type: string
    description: 提取 责任主体名单 的文本值
  - name: 责任划分条款
    type: number
    description: 提取 责任划分条款 的数值（含单位，如万元、吨等）
violations:
- expression: COUNT(负责村庄.保洁员姓名) < 应覆盖村庄数 || (发放表.姓名 NOT IN 缴纳记录.姓名) || (发放表.实发工资 > 0 && 发放表.出勤天数 = 0)
  description: 应设立保洁员的村庄实际合同人数小于需要的村庄数，或工资发放人员无社保记录疑为虚列，或有工资发放但无考勤记录判定为“幽灵员工”。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 未设立村庄保洁员或虚列保洁员
  regulation: "[\n  {\n    \"法规名称\": \"住房和城乡建设部等部门关于全面推进农村垃圾治理的指导意见\",\n    \"法规文号\": \"建村〔2015〕170号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、（五）\",\n    \"内容概述\": \"建立村庄保洁制度，建立稳定的村庄保洁队伍，明确保洁员职责和考核办法。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\"\
    ,\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当组织、指导对"
- expression: (省级农田建设评审专家库设立文件 IS NULL) || (专家库成员资质核查表.非相关专业人数 > 专家库总人数 * 0.3) || (项目审批流程跟踪台账 EXISTS WHERE 专家签名 IS NULL AND
    项目投资额 > 规定限额)
  description: 专家库未正式设立，或库中非水利、农业、林业等相关专业成员占比超过30%，或达到限额以上项目无专家评审签名记录，均判定为评审机制不健全或流于形式；限额参照地方通常为500万元及以上项目。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 未建立省级农田建设评审专家库或评审不严格
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"省级农业农村部门负责建立省级农田建设项目评审专家库，专家库成员应具有相关专业高级技术职称，并实行专家回避等制度，确保评审质量。\"\n  }\n]"
- expression: (编制人数.编制人数 < 批复文件.核定编制人数*0.8) OR (编制人数.专兼职标识 < 编制人数.编制人数*0.6) OR (配置清单.数量 < 配置清单.数量*0.8) OR (配置清单.有效期（灭火器等）/配置清单.数量
    > 0.2) OR (保养记录.维护日期 < 当前日期-180天) OR (配置清单.数量 = 0) OR (名册.资质证书/名册.岗位 < 0.8) OR (使用台账.设备采购支出/使用台账.金额 < 0.5)
  description: 机构编制未达标准的80%，在岗率低于60%，设备数量低于标配的80%，灭火器等过期比例超过20%，近6个月无任何维护记录，无人机等现代化装备为零，持证上岗率不足80%，防火经费中设备采购占比低于50%，均视为配备不到位。
  audit_item: 草原风险防控落实不到位
  suspicion: 草原防火机构、队伍及设备配备不到位
  regulation: "[\n  {\n    \"法规名称\": \"《草原防火条例》\",\n    \"法规文号\": \"国务院令第542号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十三条、第十四条、第十五条\",\n    \"内容概述\": \"县级以上地方政府应根据草原防火需要建立防火组织，配备必要的防火设施、设备和人员；防火设备应定期维护，保证完好有效；防火经费应专款专用。\"\n  }\n]"
