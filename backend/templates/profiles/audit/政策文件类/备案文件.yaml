name: audit/政策文件类/备案文件
type: model
description: 从政策文件类类文档（备案文件）中提取结构化元数据。涵盖字段如：上报日期、上级公司处理意见、个人缴费比例上限、主办单位、交易方式、交易项目编号、企业缴费比例上限、备案/核准编号。文档范围包括：农村产权流转交易平台备案文件、参股企业重大事项报告或备案文件、地方安监备案文件、备案文件、工信部门产能置换备案文件、房屋交付备案文件、收费审批备案文件、村级收费项目审批备案文件、环保设施竣工验收备案文件、竣工验收备案文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 审批
- 项目
- 验收
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 备案文件
  member_count: 1
  member_details:
  - 农村产权流转交易平台备案文件
  - 参股企业重大事项报告或备案文件
  - 地方安监备案文件
  - 备案文件
  - 工信部门产能置换备案文件
  - 房屋交付备案文件
  - 收费审批备案文件
  - 村级收费项目审批备案文件
  - 环保设施竣工验收备案文件
  - 竣工验收备案文件
  - 职业资格鉴定收费备案文件
  - 补充养老保险（年金）备案文件
  - 被审计单位收费项目审批备案文件
  - 评估备案文件
  - 评比达标表彰活动审批备案文件
  - 银行账户开立审批备案文件
output:
  fields:
  - name: 上报日期
    type: date
    description: 提取 上报日期 的日期值，格式 YYYY-MM-DD
  - name: 上级公司处理意见
    type: string
    description: 提取 上级公司处理意见 的文本值
  - name: 个人缴费比例上限
    type: number
    description: 提取 个人缴费比例上限 的数值（含单位，如万元、吨等）
  - name: 主办单位
    type: string
    description: 提取 主办单位 的文本值
  - name: 交易方式
    type: string
    description: 提取 交易方式 的文本值
  - name: 交易项目编号
    type: string
    description: 提取 交易项目编号 的文本值
  - name: 企业缴费比例上限
    type: number
    description: 提取 企业缴费比例上限 的数值（含单位，如万元、吨等）
  - name: 备案-核准编号
    type: string
    description: 提取 备案-核准编号 的文本值
  - name: 备案回执
    type: string
    description: 提取 备案回执 的文本值
  - name: 备案日期
    type: date
    description: 提取 备案日期 的日期值，格式 YYYY-MM-DD
  - name: 备案申报日期
    type: date
    description: 提取 备案申报日期 的日期值，格式 YYYY-MM-DD
  - name: 备案账户信息及批准文件
    type: string
    description: 提取 备案账户信息及批准文件 的文本值
  - name: 备案验收结论
    type: string
    description: 提取 备案验收结论 的文本值
  - name: 实测总建筑面积
    type: string
    description: 提取 实测总建筑面积 的文本值
  - name: 实际交付日期
    type: date
    description: 提取 实际交付日期 的日期值，格式 YYYY-MM-DD
  - name: 实际用途
    type: string
    description: 提取 实际用途 的文本值
  - name: 审批机关
    type: string
    description: 提取 审批机关 的文本值
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
  - name: 已批准活动名称列表
    type: string
    description: 提取 已批准活动名称列表 的文本值
  - name: 房号
    type: string
    description: 提取 房号 的文本值
  - name: 执行标准
    type: string
    description: 提取 执行标准 的文本值
  - name: 批准文号
    type: string
    description: 提取 批准文号 的文本值
  - name: 批准日期
    type: date
    description: 提取 批准日期 的日期值，格式 YYYY-MM-DD
  - name: 批准机关
    type: string
    description: 提取 批准机关 的文本值
  - name: 报告事项
    type: string
    description: 提取 报告事项 的文本值
  - name: 收费标准批复
    type: number
    description: 提取 收费标准批复 的数值（含单位，如万元、吨等）
  - name: 收费许可证有效期
    type: number
    description: 提取 收费许可证有效期 的数值（含单位，如万元、吨等）
  - name: 收费项目名称
    type: number
    description: 提取 收费项目名称 的数值（含单位，如万元、吨等）
  - name: 收费项目设立批复
    type: number
    description: 提取 收费项目设立批复 的数值（含单位，如万元、吨等）
  - name: 有效期
    type: string
    description: 提取 有效期 的文本值
  - name: 核定淘汰产能数量
    type: number
    description: 提取 核定淘汰产能数量 的数值（含单位，如万元、吨等）
  - name: 民主程序通过说明
    type: string
    description: 提取 民主程序通过说明 的文本值
  - name: 用地面积
    type: string
    description: 提取 用地面积 的文本值
  - name: 竣工日期
    type: date
    description: 提取 竣工日期 的日期值，格式 YYYY-MM-DD
  - name: 置换比例
    type: number
    description: 提取 置换比例 的数值（含单位，如万元、吨等）
  - name: 获批收费项目名称
    type: number
    description: 提取 获批收费项目名称 的数值（含单位，如万元、吨等）
  - name: 计划退出时间
    type: date
    description: 提取 计划退出时间 的日期值，格式 YYYY-MM-DD
  - name: 许可收费项目
    type: number
    description: 提取 许可收费项目 的数值（含单位，如万元、吨等）
  - name: 评估备案编号
    type: string
    description: 提取 评估备案编号 的文本值
  - name: 评估方法
    type: string
    description: 提取 评估方法 的文本值
  - name: 评估范围说明
    type: string
    description: 提取 评估范围说明 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 验收备案日期
    type: date
    description: 提取 验收备案日期 的日期值，格式 YYYY-MM-DD
  - name: 验收结论
    type: string
    description: 提取 验收结论 的文本值
violations:
- expression: (日记账.现金余额 - 盘点记录.实盘现金余额 < 0 && ABS(差异) > 2000 && 无书面说明) || (银行对账单.借贷方金额转账至个人账户 && 金额 > 50000 && 缺少对应业务合同) ||
    (明细台账.备用金 > 100000 && 长期未冲账且无实际库存现金)
  description: 突击盘点发现现金溢余且无合理解释，可能为公款私存。银行转账至个人账户大额无业务支撑，揭示公款被挪用或私存。备用金余额异常且无法盘实，疑为以备用金名义提取现金私存。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 私存私放财政资金或公款
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"单位和个人违反财务管理的规定，私存私放财政资金或者其他公款的，责令改正，调整有关会计账目，追回私存私放的资金，没收违法所得。对单位处3000元以上5万元以下的罚款；对直接负责的主管人员和其他直接责任人员处2000元以上2万元以下的罚款……\"\
    \n  }\n]"
- expression: 收取台账.实际开展活动名称 NOT IN (备案文件.已批准活动名称列表)
  description: 将协会实际执行的评比表彰活动与政府公布的保留项目目录或审批备案清单进行比对，若活动不在获批范围内，即判定为违规举办。
  audit_item: 行业协会商会违规收费
  suspicion: 未经批准开展评比达标表彰活动
  regulation: "[\n  {\n    \"法规名称\": \"社会组织评比达标表彰活动管理办法\",\n    \"法规文号\": \"国评组发〔2022〕3号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第四条\",\n    \"内容概述\": \"社会组织未经批准，不得自行创设或者擅自开展评比达标表彰活动。\"\n  }\n]"
- expression: (对照表.实际开工日期 IS NOT NULL) && ((对照表.规划许可证核发日期 IS NULL) || (对照表.实际开工日期 < 对照表.规划许可证核发日期) || (备案文件.实测总建筑面积 > 许可证.许可建筑面积)
    || (备案文件.实际用途 != 许可证.规划用途) || (用地位置.用地性质 != 许可证.规划用途))
  description: 任一条件成立即违规：1.规划许可证缺失；2.实际开工早于规划许可证核发；3.竣工验收实测建筑面积超出许可面积；4.实际建设用途或用地性质与规划许可不符。面积超出无容忍，任何正偏差均违规。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得规划许可或未按规划许可规定建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第74号（2019修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十条、第六十四条\",\n    \"内容概述\": \"在城市、镇规划区内进行工程建设必须申请办理建设工程规划许可证。未取得许可证或未按许可规定建设的，由主管部门责令停止建设；尚可改正的限期改正，无法改正的限期拆除，并可处罚款。\"\
    \n  }\n]"
- expression: (批复文件.批复建设产能规模 > (备案文件.核定淘汰产能数量 * 行业规定置换系数)) || (验收证明.政府验收签字 != '已验收' && 审批清单.审批状态 == '已批准')
  description: 依据各行业产能置换实施办法，新项目产能必须以淘汰原有产能为前提，且需满足减量或等量置换比例。若建设产能超出按置换比例折算后的允许值，或申报淘汰的旧产能并未实际关停验收即获批新项目，均构成违规。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 违反产能置换政策违规新增产能
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于化解产能严重过剩矛盾的指导意见\",\n    \"法规文号\": \"国发〔2013〕41号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第二部分第（三）点\",\n    \"内容概述\": \"产能严重过剩行业项目建设，须制定产能置换方案，实施等量或减量置换。\"\n  },\n  {\n    \"法规名称\": \"工业和信息化部关于印发水泥玻璃行业产能置换实施办法的通知\"\
    ,\n    \"法规文号\": \"工信部原〔2021〕80号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第五条\",\n    \"内容概述\": \"明确"
- expression: ( 流水.付款方名称 = 信息.高管名单 && 信息.与被审计单位人事关联情况 = '人事或股权关联' && 协议.排他性条款 = '指定/唯一/必须' ) && ( ABS(明细台账.收费标准 - 调查资料.同类服务市场均价)/调查资料.同类服务市场均价
    > 0.3 || 明细台账.服务提供方 != '公开竞争方式确定' )
  description: 当满足以下条件时触发疑点：①收款方为被审计单位下属、控股或存在人事关联的企业；②服务合同明确限定唯一服务提供商或变相排除其他竞争者；③收费标准与同类服务市场均价的偏差率大于30%，或根本未履行招标、竞争性谈判等公开选取程序。三项条件同时满足，即可判定为依托行政权力垄断经营且高价收费。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 依托行政权力垄断经营并高价收费
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十三条\",\n    \"内容概述\": \"行政机关和法律、法规授权的具有管理公共事务职能的组织不得强制或者变相强制市场主体接受中介服务、购买指定商品、参加有偿培训等，不得指定或者变相指定中介服务机构、商品供应商、培训机构。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国反垄断法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条\"\
    ,\n   "
- expression: （项目综合应急预案.编制日期 IS NULL） || （DATEDIFF(当前检查日期, 项目综合应急预案.编制日期) > 365 且 版本号 未更新） || （应急演练计划 为空 或 应急演练计划.计划时间 已过期且
    演练记录及评估报告 无对应记录） || （应急演练记录及评估报告 记录的演练类型 未覆盖 专项应急预案.预案类型 且 年度内至少一次）
  description: 判定规则：1）无应急预案文本；2）预案超过一年未评估更新，环境变化后预案失效；3）未制定年度演练计划或计划过期未执行；4）演练类型未覆盖主要事故风险，如仅有消防演练而缺失坍塌、触电等专项演练。逻辑用||连接任一触发即判违。
  audit_item: 重大工程项目风险预警
  suspicion: 未按规定编制或更新应急预案且未组织演练
  regulation: "[\n  {\n    \"法规名称\": \"生产安全事故应急预案管理办法\",\n    \"法规文号\": \"应急管理部令第2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十六条、第三十三条\",\n    \"内容概述\": \"生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。应急预案应当至少每三年修订一次，出现特定情形应及时修订。\"\
    \n  }\n]"
- expression: (发票.最早用电日期或开票日期 IS NOT NULL) && (备案文件 IS NULL || 备案文件.验收备案日期 > 发票.最早用电日期或开票日期) || (对照表.施工完成时间 IS NULL && 许可证.开工日期
    IS NOT NULL)
  description: 判断标准：1.主体工程实际投产（以首笔用电或销售记录为准）时，环保设施尚未通过竣工验收（无验收备案文件或验收日期晚于投产日期），即违反“同时投产使用”；2.环保设施施工未完成但主体工程已开工，即违反“同时施工”。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 环保设施未与主体工程同时设计、施工、投产使用
  regulation: "[\n  {\n    \"法规名称\": \"建设项目环境保护管理条例\",\n    \"法规文号\": \"国务院令第682号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"建设项目需要配套建设的环境保护设施，必须与主体工程同时设计、同时施工、同时投产使用。\"\n  }\n]"
- expression: (发票.最早用电日期或开票日期 IS NOT NULL) && (验收备案日期、备案验收结论、验收结论 IS NULL || 验收备案日期、备案验收结论、验收结论.验收备案日期 > 发票.最早用电日期或开票日期)
  description: 以实际投产迹象（首笔生产用电或销售发票日期）为依据，若此时未取得环保设施竣工验收备案，或验收日期晚于投产日期，即构成“未验先投”。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 环保设施未经验收即投入生产
  regulation: "[\n  {\n    \"法规名称\": \"建设项目环境保护管理条例\",\n    \"法规文号\": \"国务院令第682号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"编制环境影响报告书、环境影响报告表的建设项目，其配套建设的环境保护设施经验收合格，方可投入生产或者使用；未经验收或者验收不合格的，不得投入生产或者使用。\"\n  }\n]"
- expression: ((应发工资、基本工资、津贴补贴、职工姓名、代扣个人所得税、代扣社保个人部分、实发工资、应发合计、工资总额、工资总额合计、职工工资总额、岗位级别.企业缴费金额 / 应发工资、基本工资、津贴补贴、职工姓名、代扣个人所得税、代扣社保个人部分、实发工资、应发合计、工资总额、工资总额合计、职工工资总额、岗位级别.缴费基数)
    > 企业缴费比例上限、个人缴费比例上限、民主程序通过说明.企业缴费比例上限) || (SUM(应发工资、基本工资、津贴补贴、职工姓名、代扣个人所得税、代扣社保个人部分、实发工资、应发合计、工资总额、工资总额合计、职工工资总额、岗位级别.企业缴费金额)
    / SUM(应发工资、基本工资
  description: 企业缴费比例超过备案文件的上限；或企业缴费总额超过上年度职工工资总额的8%（政策上限）；或高管缴费比例明显高于普通员工（差距超过3个百分点），可能构成违规或歧视性利益输送。
  audit_item: 违规支付职工薪酬及股份
  suspicion: 超标准列支补充养老保险（企业年金）
  regulation: "[\n  {\n    \"法规名称\": \"企业年金办法\",\n    \"法规文号\": \"人力资源和社会保障部令第36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十一条\",\n    \"内容概述\": \"企业缴费每年不超过本企业职工工资总额的8%。企业和职工个人缴费合计不超过本企业职工工资总额的12%。具体所需费用，由企业和职工一方协商确定。\"\n  },\n  {\n  \
    \  \"法规名称\": \"企业年金办法\",\n    \"法规文号\": \"人力资源和社会保障部令第36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n    \"\
    内容概述\": \"企业"
- expression: (三重一大决策制度.监督范围 NOT CONTAIN '参股企业' ) OR (参股企业重大资金支出.金额 > 集团规定额度 AND 参股企业重大事项报告文件 IS NULL)
  description: 若集团的“三重一大”制度条文未涵盖对参股企业重大事项的管控，或参股企业实际发生重大资金支出、资产处置等但未见向集团公司报告备案，则表明监督范围存在重大遗漏；涉及重大权益变动或担保的为高风险。
  audit_item: 重大决策不健全方面的问题
  suspicion: 参股企业重大事项未纳入三重一大监督
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十七条\",\n    \"内容概述\": \"国家出资企业应当依法建立和完善法人治理结构，建立健全内部监督管理制度，对子企业的重大事项实施有效监管。\"\n  },\n  {\n    \"法规名称\": \"关于进一步推进国有企业贯彻落实“三重一大”决策制度的意见\"\
    ,\n    \"法规文号\": \"中办发〔2010〕17号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"一、指导思想和基本原则\",\n    \"内容概述\": "
- expression: (农机企业缴费台账.实际收费项目名称 NOT IN (国家和地方涉农收费政策文件.合法收费项目名称)) && (农机企业缴费台账.实际收费项目名称 NOT IN (被审计单位收费项目审批备案文件.获批收费项目名称))
    && (农机企业缴费台账.收费依据 IS NULL OR 农机企业缴费台账.票据类型 != '财政票据')
  description: 当缴费台账中的收费项目既不在国家和地方政策允许清单中，又未经本单位审批备案，且无合法收费依据或未使用财政票据时，判定为违规收费。重点排查以“管理费”“服务费”等名义收取的费用。
  audit_item: 乱集资、乱摊派、乱收费
  suspicion: 向农机企业违规收取无审批依据的管理费
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性收费标准管理暂行办法\",\n    \"法规文号\": \"发改价格〔2006〕532号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第四条\",\n    \"内容概述\": \"行政事业性收费项目、收费标准由国务院和省、自治区、直辖市人民政府审批，未经审批不得收取。\"\n  }\n]"
