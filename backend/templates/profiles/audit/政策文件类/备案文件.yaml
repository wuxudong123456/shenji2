    包含 村干部姓名)
  description: 未通过平台备案的交易占比超10%，或成交价偏离市场均价20%以上，或承包方与村干部存在关联，均触发疑点；市场均价可取自周边乡镇公开挂牌数据。
  audit_item: 农村集体经济发展壮大不到位
  suspicion: 农村产权流转未进场交易或交易价格显失公允
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于引导农村产权流转交易市场健康发展的意见\",\n    \"法规文号\": \"国办发〔2014〕71号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"农村集体资产资源流转交易应进入交易市场公开进行，严禁私下交易、暗箱操作，确保交易公开、公平、公正。\"\n  }\n]"
- expression: (明细表.收入项目 IS NOT NULL AND 收费项目名称.审批状态 = '未审批') || (其他.收据编号连续性缺失率 > 0.05 AND 其他.入账日期 - 其他.开票日期 > 5) || (明细表.收入项目
    NOT IN 会议记录.议题) || (其他.签字确认 IS NULL)
  description: 判定条件一：存在村级收费但无上级审批备案文件，即属乱收费；条件二：收据号段缺失率超5%且入账延迟超过5天，为坐收坐支、截留挪用的典型特征；条件三：收费项目未经过村民代表会议表决同意，程序违法；条件四：收据无缴款人签字，真实性存疑，可能虚构收费或冒名截留。满足任一条件即触发疑点。
  audit_item: 截留挪用涉农财政专项资金
  suspicion: 村级组织无依据向农民收费或罚款
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步规范涉农收费管理工作的通知\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第二条、第三条\",\n    \"内容概述\": \"村级向农民收取费用必须经村民会议或村民代表会议讨论通过，并报乡镇政府审核备案，开具合规票据，收入全额纳入村集体经济组织账务管理，严禁无依据收费、搭车收费、坐收坐支。\"\n\
    \  }\n]"
- expression: 住宅专项维修资金交纳情况明细表.欠交金额 > 0 AND 房屋交付时间与维修资金交纳时间差异分析表.间隔天数 > 30
