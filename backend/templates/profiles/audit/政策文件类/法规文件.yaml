name: audit/政策文件类/法规文件
type: model
description: 从政策文件类类文档（法规文件）中提取结构化元数据。涵盖字段如：必备内容要素标准、最长付款期限、法定批复时限要求、生活补助标准、规划编制的强制性要求、规定接收比例、规定的年初最低分配率标准。文档范围包括：国家和地方退役士兵安置政策法规文件、地方退役士兵安置政策法规文件、政策法规文件、法规文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 付款
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 法规文件
  member_count: 1
  member_details:
  - 国家和地方退役士兵安置政策法规文件
  - 地方退役士兵安置政策法规文件
  - 政策法规文件
  - 法规文件
output:
  fields:
  - name: 必备内容要素标准
    type: string
    description: 提取 必备内容要素标准 的文本值
  - name: 最长付款期限
    type: number
    description: 提取 最长付款期限 的数值（含单位，如万元、吨等）
  - name: 法定批复时限要求
    type: string
    description: 提取 法定批复时限要求 的文本值
  - name: 生活补助标准
    type: string
    description: 提取 生活补助标准 的文本值
  - name: 规划编制的强制性要求
    type: string
    description: 提取 规划编制的强制性要求 的文本值
  - name: 规定接收比例
    type: number
    description: 提取 规定接收比例 的数值（含单位，如万元、吨等）
  - name: 规定的年初最低分配率标准
    type: string
    description: 提取 规定的年初最低分配率标准 的文本值
violations:
- expression: (明细账.企业类型 IN ('中小企业','民营企业') AND (明细账.应付款日期 IS NOT NULL) AND (明细账.实际付款日期 IS NULL AND DATE_DIFF(CURRENT_DATE,
    明细账.应付款日期, 'DAY') > 60) ) OR (明细账.实际付款日期 - 明细账.应付款日期 > 60)
  description: 依据《保障中小企业款项支付条例》，机关、事业单位从中小企业采购货物、工程、服务，应当自交付之日起30日内支付款项；合同另有约定的，付款期限最长不得超过60日。超过60日未付，即构成逾期拖欠。表达式以60天为阈值判定违规。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 长期拖欠中小企业采购账款
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"机关、事业单位从中小企业采购货物、工程、服务，应当自货物、工程、服务交付之日起30日内支付款项；合同另有约定的，付款期限最长不得超过60日。不得以法定代表人或者主要负责人变更，履行内部付款流程，或者在合同未作约定的情况下以等待竣工验收批复、决算审计等为由，拒绝或者迟延支付中小企业款项。\"\
    \n  }\n]"
- expression: (规划文本 IS NULL) || (政府批复文号 IS NULL || 批复日期 = '') || (编制日期 > 项目实际开工日期) || (技术路线出现其他地区地名或与本地区缺水/山区等特征明显矛盾)
  description: 无正式规划文本；或虽有规划但无合法批复文件及日期；或规划编制时间晚于治理项目开工日期，倒挂操作；或技术路线表述照搬照抄，出现不符合本地特征的方案，如严重缺水地区规划大量水冲式厕所。满足任一条件即触发违规。
  audit_item: 污水治理规划不符合规定
  suspicion: 未编制或形式上编制农村污水治理规划
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进农村生活污水治理的指导意见\",\n    \"法规文号\": \"环办土壤〔2021〕24号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条第（三）项\",\n    \"内容概述\": \"以县域为单位，科学编制农村生活污水治理规划（方案），明确治理目标、时序、技术路线、建设任务、运行维护和资金筹措等内容。\"\n  }\n]"
- expression: 统计表.接收退役士兵数 / 单位名称在职总人数.在职总人数 < 规定接收比例.规定接收比例
  description: 将接收退役士兵数除以单位在职总人数，与地方政策规定的最低接收比例（如不低于1%）比较，若低于则为违规。
  audit_item: 未按规定落实退役士兵安置政策
  suspicion: 接收退役士兵占在职人数比例低于政策标准
  regulation: "[\n  {\n    \"法规名称\": \"退役士兵安置条例\",\n    \"法规文号\": \"国务院、中央军委令第608号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十三条\",\n    \"内容概述\": \"安置地县级以上地方人民政府应当按照属地管理的原则，对符合安排工作条件的退役士兵进行安置，保障其第一次就业。地方可根据实际情况制定具体接收比例。\"\n  },\n  {\n \
    \   \"法规名称\": \"地方退役士兵安置实施细则\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"相关接收比例条款\",\n    \"内容概述\"\
    : \"明确规定"
- expression: (发放台账.发放金额 < 法规文件.生活补助标准（如最低工资的80%）) || (待安排工作月份内有月份无生活补助发放记录)
  description: 政策规定退役士兵待安排工作期间，由安置地人民政府按不低于当地最低生活水平或最低工资一定比例（如80%）发放生活补助。如果发放台账中任一待安置月份发放金额低于标准，或存在月份未发放记录，即为违规。
  audit_item: 未按规定落实退役士兵安置政策
  suspicion: 待安排工作期间生活补助未足额或未发放
  regulation: "[\n  {\n    \"法规名称\": \"退役士兵安置条例\",\n    \"法规文号\": \"国务院、中央军委令第608号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"由人民政府安排工作的退役士兵，待安排工作期间，安置地人民政府应当按照不低于当地最低生活水平的标准，按月发给生活补助费。\"\n  }\n]"
