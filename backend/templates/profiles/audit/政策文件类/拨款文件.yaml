name: audit/政策文件类/拨款文件
type: model
description: 从政策文件类类文档（拨款文件）中提取结构化元数据。涵盖字段如：中央预算批复金额、地方预算安排金额、拨款金额、资金用途、预算科目。文档范围包括：中央及地方财政预算拨款文件、就业补助资金拨款文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 拨款
- 金额
- 预算
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 拨款文件
  member_count: 1
  member_details:
  - 中央及地方财政预算拨款文件
  - 就业补助资金拨款文件
output:
  fields:
  - name: 中央预算批复金额
    type: number
    description: 提取 中央预算批复金额 的数值（含单位，如万元、吨等）
  - name: 地方预算安排金额
    type: number
    description: 提取 地方预算安排金额 的数值（含单位，如万元、吨等）
  - name: 拨款金额
    type: number
    description: 提取 拨款金额 的数值（含单位，如万元、吨等）
  - name: 资金用途
    type: string
    description: 提取 资金用途 的文本值
  - name: 预算科目
    type: number
    description: 提取 预算科目 的数值（含单位，如万元、吨等）
violations:
- expression: (中央与地方财政投入对比表.地方实际到位金额 / 中央与地方财政投入对比表.(中央实际到位金额+地方实际到位金额) < 0.3) || (中央与地方财政投入对比表.地方资金到位时间 - 中央与地方财政投入对比表.中央资金首笔拨付时间
    > 730)
  description: 地方配套资金到位比例低于总投入的30%，反映地方财政投入严重不足，过度依赖中央资金；地方配套资金到位时间滞后于中央首笔资金拨付时间超过2年（730天），表明地方承诺资金配套严重失信，影响项目正常实施进度。
  audit_item: 黑土地保护治理缺少持续性，后期管护不到位
  suspicion: 地方配套资金投入严重不足且拨付滞后
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"地方政府应当将上级政府提前下达的转移支付预计数编入本级预算，地方预算必须完整反映上级各项补助收入，并确保配套资金的足额安排。\"\n  },\n  {\n    \"法规名称\"\
    : \"黑土地保护利用规划等相关政策文件\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"通常按项目资金管理办法规定\",\n    \"内容概述\"\
    : \"地方财政"
- expression: (明细表.支出科目名称 NOT IN ('职业培训补贴', '职业技能鉴定补贴', '社会保险补贴', '公益性岗位补贴', '就业见习补贴', '特定就业政策补贴', '就业服务补助', '其他符合规定的就业支出'))
    && (明细表.收款方名称 IN (三公经费支付对象) || 明细表.资金用途摘要 CONTAINS ('招待', '接待', '差旅', '公车', '出国', '考察', '会议')) || (水对账单.资金用途摘要 CONTAINS
    ('招待', '接待', '差旅', '公车', '出国', '考察', '会议') && 水对账单.交易金额 关联 明细表.支出金额)
  description: 基于就业补助资金管理办法规定的允许支出科目白名单（如职业培训补贴、社保补贴等），筛选出所有不在白名单内的支出。同时，通过关键词匹配和收款方比对，锁定与'三公'经费相关的支出，如招待费、差旅费、出国费等。结合银行流水可追踪资金最终流向是否为酒店、旅行社、车辆维修等非就业相关机构，判定为挤占挪用。
  audit_item: 挤占挪用资金（社保）
  suspicion: 挤占就业补助资金支付三公经费
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国就业促进法\",\n    \"法规文号\": \"中华人民共和国主席令第七十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"国家实行有利于促进就业的财政政策，就业专项资金必须用于职业介绍、职业培训、公益性岗位、职业技能鉴定、特定就业政策和社会保险等补贴，不得挪作他用。\"\n  },\n  {\n \
    \   \"法规名称\": \"财政部 人力资源社会保障部关于印发《就业补助资金管理办法》的通知\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款"
