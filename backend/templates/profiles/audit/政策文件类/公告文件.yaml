name: audit/政策文件类/公告文件
type: model
description: 从政策文件类类文档（公告文件）中提取结构化元数据。涵盖字段如：保证金项目名称、公告中担保事项编号、收取条件、收取金额、比例。文档范围包括：上市公司对外担保信息披露公告文件、保证金收取公告文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 公告文件
  member_count: 1
  member_details:
  - 上市公司对外担保信息披露公告文件
  - 保证金收取公告文件
output:
  fields:
  - name: 保证金项目名称
    type: string
    description: 提取 保证金项目名称 的文本值
  - name: 公告中担保事项编号
    type: string
    description: 提取 公告中担保事项编号 的文本值
  - name: 收取条件
    type: string
    description: 提取 收取条件 的文本值
  - name: 收取金额
    type: number
    description: 提取 收取金额 的数值（含单位，如万元、吨等）
  - name: 比例
    type: number
    description: 提取 比例 的数值（含单位，如万元、吨等）
violations:
- expression: （被担保方名称、担保金额、担保类型、是否关联方、担保类型（是否全资子公司）、是否有反担保标识、担保合同编号、担保开始日.担保合同编号 NOT IN （披露的担保合同清单、金额.披露的担保合同清单 ∪ 披露的担保合同清单、金额.披露的担保合同清单））
    OR （涉诉担保合同编号、涉诉金额.涉诉担保合同编号 IS NOT NULL AND 涉诉担保合同编号、涉诉金额.涉诉担保合同编号 NOT IN （被担保方名称、担保金额、担保类型、是否关联方、担保类型（是否全资子公司）、是否有反担保标识、担保合同编号、担保开始日.担保合同编号））
  description: 担保台账中有记录但未在任何公开披露信息中出现的担保事项，表明信息披露缺失；诉讼记录中存在担保合同编号但台账中无对应记录，提示可能存有未入账、未披露的隐性担保。两者均触发疑点。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 上市公司存在未披露担保或隐性担保
  regulation: "[\n  {\n    \"法规名称\": \"上市公司信息披露管理办法\",\n    \"法规文号\": \"证监会令第182号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"发生可能对上市公司证券及其衍生品种交易价格产生较大影响的重大事件，投资者尚未得知时，上市公司应当立即披露。前款所称重大事件包括公司对外提供重大担保。\"\n  },\n  {\n\
    \    \"法规名称\": \"关于规范上市公司对外担保行为的通知\",\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\"\
    ,\n   "
