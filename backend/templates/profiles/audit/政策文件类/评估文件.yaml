name: audit/政策文件类/评估文件
type: model
description: 从政策文件类类文档（评估文件）中提取结构化元数据。涵盖字段如：一致行动人协议存在标识、协议控制条款、建设进度通报、母公司委派董事人数、滞后项目清单、董事会席位数量、表决权委托协议、重大决议通过所需表决权比例。文档范围包括：上级部门监测评估文件、实际控制权评估文件（含协议控制文件）等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 协议
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 评估文件
  member_count: 1
  member_details:
  - 上级部门监测评估文件
  - 实际控制权评估文件（含协议控制文件）
output:
  fields:
  - name: 一致行动人协议存在标识
    type: string
    description: 提取 一致行动人协议存在标识 的文本值
  - name: 协议控制条款
    type: number
    description: 提取 协议控制条款 的数值（含单位，如万元、吨等）
  - name: 建设进度通报
    type: string
    description: 提取 建设进度通报 的文本值
  - name: 母公司委派董事人数
    type: number
    description: 提取 母公司委派董事人数 的数值（含单位，如万元、吨等）
  - name: 滞后项目清单
    type: string
    description: 提取 滞后项目清单 的文本值
  - name: 董事会席位数量
    type: number
    description: 提取 董事会席位数量 的数值（含单位，如万元、吨等）
  - name: 表决权委托协议
    type: string
    description: 提取 表决权委托协议 的文本值
  - name: 重大决议通过所需表决权比例
    type: number
    description: 提取 重大决议通过所需表决权比例 的数值（含单位，如万元、吨等）
violations:
- expression: (合并范围内子公司名单、未纳入合并范围的被投资单位清单及原因说明.包含(子公司) && 持股比例、表决权比例、重大事项决策条款（如一致同意、否决权）.持股比例 >= 0.5 && (持股比例、表决权比例、重大事项决策条款（如一致同意、否决权）.重大事项决策条款（如一致同意、否决权）
    = '全体股东一致同意' || 实际控制权评估文件.母公司委派董事人数 < 0.5))
  description: 持股比例≥50%视为名义控制，但需结合董事会席位和决策条款判断实质控制。若章程规定重大经营决策需全体股东一致同意或母公司委派董事未过半数，则母公司无法单方面控制，不应合并。触发条件：上述条件同时满足。
  audit_item: 未按规定编制合并财务报表
  suspicion: 将无实际控制权的公司纳入合并范围
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第33号——合并财务报表\",\n    \"法规文号\": \"财会〔2014〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第七条、第八条\",\n    \"内容概述\": \"合并财务报表的合并范围应当以控制为基础予以确定。控制是指投资方拥有对被投资方的权力，通过参与被投资方的相关活动而享有可变回报，并且有能力运用对被投资方的权力影响其回报金额。\"\
    \n  }\n]"
- expression: ((子公司持股比例变动记录 >= 0.5 && 收购日期 <= 资产负债表日 - 1 && !合并范围内子公司名单.该实体) || (协议控制条款 && !合并范围内子公司名单.该实体))
  description: 判断实际控制的标准：持股比例达到50%以上且购买日在报告年度内，或者虽无直接持股但通过协议安排（如VIE、一致行动人）能够控制，均应纳入合并范围。若未纳入，则违规。
  audit_item: 未按规定编制合并财务报表
  suspicion: 未将具有实际控制权的公司纳入合并范围
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第33号——合并财务报表\",\n    \"法规文号\": \"财会〔2014〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第七条、第十三条\",\n    \"内容概述\": \"母公司应当将其控制的所有子公司（包括基于协议控制等）纳入合并财务报表。合并范围应当以控制为基础确定，不得故意遗漏。\"\n  }\n]"
- expression: 验收报告.实际竣工日期 > 实施方案.计划开工/竣工时间 + 365天 AND 跟踪表.投资完成率 < 80% OR 跟踪表.投资完成率 < 50% AND 明细表.支出进度 > 80%
  description: 项目逾期超过1年且投资完成率仍低于80%，或已拨付超80%资金但投资完成率不足50%的，判定为进展严重滞后，存在资金沉淀或挪用风险。若投资完成率低于30%，列为停滞项目。
  audit_item: 现代农业产业园（集群、强镇）目标任务未完成
  suspicion: 现代农业产业园建设项目进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"关于开展国家现代农业产业园创建工作的通知\",\n    \"法规文号\": \"农计发〔2017〕13号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"四、创建要求（三）强化项目管理\",\n    \"内容概述\": \"产业园创建周期一般不超过3年，应严格按照实施方案推进项目建设，对进度严重滞后的要及时调整，无法按期完成任务的应取消创建资格。\"\n\
    \  }\n]"
