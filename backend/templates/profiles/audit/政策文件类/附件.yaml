name: audit/政策文件类/附件
type: model
description: 从政策文件类类文档（附件）中提取结构化元数据。涵盖字段如：付款方为非税账户的支付凭证、供应商/收款方名称、供应商名称、发票、发票内容、发票号、发票抬头、发票金额。文档范围包括：发票附件、建设工程规划许可证相关附件、建设用地规划许可证附件、支出报销原始凭证的附件、管理费用记账凭证附件、绩效目标申报表附件、财务凭证原始附件、财务凭证附件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 付款
- 凭证
- 协议
- 合同
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 附件
  member_count: 1
  member_details:
  - 发票附件
  - 建设工程规划许可证相关附件
  - 建设用地规划许可证附件
  - 支出报销原始凭证的附件
  - 管理费用记账凭证附件
  - 绩效目标申报表附件
  - 财务凭证原始附件
  - 财务凭证附件
output:
  fields:
  - name: 付款方为非税账户的支付凭证
    type: number
    description: 提取 付款方为非税账户的支付凭证 的数值（含单位，如万元、吨等）
  - name: 供应商-收款方名称
    type: number
    description: 提取 供应商-收款方名称 的数值（含单位，如万元、吨等）
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 发票
    type: string
    description: 提取 发票 的文本值
  - name: 发票内容
    type: string
    description: 提取 发票内容 的文本值
  - name: 发票号
