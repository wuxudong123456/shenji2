violations:
- expression: ABS(资金类型、接收单位、规定下达截止日、实际下达日期、资金编号、实际下达金额、资金到位率、金额、资金用途.实际下达金额 - 资金类型、接收单位、计划金额、具体项目单位.计划金额) / 资金类型、接收单位、计划金额、具体项目单位.计划金额
    > 0.05
  description: 实际下达金额与经批准的分配计划金额偏差率超过5%，属于大幅偏离，可能存在擅自调剂、依据不实等问题。偏差率>5%为可疑，>10%为严重违规。
  audit_item: 财政转移支付预算下达不及时、不准确
  suspicion: 转移支付资金实际分配金额与年度计划严重偏离
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十条\",\n    \"内容概述\": \"专项转移支付资金应当按照预算级次和程序下达，严禁随意调增调减，确需调整的须按规定程序报批。\"\n  }\n]"
- expression: (明细表.接收单位 IS NULL) OR (明细表.接收单位 LIKE '%等%') OR (明细表.接收单位 LIKE '%相关单位%') OR (NOT EXISTS (SELECT 1 FROM 附件-资金分配明细表
    WHERE 附件-资金分配明细表.资金编号 = 明细表.资金编号 AND 附件-资金分配明细表.接收单位明细不为空))
  description: 接收单位字段缺失、模糊或不附带分配明细表，表明预算未细化至具体单位或项目，违反预算细化要求，易导致资金挪用。表达式综合检查字段值。
  audit_item: 财政转移支付预算下达不及时、不准确
  suspicion: 转移支付资金下达对象不明确导致挪用
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"专项转移支付预算应当分地区、分项目编制，落实到具体项目，并细化到预算单位。\"\n  }\n]"
- expression: 对照表.财政安排资金 IS NULL || (对照表.计划投资金额 - 对照表.财政安排资金) / 对照表.计划投资金额 > 0.2
  description: 当财政安排资金字段为空（即无对应财政保障）时，直接判定为不衔接；或者财政安排资金缺口超过计划投资额的20%时，视为衔接不到位，存在重大资金风险。
  audit_item: 违反政府投资计划管理相关政策规定
  suspicion: 三年滚动政府投资计划与中期财政规划衔接不符
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于实行中期财政规划管理的意见\",\n    \"法规文号\": \"国发〔2015〕3号\",\n    \"效力级别\": \"制度文件\",\n   \
    \ \"条款号\": \"三、(二)\",\n    \"内容概述\": \"中期财政规划要与政府投资规划等相衔接，强化财政规划对年度预算的约束，合理安排政府投资规模和结构。\"\n  }\n]"
- expression: (清单表.项目名称 NOT LIKE '%小区%' AND 清单表.项目名称 NOT LIKE '%学校%' AND 清单表.项目名称 NOT LIKE '%道路%' AND 清单表.建设内容 IS NULL) ||
    ABS(分析表.计划金额 - 分析表.预算金额) / 分析表.计划金额 > 0.05
  description: 当项目名称仅为大类概括（如“城市基础设施建设”）且未明确具体建设地点、规模时，视为未细化；计划金额与预算金额差异率超过5%时，视为与预算脱节。两者满足任一即判定为违规线索。
  audit_item: 违反政府投资计划管理相关政策规定
  suspicion: 政府投资年度计划未细化或与预算脱节
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当明确项目名称、建设内容及规模、建设工期、项目总投资、年度投资额及资金来源等事项；政府投资年度计划应当和本级预算相衔接。\"\n  }\n]"
- expression: (项目资本金到位情况表.实际到位时间 > 资本金到位计划文件.计划到位时间节点) || (项目资本金到位情况表.实际到位金额 < 资本金到位计划文件.计划到位金额)
  description: 比较资本金实际到位的时间与金额是否满足计划要求。任一不满足（时间滞后或金额不足）均判定为违规。这反映了出资方未履行出资协议约定。
  audit_item: 项目资本金不符合要求
  suspicion: 资本金未按计划进度和数额到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"中华人民共和国主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"股东应当按期足额缴纳公司章程中规定的各自所认缴的出资额。\"\n  }\n]"
- expression: (近三年国培计划参训教师名单（含学校属地标识）中按学校属地类型分组统计的乡村教师参训人数 / 总参训人数) < (城乡教师培训名额分配对比表.乡村教师占比 * 0.9) || (城乡教师培训名额分配对比表.乡村名额数
    / 城乡教师培训名额分配对比表.总名额数 < 城乡教师培训名额分配对比表.乡村教师占比)
  description: 若实际参训乡村教师比例低于乡村教师占区域教师总数比例的90%，或名额分配时乡村教师名额占比低于其人口占比，即判定为国培计划未向乡村教师有效倾斜。阈值90%为审计风险判断标准，可根据政策要求调整。
  audit_item: 乡村教师技能培训不符合要求
  suspicion: 国培计划名额分配未向乡村教师倾斜
  regulation: "[\n  {\n    \"法规名称\": \"教育部 财政部关于实施中小学幼儿园教师国家级培训计划（2021-2025年）的通知\",\n    \"法规文号\": \"教师〔2021〕4号\",\n    \"\
    效力级别\": \"部门规范性文件\",\n    \"条款号\": \"二、重点任务 （一）聚焦乡村教师\",\n    \"内容概述\": \"培训名额分配向乡村教师倾斜，确保乡村教师参训比例适应国家乡村振兴战略和乡村教师队伍建设需要。\"\
    \n  },\n  {\n    \"法规名称\": \"国务院办公厅关于印发乡村教师支持计划（2015—2020年）的通知\",\n    \"法规文号\": \"国办发〔2015〕43号\",\n    \"效力级别\""
- expression: FILE(项目库建立批复日期) IS NULL || TABLE(项目库记录条数、最早项目入库时间、库内项目编号).项目库记录条数 == 0 || TABLE(项目库记录条数、最早项目入库时间、库内项目编号).最早项目入库时间
    > FILE(首个年度计划编制年月、计划年份、发文号、审批记录、计划项目编号、项目名称).首个年度计划编制年月
  description: 项目库未建立或为空，或项目库建立时间晚于第一个年度计划编制时间，表明未形成前置规划储备，年度计划缺乏依据。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 未同步建立农村公路建设规划项目库
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"县级以上地方人民政府交通运输主管部门应当根据农村公路建设规划建立项目库，实行项目库管理。\"\n  }\n]"
- expression: FILE(首个年度计划编制年月) IS NULL || (TABLE(计划年度)中某一年度无计划记录 && TABLE(研究年度计划议题)中无年度计划审议内容)
  description: 缺失正式年度计划文件，且无任何计划任务记录和会议审议痕迹，可判定年度计划未编制。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 未编制农村公路建设项目年度计划
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"农村公路建设应当编制年度计划，年度计划应当与规划项目库相衔接。\"\n  }\n]"
- expression: SET_DIFF(计划文件.计划项目编号集合, 项目库记录条数.库内项目编号集合).COUNT > 0 && (会议纪要.特殊审批程序 == NULL || ABS(会议纪要.特殊审批程序.COUNT) / 计划文件.计划项目编号集合.COUNT
    > 0.3)
  description: 年度计划中若存在未在项目库中的项目，且无合规的特殊审批程序或超库项目数异常偏高（占比>30%），判定为计划编制违规。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 年度计划包含不在规划项目库中的项目
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"年度计划应当从规划项目库中选择项目。\"\n  }\n]"
- expression: (监测表.实时库存量 < 分解表.计划数量 * 0.9) || (检测报告.判定结论 == "不合格" && 登记表.不合格处理记录.isBlank()) || (监测表.储备品种 not.in 计划文件.计划储备品种)
  description: 以年度任务计划为基准，实际库存量低于计划数量的90%即视为数量未达标；质量检测结论为不合格且抽检登记表中无任何处理措施（如降级、转商、销毁）则判定质量管控失效；实际库存品种与计划品种存在差异且无审批变更手续的，视为擅自变更储备品种。三项满足任一即为疑点。
  audit_item: 救灾备荒种子储备方面不符合相关规定
  suspicion: 救灾备荒种子储备任务未完成或质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"国家救灾备荒种子储备管理办法\",\n    \"法规文号\": \"农农发〔2015〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条、第十条\",\n    \"内容概述\": \"承储单位应严格按照下达的储备计划完成储备任务，确保储备种子的品种、数量和质量符合要求；储备种子质量应符合国家或行业标准。\"\n  }\n]"
- expression: (明细表.实际库存数量 < 计划文件.计划储备总量 * 0.9 && DATEDIFF(明细表.生产日期, 计划文件.最低保有量) > 15) || 检测报告.检测结论 != '合格'
  description: 实际库存量低于计划储备量的90%且持续超过15天，视为数量不达标；质量检测报告中结论为不合格即视为质量不达标，二者满足任一条件即生成疑点。
  audit_item: 落实政府猪肉储备政策不到位
  suspicion: 政府猪肉常规储备数量不达标或质量不合格
  regulation: "[\n  {\n    \"法规名称\": \"关于完善政府猪肉储备调节机制 做好猪肉市场保供稳价工作预案\",\n    \"法规文号\": \"发改价格〔2021〕770号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"三、（一）常规储备\",\n    \"内容概述\": \"地方常规储备规模按城市常住人口每人每天二两、保障城区常住人口3天消费量确定，必须确保数量真实、质量合格和储存安全，实行专库储存、专人管理、专账记载。\"\
    \n  }\n]"
- expression: 年度建设项目计划文件不存在 || (年度计划项目数 == 0 || 财政拨款项目与年度计划匹配率 < 70%)
  description: 无法提供经政府批复的正式年度计划文件，或计划中无任何项目，或实际拨款项目与计划匹配率低于70%，表明未实质编制年度计划。
  audit_item: 项目规划及资金使用不符合规定
  suspicion: 未编制农村公路建设项目年度计划
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"地方交通运输主管部门应当根据规划项目库编制农村公路建设项目年度计划，报同级人民政府批准后执行。\"\n  }\n]"
- expression: (实际完成工程量 < 计划工程量) && (实际建设面积 < 上级下达建设任务指标) || (已支付工程量对应进度款占比 >= 95% && 实际完成工程量 < 计划工程量)
  description: 判定规则：1）实际完成的工程量（如渠道长度、道路面积）少于设计或计划工程量，同时实际建成面积低于上级下达的任务指标，直接认定为未完成目标任务；2）虽资金支付比例已达95%以上，但实际工程量仍低于计划，预警为“资金超前支付但工程滞后”，可能存在挪用资金或虚报进度的风险。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 未完成高标准农田建设目标任务
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"项目建设单位应当按照规定程序和批复的初步设计组织项目实施，不得擅自变更建设地点、规模、标准和主要建设内容，确保完成建设任务。\"\n  }\n]"
- expression: 中央补助项目清单（表1）.项目编码 IS NOT NULL AND 中央补助项目清单（表1）.项目编码 NOT IN (SELECT 地方保障性安居工程项目库（表2）.项目编码 FROM 地方保障性安居工程项目库（表2）
    UNION SELECT 地方年度建设计划文件（文件2）.计划项目编码 FROM 地方年度建设计划文件（文件2）)
  description: 检查获得中央补助的项目（表1）是否全部存在于地方保障性安居工程项目库（表2）或年度建设计划文件（文件2）中。若补助项目未纳入任何官方计划，即触发疑点。该表达式通过项目编码关联，凡是表1中项目编码对应不到计划库记录的，均为高风险项目。
  audit_item: 不符合条件项目违规获得保障性安居工程建设中央预算内投资补助
  suspicion: 未纳入建设计划的项目获得中央投资补助
  regulation: "[\n  {\n    \"法规名称\": \"中央预算内投资保障性安居工程专项管理暂行办法\",\n    \"法规文号\": \"发改投资规〔2019〕1097号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"申报中央预算内投资补助的项目，必须纳入国家重大建设项目库和三年滚动投资计划，未纳入的不得安排中央预算内投资。\"\n  }\n]"
- expression: 统计表.接收退役士兵数 / 单位名称在职总人数.在职总人数 < 规定接收比例.规定接收比例
  description: 将接收退役士兵数除以单位在职总人数，与地方政策规定的最低接收比例（如不低于1%）比较，若低于则为违规。
  audit_item: 未按规定落实退役士兵安置政策
  suspicion: 接收退役士兵占在职人数比例低于政策标准
  regulation: "[\n  {\n    \"法规名称\": \"退役士兵安置条例\",\n    \"法规文号\": \"国务院、中央军委令第608号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十三条\",\n    \"内容概述\": \"安置地县级以上地方人民政府应当按照属地管理的原则，对符合安排工作条件的退役士兵进行安置，保障其第一次就业。地方可根据实际情况制定具体接收比例。\"\n  },\n  {\n \
    \   \"法规名称\": \"地方退役士兵安置实施细则\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"相关接收比例条款\",\n    \"内容概述\"\
    : \"明确规定"
- expression: (批复文件.批复文号 IS NULL) || (计划文件.年度计划项目清单中未包含该项目名称)
  description: 立项批复文件缺失或无效，或者项目名称未被列入当地经济适用住房年度建设计划及用地计划清单，即触发疑点。任一条件成立则判定为违规。
  audit_item: 违规集资合作建房
  suspicion: 未经批准或未纳入计划集资合作建房
  regulation: "[\n  {\n    \"法规名称\": \"经济适用住房管理办法\",\n    \"法规文号\": \"建住房〔2007〕258号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"市、县人民政府应编制经济适用住房年度建设计划，并纳入当地国民经济和社会发展计划；经济适用住房建设必须严格执行国家规定的各项审批程序和建设标准。\"\n  }\n]"
