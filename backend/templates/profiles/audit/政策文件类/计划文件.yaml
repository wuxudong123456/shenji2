name: audit/政策文件类/计划文件
type: model
description: 从政策文件类类文档（计划文件）中提取结构化元数据。涵盖字段如：上级下达建设任务指标、乡村教师占比目标、保护性耕作推广计划面积、具体项目单位、分布位置、分年度计划还款金额、化解总目标、发文号。文档范围包括：三年滚动政府投资计划文件、债务化解方案实施计划文件、农村公路建设项目年度计划文件、地方年度建设计划文件（文件2）、地方退役军人事务部门下达的安置计划文件、季度政府猪肉储备计划文件、年度储备任务计划文件、年度建设项目计划文件、年度政府投资计划文件、年度政府猪肉储备计划文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 培训
- 审批
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
