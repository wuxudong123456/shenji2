name: audit/政策文件类/采购文件
type: model
description: 从政策文件类类文档（采购文件）中提取结构化元数据。涵盖字段如：中标单价、中标通知书、供应商、供应商基本信息、合同总价、技术参数明细、投标人资格要求条款、招标公告。文档范围包括：政府采购文件、采购文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 合同
- 招投标
- 明细
- 采购
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 采购文件
  member_count: 1
  member_details:
  - 政府采购文件
  - 采购文件
output:
  fields:
  - name: 中标单价
    type: number
    description: 提取 中标单价 的数值（含单位，如万元、吨等）
  - name: 中标通知书
    type: string
    description: 提取 中标通知书 的文本值
  - name: 供应商
    type: string
    description: 提取 供应商 的文本值
  - name: 供应商基本信息
    type: string
    description: 提取 供应商基本信息 的文本值
  - name: 合同总价
    type: string
    description: 提取 合同总价 的文本值
  - name: 技术参数明细
    type: string
    description: 提取 技术参数明细 的文本值
  - name: 投标人资格要求条款
    type: number
    description: 提取 投标人资格要求条款 的数值（含单位，如万元、吨等）
  - name: 招标公告
    type: string
    description: 提取 招标公告 的文本值
  - name: 招标文件中关于公告内容的条款
    type: number
    description: 提取 招标文件中关于公告内容的条款 的数值（含单位，如万元、吨等）
  - name: 评审因素与评审标准
    type: string
    description: 提取 评审因素与评审标准 的文本值
  - name: 采购合同
    type: string
    description: 提取 采购合同 的文本值
violations:
- expression: (记录表.中标金额 IS NULL) || (记录表.中标供应商名称 IS NULL) || (记录表.评分明细 IS NULL)
  description: 法定公告要素应当包含中标金额、中标供应商名称、评分明细等关键信息。任何一项缺失，即属于公示内容不完整。
  audit_item: 未公开政府采购标准和采购结果
  suspicion: 采购结果公告内容缺失法定必要信息
  regulation: "[\n  {\n    \"法规名称\": \"政府采购信息发布管理办法\",\n    \"法规文号\": \"财政部令第101号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"中标、成交结果公告内容应当包括：采购项目编号、名称；采购人名称、地址；中标、成交供应商名称、地址和中标、成交金额；主要中标、成交标的的名称、规格型号、数量、单价、服务要求；评审专家名单；公告期限等。\"\
    \n  },\n  {\n    \"法规名称\": \"关于做好政府采购信息公开工作的通知\",\n    \"法规文号\": \"财库〔2015〕135号\",\n    \"效力级别\": \"制度文件\","
- expression: (技术参数明细.技术参数明细 = 空 OR 技术参数明细.技术参数明细 仅包含‘符合行业标准’‘满足使用需求’等模糊措辞 OR 技术参数明细.技术参数明细 未包含任何具体数值和计量单位) || (评审因素与评审标准（含价格分计算公式）.评审因素与评审标准（含价格分计算公式）
    = 空 OR 评审因素与评审标准（含价格分计算公式）.评审因素与评审标准（含价格分计算公式） 未公开价格分权重、评分公式等任一客观量化标准) || (涉及资格条件、技术参数、评分标准的限制性条款.涉及资格条件、技术参数、评分标准的限制性条款
    = 是 AND 采购文件.对应条款公开 = 否)
  description: 技术参数明细为空或仅含模糊表述，即属于未依法公开具体技术标准；评审标准中如未完整披露价格分计算细节、权重分配等，视为未公开评审标准；通过比对内部决策文件与公开采购文件，发现存在倾向性条款但未在公开文件中载明的，认定为隐匿采购标准。以上任一条件满足即触发疑点。
  audit_item: 未公开政府采购标准和采购结果
  suspicion: 采购人未依法公布政府采购项目的采购标准
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"招标文件应当包括采购项目的商务条件、采购需求、投标人的资格条件、投标报价要求、评标方法、评标标准以及拟签订的合同文本等，采购标准未在招标文件中全面载明即属违法。\"\n\
    \  }\n]"
- expression: (申报材料.实施主体对比表.子项目列表 > 1 && ABS(SUM(子项目金额) - 申报材料.总预算) < 申报材料.总预算*0.05) && (采购文件.招标公告 == '非公开招标' && SUM(子项目金额)
    > 管理制度.公开招标限额) && (关联表.子项目收款方 存在 采购文件.供应商 或 关联表.关联关系)
  description: 将一个整体项目拆分为多个子项目，每个子项目金额均低于公开招标限额，但总额超出限额且供应商高度集中，同时实际总支出与原预算总规模一致，即可疑为人为拆分规避招标并可能虚增费用。
  audit_item: 编制虚假预算
  suspicion: 拆分项目规避监管套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"中华人民共和国主席令第六十八号（2014年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第二十八条、第六十四条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购；采购代理机构不得以不合理条件限制或者排斥潜在供应商。\"\
    \n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第"
- expression: (ABS(申报材料.单价 - 询价记录.同期同类物资/工程市场均价) / 询价记录.同期同类物资/工程市场均价 > 0.3 || 执行记录.验收数量 < 申报材料.申报数量 * 0.8) && 明细表.金额 > 0
  description: 当预算单价较市场均价偏离超过30%，或实际验收数量少于申报数量的80%时，触发疑点；虚增规模可结合工程量测绘数据进一步核实。
  audit_item: 编制虚假预算
  suspicion: 虚增项目规模或单价套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号（2014年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第九十三条第一款\",\n    \"内容概述\": \"预算支出应当真实，不得虚报项目规模、虚增单价，造成虚列支出。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条第一款\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，属于违规行为，应当追"
