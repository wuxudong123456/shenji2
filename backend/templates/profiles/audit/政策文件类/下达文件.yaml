name: audit/政策文件类/下达文件
type: model
description: 从政策文件类类文档（下达文件）中提取结构化元数据。涵盖字段如：上级发文日期、上级资金到账日期、下达日期、下达金额、发文文号、指定用途描述、文件签发日期、资金下达日期。文档范围包括：下达文件、中央和地方政府关于就业补助资金的预算下达文件、省级下达文件、财政资金下达文件、资金下达文件、资金预算下达文件、项目资金下达文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 项目
- 预算
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 下达文件
  member_count: 1
  member_details:
  - 下达文件
  - 中央和地方政府关于就业补助资金的预算下达文件
  - 省级下达文件
  - 财政资金下达文件
  - 资金下达文件
  - 资金预算下达文件
  - 项目资金下达文件
output:
  fields:
  - name: 上级发文日期
    type: date
    description: 提取 上级发文日期 的日期值，格式 YYYY-MM-DD
  - name: 上级资金到账日期
    type: date
    description: 提取 上级资金到账日期 的日期值，格式 YYYY-MM-DD
  - name: 下达日期
    type: date
    description: 提取 下达日期 的日期值，格式 YYYY-MM-DD
  - name: 下达金额
    type: number
    description: 提取 下达金额 的数值（含单位，如万元、吨等）
  - name: 发文文号
    type: string
    description: 提取 发文文号 的文本值
  - name: 指定用途描述
    type: string
    description: 提取 指定用途描述 的文本值
  - name: 文件签发日期
    type: date
    description: 提取 文件签发日期 的日期值，格式 YYYY-MM-DD
  - name: 资金下达日期
    type: date
    description: 提取 资金下达日期 的日期值，格式 YYYY-MM-DD
  - name: 资金指标金额
    type: number
    description: 提取 资金指标金额 的数值（含单位，如万元、吨等）
  - name: 资金用途限定
    type: string
    description: 提取 资金用途限定 的文本值
  - name: 资金金额
    type: number
    description: 提取 资金金额 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 预算允许的福利项目及人均限额
    type: number
    description: 提取 预算允许的福利项目及人均限额 的数值（含单位，如万元、吨等）
  - name: 预算文件文号
    type: number
    description: 提取 预算文件文号 的数值（含单位，如万元、吨等）
  - name: 预算项目名称
    type: number
    description: 提取 预算项目名称 的数值（含单位，如万元、吨等）
violations:
- expression: (明细表.支出科目 CONTAINS ('基建','工程','装修','楼堂馆所') OR 收款方行业类别 == '建筑业') AND (明细表.项目名称 NOT IN (下达日期.预算项目名称)) AND (行对账单.交易对方名称
    == 基建合同.施工方名称)
  description: 筛查支出明细表中包含基建相关关键词或收款方为建筑业，且项目名称不在预算批复的允许范围内，同时银行流水收款方与基建合同施工单位一致。任一条件触发即视为挪用嫌疑，需进一步核实。
  audit_item: 挤占挪用套取财政资金
  suspicion: 挪用财政资金用于基建工程
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得……（二）截留、挪用财政资金；……\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\",\n    \"\
    内容概述\":"
- expression: (财务凭证.记账科目 == '福利费' AND (对比表.实际人均福利支出 > 对比表.预算标准 OR 财务凭证.摘要 NOT IN (下达文件.资金用途限定))) OR (财务凭证.支出摘要 CONTAINS ('节日慰问','购物卡','旅游')
    AND 财务凭证.支出事由 IN ('财政专项','行政运行经费') AND 财务凭证.附件完整性)
  description: 直接列支福利费且超标准或超范围，或通过伪装成其他支出（如培训费、会议费）变相发放福利。当福利支出摘要中出现购物卡、旅游等关键词且资金来源为财政专项或公用经费时触发疑点。
  audit_item: 挤占挪用套取财政资金
  suspicion: 挪用财政资金用于职工福利
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员……违反规定使用、骗取财政资金……（四）违反规定扩大开支范围，提高开支标准。\"\n  },\n  {\n    \"法规名称\": \"违规发放津贴补贴行为处分规定\"\
    ,\n    \"法规文号\": \"监察部令第31号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"违反规定自行新设项目或者继续发放已经明令取消的津贴补"
- expression: (省级农业社会化服务绩效评价实施方案.评价启动日期 - 项目资金下达文件.资金下达日期 > 60) || (年度农业社会化服务工作计划.实际考核完成日期 - 年度农业社会化服务工作计划.计划考核完成日期 > 60)
  description: 资金下达后超过60天仍未启动绩效评价，或实际完成考核时间超出计划截止日期60天以上，视为考核工作严重滞后。
  audit_item: 农业社会化服务绩效考核不科学
  suspicion: 绩效评价工作严重滞后未按时启动
  regulation: "[\n  {\n    \"法规名称\": \"农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"地方各级农业农村部门应当加强项目绩效管理，建立健全绩效评价指标体系，及时组织开展绩效评价工作。\"\n  }\n]"
- expression: 任务清单与预算匹配对照表.匹配状态 == “未匹配” || (资金预算下达文件.清单下发日期 - 资金预算下达文件.下达日期 > 15 && 资金使用台账.对应任务清单编号 为空)
  description: 当预算资金下达时未附带任务清单，或任务清单下发日期晚于资金下达日期15天以上，且资金支出时未引用任务清单编号，表明资金与任务脱节。30天以上为严重不同步。
  audit_item: “大专项+任务清单”管理不到位
  suspicion: 资金预算下达时未同步下达任务清单
  regulation: "[\n  {\n    \"法规名称\": \"财政部 农业农村部关于印发《中央财政农业相关转移支付资金“大专项+任务清单”管理改革实施方案》的通知\",\n    \"法规文号\": \"财农〔2019〕45号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"四、（一）\",\n    \"内容概述\": \"财政部门下达转移支付预算时应同步下达任务清单，确保资金与任务匹配，地方在接到任务清单后方可按清单使用资金。\"\
    \n  }\n]"
- expression: (财政资金收支明细台账.资金收入日期 < DATE_SUB(CURDATE(), INTERVAL 365 DAY)) AND (保障性安居工程项目清单.开工状态 != '已开工' OR 项目施工许可证.施工许可证发证日期
    IS NULL) AND (财政资金收支明细台账.支出金额 = 0 OR 财政资金收支明细台账.当前余额 / 财政资金下达文件.资金金额 > 0.9)
  description: 筛选资金下达后超过365天，对应项目开工状态非'已开工'或无施工许可证，且资金支出为零或余额占下达金额比例超过90%的记录，判定为资金闲置未用。
  audit_item: 保障性安居工程财政资金长期闲置未用
  suspicion: 财政资金已下达但项目未落实或未开工导致闲置
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程补助资金管理办法\",\n    \"法规文号\": \"财综〔2022〕37号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十四条\",\n    \"内容概述\": \"地方各级财政部门应当加强补助资金的预算执行管理，提高资金使用效益，对年度执行中形成的闲置资金，应当及时清理收回。\"\n  }\n]"
- expression: DATEDIFF(明细表.预算下达时间, 下达文件.上级发文日期) > 30
  description: 根据《就业补助资金管理办法》要求，收到上级转移支付后30日内应完成分解下达。计算上级发文日期至本级实际下达日期的天数差，超过30日即判定为拨付不及时。
  audit_item: 就业补助资金滞留闲置
  suspicion: 就业补助资金下达、拨付不及时
  regulation: "[\n  {\n    \"法规名称\": \"财政部 人力资源社会保障部关于印发《就业补助资金管理办法》的通知\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二十六条\",\n    \"内容概述\": \"省级财政、人社部门应在收到中央财政转移支付后，于30日内正式分解下达至市县财政和人社部门；地方各级财政、人社部门应按规定及时办理资金支付，加快预算执行进度。\"\
    \n  }\n]"
- expression: (下达文件.指定用途描述 NOT IN 管理办法.资金允许列支范围) || (抽查资料.实际建设内容 != 保障房建设或租赁补贴)
  description: 中央管理办法明确资金限于棚改、公租房、租赁补贴等；省级文件或实际支出若出现‘城市绿化’‘道路建设’‘偿还债务’等字眼即触发；未经财政部备案的调剂均属擅自调整。
  audit_item: 财政部门未按规定分配下达保障性安居工程专项资金
  suspicion: 省级财政部门擅自调整专项资金用途
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程补助资金管理办法\",\n    \"法规文号\": \"财综〔2022〕1号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十四条\",\n    \"内容概述\": \"补助资金主要用于保障性住房建设、棚户区改造、租赁补贴发放等，不得用于非保障性安居工程支出。\"\n  }\n]"
- expression: (审批记录.审批日期 > 日志.支付指令发起人与审批人) || (审批记录.签批意见 == 审批记录.审批人) || (审批记录.批准期限 > 0)
  description: 支付日期早于审批日期为逆程序操作；同一人兼任发起岗和审批岗为不相容岗位未分离；审批记录缺少规定环节签字（如集体决策）即构成违规。
  audit_item: 财政部门未按规定分配下达保障性安居工程专项资金
  suspicion: 专项资金分配审批流程不合规
  regulation: "[\n  {\n    \"法规名称\": \"行政事业单位内部控制规范（试行）\",\n    \"法规文号\": \"财会〔2012〕21号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条、第十八条\",\n    \"内容概述\": \"单位应当建立不相容岗位相互分离、相互监督的机制；重大资金拨付应执行授权审批控制，严禁逆程序操作。\"\n  }\n]"
