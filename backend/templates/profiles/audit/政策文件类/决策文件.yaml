name: audit/政策文件类/决策文件
type: model
description: 从政策文件类类文档（决策文件）中提取结构化元数据。涵盖字段如：三方共担决策过程、入库审批的讨论记录、公示记录、关于库设立、决策会议日期、决策会议纪要、决策会议记录、参会人员。文档范围包括：临时收储的政府决策文件、代偿风险分担相关会议纪要或决策文件、储备投放的政府决策文件、内部决策文件、合作社内部决策文件、对外投资决策文件、改革决策文件、相关决策文件、资金盘活决策文件、资金统筹使用决策文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 人员
- 会议
- 审批
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 决策文件
  member_count: 1
  member_details:
  - 临时收储的政府决策文件
  - 代偿风险分担相关会议纪要或决策文件
  - 储备投放的政府决策文件
  - 内部决策文件
  - 合作社内部决策文件
  - 对外投资决策文件
  - 改革决策文件
  - 相关决策文件
  - 资金盘活决策文件
  - 资金统筹使用决策文件
output:
  fields:
  - name: 三方共担决策过程
    type: string
    description: 提取 三方共担决策过程 的文本值
  - name: 入库审批的讨论记录
    type: string
    description: 提取 入库审批的讨论记录 的文本值
  - name: 公示记录
    type: string
    description: 提取 公示记录 的文本值
  - name: 关于库设立
    type: string
    description: 提取 关于库设立 的文本值
  - name: 决策会议日期
    type: date
    description: 提取 决策会议日期 的日期值，格式 YYYY-MM-DD
  - name: 决策会议纪要
    type: string
    description: 提取 决策会议纪要 的文本值
  - name: 决策会议记录
    type: string
    description: 提取 决策会议记录 的文本值
  - name: 参会人员
    type: string
    description: 提取 参会人员 的文本值
  - name: 投放令签发日期
    type: date
    description: 提取 投放令签发日期 的日期值，格式 YYYY-MM-DD
  - name: 投放区域
    type: string
    description: 提取 投放区域 的文本值
  - name: 投资金额
    type: number
    description: 提取 投资金额 的数值（含单位，如万元、吨等）
  - name: 投资项目名称
    type: string
    description: 提取 投资项目名称 的文本值
  - name: 收储令签发日期
    type: date
    description: 提取 收储令签发日期 的日期值，格式 YYYY-MM-DD
  - name: 改革方案是否经职工代表大会审议
    type: boolean
    description: 提取 改革方案是否经职工代表大会审议 的布尔值（是/否）
  - name: 比例调整记录
    type: number
    description: 提取 比例调整记录 的数值（含单位，如万元、吨等）
  - name: 盘活资金金额
    type: number
    description: 提取 盘活资金金额 的数值（含单位，如万元、吨等）
  - name: 表决事项
    type: string
    description: 提取 表决事项 的文本值
  - name: 表决结果
    type: boolean
    description: 提取 表决结果 的布尔值（是/否）
  - name: 要求用途
    type: string
    description: 提取 要求用途 的文本值
  - name: 计划投放数量
    type: number
    description: 提取 计划投放数量 的数值（含单位，如万元、吨等）
  - name: 计划收储量
    type: string
    description: 提取 计划收储量 的文本值
  - name: 讨论事项
    type: string
    description: 提取 讨论事项 的文本值
  - name: 赞成票比例
    type: number
    description: 提取 赞成票比例 的数值（含单位，如万元、吨等）
violations:
- expression: (决策文件.决策会议记录 == null || 批复文件.资产处置批复文件 == null) || (决策文件.投资金额 > 批复文件.批复金额) || (项目清单.被投资单位名称 IN (关联方清单) && 决策文件.风险评估结论
    != '低风险' && 项目清单.持股比例 > 50%) || (注册资料.工商登记股东名册 IN (SELECT 工商登记股东名册 FROM 注册资料 WHERE 项目清单.资产评估报告编号 == null) ) || (核对表.实收股利
    < 核对表.应收股利 * 0.8 && 投资年限 > 2)
  description: 判定逻辑：1. 投资缺失财政审批或风险评估；2. 投资额超批复；3. 对关联方进行高风险大额投资；4. 投资时未履行资产评估程序；5. 投资超过2年但股利回收率低于80%。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规对外投资国有资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十二条\",\n    \"内容概述\": \"企业对外投资应当依法进行可行性研究和风险评估，并按照规定权限履行审批程序。\"\n  },\n  {\n    \"法规名称\": \"事业单位国有资产管理暂行办法\"\
    ,\n    \"法规文号\": \"财政部令第36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十六条\",\n    \"内容概述\": \"事业单位利用国有资产对外投资，应当进行可行性论证和资产评估"
- expression: (资产评估报告.评估基准日 IS NULL) || (资产交易明细表.交易价格 / 资产评估报告.评估价值 < 0.9) || (资产交易明细表.是否关联方 = '是' && 改革决策文件.公示记录 IS NULL)
    || (改革决策文件.改革方案是否经职工代表大会审议 IS NULL)
  description: 无评估报告直接违规；交易价格低于评估价90%视为异常低价；交易对象为管理层亲属等关联方且未披露或未经职工代表大会审议，存在利益输送嫌疑；缺少职工代表大会决议，程序违规。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 社有企业改革过程中资产交易不公开透明导致资产流失
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产评估管理暂行办法\",\n    \"法规文号\": \"国务院国资委令第12号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条、第二十二条\",\n    \"内容概述\": \"企业改制、产权转让等经济行为应当对相关资产进行评估；评估结果作为交易价格的参考依据，交易价格低于评估结果的90%时，应当暂停交易。\"\n  }\n]"
- expression: (日报表.猪粮比价 < 机制文件.过度下跌预警阈值（如猪粮比） && DATEDIFF(决策文件.投放令签发日期, 日报表.监测日期) > 机制文件.时限要求) || (日报表.猪粮比价 < 机制文件.过度下跌预警阈值（如猪粮比）
    && 决策文件 == NULL)
  description: 当价格监测数据达到过度下跌预警阈值（如猪粮比低于5:1）后，未在规定时限内（如7个工作日）作出收储决策或未形成任何决策文件，即判定为未按规定实施临时收储。
  audit_item: 落实政府猪肉储备政策不到位
  suspicion: 价格过度下跌时未启动临时储备收储
  regulation: "[\n  {\n    \"法规名称\": \"关于完善政府猪肉储备调节机制 做好猪肉市场保供稳价工作预案\",\n    \"法规文号\": \"发改价格〔2021〕770号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"三、（二）临时储备收储\",\n    \"内容概述\": \"当猪粮比价进入过度下跌一级预警区间时，由地方人民政府负责启动临时储备收储，收储数量、时间、价格等由各地根据预案具体确定，并规定响应启动时限和资金保障。\"\
    \n  }\n]"
- expression: (测日报表.同比涨幅 > 过度下跌预警阈值（如猪粮比）.过度上涨预警阈值 && DATEDIFF(决策文件.投放令签发日期, 测日报表.监测日期) > 过度下跌预警阈值（如猪粮比）.投放响应时限) || (决策文件.计划投放数量
    > 0 && 记录表.投放数量 / 决策文件.计划投放数量 < 0.8)
  description: 当猪肉零售价同比涨幅超过制度规定的过度上涨阈值（如40%）后，超过规定响应时限未作出投放决策，或虽已决策但实际投放量不足计划量的80%，均属违规。
  audit_item: 落实政府猪肉储备政策不到位
  suspicion: 价格过度上涨时未及时投放政府猪肉储备
  regulation: "[\n  {\n    \"法规名称\": \"关于完善政府猪肉储备调节机制 做好猪肉市场保供稳价工作预案\",\n    \"法规文号\": \"发改价格〔2021〕770号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"三、（三）储备投放\",\n    \"内容概述\": \"当猪肉价格出现过度上涨时，地方政府应适时投放政府猪肉储备，增加市场供应，引导价格合理运行，投放数量、价格和区域需满足预案要求，确保投放实效。\"\
    \n  }\n]"
- expression: (公租房补助资金专项账户流水明细.摘要 LIKE '%盘活%' || 资金统筹使用决策文件.要求用途 = '盘活调剂') && (公租房财政补助资金调剂使用审批记录.审批意见 != '同意调剂' || 财政资金收支明细台账.支出用途
    NOT LIKE '%保障性安居工程%' || 资金统筹使用决策文件.要求用途 = '收回统筹' && 财政资金收支明细台账.支出用途 IS NULL)
  description: 盘活资金从补助专户转出后，缺少有效调剂审批或虽审批但用途非保障性安居工程，或决策要求收回统筹但实际未执行，判定为违规盘活资金使用。
  audit_item: 保障性安居工程财政资金长期闲置未用
  suspicion: 盘活资金未按规定用途调剂或收回统筹
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程补助资金管理办法\",\n    \"法规文号\": \"财综〔2022〕37号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二十条\",\n    \"内容概述\": \"补助资金不得用于与城镇保障性安居工程建设无关的支出，不得挤占、挪用。\"\n  }\n]"
- expression: (签约机构、各自承担风险比例、赔付触发条件 缺失) OR (对照表.协议约定比例 != 政策规定比例) OR (ABS(情况表.实际执行比例 - 政策文件.规定的风险分担比例要求) > 5%)
  description: 政策规定通常要求政府、银行、担保机构按约定比例（如70%:20%:10%）共同承担贷款风险。如果未签订任何风险共担协议，或协议约定的分担比例与政策文件要求明显不符，或实际代偿执行时各机构承担比例与协议约定偏差率超过5%，均视为违规。经济下行期若因未调整比例导致银行承担过高风险，同样构成执行不到位。
  audit_item: 创业担保贷款政策执行不到位
  suspicion: 未按规定建立或执行创业担保贷款风险共担机制
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加大创业担保贷款贴息力度全力支持重点群体创业就业的通知\",\n    \"法规文号\": \"财金〔2020〕21号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"优化风险分担机制，担保基金、省级再担保机构、经办银行原则上按约定比例分担风险，经办银行承担比例不低于20%。\"\n  },\n \
    \ {\n    \"法规名称\": \"关于印发《普惠金融发展专项资金管理办法》的通知\",\n    \"法规文号\": \"财金〔2019〕96号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条\""
