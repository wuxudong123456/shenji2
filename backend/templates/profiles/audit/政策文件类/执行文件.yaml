  - name: 政策规定的贷款利率
    type: number
    description: 提取 政策规定的贷款利率 的数值（含单位，如万元、吨等）
  - name: 标杆电价
    type: string
    description: 提取 标杆电价 的文本值
  - name: 用地租金减免标准
    type: string
    description: 提取 用地租金减免标准 的文本值
  - name: 申报流程
    type: string
    description: 提取 申报流程 的文本值
  - name: 税费减免比例
    type: number
    description: 提取 税费减免比例 的数值（含单位，如万元、吨等）
  - name: 结算周期要求
    type: string
    description: 提取 结算周期要求 的文本值
  - name: 贴息率
    type: string
    description: 提取 贴息率 的文本值
  - name: 贷款抵押率上限要求
    type: number
    description: 提取 贷款抵押率上限要求 的数值（含单位，如万元、吨等）
  - name: 贷款期限规定
    type: number
    description: 提取 贷款期限规定 的数值（含单位，如万元、吨等）
  - name: 资金来源公开信息
    type: string
    description: 提取 资金来源公开信息 的文本值
  - name: 运维资金拨付计划
    type: string
    description: 提取 运维资金拨付计划 的文本值
  - name: 适用企业范围
    type: string
    description: 提取 适用企业范围 的文本值
  - name: 适用对象
    type: string
    description: 提取 适用对象 的文本值
  - name: 适用范围
    type: string
    description: 提取 适用范围 的文本值
violations:
- expression: (企业名称、实际用电价格、实际税费减免额、贷款获得及贴息金额.实际用电价格 > 税费减免比例.优惠电价标准) || (企业名称、实际用电价格、实际税费减免额、贷款获得及贴息金额.实际税费减免额 < 税费减免比例.税费减免比例)
    || (企业名称、实际用电价格、实际税费减免额、贷款获得及贴息金额.贷款获得及贴息金额 > 0 AND 企业名称、实际用电价格、实际税费减免额、贷款获得及贴息金额.贷款获得及贴息金额 = 0)
  description: 对照表记录的实际执行标准未达到政策文件承诺的优惠力度，包括电价未降、税费少免、贴息未到位等，即构成支持政策未落实。
  audit_item: 新型职业农民培育、农民工技能提升和返乡创业就业不符合相关规定
  suspicion: 返乡创业用地、用电、税费等支持政策执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于支持农民工等人员返乡创业的意见\",\n    \"法规文号\": \"国办发〔2015〕47号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、完善扶持政策 (四)至(六)\",\n    \"内容概述\": \"落实定向减税和普遍降费政策，对返乡创业人员按规定减免登记类、管理类和证照类行政事业性收费；对入驻创业园区的企业给予水电费、租金减免；加大返乡创业金融支持，落实创业担保贷款及贴息政策。\"\
    \n  }\n]"
- expression: （明细表.实际执行利率 - 政策规定的贷款利率.贴息率） > 政策规定的贷款利率.政策规定的贷款利率 || ABS(贷款合同.实际支付利息 - 贷款本金 * 政策规定的贷款利率.政策规定的贷款利率 * 贷款期限) >
    阈值
  description: 审查两个层面：1. 银行向企业收取的名义利率在扣除财政贴息后，企业实际承担的成本是否高于政策设定的低息目标；2. 是否存在以“手续费”、“咨询费”等名义额外收费，导致企业融资总成本偏离政策要求。
  audit_item: 畜禽粪污资源化利用方面不符合相关规定
  suspicion: 贷款贴息政策执行中变相提高融资成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国中小企业促进法\",\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"金融机构应当根据中小企业特点，为其提供公平、透明的金融服务，不得违规收取费用。\"\n  }\n]"
- expression: (分类清单.用电类别 != '农业生产用电' && (分类清单.用户名称 LIKE '%农业%' || 信息.经营范围 CONTAINS '种植' || '养殖')) && 分类清单.目录电价 > 执行文件.优惠电价标准
  description: 根据用户名称或经营范围可判断为农业主体的，用电类别却划分为商业或工业，实际结算电价高于农业优惠电价，即存在电价执行错误。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业用户电价未执行优惠类别
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"农业生产用电是指用于农业、林业、牧业、渔业生产的用电，应执行相应电价类别，任何单位不得擅自改变用电类别。\"\n  }\n]"
- expression: 实际均价（元/度）对比表.实际均价（元/度） > 实际均价（元/度）对比表.政策标准均价（元/度） && 实际均价（元/度）对比表.电费计费代码 == '一般工业用电' && 实际均价（元/度）对比表.电费计费代码
    != '农业生产用电'
  description: 如果秸秆加工企业（如生物质发电厂、饲料加工厂）的电费执行类别为‘一般工业用电’（约0.8元/度），而根据规定应执行‘农业生产用电’（约0.5元/度），即实际均价远高于政策标准，且电费计费代码未变更，则判定为用地用电优惠未落实。
  audit_item: 秸秆综合回收利用方面不符合相关规定
  suspicion: 秸秆利用企业非农电价违规计费
  regulation: "[\n  {\n    \"法规名称\": \"关于创新和完善促进绿色发展价格机制的意见\",\n    \"法规文号\": \"发改价格规〔2018〕943号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、（五）完善部分环保行业用电支持政策\",\n    \"内容概述\": \"明确对实行两部制电价的污水、垃圾、农林废弃物资源化利用等环保行业企业，给予用电优惠支持，部分地区明确执行农业生产用电价格。\"\
    \n  }\n]"
- expression: 企业名单.实际执行抵押率 > 政策指导利率.贷款抵押率上限要求
  description: 提取贷款发放详细记录中的‘抵押物评估价值’与‘贷款本金’，计算实际抵押率（贷款本金/抵押物价值）。若该比率显著高于政策执行文件中规定的贷款抵押率上限（例如政策规定最高120%，而银行要求200%），则判定为未落实信贷优惠政策，属于变相提高授信门槛。
  audit_item: 秸秆综合回收利用方面不符合相关规定
  suspicion: 秸秆利用项目信贷门槛设定不合规
  regulation: "[\n  {\n    \"法规名称\": \"关于金融服务乡村振兴的指导意见\",\n    \"法规文号\": \"银发〔2019〕11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十一条\",\n    \"内容概述\": \"鼓励银行业金融机构加大对农村产业融合发展的信贷支持，依法合规拓宽农业农村抵质押物范围，合理确定贷款额度、期限和利率，降低‘三农’信贷担保门槛。\"\n  }\n]"
- expression: (沼气发电项目上网电量统计表.实际上网电量 < 沼气发电项目上网电量统计表.可发电量 * 0.95) OR (电力公司收购协议.合同电价 < 沼气发电上网标杆电价政策执行文件.标杆电价) OR (DATEDIFF(结算日期,应结算日期)
    > 30)
  description: 三个或条件：1.电量全额保障性收购率低于95%（即弃电率>5%），收购率=实际上网电量/可发电量；2.实际结算电价低于国家规定的沼气发电标杆电价（如0.75元/度）；3.电网公司结算周期超过政策规定的月度或季度结算时限，延迟超过30天。符合任一条件判定为政策落实不到位。
  audit_item: 配套政策支持不到位
  suspicion: 沼气发电上网电价及全额保障收购政策执行打折
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国可再生能源法\",\n    \"法规文号\": \"中华人民共和国主席令第二十三号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十四条、第十九条\",\n    \"内容概述\": \"电网企业应当全额收购其电网覆盖范围内可再生能源并网发电项目的上网电量；可再生能源发电项目的上网电价，由政府价格主管部门按照有利于促进可再生能源开发利用和经济合理的原则确定。\"\
    \n  },\n  {\n    \"法规名称\": \"关于促进生物天然气产业化发展的指导意见\",\n    \"法规文号\": \"发改能源规〔2019〕1895号\",\n    \"效力级别\": \"部门"
- expression: 优惠政策执行对比表.实际执行单价 > 优惠政策执行对比表.应执行单价
  description: 通过直接比对实际收费单价与政策文件规定的优惠单价，当实际单价高于应执行单价时，表明该用户未享受应有的价格优惠。重点关注应执行降价或优惠政策的工商业用户、农业生产用户等。
  audit_item: 项目实施不合规
  suspicion: 优惠电价或气价政策执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国价格法\",\n    \"法规文号\": \"主席令第92号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十二条\"\
    ,\n    \"内容概述\": \"经营者进行价格活动，应当遵守法律、法规，执行依法制定的政府指导价、政府定价和法定的价格干预措施、紧急措施。\"\n  }\n]"
- expression: (公开内容缺少`年度建设计划` OR 缺少`补助标准` OR 缺少`资金来源`) OR (公示照片 IS NULL) OR (核查表.村民代表签字数量 < 应签字人数的50%)
  description: 七公开包括年度计划、补助政策、资金来源、招标投标、施工管理、质量监督、竣工验收七项内容。任何一项缺失或公示文件不实、群众未参与，均视为未落实制度。
  audit_item: 项目建设不符合规定
  suspicion: 农村公路建设未落实“七公开”制度
  regulation: "[\n  {\n    \"法规名称\": \"关于推进“四好农村路”建设的意见\",\n    \"法规文号\": \"国办发〔2014〕25号\",\n    \"效力级别\": \"制度文件\",\n   \
    \ \"条款号\": \"无具体条款号，但明确要求\",\n    \"内容概述\": \"要求推行农村公路建设“七公开”制度，即年度建设计划公开、补助政策公开、资金来源公开、招标投标公开、施工管理公开、质量监督公开、竣工验收公开，主动接受社会监督。\"\
    \n  }\n]"
- expression: 缴款性质 = '强制' OR (无捐赠协议 AND 收款收据备注`摊派`) OR (EXISTS ( SELECT 1 FROM 企业反馈 WHERE 企业.声明 = '被强制要求捐款' AND 缴款金额 > 0 ))
  description: 通过收款凭证性质、是否有自愿捐赠协议以及外部访谈记录判断是否属强制集资。若缺乏自愿协议或企业/个人举报，可认定为摊派。
  audit_item: 项目建设不符合规定
  suspicion: 强制向单位和个人摊派道路建设资金
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十一条\",\n    \"内容概述\": \"农村公路建设不得增加农民负担，不得损害农民利益，不得采用强制手段向单位和个人集资，不得强行让农民出工、备料。确需农民出资、投劳的，应当由村民委员会征得农民同意。\"\n  },\n\
    \  {\n    \"法规名称\": \"关于坚决制止向企业乱摊派的通知\",\n    \"法规文号\": \"国发〔1988〕25号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"一\"\
    ,\n"
- expression: 文件5 IS NULL || (文件5.优惠措施条款（税收减免、社保补贴、岗位补贴等） 不包含 '税收减免' && 文件5.优惠措施条款（税收减免、社保补贴、岗位补贴等） 不包含 '岗位补贴') || (COUNT(统计表.是否已享受优惠政策标记)
    / COUNT(统计表.招录企业名称) < 0.3) || (减免台账.减免金额 < 统计表.招录退役军人数 × 0.5)
  description: 条件1：未出台任何红包头文件；条件2：虽出台文件但缺乏核心优惠措施（税收或补贴）；条件3：实际享受优惠企业占招录企业总数比例低于30%，反映政策覆盖率低；条件4：税务系统实际减免企业数严重少于招录企业数（阈值50%），可能表现为政策宣传不到位或申报门槛过高。四个条件满足任一即触发疑点。30%和50%阈值参考典型审计经验设定。
  audit_item: 未按规定落实自主就业退役士兵安置政策
  suspicion: 未出台或未实质落实用人单位招用退役军人优惠政策
  regulation: "[\n  {\n    \"法规名称\": \"关于促进新时代退役军人就业创业工作的意见\",\n    \"法规文号\": \"退役军人部发〔2018〕26号\",\n    \"效力级别\": \"部门规章\"\
