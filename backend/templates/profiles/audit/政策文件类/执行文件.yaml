name: audit/政策文件类/执行文件
type: model
description: 从政策文件类类文档（执行文件）中提取结构化元数据。涵盖字段如：优惠价格标准、优惠对象分类、优惠电价标准、优惠电价类别、免税税种、公开内容、公开方式、公示照片。文档范围包括：农业用电价格优惠政策执行文件、农村公路建设“七公开”制度执行文件、新型农业经营主体税收优惠政策地方执行文件、沼气发电上网标杆电价政策执行文件、用地政策执行文件、用电政策执行文件、电价/气价政策执行文件、电力部门秸秆加工电价优惠执行文件、税费减免政策执行文件、贷款贴息政策执行文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 执行文件
  member_count: 1
  member_details:
  - 农业用电价格优惠政策执行文件
  - 农村公路建设“七公开”制度执行文件
  - 新型农业经营主体税收优惠政策地方执行文件
  - 沼气发电上网标杆电价政策执行文件
  - 用地政策执行文件
  - 用电政策执行文件
  - 电价/气价政策执行文件
  - 电力部门秸秆加工电价优惠执行文件
  - 税费减免政策执行文件
  - 贷款贴息政策执行文件
  - 退出执行文件
  - 退役军人就业创业税收优惠政策执行文件
  - 金融机构秸秆综合利用信贷政策执行文件
  - 项目运营管理制度执行文件
output:
  fields:
  - name: 优惠价格标准
    type: number
    description: 提取 优惠价格标准 的数值（含单位，如万元、吨等）
  - name: 优惠对象分类
    type: string
    description: 提取 优惠对象分类 的文本值
  - name: 优惠电价标准
    type: string
    description: 提取 优惠电价标准 的文本值
  - name: 优惠电价类别
    type: string
    description: 提取 优惠电价类别 的文本值
  - name: 免税税种
    type: string
    description: 提取 免税税种 的文本值
  - name: 公开内容
    type: string
    description: 提取 公开内容 的文本值
  - name: 公开方式
    type: string
    description: 提取 公开方式 的文本值
  - name: 公示照片
    type: string
    description: 提取 公示照片 的文本值
  - name: 农业用电分类标准
    type: string
    description: 提取 农业用电分类标准 的文本值
  - name: 减免条件
    type: string
    description: 提取 减免条件 的文本值
  - name: 减免税种与额度计算规则
    type: string
    description: 提取 减免税种与额度计算规则 的文本值
  - name: 合作银行名单
    type: string
    description: 提取 合作银行名单 的文本值
  - name: 备案要求
    type: string
    description: 提取 备案要求 的文本值
  - name: 执行时段
    type: string
    description: 提取 执行时段 的文本值
  - name: 执行标准代码
    type: string
    description: 提取 执行标准代码 的文本值
  - name: 承诺退出日期
    type: date
    description: 提取 承诺退出日期 的日期值，格式 YYYY-MM-DD
  - name: 政策执行起止期
    type: string
    description: 提取 政策执行起止期 的文本值
  - name: 政策指导利率
    type: string
