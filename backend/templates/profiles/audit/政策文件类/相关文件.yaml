name: audit/政策文件类/相关文件
type: model
description: 从政策文件类类文档（相关文件）中提取结构化元数据。涵盖字段如：上缴路径、优惠政策条款、制度名称、制度要求、发布机关、发放金额、处罚细则、执法标准。文档范围包括：国库集中支付制度相关文件、地方政府隐性债务相关文件、现代农业产业园土地优惠政策相关文件、畜禽养殖污染监管制度建立相关文件、结余结转资金清理相关文件、绩效管理责任分工相关文件、退捕补偿资金发放相关文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 相关文件
  member_count: 1
  member_details:
  - 国库集中支付制度相关文件
  - 地方政府隐性债务相关文件
  - 现代农业产业园土地优惠政策相关文件
  - 畜禽养殖污染监管制度建立相关文件
  - 结余结转资金清理相关文件
  - 绩效管理责任分工相关文件
  - 退捕补偿资金发放相关文件
output:
  fields:
  - name: 上缴路径
    type: string
    description: 提取 上缴路径 的文本值
  - name: 优惠政策条款
    type: number
    description: 提取 优惠政策条款 的数值（含单位，如万元、吨等）
  - name: 制度名称
    type: string
    description: 提取 制度名称 的文本值
  - name: 制度要求
    type: string
    description: 提取 制度要求 的文本值
  - name: 发布机关
    type: string
    description: 提取 发布机关 的文本值
  - name: 发放金额
    type: number
    description: 提取 发放金额 的数值（含单位，如万元、吨等）
  - name: 处罚细则
    type: string
    description: 提取 处罚细则 的文本值
  - name: 执法标准
    type: string
    description: 提取 执法标准 的文本值
  - name: 流转价格标准
    type: number
    description: 提取 流转价格标准 的数值（含单位，如万元、吨等）
  - name: 清理时限要求
    type: string
    description: 提取 清理时限要求 的文本值
  - name: 用地指标
    type: string
    description: 提取 用地指标 的文本值
  - name: 监测频次要求
    type: string
    description: 提取 监测频次要求 的文本值
  - name: 直接支付范围
    type: string
    description: 提取 直接支付范围 的文本值
  - name: 统筹使用规定
    type: string
    description: 提取 统筹使用规定 的文本值
  - name: 补偿发放名单
    type: string
    description: 提取 补偿发放名单 的文本值
  - name: 补偿发放对象名单
    type: string
    description: 提取 补偿发放对象名单 的文本值
  - name: 责任人
    type: string
    description: 提取 责任人 的文本值
  - name: 责任部门
    type: string
    description: 提取 责任部门 的文本值
  - name: 问责条款
    type: number
    description: 提取 问责条款 的数值（含单位，如万元、吨等）
  - name: 隐性债务清单备案情况
    type: string
    description: 提取 隐性债务清单备案情况 的文本值
violations:
- expression: 绩效管理责任分工相关文件.存在性 = '否' OR (绩效管理责任分工相关文件.是否明确考核与问责条款 = '否') OR (绩效评价问题整改台账.问题项目数 > 0 AND 绩效评价问题整改台账.问责记录 = '无')
  description: 若未制定责任分工文件，或虽有分工但未提及绩效考核与问责措施，或者存在绩效评价不合格项目却无任何问责和整改记录，说明责任约束制度缺失。三者满足任一即判违规。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 未建立绩效管理责任约束制度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第五部分（十四）\",\n    \"内容概述\": \"强化绩效管理责任约束，明确各部门各单位全面实施预算绩效管理的主体责任，建立绩效问责机制，对绩效管理不力、导致财政资金损失浪费的，依法依规追究责任人责任。\"\
    \n  }\n]"
- expression: (退捕渔民信息登记台账.已建档渔民数 / 退捕渔民建档立卡工作制度.应建档渔民总数 * 100 < 100) && (DATEDIFF(CURRENT_DATE, 退捕渔民建档立卡工作制度.建档立卡截止日期, 'day')
    > 30)
  description: 在建档立卡制度规定的截止日期之后，若实际建档完成率仍未达到100%，且超期天数超过30天，即判定为未按时完成。建档完成率=已建档数÷应建档总数×100%。
  audit_item: 任务目标未按时完成
  suspicion: 未按时完成退捕渔民建档立卡工作
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农办计财〔2019〕8号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条“精准识别退捕渔船渔民”\",\n    \"内容概述\": \"要求各地对退捕渔船和渔民进行精准识别，建档立卡，做到一船一档、一户一档，为实施补偿和转产安置提供依据。\"\
    \n  }\n]"
- expression: NVL(退捕渔民信息登记台账.已建档数量, 0) / 退捕渔民建档立卡工作制度.应建档总数 < 1.0 && SYSDATE > 分阶段禁捕目标的时间节点安排表.建档完成截止日期 && 延期申请或未完成情况说明文件.有效延期批复
    IS NULL
  description: 截至规定截止日期，实际建档数量未达到应建档总数，且无经批准的延期手续，即构成未按时完成。若建档率低于90%或虚假建档（如身份证重复率>0.5%），判定为严重违规。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 未按时完成退捕渔民建档立卡工作
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"无明确条款\",\n    \"内容概述\": \"要求抓紧完成退捕渔民建档立卡工作，确保信息准确完整，为后续补偿和安置提供依据。\"\n  }\n]"
- expression: "(统计表.闲置年限 >= 2 AND 统计表.清理状态 != '已清理')\n||\n(明细表.科目名称 LIKE '%惠农补贴%' \n   AND 明细表.余额 > 0 \n   AND (当前日期 - 明细表.最后交易日期)\
    \ > 730)"
  description: 判定逻辑：从结余统计表直接筛选闲置2年以上且未清理的资金；从账户流水表发现惠农补贴专户余额超过2年无变动且未上缴财政的款项。两项条件满足其一即构成闲置未清理。风险等级：闲置2-3年且金额较小为关注，闲置3年以上或金额较大为严重。
  audit_item: 惠农补贴资金滞留、延压发放或长时间闲置
  suspicion: 未发放的惠农补贴结余资金闲置超2年未清理
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于进一步做好盘活财政存量资金工作的通知\",\n    \"法规文号\": \"国发〔2014〕70号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条（清理结余结转资金）\",\n    \"内容概述\": \"各级财政部门要清理部门预算结余资金和连续结转超过两年的结转资金，将其收回总预算统筹安排。\"\n  },\n  {\n    \"\
    法规名称\": \"财政部关于推进地方盘活财政存量资金有关事项的通知\",\n    \"法规文号\": \"财预〔2015〕15号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"一、（二）\"\
    ,\n    \""
- expression: 拨付流水表.接收账户 包含 ('乡镇财政所' || '主管部门账户' || '过渡账户') && 拨付流水表.拨付时间 < 补贴发放明细表.发放日期
  description: 国库集中支付制度要求补贴资金直接支付到最终收款人（农户一卡通）账户。若拨付流水显示资金先转入乡镇、主管部门或过渡账户，再由这些账户转付给农户，且存在时间差，即为未按规定执行国库集中支付，存在资金沉淀或挪用的风险。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 未按国库集中支付制度发放补贴
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（六）\",\n    \"内容概述\": \"各级财政部门要严格按照国库集中支付制度有关规定，将补贴资金直接发放到户，严禁违规设立发放过渡账户。\"\n  }\n]"
- expression: (ABS(审批文件.批准面积-分析表.实际供应面积)/审批文件.批准面积 > 0.2) || (流转合同.流转价格 < 相关文件.流转价格标准*0.8) || (情况表.未开发面积/情况表.批准总面积 > 0.1)
    || (审批日期 > 审批文件.法定审批时限*1.5)
  description: 实际供应面积与批准面积偏差率超过20%，或土地流转均价低于政府指导价的80%，或闲置土地面积占比超过批准总面积的10%，或审批周期超过法定时限的1.5倍，以上任一条件触发即判定为土地政策支持不到位，属于涉嫌违规。
  audit_item: 现代农业产业园（集群、强镇）政策扶持不到位
  suspicion: 现代农业产业园土地政策支持不到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十八条\"\
    ,\n    \"内容概述\": \"禁止任何单位和个人闲置、荒芜耕地。已经办理审批手续的非农业建设占用耕地，一年内不用而又可以耕种并收获的，应当由原耕种该幅耕地的集体或者个人恢复耕种，也可以由用地单位组织耕种；一年以上未动工建设的，应当按照省、自治区、直辖市的规定缴纳闲置费；连续二年未使用的，经原批准机关批准，由县级以上人民政府无偿收回用地单位的土地使用权。\"\
    \n  },\n  {\n    \"法规名称\": \"自然资源部 农业农村部关"
- expression: (畜禽养殖污染监管制度建立相关文件.制度名称 IS NULL) OR (污染源监测报告.监测频次 < 畜禽养殖污染监管制度建立相关文件.要求频次) OR (畜禽养殖污染投诉及处理台账.处理及时率 < 80%)
  description: 三个判定条件满足任一即可：1.地方政府未出台任何形式的畜禽养殖污染防治管理办法或监管制度文件；2.实际开展的污染源监测报告数量或频次低于制度规定（如每季度至少一次，年度少于4次）；3.投诉台账中按期办结比率低于80%。处理及时率=规定时间内办结投诉件数/总有效投诉件数×100%。
  audit_item: 配套政策支持不到位
  suspicion: 畜禽养殖污染监管制度缺失形成监管盲区
  regulation: "[\n  {\n    \"法规名称\": \"畜禽规模养殖污染防治条例\",\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十条、第十二条、第二十二条\",\n    \"内容概述\": \"县级以上人民政府环境保护主管部门应当编制畜禽养殖污染防治规划，定期进行监测和监督性检查；畜禽养殖场应按规定建设污染防治配套设施并正常运行；环保部门应建立投诉举报制度，及时调查处理。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国环境保护法\",\n    \"法规文号\": \"中华人民共和国主席令第九号\",\n    \"效力级别\": \"法律\",\n   "
- expression: (合同期限 > 10 && 付款条件非完全绩效挂钩) || (财政支出责任占一般公共预算支出比例 > 0.10) || (项目未通过财政承受能力论证) || (项目未纳入中期财政规划 && 存在延期支付)
  description: 建养一体化合同时限过长、固定回报或超出财政红线10%，均可能构成新增隐性债务。符合国办发〔2019〕40号及财金〔2019〕10号等规定认定条件。
  audit_item: 项目建设管理不符合相关规定
  suspicion: 以“建养一体化”名义新增隐性债务
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步规范地方政府举债融资行为的通知\",\n    \"法规文号\": \"财预〔2017〕50号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"地方政府不得以文件、会议纪要等形式，为企业和个人融资提供担保或承诺限期回购，严禁形成新的隐性债务。\"\n  },\n  {\n    \"法规名称\":\
    \ \"财政部关于推进政府和社会资本合作规范发展的实施意见\",\n    \"法规文号\": \"财金〔2019〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n   \
    \ \"内容概述\": \"财"
