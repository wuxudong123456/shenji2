name: audit/政策文件类/批示文件
type: model
description: 从政策文件类类文档（批示文件）中提取结构化元数据。涵盖字段如：会议时间、会议议题、决定事项、决策内容、出席人员及其表态、参会人员签字、批示意见、议题。文档范围包括：相关会议纪要的领导批示文件、绩效评价结果应用相关会议纪要或批示文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 人员
- 会议
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 批示文件
  member_count: 1
  member_details:
  - 相关会议纪要的领导批示文件
  - 绩效评价结果应用相关会议纪要或批示文件
output:
  fields:
  - name: 会议时间
    type: date
    description: 提取 会议时间 的日期值，格式 YYYY-MM-DD
  - name: 会议议题
    type: string
    description: 提取 会议议题 的文本值
  - name: 决定事项
    type: string
    description: 提取 决定事项 的文本值
  - name: 决策内容
    type: string
    description: 提取 决策内容 的文本值
  - name: 出席人员及其表态
    type: string
    description: 提取 出席人员及其表态 的文本值
  - name: 参会人员签字
    type: string
    description: 提取 参会人员签字 的文本值
  - name: 批示意见
    type: string
    description: 提取 批示意见 的文本值
  - name: 议题
    type: string
    description: 提取 议题 的文本值
violations:
- expression: 项目在[明细表]中，连续2年绩效评分 < 60，且在[记录表]中，下一年度预算金额 >= 上一年度预算金额
  description: 筛查核心逻辑：对于连续两年绩效评分低于60分（不合格）的项目，其下一年度预算未进行削减甚至增加，表明绩效评价结果未在预算决策中得到有效应用。预算金额不降反升为高风险，持平为中风险。
  audit_item: 部门、单位绩效评价结果未得到有效应用
  suspicion: 低绩效项目预算未削减或反增
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第三部分第（九）条\",\n    \"内容概述\": \"将绩效评价结果作为预算安排的重要参考依据，对低效无效项目一律削减或取消预算安排。\"\n  }\n]"
- expression: (制度文件.结果应用要求条款 IS NULL) || (反馈表.项目名称 IN (反馈表.项目名称) AND 反馈表.评价结果 < 60 AND 批示文件.决策内容 IS NULL) || (反馈表.执行状态 IS
    NULL OR 反馈表.执行状态 = '未执行')
  description: 从制度、决策、执行三个层面筛查结果应用机制缺失。制度层面检查是否建立了结果与预算挂钩的规定；决策层面检查评价结果是否真正上会讨论并形成决议；执行层面检查整改措施是否落地。任一层面的缺失均构成应用机制不健全的疑点。
  audit_item: 部门、单位绩效评价结果未得到有效应用
  suspicion: 绩效评价结果应用机制缺失
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"各级财政部门、预算部门和单位应建立健全绩效评价结果反馈制度和绩效问题整改责任制，将评价结果作为本部门、本单位编报预算、完善政策和改进管理的重要依据。\"\n  }\n]"
- expression: (审批台账.审批机关 IN ('县级人民政府') && 规划地块文本.地块类型（基本农田/一般耕地/建设用地等） IN ('基本农田', '永久基本农田')) || (审批台账.审批机关 IN ('市级自然资源部门')
    && 审批台账.批准面积 > 35 单位=公顷 && 审批台账.土地类型（农用地/未利用地/建设用地） == '农用地') || (审批台账.审批文号 存在多次拆分记录 && SUM(审批台账.批准面积) > 对应上级机关审批权限面积阈值)
  description: 表达式核心是判断审批主体与法定权限的适配性。分支1：若审批机关为县级，却批准了基本农田类型的用地，直接触犯国务院专属权限，为严重越权。分支2：针对农用地转用，若市级审批机关一次性批准面积超过《土地管理法》规定的35公顷上限，即超权限审批。分支3：识别化整为零策略，通过追踪同一年度同一项目或同一区域立项的多宗地块，若累计审批面积超过本应上报的上级机关审批阈值，则构成实质上的超越权限。
  audit_item: 未办理土地变更手续非法占用土地
  suspicion: 违规超越审批权限审批土地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"征收下列土地的，由国务院批准：（一）永久基本农田；（二）永久基本农田以外的耕地超过三十五公顷的；（三）其他土地超过七十公顷的。征收前款规定以外的土地的，由省、自治区、直辖市人民政府批准。征收农用地的，应当依照本法第四十四条的规定先行办理农用地转用审批。其中，经国务院批准农用地转用的，同时办理征地审批手续，不再另行办理征地审批；经省、自治区、直辖市人民政府在征地批准权限"
