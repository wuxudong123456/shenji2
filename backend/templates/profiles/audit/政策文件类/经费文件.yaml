    内容概述\": "
- expression: 被审计单位实际公开的“三公”经费文件.发布平台名称 NOT IN (地方政府或部门关于“三公”经费公开的相关制度文件.法定公开平台清单（如政府门户网站、财政专栏）) OR (被审计单位实际公开的“三公”经费文件.发布平台名称
