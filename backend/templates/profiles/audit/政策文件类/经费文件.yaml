- expression: (被审计单位实际公开的“三公”经费文件.文件格式（PDF/图片/Excel） = '图片' || (被审计单位实际公开的“三公”经费文件.文件格式（PDF/图片/Excel） = 'PDF' AND 被审计单位实际公开的“三公”经费文件.可检索性
    = '不可检索') || 被审计单位实际公开的“三公”经费文件.可复制性 = '不可复制') || (被审计单位实际公开的“三公”经费文件.文件格式（PDF/图片/Excel） != 'Excel')
  description: 公开格式应满足《政府信息公开条例》便于公众查阅、复制的要求。以图片、扫描件形式导致数据无法直接提取复制，或未提供结构化数据，即构成格式不规范。
  audit_item: “三公”经费预算公开不符合规定
