name: audit/政策文件类/经费文件
type: model
description: 从政策文件类类文档（经费文件）中提取结构化元数据。涵盖字段如：公开日期、公开的项目明细、公开链接、发布平台名称、可复制性、可检索性、文件印发日期、文件格式。文档范围包括：被审计单位实际公开的“三公”经费文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 明细
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 经费文件
  member_count: 1
  member_details:
  - 被审计单位实际公开的“三公”经费文件
output:
  fields:
  - name: 公开日期
    type: date
    description: 提取 公开日期 的日期值，格式 YYYY-MM-DD
  - name: 公开的项目明细
    type: string
    description: 提取 公开的项目明细 的文本值
  - name: 公开链接
    type: string
    description: 提取 公开链接 的文本值
  - name: 发布平台名称
    type: string
    description: 提取 发布平台名称 的文本值
  - name: 可复制性
    type: string
    description: 提取 可复制性 的文本值
  - name: 可检索性
    type: string
    description: 提取 可检索性 的文本值
  - name: 文件印发日期
    type: date
    description: 提取 文件印发日期 的日期值，格式 YYYY-MM-DD
  - name: 文件格式
    type: string
    description: 提取 文件格式 的文本值
  - name: 是否包含上年对比说明
    type: boolean
    description: 提取 是否包含上年对比说明 的布尔值（是/否）
violations:
- expression: (被审计单位实际公开的“三公”经费文件.公开日期 - 被审计单位“三公”经费预算批复文件.批复日期) > 地方政府或部门关于“三公”经费公开的相关制度文件.规定公开时限
  description: 实际公开日期取公开文件印发日期或网站发布记录的最早日期，预算批复日期为批复文件落款日期；制度规定时限如《预算法》规定的20日内。差值超过规定天数即为违规，超期天数越多风险越高。
  audit_item: “三公”经费预算公开不符合规定
  suspicion: “三公”经费预算未按时公开
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十四条\",\n    \"内容概述\": \"经本级政府财政部门批复的部门预算、决算及报表，应当在批复后二十日内由各部门向社会公开。\"\n  },\n  {\n    \"法规名称\": \"《中华人民共和国政府信息公开条例》\"\
    ,\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"行政机关应当主动公开财政预算、决算信息。\"\
    \n  },\n  "
- expression: “三公”经费公开内容与规定模板对比表.缺失项目 LIKE '%因公出国（境）费%' || “三公”经费公开内容与规定模板对比表.缺失项目 LIKE '%公务用车购置及运行费%' || “三公”经费公开内容与规定模板对比表.缺失项目
    LIKE '%公务接待费%' || “三公”经费公开内容与规定模板对比表.不规范项目 LIKE '%未列示上年对比数据%' || “三公”经费公开内容与规定模板对比表.不规范项目 LIKE '%未说明增减变化原因%'
  description: 财政部模板要求必须按三项明细分别列示金额，且应提供与上年预算的对比说明。缺少任一项必填内容或对比数据即为体例违规，影响信息完整性。
  audit_item: “三公”经费预算公开不符合规定
  suspicion: “三公”经费预算公开体例不符合规定
  regulation: "[\n  {\n    \"法规名称\": \"《地方预决算公开操作规程》\",\n    \"法规文号\": \"财预〔2016〕143号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"公开内容应当包括因公出国（境）费、公务用车购置及运行费、公务接待费三项，并说明增减变化原因。\"\n  },\n  {\n    \"法规名称\": \"《关于推进部门所属单位预算公开工作的指导意见》\"\
