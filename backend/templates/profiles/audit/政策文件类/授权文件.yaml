name: audit/政策文件类/授权文件
type: model
description: 从政策文件类类文档（授权文件）中提取结构化元数据。涵盖字段如：使用方名称、使用用途、使用资产描述、授权使用费标准、授权放权清单、授权范围、监督条款。文档范围包括：国有资产无偿使用授权文件、国有资本投资/运营公司授权文件、特许经营权授权文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 资产
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 授权文件
  member_count: 1
  member_details:
  - 国有资产无偿使用授权文件
  - 国有资本投资/运营公司授权文件
  - 特许经营权授权文件
output:
  fields:
  - name: 使用方名称
    type: string
    description: 提取 使用方名称 的文本值
  - name: 使用用途
    type: string
    description: 提取 使用用途 的文本值
  - name: 使用资产描述
    type: string
    description: 提取 使用资产描述 的文本值
  - name: 授权使用费标准
    type: number
    description: 提取 授权使用费标准 的数值（含单位，如万元、吨等）
  - name: 授权放权清单
    type: string
    description: 提取 授权放权清单 的文本值
  - name: 授权范围
    type: string
    description: 提取 授权范围 的文本值
  - name: 监督条款
    type: number
    description: 提取 监督条款 的数值（含单位，如万元、吨等）
violations:
- expression: (授权放权清单（如投资决策权限额度、管理层选聘权）中无明确投资决策额度 || 授权放权清单（如投资决策权限额度、管理层选聘权）.禁止类业务负面清单管理缺失) || (实际开展业务类型、单笔投资金额、管理层成员任命路径、年度投资总额.单笔投资金额
    > 授权放权清单（如投资决策权限额度、管理层选聘权）.投资决策权限额度 || 实际开展业务类型、单笔投资金额、管理层成员任命路径、年度投资总额.实际开展业务类型属于授权放权清单（如投资决策权限额度、管理层选聘权）.禁止类业务负面清单范围)
    && (重大业务停滞时长 > 6个月)
  description: 表达式包含两部分逻辑：1.试点方案本身存在内容缺失、授权模糊的问题；2.企业实际执行中超越授权额度或经营负面清单禁止的业务。当上述任一情况导致业务停滞超过6个月时，触发严重预警。
  audit_item: 国有企业重点改革任务推进方面存在的问题
  suspicion: 国有资本投资运营公司改革试点授权不明或越权经营
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于推进国有资本投资、运营公司改革试点的实施意见\",\n    \"法规文号\": \"国发〔2018〕23号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"国有资本投资、运营公司对授权范围内的国有资本履行出资人职责，按照责权对应原则切实承担起国有资产保值增值责任。要科学界定国有资本投资、运营公司与所持股企业的权责边界，采取授权方式明确相关管理事项。\"\
    \n  }\n]"
- expression: (授权使用费标准.授权使用费标准 = 0 || 使用台账.付费记录 = '无' && 备案使用主体.备案状态 = '未备案') && (使用台账.使用企业名称 in (参股企业名单) && 事故责任方.记录数 > 0)
    || (授权期价值变动.授权期价值变动 < -0.2)
  description: 向参股企业提供字号、资质等无形资产而未收取使用费、未备案或缺少监督，且引发质量事故导致品牌价值下降20%以上的，即构成违规授权且未有效维护权益。
  audit_item: 资产管理方面存在的问题
  suspicion: 违规向参股企业提供字号、资质等无形资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十四条\",\n    \"内容概述\": \"国有独资企业、国有独资公司、国有资本控股公司不得无偿向关联方提供资金、商品、服务或者其他资产，不得以不公平的价格与关联方进行交易。\"\n  }\n]"
