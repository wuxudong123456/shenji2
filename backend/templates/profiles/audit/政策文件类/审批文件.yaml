violations:
- expression: (收费项目明细台账.收费项目名称 IN (行政事业性收费目录清单.收费项目名称) AND 收费项目明细台账.收费性质 = '经营服务性收费') OR (收费许可证.收费性质 = '经营服务性收费' AND 收费许可证.收费项目
    IN (行政事业性收费目录清单.收费项目名称) AND 经营服务性收费项目审批文件.批准文号 IS NULL AND 收费项目性质变更审批记录 IS NULL) OR (收费项目明细台账.收费项目名称 IN (行政事业性收费目录清单.收费项目名称)
    AND 银行账户入账流水.收款账户 NOT LIKE '%财政专户%')
  description: 表达式通过三组条件识别违规转性行为：(1)收费项目属于行政事业性收费目录却标记为经营服务性；(2)收费许可证显示经营服务性但无合法审批文件且无性质变更记录；(3)目录内收费收入未进入财政专户，表明资金被截留；触发任一即判定为疑点。
  audit_item: 不按照规定的预算级次、预算科目入库
  suspicion: 将行政事业性收费违规转为经营服务性收费管理
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于加强政府非税收入管理的通知\",\n    \"法规文号\": \"财综〔2004〕53号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二条第（一）项\",\n    \"内容概述\": \"行政事业性收费必须纳入财政管理，实行收支两条线，严禁将行政事业性收费转为经营服务性收费管理。\"\n  },\n  {\n    \"法规名称\":\
    \ \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第十八条\",\n    \"\
    内容概述\": \"收费项目"
- expression: (企业法人/高管信息对照表.任职起始日期 - 领导干部离职/退休信息登记表.离职日期) < 3年 && 离职人员从业情况申报表.企业性质 IN ('民营企业','外商投资企业','中介机构') && (工商登记信息.注册地址
    ∈ 领导干部离职/退休信息登记表.分管领域 OR 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围) && (社会兼职申报.审批结果 != '批准' OR 社会兼职申报.审批结果 IS NULL)
  description: 禁业期按通常3年设定；若任职起始日期与离职日期间隔小于1095天即为在禁业期内；企业性质须为民营企业、外商投资企业或中介机构之一；业务关联判定采用地区匹配或关键词重合（审计中可设定重合度阈值>60%）；若未履行审批手续或审批不通过即触发疑点。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规接受原管辖范围内企业聘任
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"公务员辞去公职或者退休的，原系领导成员的公务员在离职三年内，不得到与原工作业务直接相关的企业或者其他营利性组织任职，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n \
    \ {\n    \"法规名称\": \"关于进一步规范党政领导干部在企业兼职（任职）问题的意见\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": "
- expression: (工商登记信息.成立日期 >= 领导干部离职审批文件.离职日期 - 缓冲期) && (领导干部离职审批文件.离职日期 + 3年 >= 当前日期 OR 当前日期 - 领导干部离职审批文件.离职日期 <= 3年) &&
    ((工商登记信息.投资人/股东姓名及身份证号 = 领导干部离职审批文件.姓名) OR (工商登记信息.企业名称 = 直系亲属经商办企业备案表.企业名称 AND 工商登记信息.投资人/股东姓名及身份证号 = 直系亲属经商办企业备案表.亲属姓名))
    && (关联企业清单.企业名称 = 工商登记信息.企业名称 AND 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围
  description: 缓冲期可设定为6个月，避免离职前已谋划的合理情形；禁业期以3年为限；企业投资人或实际控制人为本人或直系亲属（代持）；业务关联性通过关键词匹配（如原分管住建，企业主营房地产开发、建筑工程咨询），叠加与原任职单位存在交易或利用原权力获得审批，即触发违规。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事与原职务相关的营利性活动
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"原系领导成员的公务员在离职三年内，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"\
    法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第九十六条\",\n    \"内容概述\": \"离职或者退（离）休后违反有关规定从事与原任职务管辖业务相关的营利活动，视"
- expression: '领导干部离职审批文件.离职日期 + 3年 >= 当前日期 && (企业法人/高管信息对照表.离职人员关联企业/中介机构名称 IN (SELECT 工商登记信息.企业名称 FROM 工商登记信息 WHERE 工商登记信息.经营范围
    LIKE ''%中介%'' OR 工商登记信息.经营范围 LIKE ''%经纪%'' OR 工商登记信息.经营范围 LIKE ''%咨询%'')) && ((银行资金流水明细表.交易摘要 LIKE ''%服务费%'' OR 银行资金流水明细表.交易摘要
    LIKE ''%佣金%'' OR 银行资金流水明细表.交易摘要 LIKE ''%居间费%'') AND 领导干部离职审批文件.管辖业务范围 '
  description: 在禁业期内，以中间人身份撮合交易并收取费用；通过企业名称或业务类型、银行流水中的佣金类收入、以及与原管辖对象的联系强度（通话频次前20%或直接出现审批加速）建立判违逻辑。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事有偿中介活动
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十六条\",\n    \"内容概述\": \"党员领导干部离职或者退（离）休后违反有关规定从事有偿中介活动，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务处分；情节严重的，给予留党察看处分。\"\n \
    \ },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百零七条\"\
    ,\n    \""
- expression: (行业协会商会领导成员任职表.任职起始日期 - 离退休人员信息登记表.离职日期) <= 1095 AND (离退休人员返聘审批文件.审批结果 != '批准' OR 离退休人员返聘审批文件.批准兼职单位 != 行业协会商会领导成员任职表.任职单位
    OR 离退休人员返聘审批文件 IS NULL)
  description: 计算退休人员到行业协会商会任职的起始日期与离职日期的相差天数，若小于等于1095天（3年）且无合规审批，则构成违规。审批文件需明确批准该人员在该协会任职，否则触发疑点。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 退（离）休三年内违规到行业协会商会兼职
  regulation: "[\n  {\n    \"法规名称\": \"关于规范退（离）休领导干部在社会团体兼职问题的通知\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"退（离）休领导干部在社会团体兼职，须按干部管理权限审批或备案后方可兼职。除工作特殊需要外，年龄一般不超过70周岁，且兼职不得超过1个。兼职不得领取社会团体的薪酬、奖金、津贴等报酬和获取其他额外利益，也不得领取各种名目的补贴等。原任领导干部职务的退（离）休领导干部在社会团体兼职，届满后连任不超过两届，兼职的任职年龄界限为70周岁。\"\
    \n  },\n  "
- expression: (预算执行情况对比表.实际支出金额 > 年度预算批复文件.批复的公务接待费预算总额) AND (预算调整审批文件.审批文号 IS NULL OR 预算调整审批文件.审批日期 > 预算执行情况对比表.实际支出日期 OR
    预算调整审批文件.调整金额 < 预算执行情况对比表.超支金额)
  description: 判断实际支出总额是否超出批复预算，且无规范预算调整审批或调整程序滞后。超预算支出且无追加批复即视为违规，阈值无容差。
  audit_item: 公务接待费预算执行不合规
  suspicion: 无预算或超预算列支公务接待费
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条、第七十二条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当严格按照预算执行，未经批准不得调整预算，不得无预算安排支出；超收安排支出需经法定程序。\"\n  },\n  {\n    \"法规名称\"\
    : \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\":\
    \ \"党政"
- expression: 对比表.预算金额 IS NULL AND 对比表.实际支出金额 > 0) OR (对比表.实际支出金额 > 对比表.预算金额)
  description: 无预算：存在实际支出但预算批复文件中无对应任务且无预算金额；超预算：同一任务下实际支出合计大于批复预算金额。两者均构成违规。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 无预算或超预算支出因公出国（境）费
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第四条\",\n    \"内容概述\": \"各单位应强化预算约束，严格控制因公临时出国经费，在核定的预算内统筹安排，不得无预算或超预算安排出访团组。\"\n  }\n]"
- expression: (任务批件中文.所属单位 = 本单位) AND (明细台账.收款单位 != 本单位 AND 明细台账.对应出国任务 = 任务批件中文.任务名称) OR (单据.付款方 != 本单位 AND 单据.收款方 = 本单位
    且摘要含出国事由)
  description: 本单位人员的出国费用理应由本单位承担，若发现费用由所属单位或外单位支付（即分摊台账中收款方为外单位，但对应的是本单位人员任务，或银行流水显示外单位向本单位支付出国相关费用），可能构成摊派。无合规分摊协议或协议显失公平均属违规。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 向所属或其他单位摊派因公出国费用
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"党政机关不得向下属单位、企业、社会组织等摊派或转嫁因公出国（境）等费用，不得以任何名义要求其他单位提供资金或物品。\"\n  }\n]"
- expression: (姓名、所属单位、费用承担方.所属单位 != 本单位 AND 姓名、所属单位、费用承担方.费用承担方 = 本单位) AND (团组人员组成、费用承担约定.费用承担约定 中未明确由我方承担 OR 无相关批件)
  description: 除上级批文明确约定由本单位负担外，不得用公款报销非本单位人员的出国费用。若人员所属单位非本单位且费用由本单位承担又无合规批准，即为违规。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 违规负担外单位人员因公出国费用
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第五条\",\n    \"内容概述\": \"各单位应严格按照出访团组人员名单报销费用，不得为本单位以外的人员报销与因公出国相关的费用，确因双边协议需承担的须在批件中明确。\"\n  }\n]"
- expression: 明细账.摘要 包含 ('出国' OR '国际机票' OR '境外' OR '护照') AND 明细账.科目名称（如设备费、会议费、培训费） != '因公出国（境）费用' AND (报销凭证.发票内容 对应出国相关支出)
  description: 通过关键词检索发现原本应计入因公出国经费科目的支出被故意列在其他科目下，属于隐匿或挤占挪用其他项目资金。实际支出内容与任务批件及行程报告匹配，但列支科目错误。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 在其他项目支出中隐匿列支出国费用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"第十二届全国人民代表大会常务委员会第十次会议修正\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"各部门、各单位不得擅自改变预算支出科目，不得将应当在预算科目中列支的支出以其他形式列支。\"\n  },\n  {\n    \"法规名称\": \"\
    因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"因公出国经费全部纳入预算管理，"
- expression: (人员姓名.证件类型 = '因私' AND 人员姓名.批准状态 = '未批准' 或无审批记录) AND (报销凭证.报销人 = 该人员 AND 报销凭证.报销事由 包含 '因公出国')
  description: 凡持因私证件出国（境）且未经组织审批，或者经审批但事由与公务无关，却在单位报销相关费用的，即为违规。同时需排除因公证件临时办理困难等经特批的例外情况。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 公款报销持因私证件出国费用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国护照法\",\n    \"法规文号\": \"主席令第五十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二条、第十三条\"\
    ,\n    \"内容概述\": \"因公护照和因私护照应当分别使用，因公出国应持因公护照；持因私护照执行公务须按规定审批。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强因公出国（境）管理的若干规定\",\n\
    \    \"法规文号\": \"中办发〔2008〕9号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"严格因公出国（境）证件管理，任何人不得持因私"
- expression: (费用明细.发票项目 IN ('景点门票', '购物', '个人用品', '娱乐') ) OR (费用明细.消费地点 NOT IN 任务审批文件.批准行程 AND 费用明细.消费时间 在 出国期间内 AND 未附行程变更审批)
  description: 非公务消费直接识别，或实际活动地点超出批件批准的范围且无审批手续，即属计划外费用。与公务无关消费如景区门票、购物发票，无论金额大小均违规。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 违规报销与公务无关或计划外费用
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十四条\",\n    \"内容概述\": \"严禁以任何名义和方式变相公款旅游，严禁安排与公务无关的娱乐活动，严禁在国（境）外擅自增加出访国家或地区，改变行程。\"\n  }\n]"
- expression: ( (明细表.处置收入金额 + 出借台账.实收租金金额) > 0 ) && ( (流水.缴库金额 IS NULL) || (ABS(流水.缴库金额 - (明细表.处置收入金额 + 出借台账.实收租金金额)) / (明细表.处置收入金额
    + 出借台账.实收租金金额) > 0.05) || (批复文件.国有资产收入预算科目金额 = 0) )
  description: 当单位存在国有资产处置或出租收入时，若国库缴款凭证缺失，或上缴金额不足实际收入的95%（差异率>5%），或预算编制文件中未包含该笔国有资源（资产）有偿使用收入预算，则判定为违规。
  audit_item: 国有资产收入管理不合规
  suspicion: 国有资产处置和出租出借收入未上缴国库
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"各部门及其所属单位应当将资产处置和出租出借收入等国有资产收入，按照政府非税收入管理规定，及时足额上缴国库。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十六条\",\n    \"内容概述\": \"各级预算收入的编制，应当与经济社"
- expression: (统计表.借款余额 > 0) AND (借款合同.审批环节缺失 == TRUE OR 借款合同.审批层级 < 政府常务会议) AND (借款合同.借款对象性质 != '预算单位') AND (行对账单.资金来源于财政国库或专户
    == TRUE)
  description: 当存在未清偿借款，且借款审批程序不完整（如无政府常务会议决议），借款对象为非预算单位企业或个人，且资金来源为财政性资金时，判定为违规。许可阈值：审批文件缺失或借款对象非预算单位即直接触发疑点。
  audit_item: 挤占挪用套取财政资金
  suspicion: 违规对外出借财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十九条\"\
    ,\n    \"内容概述\": \"各级政府不得向非预算单位出借财政资金。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n \
    \   \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"财政收入执收单位及其工作人员……隐瞒应当上缴的财政收入，截留代收的财政收入，其他不缴或者少缴财政收入的行为……\"\
    \n  }"
- expression: 项目名称、采购金额、采购方式、采购品目、供应商、合同签订日期、邀请招标供应商数量、采购组织形式、是否进口产品.采购品目 IN (限额标准、公开招标数额标准、竞争性谈判/询价/单一来源适用条件.集中采购项目品目) AND
    项目名称、采购金额、采购方式、采购品目、供应商、合同签订日期、邀请招标供应商数量、采购组织形式、是否进口产品.采购组织形式 != '集中采购' AND (项目名称、审批意见、批准部门 IS NULL OR 项目名称、审批意见、批准部门.审批意见
    != '同意')
  description: 对照集中采购目录，凡属目录内品目且满足限额标准的项目，必须委托集中采购机构采购。若实际组织形式非集中采购，又无财政部门批准分散采购的有效文件，则构成违规。
  audit_item: 政府采购组织管理不规范
  suspicion: 纳入集中采购目录项目未实行集中采购
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"采购人采购纳入集中采购目录的政府采购项目，必须委托集中采购机构代理采购；采购未纳入集中采购目录的政府采购项目，可以自行采购，也可以委托集中采购机构在委托的范围内代理采购。\"\n  }\n\
    ]"
- expression: 明细表.采购金额 >= 限额标准 AND 明细表.采购方式 NOT IN ('公开招标', '邀请招标', '竞争性谈判', '竞争性磋商', '询价', '单一来源采购') OR (明细表.采购金额 >= 公开招标数额标准
    AND 明细表.采购方式 != '公开招标' AND (审批文件 IS NULL OR 审批文件.审批意见 != '同意'))
  description: 首先判断是否达到政府采购限额标准（通常为货物服务50万元、工程60万元等），达到限额必须采用法定采购方式；任意选择目录外或自创采购方式即为违规。其次，若金额超过公开招标数额标准，必须采用公开招标，其他方式需审批。表达式通过两层条件全面筛查采购方式滥用。
  audit_item: 政府采购组织管理不规范
  suspicion: 达到政府采购限额标准未按规定方式采购
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十六条、第二十七条\",\n    \"内容概述\": \"政府采购采用公开招标、邀请招标、竞争性谈判、询价、单一来源采购等方式；达到公开招标数额标准的，应当采用公开招标方式采购，因特殊情况需采用公开招标以外方式的，应提前获得批准。\"\
    \n  }\n]"
- expression: 明细表.是否进口产品 = '是' AND (审批文件 IS NULL OR 审批文件.批准文号 IS NULL) AND (备案表.备案状态 != '已备案' OR 备案表.审核意见 != '同意')
  description: 政府采购进口产品必须事先获得同级财政部门审批，并完成备案。若项目明细中标识为进口产品，但无法匹配到有效的审批文件和备案记录，则视为擅自采购进口产品。
  audit_item: 政府采购组织管理不规范
  suspicion: 未经批准擅自采购进口产品
  regulation: "[\n  {\n    \"法规名称\": \"政府采购进口产品管理办法\",\n    \"法规文号\": \"财库〔2007〕119号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第四条、第五条\",\n    \"内容概述\": \"采购进口产品时，应当坚持有利于本国企业自主创新或消化吸收核心技术的原则，在采购活动开始前须获得设区的市、自治州以上人民政府财政部门的核准，并依法进行进口产品采购论证和组织进口产品论证专家进行评审。\"\
    \n  },\n  {\n    \"法规名称\": \"关于政府采购进口产品管理有关问题的通知\",\n    \"法规文号\": \"财办库〔2008〕248号\",\n    \"效力级别\""
- expression: 明细表.采购方式 = '单一来源采购' AND (审批文件 IS NULL OR 审批文件.批准文号 IS NULL) AND (审批表.审批结论 != '同意' OR 审批表.论证专家意见 IS NULL)
  description: 单一来源采购属于非竞争性采购方式，必须经过严格的专家论证和审批程序。若项目采用单一来源采购但缺少审批文件或论证审批表未通过，即判定为违规。
  audit_item: 政府采购组织管理不规范
  suspicion: 未经批准擅自采用单一来源方式采购
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十一条\",\n    \"内容概述\": \"符合下列情形之一的货物或者服务，可以依照本法采用单一来源方式采购：（一）只能从唯一供应商处采购的；（二）发生了不可预见的紧急情况不能从其他供应商处采购的；（三）必须保证原有采购项目一致性或者服务配套的要求，需要继续从原供应商处添购，且添购资金总额不超过原合同采购金额百分之十的。采购人申请单一来源采购，应当报经主管预算单位同意，同级财政部门批准。\"\
    \n  },\n  {\n    \"法规名"
