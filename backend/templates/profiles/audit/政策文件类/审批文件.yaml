name: audit/政策文件类/审批文件
type: model
description: 从政策文件类类文档（审批文件）中提取结构化元数据。涵盖字段如：上级批复文件编号、上缴时限要求、专家论证意见、专项指标批复面积、主导产业类型、主要工艺路线、主要股东姓名、产业定位。文档范围包括：2022年后成品油税费改革转移支付资金使用审批文件、专项资金审批文件、人防部门审批文件、以前年度结余资金使用审批文件、企业投资决策审批文件、会计差错更正专项说明的审批文件、会议审批文件、传统村落保护项目用地审批文件、住房公积金提取审批文件、住房公积金贷款审批文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 人员
- 审批
- 金额
- 元数据提取
