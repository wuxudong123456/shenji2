name: audit/政策文件类/规定文件
type: model
description: 从政策文件类类文档（规定文件）中提取结构化元数据。涵盖字段如：中央财政承担比例、代发机构选择规定、允许地方加码幅度、公开招标要求、单次赠礼金额上限、各岗位最高职级、各类业务法定办理时限、同一团组宴请次数上限。文档范围包括：上级单位关于职数规格的规定文件、上级规定文件、宴请次数规定文件、权限规定文件、用电报装业务办理时限规定文件、资金发放方式规定文件（文件5）、赠礼标准规定文件、非税收入征收期限相关规定文件、项目验收流程及时间规定文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 招投标
- 补贴
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 规定文件
  member_count: 1
  member_details:
  - 上级单位关于职数规格的规定文件
  - 上级规定文件
  - 宴请次数规定文件
  - 权限规定文件
  - 用电报装业务办理时限规定文件
  - 资金发放方式规定文件（文件5）
  - 赠礼标准规定文件
  - 非税收入征收期限相关规定文件
  - 项目验收流程及时间规定文件
output:
  fields:
  - name: 中央财政承担比例
    type: number
    description: 提取 中央财政承担比例 的数值（含单位，如万元、吨等）
  - name: 代发机构选择规定
    type: string
    description: 提取 代发机构选择规定 的文本值
  - name: 允许地方加码幅度
    type: string
    description: 提取 允许地方加码幅度 的文本值
  - name: 公开招标要求
    type: string
    description: 提取 公开招标要求 的文本值
  - name: 单次赠礼金额上限
    type: number
    description: 提取 单次赠礼金额上限 的数值（含单位，如万元、吨等）
  - name: 各岗位最高职级
    type: string
    description: 提取 各岗位最高职级 的文本值
  - name: 各类业务法定办理时限
    type: string
    description: 提取 各类业务法定办理时限 的文本值
  - name: 同一团组宴请次数上限
    type: string
    description: 提取 同一团组宴请次数上限 的文本值
  - name: 同类项目补贴比例上限
    type: number
    description: 提取 同类项目补贴比例上限 的数值（含单位，如万元、吨等）
  - name: 年总额标准
    type: number
    description: 提取 年总额标准 的数值（含单位，如万元、吨等）
  - name: 征收起止日期
    type: date
    description: 提取 征收起止日期 的日期值，格式 YYYY-MM-DD
  - name: 承诺办结时限
    type: string
    description: 提取 承诺办结时限 的文本值
  - name: 有权制定该事项的机关层级
    type: string
    description: 提取 有权制定该事项的机关层级 的文本值
  - name: 权限范围
    type: string
    description: 提取 权限范围 的文本值
  - name: 核定领导职数
    type: string
    description: 提取 核定领导职数 的文本值
  - name: 法定追缴期限
    type: string
    description: 提取 法定追缴期限 的文本值
  - name: 要求发放渠道
    type: string
    description: 提取 要求发放渠道 的文本值
  - name: 银行卡管理要求
    type: string
    description: 提取 银行卡管理要求 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
violations:
- expression: 下位政策文件.发文机关 NOT IN (SELECT 权限规定文件.有权制定该事项的机关层级 FROM 权限规定文件)
  description: 若下位政策的制定主体（如乡镇政府）不具备该项事务的法定职权（如土地征收审批），即判定为越权。权限清单依据《土地管理法》等法律明确的各级机关权限。
  audit_item: 上位与下位政策法规检查
  suspicion: 政策制定主体不具备法定职权越权发文
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国地方各级人民代表大会和地方各级人民政府组织法\",\n    \"法规文号\": \"主席令第58号\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第七十六条\",\n    \"内容概述\": \"乡镇人民政府的职权范围，未包括土地征收、国有资产处置等应由县级以上人民政府行使的职权。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"征收下列土地的，由国务院批准；征收前款"
- expression: 地方奖补政策.比例或上限金额 > 上级规定文件.同类项目补贴比例上限 OR (地方奖补政策.补贴标准 / 地方奖补政策.比例或上限金额) > 上级规定文件.同类项目补贴比例上限
  description: 若地方自行制定的补贴标准中，补贴金额占项目总投资的比例或绝对额度超出了国家或省级文件明确的补贴上限，即为违规。例如，上级规定最高不得超过30%，地方实际补贴达到50%。
  audit_item: 上位与下位政策法规检查
  suspicion: 地方财政补贴比例超出上位政策规定的上限
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于改革和完善中央对地方转移支付制度的意见\",\n    \"法规文号\": \"国发〔2014〕71号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"严格控制专项转移支付的地方财政配套资金负担，不得超出地方实际承受能力擅自提高配套比例。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\"\
    ,\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十六条\",\n    \"内容概述\": \"各级政府支出的统筹安排应当符合上级政府的规定"
- expression: (COUNT(职务名称、职级、人数名册.职级) > 核定领导职数、各岗位最高职级.核定领导职数) OR (存在 职务名称、职级、人数名册.职级 > 核定领导职数、各岗位最高职级.各岗位最高职级)
  description: 同一职级实配人数超过核定领导职数，或领导干部的职级高于岗位规定的最高职级（低职高配），均属违规。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 超职数或超规格配备领导干部
  regulation: "[\n  {\n    \"法规名称\": \"党政领导干部选拔任用工作条例\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第五十三条第（十）项\"\
    ,\n    \"内容概述\": \"不准超职数配备、超机构规格提拔领导干部，或者违反规定擅自设置职务名称。\"\n  }\n]"
- expression: COUNT(其他.外宾团组名称) > 同一团组宴请次数上限.同一团组宴请次数上限
  description: 根据制度规定，同一外宾团组在华期间宴请次数通常限定为1-2次。通过对外宾接待明细表和宴请次数明细表，按“外宾团组名称”分组统计宴请日期或报销次数，若统计结果大于制度上限，则判定为违规。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 超过规定次数宴请外宾
  regulation: "[\n  {\n    \"法规名称\": \"党政机关外宾接待管理办法\",\n    \"法规文号\": \"财行〔2013〕533号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十四条\",\n    \"内容概述\": \"外宾来访期间，宴请不得超过2次，包含赴外地访问时接待单位的宴请。\"\n  }\n]"
- expression: 礼品名称、单价、数量、接收人.单价 > 同一团组宴请次数上限.单次赠礼金额上限 || (SUM(礼品名称、单价、数量、接收人.单价) / COUNT(礼品名称、单价、数量、接收人.单价) > 同一团组宴请次数上限.年总额标准)
  description: 直接对比礼品采购单价与制度规定的单价上限，超过即为违规。同时，对于向同一团组多人赠礼的情况，可计算人均赠礼成本，若高于规定标准，则视为变相超标。需关注将高价礼品拆分采购、开具“办公用品”“宣传品”等名目发票的规避行为。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 超标准对外赠礼
  regulation: "[\n  {\n    \"法规名称\": \"党政机关外宾接待管理办法\",\n    \"法规文号\": \"财行〔2013〕533号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条第（二）款\",\n    \"内容概述\": \"对外赠礼应当遵循节约从简原则，赠礼对象应为外方团长或重要成员，同一来访外宾团组原则上只赠礼一次，礼品应尽量选择具有民族特色的纪念品、传统手工艺品等，单价不得超过150元。\"\
    \n  }\n]"
- expression: (明细台账.实收金额 = 0 AND 当前日期 - 入申报表.缴费截止日 > 法定缓征期) OR (明细台账.实收日期 - 入申报表.缴费截止日 > 规定文件.法定追缴期限 AND 明细台账.实收金额 > 0)
  description: 应收未收：超过缴费截止日且宽限期后仍未收到款项；超期征收：实际征收日期距缴费截止日已超过法定追缴时效（如《行政处罚法》规定的执行期限）仍继续收取。具体截止日和追缴期依据具体项目规定和法律法规确定，原则上非税收入应按时足额征收。
  audit_item: 违反规定征收非税收入
  suspicion: 应收未收或超期征收非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定改变征收期限。非税收入应当按照规定的缴款期限收缴入库。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国行政处罚法\",\n \
    \   \"法规文号\": \"主席令第70号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十二条\",\n    \"内容概述\": \"当事人逾期不履行行政处罚决定的，作出行政处罚决定的行政机关可以申请人民法院"
- expression: (统计表.接电日期 - 统计表.申请日期) > 各类业务法定办理时限（如低压居民15个工作日）.各类业务法定办理时限（如低压居民15个工作日） && 无延期审批手续 || (超期工单数 / 总工单数 > 0.1)
  description: 根据规定，低压居民报装全流程不应超过15个工作日，无正当理由超时即构成违规；超期率超过10%表明业务办理系统性问题。
  audit_item: 电网改造和供电服务不合规
  suspicion: 用电报装业务办理严重超时限
  regulation: "[\n  {\n    \"法规名称\": \"压缩用电报装时间实施方案\",\n    \"法规文号\": \"国能监管〔2017〕110号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"总体要求及分类时限要求\",\n    \"内容概述\": \"低压居民用电报装全流程平均时限压缩至15个工作日以内，高压单电源40个工作日以内，高压双电源55个工作日以内。\"\n  }\n]"
- expression: (项目验收合格日期、资金拨付日期.资金拨付日期 - 项目验收合格日期、资金拨付日期.项目验收合格日期) > 承诺办结时限（工作日）.承诺办结时限（工作日） + 30天
  description: 计算从项目验收合格到资金最终拨付的实际天数，若超出文件规定的办结时限超过30天（容错期），则判定为因验收或审批流程不畅导致资金发放不及时，形成资金滞留。
  audit_item: 资金管理使用不符合相关规定
  suspicion: 验收烦琐导致补助资金滞留
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位的支出必须按照预算执行，加强对预算支出的管理和监督。各级政府不得挤占、挪用或者无正当理由拖延拨付预算支出资金。\"\n  }\n]"
- expression: (明细表.发放方式='现金' AND 要求发放渠道.要求发放渠道='银行代发') OR (明细表.发放方式='银行代发' AND 流水.账号 NOT IN (流水.对方账户) OR 流水.户名 != 明细表.收款人姓名)
  description: 当制度要求必须通过银行代发到个人账户，而实际出现现金发放；或银行代发记录中对方账户与救助对象不符时，可能存在截留冒领。
  audit_item: 社会保障待遇计算、发放错误
  suspicion: 现金发放特困供养金存在截留冒领风险
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十九条\",\n    \"内容概述\": \"救助金应当通过金融机构实行社会化发放，直接支付到救助对象个人账户。\"\n  }\n]"
- expression: (服务机构性质.服务机构性质 != '金融机构' AND 服务机构性质.手续费率 > 行业标准费率*1.2) OR (规定文件.公开招标要求='公开招标' AND 服务机构性质.采购方式 != '公开招标')
  description: 代发机构必须为具备资质的金融机构，手续费率明显高于同类银行交易费率20%以上或未通过公开招标选择，均为违规。行业标准费率可参考当地银行代发平均费率。
  audit_item: 社会保障待遇计算、发放错误
  suspicion: 指定非金融机构代发养老金手续费超支
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十六条、第二十八条\",\n    \"内容概述\": \"采购应采用公开招标等法定方式，选择合格供应商。\"\n  }\n]"
