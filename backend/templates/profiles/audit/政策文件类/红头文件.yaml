name: audit/政策文件类/红头文件
type: model
description: 从政策文件类类文档（红头文件）中提取结构化元数据。涵盖字段如：优惠措施条款、协调机构名称、发文机关、成员单位、成文日期、文件发布日期、文件标题、是否明确协调机构。文档范围包括：用人单位招用退役军人优惠政策红头文件、红头文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 红头文件
  member_count: 1
  member_details:
  - 用人单位招用退役军人优惠政策红头文件
  - 红头文件
output:
  fields:
  - name: 优惠措施条款
    type: number
    description: 提取 优惠措施条款 的数值（含单位，如万元、吨等）
  - name: 协调机构名称
    type: string
    description: 提取 协调机构名称 的文本值
  - name: 发文机关
    type: string
    description: 提取 发文机关 的文本值
  - name: 成员单位
    type: string
    description: 提取 成员单位 的文本值
  - name: 成文日期
    type: date
    description: 提取 成文日期 的日期值，格式 YYYY-MM-DD
  - name: 文件发布日期
    type: date
    description: 提取 文件发布日期 的日期值，格式 YYYY-MM-DD
  - name: 文件标题
    type: string
    description: 提取 文件标题 的文本值
  - name: 是否明确协调机构
    type: boolean
    description: 提取 是否明确协调机构 的布尔值（是/否）
  - name: 申报条件
    type: string
    description: 提取 申报条件 的文本值
  - name: 职责分工
    type: string
    description: 提取 职责分工 的文本值
violations:
- expression: (红头文件为空) || (红头文件.明确协调机构 != '是') || (COUNT(联席会议记录表 WHERE 会议日期 BETWEEN '审计年度-1' AND '审计年度') < 2) || (EXISTS (SELECT
    1 FROM 联席会议记录表 WHERE 决议执行状态 = '未落实'))
  description: 出现以下任一情形即判定违规：1.无正式协调机制发文的；2.发文但未明确协调机构与职责的；3.最近一个年度内跨部门联席会议次数少于2次的；4.联席会议决议未落实闭环的。
  audit_item: 黑土地保护机制不完善
  suspicion: 未建立黑土地保护协调机制
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第八十七号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"县级以上地方人民政府应当建立黑土地保护协调机制，组织协调有关部门，统筹推进黑土地保护工作。\"\n  }\n]"
- expression: 文件5 IS NULL || (文件5.优惠措施条款（税收减免、社保补贴、岗位补贴等） 不包含 '税收减免' && 文件5.优惠措施条款（税收减免、社保补贴、岗位补贴等） 不包含 '岗位补贴') || (COUNT(统计表.是否已享受优惠政策标记)
    / COUNT(统计表.招录企业名称) < 0.3) || (减免台账.减免金额 < 统计表.招录退役军人数 × 0.5)
  description: 条件1：未出台任何红包头文件；条件2：虽出台文件但缺乏核心优惠措施（税收或补贴）；条件3：实际享受优惠企业占招录企业总数比例低于30%，反映政策覆盖率低；条件4：税务系统实际减免企业数严重少于招录企业数（阈值50%），可能表现为政策宣传不到位或申报门槛过高。四个条件满足任一即触发疑点。30%和50%阈值参考典型审计经验设定。
  audit_item: 未按规定落实自主就业退役士兵安置政策
  suspicion: 未出台或未实质落实用人单位招用退役军人优惠政策
  regulation: "[\n  {\n    \"法规名称\": \"关于促进新时代退役军人就业创业工作的意见\",\n    \"法规文号\": \"退役军人部发〔2018〕26号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三部分第（七）条\",\n    \"内容概述\": \"明确企业招用自主就业退役士兵，可按有关规定享受税收优惠等政策，要求各地制定具体落实措施。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于进一步扶持自主就业退役士兵创业就业有关税收政策的通知\",\n    \"法规文号\": \"财税〔2019〕21号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条、第二条\"\
    ,\n  "
