name: audit/政策文件类/目录文件
type: model
description: 从政策文件类类文档（目录文件）中提取结构化元数据。涵盖字段如：征收对象、征收范围描述、集中采购项目品目、项目名称。文档范围包括：集中采购目录文件、非税收入征收范围目录文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 采购
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 目录文件
  member_count: 1
  member_details:
  - 集中采购目录文件
  - 非税收入征收范围目录文件
output:
  fields:
  - name: 征收对象
    type: string
    description: 提取 征收对象 的文本值
  - name: 征收范围描述
    type: string
    description: 提取 征收范围描述 的文本值
  - name: 集中采购项目品目
    type: string
    description: 提取 集中采购项目品目 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
violations:
- expression: 明细台账.征收项目 NOT IN (征收范围描述.项目名称) OR (明细台账.缴费单位/个人名称 NOT IN (征收范围描述.征收对象))
  description: 当征收台账中出现的项目名称不在财政、物价部门公布的征收范围目录内，或者虽项目名称相符但实际征收对象（如个人、非营利组织）超出了目录规定的对象类型，判定为违规扩大征收范围。
  audit_item: 违反规定征收非税收入
  suspicion: 违规扩大非税收入征收范围
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"非税收入项目由法律、法规、规章设立。设立和征收非税收入，应当依据法 律、法规、规章的规定，并按照管理权限予以批准。任何部门和单位不得违反规定擅自设立非税收入项目或者改变征收范围、标准、对象和期限。\"\
    \n  }\n]"
