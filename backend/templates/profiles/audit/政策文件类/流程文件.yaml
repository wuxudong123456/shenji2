name: audit/政策文件类/流程文件
type: model
description: 从政策文件类类文档（流程文件）中提取结构化元数据。涵盖字段如：专家评审意见书、公开招聘要求、公示时限、决策权限划分条款、出入库审批流程、利率审批底稿中的项目定性依据、各环节审批完成时间、各类保证金收取标准。文档范围包括：人员录用聘用流程文件、保证金操作流程文件、公司担保业务流程文件、公租房申请审核流程文件、军人抚恤待遇审批流程文件、单位内部接待外宾审批流程文件、审批流程文件、对外投资决策相关流程文件、捐赠物资操作流程文件、村庄规划审批流程文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 审批
- 资产
- 金额
- 项目
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 流程文件
  member_count: 1
  member_details:
  - 人员录用聘用流程文件
  - 保证金操作流程文件
  - 公司担保业务流程文件
  - 公租房申请审核流程文件
  - 军人抚恤待遇审批流程文件
  - 单位内部接待外宾审批流程文件
  - 审批流程文件
  - 对外投资决策相关流程文件
  - 捐赠物资操作流程文件
  - 村庄规划审批流程文件
  - 规划审批流程文件
  - 规划编制审批流程文件
  - 资产处置流程文件
  - 资产购置审批流程文件
  - 资金拨付审批流程文件
  - 银行内部贷款利率审批流程文件
  - 项目申报审核流程文件
  - 高风险业务审批流程文件
