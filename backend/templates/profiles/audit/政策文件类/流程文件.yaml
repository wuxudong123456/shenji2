violations:
- expression: (外宾姓名、邀请事由.审批日期 > 外宾姓名、接待日期、接待事由、外宾人数、陪同人数、接待总费用、外宾团组名称.接待日期) || (审批流程跟踪表缺少关键审批环节签字) || (外宾姓名、邀请事由.审批日期为空) ||
    (外宾姓名、邀请事由.邀请事由与单位业务无关)
  description: 判定条件：1.审批日期晚于接待开始日期，即构成'先接待后补批'；2.审批表中若缺少制度规定层级（如部门负责人或外事部门）的签字；3.审批记录缺失；4.接待事由与单位职能或业务无关。任一条件满足即视为违规。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 未经审批擅自邀请外宾来访
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"相关条款\",\n    \"内容概述\": \"因公出国及外事接待活动均需履行事前审批程序，严禁无预算、无审批组织开展接待活动。\"\n  }\n]"
- expression: (采购合同.合同金额 > 审批限额标准、审批层级、所需附件.审批限额标准 && 采购金额区间、对应审批人级别、审批记录.对应审批人级别 < 要求审批级别) || (COUNT(采购合同 BY 供应商, 同类设备, 时间差<90天)
    >= 2 && SUM(合同金额) >= 审批限额标准、审批层级、所需附件.审批限额标准 && 无合并审批记录)
  description: 单笔合同金额超过本级审批权限但未经上级审批；或通过化整为零方式将大额采购拆分为若干小额合同，每笔均未达审批上限，但累计金额超过阈值且无整体报批记录，均属程序违规。
  audit_item: 违反规定配置国有资产
  suspicion: 购置国有资产未按规定程序报批
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"各部门及其所属单位购置规定限额以上的资产，应当经主管部门审核同意后报同级财政部门审批。国家另有规定的，从其规定。\"\n  }\n]"
- expression: (退还台账.收取金额 / 调整后的装修标准.合同金额 > 0.05) || (退还台账.实际退还日期 > 退还台账.应退还日期 + 15 && 退还台账.实际退还日期 IS NOT NULL) || (退还台账.应退还日期
    < '审计基准日' && 退还台账.实际退还日期 IS NULL)
  description: 判定条件一：对中小企业供应商，保证金收取比例超过合同金额的5%，判定为超标收取。判定条件二：延迟退还，即实际退还日期晚于合同/规定应退还日期后15个工作日。判定条件三：截至审计日，已满足退还条件但仍未退还，即长期挂账未退。以上任一条件触发，即为违规。
  audit_item: 未按规定落实降成本政策措施
  suspicion: 超标准收取保证金或未及时退还
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"机关、事业单位和大型企业应当按照合同约定及时退还保证金，不得非法占用。除依法设立投标保证金、履约保证金、工程质量保证金、农民工工资保证金外，不得设立其他保证金。保证金的收取比例应当符合国家有关规定。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步强化质量保证金管理的通知\",\n    \"法规文号\": \"建质[2017]138号\",\n    \"效力级别\": \"部门规章\""
- expression: (对照表.实际拨付农户日期-对照表.资金到账日期>30) && (流程文件.延期审批单==null || 流程文件.审批结果!="同意延期")
  description: 资金到达财政、主管部门或乡镇账户后，超过30天未拨付至下一环节或受益农户，且无合规的延期审批手续，视为资金滞留。30天阈值依据常见管理要求设定，可根据实际制度调整；超过60天且金额较大为高风险。
  audit_item: 惠农财政补贴资金滞留、闲置
  suspicion: 补贴资金滞留在财政、业务主管部门或乡镇账户
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\"\
    ,\n    \"内容概述\": \"各级政府财政部门必须依照法律、行政法规和国务院财政部门的规定，及时、足额地拨付预算支出资金，加强对预算支出的管理和监督。\"\n  },\n  {\n    \"法规名称\": \"惠农财政补贴资金管理办法及实施细则\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第X条（假设）\",\n    \"内容概述\": \"明确资金拨付各环节时限要求，超过时限需提交延期说"
- expression: (当前日期-资金清单.未发放起始年月>730天) && (监测表.沉淀原因分类!=true) && (流程文件.审批结果==null)
  description: 资金连续未发放时间超过730天（2年），且未按规定程序进行清理收回或重新安排使用，即构成资金闲置违规。2年红线依据国办发〔2014〕70号文规定，凡结转资金超2年一律收回财政统筹。若同时产息未上缴，应另案处理。
  audit_item: 惠农财政补贴资金滞留、闲置
  suspicion: 补贴资金闲置超过2年未清理
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步做好盘活财政存量资金工作的通知\",\n    \"法规文号\": \"国办发〔2014〕70号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各部门、各单位要加大结余结转资金统筹使用力度，对结余资金和连续两年未用完的结转资金，一律收回财政统筹使用。\"\n  },\n  {\n    \"法规名称\"\
    : \"惠农财政补贴资金管理办法及实施细则\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第X章关于存量清理的条款\",\n    \"内容概述\"\
    : "
- expression: ABS(村庄规划与上位规划指标对照表.建设用地总规模等约束性指标及偏差值 - 村庄规划与上位规划指标对照表.建设用地总规模等约束性指标及偏差值) / 村庄规划与上位规划指标对照表.建设用地总规模等约束性指标及偏差值
    > 0.05 || (项目清单.规划用地性质 >= 3) || (文本.重点项目布局坐标 > 100米)
  description: 关键约束性指标偏差超过5%即视为不衔接；若超过3个建设项目的用地性质与国土空间总体规划定位冲突，或基础设施布局与专项规划坐标距离偏差大于100米（或明显无法衔接），则构成不衔接疑点。
  audit_item: 村庄规划编制质量不高
  suspicion: 村庄规划与上位或专项规划不衔接
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"城市总体规划、镇总体规划以及乡规划和村庄规划的编制，应当依据国民经济和社会发展规划，并与土地利用总体规划相衔接。\"\n  },\n  {\n    \"法规名称\":\
    \ \"自然资源部办公厅关于加强村庄规划促进乡村振兴的通知\",\n    \"法规文号\": \"自然资办发〔2019〕35号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二（五）\",\n\
    \    \"内容概述"
- expression: (会议日期、签到表、规划讨论内容、决议签字、应到人数、实到人数、签字人数、表决同意人数、主要意见记录.签字人数 / 会议日期、签到表、规划讨论内容、决议签字、应到人数、实到人数、签字人数、表决同意人数、主要意见记录.应到人数
    < 2/3) || (会议日期、签到表、规划讨论内容、决议签字、应到人数、实到人数、签字人数、表决同意人数、主要意见记录.表决同意人数 / 会议日期、签到表、规划讨论内容、决议签字、应到人数、实到人数、签字人数、表决同意人数、主要意见记录.参加人数
    < 0.5) || (公示起始日期、公示结束日期、公示地点照片、公示内容完整性证据.公示天数 < 30) || (公示起始日
  description: 根据《城乡规划法》，村庄规划须经村民会议或村民代表会议讨论同意，参会人数不得少于应到人数的2/3，赞同人数需超过参会人数的1/2；根据《关于城乡规划公开公示的规定》，公示时间不得少于30日；若公示材料缺失或批复日期早于公示结束日期，表明程序倒置或缺失。满足任一条件即触发疑点。
  audit_item: 村庄规划编制质量不高
  suspicion: 村庄规划未履行民主决策与公示程序
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"村庄规划在报送审批前，应当经村民会议或者村民代表会议讨论同意。\"\n  },\n  {\n    \"法规名称\": \"关于城乡规划公开公示的规定\",\n  \
