name: audit/政策文件类/登记文件
type: model
description: 从政策文件类类文档（登记文件）中提取结构化元数据。涵盖字段如：产权主体、产权证号、价值、名称、工程名称、登记日期、规格、资产编号。文档范围包括：农村供水工程产权登记文件、资产登记文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 工程
- 登记
- 资产
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 登记文件
  member_count: 1
  member_details:
  - 农村供水工程产权登记文件
  - 资产登记文件
output:
  fields:
  - name: 产权主体
    type: string
    description: 提取 产权主体 的文本值
  - name: 产权证号
    type: string
    description: 提取 产权证号 的文本值
  - name: 价值
    type: string
    description: 提取 价值 的文本值
  - name: 名称
    type: string
    description: 提取 名称 的文本值
  - name: 工程名称
    type: string
    description: 提取 工程名称 的文本值
  - name: 登记日期
    type: date
    description: 提取 登记日期 的日期值，格式 YYYY-MM-DD
  - name: 规格
    type: string
    description: 提取 规格 的文本值
  - name: 资产编号
    type: string
    description: 提取 资产编号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
violations:
- expression: (清单表.项目名称 NOT IN (产权证号.工程名称)) OR (管护主体.管护主体 IS NULL OR 管护协议未签订)
  description: 将工程清单表中的所有供水项目与产权登记文件和管护协议进行比对，若存在未办理产权登记（工程名称缺失）或无管护主体、未签订管护协议的工程，即判定为疑点。产权登记缺失或管护主体不明将导致后续维修责任推诿。
  audit_item: 农村供水工程管护不到位及运营不规范
  suspicion: 农村供水工程产权不明确或管护责任未落实
  regulation: "[\n  {\n    \"法规名称\": \"农村饮水安全工程建设管理办法\",\n    \"法规文号\": \"发改农经〔2013〕2673号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十七条\",\n    \"内容概述\": \"工程建成后，要及时办理产权移交手续，明确工程产权和运行管护主体，落实管护责任。\"\n  }\n]"
