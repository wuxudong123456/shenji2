name: audit/政策文件类/安排文件
type: model
description: 从政策文件类类文档（安排文件）中提取结构化元数据。涵盖字段如：农村公路养护预算科目、日程安排详情、约定上岗时间、考场签到表、考评员签字记录、考试通知、金额。文档范围包括：地方财政关于农村公路养护的预算安排文件、岗位安排文件、日程安排文件、鉴定考试安排文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 预算
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 安排文件
  member_count: 1
  member_details:
  - 地方财政关于农村公路养护的预算安排文件
  - 岗位安排文件
  - 日程安排文件
  - 鉴定考试安排文件
output:
  fields:
  - name: 农村公路养护预算科目
    type: number
    description: 提取 农村公路养护预算科目 的数值（含单位，如万元、吨等）
  - name: 日程安排详情
    type: string
    description: 提取 日程安排详情 的文本值
  - name: 约定上岗时间
    type: date
    description: 提取 约定上岗时间 的日期值，格式 YYYY-MM-DD
  - name: 考场签到表
    type: string
    description: 提取 考场签到表 的文本值
  - name: 考评员签字记录
    type: string
    description: 提取 考评员签字记录 的文本值
  - name: 考试通知
    type: string
    description: 提取 考试通知 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
violations:
- expression: 支出科目明细表.费用科目 NOT IN ('住宿费','伙食费','场地及设备租赁费','讲课费','培训资料费','交通费','其他培训相关费用') OR 发票品名报销原始凭证.发票品名 REGEXP '礼品|餐饮|旅游|办公设备|纪念品|会议服务'
    OR (日程安排详情安排文件.日程安排详情 IS NULL AND 支出科目明细表.金额 > 0)
  description: 支出科目超出《培训费管理办法》规定的开支范围；或发票品名出现明显与培训无关的关键词；或培训日程安排空白却发生大额支出，均表明存在超范围列支、混入非培训费用的嫌疑。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 超范围列支培训费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关培训费管理办法\",\n    \"法规文号\": \"财行〔2016〕540号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条\",\n    \"内容概述\": \"明确培训费开支范围为住宿费、伙食费、培训场地费、讲课费、培训资料费、交通费和其他费用，严禁在培训费中列支与培训无关的费用。\"\n  }\n]"
- expression: 明细表.金额 > 0 && (COALESCE(签到表.实际签到人数,0) < 统计表.人数 * 0.3 OR 核查表.异常特征标记（四要件缺失、笔迹雷同、场地矛盾等） == 1) && (明细表.收款方户名 !=
    原始凭证.合同供应商 OR 明细表.收款方户名 LIKE '%个人%')
  description: 培训项目有支出但实际签到人数严重不足（低于应参训人数的30%），或异常特征表标记为1（如通知、签到、日程、照片四要件缺失），且资金支付对象与合同供应商不一致或支付给个人账户，则高度疑为虚构培训套取资金。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 虚列培训费套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第（一）项\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，责令改正，追回有关财政资金，对单位给予警告或者通报批评，对直接负责的主管人员和其他直接责任人员给予记大过处分。\"\n  }\n]"
- expression: 地方财政农村公路养护预算科目金额 = 0 或 科目缺失
  description: 若地方财政预算草案或预算安排文件中未设置农村公路养护专项科目或科目金额为零，即未安排本级自有资金用于农村公路养护，判定违规。
  audit_item: 项目建设养护资金管理使用不规范
  suspicion: 地方财政未安排农村公路养护资金
  regulation: "[\n  {\n    \"法规名称\": \"《国务院办公厅关于深化农村公路管理养护体制改革的意见》\",\n    \"法规文号\": \"国办发〔2019〕45号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第三部分（三）完善资金保障机制\",\n    \"内容概述\": \"地方各级人民政府要将农村公路养护资金纳入一般公共财政预算，建立稳定的资金投入机制。\"\n  }\n]"
- expression: (证书名称、发证日期、证书编号、持证人姓名、职业资格名称.证书编号 IS NOT NULL) AND (持证人姓名、身份证号、准考证号、考试日期、考试成绩.准考证号 IS NULL OR 持证人姓名、身份证号、准考证号、考试日期、考试成绩.考试成绩
    IS NULL)
  description: 以鉴定对象为关联键，若存在发证记录但报名登记表中无对应的准考证号或考试成绩，说明缺乏实质性考试环节，即‘仅报名无考试’或‘免考直发证’的违规情形。
  audit_item: 职业资格鉴定政策执行不到位
  suspicion: 未按规定组织考试直接发放职业资格证书
  regulation: "[\n  {\n    \"法规名称\": \"职业技能鉴定规定\",\n    \"法规文号\": \"劳部发〔1993〕134号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条、第十七条\",\n    \"内容概述\": \"职业技能鉴定应坚持客观、公正、科学、规范的原则，必须按照规定的鉴定程序进行考核，理论知识考试和操作技能考核均合格者才能获得相应等级的职业资格证书。\"\n  },\n\
    \  {\n    \"法规名称\": \"人力资源社会保障部关于改革完善技能人才评价制度的意见\",\n    \"法规文号\": \"人社部发〔2019〕90号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\""
