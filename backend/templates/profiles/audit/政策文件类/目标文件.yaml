name: audit/政策文件类/目标文件
type: model
description: 从政策文件类类文档（目标文件）中提取结构化元数据。涵盖字段如：年度建设目标数量、目标密度、目标有机质含量提升幅度、目标深度、目标覆盖率、考核年限、计划耕作层增加厚度。文档范围包括：上级部门下达的任务目标文件、农业保险政策目标文件、农村综合服务社建设目标文件、城乡社区服务中心建设目标文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 目标文件
  member_count: 1
  member_details:
  - 上级部门下达的任务目标文件
  - 农业保险政策目标文件
  - 农村综合服务社建设目标文件
  - 城乡社区服务中心建设目标文件
output:
  fields:
  - name: 年度建设目标数量
    type: date
    description: 提取 年度建设目标数量 的日期值，格式 YYYY-MM-DD
  - name: 目标密度
    type: string
    description: 提取 目标密度 的文本值
  - name: 目标有机质含量提升幅度
    type: string
    description: 提取 目标有机质含量提升幅度 的文本值
  - name: 目标深度
    type: string
    description: 提取 目标深度 的文本值
  - name: 目标覆盖率
    type: string
    description: 提取 目标覆盖率 的文本值
  - name: 考核年限
    type: string
    description: 提取 考核年限 的文本值
  - name: 计划耕作层增加厚度
    type: string
    description: 提取 计划耕作层增加厚度 的文本值
violations:
- expression: 农村综合服务社建设台账.实际建成数 / 城乡社区服务中心建设目标文件.年度建设目标数量 < 0.8 OR COUNT(农村综合服务社建设台账.月均服务人次 < 50) / COUNT(农村综合服务社建设台账.实际建成数)
    > 0.3
  description: 建成数量完成率低于80%或月均服务人次低于50人次的站点占比超过30%，反映建设不到位或者运营虚化。前者是数量硬指标，后者衡量服务质量与可及性。
  audit_item: 为农服务职责履行不到位
  suspicion: 农村综合服务社和城乡社区服务中心建设不足
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"（十二）\",\n    \"内容概述\": \"发展农村综合服务社和城乡社区服务中心，为城乡居民提供日用消费品、文体娱乐、养老幼教、就业培训等多样化服务，构建综合性服务平台。\"\n  }\n]"
- expression: 农业保险覆盖率统计表.实际覆盖率 < 农业保险政策目标文件.目标覆盖率 || 农业保险覆盖率统计表.实际深度 < 农业保险政策目标文件.目标深度 || 农业保险覆盖率统计表.实际密度 < 农业保险政策目标文件.目标密度
  description: 任一实际指标值低于政策文件规定的年度目标值，即构成目标未实现的疑点。差异率通常大于0%即触发，可结合数据质量排除小数点舍入误差。
  audit_item: 农业保险保费补贴政策落实不到位
  suspicion: 农业保险覆盖率深度密度目标未实现
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业保险保险费补贴管理办法\",\n    \"法规文号\": \"财金〔2021〕94号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十四条\",\n    \"内容概述\": \"省级财政部门应结合本地实际，合理确定并下达本地区农业保险绩效目标，包括农业保险覆盖率、农业保险深度和农业保险密度等，并对目标实现情况进行考核。\"\n  }\n\
    ]"
- expression: (年度末实测耕作层厚度 - 基期厚度) < 文件目标增加厚度 || (年度末实测有机质含量 - 基期有机质含量) < 文件目标增加幅度
  description: 通过对比任务目标规定的增幅与实测数据，若任一关键指标（耕作层厚度或有机质含量）的提升量未达到任务目标要求，即判定为绩效目标未实现。若提升量不足目标的50%，表明项目效果极差，可能存在技术路线错误或资金低效问题。
  audit_item: 黑土地保护治理相关任务未完成或完成质量不高
  suspicion: 耕作层厚度和有机质含量提升目标未实现
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"主席令第一一三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第二十三条\",\n    \"内容概述\": \"国家采取措施提高黑土地耕地质量，通过有机肥积造、深耕深松等方式稳步提升耕作层厚度和有机质含量。\"\n  }\n]"
