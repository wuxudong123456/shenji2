name: audit/政策文件类/认证文件
type: model
description: 从政策文件类类文档（认证文件）中提取结构化元数据。涵盖字段如：持信息技术能力认证教师人数。文档范围包括：教师信息技术能力认证文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 认证文件
  member_count: 1
  member_details:
  - 教师信息技术能力认证文件
output:
  fields:
  - name: 持信息技术能力认证教师人数
    type: number
    description: 提取 持信息技术能力认证教师人数 的数值（含单位，如万元、吨等）
violations:
- expression: (培训台账.实际参训人数 / 实施方案.计划参训人数) < 0.80 OR (培训台账.通过考核人数 / 培训台账.实际参训人数) < 0.70
  description: 参训率低于80%反映培训覆盖面不足；合格率低于70%反映培训质量低下或走过场。两项指标任一不满足即构成培训不足疑点。
  audit_item: 教育信息化基本要求未按规定完成
  suspicion: 乡村教师信息化培训覆盖及效果不达标
  regulation: "[\n  {\n    \"法规名称\": \"教育部关于实施全国中小学教师信息技术应用能力提升工程2.0的意见\",\n    \"法规文号\": \"教师〔2019〕1号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、目标任务 （一）总体目标\",\n    \"内容概述\": \"要求到2022年，教师信息技术应用能力显著提升，全面促进信息技术与教育教学融合创新发展，全员培训、整校推进，确保每位教师不少于50学时培训，并落实培训质量监测。\"\
    \n  }\n]"
