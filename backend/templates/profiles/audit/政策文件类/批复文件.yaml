  suspicion: 上下级单位间资金转移未统一核算
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得……（二）截留、挪用财政资金；（三）滞留应当下拨的财政资金……\"\
    \n  }\n]"
- expression: ((项目状态.项目状态 == '已完成') || (项目状态.项目状态 == '已终止')) && (明细表.清理状态 == '未清理') && (DATEDIFF(当前日期, 批复终止日期.批复终止日期) > 30)
    && (明细表.结余金额 > 0)
  description: 当项目进度台账显示项目已完成或已收到正式终止批复，且结余资金明细表中该项目的清理状态仍为“未清理”，同时项目终止日期距审计日已超过30天（制度规定清理时限），且存在结余金额时，触发疑点。
  audit_item: 结余资金管理不规范
  suspicion: 项目终止或完成后未及时清理结余资金
  regulation: "[\n  {\n    \"法规名称\": \"中央部门财政拨款结转和结余资金管理办法\",\n    \"法规文号\": \"财预〔2015〕82号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十条、第十二条\",\n    \"内容概述\": \"项目目标完成或终止后，剩余资金应及时清理确认为结余资金，并按程序报财政部，不得长期挂账或自行调剂使用。\"\n  }\n]"
- expression: (批复文件.批复要求评价的项目清单 - COUNT(评价报告.报告名称)) > 0 || (SUM(评价报告.预算执行率) / SUM(资金规模要求.资金规模要求) < 1)
  description: 根据政策文件，凡达到一定金额的转移支付项目均应开展绩效评价；如存在未开展评价的项目，或已评价项目资金覆盖率未达到100%，即构成违规。
  audit_item: 财政转移支付资金政策绩效评价不规范
  suspicion: 对财政转移支付项目未开展绩效评价
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"各部门、各单位应当对预算资金和项目支出全面开展绩效自评，确保评价范围全覆盖。\"\n  }\n]"
- expression: SUM(合计实际支出) > 批准预算总额
  description: 将会议所有实际支出加总，与批复的预算总额对比，超出即判定为超预算。若超预算但存在合规的超预算审批文件，可豁免；否则构成违规。
  audit_item: 超标准举办会议
  suspicion: 会议费实际支出超出批复预算
  regulation: "[\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十二条\",\n    \"内容概述\": \"各单位应严格执行会议费预算，对未列入年度会议计划和预算的会议，不得报销费用。\"\n  }\n]"
- expression: 明细表.按人结算的费用项目（住宿间夜数、餐券数）及对应人数 > 签到表.实际签到人数 && 明细表.按人结算的费用项目（住宿间夜数、餐券数）及对应人数 > 批复文件.批准参会人数
  description: 以签到表确认的实际参会人数为基准，若按人结算的费用项目（如住宿、餐费）所用人数明显超出实际签到人数，且超出批准名额，则存在虚增参会社员套取经费的嫌疑。
  audit_item: 超标准举办会议
  suspicion: 虚列参会人数套取会议经费
  regulation: "[\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十五条\",\n    \"内容概述\": \"各单位应当严格控制会议规模，参会人员原则上不得超过规定人数，申报时须列明参会人员数量。\"\n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\"\
