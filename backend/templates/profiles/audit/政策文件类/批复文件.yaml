name: audit/政策文件类/批复文件
type: model
description: 从政策文件类类文档（批复文件）中提取结构化元数据。涵盖字段如：上年预算金额、上级批复文号及批复内容、专项资金拨付计划、主业经营范围描述、主要产业类别、主要设备规格、举办经济实体批复文号、人均预算批复金额。文档范围包括：上级单位或财政部门关于资产使用的批复文件、上级单位车辆统计报告批复文件、上级批复文件、上级部门关于目标任务的批复文件、上级部门关于编制调整的批复文件、专项规划批复文件、中央预算内投资资金批复文件、企业主责主业定位相关批复文件、企业债券发行批复文件、优惠政策批复文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 会议
- 补贴
- 金额
- 项目
- 元数据提取
