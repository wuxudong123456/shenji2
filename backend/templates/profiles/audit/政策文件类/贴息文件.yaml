name: audit/政策文件类/贴息文件
type: model
description: 从政策文件类类文档（贴息文件）中提取结构化元数据。涵盖字段如：兑现周期、贴息比例。文档范围包括：政策贴息文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 贴息文件
  member_count: 1
  member_details:
  - 政策贴息文件
output:
  fields:
  - name: 兑现周期
    type: string
    description: 提取 兑现周期 的文本值
  - name: 贴息比例
    type: number
    description: 提取 贴息比例 的数值（含单位，如万元、吨等）
violations:
- expression: 贴息资金预算科目.安排金额 = 0 && 贴息文件.兑现周期 || (贴息文件.兑现周期 - 申报材料.申报贴息额) > 180 天 && 发放记录.发放金额 < 申报材料.申报贴息额 * 0.8
  description: 已出台明确贴息政策但财政未安排对应预算，或兑现延迟超过6个月，或实际发放金额不足应发额的80%，视为贴息政策空转。
  audit_item: 相关支持政策落实不到位
  suspicion: 涉农贷款贴息资金未安排或长期拖欠
  regulation: "[\n  {\n    \"法规名称\": \"财政部 农业农村部关于进一步做好农业相关财政金融政策落实工作的通知\",\n    \"法规文号\": \"财农〔2020〕XX号（示例）\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各级财政要将涉农贷款贴息资金足额纳入年度预算，及时审核拨付，不得无故拖延或降低兑现标准。\"\n  }\n]"
