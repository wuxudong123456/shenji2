name: audit/政策文件类/审核文件
type: model
description: 从政策文件类类文档（审核文件）中提取结构化元数据。涵盖字段如：姓名、安置日期、审核意见、岗位性质、身份证号。文档范围包括：公益性岗位人员资格审核文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 审核文件
  member_count: 1
  member_details:
  - 公益性岗位人员资格审核文件
output:
  fields:
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 安置日期
    type: date
    description: 提取 安置日期 的日期值，格式 YYYY-MM-DD
  - name: 审核意见
    type: string
    description: 提取 审核意见 的文本值
  - name: 岗位性质
    type: string
    description: 提取 岗位性质 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
violations:
- expression: 公益性岗位人员.身份证号 IN (财政供养人员名单.身份证号) || (同一身份证号 在公益性岗位补贴发放表中 对应多个缴费单位) || (公益性岗位工资发放表.实发金额 > 0 && 社保缴纳记录.缴费状态 ==
    欠缴且持续时间 > 3个月)
  description: 若公益性岗位人员属于财政供养人员（如村干部、在编人员），或同一人同时在多个单位申领岗位补贴，或长期欠缴社保却正常领取工资，则属违规安置套取补贴。严重违规：财政供养人员占比超过总岗位数10%。
  audit_item: 骗取、套取资金或补贴
  suspicion: 违规安置不符合条件人员套取公益性岗位补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"公益性岗位补贴对象为就业困难人员，重点是大龄失业人员和零就业家庭人员，不得将不符合条件人员安置到公益性岗位套取补贴。\"\n  },\n  {\n    \"法规名称\": \"\
    关于进一步做好公益性岗位开发管理有关工作的通知\",\n    \"法规文号\": \"人社部发〔2020〕50号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二（三）\",\n    \"\
    内容概述\":"
