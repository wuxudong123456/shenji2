name: audit/政策文件类/处罚文件
type: model
description: 从政策文件类类文档（处罚文件）中提取结构化元数据。涵盖字段如：处罚对象、处罚金额、违规事项。文档范围包括：外部投诉或行政处罚文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 金额
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 处罚文件
  member_count: 1
  member_details:
  - 外部投诉或行政处罚文件
output:
  fields:
  - name: 处罚对象
    type: string
    description: 提取 处罚对象 的文本值
  - name: 处罚金额
    type: number
    description: 提取 处罚金额 的数值（含单位，如万元、吨等）
  - name: 违规事项
    type: string
    description: 提取 违规事项 的文本值
violations:
- expression: (授权使用费标准.授权使用费标准 = 0 || 使用台账.付费记录 = '无' && 备案使用主体.备案状态 = '未备案') && (使用台账.使用企业名称 in (参股企业名单) && 事故责任方.记录数 > 0)
    || (授权期价值变动.授权期价值变动 < -0.2)
  description: 向参股企业提供字号、资质等无形资产而未收取使用费、未备案或缺少监督，且引发质量事故导致品牌价值下降20%以上的，即构成违规授权且未有效维护权益。
  audit_item: 资产管理方面存在的问题
  suspicion: 违规向参股企业提供字号、资质等无形资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十四条\",\n    \"内容概述\": \"国有独资企业、国有独资公司、国有资本控股公司不得无偿向关联方提供资金、商品、服务或者其他资产，不得以不公平的价格与关联方进行交易。\"\n  }\n]"
