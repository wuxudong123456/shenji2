name: audit/政策文件类/评价文件
type: model
description: 从政策文件类类文档（评价文件）中提取结构化元数据。涵盖字段如：三产融合自评得分、实际融合度指标、实际达成指标、预期效益指标。文档范围包括：绩效评价文件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 政策文件类
- 审计
- 元数据提取
template_class:
  category: 政策文件类
  member_types:
  - 评价文件
  member_count: 1
  member_details:
  - 绩效评价文件
output:
  fields:
  - name: 三产融合自评得分
    type: string
    description: 提取 三产融合自评得分 的文本值
  - name: 实际融合度指标
    type: string
    description: 提取 实际融合度指标 的文本值
  - name: 实际达成指标
    type: string
    description: 提取 实际达成指标 的文本值
  - name: 预期效益指标
    type: string
    description: 提取 预期效益指标 的文本值
violations:
- expression: (分析表.各环节交易占比 < 0.3) || (合同协议.采购量 < 0.5) || (结构表.农业相关收入 < 0.3) || (评价文件.实际达成指标 < 0)
  description: 一二三产企业间交易额占总营收比例低于30%表明产业链关联度弱；深加工企业本地原料采购率低于50%说明种养与加工脱节；企业农业相关收入（种养、加工、休闲农业）占比低于30%说明企业偏离农业主业；绩效评价中三产融合指标未达标直接判定。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 一二三产业关联度低未形成融合发展
  regulation: "[\n  {\n    \"法规名称\": \"《关于推进农村一二三产业融合发展的指导意见》\",\n    \"法规文号\": \"国办发〔2015〕93号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、发展多类型农村产业融合方式\",\n    \"内容概述\": \"鼓励通过延伸产业链、打造供应链、提升价值链等方式，推动种养业与加工流通、休闲旅游等深度融合。\"\n  }\n]"
- expression: (资产清单.原值 / 资产清单.原值 > 0.2) || (使用台账.运行时长 / 使用台账.运行时长 < 0.1) || (分析表.单台设备投入产出比（ROI） < 1) || (使用台账.维护记录 && 资产清单.使用状态
    = '闲置')
  description: 闲置资产原值占比超过20%视为严重闲置；设备实际使用率低于设计量的10%为严重低效；投入产出比小于1意味着项目运行后不仅无收益，连运营成本都无法覆盖；资产无任何运行或维护记录且系统状态标记为闲置即为长期闲置。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 产业园资产闲置或效益低下
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价，提高财政资金使用效益。\"\n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n  \
    \  \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有截留、挪用财政资金，或以虚报、冒领等手段骗取财政资"
