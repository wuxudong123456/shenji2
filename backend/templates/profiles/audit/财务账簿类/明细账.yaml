name: audit/财务账簿类/明细账
type: model
description: 从财务账簿类类文档（明细账）中提取结构化元数据。涵盖字段如：业务招待费、业务类型、主营业务收入贷方合计、二级科目、付款对象、付款摘要、企业类型、会计科目。文档范围包括：企业财务费用明细账、会计账簿明细账、会议费支出明细账、保险机构保费收入明细账、公务接待费明细账、公用经费支出明细账、其他应付款明细账、其他应收款明细账、其他项目支出中涉及出国费用的明细账、制造费用明细账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 付款
- 凭证
- 票据
- 金额
- 元数据提取
