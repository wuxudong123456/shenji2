  description: 对于未设立独立法人的投资项目，法规要求其资本金必须专户存储、独立核算。该表达式判定：1、未开立独立银行专户；2、资本金支出与项目无关；3、与母公司资金有频繁、非经营性往来。满足任一条件即视为未独立核算。
