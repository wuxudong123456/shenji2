name: audit/财务账簿类/总账
type: model
description: 从财务账簿类类文档（总账）中提取结构化元数据。涵盖字段如：入账日期、入账金额、期末余额、科目代码、科目名称、科目编码。文档范围包括：会计账簿总账、总账、维修资金总账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 总账
  member_count: 1
  member_details:
  - 会计账簿总账
  - 总账
  - 维修资金总账
output:
  fields:
  - name: 入账日期
    type: date
    description: 提取 入账日期 的日期值，格式 YYYY-MM-DD
  - name: 入账金额
    type: number
    description: 提取 入账金额 的数值（含单位，如万元、吨等）
  - name: 期末余额
    type: number
    description: 提取 期末余额 的数值（含单位，如万元、吨等）
  - name: 科目代码
    type: string
    description: 提取 科目代码 的文本值
  - name: 科目名称
    type: string
    description: 提取 科目名称 的文本值
  - name: 科目编码
    type: string
    description: 提取 科目编码 的文本值
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: ABS(总账.期末余额 - SUM(明细账.期末余额 WHERE 明细账.科目编码 = 总账.科目编码)) != 0
  description: 总账与所属明细账应按平行登记原则保持余额一致，任何差异均属违规。
  audit_item: 以未经审核的会计凭证为依据登记会计账簿或者会计账簿登记不符合规定
  suspicion: 总账与明细账余额不一致
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（1999年修订）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证会计账簿记录与实物及款项的实有数额相符、会计账簿记录与会计凭证的有关内容相符、会计账簿之间相对应的记录相符。\"\n\
    \  },\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六十条第"
- expression: (单位清单.单位编码 NOT IN 单位清单.单位编码) || (说明文件.项目编码 NOT IN 资金清单.项目编码)
  description: 将应编入的单位清单与实际编入的单位清单按单位编码（或统一社会信用代码）进行比对，若存在应编入单位未出现在实际编入清单中，判定为遗漏单位；同理，应编入的资金项目（如专项资金）未出现在实际编入资金清单中，判定为遗漏资金。两者满足任一条件即触发疑点。
  audit_item: 决算报告编报事项不准确
  suspicion: 应纳入决算编报范围的单位或资金遗漏未编入
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"各部门应当按照财政部门的要求，及时向预算单位布置决算编制工作，并督促其准确编制决算。各部门应当将本部门所属各单位全部纳入决算编制范围，认真审核汇总本部门决算，确保数据完整、真实、准确。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第"
