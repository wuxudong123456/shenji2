name: audit/财务账簿类/付对账单
type: model
description: 从财务账簿类类文档（付对账单）中提取结构化元数据。涵盖字段如：交易日期、收款方名称、收款方账号、金额。文档范围包括：支付对账单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 付对账单
  member_count: 1
  member_details:
  - 支付对账单
output:
  fields:
  - name: 交易日期
    type: date
    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 收款方名称
    type: number
    description: 提取 收款方名称 的数值（含单位，如万元、吨等）
  - name: 收款方账号
    type: number
    description: 提取 收款方账号 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
