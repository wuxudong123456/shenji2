name: audit/财务账簿类/拨对账单
type: model
description: 从财务账簿类类文档（拨对账单）中提取结构化元数据。涵盖字段如：摘要、村级账户入账流水。文档范围包括：财政专户资金划拨对账单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 拨对账单
  member_count: 1
  member_details:
  - 财政专户资金划拨对账单
output:
  fields:
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 村级账户入账流水
    type: string
    description: 提取 村级账户入账流水 的文本值
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: (明细表.收入项目 IS NOT NULL AND 收费项目名称.审批状态 = '未审批') || (其他.收据编号连续性缺失率 > 0.05 AND 其他.入账日期 - 其他.开票日期 > 5) || (明细表.收入项目
    NOT IN 会议记录.议题) || (其他.签字确认 IS NULL)
  description: 判定条件一：存在村级收费但无上级审批备案文件，即属乱收费；条件二：收据号段缺失率超5%且入账延迟超过5天，为坐收坐支、截留挪用的典型特征；条件三：收费项目未经过村民代表会议表决同意，程序违法；条件四：收据无缴款人签字，真实性存疑，可能虚构收费或冒名截留。满足任一条件即触发疑点。
  audit_item: 截留挪用涉农财政专项资金
  suspicion: 村级组织无依据向农民收费或罚款
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步规范涉农收费管理工作的通知\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第二条、第三条\",\n    \"内容概述\": \"村级向农民收取费用必须经村民会议或村民代表会议讨论通过，并报乡镇政府审核备案，开具合规票据，收入全额纳入村集体经济组织账务管理，严禁无依据收费、搭车收费、坐收坐支。\"\n\
    \  }\n]"
