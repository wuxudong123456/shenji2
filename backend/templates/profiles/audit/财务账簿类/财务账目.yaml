name: audit/财务账簿类/财务账目
type: model
description: 从财务账簿类类文档（财务账目）中提取结构化元数据。涵盖字段如：其他收入、支出明细、无发票支出、白条金额、账内是否存在办卡费收入、账外收入科目、集资款。文档范围包括：村级财务账目、村集体财务账目等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 明细
- 票据
- 金额
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 财务账目
  member_count: 1
  member_details:
  - 村级财务账目
  - 村集体财务账目
output:
  fields:
  - name: 其他收入
    type: number
    description: 提取 其他收入 的数值（含单位，如万元、吨等）
  - name: 支出明细
    type: number
    description: 提取 支出明细 的数值（含单位，如万元、吨等）
  - name: 无发票支出
    type: number
    description: 提取 无发票支出 的数值（含单位，如万元、吨等）
  - name: 白条金额
    type: number
    description: 提取 白条金额 的数值（含单位，如万元、吨等）
  - name: 账内是否存在办卡费收入
    type: number
    description: 提取 账内是否存在办卡费收入 的数值（含单位，如万元、吨等）
  - name: 账外收入科目
    type: number
    description: 提取 账外收入科目 的数值（含单位，如万元、吨等）
  - name: 集资款
    type: number
    description: 提取 集资款 的数值（含单位，如万元、吨等）
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: ABS(SUM(拨付台账.拨付金额) - SUM(流水清单.金额)) > 100 OR 流水清单.收款账户 NOT IN (SELECT 银行账号 FROM 明细表) OR 财务账目.支出明细 LIKE '%补贴返还%'
    OR 财务账目.其他收入 > 0 AND 来源不明
  description: 财政拨付总额与银行实际代发到户总额存在差异（差值>100元），或补贴资金流向非农户账户，或村级账目中出现“补贴款返还”“捐赠”等异常收入，均表明资金可能被截留用于二次分配。
  audit_item: 惠农补贴发放不到位
  suspicion: 截留惠农补贴资金二次分配
  regulation: "[\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"截留、挪用财政资金的，责令改正，调整有关会计账目，追回违反规定使用的财政资金，并对单位给予警告或者通报批评。\"\n  }\n]"
- expression: (明细表.资金流入类别 != '上级拨款' && 资金流入类别 模糊匹配 '补贴收入' && 资金未进入村集体公开账户) || (明细表.银行卡号 與 信息.账户持有人.银行卡号 匹配 && 发放金额汇总与账目记录不符)
    || (账外收入科目中出现“其他收入”“暂存款”大额入账 && 无合法资金来源说明 && 同时期有虚报补贴线索)
  description: 当村集体财务收支出现来源不明且未入公示大账的补贴性资金，或者虚报补贴资金直接存入村干部个人或亲属账户，或者账外有大量‘其他收入’与补贴发放时间吻合，即构成私存私放。核心是补贴资金脱离法定监管账户，形成账外“小金库”。
  audit_item: 监管不到位，惠农补贴资金被套取骗取、违规使用
  suspicion: 村委会村干部私存私放虚报套取的补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三百八十二条\"\
    ,\n    \"内容概述\": \"国家工作人员利用职务上的便利，侵吞、窃取、骗取或者以其他手段非法占有公共财物的，是贪污罪。受国家机关、国有公司、企业、事业单位、人民团体委托管理、经营国有财产的人员，利用职务上的便利，侵吞、窃取、骗取或者以其他手段非法占有国有财物的，以贪污论。\"\
    \n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \""
- expression: 交费农户姓名、收费金额、收费事由、收款人.收费金额 > 0 && (交费农户姓名、收费金额、收费事由、收款人.收费事由 包含 '手续费' or '工本费' or '代办费') && (账内是否存在办卡费收入、账外收入科目、无发票支出、白条金额.账外收入科目
    未查到该项收费入账记录 || 资金去向不明)
  description: 存在向农户收费办理‘一卡通’的行为，且该费用既无合法收费依据，又未纳入村集体账内核算，资金去向不明，即构成违规收费。根据政策办卡应免费，任何以办卡名义收取的费用均属乱收费。
  audit_item: 监管不到位，惠农补贴资金被套取骗取、违规使用
  suspicion: 村干部违规向农户收取办理“一卡通”费用
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于治理向企业乱收费、乱罚款和各种摊派等问题的决定\",\n    \"法规文号\": \"中发〔1997〕14号\",\n    \"效力级别\":\
    \ \"制度文件\",\n    \"条款号\": \"一\",\n    \"内容概述\": \"坚决取消不符合规定的向企业、农民的行政事业性收费、罚款、集资、基金项目和各种摊派。严格执行国家规定，严禁擅自设立收费项目、提高收费标准、扩大收费范围。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步加强惠农惠民补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财办〔2020〕17号\",\n    \"效力级别\": \"制"
