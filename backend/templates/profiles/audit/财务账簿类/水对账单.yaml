name: audit/财务账簿类/水对账单
type: model
description: 从财务账簿类类文档（水对账单）中提取结构化元数据。涵盖字段如：交易对手、交易摘要、交易日期、交易时间、交易金额、对方账号、对方账户、对方账户名称。文档范围包括：退捕补偿银行流水对账单、银行流水对账单、银行账户流水对账单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 水对账单
  member_count: 1
  member_details:
  - 退捕补偿银行流水对账单
  - 银行流水对账单
  - 银行账户流水对账单
output:
  fields:
  - name: 交易对手
    type: string
    description: 提取 交易对手 的文本值
  - name: 交易摘要
    type: string
    description: 提取 交易摘要 的文本值
  - name: 交易日期
    type: date
    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 交易时间
    type: date
    description: 提取 交易时间 的日期值，格式 YYYY-MM-DD
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 对方账号
    type: string
    description: 提取 对方账号 的文本值
  - name: 对方账户
    type: string
    description: 提取 对方账户 的文本值
  - name: 对方账户名称
    type: string
    description: 提取 对方账户名称 的文本值
  - name: 户名
    type: string
    description: 提取 户名 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 支出金额
    type: number
    description: 提取 支出金额 的数值（含单位，如万元、吨等）
  - name: 收入金额
    type: number
    description: 提取 收入金额 的数值（含单位，如万元、吨等）
  - name: 收款人姓名
    type: number
    description: 提取 收款人姓名 的数值（含单位，如万元、吨等）
  - name: 收款人账号
    type: number
    description: 提取 收款人账号 的数值（含单位，如万元、吨等）
  - name: 收款方名称
    type: number
    description: 提取 收款方名称 的数值（含单位，如万元、吨等）
  - name: 收款账号
    type: number
    description: 提取 收款账号 的数值（含单位，如万元、吨等）
  - name: 账号
    type: string
    description: 提取 账号 的文本值
  - name: 账户名称
    type: string
    description: 提取 账户名称 的文本值
  - name: 账户户名
    type: string
    description: 提取 账户户名 的文本值
  - name: 贷款资金去向交易对手
    type: number
    description: 提取 贷款资金去向交易对手 的数值（含单位，如万元、吨等）
  - name: 资金回流标志
    type: boolean
    description: 提取 资金回流标志 的布尔值（是/否）
  - name: 资金用途摘要
    type: string
    description: 提取 资金用途摘要 的文本值
  - name: 转账摘要
    type: string
    description: 提取 转账摘要 的文本值
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: 拨付流水表.接收账户 包含 ('乡镇财政所' || '主管部门账户' || '过渡账户') && 拨付流水表.拨付时间 < 补贴发放明细表.发放日期
  description: 国库集中支付制度要求补贴资金直接支付到最终收款人（农户一卡通）账户。若拨付流水显示资金先转入乡镇、主管部门或过渡账户，再由这些账户转付给农户，且存在时间差，即为未按规定执行国库集中支付，存在资金沉淀或挪用的风险。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 未按国库集中支付制度发放补贴
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（六）\",\n    \"内容概述\": \"各级财政部门要严格按照国库集中支付制度有关规定，将补贴资金直接发放到户，严禁违规设立发放过渡账户。\"\n  }\n]"
- expression: 明细表.银行卡号 通过 水对账单 查询到的账户户名 != 明细表.姓名 && 授权书 中针对该受益人-代领人组合的记录不存在
  description: 补贴资金原则上应直接发放到受益人本人银行卡。若发放时银行卡户名与受益人不一致，且没有合法有效的代领授权手续，即构成违规代领，存在资金被他人侵占的风险。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 补贴资金违规转入他人银行卡代领
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（五）\",\n    \"内容概述\": \"严禁任何单位和个人违规代领、截留、挪用补贴资金，确需代领的须有合法授权并备案登记。\"\n  }\n]"
- expression: (明细表.收款方 != 合作社对公账户) || (水对账单.对方账户名称 IN 理事长/理事亲属工商登记名单 && 水对账单.交易金额 > 50000 && ABS(资产清单.购置金额 - 水对账单.交易金额) <
    0.1 * 资产清单.购置金额) || (资产清单.资产状态 == '账面无' && 证明文件.资产权属人 != 合作社)
  description: 若补贴资金收款方非合作社对公账户，或大额资金流向理事长等关联个人且与资产购置金额高度吻合，或账面资产无对应的权属证明文件，则判定为涉嫌资产侵占。阈值：金额>5万元且差异率<10%为可疑，需进一步核实关联关系。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 理事长等侵占私分合作社资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n   \
    \ \"条款号\": \"第三十八条\",\n    \"内容概述\": \"农民专业合作社的理事长、理事和管理人员不得侵占、挪用、私分或者以其他方式损害合作社的财产。\"\n  }\n]"
- expression: (其他.营业收入 FOR LAST 2 YEARS <= 水对账单.支出金额 * 10) && (进度表.已履约金额 == 0) && (备案材料.成立日期 > 3 YEARS AGO)
  description: 成立超过3年，近两年申报收入几乎为零(仅可覆盖微量账户管理费)，且无任何业务合同履行记录，同时满足即判定为空壳化运营。使用收入与手续费倍数关系过滤休眠账户。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 合作社成立后未运营或运营效果不佳导致空壳化
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第八十三号\",\n    \"效力级别\": \"法律\",\n   \
    \ \"条款号\": \"第五条\",\n    \"内容概述\": \"农民专业合作社应当遵循为成员谋求共同利益、以服务成员为宗旨。\"\n  }\n]"
- expression: '(渔民姓名、身份证号、银行账号、捕捞证号、渔船编号、联系方式.身份证号 IN (SELECT 身份证号 FROM 身份证号、生存状态、户籍地址、姓名、户籍状态、迁出/死亡日期 WHERE 户籍状态 IN (''迁出'',''死亡'')))
    OR (渔民姓名、身份证号、银行账号、捕捞证号、渔船编号、联系方式.身份证号 IN (SELECT 身份证号 FROM 身份证号、参保状态、参保单位名称 WHERE 参保状态=''在职'' AND 参保单位 NOT LIKE ''%渔业%''))
    OR (渔民姓名、身份证号、银行账号、捕捞证号、渔船编号、联系方式.渔船编号 NOT IN (SELECT 渔船编号 FROM '
  description: 满足任一条件即触发疑点：户籍迁出或死亡仍登记在册；社保在职且单位非渔业表明已转行；渔船未在有效登记清单中；身份证号缺失或位数不符；同一身份证号出现多条有效记录（重复登记）。
  audit_item: 补偿制度落实不到位（渔业）
  suspicion: 建档立卡数据不精准致虚假冒领
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分第（八）条\",\n    \"内容概述\": \"要求做好退捕渔民的摸底调查、精准识别，建立台账。\"\n  },\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\"\
    ,\n    \"法规文号\": \"农长渔发〔2019〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    "
- expression: (发放明细表.实发金额 < 发放明细表.应发金额 * 0.95) OR (发放明细表.收款账号 NOT IN (SELECT 水对账单.收款账号) AND 发放明细表.实发金额 > 0) OR (发放明细表.签收状态='未签收'
    AND 水对账单.交易金额 IS NULL) OR (水对账单.交易金额 < 政策文件.补偿标准金额) OR (水对账单.交易摘要 LIKE '%代扣费%' OR 水对账单.交易摘要 LIKE '%手续费%')
  description: 实发金额低于应发金额的95%；发放记录中的收款账号在银行流水中无对应收款记录；签收状态为未签收且无银行流水；银行到账金额低于政策标准；银行交易摘要出现代扣费、手续费等异常扣款，以上情况均视为未足额到户。
  audit_item: 补偿制度落实不到位（渔业）
  suspicion: 补助资金未足额发放到户
  regulation: "[\n  {\n    \"法规名称\": \"财政部 农业农村部关于修订印发《农业资源及生态保护补助资金管理办法》的通知\",\n    \"法规文号\": \"财农〔2020〕10号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"补助资金应当直接发放到补助对象，任何单位和个人不得截留、挪用。\"\n  }\n]"
- expression: (明细表.支出科目名称 NOT IN ('职业培训补贴', '职业技能鉴定补贴', '社会保险补贴', '公益性岗位补贴', '就业见习补贴', '特定就业政策补贴', '就业服务补助', '其他符合规定的就业支出'))
    && (明细表.收款方名称 IN (三公经费支付对象) || 明细表.资金用途摘要 CONTAINS ('招待', '接待', '差旅', '公车', '出国', '考察', '会议')) || (水对账单.资金用途摘要 CONTAINS
    ('招待', '接待', '差旅', '公车', '出国', '考察', '会议') && 水对账单.交易金额 关联 明细表.支出金额)
  description: 基于就业补助资金管理办法规定的允许支出科目白名单（如职业培训补贴、社保补贴等），筛选出所有不在白名单内的支出。同时，通过关键词匹配和收款方比对，锁定与'三公'经费相关的支出，如招待费、差旅费、出国费等。结合银行流水可追踪资金最终流向是否为酒店、旅行社、车辆维修等非就业相关机构，判定为挤占挪用。
  audit_item: 挤占挪用资金（社保）
  suspicion: 挤占就业补助资金支付三公经费
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国就业促进法\",\n    \"法规文号\": \"中华人民共和国主席令第七十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"国家实行有利于促进就业的财政政策，就业专项资金必须用于职业介绍、职业培训、公益性岗位、职业技能鉴定、特定就业政策和社会保险等补贴，不得挪作他用。\"\n  },\n  {\n \
    \   \"法规名称\": \"财政部 人力资源社会保障部关于印发《就业补助资金管理办法》的通知\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款"
- expression: (发放清单.申报用途 != 使用台账.实际用途描述) || (水对账单.贷款资金去向交易对手 NOT IN (设备供应商、原材料供应商、场地出租方) && 水对账单.交易金额 > 贷款金额的60%) || (水对账单.资金回流标志
    == 1) || (证明材料.设备购置发票及实物照片 < 贷款金额的50% && ABS(信息.纳税申报收入增长率) < 5%)
  description: 通过比对贷款申报用途与实际银行流水去向，判断资金是否用于禁止领域。若申报购买设备，但主要资金流向房地产公司、证券公司、个人账户或用于偿还其他贷款，则触发违规。大额现金提取或资金回流至借款人关联账户是高风险信号。同时，贷后经营数据（如纳税、社保）无显著增长，佐证贷款未用于真实经营的违规事实。
  audit_item: 挤占挪用资金（社保）
  suspicion: 违规挪用创业担保贷款至非申报用途
  regulation: "[\n  {\n    \"法规名称\": \"财政部 人力资源社会保障部 中国人民银行关于进一步做好创业担保贷款工作的通知\",\n    \"法规文号\": \"财金〔2023〕18号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"创业担保贷款应用于借款人创业企业的生产经营活动，不得转借他人使用，不得用于购买股票、期货等有价证券和从事股本权益性投资，不得用于违反国家有关法律、法规的用途。\"\
    \n  },\n  {\n    \"法规名称\": \"个人贷款管理暂行办法\",\n    \"法规文号\": \"中国银行业监督管理委员会令2010年第2号\",\n    \"效力级别"
