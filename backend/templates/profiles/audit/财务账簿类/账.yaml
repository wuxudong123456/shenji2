name: audit/财务账簿类/账
type: model
description: 从财务账簿类类文档（账）中提取结构化元数据。涵盖字段如：费用化支出、资本化支出、项目进度。文档范围包括：研发支出辅助账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 项目
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 账
  member_count: 1
  member_details:
  - 研发支出辅助账
output:
  fields:
  - name: 费用化支出
    type: number
    description: 提取 费用化支出 的数值（含单位，如万元、吨等）
  - name: 资本化支出
    type: number
    description: 提取 资本化支出 的数值（含单位，如万元、吨等）
  - name: 项目进度
    type: string
    description: 提取 项目进度 的文本值
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: 企业会计政策文件.研发支出资本化条件(本期) != 上期资本化条件 && (研发支出辅助账.本期资本化金额增长率 > 同期研发投入增长率*2) && (董事会决议 IS NULL || 董事会决议.批准日期 > 政策变更生效日期)
    && 财务报表附注.会计政策变更说明 NOT LIKE '%研发支出资本化政策变更%'
  description: 若本期研发支出资本化条件放宽，导致资本化金额异常增长，且缺少董事会审批或审批滞后，未在附注中披露，则触发疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意调整研发费用资本化政策虚增资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"不得随意改变费用的确认标准或者计量方法，导致虚增资产、虚减费用。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第6号——无形资产\",\n    \"法规文号\": \"\
    财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条、第八条、第九条\",\n    \"内容概述\": \"企业内部研发项目研究阶段支出应当费用化，开发阶段支出满足条件方可资本化"
