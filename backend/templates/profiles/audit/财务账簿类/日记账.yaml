name: audit/财务账簿类/日记账
type: model
description: 从财务账簿类类文档（日记账）中提取结构化元数据。涵盖字段如：交易对方、付款摘要、凭证号、发生额、大额提现记录、对方科目、库存现金余额、摘要。文档范围包括：现金日记账、银行存款日记账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 付款
- 凭证
- 明细
- 金额
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 日记账
  member_count: 1
  member_details:
  - 现金日记账
  - 银行存款日记账
output:
  fields:
  - name: 交易对方
    type: string
    description: 提取 交易对方 的文本值
  - name: 付款摘要
    type: number
    description: 提取 付款摘要 的数值（含单位，如万元、吨等）
  - name: 凭证号
    type: string
    description: 提取 凭证号 的文本值
  - name: 发生额
    type: string
    description: 提取 发生额 的文本值
  - name: 大额提现记录
    type: string
    description: 提取 大额提现记录 的文本值
  - name: 对方科目
    type: string
    description: 提取 对方科目 的文本值
  - name: 库存现金余额
    type: number
    description: 提取 库存现金余额 的数值（含单位，如万元、吨等）
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 收款单位
    type: number
    description: 提取 收款单位 的数值（含单位，如万元、吨等）
  - name: 收款摘要
    type: number
    description: 提取 收款摘要 的数值（含单位，如万元、吨等）
  - name: 收款日期
    type: date
    description: 提取 收款日期 的日期值，格式 YYYY-MM-DD
  - name: 收费事项摘要
    type: number
    description: 提取 收费事项摘要 的数值（含单位，如万元、吨等）
  - name: 日期
    type: date
    description: 提取 日期 的日期值，格式 YYYY-MM-DD
  - name: 未达账项明细
    type: string
    description: 提取 未达账项明细 的文本值
  - name: 现金余额
    type: number
    description: 提取 现金余额 的数值（含单位，如万元、吨等）
  - name: 现金收入日期
    type: date
    description: 提取 现金收入日期 的日期值，格式 YYYY-MM-DD
  - name: 账面余额
    type: number
    description: 提取 账面余额 的数值（含单位，如万元、吨等）
  - name: 贷方金额
    type: number
    description: 提取 贷方金额 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 附注
    type: string
    description: 提取 附注 的文本值
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: (对现金日记账按日期排序，计算日期差：LEAD(现金日记账.日期) OVER (ORDER BY 现金日记账.日期) - 现金日记账.日期 > 1 工作日) OR (同日现金日记账记录笔数 < 同日会计凭证列表笔数
    AND 现金日记账.金额=多笔凭证合计)
  description: 若相邻两笔记录间隔超过1个工作日（排除节假日），说明未逐日登记；若同日有多笔业务而账簿合并为一笔且金额汇总，说明未逐笔登记。
  audit_item: 以未经审核的会计凭证为依据登记会计账簿或者会计账簿登记不符合规定
  suspicion: 日记账未逐日逐笔序时登记
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十条第（七）项\",\n    \"内容概述\": \"现金日记账和银行存款日记账必须逐日结出余额，并按照业务发生顺序逐笔登记，不得汇总登记。\"\n  }\n]"
- expression: (日记账.现金余额 - 盘点记录.实盘现金余额 < 0 && ABS(差异) > 2000 && 无书面说明) || (银行对账单.借贷方金额转账至个人账户 && 金额 > 50000 && 缺少对应业务合同) ||
    (明细台账.备用金 > 100000 && 长期未冲账且无实际库存现金)
  description: 突击盘点发现现金溢余且无合理解释，可能为公款私存。银行转账至个人账户大额无业务支撑，揭示公款被挪用或私存。备用金余额异常且无法盘实，疑为以备用金名义提取现金私存。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 私存私放财政资金或公款
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"单位和个人违反财务管理的规定，私存私放财政资金或者其他公款的，责令改正，调整有关会计账目，追回私存私放的资金，没收违法所得。对单位处3000元以上5万元以下的罚款；对直接负责的主管人员和其他直接责任人员处2000元以上2万元以下的罚款……\"\
    \n  }\n]"
- expression: ABS(日记账.账面余额 - 实盘现金余额.库存现金实存金额) > 0
  description: 现金日记账余额与盘点日调整后实存现金不一致，且无有效原始凭证或合理解释，即为账实不符。排除合理找零误差后差异不为零即触发。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 现金日记账余额与实际库存现金不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证会计账簿记录与实物及款项的实有数额相符。\"\n  }\n]"
- expression: 调节表.企业调节后余额 != 调节表.银行调节后余额
  description: 编制银行余额调节表后，若企业调整后余额与银行调整后余额不相等，说明存在记账差错、未达账项不实或挪用资金等情况，即为账实不符疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 银行存款日记账与银行对账单调节后余额不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证会计账簿记录与实物及款项的实有数额相符。\"\n  }\n]"
- expression: 补偿协议.资产重置补偿金额 > 0 AND ( (COALESCE(SUM(明细账.贷方金额) FILTER (WHERE 摘要 ~ '拆迁补偿'), 0) == 0 ) OR (SUM(明细账.金额) FILTER
    (WHERE 摘要 ~ '拆迁补偿') > 0) OR ( (补偿协议.资产重置补偿金额 - 明细账.账面净值 - 明细账.清理费用) > 0 AND (补偿协议.资产重置补偿金额 - 明细账.账面净值 - 明细账.清理费用) != COALESCE(SUM(明细账.贷方金额)
    FILTER (WHERE 摘要 ~ '拆迁补偿'), 0) ) )
  description: 拆迁补偿款中明确用于固定资产重置的部分，按规定应先冲减拆除资产的账面净值及清理费用，剩余净额应全部转入资本公积。若资本公积科目未增加该部分金额（增加额=0），或拆迁补偿款被全额或部分计入营业外收入，或实际转入资本公积的金额不等于应转净额（差异>0），均构成违规。
  audit_item: 未按规定核算所有者权益
  suspicion: 拆迁补偿款未按规定转增资本公积
  regulation: "[\n  {\n    \"法规名称\": \"企业财务通则\",\n    \"法规文号\": \"财政部令第41号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十九条\"\
    ,\n    \"内容概述\": \"企业收到政府从财政预算直接拨付的搬迁补偿款，应作为专项应付款处理。其中，属于对搬迁过程中固定资产进行重置的补偿部分，应将相应的补偿款转为资本公积，不得计入当期损益。\"\n  }\n]"
- expression: ((补助事由（灾害救助、奖励、研发等）.补助用途 LIKE '%建设%' OR '%设备%' OR '%购建%') AND 补助事由（灾害救助、奖励、研发等）.补助类型（与资产/收益相关） = '与收益相关' AND
    日记账.发生额 / 补助事由（灾害救助、奖励、研发等）.补助金额 > 0.5) OR ((补助事由（灾害救助、奖励、研发等）.补助用途 LIKE '%稳岗%' OR '%薪酬%' OR '%补偿日常成本%') AND 补助事由（灾害救助、奖励、研发等）.补助类型（与资产/收益相关）
    = '与资产相关' AND 会计凭证.贷方科目 > 0)
  description: 如果补助批文明确补助用于购建长期资产，企业却将其划分为与收益相关且直接计入当期损益，或补助用途为补偿人工等日常成本，却被划分为与资产相关并分期摊销，均构成分类错误。阈值设定为：资产相关补助错误归类为收益相关且超过50%金额已计入当期收益，或收益相关补助错误归类为资产相关且已确认递延收益。
  audit_item: 未按规定核算政府补助
  suspicion: 政府补助类型划分错误导致损益核算不当
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第16号——政府补助\",\n    \"法规文号\": \"财会[2017]15号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条、第九条\",\n    \"内容概述\": \"企业应当根据政府补助的性质和条件，合理区分与资产相关的政府补助和与收益相关的政府补助。与资产相关的政府补助，是指企业取得的、用于购建或以其他方式形成长期资产的政府补助。与收益相关的政府补助，是指除与资产相关的政府补助之外的政府补助。\"\
    \n  }\n]"
- expression: ((明细表.税收返还类型 = '增值税即征即退') AND (会计凭证.贷方科目 = '应交税费' OR 会计凭证.贷方科目包含'税金') AND (会计凭证.借方科目 = '银行存款') AND (明细账.发生额中未包含该笔金额))
    OR ((会计凭证.摘要 LIKE '%退税%' OR '%返还%') AND (明细账.账龄 > 365天) AND (明细表.已返金额 > 0))
  description: 增值税即征即退等税收返还应按规定确认为其他收益，但企业可能直接冲减应交税费科目，未确认损益；出口退税等款项可能错误挂账在其他应付款长期不结转。表达式检测：有税务返还银行收款，但会计处理贷方为税金冲减而非收益确认，则违规；或者税务返还长期挂账其他应付款超过一年，也属隐匿收益。
  audit_item: 未按规定核算政府补助
  suspicion: 税收返还资金未按规定确认为当期收益
  regulation: "[\n  {\n    \"法规名称\": \"增值税会计处理规定\",\n    \"法规文号\": \"财会[2016]22号\",\n    \"效力级别\": \"部门规范性文件\",\n    \"条款号\"\
    : \"二、账务处理（十）\",\n    \"内容概述\": \"增值税即征即退、先征后退等各项税收返还，应于收到时计入“其他收益”科目。\"\n  }\n]"
- expression: 行对账单.对方账户类型 = '个人' && 行对账单.交易金额 > 50000 && 行对账单.交易摘要不含'备用金' && 行对账单.对方账户名称 NOT IN (未纳入归集账户名单.备案账户名称)
  description: 当银行流水中出现单笔超过5万元资金流入个人账户，且该交易缺乏备用金等合法事由，同时该个人账户未经公司正式备案，则疑为公款私存。
  audit_item: 资金管理方面存在的问题
  suspicion: 公款以个人名义开立账户存储
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国商业银行法\",\n    \"法规文号\": \"主席令第34号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十八条\",\n    \"内容概述\": \"企业事业单位可以自主选择一家商业银行的营业场所开立一个办理日常转账结算和现金收付的基本存款账户，不得将单位资金以个人名义开立账户存储。\"\n  }\n]"
- expression: 日记账.贷方金额 > 50000 && (日记账.摘要为'采购款'或'工程款'或'劳务费'等对公业务) && (无对应合规大额现金支付审批单 || 支付金额审批单.支付事由明显不实)
  description: 超出企业现金使用限额，以现金支付大额对公款项，缺少真实审批手续，存在逃避监管、偷逃税款嫌疑。
  audit_item: 资金管理方面存在的问题
  suspicion: 违规大额现金支付
  regulation: "[\n  {\n    \"法规名称\": \"现金管理暂行条例\",\n    \"法规文号\": \"国务院令第12号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第五条、第六条\",\n    \"内容概述\": \"开户单位可以在下列范围内使用现金：职工工资、津贴；个人劳务报酬等。向个人收购农副产品和其他物资的价款等。超出规定范围、限额的支付应当通过开户银行进行转账结算。\"\n  }\n]"
