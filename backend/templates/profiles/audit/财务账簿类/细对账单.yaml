name: audit/财务账簿类/细对账单
type: model
description: 从财务账簿类类文档（细对账单）中提取结构化元数据。涵盖字段如：代发金额、到账日期。文档范围包括：银行代发明细对账单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 金额
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 细对账单
  member_count: 1
  member_details:
  - 银行代发明细对账单
output:
  fields:
  - name: 代发金额
    type: number
    description: 提取 代发金额 的数值（含单位，如万元、吨等）
  - name: 到账日期
    type: date
    description: 提取 到账日期 的日期值，格式 YYYY-MM-DD
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: DATEDIFF(发放对象身份证号、发放金额、发放日期、领取人身份证号、补贴项目名称、应发放日期、实际发放日期、受益人ID、待遇类型、应发金额、实发金额、发放年月.实际发放日期, 发放对象身份证号、发放金额、发放日期、领取人身份证号、补贴项目名称、应发放日期、实际发放日期、受益人ID、待遇类型、应发金额、实发金额、发放年月.应发放日期)
    > 政策规定发放时限阈值 && 延迟天数.原因说明 NOT LIKE '%不可抗力%' && 延迟天数.原因说明 NOT LIKE '%经批准%'
  description: 政策规定如低保金应于每月10日前发放到户，实际发放日期超过次月10日即为延迟。排除因不可抗力或经正式批准的系统升级、资金划拨延迟等合理理由，否则判定为违规延迟发放。
  audit_item: 未及时足额发放待遇
  suspicion: 社会保障待遇未按规定时限发放
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"低保金应当按月发放，于每月10日前发放到户。\"\n  }\n]"
- expression: (发放台账.接收总额 - 发放台账.发放总额 > 0) || (拨出日期、拨出金额、支出用途.拨入金额 - 拨出日期、拨出金额、支出用途.拨出金额 > 0) || (发放台账.受益人签收金额 < 应发标准金额)
  description: 接收总额大于发放总额，即存在资金或物资去向不明，未足额发放；专项资金中有部分被用于非救灾支出，说明存在挪用；个别受益人实收金额低于应发标准，可能存在截留。以上任一条件触发均指示违规。
  audit_item: 未及时足额发放待遇
  suspicion: 救灾款物被截留挪用未足额发放
  regulation: "[\n  {\n    \"法规名称\": \"自然灾害救助条例\",\n    \"法规文号\": \"国务院令第577号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十四条\",\n    \"内容概述\": \"自然灾害救助款物应当用于受灾人员的紧急转移安置、基本生活救助……不得截留、挪用。\"\n  }\n]"
