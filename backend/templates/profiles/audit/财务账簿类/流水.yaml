    : \"第五十六条\",\n    \"内容概述\": \"政府的全部收入应当上缴国家金库，任何部门、单位和个人不得截留、占用、挪用或者拖欠。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n\
    \    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"财政收入执收单位违反规定设立财政收入项目，擅自改变财政收入"
- expression: (亲属姓名.关联企业 IN (交易记录.交易对手方名称)) && (亲属姓名.关联企业 IN (交易记录.交易对手方名称)) && (合同协议类-销售合同-合同相对方 > 1000000 || 交易记录.付款条件 >
