name: audit/财务账簿类/流水
type: model
description: 从财务账簿类类文档（流水）中提取结构化元数据。涵盖字段如：专户资金余额、买入日期、交易对手、交易对手方名称、交易对方、交易对方户名、交易摘要、交易日期。文档范围包括：住房公积金银行账户资金流水、公务卡消费流水、农户收款银行流水、协会银行账户流水、国库支付流水、国有资产收入银行账户流水、基金账户银行流水、彩票资金银行账户流水、生活补助发放银行流水、经办人员银行账户流水等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 付款
- 明细
- 薪酬
- 金额
- 元数据提取
