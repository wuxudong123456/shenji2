    \    \"条款号\": \"第六条第四项\",\n    \"内容概述\": \"不得利用职权相互为对方及其配偶、子女和其他特定关系人从事营利性经营活动提供便利条件。\"\n  }\n]"
- expression: (离职人员利益往来登记表.利益输送企业名称 IN 关联企业及业务关系企业名录.关联企业名称) AND (离职人员利益往来登记表.发生日期 BETWEEN 离职人员利益往来登记表.离职日期 AND 离职人员利益往来登记表.离职日期+1095天)
    AND (离职人员利益往来登记表.金额 > 0) AND (关联交易明细台账.审批人 = 该离职人员) AND (关联交易明细台账.交易日期在离职前)
