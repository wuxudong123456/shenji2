violations:
- expression: (收费项目明细台账.收费项目名称 IN (行政事业性收费目录清单.收费项目名称) AND 收费项目明细台账.收费性质 = '经营服务性收费') OR (收费许可证.收费性质 = '经营服务性收费' AND 收费许可证.收费项目
    IN (行政事业性收费目录清单.收费项目名称) AND 经营服务性收费项目审批文件.批准文号 IS NULL AND 收费项目性质变更审批记录 IS NULL) OR (收费项目明细台账.收费项目名称 IN (行政事业性收费目录清单.收费项目名称)
    AND 银行账户入账流水.收款账户 NOT LIKE '%财政专户%')
  description: 表达式通过三组条件识别违规转性行为：(1)收费项目属于行政事业性收费目录却标记为经营服务性；(2)收费许可证显示经营服务性但无合法审批文件且无性质变更记录；(3)目录内收费收入未进入财政专户，表明资金被截留；触发任一即判定为疑点。
  audit_item: 不按照规定的预算级次、预算科目入库
  suspicion: 将行政事业性收费违规转为经营服务性收费管理
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于加强政府非税收入管理的通知\",\n    \"法规文号\": \"财综〔2004〕53号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二条第（一）项\",\n    \"内容概述\": \"行政事业性收费必须纳入财政管理，实行收支两条线，严禁将行政事业性收费转为经营服务性收费管理。\"\n  },\n  {\n    \"法规名称\":\
    \ \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第十八条\",\n    \"\
    内容概述\": \"收费项目"
- expression: 收费项目明细台账.收费项目名称 IN (国家明令取消的收费项目公告.取消项目名称) AND 收费项目明细台账.收费性质 = '经营服务性收费' AND 银行账户入账流水.摘要 LIKE CONCAT('%',收费项目明细台账.收费项目名称,'%')
    AND 银行账户入账流水.金额 > 0 AND 银行账户入账流水.交易日期 > 国家明令取消的收费项目公告.生效日期
  description: 表达式判定在取消生效后，仍以经营服务性名目对已取消项目收费且存在实际资金流入的行为。需同时满足：项目名称在已取消清单中、台账标注经营服务性、银行流水有对应收费记录且日期晚于取消日期。
  audit_item: 不按照规定的预算级次、预算科目入库
  suspicion: 将已取消的行政事业性收费转为经营服务性收费继续收取
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于取消、停征和免征一批行政事业性收费的通知\",\n    \"法规文号\": \"财税〔2014〕101号等系列文件\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条及附件\",\n    \"内容概述\": \"明确规定取消的收费项目不得以任何理由拖延或拒绝执行，不得以其他名目变相继续收取。\"\n  },\n  {\n    \"法规名称\"\
    : \"国务院办公厅关于进一步加强涉企收费管理减轻企业负担的通知\",\n    \"法规文号\": \"国办发〔2014〕30号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三部分\",\n\
    \    "
- expression: (下属单位会议费支出明细表.会议费支出摘要 LIKE '%上级会议%' || 会议费转嫁/分摊台账.分摊金额 > 0) && (下属单位/关联方会议费分摊协议.分摊方 IS NULL || 银行流水.用途 = '会议分摊费')
  description: 若下属单位账面出现与上级单位会议相关的费用支出，或无正式分摊协议但资金已划转，或分摊台账显示存在分摊行为，则判定为转嫁或摊派会议费。重点确认分摊是否经正式协议且合规，缺乏协议或资金流向明确为会议分摊费即构成违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 向下属机构、企事业单位、地方转嫁或摊派会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"会议费由召开单位承担，不得向参会人员收取，不得以任何方式向下属机构、企事业单位、地方转嫁或摊派。\"\n  }\n]"
- expression: (会议费报销明细表.参会人数 > 会议签到表.实际签到人数 * 1.2) || (SUM(会议费报销明细表.报销金额) - SUM(会议费预算编制与执行对比表.实际支出金额) > 0 && 银行流水.收款方 IN (虚假会议套取资金关联方资金流向表.关联方名称))
    || (会议费预算编制与执行对比表.结余金额 > 0 && 会议费报销明细表.实际支出明细（场地费、餐费、住宿费、资料费等） IS NULL)
  description: 通过虚报参会人数多申领费用、将会议结余资金转入关联方或个人账户、结余资金未退还财政等情形判定挪用、截留或侵占。人数虚报比例超过20%，或报销金额大于实际支出且收款方为关联方，或有结余但无退款记录均触发疑点。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 挪用、截留、侵占会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁各单位借会议名义组织会餐或安排宴请；严禁套取会议费设立‘小金库’；严禁在会议费中列支公务接待费。会议费支付应当严格按国库集中支付和公务卡管理规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\
    \n  }\n]"
- expression: （NOT EXISTS（会议签到表.会议名称 = 会议费报销明细表.会议名称）|| 会议签到表.实际签到人数 = 0 || 会议纪要.会议现场照片 IS NULL） && 会议费报销明细表.报销金额 > 5000 &&
    （银行流水.收款方 IN （虚假会议套取资金关联方资金流向表.关联方名称）|| 银行流水.用途摘要 IS NULL）
  description: 判断会议是否虚构：无签到记录或签到人数为0，或缺乏影像资料等实质性证明，且报销金额较大（如超过5000元），同时资金流向关联方或用途不明，视为虚列会议套取资金。重点关注报销后资金回流至经手人或关联账户的特征。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 虚列会议费套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有虚报、冒领等手段骗取财政资金的行为，将给予相应处理。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n  \
    \  \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁套取会议费设立‘小金库’；严禁在会议费中列支公务接待费等规"
- expression: 会议费结算方式统计表.现金金额占比 > 0 && (会议费结算方式统计表.现金金额占比 > 0.05 || 会议费报销明细表.金额 >= 1000)
  description: 根据规定，会议费应使用银行转账或公务卡结算，禁止现金方式。凡存在现金结算且现金总额占总费用比例超过5%，或单笔现金支付达到1000元及以上，均构成违规。特殊情况下确需现金支付的应提供书面说明，若无合理说明则判定违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 违规以现金方式结算会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"会议费支付，应当严格按照国库集中支付制度和公务卡管理制度的有关规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\n  }\n]"
- expression: (党员领导干部个人事项报告表.填报的经商办企业情况 IS NULL OR 党员领导干部个人事项报告表.投资企业名称 NOT CONTAINS 企业名称) AND (工商注册登记信息.股东/发起人姓名及身份证号 = 领导干部身份证号
    OR 工商注册登记信息.法定代表人姓名及身份证号 = 领导干部身份证号) AND (工商注册登记信息.出资比例 > 0) AND (工商注册登记信息.企业状态 = '存续')
  description: 依据个人报告表与工商登记信息比对，如果领导干部未在报告表中申报任何经商办企业记录，但在工商注册登记中直接登记为股东或法定代表人且持股比例大于0，则视为违反规定个人独资或与他人合资合股经商办企业。同时排除企业已注销等状态。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 个人独资或与他人合资合股经办企业
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（一）项\",\n    \"内容概述\": \"违反有关规定从事营利活动，经商办企业的，视情节给予警告直至开除党籍处分。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n\
    \    \"法规文号\": \"主席令第二十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十九条第十六项\",\n    \"内容概述\": \"公务员不得违反有关规定从事或者参与营利性活动，在企业或者其他"
- expression: (企业股东及股权变更记录.受让方姓名 IN 领导干部直系亲属及特定关系人名单.亲属姓名) && (企业股东及股权变更记录.转让价格 < 企业净资产负债比例对应股权价值*0.7 OR 企业股东及股权变更记录.转让价格为0
    OR 企业股东及股权变更记录.转让方与受让方为无对价转让) && (银行账户流水.付款方==领导干部 OR 银行账户流水.付款方==领导干部配偶 && 银行账户流水.资金用途 CONTAINS '投资款' OR '股权款') && 党员领导干部个人有关事项报告表.未填报该亲属名下的企业投资
  description: 筛选股权变更记录中受让方为领导干部直系亲属或特定关系人，且转让价格明显低于公允价值（低于70%）甚至无偿转让，同时存在领导干部或其配偶账户向原股东或亲属支付大额款项的痕迹，并且领导干部未在个人事项报告中申报亲属的该笔投资。表达式考虑了代持行为核心特征：低价转让、资金来源于领导干部、未如实申报。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 以他人名义入股形式经办企业
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（一）项、第（二）项\",\n    \"内容概述\": \"违反规定从事营利活动，经商办企业，或者拥有非上市公司（企业）的股份或者证券的，给予相应处分。以他人名义持股仍属违规。\"\n  },\n  {\n   \
    \ \"法规名称\": \"关于领导干部报告个人有关事项的规定\",\n    \"法规文号\": \"中办发〔2017〕12号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第四条\",\n\
    \    \"内容概"
- expression: (聘用协议文件.甲乙双方名称及签章 CONTAINS 领导干部姓名 OR 聘用协议文件.甲乙双方名称及签章 CONTAINS 领导干部化名) && (党员领导干部个人事项报告表.兼职取酬情况 IS NULL OR 党员领导干部个人事项报告表.承包租赁经营活动申报
    IS NULL) && (银行账户流水.交易金额 == 聘用协议文件.酬金/租金金额及支付方式 OR 银行账户流水.交易金额 累计超过 5000元/月) && (银行账户流水.资金用途（顾问费/租金/承包费） IN ['顾问费','租赁费','承包费','咨询费'])
    && (单位考勤记录.请假记录 IS NOT NULL OR 单位
  description: 当存在承包、租赁、聘用协议文件且协议乙方为领导干部本人或其化名，但个人事项报告表未申报该项兼职或经营活动，同时银行流水显示有规律性金额转账（累计月均超5000元作为参考阈值）且备注为经营类款项，并辅以考勤异常，则判定为私自从事经营活动。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 私自以承包、租赁、受聘等方式从事经营活动
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（五）项、第（六）项\",\n    \"内容概述\": \"违反有关规定从事营利活动，有下列行为之一的：（五）违规在经济组织、社会组织等单位中兼职，或者经批准兼职但获取薪酬、奖金、津贴等额外利益；（六）利用参与企业重组改制、定向增发、兼并投资等工作中掌握的信息买卖股票，或者以其他方式非正常获利。私自承包、租赁、受聘属于违规兼职或从事营利活动。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国公务员"
- expression: 报销凭证.支付方式 = '现金' && 报销凭证.报销金额 >= 公务卡强制结算目录.结算起点金额 && 报销凭证.附件完整性 NOT CONTAIN '特殊事项审批单'
  description: 依据当地公务卡强制结算目录，单笔支出达到起点金额（通常500元或1000元）必须使用公务卡，以现金支付且无经批准的例外说明，即认定为违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务接待费用未使用公务卡结算
  regulation: "[\n  {\n    \"法规名称\": \"关于实施中央预算单位公务卡强制结算目录的通知\",\n    \"法规文号\": \"财库〔2011〕160号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"一、二\",\n    \"内容概述\": \"中央预算单位财政授权支付业务中原使用现金结算的公务支出，应按规定使用公务卡结算；凡目录规定的公务支出项目，应使用公务卡结算，原则上不再使用现金。\"\n\
    \  }\n]"
- expression: (非税收入收支明细账.支出摘要 包含 “餐费”“接待费”“酒店消费”) && (收款方为餐饮或酒店) && (该笔非税收入未见同步上缴财政的缴库凭证) && (该笔支出未在单位公务接待费明细账中反映)
