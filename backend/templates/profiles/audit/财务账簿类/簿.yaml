violations:
- expression: (会计凭证列表 LEFT JOIN 会计凭证审核记录表 ON 会计凭证列表.凭证编号 = 会计凭证审核记录表.凭证编号 LEFT JOIN 会计账簿 ON 会计凭证列表.凭证编号 = 会计账簿.凭证编号) WHERE
    (会计凭证审核记录表.审核结果 IS NULL OR 会计凭证审核记录表.审核时间 >= 会计账簿.账簿登记日期) AND 会计凭证列表.凭证编号 IN (SELECT 凭证编号 FROM 会计账簿)
  description: 凭证审核记录表中无对应凭证的审核通过记录，或审核时间晚于或等于账簿登记日期，表明凭证未经审核即入账。
  audit_item: 以未经审核的会计凭证为依据登记会计账簿或者会计账簿登记不符合规定
  suspicion: 以未经审核会计凭证登记账簿
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十条\",\n    \"内容概述\": \"会计人员应当根据审核无误的会计凭证登记会计账簿。\"\n  }\n]"
- expression: 会计账簿.页码编号 - LAG(会计账簿.页码编号) OVER (ORDER BY 会计账簿.页码编号) != 1 AND (会计账簿.页面状态 IS NULL OR 会计账簿.页面状态 NOT LIKE '%此页空白%')
    AND (会计账簿.更正人签章 IS NULL OR 会计账簿.更正人签章 = '') AND (会计账簿.会计主管签章 IS NULL OR 会计账簿.会计主管签章 = '')
  description: 检查页码连续性，若出现跳号且未按规定划线注销并签章，即为违规。
  audit_item: 以未经审核的会计凭证为依据登记会计账簿或者会计账簿登记不符合规定
  suspicion: 账簿页码未按顺序连续登记
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十条第（六）项\",\n    \"内容概述\": \"各种账簿按页次顺序连续登记，不得跳行、隔页。发生跳行、隔页，应当将空行、空页划线注销或注明‘此行空白’‘此页空白’字样，并由记账人员签名或者盖章。\"\n  }\n]"
- expression: (会计账簿.更正方法 NOT IN ('划线更正法', '红字冲销法', '补充登记法')) OR (会计账簿.更正人签章 IS NULL) OR (会计账簿.会计主管签章 IS NULL)
  description: 若更正采用涂改、刮擦、删除或未留下可辨认原有字迹，或更正处无记账人员及会计主管盖章，均为违规。
  audit_item: 以未经审核的会计凭证为依据登记会计账簿或者会计账簿登记不符合规定
  suspicion: 账簿更正方法不合规或签章缺失
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十二条\",\n    \"内容概述\": \"账簿记录发生错误，不准涂改、挖补、刮擦或者用药水消除字迹，不准重新抄写，必须按照规定方法更正；登记账簿时发生错误，应当将错误的文字或数字划红线注销，并使原有字迹仍可辨认，由记账人员在更正处盖章。\"\
    \n  }\n]"
- expression: 对应团组编号.会计科目代码 NOT LIKE '出国经费类编码%' AND (对应团组编号.摘要 LIKE '%出国%' OR 对应团组编号.摘要 LIKE '%境外%' OR 对应团组编号.摘要 LIKE '%国际%'
    OR 对应团组编号.对应团组编号 IS NOT NULL) AND 对应团组编号.会计科目代码 NOT IN (SELECT 预算项目名称（通常为出国费类款项） FROM 预算项目名称（通常为出国费类款项） WHERE 预算项目名称 LIKE
    '%出国%')
  description: 设定出国经费类科目编码前缀（如30212），筛查摘要明确含有出国、境外等字段，或明确关联了出国团组编号的报销记录。当这些报销记录的会计科目并非出国经费专用科目，且该科目也不在年初预算的出国经费项目列表中时，判定为在非预算渠道列支。需关注通过‘培训费’、‘其他商品和服务支出’、‘项目支出’等科目列支的情况。
  audit_item: 未按规定编制因公出国（境）经费预算
  suspicion: 使用非出国经费专用科目列支出国费用
  regulation: "[\n  {\n    \"法规名称\": \"《因公临时出国经费管理办法》\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"因公临时出国经费应当全部纳入预算管理，不得超预算或无预算安排团组出访。各单位应当加强因公临时出国经费的预算管理，严格控制因公临时出国经费总额。\"\n  },\n  {\n\
    \    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十二条\",\n\
    \    \"内容"
- expression: (SUM(簿.金额) - SUM(明细表.入账金额) > 0) || (行对账单.借贷方金额 WHERE 交易对手非官方备案账户 - 分类账.本期发生额 > 0 && 行对账单.借贷方金额 > 100000)
  description: 收入票据存根金额大于账面确认的收入，表明部分收入未入账，可能在账外核算。银行对账单出现单位未记录的收款，且收款账户未经备案，提示存在账外资金循环，大额（>10万元）风险更高。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 未在法定账簿统一登记核算经济业务
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十四号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十六条\",\n    \"内容概述\": \"各单位发生的各项经济业务事项应当在依法设置的会计账簿上统一登记、核算，不得违反本法和国家统一的会计制度的规定私设会计账簿登记、核算。\"\n  }\n]"
- expression: (票据存根.收费项目 NOT IN 合法收费项目清单及标准.批准收费项目) || (票据存根.金额 > 合法收费项目清单及标准.计费标准及收费依据*数量) || (SUM(票据存根.金额) - SUM(明细表.金额)
    > 0 && 收款银行账户非单位零余额账户或汇缴专户)
  description: 擅自设立收费项目或超标准收费，且收入未缴入法定账户，即构成违规收费账外存放。票据存根中未经批准的项目、超标准收费的差额，均指向账外资金。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 违规收费罚款摊派资金账外存放
  regulation: "[\n  {\n    \"法规名称\": \"违反行政事业性收费和罚没收入收支两条线管理规定行政处分暂行规定\",\n    \"法规文号\": \"国务院令第281号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"对违反规定擅自设立行政事业性收费项目或者设置罚没处罚的，对直接负责的主管人员和其他直接责任人员给予降级或者撤职处分。违反规定，将行政事业性收费、罚没收入截留、挪用、坐收坐支的，给予记大过处分；情节严重的，给予降级或者撤职处分。\"\
    \n  }\n]"
- expression: (SUM(票据存根.金额) - SUM(明细表.金额) > 0) || (银行对账单.借贷方金额 WHERE 摘要为货款/服务费等 - SUM(银行对账单.借贷方金额) > 0 && 差异 > 5000) || (经济合同.合同金额及收款条款
    - 经济合同.合同金额 > 0 && 对应票据已开但未入账)
  description: 票据存根、银行流水、合同等外部证据显示的应入账收入大于账面实际确认的收入，说明收入被截留。阈值5千元筛选实质性差异。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 收入不入账形成账外资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十四号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"公司、企业进行会计核算不得有下列行为：虚列或者隐瞒收入，推迟或者提前确认收入。\"\n  }\n]"
- expression: 部门/单位发布的预算绩效管理制度文件.文件存在性 = '不存在' || 部门/单位发布的预算绩效管理制度文件.发布日期 IS NULL
