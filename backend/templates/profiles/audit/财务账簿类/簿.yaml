name: audit/财务账簿类/簿
type: model
description: 从财务账簿类类文档（簿）中提取结构化元数据。涵盖字段如：专项基金科目、会计主管签章、会计科目、使用人签字、使用日期、借方科目、借方金额、入账日期。文档范围包括：企业会计账簿、企业财务账簿、会计账簿、住房公积金会计账簿、其它项目相关账簿、农业保险保费补贴会计账簿、医学证明开具登记簿、单位财务账簿、土地出让收益科目会计账簿、收入票据领用登记簿等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 凭证
- 审批
- 明细
- 金额
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
