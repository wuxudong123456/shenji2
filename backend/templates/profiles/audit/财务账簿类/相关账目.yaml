name: audit/财务账簿类/相关账目
type: model
description: 从财务账簿类类文档（相关账目）中提取结构化元数据。涵盖字段如：其他融资凭证、县级垫付资金规模、垫付时间。文档范围包括：县级财政相关账目等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 凭证
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 相关账目
  member_count: 1
  member_details:
  - 县级财政相关账目
output:
  fields:
  - name: 其他融资凭证
    type: string
    description: 提取 其他融资凭证 的文本值
  - name: 县级垫付资金规模
    type: string
    description: 提取 县级垫付资金规模 的文本值
  - name: 垫付时间
    type: date
    description: 提取 垫付时间 的日期值，格式 YYYY-MM-DD
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: (SUM(C, S, X)/SUM(T) < 0.6) || (P_pay_date > P_due_date && M_pay_date < P_pay_date)
  description: 计算省级财政投入占项目总投入的比例，若低于省级政府应承担的主要支出责任比例（如政策要求60%，阈值可配置）则判定为违规。同时，检查省级资金拨付时间戳，若省级资金实时拨付日期晚于合同约定的应到位日期，而县级资金拨付日期早于省级，表明存在要求县级先行垫付或虚假配套风险。
  audit_item: 高标农田建设资金保障不到位
  suspicion: 省级财政高标准农田建设配套资金到位不足
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\",\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\"\
    : \"行政法规\",\n    \"条款号\": \"第三条第（七）款\",\n    \"内容概述\": \"建立健全高标准农田建设投入保障机制，省级政府应当承担地方投入主要责任。\"\n  }\n]"
