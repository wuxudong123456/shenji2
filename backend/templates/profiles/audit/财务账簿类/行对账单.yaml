name: audit/财务账簿类/行对账单
type: model
description: 从财务账簿类类文档（行对账单）中提取结构化元数据。涵盖字段如：专户期末余额、交易对手、交易对手方名称、交易对方、交易对方名称、交易摘要、交易日期、交易时间。文档范围包括：专项账户银行对账单、保证金专户银行对账单、债券资金专项账户银行对账单、维修资金专户银行对账单、被审计单位银行对账单、财务系统公积金专户银行对账单、银行对账单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 付款
- 金额
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 行对账单
  member_count: 1
  member_details:
  - 专项账户银行对账单
  - 保证金专户银行对账单
  - 债券资金专项账户银行对账单
  - 维修资金专户银行对账单
  - 被审计单位银行对账单
  - 财务系统公积金专户银行对账单
  - 银行对账单
