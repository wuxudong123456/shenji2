name: audit/财务账簿类/户对账单
type: model
description: 从财务账簿类类文档（户对账单）中提取结构化元数据。涵盖字段如：交易对手账户、交易摘要、交易日期、交易时间、交易金额、付款账户、借贷方金额、入账日期。文档范围包括：住房公积金银行账户对账单、彩票资金银行账户对账单、维修资金专户对账单、银行专户对账单、银行账户对账单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 付款
- 金额
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 户对账单
  member_count: 1
  member_details:
  - 住房公积金银行账户对账单
  - 彩票资金银行账户对账单
  - 维修资金专户对账单
  - 银行专户对账单
  - 银行账户对账单
output:
  fields:
  - name: 交易对手账户
    type: string
    description: 提取 交易对手账户 的文本值
  - name: 交易摘要
    type: string
    description: 提取 交易摘要 的文本值
  - name: 交易日期
    type: date
    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 交易时间
    type: date
    description: 提取 交易时间 的日期值，格式 YYYY-MM-DD
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款账户
    type: number
    description: 提取 付款账户 的数值（含单位，如万元、吨等）
  - name: 借贷方金额
    type: number
    description: 提取 借贷方金额 的数值（含单位，如万元、吨等）
  - name: 入账日期
    type: date
    description: 提取 入账日期 的日期值，格式 YYYY-MM-DD
  - name: 入账金额
    type: number
    description: 提取 入账金额 的数值（含单位，如万元、吨等）
  - name: 实际划款日期
    type: date
    description: 提取 实际划款日期 的日期值，格式 YYYY-MM-DD
  - name: 对方户名
    type: string
    description: 提取 对方户名 的文本值
  - name: 对方账号
    type: string
    description: 提取 对方账号 的文本值
  - name: 对方账户名称
    type: string
    description: 提取 对方账户名称 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 收款方名称
    type: number
    description: 提取 收款方名称 的数值（含单位，如万元、吨等）
  - name: 收款账号
    type: number
    description: 提取 收款账号 的数值（含单位，如万元、吨等）
  - name: 质押冻结记录
    type: string
    description: 提取 质押冻结记录 的文本值
  - name: 质押解冻交易
    type: string
    description: 提取 质押解冻交易 的文本值
  - name: 资金划出日期
    type: date
    description: 提取 资金划出日期 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 银行内部备注
    type: string
    description: 提取 银行内部备注 的文本值
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: (对照表.实际上缴日期 > 对照表.规定上缴截止日期) && (结余金额 > 0) && (上缴状态 == '已上缴')
  description: 结余资金确认后，单位应在制度规定时限内（如15个工作日内）将资金上缴国库。当实际上缴日期晚于规定截止日期，且上缴凭证显示已上缴时，判定为上缴不及时。若上缴状态为空或未上缴，则合并其他疑点（如未清理、未上报）。
  audit_item: 结余资金管理不规范
  suspicion: 结余资金未及时上缴国库
  regulation: "[\n  {\n    \"法规名称\": \"中央部门财政拨款结转和结余资金管理办法\",\n    \"法规文号\": \"财预〔2015〕82号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十五条\",\n    \"内容概述\": \"经财政部确认的结余资金，中央部门应在收到确认文件后15个工作日内上缴中央国库。\"\n  }\n]"
- expression: (明细表.收款方账号 NOT IN 协议文件.合同约定收款账号) || (明细表.交易类型 == '个人账户') || (明细表.金额 > 50000 && 同一账户月转出次数 > 3)
  description: 判定逻辑：当资金收款方与备案合同施工单位账号不一致，或收款方为个人账户，或单笔支出超5万元且对应账户月转出超3次，视为可疑。上述条件任一满足即触发疑点。
  audit_item: 挪用住宅专项维修资金
  suspicion: 维修资金划转至非施工单位或个人账户
  regulation: "[\n  {\n    \"法规名称\": \"《住宅专项维修资金管理办法》\",\n    \"法规文号\": \"建设部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"住宅专项维修资金应当专项用于住宅共用部位、共用设施设备保修期满后的维修和更新、改造，不得挪作他用。\"\n  }\n]"
- expression: 清册.缴费日期 < 分户账.入账日期 - 30天 || ABS(清册.缴费金额 - 分户账.入账金额) > 0.01
  description: 业主缴费30日后仍未在专户银行流水中体现同等金额入账，或某期间内实收总额与存入专户总额存在差异，即视为截留或延迟归集。30天为参考阈值，可依据地方细则调整。
  audit_item: 挪用住宅专项维修资金
  suspicion: 代收机构延迟归集或截留业主缴纳的维修资金
  regulation: "[\n  {\n    \"法规名称\": \"《住宅专项维修资金管理办法》\",\n    \"法规文号\": \"建设部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"商品住宅的业主应当在办理房屋入住手续前，将首期住宅专项维修资金存入住宅专项维修资金专户。已售公有住房的售房单位应当在办理房屋产权登记前，将首期住宅专项维修资金存入住宅专项维修资金专户。代收单位应当在规定期限内将代收的维修资金存入专户。\"\
    \n  }\n]"
- expression: (追踪表.资金去向类别 IS NULL OR 追踪表.资金去向类别 NOT IN ('提取','贷款','购买国债','上划上级')) AND (追踪表.收款方名称 IN (登记表.关联方名称) OR 付款账户.交易摘要
    NOT LIKE '%提取%' AND NOT LIKE '%贷款%' AND NOT LIKE '%国债%' AND NOT LIKE '%上划%') AND 付款账户.交易金额 > 100000
  description: 筛查资金去向不明或收款方为非业务合作对象且与关联方有关的支出，排除因上划上级、购买国债等合规用途。设定大额阈值10万元作为初步疑点，小额可疑需结合频次分析。
  audit_item: 挪用住房公积金
  suspicion: 直接挪用住房公积金至非业务关联账户
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十一条\",\n    \"内容概述\": \"住房公积金管理中心违反本条例规定，挪用住房公积金的，追回挪用的住房公积金；有违法所得的，没收违法所得，并入住房公积金；构成犯罪的，依法追究刑事责任；尚不构成犯罪的，对直接负责的主管人员和其他直接责任人员依法给予行政处分。\"\
    \n  }\n]"
- expression: 存在交易A（借方，金额=M，日期=T1）和交易B（贷方，金额≈M，日期=T2）满足 T1 < 明细表.上划上级账户日期 < T2，且 T2 - T1 <= 10天，且 M > 1000000，且 付款账户.摘要 NOT
    LIKE '%上划%'，且 付款账户.转入账户非上级住房公积金专户
  description: 在归集完成至上划上级之间的时间窗口，若有大额资金转出，且短期内等额转回，差值小于1%，且转回时间在上划日之后，则涉嫌短期挪用。设定金额阈值100万元，间隔不超过10天。
  audit_item: 挪用住房公积金
  suspicion: 利用住房公积金归集与上划时间差挪用资金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十一条\",\n    \"内容概述\": \"挪用住房公积金的，追回挪用的住房公积金；有违法所得的，没收违法所得；构成犯罪的，依法追究刑事责任；尚不构成犯罪的，给予行政处分。\"\n  }\n]"
- expression: 交易摘要 LIKE '%质押%' OR 交易摘要 LIKE '%担保%' OR 质押冻结记录 = '质押' OR 检查发现的问题描述 = '外部报告指出存在违规担保'
  description: 条例明确禁止公积金管理中心为他人提供担保。若银行流水中出现质押或担保标记，或外部监管报告指出问题，不论金额大小，直接判定违规。
  audit_item: 挪用住房公积金
  suspicion: 违规使用住房公积金存款为第三方提供质押担保
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十八条第二款\",\n    \"内容概述\": \"住房公积金管理中心不得向他人提供担保。\"\n  }\n]"
- expression: (审批文件.审批日期 > 户对账单.实际划款日期) OR (审批文件.审批权限级别 IS NULL OR 审批文件.审批权限级别 < 授权记录.授权金额上限) OR (审批文件.审批人不在授权记录.授权人中)
  description: 审批日期晚于资金实际划出日期（倒签审批），或审批人无相应金额审批权限（越权），或审批人未被授权，均属违规。
  audit_item: 挪用住房公积金
  suspicion: 住房公积金资金调拨审批流程违规
  regulation: "[\n  {\n    \"法规名称\": \"行政事业单位内部控制规范（试行）\",\n    \"法规文号\": \"财会[2012]21号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"单位应当建立健全授权批准控制制度，明确各岗位办理业务和事项的权限范围、审批程序和相应责任。\"\n  }\n]"
