name: audit/财务账簿类/分类账
type: model
description: 从财务账簿类类文档（分类账）中提取结构化元数据。涵盖字段如：余额、内部往来科目发生额、发生额及余额、固定资产、固定资产科目余额、无形资产等科目、期末余额、本期发生额。文档范围包括：总分类账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 资产
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 分类账
  member_count: 1
  member_details:
  - 总分类账
output:
  fields:
  - name: 余额
    type: number
    description: 提取 余额 的数值（含单位，如万元、吨等）
  - name: 内部往来科目发生额
    type: string
    description: 提取 内部往来科目发生额 的文本值
  - name: 发生额及余额
    type: number
    description: 提取 发生额及余额 的数值（含单位，如万元、吨等）
  - name: 固定资产
    type: string
    description: 提取 固定资产 的文本值
  - name: 固定资产科目余额
    type: number
    description: 提取 固定资产科目余额 的数值（含单位，如万元、吨等）
  - name: 无形资产等科目
    type: string
    description: 提取 无形资产等科目 的文本值
  - name: 期末余额
    type: number
    description: 提取 期末余额 的数值（含单位，如万元、吨等）
  - name: 本期发生额
    type: string
    description: 提取 本期发生额 的文本值
  - name: 科目名称
    type: string
    description: 提取 科目名称 的文本值
  - name: 科目设置
    type: string
    description: 提取 科目设置 的文本值
  - name: 累计折旧科目余额
    type: number
    description: 提取 累计折旧科目余额 的数值（含单位，如万元、吨等）
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: (SUM(簿.金额) - SUM(明细表.入账金额) > 0) || (行对账单.借贷方金额 WHERE 交易对手非官方备案账户 - 分类账.本期发生额 > 0 && 行对账单.借贷方金额 > 100000)
  description: 收入票据存根金额大于账面确认的收入，表明部分收入未入账，可能在账外核算。银行对账单出现单位未记录的收款，且收款账户未经备案，提示存在账外资金循环，大额（>10万元）风险更高。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 未在法定账簿统一登记核算经济业务
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十四号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十六条\",\n    \"内容概述\": \"各单位发生的各项经济业务事项应当在依法设置的会计账簿上统一登记、核算，不得违反本法和国家统一的会计制度的规定私设会计账簿登记、核算。\"\n  }\n]"
- expression: (记录表.划拨金额 - (明细台账.本期发生额 + 本期发生额) != 0) || (行对账单.大额转出金额 > 100000 && 摘要为“借款” && 对方户名为下级/上级单位 && (ABS(明细台账.期末余额)
    > 0 && 挂账时长 > 365))
  description: 内部划拨记录与双方往来账不勾稽，表明部分资金运动未入账。上级以借款名义转至下级单位长期不还，实为转移资金另存他用，形成账外资产。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 上下级单位间资金转移未统一核算
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得……（二）截留、挪用财政资金；（三）滞留应当下拨的财政资金……\"\
    \n  }\n]"
- expression: (盘点记录.实盘数量 - 存货台账.入账原值 > 0) || (经济合同.合同金额 > 10000 && 存货台账.资产编码 IS NULL) || (盘点记录.处置审批及处置收入 > 0 && 分类账.发生额及余额)
  description: 实物盘点超出台账数量，或依据采购合同、付款记录证实有资产购入但台账未登记，均为账外资产。处置资产收益未入账，可能形成新的账外资金或私分。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 存在账外资产未纳入统一核算
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十条\",\n    \"内容概述\": \"各部门及其所属单位应当对下列资产及时予以报废、报损：……资产的处置收入、收益等，应当按照政府非税收入和国库集中收缴制度的有关规定上缴……\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十四号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\"\
    : \""
- expression: 记账凭证.金额 != 明细分类账.金额
  description: 抽取的记账凭证金额与账簿中过账金额不一致，且无有效的会计调整分录更正说明，即为账证不符。任何凭证金额与过账金额的差异均触发疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 记账凭证金额与账簿记录金额不一致
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计凭证进行核对，保证会计账簿记录与会计凭证的有关内容相符。\"\n  }\n]"
- expression: 本期发生额、余额、科目名称、期末余额、固定资产科目余额、累计折旧科目余额、科目设置、发生额及余额、内部往来科目发生额、固定资产、无形资产等科目.期末余额 != SUM(明细分类账.各明细期末余额合计)
  description: 总账科目余额与其所属明细账余额合计数不相等，且无有效的重分类调整支持，即为账账不符疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 总账与明细账期末余额不一致
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期核对会计账簿之间相对应的记录，保证会计账簿之间相对应的记录相符。\"\n  }\n]"
- expression: 资产负债表.固定资产净值 != (分类账.固定资产科目余额 - 分类账.累计折旧科目余额)
  description: 资产负债表固定资产项目应按扣除累计折旧及减值准备后的净额列示，与总账直接计算的结果不相等，则表明存在少提折旧、重分类错误或资产虚报。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 资产负债表固定资产项目金额与总账余额不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计报表进行核对，保证会计账簿记录与会计报表的有关内容相符。\"\n  }\n]"
