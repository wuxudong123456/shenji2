name: audit/财务账簿类/明细分类账
type: model
description: 从财务账簿类类文档（明细分类账）中提取结构化元数据。涵盖字段如：内部往来科目发生额、去向、发生额及余额、各明细期末余额合计、固定资产、摘要、支出类别、支出项目。文档范围包括：明细分类账、补助资金收支明细分类账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 财务账簿类
- 审计
- 明细
- 资产
- 金额
- 项目
- 元数据提取
template_class:
  category: 财务账簿类
  member_types:
  - 明细分类账
  member_count: 1
  member_details:
  - 明细分类账
  - 补助资金收支明细分类账
output:
  fields:
  - name: 内部往来科目发生额
    type: string
    description: 提取 内部往来科目发生额 的文本值
  - name: 去向
    type: string
    description: 提取 去向 的文本值
  - name: 发生额及余额
    type: number
    description: 提取 发生额及余额 的数值（含单位，如万元、吨等）
  - name: 各明细期末余额合计
    type: number
    description: 提取 各明细期末余额合计 的数值（含单位，如万元、吨等）
  - name: 固定资产
    type: string
    description: 提取 固定资产 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 支出类别
    type: number
    description: 提取 支出类别 的数值（含单位，如万元、吨等）
  - name: 支出项目
    type: number
    description: 提取 支出项目 的数值（含单位，如万元、吨等）
  - name: 收款方
    type: number
    description: 提取 收款方 的数值（含单位，如万元、吨等）
  - name: 无形资产等科目
    type: string
    description: 提取 无形资产等科目 的文本值
  - name: 用途
    type: string
    description: 提取 用途 的文本值
  - name: 科目名称
    type: string
    description: 提取 科目名称 的文本值
  - name: 科目设置
    type: string
    description: 提取 科目设置 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
violations:
- expression: 记账凭证.金额 != 明细分类账.金额
  description: 抽取的记账凭证金额与账簿中过账金额不一致，且无有效的会计调整分录更正说明，即为账证不符。任何凭证金额与过账金额的差异均触发疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 记账凭证金额与账簿记录金额不一致
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计凭证进行核对，保证会计账簿记录与会计凭证的有关内容相符。\"\n  }\n]"
- expression: 记账凭证.摘要内容 != 记账凭证.会计科目
  description: 当摘要描述的经济业务与入账科目按企业会计政策明显不符，如广告费计入办公费，且无合理解释，即判定为分类错误，疑点成立。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 会计凭证摘要与账簿科目归类不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计凭证进行核对，保证会计账簿记录与会计凭证的有关内容相符。\"\n  }\n]"
- expression: 本期发生额、余额、科目名称、期末余额、固定资产科目余额、累计折旧科目余额、科目设置、发生额及余额、内部往来科目发生额、固定资产、无形资产等科目.期末余额 != SUM(明细分类账.各明细期末余额合计)
  description: 总账科目余额与其所属明细账余额合计数不相等，且无有效的重分类调整支持，即为账账不符疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 总账与明细账期末余额不一致
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期核对会计账簿之间相对应的记录，保证会计账簿之间相对应的记录相符。\"\n  }\n]"
- expression: ((明细表.发放月份 > 汇总表.异动日期) && (汇总表.异动类型 IN ('转学','休学','毕业','辍学')) && (明细表.发放金额 > 0)) || (SUM(明细表.发放天数) - SUM(记录表.考勤状态)
    > 3 && 明细表.发放金额 > 0)
  description: 存在补助发放月份晚于学籍异动生效日期且异动类型为离校的，直接判定违规；或者同一学生某月累计发放天数比实际出勤天数多3天以上（预留标准内请假等合理区间），视为虚报在校天数套取资金。
  audit_item: 违反农村义务教育学生营养改善计划相关规定的行为
  suspicion: 虚报学生人数及在校天数套取营养膳食补助资金
  regulation: "[\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划专项资金管理办法\",\n    \"法规文号\": \"财教〔2021〕174号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"各级财政部门应会同教育部门加强营养改善计划补助资金的监督管理，定期或不定期开展监督检查。发现虚报、冒领、套取等行为，按照有关规定处理。\"\n  }\n\
    ]"
- expression: (拨付凭证.实拨付金额 < 拨付凭证.应拨付金额) || (明细分类账.支出类别 NOT IN ('食材采购','食堂设备','水电燃料','食堂人员工资') && 明细分类账.金额 > 10000 && 明细分类账.收款方非食材供应商)
    || (其他.公用经费支出 < 拨付凭证.到账日期 * 0.85)
  description: 财政拨付金额未足额到账判定为拖欠；补助资金用于非食堂直接相关支出且单笔超1万元且流向非供应商账户，判定挤占挪用；全校年度营养餐实际支出不足拨付金额85%的，疑为部分资金被挤占或变相挪用。
  audit_item: 违反农村义务教育学生营养改善计划相关规定的行为
  suspicion: 拖欠、挤占、挪用营养膳食补助资金
  regulation: "[\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划专项资金管理办法\",\n    \"法规文号\": \"财教〔2021〕174号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"营养改善计划补助资金应足额用于为农村义务教育阶段学生提供营养膳食补助，不得以任何理由挤占、截留、挪用。\"\n  }\n]"
- expression: 明细表.发放月份 > 汇总表.异动日期 && 汇总表.异动类型 IN ('转学','休学','毕业') && 明细表.发放金额 > 0
  description: 当学籍变更为转学、休学或毕业，且生效日期已过，但后续月份仍有补助发放记录的，直接判定为违规冒领。无容忍偏差。
  audit_item: 违反农村义务教育学生营养改善计划相关规定的行为
  suspicion: 学籍异动学生违规持续享受营养膳食补助
  regulation: "[\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划专项资金管理办法\",\n    \"法规文号\": \"财教〔2021〕174号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"严禁虚报、冒领、套取补助资金，发现相关行为应按规定处理。学籍变更后已不符合享受条件的学生应即停止发放补助。\"\n  }\n]"
