name: audit/法律文书类/培训通知
type: model
description: 从法律文书类类文档（培训通知）中提取结构化元数据。涵盖字段如：名额分配条件、地点、培训内容、培训地点、培训天数、培训时间、培训项目面向对象要求、批准培训人数。文档范围包括：培训通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 培训
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 培训通知
  member_count: 1
  member_details:
  - 培训通知
output:
  fields:
  - name: 名额分配条件
    type: string
    description: 提取 名额分配条件 的文本值
  - name: 地点
    type: string
    description: 提取 地点 的文本值
  - name: 培训内容
    type: string
    description: 提取 培训内容 的文本值
  - name: 培训地点
    type: string
    description: 提取 培训地点 的文本值
  - name: 培训天数
    type: number
    description: 提取 培训天数 的数值（含单位，如万元、吨等）
  - name: 培训时间
    type: date
    description: 提取 培训时间 的日期值，格式 YYYY-MM-DD
  - name: 培训项目面向对象要求
    type: string
    description: 提取 培训项目面向对象要求 的文本值
  - name: 批准培训人数
    type: number
    description: 提取 批准培训人数 的数值（含单位，如万元、吨等）
  - name: 收费对象
    type: number
    description: 提取 收费对象 的数值（含单位，如万元、吨等）
  - name: 收费标准
    type: number
    description: 提取 收费标准 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (SUM(明细表.金额) / COUNT(统计表.人员身份信息) > 综合定额标准（元/人天）.综合定额标准（元/人天）) || (签到表.实际签到人数 > 培训通知.批准培训人数 * 1.1) || (租赁协议.最大容纳人数
    < 签到表.实际签到人数)
  description: 人均综合培训费超出管理制度规定的定额标准；或实际签到参训人数超过审批人数的10%以上；或培训场地最大容纳人数低于实际签到人数，三个条件满足其一即视为超标准或超人数违规。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 超标准、超人数举办培训
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关培训费管理办法\",\n    \"法规文号\": \"财行〔2016〕540号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条、第十条\",\n    \"内容概述\": \"培训费实行综合定额标准控制，分项核定、总额控制；组织培训的工作人员人数不得超过参训人员数量的10%。\"\n  }\n]"
- expression: 培训通知.收费标准 > 0 && (许可证.有效期限 != '有效' OR 许可证.收费标准 < 培训通知.收费标准) && 明细表.付款方 IN ('所属单位','企业','社会人员') && 职能文件.培训是否属于法定免费服务职责
    == '法定免费培训'
  description: 行政机关或事业单位在其法定职责范围内举办培训并收取费用，但无有效的收费许可或实际收费标准高于批复标准，且付款方为下属单位或企业的，即构成违规收费。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 违规向企事业单位收取培训费
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2016〕1223号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第四条、第五条\",\n    \"内容概述\": \"行政事业性收费实行中央和省两级审批管理，未按规定审批的不得收费；行政机关履行行政职能提供服务的，不得收取费用。\"\n  }\n]"
- expression: 明细表.金额 > 0 && (COALESCE(签到表.实际签到人数,0) < 统计表.人数 * 0.3 OR 核查表.异常特征标记（四要件缺失、笔迹雷同、场地矛盾等） == 1) && (明细表.收款方户名 !=
    原始凭证.合同供应商 OR 明细表.收款方户名 LIKE '%个人%')
  description: 培训项目有支出但实际签到人数严重不足（低于应参训人数的30%），或异常特征表标记为1（如通知、签到、日程、照片四要件缺失），且资金支付对象与合同供应商不一致或支付给个人账户，则高度疑为虚构培训套取资金。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 虚列培训费套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第（一）项\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，责令改正，追回有关财政资金，对单位给予警告或者通报批评，对直接负责的主管人员和其他直接责任人员给予记大过处分。\"\n  }\n]"
- expression: (培训通知.培训项目面向对象要求 = '乡村教师' AND 近三年国培计划参训教师名单（含学校属地标识）.参训项目名称 = 培训通知.培训内容 AND 近三年国培计划参训教师名单（含学校属地标识）.学校属地类型 =
    '城区') OR (培训报名表.学校属地类型 = '乡村' AND 近三年国培计划参训教师名单（含学校属地标识）.学校属地类型 = '城区' AND 培训报名表.报名教师姓名 = 近三年国培计划参训教师名单（含学校属地标识）.教师姓名)
  description: 培训项目明确规定仅限乡村教师参加，但实际参训人员中出现城区教师，或报名时显示乡村教师但实际参训人是城区教师，构成挤占。两个条件满足任一即判定违规。
  audit_item: 乡村教师技能培训不符合要求
  suspicion: 城区学校教师挤占乡村教师培训名额
  regulation: "[\n  {\n    \"法规名称\": \"教育部关于深化中小学教师培训模式改革全面提升培训质量的指导意见\",\n    \"法规文号\": \"教师〔2013〕6号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"十二、加强培训对象遴选\",\n    \"内容概述\": \"严格培训对象遴选，杜绝‘关系’培训、‘人情’培训，确保最需要的教师获得培训机会，防止培训名额被挤占。\"\n  },\n\
    \  {\n    \"法规名称\": \"国务院办公厅关于印发乡村教师支持计划（2015—2020年）的通知\",\n    \"法规文号\": \"国办发〔2015〕43号\",\n    \"效力级别\": \"行政法规\",\n\
    \ "
