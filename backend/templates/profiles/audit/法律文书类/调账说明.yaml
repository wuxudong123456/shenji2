name: audit/法律文书类/调账说明
type: model
description: 从法律文书类类文档（调账说明）中提取结构化元数据。涵盖字段如：审批状态、调账摘要。文档范围包括：行政经费支出明细调账说明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 审批
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 调账说明
  member_count: 1
  member_details:
  - 行政经费支出明细调账说明
output:
  fields:
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
  - name: 调账摘要
    type: string
    description: 提取 调账摘要 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
