name: audit/法律文书类/验收证明
type: model
description: 从法律文书类类文档（验收证明）中提取结构化元数据。涵盖字段如：关停影像记录、实际拆除落后设备清单、政府验收签字、验收完成日期。文档范围包括：企业关停淘汰产能验收证明、验收证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 验收
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 验收证明
  member_count: 1
  member_details:
  - 企业关停淘汰产能验收证明
  - 验收证明
output:
  fields:
  - name: 关停影像记录
    type: string
    description: 提取 关停影像记录 的文本值
  - name: 实际拆除落后设备清单
    type: string
    description: 提取 实际拆除落后设备清单 的文本值
  - name: 政府验收签字
    type: string
    description: 提取 政府验收签字 的文本值
  - name: 验收完成日期
    type: date
    description: 提取 验收完成日期 的日期值，格式 YYYY-MM-DD
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (明细账.企业类型 IN ('中小企业','民营企业') AND (明细账.应付款日期 IS NOT NULL) AND (明细账.实际付款日期 IS NULL AND DATE_DIFF(CURRENT_DATE,
    明细账.应付款日期, 'DAY') > 60) ) OR (明细账.实际付款日期 - 明细账.应付款日期 > 60)
  description: 依据《保障中小企业款项支付条例》，机关、事业单位从中小企业采购货物、工程、服务，应当自交付之日起30日内支付款项；合同另有约定的，付款期限最长不得超过60日。超过60日未付，即构成逾期拖欠。表达式以60天为阈值判定违规。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 长期拖欠中小企业采购账款
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"机关、事业单位从中小企业采购货物、工程、服务，应当自货物、工程、服务交付之日起30日内支付款项；合同另有约定的，付款期限最长不得超过60日。不得以法定代表人或者主要负责人变更，履行内部付款流程，或者在合同未作约定的情况下以等待竣工验收批复、决算审计等为由，拒绝或者迟延支付中小企业款项。\"\
    \n  }\n]"
- expression: (批复文件.批复建设产能规模 > (备案文件.核定淘汰产能数量 * 行业规定置换系数)) || (验收证明.政府验收签字 != '已验收' && 审批清单.审批状态 == '已批准')
  description: 依据各行业产能置换实施办法，新项目产能必须以淘汰原有产能为前提，且需满足减量或等量置换比例。若建设产能超出按置换比例折算后的允许值，或申报淘汰的旧产能并未实际关停验收即获批新项目，均构成违规。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 违反产能置换政策违规新增产能
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于化解产能严重过剩矛盾的指导意见\",\n    \"法规文号\": \"国发〔2013〕41号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第二部分第（三）点\",\n    \"内容概述\": \"产能严重过剩行业项目建设，须制定产能置换方案，实施等量或减量置换。\"\n  },\n  {\n    \"法规名称\": \"工业和信息化部关于印发水泥玻璃行业产能置换实施办法的通知\"\
    ,\n    \"法规文号\": \"工信部原〔2021〕80号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第五条\",\n    \"内容概述\": \"明确"
