name: audit/法律文书类/终止通知
type: model
description: 从法律文书类类文档（终止通知）中提取结构化元数据。涵盖字段如：姓名、应腾退资源清单及期限、离职日期。文档范围包括：调离/退休人员待遇终止通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 终止通知
  member_count: 1
  member_details:
  - 调离/退休人员待遇终止通知
output:
  fields:
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 应腾退资源清单及期限
    type: string
    description: 提取 应腾退资源清单及期限 的文本值
  - name: 离职日期
    type: date
    description: 提取 离职日期 的日期值，格式 YYYY-MM-DD
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (公务用车调配登记表.退换日期 IS NULL OR 公务用车调配登记表.退换日期 > 调离/退休人员待遇终止通知.离职日期 + 30天) AND 费用报销明细表.使用人 IN (调离/退休人员待遇终止通知.姓名)
    AND 费用报销明细表.报销日期 > 调离/退休人员待遇终止通知.离职日期
  description: 离职后超过一个月仍未腾退办公用房或退还公车，且继续产生相关费用报销，即判定违规。
  audit_item: 公款用于个人支出
  suspicion: 向调离或退休领导持续提供办公用房及公车
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有企业负责人职务消费的指导意见\",\n    \"法规文号\": \"国资发分配〔2006〕69号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业负责人职务消费应坚持从紧必需原则，不得用于应由个人承担的费用，不得随意扩大职务消费范围或提高消费标准。\"\n  }\n]"
