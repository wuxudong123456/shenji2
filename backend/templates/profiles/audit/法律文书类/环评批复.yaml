name: audit/法律文书类/环评批复
type: model
description: 从法律文书类类文档（环评批复）中提取结构化元数据。涵盖字段如：允许填埋区域、批准库容、防护距离。文档范围包括：填埋场环评批复等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 环评批复
  member_count: 1
  member_details:
  - 填埋场环评批复
output:
  fields:
  - name: 允许填埋区域
    type: string
    description: 提取 允许填埋区域 的文本值
  - name: 批准库容
    type: string
    description: 提取 批准库容 的文本值
  - name: 防护距离
    type: string
    description: 提取 防护距离 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (监测报告.重金属含量 > 国家标准 && 监测报告.异常热源坐标 < 500米) || (监测报告.渗滤液处理指标 < 0.9) || (验收报告.防渗措施 != '通过' && 计划表.每日填埋量 > 0)
  description: 填埋场周边500米内地下水重金属超标或渗滤液处理达标率低于90%，或防渗未通过验收却已启用，均判定为违规填埋，存在污染风险。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 收集垃圾违规填埋造成污染隐患
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"建设利用填埋方式处置生活垃圾的，应当按照国家有关规定采取防渗漏、防扬散、防流失等环境保护措施。\"\n  },\n  {\n    \"法规名称\": \"生活垃圾填埋场污染控制标准\"\
    ,\n    \"法规文号\": \"GB 16889-2008\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"4.4\",\n    \"内容概述\": \"填埋场必须设置防渗层，并确保渗滤液有效"
