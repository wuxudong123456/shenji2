name: audit/法律文书类/公告
type: model
description: 从法律文书类类文档（公告）中提取结构化元数据。涵盖字段如：★条款、业绩要求、价格条款、会员资格要求、供应商资格条件、免费服务项目、公告发布平台、公告发布时间。文档范围包括：信息员招聘公告、国家明令取消的收费项目公告、招标公告、收费公示公告、政府采购项目公告、文化站开放时间公告、采购公告、采购招标公告、项目招标公告、项目招标公告或邀请招标资格预审公告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 合同
- 工程
- 招投标
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 公告
  member_count: 1
  member_details:
  - 信息员招聘公告
  - 国家明令取消的收费项目公告
  - 招标公告
  - 收费公示公告
  - 政府采购项目公告
  - 文化站开放时间公告
  - 采购公告
  - 采购招标公告
  - 项目招标公告
  - 项目招标公告或邀请招标资格预审公告
