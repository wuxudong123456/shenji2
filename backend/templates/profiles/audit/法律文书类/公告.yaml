    description: 提取 ★条款 的数值（含单位，如万元、吨等）
  - name: 业绩要求
    type: string
    description: 提取 业绩要求 的文本值
  - name: 价格条款
    type: number
    description: 提取 价格条款 的数值（含单位，如万元、吨等）
  - name: 会员资格要求
