violations:
- expression: 收费项目明细台账.收费项目名称 IN (国家明令取消的收费项目公告.取消项目名称) AND 收费项目明细台账.收费性质 = '经营服务性收费' AND 银行账户入账流水.摘要 LIKE CONCAT('%',收费项目明细台账.收费项目名称,'%')
    AND 银行账户入账流水.金额 > 0 AND 银行账户入账流水.交易日期 > 国家明令取消的收费项目公告.生效日期
  description: 表达式判定在取消生效后，仍以经营服务性名目对已取消项目收费且存在实际资金流入的行为。需同时满足：项目名称在已取消清单中、台账标注经营服务性、银行流水有对应收费记录且日期晚于取消日期。
  audit_item: 不按照规定的预算级次、预算科目入库
  suspicion: 将已取消的行政事业性收费转为经营服务性收费继续收取
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于取消、停征和免征一批行政事业性收费的通知\",\n    \"法规文号\": \"财税〔2014〕101号等系列文件\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条及附件\",\n    \"内容概述\": \"明确规定取消的收费项目不得以任何理由拖延或拒绝执行，不得以其他名目变相继续收取。\"\n  },\n  {\n    \"法规名称\"\
    : \"国务院办公厅关于进一步加强涉企收费管理减轻企业负担的通知\",\n    \"法规文号\": \"国办发〔2014〕30号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三部分\",\n\
    \    "
- expression: (投标人名称、初始报价、最终报价、报价变更率.报价变更率 > 10%) && (沟通时间、涉及投标人、通讯次数.通讯次数 > 0) && (ABS(中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中标日期、评标委员会名单、中标通知书发出时间、中标人、中标联合体成员及分工、联合体协议条款.合同金额
    - 投标人名称、初始报价、最终报价、报价变更率.最终报价) / 中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中
  description: 报价变更率指（最终报价-初始报价）/初始报价的绝对值，超过10%为异常；评标期间指投标截止至中标通知书发出前。若该期间存在私下沟通且合同金额与变更后报价一致（偏差<1%），则判定存在实质性价格谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人私下与投标人协商修改投标报价
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  }\n]"
- expression: (采购方式.采购方式 == 竞争性谈判) && (采购方式.项目预算 >= 公开招标限额标准) && (谈判轮次.谈判轮次 >= 2) && (谈判轮次.服务范围变更 == 是)
  description: 公开招标限额标准依据现行法规（如政府采购限额标准）；项目预算达到标准但未公开招标，采用竞争性谈判方式，且谈判中要求投标人多轮调整价格或服务内容，属于规避公开招标并实质性谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 利用多轮报价变相进行实质性谈判
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\"\
    ,\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容"
- expression: (公告.地域限制条款 LIKE '%本地%' OR 公告.地域限制条款 LIKE '%特定行政区划%' OR 公告.所有制限制条款 LIKE '%国有企业%' OR 公告.所有制限制条款 LIKE '%所有制%')
    || (公告.业绩要求 > 制价文件.最高投标限价或预算金额 * 1.5) || (公告.认证要求 LIKE '%特定行业协会认证%' AND 认证非国家强制要求)
  description: 资格条件含地域、所有制等排斥性描述，或业绩金额门槛远超项目规模（大于控制价1.5倍以上），或要求非强制特定行业协会认证，均触发疑点。存在任一条件即判定为不合理限制。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 招标文件设置不合理资格条件排斥潜在投标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n \
    \   \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十二条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制、排斥潜在投标人或者投标人。列举了包括"
- expression: COUNT(DISTINCT 投标保证金缴纳情况统计表.投标保证金比例) > 1
  description: 若不同投标人实际缴纳保证金的金额比例不一致（如本地企业5%，外地企业10%），统计表中出现两个及以上不同比例，即构成歧视待遇。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 对投标人实行差别化保证金待遇
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"招标人在招标文件中要求投标人提交投标保证金的，投标保证金不得超过招标项目估算价的2%。……不得挪用投标保证金。法律并未授权歧视性设置不同比例。\"\n  },\n \
    \ {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十八条\",\n    \"\
    内容概述\": \"招"
- expression: 公告.联合体投标要求 CONTAINS '必须组成联合体' OR 公告.是否接受独立投标相关条款 CONTAINS '不接受独立投标'
  description: 若招标文件明确规定本项目必须组成联合体投标或禁止独立投标，且项目本身技术并不必然要求联合体（如通用工程项目），则构成强制联合体。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 强制要求投标人组成联合体投标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十一条\",\n    \"内容概述\": \"招标人不得强制投标人组成联合体共同投标，不得限制投标人之间的竞争。\"\n  }\n]"
- expression: 数据表.投标人数量 = 1
  description: 若某一标段仅有1家有效投标人且直接中标（未达到重新招标条件），表明招标人可能通过拆分标段使竞争不充分，从而实现变相指定。若拆分标段数量异常增多且各标段中标人均不同，也需关注。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 通过拆分标段限制竞争变相指定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n  \
    \  \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十四条\",\n    \"内容概述\": \"招标人对招标项目划分标段的，应当遵守招标投标法的有关规定，不得利用划"
- expression: (公告.业绩要求 / 限价文件.招标控制价金额 > 2) || (INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本地')>0 || INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本市')>0
    || INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'本省')>0) || (INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'特定行业协会')>0)
  description: 判定规则：1. 业绩合同金额门槛超过招标控制价2倍以上，构成明显过高要求；2. 资格条件中包含地域关键词（本地、本市、本省）即构成地域歧视；3. 要求特定行业协会认证等非通用行业认证，指向个别企业。任一条件满足即触发违规疑点。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 以不合理的条件限制或排斥潜在投标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  }\n]"
- expression: COUNT(DISTINCT(统计表.各投标人保证金缴纳金额 / 对比表.投标总报价)) > 1 && 招标文件保证金比例统一
  description: 同一标段内，各投标人实际缴纳保证金的比例（保证金金额/投标报价）应一致；若出现不同比例，且招标文件规定了统一比例，即存在差别对待，构成歧视待遇。差异超过2个百分点为严重违规。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 对潜在投标人实行歧视待遇
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人，不得对潜在投标人实行歧视待遇。\"\n  }\n]"
- expression: INSTR(公告.资格条件（资质、业绩金额、注册资本、地域要求、认证要求）,'必须组成联合体')>0 || INSTR(公告.是否接受独立投标相关条款,'不接受独立投标')>0
  description: 招标文件条款中出现强制联合体措辞，如‘投标人必须组成联合体’、‘不接受独立投标人’等，即构成强制联合体，违反法规。项目不具备必须联合体的法定情形，任何强制要求均属违规。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 强制要求投标人组成联合体共同投标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十七条\",\n    \"内容概述\": \"招标人应当在资格预审公告、招标公告或者投标邀请书中载明是否接受联合体投标。招标人不得强制投标人组成联合体共同投标。\"\n  }\n]"
- expression: INSTR(公告.合同草案条款（排他性义务、后续合作限制）,'中标后不得参与')>0 && INSTR(公告.合同草案条款（排他性义务、后续合作限制）,'后续')>0 || INSTR(公告.合同草案条款（排他性义务、后续合作限制）,'排他性')>0
    || INSTR(公告.合同草案条款（排他性义务、后续合作限制）,'独家')>0
  description: 合同或招标文件合同草案中出现‘中标后不得参与后续同类项目’、‘签订排他性长期协议’、‘独家合作’等限制未来市场竞争的条款，即构成以不合理条件限制竞争，触发违规。
  audit_item: 招标人非法限制投标人竞争
  suspicion: 设置排他性条款限制投标人之间竞争
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十八条\",\n    \"内容概述\": \"招标人不得以不合理的条件限制或者排斥潜在投标人。\"\n  }\n]"
- expression: 明细表.采购金额 >= 公开招标限额标准 AND 明细表.采购方式 != '公开招标' AND (事项说明.审批意见 != '同意' OR 事项说明 IS NULL)
  description: 公开招标限额标准依据当地当年度政府集中采购目录及限额标准执行，如货物或服务单项或批量预算金额达到200万元以上须公开招标。当项目金额达到限额但采购方式非公开招标，且无有效审批记录或审批未通过时，判定为违规规避公开招标。
  audit_item: 政府采购组织管理不规范
  suspicion: 应公开招标未招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十六条、第二十七条、第二十八条\",\n    \"内容概述\": \"政府采购公开招标应作为主要采购方式；采购人不得将应当以公开招标方式采购的货物或服务化整为零或者以其他任何方式规避公开招标采购；达到公开招标数额标准的项目，因特殊情况需要采用公开招标以外方式的，应当在采购活动开始前获得设区的市、自治州以上人民政府采购监督管理部门的批准。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n   "
- expression: 明细表.采购方式 = '邀请招标' AND (被邀请供应商名称.COUNT(DISTINCT 被邀请供应商名称) < 3 OR 公告.实际投标供应商数量 < 3)
  description: 邀请招标的法定最低邀请供应商数量为3家。表达式检查邀请名单中独立供应商数量是否少于3家，或实际参与投标的供应商少于3家且无符合资格家数不足的书面说明，即触发违规。
  audit_item: 政府采购组织管理不规范
  suspicion: 邀请招标未向三家以上供应商发出投标邀请
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十九条、第三十六条\",\n    \"内容概述\": \"采购人邀请招标应邀请三家以上符合资格条件的供应商参加投标；出现符合专业条件的供应商或对招标文件作实质响应的供应商不足三家情形的，应予废标，并依法重新组织招标或改变采购方式。\"\
    \n  }\n]"
- expression: (技术参数明细.技术参数明细 = 空 OR 技术参数明细.技术参数明细 仅包含‘符合行业标准’‘满足使用需求’等模糊措辞 OR 技术参数明细.技术参数明细 未包含任何具体数值和计量单位) || (评审因素与评审标准（含价格分计算公式）.评审因素与评审标准（含价格分计算公式）
    = 空 OR 评审因素与评审标准（含价格分计算公式）.评审因素与评审标准（含价格分计算公式） 未公开价格分权重、评分公式等任一客观量化标准) || (涉及资格条件、技术参数、评分标准的限制性条款.涉及资格条件、技术参数、评分标准的限制性条款
    = 是 AND 采购文件.对应条款公开 = 否)
  description: 技术参数明细为空或仅含模糊表述，即属于未依法公开具体技术标准；评审标准中如未完整披露价格分计算细节、权重分配等，视为未公开评审标准；通过比对内部决策文件与公开采购文件，发现存在倾向性条款但未在公开文件中载明的，认定为隐匿采购标准。以上任一条件满足即触发疑点。
  audit_item: 未公开政府采购标准和采购结果
  suspicion: 采购人未依法公布政府采购项目的采购标准
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"招标文件应当包括采购项目的商务条件、采购需求、投标人的资格条件、投标报价要求、评标方法、评标标准以及拟签订的合同文本等，采购标准未在招标文件中全面载明即属违法。\"\n\
    \  }\n]"
- expression: (记录表.中标供应商名称 = 空 OR 记录表.中标金额 = 空 OR 记录表.评分明细 = 空) || (记录表.公示发布日期 - 汇总表.中标供应商确定日期（评委签字确认日期） > 2个工作日) || (采购合同.合同签订日期
    < 记录表.公示发布日期) || (支付凭证.第一笔采购资金支付日期 < 记录表.公示发布日期)
  description: 公示内容缺失中标单位、金额、评分明细等任一核心要素，即属公示不完整；自中标确定之日起超过2个工作日未发布公告为延迟公示；若合同签订日期或资金支付日期早于公示发布日期，说明可能存在先定后公示、伪造公示时间等严重程序倒置。分项触发即形成疑点。
  audit_item: 未公开政府采购标准和采购结果
  suspicion: 采购人未依法公布政府采购项目的采购结果
  regulation: "[\n  {\n    \"法规名称\": \"政府采购信息发布管理办法\",\n    \"法规文号\": \"财政部令第101号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第八条、第十条\",\n    \"内容概述\": \"中标、成交结果公告内容应当包括采购人和采购代理机构名称、中标供应商名称、地址和中标金额、主要标的概况等；自中标供应商确定之日起2个工作日内，应在指定媒体上公告中标结果。\"\
    \n  }\n]"
- expression: (文本.付款条件 != 公告.商务条款（付款比例、履约保证金、违约责任）) || (文本.合同期限 < 投标文件.服务期限承诺) || (文本.合同总价 != 通知书.中标金额) || (文本.违约责任 != 公告.商务条款（付款比例、履约保证金、违约责任）)
    || (通知书.合同签订时间 > 通知书.发出日期 + 30天)
  description: 该表达式用于筛查合同实质性条款与招投标文件不一致的行为。实质性内容包括：付款条件、服务质量期限、合同金额、违约责任等。任意一项不符即触发疑点。同时，若合同签订日期超出中标通知书发出后30日，也判定违规。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 招标人与中标人订立背离实质性内容的合同
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n\
    ]"
- expression: (文本.变更后的技术标准 < 公告.技术标准与规格) || (文本.品牌 != 投标文件.投标品牌及型号) || (ABS(文本.工程量或单价) > 15%) || (文本.合同期限 < 审批文件.审批日期) ||
    (匹配表.收款单位账户信息 != 中标人.名称)
  description: 筛查通过补充协议等方式在合同签订后另行订立背离实质性内容协议的行为。典型表现包括：降低技术标准或更换品牌、变更工程量超15%、审批流程倒置等。若出现向非中标单位付款，高度预示违规转包。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 招标人与中标人订立背离实质性内容的协议
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n\
    ]"
- expression: ( (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='施工' && 估算价>=4000000) || (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='货物'
    && 估算价>=2000000) || (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='服务' && 估算价>=1000000) ) && (公告.公告类型（公开/邀请） != '公开招标') && (变更申请记录
    IS NULL || 变更申请记录.批复意见 != '同意' || 变更申请记录.批复日期 > 公告.发布日期)
  description: 依据资金来源性质与估算价判定项目是否属于依法必须公开招标范畴，同时排除实际招标方式为非公开，且无合法审批变更手续的情形。若变更批复缺失、批复意见不明确或批复时间晚于招标活动开始，均视为违规。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 未经批准擅自将公开招标变更为邀请招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n  \
    \  \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"国有资金占控股或者主导地位的依法必须进行招标的项目，应当公开招标；除技术"
- expression: (资格条件条款.资格条件条款 CONTAINS ('本地注册' OR '本地纳税' OR '本省会员' OR '本市' OR '指定地域')) AND ((中标供应商地域分布统计表.本地/外地企业中标数量及金额 >
    0.9) OR (供应商质疑投诉统计表.投诉原因 LIKE '%地域限制%' AND 供应商质疑投诉统计表.处理结果 > 0.8))
  description: 筛查招标文件资格条件中是否明确要求供应商具备特定地域的注册、纳税、会员等身份，并辅以中标结果中本地供应商占比过高（>90%）或相关投诉异常（驳回率>80%）作为违规判定依据。两者结合可识别显性与隐性地域歧视。
  audit_item: 违反建设管理相关政策规定-政府采购活动中设置不合理的条件对供应商实行差别待遇或者歧视待遇
  suspicion: 设置地域限制或会员资格阻碍供应商自由进入市场
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五条\",\n    \"内容概述\": \"任何单位和个人不得采用任何方式，阻挠和限制供应商自由进入本地区和本行业的政府采购市场。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n\
    \    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"采购人或者采购代理机构有下列情形之一的，属于以不合理条件对供应"
- expression: (公告.供应商资格条件（所有制要求、注册资金、营业额、业绩要求） CONTAINS ('国有企业' OR '所有制') OR (公告.供应商资格条件（所有制要求、注册资金、营业额、业绩要求） > 项目预算金额 * 2)
    OR (公告.供应商资格条件（所有制要求、注册资金、营业额、业绩要求） > 项目预算金额 * 5) OR (公告.技术参数 指向特定品牌/专利 且 无 '或同等性能产品' 表述)) AND (信息表.所有制性质 > 0.8) AND (信息表.所有潜在市场供应主体信息
    > 10)
  description: 筛查招标文件是否明确要求所有制性质，或设定远超项目实际需求的注册资金（>预算2倍）、营业额（>预算5倍）等条件，技术参数是否唯一指向特定品牌。同时，当中标结果中国有企业占比超过80%，且市场上存在大量符合条件的民营供应商时，可判定为歧视性条件。
  audit_item: 违反建设管理相关政策规定-政府采购活动中设置不合理的条件对供应商实行差别待遇或者歧视待遇
  suspicion: 以所有制、规模或品牌产地等条件实行歧视待遇
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十二条\",\n    \"内容概述\": \"采购人不得以不合理的条件对供应商实行差别待遇或者歧视待遇。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\"\
    : \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"以所有制形式、注册资本、营业收入等规模条件，或者以特定行业、特定行政区域、特定品牌的业"
