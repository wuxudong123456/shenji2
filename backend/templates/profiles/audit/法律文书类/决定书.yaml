name: audit/法律文书类/决定书
type: model
description: 从法律文书类类文档（决定书）中提取结构化元数据。涵盖字段如：供应方式、关联人员、占用事实记录、土地位置、处分事由、处理结果、处罚事由、处罚对象。文档范围包括：土地出让合同或划拨决定书、救助对象审批决定书、纪检监察部门处分决定书、行政处罚决定书、行政执法处罚决定书、违规占用整改通知或处罚决定书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 人员
- 审批
- 整改
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 决定书
  member_count: 1
  member_details:
  - 土地出让合同或划拨决定书
  - 救助对象审批决定书
  - 纪检监察部门处分决定书
  - 行政处罚决定书
  - 行政执法处罚决定书
  - 违规占用整改通知或处罚决定书
output:
  fields:
  - name: 供应方式
    type: string
    description: 提取 供应方式 的文本值
  - name: 关联人员
    type: string
    description: 提取 关联人员 的文本值
  - name: 占用事实记录
    type: string
    description: 提取 占用事实记录 的文本值
  - name: 土地位置
    type: string
    description: 提取 土地位置 的文本值
  - name: 处分事由
    type: string
    description: 提取 处分事由 的文本值
  - name: 处理结果
    type: boolean
    description: 提取 处理结果 的布尔值（是/否）
  - name: 处罚事由
    type: string
    description: 提取 处罚事由 的文本值
  - name: 处罚对象
    type: string
    description: 提取 处罚对象 的文本值
  - name: 处罚日期
    type: date
    description: 提取 处罚日期 的日期值，格式 YYYY-MM-DD
  - name: 处罚时间
    type: date
    description: 提取 处罚时间 的日期值，格式 YYYY-MM-DD
  - name: 处罚机关
    type: string
    description: 提取 处罚机关 的文本值
  - name: 处罚金额
    type: number
    description: 提取 处罚金额 的数值（含单位，如万元、吨等）
  - name: 审批时间
    type: date
    description: 提取 审批时间 的日期值，格式 YYYY-MM-DD
  - name: 审批未通过原因及依据
    type: string
    description: 提取 审批未通过原因及依据 的文本值
  - name: 审批结果
    type: boolean
    description: 提取 审批结果 的布尔值（是/否）
  - name: 审批通过名单
    type: string
    description: 提取 审批通过名单 的文本值
  - name: 当事人
    type: string
    description: 提取 当事人 的文本值
  - name: 所依据的标准文件
    type: string
    description: 提取 所依据的标准文件 的文本值
  - name: 执行情况
    type: string
    description: 提取 执行情况 的文本值
  - name: 拒绝理由
    type: string
    description: 提取 拒绝理由 的文本值
  - name: 整改要求
    type: string
    description: 提取 整改要求 的文本值
  - name: 文书编号
    type: string
    description: 提取 文书编号 的文本值
  - name: 是否涉及经商办企业
    type: boolean
    description: 提取 是否涉及经商办企业 的布尔值（是/否）
  - name: 最终审批状态
    type: boolean
    description: 提取 最终审批状态 的布尔值（是/否）
  - name: 涉及隐名持股情况
    type: string
    description: 提取 涉及隐名持股情况 的文本值
  - name: 用途
    type: string
    description: 提取 用途 的文本值
  - name: 竣工日期
    type: date
    description: 提取 竣工日期 的日期值，格式 YYYY-MM-DD
  - name: 约定动工日期
    type: date
    description: 提取 约定动工日期 的日期值，格式 YYYY-MM-DD
  - name: 罚款原因
    type: number
    description: 提取 罚款原因 的数值（含单位，如万元、吨等）
  - name: 罚款金额
    type: number
    description: 提取 罚款金额 的数值（含单位，如万元、吨等）
  - name: 被处分人姓名
    type: string
    description: 提取 被处分人姓名 的文本值
  - name: 被处罚人
    type: string
    description: 提取 被处罚人 的文本值
  - name: 被处罚单位
    type: string
    description: 提取 被处罚单位 的文本值
  - name: 违法事实
    type: string
    description: 提取 违法事实 的文本值
  - name: 违法事实描述
    type: string
    description: 提取 违法事实描述 的文本值
  - name: 违规事实
    type: string
    description: 提取 违规事实 的文本值
  - name: 适用的法律条款
    type: number
    description: 提取 适用的法律条款 的数值（含单位，如万元、吨等）
  - name: 面积
    type: string
    description: 提取 面积 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (党员领导干部个人事项报告表.填报的经商办企业情况 IS NULL OR 党员领导干部个人事项报告表.投资企业名称 NOT CONTAINS 企业名称) AND (工商注册登记信息.股东/发起人姓名及身份证号 = 领导干部身份证号
    OR 工商注册登记信息.法定代表人姓名及身份证号 = 领导干部身份证号) AND (工商注册登记信息.出资比例 > 0) AND (工商注册登记信息.企业状态 = '存续')
  description: 依据个人报告表与工商登记信息比对，如果领导干部未在报告表中申报任何经商办企业记录，但在工商注册登记中直接登记为股东或法定代表人且持股比例大于0，则视为违反规定个人独资或与他人合资合股经商办企业。同时排除企业已注销等状态。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 个人独资或与他人合资合股经办企业
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（一）项\",\n    \"内容概述\": \"违反有关规定从事营利活动，经商办企业的，视情节给予警告直至开除党籍处分。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n\
    \    \"法规文号\": \"主席令第二十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十九条第十六项\",\n    \"内容概述\": \"公务员不得违反有关规定从事或者参与营利性活动，在企业或者其他"
- expression: (企业股东及股权变更记录.受让方姓名 IN 领导干部直系亲属及特定关系人名单.亲属姓名) && (企业股东及股权变更记录.转让价格 < 企业净资产负债比例对应股权价值*0.7 OR 企业股东及股权变更记录.转让价格为0
    OR 企业股东及股权变更记录.转让方与受让方为无对价转让) && (银行账户流水.付款方==领导干部 OR 银行账户流水.付款方==领导干部配偶 && 银行账户流水.资金用途 CONTAINS '投资款' OR '股权款') && 党员领导干部个人有关事项报告表.未填报该亲属名下的企业投资
  description: 筛选股权变更记录中受让方为领导干部直系亲属或特定关系人，且转让价格明显低于公允价值（低于70%）甚至无偿转让，同时存在领导干部或其配偶账户向原股东或亲属支付大额款项的痕迹，并且领导干部未在个人事项报告中申报亲属的该笔投资。表达式考虑了代持行为核心特征：低价转让、资金来源于领导干部、未如实申报。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 以他人名义入股形式经办企业
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（一）项、第（二）项\",\n    \"内容概述\": \"违反规定从事营利活动，经商办企业，或者拥有非上市公司（企业）的股份或者证券的，给予相应处分。以他人名义持股仍属违规。\"\n  },\n  {\n   \
    \ \"法规名称\": \"关于领导干部报告个人有关事项的规定\",\n    \"法规文号\": \"中办发〔2017〕12号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第四条\",\n\
    \    \"内容概"
- expression: (行政罚款明细表.罚款金额 > 行政处罚决定书.罚款金额) || (行政处罚决定书.违法事实描述 IS NULL OR 行政处罚决定书.证据材料 IS NULL) || (行政罚款明细表.处罚事由 NOT IN (国家和地方涉农收费政策文件.合法收费项目名称))
  description: 出现罚款金额超出法定上限、处罚决定书无具体违法事实或证据、或处罚事由不在法律授权范围内时，判定为随意罚款。重点排查大额罚单及案由模糊的处罚。
  audit_item: 乱集资、乱摊派、乱收费
  suspicion: 对农机企业实施无依据或程序违规的随意罚款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国行政处罚法\",\n    \"法规文号\": \"中华人民共和国主席令第70号（2021年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第五十四条\",\n    \"内容概述\": \"行政机关应当查明事实；违法事实不清、证据不足的，不得给予行政处罚。\"\n  }\n]"
- expression: (现场测量记录.实测附属设施面积 > 省级设施农业用地政策实施细则.旧标准面积上限) AND (现场测量记录.实测附属设施面积 <= 省级设施农业用地政策实施细则.附属设施允许面积上限) AND (行政处罚决定书.处罚日期
    > 省级设施农业用地政策实施细则.新标准生效日期) AND (行政处罚决定书.所依据的标准文件 = '旧标准文件')
  description: 表达式筛选出附属设施面积虽超过旧标准上限但未超出新标准上限，且新标准已生效后仍依据旧标准进行处罚的案例。表明执法部门未及时更新并适用有利于管理相对人的新政策，存在选择性执法或政策执行偏差。
  audit_item: 农业社会化服务政策扶持不到位
  suspicion: 设施农业用地附属设施面积标准执行错误导致违规处罚
  regulation: "[\n  {\n    \"法规名称\": \"某省设施农业用地管理实施细则\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"关于附属设施面积标准的条款\"\
    ,\n    \"内容概述\": \"新标准将看护房等附属设施允许面积上限由15平方米放宽至22平方米，并明确新标准生效后统一按新标准执行。\"\n  }\n]"
- expression: (COUNT(实际开放日期、开放时段、锁闭记录.实际开放日期) / 管理员职责.规定开放天数 * 统计周期周数 < 0.8) || (DATEDIFF(MAX(借阅日期、借阅人、书籍名称、归还状态、借阅频率、借阅人次、月借阅人次、借阅册数.借阅日期),
    MIN(借阅日期、借阅人、书籍名称、归还状态、借阅频率、借阅人次、月借阅人次、借阅册数.借阅日期)) > 90 AND COUNT(借阅日期、借阅人、书籍名称、归还状态、借阅频率、借阅人次、月借阅人次、借阅册数.借阅人) == 0) ||
    (场地用途限定条款、产权归属、房屋规划用途、约定使用性质.约定使用性质 != '农家书屋' OR 场地用途
  description: 判定开放不合规：实际开放天数与制度规定比值低于80%，或借阅记录连续3个月以上为空且无借阅人，表明书屋未正常开放；场地协议中用途非书屋或存在出租转租约定，直接构成违规占用；已存在整改通知的为历史违规记录。条件满足任一即判为疑点。
  audit_item: 农家书屋建设运营管护不合规
  suspicion: 农家书屋被违规占用或长期锁闭
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"农家书屋必须保障开放时间，每周不少于5天，严禁挤占、挪用书屋场地，确保为农民提供阅读服务。\"\n  }\n]"
- expression: (联单记录.收货方 不在 合规处置企业名录) || (联单台账.最终处置方式（再生/填埋/焚烧） != '资源化利用' && 联单台账.最终处置方式（再生/填埋/焚烧） != '卫生填埋') || (监测报告.二噁英浓度
    > 0.5 ng TEQ/Nm³) || (决定书.违规事实 包含 '焚烧' || '掩埋' || '弃置') || (投诉记录.投诉内容 包含 '烧膜' || '埋膜' || '乱倒' )
  description: 合规处置企业名录由回收协议确定。非资源化利用或卫生填埋的，可能为非法处置；二噁英超标参照《危险废物焚烧污染控制标准》中限值（0.5ng TEQ/Nm³）；其他字段通过关键文本匹配判定。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 随意弃置、掩埋或者焚烧废旧农膜
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"农用薄膜使用者应当在使用期限届满前捡拾田间的非全生物降解农用薄膜废弃物，交至回收网点或回收工作者，不得随意弃置、掩埋或者焚烧。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十条\","
- expression: 况申报表.工作人员姓名 IN (审批文件.主要股东姓名) || 况申报表.配偶姓名 IN (审批文件.法定代表人姓名) || 决定书.关联人员 IN (况申报表.工作人员姓名)
  description: 将工作人员及其配偶申报信息与农药生产经营企业股东、法定代表人进行比对。如有重合,或者行政处罚案件中涉及该工作人员,则可能存在公职人员参与经营活动。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 农业主管部门工作人员参与农药生产经营活动
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十二条\",\n    \"内容概述\": \"县级以上人民政府农业主管部门及其工作人员不得参与农药生产、经营活动;违反规定的,依法给予处分;构成犯罪的,依法追究刑事责任。\"\n  }\n]"
- expression: (会议记录.决议事项 CONTAINS '变更' && DATEDIFF(当前日期, 其他.会议决议日期) > 30 && 备案材料.变更记录中无对应事项) || (其他.章程修改记录.经营期限已届满 && 备案材料.登记状态
    != '注销' && 未查询到清算组备案)
  description: 合作社作出变更决议后30日内未申请变更登记，或者经营期限届满未依法进行注销清算，即构成违规。日期差阈值设定为30天。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 合作社未按规定办理变更或注销登记
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社登记管理条例\",\n    \"法规文号\": \"国务院令第498号\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第二十七条、第三十条\",\n    \"内容概述\": \"农民专业合作社登记事项发生变更的，应当自作出变更决议之日起30日内申请变更登记；成立清算组的应自成立之日起10日内备案。\"\n  }\n]"
- expression: (变化图斑坐标、面积、变化类型、时间戳、实际占地图斑与审批红线比对差异、NDVI时序曲线.面积 > 0.5 公顷 && 变化图斑坐标、面积、变化类型、时间戳、实际占地图斑与审批红线比对差异、NDVI时序曲线.变化类型
