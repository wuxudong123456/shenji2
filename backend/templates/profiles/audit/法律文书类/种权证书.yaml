name: audit/法律文书类/种权证书
type: model
description: 从法律文书类类文档（种权证书）中提取结构化元数据。涵盖字段如：品种名称、品种权人、品种权号。文档范围包括：植物新品种权证书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 种权证书
  member_count: 1
  member_details:
  - 植物新品种权证书
output:
  fields:
  - name: 品种名称
    type: string
    description: 提取 品种名称 的文本值
  - name: 品种权人
    type: string
    description: 提取 品种权人 的文本值
  - name: 品种权号
    type: string
    description: 提取 品种权号 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (档案.许可品种名称 IN 品种权证书.品种名称) && (档案.企业名称 NOT IN (品种权证书.品种权人 ∪ 品种权证书.被许可人)) || (抽检台账.DNA指纹检测结果 != 抽检台账.标签标注品种)
  description: 未经品种权人或其授权许可的主体生产授权品种，或实际检测出的品种与标签标注品种不符，均属于套牌侵权。两个条件满足其一即可判定。
  audit_item: 种业市场监管方面不符合相关规定
  suspicion: 种子套牌侵权行为未有效查处
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"中华人民共和国主席令第三十五号（2015年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"任何单位或者个人未经植物新品种权所有人许可，不得生产、繁殖或者销售该授权品种的繁殖材料，不得为商业目的将该授权品种的繁殖材料重复使用于生产另一品种的繁殖材料。\"\
    \n  }\n]"
