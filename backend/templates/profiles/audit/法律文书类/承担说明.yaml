name: audit/法律文书类/承担说明
type: model
description: 从法律文书类类文档（承担说明）中提取结构化元数据。涵盖字段如：主办方与参会方分担方式。文档范围包括：会议费用承担说明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 承担说明
  member_count: 1
  member_details:
  - 会议费用承担说明
output:
  fields:
  - name: 主办方与参会方分担方式
    type: string
    description: 提取 主办方与参会方分担方式 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 通知文件.费用自理条款 && 批复文件.批准总预算金额 < 批准总预算金额
  description: 若会议通知中明确住宿、餐饮等费用由参会单位自理，但主办单位预算中未对该费用全额保障，实质是将本应由主办单位承担的会议费摊派给参会方，构成转嫁费用。
  audit_item: 超标准举办会议
  suspicion: 向参会单位转嫁会议费用变相规避预算
  regulation: "[\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十二条\",\n    \"内容概述\": \"各单位会议费支付，应当严格按照……不得向参会人员收取，不得以任何方式向下属机构、企事业单位、地方转嫁或摊派会议费。\"\n  }\n]"
