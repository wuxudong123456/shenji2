name: audit/法律文书类/情况说明
type: model
description: 从法律文书类类文档（情况说明）中提取结构化元数据。涵盖字段如：使用进度、到位金额、原因分析、后续分配计划、整改措施、有机质未达标原因、未使用原因说明、未完成面积。文档范围包括：专项资金结余结转情况说明、任务未完成情况说明、国有资产闲置情况说明、未达标情况说明、禁捕专项资金分配与使用情况说明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 整改
- 资产
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 情况说明
  member_count: 1
  member_details:
  - 专项资金结余结转情况说明
  - 任务未完成情况说明
  - 国有资产闲置情况说明
  - 未达标情况说明
  - 禁捕专项资金分配与使用情况说明
output:
  fields:
  - name: 使用进度
    type: string
    description: 提取 使用进度 的文本值
  - name: 到位金额
    type: number
    description: 提取 到位金额 的数值（含单位，如万元、吨等）
  - name: 原因分析
    type: string
    description: 提取 原因分析 的文本值
  - name: 后续分配计划
    type: string
    description: 提取 后续分配计划 的文本值
  - name: 整改措施
    type: string
    description: 提取 整改措施 的文本值
  - name: 有机质未达标原因
    type: string
    description: 提取 有机质未达标原因 的文本值
  - name: 未使用原因说明
    type: string
    description: 提取 未使用原因说明 的文本值
  - name: 未完成面积
    type: string
    description: 提取 未完成面积 的文本值
  - name: 未覆盖区域说明
    type: string
    description: 提取 未覆盖区域说明 的文本值
  - name: 未达标区域及原因
    type: string
    description: 提取 未达标区域及原因 的文本值
  - name: 未达标原因
    type: string
    description: 提取 未达标原因 的文本值
  - name: 结余原因说明
    type: string
    description: 提取 结余原因说明 的文本值
  - name: 结余金额
    type: number
    description: 提取 结余金额 的数值（含单位，如万元、吨等）
  - name: 结转金额
    type: number
    description: 提取 结转金额 的数值（含单位，如万元、吨等）
  - name: 责任单位
    type: string
    description: 提取 责任单位 的文本值
  - name: 资金拨付时间
    type: date
    description: 提取 资金拨付时间 的日期值，格式 YYYY-MM-DD
  - name: 连续结转年度
    type: date
    description: 提取 连续结转年度 的日期值，格式 YYYY-MM-DD
  - name: 闲置原因分析
    type: string
    description: 提取 闲置原因分析 的文本值
  - name: 闲置资产清单
    type: string
    description: 提取 闲置资产清单 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 保护任务完成进度跟踪表.实际完成面积 < 年度黑土地保护任务分解表.计划面积
  description: 将进度跟踪表按区域或年度汇总的实际完成面积与任务分解表中对应分区的计划面积累加值进行比对，当实际完成面积小于计划面积时，触发疑点，完成率低于100%即判定为面积任务未完成，偏差越大问题越严重。
  audit_item: 任务目标未完成
  suspicion: 黑土地保护面积任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当将黑土地保护纳入国民经济和社会发展规划，安排资金，确保黑土地面积不减、质量不降，生态功能不退化。\"\n  }\n]"
- expression: 耕地土壤有机质含量监测数据表.有机质含量 < 土壤有机质提升技术规程.有机质目标值
  description: 以地方制定的有机质提升技术规程或考核目标中的有机质含量标准为依据，当监测数据表中任一有效监测点位的土壤有机质含量低于该目标值时，即判定为该点位未达标；若未达标点位数量达到一定比例（如超过10%）或连续年度下降，则认定为耕地土壤有机质含量整体未达标。
  audit_item: 任务目标未完成
  suspicion: 耕地土壤有机质含量未达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当将黑土地保护纳入国民经济和社会发展规划，安排资金，确保黑土地面积不减、质量不降，生态功能不退化。\"\n  }\n]"
- expression: (禁捕工作阶段总结报告.实际完成时间 > 禁捕工作任务分解与时间节点计划表.计划完成时间) || (禁捕工作阶段总结报告.实际完成率 < 禁捕工作任务分解与时间节点计划表.计划进度百分比 && (禁捕工作阶段总结报告.实际完成时间
    - 禁捕工作任务分解与时间节点计划表.计划完成时间) > 30) || (上级部门督办通知.要求完成时限 < 上级部门督办通知.整改反馈时间 && ABS(上级部门督办通知.整改反馈时间 - 上级部门督办通知.要求完成时限) > 15)
    || (禁捕专项资金分配与使用情况说明.资金拨付时间 > 长江禁捕分阶段实施方案.阶段目标完成时限 && (禁捕专项资金分配与使用
  description: 判定规则：计划完成时间为长江禁捕分阶段实施方案或任务分解计划表中的截止时间；实际完成日期来自阶段总结报告或进度汇报材料。若实际完成日期超过计划时间，或完成率未达标且滞后超过30天，即为违规。上级督办事项整改反馈时间超过要求完成日期15天以上的视同推进不力。专项资金到位时间较计划拨付时间滞后超过30天的，判定为资金保障不到位导致推进慢。
  audit_item: 任务目标未按时完成（长江全面禁捕）
  suspicion: 长江禁捕分阶段工作推进滞后
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第五条（十五）项\",\n    \"内容概述\": \"要求稳步推进长江流域重点水域禁捕工作，明确时间表和路线图，确保按时完成各项任务。\"\n  }\n]"
- expression: (专项资金预算批复.未分配金额 > 0 && 专项资金结余结转情况说明.结余金额 / 专项资金预算批复.预算批复总额 > 0.2 && 相关资金审批记录.结余分配讨论记录 == '' ) || (专项资金收入支出明细表.累计结余
    > 0 && ABS(银行存款余额调节表.账面余额 - 银行对账单.专户期末余额) == 0 && 专项资金结余结转情况说明.后续分配计划 == '' )
  description: 该表达式综合判定资金结余闲置。条件一：未分配金额大于0，且结余占预算总额比例超过20%，且无任何资金统筹分配的会议讨论记录，表明管理缺位导致闲置。条件二：账面存在累计结余，且银行账户余额与账面一致（资金真实沉淀），但无后续分配计划说明，直接判定为闲置。满足任一条件即触发疑点。
  audit_item: 专项资金长期闲置未发挥效益
  suspicion: 专项资金结余未分配使用形成闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十二条\",\n    \"内容概述\": \"各级政府上一年预算的结转资金，应当在下一年用于结转项目的支出；连续两年未用完的结转资金，应当作为结余资金管理。各部门、各单位上一年预算的结转、结余资金按照财政部的规定办理。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步加强地方财政结余结转资金管理的通知\",\n    \"法规文号\": \"财预〔2013〕372号\",\n    \"效力级别\": \"部门规章\",\n    "
- expression: (专项资金结余结转明细表（按年度分类）.累计结转年限 >= 2 && 项目进度报告.项目当前状态 == '停滞' || 项目进度报告.项目当前状态 == '完工' ) && 专项资金结余结转情况说明.未使用原因说明.不包含('客观不可抗力')
    && 历年审计报告.同类问题历史记录 != ''
  description: 该表达式识别连续结转两年以上且无客观合理原因的闲置资金。触发条件为：资金累计结转年限达到或超过2年，且对应项目状态为停滞或已完工（项目需求已消失）；同时，资金未使用的原因说明中排除了征地、自然灾害等客观不可抗力因素。若该单位历年审计曾发现过同类问题，则风险升级，说明存在屡审屡犯的管理漏洞。
  audit_item: 专项资金长期闲置未发挥效益
  suspicion: 专项资金结转两年以上未使用形成闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十条\",\n    \"内容概述\": \"部门预算支出结余以及预算安排的规定年限内尚未使用的项目资金，由同级财政在编制下一年度预算时，按照用款单位上一年度预算结余的一定比例，收回总预算统筹安排，具体办法由财政部规定。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步加强地方财政结余结转资金管理的通知\",\n    \"法规文号\": \"财预〔2013〕372号\",\n    \"效力级别\": \"部门规章\",\n   "
