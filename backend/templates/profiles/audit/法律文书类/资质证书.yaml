name: audit/法律文书类/资质证书
type: model
description: 从法律文书类类文档（资质证书）中提取结构化元数据。涵盖字段如：专业背景、中标单位资质等级、人员姓名、企业名称、发证机关、各级分包商资质等级、培训考核记录、持证人数。文档范围包括：护理员资质证书、担保公司资质证书、施工单位资质证书、草原监管人员资质证书、设计单位资质证书、资质证书、运维人员资质证书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 人员
- 培训
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 资质证书
  member_count: 1
  member_details:
  - 护理员资质证书
  - 担保公司资质证书
  - 施工单位资质证书
  - 草原监管人员资质证书
  - 设计单位资质证书
  - 资质证书
  - 运维人员资质证书
output:
  fields:
  - name: 专业背景
    type: string
    description: 提取 专业背景 的文本值
  - name: 中标单位资质等级
    type: string
    description: 提取 中标单位资质等级 的文本值
  - name: 人员姓名
    type: string
    description: 提取 人员姓名 的文本值
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 发证机关
    type: string
    description: 提取 发证机关 的文本值
  - name: 各级分包商资质等级
    type: string
    description: 提取 各级分包商资质等级 的文本值
  - name: 培训考核记录
    type: string
    description: 提取 培训考核记录 的文本值
  - name: 持证人数
    type: number
    description: 提取 持证人数 的数值（含单位，如万元、吨等）
  - name: 有效期
    type: string
    description: 提取 有效期 的文本值
  - name: 有效期截止日
    type: string
    description: 提取 有效期截止日 的文本值
  - name: 法定代表人
    type: string
    description: 提取 法定代表人 的文本值
  - name: 经营范围
    type: string
    description: 提取 经营范围 的文本值
  - name: 许可范围
    type: string
    description: 提取 许可范围 的文本值
  - name: 证书有效期
    type: string
    description: 提取 证书有效期 的文本值
  - name: 证书真伪查询结果
    type: boolean
    description: 提取 证书真伪查询结果 的布尔值（是/否）
  - name: 证书编号
    type: string
    description: 提取 证书编号 的文本值
  - name: 资质等级
    type: string
    description: 提取 资质等级 的文本值
  - name: 资质范围
    type: string
    description: 提取 资质范围 的文本值
  - name: 资质证书编号
    type: string
    description: 提取 资质证书编号 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (投标文件.拟投入人员名单 == '张三' && 缴纳记录.参保单位名称 != 中标机构名称) || (检测报告.主要检测人员姓名 不具有 规范要求的从业资格) || (资质证书.有效期 < 桥梁检测实施日期)
  description: 投标文件中承诺投入的人员与实际在场人员不符，且社保关系未在中标机构；无证人员冒充高级工程师签字；机构资质过期仍承接业务，均属资质违规。
  audit_item: 道路桥梁安全定期检测审计
  suspicion: 检测人员或机构资质挂靠
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十三条\",\n    \"内容概述\": \"投标人不得以他人名义投标或者以其他方式弄虚作假，骗取中标。\"\n  },\n  {\n    \"法规名称\": \"公路水运工程试验检测管理办法\",\n    \"法规文号\"\
    : \"交通运输部令2019年第19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条、第二十八条\",\n    \"内容概述\": \"检测人员不得同时受聘于两个及以上检测机构，检测机构不得转包、违规分"
- expression: 执行台账.实际施工主体名称 != 中标单位名称 && 无合法分包审批记录 && 支付明细表.收款单位名称 != 中标单位名称
  description: 中标单位不履行合同约定的施工义务，将全部工程或肢解后以分包名义转给其他单位或个人施工，自己仅收取管理费。表达式通过比对中标人与实际施工人、收款人与合同签订人是否一致来判定转包。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 中标单位将全部工程转包
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十八条\"\
    ,\n    \"内容概述\": \"禁止承包单位将其承包的全部建筑工程转包给他人，禁止承包单位将其承包的全部建筑工程肢解以后以分包的名义分别转包给他人。\"\n  },\n  {\n    \"法规名称\": \"建设工程质量管理条例\"\
    ,\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第七十八条\",\n    \"内容概述\": \"本条例所称转包，是指承包单位承包建设工程后"
- expression: 合同编号.分包层级 > 1 || (分包单位名称.再分包记录 != "无" && 分包单位名称.禁止再分包条款 = "禁止")
  description: 总包单位依法选定的分包商，将其承接的分包工程再次分包给其他单位，即构成二次分包。表达式判断是否存在第二层及以上分包记录，或分包合同中明确禁止再分包但存在再分包事实，直接判定违规。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 分包单位再次违法分包
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十九条\"\
    ,\n    \"内容概述\": \"禁止分包单位将其承包的工程再分包。\"\n  }\n]"
- expression: 各级分包商资质等级.资质等级 < 核查表.项目要求的最低资质等级 || (项目合同.承包单位名称 != 各级分包商资质等级.企业名称) || 各级分包商资质等级.有效期 < 项目合同.合同签订日期
  description: 承包单位不具备承接该工程所必需的资质等级，或资质证书过期、借用资质等情形。表达式将实际承包单位的资质与项目所需最低资质比对，等级不足、证书有效期已过或单位名称不一致均判定违规。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 违规发包给无资质单位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"承包建筑工程的单位应当持有依法取得的资质证书，并在其资质等级许可的业务范围内承揽工程。禁止建筑施工企业超越本企业资质等级许可的业务范围或者以任何形式用其他建筑施工企业的名义承揽工程。\"\n  }\n\
    ]"
- expression: (参与企业的营业执照.经营范围 NOT LIKE '%农产品%' && 参与企业的营业执照.经营范围 NOT LIKE '%电商%') || (资质证书.有效期 < 当前审计基准日) || (国家企业信用信息公示系统查询记录.严重违法失信名单
    = '是') || (企业资质审查结果汇总表.一票否决项命中标记 = '是' && 企业资质审查结果汇总表.最终审批意见 = '是') || (合作协议.约定投资额 > 银行流水.金额 * 1.5)
  description: 营业执照经营范围不含农产品或电商相关即为不符；资质证书过期失效；存在严重失信记录却未一票否决；审查表中命中否决项但获批通过；合作协议承诺投资远超实际到位资金50%以上，表明企业履约能力存疑或虚假承诺。
  audit_item: “互联网+”农产品出村进城工程实施不到位
  suspicion: 试点参与企业不符合申报准入条件
  regulation: "[\n  {\n    \"法规名称\": \"“互联网+”农产品出村进城工程试点工作方案\",\n    \"法规文号\": \"农办市〔2020〕7号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"三、试点企业遴选条件\",\n    \"内容概述\": \"参与试点企业应为具备较强实力的农业龙头企业、电商企业或物流企业，无严重失信记录，经营范围涵盖农产品生产、加工、流通、电商等相关领域。\"\n\
    \  }\n]"
- expression: (SUM(在岗护理员姓名.在岗护理员姓名) / COUNT(特困人员总数、护理等级（自理、半失能、失能）、入住日期.特困人员总数)) < 0.1
  description: 当在岗护理员总人数与入住特困人员总数的比例低于1:10（即0.1）时，判定为护理人员配备不足。若地方政策对失能、半失能老人有单独配比要求（如失能1:3），则需分类计算各自配比，已任意一类未达标即整体违规。
  audit_item: 农村养老服务政策实施不规范、建设质量不达标
  suspicion: 养老机构护理人员配备比例未达政策标准
  regulation: "[\n  {\n    \"法规名称\": \"农村五保供养服务机构管理办法\",\n    \"法规文号\": \"民政部令第37号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"供养服务机构应当根据服务对象人数和照料护理需求，配备相应比例的工作人员，其中护理工作人员与服务对象的比例不应低于1:10；对失能、半失能服务对象，应当适当提高护理人员比例。\"\n\
    \  }\n]"
- expression: EXISTS ( SELECT 1 FROM 评标委员会成员 a JOIN 投标单位信息 b ON a.身份证号 = b.股东身份证号 OR a.所在单位 = b.投标单位名称 OR a.电话号码 = b.联系人电话
    WHERE a.项目编号 = 'XXX' )
  description: 利用人员姓名、身份证号、单位等标识，关联评标委员会成员与投标单位数据库。若评标专家与投标单位存在控股、任职、亲属等关联关系而未声明回避，则触发违规。
  audit_item: 项目建设不符合规定
  suspicion: 评标委员会成员与投标人有利害关系未回避
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十七条\",\n    \"内容概述\": \"与投标人有利害关系的人不得进入相关项目的评标委员会；已经进入的应当更换。\"\n  },\n  {\n    \"法规名称\": \"评标委员会和评标方法暂行规定\",\n    \"\
    法规文号\": \"七部委令第12号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"有下列情形之一的，不得担任评标委员会成员：...（二）项目主管部门或者行政监督"
- expression: 核查表.项目经理.社保缴纳单位 != 资质证书.企业名称 OR 核查表.技术负责人.社保缴纳单位 != 资质证书.企业名称 OR NOT EXISTS ( SELECT 1 FROM 全国建筑市场平台 WHERE 资质证书.编号
    = 平台.编号 AND 资质证书.企业名称 = 平台.企业名称 AND 有效期 >= 施工期 )
  description: 通过比对关键岗位人员社保缴纳单位与中标资质单位是否一致，以及资质证书在全国平台验真或有效期过期，判定是否存在挂靠或借用资质。若社保单位不符或资质无效，即为疑点。
  audit_item: 项目建设不符合规定
  suspicion: 施工单位借用资质承揽工程
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十五条\",\n    \"内容概述\": \"施工单位应当依法取得相应等级的资质证书，并在其资质等级许可的范围内承揽工程。禁止施工单位超越本单位资质等级许可的业务范围或者以其他施工单位的名义承揽工程。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n    \"\
    内容概述\": \"禁止"
- expression: 资质证书.有效期截止日 < 施工合同.实际竣工日期 OR 资质证书.有效期截止日 < 施工期.实际施工结束日
  description: 将资质证书有效期与合同约定工期或实际施工结束日期比较，若资质在任何施工阶段已过期，视为无资质施工。
  audit_item: 项目建设不符合规定
  suspicion: 施工单位资质证书过期继续施工
  regulation: "[\n  {\n    \"法规名称\": \"建筑业企业资质管理规定\",\n    \"法规文号\": \"住房和城乡建设部令第22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第八条\",\n    \"内容概述\": \"企业资质证书有效期届满，需要继续从事建筑施工活动的，应当于资质证书有效期届满3个月前，向原资质许可机关提出延续申请。若过期未申请延续，不得从事建筑施工活动。\"\n  }\n]"
- expression: (ABS(汇总表.上报数据 - 汇总表.原始数据记录) / 汇总表.原始数据记录 > 0.1) OR (汇总表.监测时间 < 标准文件.规定的监测频次与指标要求 * 0.8) OR (缺失关键指标(汇总表.监测指标)的汇总表.监测时间占比
    > 0.2) OR (资质证书.证书有效期 < 汇总表.监测时间)
  description: 上报数据与系统原始数据偏差超过10%、监测频次不足标准的80%、总磷/总氮等核心指标缺失率超过20%、监测人员无证上岗，任一条件均构成监测违规。
  audit_item: 污水治理项目建设、运营、管护不到位
  suspicion: 污水处理厂水质监测数据造假或监测不规范
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十三条\",\n    \"内容概述\": \"重点排污单位应当安装自动监测设备，与生态环境主管部门监控设备联网，保证监测设备正常运行，监测数据应当真实准确，严禁篡改、伪造。\"\n  }\n]"
- expression: (核定编制数.职能描述存在交叉或缺失) OR (数据台账.高火险区分布/数据台账.草原总面积 < 0.8) OR (整改台账.问题描述 > 0) OR (资质证书.人员姓名/资质证书.人员姓名 < 0.5) OR (资质证书.最近培训日期
    < 当前日期-730天) OR (近3年草原违法案件结案率 < 0.7)
  description: 监管机构职责不清、巡查覆盖率低于80%、整改未全部闭环、专业人员比例不足50%、近2年无任何培训、三年违法案件结案率低于70%，均反映监管机构及队伍建设严重滞后。
  audit_item: 草原风险防控落实不到位
  suspicion: 草原监管机构及队伍建设不到位
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国草原法》\",\n    \"法规文号\": \"中华人民共和国主席令第八十二号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十六条\",\n    \"内容概述\": \"草原行政主管部门和草原监督管理机构应当加强草原监督管理，依法查处违反草原法律法规的行为，保护草原资源。\"\n  }\n]"
