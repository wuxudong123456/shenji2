name: audit/法律文书类/计划书
type: model
description: 从法律文书类类文档（计划书）中提取结构化元数据。涵盖字段如：作物种类、品种选育阶段、计划执行周期、计划用款日期、计划起止日期、里程碑节点及完成时间、项目名称、预算金额。文档范围包括：科研项目计划书、资金使用计划书、重大科技专项工程项目计划书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 金额
- 项目
- 预算
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 计划书
  member_count: 1
  member_details:
  - 科研项目计划书
  - 资金使用计划书
  - 重大科技专项工程项目计划书
output:
  fields:
  - name: 作物种类
    type: string
    description: 提取 作物种类 的文本值
  - name: 品种选育阶段
    type: string
    description: 提取 品种选育阶段 的文本值
  - name: 计划执行周期
    type: string
    description: 提取 计划执行周期 的文本值
  - name: 计划用款日期
    type: date
    description: 提取 计划用款日期 的日期值，格式 YYYY-MM-DD
  - name: 计划起止日期
    type: date
    description: 提取 计划起止日期 的日期值，格式 YYYY-MM-DD
  - name: 里程碑节点及完成时间
    type: date
    description: 提取 里程碑节点及完成时间 的日期值，格式 YYYY-MM-DD
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (跟踪表.实际完成日期 - 计划起止日期) > 0 && (申请.延期天数 / 计划起止日期) > 0.2
  description: 判定规则：项目实际完成时间超出计划完成时间，且超出天数占计划总工期的比例超过20%，即认定为工程进度严重滞后。延期率=（实际周期-计划周期）/计划周期×100%，阈值20%对应审计方法中的预警界限。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 重大科技专项工程进度滞后
  regulation: "[\n  {\n    \"法规名称\": \"中央预算内投资补助和贴息项目管理办法\",\n    \"法规文号\": \"国家发展改革委令第45号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第二十八条\",\n    \"内容概述\": \"项目单位应当按照批复的建设内容和规模、建设工期组织实施，确保项目按期建成。因故不能按期开工或者不能按期建成的，应当及时向原审批部门申请延期。\"\n  },\n\
    \  {\n    \"法规名称\": \"科技部 财政部关于印发《国家重点研发计划管理暂行办法》的通知\",\n    \"法规文号\": \"国科发资〔2017〕152号\",\n    \"效力级别\": \"部门规章\",\n\
    \  "
- expression: 专项账户银行对账单.交易类型 = '理财' && 专项账户银行对账单.金额 > 0 && (项目进度表.实际开工日期 IS NULL || DATEDIFF(项目进度表.实际开工日期, 专项账户银行对账单.交易日期)
    > 90)
  description: 债券资金到账后超过90天未进入实质性施工阶段，且专项账户存在购买理财产品记录，即认定为违规闲置并挪用资金进行理财。
  audit_item: 保障性安居工程企业债券使用不合规
  suspicion: 债券资金闲置且用于违规理财
  regulation: "[\n  {\n    \"法规名称\": \"保障性安居工程资金管理办法\",\n    \"法规文号\": \"财综〔2019〕31号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"专项资金不得用于购买理财产品、发放工资福利、偿还债务等与保障性安居工程无关的支出。\"\n  }\n]"
