name: audit/法律文书类/核准证书
type: model
description: 从法律文书类类文档（核准证书）中提取结构化元数据。涵盖字段如：是否取得静脉输液资质。文档范围包括：静脉用药核准证书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 核准证书
  member_count: 1
  member_details:
  - 静脉用药核准证书
output:
  fields:
  - name: 是否取得静脉输液资质
    type: boolean
    description: 提取 是否取得静脉输液资质 的布尔值（是/否）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (医疗服务项目登记表.日常开展项目 NOT IN (医疗机构执业许可证.核准的诊疗科目)) OR (处方笺.终止妊娠药品 IS NOT NULL OR 处方笺.精神药品 IS NOT NULL) OR (医疗服务项目登记表.日常开展项目
    = '静脉输液' AND 静脉用药核准证书.是否取得静脉输液资质 IS NULL) OR (医疗服务项目登记表.日常开展项目 LIKE '%中医微创%' AND 医疗机构执业许可证.核准的诊疗科目 NOT LIKE '%中医%')
  description: 村卫生室执业范围严格受限。静脉输液、外科小手术、计划生育手术、特殊管理药品使用等均为高风险超范围行为，一旦发现即违规。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 村卫生室超范围开展诊疗活动
  regulation: "[\n  {\n    \"法规名称\": \"医疗机构管理条例\",\n    \"法规文号\": \"国务院令第149号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十七条\",\n    \"内容概述\": \"医疗机构必须按照核准登记的诊疗科目开展诊疗活动。\"\n  },\n  {\n    \"法规名称\": \"医疗机构管理条例\",\n    \"法规文号\": \"国务院令第149号\"\
    ,\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十七条\",\n    \"内容概述\": \"诊疗活动超出登记范围的，由县级以上卫生行政部门予以警告、责令改正，并可根据情节处以罚款，情节严重的吊销《医疗机"
