name: audit/法律文书类/登记证明
type: model
description: 从法律文书类类文档（登记证明）中提取结构化元数据。涵盖字段如：买方信息、产权取得日期、抵押物名称、持证经营单位名称、权属证号、登记平台、登记提交资料清单、统一社会信用代码。文档范围包括：企业注册登记证明、农药经营单位备案登记证明、国有资产抵押登记证明、房屋买卖合同产权登记证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 登记
- 资产
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 登记证明
  member_count: 1
  member_details:
  - 企业注册登记证明
  - 农药经营单位备案登记证明
  - 国有资产抵押登记证明
  - 房屋买卖合同产权登记证明
output:
  fields:
  - name: 买方信息
    type: string
    description: 提取 买方信息 的文本值
  - name: 产权取得日期
    type: date
    description: 提取 产权取得日期 的日期值，格式 YYYY-MM-DD
  - name: 抵押物名称
    type: string
    description: 提取 抵押物名称 的文本值
  - name: 持证经营单位名称
    type: string
    description: 提取 持证经营单位名称 的文本值
  - name: 权属证号
    type: string
    description: 提取 权属证号 的文本值
  - name: 登记平台
    type: string
    description: 提取 登记平台 的文本值
  - name: 登记提交资料清单
    type: string
    description: 提取 登记提交资料清单 的文本值
  - name: 统一社会信用代码
    type: string
    description: 提取 统一社会信用代码 的文本值
  - name: 许可证编号
    type: string
    description: 提取 许可证编号 的文本值
  - name: 资产来源
    type: string
    description: 提取 资产来源 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (抵押物名称 IN (禁止抵押资产清单.禁止抵押资产清单)) || (资产来源（划拨/自有/公益） == '划拨' && 批复文件.批复允许无偿使用的说明文件 == null) || (资产性质说明文件.用途 ==
    '公益设施' && 抵押物名称 != null)
  description: 判定逻辑：1. 将明令禁止抵押的资产（如公益设施、文物、被监管资产）进行了抵押登记；2. 将划拨用地及其附着物未经有权机关批准进行抵押；3. 教育、医疗等公益设施有抵押记录。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规使用禁止抵押国有资产抵押
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"中华人民共和国主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三百九十九条\",\n    \"内容概述\": \"下列财产不得抵押：学校、幼儿园、医院等以公益为目的成立的非营利法人的教育设施、医疗卫生设施和其他公益设施。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国城市房地产管理法\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第七十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十一条\",\n    \"内容概述\": \"设定房地产抵押"
- expression: 统一社会信用代码在多平台登记次数 > 1 && (不同平台要求提交资料相似度 > 80%) && (各平台登记时间间隔 < 3个月)
  description: 筛查同一企业在多个公共资源交易平台或不同层级平台被要求重复注册，且各平台要求提交的资料高度重复（营业执照、资质证书等），登记时间集中，表明存在重复登记负担，违规增设市场准入程序。
  audit_item: 违反建设管理相关政策规定-工程建设项目招标活动中设置不合理的条件违反公平、公正原则
  suspicion: 要求投标人重复办理登记或重复提交相同资质材料
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十九条第二款\",\n    \"内容概述\": \"招标人不得要求投标人提供与招标项目无关的证明材料。\"\n  },\n  {\n    \"法规名称\": \"公平竞争审查制度实施细则\",\n    \"法规文号\"\
    : \"国市监反垄规〔2021〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"不得要求经营者在本地设立分支机构或者重复办理登记备案。\"\n\
    \  }\n]"
- expression: 明细表.生产企业名称 NOT IN (持证企业名称.持证企业名称) || 销售台账.经营单位名称 NOT IN (登记证明.持证经营单位名称)
  description: 将出厂销售明细表中的生产企业与许可证审批文件中的持证企业对比,若销售单位未取得生产许可证即为无证生产;将销售台账中的经营单位与备案登记证明对比,若未取得经营许可证即为无证经营。任一条件满足即可判定违规。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 未取得许可证生产销售农药
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十七条、第二十四条\",\n    \"内容概述\": \"国家实行农药生产许可制度,农药生产企业应当具备条件并取得农药生产许可证;国家实行农药经营许可制度,农药经营者应当具备条件并取得农药经营许可证,未取得许可证不得生产、经营农药。\"\
    \n  }\n]"
