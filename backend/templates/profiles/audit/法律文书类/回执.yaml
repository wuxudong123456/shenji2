name: audit/法律文书类/回执
type: model
description: 从法律文书类类文档（回执）中提取结构化元数据。涵盖字段如：交易摘要、交易时间、交易金额、付款账户、取款方式、取款时间、取款网点、取款金额。文档范围包括：国有资产监管部门回执、政府批准规划的红头文件或备案回执、补贴资金发放回执等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 付款
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 回执
  member_count: 1
  member_details:
  - 国有资产监管部门回执
  - 政府批准规划的红头文件或备案回执
  - 补贴资金发放回执
output:
  fields:
  - name: 交易摘要
    type: string
    description: 提取 交易摘要 的文本值
  - name: 交易时间
    type: date
    description: 提取 交易时间 的日期值，格式 YYYY-MM-DD
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款账户
    type: number
    description: 提取 付款账户 的数值（含单位，如万元、吨等）
  - name: 取款方式
    type: number
    description: 提取 取款方式 的数值（含单位，如万元、吨等）
  - name: 取款时间
    type: date
    description: 提取 取款时间 的日期值，格式 YYYY-MM-DD
  - name: 取款网点
    type: number
    description: 提取 取款网点 的数值（含单位，如万元、吨等）
  - name: 取款金额
    type: number
    description: 提取 取款金额 的数值（含单位，如万元、吨等）
  - name: 批准文件文号
    type: string
    description: 提取 批准文件文号 的文本值
  - name: 批准日期
    type: date
    description: 提取 批准日期 的日期值，格式 YYYY-MM-DD
  - name: 批准机关
    type: string
    description: 提取 批准机关 的文本值
  - name: 收款账户
    type: number
    description: 提取 收款账户 的数值（含单位，如万元、吨等）
  - name: 核准文号或备案编号
    type: string
    description: 提取 核准文号或备案编号 的文本值
  - name: 签署日期
    type: date
    description: 提取 签署日期 的日期值，格式 YYYY-MM-DD
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 审批记录.捐赠金额 > 其他.金额阈值 或 审批记录.捐赠金额 > 100万元 && 无对应的国资监管部门核准/备案回执.核准文号或备案编号
  description: 达到一定规模的对外捐赠，依据国资监管规定须报国有资产监管部门核准或备案，缺少回执即程序违规。
  audit_item: 资金管理方面存在的问题
  suspicion: 对外捐赠未履行国资核准或备案程序
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产监督管理暂行条例\",\n    \"法规文号\": \"国务院令第378号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"国有及国有控股企业对外捐赠应当遵守国家有关规定，严格履行内部决策程序，并按规定向国有资产监督管理机构报告。\"\n  }\n]"
- expression: (政府批准规划的红头文件或备案回执.批准文件文号 IS NULL || 政府批准规划的红头文件或备案回执.批准日期 IS NULL) || (规划备案情况统计表.备案状态 != '已备案' || 规划备案情况统计表.备案日期
    IS NULL)
  description: 规划必须经本级人民政府正式批准，并完成向上级主管部门的备案；缺少批准文件或未取得有效备案记录，均认定为审批备案程序缺失违规。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 高标准农田建设规划未经政府批准或未按规定备案
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第八条\",\n    \"内容概述\": \"市、县级农田建设规划须经本级人民政府批准后，报省级农业农村部门备案。未经批准和备案的规划，不能作为项目立项的依据。\"\n  }\n]"
