name: audit/法律文书类/大会决议
type: model
description: 从法律文书类类文档（大会决议）中提取结构化元数据。涵盖字段如：关于隶属变更的决议、表决票数。文档范围包括：社员代表大会决议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 大会决议
  member_count: 1
  member_details:
  - 社员代表大会决议
output:
  fields:
  - name: 关于隶属变更的决议
    type: string
    description: 提取 关于隶属变更的决议 的文本值
  - name: 表决票数
    type: string
    description: 提取 表决票数 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (隶属关系变更审批流程表.新隶属单位 NOT IN ("供销合作社系统","联合社")) && (机构编制调整的上级批复文件 IS NULL || 机构编制调整的上级批复文件.批复内容 != "同意划转") && 社员代表大会决议
    IS NULL
  description: 社有企业被划转至国资委、财政局等非供销社系统，且缺少上级审批同意文件及社员代表大会表决通过决议，属于擅自改变隶属关系的行为。高风险。
  audit_item: 供销合作社综合改革不合规
  suspicion: 擅自改变社有企业隶属关系
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第二部分（四）\",\n    \"内容概述\": \"要维护供销合作社组织体系的完整性，保持各级联合社的监督和指导职责，不得随意改变供销合作社及其所属企事业单位的隶属关系。\"\n  }\n]"
