name: audit/法律文书类/房产证明
type: model
description: 从法律文书类类文档（房产证明）中提取结构化元数据。涵盖字段如：产权人、设计用途。文档范围包括：房产证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 房产证明
  member_count: 1
  member_details:
  - 房产证明
output:
  fields:
  - name: 产权人
    type: string
    description: 提取 产权人 的文本值
  - name: 设计用途
    type: string
    description: 提取 设计用途 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 占用房屋位置台账.产权单位 IN 行政机关名单 AND 占用房屋位置台账.使用性质 = '占用' AND (占用房屋位置台账.租金标准 = 0 OR 占用房屋位置台账.租金标准 < 市场租金评估价 * 0.5) AND
    占用房屋位置台账.腾退状态 = '未腾退'
  description: 协会仍占用行政机关房产，且未支付租金或租金严重低于市场价50%以上，且未完成腾退即触发。面积>0即生成疑点。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 未清理腾退行业协会商会占用行政用房
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推开行业协会商会与行政机关脱钩改革的实施意见\",\n    \"法规文号\": \"发改经体〔2019〕1063号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"三、脱钩任务和措施（四）资产分离\",\n    \"内容概述\": \"行业协会商会占用的行政办公用房，应按照规定清理腾退，实现办公场所独立。\"\n  }\n]"
