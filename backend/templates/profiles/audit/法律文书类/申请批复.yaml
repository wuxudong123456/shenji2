name: audit/法律文书类/申请批复
type: model
description: 从法律文书类类文档（申请批复）中提取结构化元数据。涵盖字段如：批准延期天数。文档范围包括：延期申请批复等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 申请批复
  member_count: 1
  member_details:
  - 延期申请批复
output:
  fields:
  - name: 批准延期天数
    type: number
    description: 提取 批准延期天数 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (验收报告.实际竣工日期 - 其他.合同约定竣工日期 - 申请批复.批准延期天数 > 30天) && (结算书.违约金扣除栏 = 0 或 结算书.违约金扣除栏 < 其他.误期违约金计算标准（万分之几/天或总额上限）
    × 逾期天数)
  description: 逻辑规则：计算剔除合理顺延后的实际逾期天数，若逾期超过30天（审计风险阈值），且结算时未扣减相应违约金，或扣减金额远低于合同约定的违约金比例，判定为建设方监管失职或利益输送，导致国有资产损失。
  audit_item: 某公共建筑合同履行审
  suspicion: 工期延误未按合同约定索赔
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第45号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五百七十七条\"\
    ,\n    \"内容概述\": \"当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行、采取补救措施或者赔偿损失等违约责任。\"\n  },\n  {\n    \"法规名称\": \"建设工程施工合同（示范文本）\"\
    ,\n    \"法规文号\": \"GF-2017-0201\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"7.5, 14.2\",\n    \"内容概述\": \"因承包人原因造成工期延误"
