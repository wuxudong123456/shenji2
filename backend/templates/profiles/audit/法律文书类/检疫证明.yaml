name: audit/法律文书类/检疫证明
type: model
description: 从法律文书类类文档（检疫证明）中提取结构化元数据。涵盖字段如：引种树种名称、检疫合格证编号。文档范围包括：外来树种引种检疫证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 检疫证明
  member_count: 1
  member_details:
  - 外来树种引种检疫证明
output:
  fields:
  - name: 引种树种名称
    type: string
    description: 提取 引种树种名称 的文本值
  - name: 检疫合格证编号
    type: string
    description: 提取 检疫合格证编号 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (采购清单.是否为外来物种标识 / 采购清单.数量) > 0.3 || (审批文件.项目连片造林面积 > 50亩 && 检疫证明.专家论证结论 缺失)
  description: 外来树种占比超过30%即违背优先选用乡土树种的原则；单块连片造林面积超过50亩必须附有专家论证及检疫证明，否则视为盲目决策。
  audit_item: 村容村貌整体提升不符合相关规定
  suspicion: 盲目使用外来树种草种集中连片造林
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于科学绿化的指导意见\",\n    \"法规文号\": \"国办发〔2021〕19号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第五条\",\n    \"内容概述\": \"科学选择绿化树种草种，积极采用乡土树种草种进行绿化，审慎使用外来树种草种，防止乡村绿化城市化、奢侈化。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中华人民共和国森林法\",\n    \"法规文号\": \"主席令第三十九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十八条\",\n    \"内容概述\": \"国家支持营造林建设，优先使用乡土树种，"
