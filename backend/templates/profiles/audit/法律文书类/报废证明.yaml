name: audit/法律文书类/报废证明
type: model
description: 从法律文书类类文档（报废证明）中提取结构化元数据。涵盖字段如：报废日期、报废车辆原车牌号、残值处置去向。文档范围包括：旧车报废证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 车辆
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 报废证明
  member_count: 1
  member_details:
  - 旧车报废证明
output:
  fields:
  - name: 报废日期
    type: date
    description: 提取 报废日期 的日期值，格式 YYYY-MM-DD
  - name: 报废车辆原车牌号
    type: string
    description: 提取 报废车辆原车牌号 的文本值
  - name: 残值处置去向
    type: string
    description: 提取 残值处置去向 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (明细表.已使用指标数 > 明细表.分配单位) OR (报废证明.报废日期 < 登记清单.购置日期 AND 登记清单.车辆状态 = '在用' AND 登记清单.车牌号 = 报废证明.报废车辆原车牌号) OR (明细表.分配单位收到指标
    时间后 明细表.已使用指标数 对应车辆中 存在 登记清单.使用部门 ≠ 明细表.分配单位)
  description: 超额使用指标、虚假报废腾挪指标或指标挪用，均为违反指标管理的行为。‘虚假报废’指旧车报废后仍由该单位继续使用。
  audit_item: 违规配备公务用车
  suspicion: 违反指标管理规定配备公务用车
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条、第七条\",\n    \"内容概述\": \"公务用车实行编制和指标管理，核定编制和指标不得突破；主管部门应严格指标审批，任何单位不得无指标或超指标购车，不得挪用、转借指标。\"\n  }\n]"
