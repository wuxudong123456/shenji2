name: audit/法律文书类/申请
type: model
description: 从法律文书类类文档（申请）中提取结构化元数据。涵盖字段如：企业名称、企业资质、保险公司收款账户、入库时间、关联维修项目、勘验日期、参与人员、发包人审批金额。文档范围包括：企业增值税免税申请、优惠政策申请、供应商入库申请、保险机构保费结算申请、农业用户用电报装申请、危房改造申请、招标方式变更申请、支付申请、绩效目标调整申请、维修资金使用申请等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 人员
- 审批
- 明细
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 申请
  member_count: 1
  member_details:
  - 企业增值税免税申请
  - 优惠政策申请
  - 供应商入库申请
  - 保险机构保费结算申请
  - 农业用户用电报装申请
  - 危房改造申请
  - 招标方式变更申请
  - 支付申请
  - 绩效目标调整申请
  - 维修资金使用申请
  - 编制调整申请
  - 考察申请
  - 项目变更申请
  - 项目延期申请
  - 项目概算调整申请
  - 项目立项申请
