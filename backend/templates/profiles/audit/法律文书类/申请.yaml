violations:
- expression: GROUP BY 公务接待明细台账.接待场所, MONTH(公务接待明细台账.接待时间) HAVING COUNT(DISTINCT 公务接待明细台账.接待单位) >= 3 && 公务接待明细台账.接待场所 LIKE
    '%学习基地%' || 公务接待明细台账.接待场所 LIKE '%科研基地%' || 公务接待明细台账.接待场所 LIKE '%培训基地%'
  description: 按接待场所和月份分组，当同一场所（特别是各类基地）一个月内出现3家及以上不同接待单位时，触发疑点。反映可能存在的扎堆轮流接待、相互请托旅游。
  audit_item: 公务接待管理不符合规定
  suspicion: 短期内多单位集中赴同类场所考察涉嫌变相公款旅游
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"禁止以考察、学习、培训等名义变相用公款旅游。\"\n  }\n]"
- expression: (批复文件.投资估算金额 >= 项目清单.限额标准) && (招标文件.招标方式 == '邀请招标') && (申请.批复文件编号 IS NULL || 跟踪表.审批节点 != '已完成')
  description: 当项目满足依法必须公开招标的规模标准（如施工合同估算价400万元以上），而实际采用邀请招标，且无法提供合规的审批文件或审批流程未完成时，判定为违规。金额标准依据国家发改委16号令等规定，具体阈值需根据该类项目现行有效规定设定。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 未经批准擅自将公开招标改为邀请招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十一条\",\n    \"内容概述\": \"国家重点项目和地方重点项目应当进行公开招标，确需采用邀请招标方式的，须经国务院发展计划部门或者省、自治区、直辖市人民政府批准。\"\n  },\n  {\n    \"法规名称\": \"\
    必须招标的工程项目规定\",\n    \"法规文号\": \"国家发展和改革委员会令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"规定必须招标的工程项"
- expression: (变更申请记录.变更理由 == '技术复杂或特殊要求') && (符合资质条件的潜在投标人数量.符合资质条件的潜在投标人数量 >= 5) && (同类项目以往招标方式.同类项目以往招标方式 == '公开招标')
  description: 当申请变更为邀请招标的理由声称“技术复杂，仅有少量潜在投标人”，但审计查询市场显示符合资质的企业数量充足（如≥5家），且同类项目以往均采用公开招标时，判定为虚假理由。阈值5家为审计经验值，可结合具体项目实际情况调整。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 编造虚假理由骗取邀请招标批准
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十一条\",\n    \"内容概述\": \"公开招标应为原则，邀请招标仅限于特殊情况，且需履行批准手续。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\"\
    : \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"明确可以邀请招标的情形，包括技术复杂、只有少量潜在投标人可供选择等，但不得滥用该条款。\""
- expression: SUM(统计表.实有人数 WHERE 编制类型='行政编制') > 编制文件.行政编制总额
  description: 单位实际占用的行政编制人员总数超过上级核定的行政编制总额，即构成突破编制总额的违规行为。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 突破行政编制总额增加编制
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十七条\",\n    \"内容概述\": \"机构编制管理机关应当根据工作需要和精干的原则，在规定的编制限额内，及时审批编制。地方各级人民政府行政机构不得超出编制限额使用工作人员。\"\n  }\n]"
- expression: (年终自评报告中的目标值 != 年初申报表中的目标值) AND (对应的绩效目标调整申请及批复记录 IS NULL OR 批复结果为未批准)
  description: 若任何一项绩效指标的目标值在年末自评报告或执行文件中与年初申报值不一致，且找不到合法合规的审批记录（包括内部决策和财政批复），即判定为擅自调整。调整包括降低指标值、删除指标、新增指标等。
  audit_item: 部门、单位预算绩效目标下达或调整不合规
  suspicion: 未经批准自行调整预算绩效目标
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第四条第（十）款\",\n    \"内容概述\": \"预算执行中，各部门各单位应对绩效目标实现程度和预算执行进度实行‘双监控’，确需调整预算和绩效目标的，应按程序报批。\"\n  },\n  {\n\
    \    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\",\n\
    \    \"内容"
- expression: ( (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='施工' && 估算价>=4000000) || (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='货物'
    && 估算价>=2000000) || (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='服务' && 估算价>=1000000) ) && (公告.公告类型（公开/邀请） != '公开招标') && (变更申请记录
    IS NULL || 变更申请记录.批复意见 != '同意' || 变更申请记录.批复日期 > 公告.发布日期)
  description: 依据资金来源性质与估算价判定项目是否属于依法必须公开招标范畴，同时排除实际招标方式为非公开，且无合法审批变更手续的情形。若变更批复缺失、批复意见不明确或批复时间晚于招标活动开始，均视为违规。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 未经批准擅自将公开招标变更为邀请招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n  \
    \  \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"国有资金占控股或者主导地位的依法必须进行招标的项目，应当公开招标；除技术"
- expression: ((批复文件.批准的概算总金额 - 研究报告.项目总投资额) / 研究报告.项目总投资额 > 0.1) && (申请.批复文号 IS NULL)
  description: 初步设计概算超出可研估算10%以上时，必须向原审批部门报告并取得批准。若建设单位无法提供对应的调整概算批复文件，即视为违规，其超支部分未经合法审批。
  audit_item: 建设项目初步设计概算投资超过可研批准估算%及以上未报告审批部门
  suspicion: 初步设计概算超可研估算10%以上未报批
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十三条\"\
    ,\n    \"内容概述\": \"政府投资项目投资概算超过可行性研究报告批准的投资估算10%的，项目单位应当向投资主管部门或者其他有关部门报告，投资主管部门或者其他有关部门可以要求项目单位重新报送可行性研究报告。\"\n  }\n]"
- expression: (支付凭证.实际支付金额 / (申请.发包人审批金额 * (1 - 其他.质保金比例)) < 80%) || (支付凭证.银行到账日期 - 其他.合同约定竣工日期 > 30天)
  description: 衡量建设单位履约支付情况。两个维度：1.支付率不足：累计已付金额除以累计扣留质保金后的应付金额，比率长期低于80%，构成严重拖欠；2.支付延迟：进度款超期支付超过30天（一般合同约定14-28天内支付），定性为建设单位违约，可能引发索赔。
  audit_item: 某公共建筑合同履行审
  suspicion: 未按合同约定支付工程款
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条, 第十五条\",\n    \"内容概述\": \"机关、事业单位从中小企业采购货物、工程、服务，应当自交付之日起30日内支付款项；合同另有约定的，付款期限最长不超过60日。延迟支付的应支付逾期利息。\"\n  },\n\
    \  {\n    \"法规名称\": \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建〔2004〕369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\"\
    ,\n    "
- expression: (入库标准 IS NULL OR 入库标准.公开征集程序 = '无') AND (公告.资格条件中是否载明‘须为预选库/名录内供应商’ CONTAINS '需为库内供应商' OR '在名录内') AND (管理台账.库内供应商名单
    = 0) AND (中标供应商列表 不在 管理台账.库内供应商名单 中的中标次数 = 0)
