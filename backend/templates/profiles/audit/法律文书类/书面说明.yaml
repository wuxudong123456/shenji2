name: audit/法律文书类/书面说明
type: model
description: 从法律文书类类文档（书面说明）中提取结构化元数据。涵盖字段如：各子项目名称、子项目投资额、拆分原因。文档范围包括：项目拆分或调整的书面说明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 书面说明
  member_count: 1
  member_details:
  - 项目拆分或调整的书面说明
output:
  fields:
  - name: 各子项目名称
    type: string
    description: 提取 各子项目名称 的文本值
  - name: 子项目投资额
    type: string
    description: 提取 子项目投资额 的文本值
  - name: 拆分原因
    type: string
    description: 提取 拆分原因 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (SUM(书面说明.子项目投资额) > 批复文件.批复投资额 && 书面说明.拆分原因 IS NULL) || (COUNT(明细表.合同编号) > 1 && SUM(明细表.付款金额) > 审批权限阈值 && 申报材料.申报单位
    属于同一控制人)
  description: 判定建设单位通过将一个超过审批权限的大型项目，在没有合理合规原因的情况下，拆分为多个均低于审批权限阈值的小项目，从而规避上级部门审批。表达式第一部分通过比对所有子项目汇总投资额与总公司名义下的批复额度，判断是否存在超概拆分；第二部分通过聚合同一时期、相同或关联建设单位下的多个小额合同，若总金额超过规定限额且建设单位存在关联关系，则判定为化整为零嫌疑。
  audit_item: 未按规定办理项目审批等手续
  suspicion: 化整为零规避审批权限
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\"\
    : \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"政府投资项目必须按照规定报批项目建议书、可行性研究报告、初步设计，不得通过拆分为多个项目等"
