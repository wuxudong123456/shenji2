name: audit/法律文书类/核验证明
type: model
description: 从法律文书类类文档（核验证明）中提取结构化元数据。涵盖字段如：家庭成员、家庭成员信息、家庭成员关系、户籍地址、身份证号。文档范围包括：公安机关出具的身份信息核验证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 核验证明
  member_count: 1
  member_details:
  - 公安机关出具的身份信息核验证明
output:
  fields:
  - name: 家庭成员
    type: string
    description: 提取 家庭成员 的文本值
  - name: 家庭成员信息
    type: string
    description: 提取 家庭成员信息 的文本值
  - name: 家庭成员关系
    type: string
    description: 提取 家庭成员关系 的文本值
  - name: 户籍地址
    type: string
    description: 提取 户籍地址 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (异地缴存证明核实记录.核实结果 != '属实') || (DATEDIFF(住房公积金贷款申请清单.申请日期, 异地缴存明细表.缴存开始日期) <= 365 && 异地缴存明细表.缴存单位 != 社保缴纳比对表.参保单位)
    || (异地缴存明细表.缴存期间 与 社保缴纳比对表.参保期间 存在重叠 && 异地缴存明细表.缴存单位 != 社保缴纳比对表.参保单位)
  description: 第一条为证明核实不通过直接判定；第二条为缴存刚满最低期限（12个月）即申请贷款且社保单位与公积金缴存单位不一致，触发骗贷风险；第三条为异地缴存期间本地社保同时缴纳且参保单位不同于缴存单位，具有虚构劳动关系特征。三项满足任一即判定为疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 个人利用虚假异地缴存证明骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，由住房公积金管理中心责令限期退回贷款，并可处骗取金额百分之五以上百分之十以下罚款；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
- expression: (ABS(购房合同备案信息表.成交价格 - 房屋市场评估报告.评估价值) / 房屋市场评估报告.评估价值 > 0.2) && (贷款资金流向追踪表.收款账户 != 购房合同备案信息表.卖方账户 || 贷款资金流向追踪表.资金最终流向
    关联 购房合同备案信息表.购房人账户) || (SELECT COUNT(*) FROM 购房合同备案信息表 WHERE 房屋地址 = 本房屋地址) > 1
  description: 一是合同成交价格虚高，超出评估价20%以上，且贷款资金未按约定支付给卖方或最终回流至借款人关联账户；二是同一房屋地址在备案信息中有多条记录，涉嫌一房多贷。满足任一条件即为违规疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 个人利用虚假购房合同骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，由住房公积金管理中心责令限期退回贷款，并可处骗取金额百分之五以上百分之十以下罚款；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
- expression: (经办人员操作日志表.操作类型 = '修改' && 操作内容 LIKE '%缴存基数%' || 操作内容 LIKE '%缴存月数%') && (操作时间.HOUR NOT BETWEEN 6 AND 20 || 操作时间
    属于 非工作日) && (SELECT 贷款金额 FROM 住房公积金贷款申请清单 WHERE 审批人ID = 操作员ID) > 同类贷款平均金额 * 1.5) || (存在 经办人员银行账户流水.对方账户 与 住房公积金贷款申请清单.申请人ID
    关联的资金记录)
  description: 一是信贷经办人员或系统管理员在非工作时间或节假日修改关键缴存字段，且经手审批的贷款金额明显高于平均水平；二是经办人员个人账户与贷款申请人之间存在异常资金往来。上述任一条件成立，即构成内外勾结骗贷重大疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 经办管理人员内外勾结骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十条\",\n    \"内容概述\": \"住房公积金管理中心未按照规定审批住房公积金贷款，或者有其他违反本条例规定行为的，对主管人员和其他直接责任人员依法给予行政处分。\"\n  },\n  {\n    \"法规名称\": \"\
    住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的"
