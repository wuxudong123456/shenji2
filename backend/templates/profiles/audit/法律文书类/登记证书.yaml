name: audit/法律文书类/登记证书
type: model
description: 从法律文书类类文档（登记证书）中提取结构化元数据。涵盖字段如：业务主管单位、业务范围、产权单位全称、工程名称、有效期限、登记日期、证书编号、资产明细列表。文档范围包括：工程产权登记证书、登记证书、红十字会、慈善组织的法人登记证书、项目资产确权登记证书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 工程
- 明细
- 登记
- 资产
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 登记证书
  member_count: 1
  member_details:
  - 工程产权登记证书
  - 登记证书
  - 红十字会、慈善组织的法人登记证书
  - 项目资产确权登记证书
output:
  fields:
  - name: 业务主管单位
    type: string
    description: 提取 业务主管单位 的文本值
  - name: 业务范围
    type: string
    description: 提取 业务范围 的文本值
  - name: 产权单位全称
    type: string
    description: 提取 产权单位全称 的文本值
  - name: 工程名称
    type: string
    description: 提取 工程名称 的文本值
  - name: 有效期限
    type: string
    description: 提取 有效期限 的文本值
  - name: 登记日期
    type: date
    description: 提取 登记日期 的日期值，格式 YYYY-MM-DD
  - name: 证书编号
    type: string
    description: 提取 证书编号 的文本值
  - name: 资产明细列表
    type: string
    description: 提取 资产明细列表 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (业务主管单位.业务主管单位 IS NOT NULL AND 业务主管单位.业务主管单位 包含 行政机关名称) OR (关系类型、脱钩状态.关系类型 IN ('主办', '主管', '联系', '挂靠') AND 关系类型、脱钩状态.脱钩状态
    != '已完成')
  description: 章程或登记证书中仍列示行政机关为业务主管单位，或关联关系对照表中标明存在主办、主管、联系、挂靠关系且脱钩状态未完成，即触发疑点。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 未取消主办主管挂靠关系
  regulation: "[\n  {\n    \"法规名称\": \"行业协会商会与行政机关脱钩总体方案\",\n    \"法规文号\": \"中办发〔2015〕39号\",\n    \"效力级别\": \"党内法规/规范性文件\"\
    ,\n    \"条款号\": \"第二条主要任务（一）机构分离\",\n    \"内容概述\": \"取消行政机关（包括下属单位）与行业协会商会的主办、主管、联系和挂靠关系，行业协会商会依法直接登记和独立运行。\"\n  }\n]"
- expression: (已竣工供水工程总数 - 登记证书.证书编号 > 0) || (责任清单.管护单位 = '' OR 责任清单.具体责任人 = '') || (确认书.签订日期 = '' OR 确认书 IS NULL)
  description: 产权证书未覆盖全部工程、管护责任清单中责任主体或责任人空缺、未按时签订书面责任确认书，任一条件满足即判定违规。
  audit_item: 工程建后管护不到位
  suspicion: 农村饮水工程产权、管护主体和责任不明确
  regulation: "[\n  {\n    \"法规名称\": \"水利部关于进一步加强农村饮水安全工程运行管护工作的指导意见\",\n    \"法规文号\": \"水农〔2015〕306号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二、明确管护主体和责任\",\n    \"内容概述\": \"农村饮水安全工程应明晰工程产权，落实管护主体、管护责任，确保工程有人管、管得好，长期发挥效益。\"\n  }\n]"
- expression: (登记台账.权属人名称 == null || 登记台账.权属人名称 == '') || (登记证书.移交方和接收方盖章 == null) || (项目清单.形成资产清单 NOT IN 登记台账.资产ID)
  description: 资产台账中“权属人”字段为空或缺失，表明权属不清；移交协议缺少村集体或合作社等接收方签章，表明产权移交手续不完备；项目清单中已形成的资产在确权台账中完全不存在，表明确权登记有重大遗漏。
  audit_item: 帮扶产业发展基础不牢
  suspicion: 帮扶项目资产权属登记存在模糊或空白
  regulation: "[\n  {\n    \"法规名称\": \"关于加强扶贫项目资产后续管理的指导意见\",\n    \"法规文号\": \"国办函〔2021〕51号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第二部分第（二）条\",\n    \"内容概述\": \"要摸清扶贫项目资产底数。对党的十八大以来使用各级财政资金、地方政府债券资金、东西部协作、社会捐赠等投入形成的扶贫项目资产，进行全面摸底，分类建立管理台账。\"\
    \n  },\n  {\n    \"法规名称\": \"关于加强扶贫项目资产后续管理的指导意见\",\n    \"法规文号\": \"国办函〔2021〕51号\",\n    \"效力级别\": \"行政法规\",\n   "
