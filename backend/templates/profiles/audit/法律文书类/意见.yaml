name: audit/法律文书类/意见
type: model
description: 从法律文书类类文档（意见）中提取结构化元数据。涵盖字段如：专家否定性意见、专家签字、专家结论、主要风险提示、反馈的规范性问题条目、发文日期、审核结论、审核部门。文档范围包括：专家论证意见、专家评审意见、地方优势特色农产品保险申报材料审核意见、技术方案的专家评审意见、相关部门审核意见（文件8）、省级农业农村部门发布的家庭农场发展指导意见、营养师审核意见、财政部门或上级单位审核反馈意见、项目申报材料审批部门审核意见、黑土地保护项目验收专家评审意见等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 整改
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 意见
  member_count: 1
  member_details:
  - 专家论证意见
  - 专家评审意见
  - 地方优势特色农产品保险申报材料审核意见
  - 技术方案的专家评审意见
  - 相关部门审核意见（文件8）
  - 省级农业农村部门发布的家庭农场发展指导意见
  - 营养师审核意见
  - 财政部门或上级单位审核反馈意见
  - 项目申报材料审批部门审核意见
  - 黑土地保护项目验收专家评审意见
output:
  fields:
  - name: 专家否定性意见
    type: string
    description: 提取 专家否定性意见 的文本值
  - name: 专家签字
    type: string
    description: 提取 专家签字 的文本值
  - name: 专家结论
    type: string
    description: 提取 专家结论 的文本值
  - name: 主要风险提示
    type: string
    description: 提取 主要风险提示 的文本值
  - name: 反馈的规范性问题条目
    type: string
    description: 提取 反馈的规范性问题条目 的文本值
  - name: 发文日期
    type: date
    description: 提取 发文日期 的日期值，格式 YYYY-MM-DD
  - name: 审核结论
    type: string
    description: 提取 审核结论 的文本值
  - name: 审核部门
    type: string
    description: 提取 审核部门 的文本值
  - name: 整改意见
    type: string
    description: 提取 整改意见 的文本值
  - name: 文件存在性
    type: string
    description: 提取 文件存在性 的文本值
  - name: 文件文号
    type: string
    description: 提取 文件文号 的文本值
  - name: 是否包含动态管理条款
    type: number
    description: 提取 是否包含动态管理条款 的数值（含单位，如万元、吨等）
  - name: 是否包含土地保障条款
    type: number
    description: 提取 是否包含土地保障条款 的数值（含单位，如万元、吨等）
  - name: 是否包含认定程序条款
    type: number
    description: 提取 是否包含认定程序条款 的数值（含单位，如万元、吨等）
  - name: 是否包含财政扶持条款
    type: number
    description: 提取 是否包含财政扶持条款 的数值（含单位，如万元、吨等）
  - name: 是否发现计划外项目
    type: boolean
    description: 提取 是否发现计划外项目 的布尔值（是/否）
  - name: 申报单位
    type: string
    description: 提取 申报单位 的文本值
  - name: 申报品种名称
    type: string
    description: 提取 申报品种名称 的文本值
  - name: 申报项目总投资
    type: string
    description: 提取 申报项目总投资 的文本值
  - name: 设计进出水水质
    type: string
    description: 提取 设计进出水水质 的文本值
  - name: 评审结论
    type: string
    description: 提取 评审结论 的文本值
  - name: 调整建议
    type: string
    description: 提取 调整建议 的文本值
  - name: 采纳情况
    type: string
    description: 提取 采纳情况 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (填报说明文本.必填章节清单 < 必填章节清单.必填章节清单) || (决算报表.变动率 > 0.2 AND 填报说明文本.特殊事项解释阈值规则 = '该支出项变动说明为空')
  description: 规范性判定依据两点：一是填报说明的结构完整性，若缺失模板规定的任意必填章节（如“重大事项说明”“主要指标变动说明”等），视为不规范；二是关键数据变动的解释充分性，当决算报表中任一支出科目的变动率超过20%（即ABS(本年支出-上年支出)/上年支出
    > 0.2）时，对应的填报说明中必须包含具体的变动原因说明，否则即为不规范。两项条件满足其一即触发疑点。
  audit_item: 决算报告编报事项不准确
  suspicion: 决算填报说明编报不符合规范性要求
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"部门决算报表应当根据完整、核对无误的账簿记录和其他有关会计核算资料编制，做到数据真实准确、内容完整……部门决算填报说明应当按照财政部门规定的格式和要求编制，如实反映预算执行情况、财务管理状况和决算编制中需要说明的事项。\"\
    \n  }\n]"
- expression: 意见.文件存在性 == false || 意见.发文日期 - 其他.发文日期 > 365 && (意见.是否包含财政扶持条款 == false || 意见.是否包含土地保障条款 == false || 意见.是否包含认定程序条款
    == false || 意见.是否包含动态管理条款 == false)
  description: 判定省级部门是否按规定出台指导意见。条件1：省级文件完全不存在；或条件2：省级文件发布超过国家上位文件一年以上，且文件缺少财政、土地、认定程序、动态管理等任一关键要素。满足任一条件即视为制度不健全。
  audit_item: 家庭农场认定制度不健全
  suspicion: 省级农业农村部门未按规定出台家庭农场发展指导意见
  regulation: "[\n  {\n    \"法规名称\": \"关于实施家庭农场培育计划的指导意见\",\n    \"法规文号\": \"农政发〔2019〕16号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二条第四项\",\n    \"内容概述\": \"要求各地结合实际出台省级家庭农场培育计划或指导意见，明确财政、用地、金融等扶持政策，建立健全认定标准和登记名录制度。\"\n  }\n]"
- expression: 实施方案状态 == '未编制' || (评审结论 != '通过' && 闭环状态 == '未整改' && 进度滞后率 > 0.2) || (技术路线适应性 == '不适用' && 调整记录 == '无')
  description: 未编制实施方案即违规；方案未通过专家评审且未整改闭环仍实施，导致进度滞后超20%，或技术路线明确不适用本地条件且未作出调整，均视为脱离实际。
  audit_item: 项目规划统筹衔接不到位
  suspicion: 项目实施方案缺失或不可行
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条、第十六条\"\
    ,\n    \"内容概述\": \"项目单位应当编制初步设计及概算，未经批准不得擅自变更建设地点、建设规模和建设内容；项目应按批准的设计方案实施。\"\n  }\n]"
- expression: 中央补助项目清单（表1）.项目编码 IS NOT NULL AND 中央补助项目清单（表1）.项目编码 NOT IN (SELECT 地方保障性安居工程项目库（表2）.项目编码 FROM 地方保障性安居工程项目库（表2）
    UNION SELECT 地方年度建设计划文件（文件2）.计划项目编码 FROM 地方年度建设计划文件（文件2）)
  description: 检查获得中央补助的项目（表1）是否全部存在于地方保障性安居工程项目库（表2）或年度建设计划文件（文件2）中。若补助项目未纳入任何官方计划，即触发疑点。该表达式通过项目编码关联，凡是表1中项目编码对应不到计划库记录的，均为高风险项目。
  audit_item: 不符合条件项目违规获得保障性安居工程建设中央预算内投资补助
  suspicion: 未纳入建设计划的项目获得中央投资补助
  regulation: "[\n  {\n    \"法规名称\": \"中央预算内投资保障性安居工程专项管理暂行办法\",\n    \"法规文号\": \"发改投资规〔2019〕1097号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"申报中央预算内投资补助的项目，必须纳入国家重大建设项目库和三年滚动投资计划，未纳入的不得安排中央预算内投资。\"\n  }\n]"
- expression: (评估表.能量达标率 < 90%) || (评估表.蛋白质供能比 < 12% || 评估表.蛋白质供能比 > 14%) || (评估表.蔬菜种类数 < 3种)
  description: 参照《学生餐营养指南》WS/T 554-2017，能量供给应达到推荐量的90%及以上，蛋白质供能比宜为12%-14%，每日蔬菜种类不少于3种。连续不达标即构成膳食营养违规。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 供餐模式与营养搭配不科学
  regulation: "[\n  {\n    \"法规名称\": \"学生餐营养指南\",\n    \"法规文号\": \"WS/T 554-2017\",\n    \"效力级别\": \"行业标准\",\n    \"条款号\"\
    : \"4.1、4.2\",\n    \"内容概述\": \"学生餐一日三餐应满足能量和营养素推荐摄入量，蛋白质供能比宜为12%-14%，食物种类应多样化，每天应包括谷薯杂豆类、蔬菜水果类等。\"\n  }\n]"
