name: audit/法律文书类/执照
type: model
description: 从法律文书类类文档（执照）中提取结构化元数据。涵盖字段如：主要管理人员名单、企业名称、出资总额、商户名称、实收资本、成员人数、成立日期、投标单位股东信息。文档范围包括：参与企业的营业执照、商户营业执照、担保公司营业执照、施工单位营业执照、营业执照等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 人员
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 执照
  member_count: 1
  member_details:
  - 参与企业的营业执照
  - 商户营业执照
  - 担保公司营业执照
  - 施工单位营业执照
  - 营业执照
output:
  fields:
  - name: 主要管理人员名单
    type: string
    description: 提取 主要管理人员名单 的文本值
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 出资总额
    type: number
    description: 提取 出资总额 的数值（含单位，如万元、吨等）
  - name: 商户名称
    type: string
    description: 提取 商户名称 的文本值
  - name: 实收资本
    type: string
    description: 提取 实收资本 的文本值
  - name: 成员人数
    type: number
    description: 提取 成员人数 的数值（含单位，如万元、吨等）
  - name: 成立日期
    type: date
    description: 提取 成立日期 的日期值，格式 YYYY-MM-DD
  - name: 投标单位股东信息
    type: string
    description: 提取 投标单位股东信息 的文本值
  - name: 有效期截止日
    type: string
    description: 提取 有效期截止日 的文本值
  - name: 法定代表人
    type: string
    description: 提取 法定代表人 的文本值
  - name: 注册地址
    type: string
    description: 提取 注册地址 的文本值
  - name: 注册资本
    type: string
    description: 提取 注册资本 的文本值
  - name: 经营范围
    type: string
    description: 提取 经营范围 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (参与企业的营业执照.经营范围 NOT LIKE '%农产品%' && 参与企业的营业执照.经营范围 NOT LIKE '%电商%') || (资质证书.有效期 < 当前审计基准日) || (国家企业信用信息公示系统查询记录.严重违法失信名单
    = '是') || (企业资质审查结果汇总表.一票否决项命中标记 = '是' && 企业资质审查结果汇总表.最终审批意见 = '是') || (合作协议.约定投资额 > 银行流水.金额 * 1.5)
  description: 营业执照经营范围不含农产品或电商相关即为不符；资质证书过期失效；存在严重失信记录却未一票否决；审查表中命中否决项但获批通过；合作协议承诺投资远超实际到位资金50%以上，表明企业履约能力存疑或虚假承诺。
  audit_item: “互联网+”农产品出村进城工程实施不到位
  suspicion: 试点参与企业不符合申报准入条件
  regulation: "[\n  {\n    \"法规名称\": \"“互联网+”农产品出村进城工程试点工作方案\",\n    \"法规文号\": \"农办市〔2020〕7号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"三、试点企业遴选条件\",\n    \"内容概述\": \"参与试点企业应为具备较强实力的农业龙头企业、电商企业或物流企业，无严重失信记录，经营范围涵盖农产品生产、加工、流通、电商等相关领域。\"\n\
    \  }\n]"
- expression: (执照.经营范围 != 章程.经营范围) OR (备案表.成员人数 != 名册表.成员总数) OR (备案表.年报信息 = '未报') OR (执照.登记状态 = '经营异常')
  description: 合作社的工商登记信息应与章程及内部记录一致；未按时公示年度报告、被列入经营异常名录均属违规。任意一项不一致即触发疑点。
  audit_item: 农民专业合作社认定不合规
  suspicion: 未依法进行工商登记或登记信息不实
  regulation: "[\n  {\n    \"法规名称\": \"农民专业合作社登记管理条例\",\n    \"法规文号\": \"中华人民共和国国务院令第498号（2014年修订）\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条、第四条、第十七条\",\n    \"内容概述\": \"农民专业合作社依照本条例登记，取得法人资格。合作社登记事项包括名称、住所、成员出资总额、业务范围等。登记事项发生变更的，应当申请变更登记。合作社应于每年1月1日至6月30日，通过企业信用信息公示系统报送上一年度年度报告。\"\
    \n  }\n]"
- expression: (许可证.许可作物种类 not.in 年度储备任务计划文件.计划储备品种) || (评估表.有效库容 < 储备任务分解表.计划总数量) || ((评估表.温湿度控制设备 == "无" || 评估表.防潮通风设施 ==
    "不达标") && 监测表.种子霉变记录 > 0)
  description: 种子经营许可证的许可范围未覆盖储备品种即属超范围承储；库容小于任务计划总量则仓储能力先天不足；仓库缺乏必要的温湿度控制设备且库存记录已出现霉变，证明管理能力实质性缺失。三项条件任一成立即构成疑点。
  audit_item: 救灾备荒种子储备方面不符合相关规定
  suspicion: 承储企业资质不达标或储备管理能力不足
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"2021年修订版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十一条、第六十条\",\n    \"内容概述\": \"从事种子生产经营须取得种子生产经营许可证；承担救灾备荒种子储备任务的企业应具备相应的仓储设施、技术能力和信用条件。\"\n  }\n]"
- expression: (检查记录中存在建设行为或经营行为) && (该行为对应的建设/经营活动审批记录中无审批通过记录) || (执照.经营范围包含保护区内禁止性业态，如烧烤、KTV等)
  description: 保护区内所有建设、经营活动均需审批并符合保护要求，若检查记录中存在活动但审批台账查无记录，或者营业执照核准的经营范围与保护区禁止业态冲突，即构成违规。
  audit_item: 违反传统村落保护相关政策的行为
  suspicion: 传统村落保护区内建设或经营活动审批管理不合规
  regulation: "[\n  {\n    \"法规名称\": \"《历史文化名城名镇名村保护条例》\",\n    \"法规文号\": \"国务院令第524号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二十四条\",\n    \"内容概述\": \"在保护范围内进行建设活动，应当符合保护规划的要求，依法办理审批手续。\"\n  }\n]"
- expression: (业务台账.担保人名称 NOT IN (名录.机构名称)) || (执照.有效期 < 业务台账.担保日期) || (执照.许可范围 NOT LIKE '%住房公积金贷款担保%')
  description: 担保机构未在住房公积金管理中心备案合作名录中，或资质证书已过期，或许可范围未明确包含住房公积金贷款担保业务，任意条件满足即判定为无资质违规经营。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 无担保资质违规开展公积金贷款担保业务
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"设立融资担保公司，应当经监督管理部门批准。未经监督管理部门批准，任何单位和个人不得经营融资担保业务。\"\n  }\n]"
- expression: (担保公司.实收资本 < 资质要求.最低注册资本要求) || (流水.交易日期 - 验资报告.实缴日期 <= 60 && 流水.贷方金额 >= 验资报告.验资金额*0.9 && 流水.对方户名 IN (股东名册))
  description: 实收资本低于当地公积金中心规定的担保公司最低注册资本限额（如地方要求1亿元），或验资后60日内有大额资金转回股东账户且金额达到或超过验资金额的90%，即认定为资本不实或抽逃出资。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 担保公司注册资本不实或低于监管标准
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"设立融资担保公司应当符合最低限额的实缴注册资本要求，具体限额由省、自治区、直辖市根据本地实际确定，但不得低于人民币2000万元。\"\n  }\n]"
- expression: (许可证 IS NULL) || (许可证.有效期 < 当前日期) || (统计表.关键岗位人员持证情况 < 100%) || (记录表.维护记录完整性 > 5) || (统计表.管网漏损率 > 30%)
  description: 判定标准：1.无卫生许可证或过期属违法经营；2.水处理工、化验员等关键岗位须100%持有效健康证和职业资格证书；3.消毒设备连续5天无运行记录或维护记录空缺视为设备闲置；4.管网漏损率超30%反映资产运维严重失职。
  audit_item: 水质保障和工程运营管理不到位
  suspicion: 集中供水单位无证经营或运营管理不到位
  regulation: "[\n  {\n    \"法规名称\": \"生活饮用水卫生监督管理办法\",\n    \"法规文号\": \"建设部、卫生部令第53号（2016年修订）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第六条、第七条、第十一条\",\n    \"内容概述\": \"集中式供水单位必须取得卫生许可证，直接从事供水、管水的人员须取得健康合格证，供水设施应定期清洗消毒并做好记录。\"\n  },\n \
    \ {\n    \"法规名称\": \"城镇供水管网漏损控制及评定标准\",\n    \"法规文号\": \"CJJ 92-2016\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"3.0.1\"\
    ,\n    "
