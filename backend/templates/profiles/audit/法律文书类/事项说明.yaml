name: audit/法律文书类/事项说明
type: model
description: 从法律文书类类文档（事项说明）中提取结构化元数据。涵盖字段如：申请理由。文档范围包括：规避公开招标事项说明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 事项说明
  member_count: 1
  member_details:
  - 规避公开招标事项说明
output:
  fields:
  - name: 申请理由
    type: string
    description: 提取 申请理由 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 明细表.采购金额 >= 公开招标限额标准 AND 明细表.采购方式 != '公开招标' AND (事项说明.审批意见 != '同意' OR 事项说明 IS NULL)
  description: 公开招标限额标准依据当地当年度政府集中采购目录及限额标准执行，如货物或服务单项或批量预算金额达到200万元以上须公开招标。当项目金额达到限额但采购方式非公开招标，且无有效审批记录或审批未通过时，判定为违规规避公开招标。
  audit_item: 政府采购组织管理不规范
  suspicion: 应公开招标未招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十六条、第二十七条、第二十八条\",\n    \"内容概述\": \"政府采购公开招标应作为主要采购方式；采购人不得将应当以公开招标方式采购的货物或服务化整为零或者以其他任何方式规避公开招标采购；达到公开招标数额标准的项目，因特殊情况需要采用公开招标以外方式的，应当在采购活动开始前获得设区的市、自治州以上人民政府采购监督管理部门的批准。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n   "
- expression: SAME_DEPT_AND_SUPPLIER_GROUP(采购单位, 供应商) AND SAME_CATEGORY_OR_SIMILAR(采购品目) AND (MAX(合同签订日期) - MIN(合同签订日期)) <=
    180天 AND SUM(采购金额) >= 公开招标限额标准 AND COUNT(合同) >= 2 AND 采购方式 NOT IN ('公开招标') AND (审批记录缺失 OR 审批意见 != '同意')
  description: 利用分组聚合判断：同一采购单位、同一供应商、采购品目相同或类似、在半年内（180天）签订多份合同，累计金额达到公开招标限额标准但均未采用公开招标，且无合法拆分审批手续的，认定为化整为零规避招标。时间窗口可根据审计需要调整。
