name: audit/法律文书类/产权证明
type: model
description: 从法律文书类类文档（产权证明）中提取结构化元数据。涵盖字段如：产权归属、产权面积、功能区域分布、场地用途限定条款、房产地址、房屋规划用途、签订日期、约定使用性质。文档范围包括：书屋场地使用协议或产权证明、购房合同或产权证明、载体产权证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 产权证明
  member_count: 1
  member_details:
  - 书屋场地使用协议或产权证明
  - 购房合同或产权证明
  - 载体产权证明
output:
  fields:
  - name: 产权归属
    type: string
    description: 提取 产权归属 的文本值
  - name: 产权面积
    type: string
    description: 提取 产权面积 的文本值
  - name: 功能区域分布
    type: string
    description: 提取 功能区域分布 的文本值
  - name: 场地用途限定条款
    type: number
    description: 提取 场地用途限定条款 的数值（含单位，如万元、吨等）
  - name: 房产地址
    type: string
    description: 提取 房产地址 的文本值
  - name: 房屋规划用途
    type: string
    description: 提取 房屋规划用途 的文本值
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 约定使用性质
    type: string
    description: 提取 约定使用性质 的文本值
  - name: 购房人姓名
    type: string
    description: 提取 购房人姓名 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (COUNT(实际开放日期、开放时段、锁闭记录.实际开放日期) / 管理员职责.规定开放天数 * 统计周期周数 < 0.8) || (DATEDIFF(MAX(借阅日期、借阅人、书籍名称、归还状态、借阅频率、借阅人次、月借阅人次、借阅册数.借阅日期),
    MIN(借阅日期、借阅人、书籍名称、归还状态、借阅频率、借阅人次、月借阅人次、借阅册数.借阅日期)) > 90 AND COUNT(借阅日期、借阅人、书籍名称、归还状态、借阅频率、借阅人次、月借阅人次、借阅册数.借阅人) == 0) ||
    (场地用途限定条款、产权归属、房屋规划用途、约定使用性质.约定使用性质 != '农家书屋' OR 场地用途
  description: 判定开放不合规：实际开放天数与制度规定比值低于80%，或借阅记录连续3个月以上为空且无借阅人，表明书屋未正常开放；场地协议中用途非书屋或存在出租转租约定，直接构成违规占用；已存在整改通知的为历史违规记录。条件满足任一即判为疑点。
  audit_item: 农家书屋建设运营管护不合规
  suspicion: 农家书屋被违规占用或长期锁闭
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"农家书屋必须保障开放时间，每周不少于5天，严禁挤占、挪用书屋场地，确保为农民提供阅读服务。\"\n  }\n]"
- expression: 场地用途限定条款.约定使用性质 != '农家书屋' && (其他.值班记录连续性 || 登记表.月借阅人次) && 登记台账.场地物理状态（是否堆放杂物、有无办公桌椅）
  description: 当现场核实书屋空间被用于非阅读类活动（如改为办公室、小卖部、仓库），且考勤表显示长期无专职管理人员值守、借阅登记表持续无读者记录，同时现场存在办公家具、商品货架等与书屋功能无关物品时，判定为违规占用。
  audit_item: 农家书屋建设运营管护不符合相关规定
  suspicion: 农家书屋场地被违规占用挪作他用
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"新出印发〔2007〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"农家书屋用房由当地村民委员会无偿提供，应确保房屋安全、专用，任何单位和个人不得挤占、挪用。\"\n  }\n]"
- expression: 公共租赁住房申请审核材料.提交日期 > 购房合同或产权证明.签订日期 && 公共租赁住房申请审核材料.承诺内容包含 '无自有住房' && 公共租赁住房保障对象基本信息表.保障资格取得日期 > 购房合同或产权证明.签订日期
    && 公共租赁住房保障对象基本信息表.保障状态 == '在保'
  description: 申请人在申请公租房时已签订购房合同或拥有房产，却虚假承诺无房，骗取保障资格。购房合同签订日期早于申请提交日期为关键判定。
  audit_item: 住房保障对象不再符合条件时未及时退出或调整待遇
  suspicion: 通过虚假材料骗取公共租赁住房资格
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十五条\",\n    \"内容概述\": \"申请人隐瞒有关情况或者提供虚假材料申请公共租赁住房的，住房保障主管部门不予受理，给予警告，并记入公共租赁住房管理档案。\"\n  },\n  {\n    \"法规名称\":\
    \ \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"虚报冒领财政资金行为的，"
- expression: (申报面积、入驻企业清单、孵化功能说明.申报面积 < 对照表.最低面积) OR (申报面积、入驻企业清单、孵化功能说明.入驻企业清单.企业总数 < 对照表.最低入驻企业数) OR ( (COUNT(申报面积、入驻企业清单、孵化功能说明.入驻企业清单.企业名称)
    - COUNT(入驻企业工商状态正常且社保缴纳人数>0)) / COUNT(申报面积、入驻企业清单、孵化功能说明.入驻企业清单.企业名称) > 0.2 ) OR (声明.关联企业名称 = True) OR (载体已获得补贴 AND 申报面积、入驻企业清单、孵化功能说明.认定评审得分
    < 合格线)
  description: 触发条件：申报面积或入驻企业数不达标；入驻企业清单中超过20%为虚假空壳企业（工商异常或无社保缴纳）；评审专家与载体股东存在关联关系；在未达到认定标准的情况下已获取补贴资金。满足任一条件视为违规。
  audit_item: 创业载体政策执行不到位
  suspicion: 违规认定创业载体骗取政策补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"各地应严格按规定范围、标准和程序使用就业补助资金，不得擅自扩大支出范围、提高支出标准，不得用于与就业创业无关的支出，确保资金安全规范有效使用。\"\n  },\n  {\n \
    \   \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"\
    内容概述\": \"国"
