name: audit/法律文书类/批文
type: model
description: 从法律文书类类文档（批文）中提取结构化元数据。涵盖字段如：保护区范围坐标、公积金最高缴存比例上限、划定级别、受益期限或条件、审批人、审批金额、审批项目、批准收费标准。文档范围包括：企业有关津补贴发放的会议纪要或批文、住房公积金缴存比例政府批文、政府批文、政府补助批文、行业监管部门批文、行政事业性收费相关政府批文、饮用水源保护区划定政府批文等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 审批
- 金额
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 批文
  member_count: 1
  member_details:
  - 企业有关津补贴发放的会议纪要或批文
  - 住房公积金缴存比例政府批文
  - 政府批文
  - 政府补助批文
  - 行业监管部门批文
  - 行政事业性收费相关政府批文
  - 饮用水源保护区划定政府批文
output:
  fields:
  - name: 保护区范围坐标
    type: string
    description: 提取 保护区范围坐标 的文本值
  - name: 公积金最高缴存比例上限
    type: number
    description: 提取 公积金最高缴存比例上限 的数值（含单位，如万元、吨等）
  - name: 划定级别
    type: string
    description: 提取 划定级别 的文本值
  - name: 受益期限或条件
    type: string
    description: 提取 受益期限或条件 的文本值
  - name: 审批人
    type: string
    description: 提取 审批人 的文本值
  - name: 审批金额
    type: number
    description: 提取 审批金额 的数值（含单位，如万元、吨等）
  - name: 审批项目
    type: string
    description: 提取 审批项目 的文本值
  - name: 批准收费标准
    type: number
    description: 提取 批准收费标准 的数值（含单位，如万元、吨等）
  - name: 批准收费项目名称
    type: number
    description: 提取 批准收费项目名称 的数值（含单位，如万元、吨等）
  - name: 批准日期
    type: date
    description: 提取 批准日期 的日期值，格式 YYYY-MM-DD
  - name: 批复日期
    type: date
    description: 提取 批复日期 的日期值，格式 YYYY-MM-DD
  - name: 缴存基数上限
    type: string
    description: 提取 缴存基数上限 的文本值
  - name: 补偿总金额
    type: number
    description: 提取 补偿总金额 的数值（含单位，如万元、吨等）
  - name: 补助事由
    type: string
    description: 提取 补助事由 的文本值
  - name: 补助条件
    type: string
    description: 提取 补助条件 的文本值
  - name: 补助用途
    type: string
    description: 提取 补助用途 的文本值
  - name: 补助用途描述
    type: string
    description: 提取 补助用途描述 的文本值
  - name: 补助金额
    type: number
    description: 提取 补助金额 的数值（含单位，如万元、吨等）
  - name: 银保监会-证监会的行政许可文号
    type: string
    description: 提取 银保监会-证监会的行政许可文号 的文本值
  - name: 面积
    type: string
    description: 提取 面积 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: ABS(项目清单.实际执收标准 - 批文.批准收费标准) > 0
  description: 通过将实际执收价格与政府批文中规定的价格进行比对，若存在任何绝对差值，则判定为违规。需注意部分收费项目可能设有价格区间或浮动标准，应进一步核实最高上限。
  audit_item: 行业协会商会违规收费
  suspicion: 擅自提高行政事业性收费标准
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第七条\",\n    \"内容概述\": \"执收单位应在收费场所显著位置公示收费项目、标准和依据，并严格按照公示的标准收费，不得擅自增加收费项目或提高收费标准。\"\n  }\n]"
- expression: 实发工资人数（在编）.发放项目名称 NOT IN 允许发放的津补贴项目名称、发放标准、发放范围.允许发放的津补贴项目名称 || (实发工资人数（在编）.发放项目名称 == 允许发放的津补贴项目名称、发放标准、发放范围.允许发放的津补贴项目名称
    && 实发工资人数（在编）.发放金额 > 允许发放的津补贴项目名称、发放标准、发放范围.发放标准)
  description: 判定规则：1. 检查实际发放的津补贴项目是否在企业制度或上级批准的合规清单内；2. 对于合规清单内的项目，检查其发放金额是否超出规定的标准上限。两个条件满足其一即判定违规。
  audit_item: 未严格落实中央八项规定及实施细则精神
  suspicion: 违规发放津贴补贴或福利
  regulation: "[\n  {\n    \"法规名称\": \"违规发放津贴补贴行为处分规定\",\n    \"法规文号\": \"中华人民共和国监察部、人力资源和社会保障部令第31号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"违反规定自行新设项目或者继续发放已经明令取消的津贴补贴的；超过规定标准、范围发放津贴补贴的，给予处分。\"\n  },\n  {\n   \
    \ \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第四十二条\",\n  \
    \  \"内容概述\": "
- expression: IF ( (补助台账.补助类型 = "与资产相关" OR 批文.补助用途 LIKE "%购建%") AND (ABS(本期发生额、补助来源.本期发生额 - 补助台账.补助金额) < 0.01) AND (递延收益科目本期贷方发生额.递延收益科目本期贷方发生额
    = 0 OR 递延收益科目本期贷方发生额.无此笔补助记录) ) THEN 疑点；ELSE IF (批文.款项分期确认 = "是" AND 补助台账.本期确认收益金额 = 补助台账.补助全额 AND 批文.期数 > 1) THEN 疑点
  description: 当补助批文明示用途为购建长期资产或台账分类为与资产相关时，企业应将补助款确认为递延收益并分期摊销；若企业当期直接将全额补助计入其他收益或营业外收入，且递延收益科目未记录该补助，则违规。此外，如果批文规定按项目进度分期确认收益，但企业一次性全额确认，也属违规。
  audit_item: 未按规定核算政府补助
  suspicion: 将资本性或跨期补助全额确认当期收益
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第16号——政府补助\",\n    \"法规文号\": \"财会[2017]15号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条、第八条\",\n    \"内容概述\": \"与资产相关的政府补助，应当冲减相关资产的账面价值或确认为递延收益，在相关资产使用寿命内分期计入损益；与收益相关的政府补助用于补偿企业以后期间的相关成本费用或损失的，应确认为递延收益，并在确认相关成本费用或损失的期间计入当期损益或冲减相关成本。\"\
    \n  }\n]"
- expression: ((补助事由（灾害救助、奖励、研发等）.补助用途 LIKE '%建设%' OR '%设备%' OR '%购建%') AND 补助事由（灾害救助、奖励、研发等）.补助类型（与资产/收益相关） = '与收益相关' AND
    日记账.发生额 / 补助事由（灾害救助、奖励、研发等）.补助金额 > 0.5) OR ((补助事由（灾害救助、奖励、研发等）.补助用途 LIKE '%稳岗%' OR '%薪酬%' OR '%补偿日常成本%') AND 补助事由（灾害救助、奖励、研发等）.补助类型（与资产/收益相关）
    = '与资产相关' AND 会计凭证.贷方科目 > 0)
  description: 如果补助批文明确补助用于购建长期资产，企业却将其划分为与收益相关且直接计入当期损益，或补助用途为补偿人工等日常成本，却被划分为与资产相关并分期摊销，均构成分类错误。阈值设定为：资产相关补助错误归类为收益相关且超过50%金额已计入当期收益，或收益相关补助错误归类为资产相关且已确认递延收益。
  audit_item: 未按规定核算政府补助
  suspicion: 政府补助类型划分错误导致损益核算不当
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第16号——政府补助\",\n    \"法规文号\": \"财会[2017]15号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条、第九条\",\n    \"内容概述\": \"企业应当根据政府补助的性质和条件，合理区分与资产相关的政府补助和与收益相关的政府补助。与资产相关的政府补助，是指企业取得的、用于购建或以其他方式形成长期资产的政府补助。与收益相关的政府补助，是指除与资产相关的政府补助之外的政府补助。\"\
    \n  }\n]"
- expression: ((批文.补助事由（灾害救助、奖励、研发等） LIKE '%灾害%' OR '%重建%' OR '%自然灾害%' OR 补助台账.与日常活动相关性标识 = '否') AND 明细表.发生额 > 0) OR ((批文.补助事由（灾害救助、奖励、研发等）
    LIKE '%研发%' OR '%高新技术%' OR '%稳岗%' OR 补助台账.与日常活动相关性标识 = '是') AND 明细表.发生额 > 0)
  description: 根据准则，与日常活动无关的补助（如灾后重建、非经常性损失补偿）应计入营业外收支；与日常活动相关的补助（如研发奖励、高新认定奖励）应计入其他收益或冲减成本。若企业反向处理，则违规。表达式通过补助事由关键词或台账标注的“日常活动相关性”判断。
  audit_item: 未按规定核算政府补助
  suspicion: 日常活动无关补助计入其他收益或相关补助计入营业外收支
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第16号——政府补助\",\n    \"法规文号\": \"财会[2017]15号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十一条\",\n    \"内容概述\": \"与企业日常活动相关的政府补助，应当按照经济业务实质，计入其他收益或冲减相关成本费用。与企业日常活动无关的政府补助，应当计入营业外收支。\"\n  }\n]"
- expression: (明细表.单位缴存比例 > 批文.公积金最高缴存比例上限) || (明细表.缴存基数 > 批文.缴存基数上限（如当地社平工资3倍）) || (明细表.缴存基数 != 明细表.应发工资 && 明细表.应发工资 > 批文.缴存基数上限（如当地社平工资3倍）)
  description: 缴存比例超过当地政府批文规定的上限（通常12%），或缴存基数超过上限（当地社平工资3倍）即触发可疑；若缴存基数与工资明细表应发工资不一致，且应发工资高于上限，可能虚构基数或拆分工资，需进一步核查。
  audit_item: 违规支付职工薪酬及股份
  suspicion: 超标准缴存住房公积金
  regulation: "[\n  {\n    \"法规名称\": \"关于住房公积金管理若干具体问题的指导意见\",\n    \"法规文号\": \"建金管〔2005〕5号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第一条\",\n    \"内容概述\": \"职工和单位住房公积金的缴存比例不应低于5%，原则上不高于12%；缴存基数不应超过职工工作地所在设区城市统计部门公布的上一年度职工月平均工资的3倍。\"\n\
    \  }\n]"
- expression: SELECT 项目台账.项目名称, 项目台账.项目类型, 批文.银保监会/证监会的行政许可文号 FROM 项目台账 LEFT JOIN 批文 ON 项目台账.项目名称 = 批文.银保监会/证监会的行政许可文号 WHERE
    项目台账.项目类型 IN ('境外投资', '金融衍生品投资', '限制性文化投资') AND (批文.银保监会/证监会的行政许可文号 != '已批准' || 批文.银保监会/证监会的行政许可文号 IS NULL || 批文.银保监会/证监会的行政许可文号
    IS NULL)
  description: 该表达式针对项目类型被标记为境外投资、金融衍生品或限制性文化领域等受特别监管的项目，检查其审批流程跟踪表中的最终审批状态是否为“已批准”，且必备的批文号（如境外投资的发改委备案号、金融业务的经营许可证、文化领域的行业批文）是否完整存在。任何缺失或未批准状态均视为重大违规疑点。
  audit_item: 违规进行重大投资
  suspicion: 未经审批违规开展特别监管类项目投资
  regulation: "[\n  {\n    \"法规名称\": \"企业境外投资管理办法\",\n    \"法规文号\": \"国家发展和改革委员会令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条、第十四条\",\n    \"内容概述\": \"投资主体开展境外投资，应当履行境外投资项目核准、备案等手续。属于核准、备案管理范围的项目，投资主体未取得核准文件或备案通知书的，不得擅自实施。\"\n  }\n\
    ]"
- expression: 政府批文 IS NULL || 批文.保护区范围坐标 != 取水口实际缓冲区域 || (取水口投产日期 > 批文.批复日期+365天)
  description: 1.未划定：无政府关于该水源地保护区的正式批文；2.范围不符：在取水口周围应划定的一级、二级保护区范围未按规定(如一级保护区半径30米)落实；3.划定延迟：工程投产后超过一年仍未完成保护区划定，违反法定要求。满足任一条件即判定为违规。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 饮用水水源保护区未依法划定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第六十三条\",\n    \"内容概述\": \"县级以上人民政府应当划定饮用水水源保护区，报省级人民政府批准，并设立明确的地理界标和警示标志。\"\n  },\n  {\n    \"法规名称\": \"饮用水水源保护区污染防治管理规定\"\
    ,\n    \"法规文号\": \"国家环境保护局、卫生部、建设部、水利部、地矿部（89）环管字第201号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    "
