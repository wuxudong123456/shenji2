name: audit/法律文书类/合同书
type: model
description: 从法律文书类类文档（合同书）中提取结构化元数据。涵盖字段如：合同签订日期、项目编码。文档范围包括：项目合同书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 合同
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 合同书
  member_count: 1
  member_details:
  - 项目合同书
output:
  fields:
  - name: 合同签订日期
    type: date
    description: 提取 合同签订日期 的日期值，格式 YYYY-MM-DD
  - name: 项目编码
    type: string
    description: 提取 项目编码 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 投资计划分解下达表.计划下达日期 > 内部制度.规定的计划下达截止日期
  description: 若计划实际下达日期晚于单位内部制度或上级主管部门规定的截止日期，则触发违规。此表达式用于审查下达的时效性。
  audit_item: 项目计划分解下达不合规
  suspicion: 项目投资计划未在规定时限内下达
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当根据预算安排及时下达。\"\n  },\n  {\n    \"法规名称\": \"关于加强中央预算内投资管理有关问题的通知\",\n    \"法规文号\": \"发改投资〔2017〕1806号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各地、各部门要切实加快投资计划分解下达进度，明确各环节时间节点。\"\n  }\n]"
