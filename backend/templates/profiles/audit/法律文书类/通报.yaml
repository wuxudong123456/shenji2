name: audit/法律文书类/通报
type: model
description: 从法律文书类类文档（通报）中提取结构化元数据。涵盖字段如：受影响农户清单、地点、滞后认定、灾害发生时间、督办意见、考核结论及认定滞后项。文档范围包括：上级部门关于禁捕工作的考核通报、灾害/突发事件官方通报等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 通报
  member_count: 1
  member_details:
  - 上级部门关于禁捕工作的考核通报
  - 灾害/突发事件官方通报
output:
  fields:
  - name: 受影响农户清单
    type: string
    description: 提取 受影响农户清单 的文本值
  - name: 地点
    type: string
    description: 提取 地点 的文本值
  - name: 滞后认定
    type: string
    description: 提取 滞后认定 的文本值
  - name: 灾害发生时间
    type: date
    description: 提取 灾害发生时间 的日期值，格式 YYYY-MM-DD
  - name: 督办意见
    type: string
    description: 提取 督办意见 的文本值
  - name: 考核结论及认定滞后项
    type: string
    description: 提取 考核结论及认定滞后项 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: DATEDIFF(禁捕工作月度进度统计表.实际完成日期, 分阶段禁捕目标的时间节点安排表.计划完成日期, 'day') > 90
  description: 对比各阶段任务的实际完成日期与计划完成日期，若滞后天数超过90天，则判定为重大滞后。已审批的合理延期天数可从滞后天数中扣除，但延期申请需经上级部门批复同意。
  audit_item: 任务目标未按时完成
  suspicion: 分阶段禁捕任务推进滞后
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分“实施重点水域禁捕”\",\n    \"内容概述\": \"要求2019年底前完成水生生物保护区渔民退捕，2020年底前完成长江干流和重要支流除保护区以外水域的渔民退捕，各地需严格按时间节点推进禁捕工作。\"\
    \n  }\n]"
- expression: (NVL(禁捕工作月度进度统计表.实际完成日期, '2099-12-31') - 分阶段禁捕目标的时间节点安排表.计划完成日期) > 0 && 延期申请或未完成情况说明文件.有效延期批复 IS NULL && 禁捕工作月度进度统计表.完成比例
    < 100
  description: 实际完成日期晚于计划完成日期，且无上级批准的延期文件，同时阶段完成比例未达100%，判定为推进滞后。超期3个月以上为严重滞后。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 分阶段实现长江全面禁捕工作推进慢
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"无明确条款\",\n    \"内容概述\": \"要求各地倒排工期、挂图作战，确保按期完成各阶段禁捕目标任务，对进度滞后的予以通报督办。\"\n  }\n]"
- expression: （当前日期 -《返贫重点人群基础信息登记表》.标注为“监测中”状态的最后更新时间） > 365天 || （《灾害通报》.受影响农户名单 NOT IN 《监测对象动态调整工作记录文件》.新增名单 && 灾害发生时间距今
    > 30天） || （《预警信息处置反馈记录表》.处置完成时间 - 预警触发时间 > 15个工作日）
  description: 判定依据：1. 已纳入监测的对象超过1年无任何动态更新记录，视为“一纳了之”缺乏有效跟踪；2. 发生洪灾、疫情等突发风险事件后，受影响农户在30天内仍未反映在动态调整的新增记录中，说明响应迟滞；3. 收到预警信息后超过15个工作日才完成核实处置，违反快速响应时限要求。以上任一情况触发违规。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 未及时动态调整更新监测名单
  regulation: "[\n  {\n    \"法规名称\": \"关于健全防止返贫动态监测和帮扶机制的指导意见\",\n    \"法规文号\": \"中农发〔2021〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"三（一）\",\n    \"内容概述\": \"要坚持日常走访与集中排查相结合，做到监测对象动态调整常态化、长效化。对因灾因病因疫等导致基本生活出现严重困难的农户，要开辟‘绿色通道’，第一时间核实确认，及时纳入监测帮扶。\"\
    \n  }\n]"
