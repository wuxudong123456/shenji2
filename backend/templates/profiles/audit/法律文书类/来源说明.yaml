name: audit/法律文书类/来源说明
type: model
description: 从法律文书类类文档（来源说明）中提取结构化元数据。涵盖字段如：资金性质认定、资金来源方。文档范围包括：资本金来源说明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 来源说明
  member_count: 1
  member_details:
  - 资本金来源说明
output:
  fields:
  - name: 资金性质认定
    type: string
    description: 提取 资金性质认定 的文本值
  - name: 资金来源方
    type: string
    description: 提取 资金来源方 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (权益型/股权类金融工具使用情况表.金融工具出资总额 / 项目资本金总额) > 0.5
  description: 计算通过权益型、股权类金融工具（如永续债、可转债、基金等）筹集的资金占项目资本金总额的比例。若该比例超过50%，则违反了有关金融工具用于资本金的限额规定。
  audit_item: 项目资本金不符合要求
  suspicion: 权益型金融工具出资占比超50%
  regulation: "[\n  {\n    \"法规名称\": \"关于加强固定资产投资项目资本金管理的通知\",\n    \"法规文号\": \"国发〔2019〕26号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第五条\",\n    \"内容概述\": \"对通过发行权益型、股权类金融工具等方式筹措的各类资金，可以认定为投资项目资本金，但此类资金不得超过资本金总额的50%。\"\n  }\n]"
- expression: (项目借贷合同及“名股实债”相关协议.条款内容 CONTAINS ('按期赎回' || '固定利率' || '提供担保' || '保底收益')) && (资本金来源说明及证明材料.资金性质认定 == '项目资本金')
  description: 透过形式审查实质。若一笔被认定为项目资本金的资金，其底层协议中存在按期赎回、固定收益、担保或保底条款等债权特征的条款，则判定其为“名股实债”，属于虚假资本金。该表达式采用关键字匹配逻辑。
  audit_item: 项目资本金不符合要求
  suspicion: 将“名股实债”资金违规认定为资本金
  regulation: "[\n  {\n    \"法规名称\": \"关于加强固定资产投资项目资本金管理的通知\",\n    \"法规文号\": \"国发〔2019〕26号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"投资项目资本金对投资项目来说必须是非债务性资金，项目法人不承担这部分资金的任何利息和债务；投资者可以按其出资的比例依法享有所有者权益，也可转让其出资，但不得以任何方式抽回。\"\
    \n  }\n]"
