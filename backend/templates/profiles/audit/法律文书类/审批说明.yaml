name: audit/法律文书类/审批说明
type: model
description: 从法律文书类类文档（审批说明）中提取结构化元数据。涵盖字段如：审批意见、异地举办理由。文档范围包括：会议选址审批说明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 审批
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 审批说明
  member_count: 1
  member_details:
  - 会议选址审批说明
output:
  fields:
  - name: 审批意见
    type: string
    description: 提取 审批意见 的文本值
  - name: 异地举办理由
    type: string
    description: 提取 异地举办理由 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (通知文件.通知地点 包含于 风景名胜区名录 OR 通知文件.通知地点 != 单位驻地城市) && (报销凭证.目的地城市 = 通知文件.通知地点) && (会议议程.实际举办时间 < 报销凭证.往返时间 * 0.5
    OR 消费凭证.金额 > 0)
  description: 将会议地点与《关于严禁党政机关到风景名胜区开会的通知》所列名录进行匹配，或与单位驻地城市比对。若会议地点在景区名录内或非驻地城市，且存在以下情形之一：1）会议议程中实际开会时间不足差旅总天数的50%（即大部分时间为游览）；2）出现景区门票、游览车等消费凭证，则判定违规。
  audit_item: 未按规定举办会议
  suspicion: 在驻地外或风景名胜区违规举办会议
