name: audit/法律文书类/意见书
type: model
description: 从法律文书类类文档（意见书）中提取结构化元数据。涵盖字段如：不合格项描述、不合格项记录、专家签到表、修改完善确认记录、历史问题记录、反担保合规意见、审查意见批复日期、审核结论。文档范围包括：上市公司担保事项法律意见书、专家论证意见书、内控合规部门审查意见书、外部监管机构检查意见书、消防验收意见书、用地预审意见书、监理单位验收意见书、绩效目标审核意见书、节能评估报告审查意见书、被审计单位反馈意见书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 会议
- 整改
- 验收
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 意见书
  member_count: 1
  member_details:
  - 上市公司担保事项法律意见书
  - 专家论证意见书
  - 内控合规部门审查意见书
  - 外部监管机构检查意见书
  - 消防验收意见书
  - 用地预审意见书
  - 监理单位验收意见书
  - 绩效目标审核意见书
  - 节能评估报告审查意见书
  - 被审计单位反馈意见书
output:
  fields:
  - name: 不合格项描述
    type: string
    description: 提取 不合格项描述 的文本值
  - name: 不合格项记录
    type: string
    description: 提取 不合格项记录 的文本值
  - name: 专家签到表
    type: string
    description: 提取 专家签到表 的文本值
  - name: 修改完善确认记录
    type: string
    description: 提取 修改完善确认记录 的文本值
  - name: 历史问题记录
    type: string
    description: 提取 历史问题记录 的文本值
  - name: 反担保合规意见
    type: string
    description: 提取 反担保合规意见 的文本值
  - name: 审查意见批复日期
    type: date
    description: 提取 审查意见批复日期 的日期值，格式 YYYY-MM-DD
  - name: 审核结论
    type: string
    description: 提取 审核结论 的文本值
  - name: 对审计评价的异议内容
    type: string
    description: 提取 对审计评价的异议内容 的文本值
  - name: 对评估程序合规性的审查结论
    type: string
    description: 提取 对评估程序合规性的审查结论 的文本值
  - name: 意见
    type: string
    description: 提取 意见 的文本值
  - name: 批复单位
    type: string
    description: 提取 批复单位 的文本值
  - name: 批复日期
    type: date
    description: 提取 批复日期 的日期值，格式 YYYY-MM-DD
  - name: 批复结论
    type: string
    description: 提取 批复结论 的文本值
  - name: 指出的缺陷类型
    type: string
    description: 提取 指出的缺陷类型 的文本值
  - name: 整改意见
    type: string
    description: 提取 整改意见 的文本值
  - name: 用地性质
    type: string
    description: 提取 用地性质 的文本值
  - name: 申请用地面积
    type: string
    description: 提取 申请用地面积 的文本值
  - name: 签署日期
    type: date
    description: 提取 签署日期 的日期值，格式 YYYY-MM-DD
  - name: 论证会议日期
    type: date
    description: 提取 论证会议日期 的日期值，格式 YYYY-MM-DD
  - name: 论证结论
    type: string
    description: 提取 论证结论 的文本值
  - name: 违规事项
    type: string
    description: 提取 违规事项 的文本值
  - name: 验收意见
    type: string
    description: 提取 验收意见 的文本值
  - name: 验收结论
    type: string
    description: 提取 验收结论 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 明细表.实际交付日期 IS NOT NULL AND (验收报告.验收日期 IS NULL OR 明细表.实际交付日期 < 验收报告.验收日期)
  description: 若项目存在明确的交付使用记录（如交房、移交物业等），但竣工验收报告显示验收日期在交付之后或根本没有组织竣工验收，则构成未组织验收擅自交付的违规行为。同时，若尾款支付日期早于验收日期，也可作为交付迹象辅助判定。
  audit_item: 建设项目初步设计概算投资超过可研批准估算%及以上未报告审批部门
  suspicion: 建设工程竣工后未组织验收擅自交付使用
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"建设单位收到建设工程竣工报告后，应当组织设计、施工、工程监理等有关单位进行竣工验收。建设工程经验收合格的，方可交付使用。\"\n  }\n]"
- expression: 验收报告.验收结论 = '不合格' AND 明细表.实际交付日期 IS NOT NULL
  description: 竣工验收报告明确结论为不合格，但项目已有实际交付使用记录（如交房记录、物业移交、用户入住等），直接违反不得交付使用的强制性规定。无任何容差或辩解空间。
  audit_item: 建设项目初步设计概算投资超过可研批准估算%及以上未报告审批部门
  suspicion: 建设工程竣工验收不合格擅自交付使用
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"建设工程经验收合格的，方可交付使用；验收不合格的，不得交付使用。\"\n  }\n]"
- expression: (许可证.发证日期 < 批复文件.批复日期) || (设计文件.批复日期 < 研究报告.批复日期) || (项目清单.实际开工日期 < 意见书.批复日期) || (许可证.发证日期 IS NULL && 项目清单.实际开工日期
    IS NOT NULL) || (评价报告.批复日期 < 批复文件.批复日期)
  description: 该表达式用于判定审批程序倒置或未批先建。主要逻辑包括：1) 规划许可证日期早于立项批复日期，表明程序倒置；2) 初设批复早于可研批复，违反基本建设程序；3) 实际开工日期早于用地审批文件日期，构成未批先建；4) 未取得规划许可证但已有实际开工记录，属于严重违法行为；5)
    环评批复早于立项批复，通常不符合逻辑，涉嫌程序违规。所有条件满足其一即触发疑点。
  audit_item: 未按规定办理项目审批等手续
  suspicion: 未批先建或程序倒置违规
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条、第十三条\"\
    ,\n    \"内容概述\": \"政府投资项目必须严格执行基本建设程序，项目单位不得在开工前缺失任何法定审批手续，不得在审批手续办结前开工建设。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\"\
    ,\n    \"法规文号\": \"主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"在城市、镇规划区内进行建筑物、构筑物、道路、"
- expression: (实施主体.申报用地面积 < 意见书.申请用地面积 * 0.8) || (评价报告.排放总量指标 != (实际监测数据超标排放记录)) || (ABS(研究报告.经济指标预测数据 - 同类项目实际运行数据) > 研究报告.经济指标预测数据
    * 0.5)
  description: 该表达式用于识别申报材料中的数据造假。1）申报用地面积显著小于实际申请面积（差异超过20%），可能属于‘少报多占’的虚假申报；2）环评批复中批准的排放总量指标与环保部门后续在线监测记录的实际排放量严重不符，可能是基础数据造假以获得批复；3）可研报告中预测的经济效益指标（如床位使用率、车流量）与实际运营后的同类项目数据偏差超过正负50%，属于严重失实的预测数据，涉嫌虚构数据以骗取项目通过可行性论证。
  audit_item: 未按规定办理项目审批等手续
  suspicion: 申报虚假材料骗取项目审批
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国行政许可法\",\n    \"法规文号\": \"主席令第七号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十一条、第六十九条\",\n    \"内容概述\": \"申请人申请行政许可，应当如实向行政机关提交有关材料和反映真实情况，并对其申请材料实质内容的真实性负责。被许可人以欺骗、贿赂等不正当手段取得行政许可的，应当予以撤销。\"\n\
    \  },\n  {\n    \"法规名称\": \"企业投资项目核准和备案管理条例\",\n    \"法规文号\": \"国务院令第673号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十条、第十"
- expression: （安全专项施工方案.是否要求论证 == '是' && 专家论证意见书.论证会议日期 IS NULL） || （专家论证意见书.论证会议日期 != NULL && 安全专项施工方案.批准日期 > 专家论证意见书.论证会议日期）
    || （危险性较大分部分项工程清单.工程类别 包含 '深基坑'/'高大模板'/'起重吊装' 且 专家论证意见书 无对应记录） || （项目监理日志.分项工程开工审批日期 < 专家论证意见书.论证会议日期）
  description: 判定规则：1）按规定需要论证的方案，未召开专家论证会直接实施；2）方案审批日期晚于论证日期，说明论证流于形式，方案未经论证即获批；3）工程类别属于危险性较大工程但缺失论证记录；4）实际开工时间早于论证时间，属于未论证先施工的严重违规。
  audit_item: 重大工程项目风险预警
  suspicion: 安全专项施工方案未组织专家论证
  regulation: "[\n  {\n    \"法规名称\": \"建设工程安全生产管理条例\",\n    \"法规文号\": \"国务院令第393号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"施工单位应当在施工组织设计中编制安全技术措施和施工现场临时用电方案，对达到一定规模的危险性较大的分部分项工程编制专项施工方案，并附具安全验算结果，经施工单位技术负责人、总监理工程师签字后实施，由专职安全生产管理人员进行现场监督；其中涉及深基坑、地下暗挖工程、高大模板工程的专项施工方案，施工单位还应当组织专家进行论证、审查。\"\
    \n  }\n]"
- expression: (担保类型（是否全资子公司） != '全资子公司' OR 担保类型（是否全资子公司） != '控股子公司') && (反担保合同编号 IS NULL OR 反担保合同编号 = '')
  description: 根据监管规定，上市公司对外担保（除对全资子公司及控股子公司提供担保外）必须要求被担保人提供反担保。若台账中符合条件的担保事项缺乏有效的反担保合同，即构成违规。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 上市公司对外担保未要求被担保人提供反担保
  regulation: "[\n  {\n    \"法规名称\": \"关于规范上市公司对外担保行为的通知\",\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第一条（三）\",\n    \"内容概述\": \"上市公司对外担保必须要求对方提供反担保，且反担保的提供方应当具有实际承担能力。\"\n  },\n  {\n    \"法规名称\": \"上市公司监管指引第8号——上市公司资金往来、对外担保的监管要求\"\
    ,\n    \"法规文号\": \"证监会公告〔2022〕26号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \""
- expression: (报告正文.审计评价段文字内容 CONTAINS '认真贯彻落实' && 底稿.问题数量 > 5) || (报告正文.审计评价段文字内容 CONTAINS '较好' || 意见书.对审计评价的异议内容)
  description: 当报告中评价使用正面定性词但审计发现问题较多（例如超过5个），或评价与被审计单位反馈意见明显矛盾时，判定评价可能失当。
  audit_item: 审计文书校验
  suspicion: 审计评价超出审计范围或自相矛盾
  regulation: "[\n  {\n    \"法规名称\": \"国家审计准则\",\n    \"法规文号\": \"审计署令第8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一百一十二条\"\
    ,\n    \"内容概述\": \"审计评价应当基于审计获取的审计证据，坚持实事求是，不得超越审计职权和范围，做到客观公正、审慎恰当。\"\n  }\n]"
- expression: SELECT 项目台账.项目名称, 项目台账.投资方式（现金/非货币资产/混合）, 投资协议.交易对价及定价依据 FROM 项目台账 INNER JOIN 投资协议 ON 项目台账.项目名称 = 投资协议.项目名称
    LEFT JOIN 评估报告 ON 项目台账.项目名称 = 评估报告.项目名称 WHERE 评估报告.评估报告文号 IS NULL && (项目台账.投资方式（现金/非货币资产/混合） != '全额现金' || 投资协议.交易对价及定价依据
    NOT LIKE '%审计报告%' && 投资协议.交易对价及定价依据 NOT LIKE '%评估报告%')
  description: 该表达式筛查在项目台账中，无法找到对应资产评估报告（即报告文号为空）的投资项目，特别是针对以非货币资产出资或者虽以现金出资但定价依据不清晰且无评估报告作为支撑的情况。若以现金出资并参考第三方审计报告定价，可视为有替代依据，否则判定为高度违规疑点。
  audit_item: 违规进行重大投资
  suspicion: 资产未经评估即进行对外投资
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十七条\",\n    \"内容概述\": \"国有独资企业、国有独资公司、国有资本控股公司合并、分立、改制，转让重大财产，以非货币财产对外投资，清算或者有法律、行政法规以及企业章程规定应当进行资产评估的其他情形的，应当按照规定对有关资产进行评估。\"\
    \n  }\n]"
- expression: ( (核准文号.核准文号 IS NULL) AND (跟踪表.支出金额 > 0) ) OR ( 跟踪表.用途说明 NOT IN (核准文号.募集资金披露用途) ) OR ( (跟踪表.收款方名称 为 关联方) AND
    (跟踪表.发行价格 < 对比表.每股净资产) )
  description: 违规表达式包含三种情形：①未取得外部监管机构的注册或核准批复，也未履行内部董事会或股东会决议，便实际发行债券或新股并收到资金；②募集资金到账后，其支出用途与核准文件中披露的项目建设、补充流动资金等用途严重不符，挪作高风险投资；③增资扩股中，关联方以明显低于每股净资产的价格参与认购，涉嫌利益输送。任一条件成立即列为疑点。
  audit_item: 违规进行重大资本运作及高风险投资
  suspicion: 违规发行企业债券或增资扩股融资
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国证券法\",\n    \"法规文号\": \"中华人民共和国主席令第37号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"公开发行证券，必须符合法律、行政法规规定的条件，并依法报经国务院证券监督管理机构或者国务院授权的部门注册或者核准。未经依法注册或者核准，任何单位和个人不得公开发行证券。\"\n\
    \  },\n  {\n    \"法规名称\": \"上市公司证券发行管理办法\",\n    \"法规文号\": \"中国证券监督管理委员会令第30号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \""
- expression: ((验收报告.验收不合格项明细 > 0) && (验收报告.整改完成标志 < 验收报告.验收不合格项明细)) || (验收报告.验收结论 = '不合格')
  description: 当项目整体验收或专项验收存在不合格项，且相应整改记录未显示已闭环（即整改完成），或消防验收直接出具不合格意见，判定为设施设备不达标；若配置明细表中设备型号与国标要求清单不符，也视为单类设备违规。
  audit_item: 农村养老服务政策实施不规范、建设质量不达标
  suspicion: 养老机构设施设备不符合国家标准或未整改到位
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第十二条\",\n    \"内容概述\": \"养老机构应当提供符合国家标准和安全生产要求的设施设备，定期进行维护和检测，确保设施设备正常、安全运行。\"\n  }\n]"
- expression: 指标明细.指标分类（产出、效益、满意度） = '0' OR 指标明细.指标分类（产出、效益、满意度） = '0'
  description: 若绩效指标体系中完全缺失效益类指标（如经济效益、社会效益、生态效益）或服务对象满意度指标，即属于指标制定不全面、不合理，未能覆盖绩效管理的核心维度。
  audit_item: 资金绩效管理不到位
  suspicion: 绩效指标制定不合理或缺失关键维度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二部分“强化绩效目标管理”\",\n    \"内容概述\": \"绩效目标要包括产出、成本、经济效益、社会效益、生态效益、可持续影响和服务对象满意度等绩效指标，体现全面性。\"\n  }\n]"
