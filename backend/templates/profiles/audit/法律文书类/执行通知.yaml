name: audit/法律文书类/执行通知
type: model
description: 从法律文书类类文档（执行通知）中提取结构化元数据。涵盖字段如：优先审批条款、优惠电价标准、用地审批承诺时限、适用电压等级。文档范围包括：农业用地、用电优惠政策的地方性规定执行通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 审批
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 执行通知
  member_count: 1
  member_details:
  - 农业用地、用电优惠政策的地方性规定执行通知
output:
  fields:
  - name: 优先审批条款
    type: number
    description: 提取 优先审批条款 的数值（含单位，如万元、吨等）
  - name: 优惠电价标准
    type: string
    description: 提取 优惠电价标准 的文本值
  - name: 用地审批承诺时限
    type: string
    description: 提取 用地审批承诺时限 的文本值
  - name: 适用电压等级
    type: string
    description: 提取 适用电压等级 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 用电缴纳凭证.实际执行电价（元/度） > 优惠电价标准（元/度）.优惠电价标准（元/度） * 1.1 || (用地登记表.审批状态（批准/否决/退回）='否决' && 用地登记表.否决原因 NOT LIKE '%规划不符%'
    AND NOT LIKE '%生态红线%') || DATEDIFF(day, 用地登记表.受理日期, 用地登记表.办结日期) > 用地审批承诺时限.用地审批承诺时限 * 1.5
  description: 若新型经营主体实际缴纳电费单价高于当地规定的农业生产用电优惠价的110%，或者设施农业用地申请被无正当理由（如非规划或生态红线等硬性原因）否决，或者用地审批耗时超过规定时限的1.5倍，则视为政策落实不到位。优惠电价标准参照各省一般农业生产用电目录电价。
  audit_item: 新型经营主体支持政策落实不到位
  suspicion: 新型农业经营主体用地用电优惠政策落实不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第一条第（三）项\",\n    \"内容概述\": \"农业生产用电是指蔬菜、果树、养蜂、畜牧、水产等种植、养殖业用电，以及农产品初加工用电，执行农业生产电价，价格显著低于一般工商业及其他用电。\"\n\
    \  },\n  {\n    \"法规名称\": \"关于进一步支持设施农业健康发展的通知\",\n    \"法规文号\": \"国土资发〔2014〕127号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\""
