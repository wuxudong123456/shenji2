name: audit/法律文书类/健康证明
type: model
description: 从法律文书类类文档（健康证明）中提取结构化元数据。涵盖字段如：从业人员姓名、健康证有效期。文档范围包括：食堂从业人员健康证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 人员
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 健康证明
  member_count: 1
  member_details:
  - 食堂从业人员健康证明
output:
  fields:
  - name: 从业人员姓名
    type: string
    description: 提取 从业人员姓名 的文本值
  - name: 健康证有效期
    type: string
    description: 提取 健康证有效期 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (当前日期 - 健康证有效期) > 0 || 健康证编号 == '无' || 从业人员姓名 NOT IN (健康检查记录表.从业人员姓名)
  description: 健康证过期或根本未办证即视为无证上岗；从业人员姓名不存在于健康检查记录表中，说明该人员未经体检直接参与食品加工。以上条件任一触发均判定为违规。依据《学校食品安全与营养健康管理规定》，健康证明有效期为一年，需每年体检。
  audit_item: 食堂建设管理不符合规定
  suspicion: 食堂从业人员无有效健康证上岗
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国食品安全法\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十五条\",\n    \"内容概述\": \"食品生产经营者应当建立并执行从业人员健康管理制度。患有国务院卫生行政部门规定的有碍食品安全疾病的人员，不得从事接触直接入口食品的工作。从事接触直接入口食品工作的食品生产经营人员应当每年进行健康检查，取得健康证明后方可上岗工作。\"\
    \n  },\n  {\n    \"法规名称\": \"学校食品安全与营养健康管理规定\",\n    \"法规文号\": \"教育部、国家市场监督管理总局、国家"
