name: audit/法律文书类/职称证书
type: model
description: 从法律文书类类文档（职称证书）中提取结构化元数据。涵盖字段如：专业方向、职称等级。文档范围包括：职称证书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 职称证书
  member_count: 1
  member_details:
  - 职称证书
output:
  fields:
  - name: 专业方向
    type: string
    description: 提取 专业方向 的文本值
  - name: 职称等级
    type: string
    description: 提取 职称等级 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 专家简历.专业领域 NOT IN ('金融','法律','房地产','经济','会计') OR 职称证书.职称等级 NOT IN ('中级','高级')
  description: 根据地方章程，专家代表应具备金融、法律、房地产等相关专业背景及中级以上职称。若专家简历或资质证明显示不满足上述条件之一，即判定为资质不合规。
  audit_item: 住房公积金决策机构未按规定履职
  suspicion: 专家代表不具备规定专业资质
  regulation: "[\n  {\n    \"法规名称\": \"《住房公积金管理条例》\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第八条\",\n    \"内容概述\": \"有关专家占三分之一。专家应当具备与住房公积金管理相关的专业知识和经验，以确保决策的科学性。\"\n  }\n]"
