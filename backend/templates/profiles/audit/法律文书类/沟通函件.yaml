name: audit/法律文书类/沟通函件
type: model
description: 从法律文书类类文档（沟通函件）中提取结构化元数据。涵盖字段如：催缴日期、处罚通知、承诺回复、投诉举报内容、权限质疑问题、监管关注事项、补办手续要求、逾期天数。文档范围包括：上级单位或监管部门沟通函件、未到位捐赠款物的沟通函件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 沟通函件
  member_count: 1
  member_details:
  - 上级单位或监管部门沟通函件
  - 未到位捐赠款物的沟通函件
output:
  fields:
  - name: 催缴日期
    type: date
    description: 提取 催缴日期 的日期值，格式 YYYY-MM-DD
  - name: 处罚通知
    type: string
    description: 提取 处罚通知 的文本值
  - name: 承诺回复
    type: string
    description: 提取 承诺回复 的文本值
  - name: 投诉举报内容
    type: string
    description: 提取 投诉举报内容 的文本值
  - name: 权限质疑问题
    type: string
    description: 提取 权限质疑问题 的文本值
  - name: 监管关注事项
    type: string
    description: 提取 监管关注事项 的文本值
  - name: 补办手续要求
    type: string
    description: 提取 补办手续要求 的文本值
  - name: 逾期天数
    type: number
    description: 提取 逾期天数 的数值（含单位，如万元、吨等）
  - name: 针对该项目的合规性质疑
    type: string
    description: 提取 针对该项目的合规性质疑 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (分配表.授权金额上限 < 审批表.项目预算金额) || (分配表.授权项目类型 NOT CONTAINS 审批表.项目类型) || (审批表.审批日期 < 分配表.有效期开始 OR 审批表.审批日期 > 分配表.有效期结束)
    || (日志表.操作人 对应的 分配表.审批人姓名 不存在)
  description: 判定逻辑：1.审批人的授权金额上限小于项目预算金额；2.审批人的授权项目类型不包含该项目类型；3.审批日期不在该审批人权限有效期内；4.操作日志中的审批操作人无任何有效权限记录。满足任一条件即触发越权审批疑点。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 超越规定审批权限审批建设项目
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照规定的程序审批，不得超越审批权限审批政府投资项目。\"\n  }\n]"
- expression: (审批表.前置条件清单（如环评批复、用地预审、规划许可）及文件编号 > 审批表.审批日期) OR (审批表.前置条件清单（如环评批复、用地预审、规划许可）及文件编号 IS NULL AND 说明文件.必须取得顺序要求)
    OR (验收报告.实际开工日期 < 审批表.前置条件清单（如环评批复、用地预审、规划许可）及文件编号)
  description: 条件1：关键前置文件（如环评批复）的批准日期晚于项目立项审批日期；条件2：立项审批表中必填的前置文件编号缺失；条件3：项目实际开工日期早于前置条件取得日期，表明未批先建。三者满足任一即构成违规。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 未取得法定前置审批条件违规批准建设项目
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\": \"中华人民共和国主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十五条\",\n    \"内容概述\": \"建设项目的环境影响评价文件未依法经审批部门审查或者审查后未予批准的，建设单位不得开工建设。\"\n  },\n  {\n    \"法规名称\": \"政府投资条例\"\
    ,\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十二条\",\n    \"内容概述\": \"项目单位应当依法办理相关审批手续，在取得规定的前置审批文件"
