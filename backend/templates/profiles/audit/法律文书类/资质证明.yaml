name: audit/法律文书类/资质证明
type: model
description: 从法律文书类类文档（资质证明）中提取结构化元数据。涵盖字段如：GMP证书编号、主营业务、企业名称、企业规模、供应商名称、单位法人证书/营业执照、参与人员身份证号、合同签订方。文档范围包括：产业帮扶企业资质证明、企业资质证明、供应商资质证明、单位资质证明、参与集资人员的资质证明、土壤检测机构资质证明、场所资质证明、建设单位资质证明、接收单位资质证明、桥梁定期检测报告的检测机构资质证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 人员
- 合同
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 资质证明
  member_count: 1
  member_details:
  - 产业帮扶企业资质证明
  - 企业资质证明
  - 供应商资质证明
  - 单位资质证明
  - 参与集资人员的资质证明
  - 土壤检测机构资质证明
  - 场所资质证明
  - 建设单位资质证明
  - 接收单位资质证明
  - 桥梁定期检测报告的检测机构资质证明
  - 疫苗采购合同供应商资质证明
  - 评估机构资质证明
output:
  fields:
  - name: GMP证书编号
    type: string
    description: 提取 GMP证书编号 的文本值
  - name: 主营业务
    type: string
    description: 提取 主营业务 的文本值
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 企业规模
    type: string
    description: 提取 企业规模 的文本值
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 单位法人证书-营业执照
    type: string
    description: 提取 单位法人证书-营业执照 的文本值
  - name: 参与人员身份证号
    type: string
    description: 提取 参与人员身份证号 的文本值
  - name: 合同签订方
    type: string
    description: 提取 合同签订方 的文本值
  - name: 场所类型
    type: string
    description: 提取 场所类型 的文本值
  - name: 处置数量
    type: number
    description: 提取 处置数量 的数值（含单位，如万元、吨等）
  - name: 处置方式
    type: string
    description: 提取 处置方式 的文本值
  - name: 帮扶产业类型
    type: string
    description: 提取 帮扶产业类型 的文本值
  - name: 应参保企业总数
    type: string
    description: 提取 应参保企业总数 的文本值
  - name: 收入证明
    type: number
    description: 提取 收入证明 的数值（含单位，如万元、吨等）
  - name: 检测机构资质等级
    type: string
    description: 提取 检测机构资质等级 的文本值
  - name: 检疫证明
    type: string
    description: 提取 检疫证明 的文本值
  - name: 法人证照
    type: string
    description: 提取 法人证照 的文本值
  - name: 生产许可证号
    type: string
    description: 提取 生产许可证号 的文本值
  - name: 组织机构代码
    type: string
    description: 提取 组织机构代码 的文本值
  - name: 统一社会信用代码
    type: string
    description: 提取 统一社会信用代码 的文本值
  - name: 股权结构
    type: string
    description: 提取 股权结构 的文本值
  - name: 评估对象名称
    type: string
    description: 提取 评估对象名称 的文本值
  - name: 资质条件
    type: string
    description: 提取 资质条件 的文本值
  - name: 食品经营许可证
    type: string
    description: 提取 食品经营许可证 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: GROUP BY 公务接待明细台账.接待场所, MONTH(公务接待明细台账.接待时间) HAVING COUNT(DISTINCT 公务接待明细台账.接待单位) >= 3 && 公务接待明细台账.接待场所 LIKE
    '%学习基地%' || 公务接待明细台账.接待场所 LIKE '%科研基地%' || 公务接待明细台账.接待场所 LIKE '%培训基地%'
  description: 按接待场所和月份分组，当同一场所（特别是各类基地）一个月内出现3家及以上不同接待单位时，触发疑点。反映可能存在的扎堆轮流接待、相互请托旅游。
  audit_item: 公务接待管理不符合规定
  suspicion: 短期内多单位集中赴同类场所考察涉嫌变相公款旅游
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"禁止以考察、学习、培训等名义变相用公款旅游。\"\n  }\n]"
- expression: GROUP BY 审批清单.建设单位名称 & 建议书.项目选址 & 建议书.主要用能工艺 -> 聚合年综合能耗 SUM(评估报告.对应的单体项目能耗数据) > 1000 吨标准煤 && 审批清单.审批状态 == '未进行审查'
    && 审批清单.批复时间彼此间隔 < 12个月
  description: 通过多维度聚合分析破解化整为零伎俩。表达式规则为：若同一投资主体在12个月内，在同一物理区域内以多个仅从名称上看不出关联的小项目名义报批，且各自能耗均未达审查门槛，但合计能耗超过1000吨标煤的审查线，则识别为恶意拆分规避监管。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 通过拆分项目蓄意规避节能审查
  regulation: "[\n  {\n    \"法规名称\": \"固定资产投资项目节能审查办法\",\n    \"法规文号\": \"国家发展和改革委员会令第44号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第六条、第十六条\",\n    \"内容概述\": \"以拆分项目、提供虚假材料等不正当手段通过节能审查的，或未进行节能审查即开工的，均应严肃查处。对未达到节能审查门槛但由多个关联项目组成的整体，应合并核算总能耗。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国节约能源法\",\n    \"法规文号\": \"中华人民共和国主席令第七十七号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":"
- expression: 耕地土壤有机质含量监测数据表.有机质含量 < 土壤有机质提升技术规程.有机质目标值
  description: 以地方制定的有机质提升技术规程或考核目标中的有机质含量标准为依据，当监测数据表中任一有效监测点位的土壤有机质含量低于该目标值时，即判定为该点位未达标；若未达标点位数量达到一定比例（如超过10%）或连续年度下降，则认定为耕地土壤有机质含量整体未达标。
  audit_item: 任务目标未完成
  suspicion: 耕地土壤有机质含量未达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当将黑土地保护纳入国民经济和社会发展规划，安排资金，确保黑土地面积不减、质量不降，生态功能不退化。\"\n  }\n]"
- expression: (税务查验.发票状态 IN ('作废','红冲','不存在')) || (ABS(企业会计账簿.原材料成本 / 申报面积 - 行业标准成本) / 行业标准成本 > 0.5) || (银行流水.付款对象 != 会计原始凭证.供应商名称)
    || (项目验收报告.实际产能 < 申报产能 * 0.6)
  description: 若企业入账凭证中的发票经税务平台查验为异常状态，或单位面积原材料成本超出当地同行业平均标准50%以上，或银行流水支付对象与凭证列示供应商名称不符，或项目验收实际产能不及申报产能的60%，即判定为疑点。行业标准成本可参照当地农业部门公布的参考值。
  audit_item: 骗取套取涉农财政专项资金
  suspicion: 企业伪造会计凭证骗取涉农项目补贴
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十三条\",\n    \"内容概述\": \"伪造、变造会计凭证、会计账簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n\
    \    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"企业和个人以虚报、冒领等手段骗取财政资金的，依照本条例处理"
- expression: (经审核的集资人名单.与单位关系 != '正式劳动关系') || (经审核的集资人名单.是否已享受保障性住房政策 = '是') || (买受人付款记录.缴款人姓名 NOT IN (经审核的集资人名单.姓名))
  description: 参与集资合作建房的人员必须为符合当地收入标准的本单位职工，且未享受过其他福利性住房政策。若出现非本单位人员、已享受房改政策人员或缴款人与分配对象身份存疑，则触发疑点。任一条件成立即视为违规。
  audit_item: 违规集资合作建房
  suspicion: 集资合作建房主体资格不符合规定
  regulation: "[\n  {\n    \"法规名称\": \"经济适用住房管理办法\",\n    \"法规文号\": \"建住房〔2007〕258号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十五条\",\n    \"内容概述\": \"经济适用住房供应对象为城市低收入住房困难家庭，并与职工家庭人口、收入等因素挂钩，不得向非保障对象供应。集资合作建房参照执行，且只能对本单位符合条件的职工销售。\"\n  }\n\
    ]"
- expression: (台账表.是否有检疫证明 == '否' && 食材类别 IN ['肉类','禽类','水产品']) || (监测记录.冷藏温度 > 4℃ && 持续时间 > 1小时) || (检查记录.生熟分离情况 == '不合格')
  description: 肉类等高风险食材采购无检疫证明，冷藏冷冻温度持续超标超过1小时，生熟食品未分离存放或加工，只要触发任一项即判定违规。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 食品采购加工贮存卫生不达标
  regulation: "[\n  {\n    \"法规名称\": \"餐饮服务食品安全操作规范\",\n    \"法规文号\": \"国家市场监督管理总局公告2018年第12号\",\n    \"效力级别\": \"行业规范\",\n\
    \    \"条款号\": \"6.1.3、7.1.2\",\n    \"内容概述\": \"采购食品原料应查验供货者许可证和产品合格证明；加工制作过程中应避免交叉污染，生熟食品加工用具、容器分开使用。\"\n  }\n]"
