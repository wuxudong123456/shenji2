name: audit/法律文书类/申报书
type: model
description: 从法律文书类类文档（申报书）中提取结构化元数据。涵盖字段如：承诺绩效指标。文档范围包括：项目申报书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 申报书
  member_count: 1
  member_details:
  - 项目申报书
output:
  fields:
  - name: 承诺绩效指标
    type: string
    description: 提取 承诺绩效指标 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (统计表.实际完成数值 / 承诺绩效指标（带动农户数、增收额、产值等）.承诺绩效指标（带动农户数、增收额、产值等）) < 0.6 && 整改台账.整改状态 != '已完成'
  description: 绩效目标完成率低于60%视为严重未达标，且没有在审计或主管部门要求下完成有效整改的，属于发展目标未实现。重点关注带动农户数和增收额等核心指标。
  audit_item: 新型经营主体设立和发展不符合相关规定
  suspicion: 项目发展目标严重未实现
  regulation: "[\n  {\n    \"法规名称\": \"农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十一条\",\n    \"内容概述\": \"各级财政、农业农村主管部门应加强资金绩效管理，绩效评价结果作为项目和资金安排的重要依据，未达绩效目标的，可扣减、暂停或收回资金。\"\n  }\n]"
