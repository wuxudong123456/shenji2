name: audit/法律文书类/身份证明
type: model
description: 从法律文书类类文档（身份证明）中提取结构化元数据。涵盖字段如：养殖档案存栏量、土地承包合同面积、地块坐标、残疾等级、申请人年龄。文档范围包括：困难群体救助身份证明、投保人身份证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 合同
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 身份证明
  member_count: 1
  member_details:
  - 困难群体救助身份证明
  - 投保人身份证明
output:
  fields:
  - name: 养殖档案存栏量
    type: string
    description: 提取 养殖档案存栏量 的文本值
  - name: 土地承包合同面积
    type: string
    description: 提取 土地承包合同面积 的文本值
  - name: 地块坐标
    type: string
    description: 提取 地块坐标 的文本值
  - name: 残疾等级
    type: string
    description: 提取 残疾等级 的文本值
  - name: 申请人年龄
    type: string
    description: 提取 申请人年龄 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (农业保险投保明细表.投保面积 > 农业部门种植/养殖面积统计表.统计面积 * 1.2) || (农业保险投保明细表.投保面积/数量 > 投保人身份证明.养殖档案存栏量 * 1.2) || (跨部门保单信息比对差异表.差异比例
    > 0.2)
  description: 当投保面积超出农业部门核实面积的20%以上，或投保牲畜数量超出养殖档案存栏上限的20%，或跨部门差异表中面积/数量偏差率超过20%时，判定为虚构或虚增保险标的。阈值可根据当地实际调整，偏差率越高风险越大。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 虚构或虚增保险标的骗取保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条第一项\"\
    ,\n    \"内容概述\": \"禁止投保人虚构或者虚增保险标的、以同一保险标的多次重复投保，骗取农业保险的保险费补贴。\"\n  }\n]"
