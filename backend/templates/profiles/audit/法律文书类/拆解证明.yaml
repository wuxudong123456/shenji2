name: audit/法律文书类/拆解证明
type: model
description: 从法律文书类类文档（拆解证明）中提取结构化元数据。涵盖字段如：拆解地点、拆解日期、拆解照片、渔船编号。文档范围包括：渔船拆解证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 拆解证明
  member_count: 1
  member_details:
  - 渔船拆解证明
output:
  fields:
  - name: 拆解地点
    type: string
    description: 提取 拆解地点 的文本值
  - name: 拆解日期
    type: date
    description: 提取 拆解日期 的日期值，格式 YYYY-MM-DD
  - name: 拆解照片
    type: string
    description: 提取 拆解照片 的文本值
  - name: 渔船编号
    type: string
    description: 提取 渔船编号 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (注销台账.处置完成日期 IS NOT NULL AND (日志表.渔船状态='在册' AND ABS(日志表.最后更新时间 - 注销台账.处置完成日期) > 2)) OR (日志表.渔船编号 IS NULL) OR
    (日志表.船主姓名 IS NULL OR 日志表.拆解日期 IS NULL) OR (注销台账.渔船编号 NOT IN (SELECT 渔船编号 FROM 日志表)) OR (注销台账.处置完成日期 IS NOT NULL AND 日志表.最后更新时间
    > 注销台账.处置完成日期 + 30)
  description: 渔船已处置完成但系统状态仍未更新且滞后超2天；系统缺失必填字段（编号、船主、拆解日期等）；处置记录在系统无对应档案；系统更新时间显著滞后处置日期超30天。满足任一条件判为违规。
  audit_item: 补偿制度落实不到位（渔业）
  suspicion: 渔船信息系统数据未动态更新
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农长渔发〔2019〕1号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条第（二）款\",\n    \"内容概述\": \"要求建立健全退捕渔船管理信息系统，及时录入更新渔船信息，实行动态管理。\"\n  }\n]"
- expression: (注销台账.处置完成日期 IS NOT NULL AND 注销台账.证书注销日期 IS NULL) OR (注销台账.证书注销日期 - 注销台账.处置完成日期 > 30) OR (注销台账.处置方式 NOT IN ('拆解','销毁','回收','无害化处理'))
    OR (拆解证明.拆解日期 IS NOT NULL AND 注销台账.处置方式 != '拆解')
  description: 渔船已完成处置但捕捞证书未注销；证书注销日期晚于处置完成日超过30天；处置方式不符合操作指南规定的类型；已有拆解证明但台账记录的处置方式并非拆解，均属违规。
  audit_item: 补偿制度落实不到位（渔业）
