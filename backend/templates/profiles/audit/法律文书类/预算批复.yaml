name: audit/法律文书类/预算批复
type: model
description: 从法律文书类类文档（预算批复）中提取结构化元数据。涵盖字段如：建设内容、批复投资额、未分配金额、预算批复总额、预算金额。文档范围包括：专项资金预算批复、项目预算批复等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 金额
- 预算
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 预算批复
  member_count: 1
  member_details:
  - 专项资金预算批复
  - 项目预算批复
output:
  fields:
  - name: 建设内容
    type: string
    description: 提取 建设内容 的文本值
  - name: 批复投资额
    type: string
    description: 提取 批复投资额 的文本值
  - name: 未分配金额
    type: number
    description: 提取 未分配金额 的数值（含单位，如万元、吨等）
  - name: 预算批复总额
    type: number
    description: 提取 预算批复总额 的数值（含单位，如万元、吨等）
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (项目清单.项目类型 IN ("技术业务用房", "培训中心", "综合楼") && 研究报告.功能分区方案 CONTAINS "影剧院|高尔夫|泳池") || (研究报告.建筑规模 > 楼堂馆所定义标准、禁止性规定、重大工程定义（投资限额）、决策程序要求.重大工程定义（投资限额）
    * 1.5) || (会议纪要 IS NULL)
  description: 若项目以技术业务用房等名义申报，但可研方案包含明令禁止的娱乐设施，或实际建成的人均建筑面积超过办公用房标准50%以上，且决策会议未能提供完整反对意见记录，则认定为违规决策建设楼堂馆所。人均面积标准参照《党政机关办公用房管理办法》执行。
  audit_item: 违规开展重大工程建设
  suspicion: 违规决策建设楼堂馆所
  regulation: "[\n  {\n    \"法规名称\": \"机关团体建设楼堂馆所管理条例\",\n    \"法规文号\": \"国务院令第688号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三条\",\n    \"内容概述\": \"机关、团体不得新建、扩建、改建、购置楼堂馆所，不得以任何名义建设楼堂馆所，包括禁止以技术业务用房等名义建设办公用房或者搭车建设楼堂馆所。\"\n  }\n]"
- expression: (评估报告.实际客流量 < 研究报告.预测客流量 * 0.5) || (预算批复.实际总投资 > 预算批复.批复投资额 * 1.3) || (评估报告.实际使用率 < 研究报告.预期使用率 * 0.5) && 研究报告.专家结论
    CONTAINS "存在风险"
  description: 当实际客流量不到预测值一半，或实际投资超预算30%以上，或投资回报率不及可研预期一半，且可研报告中的专家论证曾提出风险质疑未被采纳时，认定可研论证不充分，导致投资未达预期甚至损失浪费。
  audit_item: 违规开展重大工程建设
  suspicion: 可行性研究论证不充分导致投资效益低下
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条\"\
    ,\n    \"内容概述\": \"投资概算超过经批准的可行性研究报告投资估算10%的，项目单位应当向投资主管部门或者其他有关部门报告，投资主管部门或者其他有关部门可以要求项目单位重新报送可行性研究报告。\"\n  }\n]"
- expression: (专项资金预算批复.未分配金额 > 0 && 专项资金结余结转情况说明.结余金额 / 专项资金预算批复.预算批复总额 > 0.2 && 相关资金审批记录.结余分配讨论记录 == '' ) || (专项资金收入支出明细表.累计结余
    > 0 && ABS(银行存款余额调节表.账面余额 - 银行对账单.专户期末余额) == 0 && 专项资金结余结转情况说明.后续分配计划 == '' )
  description: 该表达式综合判定资金结余闲置。条件一：未分配金额大于0，且结余占预算总额比例超过20%，且无任何资金统筹分配的会议讨论记录，表明管理缺位导致闲置。条件二：账面存在累计结余，且银行账户余额与账面一致（资金真实沉淀），但无后续分配计划说明，直接判定为闲置。满足任一条件即触发疑点。
  audit_item: 专项资金长期闲置未发挥效益
  suspicion: 专项资金结余未分配使用形成闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十二条\",\n    \"内容概述\": \"各级政府上一年预算的结转资金，应当在下一年用于结转项目的支出；连续两年未用完的结转资金，应当作为结余资金管理。各部门、各单位上一年预算的结转、结余资金按照财政部的规定办理。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步加强地方财政结余结转资金管理的通知\",\n    \"法规文号\": \"财预〔2013〕372号\",\n    \"效力级别\": \"部门规章\",\n    "
