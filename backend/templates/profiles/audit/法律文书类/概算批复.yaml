name: audit/法律文书类/概算批复
type: model
description: 从法律文书类类文档（概算批复）中提取结构化元数据。涵盖字段如：批复概算总投资。文档范围包括：项目概算批复等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 概算批复
  member_count: 1
  member_details:
  - 项目概算批复
output:
  fields:
  - name: 批复概算总投资
    type: string
    description: 提取 批复概算总投资 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 批复概算总投资.项目预算金额 > 强制招标金额标准.强制招标金额标准 && (记录表.招标方式 != "公开招标" && 记录表.招标方式 != "邀请招标")
  description: 项目预算金额超过国家或企业规定的强制招标限额，但招标过程记录中未显示依法开展公开或邀请招标，即认定为规避招标。若为单一来源采购等非招标方式，需核查是否履行特殊审批程序。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 应招标项目未按规定招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条、第四十九条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标；对必须进行招标的项目而不招标的，责令限期改正，可以处项目合同金额千分之五以上千分之十以下的罚款。\"\
    \n  }\n]"
- expression: 实际投资完成额.实际投资完成额 > 批复概算总投资.批复概算总投资
  description: 使用财政预算资金或国有资金投资的基本建设项目，其实际投资额超过经批准的初步概算即为超概算。表达式直接比较实际投资与批复概算，未考虑是否已履行调整审批。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 财政资金项目超概算
  regulation: "[\n  {\n    \"法规名称\": \"中央预算内直接投资项目管理办法\",\n    \"法规文号\": \"国家发展改革委令第7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"直接投资项目建设投资超过原核定概算10%的，应当报原概算审批部门重新核定。超过原核定概算的，项目单位应当分析原因，提出改进措施，并按照规定报告有关部门。\"\n  }\n\
    ]"
- expression: (实际投资完成额分析表.实际投资完成额 - 批复概算总投资.批复概算总投资) / 批复概算总投资.批复概算总投资 > 0.1 && 调整概算批复日期及文号审批文件.调整概算批复日期及文号 IS NULL
  description: 项目实际投资超出原批复概算10%以上时，必须报原概算审批部门重新核定。表达式计算超概算比例大于10%，且未找到相应的调概批复记录即判定违规。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 超概算10%未履行重新报批程序
  regulation: "[\n  {\n    \"法规名称\": \"中央预算内直接投资项目管理办法\",\n    \"法规文号\": \"国家发展改革委令第7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"直接投资项目建设投资超过原核定概算10%的，应当报原概算审批部门重新核定。\"\n  }\n]"
