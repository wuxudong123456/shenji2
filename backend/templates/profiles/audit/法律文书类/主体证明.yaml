name: audit/法律文书类/主体证明
type: model
description: 从法律文书类类文档（主体证明）中提取结构化元数据。涵盖字段如：农机购置证明等、土地承包合同。文档范围包括：经营主体证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 合同
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 主体证明
  member_count: 1
  member_details:
  - 经营主体证明
output:
  fields:
  - name: 农机购置证明等
    type: string
    description: 提取 农机购置证明等 的文本值
  - name: 土地承包合同
    type: string
    description: 提取 土地承包合同 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (清单名册.培训课时 < 规定培训课时) || (清单名册.考核结果 = '不合格') || (主体证明.土地承包合同、农机购置证明等 = 无效) || (审批文件.审批流程记录缺失公示、审核环节)
  description: 新型职业农民认定必须经过完整培训并考核合格，且实际从事农业生产经营。若培训课时不达标，或考核不合格，或无法提供土地承包、生产经营等证明，或审批流程不完整，均应视为违规认定。
  audit_item: 培训等政策实施不合规，效果不佳
  suspicion: 不符合条件人员被认定为新型职业农民
  regulation: "[\n  {\n    \"法规名称\": \"新型职业农民认定管理办法（示例）\",\n    \"法规文号\": \"农人发〔20××〕×号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"申请认定新型职业农民须参加规定培训并考核合格，且具备一定规模的生产经营条件。\"\n  }\n]"
