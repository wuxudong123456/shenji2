name: audit/法律文书类/计算书
type: model
description: 从法律文书类类文档（计算书）中提取结构化元数据。涵盖字段如：最终选用的保温材料型号、权重分配、综合评定等级、设备能效等级标注、部件得分。文档范围包括：技术状况评定计算书、节能计算书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 计算书
  member_count: 1
  member_details:
  - 技术状况评定计算书
  - 节能计算书
output:
  fields:
  - name: 最终选用的保温材料型号
    type: string
    description: 提取 最终选用的保温材料型号 的文本值
  - name: 权重分配
    type: string
    description: 提取 权重分配 的文本值
  - name: 综合评定等级
    type: string
    description: 提取 综合评定等级 的文本值
  - name: 设备能效等级标注
    type: string
    description: 提取 设备能效等级标注 的文本值
  - name: 部件得分
    type: string
    description: 提取 部件得分 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (检测报告.标度分值 > 60 && 检测报告.标度分值 >= 4) || (检测报告.综合评定等级 == '2类' && 检测报告.同部位病害历史标度数据 >= 4 且 无维修记录) || (计算书.权重分配 !=
    标准权重值 && ABS(计算书.部件得分 - 标准综合得分) > 5)
  description: 部件得分为严重缺损但权重被人为调低，或直接将四五类构件（标度≥4）评定为二类桥。若同一病害在前次报告中被标为严重，本次反且评级更好且无修复记录，涉嫌造假。
  audit_item: 道路桥梁安全定期检测审计
  suspicion: 安全状况评定虚高
  regulation: "[\n  {\n    \"法规名称\": \"公路桥梁技术状况评定标准\",\n    \"法规文号\": \"JTG/T H21-2011\",\n    \"效力级别\": \"行业规范\",\n    \"\
    条款号\": \"4.1.6及4.2\",\n    \"内容概述\": \"桥梁技术状况评定等级划分标准明确，规定了单项指标标度与综合评定的对应关系，主要部件评分达到4类或5类时，全桥应严格按最差部件评定等级，严禁任意加权平均掩盖严重病害。\"\
    \n  }\n]"
