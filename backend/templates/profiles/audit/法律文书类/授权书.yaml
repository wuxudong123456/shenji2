name: audit/法律文书类/授权书
type: model
description: 从法律文书类类文档（授权书）中提取结构化元数据。涵盖字段如：代领人姓名、受益人姓名、授权日期、签名。文档范围包括：代领补贴资金授权书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 授权书
  member_count: 1
  member_details:
  - 代领补贴资金授权书
output:
  fields:
  - name: 代领人姓名
    type: string
    description: 提取 代领人姓名 的文本值
  - name: 受益人姓名
    type: string
    description: 提取 受益人姓名 的文本值
  - name: 授权日期
    type: date
    description: 提取 授权日期 的日期值，格式 YYYY-MM-DD
  - name: 签名
    type: string
    description: 提取 签名 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 明细表.银行卡号 通过 水对账单 查询到的账户户名 != 明细表.姓名 && 授权书 中针对该受益人-代领人组合的记录不存在
  description: 补贴资金原则上应直接发放到受益人本人银行卡。若发放时银行卡户名与受益人不一致，且没有合法有效的代领授权手续，即构成违规代领，存在资金被他人侵占的风险。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 补贴资金违规转入他人银行卡代领
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（五）\",\n    \"内容概述\": \"严禁任何单位和个人违规代领、截留、挪用补贴资金，确需代领的须有合法授权并备案登记。\"\n  }\n]"
