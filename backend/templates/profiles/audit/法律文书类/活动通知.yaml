name: audit/法律文书类/活动通知
type: model
description: 从法律文书类类文档（活动通知）中提取结构化元数据。涵盖字段如：主办单位、公务内容占比、参赛要求、地点、时长、活动内容、活动日程、活动日程安排。文档范围包括：活动通知、赛事活动通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 活动通知
  member_count: 1
  member_details:
  - 活动通知
  - 赛事活动通知
output:
  fields:
  - name: 主办单位
    type: string
    description: 提取 主办单位 的文本值
  - name: 公务内容占比
    type: string
    description: 提取 公务内容占比 的文本值
  - name: 参赛要求
    type: string
    description: 提取 参赛要求 的文本值
  - name: 地点
    type: string
    description: 提取 地点 的文本值
  - name: 时长
    type: string
    description: 提取 时长 的文本值
  - name: 活动内容
    type: string
    description: 提取 活动内容 的文本值
  - name: 活动日程
    type: string
    description: 提取 活动日程 的文本值
  - name: 活动日程安排
    type: string
    description: 提取 活动日程安排 的文本值
  - name: 门票费用
    type: number
    description: 提取 门票费用 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 公务接待明细台账.活动项目 = '马拉松' && 单位三定方案.主要职能描述 NOT LIKE '%体育%' && 单位三定方案.主要职能描述 NOT LIKE '%文旅%' && 赛事活动通知.主办单位 != 上级体育主管部门
  description: 排除体育、文旅等直接相关职能单位，其余单位以公务名义参与马拉松，且主办方非上级业务指导部门，即认定为活动与职能无关，属于违规列支。
  audit_item: 公务接待管理不符合规定
  suspicion: 以公务名义参加与职能无关的体育赛事
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"不得组织与公务活动无关的参观和活动，不得以任何名义发放纪念品或变相福利。\"\n  }\n]"
