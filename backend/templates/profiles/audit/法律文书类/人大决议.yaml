name: audit/法律文书类/人大决议
type: model
description: 从法律文书类类文档（人大决议）中提取结构化元数据。涵盖字段如：纳入中长期财政规划的执行情况、该项目是否列入当年本级财政预算的决议文号。文档范围包括：地方人大决议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 项目
- 预算
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 人大决议
  member_count: 1
  member_details:
  - 地方人大决议
output:
  fields:
  - name: 纳入中长期财政规划的执行情况
    type: string
    description: 提取 纳入中长期财政规划的执行情况 的文本值
  - name: 该项目是否列入当年本级财政预算的决议文号
    type: number
    description: 提取 该项目是否列入当年本级财政预算的决议文号 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: SELECT 分析表.项目名称, 分析表.支出责任占比, 项目台账.项目类型标签（如境外、金融、文化） FROM 分析表 INNER JOIN 项目台账 ON 分析表.项目名称 = 项目台账.项目名称 WHERE (分析表.支出责任占比
    > 10 || 分析表.人大决议.该项目是否列入当年本级财政预算的决议文号 <地方人大决议文号> || 分析表.人大决议.该项目是否列入当年本级财政预算的决议文号 = <本级财政预算>) AND (项目台账.项目类型标签（如境外、金融、文化）
    NOT IN (企业主业目录) && 评价报告.定量和定性评价结论 = '合格')
  description: 该表达式筛查同时满足三个条件的PPP项目：一是政府付费或补贴支出责任在本级一般公共预算支出中的占比已超过10%的政策红线，或未提供纳入预算的人大决议文件；二是项目本身不属于投资企业的主业范畴；三是项目通过了物有所值评价，但忽视了财政风险。这界定了“明知不该上”且“无钱硬上”的违规情形。
  audit_item: 违规进行重大投资
  suspicion: 违规投资财政承受能力不足的非主业PPP项目
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于推进政府和社会资本合作规范发展的实施意见\",\n    \"法规文号\": \"财金〔2019〕10号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"确保每一年度本级全部PPP项目从一般公共预算列支的财政支出责任，不超过当年本级一般公共预算支出的10%。新签约项目不得从政府性基金预算、国有资本经营预算安排PPP项目运营补贴支出。\"\
    \n  }\n]"
