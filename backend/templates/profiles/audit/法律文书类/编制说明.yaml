name: audit/法律文书类/编制说明
type: model
description: 从法律文书类类文档（编制说明）中提取结构化元数据。涵盖字段如：专项支出说明、引用政策文件文号、绩效目标设定依据说明、项目名称、预算金额。文档范围包括：部门预算编制说明、预算编制说明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 金额
- 项目
- 预算
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 编制说明
  member_count: 1
  member_details:
  - 部门预算编制说明
  - 预算编制说明
output:
  fields:
  - name: 专项支出说明
    type: number
    description: 提取 专项支出说明 的数值（含单位，如万元、吨等）
  - name: 引用政策文件文号
    type: string
    description: 提取 引用政策文件文号 的文本值
  - name: 绩效目标设定依据说明
    type: string
    description: 提取 绩效目标设定依据说明 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (绩效目标申报表.总目标 = '无' OR 绩效目标申报表.总目标 LIKE '%定性描述%') && (预算编制说明及依据材料.设定依据说明 IS NULL OR 项目可行性研究报告或立项论证材料.文件编号 IS
    NULL) && (制度文件.论证审核流程 = '缺失')
  description: 该表达式用于筛查绩效目标设定依据不充分的疑点。当‘绩效目标申报表’中的总目标为空或仅包含无法量化的模糊定性描述（如‘提升’、‘改善’），且‘预算编制说明及依据材料’中未提供任何政策文件、数据等依据，或部门未提供对应的‘项目可行性研究报告’等立项论证材料，同时经核实其内部‘制度文件’缺少对目标设定的论证审核流程要求时，判定为高度可疑，属于目标设定依据不充分违规。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定依据不充分
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"各部门、各单位应当按照国务院财政部门制定的政府收支分类科目、预算支出标准和要求，以及绩效目标管理等预算编制规定，根据其依法履行职能和事业发展的需要以及存量资产情况，编制本部门、本单位预算草案。\"\
    \n  },\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行"
- expression: (补助地方支出明细表.拨款对象行政隶属关系 = '地方' || 项目名称 LIKE '%补助%') && 预算类别 = '部门预算' && 未列入转移支付预算
  description: 在部门预算支出项目中，收款方为地方政府或项目名称含有补助性质关键词，且该项目未经过转移支付审批程序，判定为违规安排补助地方支出。
  audit_item: 预算编制不规范
  suspicion: 部门预算中违规安排补助地方支出
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\"\
    ,\n    \"内容概述\": \"财政转移支付应当规范、公平、公开。在部门预算中不得直接安排对地方的补助支出，应当通过规范化的转移支付预算处理。\"\n  }\n]"
