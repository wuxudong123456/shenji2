name: audit/法律文书类/分配决议
type: model
description: 从法律文书类类文档（分配决议）中提取结构化元数据。涵盖字段如：分红对象、金额。文档范围包括：利润分配决议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 分配决议
  member_count: 1
  member_details:
  - 利润分配决议
output:
  fields:
  - name: 分红对象
    type: string
    description: 提取 分红对象 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 医疗机构执业许可证.登记性质 == '营利性' && (医疗机构改制审批文件.改制批复.不存在 || 改制审批文件.改制批复 != 国资委 || 剥离企业办社会职能进度跟踪表.当前状态 != '已完成移交') ||
    (利润分配决议.分红对象 包含 非国有资本 && 利润分配决议.分红对象 缺失)
  description: 企业办医疗机构改制为营利性必须经国资委审核批准并完成分离移交；若缺失合法审批或未完成移交则违规。此外，未经批准向非国有股东分红也构成违规。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
  suspicion: 违规设立或经营营利性医疗机构
  regulation: "[\n  {\n    \"法规名称\": \"关于国有企业办教育医疗机构深化改革的指导意见\",\n    \"法规文号\": \"国资发研究〔2017〕79号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"对营利性医疗机构，要严格审批程序，确保规范运作，防止国有资产流失。未经批准不得与民营资本合作举办营利性机构。\"\n  }\n]"
