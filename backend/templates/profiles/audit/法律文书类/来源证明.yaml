name: audit/法律文书类/来源证明
type: model
description: 从法律文书类类文档（来源证明）中提取结构化元数据。涵盖字段如：实际到位资本金金额、资本金来源性质。文档范围包括：资本金来源证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 来源证明
  member_count: 1
  member_details:
  - 资本金来源证明
output:
  fields:
  - name: 实际到位资本金金额
    type: number
    description: 提取 实际到位资本金金额 的数值（含单位，如万元、吨等）
  - name: 资本金来源性质
    type: string
    description: 提取 资本金来源性质 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (实际到位资本金金额、资本金来源性质.实际到位资本金金额 / 项目总投资额.项目总投资额 < 规定最低资本金比例) || 实际到位资本金金额、资本金来源性质.资本金来源性质 = "债务性资金"
  description: 项目资本金占总投资的比例必须符合国家规定的行业最低资本金比例要求，且资本金不得为债务性资金（如借款、债券等）。表达式一方面核查实缴资本金占比是否达标，另一方面核查资金来源是否为投资者自有资金。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 项目资本金比例或来源不合规
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于调整和完善固定资产投资项目资本金制度的通知\",\n    \"法规文号\": \"国发〔2015〕51号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"各行业固定资产投资项目的最低资本金比例按本通知执行，城市和交通基础设施项目为20%等。项目资本金为非债务性资金，项目法人不承担这部分资金的任何利息和债务。\"\
    \n  }\n]"
