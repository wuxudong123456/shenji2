name: audit/法律文书类/批准书
type: model
description: 从法律文书类类文档（批准书）中提取结构化元数据。涵盖字段如：四至范围、批准书文号、批准文号、批准机关、批准面积、有效期限、用地单位。文档范围包括：建设用地批准书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 批准书
  member_count: 1
  member_details:
  - 建设用地批准书
output:
  fields:
  - name: 四至范围
    type: string
    description: 提取 四至范围 的文本值
  - name: 批准书文号
    type: string
    description: 提取 批准书文号 的文本值
  - name: 批准文号
    type: string
    description: 提取 批准文号 的文本值
  - name: 批准机关
    type: string
    description: 提取 批准机关 的文本值
  - name: 批准面积
    type: string
    description: 提取 批准面积 的文本值
  - name: 有效期限
    type: string
    description: 提取 有效期限 的文本值
  - name: 用地单位
    type: string
    description: 提取 用地单位 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: ((项目名称.审批面积 IS NULL OR 批准书.批准书文号 IS NULL) && (检查记录.开工状态 = '已占用')) || ((批准书.四至范围 != 许可证.红线图坐标及边界) && (ABS(批准书.批准面积
    - 权属证明.宗地面积) / 批准书.批准面积 > 0.05)) || (供应台账.受让人 != 发证台账.权利人 && 检查记录.开工状态 = '已占用')
  description: 表达式由三个或条件分支构成，触发任一即高度可疑。分支1：在审批台账或批准书缺失的情况下（未批），监察记录却显示已占用（先占），构成未批先占。分支2：实际批准的红线范围与许可的红线图不符，且权属证明的实际用地面积与批准面积偏差超过5%，构成批少占多。分支3：土地供应或登记的权利人与实际受让人（使用人）不一致，且已实际占用，构成违法转让或骗取批准后占用。
  audit_item: 未办理土地变更手续非法占用土地
  suspicion: 未经批准或骗取批准非法占用土地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第七十七条\",\n    \"内容概述\": \"未经批准或者采取欺骗手段骗取批准，非法占用土地的，由县级以上人民政府自然资源主管部门责令退还非法占用的土地，对违反土地利用总体规划擅自将农用地改为建设用地的，限期拆除在非法占用的土地上新建的建筑物和其他设施，恢复土地原状，对符合土地利用总体规划的，没收在非法占用的土地上新建的建筑物和其他设施，可以并处罚款；对非法占用土地单位的直接负责的主管人员和其他直接责任人员，依法"
- expression: (审批台账.审批机关 IN ('县级人民政府') && 规划地块文本.地块类型（基本农田/一般耕地/建设用地等） IN ('基本农田', '永久基本农田')) || (审批台账.审批机关 IN ('市级自然资源部门')
    && 审批台账.批准面积 > 35 单位=公顷 && 审批台账.土地类型（农用地/未利用地/建设用地） == '农用地') || (审批台账.审批文号 存在多次拆分记录 && SUM(审批台账.批准面积) > 对应上级机关审批权限面积阈值)
  description: 表达式核心是判断审批主体与法定权限的适配性。分支1：若审批机关为县级，却批准了基本农田类型的用地，直接触犯国务院专属权限，为严重越权。分支2：针对农用地转用，若市级审批机关一次性批准面积超过《土地管理法》规定的35公顷上限，即超权限审批。分支3：识别化整为零策略，通过追踪同一年度同一项目或同一区域立项的多宗地块，若累计审批面积超过本应上报的上级机关审批阈值，则构成实质上的超越权限。
  audit_item: 未办理土地变更手续非法占用土地
  suspicion: 违规超越审批权限审批土地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"征收下列土地的，由国务院批准：（一）永久基本农田；（二）永久基本农田以外的耕地超过三十五公顷的；（三）其他土地超过七十公顷的。征收前款规定以外的土地的，由省、自治区、直辖市人民政府批准。征收农用地的，应当依照本法第四十四条的规定先行办理农用地转用审批。其中，经国务院批准农用地转用的，同时办理征地审批手续，不再另行办理征地审批；经省、自治区、直辖市人民政府在征地批准权限"
