name: audit/法律文书类/改制批复
type: model
description: 从法律文书类类文档（改制批复）中提取结构化元数据。涵盖字段如：改制完成时点要求。文档范围包括：事业单位转企改制批复等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 改制批复
  member_count: 1
  member_details:
  - 事业单位转企改制批复
output:
  fields:
  - name: 改制完成时点要求
    type: string
    description: 提取 改制完成时点要求 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (员工社保缴纳单位名称 != 转制后企业章程 || 岗位编制属性) && (年度营业收入中财政拨款金额 > 转制后企业章程 || 年度营业收入中财政拨款金额 > 0)
  description: 该表达式筛查‘事企双轨’与‘财政依赖’两大问题。一方面检查是否有员工仍由原事业单位缴纳社保或保留事业编制，另一方面检查转制后企业获得的财政拨款占比是否不降反升或有新增拨款，表明未真正企业化。
  audit_item: 国有企业重点改革任务推进方面存在的问题
  suspicion: 事业单位转企改制“事企双轨”运行、财政依赖未切断
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于分类推进事业单位改革的指导意见\",\n    \"法规文号\": \"中发〔2011〕5号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分第6条、第七部分\",\n    \"内容概述\": \"推进转企改制，要周密制定转企改制工作方案，按规定进行资产清查、财务审计、资产评估，核实债权债务，界定和核实资产，并依法办理国有资产产权登记。做好与劳动就业、社会保障等政策的衔接。\"\
    \n  }\n]"
