name: audit/法律文书类/说明书
type: model
description: 从法律文书类类文档（说明书）中提取结构化元数据。涵盖字段如：募集资金总额、原定投资项目名称、承诺资金用途明细、限定用途明细、项目投资金额及占比。文档范围包括：企业债券募集说明书、募集说明书、资金募集说明书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 明细
- 金额
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 说明书
  member_count: 1
  member_details:
  - 企业债券募集说明书
  - 募集说明书
  - 资金募集说明书
output:
  fields:
  - name: 募集资金总额
    type: number
    description: 提取 募集资金总额 的数值（含单位，如万元、吨等）
  - name: 原定投资项目名称
    type: string
    description: 提取 原定投资项目名称 的文本值
  - name: 承诺资金用途明细
    type: string
    description: 提取 承诺资金用途明细 的文本值
  - name: 限定用途明细
    type: string
    description: 提取 限定用途明细 的文本值
  - name: 项目投资金额及占比
    type: number
    description: 提取 项目投资金额及占比 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 追踪表.每笔支出金额 > 0 && (追踪表.对应项目 != 说明书.原定投资项目名称) && (无相应股东会/董事会关于变更用途的决议 || 会议纪要.变更资金用途的决议日期 > 追踪表.支出日期)
  description: 当募集资金实际用于非说明书载明项目，且未履行变更审批程序或先支出后补程序，即构成擅自改变募集资金用途。
  audit_item: 资金管理方面存在的问题
  suspicion: 擅自改变募集资金用途
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国证券法\",\n    \"法规文号\": \"主席令第37号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百八十五条\"\
    ,\n    \"内容概述\": \"发行人擅自改变公开发行证券所募集资金的用途的，责令改正，处以罚款；相关责任人员给予警告并处罚款。\"\n  }\n]"
- expression: 债券资金使用台账.实际用途 NOT IN (企业债券募集说明书.承诺资金用途明细) && (资金用途变更批复文件 IS NULL || 债券资金使用台账.支出日期 < 资金用途变更批复文件.批复日期)
  description: 当实际支出用途与募集说明书约定的限定用途不符，且无相应监管批复文件，或批复日期晚于实际变更日期，判定为擅自变更用途。
  audit_item: 保障性安居工程企业债券使用不合规
  suspicion: 未经批准擅自改变债券资金用途
  regulation: "[\n  {\n    \"法规名称\": \"企业债券管理条例\",\n    \"法规文号\": \"国务院令第121号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条\",\n    \"内容概述\": \"企业发行企业债券所筹资金应当按照审批机关批准的用途使用，不得擅自改变资金用途。\"\n  }\n]"
