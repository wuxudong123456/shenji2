name: audit/法律文书类/备案证明
type: model
description: 从法律文书类类文档（备案证明）中提取结构化元数据。涵盖字段如：备案日期、备案账户名称、备案账户账号、备案面积、用地类型。文档范围包括：设施农业用地备案证明、银行账户开立备案证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 备案证明
  member_count: 1
  member_details:
  - 设施农业用地备案证明
  - 银行账户开立备案证明
output:
  fields:
  - name: 备案日期
    type: date
    description: 提取 备案日期 的日期值，格式 YYYY-MM-DD
  - name: 备案账户名称
    type: string
    description: 提取 备案账户名称 的文本值
  - name: 备案账户账号
    type: string
    description: 提取 备案账户账号 的文本值
  - name: 备案面积
    type: string
    description: 提取 备案面积 的文本值
  - name: 用地类型
    type: string
    description: 提取 用地类型 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (养殖场用地审批及用电优惠执行情况表.审批地类 IN ('工业用地','商业用地')) OR (养殖场用电清单.用电单价 > 政策文件.农业生产电价) OR (养殖场用地审批及用电优惠执行情况表.审批用时 > 30)
  description: 三个条件之一：1.粪污处理或养殖设施用地被自然资源部门按工业或商业用地审批，未适用设施农业用地或农用地政策；2.实际结算的用电单价高于当地公布的农业生产用电价格（如一般工商业电价0.7元/度 vs 农业电价0.4元/度）；3.设施农业用地审批备案平均用时超过30个工作日，超过优化营商环境的要求。满足任一条件即判定用地用电政策未落实。
  audit_item: 配套政策支持不到位
  suspicion: 养殖场用地未按农业用地管理或电价未执行农业生产优待
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部 农业农村部关于设施农业用地管理有关问题的通知\",\n    \"法规文号\": \"自然资规〔2019〕4号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条、第二条\",\n    \"内容概述\": \"设施农业用地包括生产设施用地和辅助设施用地，按农用地管理，不需办理农用地转用审批手续，养殖设施原则上不得占用永久基本农田。\"\n\
    \  },\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"部门规章\",\n\
    \   "
