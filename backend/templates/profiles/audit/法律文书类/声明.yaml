name: audit/法律文书类/声明
type: model
description: 从法律文书类类文档（声明）中提取结构化元数据。涵盖字段如：与申报方关系、专家姓名、关联企业名称、关联关系披露情况、利益冲突声明签字、工作单位。文档范围包括：第三方机构独立性声明、评审专家利益关联声明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 声明
  member_count: 1
  member_details:
  - 第三方机构独立性声明
  - 评审专家利益关联声明
output:
  fields:
  - name: 与申报方关系
    type: string
    description: 提取 与申报方关系 的文本值
  - name: 专家姓名
    type: string
    description: 提取 专家姓名 的文本值
  - name: 关联企业名称
    type: string
    description: 提取 关联企业名称 的文本值
  - name: 关联关系披露情况
    type: string
    description: 提取 关联关系披露情况 的文本值
  - name: 利益冲突声明签字
    type: string
    description: 提取 利益冲突声明签字 的文本值
  - name: 工作单位
    type: string
    description: 提取 工作单位 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (资质证书有效期截止日期 < 合同签订日期) OR (经营范围 NOT LIKE '%绩效评价%' AND 经营范围 NOT LIKE '%绩效管理%' AND 经营范围 NOT LIKE '%预算绩效%') OR
    (独立性声明中关联关系字段 = '存在关联' OR 利益冲突声明 = '未回避') OR (资质审核记录表.审核结论 = '不通过' AND 项目仍委托)
  description: 资质证书在合同签订日已过期或经营范围明显不含绩效评价类业务视为不具备条件；独立性声明中承认存在关联关系但未回避，或审核未通过却仍获得委托，反映机构不独立或流程失控。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 委托的第三方机构不具备绩效评价资质或存在独立性缺陷
  regulation: "[\n  {\n    \"法规名称\": \"关于委托第三方机构参与预算绩效管理的指导意见\",\n    \"法规文号\": \"财预〔2021〕6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"第三方机构应当具有独立承担民事责任的能力，具备提供服务所必需的设施、人员和专业技术能力，具有良好的信誉。\"\n  },\n  {\n    \"法规名称\"\
    : \"政府购买服务管理办法\",\n    \"法规文号\": \"财政部令第102号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十二条\",\n    \"内容概述\": \"购买主体应当依法确定承接"
- expression: (申报面积、入驻企业清单、孵化功能说明.申报面积 < 对照表.最低面积) OR (申报面积、入驻企业清单、孵化功能说明.入驻企业清单.企业总数 < 对照表.最低入驻企业数) OR ( (COUNT(申报面积、入驻企业清单、孵化功能说明.入驻企业清单.企业名称)
    - COUNT(入驻企业工商状态正常且社保缴纳人数>0)) / COUNT(申报面积、入驻企业清单、孵化功能说明.入驻企业清单.企业名称) > 0.2 ) OR (声明.关联企业名称 = True) OR (载体已获得补贴 AND 申报面积、入驻企业清单、孵化功能说明.认定评审得分
    < 合格线)
  description: 触发条件：申报面积或入驻企业数不达标；入驻企业清单中超过20%为虚假空壳企业（工商异常或无社保缴纳）；评审专家与载体股东存在关联关系；在未达到认定标准的情况下已获取补贴资金。满足任一条件视为违规。
  audit_item: 创业载体政策执行不到位
  suspicion: 违规认定创业载体骗取政策补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"各地应严格按规定范围、标准和程序使用就业补助资金，不得擅自扩大支出范围、提高支出标准，不得用于与就业创业无关的支出，确保资金安全规范有效使用。\"\n  },\n  {\n \
    \   \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"\
    内容概述\": \"国"
