violations:
- expression: (收费项目明细台账.收费项目名称 IN (行政事业性收费目录清单.收费项目名称) AND 收费项目明细台账.收费性质 = '经营服务性收费') OR (收费许可证.收费性质 = '经营服务性收费' AND 收费许可证.收费项目
    IN (行政事业性收费目录清单.收费项目名称) AND 经营服务性收费项目审批文件.批准文号 IS NULL AND 收费项目性质变更审批记录 IS NULL) OR (收费项目明细台账.收费项目名称 IN (行政事业性收费目录清单.收费项目名称)
    AND 银行账户入账流水.收款账户 NOT LIKE '%财政专户%')
  description: 表达式通过三组条件识别违规转性行为：(1)收费项目属于行政事业性收费目录却标记为经营服务性；(2)收费许可证显示经营服务性但无合法审批文件且无性质变更记录；(3)目录内收费收入未进入财政专户，表明资金被截留；触发任一即判定为疑点。
  audit_item: 不按照规定的预算级次、预算科目入库
  suspicion: 将行政事业性收费违规转为经营服务性收费管理
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于加强政府非税收入管理的通知\",\n    \"法规文号\": \"财综〔2004〕53号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二条第（一）项\",\n    \"内容概述\": \"行政事业性收费必须纳入财政管理，实行收支两条线，严禁将行政事业性收费转为经营服务性收费管理。\"\n  },\n  {\n    \"法规名称\":\
    \ \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第十八条\",\n    \"\
    内容概述\": \"收费项目"
- expression: 培训通知.收费标准 > 0 && (许可证.有效期限 != '有效' OR 许可证.收费标准 < 培训通知.收费标准) && 明细表.付款方 IN ('所属单位','企业','社会人员') && 职能文件.培训是否属于法定免费服务职责
    == '法定免费培训'
  description: 行政机关或事业单位在其法定职责范围内举办培训并收取费用，但无有效的收费许可或实际收费标准高于批复标准，且付款方为下属单位或企业的，即构成违规收费。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 违规向企事业单位收取培训费
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2016〕1223号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第四条、第五条\",\n    \"内容概述\": \"行政事业性收费实行中央和省两级审批管理，未按规定审批的不得收费；行政机关履行行政职能提供服务的，不得收取费用。\"\n  }\n]"
- expression: (对照表.实际开工日期 IS NOT NULL) && ((对照表.规划许可证核发日期 IS NULL) || (对照表.实际开工日期 < 对照表.规划许可证核发日期) || (备案文件.实测总建筑面积 > 许可证.许可建筑面积)
    || (备案文件.实际用途 != 许可证.规划用途) || (用地位置.用地性质 != 许可证.规划用途))
  description: 任一条件成立即违规：1.规划许可证缺失；2.实际开工早于规划许可证核发；3.竣工验收实测建筑面积超出许可面积；4.实际建设用途或用地性质与规划许可不符。面积超出无容忍，任何正偏差均违规。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得规划许可或未按规划许可规定建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第74号（2019修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十条、第六十四条\",\n    \"内容概述\": \"在城市、镇规划区内进行工程建设必须申请办理建设工程规划许可证。未取得许可证或未按许可规定建设的，由主管部门责令停止建设；尚可改正的限期改正，无法改正的限期拆除，并可处罚款。\"\
    \n  }\n]"
- expression: (对照表.实际开工日期 IS NOT NULL) && (对照表.施工许可证发证日期 IS NULL || 对照表.实际开工日期 < 对照表.施工许可证发证日期 || 施工合同.首笔工程款支付日期 < 对照表.施工许可证发证日期)
  description: 实际开工日期或首笔工程款支付日期早于施工许可证发证日期，或者施工许可证缺失但已开工，均构成违规。该表达式不考虑短时间容差，任何时序倒置即判定。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得施工许可证擅自施工或先开工后办证
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"中华人民共和国主席令第29号（2019修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第七条、第六十四条\",\n    \"内容概述\": \"建筑工程开工前，建设单位必须申请领取施工许可证（特定小型工程除外）。未取得施工许可证擅自施工的，责令改正，并处罚款。\"\n  },\n  {\n\
    \    \"法规名称\": \"建筑工程施工许可管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第18号（2018修正）\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条、第十二条\""
- expression: (审批清单.项目年综合能耗设计值 >= 1000 吨标准煤) && ((许可证.核发日期 < 评估报告.批复时间) || (日志.实际开工日期 < 评估报告.批复时间))
  description: 根据《固定资产投资项目节能审查办法》，年综合能耗超过1000吨标煤的项目，必须在施工许可或开工前通过节能审查。表达式通过比较三个核心日期，只要任一法定前置节点日期早于节能审查批复日期，即可判定为“未批先建”违规。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 项目未取得节能审查意见擅自开工建设
  regulation: "[\n  {\n    \"法规名称\": \"固定资产投资项目节能审查办法\",\n    \"法规文号\": \"国家发展和改革委员会令第44号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第三条、第九条\",\n    \"内容概述\": \"国家实行固定资产投资项目节能审查制度。未按规定进行节能审查或审查未通过的项目，建设单位不得开工建设，已建成的不得投入生产使用。\"\n  },\n  {\n\
    \    \"法规名称\": \"中华人民共和国节约能源法\",\n    \"法规文号\": \"中华人民共和国主席令第七十七号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十五条\",\n\
    \    \"内容概"
- expression: (许可证.发证日期 < 批复文件.批复日期) || (设计文件.批复日期 < 研究报告.批复日期) || (项目清单.实际开工日期 < 意见书.批复日期) || (许可证.发证日期 IS NULL && 项目清单.实际开工日期
    IS NOT NULL) || (评价报告.批复日期 < 批复文件.批复日期)
  description: 该表达式用于判定审批程序倒置或未批先建。主要逻辑包括：1) 规划许可证日期早于立项批复日期，表明程序倒置；2) 初设批复早于可研批复，违反基本建设程序；3) 实际开工日期早于用地审批文件日期，构成未批先建；4) 未取得规划许可证但已有实际开工记录，属于严重违法行为；5)
    环评批复早于立项批复，通常不符合逻辑，涉嫌程序违规。所有条件满足其一即触发疑点。
  audit_item: 未按规定办理项目审批等手续
  suspicion: 未批先建或程序倒置违规
