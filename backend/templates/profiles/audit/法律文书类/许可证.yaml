name: audit/法律文书类/许可证
type: model
description: 从法律文书类类文档（许可证）中提取结构化元数据。涵盖字段如：人防工程配建要求、允许倾倒方量、允许排放污染物种类、发证日期、发证机关、取水用途、套数、容积率。文档范围包括：乡村医疗机构执业许可证、企业安全生产许可证、供餐单位餐饮服务许可证、医疗机构执业许可证、医疗机构执业许可证副本、卫生许可证、危险化学品经营许可证、取水许可证、商品房预售许可证、城市规划许可证等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 工程
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 许可证
  member_count: 1
  member_details:
  - 乡村医疗机构执业许可证
  - 企业安全生产许可证
  - 供餐单位餐饮服务许可证
  - 医疗机构执业许可证
  - 医疗机构执业许可证副本
  - 卫生许可证
  - 危险化学品经营许可证
  - 取水许可证
  - 商品房预售许可证
  - 城市规划许可证
  - 建筑工程施工许可证
  - 建设工程规划许可证
  - 建设用地规划许可证
  - 排污许可证
  - 接收单位危险废物经营许可证
  - 收费许可证
  - 施工许可证
  - 村卫生室执业许可证
  - 海洋倾废许可证
  - 种子生产经营许可证
  - 职业资格鉴定收费许可证
