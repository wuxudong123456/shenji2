name: audit/法律文书类/确认书
type: model
description: 从法律文书类类文档（确认书）中提取结构化元数据。涵盖字段如：业主姓名、具体任务描述、实际交付日期、工作内容、房号、涉密标记、签订日期、覆盖工程名称。文档范围包括：业主交付确认书、工程管护责任主体确认书、第三方机构委托协议工作范围确认书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 工程
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 确认书
  member_count: 1
  member_details:
  - 业主交付确认书
  - 工程管护责任主体确认书
  - 第三方机构委托协议工作范围确认书
output:
  fields:
  - name: 业主姓名
    type: string
    description: 提取 业主姓名 的文本值
  - name: 具体任务描述
    type: string
    description: 提取 具体任务描述 的文本值
  - name: 实际交付日期
    type: date
    description: 提取 实际交付日期 的日期值，格式 YYYY-MM-DD
  - name: 工作内容
    type: string
    description: 提取 工作内容 的文本值
  - name: 房号
    type: string
    description: 提取 房号 的文本值
  - name: 涉密标记
    type: string
    description: 提取 涉密标记 的文本值
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 覆盖工程名称
    type: string
    description: 提取 覆盖工程名称 的文本值
  - name: 责任主体名称
    type: string
    description: 提取 责任主体名称 的文本值
  - name: 责任人
    type: string
    description: 提取 责任人 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (已竣工供水工程总数 - 登记证书.证书编号 > 0) || (责任清单.管护单位 = '' OR 责任清单.具体责任人 = '') || (确认书.签订日期 = '' OR 确认书 IS NULL)
  description: 产权证书未覆盖全部工程、管护责任清单中责任主体或责任人空缺、未按时签订书面责任确认书，任一条件满足即判定违规。
  audit_item: 工程建后管护不到位
  suspicion: 农村饮水工程产权、管护主体和责任不明确
  regulation: "[\n  {\n    \"法规名称\": \"水利部关于进一步加强农村饮水安全工程运行管护工作的指导意见\",\n    \"法规文号\": \"水农〔2015〕306号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二、明确管护主体和责任\",\n    \"内容概述\": \"农村饮水安全工程应明晰工程产权，落实管护主体、管护责任，确保工程有人管、管得好，长期发挥效益。\"\n  }\n]"
