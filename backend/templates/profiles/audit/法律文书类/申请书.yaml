name: audit/法律文书类/申请书
type: model
description: 从法律文书类类文档（申请书）中提取结构化元数据。涵盖字段如：申报企业名称、申报设备名称、申报设备名称及型号。文档范围包括：养殖企业申报补贴的申请书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 申请书
  member_count: 1
  member_details:
  - 养殖企业申报补贴的申请书
output:
  fields:
  - name: 申报企业名称
    type: string
    description: 提取 申报企业名称 的文本值
  - name: 申报设备名称
    type: string
    description: 提取 申报设备名称 的文本值
  - name: 申报设备名称及型号
    type: string
    description: 提取 申报设备名称及型号 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: （申报审批状态 == '通过'） && （实际发放金额 < 审批通过金额） || （ (申报设备名称 in 补贴装备目录) && (申报审批状态 == '驳回' || 申报审批状态 == '搁置') ）
  description: 该表达式包含两种违规情况：1. 审批通过但资金未足额发放；2. 申报设备在补贴目录内但被无故驳回或长期搁置。两种情况均判定为补贴落实不到位。
  audit_item: 畜禽粪污资源化利用方面不符合相关规定
  suspicion: 符合条件的装备未纳入补贴或补贴不到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位的支出必须按照预算执行，不得虚假列支。\"\n  }\n]"
- expression: （申报设备名称 in 补贴装备目录） && （申报设备名称 not in 地方补贴清单） && （申报审批状态 == '驳回'）
  description: 当企业申报的设备符合上级主管部门制定的补贴目录，但不符合地方自行制定的清单，并被以此为由驳回申请时，判定为违规。这通常属于地方增设门槛、架空上级政策。
  audit_item: 畜禽粪污资源化利用方面不符合相关规定
  suspicion: 以地方目录为由拒绝执行省级以上补贴政策
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加快推进畜禽养殖废弃物资源化利用的意见\",\n    \"法规文号\": \"国办发〔2017〕48号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"四（九）\",\n    \"内容概述\": \"要完善以绿色生态为导向的农业补贴制度，加大畜禽养殖废弃物资源化利用装备购置补贴力度。地方不得在中央和省级确定的补贴目录外增设限制条件。\"\n  }\n\
    ]"
