name: audit/法律文书类/收取通知
type: model
description: 从法律文书类类文档（收取通知）中提取结构化元数据。涵盖字段如：保证金项目名称、收取条件、收取金额、比例。文档范围包括：保证金收取通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 收取通知
  member_count: 1
  member_details:
  - 保证金收取通知
output:
  fields:
  - name: 保证金项目名称
    type: string
    description: 提取 保证金项目名称 的文本值
  - name: 收取条件
    type: string
    description: 提取 收取条件 的文本值
  - name: 收取金额
    type: number
    description: 提取 收取金额 的数值（含单位，如万元、吨等）
  - name: 比例
    type: number
    description: 提取 比例 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 明细台账.保证金项目名称 NOT IN (法定保证金项目名称、设立依据、法定保证金比例上限（如质量保证金不超过3%）.法定保证金项目名称) || (收取通知.保证金项目名称 未在单位设定的保证金项目名称、设立依据中载明  &&
    无任何政策文件依据)
  description: 若实际收取的保证金项目名称未出现在国务院或省级公布的涉企保证金目录清单中，或单位无法提供该保证金项目的设立依据文件、政策文件编号，则判定为违规收取无依据保证金。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 违规收取无政策依据的涉企保证金
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于清理规范工程建设领域保证金的通知\",\n    \"法规文号\": \"国办发〔2016〕49号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"全面清理各类保证金。对建筑业企业在工程建设中需缴纳的保证金，除依法依规设立的投标保证金、履约保证金、工程质量保证金、农民工工资保证金外，其他保证金一律取消。\"\
    \n  },\n  {\n    \"法规名称\": \"关于公布涉企保证金目录清单的通知\",\n    \"法规文号\": \"工信部联运行〔2017〕236号\",\n    \"效力级别\": \"部门规章\",\n  "
