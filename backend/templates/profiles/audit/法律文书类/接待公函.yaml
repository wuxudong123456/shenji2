name: audit/法律文书类/接待公函
type: model
description: 从法律文书类类文档（接待公函）中提取结构化元数据。涵盖字段如：事由、接待日期、邀请单位。文档范围包括：接待公函等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 接待公函
  member_count: 1
  member_details:
  - 接待公函
output:
  fields:
  - name: 事由
    type: string
    description: 提取 事由 的文本值
  - name: 接待日期
    type: date
    description: 提取 接待日期 的日期值，格式 YYYY-MM-DD
  - name: 邀请单位
    type: string
    description: 提取 邀请单位 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: ((DAYOFWEEK(接待公函.接待日期) IN (6,7) || 接待公函.接待日期 IN (法定节假日列表)) && 住宿费发票.地址 DISTANCE 被接待人信息.家庭住址 < 100km) || 接待公函.邀请单位
    IS NOT EXIST
  description: 接待发生在周末或节假日，且住宿地点距被接待人家庭地址不足100公里，或无法查到发函单位真实存在，高度怀疑借公务之名搭车报销个人探亲旅游费用。
  audit_item: 公务接待管理不符合规定
  suspicion: 将个人休假探亲费用纳入公务接待报销
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"接待单位应当严格控制国内公务接待范围，不得用公款报销或者支付应由个人负担的费用。\"\n  }\n]"
