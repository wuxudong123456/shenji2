name: audit/法律文书类/价格证明
type: model
description: 从法律文书类类文档（价格证明）中提取结构化元数据。涵盖字段如：同期同类资产市场租金或承包费标准、同类产品市场询价记录、行业价格指数。文档范围包括：市场公允价格证明、第三方评估报告或市场租赁价格证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 资产
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 价格证明
  member_count: 1
  member_details:
  - 市场公允价格证明
  - 第三方评估报告或市场租赁价格证明
output:
  fields:
  - name: 同期同类资产市场租金或承包费标准
    type: number
    description: 提取 同期同类资产市场租金或承包费标准 的数值（含单位，如万元、吨等）
  - name: 同类产品市场询价记录
    type: string
    description: 提取 同类产品市场询价记录 的文本值
  - name: 行业价格指数
    type: number
    description: 提取 行业价格指数 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (承租方/承包人名称、租赁单价、租赁期限、决策方式.承租方/承包人名称 IN (姓名、身份证号、与领导人员关系、特定关系人姓名、特定关系人姓名及其关联企业、特定关系人企业名称、亲属姓名、关联企业名称.特定关系人姓名及其关联企业))
    && (ABS(承租方/承包人名称、租赁单价、租赁期限、决策方式.租赁单价-同期同类资产市场租金或承包费标准.同期同类资产市场租金或承包费标准)/同期同类资产市场租金或承包费标准.同期同类资产市场租金或承包费标准 > 0.3 || 承租方/承包人名称、租赁单价、租赁期限、决策方式.决策方式
    != '公开招租')
  description: 筛查国有资产租赁或承包给领导人员特定关系人且租金明显低于市场价30%以上，或未经过公开招租程序的情况。未进行市场评估或未公开招租直接视为可疑线索。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 国有资产委托租赁承包给特定关系人经营
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第二项\",\n    \"内容概述\": \"不得将国有资产委托、租赁、承包给配偶、子女及其他特定关系人经营。\"\n  }\n]"
- expression: （ABS(销售合同台账.销售单价 - 同期同类产品销售价格明细表.同类产品同期平均销售单价) / 同期同类产品销售价格明细表.同类产品同期平均销售单价 > 0.15 ) && (定价审批单.申请折扣率 IS NULL
    OR 定价审批单.审批意见 != '集体决策通过') && 关联方关系清单.客户名称 = 销售合同台账.客户名称
  description: 筛选销售单价低于同期同类产品平均销售单价85%（即偏差率超过15%）的合同，且无集体决策审批记录或审批缺失，同时客户为关联方的交易，判定为异常。阈值15%参考除正常商业折扣外需说明定价公允性的通用标准。若客户非关联方但折扣异常且无合理审批，同样可视为疑点，需结合其他条件判断。
  audit_item: 销售与采购合同审计
  suspicion: 销售合同价格明显低于同期市场均价
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五百零九条\",\n    \"内容概述\": \"当事人应当按照约定全面履行自己的义务。若存在不合理低价交易损害国家利益或企业利益，可能构成违背诚实信用原则。\"\n  },\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\"\
    ,\n    \"法规文号\": \"国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"企业资产交易涉及关联交易的，应当"
