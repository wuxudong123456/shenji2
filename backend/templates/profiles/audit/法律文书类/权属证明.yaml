name: audit/法律文书类/权属证明
type: model
description: 从法律文书类类文档（权属证明）中提取结构化元数据。涵盖字段如：与领导关系、专利号、使用权面积、养殖档案存栏量、土地使用权人、土地承包合同面积、土地用途、土地证号。文档范围包括：保险标的权属证明、土地权属证明、土地管理部门出具的土地使用证或权属证明、抵押物权属证明、权属证明、领导人员私家车辆权属证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 合同
- 登记
- 知识产权
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 权属证明
  member_count: 1
  member_details:
  - 保险标的权属证明
  - 土地权属证明
  - 土地管理部门出具的土地使用证或权属证明
  - 抵押物权属证明
  - 权属证明
  - 领导人员私家车辆权属证明
output:
  fields:
  - name: 与领导关系
    type: string
    description: 提取 与领导关系 的文本值
  - name: 专利号
    type: string
    description: 提取 专利号 的文本值
  - name: 使用权面积
    type: string
    description: 提取 使用权面积 的文本值
  - name: 养殖档案存栏量
    type: string
    description: 提取 养殖档案存栏量 的文本值
  - name: 土地使用权人
    type: string
    description: 提取 土地使用权人 的文本值
  - name: 土地承包合同面积
    type: string
    description: 提取 土地承包合同面积 的文本值
  - name: 土地用途
    type: string
    description: 提取 土地用途 的文本值
  - name: 土地证号
    type: string
    description: 提取 土地证号 的文本值
  - name: 地块坐标
    type: string
    description: 提取 地块坐标 的文本值
  - name: 宗地图
    type: string
    description: 提取 宗地图 的文本值
  - name: 宗地面积
    type: string
    description: 提取 宗地面积 的文本值
  - name: 实际建设地块坐标
    type: string
    description: 提取 实际建设地块坐标 的文本值
  - name: 法律状态
    type: boolean
    description: 提取 法律状态 的布尔值（是/否）
  - name: 用途
    type: string
    description: 提取 用途 的文本值
  - name: 登记日期
    type: date
    description: 提取 登记日期 的日期值，格式 YYYY-MM-DD
  - name: 评估价值
    type: string
    description: 提取 评估价值 的文本值
  - name: 车主姓名
    type: string
    description: 提取 车主姓名 的文本值
  - name: 车牌号
    type: string
    description: 提取 车牌号 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 车辆费用报销台账.报销车牌号 NOT IN (公务用车调配登记表.公务车车牌号) AND 车辆费用报销台账.报销车牌号 = 领导人员私家车辆权属证明.车牌号 AND (车辆费用报销台账.金额 > 5000 OR 车辆费用报销台账.加油频次
    > 4)
  description: 报销车牌不在企业公务车清单内，且该车为领导本人或亲属名下，月度费用异常，即判定为公款支付私家车费用。
  audit_item: 公款用于个人支出
  suspicion: 公款报销领导私家车辆费用
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有企业负责人职务消费的指导意见\",\n    \"法规文号\": \"国资发分配〔2006〕69号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业负责人职务消费应坚持从紧必需原则，不得用于应由个人承担的费用，不得随意扩大职务消费范围或提高消费标准。\"\n  }\n]"
- expression: (权属证明.法律状态（有效/失效/过期） = '失效' || 评估报告.可收回金额 <= 0) && (明细表.资产原值 - 明细表.累计摊销 - 明细表.减值准备余额 > 0)
  description: 无形资产法律保护期届满或预期不能带来经济利益时，其账面价值应全额计提减值或核销，若账面仍有余额则为虚增资产。
  audit_item: 未按规定核算资产
  suspicion: 已失效无形资产未作减值处理
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第6号——无形资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"无形资产预期不能为企业带来经济利益的，应当将该无形资产的账面价值予以转销。\"\n  }\n]"
- expression: (土地权属证明.实际建设地块坐标 != 原始规划图纸.原始规划地块坐标 || ABS(地块面积变更登记台账.变更后面积 - 原始规划图纸.原始批准面积) > 0) && (地块调整审批文件.审批意见 != '同意'
    || 地块调整审批文件 IS NULL)
  description: 建设地块位置或面积出现与原始批复不一致，且无有效审批文件，即为擅自调整。位置变化通过坐标比对判定，面积变化以变更台账与批复面积差异>0为阈值。
  audit_item: 不符合高标准农田建设相关规定的行为
  suspicion: 擅自调整建设地块和面积
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十一条\",\n    \"内容概述\": \"项目计划一经下达，不得随意调整。确需调整的，应当按规定程序报批。\"\n  }\n]"
- expression: (审批台账.审批编号 == NULL OR 权属证明.土地证号 == NULL) && 项目清单.占地面积 > 0 && (对照表.规划用地性质 != '殡葬用地' OR 影像资料.现状用途 == '农用地' OR
    影像资料.现状用途 == '林地')
  description: 判定规则：公墓已建设（项目清单中有占地），但用地审批台账或土地权属证明缺失，且实际占地不符合规划用途或涉及转用未批。触犯任一土地性质不符条件即为严重违规。
  audit_item: 农村公益性殡葬建设不符合相关规定
  suspicion: 农村公益性公墓无建设用地手续违规占地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号（2019年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十四条\",\n    \"内容概述\": \"建设占用土地，涉及农用地转为建设用地的，应当办理农用地转用审批手续。\"\n  },\n  {\n    \"法规名称\": \"殡葬管理条例\",\n\
    \    \"法规文号\": \"国务院令第225号（2012年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"建设殡葬设施，应当履行用地审批和规划许可手续，不"
- expression: ((项目名称.审批面积 IS NULL OR 批准书.批准书文号 IS NULL) && (检查记录.开工状态 = '已占用')) || ((批准书.四至范围 != 许可证.红线图坐标及边界) && (ABS(批准书.批准面积
    - 权属证明.宗地面积) / 批准书.批准面积 > 0.05)) || (供应台账.受让人 != 发证台账.权利人 && 检查记录.开工状态 = '已占用')
  description: 表达式由三个或条件分支构成，触发任一即高度可疑。分支1：在审批台账或批准书缺失的情况下（未批），监察记录却显示已占用（先占），构成未批先占。分支2：实际批准的红线范围与许可的红线图不符，且权属证明的实际用地面积与批准面积偏差超过5%，构成批少占多。分支3：土地供应或登记的权利人与实际受让人（使用人）不一致，且已实际占用，构成违法转让或骗取批准后占用。
  audit_item: 未办理土地变更手续非法占用土地
  suspicion: 未经批准或骗取批准非法占用土地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第七十七条\",\n    \"内容概述\": \"未经批准或者采取欺骗手段骗取批准，非法占用土地的，由县级以上人民政府自然资源主管部门责令退还非法占用的土地，对违反土地利用总体规划擅自将农用地改为建设用地的，限期拆除在非法占用的土地上新建的建筑物和其他设施，恢复土地原状，对符合土地利用总体规划的，没收在非法占用的土地上新建的建筑物和其他设施，可以并处罚款；对非法占用土地单位的直接负责的主管人员和其他直接责任人员，依法"
