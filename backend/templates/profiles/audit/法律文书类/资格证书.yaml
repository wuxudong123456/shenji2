name: audit/法律文书类/资格证书
type: model
description: 从法律文书类类文档（资格证书）中提取结构化元数据。涵盖字段如：备案机构、姓名、执业范围、执业证书编号、持证人姓名、有效期、身份证号。文档范围包括：乡村医生执业资格证书、医护人员执业资格证书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 资格证书
  member_count: 1
  member_details:
  - 乡村医生执业资格证书
  - 医护人员执业资格证书
output:
  fields:
  - name: 备案机构
    type: string
    description: 提取 备案机构 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 执业范围
    type: string
    description: 提取 执业范围 的文本值
  - name: 执业证书编号
    type: string
    description: 提取 执业证书编号 的文本值
  - name: 持证人姓名
    type: string
    description: 提取 持证人姓名 的文本值
  - name: 有效期
    type: string
    description: 提取 有效期 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 乡镇卫生院/村卫生室人员配备统计表.在岗人员姓名 NOT IN (乡村医生执业资格证书.姓名 WHERE 乡村医生执业资格证书.注册状态='有效') OR 未注册/无证行医人员排查清单.姓名 IS NOT NULL
  description: 将人员配备表中在岗医生与有效执业注册人员库比对，不能匹配的即涉嫌无证执业；同时列表中的已确认未注册/无证行医案例直接判定为违规。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不合规
  suspicion: 存在未注册或无执业资质人员从事乡村医疗
  regulation: "[\n  {\n    \"法规名称\": \"乡村医生从业管理条例\",\n    \"法规文号\": \"国务院令第386号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第九条、第十五条\",\n    \"内容概述\": \"国家实行乡村医生执业注册制度，未经注册取得乡村医生执业证书的，不得从事乡村医疗活动；乡村医生变更执业的村医疗卫生机构，应当办理变更注册手续。\"\n  }\n]"
- expression: (证明编号、患者姓名、开具医师签名、开具时间、证明内容.开具医师签名 not in 资格证书.持证人姓名) || (证明编号、患者姓名、开具医师签名、开具时间、证明内容.证明内容 未关联 药品名称、规格、数量、开药日期、患者姓名.检查单号)
  description: 判定两点：一是开具医师无合法执业资质；二是出具的证明（如健康体检合格）没有对应的客观检查报告支撑，属于虚假证明。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 无资质或虚假依据开具医学证明
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国执业医师法\",\n    \"法规文号\": \"主席令第五号（旧）/ 医师法（主席令第九十四号）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第二十三条、第三十六条\",\n    \"内容概述\": \"医师实施医疗、预防、保健措施，签署有关医学证明文件，必须亲自诊查、调查，并按照规定及时填写医学文书，不得隐匿、伪造、篡改或者擅自销毁医学文书。\"\
    \n  }\n]"
