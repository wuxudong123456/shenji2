name: audit/法律文书类/会议纪要
type: model
description: 从法律文书类类文档（会议纪要）中提取结构化元数据。涵盖字段如：主持人、争议描述、争议记录、人均摊派金额、会议内容关于是否上报审批的决定、会议决议内容、会议决议情况、会议召开日期与批复日期逻辑顺序。文档范围包括：三重一大会议纪要、会议纪要、住房公积金管理委员会会议纪要（近三年）、党委会战略决策会议纪要、内部会议纪要、农村公路建设与养护专题会议纪要、农民集资摊派相关通知或会议纪要、决策会议纪要、土地出让会议纪要、地方政府土地出让相关会议纪要等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 会议
- 审批
- 金额
- 元数据提取
