name: audit/法律文书类/合格证书
type: model
description: 从法律文书类类文档（合格证书）中提取结构化元数据。涵盖字段如：审查机构盖章、审查结论、所在村庄、机井编号、电压等级、签发日期、通电状态、验收日期。文档范围包括：图纸审查合格证书、机井通电工程验收合格证书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 验收
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 合格证书
  member_count: 1
  member_details:
  - 图纸审查合格证书
  - 机井通电工程验收合格证书
output:
  fields:
  - name: 审查机构盖章
    type: string
    description: 提取 审查机构盖章 的文本值
  - name: 审查结论
    type: string
    description: 提取 审查结论 的文本值
  - name: 所在村庄
    type: string
    description: 提取 所在村庄 的文本值
  - name: 机井编号
    type: string
    description: 提取 机井编号 的文本值
  - name: 电压等级
    type: string
    description: 提取 电压等级 的文本值
  - name: 签发日期
    type: date
    description: 提取 签发日期 的日期值，格式 YYYY-MM-DD
  - name: 通电状态
    type: boolean
    description: 提取 通电状态 的布尔值（是/否）
  - name: 验收日期
    type: date
    description: 提取 验收日期 的日期值，格式 YYYY-MM-DD
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (设计文件.设计参数（如荷载、防火等级） 不符合 强制性标准对应阈值) && (合格证书.审查结论 == '合格') || (审查记录.符合性结论 == '不符合' && 通知单.批准日期 > 合格证书.签发日期)
  description: 比对设计图纸中的关键参数是否违反工程建设强制性标准中规定的限值（如结构安全系数、消防通道宽度等）。若图纸审查记录显示符合标准，但实际参数不符，或审查发现不符合项但未经正式设计变更即通过审查，均为可疑。
  audit_item: 工程质量事故调查
  suspicion: 设计文件违反工程建设强制性标准
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号（2019年修正）\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第十条\",\n    \"内容概述\": \"建设工程发包单位不得迫使承包方以低于成本的价格竞标，不得任意压缩合理工期。建设单位不得明示或者暗示设计单位或者施工单位违反工程建设强制性标准，降低建设工程质量。\"\
    \n  },\n  {\n    \"法规名称\": \"实施工程建设强制性标准监督规定\",\n    \"法规文号\": \"建设部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二条、第"
- expression: (规划文件.年度机井通电计划数量 - 合格证书.COUNT(ID)含已验收且通电) / 规划文件.年度机井通电计划数量 > 0.20) || (合格证书.通电状态（是/否） == 是 && 数据表.电流值（A） <
    0.1A 持续30天) || (明细表.材料采购单价 > 同期同地区市场均价 * 1.2)
  description: 当年规划完成机井通电数量与实际验收通电数量缺口率超过20%，属于政策落实严重滞后；已验收通电的机井在负荷测试中出现持续30天电流值小于0.1A，说明存在虚假通电或线路故障闲置；材料采购单价超出市场均价20%以上，可能存在利益输送。
  audit_item: 农村配套供电设施建设不到位
  suspicion: 机井通电政策落实不到位
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2022〕986号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十四条\",\n    \"内容概述\": \"农村电网改造升级项目应当优先安排农业生产供电急需、农民群众反映强烈的项目，确保项目按期建成发挥效益。\"\n  }\n]"
