name: audit/法律文书类/结算书
type: model
description: 从法律文书类类文档（结算书）中提取结构化元数据。涵盖字段如：变更增减费用列项及总价、变更调整后结算总价、实际结算金额、申报工程量、综合单价、违约金扣除栏。文档范围包括：工程造价结算书、竣工结算书、结算书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 工程
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 结算书
  member_count: 1
  member_details:
  - 工程造价结算书
  - 竣工结算书
  - 结算书
output:
  fields:
  - name: 变更增减费用列项及总价
    type: number
    description: 提取 变更增减费用列项及总价 的数值（含单位，如万元、吨等）
  - name: 变更调整后结算总价
    type: string
    description: 提取 变更调整后结算总价 的文本值
  - name: 实际结算金额
    type: number
    description: 提取 实际结算金额 的数值（含单位，如万元、吨等）
  - name: 申报工程量
    type: string
    description: 提取 申报工程量 的文本值
  - name: 综合单价
    type: number
    description: 提取 综合单价 的数值（含单位，如万元、吨等）
  - name: 违约金扣除栏
    type: string
    description: 提取 违约金扣除栏 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: COUNT(审批台账.所有变更编号 GROUP BY 同一分部分项工程) > 1 && SUM(审批台账.累计变更金额) > 施工合同.合同金额*10% && MAX(审批台账.单次变更金额) < (施工合同.合同金额*10%*0.9)
  description: 对同一施工部位或分部分项在短期内多次申报小金额变更，每笔均低于合同价10%的审批门槛，但累计总额超过合同价10%，属于化整为零规避专项审批或重新招标。若单次变更金额均控制在限额的90%以下，且时间间隔小于30天，疑点等级为高。
  audit_item: 工程变更审计评估
  suspicion: 将同一变更项目化整为零规避招标或审批
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n   \
    \ \"法规文号\": \"国家发展和改革委员会令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"本规定第二条至第四条规定范围内的项目，其勘察、设计、施工"
- expression: (ABS(签证单.工程量 - 踏勘记录.尺寸) > 0) || (验收记录.验收部位 != 签证单.签证内容) || (日志.施工内容 != 签证单.签证内容 && 日志.旁站记录 IS NULL)
  description: 签证工程量与实际核查工程量存在正偏差即判定为虚假；隐蔽验收记录部位与签证部位不匹配，或施工日志无对应记录且监理未旁站，均表明签证内容虚假。若工程量虚增比例>15%，属于严重虚报冒领。
  audit_item: 工程变更审计评估
  suspicion: 虚假工程变更套取建设资金
  regulation: "[\n  {\n    \"法规名称\": \"建设项目审计处理暂行规定\",\n    \"法规文号\": \"审投发[1996]105号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"建设项目不突破设计概算，对超出设计概算的投资，审计中发现有高估冒算、虚假签证等行为的，应当予以核减，并按规定处理。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"单位和个人有下列骗取财政资金"
- expression: (验收报告.实际竣工日期 - 其他.合同约定竣工日期 - 申请批复.批准延期天数 > 30天) && (结算书.违约金扣除栏 = 0 或 结算书.违约金扣除栏 < 其他.误期违约金计算标准（万分之几/天或总额上限）
    × 逾期天数)
  description: 逻辑规则：计算剔除合理顺延后的实际逾期天数，若逾期超过30天（审计风险阈值），且结算时未扣减相应违约金，或扣减金额远低于合同约定的违约金比例，判定为建设方监管失职或利益输送，导致国有资产损失。
  audit_item: 某公共建筑合同履行审
  suspicion: 工期延误未按合同约定索赔
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第45号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五百七十七条\"\
    ,\n    \"内容概述\": \"当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行、采取补救措施或者赔偿损失等违约责任。\"\n  },\n  {\n    \"法规名称\": \"建设工程施工合同（示范文本）\"\
    ,\n    \"法规文号\": \"GF-2017-0201\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"7.5, 14.2\",\n    \"内容概述\": \"因承包人原因造成工期延误"
- expression: 结算书.申报工程量 > 竣工图.计算工程量 * 1.05 || (结算书.申报工程量 > 现场勘查记录.实测工程量 * 1.03) || (现场签证单无监理及业主签字确认却进入结算)
  description: 结算申报量超出竣工图计算量5%以上，或超出实际勘查量3%以上，即视为虚报。签证手续不全的工程量不得计入，计入即违规。对土方、拆除等隐蔽工程需重点复核。
  audit_item: 重大工程项目全过程审计
  suspicion: 虚列建设成本或虚报工程量套取资金
  regulation: "[\n  {\n    \"法规名称\": \"基本建设财务规则\",\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十二条\",\n    \"内容概述\": \"项目建设单位应当严格按照合同约定和工程价款结算程序支付工程款。……工程价款结算应当依据合同、设计变更、现场签证等资料，按照工程完成进度据实结算。\"\n  },\n  {\n    \"\
    法规名称\": \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建〔2004〕369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\"\
    : \"工程"
