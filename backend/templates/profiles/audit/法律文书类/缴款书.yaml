name: audit/法律文书类/缴款书
type: model
description: 从法律文书类类文档（缴款书）中提取结构化元数据。涵盖字段如：上缴金额、入库税款所属期、执收单位、执收单位名称、收入项目、票据号码、税种、缴款书金额。文档范围包括：缴款书、非税收入一般缴款书（属原始凭证）、非税收入缴款书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 缴款书
  member_count: 1
  member_details:
  - 缴款书
  - 非税收入一般缴款书（属原始凭证）
  - 非税收入缴款书
output:
  fields:
  - name: 上缴金额
    type: number
    description: 提取 上缴金额 的数值（含单位，如万元、吨等）
  - name: 入库税款所属期
    type: number
    description: 提取 入库税款所属期 的数值（含单位，如万元、吨等）
  - name: 执收单位
    type: string
    description: 提取 执收单位 的文本值
  - name: 执收单位名称
    type: string
    description: 提取 执收单位名称 的文本值
  - name: 收入项目
    type: number
    description: 提取 收入项目 的数值（含单位，如万元、吨等）
  - name: 票据号码
    type: string
    description: 提取 票据号码 的文本值
  - name: 税种
    type: string
    description: 提取 税种 的文本值
  - name: 缴款书金额
    type: number
    description: 提取 缴款书金额 的数值（含单位，如万元、吨等）
  - name: 缴款日期
    type: date
    description: 提取 缴款日期 的日期值，格式 YYYY-MM-DD
  - name: 缴款金额
    type: number
    description: 提取 缴款金额 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: ABS((银行对账单.收款金额与付款给委托方的记录 - 收入支出明细表.非税收入决算数) / 银行对账单.收款金额与付款给委托方的记录) > 0.05 || (银行对账单.收款金额与付款给委托方的记录 > 0 &&
    非税收入一般缴款书.票据存根缺失)
  description: 该表达式判定两种违规场景：1. 将单位所有银行账户收到的疑似非税收入资金，与财务账面及上缴财政的票据进行比对，若资金流入与确认收入总额偏差率绝对值超过5%，视为异常，可能存在资金滞留或挪用，即少计收入。2. 若银行账户存在疑似非税收入性质的收款记录，但审计无法获取对应的非税收入一般缴款书存根，直接判定为隐匿收入。
  audit_item: 决算报表内容不真实
  suspicion: 隐匿非税收入导致决算少计
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十六条\",\n    \"内容概述\": \"政府的全部收入应当上缴国家金库，任何部门、单位和个人不得截留、占用、挪用或者拖欠。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n\
    \    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"财政收入执收单位及其工作人员有违反规定设立财政收入项目、擅自改"
- expression: (租金收取台账.租金收入账户银行流水.交易摘要 LIKE '%付%' || 租金收取台账.租金收入账户银行流水.交易摘要 LIKE '%支%' || 租金收取台账.租金收入账户银行流水.对方户名 != '非税收入汇缴户'
    ) && ABS(租金收取台账.租金收入账户银行流水.金额) > 0 && 租金收取台账.租金收入账户银行流水.对方户名 != '财政专户'
  description: 筛查租金收入专用账户（或收取租金的账户）银行流水中，存在摘要为支付费用（含‘付’、‘支’等字样）或对方户名为第三方机构（如物业公司、维修公司、供应商）的支出记录，且该笔支出未通过‘上缴国库/财政专户’后通过预算拨付，则判定为坐支租金收入。ABS函数取绝对值，确保支出金额大于0。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 租金收入直接坐支用于日常运营
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条 及 第五十六条\",\n    \"内容概述\": \"各部门、各单位是本部门、本单位的预算执行主体，负责本部门、本单位的预算执行，并对执行结果负责。政府的全部收入应当上缴国家金库，任何部门、单位和个人不得截留、占用、挪用或者拖欠。\"\
    \n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n    \"法规文号\": \"中华人民共和国国务院令第427号\",\n    \"效力级别\": \"行政法"
- expression: 租金收取台账.代收企业代收台账.缴纳日期 + 30天 < 非税收入缴款书.国库入账日期 && 租金收取台账.实收金额 > 0
  description: 设定一般缴库时限为30天（结合地方规定调整）。若代收企业收到租金之日起超过30天才上缴财政，且在此期间相关资金滞留在代收企业账户或单位归集户中形成大额沉淀余额，则判定为滞留非税收入。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 租金收入长期滞留代收企业未上缴
  regulation: "[\n  {\n    \"法规名称\": \"《政府非税收入管理办法》\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"执收单位应当加强非税收入征收管理，依照规定的范围和标准及时足额征收，并按照规定的时限和缴库方式，及时足额将非税收入缴入国库或者财政专户，不得多征、提前征收或者减征、免征、缓征非税收入。\"\
    \n  },\n  {\n    \"法规名称\": \"《中华人民共和国国家金库条例》\",\n    \"法规文号\": \"国发〔1985〕96号\",\n    \"效力级别\": \"行政法规\",\n    \"条"
- expression: 租赁合同.月租金标准 != 非税收入缴款书.国库实际入账金额 / 月份数 && (租金收取台账.第三方支付平台流水.扣款项名称 LIKE '%手续费%' || 租金收取台账.第三方支付平台流水.扣款项名称 LIKE
    '%服务费%')
  description: 比对租户应缴的月租金标准与最终缴入国库的非税收入金额，若存在差异，且差异金额在缴费渠道流水（如微信、支付宝、银联）中体现为被扣除的“手续费”、“平台服务费”、“管理费”等，即判定为违规截留。非税收入应全额上缴，代收成本应由财政预算另行安排，不得从中扣除。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 以手续费等名义截留部分租金
  regulation: "[\n  {\n    \"法规名称\": \"《政府非税收入管理办法》\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"除财政部另有规定外，执收单位不得擅自将非税收入分成或者转移。非税收入应当全额上缴国库，任何单位和个人不得截留、坐支、挪用。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政部关于加强政府非税收入管理的通知\",\n    \"法规文号\": \"财综〔2004〕53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三点（规范征收行为）\",\n  \
    \  \"内容概"
- expression: (单位财务账簿.科目余额表.其他应付款 > 0 OR 单位财务账簿.科目余额表.预收账款 > 0) AND 单位财务账簿.记账凭证摘要 LIKE '%租金%' AND 财政预算批复文件.非税收入预算数 == 0
  description: 筛查单位财务账中，存在“其他应付款-某单位”、“预收账款-租金”等挂账科目，且有大量租金性质的资金流入记录。同时，在财政批复的年度部门预算中，未将该项租金收入列入非税收入预算，或者虽列入预算但实际入库数为零，资金长期滞留在单位应付款项中形成沉淀。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 租金收入挂往来账未纳入预算
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十六条\",\n    \"内容概述\": \"各部门、各单位应当依法将所有政府收入全部纳入预算，不得隐瞒、少列。\"\n  },\n  {\n    \"法规名称\": \"《中华人民共和国会计法》\",\n    \"\
    法规文号\": \"中华人民共和国主席令第28号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\": \"各单位发生的各项经济业务事项应当在依法设置的会计账簿上统一登记、核"
