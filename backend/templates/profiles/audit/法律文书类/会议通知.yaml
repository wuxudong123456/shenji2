name: audit/法律文书类/会议通知
type: model
description: 从法律文书类类文档（会议通知）中提取结构化元数据。涵盖字段如：会议主题、会议召开日期、会议地点、会议时间、参会单位范围、地点、批准天数、议题。文档范围包括：会议通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 人员
- 会议
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 会议通知
  member_count: 1
  member_details:
  - 会议通知
output:
  fields:
  - name: 会议主题
    type: string
    description: 提取 会议主题 的文本值
  - name: 会议召开日期
    type: date
    description: 提取 会议召开日期 的日期值，格式 YYYY-MM-DD
  - name: 会议地点
    type: string
    description: 提取 会议地点 的文本值
  - name: 会议时间
    type: date
    description: 提取 会议时间 的日期值，格式 YYYY-MM-DD
  - name: 参会单位范围
    type: string
    description: 提取 参会单位范围 的文本值
  - name: 地点
    type: string
    description: 提取 地点 的文本值
  - name: 批准天数
    type: number
    description: 提取 批准天数 的数值（含单位，如万元、吨等）
  - name: 议题
    type: string
    description: 提取 议题 的文本值
  - name: 通知下发时间
    type: date
    description: 提取 通知下发时间 的日期值，格式 YYYY-MM-DD
  - name: 通知参会单位及人员范围
    type: string
    description: 提取 通知参会单位及人员范围 的文本值
  - name: 通知发布时间
    type: date
    description: 提取 通知发布时间 的日期值，格式 YYYY-MM-DD
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (实际天数 > 通知发布时间.批准天数) || (报销会议名称.门票 || 报销会议名称.交通费、门票、游览费等非会议支出)
  description: 实际会期比批准天数多出1天及以上即为超天数；若费用明细中出现景区门票、旅游包车、导游费等，无论天数是否超，均构成借会议名义旅游。
  audit_item: 超标准举办会议
  suspicion: 会议超批准天数或借会议名义组织旅游
  regulation: "[\n  {\n    \"法规名称\": \"《党政机关厉行节约反对浪费条例》\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁以培训、考察、会议等名义组织公款旅游。\"\n  },\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\"\
    : \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"会议期间不得组织旅游以及与会议无关的参观活动，严禁以任何名义发放纪念品。\"\
    \n"
- expression: 时间记录.实际会期起止 < 超预算审批记录.审批签批日期 || 审批记录缺失
  description: 会议正式开始日期早于审批单上最后签批日期的，视为先实施后审批；若无法提供任何审批记录，则属于未经审批擅自举办会议，同样违规。
  audit_item: 超标准举办会议
  suspicion: 会议未经适当审批或先实施后补批
  regulation: "[\n  {\n    \"法规名称\": \"《党政机关厉行节约反对浪费条例》\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"会议等公务活动应当严格执行审批程序，从严控制。\"\n  }\n]"
- expression: 实际签到人数.实际签到人数 > 超预算审批记录.批准参会人数
  description: 实际签到人数大于批准人数即构成超人数举办会议。超员比例≥20%为严重，10%-20%为一般。注意剔除临时旁听等合理情况。
  audit_item: 超标准举办会议
  suspicion: 实际参会人数超出批准人数
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条\",\n    \"内容概述\": \"各单位应当严格控制会议数量、会期和参会人员规模，会议工作人员控制在会议代表人数的10%以内。\"\n  }\n]"
- expression: (人员名单.单位 != 通知发布时间.通知参会单位及人员范围) || (同或协议.位置 包含 风景区) || (情况记录.实际活动内容 包含 旅游、考察、休闲 且 未在正式议程中)
  description: 参会人员超出规定范围（如家属、无关单位），或在风景区高消费场所办会，或议程外安排旅游休闲活动，任一条件满足即构成超范围。
  audit_item: 超标准举办会议
  suspicion: 超范围举办会议（含无关人员或变相旅游）
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十条\",\n    \"内容概述\": \"严禁到风景名胜区开会，不得借会议名义组织旅游或安排与会议无关的参观活动，不得宴请与会人员或发放纪念品。\"\n  }\n]"
- expression: 缺失(会议通知) || 缺失(参会人员签到表) || 缺失(费用原始明细单据) || 缺失(发票) || (参会人员签到表.签到人数 != 发票.金额 / 人均定额 AND ABS(偏差) > 10%)
  description: 每笔会议费报销必须附有完整的支撑材料。若缺少会议通知、签到表、费用明细、发票中的任一项，直接判为违规。此外，若签到人数与费用结算人数逻辑不匹配（如按人头计算的费用），偏差超过10%，则可能存在虚增人数。
  audit_item: 会议费审计
  suspicion: 会议费报销凭证关键附件缺失
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"会议费报销时应当提供会议审批文件、会议通知及实际参会人员签到表、定点会议场所等会议服务单位提供的费用原始明细单据、电子结算单等凭证。\"\n  }\n]"
- expression: 参会人员签到表.签到人数 <= 3 || (会议费发票.金额 >= 本期同类会议平均金额 * 3) || (银行付款凭证.收款方名称 关联 利益关系人)
  description: 若报销的会议没有任何现场照片、视频等痕迹，且签到人数极少（如≤3人），或单笔会议费金额异常巨大（超出同类会议平均3倍），或收款方与本单位人员存在关联关系，则高度疑似虚假会议套现。
  audit_item: 会议费审计
  suspicion: 虚列会议费套取资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条、第二十六条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，不得以虚假的经济业务事项或者资料进行会计核算。\"\n  }\n]"
- expression: (会议纪要.会议时间 IS NULL) || (会议纪要.主持人 IS NULL) || (会议纪要.出席人员 IS NULL) || (会议纪要.决定事项 IS NULL)
  description: 当会议纪要中时间、主持人、出席人员、决定事项任一字段为NULL或空字符串时，即判定为记录要素缺失，存在重大决策记录不完整风险，可能影响决策效力。
  audit_item: 整理会议记录
  suspicion: 会议纪要缺失关键决策要素
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党党组工作条例\",\n    \"法规文号\": \"中发〔2019〕15号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第三十三条\",\n    \"内容概述\": \"党组会议应当有专门记录，编发会议纪要，并按照规定存档备查。记录内容包括会议时间、地点、主持人、出席人员、列席人员、请假人员、记录人等基本情况，议题，讨论发言，表决情况，决定等。\"\
    \n  }\n]"
