name: audit/法律文书类/权属证书
type: model
description: 从法律文书类类文档（权属证书）中提取结构化元数据。涵盖字段如：抵押登记栏、登记条款、证书类型。文档范围包括：集体资产权属证书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 登记
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 权属证书
  member_count: 1
  member_details:
  - 集体资产权属证书
output:
  fields:
  - name: 抵押登记栏
    type: string
    description: 提取 抵押登记栏 的文本值
  - name: 登记条款
    type: number
    description: 提取 登记条款 的数值（含单位，如万元、吨等）
  - name: 证书类型
    type: string
    description: 提取 证书类型 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (贷款台账.借款主体类型='农村集体经济组织' && 贷款台账.贷款利率 > (数据.平均利率 * 1.2)) OR (金融统计期内集体经济组织贷款获批笔数 = 0 && 同类企业获批笔数 > 0)
  description: 对比集体经济组织贷款利率与同类企业平均利率，若超出20%或高出1.5个百分点以上，或近两年无任何集体经济组织贷款获批，而同类企业贷款正常，即视为金融支持政策未落实。
  audit_item: 政策支持落实和监督检查不到位
  suspicion: 农村集体经济组织融资担保政策不完善
  regulation: "[\n  {\n    \"法规名称\": \"关于金融服务乡村振兴的指导意见\",\n    \"法规文号\": \"银发〔2019〕8号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"要求金融机构创新符合农村集体经济组织特点的金融产品，合理确定贷款利率，降低融资成本。\"\n  }\n]"
