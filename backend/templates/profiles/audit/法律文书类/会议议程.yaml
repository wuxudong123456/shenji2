name: audit/法律文书类/会议议程
type: model
description: 从法律文书类类文档（会议议程）中提取结构化元数据。涵盖字段如：议程内容、议程安排、议程活动安排。文档范围包括：会议议程等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 会议议程
  member_count: 1
  member_details:
  - 会议议程
output:
  fields:
  - name: 议程内容
    type: string
    description: 提取 议程内容 的文本值
  - name: 议程安排
    type: string
    description: 提取 议程安排 的文本值
  - name: 议程活动安排
    type: string
    description: 提取 议程活动安排 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (通知文件.通知地点 包含于 风景名胜区名录 OR 通知文件.通知地点 != 单位驻地城市) && (报销凭证.目的地城市 = 通知文件.通知地点) && (会议议程.实际举办时间 < 报销凭证.往返时间 * 0.5
    OR 消费凭证.金额 > 0)
  description: 将会议地点与《关于严禁党政机关到风景名胜区开会的通知》所列名录进行匹配，或与单位驻地城市比对。若会议地点在景区名录内或非驻地城市，且存在以下情形之一：1）会议议程中实际开会时间不足差旅总天数的50%（即大部分时间为游览）；2）出现景区门票、游览车等消费凭证，则判定违规。
  audit_item: 未按规定举办会议
  suspicion: 在驻地外或风景名胜区违规举办会议
  regulation: "[\n  {\n    \"法规名称\": \"关于严禁党政机关到风景名胜区开会的通知\",\n    \"法规文号\": \"厅字〔2014〕50号\",\n    \"效力级别\": \"党内法规\",\n \
    \   \"条款号\": \"第一条\",\n    \"内容概述\": \"各级党政机关一律不得到八达岭－十三陵、承德避暑山庄外八庙、五台山、太湖、普陀山、黄山、九华山、武夷山、庐山、泰山、嵩山、武当山、武陵源（张家界）、白云山、桂林漓江、三亚热带海滨、峨眉山－乐山大佛、九寨沟－黄龙、黄果树、西双版纳、天山天池等21个风景名胜区召开会议。\"\
    \n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文"
- expression: 缺失(会议通知) || 缺失(参会人员签到表) || 缺失(费用原始明细单据) || 缺失(发票) || (参会人员签到表.签到人数 != 发票.金额 / 人均定额 AND ABS(偏差) > 10%)
  description: 每笔会议费报销必须附有完整的支撑材料。若缺少会议通知、签到表、费用明细、发票中的任一项，直接判为违规。此外，若签到人数与费用结算人数逻辑不匹配（如按人头计算的费用），偏差超过10%，则可能存在虚增人数。
  audit_item: 会议费审计
  suspicion: 会议费报销凭证关键附件缺失
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"会议费报销时应当提供会议审批文件、会议通知及实际参会人员签到表、定点会议场所等会议服务单位提供的费用原始明细单据、电子结算单等凭证。\"\n  }\n]"
- expression: (发票.货物或应税劳务名称 包含 '礼品'||'纪念品'||'烟酒'||'旅游'||'景点' || 'KTV') || (会议费报销明细清单.费用项目名称 包含 '参观费'||'门票费')
  description: 若在会议费报销发票或明细清单中出现礼品、纪念品、烟酒、旅游景点门票等与会议业务无关的消费项目，直接判定为违规。会议费只允许列支住宿、伙食、会议室租金、文件印刷、交通等必要开支。
  audit_item: 会议费审计
  suspicion: 会议费中夹带与会议无关的费用
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条、第十六条\",\n    \"内容概述\": \"会议费开支范围包括会议住宿费、伙食费、会议室租金、交通费、文件印刷费等，不得列支与会议无关的其他费用，严禁以任何名义发放纪念品。\"\n  }\n]"
