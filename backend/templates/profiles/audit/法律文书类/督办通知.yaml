name: audit/法律文书类/督办通知
type: model
description: 从法律文书类类文档（督办通知）中提取结构化元数据。涵盖字段如：督办事项、要求完成时限。文档范围包括：上级部门督办通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 督办通知
  member_count: 1
  member_details:
  - 上级部门督办通知
output:
  fields:
  - name: 督办事项
    type: string
    description: 提取 督办事项 的文本值
  - name: 要求完成时限
    type: string
    description: 提取 要求完成时限 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (禁捕工作阶段总结报告.实际完成时间 > 禁捕工作任务分解与时间节点计划表.计划完成时间) || (禁捕工作阶段总结报告.实际完成率 < 禁捕工作任务分解与时间节点计划表.计划进度百分比 && (禁捕工作阶段总结报告.实际完成时间
    - 禁捕工作任务分解与时间节点计划表.计划完成时间) > 30) || (上级部门督办通知.要求完成时限 < 上级部门督办通知.整改反馈时间 && ABS(上级部门督办通知.整改反馈时间 - 上级部门督办通知.要求完成时限) > 15)
    || (禁捕专项资金分配与使用情况说明.资金拨付时间 > 长江禁捕分阶段实施方案.阶段目标完成时限 && (禁捕专项资金分配与使用
  description: 判定规则：计划完成时间为长江禁捕分阶段实施方案或任务分解计划表中的截止时间；实际完成日期来自阶段总结报告或进度汇报材料。若实际完成日期超过计划时间，或完成率未达标且滞后超过30天，即为违规。上级督办事项整改反馈时间超过要求完成日期15天以上的视同推进不力。专项资金到位时间较计划拨付时间滞后超过30天的，判定为资金保障不到位导致推进慢。
  audit_item: 任务目标未按时完成（长江全面禁捕）
  suspicion: 长江禁捕分阶段工作推进滞后
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第五条（十五）项\",\n    \"内容概述\": \"要求稳步推进长江流域重点水域禁捕工作，明确时间表和路线图，确保按时完成各项任务。\"\n  }\n]"
