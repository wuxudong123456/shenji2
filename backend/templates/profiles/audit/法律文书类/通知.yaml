name: audit/法律文书类/通知
type: model
description: 从法律文书类类文档（通知）中提取结构化元数据。涵盖字段如：优惠电价标准、信息更新时限、制度制定决策记录、备案管理要求、年度监测计划频次、执行起止时间、抽查比例、捐赠动员措辞。文档范围包括：农业主管部门监测工作实施方案或通知、地方政府关于农村饮水工程电价优惠政策的通知、绩效管理相关会议纪要或通知、通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 工程
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 通知
  member_count: 1
  member_details:
  - 农业主管部门监测工作实施方案或通知
  - 地方政府关于农村饮水工程电价优惠政策的通知
  - 绩效管理相关会议纪要或通知
  - 通知
output:
  fields:
  - name: 优惠电价标准
    type: string
    description: 提取 优惠电价标准 的文本值
  - name: 信息更新时限
    type: string
    description: 提取 信息更新时限 的文本值
  - name: 制度制定决策记录
    type: string
    description: 提取 制度制定决策记录 的文本值
  - name: 备案管理要求
    type: string
    description: 提取 备案管理要求 的文本值
  - name: 年度监测计划频次
    type: date
    description: 提取 年度监测计划频次 的日期值，格式 YYYY-MM-DD
  - name: 执行起止时间
    type: date
    description: 提取 执行起止时间 的日期值，格式 YYYY-MM-DD
  - name: 抽查比例
    type: number
    description: 提取 抽查比例 的数值（含单位，如万元、吨等）
  - name: 捐赠动员措辞
    type: string
    description: 提取 捐赠动员措辞 的文本值
  - name: 目标金额分配表
    type: number
    description: 提取 目标金额分配表 的数值（含单位，如万元、吨等）
  - name: 缴费期限
    type: number
    description: 提取 缴费期限 的数值（含单位，如万元、吨等）
  - name: 责任部门
    type: string
    description: 提取 责任部门 的文本值
  - name: 适用工程类型
    type: string
    description: 提取 适用工程类型 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (COUNT(农业主管部门监测检查记录表.检查日期) < 农业主管部门监测工作实施方案或通知.年度监测计划频次) || ((COUNT(DISTINCT 农业主管部门监测检查记录表.被检查组织) / 农业社会化服务组织基础信息表.组织总数)
    < 农业主管部门监测工作实施方案或通知.抽查比例)
  description: 实际监测次数低于政策或方案规定的最低监测频次（如年度至少2次全面检查），或者被抽查组织数量占全部组织总数比例低于规定抽查比例（如不低于30%）时，判定监测不到位。优先以实施方案中的量化指标为准，若无明确比例，参照行业通行的30%红线。
  audit_item: 农业社会化服务管理不到位
  suspicion: 农业社会化服务监测频次与覆盖面不达标
  regulation: "[\n  {\n    \"法规名称\": \"关于加快发展农业社会化服务的指导意见\",\n    \"法规文号\": \"农经发〔2021〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"第三条（十）\",\n    \"内容概述\": \"建立健全服务组织名录库，实行服务组织名录库动态管理，加强服务组织动态监测，及时掌握服务组织数量、能力、业绩、信誉等情况。\"\n  }\n]"
- expression: (农业社会化服务组织的备案或注册登记资料.统一社会信用代码 NOT IN (农业社会化服务组织基础信息表.统一社会信用代码)) || (农业社会化服务组织基础信息表.统一社会信用代码 NOT IN (农业社会化服务组织的备案或注册登记资料.统一社会信用代码))
    || (农业社会化服务组织的备案或注册登记资料.统一社会信用代码 = 农业社会化服务组织基础信息表.统一社会信用代码 AND 农业社会化服务组织的备案或注册登记资料.服务类型 != 农业社会化服务组织基础信息表.服务类型) || (ABS(COUNT(农业社会化服务组织的备案或注册登记资料.统一社会信用代码)
    - COUNT(农业社会化
  description: 出现以下任一情况判定为底数不清：基础信息表中组织在备案资料中缺失；备案资料中组织在基础信息表中缺失；同一组织在两个台账中的关键字段（如服务类型）不一致；组织数量差异率超过10%。若引入市场监管部门数据，还应比对是否存在未在农业部门备案但从事相关服务的组织。
  audit_item: 农业社会化服务管理不到位
  suspicion: 农业社会化服务组织备案底数不实、多头登记
  regulation: "[\n  {\n    \"法规名称\": \"关于加快发展农业社会化服务的指导意见\",\n    \"法规文号\": \"农经发〔2021〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"第三条（十）\",\n    \"内容概述\": \"全面掌握服务组织数量、能力、业绩等情况，建立服务组织名录库并实施动态管理，确保信息真实、准确、完整。\"\n  }\n]"
- expression: SUM(CASE WHEN 明细表.实际执行单价（元/度） > 优惠电价标准.优惠电价标准 THEN 1 ELSE 0 END) > 0
  description: 将供水单位每月实际缴纳的电费单价与地方公布的农村饮水工程优惠电价标准逐月比对，任一月出现实际单价高于标准值即构成违规。
  audit_item: 工程建后管护不到位
  suspicion: 农村饮水工程未执行优惠电价
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕267号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二、销售电价分类结构\",\n    \"内容概述\": \"农村饮水安全工程供水用电执行居民生活用电价格或农业排灌用电价格，具体标准由各地确定，确保工程用电享受优惠。\"\n  }\n\
    ]"
- expression: 政策文件类-制度文件-制度文件存在状态、发布日期、制度内容完整性、制度文件存在性.制度文件存在状态 != '已印发' || 政策文件类-制度文件-制度文件存在状态、发布日期、制度内容完整性、制度文件存在性.制度内容完整性
    == '不完整'
  description: 检查被审计单位是否正式成文印发绩效管理制度，如制度文件缺失或内容未覆盖绩效目标、指标量化、评价流程等关键环节则为违规。'已印发'指有正式文号并公开发布。
  audit_item: 绩效管理不到位
  suspicion: 未建立绩效评价制度
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2014年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价。\"\n  },\n  {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\"\
    : \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"各部门应建立完善绩效目标管理制度，将预算绩效目标管理嵌入部门预算编制和执行全"
