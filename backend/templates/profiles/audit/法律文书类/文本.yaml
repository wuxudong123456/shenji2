violations:
- expression: (承租方/承包人名称、租赁单价、租赁期限、决策方式.承租方/承包人名称 IN (姓名、身份证号、与领导人员关系、特定关系人姓名、特定关系人姓名及其关联企业、特定关系人企业名称、亲属姓名、关联企业名称.特定关系人姓名及其关联企业))
    && (ABS(承租方/承包人名称、租赁单价、租赁期限、决策方式.租赁单价-同期同类资产市场租金或承包费标准.同期同类资产市场租金或承包费标准)/同期同类资产市场租金或承包费标准.同期同类资产市场租金或承包费标准 > 0.3 || 承租方/承包人名称、租赁单价、租赁期限、决策方式.决策方式
    != '公开招租')
  description: 筛查国有资产租赁或承包给领导人员特定关系人且租金明显低于市场价30%以上，或未经过公开招租程序的情况。未进行市场评估或未公开招租直接视为可疑线索。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 国有资产委托租赁承包给特定关系人经营
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第二项\",\n    \"内容概述\": \"不得将国有资产委托、租赁、承包给配偶、子女及其他特定关系人经营。\"\n  }\n]"
- expression: (SUM(招标文件.合同估算价) >= 项目清单.限额标准) && (招标文件.招标方式 全部为 '邀请招标' 或 '竞争性谈判') && (招标文件.建设内容 存在功能关联或地理相邻) && (招标文件.立项时间
    相近)
  description: 将同一工程或存在功能关联的整体项目，拆分为多个低于强制公开招标限额的子项目，各子项目均采用非公开方式采购，且立项时间集中、最终由同一承包商或关联企业中标。金额标准依据现行法规，关联性根据建设规划、选址、设计文件综合判断。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 拆分项目化整为零规避公开招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n    \"法规文号\"\
    : \"国家发展和改革委员会令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条、第五条\",\n    \"内容概述\": \"明确必须招标的项目范围及规模标准，禁止通过拆分方式规避。\"\
    \n "
- expression: (文本.付款条件 != 公告.商务条款（付款比例、履约保证金、违约责任）) || (文本.合同期限 < 投标文件.服务期限承诺) || (文本.合同总价 != 通知书.中标金额) || (文本.违约责任 != 公告.商务条款（付款比例、履约保证金、违约责任）)
    || (通知书.合同签订时间 > 通知书.发出日期 + 30天)
  description: 该表达式用于筛查合同实质性条款与招投标文件不一致的行为。实质性内容包括：付款条件、服务质量期限、合同金额、违约责任等。任意一项不符即触发疑点。同时，若合同签订日期超出中标通知书发出后30日，也判定违规。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 招标人与中标人订立背离实质性内容的合同
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n\
    ]"
- expression: (文本.变更后的技术标准 < 公告.技术标准与规格) || (文本.品牌 != 投标文件.投标品牌及型号) || (ABS(文本.工程量或单价) > 15%) || (文本.合同期限 < 审批文件.审批日期) ||
    (匹配表.收款单位账户信息 != 中标人.名称)
  description: 筛查通过补充协议等方式在合同签订后另行订立背离实质性内容协议的行为。典型表现包括：降低技术标准或更换品牌、变更工程量超15%、审批流程倒置等。若出现向非中标单位付款，高度预示违规转包。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 招标人与中标人订立背离实质性内容的协议
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n\
    ]"
- expression: 招标文件.计价方式 == '固定总价' && 文本.价格形式 != '固定总价'
  description: 当招标文件明确要求采用固定总价合同时，正式合同却采用单价可调或其他计价方式，即构成实质性内容背离，触犯法规。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 合同价格条款与招标文件实质性偏离
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n]"
- expression: 文本.服务期限条款 < 招标文件.服务期限 && 缺少合规变更审批
  description: 合同约定的服务年数少于招标文件规定的年数，且无正当变更审批，属于关键服务内容缩水。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 合同服务期限与招标文件要求不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n]"
- expression: 文本.预付款比例 > 招标文件.预付款比例 || (招标文件.付款节点及比例（如验收后付至90%） != 文本.付款条件)
