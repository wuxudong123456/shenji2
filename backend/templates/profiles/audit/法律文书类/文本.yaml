name: audit/法律文书类/文本
type: model
description: 从法律文书类类文档（文本）中提取结构化元数据。涵盖字段如：产业定位、产业规划定位、人员配备要求、付款方式、付款条件、付费服务包内容与收费标准、价格形式、价款。文档范围包括：专项规划文本、交通、水利、生态等专项规划文本、供水单位水质检验制度文本、农村公路建设规划文本、分红协议文本、合作社与农户签订的分红协议文本、合同文本、合同签订文本、国有资产委托/租赁/承包协议文本、土地利用总体规划文本等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 人员
- 付款
- 协议
- 合同
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 文本
  member_count: 1
  member_details:
  - 专项规划文本
  - 交通、水利、生态等专项规划文本
  - 供水单位水质检验制度文本
  - 农村公路建设规划文本
  - 分红协议文本
  - 合作社与农户签订的分红协议文本
  - 合同文本
  - 合同签订文本
  - 国有资产委托/租赁/承包协议文本
  - 土地利用总体规划文本
  - 地方政府五年规划文本
  - 家庭医生签约服务协议文本
  - 应急预案文本
  - 村庄规划文本
  - 正式签订的合同文本
  - 规划文本
  - 重大草原火灾应急预案文本
