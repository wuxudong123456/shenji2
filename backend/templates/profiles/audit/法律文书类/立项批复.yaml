name: audit/法律文书类/立项批复
type: model
description: 从法律文书类类文档（立项批复）中提取结构化元数据。涵盖字段如：人防工程配建要求、关键节点工期、实际使用功能、审批意见、建设内容及规模、建设单位、总投资额、批复建筑面积。文档范围包括：农资物联网项目立项批复、安居工程项目立项批复、立项批复、项目立项批复等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 审批
- 工程
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 立项批复
  member_count: 1
  member_details:
  - 农资物联网项目立项批复
  - 安居工程项目立项批复
  - 立项批复
  - 项目立项批复
output:
  fields:
  - name: 人防工程配建要求
    type: string
    description: 提取 人防工程配建要求 的文本值
  - name: 关键节点工期
    type: string
    description: 提取 关键节点工期 的文本值
  - name: 实际使用功能
    type: string
    description: 提取 实际使用功能 的文本值
  - name: 审批意见
    type: string
    description: 提取 审批意见 的文本值
  - name: 建设内容及规模
    type: string
    description: 提取 建设内容及规模 的文本值
  - name: 建设单位
    type: string
    description: 提取 建设单位 的文本值
  - name: 总投资额
    type: string
    description: 提取 总投资额 的文本值
  - name: 批复建筑面积
    type: string
    description: 提取 批复建筑面积 的文本值
  - name: 批复投资额
    type: string
    description: 提取 批复投资额 的文本值
  - name: 批复项目性质
    type: string
    description: 提取 批复项目性质 的文本值
  - name: 融资模式描述
    type: string
    description: 提取 融资模式描述 的文本值
  - name: 计划完工日期
    type: date
    description: 提取 计划完工日期 的日期值，格式 YYYY-MM-DD
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目性质
    type: string
    description: 提取 项目性质 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 可行性研究报告.预测收益 显著高于 项目实际运营数据.实际收益 且 ABS(预测收益 - 实际收益)/预测收益 > 0.3 || 可行性研究报告.预测投资额 明显低于 立项批复.批复投资额 且 ABS(批复投资额 -
    预测投资额)/批复投资额 > 0.2
  description: 可行性研究报告中预测的核心效益指标与实际运营数据偏差超过30%，或可研估算的投资额与批复投资额及后续实际投入差异过大（偏差超20%），暗示可研编制为满足审批而人为美化数据、压低投资。需结合市场调研原始资料核查数据来源真实性。
  audit_item: 重大工程项目全过程审计
  suspicion: 可行性研究报告弄虚作假骗取立项批复
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条\"\
    ,\n    \"内容概述\": \"经核定的投资概算是控制政府投资项目总投资的依据。初步设计提出的投资概算超过经批准的可行性研究报告提出的投资估算10%的，项目单位应当向投资主管部门或者其他有关部门报告...。\"\n  },\n \
    \ {\n    \"法规名称\": \"中央预算内直接投资项目管理办法\",\n    \"法规文号\": \"国家发展改革委令第7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\"\
    ,\n"
- expression: 对同一项目中，存在多个施工合同且每个合同金额低于必须招标限额，但合计金额超过限额，且各合同施工内容属于同一概算项下的可独立发包单元，即（(合同1.合同金额 + 合同2.合同金额 + ...) > 必须招标限额) &&
    各合同.施工范围在功能上紧密相连 && 各合同.签约日期相近(30天内) && 中标通知书.招标方式 != '公开招标'
  description: 必须招标限额通常为施工单项合同估算价400万元（按国家现行规定）。当多个关联合同金额总和超过限额，但均未采用公开招标而是直接发包或邀请招标，且合同签订时间集中、内容关联，即判定为涉嫌肢解工程规避招标。
  audit_item: 重大工程项目全过程审计
  suspicion: 通过不合理划分标段或肢解工程规避招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第86号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条、第四十九条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。违反本法规定，将必须进行招标的项目化整为零或者以其他任何方式规避招标的，责令限期改正，可以处项目合同金额千分之五以上千分之十以下的罚款。\"\
    \n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n    \"法规文号\": \"国家发展改革委令第16号\",\n    \"效力级别\": \"部门"
- expression: (农资物联网项目进度对比表（计划vs实际）.延误天数 > 30) || (农资物联网项目验收报告.设备在线率 < 0.85)
  description: 项目关键节点延误超过30天或建成后物联网设备在线率低于85%（技术验收最低标准）即视为建设缓慢或应用效果不达标。延误天数取计划与实际完成日期的最大差值，在线率反映系统实际运营状态。
  audit_item: 为农服务职责履行不到位
  suspicion: 农资物联网应用与示范项目建设缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"（十二）\",\n    \"内容概述\": \"推进现代信息技术在供销合作社系统应用，综合利用信息通信技术改造升级农资、日用消费品、农副产品、再生资源经营服务网络，提升为农服务智能化水平。\"\n\
    \  }\n]"
- expression: (协议内容包含‘施工方垫付资本金’ OR 资金流出现垫资记录) && (协议内容包含‘政府回购’ OR 融资审批中明确BT模式)
  description: 施工方带资并约定政府远期回购义务，属于违规BT模式。根据财预〔2017〕50号文禁止，同时违反《政府投资条例》不得垫资建设的规定。
  audit_item: 项目建设管理不符合相关规定
  suspicion: 农村公路建设违规采用施工方带资的BT模式
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十二条第一款\"\
    ,\n    \"内容概述\": \"政府投资项目不得由施工单位垫资建设。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范地方政府举债融资行为的通知\",\n    \"法规文号\": \"财预〔2017〕50号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条、第四条\",\n    \"内容概述\": \"严禁地方政府利用PPP、政府出资的各类投资基金等方式违法违规变相举债，禁止以BT方式举借"
- expression: (项目清单.项目类别 = '楼堂馆所' || 项目清单.建设内容 REGEXP '楼|堂|馆|所|形象工程') && (使用台账.资金来源 = '彩票公益金' || 使用台账.资金来源 = '彩票发行费') && 项目清单.彩票公益金投入金额
    > 0
  description: 当建设项目被定性为楼堂馆所或包含相关关键词，且资金来源于彩票公益金或发行费，无论金额大小直接判定为违规。若项目以公益名义立项但实际包含豪华装修等非必要设施，亦属变相楼堂馆所。占比阈值可辅助判定资金依赖程度。
  audit_item: 彩票资金管理使用审计常见违法违规问题
  suspicion: 违规使用彩票公益金购建楼堂馆所或形象工程
  regulation: "[\n  {\n    \"法规名称\": \"彩票公益金管理办法\",\n    \"法规文号\": \"财综〔2021〕18号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"彩票公益金不得用于对外投资、发放奖金、津贴和补贴、弥补行政支出、楼堂馆所建设以及国家规定禁止的其他支出。\"\n  }\n]"
- expression: ((协议.用地性质 == '划拨' && 项目性质 IN ('经济适用房','公租房','棚改房')) || (政策文件.减免税种 == '城市基础设施配套费' && 项目性质 IN ('经济适用房','公租房','棚改房')))
    && (税费凭证.缴纳金额 > 0 && 税费凭证.票据备注 != '已减免')
  description: 当保障性安居工程项目以划拨方式供地或按规定免征城市基础设施配套费时，若土地出让合同或票据显示实际缴纳了出让金、配套费且未标记减免，则判定为违规。缴纳金额大于0且无对应减免备案记录的，视为违规收取。
  audit_item: 违规向保障性安居工程项目收取应减免税费
  suspicion: 违规向安居工程项目征收土地出让金或配套费
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于解决城市低收入家庭住房困难的若干意见\",\n    \"法规文号\": \"国发〔2007〕24号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第五条第（十九）项\",\n    \"内容概述\": \"经济适用住房和廉租住房建设用地实行行政划拨方式供应，免收城市基础设施配套费等各种行政事业性收费和政府性基金。\"\n  }\n]"
- expression: (项目性质 IN ('经济适用房','公租房','棚改房') && 税费凭证.税种 IN ('契税','印花税') && 税费凭证.实缴金额 > 0 && (备案记录.减免性质代码 == NULL || 税费凭证.减免标志
    != '减免'))
  description: 当保障性安居工程项目属于可享受契税、印花税减免的范围，且实际缴纳该税种金额大于0，但税务系统中无对应的减免备案或票据未注明减免，则判定为违规多征或未减免。
  audit_item: 违规向保障性安居工程项目收取应减免税费
  suspicion: 多征或未减免安居工程项目契税、印花税
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于廉租住房经济适用住房和住房租赁有关税收政策的通知\",\n    \"法规文号\": \"财税〔2008〕24号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第一条、第二条\",\n    \"内容概述\": \"对廉租住房、经济适用住房建设用地免征城镇土地使用税；对廉租住房、经济适用住房经营管理单位免征印花税；对廉租住房、经济适用住房购买人涉及的契税，可给予适当减免。\"\
    \n  }\n]"
- expression: (项目性质 IN ('棚改房','经济适用房') && 税费凭证.税种 IN ('城市维护建设税','教育费附加') && 税费凭证.实缴金额 > 0 && (税务部门提供的税费征收明细表及减免备案记录.减免性质代码
    == NULL || 税费凭证.减免标志 != '免征'))
  description: 棚户区改造等保障性安居工程项目在特定环节可免征城市维护建设税和教育费附加，若实际缴纳金额大于0且无免征标识，则判定为违规。
  audit_item: 违规向保障性安居工程项目收取应减免税费
  suspicion: 违规征收安居工程项目城建税和教育费附加
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于棚户区改造有关税收政策的通知\",\n    \"法规文号\": \"财税〔2013〕101号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"对棚户区改造项目，免征城市维护建设税、教育费附加。\"\n  }\n]"
- expression: 立项批复.项目性质 IN ('公租房','棚户区改造','经济适用房','保障性租赁住房') AND (立项批复.人防工程配建要求='已配建' OR 审批文件.是否豁免收费=TRUE) AND 缴费凭证.收费项目名称='人防易地建设费'
    AND 缴费凭证.金额>0
  description: 若项目已按规划配建人防工程或人防主管部门已明确豁免易地建设费，但缴费记录中仍存在该费用且金额大于0，即判定违规。需注意甄别因审批程序延迟导致的临时收费后是否全数退还。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规向保障性安居工程项目收取应免人防易地建设费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"免除保障性安居工程建设项目各项行政事业性收费，含人防易地建设费。\"\n  }\n]"
