name: audit/法律文书类/整改通知
type: model
description: 从法律文书类类文档（整改通知）中提取结构化元数据。涵盖字段如：整改事项、整改期限、整改状态、整改落实情况、责任主体、问题描述、验收未覆盖中小散户的说明。文档范围包括：上级部门关于厕所革命的整改通知、整改通知、设施闲置或损毁问题整改通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 整改
- 验收
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 整改通知
  member_count: 1
  member_details:
  - 上级部门关于厕所革命的整改通知
  - 整改通知
  - 设施闲置或损毁问题整改通知
output:
  fields:
  - name: 整改事项
    type: string
    description: 提取 整改事项 的文本值
  - name: 整改期限
    type: string
    description: 提取 整改期限 的文本值
  - name: 整改状态
    type: boolean
    description: 提取 整改状态 的布尔值（是/否）
  - name: 整改落实情况
    type: string
    description: 提取 整改落实情况 的文本值
  - name: 责任主体
    type: string
    description: 提取 责任主体 的文本值
  - name: 问题描述
    type: string
    description: 提取 问题描述 的文本值
  - name: 验收未覆盖中小散户的说明
    type: string
    description: 提取 验收未覆盖中小散户的说明 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: （实施方案.方案中是否包含运维保障章节 == true） || （分工文件.文件印发日期 IS NULL） || （COUNT(记录表) = 0） || （SUM(使用台账.金额 FILTER 支出项目='运维')
    = 0 && 明细表.资金用途分类 != '含运维'）
  description: 判定逻辑：1.改造方案中缺失运维机制设计；2.未明确运维责任单位；3.从未开展设施巡检；4.运维资金预算或支出为零。任一条件成立即视为未建立有效运行维护机制。
  audit_item: 农村厕所粪污治理不符合相关规定
  suspicion: 未建立农村厕所运行维护机制
  regulation: "[\n  {\n    \"法规名称\": \"农村人居环境整治提升五年行动方案（2021—2025年）\",\n    \"法规文号\": \"厅字〔2021〕44号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第四部分“建立健全长效管护机制”\",\n    \"内容概述\": \"明确要求明确责任主体、建立管护队伍、保障管护经费，逐步建立有制度、有标准、有队伍、有经费、有监督的农村厕所长效管护机制。\"\n\
    \  }\n]"
- expression: (设施设备台账.设备状态='闲置' 的设备数量 / 设施设备采购清单.采购总数量 > 0.3) || ((COUNT(管护人员配置及巡查记录统计表.巡查日期) / DATEDIFF(项目结束日期, 项目开始日期) <
    管护责任书及制度办法.约定巡查频次 * 0.5) && 设施设备台账.设备状态='损毁')
  description: 设施设备闲置率超过30%，反映资产严重浪费；当实际巡查频次低于合同约定频次的50%时，与其关联的设施设备出现损毁状态，直接证明管护失职与资产物理损毁的强因果关系。
  audit_item: 黑土地保护治理缺少持续性，后期管护不到位
  suspicion: 设施设备因管护机制缺失导致大量闲置或损毁
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十一条\",\n    \"内容概述\": \"项目建成后，应当按照‘谁受益、谁管护’的原则，明确管护主体、落实管护责任、保障管护经费，确保项目设施正常运行并长期发挥效益。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作"
