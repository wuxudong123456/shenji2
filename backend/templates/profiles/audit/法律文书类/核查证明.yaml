name: audit/法律文书类/核查证明
type: model
description: 从法律文书类类文档（核查证明）中提取结构化元数据。涵盖字段如：买方姓名、交易状态、姓名、婚姻状态、房产证号、登记日期、购房合同编号、身份证号。文档范围包括：婚姻登记部门出具的婚姻状态核查证明、房产登记部门出具的房产交易真实性核查证明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 合同
- 登记
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 核查证明
  member_count: 1
  member_details:
  - 婚姻登记部门出具的婚姻状态核查证明
  - 房产登记部门出具的房产交易真实性核查证明
output:
  fields:
  - name: 买方姓名
    type: string
    description: 提取 买方姓名 的文本值
  - name: 交易状态
    type: boolean
    description: 提取 交易状态 的布尔值（是/否）
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 婚姻状态
    type: boolean
    description: 提取 婚姻状态 的布尔值（是/否）
  - name: 房产证号
    type: string
    description: 提取 房产证号 的文本值
  - name: 登记日期
    type: date
    description: 提取 登记日期 的日期值，格式 YYYY-MM-DD
  - name: 购房合同编号
    type: string
    description: 提取 购房合同编号 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (提取人姓名.购房合同编号 != 核查证明.购房合同编号 || 提取人姓名.婚姻证明编号 != 核查证明.登记日期 || 核查证明.交易状态 = '无效' || 核查证明.婚姻状态 != 提取人姓名.婚姻证明编号)
    && (比对表.提取次数 > 1 || 转账凭证.对方账户名称 != 对方户名 || (分析表.购房所在地 != 分析表.提取人工作地 && 购房所在地 != 户籍地))
  description: 申请材料编号与权威部门核查结果不一致为直接造假标志；若同时满足同一房产多人提取、资金未进入交易方账户或异地购房与工作地、户籍地均无关联等异常特征，则判定为个人利用虚假材料违规提取。阈值为同一房产提取次数>1即触发，异地购房需三地不匹配。
  audit_item: 违规提取住房公积金
  suspicion: 个人使用虚假购房或婚姻证明骗取公积金提取
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十四条、第五十一条\",\n    \"内容概述\": \"第二十四条明确职工可提取住房公积金的七类情形，必须基于真实住房消费；第五十一条规定以欺骗手段提取住房公积金的，责令限期退回，可处罚款，构成犯罪的依法追究刑事责任。\"\n\
    \  }\n]"
