name: audit/法律文书类/考察通知
type: model
description: 从法律文书类类文档（考察通知）中提取结构化元数据。涵盖字段如：日程安排、目的、考察主题。文档范围包括：考察通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 考察通知
  member_count: 1
  member_details:
  - 考察通知
output:
  fields:
  - name: 日程安排
    type: string
    description: 提取 日程安排 的文本值
  - name: 目的
    type: string
    description: 提取 目的 的文本值
  - name: 考察主题
    type: string
    description: 提取 考察主题 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (行程单.公务活动时长 / 行程单.总时长 < 0.5) || (费用报销明细表.
  description: 公务活动（会议、实地调研）时间占整个出行时间的比例低于50%，或费用中出现明确的旅游特征项目，或与旅行社签订的合同包含游览服务，均触犯变相旅游。
  audit_item: 公务接待管理不符合规定
  suspicion: 以考察调研名义组织变相公款旅游
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"不得组织旅游和与公务活动无关的参观，不得以任何名义赠送礼金、纪念品。\"\n  }\n]"
