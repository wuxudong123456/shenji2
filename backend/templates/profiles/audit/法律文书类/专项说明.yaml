name: audit/法律文书类/专项说明
type: model
description: 从法律文书类类文档（专项说明）中提取结构化元数据。涵盖字段如：业务必要性说明、原因、大额支付理由、实际投资损失金额、审批状态、差错事项、差错性质、损失原因分析。文档范围包括：会计差错更正专项说明、年底大额支付事项的专项说明、投资损失专项说明、超预算购置专项说明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 审批
- 金额
- 预算
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 专项说明
  member_count: 1
  member_details:
  - 会计差错更正专项说明
  - 年底大额支付事项的专项说明
  - 投资损失专项说明
  - 超预算购置专项说明
output:
  fields:
  - name: 业务必要性说明
    type: string
    description: 提取 业务必要性说明 的文本值
  - name: 原因
    type: string
    description: 提取 原因 的文本值
  - name: 大额支付理由
    type: string
    description: 提取 大额支付理由 的文本值
  - name: 实际投资损失金额
    type: number
    description: 提取 实际投资损失金额 的数值（含单位，如万元、吨等）
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
  - name: 差错事项
    type: string
    description: 提取 差错事项 的文本值
  - name: 差错性质
    type: string
    description: 提取 差错性质 的文本值
  - name: 损失原因分析
    type: string
    description: 提取 损失原因分析 的文本值
  - name: 更正方法
    type: string
    description: 提取 更正方法 的文本值
  - name: 超预算金额
    type: number
    description: 提取 超预算金额 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (分析表.实际支出金额 > 分析表.预算金额 && 专项说明.审批状态 != '已批准') || (采购合同.商品名称 = '' || 批复文件.项目名称 = '')
  description: 采购金额超出对应预算科目批复数且无合规的追加审批手续，或采购项目在预算批复中根本不存在，均构成无预算或超预算购置违规。
  audit_item: 违反规定配置国有资产
  suspicion: 无预算、超预算购置国有资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2014年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"各部门、各单位的支出必须以经批准的预算为依据，未列入预算的不得支出。\"\n  }\n]"
- expression: ((SUM(12月支付金额)/全年支付总额) > 0.3) AND (最后5个工作日支付总额/12月支付总额 > 0.4) AND (存在单笔支付金额>全年月均支出3倍的事项)
  description: 12月支出占全年支出比例超过30%为异常；12月最后5个工作日支出占整月比例超过40%表明集中抢付；同时满足单笔支付金额超月均支出3倍的大额事项存在，高度疑似突击花钱。各项阈值可结合单位往年正常水平调整。
  audit_item: 预算执行率不真实
  suspicion: 年底突击花钱虚增预算执行率
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"各部门、各单位应当依法组织预算支出，不得在预算执行中随意变更预算用途，不得无预算安排支出，不得违反规定扩大开支范围、提高开支标准。\"\n  },\n  {\n    \"法规名称\"\
    : \"国务院关于深化预算管理制度改革的决定\",\n    \"法规文号\": \"国发〔2014〕45号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四部分\",\n    \"内容概述"
- expression: SELECT 分析表.项目名称, 分析表.预期IRR与实际IRR, 分析表.预期IRR与实际IRR FROM 分析表 INNER JOIN 统计表 ON 分析表.项目名称 = 统计表.项目名称 LEFT JOIN 调查报告
    ON 分析表.项目名称 = 调查报告.项目名称 WHERE 统计表.损失率 > 0.20 && (ABS(分析表.预期IRR与实际IRR - 分析表.预期IRR与实际IRR) > 0.10 || 分析表.预期回收期与实际回收期 > 分析表.预期回收期与实际回收期
    * 2) && 调查报告.已识别的重大风险点 IS NOT NULL && 专项说明.损失原因分析 NOT LI
  description: 该表达式筛查投资损失率超过20%的项目，且实际收益率与预期严重偏离（IRR差值超10个百分点或回收期超预期2倍），同时尽调报告已提前揭示重大风险，但决策时未充分考虑，排除了明确由不可抗力导致损失的情况。满足以上所有条件即可判定为存在违规决策导致重大损失的疑点。
  audit_item: 违规进行重大投资
  suspicion: 违规决策开展投资造成重大资产损失
  regulation: "[\n  {\n    \"法规名称\": \"中央企业违规经营投资责任追究实施办法（试行）\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第37号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"在投资并购方面，未按规定开展尽职调查，或尽职调查未进行风险分析等，造成较大资产损失或其他严重不良后果的，应当追究相关责任人责任。\"\n \
    \ }\n]"
- expression: (更正明细表.更正方法 == '直接计入当期损益' && 更正明细表.差错金额 / 近三年平均净利润 > 0.05 && 更正专项说明.差错性质 == '重大前期差错') || (台账.差错归类 == '重大差错'
    && 附注.追溯重述披露 IS NULL && 更正明细表.更正科目 无 '以前年度损益调整')
  description: 两项条件满足其一即触发：1.差错金额超过近三年平均净利润5%的重大前期差错，却未通过以前年度损益调整追溯重述，直接计入当期；2.台账归类为重大差错，但附注无追溯重述说明，且更正分录未涉及‘以前年度损益调整’科目。
  audit_item: 随意变更或未按规定变更会计政策、会计处理方法
  suspicion: 重大会计差错未追溯重述而直接计入当期损益
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十一条、第十二条\",\n    \"内容概述\": \"企业应当区分会计估计变更和会计差错更正；对于前期差错，应当采用追溯重述法进行更正，视同该差错从未发生，调整列报前期最早期初财务报表相关项目及其金额；重要的前期差错应当在其发现当期的财务报表附注中披露其性质和更正金额。\"\
    \n  }\n]"
