name: audit/法律文书类/议室纪要
type: model
description: 从法律文书类类文档（议室纪要）中提取结构化元数据。涵盖字段如：关于考评结果讨论的决策记录。文档范围包括：会议室纪要等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 议室纪要
  member_count: 1
  member_details:
  - 会议室纪要
output:
  fields:
  - name: 关于考评结果讨论的决策记录
    type: boolean
    description: 提取 关于考评结果讨论的决策记录 的布尔值（是/否）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 绩效考评指标得分明细表.考评等级 = '不合格' && 次年资金分配方案.获得补助的机构名称 包含 绩效考评指标得分明细表.被考评机构名称
  description: 上年绩效考评结果为不合格的培训机构，次年仍在资金分配中获得补助，表明考评结果未与资金分配挂钩。
  audit_item: 任务目标未完成、管理不规范（新型职业农民培训）
  suspicion: 培育工作绩效考评结果应用不到位
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十六条\",\n    \"内容概述\": \"绩效评价结果应作为资金分配、项目安排的重要依据，对考评不合格的项目单位应调减或暂停安排资金。\"\n  }\n]"
