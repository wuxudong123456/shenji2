name: audit/法律文书类/通知书
type: model
description: 从法律文书类类文档（通知书）中提取结构化元数据。涵盖字段如：业主反馈、中标人、中标人名称、中标供应商、中标供应商名称、中标日期、中标联合体成员及分工、中标通知书发出时间。文档范围包括：上级主管部门督查整改通知书、业主欠交维修资金的催缴通知书、中标通知书、住房腾退通知书、发现问题整改通知书、村民投诉整改通知书、检查整改通知书、消防部门安全检查整改通知书、环保部门监管检查整改通知书、第三方机构中标通知书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 招投标
- 整改
- 检查
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 通知书
  member_count: 1
  member_details:
  - 上级主管部门督查整改通知书
  - 业主欠交维修资金的催缴通知书
  - 中标通知书
  - 住房腾退通知书
  - 发现问题整改通知书
  - 村民投诉整改通知书
  - 检查整改通知书
  - 消防部门安全检查整改通知书
  - 环保部门监管检查整改通知书
  - 第三方机构中标通知书
  - 非粮化非农化整改通知书
