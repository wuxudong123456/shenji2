name: audit/法律文书类/责任书
type: model
description: 从法律文书类类文档（责任书）中提取结构化元数据。涵盖字段如：保护目标、合同约定的管护责任人、完成时限、巡查频次、建设目标、签字盖章、签订市县名称、管护期限。文档范围包括：市县两级任务分解责任书、管护责任书、绿化工程管护责任书、耕地保护目标责任书、责任书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 合同
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 责任书
  member_count: 1
  member_details:
  - 市县两级任务分解责任书
  - 管护责任书
  - 绿化工程管护责任书
  - 耕地保护目标责任书
  - 责任书
output:
  fields:
  - name: 保护目标
    type: string
    description: 提取 保护目标 的文本值
  - name: 合同约定的管护责任人
    type: string
    description: 提取 合同约定的管护责任人 的文本值
  - name: 完成时限
    type: string
    description: 提取 完成时限 的文本值
  - name: 巡查频次
    type: string
    description: 提取 巡查频次 的文本值
  - name: 建设目标
    type: string
    description: 提取 建设目标 的文本值
  - name: 签字盖章
    type: string
    description: 提取 签字盖章 的文本值
  - name: 签订市县名称
    type: string
    description: 提取 签订市县名称 的文本值
  - name: 管护期限
    type: string
    description: 提取 管护期限 的文本值
  - name: 管护标准
    type: string
    description: 提取 管护标准 的文本值
  - name: 管护责任主体
    type: string
    description: 提取 管护责任主体 的文本值
  - name: 考核等次
    type: string
    description: 提取 考核等次 的文本值
  - name: 考核结果
    type: boolean
    description: 提取 考核结果 的布尔值（是/否）
  - name: 责任主体
    type: string
    description: 提取 责任主体 的文本值
  - name: 责任人签字
    type: string
    description: 提取 责任人签字 的文本值
  - name: 资金配套
    type: string
    description: 提取 资金配套 的文本值
  - name: 部门职责划分
    type: string
    description: 提取 部门职责划分 的文本值
  - name: 问题数量
    type: number
    description: 提取 问题数量 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (检测报告.重金属含量(mg/kg) > GB 15618-2018风险筛选值 || 汇总表.土壤侵蚀模数(t/(km²·a)) > 500 t/(km²·a) ) && (其他.植被覆盖度变化率 < -15% ||
    NDVI均值 同比下降 0.2) && (责任书.考核结果 == '不合格' 或 存在未达标项)
  description: 根据土壤环境质量标准,重金属超过风险筛选值可视作污染风险;水利部界定东北黑土区允许土壤侵蚀模数为200-500 t/(km²·a),超过500异常;植被覆盖度下降超过15%或NDVI显著降低,结合考核不达标,表明保护措施失效。
  audit_item: 破坏或未有效利用黑土地
  suspicion: 黑土地保护不力导致污染或水土流失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十五条、第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当采取工程、生物等措施,防止黑土地污染和水土流失;任何组织和个人不得向黑土地倾倒废水、废弃物等;造成污染的应当修复。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国水土保持法\",\n    \"法规文号\": \"中华人民共和国主席令第39号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十七条\"\
    ,\n    \""
- expression: (处罚金额、执行情况、处罚事由、当事人、文书编号.处罚事由 包含 '阻挠' 或 '拒绝配合' 或 '伪造证据') && (问题描述、整改时限、逾期状态、整改回复内容.逾期状态 == '是' && 问题描述、整改时限、逾期状态、整改回复内容.整改回复内容
    包含 '已整改' 但 实际核查 为 '未整改') && (线索编号、涉案主体、涉及土方量、移送时间、线索移送时间、接收单位、处理反馈.处理反馈 为 '签收未处理' 或 '退回')
  description: 以处罚决定书记录的阻挠执法、伪造证据行为直接判定;同时将整改清单中逾期未整改但回复已整改的作为虚假整改阻碍监督;移送线索长期未处理反馈的视为消极阻碍。以上条件满足任一即可触发。
  audit_item: 破坏或未有效利用黑土地
  suspicion: 拒绝、阻碍黑土地保护监督检查
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"任何单位和个人不得拒绝、阻碍对黑土地保护情况依法进行的监督检查。\"\n  }\n]"
- expression: (设施设备台账.设备状态='闲置' 的设备数量 / 设施设备采购清单.采购总数量 > 0.3) || ((COUNT(管护人员配置及巡查记录统计表.巡查日期) / DATEDIFF(项目结束日期, 项目开始日期) <
    管护责任书及制度办法.约定巡查频次 * 0.5) && 设施设备台账.设备状态='损毁')
  description: 设施设备闲置率超过30%，反映资产严重浪费；当实际巡查频次低于合同约定频次的50%时，与其关联的设施设备出现损毁状态，直接证明管护失职与资产物理损毁的强因果关系。
  audit_item: 黑土地保护治理缺少持续性，后期管护不到位
  suspicion: 设施设备因管护机制缺失导致大量闲置或损毁
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十一条\",\n    \"内容概述\": \"项目建成后，应当按照‘谁受益、谁管护’的原则，明确管护主体、落实管护责任、保障管护经费，确保项目设施正常运行并长期发挥效益。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作"
