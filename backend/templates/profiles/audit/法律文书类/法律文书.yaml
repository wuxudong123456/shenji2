name: audit/法律文书类/法律文书
type: model
description: 从法律文书类类文档（法律文书）中提取结构化元数据。涵盖字段如：判决结果、律师意见、时效状态、案件概况、案由、法院判决书/破产公告编号、诉求金额、诉讼标的。文档范围包括：未决诉讼/仲裁案件法律文书、法律文书、重大诉讼案件法律文书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 法律文书
  member_count: 1
  member_details:
  - 未决诉讼/仲裁案件法律文书
  - 法律文书
  - 重大诉讼案件法律文书
output:
  fields:
  - name: 判决结果
    type: boolean
    description: 提取 判决结果 的布尔值（是/否）
  - name: 律师意见
    type: string
    description: 提取 律师意见 的文本值
  - name: 时效状态
    type: boolean
    description: 提取 时效状态 的布尔值（是/否）
  - name: 案件概况
    type: string
    description: 提取 案件概况 的文本值
  - name: 法院判决书-破产公告编号
    type: string
    description: 提取 法院判决书-破产公告编号 的文本值
  - name: 诉求金额
    type: number
    description: 提取 诉求金额 的数值（含单位，如万元、吨等）
  - name: 诉讼标的
    type: string
    description: 提取 诉讼标的 的文本值
  - name: 败诉可能性
    type: string
    description: 提取 败诉可能性 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (其他.核销金额 > 0) && (核销依据.集体决策意见 IS NULL || 法律文书.法院判决书/破产公告编号 IS NULL || 其他.核销理由空泛)
  description: 当核销明细表中有核销记录，但缺失集体决策记录、法律依据（如债务人破产文书）或核销理由不充分时，即视为擅自核销。对于对外投资核销同理，需提供被投资单位清算或损失确认的合法证据。
  audit_item: 违规处置国有资产
  suspicion: 擅自核销债权或对外投资
  regulation: "[\n  {\n    \"法规名称\": \"企业资产损失财务处理暂行办法\",\n    \"法规文号\": \"财企〔2003〕233号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条、第六条\",\n    \"内容概述\": \"企业发生资产损失，应当及时核实清理，履行内部审批程序，对应当追究有关人员责任的资产损失，应当追究责任。资产损失应当取得合法证据，包括具有法律效力的外部证据和内部证据。\"\
    \n  }\n]"
- expression: 累计应收分红、实收分红、投资年限、未收回金额.投资年限 > 3 && (累计应收分红、实收分红、投资年限、未收回金额.实收分红 / (累计应收分红、实收分红、投资年限、未收回金额.实收分红) < 0.3) && 违约条款、分红条件、分红比例、分派方式.分红条件
  description: 筛选投资超过3年、累计实际收到分红占应归属我方累计净利润比例低于30%（即存在大量利润未分配），且投资协议中分红条件已触发但未执行的参股项目。若投资协议未明确分红条款，但被投资企业有可分配利润而长期未分配，亦视同违规。
  audit_item: 投融资管理方面存在的问题
  suspicion: 对外股权投资收益长期不收回且未主张权利
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"中华人民共和国主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第34条、第166条\",\n    \"内容概述\": \"股东按照实缴的出资比例分取红利，公司弥补亏损和提取公积金后所余税后利润，有限责任公司依照本法第三十四条的规定分配。\"\n  },\n  {\n    \"法规名称\"\
    : \"企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第21条\",\n    \"内容概述\": \"国家出资企业应当依照法律"
- expression: (EXISTS (案件概况 WHERE 败诉可能性 >= '很可能' AND 诉求金额 > 0) AND (计提金额.计算假设 < 诉求金额*合理估计比例))  ||  (SUM(登记台账.担保金额) * (1 -
    被担保方平均信用系数) > (计提金额-估计依据))  ||  (评估报告.或有负债披露金额 > 分析表.期末余额)
  description: “很可能”指概率大于50%，合理估计比例结合律师意见确定，通常不低于50%。若未决诉讼符合确认条件而未计提或计提严重不足即违规；对外担保存在代偿风险应依据被担保方财务状况计提相应损失，若计提比例低于预计代偿净额则视为低估负债。
  audit_item: 未按规定核算负债
  suspicion: 未按规定确认预计负债
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第13号——或有事项\",\n    \"法规文号\": \"财会[2006]3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"与或有事项相关的义务同时满足下列条件的，应当确认为预计负债：（一）该义务是企业承担的现时义务；（二）履行该义务很可能导致经济利益流出企业；（三）该义务的金额能够可靠地计量。\"\
    \n  }\n]"
