name: audit/法律文书类/事由说明
type: model
description: 从法律文书类类文档（事由说明）中提取结构化元数据。涵盖字段如：事由合理性、公务活动日程安排、出访事由、团组名称、团组编号、对方公函或邀请函、拟访单位名称、接待事由。文档范围包括：出国团组任务事由说明、大额现金支付事由说明、接待事由说明等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 审批
- 金额
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 事由说明
  member_count: 1
  member_details:
  - 出国团组任务事由说明
  - 大额现金支付事由说明
  - 接待事由说明
output:
  fields:
  - name: 事由合理性
    type: string
    description: 提取 事由合理性 的文本值
  - name: 公务活动日程安排
    type: string
    description: 提取 公务活动日程安排 的文本值
  - name: 出访事由
    type: string
    description: 提取 出访事由 的文本值
  - name: 团组名称
    type: string
    description: 提取 团组名称 的文本值
  - name: 团组编号
    type: string
    description: 提取 团组编号 的文本值
  - name: 对方公函或邀请函
    type: string
    description: 提取 对方公函或邀请函 的文本值
  - name: 拟访单位名称
    type: string
    description: 提取 拟访单位名称 的文本值
  - name: 接待事由
    type: string
    description: 提取 接待事由 的文本值
  - name: 接待对象身份
    type: string
    description: 提取 接待对象身份 的文本值
  - name: 支付事由
    type: string
    description: 提取 支付事由 的文本值
  - name: 支付审批金额
    type: number
    description: 提取 支付审批金额 的数值（含单位，如万元、吨等）
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (公务接待明细台账.对应审批单编号 IS NULL) OR (接待审批单.审批日期 > 公务接待明细台账.接待日期) OR (接待审批单.审批人签字 IS NULL) OR (财务报销凭证.所附审批单情况 IS NULL)
  description: 台账中无对应审批单编号、审批日期晚于实际接待日期(先接待后审批)、审批单无有效签字、报销时未附审批单，满足任一条件即告违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 未履行公务接待审批程序
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第七条、第十四条\",\n    \"内容概述\": \"接待单位应当严格接待审批控制，无公函的公务活动和来访人员一律不予接待；接待费报销凭证应当包括财务票据、派出单位公函和接待清单。\"\n  }\n]"
- expression: (接待事由说明.活动日期 IN 法定节假日列表) OR (接待事由说明.接待事由 LIKE '%探亲%' OR 接待事由说明.接待事由 LIKE '%休假%') OR (接待对象清单.与本单位业务关联性 = '无')
    OR (EXISTS (SELECT * FROM 差旅费报销汇总表 WHERE 差旅费报销汇总表.出差日期 = 接待事由说明.活动日期 AND 差旅费报销汇总表.出差地点 = 接待事由说明.行程地点))
  description: 接待发生在节假日，或事由直接涉及探亲、休假，或接待清单中对象与本单位无任何业务关系，或同一时段有该单位人员的亲属同行差旅记录，均突破公务接待范围。
  audit_item: 公务接待管理不符合规定
  suspicion: 将休假探亲纳入公务接待范围
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"国内公务接待应当严格接待范围，不得将休假、探亲、旅游等活动纳入国内公务接待范围。\"\n  }\n]"
