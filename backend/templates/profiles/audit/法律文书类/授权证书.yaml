name: audit/法律文书类/授权证书
type: model
description: 从法律文书类类文档（授权证书）中提取结构化元数据。涵盖字段如：专利号、专利权人、授权日期。文档范围包括：专利授权证书副本等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 知识产权
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 授权证书
  member_count: 1
  member_details:
  - 专利授权证书副本
output:
  fields:
  - name: 专利号
    type: string
    description: 提取 专利号 的文本值
  - name: 专利权人
    type: string
    description: 提取 专利权人 的文本值
  - name: 授权日期
    type: date
    description: 提取 授权日期 的日期值，格式 YYYY-MM-DD
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: (已转化成果数量 / 成果总量) < 转化率 * 0.5 || (许可费用 / 技术合同成交额) < 0.2 || (技术合同成交额连续下降且年降幅>20%)
  description: 专利转化率低于同行业全国平均水平的50%为严重不足（如高校全国平均转化率8.3%，低于4.15%即为异常）。专利许可收入远低于预期或技术交易市场不活跃，反映成果转化极为低下。连续两年技术合同成交额下降超20%也是警示信号。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 科技成果转化效果不理想
