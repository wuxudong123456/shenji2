name: audit/法律文书类/专项通知
type: model
description: 从法律文书类类文档（专项通知）中提取结构化元数据。涵盖字段如：通知落实要求字段。文档范围包括：上级单位关于境外公务经费管理的专项通知等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 专项通知
  member_count: 1
  member_details:
  - 上级单位关于境外公务经费管理的专项通知
output:
  fields:
  - name: 通知落实要求字段
    type: string
    description: 提取 通知落实要求字段 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: 制度存在标志.制度存在标志 == false || (制度存在标志.住宿标准字段 == null || 制度存在标志.餐饮标准字段 == null || 制度存在标志.接待标准字段 == null || 制度存在标志.礼品管理字段
    == null)
  description: 判断被审计单位是否正式发布境外公务经费管理制度，若缺失制度文件或文件中未明确住宿、餐饮、接待、礼品管理等关键限额标准，即视为制度缺陷，违反厉行节约制度要求。
  audit_item: 境外公务未严格落实中央八项规定及实施细则精神
  suspicion: 未制定境外公务经费管理制度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央政治局贯彻落实中央八项规定的实施细则\",\n    \"法规文号\": \"中共十八届中央政治局会议审议通过，2017年修订\",\n    \"效力级别\"\
