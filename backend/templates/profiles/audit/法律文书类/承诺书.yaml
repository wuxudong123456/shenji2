name: audit/法律文书类/承诺书
type: model
description: 从法律文书类类文档（承诺书）中提取结构化元数据。涵盖字段如：关联关系披露情况、利益冲突声明签字、募捐项目名称、实际完成指标、承诺书签署状态、承诺事项、承诺人签名、承诺内容。文档范围包括：信用承诺书、关于避免同业竞争的承诺书、廉洁从业承诺书、承诺书、淘汰承诺书、申报承诺书、第三方平台数据真实性承诺书、第三方机构利益冲突回避承诺书、资金使用单位提交的绩效承诺书等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 法律文书类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 法律文书类
  member_types:
  - 承诺书
  member_count: 1
  member_details:
  - 信用承诺书
  - 关于避免同业竞争的承诺书
  - 廉洁从业承诺书
  - 承诺书
  - 淘汰承诺书
  - 申报承诺书
  - 第三方平台数据真实性承诺书
  - 第三方机构利益冲突回避承诺书
  - 资金使用单位提交的绩效承诺书
output:
  fields:
  - name: 关联关系披露情况
    type: string
    description: 提取 关联关系披露情况 的文本值
  - name: 利益冲突声明签字
    type: string
    description: 提取 利益冲突声明签字 的文本值
  - name: 募捐项目名称
    type: string
    description: 提取 募捐项目名称 的文本值
  - name: 实际完成指标
    type: string
    description: 提取 实际完成指标 的文本值
  - name: 承诺书签署状态
    type: boolean
    description: 提取 承诺书签署状态 的布尔值（是/否）
  - name: 承诺事项
    type: string
    description: 提取 承诺事项 的文本值
  - name: 承诺人签名
    type: string
    description: 提取 承诺人签名 的文本值
  - name: 承诺内容
    type: string
    description: 提取 承诺内容 的文本值
  - name: 承诺单位
    type: string
    description: 提取 承诺单位 的文本值
  - name: 承诺完成指标
    type: string
    description: 提取 承诺完成指标 的文本值
  - name: 承诺完成时间
    type: date
    description: 提取 承诺完成时间 的日期值，格式 YYYY-MM-DD
  - name: 承诺捐赠时间
    type: date
    description: 提取 承诺捐赠时间 的日期值，格式 YYYY-MM-DD
  - name: 承诺捐赠金额-物资数量
    type: number
    description: 提取 承诺捐赠金额-物资数量 的数值（含单位，如万元、吨等）
  - name: 承诺淘汰设备及产能
    type: string
    description: 提取 承诺淘汰设备及产能 的文本值
  - name: 承诺解决同业竞争的最后期限
    type: string
    description: 提取 承诺解决同业竞争的最后期限 的文本值
  - name: 捐赠人名称
    type: string
    description: 提取 捐赠人名称 的文本值
  - name: 文书类型
    type: string
    description: 法律文书类型（判决书/裁定书/起诉状等）
    required: false
  - name: 文书编号
    type: string
    description: 文书案号/编号
    required: false
  - name: 当事人
    type: string
    description: 当事人/原告/被告名称
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 发文机关
    type: string
    description: 制作或发布该法律文书的机关或单位
    required: false
violations:
- expression: ((信息.任职企业名称 NOT IN 申报记录.任职企业) AND (信息.董监高姓名 = 申报记录.申请人姓名)) OR ((申报记录.批准意见 = ‘批准’) AND (明细表.发放单位名称 = 信息.任职企业名称)
    AND (明细表.金额 > 0) AND 申报记录.已申报领取薪酬 = ‘否’)
  description: 干部在外部企业担任职务未经审批，或经审批允许兼职但未按规定申报并上缴薪酬，擅自领取工资、奖金、咨询费等收入，即构成违规。审批记录无对应批准即视为未经批准兼职。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 未经批准兼职并擅自领取薪酬
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条第（一）项\",\n    \"内容概述\": \"未经批准不得兼任本企业所出资企业或者其他企业、事业单位、社会团体、中介机构的领导职务，或者经批准兼职的，不得擅自领取薪酬及其他收入。\"\n  }\n]"
- expression: (评价报告.受益人数 - 底稿.受益对象名单) / 底稿.受益对象名单 > 0.1 || (评价报告.任务完成情况 - 对比表.实际完成值) > 0.1 || (评价报告.满意度评分 > 90 && 底稿.调查问卷统计结果
    > 20)
  description: 评价报告数据与原始底稿数据偏差超过10%，或满意度评分与投诉率存在逻辑矛盾，即判定疑点。受益人数虚增、完成率篡改、满意度虚高均视为不真实。
  audit_item: 财政转移支付资金政策绩效评价不规范
  suspicion: 绩效评价结果数据不真实不准确
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"绩效评价结果应当客观、公正、准确、完整，不得弄虚作假。\"\n  }\n]"
- expression: (当前日期 > 承诺书.承诺解决同业竞争的最后期限) && (重叠清单.收入金额 > 0 || 重叠清单.客户区域分布)
  description: 该表达式判断企业在承诺期限到期后，是否仍存在实质性的同业竞争业务。只要重叠业务仍有收入流水或共享同区域客户，即判定为未完成承诺，属于严重失信行为。
  audit_item: 国有企业重点改革任务推进方面存在的问题
  suspicion: 未按承诺时限解决下属企业与上市公司同业竞争
  regulation: "[\n  {\n    \"法规名称\": \"上市公司监管指引第4号——上市公司及其相关方承诺\",\n    \"法规文号\": \"中国证监会公告[2022]16号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"承诺人应当严格履行其作出的各项承诺，不得擅自变更或者豁免。承诺人确需变更或豁免承诺的，应当严格按照相关规定履行决策程序和信息披露义务。\"\
    \n  }\n]"
- expression: (匹配表.签收状态 = NULL) OR (分析表.同一IP当日下单数 > 10 OR 分析表.同一收货地址当月下单数 > 50) OR (追踪表.资金闭环标记 = FALSE) OR (内控制度.是否建立IP监控
    = FALSE OR 承诺书.承诺书签署状态 = '未签署')
  description: 物流信息缺失率超过30%表明存在空包刷单嫌疑；同一IP短期内大量下单或同一地址异常集中下单，反映批量虚假交易特征；退款资金回流至卖方账户是自买自退的典型标志；企业缺少反刷单内控或未签署真实性承诺，表明主观放任。以上条件满足任意一条均触发疑点。
  audit_item: 农村电子商务发展不到位
  suspicion: 电商企业虚构交易刷单造假销售数据
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电子商务法\",\n    \"法规文号\": \"主席令第7号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十七条\",\n    \"内容概述\": \"电子商务经营者不得以虚构交易、编造用户评价等方式进行虚假或者引人误解的商业宣传，欺骗、误导消费者。\"\n  }\n]"
- expression: 信用信息核查记录表.失信状态 = '列入严重失信名单' AND 投资计划申请表.申报单位 = 信用信息核查记录表.单位名称
  description: 申报单位若在信用信息系统中处于严重失信名单状态，则不符合投资计划申报条件。
  audit_item: 项目计划申报不合规
  suspicion: 严重失信主体违规申报涉农投资计划
  regulation: "[\n  {\n    \"法规名称\": \"关于对财政性资金管理使用领域相关失信责任主体实施联合惩戒的合作备忘录\",\n    \"法规文号\": \"发改财金〔2016〕2641号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"二（一）\",\n    \"内容概述\": \"依法限制失信责任主体申请中央预算内投资、财政补助补贴等财政性资金。\"\n  }\n]"
