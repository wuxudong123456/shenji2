violations:
- expression: (ABS(分析表.实际成交价格 - 评估报告.评估价值) / 评估报告.评估价值 > 0.2) AND (交易合同.对方单位 IN 关系名单) AND (交易类型 = ‘领导人员卖出’ OR 交易类型 = ‘领导人员买入’)
  description: 企业领导人员与特定关系人交易的资产价格偏离评估价值或市场均价超过20%，即为异常。卖出价格明显低于评估价值（<0.8倍），或买入价格明显高于评估价值（>1.2倍）均触发。特定关系人包括亲属、特定关联方。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 向特定关系人低价出售或高价购买资产
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（三）项\",\n    \"内容概述\": \"不得以明显低于市场的价格向请托人购买或者以明显高于市场的价格向请托人出售房屋、汽车等物品，或者以其他交易形式非法收受请托人财物。\"\n  }\n]"
- expression: ABS(SUM(内部销售收入.内部销售收入) - SUM(收入金额、确认期间.收入金额)) > 明显阈值
  description: 同一期间两个系统的收入总额存在系统性差异，且无法以合理截止性差异解释，提示存在收入未入账或虚构收入风险。通常设定差异率超过5%或绝对金额显著时为疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 业务系统收入与财务系统收入记录不一致
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与有关资料相互核对，保证会计账簿记录的真实、完整。\"\n  }\n]"
- expression: 公开版.指标得分 != 内部版.指标得分 || 公开版.完成率 != 内部版.完成率 || ABS(公开版.数值 - 内部版.数值) > 0.001
  description: 将官方网站或指定渠道发布的绩效评价结果数据，与单位内部存档的最终定稿报告数据逐项比对，若关键数值（得分、完成率等）出现不一致，即视为公开数据不实。允许极微小四舍五入误差（<0.001），超出即违规。当内部数据与第三方报告一致而公开数据不同时，更可佐证虚假公开。
  audit_item: 部门、单位绩效评价结果未公开
  suspicion: 绩效评价结果公开数据不实
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"行政机关应当及时、准确地公开政府信息。行政机关应当建立健全政府信息发布协调机制，发布政府信息应当准确一致。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\"\
    ,\n    \"法规文号\": \"无（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当对预算支出情况开展绩效"
- expression: 收费项目明细台账.收费项目名称 IN ['房屋转让手续费','地质成果资料费','河道工程修建维护管理费','河道采砂管理费','测绘成果成图资料费'] && 收费项目明细台账.收费日期 >= '对应政策取消生效日期'
  description: 根据财税〔2017〕20号、发改价格〔2018〕370号等文件，上述收费项目已被明令取消或停征。表达式以收费项目名称匹配国家公布取消清单，且收费日期晚于或等于政策生效日期，即可判定为违规征收。具体取消生效日期视不同项目分别设定，如房屋转让手续费自2017年4月1日起取消。需注意地方试点或特殊豁免情形应单独排除。
  audit_item: 违规收费-违规征收国家已取消或停征的行政事业性收费
  suspicion: 违规征收国家已取消或停征的行政事业性收费
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家发展改革委关于清理规范一批行政事业性收费有关政策的通知\",\n    \"法规文号\": \"财税〔2017〕20号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"全文，尤其附件《取消或停征的行政事业性收费项目》\",\n    \"内容概述\": \"自2017年4月1日起，取消或停征41项中央设立的行政事业性收费，将房屋转让手续费、地质成果资料费等列为取消项目，相关部门和单位不得以任何理由拖延或拒绝执行，不得以其他名目变相继续收费。\"\
    \n  }\n]"
- expression: 可行性研究报告.预测收益 显著高于 项目实际运营数据.实际收益 且 ABS(预测收益 - 实际收益)/预测收益 > 0.3 || 可行性研究报告.预测投资额 明显低于 立项批复.批复投资额 且 ABS(批复投资额 -
    预测投资额)/批复投资额 > 0.2
  description: 可行性研究报告中预测的核心效益指标与实际运营数据偏差超过30%，或可研估算的投资额与批复投资额及后续实际投入差异过大（偏差超20%），暗示可研编制为满足审批而人为美化数据、压低投资。需结合市场调研原始资料核查数据来源真实性。
  audit_item: 重大工程项目全过程审计
  suspicion: 可行性研究报告弄虚作假骗取立项批复
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条\"\
    ,\n    \"内容概述\": \"经核定的投资概算是控制政府投资项目总投资的依据。初步设计提出的投资概算超过经批准的可行性研究报告提出的投资估算10%的，项目单位应当向投资主管部门或者其他有关部门报告...。\"\n  },\n \
    \ {\n    \"法规名称\": \"中央预算内直接投资项目管理办法\",\n    \"法规文号\": \"国家发展改革委令第7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\"\
    ,\n"
- expression: 利润表.营业收入增长率 - 产品销售量统计表.销售增长率 > 20% && 主要产品销售价格变动表.产品平均售价及同比变动 < 10% && 同行业可比公司数据.收入增长率 < (利润表.营业收入增长率 - 产品销售量统计表.销售增长率)
  description: 当收入增长率远超销售量增长率，而产品售价基本稳定且显著高于行业平均水平时，可能存在虚增收入、人为调节销售数量或单价的风险。阈值可根据行业波动适当调整，一般偏差超过20%视为高度可疑。
  audit_item: 企业财务报表分析
  suspicion: 收入增长与销售量变动逻辑背离
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。收入金额应反映企业因交付商品而预期有权收取的对价，禁止在未满足条件时提前确认或虚构收入。\"\n\
    \  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n    \"\
    内容概述\": \"公"
- expression: (利润表.营业收入 / ((资产负债表.总资产（期初）+资产负债表.总资产（期末）)/2)) < 行业数据.行业平均总资产周转率*0.7 && (资产负债表.存货净额 / 资产负债表.总资产) > 行业均值*1.5
    && (资产负债表.应收账款净额 / 资产负债表.总资产) > 行业均值*1.5
  description: 企业总资产周转率低于行业平均水平70%，且存货占总资产比重、应收账款占总资产比重均超过行业均值的1.5倍，表明资产营运效率严重低下，资产质量可能被高估，存在未足额计提减值准备或滞销存货未及时处理的可能性。
  audit_item: 企业财务杜邦分析
  suspicion: 总资产周转率异常下滑且存货与应收账款双高
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"资产负债表日，存货应当按照成本与可变现净值孰低计量。存货成本高于其可变现净值的，应当计提存货跌价准备，计入当期损益。\"\n  },\n  {\n    \"法规名称\": \"\
    企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\": \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\"\
    : \"企业"
- expression: (资产负债表.总负债/资产负债表.总资产 - 行业基准数据.行业平均资产负债率) > 0.2 && (利润表.营业利润 + 利润表.利息费用)/利润表.利息费用 < 2 || (利润表.整体毛利率 > 行业基准数据.行业平均毛利率
    * 1.5 && 利润表.净利润 == 0) || (利润表.净利润/资产负债表.股东权益 > 行业基准数据.行业平均ROE * 2 && 利润表.净利率 < 行业基准数据.行业平均净利率) || (资产负债表.总负债/资产负债表.总资产
    < 行业基准数据.行业平均资产负债率 * 0.5 && 利润表.营业收入/资产负债表.总资产 < 行业基准数据.行业平均总资产周
  description: 该表达式用于识别偏离行业正常水平的极端风险。第一条：负债率比行业均值高20个百分点且利息保障倍数低于2，提示偿债能力极弱。第二条：毛利率远高于行业平均水平（1.5倍）但净利润为0，可疑为费用资本化或关联方承担费用，虚增毛利。第三条：ROE（权益报酬率）奇高但净利率低，提示企业可能过度使用高负债杠杆（权益乘数极高），存在重大财务风险。第四条：负债率极低但总资产周转率也极低，可能存在大额闲置资产、资金
  audit_item: 企业财务比率分析
