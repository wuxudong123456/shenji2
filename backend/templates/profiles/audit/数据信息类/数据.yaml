name: audit/数据信息类/数据
type: model
description: 从数据信息类类文档（数据）中提取结构化元数据。涵盖字段如：不同主体产值占比、主要污染物、主要超标因子、人口密度、企业名称、企业坐标、企业类型、作物类型。文档范围包括：GIS数据、业务系统收费数据、业务系统数据、人口分布数据、任务量数据、供餐现场核验数据、公安户籍数据、公安户籍注销数据、公安户籍系统数据、公开市场价格数据等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据信息类
- 审计
- 资产
- 元数据提取
