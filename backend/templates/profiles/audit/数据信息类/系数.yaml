name: audit/数据信息类/系数
type: model
description: 从数据信息类类文档（系数）中提取结构化元数据。涵盖字段如：各市县系数。文档范围包括：财政困难程度系数等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据信息类
- 审计
- 元数据提取
template_class:
  category: 数据信息类
  member_types:
  - 系数
  member_count: 1
  member_details:
  - 财政困难程度系数
output:
  fields:
  - name: 各市县系数
    type: string
    description: 提取 各市县系数 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
  - name: 数据版本
    type: string
    description: 数据文件的版本号，如v1.0
    required: false
  - name: 数据状态
    type: string
    description: 数据有效性状态，如有效、失效、待更新
    required: false
  - name: 更新日期
    type: date
    description: 数据最后更新或审核的日期
    required: false
violations:
- expression: (明细表.各市县实际分配金额 / 明细表.各地实际分配金额 > 1.5) && (数据.各市县棚改户数、公租房缺口等 < 分配依据、权重设置*0.8) && (无专项转移支付倾斜政策依据)
  description: 人均分配金额通过人口和分配金额计算；若某地人均资金远超全省均值且任务量占比明显偏低，又无政策倾斜依据，则存在分配不公；可进一步用基尼系数辅助判断。
  audit_item: 财政部门未按规定分配下达保障性安居工程专项资金
  suspicion: 省级财政部门分配资金显失公平
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程补助资金管理办法\",\n    \"法规文号\": \"财综〔2022〕1号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第八条\",\n    \"内容概述\": \"省级财政应按照公平公正原则，结合本地区实际，合理分配中央下达的补助资金，重点向保障性安居工程任务重、财政困难地区倾斜。\"\n  }\n]"
