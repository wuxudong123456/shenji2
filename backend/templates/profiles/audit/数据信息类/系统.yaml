name: audit/数据信息类/系统
type: model
description: 从数据信息类类文档（系统）中提取结构化元数据。涵盖字段如：受理状态、后台流转日志、是否参公管理、是否在职在编、申报时间。文档范围包括：公务员薪资系统、线上申报系统等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据信息类
- 审计
- 元数据提取
template_class:
  category: 数据信息类
  member_types:
  - 系统
  member_count: 1
  member_details:
  - 公务员薪资系统
  - 线上申报系统
output:
  fields:
  - name: 受理状态
    type: boolean
    description: 提取 受理状态 的布尔值（是/否）
  - name: 后台流转日志
    type: string
    description: 提取 后台流转日志 的文本值
  - name: 是否参公管理
    type: boolean
    description: 提取 是否参公管理 的布尔值（是/否）
  - name: 是否在职在编
    type: boolean
    description: 提取 是否在职在编 的布尔值（是/否）
  - name: 申报时间
    type: date
    description: 提取 申报时间 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
  - name: 数据版本
    type: string
    description: 数据文件的版本号，如v1.0
    required: false
  - name: 数据状态
    type: string
    description: 数据有效性状态，如有效、失效、待更新
    required: false
  - name: 更新日期
    type: date
    description: 数据最后更新或审核的日期
    required: false
violations:
- expression: 兼职审批文件.批准文号为空 || 兼职人员名册.应发报酬 > 0
  description: 参公管理人员未经批准在企业兼职即构成违规；无论是否批准，领取任何形式的报酬、补贴、奖金等均属违规，表达式判定领取金额大于0即触发。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 联合社参公管理人员未经批准在企业兼职并领取报酬
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"公务员因工作需要在机关外兼职，应当经有关机关批准，并不得领取兼职报酬。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范党政领导干部在企业兼职（任职）问题的意见\"\
    ,\n    \"法规文号\": \"中组部发〔2013〕18号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"现职和不担任现职但未办理退（离）休手续的党政领导"
- expression: （《快速发现响应机制建设文件》 缺失） || （《预警信息处置反馈记录表》 中 （入户核实完成时间 - 接报时间） > 15个工作日） || （《线上申报系统或热线记录》 中 存在 超过10个工作日 仍为“待受理”状态的记录）
  description: 判定标准：1. 无法提供成文的机制建设文件，系统运转无据可依。2. 从发现预警到完成入户核实的全流程超15个工作日，响应效率低下。3. 线上渠道形同虚设，存在大量长期未受理的群众自主申报信息。满足任一情况，即认定快速发现和响应机制未建立或未有效运行。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 未建立或运行快速发现响应机制
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部关于进一步健全防止返贫监测帮扶机制的通知\",\n    \"法规文号\": \"农办发〔2023〕6号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"二\",\n    \"内容概述\": \"拓宽农户自主申报渠道，优化干部排查、部门筛查等方式，建立“多网合一”的快速发现机制，明确各环节办理时限，确保群众诉求及时发现、快速响应、及时办结。\"\n\
    \  }\n]"
