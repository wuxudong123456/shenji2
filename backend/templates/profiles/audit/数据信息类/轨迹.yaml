name: audit/数据信息类/轨迹
type: model
description: 从数据信息类类文档（轨迹）中提取结构化元数据。涵盖字段如：停留点坐标、时间、行驶轨迹、车牌号。文档范围包括：车辆GPS轨迹等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据信息类
- 审计
- 元数据提取
template_class:
  category: 数据信息类
  member_types:
  - 轨迹
  member_count: 1
  member_details:
  - 车辆GPS轨迹
output:
  fields:
  - name: 停留点坐标
    type: string
    description: 提取 停留点坐标 的文本值
  - name: 时间
    type: date
    description: 提取 时间 的日期值，格式 YYYY-MM-DD
  - name: 行驶轨迹
    type: string
    description: 提取 行驶轨迹 的文本值
  - name: 车牌号
    type: string
    description: 提取 车牌号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
  - name: 数据版本
    type: string
    description: 数据文件的版本号，如v1.0
    required: false
  - name: 数据状态
    type: string
    description: 数据有效性状态，如有效、失效、待更新
    required: false
  - name: 更新日期
    type: date
    description: 数据最后更新或审核的日期
    required: false
violations:
- expression: (GPS轨迹.停留点坐标位于农村非工业区 && 与环境监测报告.超标点位100米内) || (转移联单.接收单位 NOT IN 备案清单.企业名称) || (交接登记表.废物类别='一般工业固废/危险废物' && 接收地点无环评批复)
  description: 运输车辆GPS在非工业区异常停留且与污染超标点吻合，或转移接收单位无相应备案资质，或在无环评批复的农村地点接收工业固废，即判定为非法倾倒嫌疑。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 在农村地区非法倾倒工业固体废物
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"产生工业固体废物的单位应当采取防止或者减少固体废物污染环境的措施，禁止擅自倾倒、堆放、丢弃、遗撒固体废物。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\"\
    ,\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第八十二条\",\n    \"内容概述\": \"转移危险废物的，必须按照国家"
