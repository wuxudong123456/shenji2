violations:
- expression: (党员领导干部个人事项报告表.填报的经商办企业情况 IS NULL OR 党员领导干部个人事项报告表.投资企业名称 NOT CONTAINS 企业名称) AND (工商注册登记信息.股东/发起人姓名及身份证号 = 领导干部身份证号
    OR 工商注册登记信息.法定代表人姓名及身份证号 = 领导干部身份证号) AND (工商注册登记信息.出资比例 > 0) AND (工商注册登记信息.企业状态 = '存续')
  description: 依据个人报告表与工商登记信息比对，如果领导干部未在报告表中申报任何经商办企业记录，但在工商注册登记中直接登记为股东或法定代表人且持股比例大于0，则视为违反规定个人独资或与他人合资合股经商办企业。同时排除企业已注销等状态。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 个人独资或与他人合资合股经办企业
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（一）项\",\n    \"内容概述\": \"违反有关规定从事营利活动，经商办企业的，视情节给予警告直至开除党籍处分。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n\
    \    \"法规文号\": \"主席令第二十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十九条第十六项\",\n    \"内容概述\": \"公务员不得违反有关规定从事或者参与营利性活动，在企业或者其他"
- expression: (企业股东及股权变更记录.受让方姓名 IN 领导干部直系亲属及特定关系人名单.亲属姓名) && (企业股东及股权变更记录.转让价格 < 企业净资产负债比例对应股权价值*0.7 OR 企业股东及股权变更记录.转让价格为0
    OR 企业股东及股权变更记录.转让方与受让方为无对价转让) && (银行账户流水.付款方==领导干部 OR 银行账户流水.付款方==领导干部配偶 && 银行账户流水.资金用途 CONTAINS '投资款' OR '股权款') && 党员领导干部个人有关事项报告表.未填报该亲属名下的企业投资
  description: 筛选股权变更记录中受让方为领导干部直系亲属或特定关系人，且转让价格明显低于公允价值（低于70%）甚至无偿转让，同时存在领导干部或其配偶账户向原股东或亲属支付大额款项的痕迹，并且领导干部未在个人事项报告中申报亲属的该笔投资。表达式考虑了代持行为核心特征：低价转让、资金来源于领导干部、未如实申报。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 以他人名义入股形式经办企业
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（一）项、第（二）项\",\n    \"内容概述\": \"违反规定从事营利活动，经商办企业，或者拥有非上市公司（企业）的股份或者证券的，给予相应处分。以他人名义持股仍属违规。\"\n  },\n  {\n   \
    \ \"法规名称\": \"关于领导干部报告个人有关事项的规定\",\n    \"法规文号\": \"中办发〔2017〕12号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第四条\",\n\
    \    \"内容概"
- expression: (企业法人/高管信息对照表.任职起始日期 - 领导干部离职/退休信息登记表.离职日期) < 3年 && 离职人员从业情况申报表.企业性质 IN ('民营企业','外商投资企业','中介机构') && (工商登记信息.注册地址
    ∈ 领导干部离职/退休信息登记表.分管领域 OR 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围) && (社会兼职申报.审批结果 != '批准' OR 社会兼职申报.审批结果 IS NULL)
  description: 禁业期按通常3年设定；若任职起始日期与离职日期间隔小于1095天即为在禁业期内；企业性质须为民营企业、外商投资企业或中介机构之一；业务关联判定采用地区匹配或关键词重合（审计中可设定重合度阈值>60%）；若未履行审批手续或审批不通过即触发疑点。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规接受原管辖范围内企业聘任
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"公务员辞去公职或者退休的，原系领导成员的公务员在离职三年内，不得到与原工作业务直接相关的企业或者其他营利性组织任职，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n \
    \ {\n    \"法规名称\": \"关于进一步规范党政领导干部在企业兼职（任职）问题的意见\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": "
- expression: (工商登记信息.成立日期 >= 领导干部离职审批文件.离职日期 - 缓冲期) && (领导干部离职审批文件.离职日期 + 3年 >= 当前日期 OR 当前日期 - 领导干部离职审批文件.离职日期 <= 3年) &&
    ((工商登记信息.投资人/股东姓名及身份证号 = 领导干部离职审批文件.姓名) OR (工商登记信息.企业名称 = 直系亲属经商办企业备案表.企业名称 AND 工商登记信息.投资人/股东姓名及身份证号 = 直系亲属经商办企业备案表.亲属姓名))
    && (关联企业清单.企业名称 = 工商登记信息.企业名称 AND 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围
  description: 缓冲期可设定为6个月，避免离职前已谋划的合理情形；禁业期以3年为限；企业投资人或实际控制人为本人或直系亲属（代持）；业务关联性通过关键词匹配（如原分管住建，企业主营房地产开发、建筑工程咨询），叠加与原任职单位存在交易或利用原权力获得审批，即触发违规。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事与原职务相关的营利性活动
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"原系领导成员的公务员在离职三年内，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"\
    法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第九十六条\",\n    \"内容概述\": \"离职或者退（离）休后违反有关规定从事与原任职务管辖业务相关的营利活动，视"
- expression: '领导干部离职审批文件.离职日期 + 3年 >= 当前日期 && (企业法人/高管信息对照表.离职人员关联企业/中介机构名称 IN (SELECT 工商登记信息.企业名称 FROM 工商登记信息 WHERE 工商登记信息.经营范围
    LIKE ''%中介%'' OR 工商登记信息.经营范围 LIKE ''%经纪%'' OR 工商登记信息.经营范围 LIKE ''%咨询%'')) && ((银行资金流水明细表.交易摘要 LIKE ''%服务费%'' OR 银行资金流水明细表.交易摘要
    LIKE ''%佣金%'' OR 银行资金流水明细表.交易摘要 LIKE ''%居间费%'') AND 领导干部离职审批文件.管辖业务范围 '
  description: 在禁业期内，以中间人身份撮合交易并收取费用；通过企业名称或业务类型、银行流水中的佣金类收入、以及与原管辖对象的联系强度（通话频次前20%或直接出现审批加速）建立判违逻辑。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事有偿中介活动
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十六条\",\n    \"内容概述\": \"党员领导干部离职或者退（离）休后违反有关规定从事有偿中介活动，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务处分；情节严重的，给予留党察看处分。\"\n \
    \ },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百零七条\"\
    ,\n    \""
- expression: ((DAYOFWEEK(接待公函.接待日期) IN (6,7) || 接待公函.接待日期 IN (法定节假日列表)) && 住宿费发票.地址 DISTANCE 被接待人信息.家庭住址 < 100km) || 接待公函.邀请单位
    IS NOT EXIST
  description: 接待发生在周末或节假日，且住宿地点距被接待人家庭地址不足100公里，或无法查到发函单位真实存在，高度怀疑借公务之名搭车报销个人探亲旅游费用。
  audit_item: 公务接待管理不符合规定
  suspicion: 将个人休假探亲费用纳入公务接待报销
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"接待单位应当严格控制国内公务接待范围，不得用公款报销或者支付应由个人负担的费用。\"\n  }\n]"
- expression: (明细表.交易对手方 IN (系申报表.特定关系人企业名称)) && (ABS(合同单价.合同单价-信息.同期同类商品/服务市场价格)/信息.同期同类商品/服务市场价格 > 0.15 || 其他.验收合格率 > 0.1
    || 明细表.付款条件为'预付80%以上' || 账期超过180天)
  description: 筛查与特定关系人企业的交易是否存在价格不公（偏差±15%以上）、质量低劣（不合格率超10%）或付款条件异常（大额预付或超长账期）等问题，任一异常即触发。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 特定关系人企业与本企业发生可能侵害利益的经济业务往来
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第五项\",\n    \"内容概述\": \"不得有本人的配偶、子女及其他特定关系人投资或者经营的企业与本企业或者有出资关系的企业发生可能侵害公共利益、企业利益的经济业务往来。\"\n  }\n]"
- expression: (姓名、原职务、离职时间.新任职企业名称 IN (企业名称、业务关系存续时间)) && (DATEDIFF(离职时间, 新任职起始时间) < 1095) && (新任职企业.业务范围 IN 原企业经营业务类别)
  description: 筛查离职或退休后三年内（1095天）到与原任职企业有业务关系的私营企业、外资企业或中介机构担任职务或投资入股，且从事与原业务相关的经营活动。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 离职或退休后违规在与原企业有业务关系的企业任职或入股
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第七项\",\n    \"内容概述\": \"离职或者退休后三年内，不得在与原任职企业有业务关系的私营企业、外资企业和中介机构担任职务、投资入股，或者在上述企业或者机构从事、代理与原任职企业经营业务相关的经营活动。\"\
    \n  }\n]"
- expression: (信息.股东姓名 IN (项申报表.申报人姓名, 项申报表.配偶及子女姓名)) AND (信息.企业名称 IN (名录.关联企业名称)) AND (项申报表.投资企业名称 不包含 信息.企业名称 OR 项申报表.持股比例
    != 信息.持股比例) AND (信息.出资日期 BETWEEN 领导人员任职开始日期 AND 审计基准日)
  description: 领导人员或其近亲属在关联企业持有股份且未如实申报，或申报持股比例与工商登记不符，同时入股时间发生在任职期间内，触发违规判定。持股比例>0即视为投资入股。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 领导人员违规投资入股关联企业
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第一款\",\n    \"内容概述\": \"国有企业领导人员不得个人从事营利性经营活动和有偿中介活动，或者在本企业的同类经营企业、关联企业和与本企业有业务关系的企业投资入股。\"\n  }\n]"
- expression: ((信息.任职企业名称 NOT IN 申报记录.任职企业) AND (信息.董监高姓名 = 申报记录.申请人姓名)) OR ((申报记录.批准意见 = ‘批准’) AND (明细表.发放单位名称 = 信息.任职企业名称)
    AND (明细表.金额 > 0) AND 申报记录.已申报领取薪酬 = ‘否’)
  description: 干部在外部企业担任职务未经审批，或经审批允许兼职但未按规定申报并上缴薪酬，擅自领取工资、奖金、咨询费等收入，即构成违规。审批记录无对应批准即视为未经批准兼职。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 未经批准兼职并擅自领取薪酬
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条第（一）项\",\n    \"内容概述\": \"未经批准不得兼任本企业所出资企业或者其他企业、事业单位、社会团体、中介机构的领导职务，或者经批准兼职的，不得擅自领取薪酬及其他收入。\"\n  }\n]"
- expression: (财务凭证.附件完整性 == FALSE OR 发票.货物或应税劳务名称 == '虚开') OR (信息.参保人数 == 0 AND 信息.实缴资本 < 10万) OR (行对账单.收款方 != 原始合同.签订方 AND
    无合法转包协议) OR (行对账单.资金流水)
  description: 构建四条独立触发条件：附件缺失或虚假发票；供应商为空壳公司（社保人数0且注册资本较低）；资金收款方与合同签订方不一致且无转包手续；资金闭环回流。任一条件成立即属套取资金疑点，需全面核查。
  audit_item: 挤占挪用套取财政资金
  suspicion: 虚列支出套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第九条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计账簿，编制财务会计报告。任何单位不得以虚假的经济业务事项或者资料进行会计核算。\"\n  },\n  {\n   \
    \ \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\"\
    : \"国家机关及"
- expression: 材料采购合同.采购单价 > 信息.同期市场均价 * 1.1 && 材料采购合同.签订日期 < 验收单.验收日期
  description: 当采购合同单价超出同期市场均价的110%时，视为价格异常；同时满足合同签订日期早于材料进场验收日期，排除时间错配，初步判定为虚高采购价格。
  audit_item: 工程项目成本异常调查
  suspicion: 材料采购单价异常偏高
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第五十一条\",\n    \"内容概述\": \"招标人应当自收到评标报告之日起3日内公示中标候选人，公示期不得少于3日。投标人或者其他利害关系人对评标结果有异议的，应当在中标候选人公示期间提出。\"\n  },\n\
    \  {\n    \"法规名称\": \"基本建设财务规则\",\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\",\n   \
    \ \"内容概述\": "
