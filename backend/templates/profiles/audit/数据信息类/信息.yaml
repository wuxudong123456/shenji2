name: audit/数据信息类/信息
type: model
description: 从数据信息类类文档（信息）中提取结构化元数据。涵盖字段如：与产业园管理方关联关系、与农户对应关系、与受益人关系、与村干部关系、与被审计单位人事关联情况、中标候选人名单及投标单位名称、中标金额、主体名称。文档范围包括：GIS地理信息、“一卡通”账户信息、不动产登记信息、中标信息、中标单位工商登记信息、主体信息、代理商备案信息、企业工商注册信息、供应商工商信息、公安户籍信息等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据信息类
- 审计
- 人员
- 金额
- 元数据提取
template_class:
  category: 数据信息类
  member_types:
