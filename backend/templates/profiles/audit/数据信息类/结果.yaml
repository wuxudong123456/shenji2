name: audit/数据信息类/结果
type: model
description: 从数据信息类类文档（结果）中提取结构化元数据。涵盖字段如：产品市场接受度评价、企业注销/吊销/经营异常状态、企业注销/吊销状态、低保领取记录、关联企业情况、其他补贴领取记录、参与环节、发票状态。文档范围包括：去产能年度考核政府考核结果、用户投诉处理结果、税务发票真伪查验结果、脱贫群众满意度调查问卷结果、跨部门数据比对结果等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据信息类
- 审计
- 培训
- 票据
- 补贴
- 元数据提取
template_class:
  category: 数据信息类
  member_types:
  - 结果
  member_count: 1
  member_details:
  - 去产能年度考核政府考核结果
  - 用户投诉处理结果
  - 税务发票真伪查验结果
  - 脱贫群众满意度调查问卷结果
  - 跨部门数据比对结果
output:
  fields:
  - name: 产品市场接受度评价
    type: string
    description: 提取 产品市场接受度评价 的文本值
  - name: 企业注销-吊销-经营异常状态
    type: boolean
    description: 提取 企业注销-吊销-经营异常状态 的布尔值（是/否）
  - name: 企业注销-吊销状态
    type: boolean
    description: 提取 企业注销-吊销状态 的布尔值（是/否）
  - name: 低保领取记录
    type: string
    description: 提取 低保领取记录 的文本值
  - name: 关联企业情况
    type: string
    description: 提取 关联企业情况 的文本值
  - name: 其他补贴领取记录
    type: string
    description: 提取 其他补贴领取记录 的文本值
  - name: 参与环节
    type: string
    description: 提取 参与环节 的文本值
  - name: 发票状态
    type: boolean
    description: 提取 发票状态 的布尔值（是/否）
  - name: 同一身份证号在其他地区同时间段申领培训补贴记录
    type: date
    description: 提取 同一身份证号在其他地区同时间段申领培训补贴记录 的日期值，格式 YYYY-MM-DD
  - name: 处理结果
    type: boolean
    description: 提取 处理结果 的布尔值（是/否）
  - name: 工商注册信息
    type: string
    description: 提取 工商注册信息 的文本值
  - name: 差异说明
    type: string
    description: 提取 差异说明 的文本值
  - name: 技能提升评价
    type: string
    description: 提取 技能提升评价 的文本值
  - name: 收入增长满意度
    type: number
    description: 提取 收入增长满意度 的数值（含单位，如万元、吨等）
  - name: 政府核定完成量
    type: string
    description: 提取 政府核定完成量 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
  - name: 数据版本
    type: string
    description: 数据文件的版本号，如v1.0
    required: false
  - name: 数据状态
    type: string
    description: 数据有效性状态，如有效、失效、待更新
    required: false
  - name: 更新日期
    type: date
    description: 数据最后更新或审核的日期
    required: false
violations:
- expression: (保险公司费用支出明细表.费用科目 IN ('宣传费','查勘费','服务费') && 税务发票真伪查验结果.发票状态 == '虚假') || (保险公司费用支出明细表.金额 > 保险公司内部财务管理制度.费用报销标准
    * 3)
  description: 费用科目为宣传费、查勘费、服务费等，且对应发票经税务系统查验为虚假，或单笔费用金额超出公司内部制度标准3倍以上，即判定为虚列费用。无明确标准的，可参照当地行业均价，超出均值3倍为高风险。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 保险公司虚列费用套取保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条第二项\"\
    ,\n    \"内容概述\": \"禁止保险公司通过虚列费用等方式骗取农业保险保费补贴。\"\n  }\n]"
- expression: (发放明细表.身份证号/统一社会信用代码 NOT IN (SELECT 身份证号 FROM 核验记录 WHERE 社保缴纳状态='中断')) || (发放明细表.身份证号/统一社会信用代码 NOT IN (SELECT
    身份证号 FROM 核验记录 WHERE 失业登记有效状态='有效')) || (发放明细表.身份证号/统一社会信用代码 IN (SELECT 统一社会信用代码 FROM 结果 WHERE 企业注销/吊销/经营异常状态 IN ('注销','吊销')))
    || (申请材料.低保证/残疾证等==1)
  description: 违规判定逻辑：发放对象若未在社保系统中显示为中断缴费状态、未在失业登记数据库中处于有效状态、企业已被注销/吊销，或者申请时缺失失业证明、低保证等关键证明，即触发违规预警。多个条件为或关系，满足任意一项即为疑点。
  audit_item: 违规发放资金或补贴
  suspicion: 违规向不符合条件对象发放就业补助资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国就业促进法\",\n    \"法规文号\": \"中华人民共和国主席令第七十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十五条、第四十九条\",\n    \"内容概述\": \"国家实行有利于促进就业的财政政策，就业专项资金必须专款专用，不得挤占挪用；各级人民政府应规范就业专项资金的使用管理，确保资金用于符合条件的补贴对象。\"\n  },\n\
    \  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条、第十七条\""
- expression: (COUNT(身份证号、培训项目名称、培训起止时间、补贴金额.身份证号) > 1) || (同一身份证号在不同补贴项目(如职业技能鉴定与职业培训)中出现) || (SUM(身份证号、培训项目名称、培训起止时间、补贴金额.补贴金额)
    > 政策上限(如2000元/人))
  description: 以身份证号为主键，对补贴发放台账进行分组聚合，当同一人在同类补贴中出现次数超过1次，或者跨不同补贴项目均出现，或者累计领取金额超过政策规定每人每年上限，即判定为重复或超额发放违规。
  audit_item: 违规发放资金或补贴
  suspicion: 违规向同一人员重复发放职业技能培训补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"职业培训补贴、职业技能鉴定补贴等，同一项目不得重复享受，享受补贴的个人应按照规定提供真实有效的培训证明材料。\"\n  },\n  {\n    \"法规名称\": \"关于进一步做好职业培训补贴资金使用管理工作的通知\"\
    ,\n    \"法规文号\": \"人社厅发〔2019〕117号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"各地"
- expression: (发放台账.营业执照注册日期 - 工商注册日期 < 730天) || (发放台账.统一社会信用代码 IN (SELECT 统一社会信用代码 FROM 工商系统 WHERE 经营范围表是否为首次创业='否')) ||
    (银行流水.资金用途显示为购房、证券投资等非经营交易)
  description: 以贷款申请时间与企业注册时间差是否小于2年（730天）判断是否满足首次创业条件；通过工商系统查证同一主体或关联方是否已有注册企业，排除非首次创业；追踪贴息贷款资金银行流水，若资金转入房地产公司、证券公司等非经营类账户，则表明资金用途违规。满足任意条件即发贴息违规疑点。
  audit_item: 违规发放资金或补贴
  suspicion: 违规向不符合条件对象发放创业担保贷款财政贴息
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加大创业担保贷款贴息力度全力支持重点群体创业就业的通知\",\n    \"法规文号\": \"财金〔2020〕21号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第一条、第五条\",\n    \"内容概述\": \"创业担保贷款贴息对象必须是首次创业或符合特定条件的群体，贷款必须用于生产经营，不得用于偿还债务、金融投资等非创业项目。\"\n\
    \  },\n  {\n    \"法规名称\": \"普惠金融发展专项资金管理办法\",\n    \"法规文号\": \"财金〔2019〕96号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第十六条\""
