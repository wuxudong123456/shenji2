name: audit/数据信息类/库
type: model
description: 从数据信息类类文档（库）中提取结构化元数据。涵盖字段如：产权人身份证号、信息更新时间、入库日期、入库金额、关联报装编号、养殖场名称、养殖规模分类、内容。文档范围包括：供应商库、供应商黑名单库、公务人员信息库、养殖场备案数据库、农户基础信息数据库、农村住房安全普查数据库、农村公路项目数据库、地方保障性安居工程项目库（表2）、官方技能证书数据库、市场价格信息库等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据信息类
- 审计
- 培训
- 金额
- 元数据提取
template_class:
  category: 数据信息类
  member_types:
  - 库
  member_count: 1
  member_details:
  - 供应商库
  - 供应商黑名单库
  - 公务人员信息库
  - 养殖场备案数据库
  - 农户基础信息数据库
  - 农村住房安全普查数据库
  - 农村公路项目数据库
  - 地方保障性安居工程项目库（表2）
  - 官方技能证书数据库
  - 市场价格信息库
  - 教师专业发展档案库（含培训记录）
  - 残联部门残疾等级评定数据库
  - 法规数据库
  - 特殊群体身份认定数据库
  - 用户投诉工单数据库
  - 耕地质量监测数据库
  - 虚假材料特征库
  - 财政供养人员数据库
  - 财政部门非税收入缴库
