violations:
- expression: 明细表.采购方式 = '邀请招标' AND (被邀请供应商名称.COUNT(DISTINCT 被邀请供应商名称) < 3 OR 公告.实际投标供应商数量 < 3)
  description: 邀请招标的法定最低邀请供应商数量为3家。表达式检查邀请名单中独立供应商数量是否少于3家，或实际参与投标的供应商少于3家且无符合资格家数不足的书面说明，即触发违规。
  audit_item: 政府采购组织管理不规范
  suspicion: 邀请招标未向三家以上供应商发出投标邀请
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十九条、第三十六条\",\n    \"内容概述\": \"采购人邀请招标应邀请三家以上符合资格条件的供应商参加投标；出现符合专业条件的供应商或对招标文件作实质响应的供应商不足三家情形的，应予废标，并依法重新组织招标或改变采购方式。\"\
    \n  }\n]"
- expression: (实际缴库日期 - 收费日期) > 规定缴库时限 && ABS(非税收入台账.已缴金额 - 银行流水.收入金额) < 小额阈值
  description: 规定缴库时限依据当地非税收入收缴管理办法，通常为10至15个工作日。延时时长超过规定即为滞留；若延时期间资金被挪用则另案处理。滞留天数>30日定为严重违规。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 滞留应缴非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条、第二十二条\",\n    \"内容概述\": \"非税收入应当依法及时足额上缴，执收单位应在执收非税收入后10个工作日内上缴财政，最长不超过15个工作日。\"\n  }\n]"
- expression: 非税收入台账.已缴金额 < 非税收入台账.应缴金额 && 银行对账单.支出金额 ≈ (非税收入台账.应缴金额 - 非税收入台账.已缴金额) && 银行对账单.支出用途 IN ('工程款','采购款','办公费','装修费','工资奖金')
  description: 当非税收入未足额缴库且差额部分被用于单位各项经费支出，表明资金被挤占挪用。应进一步核实支出审批单是否注明资金来源于非税收入。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 挤占挪用应缴非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十六条\",\n    \"内容概述\": \"非税收入必须全额上缴国库或财政专户，任何单位和个人不得截留、坐支、挪用、私分。\"\n  }\n]"
- expression: 报告正文.法规名称 > 法规状态（现行有效/废止）.废止日期 || (报告正文.文号 MATCHES '已废止' FROM 法规状态（现行有效/废止）)
  description: 通过查询法规数据库，若审计报告中引用的法规在报告出具日之前已废止，则触发疑点。
  audit_item: 审计文书校验
  suspicion: 审计报告引用已废止法规
  regulation: "[\n  {\n    \"法规名称\": \"审计机关审计报告编审准则\",\n    \"法规文号\": \"审法发〔2020〕31号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"审计报告引用的法律、法规、规章和规范性文件应当准确、有效，不得适用已经废止或者尚未生效的规定。\"\n  }\n]"
- expression: 明细表.供应商名称 IN (登记表.亲属持股或任职企业名称) && ABS(明细表.交易价格 - 库.同期同类商品或服务市场均价) / 库.同期同类商品或服务市场均价 > 0.15 && (明细表.合同签订日期 -
    会议记录.合同签订日期) > 0 && 会议记录.表决结果 = '通过'
  description: 筛查供应商属于管理人员亲属控制的企业，且交易价格偏离市场均价超过15%的业务。同时检查合同签订是否在相关决策会议之后，以确认虽有形式审批但价格明显不公允，可能存在利益输送。偏离度越高，违规风险越高。
  audit_item: 违反廉洁从业有关规定问题
  suspicion: 利用职权为亲属企业高价承揽业务牟利
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规\",\n   \
    \ \"条款号\": \"第六条（三）项\",\n    \"内容概述\": \"不得利用职权为配偶、子女及其他特定关系人从事营利性经营活动提供便利条件，或者利用职权相互为对方及其配偶、子女和其他特定关系人从事营利性经营活动提供便利条件。\"\
    \n  }\n]"
- expression: 采购合同台账.统一社会信用代码 IN (供应商黑名单库.统一社会信用代码) && 采购合同台账.合同签订日期 >= 供应商黑名单库.生效日期 && (采购合同台账.合同签订日期 <= 供应商黑名单库.截止日期 OR
    供应商黑名单库.截止日期 IS NULL) && (供应商资质审查表.审查结论 != '合格' || 供应商资质审查表 IS NULL)
  description: 利用统一社会信用代码关联黑名单库，合同签订时间在黑名单生效期间内，且供应商资质审查表结论为不合格或缺失，即判定为违规使用不合格供应商。
  audit_item: 销售与采购合同审计
  suspicion: 供应商为黑名单企业却中标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第六十七条\",\n    \"内容概述\": \"投标人以他人名义投标或者以其他方式弄虚作假，骗取中标的，中标无效；构成犯罪的，依法追究刑事责任。串通投标、行贿的供应商应列入黑名单。\"\n  },\n  {\n \
    \   \"法规名称\": \"国有企业采购管理规范\",\n    \"法规文号\": \"（参考中物联发布的团体标准）\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第十三条\",\n  \
    \  \"内容概述\": "
- expression: (培训通知.培训项目面向对象要求 = '乡村教师' AND 近三年国培计划参训教师名单（含学校属地标识）.参训项目名称 = 培训通知.培训内容 AND 近三年国培计划参训教师名单（含学校属地标识）.学校属地类型 =
    '城区') OR (培训报名表.学校属地类型 = '乡村' AND 近三年国培计划参训教师名单（含学校属地标识）.学校属地类型 = '城区' AND 培训报名表.报名教师姓名 = 近三年国培计划参训教师名单（含学校属地标识）.教师姓名)
  description: 培训项目明确规定仅限乡村教师参加，但实际参训人员中出现城区教师，或报名时显示乡村教师但实际参训人是城区教师，构成挤占。两个条件满足任一即判定违规。
  audit_item: 乡村教师技能培训不符合要求
  suspicion: 城区学校教师挤占乡村教师培训名额
  regulation: "[\n  {\n    \"法规名称\": \"教育部关于深化中小学教师培训模式改革全面提升培训质量的指导意见\",\n    \"法规文号\": \"教师〔2013〕6号\",\n    \"效力级别\": \"\
