name: audit/审查报告类/财务报告
type: model
description: 从审查报告类类文档（财务报告）中提取结构化元数据。涵盖字段如：实际分配用于保障房金额、当年增值收益总额、按规定可用于保障房金额、是否启动退出机制、管理费用、项目累计收益/亏损。文档范围包括：住房公积金年度财务报告、投资项目财务报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 财务报告
  member_count: 1
  member_details:
  - 住房公积金年度财务报告
  - 投资项目财务报告
output:
  fields:
  - name: 实际分配用于保障房金额
    type: number
    description: 提取 实际分配用于保障房金额 的数值（含单位，如万元、吨等）
  - name: 当年增值收益总额
    type: number
    description: 提取 当年增值收益总额 的数值（含单位，如万元、吨等）
  - name: 按规定可用于保障房金额
    type: number
    description: 提取 按规定可用于保障房金额 的数值（含单位，如万元、吨等）
  - name: 是否启动退出机制
    type: boolean
    description: 提取 是否启动退出机制 的布尔值（是/否）
  - name: 管理费用
    type: number
    description: 提取 管理费用 的数值（含单位，如万元、吨等）
  - name: 项目累计收益-亏损
    type: string
    description: 提取 项目累计收益-亏损 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (财务报告.实际分配用于保障房金额) < (财务报告.当年增值收益总额 - MAX(财务报告.提取贷款风险准备金金额, 财务报告.当年增值收益总额*0.6) - 财务报告.管理费用) || ( (财务报告.提取贷款风险准备金金额
    / 财务报告.当年增值收益总额) > 0.6 AND 无合规审批文件 )
  description: 根据规定，增值收益扣除贷款风险准备金（通常不超过增值收益的60%）和管理费用后，余额应全部用于保障房。表达式第一部分判别实际安排金额是否低于可安排金额；第二部分单独警示风险准备金超额提取导致可安排资金被压减。若地方规定风险准备金上限比例不同，替换0.6。
  audit_item: 财政部门未按规定足额安排保障性安居工程资金
  suspicion: 未按规定安排住房公积金增值收益用于保障房
  regulation: "[\n  {\n    \"法规名称\": \"《住房公积金管理条例》\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"住房公积金的增值收益应当用于建立住房公积金贷款风险准备金、住房公积金管理中心的管理费用和建设城市廉租住房的补充资金。\"\n  }\n]"
