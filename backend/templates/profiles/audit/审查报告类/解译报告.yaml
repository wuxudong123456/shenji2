name: audit/审查报告类/解译报告
type: model
description: 从审查报告类类文档（解译报告）中提取结构化元数据。涵盖字段如：NDVI时序曲线、侵蚀沟分布、变化类型、实际占地图斑与审批红线比对差异、植被覆盖度变化率。文档范围包括：卫星遥感监测解译报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 审批
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 解译报告
  member_count: 1
  member_details:
  - 卫星遥感监测解译报告
output:
  fields:
  - name: NDVI时序曲线
    type: string
    description: 提取 NDVI时序曲线 的文本值
  - name: 侵蚀沟分布
    type: string
    description: 提取 侵蚀沟分布 的文本值
  - name: 变化类型
    type: string
    description: 提取 变化类型 的文本值
  - name: 实际占地图斑与审批红线比对差异
    type: string
    description: 提取 实际占地图斑与审批红线比对差异 的文本值
  - name: 植被覆盖度变化率
    type: string
    description: 提取 植被覆盖度变化率 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
