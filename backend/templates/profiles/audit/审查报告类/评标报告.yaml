name: audit/审查报告类/评标报告
type: model
description: 从审查报告类类文档（评标报告）中提取结构化元数据。涵盖字段如：中标候选人名单、否决原因、多轮报价、定标日期、所有投标被否决的结论、技术得分、招标方式、排序。文档范围包括：评标委员会评标报告、评标报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 招投标
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 评标报告
  member_count: 1
  member_details:
  - 评标委员会评标报告
  - 评标报告
output:
  fields:
  - name: 中标候选人名单
    type: string
    description: 提取 中标候选人名单 的文本值
  - name: 否决原因
    type: string
    description: 提取 否决原因 的文本值
  - name: 多轮报价
    type: string
    description: 提取 多轮报价 的文本值
  - name: 定标日期
    type: date
    description: 提取 定标日期 的日期值，格式 YYYY-MM-DD
  - name: 所有投标被否决的结论
    type: string
    description: 提取 所有投标被否决的结论 的文本值
  - name: 技术得分
    type: string
    description: 提取 技术得分 的文本值
  - name: 招标方式
    type: string
    description: 提取 招标方式 的文本值
  - name: 排序
    type: string
    description: 提取 排序 的文本值
  - name: 推荐中标候选人名单及排名
    type: string
    description: 提取 推荐中标候选人名单及排名 的文本值
  - name: 推荐中标候选人名称
    type: string
    description: 提取 推荐中标候选人名称 的文本值
  - name: 推荐意见
    type: string
    description: 提取 推荐意见 的文本值
  - name: 澄清说明记录
    type: string
    description: 提取 澄清说明记录 的文本值
  - name: 结论
    type: string
    description: 提取 结论 的文本值
  - name: 谈判过程记录
    type: string
    description: 提取 谈判过程记录 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 通知书.中标人名称 NOT IN (评标报告.中标候选人名单)
  description: 通过比对确定的中标人是否存在于评标委员会依法推荐并公示的中标候选人名单中。若中标人不在该名单内，则判定为违规，触发4.8.1情形。
  audit_item: 招标人违法确定中标人
  suspicion: 招标人在评标委员会推荐的中标候选人以外确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十七条\",\n    \"内容概述\": \"招标人在评标委员会依法推荐的中标候选人以外确定中标人的，中标无效；责令改正，可以处中标项目金额千分之五以上千分之十以下的罚款。\"\n  }\n]"
- expression: 评标报告.结论（是否否决所有投标） == '否决所有投标' && 中标通知书.中标人名称 IS NOT NULL && 记录表.重新招标审批文件编号 == false
  description: 当评标委员会依法否决所有投标后，招标人必须重新招标。若存在中标通知书（即招标人自行确定了中标人）且无合规的重新招标审批文件，则判定违规，对应4.8.2情形。
  audit_item: 招标人违法确定中标人
  suspicion: 招标项目在所有投标被否决后自行确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十七条\",\n    \"内容概述\": \"依法必须进行招标的项目在所有投标被评标委员会否决后自行确定中标人的，中标无效；责令改正，可以处中标项目金额千分之五以上千分之十以下的罚款。\"\n  }\n]"
- expression: (技术方案变动.技术方案变动 == 是) && (变更前后技术参数.变更前后技术参数 != 招标文件技术规格要求) && (评标报告.技术得分 > 0) && (评标报告.澄清说明记录 == 无)
  description: 评标期间指投标截止后至中标通知书发出前；投标人提交了新版投标文件，技术参数发生实质性变更，导致技术得分提高，且评标报告中无正式的澄清记录，视为招标人默许的实质性谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人默许投标人评标后修改技术方案
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n \
    \   \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十二条\",\n    \"内容概述\": \"评标委员会要求投标人澄清的，澄清不得超出投标文件的范围或者改变投标"
- expression: (采购方式.采购方式 == 竞争性谈判) && (采购方式.项目预算 >= 公开招标限额标准) && (谈判轮次.谈判轮次 >= 2) && (谈判轮次.服务范围变更 == 是)
  description: 公开招标限额标准依据现行法规（如政府采购限额标准）；项目预算达到标准但未公开招标，采用竞争性谈判方式，且谈判中要求投标人多轮调整价格或服务内容，属于规避公开招标并实质性谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 利用多轮报价变相进行实质性谈判
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\"\
    ,\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容"
- expression: 通知书.中标人名称 NOT IN (评标报告.推荐中标候选人名称) && 评标报告.排序 >= 1
  description: 当中标人不在评标委员会依法推荐的任何中标候选人名单中时触发违规。该表达式直接比对中标通知书与评标报告的核心字段，忽略候选人排序，只要不在名单内即构成违规，前提是存在有效推荐的候选人。
  audit_item: 招标人违法确定中标人
  suspicion: 招标人在推荐中标候选人外确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十条\",\n    \"内容概述\": \"招标人根据评标委员会提出的书面评标报告和推荐的中标候选人确定中标人。招标人也可以授权评标委员会直接确定中标人。\"\n  }\n]"
- expression: 否决投标人名称、否决原因、被否决投标人数量.被否决投标人数量 = 招标文件.投标人数量要求 && 中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中标日期、评标委员会名单、中标通知书发出时间、中标人、中标联合体成员及分工、联合体协议条款.中标人名称
    IS NOT NULL
  description: 当评标委员会否决所有投标后，该项目不应产生任何中标通知书。若存在中标通知书或已签订合同，即表明招标人在未依法重新招标的情况下直接确定了中标人，构成违规。
  audit_item: 招标人违法确定中标人
  suspicion: 所有投标被否决后自行确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十二条\",\n    \"内容概述\": \"评标委员会经评审，认为所有投标都不符合招标文件要求的，可以否决所有投标。依法必须进行招标的项目的所有投标被否决的，招标人应当依照本法重新招标。\"\n  }\n]"
- expression: ( (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='施工' && 估算价>=4000000) || (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='货物'
    && 估算价>=2000000) || (批复文件.资金来源性质 IN ('财政拨款','国有资金') && 项目类型='服务' && 估算价>=1000000) ) && (公告.公告类型（公开/邀请） != '公开招标') && (变更申请记录
    IS NULL || 变更申请记录.批复意见 != '同意' || 变更申请记录.批复日期 > 公告.发布日期)
  description: 依据资金来源性质与估算价判定项目是否属于依法必须公开招标范畴，同时排除实际招标方式为非公开，且无合法审批变更手续的情形。若变更批复缺失、批复意见不明确或批复时间晚于招标活动开始，均视为违规。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 未经批准擅自将公开招标变更为邀请招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n  \
    \  \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"国有资金占控股或者主导地位的依法必须进行招标的项目，应当公开招标；除技术"
