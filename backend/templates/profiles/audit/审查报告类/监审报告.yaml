name: audit/审查报告类/监审报告
type: model
description: 从审查报告类类文档（监审报告）中提取结构化元数据。涵盖字段如：最近一次监审完成日期、监审周期。文档范围包括：监审报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 监审报告
  member_count: 1
  member_details:
  - 监审报告
output:
  fields:
  - name: 最近一次监审完成日期
    type: date
    description: 提取 最近一次监审完成日期 的日期值，格式 YYYY-MM-DD
  - name: 监审周期
    type: string
    description: 提取 监审周期 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: DATEDIFF(CURRENT_DATE, 监审报告.最近一次监审完成日期) > 3*365
  description: 距离最近一次成本监审报告出具日期已超过3年，未按照要求及时开展监审工作。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 未按规定周期开展农业水价成本监审
  regulation: "[\n  {\n    \"法规名称\": \"关于建立健全农业水价形成机制的指导意见\",\n    \"法规文号\": \"发改价格〔2017〕2272号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"二、建立健全农业水价形成机制（二）\",\n    \"内容概述\": \"各地要及时开展农业供水成本监审，成本监审原则上每3年进行一次。坚决防止成本不实、虚假算账等问题。\"\n  }\n]"
