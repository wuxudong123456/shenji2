name: audit/审查报告类/信用报告
type: model
description: 从审查报告类类文档（信用报告）中提取结构化元数据。涵盖字段如：客户财务状况、破产公告。文档范围包括：客户信用报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 信用报告
  member_count: 1
  member_details:
  - 客户信用报告
output:
  fields:
  - name: 客户财务状况
    type: string
    description: 提取 客户财务状况 的文本值
  - name: 破产公告
    type: string
    description: 提取 破产公告 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (信用报告.破产公告 = '破产' && 计提表.实际计提比例 < 0.95) || (计提表.实际计提比例 < 政策.预期信用损失率)
  description: 对已破产客户未100%计提坏账，或组合计提比例低于企业自身制定的预期信用损失率，均属计提不足。
  audit_item: 未按规定核算资产
  suspicion: 坏账准备计提严重不足
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\": \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四十六条至第四十八条\",\n    \"内容概述\": \"企业应采用预期信用损失模型对金融资产计提减值准备，合理反映信用风险。\"\n  }\n]"
