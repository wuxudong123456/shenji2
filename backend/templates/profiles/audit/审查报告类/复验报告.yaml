name: audit/审查报告类/复验报告
type: model
description: 从审查报告类类文档（复验报告）中提取结构化元数据。涵盖字段如：委托日期、报告出具日期、检测参数、检测结论。文档范围包括：材料复验报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 复验报告
  member_count: 1
  member_details:
  - 材料复验报告
output:
  fields:
  - name: 委托日期
    type: date
    description: 提取 委托日期 的日期值，格式 YYYY-MM-DD
  - name: 报告出具日期
    type: date
    description: 提取 报告出具日期 的日期值，格式 YYYY-MM-DD
  - name: 检测参数
    type: string
    description: 提取 检测参数 的文本值
  - name: 检测结论
    type: string
    description: 提取 检测结论 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (材料进场台账.进场日期 不为空) && (材料复验报告.报告出具日期 为空 || 材料复验报告.报告出具日期 > 施工日志.使用日期 || 材料复验报告.检测结论 == '不合格') && (材料报验单.监理审核签字
    存在)
  description: 材料已进场且有使用记录，但未见对应的合格复验报告，或复验报告出具日期晚于材料使用日期，或复验结论为不合格但仍通过报验并投入使用，均属于违规。监理审核签字存在说明流程形式上走完，实质审核缺失。
  audit_item: 工程质量事故调查
  suspicion: 主要建筑材料未经检验投入使用
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十九条\",\n    \"内容概述\": \"施工单位必须按照工程设计要求、施工技术标准和合同约定，对建筑材料、建筑构配件、设备和商品混凝土进行检验，检验应当有书面记录和专人签字；未经检验或者检验不合格的，不得使用。\"\n\
    \  }\n]"
