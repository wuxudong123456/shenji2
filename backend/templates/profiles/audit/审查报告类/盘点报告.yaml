name: audit/审查报告类/盘点报告
type: model
description: 从审查报告类类文档（盘点报告）中提取结构化元数据。涵盖字段如：存放地点差异、存货名称、实盘数量、物料编码、盘点日期、盘点状态、资产盘点日期。文档范围包括：固定资产盘点报告、国有资产盘点报告、存货盘点报告、盘点报告、资产盘点报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 资产
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 盘点报告
  member_count: 1
  member_details:
  - 固定资产盘点报告
  - 国有资产盘点报告
  - 存货盘点报告
  - 盘点报告
  - 资产盘点报告
output:
  fields:
  - name: 存放地点差异
    type: string
    description: 提取 存放地点差异 的文本值
  - name: 存货名称
    type: string
    description: 提取 存货名称 的文本值
  - name: 实盘数量
    type: number
    description: 提取 实盘数量 的数值（含单位，如万元、吨等）
  - name: 物料编码
    type: string
    description: 提取 物料编码 的文本值
  - name: 盘点日期
    type: date
    description: 提取 盘点日期 的日期值，格式 YYYY-MM-DD
  - name: 盘点状态
    type: boolean
    description: 提取 盘点状态 的布尔值（是/否）
  - name: 资产盘点日期
    type: date
    description: 提取 资产盘点日期 的日期值，格式 YYYY-MM-DD
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: ABS(存货名称、账面结存数量.账面结存数量 - 盘点日期.实盘数量) > 0
  description: 当台账记录的账面结存数量与盘点报告中的实盘数量不一致时，排除经审批的合理处置或自然损耗后，差异即为疑点。差异额不为零即触发。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 存货账面数量与实际盘点数量不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证会计账簿记录与实物及款项的实有数额相符。\"\n  }\n]"
- expression: 资产清单.闲置时长(天) > 365 && 资产盘点日期.闲置原因分析 IN ('无明确处置计划', '未启动报废流程', '无调剂需求')
  description: 判定逻辑：资产最新状态标记为闲置，且闲置时间超过1年（365天），同时单位未给出合理的处置、报废或调剂方案，认定构成管理失职造成闲置浪费。
  audit_item: 违规使用国有资产
  suspicion: 国有资产长期闲置未处置
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十三条\",\n    \"内容概述\": \"各部门及其所属单位应当对闲置资产进行调剂使用，确实无法调剂的，应当依法采取拍卖等方式处置。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范和加强行政事业单位国有资产管理的指导意见\"\
    ,\n    \"法规文号\": \"财资〔2015〕90号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第三点\",\n    \"内容概述\": \"强化资产使用管理，严"
- expression: (明细账.期末数量 - 盘点报告.实盘数量) > (盘点报告.实盘数量 * 0.1)
  description: 账面期末数量超过实际盘点数量10%且无合理理由，或账上同一批次存货在多个仓位重复记载，疑为虚增。
  audit_item: 未按规定核算资产
  suspicion: 重复计算存货虚增库存
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第81号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"公司、企业进行会计核算不得虚列、多列、不列或者少列资产。\"\n  }\n]"
- expression: (资产台账.使用状态 = '闲置' || 闲置资产明细表.闲置时长 >= 365) && (资产使用效率分析表.年使用天数 <= 30 || 资产使用效率分析表.利用率 < 0.05) && (闲置资产专项报告.闲置原因分析不包含'不可抗力'
    && 历史问题整改报告.闲置问题整改状态 = '未整改')
  description: 判定闲置资产并排除不可抗力等合理原因，同时满足连续闲置超过1年、年使用天数低于30天或利用率低于5%的条件，且未被有效整改的，视为严重违规闲置。
  audit_item: 资产管理方面存在的问题
  suspicion: 购置或建成资产长期闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十六条\",\n    \"内容概述\": \"国家出资企业投资应当符合国家产业政策，并按照国家规定进行可行性研究；与他人交易应当公平、有偿，取得合理对价。\"\n  }\n]"
