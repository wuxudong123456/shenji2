name: audit/审查报告类/成果报告
type: model
description: 从审查报告类类文档（成果报告）中提取结构化元数据。涵盖字段如：停留天数、出访国家/城市、合作单位列表、地点、实际活动内容、资源对外提供总数量。文档范围包括：因公出国（境）任务成果报告、种质资源开发利用成果报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 成果报告
  member_count: 1
  member_details:
  - 因公出国（境）任务成果报告
  - 种质资源开发利用成果报告
output:
  fields:
  - name: 停留天数
    type: number
    description: 提取 停留天数 的数值（含单位，如万元、吨等）
  - name: 出访国家-城市
    type: string
    description: 提取 出访国家-城市 的文本值
  - name: 合作单位列表
    type: string
    description: 提取 合作单位列表 的文本值
  - name: 地点
    type: string
    description: 提取 地点 的文本值
  - name: 实际活动内容
    type: string
    description: 提取 实际活动内容 的文本值
  - name: 资源对外提供总数量
    type: number
    description: 提取 资源对外提供总数量 的数值（含单位，如万元、吨等）
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (登记表.审批状态（批准/驳回/待批） == '驳回' && 登记表.驳回原因 NOT IN ('生物安全风险', '资源依赖性', '知识产权争议')) || (成果报告.资源对外提供总数量 / 开发利用成果报告.库存总量
    < 0.05) && (统计表.年度访问量 < 1000)
  description: 判定规则：一是共享审批环节，若资源申请被驳回，但驳回原因模糊或并非基于生物安全、知识产权等法定合理事由，则涉嫌人为设置共享障碍。二是如果年度对外提供资源的比例低于库存总量的5%，且信息系统公开查询量极低（如年访问量低于1000），说明资源主要处于沉睡状态，未有效发挥公共服务功能。两种情形任意满足其一，均视为开发利用不足、开放共享少。
  audit_item: 种质资源保护利用方面不符合相关规定
  suspicion: 种质资源信息共享机制运行不畅
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国种子法》\",\n    \"法规文号\": \"中华人民共和国主席令第35号（2021年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第十二条\",\n    \"内容概述\": \"国家建立种质资源共享利用平台，依法公开种质资源信息……鼓励种质资源保护单位开放资源，供科研、育种等公益性和商业性活动利用。\"\n  },\n  {\n\
    \    \"法规名称\": \"《政务信息资源共享管理暂行办法》\",\n    \"法规文号\": \"国发〔2016〕51号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n\
    \    \"内容概"
