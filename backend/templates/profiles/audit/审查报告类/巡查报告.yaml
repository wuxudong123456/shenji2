name: audit/审查报告类/巡查报告
type: model
description: 从审查报告类类文档（巡查报告）中提取结构化元数据。涵盖字段如：疑似违法占用耕地图斑坐标、面积。文档范围包括：耕地保护专项巡查报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 巡查报告
  member_count: 1
  member_details:
  - 耕地保护专项巡查报告
output:
  fields:
  - name: 疑似违法占用耕地图斑坐标
    type: string
    description: 提取 疑似违法占用耕地图斑坐标 的文本值
  - name: 面积
    type: string
    description: 提取 面积 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (记录表.土地初始性质 == '基本农田') && (记录表.变更审批文号 IS NULL) || (平衡台账.补充耕地质量等别 < 平衡台账.占用耕地质量等别)
  description: 当帮扶产业园区的用地在变更前的地类为永久基本农田，且系统内无合法的农转用和基本农田补划审批文号时，判定为“违占”。或者，即便有审批手续，用于占补平衡的新增耕地在自然质量等别上低于被占用的优质良田，视为“占优补劣”的违规行为。
  audit_item: 帮扶产业配套支持政策不够精准有效
  suspicion: 帮扶产业园违规占用永久基本农田
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十五条、第三十七条\"\
    ,\n    \"内容概述\": \"永久基本农田经依法划定后，任何单位和个人不得擅自占用或者改变其用途。国家能源、交通、水利、军事设施等重点建设项目选址确实难以避让永久基本农田，必须经国务院批准。禁止占用耕地建窑、建坟或者擅自在耕地上建房。\"\
    \n  }\n]"
