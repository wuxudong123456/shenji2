name: audit/审查报告类/进度报告
type: model
description: 从审查报告类类文档（进度报告）中提取结构化元数据。涵盖字段如：上报处置状态、停滞原因、合同工程完工日期、完成标志、实际完工日期、实际完工百分比、实际完成工程量、实际施工日期。文档范围包括：处置进度报告、工程进度报告、项目进度报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 决算
- 合同
- 工程
- 项目
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 进度报告
  member_count: 1
  member_details:
  - 处置进度报告
  - 工程进度报告
  - 项目进度报告
output:
  fields:
  - name: 上报处置状态
    type: boolean
    description: 提取 上报处置状态 的布尔值（是/否）
  - name: 停滞原因
    type: string
    description: 提取 停滞原因 的文本值
  - name: 合同工程完工日期
    type: date
    description: 提取 合同工程完工日期 的日期值，格式 YYYY-MM-DD
  - name: 完成标志
    type: boolean
    description: 提取 完成标志 的布尔值（是/否）
  - name: 实际完工日期
    type: date
    description: 提取 实际完工日期 的日期值，格式 YYYY-MM-DD
  - name: 实际完工百分比
    type: string
    description: 提取 实际完工百分比 的文本值
  - name: 实际完成工程量
    type: string
    description: 提取 实际完成工程量 的文本值
  - name: 实际施工日期
    type: date
    description: 提取 实际施工日期 的日期值，格式 YYYY-MM-DD
  - name: 开工日期
    type: date
    description: 提取 开工日期 的日期值，格式 YYYY-MM-DD
  - name: 施工进度描述
    type: string
    description: 提取 施工进度描述 的文本值
  - name: 暂停期间
    type: string
    description: 提取 暂停期间 的文本值
  - name: 竣工决算日期
    type: date
    description: 提取 竣工决算日期 的日期值，格式 YYYY-MM-DD
  - name: 项目完工百分比
    type: string
    description: 提取 项目完工百分比 的文本值
  - name: 项目当前状态
    type: boolean
    description: 提取 项目当前状态 的布尔值（是/否）
  - name: 预计完工时间
    type: date
    description: 提取 预计完工时间 的日期值，格式 YYYY-MM-DD
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (支付凭证.摘要 LIKE '%拨付%' OR 支付凭证.摘要 LIKE '%转拨%' OR 支付凭证.经济分类科目 IN ('转移性支出','对附属单位补助支出')) AND 支付凭证.支付日期 BETWEEN '当年-11-01'
    AND '当年-12-31' AND (项目进度报告 IS NULL OR 项目进度报告.完工百分比 < 50%) AND (收款方银行流水.资金转出日期 IS NULL OR DATEDIFF(收款方银行流水.资金转出日期, 收款方银行流水.收款日期)
    > 30)
  description: 年末支付凭证中支付摘要出现拨付类字样或经济分类为转移性支出，收款项目对应的实际完工进度不足50%或缺乏验收材料，且资金在收款方账户停留超过30天未实际使用，构成以拨作支。若项目进度报告缺失，直接判定为高风险。
  audit_item: 预算执行率不真实
  suspicion: 以拨作支虚列预算支出
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当对预算支出情况开展绩效评价，不得虚列支出。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\"\
    : \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员违反规定以虚报、冒领等手段骗取财政资金，或者违反规定挪用、截"
- expression: (财政授权支付明细表.累计支付金额/合同总金额) > (项目进度报告.实际完工百分比 + 0.1) AND 项目进度报告.实际完工百分比 < 90%
  description: 当累计支付比例超过项目实际完工比例10个百分点以上，且项目尚未竣工（完工<90%）时，判定为超进度付款。偏差10%以内为预警，超过20%为严重违规。须同时排除合同约定有合理预付款条款的情况。
  audit_item: 预算执行率不真实
  suspicion: 未按项目进度提前支付合同款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"各部门、各单位应当加强对预算支出的管理，严格按照预算规定的支出用途使用资金，按照项目进度和合同约定拨付资金。\"\n  },\n  {\n    \"法规名称\": \"基本建设财务规则\"\
    ,\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"项目建设单位应当严格按照合同约定和工程价"
- expression: (企业名称、利润总额、经营现金流、资产负债率.利润总额 < 0 && 企业名称、利润总额、经营现金流、资产负债率.经营现金流 < 0 && 企业名称、利润总额、经营现金流、资产负债率.资产负债率 > 85%) &&
    (上报处置状态、完成标志.上报处置状态 == '已完成' && 注销登记日期、法院受理文号.不存在) || (上报处置状态、完成标志.上报收入 != 实际收入、纳税情况.实际收入 && ABS(差异率) > 10%)
  description: 企业满足僵尸标准但未完成法定处置程序即上报已完成，或通过虚增收入粉饰为“非僵尸”企业，均属弄虚作假。收入差异率超过10%即为明显异常。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
  suspicion: 僵尸企业处置弄虚作假或推进不力
  regulation: "[\n  {\n    \"法规名称\": \"中央企业处置“僵尸企业”工作指引\",\n    \"法规文号\": \"国资发财管〔2016〕285号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"严禁虚报处置进度，不得通过违规融资、虚增收入等方式将僵尸企业“脱僵”，应依法依规通过关闭撤销、破产清算、兼并重组等方式实现市场出清。\"\n  }\n]"
- expression: (资本化金额计算过程.资本化开始/暂停/停止日期 < 借款合同.签订日期) || (资本化金额计算过程.资本化开始/暂停/停止日期 > 进度报告.竣工决算日期) || (资本化金额 > (专门借款当期实际利息额 -
    暂时闲置资金投资收益) 且 超出部分无合理解释)
  description: 资本化开始晚于提款或存在暂停资本化条件未暂停，结束晚于竣工验收，或金额计算不准确，均属错误。
  audit_item: 未按规定确认成本费用
  suspicion: 固定资产借款费用资本化期间或金额错误
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第17号——借款费用\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条、第六条、第十二条\",\n    \"内容概述\": \"借款费用只有同时满足资产支出已经发生、借款费用已经发生、为使资产达到预定可使用状态所必要的购建活动已经开始才能资本化；购建发生非正常中断连续超过3个月应暂停资本化；达到预定可使用状态时停止资本化。\"\
    \n  }\n]"
- expression: (方案提交日期.规划任务清单及计划完工日期 < 当前审计日期) && (进度报告.实际完成工程量 < 规划工程量 * 0.95) && (明细表.对应任务的资金支付进度 < 80%)
  description: 筛选出计划完工日期早于审计时点的任务，若实际完成工程量不足规划的95%（考虑一定量差），且相应的建设资金支付进度低于80%，表明任务实质性未完成且大额资金未拨付或已挪用。三个条件须同时满足，以排除少量扫尾工程未完工但资金已基本拨付的情况。
  audit_item: 大中型灌区规划、建设不符合相关规定
  suspicion: 规划内建设改造任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照国家有关规定和投资主管部门或者其他有关部门批准的规模、标准等组织建设，确保项目按期建成。\"\n  }\n]"
- expression: (进度报告.实际竣工验收日期 - 进度报告.合同工程完工日期) > 投标文件.合同约定的验收期限
  description: 将竣工验收日期与项目进度报告中或监理确认的工程完工日期相减，计算实际拖延时长。若该时长超过施工合同中约定的（如1年内）应组织验收期限，即构成违规。差值为正数即为逾期天数。
  audit_item: 大中型灌区规划、建设不符合相关规定
  suspicion: 工程完工后长期未组织验收
  regulation: "[\n  {\n    \"法规名称\": \"水利工程建设项目验收管理规定\",\n    \"法规文号\": \"水利部令第30号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十六条\",\n    \"内容概述\": \"项目法人应当自工程完工之日起一定期限内完成竣工验收。具体期限由项目投资计划或合同确定。\"\n  }\n]"
- expression: (专项资金结余结转明细表（按年度分类）.累计结转年限 >= 2 && 项目进度报告.项目当前状态 == '停滞' || 项目进度报告.项目当前状态 == '完工' ) && 专项资金结余结转情况说明.未使用原因说明.不包含('客观不可抗力')
    && 历年审计报告.同类问题历史记录 != ''
  description: 该表达式识别连续结转两年以上且无客观合理原因的闲置资金。触发条件为：资金累计结转年限达到或超过2年，且对应项目状态为停滞或已完工（项目需求已消失）；同时，资金未使用的原因说明中排除了征地、自然灾害等客观不可抗力因素。若该单位历年审计曾发现过同类问题，则风险升级，说明存在屡审屡犯的管理漏洞。
  audit_item: 专项资金长期闲置未发挥效益
  suspicion: 专项资金结转两年以上未使用形成闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十条\",\n    \"内容概述\": \"部门预算支出结余以及预算安排的规定年限内尚未使用的项目资金，由同级财政在编制下一年度预算时，按照用款单位上一年度预算结余的一定比例，收回总预算统筹安排，具体办法由财政部规定。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步加强地方财政结余结转资金管理的通知\",\n    \"法规文号\": \"财预〔2013〕372号\",\n    \"效力级别\": \"部门规章\",\n   "
- expression: 土地出让合同或划拨决定书.约定动工日期 IS NOT NULL AND (施工许可证.发证日期 IS NULL OR DATEDIFF(施工许可证.发证日期, 土地出让合同或划拨决定书.约定动工日期) > 365)
    AND 土地利用现状统计表.地块状态 = '闲置'
  description: 认定规则：国有建设用地使用权人超过有偿使用合同或划拨决定书约定的动工开发日期满一年未动工开发，即视为闲置土地。表达式校验：从土地出让合同中提取约定动工日期，若未取得施工许可证或施工许可证发证日期滞后约定动工日期超过365天，且土地利用现状统计表中地块被标记为闲置状态，则判定为违规闲置。
  audit_item: 保障性安居工程项目土地闲置
  suspicion: 保障性安居工程项目土地闲置
  regulation: "[\n  {\n    \"法规名称\": \"闲置土地处置办法\",\n    \"法规文号\": \"国土资源部令第53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二条\",\n    \"内容概述\": \"本办法所称闲置土地，是指国有建设用地使用权人超过国有建设用地使用权有偿使用合同或者划拨决定书约定、规定的动工开发日期满一年未动工开发的国有建设用地。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第三十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十八条\",\n    \"\
    内容概述\":"
