name: audit/审查报告类/报告
type: model
description: 从审查报告类类文档（报告）中提取结构化元数据。涵盖字段如：主要偏离指标、偏差率。文档范围包括：历年项目验收与规划符合性报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 报告
  member_count: 1
  member_details:
  - 历年项目验收与规划符合性报告
output:
  fields:
  - name: 主要偏离指标
    type: string
    description: 提取 主要偏离指标 的文本值
  - name: 偏差率
    type: string
    description: 提取 偏差率 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (项目实施方案与规划对比分析报告.偏差率 > 15%) || (历年项目验收与规划符合性报告.偏差率 > 15%) || (建设资金流向与规划匹配表.非重点区域投资金额 / 总投资金额 > 30%)
  description: 当实际建设内容与规划要求的偏差率超过15%（如集中连片比例、节水灌溉覆盖率等），或资金投向非规划重点区域的比例超过30%时，判定为规划与建设脱节；阈值可根据地方管理细则调整。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 高标准农田规划与项目建设内容严重不符
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"农田建设项目应当按照批准的初步设计组织实施，涉及建设地点、建设内容、建设规模等重大变更，须按程序报原审批机关批准，不得擅自调整。\"\n  }\n]"
