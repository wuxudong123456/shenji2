name: audit/审查报告类/自评报告
type: model
description: 从审查报告类类文档（自评报告）中提取结构化元数据。涵盖字段如：上报完成面积、单位盖章、受益人数、填报人签字、差异说明、已完成改革灌区清单、报告内容要素、报告文号。文档范围包括：产业园年度工作自评报告、服务组织年度总结报告或自评报告、绩效自评报告、绩效评价自评报告、项目绩效自评报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 审批
- 金额
- 项目
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 自评报告
  member_count: 1
  member_details:
  - 产业园年度工作自评报告
  - 服务组织年度总结报告或自评报告
  - 绩效自评报告
  - 绩效评价自评报告
  - 项目绩效自评报告
output:
  fields:
  - name: 上报完成面积
    type: string
    description: 提取 上报完成面积 的文本值
  - name: 单位盖章
    type: string
    description: 提取 单位盖章 的文本值
  - name: 受益人数
    type: number
    description: 提取 受益人数 的数值（含单位，如万元、吨等）
  - name: 填报人签字
    type: string
    description: 提取 填报人签字 的文本值
  - name: 差异说明
    type: string
    description: 提取 差异说明 的文本值
  - name: 已完成改革灌区清单
    type: string
    description: 提取 已完成改革灌区清单 的文本值
  - name: 报告内容要素
    type: string
    description: 提取 报告内容要素 的文本值
  - name: 报告类型
    type: string
    description: 提取 报告类型 的文本值
  - name: 提交日期
    type: date
    description: 提取 提交日期 的日期值，格式 YYYY-MM-DD
  - name: 新建设施坐标范围
    type: string
    description: 提取 新建设施坐标范围 的文本值
  - name: 服务收入
    type: number
    description: 提取 服务收入 的数值（含单位，如万元、吨等）
  - name: 服务面积
    type: string
    description: 提取 服务面积 的文本值
  - name: 格式规范性
    type: string
    description: 提取 格式规范性 的文本值
  - name: 满意度评分
    type: string
    description: 提取 满意度评分 的文本值
  - name: 申报产量
    type: string
    description: 提取 申报产量 的文本值
  - name: 申报面积
    type: string
    description: 提取 申报面积 的文本值
  - name: 绩效指标评分
    type: string
    description: 提取 绩效指标评分 的文本值
  - name: 自报服务量
    type: string
    description: 提取 自报服务量 的文本值
  - name: 自评完成产值
    type: string
    description: 提取 自评完成产值 的文本值
  - name: 自评完成数量与比率
    type: number
    description: 提取 自评完成数量与比率 的数值（含单位，如万元、吨等）
  - name: 自评完成率
    type: string
    description: 提取 自评完成率 的文本值
  - name: 自评日期
    type: date
    description: 提取 自评日期 的日期值，格式 YYYY-MM-DD
  - name: 节水效益数据
    type: string
    description: 提取 节水效益数据 的文本值
  - name: 评价状态
    type: boolean
    description: 提取 评价状态 的布尔值（是/否）
  - name: 负责人审批签字
    type: string
    description: 提取 负责人审批签字 的文本值
  - name: 资金拨付金额
    type: number
    description: 提取 资金拨付金额 的数值（含单位，如万元、吨等）
  - name: 部门整体绩效指标完成情况
    type: string
    description: 提取 部门整体绩效指标完成情况 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目完成率
    type: string
    description: 提取 项目完成率 的文本值
  - name: 验收结论
    type: string
    description: 提取 验收结论 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (项目绩效指标完成情况统计表.完成率 < 0.8 && 预算执行进度与绩效目标对比表.累计支出金额 / 预算金额 < 0.8) || (ABS(绩效自评报告.自评完成率 - 第三方评价报告.第三方评价完成率) / 绩效自评报告.自评完成率
    > 0.3) || (预算执行进度与绩效目标对比表.实际完成进度 < 预算执行进度与绩效目标对比表.计划完成进度 * 0.7)
  description: 同时满足项目完成率低于80%且资金执行率低于80%判定为目标未完成；或自评完成率与第三方评价完成率偏差超过自评完成率的30%，表明绩效数据失真或实际效果不匹配；或实际进度落后计划进度30%以上且执行率偏低。以上任一条件触发疑点。
  audit_item: 部门、单位预算绩效目标未完成
  suspicion: 预算绩效目标未完成
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价。\"\n  },\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n\
    \    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第七条、第十一条\",\n    \"内容概述\": \"严格绩效目标管理，未按要求设定绩效目标或审核未通过的"
- expression: (年度预算项目清单及自评状态标记表.自评状态 = '未自评' || 年度预算项目清单及自评状态标记表.自评状态 = NULL) && 年度预算项目清单及自评状态标记表.项目金额 > 0 && (未开展自评项目清单及原因说明表.未自评原因
    NOT IN ('制度规定可豁免', '项目未执行', '资金未拨付') || 未开展自评项目清单及原因说明表.项目名称 IS NULL)
  description: 筛选自评状态为空或标记为未自评且有实际资金支出的项目，排除因制度规定可豁免、项目未执行、资金未拨付等合理原因未自评的情况。若未自评项目清单缺失或无正当理由说明，则判定为完全未开展自评违规。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 完全未开展项目绩效自评
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条、第七条\",\n    \"内容概述\": \"各部门、各单位应对所有项目支出开展绩效自评，确保自评全覆盖；绩效自评由项目实施单位负责，对预算批复的项目绩效目标完成情况进行自我评价。\"\n  }\n]"
- expression: (绩效自评报告及支撑材料.绩效目标完成值 IS NULL OR 绩效自评报告及支撑材料.偏差原因分析 IS NULL OR 绩效自评报告及支撑材料.改进措施 IS NULL) && 上级制度文件.内容要求.必须有偏差分析等字段
    = '是'
  description: 比照制度规定的自评报告必须包含的内容要素（如绩效指标完成情况、偏差原因分析、下一步改进措施等），若任一关键字段缺失，即视为报告内容不完整。若报告仅描述资金使用进度而缺少绩效目标完成数据，触发违规。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 自评报告关键要素缺失
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"绩效自评报告应当内容完整、数据真实、结果客观，主要包括绩效目标完成情况、偏离绩效目标的原因、下一步改进措施等内容。\"\n  }\n]"
- expression: 绩效自评报告及支撑材料.负责人审批签字 IS NULL OR 绩效自评报告及支撑材料.单位盖章 IS NULL OR (绩效自评工作相关会议纪要.自评报告审议记录 IS NULL AND 内部管理制度.需经会议审议
    = '是') OR 绩效自评报告及支撑材料.提交日期 > 制度文件.规定的截止日期
  description: 检查自评报告是否缺少必须的签字、盖章，是否未经规定审议程序直接上报，以及是否超过制度规定的提交时限。任一条件触发即判定程序不合规。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 绩效自评内部程序不合规
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"各部门、各单位应当对绩效自评结果的真实性、准确性负责，并按照要求将绩效自评报告报送同级财政部门备案，必要时可组织专家审核。\"\n  },\n  {\n    \"法规名称\":\
    \ \"关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三部分第（八）项\",\n    \"内容概述\"\
    : \"各"
- expression: 年度预算项目清单及自评状态标记表.自评状态 = '未自评' && 年度预算项目清单及自评状态标记表.项目金额 > 0 && 年度预决算报表.实际支出金额 > 0 && 年度预算项目清单及自评状态标记表.项目名称 NOT
    IN (SELECT 项目名称 FROM 绩效自评报告及支撑材料) && (绩效自评覆盖率统计表.项目数量覆盖率 < 100% || 绩效自评覆盖率统计表.金额覆盖率 < 100%)
  description: 将预算项目清单与自评报告项目清单进行比对，找出有实际支出但未自评的项目，并计算项目数量和金额覆盖率。当覆盖率未达到100%且无制度豁免时，即存在选择性自评。重点关注金额大、问题多的项目被故意遗漏的情形。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 选择性开展绩效自评
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"各部门、各单位应对所有项目支出实施绩效自评，确保自评全覆盖。\"\n  },\n  {\n    \"法规名称\": \"关于贯彻落实《中共中央 国务院关于全面实施预算绩效管理的意见》的通知\"\
    ,\n    \"法规文号\": \"财预〔2018〕167号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二部分第（三）项\",\n    \"内容概述\": \"硬化绩效责任约束，部门整"
- expression: (年度预决算报表.资金来源类别 = '中央转移支付' OR 年度预决算报表.资金来源类别 = '省级专项补助') && 年度预决算报表.支出金额 > 0 && 年度预决算报表.项目名称 NOT IN (SELECT
    项目名称 FROM 绩效自评报告及支撑材料) && 上级转移支付指标文件.要求自评 = '是'
  description: 筛选资金来源为上级转移支付且已形成支出的项目，检查其是否包含在自评报告项目清单中。若上级资金管理办法明确要求自评而单位未对其自评，则构成违规。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 未对转移支付资金开展绩效自评
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"地方各级财政部门应当会同有关部门对本级使用的专项转移支付资金的绩效进行自评，并将自评报告报送上级财政部门和主管部门。\"\n  },\n  {\n    \"法规名称\"\
    : \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"\
    转移支付项目按"
- expression: 部门/单位年度预决算报表.部门整体支出执行数 > 0 && (绩效自评报告及支撑材料中无‘部门整体支出绩效自评’报告 OR 绩效自评报告及支撑材料.报告类型不包含‘整体评价’) && 上级制度文件.部门整体自评要求
    = '是'
  description: 当部门有整体支出发生，且制度明确要求对部门整体支出进行绩效自评时，若未提交部门整体自评报告或报告类型仅为项目自评，判定为覆盖范围不完整。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 部门整体支出未纳入绩效自评
  regulation: "[\n  {\n    \"法规名称\": \"关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二部分第（四）项\",\n    \"内容概述\": \"各部门各单位要对预算执行情况以及政策、项目实施效果开展绩效自评，将部门整体支出纳入绩效自评范围，评价结果报送同级财政部门。\"\n  },\n  {\n  \
    \  \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"\
    内容概述\": \"部"
- expression: (面积统计表.实际完成面积 < 绩效自评报告.上报完成面积) || (面积统计表.实际完成面积 < 实施方案.改革目标面积 * 0.9)
  description: 实际完成面积低于自评上报面积，或低于方案确定的目标任务面积的90%，存在虚报完成进度或任务不达标风险。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 虚报农业水价综合改革完成面积
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"五、保障措施（三）\",\n    \"内容概述\": \"各省（区、市）人民政府要把农业水价综合改革任务分解落实到有关部门和地区，明确改革时间表和分步实施计划，细化年度改革目标任务，建立健全工作机制，确保各项改革任务按期完成。\"\
    \n  }\n]"
- expression: 绩效自评报告.自评完成数量与比率 > 计量设施台账.各灌区计量设施安装数量 || (绩效自评报告.节水效益数据 - (1-(用水量统计表.各户实际用水量/用水量统计表.各农户实际用水量及种植面积)) > 0.1)
  description: 将未安装计量设施或设施未正常运行的灌区纳入已完成改革范围，或上报节水率明显高于实际测算节水率10个百分点以上，判定为虚报绩效。
  audit_item: 农业水价综合改革相关事项落实不到位
  suspicion: 虚报农业水价综合改革工作绩效
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进农业水价综合改革的意见\",\n    \"法规文号\": \"国办发〔2016〕2号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"三、建立健全农业水价形成机制（七）\",\n    \"内容概述\": \"完善供水计量设施。新建、改扩建工程要同步建设计量设施；尚未配备计量设施的已建工程要抓紧改造。奠定按量计价、精准补贴基础。\"\n\
    \  }\n]"
