name: audit/审查报告类/监控报告
type: model
description: 从审查报告类类文档（监控报告）中提取结构化元数据。涵盖字段如：实际完成值、建议纠正措施、报告期间、报告状态、报告编号、调整后目标值、问题发现日期、问题描述。文档范围包括：绩效监控报告、绩效运行监控报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 监控报告
  member_count: 1
  member_details:
  - 绩效监控报告
  - 绩效运行监控报告
output:
  fields:
  - name: 实际完成值
    type: string
    description: 提取 实际完成值 的文本值
  - name: 建议纠正措施
    type: string
    description: 提取 建议纠正措施 的文本值
  - name: 报告状态
    type: boolean
    description: 提取 报告状态 的布尔值（是/否）
  - name: 报告编号
    type: string
    description: 提取 报告编号 的文本值
  - name: 调整后目标值
    type: string
    description: 提取 调整后目标值 的文本值
  - name: 问题发现日期
    type: date
    description: 提取 问题发现日期 的日期值，格式 YYYY-MM-DD
  - name: 问题描述
    type: string
    description: 提取 问题描述 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (年终自评报告中的目标值 != 年初申报表中的目标值) AND (对应的绩效目标调整申请及批复记录 IS NULL OR 批复结果为未批准)
  description: 若任何一项绩效指标的目标值在年末自评报告或执行文件中与年初申报值不一致，且找不到合法合规的审批记录（包括内部决策和财政批复），即判定为擅自调整。调整包括降低指标值、删除指标、新增指标等。
  audit_item: 部门、单位预算绩效目标下达或调整不合规
  suspicion: 未经批准自行调整预算绩效目标
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第四条第（十）款\",\n    \"内容概述\": \"预算执行中，各部门各单位应对绩效目标实现程度和预算执行进度实行‘双监控’，确需调整预算和绩效目标的，应按程序报批。\"\n  },\n  {\n\
    \    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\",\n\
    \    \"内容"
- expression: COUNT(绩效运行监控报告) == 0 && SUM(预算执行进度统计表.支出金额) > 0
  description: 当预算执行进度统计表中存在资金支出记录，但对应的绩效运行监控报告数量为零时，触发违规。说明单位在有预算执行的情况下未开展任何绩效运行监控，直接判定为未开展监控。
  audit_item: 部门、单位预算绩效运行监控不合规
  suspicion: 未开展预算绩效运行监控
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（五）款\",\n    \"内容概述\": \"各级政府及各部门各单位要建立绩效运行监控机制，加强对绩效目标实现程度和预算执行进度的跟踪管理，发现问题及时督促整改。\"\n  }\n]"
- expression: (COUNT(绩效目标申报表.绩效指标) - COUNT(绩效运行监控报告.监控指标)) > 0 && COUNT(绩效目标申报表.绩效指标) > 0
  description: 将绩效目标申报表中设定的全部绩效指标与监控报告中实际纳入监控的指标进行比对，若存在差异（即目标申报表中的指标未被监控），且目标申报表指标总数大于0，则判定为监控不全面。监控指标缺失即构成违规，不设容差。
  audit_item: 部门、单位预算绩效运行监控不合规
  suspicion: 绩效运行监控不全面
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（五）款\",\n    \"内容概述\": \"要对绩效目标实现程度和预算执行进度实行‘双监控’，确保绩效目标如期保质保量实现。\"\n  },\n  {\n    \"法规名称\": \"\
    项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"绩效运行监控是全过程预算绩效"
- expression: (发现问题整改通知书.签发日期 - 绩效运行监控报告.问题发现日期) > 30 || (绩效偏差问题整改台账.整改完成状态 != '已完成' && 绩效偏差问题整改台账.计划完成日期 < TODAY()) || (绩效指标完成情况对比表.后续完成率
    <= 首次监控完成率)
  description: 三种条件任一满足即触发违规：①整改通知书下发滞后超过30天；②整改台账中已逾期仍未完成整改；③整改后绩效指标完成率未改善甚至下降，表明措施无效。时限标准结合《政府预算绩效管理操作规程》中‘发现问题后原则上30日内启动纠偏’的常用要求。
  audit_item: 部门、单位预算绩效运行监控不合规
  suspicion: 绩效运行监控发现问题未及时采取有效措施
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（五）款\",\n    \"内容概述\": \"发现问题及时督促整改，加强绩效结果与预算安排、政策调整挂钩。\"\n  },\n  {\n    \"法规名称\": \"关于贯彻落实《中共中央\
    \ 国务院关于全面实施预算绩效管理的意见》的通知\",\n    \"法规文号\": \"财预〔2018〕167号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三部分\",\n    \"\
    内容概述\": \"对"
