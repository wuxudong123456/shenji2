name: audit/审查报告类/专项报告
type: model
description: 从审查报告类类文档（专项报告）中提取结构化元数据。涵盖字段如：两金占营业收入比、发现问题数量、报告日期、拟处置方案、排查覆盖业务类型、期初两金总额、期末两金总额、目标完成率。文档范围包括：应收账款和存货管理专项报告、金融业务风险排查专项报告（近3年）、闲置资产专项报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 资产
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 专项报告
  member_count: 1
  member_details:
  - 应收账款和存货管理专项报告
  - 金融业务风险排查专项报告（近3年）
  - 闲置资产专项报告
output:
  fields:
  - name: 两金占营业收入比
    type: number
    description: 提取 两金占营业收入比 的数值（含单位，如万元、吨等）
  - name: 发现问题数量
    type: number
    description: 提取 发现问题数量 的数值（含单位，如万元、吨等）
  - name: 报告日期
    type: date
    description: 提取 报告日期 的日期值，格式 YYYY-MM-DD
  - name: 拟处置方案
    type: string
    description: 提取 拟处置方案 的文本值
  - name: 排查覆盖业务类型
    type: string
    description: 提取 排查覆盖业务类型 的文本值
  - name: 期初两金总额
    type: number
    description: 提取 期初两金总额 的数值（含单位，如万元、吨等）
  - name: 期末两金总额
    type: number
    description: 提取 期末两金总额 的数值（含单位，如万元、吨等）
  - name: 目标完成率
    type: string
    description: 提取 目标完成率 的文本值
  - name: 闲置原因分析
    type: string
    description: 提取 闲置原因分析 的文本值
  - name: 闲置资产清单
    type: string
    description: 提取 闲置资产清单 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (账龄区间.账龄区间（如3年以上） > 30%) || (存货分类周转统计表.存货周转天数 > 0.2) || (年度压降目标（金额或占比）.年度压降目标（金额或占比） > 期末两金总额.期末两金总额)
  description: 触发条件一：3年以上长账龄应收账款占全部应收账款的比例超过30%，反映压控失效。触发条件二：存货周转天数同比增加超过20%，反映存货积压加剧。触发条件三：实际压降金额未达到企业自己设定的年度压控目标。以上任一条件触发皆表示两金压控未达标。
  audit_item: 未按规定落实降成本政策措施
  suspicion: 应收账款和存货“两金”压控未达标
  regulation: "[\n  {\n    \"法规名称\": \"中央企业降杠杆减负债指导意见\",\n    \"法规文号\": \"国资发财管[2017]119号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"-\",\n    \"内容概述\": \"要求中央企业加强应收账款和存货管理，严控“两金”占用，加快资金周转，提升资产运营效率。\"\n  },\n  {\n    \"法规名称\": \"降低实体经济企业成本工作方案\"\
    ,\n    \"法规文号\": \"国发〔2016〕48号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"-\",\n    \"内容概述\": \"政府引导企业加强资金管理，通过加快应收账款回收、"
- expression: (资产台账.使用状态 = '闲置' || 闲置资产明细表.闲置时长 >= 365) && (资产使用效率分析表.年使用天数 <= 30 || 资产使用效率分析表.利用率 < 0.05) && (闲置资产专项报告.闲置原因分析不包含'不可抗力'
    && 历史问题整改报告.闲置问题整改状态 = '未整改')
  description: 判定闲置资产并排除不可抗力等合理原因，同时满足连续闲置超过1年、年使用天数低于30天或利用率低于5%的条件，且未被有效整改的，视为严重违规闲置。
  audit_item: 资产管理方面存在的问题
  suspicion: 购置或建成资产长期闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十六条\",\n    \"内容概述\": \"国家出资企业投资应当符合国家产业政策，并按照国家规定进行可行性研究；与他人交易应当公平、有偿，取得合理对价。\"\n  }\n]"
- expression: (MAX(金融业务风险排查专项报告（近3年）.报告日期) < DATEADD(YEAR, -1, TODAY()) OR COUNT(金融业务风险排查专项报告（近3年）) = 0) && (SUM(CASE WHEN
    风险排查问题清单.整改状态 = '已完成' THEN 1 ELSE 0 END) * 1.0 / COUNT(风险排查问题清单) < 0.8 || ABS(金融业务风险排查专项报告（近3年）.发现问题数量 - 金融服务业务台账.不良率)
    / 金融服务业务台账.不良率 > 0.2)
  description: 判定标准：最近一次风险排查报告日期距当前超过一年（或报告缺失），且问题整改台账完成率低于80%，或排查发现的问题数量与业务台账计算的不良率、逾期笔数等风险指标偏差率超过20%，表明未真实有效开展排查。
  audit_item: 供销合作社金融服务不规范
  suspicion: 未定期开展金融风险排查并建立台账
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"四、（十三）\",\n    \"内容概述\": \"规范发展农村合作金融，要求供销合作社加强风险防控，建立风险预警和处置机制，定期开展风险排查。\"\n  }\n]"
