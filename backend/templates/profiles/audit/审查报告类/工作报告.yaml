name: audit/审查报告类/工作报告
type: model
description: 从审查报告类类文档（工作报告）中提取结构化元数据。涵盖字段如：报告中农药使用量、报告中化肥使用量、报告年度、清产核资完成时间、自评结论、资产清查范围、资金需求总额。文档范围包括：农业部门年度化肥农药减量工作报告、农村集体资产清产核资工作报告、政府年度工作报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 资产
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 工作报告
  member_count: 1
  member_details:
  - 农业部门年度化肥农药减量工作报告
  - 农村集体资产清产核资工作报告
  - 政府年度工作报告
output:
  fields:
  - name: 报告中农药使用量
    type: string
    description: 提取 报告中农药使用量 的文本值
  - name: 报告中化肥使用量
    type: string
    description: 提取 报告中化肥使用量 的文本值
  - name: 报告年度
    type: date
    description: 提取 报告年度 的日期值，格式 YYYY-MM-DD
  - name: 清产核资完成时间
    type: date
    description: 提取 清产核资完成时间 的日期值，格式 YYYY-MM-DD
  - name: 自评结论
    type: string
    description: 提取 自评结论 的文本值
  - name: 资产清查范围
    type: string
    description: 提取 资产清查范围 的文本值
  - name: 资金需求总额
    type: number
    description: 提取 资金需求总额 的数值（含单位，如万元、吨等）
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (情况表.累计到位率 < 80% && 日期差(系统日期, 项目计划开工日期) > 90天) || (政策文件.政策发布日期 > 项目融资招标公告日期 + 30天 && 项目.资金筹措状态 = '未完成')
  description: 财政资金到位率低于80%且项目开工超3个月未补足，或金融扶持政策出台时间明显晚于项目融资需求节点（晚于招标公告30天以上），这两种情况均表明政策工具与项目需求时间窗口错配，直接导致资金断档、工程款拖欠乃至停工。
  audit_item: 违反建设管理相关政策规定-重大工程项目推进缓慢
  suspicion: 财政金融政策与重大项目需求错配导致建设资金断档
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条、第二十二条\"\
    ,\n    \"内容概述\": \"政府投资应与经济社会发展水平和财政收支状况相适应，不得由施工单位垫资建设。财政部门应当根据批准的预算，按照法律、行政法规和国库管理的有关规定，及时、足额办理政府投资资金拨付。\"\n  }\n]"
- expression: (清产核资完成时间、资产清查范围.验收结论 != '已完成') || (清产核资完成时间、资产清查范围.第三方签字确认 != TRUE) || (ABS(盘点年度、资产名称、账面数量、实盘数量、差异数量、差异原因.差异数量)
    > 0 && 盘点年度、资产名称、账面数量、实盘数量、差异数量、差异原因.差异原因为空) || (资产名称、资产类别、数量、价值、登记日期、资产编号、保管责任人、使用状态、存放地点、原值、存放地点或位置.登记日期 > 清产核资截止日期要求、资产分类标准.清产核资截止日期要求)
  description: 判定清产核资任务未完成的逻辑：1）验收结论非“已完成”或验收报告缺少第三方签字，视为形式未完成；2）年度盘点存在账实差异且无合理解释，视为实质未完成；3）台账登记日期晚于上级政策文件规定的清产核资完成时限，视为逾期未完成。以上任一条件触发则构成疑点。
  audit_item: 农村集体资产管理不到位
  suspicion: 集体资产清产核资任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"要求全面开展集体资产清产核资，明确清产核资的范围、任务和时间表，确保账实相符、底数清晰。\"\n  },\n  {\n    \"法规名称\": \"\
    农村集体资产清产核资办法\",\n    \"法规文号\": \"农经发〔2018〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条、第十条\",\n    \"内容概述\": \"\
    农村集体经济组织"
- expression: ( ( [统计表.化肥使用量（吨）] - [统计表.化肥使用量（吨）] ) / [统计表.化肥使用量（吨）] > 0 ) || ( ( [统计表.农药使用量（吨）] - [统计表.农药使用量（吨）] ) / [统计表.农药使用量（吨）]
    > 0 ) || ( [评分表.考核结果] == '达标' && ( [数据表.年度水体氮含量（mg/L）] > [数据表.年度水体氮含量（mg/L）]*1.1 || [调查台账.化肥购买量（吨）]按区域汇总 > [统计表.化肥使用量（吨）]*1.15
    ) )
  description: 以2015年为基准年，计算当年化肥或农药使用量增长率，若大于0即未实现零增长；同时引入环保监测数据和农户抽样数据作为验证条件：若考核结果声称达标，但水体氮含量同比上升超过10%或抽样调查汇总用量超过统计表用量15%以上，则涉嫌数据造假掩盖未达标事实。阈值1.1和1.15为审计经验值，可根据实际基线调整。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 化肥农药使用量未实现零增长
  regulation: "[\n  {\n    \"法规名称\": \"到2020年化肥使用量零增长行动方案\",\n    \"法规文号\": \"农农发〔2015〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"全文\",\n    \"内容概述\": \"力争到2020年主要农作物化肥使用量实现零增长\"\n  },\n  {\n    \"法规名称\": \"到2020年农药使用量零增长行动方案\",\n \
    \   \"法规文号\": \"农农发〔2015〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n    \"条款号\": \"全文\",\n    \"内容概述\": \"力争到2020年主要农作物农药使用量实现零增长\"\
    \n  }\n]"
