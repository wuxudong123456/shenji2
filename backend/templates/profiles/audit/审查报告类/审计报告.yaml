    ,\n    \"法规文号\": \"财资〔2015〕90号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第三点\",\n    \"内容概述\": \"强化资产使用管理，严"
- expression: EXISTS (整改验收报告或证明材料.整改完成情况='已退回' AND 相关财务凭证的账务调整记录.借方科目 IN ('其他补贴','劳务费','福利费','加班费') AND ABS(相关财务凭证的账务调整记录.金额
    - 以往审计报告.涉及金额) / 以往审计报告.涉及金额 <= 0.1 AND 相关财务凭证的账务调整记录.凭证日期 BETWEEN 整改验收报告或证明材料.退回到账日期 AND 整改验收报告或证明材料.退回到账日期+60 AND (相关财务凭证的账务调整记录.摘要
    LIKE '%补贴%' OR 相关财务凭证的账务调整记录.摘要 LIKE '%发放%'))
  description: 比对已退回资金问题，检查退款后60天内是否存在科目为敏感补贴类、金额与原违规金额偏差不超过10%的新支出，且摘要含补贴发放等关键词，若存在则高度涉嫌以新科目变相重发资金，属于虚假整改。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 通过重列支出科目虚假整改已退回资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"被审计单位应当按照规定时间整改审计查出的问题，将整改情况报告审计机关。审计机关应当对整改情况进行跟踪检查。\"\n  }\n]"
- expression: 整改任务进度跟踪表.各问题当前状态 IN ('持续推进','部分整改','未整改') AND (被审计单位整改方案.计划整改完成时间 IS NULL OR (当前日期 - 被审计单位整改方案.计划整改完成时间 > 365))
    AND (MAX(整改任务进度跟踪表.最新更新日期) < 当前日期 - 180 OR COUNT(管理层关于整改的会议纪要.会议日期) = 0)
  description: 问题未关闭且超过承诺整改期限一年仍未完成，或未设定明确时限且近半年内无任何进展更新或管理层讨论记录，即判定为拖延整改。365天覆盖一个完整年度，180天（半年）作为无进展监控阈值。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 整改措施长期无实质进展或无限期拖延
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"被审计单位应当按照规定时间整改审计查出的问题，将整改情况报告审计机关。\"\n  }\n]"
