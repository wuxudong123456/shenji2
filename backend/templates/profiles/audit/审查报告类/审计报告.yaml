name: audit/审查报告类/审计报告
type: model
description: 从审查报告类类文档（审计报告）中提取结构化元数据。涵盖字段如：与工程进度匹配性、个别报表中内部销售收入、义务教育保障经费拨付记录、交通补助、债务责任认定、关键审计事项、内部往来科目余额、净利润。文档范围包括：专项审计报告、以往审计报告、企业年度审计报告、企业年度财务审计报告、内部审计报告、农村公益性公墓年度财务审计报告、单位内部审计报告、历史审计报告、历年审计报告、土地出让收入用于农业农村支出的专项审计报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 工程
- 报表
- 整改
- 资产
- 元数据提取
