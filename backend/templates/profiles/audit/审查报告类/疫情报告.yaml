name: audit/审查报告类/疫情报告
type: model
description: 从审查报告类类文档（疫情报告）中提取结构化元数据。涵盖字段如：发病数量、报告时间、死亡数量、疫情发现时间、疫情发生养殖场、疫情种类。文档范围包括：动物疫情报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 疫情报告
  member_count: 1
  member_details:
  - 动物疫情报告
output:
  fields:
  - name: 发病数量
    type: number
    description: 提取 发病数量 的数值（含单位，如万元、吨等）
  - name: 报告时间
    type: date
    description: 提取 报告时间 的日期值，格式 YYYY-MM-DD
  - name: 死亡数量
    type: number
    description: 提取 死亡数量 的数值（含单位，如万元、吨等）
  - name: 疫情发现时间
    type: date
    description: 提取 疫情发现时间 的日期值，格式 YYYY-MM-DD
  - name: 疫情发生养殖场
    type: string
    description: 提取 疫情发生养殖场 的文本值
  - name: 疫情种类
    type: string
    description: 提取 疫情种类 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (疫情报告.报告时间 - 疫情报告.疫情发现时间 > 24h) OR (处理台账.病死畜禽种类及数量 > 疫情报告.死亡数量) OR (理赔记录.病死畜禽理赔数量 > 疫情报告.死亡数量 * 1.2)
  description: 报告时间超过发现时间24小时为迟报；无害化处理台账中某养殖场处理数量明显大于已上报疫情死亡数量，且差异超过20%，存在瞒报可能；保险理赔死亡数量若显著高于官方报告死亡数量（超出20%），疑似谎报或漏报。
  audit_item: 落实动物防疫不到位
  suspicion: 瞒报谎报迟报动物疫情
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国动物防疫法\",\n    \"法规文号\": \"主席令第69号（2021年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十二条\",\n    \"内容概述\": \"从事动物疫病监测、检测、检验检疫、研究、诊疗以及动物饲养、屠宰、捕捞、隔离、运输等活动的单位和个人，发现动物染疫或者疑似染疫的，应当立即向所在地动物疫病预防控制机构或者动物防疫主管部门报告。\"\
    \n  },\n  {\n    \"法规名称\": \"重大动物疫情应急条例\",\n    \"法规文号\": \"国务院令第450号\",\n    \"效力级别\": \"行政法规\",\n    \"条"
- expression: (疫情报告.决定扑杀范围（全场/点状）='全场' AND 明细表.扑杀数量 < 登记表.存栏量 * 0.9) OR (数据.耳标号 IN 应扑杀耳标清单) OR (处理台账.数量 < 明细表.扑杀数量 * 0.95)
  description: 扑杀令要求全场扑杀时，补偿发放数量少于疫情前存栏量90%即未彻底执行；扑杀后生猪耳标仍在电子出证系统中有调运记录，说明疫点生猪被转运；无害化处理台账数量明显少于补偿数量(不足95%)，疑似虚报扑杀套取资金但未实际处理。
  audit_item: 落实动物防疫不到位
  suspicion: 未按规定实施强制扑杀
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国动物防疫法\",\n    \"法规文号\": \"主席令第69号（2021年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十七条\",\n    \"内容概述\": \"发生重大动物疫情时，应当划定疫点、疫区、受威胁区，对疫点内的动物进行扑杀并无害化处理。\"\n  },\n  {\n    \"法规名称\": \"重大动物疫情应急条例\"\
    ,\n    \"法规文号\": \"国务院令第450号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条\",\n    \"内容概述\": \"对疫点内的所有动物必须进行扑杀，并按照规定进行无害化"
