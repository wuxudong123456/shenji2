violations:
- expression: (监测报告.实际排放浓度 > 许可排放浓度限值.许可排放浓度限值) || (ABS(自行监测数据.自行监测数据 - 检测报告.第三方抽测数据) / 检测报告.第三方抽测数据 > 0.3) || (记录表.治污设施用电量曲线
    出现夜间骤降且伴随排放峰值)
  description: 超标判定直接依据监测报告数据超过许可证限值；疑似篡改数据判定通过企业自行数据与第三方抽查数据差异率超过30%触发；治污设施用电量与排放峰值异常反向关联作为辅助判定依据。风险等级：超标即高风险，数据差异率30%-50%为中风险，大于50%为严重违规。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 大气污染物排放超标或监测数据造假
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国大气污染防治法\",\n    \"法规文号\": \"主席令第三十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十八条、第九十九条\",\n    \"内容概述\": \"向大气排放污染物的，应当符合大气污染物排放标准；超过排放标准排放大气污染物的，由环保部门责令改正或者限制生产、停产整治，并处罚款。\"\n  }\n]"
- expression: 监测报告.PM2.5 > 500 μg/m³ && 图.异常高温点坐标 IN (运处台账.清运村庄) || 整改清单.违规焚烧点位置 >= 2
  description: PM2.5极高且对应区域存在热源异常点，或台账记录显示垃圾长期未清运区域同时出现热源点，判定为疑似焚烧；同一地点重复出现焚烧记录视为屡禁不止。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 露天焚烧农村生活垃圾
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十九条\",\n    \"内容概述\": \"禁止随意倾倒、抛撒、堆放或者焚烧生活垃圾。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国大气污染防治法\",\n    \"法规文号\": \"\
    2018年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第八十二条\",\n    \"内容概述\": \"禁止在人口集中地区和其他依法需要特殊保护的区域内焚烧沥青、油毡、橡胶、塑料、皮革、垃圾以及其他产生有"
- expression: (监测报告.重金属含量 > 国家标准 && 监测报告.异常热源坐标 < 500米) || (监测报告.渗滤液处理指标 < 0.9) || (验收报告.防渗措施 != '通过' && 计划表.每日填埋量 > 0)
  description: 填埋场周边500米内地下水重金属超标或渗滤液处理达标率低于90%，或防渗未通过验收却已启用，均判定为违规填埋，存在污染风险。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 收集垃圾违规填埋造成污染隐患
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"建设利用填埋方式处置生活垃圾的，应当按照国家有关规定采取防渗漏、防扬散、防流失等环境保护措施。\"\n  },\n  {\n    \"法规名称\": \"生活垃圾填埋场污染控制标准\"\
    ,\n    \"法规文号\": \"GB 16889-2008\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"4.4\",\n    \"内容概述\": \"填埋场必须设置防渗层，并确保渗滤液有效"
- expression: (GPS轨迹.停留点坐标位于农村非工业区 && 与环境监测报告.超标点位100米内) || (转移联单.接收单位 NOT IN 备案清单.企业名称) || (交接登记表.废物类别='一般工业固废/危险废物' && 接收地点无环评批复)
  description: 运输车辆GPS在非工业区异常停留且与污染超标点吻合，或转移接收单位无相应备案资质，或在无环评批复的农村地点接收工业固废，即判定为非法倾倒嫌疑。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 在农村地区非法倾倒工业固体废物
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"产生工业固体废物的单位应当采取防止或者减少固体废物污染环境的措施，禁止擅自倾倒、堆放、丢弃、遗撒固体废物。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\"\
    ,\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第八十二条\",\n    \"内容概述\": \"转移危险废物的，必须按照国家"
- expression: (治理台账.销号状态 == '已销号' && (监测报告.氨氮浓度 == 治理前氨氮浓度 || ABS(监测报告.氨氮浓度-治理前氨氮浓度) < 检出限*2)) || (明细表.支出摘要 LIKE '%填埋%' &&
    其他.工程量清单 NOT LIKE '%截污纳管%' && 其他.工程量清单 NOT LIKE '%清淤%')
  description: 已销号水体在销号后短期内水质指标无实质改善甚至反弹（偏差值极小），或项目资金仅用于土方填埋无任何截污清淤手段，高度疑似冲污稀释或一填了之的虚假治理。
  audit_item: 农村生活污水治理不符合相关规定
  suspicion: 对冲污稀释、一填了之搞表面及虚假治理
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第七十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十九条\",\n    \"内容概述\": \"禁止采取冲污稀释、一填了之等方式，搞表面治理和虚假治理，确保水质改善成效。\"\n  },\n  {\n    \"法规名称\": \"农村黑臭水体治理工作指南（试行）\",\n  \
    \  \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"严禁搞形式主义，明确消除黑臭必须采取控源截污、内源治理等实质性工程措施。\"\
    \n  }\n]"
- expression: (联单记录.收货方 不在 合规处置企业名录) || (联单台账.最终处置方式（再生/填埋/焚烧） != '资源化利用' && 联单台账.最终处置方式（再生/填埋/焚烧） != '卫生填埋') || (监测报告.二噁英浓度
    > 0.5 ng TEQ/Nm³) || (决定书.违规事实 包含 '焚烧' || '掩埋' || '弃置') || (投诉记录.投诉内容 包含 '烧膜' || '埋膜' || '乱倒' )
  description: 合规处置企业名录由回收协议确定。非资源化利用或卫生填埋的，可能为非法处置；二噁英超标参照《危险废物焚烧污染控制标准》中限值（0.5ng TEQ/Nm³）；其他字段通过关键文本匹配判定。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 随意弃置、掩埋或者焚烧废旧农膜
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"农用薄膜使用者应当在使用期限届满前捡拾田间的非全生物降解农用薄膜废弃物，交至回收网点或回收工作者，不得随意弃置、掩埋或者焚烧。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十条\","
- expression: (分红协议.分红方式 == '固定利息' || 分红协议.是否绑定经营效益 == '否') && (分红协议.分红年限 < 5 || 分析表.项目年度净利润 < 0 || (明细表.分红金额 / 分析表.项目年度净利润)
    > 0.6 || 监测报告.亏损记录 != '无')
  description: 分红方式为固定利息且未与经营效益挂钩，属于简单分红模式；分红年限不足5年、项目出现亏损、分红占比超过净利润60%或存在亏损记录，均表明可持续性不足。以上任一条件满足即视为违规疑点。
  audit_item: 帮扶产业项目联农带农机制不够持续稳固
