name: audit/审查报告类/监测报告
type: model
description: 从审查报告类类文档（监测报告）中提取结构化元数据。涵盖字段如：COD浓度、PM2.5、二噁英指标、二噁英浓度、亏损记录、品牌认证进展、土壤检测结果、土壤污染指标超标的点位及关联分析。文档范围包括：农田环境监测报告、后期环境监测报告、大气污染物监测报告（含在线监测数据）、水质监测报告、污染源监测报告、环保监测报告、环保部门污水监测报告、环保部门环境监测报告、环保部门秸秆焚烧监测报告、环境污染监测报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 培训
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 监测报告
  member_count: 1
  member_details:
  - 农田环境监测报告
  - 后期环境监测报告
  - 大气污染物监测报告（含在线监测数据）
  - 水质监测报告
  - 污染源监测报告
  - 环保监测报告
  - 环保部门污水监测报告
  - 环保部门环境监测报告
  - 环保部门秸秆焚烧监测报告
  - 环境污染监测报告
  - 监测报告
  - 载体运营监测报告
  - 项目运营监测报告
