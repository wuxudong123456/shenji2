name: audit/审查报告类/检查报告
type: model
description: 从审查报告类类文档（检查报告）中提取结构化元数据。涵盖字段如：不合格项、历史问题及整改情况、发现问题、发现问题数量、发现问题清单、处罚情况、处罚记录、实际资金用途描述。文档范围包括：党风廉政建设监督检查报告、内部审计或专项检查报告、外部监管部门检查报告、政府监管部门检查报告、现场检查报告、自然资源部门土地执法检查报告、设施检查报告、资金监管部门检查报告、金融机构贷后检查报告、食堂卫生检查报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 整改
- 检查
- 金额
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 检查报告
  member_count: 1
  member_details:
  - 党风廉政建设监督检查报告
  - 内部审计或专项检查报告
  - 外部监管部门检查报告
  - 政府监管部门检查报告
  - 现场检查报告
  - 自然资源部门土地执法检查报告
  - 设施检查报告
  - 资金监管部门检查报告
  - 金融机构贷后检查报告
  - 食堂卫生检查报告
output:
  fields:
  - name: 不合格项
    type: string
    description: 提取 不合格项 的文本值
  - name: 历史问题及整改情况
    type: string
    description: 提取 历史问题及整改情况 的文本值
  - name: 发现问题
    type: string
    description: 提取 发现问题 的文本值
  - name: 发现问题数量
    type: number
    description: 提取 发现问题数量 的数值（含单位，如万元、吨等）
  - name: 发现问题清单
    type: string
    description: 提取 发现问题清单 的文本值
  - name: 处罚情况
    type: string
    description: 提取 处罚情况 的文本值
  - name: 处罚记录
    type: string
    description: 提取 处罚记录 的文本值
  - name: 实际资金用途描述
    type: string
    description: 提取 实际资金用途描述 的文本值
  - name: 报告出具日期
    type: date
    description: 提取 报告出具日期 的日期值，格式 YYYY-MM-DD
  - name: 整改期限
    type: string
    description: 提取 整改期限 的文本值
  - name: 整改要求
    type: string
    description: 提取 整改要求 的文本值
  - name: 整改闭环情况
    type: string
    description: 提取 整改闭环情况 的文本值
  - name: 核查日期
    type: date
    description: 提取 核查日期 的日期值，格式 YYYY-MM-DD
  - name: 检查发现的问题描述
    type: string
    description: 提取 检查发现的问题描述 的文本值
  - name: 检查日期
    type: date
    description: 提取 检查日期 的日期值，格式 YYYY-MM-DD
  - name: 检查范围
    type: string
    description: 提取 检查范围 的文本值
  - name: 监管部门名称
    type: string
    description: 提取 监管部门名称 的文本值
  - name: 空置确认状态
    type: boolean
    description: 提取 空置确认状态 的布尔值（是/否）
  - name: 责任人签字
    type: string
    description: 提取 责任人签字 的文本值
  - name: 违法事实认定
    type: string
    description: 提取 违法事实认定 的文本值
  - name: 问题类型
    type: string
    description: 提取 问题类型 的文本值
  - name: 风险分类结果
    type: boolean
    description: 提取 风险分类结果 的布尔值（是/否）
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (工作台账.发现问题数量 < 监督检查工作部署记录.监督检查工作部署记录) || (工作台账.检查对象 / 工作台账.检查对象 < 0.9) || (落实清单.整改完成时间 - 落实清单.整改完成时间 > 30天)
    || (审批文件.合同金额 >= 100万 && 工作台账.检查结果摘要)
  description: 判定监督检查不到位：1.实际检查次数未达到本单位制度规定的年度检查频次；2.检查覆盖率低于90%（已检查单位数/应检查单位数<0.9），存在监督盲区；3.发现问题后整改超时，下达整改至完成时间差超过30天，整改拖沓；4.大额经济活动（≥100万）未纳入监督检查台账，存在监督缺失。以上条件满足任意一条即触发疑点。
  audit_item: 在经济活动中落实党风廉政建设责任方面存在的问题
  suspicion: 未严格实施党风廉政建设监督检查
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党党内监督条例\",\n    \"法规文号\": \"中发〔2016〕26号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"纪律检查机关必须把维护党的政治纪律和政治规矩放在首位，坚决纠正和查处上有政策、下有对策，有令不行、有禁不止，口是心非、阳奉阴违等行为。\"\n  },\n  {\n    \"\
    法规名称\": \"关于实行党风廉政建设责任制的规定\",\n    \"法规文号\": \"中发〔2010〕19号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第十九条\",\n    \"\
    内容概述\":"
- expression: 审批台账.借款人姓名 LIKE '%自然人%' && (检查报告.实际资金用途描述 = '企业') && (检查报告.实际资金用途描述 NOT IN (名录.企业名称)) OR (名录.企业名称 IN (审批台账.借款人姓名)
    >= 5)
  description: 当满足以下条件之一时触发：1. 贷款申请人为农户个体，但资金经过其账户后最终转入了某企业账户，且该企业不在官方认定的帮扶企业名录中；2. 或是虽然企业在名录内，但出现了同一个小额信贷企业账户短期内收到超过5名及以上不同借款农户转账的情况，疑似集中归集农户贷款。
  audit_item: 帮扶产业配套支持政策不够精准有效
  suspicion: 小额信贷资金“户贷企用”违规使用
  regulation: "[\n  {\n    \"法规名称\": \"关于深入扎实做好过渡期脱贫人口小额信贷工作的通知\",\n    \"法规文号\": \"银保监发〔2021〕6号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"脱贫人口小额信贷要坚持户借、户用、户还，精准用于贷款户发展生产和开展经营。……坚决杜绝“户贷企用”等违规行为。\"\n  }\n]"
- expression: ABS(SUM(银行卡号.实发金额) - SUM(银行卡号.应发金额)) > 0.01 || 资金.收款账户 NOT IN (惠农补贴专户清单) || 情况表.二次分配去向 IS NULL
  description: 实发总额与应发总额存在差异(精度0.01元)即触发；或补贴资金转入非专户账户如单位基本户、施工单位账户等；或结余资金被用于非补贴项目，无有效审批依据。
  audit_item: 监管不到位，惠农财政补贴资金被套取骗取、违规使用
  suspicion: 乡镇主管部门挤占挪用惠农补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员不得截留、挪用财政资金；违者责令改正、追回资金、给予警告或通报批评。\"\n  }\n]"
- expression: (空置房源统计表.累计空置时长（天） > 365) && (空置房源清单.空置原因说明 NOT IN ('合理装修期','合理轮候期','维修保养期','政策预留期'))
  description: 筛查累计空置天数超过365天且空置原因不属于合理情形的房源，合理空置情形需有明确制度或官方文件依据，如装修期（一般不超过3个月）、轮候期等。累计空置时长由交付可达入住状态日期至分配或实际入住日期计算，若仍未分配则计算至审计基准日。表达式区分刻意闲置与非正常管理滞后，阈值365天依据住房城乡建设部关于竣工后1年内完成分配的要求。
  audit_item: 公共租赁住房未按规定及时分配入住形成空置
  suspicion: 已竣工验收公租房空置超1年未分配
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部办公厅关于加快公共租赁住房分配入住的通知\",\n    \"法规文号\": \"建办保函〔2015〕212号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二、加快分配入住\",\n    \"内容概述\": \"各地要对已竣工的公共租赁住房项目，抓紧制定分配方案，尽快分配入住，原则上要在竣工后1年内完成分配。\"\n  },\n  {\n\
    \    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n  \
    \  \"内容概"
- expression: 交易摘要 LIKE '%质押%' OR 交易摘要 LIKE '%担保%' OR 质押冻结记录 = '质押' OR 检查发现的问题描述 = '外部报告指出存在违规担保'
  description: 条例明确禁止公积金管理中心为他人提供担保。若银行流水中出现质押或担保标记，或外部监管报告指出问题，不论金额大小，直接判定违规。
  audit_item: 挪用住房公积金
  suspicion: 违规使用住房公积金存款为第三方提供质押担保
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十八条第二款\",\n    \"内容概述\": \"住房公积金管理中心不得向他人提供担保。\"\n  }\n]"
- expression: ((出让合同.土地取得方式（划拨/出让） == '划拨') && (存在转让行为) && (缴纳凭证.缴纳金额 IS NULL || 缴纳凭证.缴纳金额 == 0)) || ((信息表.权利性质 == '出让') &&
    (批复文件.批复文号 IS NULL))
  description: 划拨土地使用权发生转让，必须经政府批准并补缴土地出让金转为出让性质。若取得方式为划拨但已发生转让却无出让金补缴记录，或不动产登记簿显示权利性质为出让但无对应的政府批复文件，均视为违规改变土地性质。触发条件为划拨地转让未补缴出让金或出让性质无合法审批来源。
  audit_item: 未经批准改变土地用途、性质或容积率
  suspicion: 未经批准擅自改变土地权利性质
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城市房地产管理法\",\n    \"法规文号\": \"主席令第18号（2019年修正）\",\n    \"效力级别\": \"法律\",\n  \
    \  \"条款号\": \"第四十条\",\n    \"内容概述\": \"以划拨方式取得土地使用权的，转让房地产时，应当报有批准权的人民政府审批。准予转让的，应当由受让方办理土地使用权出让手续，并依照国家有关规定缴纳土地使用权出让金。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第32号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \""
- expression: (数据表格类-明细表.支出科目 IN ('办公费','会议费','装修费','设备购置') AND 数据表格类-明细表.支出金额>0) OR (企业银行账户收支明细.收款方账户 NOT IN (发放台账.对象银行账户)
    AND 企业银行账户收支明细.交易摘要 NOT LIKE '%抚恤%')
  description: 当资金支出科目与抚恤直接用途无关，或收款方非抚恤对象账户时，判定为可疑挪用。重点审查大额整数支付及节假日前后突击支出。
  audit_item: 管理单位违反军人抚恤优待政策
  suspicion: 违规挪用抚恤优待专项资金
  regulation: "[\n  {\n    \"法规名称\": \"《军人抚恤优待条例》\",\n    \"法规文号\": \"国务院、中央军事委员会令第709号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"军人抚恤优待所需经费由国务院和地方各级人民政府分级负担。抚恤优待经费应当专款专用，任何单位和个人不得贪污、挪用、截留和私分。\"\n  }\n]"
- expression: (食堂卫生检查评分表.总分 < 70) || (食堂卫生检查报告及整改记录.发现问题 != '' && 食堂卫生检查报告及整改记录.整改完成日期 == '') || 消毒设备.最近使用日期 < (当前日期 - [此处填充文本])
  description: 卫生检查评分低于70分（假设满分100）属于严重脏乱差；检查发现问题但无后续整改完成记录，表明问题未闭环管理；消毒设备长期无使用记录（如超过3天），怀疑餐具未经消毒。任一条件触发即判定为卫生管理不合规。
  audit_item: 食堂建设管理不符合规定
  suspicion: 食堂加工操作间卫生不达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国食品安全法\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十三条\",\n    \"内容概述\": \"食品生产经营应当具有与生产经营的食品品种、数量相适应的生产经营设备或者设施，有相应的消毒、更衣、盥洗、采光、照明、通风、防腐、防尘、防蝇、防鼠、防虫、洗涤以及处理废水、存放垃圾和废弃物的设备或者设施。\"\
    \n  },\n  {\n    \"法规名称\": \"学校食品安全与营养健康管理规定\",\n    \"法规文号\": \"教育部、国家市场监督管理总局、国家卫生健康委员会令第45号\""
