name: audit/审查报告类/评价报告
type: model
description: 从审查报告类类文档（评价报告）中提取结构化元数据。涵盖字段如：产出数量指标、任务完成情况、单位产出成本、历史实际产出完成数、历史实际资金投入、历史年份、原始评价数、发现问题编号。文档范围包括：《绩效评价报告》、养殖场环境影响评价报告、历史年度绩效评价报告、物有所值评价报告、环境影响评价报告、第三方绩效评价报告、第三方评价报告、管护评估评价报告、绩效评价报告、绩效评价第三方评价报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 整改
- 项目
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 评价报告
  member_count: 1
  member_details:
  - 《绩效评价报告》
  - 养殖场环境影响评价报告
  - 历史年度绩效评价报告
  - 物有所值评价报告
  - 环境影响评价报告
  - 第三方绩效评价报告
  - 第三方评价报告
  - 管护评估评价报告
  - 绩效评价报告
  - 绩效评价第三方评价报告
  - 资金绩效评价报告
