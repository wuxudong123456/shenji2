violations:
- expression: (评价报告.受益人数 - 底稿.受益对象名单) / 底稿.受益对象名单 > 0.1 || (评价报告.任务完成情况 - 对比表.实际完成值) > 0.1 || (评价报告.满意度评分 > 90 && 底稿.调查问卷统计结果
    > 20)
  description: 评价报告数据与原始底稿数据偏差超过10%，或满意度评分与投诉率存在逻辑矛盾，即判定疑点。受益人数虚增、完成率篡改、满意度虚高均视为不真实。
  audit_item: 财政转移支付资金政策绩效评价不规范
  suspicion: 绩效评价结果数据不真实不准确
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"绩效评价结果应当客观、公正、准确、完整，不得弄虚作假。\"\n  }\n]"
- expression: (批复文件.批复要求评价的项目清单 - COUNT(评价报告.报告名称)) > 0 || (SUM(评价报告.预算执行率) / SUM(资金规模要求.资金规模要求) < 1)
  description: 根据政策文件，凡达到一定金额的转移支付项目均应开展绩效评价；如存在未开展评价的项目，或已评价项目资金覆盖率未达到100%，即构成违规。
  audit_item: 财政转移支付资金政策绩效评价不规范
  suspicion: 对财政转移支付项目未开展绩效评价
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"各部门、各单位应当对预算资金和项目支出全面开展绩效自评，确保评价范围全覆盖。\"\n  }\n]"
- expression: 统计表.结转年限 >= 2 && (跟踪表.累计实际使用金额 / 跟踪表.资金拨付总额) < 使用率阈值
  description: 计算资金预算年度至审计截止日的时长，对于下达超过2年但总使用率仍处于低位（如低于80%）的项目资金进行筛查，识别沉淀闲置问题。对于无法实施、长期停工的项目，其使用率阈值应设为接近0。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 转移支付资金长期闲置沉淀未发挥效益
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强财政支出预算执行管理的通知\",\n    \"法规文号\": \"财预〔2017〕69号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"各级财政部门要进一步盘活财政存量资金，对结余资金和连续两年未用完的结转资金，一律收回总预算统筹使用。\"\n  }\n]"
- expression: 批准的项目名称 != NULL && (批准的项目名称 NOT IN (入库项目的评审论证材料.入库项目的评审论证材料) || 入库项目的评审论证材料 IS NULL || 入库项目的评审论证材料 IS NULL)
  description: 对于按项目法分配的转移支付资金，所支持的项目必须来自经过合规评审、动态调整的项目储备库。若批准的项目不在项目库中、单位根本未建立项目库，或者库内项目缺乏基本的可行性论证、评审记录，则属于违规分配。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 项目法分配转移支付资金未实行项目库管理
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"采用项目法分配的，应当实行项目库管理，由有关部门和单位根据专项转移支付的政策意图、使用范围和方向，组织具体项目申报、评审，择优确定拟支持的项目。\"\n  }\n]"
- expression: (资质证书有效期截止日期 < 合同签订日期) OR (经营范围 NOT LIKE '%绩效评价%' AND 经营范围 NOT LIKE '%绩效管理%' AND 经营范围 NOT LIKE '%预算绩效%') OR
    (独立性声明中关联关系字段 = '存在关联' OR 利益冲突声明 = '未回避') OR (资质审核记录表.审核结论 = '不通过' AND 项目仍委托)
  description: 资质证书在合同签订日已过期或经营范围明显不含绩效评价类业务视为不具备条件；独立性声明中承认存在关联关系但未回避，或审核未通过却仍获得委托，反映机构不独立或流程失控。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 委托的第三方机构不具备绩效评价资质或存在独立性缺陷
  regulation: "[\n  {\n    \"法规名称\": \"关于委托第三方机构参与预算绩效管理的指导意见\",\n    \"法规文号\": \"财预〔2021〕6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"第三方机构应当具有独立承担民事责任的能力，具备提供服务所必需的设施、人员和专业技术能力，具有良好的信誉。\"\n  },\n  {\n    \"法规名称\"\
    : \"政府购买服务管理办法\",\n    \"法规文号\": \"财政部令第102号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十二条\",\n    \"内容概述\": \"购买主体应当依法确定承接"
- expression: (DATEDIFF(实际公开日期, 绩效评价报告出具日期) > 30) OR (公示内容 NOT LIKE '%第三方机构名称%' OR NOT LIKE '%评价标准%' OR NOT LIKE '%评价结果%'
    OR NOT LIKE '%问题及建议%')
  description: 从报告出具日算起超过30个工作日未公开即触发延迟公开疑点；公示内容缺少第三方机构名称、评价标准、结果或问题建议等关键要素之一即触发选择性公开或不完整性疑点。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 未按规定及时充分公开第三方绩效评价信息
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十条第十四项\",\n    \"内容概述\": \"行政机关应当主动公开财政预算、决算信息，包括预算绩效管理相关情况。\"\n  },\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\"\
    ,\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"四、（十六）\",\n    \"内容概述\": \"各级财政部门要推进绩效信息公开，将重"
- expression: 《绩效目标与评价结果公开情况对照表》.应公开项='是' && 《绩效目标与评价结果公开情况对照表》.实际公开记录='无'
  description: 根据法规与制度应主动公开的绩效目标或评价结果，在公开对照表中标记为‘应公开’，但实际公开记录为空（无任何公开痕迹），即判定为未公开违规。已扣除经合法保密审查豁免公开的情形。
  audit_item: 部门、单位绩效评价结果未公开
  suspicion: 重点项目绩效评价结果未公开
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十条第（七）项\",\n    \"内容概述\": \"行政机关应主动公开财政预算、决算信息及其他应当主动公开的政府信息，绩效信息作为财政信息公开的重要组成部分，应向社会公开。\"\n  },\n  {\n    \"法规名称\"\
    : \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"\
    各级"
- expression: 《信息公开台账》.公开日期 - 《绩效评价报告》.批复日期 > 20 （工作日）
  description: 以绩效评价报告获正式批复的日期为起算点，至在指定公开平台实际发布的日期，两个日期之间的工作日天数超过20日（不含20日），即构成超期公开。20日为《政府信息公开条例》的一般规定，若单位制度有更严时限，则按制度时限执行。
  audit_item: 部门、单位绩效评价结果未公开
  suspicion: 绩效评价结果超期公开
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
