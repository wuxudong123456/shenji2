name: audit/审查报告类/开工报告
type: model
description: 从审查报告类类文档（开工报告）中提取结构化元数据。涵盖字段如：实际开工/进场日期、实际开工日期、实际开工日期或施工单位进场日期、批准开工日期、批复文号、批复日期。文档范围包括：开工令或开工报告、开工报告、施工日志或开工报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 开工报告
  member_count: 1
  member_details:
  - 开工令或开工报告
  - 开工报告
  - 施工日志或开工报告
output:
  fields:
  - name: 实际开工-进场日期
    type: date
    description: 提取 实际开工-进场日期 的日期值，格式 YYYY-MM-DD
  - name: 实际开工日期
    type: date
    description: 提取 实际开工日期 的日期值，格式 YYYY-MM-DD
  - name: 实际开工日期或施工单位进场日期
    type: date
    description: 提取 实际开工日期或施工单位进场日期 的日期值，格式 YYYY-MM-DD
  - name: 批准开工日期
    type: date
    description: 提取 批准开工日期 的日期值，格式 YYYY-MM-DD
  - name: 批复文号
    type: string
    description: 提取 批复文号 的文本值
  - name: 批复日期
    type: date
    description: 提取 批复日期 的日期值，格式 YYYY-MM-DD
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (日志.实际开工日期 IS NOT NULL) && (对照表.开工报告批复日期 IS NULL || 日志.实际开工日期 < 对照表.开工报告批复日期)
  description: 对于法规规定必须取得开工报告的项目，若实际开工日期早于开工报告批复日期，或未取得批复即开工，则判定违规。该表达式要求开工报告批复日期必须存在且不晚于实际开工日期。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得开工报告擅自开工
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"中华人民共和国主席令第29号（2019修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第七条\",\n    \"内容概述\": \"按照国务院规定的权限和程序批准开工报告的建筑工程，不再领取施工许可证。此类项目必须获得开工报告批准方可开工建设。\"\n  },\n  {\n    \"法规名称\"\
    : \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条、第三十三条\",\n    \"内容概述\": \"政府投资项目开工建"
- expression: (合同签订日期 > 批准开工日期) && (批准开工日期 - 合同签订日期 > 30天) || (合同签订日期 > 中标通知书发出时间 + 30天)
  description: 违反招标文件和中标通知书中关于合同签订时限的规定。通常规定中标通知书发出后30日内签订合同。若合同签订日期晚于监理或业主批准的开工日期，且超出30天或法定签订时限，则判定为'先干后签'违规。30天为常用行业阈值，可结合具体招标文件条款调整。
  audit_item: 某公共建筑合同履行审
  suspicion: 先干后签，倒签施工合同
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。\"\n  }\n]"
- expression: 开工报告.实际开工日期 < 施工许可证.发证日期 || 立项批复文件.批复日期 为空 || 会议纪要中明确存在‘边建边批’‘先行开工’等表述
  description: 当实际开工日期早于施工许可证发证日期，或缺少立项批文，或存在指示提前开工的会议记录时，判定为未批先建。若开工日期早于施工许可证日期但晚于立项批复，属于程序倒置，风险程度依据时间差划分：差30天内为一般违规，超30天为严重违规。
  audit_item: 重大工程项目全过程审计
  suspicion: 立项审批程序倒置或未批先建
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第29号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七条\"\
    ,\n    \"内容概述\": \"建筑工程开工前，建设单位应当按照国家有关规定向工程所在地县级以上人民政府建设行政主管部门申请领取施工许可证；未取得施工许可证的，一律不得开工。\"\n  },\n  {\n    \"法规名称\"\
    : \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"政府投资项目开工建设，应当符合"
- expression: (开工报告.实际开工日期 < 许可证.施工许可证发证日期) || (明细表.第一笔工程款支付日期 < 许可证.施工许可证发证日期)
  description: 施工许可证是工程开工的法定前置条件。通过对比实际开工日期（或首次付款日期）与施工许可证发放日期，若前者早于后者，即认定存在无证施工违规。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 未取得施工许可证擅自开工
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七条、第六十四条\"\
    ,\n    \"内容概述\": \"建筑工程开工前，建设单位应当按照国家有关规定向工程所在地县级以上人民政府建设行政主管部门申请领取施工许可证；未取得施工许可证擅自开工的，责令改正，停止施工，可以处以罚款。\"\n  }\n]"
- expression: (合同.签订日期 > 合同.约定履约开始日期) || (合同.签订日期 > 合同.约定履约开始日期) || (首次付款凭证.首次付款日期 < 合同.签订日期)
  description: 合同签订日期晚于约定的或实际的履约开始日期，或者首次付款发生在合同签订之前，表明存在先实施后签合同的情况。任一条件成立即触发疑点。
  audit_item: 合同要素提取
  suspicion: 合同签订时间晚于履约开始日期
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。\"\n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n  \
    \  \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条\",\n    \"内容概述\": \"项目单位应当严格执行招标投标法律法规等有关规定，不得将依法应当招标的"
- expression: (开工报告.实际开工日期 < 评价报告.批复日期) || (开工报告.实际开工日期 < 许可证.发证日期) || (开工报告.实际开工日期 < 许可证.发证日期) || (开工报告.实际开工日期 < 批准文件.批准日期)
  description: 实际开工日期早于任一法定前置许可的批准日期，即构成未批先建。重点关注环境影响评价和施工许可证的取得时间，二者为法定开工必要条件。
  audit_item: 违规开展重大工程建设
  suspicion: 未履行法定建设程序即开工建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\": \"主席令第48号（2018修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"建设单位未依法报批建设项目环境影响报告书、报告表，擅自开工建设的，由县级以上生态环境主管部门责令停止建设，处建设项目总投资额百分之一以上百分之五以下的罚款，并可以责令恢复原状。\"\
    \n  }\n]"
