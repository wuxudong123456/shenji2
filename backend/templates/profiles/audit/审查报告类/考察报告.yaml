name: audit/审查报告类/考察报告
type: model
description: 从审查报告类类文档（考察报告）中提取结构化元数据。涵盖字段如：内容摘要、日期、标题。文档范围包括：考察报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 考察报告
  member_count: 1
  member_details:
  - 考察报告
output:
  fields:
  - name: 内容摘要
    type: string
    description: 提取 内容摘要 的文本值
  - name: 日期
    type: date
    description: 提取 日期 的日期值，格式 YYYY-MM-DD
  - name: 标题
    type: string
    description: 提取 标题 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 公务接待明细台账.接待事由 = '公务考察学习' && (公务活动方案 IS NULL || 签到表 IS NULL || 考察报告 IS NULL || LENGTH(公务接待明细台账.活动内容描述) < 10)
  description: 若接待事由仅为笼统的“考察学习”，缺乏具体的调研题目、学习内容文字描述，且无法提供对应的活动方案、参会签到或成果报告中的任意两项证明，视为虚构活动疑点。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务考察学习活动缺乏具体内容涉嫌虚构
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"无公函的公务活动和来访人员一律不予接待；接待单位应当根据规定的接待范围，严格接待审批控制，建立公务接待清单制度。\"\n  }\n]"
