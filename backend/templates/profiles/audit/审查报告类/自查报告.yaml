name: audit/审查报告类/自查报告
type: model
description: 从审查报告类类文档（自查报告）中提取结构化元数据。涵盖字段如：企业上报完成量、借调情况说明、内定线索、制度缺陷记录、审批流程日期、差异说明、报告出具日期、整改结果说明。文档范围包括：内部审计或自查报告、单位年度编制使用情况自查报告、去产能年度考核自查报告、整改责任部门自查报告、脱钩专项审计自查报告、自查报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 审批
- 整改
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 自查报告
  member_count: 1
  member_details:
  - 内部审计或自查报告
  - 单位年度编制使用情况自查报告
  - 去产能年度考核自查报告
  - 整改责任部门自查报告
  - 脱钩专项审计自查报告
  - 自查报告
output:
  fields:
  - name: 企业上报完成量
    type: string
    description: 提取 企业上报完成量 的文本值
  - name: 借调情况说明
    type: string
    description: 提取 借调情况说明 的文本值
  - name: 内定线索
    type: string
    description: 提取 内定线索 的文本值
  - name: 制度缺陷记录
    type: string
    description: 提取 制度缺陷记录 的文本值
  - name: 审批流程日期
    type: date
    description: 提取 审批流程日期 的日期值，格式 YYYY-MM-DD
  - name: 差异说明
    type: string
    description: 提取 差异说明 的文本值
  - name: 报告出具日期
    type: date
    description: 提取 报告出具日期 的日期值，格式 YYYY-MM-DD
  - name: 整改结果说明
    type: boolean
    description: 提取 整改结果说明 的布尔值（是/否）
  - name: 脱钩情况声明
    type: string
    description: 提取 脱钩情况声明 的文本值
  - name: 超编录用的披露情况
    type: string
    description: 提取 超编录用的披露情况 的文本值
  - name: 超编披露情况
    type: string
    description: 提取 超编披露情况 的文本值
  - name: 违规事项披露
    type: string
    description: 提取 违规事项披露 的文本值
  - name: 退款后资金去向说明
    type: number
    description: 提取 退款后资金去向说明 的数值（含单位，如万元、吨等）
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 公务接待管理制度文件 IS NULL OR 公务接待管理制度文件.接待标准条款 IS NULL OR 公务接待管理制度文件.审批权限条款 IS NULL OR 公务接待管理制度文件.禁止事项条款 IS NULL
  description: 制度文件缺失，或制度中未包含接待标准、审批流程、禁止事项等核心条款，即判定为制度不健全。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务接待管理制度不健全
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第四条、第五条\",\n    \"内容概述\": \"各级党政机关应当建立健全公务接待管理制度，明确接待范围、标准、审批程序、经费管理、监督检查等内容。\"\n  }\n]"
- expression: (差异条款.合同条款 >= 1) && (沟通记录.评标前合作记录 == 是) && (处理记录.投诉内容 == 是)
  description: 实质性条款差异指价格、付款条件、工期、技术标准等关键内容发生变化；评标前沟通指招标公告发布前已有接触记录；未中标人投诉中直接指认内定。三项条件同时满足，可认定为内定并违法谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人提前内定中标人并通过谈判变更合同条款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  }\n]"
- expression: (业务主管单位.业务主管单位 IS NOT NULL AND 业务主管单位.业务主管单位 包含 行政机关名称) OR (关系类型、脱钩状态.关系类型 IN ('主办', '主管', '联系', '挂靠') AND 关系类型、脱钩状态.脱钩状态
    != '已完成')
  description: 章程或登记证书中仍列示行政机关为业务主管单位，或关联关系对照表中标明存在主办、主管、联系、挂靠关系且脱钩状态未完成，即触发疑点。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 未取消主办主管挂靠关系
  regulation: "[\n  {\n    \"法规名称\": \"行业协会商会与行政机关脱钩总体方案\",\n    \"法规文号\": \"中办发〔2015〕39号\",\n    \"效力级别\": \"党内法规/规范性文件\"\
    ,\n    \"条款号\": \"第二条主要任务（一）机构分离\",\n    \"内容概述\": \"取消行政机关（包括下属单位）与行业协会商会的主办、主管、联系和挂靠关系，行业协会商会依法直接登记和独立运行。\"\n  }\n]"
- expression: 统计表.实有人数 > 统计表.核定编制数
  description: 单位实际在岗人数超过机构编制部门核定的编制总数，即触发超编使用疑点，差值大于0均属违规。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 擅自超编使用工作人员
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十八条\",\n    \"内容概述\": \"地方各级人民政府行政机构应当严格执行机构编制管理规定，不得在核定的编制外使用工作人员。\"\n  }\n]"
- expression: 存在 信息表.编制归属单位 != 信息表.现工作单位 && (专项台账.批准手续 || 专项台账.借调期限 > 规范期限)
  description: 人员编制在基层单位但实际在上级单位工作，且存在无审批借调或超出规定借调期限的，即构成挤占挪用基层编制。规范期限可参照有关借调文件规定，通常为6个月或1年。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 挤占挪用基层编制
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十八条\",\n    \"内容概述\": \"地方各级人民政府行政机构不得混用、挤占、挪用编制。\"\n  }\n]"
- expression: (信息表.进入方式 IN ('录用','调任','转任')) AND (统计表.实有人数 >= 统计表.核定编制数 OR 录用审批记录缺失)
  description: 在编制已满或超编的状态下，仍办理人员录用、调任、转任进人手续，或者录用缺少必要的审批程序，均属违规。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 擅自超编录用调任转任人员
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十八条\",\n    \"内容概述\": \"不得在核定的编制外使用工作人员。\"\n  }\n]"
- expression: EXISTS (整改验收报告或证明材料.整改完成情况='已退回' AND 相关财务凭证的账务调整记录.借方科目 IN ('其他补贴','劳务费','福利费','加班费') AND ABS(相关财务凭证的账务调整记录.金额
    - 以往审计报告.涉及金额) / 以往审计报告.涉及金额 <= 0.1 AND 相关财务凭证的账务调整记录.凭证日期 BETWEEN 整改验收报告或证明材料.退回到账日期 AND 整改验收报告或证明材料.退回到账日期+60 AND (相关财务凭证的账务调整记录.摘要
    LIKE '%补贴%' OR 相关财务凭证的账务调整记录.摘要 LIKE '%发放%'))
  description: 比对已退回资金问题，检查退款后60天内是否存在科目为敏感补贴类、金额与原违规金额偏差不超过10%的新支出，且摘要含补贴发放等关键词，若存在则高度涉嫌以新科目变相重发资金，属于虚假整改。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 通过重列支出科目虚假整改已退回资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"被审计单位应当按照规定时间整改审计查出的问题，将整改情况报告审计机关。审计机关应当对整改情况进行跟踪检查。\"\n  }\n]"
- expression: (整改验收报告或证明材料.电子文件创建日期 > 整改验收报告或证明材料.文件落款日期 AND ABS(整改验收报告或证明材料.电子文件创建日期 - 整改验收报告或证明材料.文件落款日期) > 1) OR (同一日期签发的整改关键文件数量
    >= 5) OR (管理层会议纪要.会议日期 NOT IN (会议室使用登记表.使用日期) AND 管理层会议纪要.会议日期 != 会议室使用登记表.使用日期)
  description: 通过文件元数据日期逻辑（创建晚于落款为后补）、集中补签异常（同一天签发大量整改文件）、会议时间与物理空间使用记录矛盾来识别材料造假。创建日期晚于落款日期且相差超过1天，排除时区等误差；同一日期签发5份及以上为异常集中；会议时间无对应会议室使用记录则存疑。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 整改佐证材料事后补编或造假
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"审计整改情况应当真实、完整，不得弄虚作假。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017修正）\"\
    ,\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十三条\",\n    \"内容概述\": \"伪造、变造会计凭证、会计帐簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\n  }"
- expression: SUM(淘汰清单.实际淘汰产能) < 政策文件.目标任务量（按企业、按设备） OR （淘汰清单.实际关停日期 IS NULL AND 统计表.累计完成量 包含该设备） OR （自查报告.企业上报完成量 > 自查报告.政府核定完成量
    AND 差异率 > 10%）
  description: 通过汇总实际关停的产能与政策下达的任务量比对，若实际完成量低于目标任务量，即构成未足量完成。同时，若任务完成统计表显示某设备已关停，但淘汰清单中缺少对应的实际关停日期或关闭证明，则涉嫌虚报完成；企业自查报告与政府考核结果差异超过10%的，需重点核查是否存在虚假淘汰。
  audit_item: 未按规定落实去产能政策措施
  suspicion: 未按期足量完成去产能任务或虚假淘汰
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于钢铁行业化解过剩产能实现脱困发展的意见\",\n    \"法规文号\": \"国发〔2016〕6号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、主要任务（二）\",\n    \"内容概述\": \"各地区、各企业要严格按照目标任务和时间要求，加大化解过剩产能工作力度，确保完成去产能任务。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于做好2018年重点领域化解过剩产能工作的通知\",\n    \"法规文号\": \"发改运行〔2018〕554号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、认真组织开展化解过剩产"
