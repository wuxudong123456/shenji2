name: audit/审查报告类/整改报告
type: model
description: 从审查报告类类文档（整改报告）中提取结构化元数据。涵盖字段如：历史问题及整改情况、完成整改时间、屡查屡犯标记、整改措施、既往销毁或隐匿问题描述、落实情况、闲置问题整改状态。文档范围包括：内部审计发现问题整改报告、历史问题整改报告、审计整改报告、审计期间相关整改报告、整改报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 整改
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 整改报告
  member_count: 1
  member_details:
  - 内部审计发现问题整改报告
  - 历史问题整改报告
  - 审计整改报告
  - 审计期间相关整改报告
  - 整改报告
output:
  fields:
  - name: 历史问题及整改情况
    type: string
    description: 提取 历史问题及整改情况 的文本值
  - name: 完成整改时间
    type: date
    description: 提取 完成整改时间 的日期值，格式 YYYY-MM-DD
  - name: 屡查屡犯标记
    type: string
    description: 提取 屡查屡犯标记 的文本值
  - name: 整改措施
    type: string
    description: 提取 整改措施 的文本值
  - name: 既往销毁或隐匿问题描述
    type: string
    description: 提取 既往销毁或隐匿问题描述 的文本值
  - name: 落实情况
    type: string
    description: 提取 落实情况 的文本值
  - name: 闲置问题整改状态
    type: boolean
    description: 提取 闲置问题整改状态 的布尔值（是/否）
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (销毁登记表.销毁日期 - 销毁登记表.资料形成日期 < 计算法定保管年限(默认30年)) || (系统操作日志.操作类型（删除/修改）= '删除' AND 系统操作日志.操作对象 NOT IN (销毁登记表.销毁资料名称))
    || (盘点差异分析表.缺失资料名称 IN ('原始凭证','记账凭证','会计账簿','财务报告') AND 盘点差异分析表.差异原因 NOT IN ('已审批销毁','依法移交') AND 借阅调取登记表.借出状态 != '未归还')
    || (涉事人员询问笔录 LIKE '%故意销毁%' OR '%隐匿%')
  description: 1. 销毁登记表中销毁的资料形成到销毁年限短于法定保管年限（凭证、账簿30年，年报永久），无论审批是否齐全，均构成故意销毁；2. 系统日志存在删除操作且删除对象不在正规销毁清册中，视为隐匿销毁；3. 盘点发现重要会计资料缺失，且无合规销毁记录、无借阅记录，疑为故意隐匿；4.
    询问笔录中相关人员承认隐匿或销毁的直接作为线索。
  audit_item: 未按规定保管会计资料，造成会计资料毁损、灭失；隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告
  suspicion: 隐匿或者故意销毁依法应当保存的会计资料
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十四条\",\n    \"内容概述\": \"隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告，构成犯罪的，依法追究刑事责任。尚不构成犯罪的，由县级以上人民政府财政部门予以通报，可以对单位并处五千元以上十万元以下的罚款；对其直接负责的主管人员和其他直接责任人员，可以处三千元以上五万元以下的罚款；属于国家工作人员的，还应当由其所在单位或者有关单位依法给予撤职直至开除的行政处分；其中的会计人员，五年内不"
- expression: (汇总表.评价等次/得分 = '差' || 评价得分 < 60) && (明细表.下一年度预算安排金额 >= 明细表.本年度预算安排金额) || (存在绩效评价结果但未在预算安排文件中体现任何调整)
  description: 评价结果为“差”或得分低于60分的项目，下一年度预算应予以压减，若预算未减少或反而增加，即认定违规。不合理的应用包括未追责、未扣减预算等。
  audit_item: 财政转移支付资金政策绩效评价不规范
  suspicion: 绩效评价结果未有效应用于预算安排
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"绩效评价结果应当作为预算安排、完善政策和改进管理的重要依据。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\"\
    : \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价，并将评价结果作为改进管理和编制下一年度预算的依"
- expression: (资产台账.使用状态 = '闲置' || 闲置资产明细表.闲置时长 >= 365) && (资产使用效率分析表.年使用天数 <= 30 || 资产使用效率分析表.利用率 < 0.05) && (闲置资产专项报告.闲置原因分析不包含'不可抗力'
    && 历史问题整改报告.闲置问题整改状态 = '未整改')
  description: 判定闲置资产并排除不可抗力等合理原因，同时满足连续闲置超过1年、年使用天数低于30天或利用率低于5%的条件，且未被有效整改的，视为严重违规闲置。
  audit_item: 资产管理方面存在的问题
  suspicion: 购置或建成资产长期闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十六条\",\n    \"内容概述\": \"国家出资企业投资应当符合国家产业政策，并按照国家规定进行可行性研究；与他人交易应当公平、有偿，取得合理对价。\"\n  }\n]"
- expression: 土地出让合同或划拨决定书.约定动工日期 IS NOT NULL AND (施工许可证.发证日期 IS NULL OR DATEDIFF(施工许可证.发证日期, 土地出让合同或划拨决定书.约定动工日期) > 365)
    AND 土地利用现状统计表.地块状态 = '闲置'
  description: 认定规则：国有建设用地使用权人超过有偿使用合同或划拨决定书约定的动工开发日期满一年未动工开发，即视为闲置土地。表达式校验：从土地出让合同中提取约定动工日期，若未取得施工许可证或施工许可证发证日期滞后约定动工日期超过365天，且土地利用现状统计表中地块被标记为闲置状态，则判定为违规闲置。
  audit_item: 保障性安居工程项目土地闲置
  suspicion: 保障性安居工程项目土地闲置
  regulation: "[\n  {\n    \"法规名称\": \"闲置土地处置办法\",\n    \"法规文号\": \"国土资源部令第53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二条\",\n    \"内容概述\": \"本办法所称闲置土地，是指国有建设用地使用权人超过国有建设用地使用权有偿使用合同或者划拨决定书约定、规定的动工开发日期满一年未动工开发的国有建设用地。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第三十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十八条\",\n    \"\
    内容概述\":"
