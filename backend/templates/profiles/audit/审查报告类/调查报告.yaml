name: audit/审查报告类/调查报告
type: model
description: 从审查报告类类文档（调查报告）中提取结构化元数据。涵盖字段如：产量、企业清单、保护区内污染源类型、农户分布、农药品种、商业模式、土壤、尽调团队资质。文档范围包括：农业主管部门年度调查报告、农民工返乡创业需求调查报告、受让方尽职调查报告、尽职调查报告、水源地周边污染源调查报告、污水治理现状调查报告、调查报告、资源环境调查报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 验收
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 调查报告
  member_count: 1
  member_details:
  - 农业主管部门年度调查报告
  - 农民工返乡创业需求调查报告
  - 受让方尽职调查报告
  - 尽职调查报告
  - 水源地周边污染源调查报告
  - 污水治理现状调查报告
  - 调查报告
  - 资源环境调查报告
