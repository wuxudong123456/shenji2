    description: 提取 资金来源说明 的文本值
  - name: 资金缺口统计
    type: string
    description: 提取 资金缺口统计 的文本值
  - name: 距取水口距离
    type: string
    description: 提取 距取水口距离 的文本值
  - name: 销量
    type: string
    description: 提取 销量 的文本值
  - name: 需求行业分布
    type: string
    description: 提取 需求行业分布 的文本值
  - name: 高风险企业清单
    type: string
    description: 提取 高风险企业清单 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
