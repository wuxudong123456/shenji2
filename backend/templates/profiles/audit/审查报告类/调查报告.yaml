    required: false
violations:
- expression: ( 受让方名称、最终控制人国籍、标的企业所属行业代码、合规审查结论.标的企业所属行业代码 IN (禁止投资领域条目、限制投资领域及股比限制.禁止投资领域条目) ) && ( 禁止投资领域条目、限制投资领域及股比限制.特殊审批文件文号
    IS NULL || 禁止投资领域条目、限制投资领域及股比限制.特殊审批文件文号 == '' )
  description: 该表达式检测外资受让方是否违规进入禁止类投资领域。首先，将交易标的所属行业代码与国务院发布的最新版《外商投资准入特别管理措施（负面清单）》中的禁止类行业代码进行精确比对。若匹配，则核查企业是否持有国务院等相关最高权限机构的特批文件。若无任何审批文件，直接定性为严重违规。对于限制类领域，则需进一步验证是否有审批，且外资股比是否超出限制。
  audit_item: 违规处置重大资产
  suspicion: 违规向外资方转让禁止领域资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国外商投资法\",\n    \"法规文号\": \"主席令第26号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"外国投资者并购中国境内企业或者以其他方式参与经营者集中的，应当依照反垄断法的规定接受经营者集中审查。外商投资准入负面清单规定禁止投资的领域，外国投资者不得投资。\"\n  },\n \
    \ {\n    \"法规名称\": \"外商投资准入特别管理措施（负面清单）\",\n    \"法规文号\": \"国家发展和改革委员会 商务部令\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"全文\","
- expression: SELECT 分析表.项目名称, 分析表.预期IRR与实际IRR, 分析表.预期IRR与实际IRR FROM 分析表 INNER JOIN 统计表 ON 分析表.项目名称 = 统计表.项目名称 LEFT JOIN 调查报告
    ON 分析表.项目名称 = 调查报告.项目名称 WHERE 统计表.损失率 > 0.20 && (ABS(分析表.预期IRR与实际IRR - 分析表.预期IRR与实际IRR) > 0.10 || 分析表.预期回收期与实际回收期 > 分析表.预期回收期与实际回收期
    * 2) && 调查报告.已识别的重大风险点 IS NOT NULL && 专项说明.损失原因分析 NOT LI
  description: 该表达式筛查投资损失率超过20%的项目，且实际收益率与预期严重偏离（IRR差值超10个百分点或回收期超预期2倍），同时尽调报告已提前揭示重大风险，但决策时未充分考虑，排除了明确由不可抗力导致损失的情况。满足以上所有条件即可判定为存在违规决策导致重大损失的疑点。
  audit_item: 违规进行重大投资
  suspicion: 违规决策开展投资造成重大资产损失
  regulation: "[\n  {\n    \"法规名称\": \"中央企业违规经营投资责任追究实施办法（试行）\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第37号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"在投资并购方面，未按规定开展尽职调查，或尽职调查未进行风险分析等，造成较大资产损失或其他严重不良后果的，应当追究相关责任人责任。\"\n \
    \ }\n]"
- expression: SELECT 投资协议.项目名称, 投资协议.投资标的, 统计表.与主业的关联度描述 FROM 投资协议 INNER JOIN 调查报告 ON 投资协议.投资项目最终标的公司及业务描述 = 调查报告.被投资企业的实际经营范围
    LEFT JOIN 国资委批复的主业范围关键词、主业目录 ON ... WHERE (调查报告.被投资企业的实际经营范围 NOT LIKE '%'||国资委批复的主业范围关键词、主业目录.国资委批复的主业范围关键词||'%' AND 统计表.与主业的关联度描述
    IS NULL) || 调查报告.被投资企业的实际经营范围 REGEXP MATCH (负面清单.禁止及限制类投
  description: 该表达式通过模糊匹配，筛查投资标的公司的工商注册经营范围，与企业经国资委认定的主业范围及《市场准入负面清单》进行比对。若项目既不属于主业，也无法提供合理的投资方向合规性说明以证明其符合战略性新兴产业等高相关度，或者直接触及负面清单中的禁止类领域，则判定为违规。
  audit_item: 违规进行重大投资
  suspicion: 违规决策投资非主业与禁止类项目
  regulation: "[\n  {\n    \"法规名称\": \"关于中央企业加强参股管理有关事项的通知\",\n    \"法规文号\": \"国资发改革〔2019〕126号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"严把主业投资方向。中央企业不得为规避主业监管，通过参股等方式开展中央企业投资项目负面清单规定的商业性房地产等禁止类业务。\"\n  }\n]"
- expression: SELECT 分析表.预期销售额/净利 vs. 实际完成率, 分析表.预期销售额/净利 vs. 实际完成率, 验证表.关键假设是否被外部证据支持 FROM 分析表 INNER JOIN 验证表 ON 分析表.预期销售额/净利
    vs. 实际完成率 = 验证表.关键假设是否被外部证据支持 LEFT JOIN 调查报告 ON 分析表.预期销售额/净利 vs. 实际完成率 = 调查报告.被投资企业的最终实际控制人声明及核实记录 WHERE 分析表.预期销售额/净利
    vs. 实际完成率 > 0.50 AND (验证表.关键假设是否被外部证据支持 = '不合理' || 调查报告.尽调团队资质 = '不满足
  description: 该表达式用于识别因前期论证不充分导致的投资失败。当一项投资的实际业绩完成率不足预期的50%，且经过复审，可研报告的关键假设被评判为不合理（如技术可行性存疑），或者尽职调查报告在团队独立性、资质或覆盖范围上存在根本性缺陷时，可判定为可研与尽调流于形式的典型表现。
  audit_item: 违规进行重大投资
  suspicion: 可行性研究及尽职调查流于形式导致投资失败
  regulation: "[\n  {\n    \"法规名称\": \"中央企业违规经营投资责任追究实施办法（试行）\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第37号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"在投资并购方面，对投资项目未进行必要的尽职调查，或尽职调查未进行风险分析等，存在重大疏漏；可行性研究报告编制依据不充分、内容不完整等，造成较大资产损失或其他严重不良后果的，应当追究责任。\"\
    \n  }\n]"
- expression: SELECT 其他.穿透后的最终受益人国籍/注册地, 投资协议.投资项目最终标的公司及业务描述, 代持协议.代持人 FROM 其他 INNER JOIN 投资协议 ON 投资协议.投资项目最终标的公司及业务描述 =
    投资协议.投资标的 WHERE 其他.穿透后的最终受益人国籍/注册地 IN ('外商投资负面清单中限制/禁止的领域对应的投资主体') AND 其他.控制路径 LIKE '%代持%' AND 代持协议.代持人 != 其他.穿透后的最终受益人国籍/注册地
  description: 该表达式专门用于挖掘隐藏的股权代持。当穿透后的最终受益人国籍显示为《外商投资准入特别管理措施（负面清单）》中禁止或限制投资领域的境外主体，且其投资是通过境内企业或个人代持的方式实现的，即代持方与最终受益人不一致，则构成典型的规避外资准入监管的违规行为。
  audit_item: 违规进行重大投资
  suspicion: 违规决策为外资代持限制性文化机构股权
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国外商投资法\",\n    \"法规文号\": \"中华人民共和国主席令第二十六号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十八条\",\n    \"内容概述\": \"外国投资者投资负面清单规定禁止投资的领域，由国务院商务主管部门责令停止投资活动，限期处分股份、资产或者采取其他必要措施，恢复到实施投资前的状态。\"\n  }\n]"
- expression: 调查报告编制日期.调查报告编制日期 IS NULL || (调查报告编制日期.调查报告编制日期 < 当前日期 - 180天 && 年报.统计数据年份 != 本年度)
  description: 主管部门应至少每半年进行一次调查统计。若调查报告缺失,或最近调查日期距离当前超过180天且当年度统计年报未生成,可判定未履行定期统计职责。阈值180天源自条例要求每季度或半年度应有工作记录。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 农业主管部门未定期调查统计农药产销情况
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十一条\",\n    \"内容概述\": \"县级以上人民政府农业主管部门应当定期调查统计农药生产、销售、使用情况,建立农药诚信档案,并及时向社会公布相关信息。\"\n  }\n]"
- expression: (农民工返乡创业需求调查报告缺失) || ((人员ID、创业行业、创业时间、经营状态、创业起始日期、创业状态.创业行业 ∩ 调查时间、样本数量、需求行业分布、资金缺口统计.需求行业分布).数量 / 调查时间、样本数量、需求行业分布、资金缺口统计.样本数量
    < 0.6)
  description: 若未形成书面需求调查报告，或调查报告中列出的主要需求行业与统计表反映的实际创业行业分布重合度低于60%，则判定为未摸清总体状况和基本需求，导致政策供给与需求错配。
  audit_item: 新型职业农民培育、农民工技能提升和返乡创业就业不符合相关规定
  suspicion: 未开展返乡创业需求调查或调查结果与实际不符
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于支持农民工等人员返乡创业的意见\",\n    \"法规文号\": \"国办发〔2015〕47号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、主要任务 (一)\",\n    \"内容概述\": \"各地要组织力量，对返乡创业情况进行一次全面调查摸底，摸清返乡创业人员底数、创业意愿、培训需求、政策诉求等。\"\n  }\n]"
- expression: (台账表.行政村/自然村名称 IS NULL) || (台账表.农户数量字段为空 || 台账表.排放方式字段为空 || 台账表.管网覆盖率字段为空) || (ABS(台账表.已建处理设施数量与位置 - 检查记录.实地设施实际运行状况)
    / 检查记录.实地设施实际运行状况 > 0.3) || (台账表.设立台账日期 > 监测报告.规划批复日期)
  description: 台账完全缺失；或关键字段（农户数量、排放方式等）为空值；或台账记录的设施数量与现场核查数量偏差超过30%（差异值/现场核查值>0.3），表明数据严重失真；或台账建立日期晚于规划批复日期，存在事后补建倒签嫌疑。以上任一条件触发即为违规。
  audit_item: 污水治理规划不符合规定
  suspicion: 未建立农村污水现状基础台账
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进农村生活污水治理的指导意见\",\n    \"法规文号\": \"环办土壤〔2021〕24号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条第（二）项\",\n    \"内容概述\": \"全面摸清辖区内农村生活污水治理现状，建立详细的基础信息台账，做到底数清、情况明。\"\n  }\n]"
- expression: 主导产业定位.主导产业定位 NOT IN 政策文件.重点支持产业目录 OR 项目总进度计划.市场分析章节缺失 OR 项目总进度计划.资源匹配度评估结论='不适宜' OR 项目总进度计划.专家论证意见存在重大反对意见且未采纳
  description: 主导产业未列入地方政策支持清单，或缺乏市场需求调研支撑，或资源评估结论为不适宜却强行立项，或专家重大反对意见被忽略，均为定位不准确。
  audit_item: 现代农业产业园（集群、强镇）规划、设计、立项不科学
  suspicion: 现代农业产业园功能定位脱离实际
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部关于开展国家现代农业产业园创建工作的通知\",\n    \"法规文号\": \"农计发〔2017〕4号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、创建条件（一）\",\n    \"内容概述\": \"产业园要立足当地资源禀赋、产业基础，科学规划主导产业，具有较强的市场竞争力。\"\n  }\n]"
- expression: (批复文件.批复文号 IS NULL) || (信息表.划定面积 < 取水口保护最低要求面积) || (批复文件.划定时间 > 供水工程运营时间) || (信息表.标志设置情况 < 80%)
  description: 判定逻辑：1.批复文件缺失直接认定为违规；2.划定面积未达到《饮用水水源保护区划分技术规范》要求；3.保护区划定晚于供水工程运营时间，属先供水后保护；4.现场边界标志、隔离设施缺失率>20%为重大风险。
  audit_item: 水质保障和工程运营管理不到位
  suspicion: 未按规定划定饮用水源保护区或保护范围
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"2017年6月27日修正版\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第六十三条、第六十四条\",\n    \"内容概述\": \"国家建立饮用水水源保护区制度；饮用水水源保护区分为一级、二级保护区；在保护区内禁止设置排污口和从事可能污染饮用水水体的活动。\"\n  },\n  {\n    \"\
    法规名称\": \"饮用水水源保护区划分技术规范\",\n    \"法规文号\": \"HJ 338-2018\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"4.1、4.2\",\n    \"\
    内容"
- expression: (论证报告.编制单位及资质 != 要求资质) || (论证报告.污染源风险评估章节 IS NULL) || (评价报告.评价范围未覆盖水源地) || (调查报告.高风险企业清单 != 论证报告.污染源风险评估章节)
  description: 判定逻辑：1.编制单位无水资源论证资质直接违规；2.论证报告缺失污染源风险评估，属重大遗漏；3.水源地未纳入环境影响评价范围；4.污染源调查报告中的高风险源数量与论证报告不一致，说明风险未充分考虑。
  audit_item: 水质保障和工程运营管理不到位
  suspicion: 水资源论证不科学，忽视水源地污染风险
  regulation: "[\n  {\n    \"法规名称\": \"建设项目水资源论证管理办法\",\n    \"法规文号\": \"水利部令第15号（2015年修订）\",\n    \"效力级别\": \"部门规章\",\n \
