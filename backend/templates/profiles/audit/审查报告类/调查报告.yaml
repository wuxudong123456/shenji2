  fields:
  - name: 产量
    type: string
    description: 提取 产量 的文本值
  - name: 企业清单
    type: string
    description: 提取 企业清单 的文本值
  - name: 保护区内污染源类型
    type: string
    description: 提取 保护区内污染源类型 的文本值
  - name: 农户分布
    type: string
    description: 提取 农户分布 的文本值
  - name: 农药品种
    type: string
    description: 提取 农药品种 的文本值
  - name: 商业模式
    type: string
    description: 提取 商业模式 的文本值
  - name: 土壤
    type: string
    description: 提取 土壤 的文本值
  - name: 尽调团队资质
    type: string
    description: 提取 尽调团队资质 的文本值
  - name: 已识别的重大风险点
    type: string
    description: 提取 已识别的重大风险点 的文本值
  - name: 成果验收情况
