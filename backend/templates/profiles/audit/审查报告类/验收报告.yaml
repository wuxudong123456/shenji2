name: audit/审查报告类/验收报告
type: model
description: 从审查报告类类文档（验收报告）中提取结构化元数据。涵盖字段如：三方签章完整情况、主要功能、主要工程量、主要构筑物实际数量及规格、主要设备清单、付款节点要求、使用状态、分产业实际产值。文档范围包括：三通两平台建设项目验收报告、交通安全及防护设施建设验收报告、交通安全及防护设施验收报告、企业环保验收报告、住建部门竣工验收报告、供水工程验收报告、保护工程项目验收报告、公益性公墓建设验收报告、农业电气化设备验收报告、农村厕所建设项目验收报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 付款
- 合同
- 安全
- 工程
- 元数据提取
