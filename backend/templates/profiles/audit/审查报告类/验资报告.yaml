name: audit/审查报告类/验资报告
type: model
description: 从审查报告类类文档（验资报告）中提取结构化元数据。涵盖字段如：出资验资结论、实收资本、实缴日期、实际到位资本金金额、审定的实收资本金金额、批复文号、资本变动情况、资本金来源性质。文档范围包括：合作社年度财务审计报告或验资报告、项目验资报告、验资报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 金额
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 验资报告
  member_count: 1
  member_details:
  - 合作社年度财务审计报告或验资报告
  - 项目验资报告
  - 验资报告
output:
  fields:
  - name: 出资验资结论
    type: string
    description: 提取 出资验资结论 的文本值
  - name: 实收资本
    type: string
    description: 提取 实收资本 的文本值
  - name: 实缴日期
    type: date
    description: 提取 实缴日期 的日期值，格式 YYYY-MM-DD
  - name: 实际到位资本金金额
    type: number
    description: 提取 实际到位资本金金额 的数值（含单位，如万元、吨等）
  - name: 审定的实收资本金金额
    type: number
    description: 提取 审定的实收资本金金额 的数值（含单位，如万元、吨等）
  - name: 批复文号
    type: string
    description: 提取 批复文号 的文本值
  - name: 资本变动情况
    type: string
    description: 提取 资本变动情况 的文本值
  - name: 资本金来源性质
    type: string
    description: 提取 资本金来源性质 的文本值
  - name: 验资结论
    type: string
    description: 提取 验资结论 的文本值
  - name: 验资账户
    type: string
    description: 提取 验资账户 的文本值
  - name: 验资金额
    type: number
    description: 提取 验资金额 的数值（含单位，如万元、吨等）
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (实收资本金累计到位总额 / 项目总投资额) < 政策文件中对应项目所属行业的最低资本金比例要求
  description: 计算项目实际资本金比例（实收资本金/项目总投资），若该比例低于国务院及相关部委发布的行业最低资本金比例标准，则判定为违规。阈值标准依据《国务院关于加强固定资产投资项目资本金管理的通知》等文件。
  audit_item: 项目资本金不符合要求
  suspicion: 项目最低资本金比例不符合规定
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于加强固定资产投资项目资本金管理的通知\",\n    \"法规文号\": \"国发〔2019〕26号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"进一步完善投资项目资本金制度，明确规定了港口、沿海及内河航运、机场、铁路、公路、房地产开发等多个行业和领域投资项目的最低资本金比例。\"\n  }\n]"
- expression: 批复文件.批准转增金额 > 0 && ( (COALESCE(SUM(明细账.贷方金额) FILTER (WHERE 摘要 ~ 批复文件.批复文号), 0) + COALESCE(SUM(明细账.贷方金额) FILTER
    (WHERE 摘要 ~ 批复文件.批复文号), 0)) < 批复文件.批准转增金额 || EXISTS (SELECT 1 FROM 明细账 WHERE 摘要 ~ 批复文件.批复文号 AND 金额 > 0) || EXISTS (SELECT
    1 FROM 明细账 WHERE 摘要 ~ 批复文件.批复文号 AND 贷方金额 > 0) )
  description: 政府批复明确要求将特定国有权益转增资本金时，若实收资本和资本公积中对应的贷方增加合计未达到批复金额，或相关资金被错误记入营业外收入、其他应付款等科目，即判定为未按规定转增资本金。差异大于0或损益/负债科目出现对应金额即触发疑点。
  audit_item: 未按规定核算所有者权益
  suspicion: 国有权益未按规定转增资本金
  regulation: "[\n  {\n    \"法规名称\": \"企业财务通则\",\n    \"法规文号\": \"财政部令第41号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\"\
    ,\n    \"内容概述\": \"企业应当加强资本管理。国家以各种形式投入企业的资本，应当由国有资产监督管理机构监督企业按照规定转增注册资本或者增加资本公积。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第16号——政府补助\"\
    ,\n    \"法规文号\": \"财会〔2017〕15号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"企业收到政府投入的资本性款"
- expression: (明细表.出资金额 > 0 AND NOT EXISTS 对应银行流水) OR (明细表.出资方式 = '实物' AND NOT EXISTS 评估报告) OR (银行流水记录（收款账户、金额、时间）.金额 = 明细表.出资额
    AND 时间 - 出资日期 <= 7)
  description: 核查出资真实性：货币出资必须有对应的银行收款流水或符合规定的现金收据；实物出资必须经有资质机构评估并办理产权转移；若资金到账后短期内（如7日内）等额转出，视为抽逃出资。任一情形触发疑点。
  audit_item: 农民专业合作社认定不合规
  suspicion: 成员虚假出资或出资方式不合规
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第83号（2017年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"设立农民专业合作社应当向工商行政管理部门提交出资清单等文件。成员以其账户内记载的出资额和公积金份额为限对农民专业合作社承担责任，出资应当真实、足额。\"\
    \n  }\n]"
- expression: (担保公司.实收资本 < 资质要求.最低注册资本要求) || (流水.交易日期 - 验资报告.实缴日期 <= 60 && 流水.贷方金额 >= 验资报告.验资金额*0.9 && 流水.对方户名 IN (股东名册))
  description: 实收资本低于当地公积金中心规定的担保公司最低注册资本限额（如地方要求1亿元），或验资后60日内有大额资金转回股东账户且金额达到或超过验资金额的90%，即认定为资本不实或抽逃出资。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 担保公司注册资本不实或低于监管标准
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"设立融资担保公司应当符合最低限额的实缴注册资本要求，具体限额由省、自治区、直辖市根据本地实际确定，但不得低于人民币2000万元。\"\n  }\n]"
