name: audit/审查报告类/检测报告
type: model
description: 从审查报告类类文档（检测报告）中提取结构化元数据。涵盖字段如：CMA认证编号、COD、不合格项、不合格项描述、不合格项数、主要检测人员姓名、主要生产设备及产能、主要设备清单。文档范围包括：储备猪肉质量检测报告、公路质量检测报告、农产品质量检测报告、农膜生产企业的产品质量检测报告、农药质量检测报告（第三方机构）、历次检测报告、土壤检测报告、土壤质量检测报告、工程施工质量检测报告、工程质量检测报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 人员
- 工程
- 元数据提取
