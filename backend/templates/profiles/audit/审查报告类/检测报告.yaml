- expression: (质量检测报告.检测指标名称 = '道路厚度' AND 质量检测报告.实测值 < 质量检测报告.设计标准值) || (质量检测报告.检测指标名称 = '混凝土强度' AND 质量检测报告.实测值 < 质量检测报告.设计标准值)
    || (质量检测报告.检测指标名称 = '灌溉保证率' AND 质量检测报告.实测值 < 质量检测报告.设计标准值)
  description: 工程质量核心指标任意一项实测值低于设计要求，且监理整改记录未显示已完成整改或整改验收不合格，即判定为质量不达标。涉及道路、水利等关键设施。
  audit_item: 不符合高标准农田建设相关规定的行为
  suspicion: 建设标准低、质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"高标准农田建设质量管理办法（试行）\",\n    \"法规文号\": \"农建发〔2021〕1号\",\n    \"效力级别\": \"规范性文件\",\n  \
    \  \"条款号\": \"第二十一条\",\n    \"内容概述\": \"工程质量未达到设计要求和合同约定标准的，项目法人应当要求施工单位返工处理，并承担相应责任。\"\n  }\n]"
- expression: (检测报告.检测频次 < 规范要求最低频次) OR (影像资料.签证签字盖章完整性 OR 时间水印) OR (证明文件.检验批次 不符全批次必检要求 OR 合格证真伪) OR (管理台账.存在问题数 > 0 AND
    整改状态（已闭环/未闭环） != '已闭环') OR (汇总表.评估结论 = '不合格' AND 检测报告.检测结果 = '合格')
  description: 通过检测频次不足、隐蔽工程记录造假、材料未全检、整改未闭环、第三方与自检结果矛盾等多重条件识别质量作弊。任一条件触发即生成疑点，多个条件同时触发判定为高风险。
  audit_item: 农村供水工程建设不符合相关规定
  suspicion: 工程施工质量过程管理不合规
  regulation: "[\n  {\n    \"法规名称\": \"《建设工程质量管理条例》\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十条、第三十一条\",\n    \"内容概述\": \"施工单位必须对隐蔽工程在隐蔽前进行验收并记录，验收记录应当真实、完整；工程使用的材料、构配件必须进行检验，未经检验或检验不合格的不得使用。\"\n  },\n  {\n\
    \    \"法规名称\": \"《水利工程质量管理规定》\",\n    \"法规文号\": \"水利部令第52号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十八条\",\n    \"\
    内容概述\":"
- expression: (原始记录.检测数值 != 检测报告.检测数值) || ABS(检测报告.检测数值 - 检测报告.检测数值) > 允许偏差 || (检测报告.检测数值连续多日完全相同) || (记录表.余氯检测值 < 0.3 但 检测报告.检测指标达标)
  description: 1.篡改数据：原始记录与正式报告数值不一致；2.与第三方检测结果偏离：同时间、同采样点的自检值与第三方检测值偏差超过20%(或测量不确定度)可判断为造假；3.数据雷同：连续多日检测数值完全一样，不符合水质波动特性；4.逻辑矛盾：消毒剂投加量不足或余氯极低，但菌落总数却合格，违背工艺原理。以上任一条件触发即疑为弄虚作假。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 水质检测数据弄虚作假
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第七十二条\",\n    \"内容概述\": \"饮用水供水单位应当对供水水质负责，确保水质符合国家卫生标准，不得瞒报、谎报或者迟报水质信息。\"\n  },\n  {\n    \"法规名称\": \"检验检测机构监督管理办法\"\
    ,\n    \"法规文号\": \"国家市场监督管理总局令第39号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"检验检测机构不得出具虚假检验检"
- expression: (消毒登记台账.消毒日期 / 管理制度.规定消毒频次（如公共区域每日≥2次）) < 0.8
  description: 应消毒次数依据机构依法建立的卫生制度确定，如规定公共活动区域每日消毒不少于2次，房间每周不少于3次等。月度消毒执行率低于80%即视为未定期消毒清洗；若同期出现感染事件或第三方检测不合格，则风险等级上调。
  audit_item: 农村养老服务政策实施不规范、建设质量不达标
  suspicion: 养老机构未按规定对场所物品进行消毒清洗
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十条\",\n    \"内容概述\": \"养老机构应当建立卫生消毒制度，定期对老年人活动、生活场所和物品进行消毒和清洗，防止疾病传播。\"\n  }\n]"
- expression: (专项协议缺失 || 登记表中月度记录缺失 >= 2次) || (检测报告.渗滤液铅、镉、汞等重金属含量超标) || (分析报告.生活垃圾中有毒有害垃圾混入比例 > 0.5%)
  description: 未签订无害化处理协议或收集运输台账月缺失2次以上，或终端渗滤液重金属超标，或混入比例超过0.5%，即判定有毒有害垃圾未落实单独处理。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 有毒有害垃圾未单独分类处理
  regulation: "[\n  {\n    \"法规名称\": \"《农药包装废弃物回收处理管理办法》\",\n    \"法规文号\": \"农业农村部令2020年第6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十条\",\n    \"内容概述\": \"农药使用者应当妥善收集农药包装废弃物，不得随意丢弃；应分类收集移交至回收点，禁止混入生活垃圾。\"\n  }\n]"
- expression: (产生水体、底泥数量(吨).最终去向 = '河岸堆放' || 产生水体、底泥数量(吨).接收单位 IS NULL) && (重金属含量（如镉、汞、铅）.重金属含量（如镉、汞、铅） > 农用污泥污染物控制标准.限值 ||
    影像资料.防渗设施 = '无')
  description: 表达式判定：首先，核对运输记录，底泥最终去向为‘河岸边简易堆放’或缺乏明确的、有资质的接收单位；其次，同时满足底泥检测报告显示污染物含量超标，或现场勘查影像资料证实堆放点无防渗膜等任何防渗漏措施。两者构成“且”关系，判定为违规处置，存在二次污染风险。
  audit_item: 农村黑臭水体治理不到位
  suspicion: 清淤底泥违规堆放导致二次污染
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"中华人民共和国主席令第43号\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第二十条、第二十一条\",\n    \"内容概述\": \"产生、收集、贮存、运输、利用、处置固体废物的单位和其他生产经营者，应当采取防扬散、防流失、防渗漏或者其他防止污染环境的措施。禁止向江河、湖泊、渠道、水库及其最高水位线以下的滩地和岸坡以及法律法规规定的其他地点倾倒、堆放、贮存固体废物。\"\
    \n  }\n]"
- expression: (检测报告.实测厚度 < 0.010mm) || (销售台账.标注厚度 < 0.010mm) || (抽检记录.实测厚度 < 0.010mm) || (产品清单.实测厚度 < 0.010mm) && (产品类别 ==
    '农用薄膜')
  description: 依据国家标准，农用薄膜厚度不得小于0.010mm。若质检报告、台账标注厚度、市场监管抽检实测厚度任一小于0.010mm，即判定违规。同时可进一步比对标注厚度与实测厚度，若标注≥0.010mm而实测<0.010mm，则为虚假标注，属于严重违规。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 生产销售厚度小于0.010mm的农膜
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"农用薄膜生产者应当执行农用薄膜相关标准，确保产品质量合格。禁止生产、销售、使用国家明令禁止或者不符合强制性国家标准的农用薄膜。\"\n\
    \  },\n  {\n    \"法规名称\": \"聚乙烯吹塑农用地面覆盖薄膜\",\n    \"法规文号\": \"GB 13735-2017\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\":\
    \ \"4.4 "
