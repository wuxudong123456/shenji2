name: audit/审查报告类/监理报告
type: model
description: 从审查报告类类文档（监理报告）中提取结构化元数据。涵盖字段如：实际施工队伍人员名单、工程形象进度、施工内容、旁站记录、监理对分包单位资质审查意见、监理旁站记录及结论、监理日志、监理确认。文档范围包括：工程监理报告、监理报告、防渗工程专项施工方案的监理报告、项目监理报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 人员
- 工程
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 监理报告
  member_count: 1
  member_details:
  - 工程监理报告
  - 监理报告
  - 防渗工程专项施工方案的监理报告
  - 项目监理报告
output:
  fields:
  - name: 实际施工队伍人员名单
    type: string
    description: 提取 实际施工队伍人员名单 的文本值
  - name: 工程形象进度
    type: string
    description: 提取 工程形象进度 的文本值
  - name: 施工内容
    type: string
    description: 提取 施工内容 的文本值
  - name: 旁站记录
    type: string
    description: 提取 旁站记录 的文本值
  - name: 监理对分包单位资质审查意见
    type: string
    description: 提取 监理对分包单位资质审查意见 的文本值
  - name: 监理旁站记录及结论
    type: string
    description: 提取 监理旁站记录及结论 的文本值
  - name: 监理日志
    type: string
    description: 提取 监理日志 的文本值
  - name: 监理确认
    type: string
    description: 提取 监理确认 的文本值
  - name: 监理记录的实际进度
    type: string
    description: 提取 监理记录的实际进度 的文本值
  - name: 监理通知单
    type: string
    description: 提取 监理通知单 的文本值
  - name: 考勤记录
    type: string
    description: 提取 考勤记录 的文本值
  - name: 质量问题记录
    type: string
    description: 提取 质量问题记录 的文本值
  - name: 预计完工百分比
    type: string
    description: 提取 预计完工百分比 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (审批文件.审批转固日期 < 监理报告.预计完工百分比) && (工程台账.转固后同一项目发生的大额支出) && (监理报告.预计完工百分比 < 95%)
  description: 转固日期早于工程预计主要完工日期，且转固后仍有大量该工程支出发生，监理报告进度未达95%，表明工程未完工即提前结转，虚增固定资产。
  audit_item: 未按规定核算资产
  suspicion: 在建工程未完工提前转为固定资产
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第4号——固定资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"固定资产应在其达到预定可使用状态时，才能正式确认为资产。\"\n  }\n]"
- expression: 核查表.项目经理.社保缴纳单位 != 资质证书.企业名称 OR 核查表.技术负责人.社保缴纳单位 != 资质证书.企业名称 OR NOT EXISTS ( SELECT 1 FROM 全国建筑市场平台 WHERE 资质证书.编号
    = 平台.编号 AND 资质证书.企业名称 = 平台.企业名称 AND 有效期 >= 施工期 )
  description: 通过比对关键岗位人员社保缴纳单位与中标资质单位是否一致，以及资质证书在全国平台验真或有效期过期，判定是否存在挂靠或借用资质。若社保单位不符或资质无效，即为疑点。
  audit_item: 项目建设不符合规定
  suspicion: 施工单位借用资质承揽工程
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十五条\",\n    \"内容概述\": \"施工单位应当依法取得相应等级的资质证书，并在其资质等级许可的范围内承揽工程。禁止施工单位超越本单位资质等级许可的业务范围或者以其他施工单位的名义承揽工程。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n    \"\
    内容概述\": \"禁止"
- expression: (验收报告.验收结论 != '合格' AND 投入使用日期 IS NOT NULL) OR (投入使用日期 < 验收报告.竣工验收日期) OR (整改跟踪表.整改完成日期 IS NULL AND 投入使用日期 IS
    NOT NULL)
  description: 验收不合格或存在未完整改问题即投入使用，或投入使用时间早于验收合格日期，均视为未验先用。
  audit_item: 项目建设不符合规定
  suspicion: 未经验收或验收不合格擅自投入使用
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"建设工程经验收合格的，方可交付使用。未经验收或者验收不合格的，不得交付使用。\"\n  }\n]"
- expression: 验收报告.签字页 != 设计单位代表签字 OR 验收报告.签字页 != 监理单位代表签字 OR（存在监理通知单.质量缺陷未处理 AND 验收报告.结论 = '合格'） OR （没有隐蔽工程影像资料 AND 验收报告.结论
    = '合格'）
  description: 验收组缺少建设、设计、施工、监理四方任意一方签字；或监理已发出质量缺陷通知但验收记录显示合格；或关键检测记录缺失仍验收合格，均属虚假验收。
  audit_item: 项目建设不符合规定
  suspicion: 虚假验收或验收程序严重违规
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"建设单位收到建设工程竣工报告后，应当组织设计、施工、工程监理等有关单位进行竣工验收。\"\n  },\n  {\n    \"法规名称\": \"房屋建筑和市政基础设施工程竣工验收规定\"\
    ,\n    \"法规文号\": \"建质[2013]171号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"工程竣工验收由建设单位负责组织实施，勘察、设计、"
- expression: (分包工程类别 = '专业工程' AND (分包单位资质等级 < 所需最低等级 OR 分包单位资质.有效期 < 施工期)) OR (分包工程类别 = '劳务作业' AND 分包单位资质 = 无 ) OR (分包单位资质审查记录
    = '未审查' AND 监理意见 = '通过')
  description: 专业分包需具备相应专业承包资质，劳务分包需具备施工劳务资质。若分包单位资质不满足或未审查即进场，属违法分包。
  audit_item: 项目建设不符合规定
  suspicion: 违法分包给不具备资质单位
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第七十八条\",\n    \"内容概述\": \"本条例所称违法分包，是指下列行为：...（二）建设工程总承包合同中未有约定，又未经建设单位认可，承包单位将其承包的部分建设工程交由其他单位完成的；（三）施工总承包单位将建设工程主体结构的施工分包给其他单位的；（四）分包单位将其承包的建设工程再分包的。\"\
    \n  },\n  {\n    \"法规名称\": \"建筑业企业资质管理规定\",\n    \"法规文号\": \"住房和城乡建设部令第22号\""
- expression: 拨付文件.工程进度说明 != 监理报告.监理记录的实际进度 && (合同约定付款比例 × 合同总价 - 累计已付金额) > 拨付文件.申请金额 && 收款金额与付款给委托方的记录.资金最终流向属于关联企业或个人账户
  description: 比对资金申请时申报的工程进度与独立监理报告的实际进度是否一致；若申报进度大幅超前于实际进度，且申请金额超出合同约定应付比例，同时资金后续转入关联企业或个人账户形成回流，则高度疑似虚列支出套取资金。
  audit_item: 挪用或违规使用保障性安居工程专项资金
  suspicion: 虚列工程进度套取专项资金
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程专项资金管理办法\",\n    \"法规文号\": \"财综〔2019〕31号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十五条\",\n    \"内容概述\": \"专项资金支付应严格按照工程进度和合同约定执行，不得超进度、超标准拨付资金。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"单位和个人有虚报、冒领、骗取财政资金行为的，责令改正"
