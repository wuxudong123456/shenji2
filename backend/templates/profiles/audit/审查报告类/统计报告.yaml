name: audit/审查报告类/统计报告
type: model
description: 从审查报告类类文档（统计报告）中提取结构化元数据。涵盖字段如：实际使用率、设备编号、设计使用率。文档范围包括：设施设备使用率统计报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 统计报告
  member_count: 1
  member_details:
  - 设施设备使用率统计报告
output:
  fields:
  - name: 实际使用率
    type: string
    description: 提取 实际使用率 的文本值
  - name: 设备编号
    type: string
    description: 提取 设备编号 的文本值
  - name: 设计使用率
    type: string
    description: 提取 设计使用率 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 设施设备闲置情况统计表.闲置率 > 0.3 || (运营维护成本支出明细表.维护费用 = 0 && 设施设备使用率统计报告.实际使用率 < 0.1)
  description: 闲置率（闲置设备原值/设备总原值）超过30%为异常警戒线；或者连续一个会计年度内未发生任何维护支出且设备实际使用率低于10%，表明设施设备极可能已处于闲置或废弃状态。
  audit_item: 项目实施不合规
  suspicion: 设施设备闲置废弃
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十四条\"\
    ,\n    \"内容概述\": \"项目单位应当加强项目运营管理，确保政府投资项目发挥预期效益，不得擅自改变用途或闲置。\"\n  }\n]"
