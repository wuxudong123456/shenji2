name: audit/审查报告类/月报
type: model
description: 从审查报告类类文档（月报）中提取结构化元数据。涵盖字段如：偏差分析说明、实际里程碑完成日期、已完工程价值、累计已完工程价值。文档范围包括：工程月报、工程量月报、监理月报等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 工程
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 月报
  member_count: 1
  member_details:
  - 工程月报
  - 工程量月报
  - 监理月报
output:
  fields:
  - name: 偏差分析说明
    type: string
    description: 提取 偏差分析说明 的文本值
  - name: 实际里程碑完成日期
    type: date
    description: 提取 实际里程碑完成日期 的日期值，格式 YYYY-MM-DD
  - name: 已完工程价值
    type: string
    description: 提取 已完工程价值 的文本值
  - name: 累计已完工程价值
    type: string
    description: 提取 累计已完工程价值 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (月报.实际里程碑完成日期 - 计划完成日期 > 30 && (会议纪要.预警事项记录 == null || 审批表.批复日期 > 月报.实际里程碑完成日期))
  description: 当任一关键里程碑实际完成时间超出计划30天以上，且项目进度会议纪要中无相应进度预警及纠偏指令，或工期延期审批滞后于实际延误发生时间，判定为进度管理失控，存在未及时识别并纠正偏差的违规行为。
  audit_item: 大型水利工程进度与成本审计
  suspicion: 关键里程碑节点延误未实施纠偏措施
