name: audit/审查报告类/概算
type: model
description: 从审查报告类类文档（概算）中提取结构化元数据。涵盖字段如：分部分项工程量清单、概算总额。文档范围包括：初步设计概算等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 工程
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 概算
  member_count: 1
  member_details:
  - 初步设计概算
output:
  fields:
  - name: 分部分项工程量清单
    type: string
    description: 提取 分部分项工程量清单 的文本值
  - name: 概算总额
    type: number
    description: 提取 概算总额 的数值（含单位，如万元、吨等）
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 施工图预算.预算总额 > 初步设计概算.概算总额 * 1.1 || 设计变更通知单中原因描述包含‘设计遗漏’‘设计错误’‘图纸矛盾’ 且 设计变更涉及金额合计 > 概算总额 * 0.05
  description: 施工图预算超过概算10%以上，或由于设计错误/遗漏产生的设计变更累计金额超过概算5%，表明设计深度不满足规范要求，造成后期大量变更和投资增加。设计遗漏等主观原因导致的变更为重点关注对象。
  audit_item: 重大工程项目全过程审计
  suspicion: 设计深度不足导致重大设计变更和投资超概
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十条\",\n    \"内容概述\": \"勘察、设计单位必须按照工程建设强制性标准进行勘察、设计，并对其勘察、设计的质量负责。设计文件应当符合国家规定的设计深度要求，注明工程合理使用年限。\"\n  },\n  {\n\
    \    \"法规名称\": \"建设工程勘察设计管理条例\",\n    \"法规文号\": \"国务院令第662号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十六条\",\n   \
    \ \"内容概述\": \"编"
