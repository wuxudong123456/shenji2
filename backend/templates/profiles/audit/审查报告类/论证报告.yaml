name: audit/审查报告类/论证报告
type: model
description: 从审查报告类类文档（论证报告）中提取结构化元数据。涵盖字段如：周边人口密度数据、批复文号、是否涉及禁限区、服务半径测算数据、本地适宜放流物种名录、本地适应性分析结论、模型参数、污染源风险评估章节。文档范围包括：增殖放流物种科学论证报告、容积率调整专项论证报告、技术论证报告、文化站（中心）选址论证报告、水资源论证报告、财政承受能力论证报告、项目选址论证报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 项目
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 论证报告
  member_count: 1
  member_details:
  - 增殖放流物种科学论证报告
  - 容积率调整专项论证报告
  - 技术论证报告
  - 文化站（中心）选址论证报告
  - 水资源论证报告
  - 财政承受能力论证报告
  - 项目选址论证报告
output:
  fields:
  - name: 周边人口密度数据
    type: string
    description: 提取 周边人口密度数据 的文本值
  - name: 批复文号
    type: string
    description: 提取 批复文号 的文本值
  - name: 是否涉及禁限区
    type: boolean
    description: 提取 是否涉及禁限区 的布尔值（是/否）
  - name: 服务半径测算数据
    type: string
    description: 提取 服务半径测算数据 的文本值
  - name: 本地适宜放流物种名录
    type: string
    description: 提取 本地适宜放流物种名录 的文本值
  - name: 本地适应性分析结论
    type: string
    description: 提取 本地适应性分析结论 的文本值
  - name: 模型参数
    type: string
    description: 提取 模型参数 的文本值
  - name: 污染源风险评估章节
    type: string
    description: 提取 污染源风险评估章节 的文本值
  - name: 编制单位及资质
    type: string
    description: 提取 编制单位及资质 的文本值
  - name: 规避措施
    type: string
    description: 提取 规避措施 的文本值
  - name: 论证结论
    type: string
    description: 提取 论证结论 的文本值
  - name: 调整后容积率
    type: string
    description: 提取 调整后容积率 的文本值
  - name: 调水规模论证
    type: string
    description: 提取 调水规模论证 的文本值
  - name: 财政支出责任占比
    type: number
    description: 提取 财政支出责任占比 的数值（含单位，如万元、吨等）
  - name: 退水方案
    type: string
    description: 提取 退水方案 的文本值
  - name: 选址位置GPS信息
    type: string
    description: 提取 选址位置GPS信息 的文本值
  - name: 项目所在地水资源量
    type: string
    description: 提取 项目所在地水资源量 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (公报.多年平均降雨量 < 400 || 公报.地下水超采区范围 = '是') && (记录表.用途（冲污/景观补水） IN ('冲污', '景观补水') && (记录表.实际调水量(万吨) > 论证报告.调水规模论证
    * 1.1 || 评估材料.大水面建成后使用率 < 0.5))
  description: 表达式首先判断区域本底是否为缺水地区（年降雨量<400mm或属于地下水超采区）。若是，则检查是否存在调水用于冲污或造景的行为。进一步，判定该调水行为是否存在超额（实际调水量超过批准规模10%以上）或无效（大水面建成后使用率低于50%）的情况。满足缺水条件且存在无效/超额调水行为，即判定为违规。
  audit_item: 农村黑臭水体治理不到位
  suspicion: 缺水地区违规调水冲污或造景
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水法\",\n    \"法规文号\": \"中华人民共和国主席令第74号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十一条\",\n    \"内容概述\": \"开发、利用水资源，应当首先满足城乡居民生活用水，并兼顾农业、工业、生态环境用水以及航运等需要。在干旱和半干旱地区开发、利用水资源，应当充分考虑生态环境用水需要。\"\n  },\n\
    \  {\n    \"法规名称\": \"地下水管理条例\",\n    \"法规文号\": \"中华人民共和国国务院令第748号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十五条\"\
    ,\n  "
- expression: (论证报告.服务半径测算数据 > 服务半径标准.服务半径标准) || (论证报告.周边人口密度数据 < 服务半径标准.人口覆盖要求)
  description: 将选址论证报告中的实际服务半径和覆盖人口数值，与国家或地方建设标准文件中的规定阈值进行比对。服务半径超出上限（如‘不超过3公里’）或覆盖人口低于最低要求即判定为违规。
  audit_item: 文化站（中心）等建设运营管护不符合相关规定
  suspicion: 文化站选址不符合建设标准
  regulation: "[\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\",\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第十条\",\n    \"内容概述\": \"文化站的建设选址，应当符合人口集中、交通便利的原则。\"\n  }\n]"
- expression: 实施方案.放流物种名称 NOT IN 论证报告.本地适宜放流物种名录 && 实施方案.放流物种名称 = 验收单.采购物种名称
  description: 实际采购并放流的物种不属于经过科学论证的本地适宜放流物种名录，即判定为放流外来物种或不合规物种。
  audit_item: 落实渔业资源养护相关政策不到位
  suspicion: 增殖放流外来物种威胁本地生态
  regulation: "[\n  {\n    \"法规名称\": \"水生生物增殖放流管理规定\",\n    \"法规文号\": \"农业部令第20号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"禁止使用外来种、杂交种、转基因种以及其他不符合生态要求的水生生物物种进行增殖放流。\"\n  }\n]"
- expression: (年度政府支出责任 / 一般公共预算支出 > 10%) || (社会资本方实际出资 / 约定出资 < 0.9) || (合同中存在固定回报承诺条款)
  description: PPP项目政府支出责任占比超过一般公共预算支出10%红线，直接违反财经纪律；社会资本方资本金到位率低于90%为出资不实；合同中存在固定回报或政府兜底条款即构成隐性债务。
  audit_item: 项目实施不到位
  suspicion: PPP项目突破财政承受能力红线
  regulation: "[\n  {\n    \"法规名称\": \"政府和社会资本合作项目财政承受能力论证指引\",\n    \"法规文号\": \"财金〔2015〕21号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二十二条、第二十五条\",\n    \"内容概述\": \"每一年度全部PPP项目需要从预算中安排的支出责任，占一般公共预算支出比例应当不超过10%。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于进一步规范地方政府举债融资行为的通知\",\n    \"法规文号\": \"财预〔2017〕50号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"三\",\n    \"内容概述\"\
    : \"地方政"
- expression: 实施方案状态 == '未编制' || (评审结论 != '通过' && 闭环状态 == '未整改' && 进度滞后率 > 0.2) || (技术路线适应性 == '不适用' && 调整记录 == '无')
  description: 未编制实施方案即违规；方案未通过专家评审且未整改闭环仍实施，导致进度滞后超20%，或技术路线明确不适用本地条件且未作出调整，均视为脱离实际。
  audit_item: 项目规划统筹衔接不到位
  suspicion: 项目实施方案缺失或不可行
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条、第十六条\"\
    ,\n    \"内容概述\": \"项目单位应当编制初步设计及概算，未经批准不得擅自变更建设地点、建设规模和建设内容；项目应按批准的设计方案实施。\"\n  }\n]"
- expression: EXISTS (SELECT 1 FROM 项目选址坐标与禁限区域比对表 WHERE 重叠面积 > 0)
  description: 项目选址坐标与任何法定禁止或限制建设区域存在空间重叠，无论面积大小，均直接判定为选址违规。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 高标准农田建设项目选址涉及禁止或限制建设区域
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\",\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\"\
    : \"国务院规范性文件\",\n    \"条款号\": \"第三部分\",\n    \"内容概述\": \"严禁在生态保护红线区域、重要湿地保护区、河流湖库管理范围、地下水严重超采区等区域开展高标准农田建设，确保建设区域生态安全。\"\
    \n  }\n]"
- expression: 实际容积率 > IF(论证报告.批复文号 IS NOT NULL, 论证报告.调整后容积率, 许可证.许可容积率)
  description: 实际容积率 = 实测总建筑面积/用地面积。当实际容积率大于规划许可证许可容积率或经批准的调整容积率时，即构成违规。若无容积率调整审批文件，则以规划许可证为准；若有审批文件，则与批复容积率比较。任何超出行为均触发疑点，无容差。
  audit_item: 未经批准改变土地用途、性质或容积率
  suspicion: 未经批准擅自提高建筑容积率
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第74号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十三条\",\n    \"内容概述\": \"建设单位应当按照规划条件进行建设；确需变更的，必须向城市、县人民政府城乡规划主管部门提出申请。变更内容不符合控制性详细规划的，不得批准。变更后的规划条件应及时通报土地主管部门并公示。\"\
    \n  },\n  {\n    \"法规名称\": \"建设用地容积率管理办法\",\n    \"法规文号\": \"建规〔2012〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款"
- expression: (论证报告.编制单位及资质 != 要求资质) || (论证报告.污染源风险评估章节 IS NULL) || (评价报告.评价范围未覆盖水源地) || (调查报告.高风险企业清单 != 论证报告.污染源风险评估章节)
  description: 判定逻辑：1.编制单位无水资源论证资质直接违规；2.论证报告缺失污染源风险评估，属重大遗漏；3.水源地未纳入环境影响评价范围；4.污染源调查报告中的高风险源数量与论证报告不一致，说明风险未充分考虑。
  audit_item: 水质保障和工程运营管理不到位
  suspicion: 水资源论证不科学，忽视水源地污染风险
  regulation: "[\n  {\n    \"法规名称\": \"建设项目水资源论证管理办法\",\n    \"法规文号\": \"水利部令第15号（2015年修订）\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第五条、第十条\",\n    \"内容概述\": \"建设项目水资源论证报告书应由具备相应资质的单位编制，内容应包括取水水源的可靠性、水资源质量及对周边环境影响等风险分析。\"\n  },\n  {\n\
    \    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\": \"2018年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\",\n    \"\
    内容概述\": \"可能对环"
