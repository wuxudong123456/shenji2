name: audit/审查报告类/评定报告
type: model
description: 从审查报告类类文档（评定报告）中提取结构化元数据。涵盖字段如：补划地块的实测质量等别、评定为高标准农田的地块坐标及等别。文档范围包括：耕地质量等别评定报告、补划地块的耕地质量等别评定报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 评定报告
  member_count: 1
  member_details:
  - 耕地质量等别评定报告
  - 补划地块的耕地质量等别评定报告
output:
  fields:
  - name: 补划地块的实测质量等别
    type: string
    description: 提取 补划地块的实测质量等别 的文本值
  - name: 评定为高标准农田的地块坐标及等别
    type: string
    description: 提取 评定为高标准农田的地块坐标及等别 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (竣工验收测绘报告.上报建成面积 - 土地利用现状图.地块图斑面积 > 0) || (耕地质量等别评定报告.地块等别未提升 && 竣工验收测绘报告.上报建成面积 > 0)
  description: 判定规则：1）将项目竣工测绘报告的上报建成面积，与自然资源部门权威的土地利用现状图叠加分析，若上报面积大于现状图认定的高标准农田图斑面积，即存在虚报嫌疑；2）若某地块已在上报建成面积中，但耕地质量等别评定报告显示其质量等别未达到高标准农田标准（即等别未提升），则预警为该地块以非高标准农田冒充高标准农田进行虚报。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 虚报高标准农田建成面积
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。其中包括以虚报、冒领等手段骗取财政资金。\"\n\
    \  }\n]"
- expression: (项目占地红线图.占用基本农田面积 > 永久基本农田补划台账.实际补划面积) || (补划地块的耕地质量等别评定报告.实测等别 < 被占用地块的原质量等别) || (土地利用现状图.补划地块坡度 > 25)
  description: 判定规则：1）项目建设实际占用的永久基本农田面积，大于实际完成的补划面积，即触犯“占优补劣、占多补少”的违规情形；2）补划地块经过实测的质量等别，低于被占用地块占用前的质量等别，属于典型的“占优补劣”；3）补划地块自身条件不达标，如位于大于25度的陡坡上，不宜耕种，属于虚假补划。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 未按规定补足或补划永久基本农田
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"2019年修正版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十二条\",\n    \"内容概述\": \"国家实行永久基本农田保护制度。……禁止通过擅自调整县级土地利用总体规划、乡（镇）土地利用总体规划等方式规避永久基本农田农用地转用或者土地征收的审批。\"\n  }\n]"
