name: audit/审查报告类/总结报告
type: model
description: 从审查报告类类文档（总结报告）中提取结构化元数据。涵盖字段如：实际完成时间、实际完成率、实际考核完成日期、履职陈述、年度总结中制度建设完成情况、年度总结中档案建设完成率、未完成事项说明、计划考核完成日期。文档范围包括：农业农村部门总结报告、年度农业社会化服务工作总结报告、灌区年度工作总结报告、禁捕工作阶段总结报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 总结报告
  member_count: 1
  member_details:
  - 农业农村部门总结报告
  - 年度农业社会化服务工作总结报告
  - 灌区年度工作总结报告
  - 禁捕工作阶段总结报告
output:
  fields:
  - name: 实际完成时间
    type: date
    description: 提取 实际完成时间 的日期值，格式 YYYY-MM-DD
  - name: 实际完成率
    type: string
    description: 提取 实际完成率 的文本值
  - name: 实际考核完成日期
    type: date
    description: 提取 实际考核完成日期 的日期值，格式 YYYY-MM-DD
  - name: 履职陈述
    type: string
    description: 提取 履职陈述 的文本值
  - name: 年度总结中制度建设完成情况
    type: date
    description: 提取 年度总结中制度建设完成情况 的日期值，格式 YYYY-MM-DD
  - name: 年度总结中档案建设完成率
    type: date
    description: 提取 年度总结中档案建设完成率 的日期值，格式 YYYY-MM-DD
  - name: 未完成事项说明
    type: string
    description: 提取 未完成事项说明 的文本值
  - name: 计划考核完成日期
    type: date
    description: 提取 计划考核完成日期 的日期值，格式 YYYY-MM-DD
  - name: 问题归因
    type: string
    description: 提取 问题归因 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 职责分工文件缺失 || (职责划分明确度 == "否") || (维护记录.维护单位/责任人签字 与 规定责任人不一致占比 > 20%)
  description: 若无法提供正式职责分工文件，或文件中未清晰界定政府、市场、用水协会各方管护责任边界，或实际维护记录签字人与文件规定责任人比对不一致比例超过20%，则判定为违规。
  audit_item: 大中型灌区运行管护和取水用水不符合相关规定
  suspicion: 灌区管护责任主体未明确划分
  regulation: "[\n  {\n    \"法规名称\": \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条\"\
    ,\n    \"内容概述\": \"政府应当明确农田水利工程运行维护主体，落实管护责任。\"\n  }\n]"
- expression: (禁捕工作阶段总结报告.实际完成时间 > 禁捕工作任务分解与时间节点计划表.计划完成时间) || (禁捕工作阶段总结报告.实际完成率 < 禁捕工作任务分解与时间节点计划表.计划进度百分比 && (禁捕工作阶段总结报告.实际完成时间
    - 禁捕工作任务分解与时间节点计划表.计划完成时间) > 30) || (上级部门督办通知.要求完成时限 < 上级部门督办通知.整改反馈时间 && ABS(上级部门督办通知.整改反馈时间 - 上级部门督办通知.要求完成时限) > 15)
    || (禁捕专项资金分配与使用情况说明.资金拨付时间 > 长江禁捕分阶段实施方案.阶段目标完成时限 && (禁捕专项资金分配与使用
  description: 判定规则：计划完成时间为长江禁捕分阶段实施方案或任务分解计划表中的截止时间；实际完成日期来自阶段总结报告或进度汇报材料。若实际完成日期超过计划时间，或完成率未达标且滞后超过30天，即为违规。上级督办事项整改反馈时间超过要求完成日期15天以上的视同推进不力。专项资金到位时间较计划拨付时间滞后超过30天的，判定为资金保障不到位导致推进慢。
  audit_item: 任务目标未按时完成（长江全面禁捕）
  suspicion: 长江禁捕分阶段工作推进滞后
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第五条（十五）项\",\n    \"内容概述\": \"要求稳步推进长江流域重点水域禁捕工作，明确时间表和路线图，确保按时完成各项任务。\"\n  }\n]"
