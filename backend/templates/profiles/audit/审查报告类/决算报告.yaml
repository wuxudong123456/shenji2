violations:
- expression: (填报说明文本.必填章节清单 < 必填章节清单.必填章节清单) || (决算报表.变动率 > 0.2 AND 填报说明文本.特殊事项解释阈值规则 = '该支出项变动说明为空')
  description: 规范性判定依据两点：一是填报说明的结构完整性，若缺失模板规定的任意必填章节（如“重大事项说明”“主要指标变动说明”等），视为不规范；二是关键数据变动的解释充分性，当决算报表中任一支出科目的变动率超过20%（即ABS(本年支出-上年支出)/上年支出
    > 0.2）时，对应的填报说明中必须包含具体的变动原因说明，否则即为不规范。两项条件满足其一即触发疑点。
  audit_item: 决算报告编报事项不准确
  suspicion: 决算填报说明编报不符合规范性要求
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"部门决算报表应当根据完整、核对无误的账簿记录和其他有关会计核算资料编制，做到数据真实准确、内容完整……部门决算填报说明应当按照财政部门规定的格式和要求编制，如实反映预算执行情况、财务管理状况和决算编制中需要说明的事项。\"\
    \n  }\n]"
- expression: (((决算报告.项目竣工日期 IS NOT NULL) && (决算报告.决算报告编制日期 IS NULL)) && (DATEDIFF(当前日期, 决算报告.项目竣工日期) > 365)) || ((决算报告.项目竣工日期
    IS NOT NULL) && (决算报告.决算报告编制日期 IS NOT NULL) && (DATEDIFF(决算报告.决算报告编制日期, 决算报告.项目竣工日期) > 90) && (关联表.结余金额 > 0))
  description: 基建项目竣工后，若超过1年仍未完成决算，或决算完成时间超出竣工后3个月（90天）且存在结余资金，即触发疑点。前者反映决算组织工作严重滞后，后者反映决算后结余资金未及时清理上缴。
  audit_item: 结余资金管理不规范
  suspicion: 基建项目竣工决算及结余资金清理滞后
  regulation: "[\n  {\n    \"法规名称\": \"基本建设财务规则\",\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"项目建设单位应在项目竣工后三个月内完成竣工财务决算的编制工作，并按照规定报送审批。结余资金应在竣工财务决算批复后30日内上缴国库。\"\n  }\n]"
- expression: (对比表.项目名称 > 0.85 || 对比表.实施内容摘要 > 0.7) && (明细表.申报年度 != 决算报告.竣工时间 或 明细表.申报部门 != 其他渠道批复部门) && 明细表.金额 > 0
  description: 利用文本相似度分析比对项目名称和实施内容，当相似度超过阈值且在不同年度或不同部门重复获取资金时触发疑点；重叠度通过对建设规模、技术方案、绩效目标等关键词对比计算。
  audit_item: 编制虚假预算
  suspicion: 重复申报同一项目套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号（2014年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第九十三条第一款\",\n    \"内容概述\": \"各级政府及有关部门、单位不得虚列支出，通过重复申报骗取财政资金属于虚列支出行为。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条第一款\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，"
- expression: 下属单位名单中(是否独立核算='否' 或 预算合并标记='应合并') && 单位名称 NOT IN 预算报告中的预算单位名称
  description: 筛查下属单位清单中应纳入部门预算合并范围（非独立核算或制度规定应合并），但未在预算报告中出现的单位，触发即为漏编。
  audit_item: 预算编制不完整
  suspicion: 所属单位未纳入部门预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第六条\",\n    \"内容概述\": \"各部门预算由本部门及其所属单位预算组成。\"\n  }\n]"
- expression: 动用金额 > 0 && (预算报告中动用上年结余科目金额 = 0 || 动用审批状态 != '已批复')
  description: 若存在实际动用以前年度结余资金的行为，但预算中未安排相应科目或数额为0，或者动用未获财政部门正式批复，则判定为预算不完整。
  audit_item: 预算编制不完整
  suspicion: 动用以前年度结余资金未纳入预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"预算由预算收入和预算支出组成。政府的全部收入和支出都应当纳入预算。\"\n  },\n  {\n    \"法规名称\": \"中央部门结转和结余资金管理办法\"\
    ,\n    \"法规文号\": \"财预〔2016〕18号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"中央部门动用结转结余资金，应当纳入年度预算，按照规定"
- expression: (非经营性收入金额 > 0 && 对应预算收入科目未设置 OR 预算收入金额 = 0) || (非经营性支出金额 > 0 && 对应预算支出科目未设置 OR 预算支出金额 = 0)
  description: 筛查存在实际非经营性收支（如租金、利息、捐赠、上级补助等），但预算中未编列相应科目或金额为零的情况，确认是否漏编。
  audit_item: 预算编制不完整
  suspicion: 非经营性收支未纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"预算由预算收入和预算支出组成。政府的全部收入和支出都应当纳入预算。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n\
    \    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条\",\n    \"内容概述\": \"各部门、各单位应当按照国务院财政部门制定"
- expression: 结转结余资金统计明细表.结转金额 > 0 && 部门年度预算编制表.对应项目申请金额 > 0 && (部门年度预算编制表.对应项目申请金额 + 结转结余资金统计明细表.结转金额) > 财政拨款收入支出对比表.对应项目本年预算数
    * 1.5
  description: 当上年度存在结转结余资金的项目，本年度继续申请预算，且申请金额与结转资金之和显著超过项目合理预算需求（超过本年预算数150%），视为未充分预计结转资金、重复申请预算，可能造成资金闲置。需结合预算编制制度中是否要求先抵扣结转再申请。
  audit_item: 预算编制不科学
  suspicion: 未充分预计结转资金重复申请预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"各部门、各单位应当按照规定编制本部门、本单位预算草案，参考上一年预算执行情况、有关支出绩效评价结果和本年度收支预测，确保预算编制科学准确。\"\n  },\n  {\n   \
    \ \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十三条\",\n    \"\
    内容概述\""
- expression: (明细台账.收费项目名称 LIKE '%防雷装置检测%') && (明细表.支付金额 IS NULL OR 明细表.支付金额 = 0) && (政策文件.费用承担主体（财政/企业） == '财政')
  description: 从收费明细台账中筛选收费项目名称包含“防雷装置检测”的记录；若对应财政支付明细中无任何拨付记录或支付金额为零，且政策文件明确该类费用应由财政承担，则判定为违规转嫁。只要存在一条此类记录立即触发疑点。
  audit_item: 违规收费-违规将应由财政资金承担的评估评审费用转嫁给企业承担
  suspicion: 违规将防雷装置检测费转嫁给企业承担
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条\",\n    \"内容概述\": \"政府及其有关部门不得将职责范围内的监管、技术审查、评估评审等费用转嫁给市场主体。\"\n  }\n]"
