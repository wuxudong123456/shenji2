name: audit/审查报告类/决算报告
type: model
description: 从审查报告类类文档（决算报告）中提取结构化元数据。涵盖字段如：一般公共预算支出总额、一般性转移支付金额、专项转移支付金额、会议费决算金额、公用经费支出、农村公共服务支出预算数、农村学校预算安排总额、决算单位清单。文档范围包括：上年度财政决算报告、农村义务教育经费决算报告、决算报告、历年财政转移支付决算报告、地方财政年度决算报告、基建项目竣工财务决算报告、学校年度决算报告、年度财务决算报告、本年度决算报告、财政预算决算报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 会议
- 决算
- 审批
- 补贴
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 决算报告
  member_count: 1
  member_details:
  - 上年度财政决算报告
  - 农村义务教育经费决算报告
  - 决算报告
  - 历年财政转移支付决算报告
  - 地方财政年度决算报告
  - 基建项目竣工财务决算报告
  - 学校年度决算报告
  - 年度财务决算报告
  - 本年度决算报告
  - 财政预算决算报告
  - 项目决算报告
  - 预决算报告
