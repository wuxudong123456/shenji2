name: audit/审查报告类/日报
type: model
description: 从审查报告类类文档（日报）中提取结构化元数据。涵盖字段如：农村处理设施日接收量、出勤车辆、垃圾桶满溢报警记录、处理能力上限、收集点清运次数、日进场垃圾量、每日清运趟次。文档范围包括：垃圾处理设施运行监测数据日报等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 车辆
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 日报
  member_count: 1
  member_details:
  - 垃圾处理设施运行监测数据日报
output:
  fields:
  - name: 农村处理设施日接收量
    type: string
    description: 提取 农村处理设施日接收量 的文本值
  - name: 出勤车辆
    type: string
    description: 提取 出勤车辆 的文本值
  - name: 垃圾桶满溢报警记录
    type: string
    description: 提取 垃圾桶满溢报警记录 的文本值
  - name: 处理能力上限
    type: string
    description: 提取 处理能力上限 的文本值
  - name: 收集点清运次数
    type: string
    description: 提取 收集点清运次数 的文本值
  - name: 日进场垃圾量
    type: string
    description: 提取 日进场垃圾量 的文本值
  - name: 每日清运趟次
    type: string
    description: 提取 每日清运趟次 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (规划中转站数量.规划中转站数量 - 验收报告.实际建成中转站数量) / 规划中转站数量.规划中转站数量 > 0.2 || (MAX(运处台账.同一村庄清运间隔天数) > 7) || (日报.出勤车辆 < 规划中转站数量.规划中转站数量
    * 0.6)
  description: 建成率低于80%视为进展慢；同一村庄最长清运间隔超过7天视为不能及时清运；出勤车辆低于配置数量60%表明运力不足，致使垃圾随意堆放。满足任一条件即触发疑点。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 村镇垃圾随意丢弃堆放，清运任务进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当加强农村生活垃圾污染环境的防治，组织、指导对生活垃圾的清扫、收集、运输和处理。\"\n  },\n  {\n    \"法规名称\": \"农村人居环境整治提升五年行动方案（2021-2025年）\"\
    ,\n    \"法规文号\": \"厅字〔2021〕44号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、（六）\",\n    \"内容概述\": \"健全"
- expression: (记录表.状态（在用/闲置/破损） = '闲置' AND (SYSDATE - 记录表.配置日期) > 90) || (记录表.状态（在用/闲置/破损） = '破损' AND 维修记录 IS NULL) || (记录表.配置数量
    < 应配数量 * 0.6) || (日报.垃圾桶满溢报警记录 > 10)
  description: 设施闲置超过3个月视为未有效使用；破损无任何维修记录视为管护缺失；实际配置数量低于规划标准60%为严重不足；垃圾桶满溢报警频繁说明设施配置不足或清运不及时。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 垃圾收集设施未配置、闲置或破损
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当加强农村生活垃圾污染环境的防治，组织、指导对生活垃圾的清扫、收集、运输和处理，并统筹规划、合理布局垃圾收集设施。\"\n  }\n]"
- expression: (扩容计划立项日期.剩余库容 / 设计总库容 < 0.05) && (扩容计划立项日期.扩容计划立项日期 IS NULL || 专项规划.规划替代或扩建方案 IS NULL) && (每日清运趟次.日进场垃圾量 >
    0)
  description: 当剩余库容不足5%（接近饱和），且无扩容计划或替代方案立项，同时仍在继续接收垃圾，即判定为存在饱和风险未及时应对，可能导致未来垃圾无处可去甚至超量填埋。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 垃圾填埋场趋于饱和未及时扩容
  regulation: "[\n  {\n    \"法规名称\": \"城镇生活垃圾卫生填埋场运行维护技术规程\",\n    \"法规文号\": \"CJJ 93-2011\",\n    \"效力级别\": \"行业规范\",\n \
    \   \"条款号\": \"3.2.6\",\n    \"内容概述\": \"填埋场达到设计使用年限或填埋容量达到设计库容时，应及时封场并同步建设新的处理设施或采取替代方案。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"\
    县级以上人民政府应当统筹安"
- expression: (其他.日产垃圾量 - 进入终端处理厂量 > 0) && (接收地点.接收地点位于农村) && (日报.农村处理设施日接收量 > 处理能力上限 * 1.2) || (接收地点.接收人员签名 ≠ 正规中转站管理员)
  description: 城市垃圾计量缺口对应时段出现农村转运记录，且导致农村设施严重超负荷，或交接人员非正规管理人员的异常签收，判定为违规转移堆弃。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 城市向农村转移堆弃垃圾
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"县级以上地方人民政府应当统筹生活垃圾公共转运、处理设施，禁止擅自关闭、闲置或者拆除生活垃圾处理设施、场所，不得将垃圾转移至不具备处理条件的地区。\"\n  }\n]"
