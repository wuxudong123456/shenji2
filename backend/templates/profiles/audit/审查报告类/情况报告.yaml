name: audit/审查报告类/情况报告
type: model
description: 从审查报告类类文档（情况报告）中提取结构化元数据。涵盖字段如：投诉内容、投诉时间、报告提交日期、放款方式、村落名称、核定损毁面积、档案建立日期、档案核心要素清单。文档范围包括：中国传统村落档案建立情况报告、土地供应计划完成情况报告、投诉举报处理情况报告、损毁情况报告、金融机构涉农贷款合同执行情况报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 情况报告
  member_count: 1
  member_details:
  - 中国传统村落档案建立情况报告
  - 土地供应计划完成情况报告
  - 投诉举报处理情况报告
  - 损毁情况报告
  - 金融机构涉农贷款合同执行情况报告
output:
  fields:
  - name: 投诉内容
    type: string
    description: 提取 投诉内容 的文本值
  - name: 投诉时间
    type: date
    description: 提取 投诉时间 的日期值，格式 YYYY-MM-DD
  - name: 报告提交日期
    type: date
    description: 提取 报告提交日期 的日期值，格式 YYYY-MM-DD
  - name: 放款方式
    type: number
    description: 提取 放款方式 的数值（含单位，如万元、吨等）
  - name: 村落名称
    type: string
    description: 提取 村落名称 的文本值
  - name: 核定损毁面积
    type: string
    description: 提取 核定损毁面积 的文本值
  - name: 档案建立日期
    type: date
    description: 提取 档案建立日期 的日期值，格式 YYYY-MM-DD
  - name: 档案核心要素清单
    type: string
    description: 提取 档案核心要素清单 的文本值
  - name: 测绘数据完整性标识
    type: string
    description: 提取 测绘数据完整性标识 的文本值
  - name: 涉及项目
    type: string
    description: 提取 涉及项目 的文本值
  - name: 计划地块清单
    type: string
    description: 提取 计划地块清单 的文本值
  - name: 计划完成率
    type: string
    description: 提取 计划完成率 的文本值
  - name: 贷款金额
    type: number
    description: 提取 贷款金额 的数值（含单位，如万元、吨等）
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 中国传统村落档案建立情况报告.档案核心要素清单 NOT CONTAINS '历史沿革' || 中国传统村落档案建立情况报告.档案核心要素清单 NOT CONTAINS '建筑测绘数据' || 中国传统村落档案建立情况报告.档案核心要素清单
    NOT CONTAINS '非物质文化遗产记录' || 中国传统村落档案建立情况报告.测绘数据完整性标识 == '否' || (DATEDIFF(传统建筑损毁情况统计表.最新测绘日期, 中国传统村落档案建立情况报告.档案建立日期) >
    730 && 传统建筑损毁情况统计表.损毁程度 == '严重')
  description: 档案核心内容必须包含历史沿革、建筑测绘数据、非物质文化遗产记录等关键要素，任一缺失则为违规。测绘数据完整性标识为'否'直接违规。档案建立后若超过2年未更新测绘数据且建筑出现严重损毁，亦判定为档案维护管理不到位。
  audit_item: 传统村落保护不到位
  suspicion: 中国传统村落档案缺失关键要素
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部 文化部 国家文物局 财政部关于切实加强中国传统村落保护的指导意见\",\n    \"法规文号\": \"建村〔2014〕61号\",\n    \"\
    效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"各地要按要求建立中国传统村落档案，档案应包含村落历史沿革、现存建筑清单及测绘资料、非物质文化遗产等内容，并实行动态管理。\"\
    \n  }\n]"
- expression: (其他.修复完成时间 IS NULL && (NOW_DATE - 其他.损毁发生时间 > 90天)) || (其他.修复完成时间 - 其他.损毁发生时间 > 90天) || (实施方案.计划完成时间 IS NULL)
    || (明细表.修复资金实际拨付金额 < 实施方案.预算资金 * 0.5)
  description: 损毁发生后超过90天未完成修复，或未编制修复方案，或修复资金到位率低于50%，均视为未及时修复。90天为一般性容忍阈值，重大灾毁可延长至合理期限。
  audit_item: 违反高标农田建后管护及使用规定的行为
  suspicion: 高标准农田损毁后未及时修复
  regulation: "[\n  {\n    \"法规名称\": \"高标准农田建设通则\",\n    \"法规文号\": \"GB/T 30600-2022\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"6.4.3\",\n    \"内容概述\": \"应建立损毁报修和快速响应机制，损毁工程应在合理期限内修复。\"\n  },\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\"\
    ,\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"四（十一）\",\n    \"内容概述\": \"要加强建后管护，及时修复损毁"
- expression: (保障性安居工程供地明细表.计划供地时间 < 审计年度 && 保障性安居工程供地明细表.实际供地面积 = 0) || (保障性安居工程供地明细表.计划供地时间 IS NOT NULL && DATEDIFF(当前日期,
    保障性安居工程供地明细表.计划供地时间) > 180 && 保障房项目建设进度跟踪表.土地交付时间 IS NULL)
  description: 计划供地年份已过但实际供地面积为0，或供地合同约定交付日期后超过180天仍未实际交付土地，即判定为供地未落实。其中180天为通用审计预警阈值，可根据项目规模适当调整。
  audit_item: 保障性安居工程项目建设用地未落实
  suspicion: 因前期准备不足导致保障房供地未落实
  regulation: "[\n  {\n    \"法规名称\": \"关于保障性安居工程用地供应管理的通知\",\n    \"法规文号\": \"国土资发〔2011〕218号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"通知正文相关要求\",\n    \"内容概述\": \"市、县国土资源管理部门要根据保障性安居工程建设计划，及时供应土地，确保保障性安居工程用地落实，不得因前期工作不到位延误供地。\"\n  }\n]"
