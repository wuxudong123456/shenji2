name: audit/审查报告类/调研报告
type: model
description: 从审查报告类类文档（调研报告）中提取结构化元数据。涵盖字段如：传统村落要素、决策依据、区域气候条件、地形地貌、市场定位匹配度、建议改厕模式、行业分类细度、覆盖乡镇数。文档范围包括：农村实际需求调研报告、农民工返乡创业需求调研报告、学校布局调整决策的会议纪要或调研报告、市场调研报告、村庄规划调研报告、村民需求调研报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 人员
- 项目
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 调研报告
  member_count: 1
  member_details:
  - 农村实际需求调研报告
  - 农民工返乡创业需求调研报告
  - 学校布局调整决策的会议纪要或调研报告
  - 市场调研报告
  - 村庄规划调研报告
  - 村民需求调研报告
output:
  fields:
  - name: 传统村落要素
    type: string
    description: 提取 传统村落要素 的文本值
  - name: 决策依据
    type: string
    description: 提取 决策依据 的文本值
  - name: 区域气候条件
    type: string
    description: 提取 区域气候条件 的文本值
  - name: 地形地貌
    type: string
    description: 提取 地形地貌 的文本值
  - name: 市场定位匹配度
    type: string
    description: 提取 市场定位匹配度 的文本值
  - name: 建议改厕模式
    type: string
    description: 提取 建议改厕模式 的文本值
  - name: 行业分类细度
    type: string
    description: 提取 行业分类细度 的文本值
  - name: 覆盖乡镇数
    type: string
    description: 提取 覆盖乡镇数 的文本值
  - name: 调查样本量
    type: string
    description: 提取 调查样本量 的文本值
  - name: 调研结论
    type: string
    description: 提取 调研结论 的文本值
  - name: 调研需求项目列表
    type: string
    description: 提取 调研需求项目列表 的文本值
  - name: 资源禀赋
    type: string
    description: 提取 资源禀赋 的文本值
  - name: 返乡创业人员行业分布
    type: string
    description: 提取 返乡创业人员行业分布 的文本值
  - name: 问卷设计字段
    type: string
    description: 提取 问卷设计字段 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (同业对标数据比较表.非主业投资占比 > 0.1) || (同业对标数据比较表.主业收入占比 < 0.7) || (重大投资项目可行性研究报告.投资行业归属 IN (国家相关产业政策文件.鼓励类/限制类/淘汰类产业目录))
    || (同业对标数据比较表.研发投入占营收比例 < 市场调研报告.平均研发投入强度 * 0.8)
  description: 1.非主业投资占比超过10%或主业收入占比低于70%为关注线，触发预警；2.投资行业直接属于国家产业政策限制类或淘汰类即构成违规；3.对于高新技术企业，若研发投入占比低于同期同行业平均水平的80%，可能偏离国家创新驱动战略。
  audit_item: 企业发展战略规划的制定、执行和效果
  suspicion: 发展战略未聚焦主业或违反国家产业政策
  regulation: "[\n  {\n    \"法规名称\": \"中央企业投资监督管理办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第34号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十条\",\n    \"内容概述\": \"中央企业应当聚焦主业，严格控制非主业投资，非主业投资应当符合企业发展战略规划，且不得超过国资委核定的比例。\"\n  }\n]"
- expression: (村民意见征集与采纳情况统计表.采纳率 < 70%) || (村庄规划调研报告.传统村落要素 < 50%) || (村庄规划编制批复文件.规划方案 LIKE '%模板化%')
  description: 村民合理意见采纳率低于70%为可疑，低于50%为严重；调研报告中识别的特色资源（如古树、古建、特色农业）在规划方案中落实率不足50%则判定未因地制宜；规划方案若出现明显模板化表述，也判定违规。
  audit_item: 不符合村庄规划编制要求
  suspicion: 村庄规划未因地制宜
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"制定和实施城乡规划，应当遵循……因地制宜的原则，并应当保持地方特色、民族特色和传统风貌。\"\n  }\n]"
- expression: (村民需求调研报告 IS NULL) OR ( (COUNT(村民需求调研报告.调研需求项目列表 ∩ 服务项目清单.实际服务项目列表) / COUNT(村民需求调研报告.调研需求项目列表)) < 0.6 )
  description: 缺失需求调研报告直接判定违规；若存在调研报告，计算需求项目匹配率，低于60%表明未紧扣实际需求建设，成效不佳。
  audit_item: 信息进村入户、电子商务进农村等村级服务站使用效果不佳
  suspicion: 村级服务站建设未开展需求调研导致功能与村民需求不匹配
  regulation: "[\n  {\n    \"法规名称\": \"农业部关于全面推进信息进村入户工程的通知\",\n    \"法规文号\": \"农计发〔2017〕6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"二（二）\",\n    \"内容概述\": \"信息进村入户工程建设必须坚持需求导向、因地制宜，避免简单分配任务、盲目建设，确保建设内容符合当地实际需求。\"\n  }\n]"
- expression: (返乡创业人员行业分布（农业、电商、服务业等细分）.调查样本量 < 200) || (创业行业类别.表头字段（是否包含创业意向、技能特长、资金需求） 不包含 '创业意向' ) || (返乡创业人员行业分布（农业、电商、服务业等细分）.覆盖乡镇数
    < 80%)
  description: 有效样本量指经过逻辑校验后可用于分析的问卷数量，低于200份视为调研不充分；统计表必须包含创业意向、技能特长等关键字段，缺一即判定基础信息不完整；覆盖乡镇比例=实际开展调研的乡镇数/辖区内乡镇总数，低于80%视为摸底不全面。
  audit_item: 农民工返乡创业政策实施不到位
  suspicion: 未摸清返乡创业总体状况与需求
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于支持农民工等人员返乡创业的意见\",\n    \"法规文号\": \"国办发〔2015〕47号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第三条（七）\",\n    \"内容概述\": \"各地要加强对返乡创业人员的调查统计，摸清底数，完善创业信息数据库，为开展精准扶持提供依据。\"\n  }\n]"
- expression: (培训计划.培训课程主题 < 60%) || (调研报告.覆盖乡镇数 < 50%)
  description: 行业匹配度指参训人员本人所属行业与所参加培训课程主题一致的人数/参训总人数，低于60%为培训内容严重脱节；培训覆盖率=接受过培训的返乡创业人员数/登记的返乡创业人员总数，低于50%为覆盖面不足。
  audit_item: 农民工返乡创业政策实施不到位
  suspicion: 未开展针对性创业就业培训
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于支持农民工等人员返乡创业的意见\",\n    \"法规文号\": \"国办发〔2015〕47号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第三条（五）\",\n    \"内容概述\": \"根据返乡创业人员的需求和本地产业特点，依托现有资源，有针对性地开展创业培训、创业指导。\"\n  }\n]"
- expression: (统计表.水厕数量 > 0.8 && 调研报告.建议改厕模式 < 0.5) || (调研报告.区域气候条件 < -10℃的地区 && 统计表.水厕数量 > 0 && 日志.防冻措施记录缺失)
  description: 水冲式厕所占比远高于实地调研建议，或在高寒地区采用水冲式但未设计防冻保温措施，即构成技术路线选择不当，造成设施闲置浪费。
  audit_item: 厕所改造实施不规范、质量不达标
  suspicion: 未因地制宜盲目推广水冲式厕所
  regulation: "[\n  {\n    \"法规名称\": \"农村人居环境整治三年行动方案\",\n    \"法规文号\": \"中办发〔2018〕5号\",\n    \"效力级别\": \"制度文件\",\n    \"\
    条款号\": \"二（二）\",\n    \"内容概述\": \"要求科学确定整治任务和建设模式，不搞“一刀切”，因地制宜推进改厕。\"\n  }\n]"
- expression: (情况表.调整前后学校数量 > 0.3 && 调研报告.决策依据（人口数据、地理条件）) || (情况表.调整前后学校数量 > 标准文件.学校服务半径标准) || (反馈记录.反对撤并意见占比 > 0.5 && 调研报告.决策依据（人口数据、地理条件）)
  description: 撤并比例超过30%且缺乏人口数据支撑，或学校服务半径超标，或多数群众反对但未听证，均属布局不合理，疑点触发
  audit_item: 小规模学校、寄宿制学校建设管理不规范
  suspicion: 农村学校布局规划与人口分布不匹配
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于规范农村义务教育学校布局调整的意见\",\n    \"法规文号\": \"国办发〔2012〕48号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、严格规范学校撤并程序\",\n    \"内容概述\": \"确定学校撤并须经过科学论证和严格程序，充分听取群众意见，保障学生就近入学\"\n  }\n]"
