name: audit/审查报告类/核查报告
type: model
description: 从审查报告类类文档（核查报告）中提取结构化元数据。涵盖字段如：发现问题、实际用途、是否与审批一致、是否改变用途、有无非农设施、核查实际用途、设备实际用途、非农设备占比。文档范围包括：现场核查报告、自然资源部门用地核查报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 审批
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 核查报告
  member_count: 1
  member_details:
  - 现场核查报告
  - 自然资源部门用地核查报告
output:
  fields:
  - name: 发现问题
    type: string
    description: 提取 发现问题 的文本值
  - name: 实际用途
    type: string
    description: 提取 实际用途 的文本值
  - name: 是否与审批一致
    type: boolean
    description: 提取 是否与审批一致 的布尔值（是/否）
  - name: 是否改变用途
    type: boolean
    description: 提取 是否改变用途 的布尔值（是/否）
  - name: 有无非农设施
    type: boolean
    description: 提取 有无非农设施 的布尔值（是/否）
  - name: 核查实际用途
    type: string
    description: 提取 核查实际用途 的文本值
  - name: 设备实际用途
    type: string
    description: 提取 设备实际用途 的文本值
  - name: 非农设备占比
    type: string
    description: 提取 非农设备占比 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 设施农业用地项目申请文件.申请用途 IN (设施农业用地政策实施细则.允许按设施农业用地管理的项目类型) AND 设施农业用地项目批复文件.批复用地性质 = '建设用地' AND (设施农业用地登记台账.备案类型 IS
    NULL OR 设施农业用地登记台账.备案类型 != '设施农业用地')
  description: 表达式识别出项目用途符合设施农业用地政策范围，但土地审批部门却将用地性质批复为建设用地，且在设施农业用地台账中无对应备案记录的情况。此类项目违反了国家简化设施农业用地管理的规定，增加了企业用地成本。
  audit_item: 农业社会化服务政策扶持不到位
  suspicion: 设施农业用地项目被违规要求办理建设用地审批
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部 农业农村部关于设施农业用地管理有关问题的通知\",\n    \"法规文号\": \"自然资规〔2019〕4号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"设施农业用地包括农业生产中直接用于作物种植和畜禽水产养殖的设施用地，设施农业属于农业内部结构调整，可以使用一般耕地，不需落实占补平衡，按农用地管理，不需办理建设用地审批手续。\"\
    \n  }\n]"
- expression: 档案.批准用途 = '设施农业' && 核查报告.实际用途 IN ('餐饮','住宿','娱乐','工业仓储') || 整改台账.复发情况 >= 2
  description: 审批为农业设施的用地被发现用于餐饮、经营等非农活动，或者同一地块多次被查处整改又反复违规的，属于“大棚房”问题回潮。
  audit_item: 相关支持政策落实不到位
  suspicion: 设施农业用地擅自改变用途搞“大棚房”
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部 农业农村部关于设施农业用地管理有关问题的通知\",\n    \"法规文号\": \"自然资规〔2019〕4号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"严禁擅自或变相将设施农业用地用于非农建设，各地要加强监管，防止“大棚房”问题反弹。\"\n  }\n]"
- expression: (用户编号.用电类别 = '农业生产用电' && 用户编号.月均用电量 > 同类型农业用户均值的3倍) && (设施清单.额定功率 / 总设备功率 > 0.3)
  description: 月用电量显著超过同类纯农业生产用电户（超出3倍标准差），且现场核查发现存在冷链加工、商业办公等高耗能非农设备，未按规定分表计量，可能将高价电转嫁为农业电价。
  audit_item: 相关支持政策落实不到位
  suspicion: 高耗能农业设施违规全额享受农业电价
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"对包含非农业生产用电的混合用电，应分表计量，按不同电价类别分别计费，不得擅自将非农用电并入农业电价收取。\"\n  }\n]"
- expression: (档案.批准用途 IN ('设施农业','养殖','种植') AND 核查报告.实际用途 IN ('工业','仓储','商业','住宅')) OR (指标文件.面积 < 指标文件.下达指标数量 AND 非农项目审批面积
    > 0) OR (图斑.土地利用类型 = '耕地' AND 核查报告.有无非农设施 = '非农设施' AND 整改台账.整改状态 = '未整改')
  description: 核心判定逻辑：审批用途为农业设施但实际建设为工业、商业等非农设施的“大棚房”问题；或农业用地指标总量未足额用于农业，被挪用于非农项目；或占用耕地建设非农设施且未整改。以上条件满足其一即视为违规。
  audit_item: 相关支持政策落实不到位
  suspicion: 农业设施用地指标被挪用或违规使用
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部 农业农村部关于设施农业用地管理有关问题的通知\",\n    \"法规文号\": \"自然资规〔2019〕4号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第一条、第三条\",\n    \"内容概述\": \"设施农业用地包括农业生产中直接用于作物种植和畜禽水产养殖的设施用地；严禁以设施农业为名占用耕地从事非农建设，不得改变设施农业用地用途。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第"
