name: audit/审查报告类/鉴定报告
type: model
description: 从审查报告类类文档（鉴定报告）中提取结构化元数据。涵盖字段如：建议整治措施、有效期、鉴定结论。文档范围包括：房屋安全鉴定报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 鉴定报告
  member_count: 1
  member_details:
  - 房屋安全鉴定报告
output:
  fields:
  - name: 建议整治措施
    type: string
    description: 提取 建议整治措施 的文本值
  - name: 有效期
    type: string
    description: 提取 有效期 的文本值
  - name: 鉴定结论
    type: string
    description: 提取 鉴定结论 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (记录表.销号状态 = '已消除' && 影像资料.当前房屋状态 = '仍有人居住' && 整治措施 != '工程加固或拆除') || (记录表.销号状态 = '已消除' && 专项资金支付记录为空) || (记录表.整治措施
    = '警示牌/观察使用' && 鉴定报告.建议整治措施 = '停止使用/拆除')
  description: 销号但未采取实质性工程措施（仅悬挂警示牌）、销号后仍有人居住且无工程整治、有销号记录但无对应整治资金支付、整治措施与鉴定报告要求严重不符等情况，均视为虚假销号或整治不到位。
  audit_item: 未按要求开展农村房屋安全隐患排查整治
  suspicion: 安全隐患房屋虚假销号或整治不到位
  regulation: "[\n  {\n    \"法规名称\": \"全国自建房安全专项整治工作方案\",\n    \"法规文号\": \"国办发明电〔2022〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第三部分 分类整治\",\n    \"内容概述\": \"对存在安全隐患的房屋，要逐一制定整治方案，明确整治措施和完成时限，实行销号管理，整治完成一户、销号一户，严禁弄虚作假、虚假销号。\"\n  }\n]"
- expression: (数据.工商登记地址关联的房屋未在登记表中出现) || (登记表中房屋安全鉴定报告编号为空 || 鉴定报告.鉴定结论 != '符合安全要求') || (登记表.审批日期 > 数据.发证日期) || (年度内经营者检查次数
    < 制度要求次数 * 0.8)
  description: 取得营业执照的经营性自建房若未经过房屋安全鉴定审批，或鉴定不合格仍获许可，或审批滞后于经营许可，或日常检查频次不足制度要求的80%，均属监管缺失。
  audit_item: 未按要求开展农村房屋安全隐患排查整治
  suspicion: 经营性自建房审批监管缺位
  regulation: "[\n  {\n    \"法规名称\": \"全国自建房安全专项整治工作方案\",\n    \"法规文号\": \"国办发明电〔2022〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第四部分 加强经营性自建房审批监管\",\n    \"内容概述\": \"落实房屋安全鉴定与相关行政许可联动机制，经营性自建房未取得房屋安全鉴定合格证明的，不得办理相关经营许可。同时要求加强日常检查，及时发现并消除安全隐患。\"\
    \n  }\n]"
