name: audit/审查报告类/测绘报告
type: model
description: 从审查报告类类文档（测绘报告）中提取结构化元数据。涵盖字段如：上报建成面积、主要构筑物实际数量及规格、功能区域分布、地块四至坐标、实测建成面积、实测总建筑面积、实际测绘面积、用地面积。文档范围包括：测绘报告、竣工验收测绘报告、载体测绘报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 测绘报告
  member_count: 1
  member_details:
  - 测绘报告
  - 竣工验收测绘报告
  - 载体测绘报告
output:
  fields:
  - name: 上报建成面积
    type: string
    description: 提取 上报建成面积 的文本值
  - name: 主要构筑物实际数量及规格
    type: number
    description: 提取 主要构筑物实际数量及规格 的数值（含单位，如万元、吨等）
  - name: 功能区域分布
    type: string
    description: 提取 功能区域分布 的文本值
  - name: 地块四至坐标
    type: string
    description: 提取 地块四至坐标 的文本值
  - name: 实测建成面积
    type: string
    description: 提取 实测建成面积 的文本值
  - name: 实测总建筑面积
    type: string
    description: 提取 实测总建筑面积 的文本值
  - name: 实际测绘面积
    type: string
    description: 提取 实际测绘面积 的文本值
  - name: 用地面积
    type: string
    description: 提取 用地面积 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (竣工验收测绘报告.上报建成面积 - 土地利用现状图.地块图斑面积 > 0) || (耕地质量等别评定报告.地块等别未提升 && 竣工验收测绘报告.上报建成面积 > 0)
  description: 判定规则：1）将项目竣工测绘报告的上报建成面积，与自然资源部门权威的土地利用现状图叠加分析，若上报面积大于现状图认定的高标准农田图斑面积，即存在虚报嫌疑；2）若某地块已在上报建成面积中，但耕地质量等别评定报告显示其质量等别未达到高标准农田标准（即等别未提升），则预警为该地块以非高标准农田冒充高标准农田进行虚报。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 虚报高标准农田建成面积
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。其中包括以虚报、冒领等手段骗取财政资金。\"\n\
    \  }\n]"
