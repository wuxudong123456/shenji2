name: audit/审查报告类/检验报告
type: model
description: 从审查报告类类文档（检验报告）中提取结构化元数据。涵盖字段如：检验有效期、检验结论、设备型号。文档范围包括：消毒设备检验报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 检验报告
  member_count: 1
  member_details:
  - 消毒设备检验报告
output:
  fields:
  - name: 检验有效期
    type: string
    description: 提取 检验有效期 的文本值
  - name: 检验结论
    type: string
    description: 提取 检验结论 的文本值
  - name: 设备型号
    type: string
    description: 提取 设备型号 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (记录表.消毒方式 NOT IN 操作规范.消毒方式) || (记录表.检测结果 == '不合格' && 记录表.整改措施 == '无') || (记录表.检测日期 < 1次/月)
  description: 消毒使用方式不符合操作规范要求，检测结果不合格未启动整改，或每月消毒效果检测少于1次，均属违规，反映系统性消毒管理缺失。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 餐具清洗消毒不合规
  regulation: "[\n  {\n    \"法规名称\": \"餐饮服务食品安全操作规范\",\n    \"法规文号\": \"国家市场监督管理总局公告2018年第12号\",\n    \"效力级别\": \"行业规范\",\n\
    \    \"条款号\": \"10.1.3、10.1.4\",\n    \"内容概述\": \"餐用具使用后应及时清洗消毒，鼓励采用热力消毒方式，消毒后的餐饮具应符合GB14934要求，并定期进行消毒效果检测。\"\n  }\n]"
