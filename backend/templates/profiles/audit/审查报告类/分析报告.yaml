name: audit/审查报告类/分析报告
type: model
description: 从审查报告类类文档（分析报告）中提取结构化元数据。涵盖字段如：专利产品销售收入、专利许可/转让收入、偏差说明、地质类型、实际建设内容、平均研发投入强度、技术合同成交额、生活垃圾中有毒有害垃圾混入比例。文档范围包括：地理气候条件分析报告、成分分析报告、效益分析报告、行业分析报告、重复建设项目对比分析报告、项目实施方案与规划对比分析报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 合同
- 知识产权
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 分析报告
  member_count: 1
  member_details:
  - 地理气候条件分析报告
  - 成分分析报告
  - 效益分析报告
  - 行业分析报告
  - 重复建设项目对比分析报告
  - 项目实施方案与规划对比分析报告
output:
  fields:
  - name: 专利产品销售收入
    type: number
    description: 提取 专利产品销售收入 的数值（含单位，如万元、吨等）
  - name: 专利许可-转让收入
    type: number
    description: 提取 专利许可-转让收入 的数值（含单位，如万元、吨等）
  - name: 偏差说明
    type: string
    description: 提取 偏差说明 的文本值
  - name: 地质类型
    type: string
    description: 提取 地质类型 的文本值
  - name: 实际建设内容
    type: string
    description: 提取 实际建设内容 的文本值
  - name: 平均研发投入强度
    type: string
    description: 提取 平均研发投入强度 的文本值
  - name: 技术合同成交额
    type: string
    description: 提取 技术合同成交额 的文本值
  - name: 生活垃圾中有毒有害垃圾混入比例
    type: number
    description: 提取 生活垃圾中有毒有害垃圾混入比例 的数值（含单位，如万元、吨等）
  - name: 相似度评分
    type: string
    description: 提取 相似度评分 的文本值
  - name: 行业技术门槛
    type: string
    description: 提取 行业技术门槛 的文本值
  - name: 规划要求建设内容
    type: string
    description: 提取 规划要求建设内容 的文本值
  - name: 重叠区域
    type: string
    description: 提取 重叠区域 的文本值
  - name: 降水分布
    type: string
    description: 提取 降水分布 的文本值
  - name: 高寒-冻土区域划分
    type: string
    description: 提取 高寒-冻土区域划分 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (专项协议缺失 || 登记表中月度记录缺失 >= 2次) || (检测报告.渗滤液铅、镉、汞等重金属含量超标) || (分析报告.生活垃圾中有毒有害垃圾混入比例 > 0.5%)
  description: 未签订无害化处理协议或收集运输台账月缺失2次以上，或终端渗滤液重金属超标，或混入比例超过0.5%，即判定有毒有害垃圾未落实单独处理。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 有毒有害垃圾未单独分类处理
  regulation: "[\n  {\n    \"法规名称\": \"《农药包装废弃物回收处理管理办法》\",\n    \"法规文号\": \"农业农村部令2020年第6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十条\",\n    \"内容概述\": \"农药使用者应当妥善收集农药包装废弃物，不得随意丢弃；应分类收集移交至回收点，禁止混入生活垃圾。\"\n  }\n]"
- expression: (对照表.选用技术模式 = '水冲式' AND 高寒/冻土区域划分、降水分布、地质类型.高寒/冻土区域划分 = '是') OR (对照表.地质类型字段 NOT IN ('稳定岩层') AND 对照表.选用技术模式 =
    '砖砌化粪池')
  description: 在冻土深度超过管道埋深的地区仍选用水冲式厕所，或者在地质沉降区、膨胀土区域选用刚性化粪池结构，说明技术选择未考虑地理气候因素。
  audit_item: 厕所改造规划设计等不符合规定
  suspicion: 改厕技术模式未因地制宜
  regulation: "[\n  {\n    \"法规名称\": \"农村户厕卫生规范\",\n    \"法规文号\": \"GB 19379-2012\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"第4章\",\n    \"内容概述\": \"农村户厕建设应结合当地自然地理、气候条件、风俗习惯、经济发展水平等因素，选择适宜的技术模式。\"\n  }\n]"
- expression: (项目交叉比对清单.相似度评分>0.8 && 项目资金使用明细表.拨付总额>0) || (项目设备采购清单.设备型号 IN (SELECT 设备型号 FROM 其他项目设备采购清单 WHERE 采购年度 BETWEEN
    本年度-2 AND 本年度) && 项目单位相同) || (项目效益产出对比分析表.投入产出比-同类项目.投入产出比<-0.3)
  description: 通过交叉比对清单发现相似度超80%、或同一单位3年内采购相同型号设备、或新项目投入产出比低于同类项目30%以上，即认定为重复建设。
  audit_item: 项目实施管理不到位
  suspicion: 同类项目重复建设造成资金浪费
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部关于进一步加强农业建设项目管理工作的通知\",\n    \"法规文号\": \"农计财发〔2017〕4号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"严格项目立项储备，建立项目库查重机制，防止多头申报、重复建设同一建设内容。\"\n  },\n  {\n    \"法规名称\": \"中央预算内投资补助和贴息项目管理办法\"\
    ,\n    \"法规文号\": \"国家发展改革委令第45号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"项目单位不得通过重复申报"
- expression: (项目实施方案与规划对比分析报告.偏差率 > 15%) || (历年项目验收与规划符合性报告.偏差率 > 15%) || (建设资金流向与规划匹配表.非重点区域投资金额 / 总投资金额 > 30%)
  description: 当实际建设内容与规划要求的偏差率超过15%（如集中连片比例、节水灌溉覆盖率等），或资金投向非规划重点区域的比例超过30%时，判定为规划与建设脱节；阈值可根据地方管理细则调整。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 高标准农田规划与项目建设内容严重不符
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"农田建设项目应当按照批准的初步设计组织实施，涉及建设地点、建设内容、建设规模等重大变更，须按程序报原审批机关批准，不得擅自调整。\"\n  }\n]"
