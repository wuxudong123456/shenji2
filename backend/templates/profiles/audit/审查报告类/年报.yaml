name: audit/审查报告类/年报
type: model
description: 从审查报告类类文档（年报）中提取结构化元数据。涵盖字段如：上报时间、分乡镇养殖存栏量、可作基准参照、播种面积、数据完整性、统计数据年份。文档范围包括：农业普查或畜牧水产统计年报、农药生产销售统计年报等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 年报
  member_count: 1
  member_details:
  - 农业普查或畜牧水产统计年报
  - 农药生产销售统计年报
output:
  fields:
  - name: 上报时间
    type: date
    description: 提取 上报时间 的日期值，格式 YYYY-MM-DD
  - name: 分乡镇养殖存栏量
    type: string
    description: 提取 分乡镇养殖存栏量 的文本值
  - name: 可作基准参照
    type: string
    description: 提取 可作基准参照 的文本值
  - name: 播种面积
    type: string
    description: 提取 播种面积 的文本值
  - name: 数据完整性
    type: string
    description: 提取 数据完整性 的文本值
  - name: 统计数据年份
    type: string
    description: 提取 统计数据年份 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 调查报告编制日期.调查报告编制日期 IS NULL || (调查报告编制日期.调查报告编制日期 < 当前日期 - 180天 && 年报.统计数据年份 != 本年度)
  description: 主管部门应至少每半年进行一次调查统计。若调查报告缺失,或最近调查日期距离当前超过180天且当年度统计年报未生成,可判定未履行定期统计职责。阈值180天源自条例要求每季度或半年度应有工作记录。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 农业主管部门未定期调查统计农药产销情况
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十一条\",\n    \"内容概述\": \"县级以上人民政府农业主管部门应当定期调查统计农药生产、销售、使用情况,建立农药诚信档案,并及时向社会公布相关信息。\"\n  }\n]"
- expression: (ABS(标的清单.投保数量 - 实地核查记录.实际数量) / 实地核查记录.实际数量 > 0.2) || (实地核查记录.核查标志 = '无标的' && 保险合同.保费补贴状态 = '已拨付') || (COUNT(理赔记录.保单号)
    / COUNT(保险标的清单.保单号) > 0.5 && 气象记录.无对应灾害) || (银行流水.理赔款到账后3日内转回保险公司关联账户金额 > 理赔额的0.8)
  description: 投保数量与实地核查实际数量偏差超过20%，或核查确认标的物根本不存在但保费补贴已拨付，或同一区域相同灾害原因导致的理赔率异常偏高且无气象部门灾害记录佐证，或理赔资金在极短时间内回流至保险公司或其关联方，均指向虚构标的骗取补贴。
  audit_item: 骗取套取涉农财政专项资金
  suspicion: 虚构农业保险标的骗取财政保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条\"\
    ,\n    \"内容概述\": \"保险机构经营农业保险业务，有下列行为之一的，由保险监督管理机构责令改正，处五万元以上三十万元以下罚款……（一）编制虚假的农业保险承保、查勘定损、理赔资料，骗取农业保险补贴或者补贴资金……\"\n \
    \ },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\"\
    ,\n"
