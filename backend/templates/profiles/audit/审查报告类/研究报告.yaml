violations:
- expression: (批准文号.批准文号缺失) || (对照表.实际人均面积 > 对照表.标准人均面积) || (研究报告.用途 != '办公' && 研究报告.实际功能包含接待中心/宴会厅/游泳池等)
  description: 未取得合法审批文号擅自建设办公用房或楼堂馆所，或人均建筑面积超出国家规定标准，或以技术业务用房名义建设实际具有楼堂馆所性质的项目，均属违规。
  audit_item: 违反规定配置国有资产
  suspicion: 违规建设楼堂馆所或未经批准建设办公用房
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第三十六条\",\n    \"内容概述\": \"严格控制办公用房建设标准，不得超标准、超规模、超投资建设。严禁以任何理由新建楼堂馆所，严禁以危房改造等名义改扩建楼堂馆所，严禁以建技术业务用房名义搭车新建楼堂馆所。\"\
    \n  }\n]"
- expression: (项目可行性研究报告.论证结论 IS NULL OR 项目可行性研究报告.关键论证要素缺失) && 预算执行进度跟踪表.预算金额 > 0 && 预算执行进度跟踪表.执行率 < 0.2
  description: 当项目申报了预算（金额大于0），但缺少可行性研究报告或报告未对技术、经济、实施条件等关键要素进行充分论证（如无专家评审意见、未分析土地性质等），且该项目预算执行率低于20%时，判定为论证不充分导致项目无法实施，资金闲置。
  audit_item: 预算编制不科学
  suspicion: 项目支出可行性论证缺失或流于形式
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"各部门、各单位应当按照规定编制本部门、本单位预算草案，参考上一年预算执行情况、有关支出绩效评价结果和本年度收支预测，确保预算编制科学准确。\"\n  },\n  {\n   \
    \ \"法规名称\": \"中央本级项目支出预算管理办法\",\n    \"法规文号\": \"财预〔2020〕4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条、第六条\",\n \
    \   \"内容"
- expression: ((批复文件.批准的概算总金额 - 研究报告.项目总投资额) / 研究报告.项目总投资额 > 0.1) && (申请.批复文号 IS NULL)
  description: 初步设计概算超出可研估算10%以上时，必须向原审批部门报告并取得批准。若建设单位无法提供对应的调整概算批复文件，即视为违规，其超支部分未经合法审批。
  audit_item: 建设项目初步设计概算投资超过可研批准估算%及以上未报告审批部门
  suspicion: 初步设计概算超可研估算10%以上未报批
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十三条\"\
    ,\n    \"内容概述\": \"政府投资项目投资概算超过可行性研究报告批准的投资估算10%的，项目单位应当向投资主管部门或者其他有关部门报告，投资主管部门或者其他有关部门可以要求项目单位重新报送可行性研究报告。\"\n  }\n]"
- expression: (许可证.发证日期 < 批复文件.批复日期) || (设计文件.批复日期 < 研究报告.批复日期) || (项目清单.实际开工日期 < 意见书.批复日期) || (许可证.发证日期 IS NULL && 项目清单.实际开工日期
    IS NOT NULL) || (评价报告.批复日期 < 批复文件.批复日期)
  description: 该表达式用于判定审批程序倒置或未批先建。主要逻辑包括：1) 规划许可证日期早于立项批复日期，表明程序倒置；2) 初设批复早于可研批复，违反基本建设程序；3) 实际开工日期早于用地审批文件日期，构成未批先建；4) 未取得规划许可证但已有实际开工记录，属于严重违法行为；5)
    环评批复早于立项批复，通常不符合逻辑，涉嫌程序违规。所有条件满足其一即触发疑点。
  audit_item: 未按规定办理项目审批等手续
  suspicion: 未批先建或程序倒置违规
