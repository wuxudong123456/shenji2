name: audit/审查报告类/研究报告
type: model
description: 从审查报告类类文档（研究报告）中提取结构化元数据。涵盖字段如：与主业关联度、专家论证意见、主要建设内容及规模、主要用能工艺、主要经济指标、主要风险提示、传输功能、作物种类。文档范围包括：产业可行性研究报告、农资物联网项目可行性研究报告、可行性研究报告、大额项目可行性研究报告、帮扶项目可行性研究报告、建设项目可行性研究报告、种业研发周期相关行业标准或研究报告、重大投资项目可行性研究报告、项目可行性研究报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 审批
- 工程
- 金额
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 研究报告
  member_count: 1
  member_details:
  - 产业可行性研究报告
  - 农资物联网项目可行性研究报告
  - 可行性研究报告
  - 大额项目可行性研究报告
  - 帮扶项目可行性研究报告
  - 建设项目可行性研究报告
  - 种业研发周期相关行业标准或研究报告
  - 重大投资项目可行性研究报告
  - 项目可行性研究报告
