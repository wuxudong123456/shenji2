    ,\n    \"内容概述\": \"合作发展基金应当制定管理办法，实行专户管理、专款专用，主要用于基层社建设和为农服务项目。\"\n  }\n]"
- expression: ( ( 进度表.各类智能终端实际安装数量 / 研究报告.终端设备安装数量目标 ) < 0.9 ) || ( 进度表.功能投运率 < 1 ) && ( 计划投运日期 <= 当前日期 )
  description: 以可研报告批准的数量和时间为基准，若实际安装完成率低于计划的90%，或已到投运日期但关键功能（如馈线自动化、远程抄表）未全部投运，均视为进度缓慢。偏差10%考虑了正常的实施弹性。
  audit_item: 农村电网巩固提升工程存在短板
  suspicion: 智能配电网建设项目进度严重滞后
  regulation: "[\n  {\n    \"法规名称\": \"国家能源局关于加快推进配电自动化和智能用电信息采集系统建设的通知\",\n    \"法规文号\": \"国能电力〔2016〕290号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"要求按规划稳步推进配电自动化和智能用电信息采集系统建设，确保智能配电网建设任务按期完成。\"\n  }\n]"
- expression: (预期年度效益.实际完成工程量及建筑物清单 != 预期年度效益.批复建设内容) && (变更申请事项.审批批复结论 != '批准')
  description: 通过比对竣工验收的实际建设内容与上级批复的可行性研究报告、初步设计中的规划内容，识别任何差异项。针对每一项差异，必须能在变更批复文件中找到对应的审批记录且结果为“批准”，否则即判定为擅自变更。
  audit_item: 大中型灌区规划、建设不符合相关规定
  suspicion: 未经批准擅自变更建设内容
  regulation: "[\n  {\n    \"法规名称\": \"水利工程建设程序管理暂行规定\",\n    \"法规文号\": \"水利部水建〔2017〕323号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十三条\",\n    \"内容概述\": \"重大设计变更应当报原审批部门批准。未经批准，任何单位和个人不得擅自变更。\"\n  }\n]"
- expression: (预期年度效益.规划作物种植结构 != 评估报告.实际种植结构) && (预期年度效益.节水设施投资占比 < 10%)
  description: 当规划设计所依据的作物种植结构、水资源条件与项目建成后实际运行的作物种植结构、水源状况发生重大偏差，且设计中未配置充分的节水设施（如节水设施投资占总投资的比重低于10%），导致水资源浪费或设施闲置，即判定为设计不合理。
  audit_item: 大中型灌区规划、建设不符合相关规定
  suspicion: 规划设计与实际需求严重不符
  regulation: "[\n  {\n    \"法规名称\": \"水利工程设计管理规定\",\n    \"法规文号\": \"水利部水建〔1995〕127号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"水利工程设计必须遵循因地制宜、讲求实效的原则，设计方案应当技术先进、经济合理。\"\n  }\n]"
- expression: (评估报告.实际灌溉面积 / 研究报告.设计灌溉面积 < 80%) || (评估报告.灌溉水利用系数 / 研究报告.设计水利用系数 < 0.8)
  description: 核心效益指标未达设计预期的判定标准：实际灌溉面积不足设计的80%，或灌溉水利用系数（反映输水效率）的实测值与设计值的比率低于0.8。满足任一“或”条件即判定为效益不达标。此标准依据《灌区管理办法》对主要技术经济指标的考核要求设定。
  audit_item: 大中型灌区规划、建设不符合相关规定
  suspicion: 主要效益指标未达预期
  regulation: "[\n  {\n    \"法规名称\": \"中央财政水利发展资金管理办法\",\n    \"法规文号\": \"财农〔2019〕34号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"资金使用单位应当加强项目绩效管理，确保绩效目标如期实现。对绩效目标实现程度和预算执行进度实行“双监控”。\"\n  }\n]"
