name: audit/审查报告类/测试报告
type: model
description: 从审查报告类类文档（测试报告）中提取结构化元数据。涵盖字段如：实际功能模块清单。文档范围包括：信息化平台功能验收测试报告（或用户操作手册）等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 测试报告
  member_count: 1
  member_details:
  - 信息化平台功能验收测试报告（或用户操作手册）
output:
  fields:
  - name: 实际功能模块清单
    type: string
    description: 提取 实际功能模块清单 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: (验收报告.实际完成指标项 / 规划文件.建设目标指标项) < 0.90 OR (规划文件.要求完成时间 < 系统当前日期 AND 验收报告.验收通过时间 IS NULL)
  description: 完成率低于90%视为未按规定完成建设任务；超期未验收同样判定为未完成。阈值可根据具体规划要求调整。
  audit_item: 教育信息化基本要求未按规定完成
  suspicion: 教育信息化“三通两平台”建设项目未达标
  regulation: "[\n  {\n    \"法规名称\": \"教育信息化2.0行动计划\",\n    \"法规文号\": \"教技〔2018〕6号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"三、主要任务 （一）推进“宽带网络校校通”；（二）建设“教育资源公共服务平台”\",\n    \"内容概述\": \"要求各级各类学校宽带网络全覆盖，建成教育资源公共服务平台和教育管理公共服务平台，实现优质资源班班通和网络学习空间人人通，并明确各阶段完成时间节点。\"\
    \n  }\n]"
