name: audit/审查报告类/结算报告
type: model
description: 从审查报告类类文档（结算报告）中提取结构化元数据。涵盖字段如：工程总造价、结算金额、资金来源说明。文档范围包括：楼堂馆所工程结算报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 工程
- 金额
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 结算报告
  member_count: 1
  member_details:
  - 楼堂馆所工程结算报告
output:
  fields:
  - name: 工程总造价
    type: string
    description: 提取 工程总造价 的文本值
  - name: 结算金额
    type: number
    description: 提取 结算金额 的数值（含单位，如万元、吨等）
  - name: 资金来源说明
    type: string
    description: 提取 资金来源说明 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
