    \n  },\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行"
- expression: (绩效目标申报表.指标值 LIKE '%定性%' OR 绩效目标申报表.指标值 IS NULL OR 绩效目标申报表.指标数据来源说明 IS NULL) && (绩效指标量化标准表.计算公式 IS NULL)
  description: 该表达式判断目标是否可衡量。当申报表中的‘指标值’为纯定性文字描述（如‘好’、‘满意’、‘显著提升’）或空值，并且其‘数据来源说明’为空，表明不知道由谁、用什么方法收集数据；同时，在单位配套的‘量化标准表’中也找不到针对这个指标的计算公式或评分细则时，即可判定该目标完全不可衡量。一个既无量化值、也无计算方法、更无数据来源的目标，等同于一场‘自己既当运动员又当裁判员’且规则为空的游戏。
