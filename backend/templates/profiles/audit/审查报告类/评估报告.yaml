name: audit/审查报告类/评估报告
type: model
description: 从审查报告类类文档（评估报告）中提取结构化元数据。涵盖字段如：上报的受益面积、不合格项明细、与其他产业冲突说明、主要质量缺陷、交易对方名称、保障措施、关键参数、准入标准条款。文档范围包括：上市公司独立性评估报告、产业帮扶政策效果评估报告、价格评估报告、供餐模式可行性评估报告、债务偿付能力评估报告、债转股评估报告、农业保险政策实施效果评估报告、反担保相关评估报告、品牌价值评估报告、国有资产评估报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 合同
- 安全
- 明细
- 资产
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
