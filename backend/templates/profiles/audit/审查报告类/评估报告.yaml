  description: 设置三项触发条件：①资产负债率超过100%仍大额融资；②未来12个月经营性现金流对到期债务的覆盖率不足1.2倍，偿付压力过大；③实际融资用途与申报用途不符，存在挪用。满足任一条件即判定为超额融资或偿付能力不足疑点。
  audit_item: 投融资管理方面存在的问题
  suspicion: 融资超过企业实际发展需求或偿付能力
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产监督管理暂行条例\",\n    \"法规文号\": \"国务院令第378号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第30条\",\n    \"内容概述\": \"国有及国有控股企业应当加强内部监督和风险控制，依照国家有关规定建立健全财务、审计、企业法律顾问和职工民主监督等制度。\"\n  },\n  {\n    \"法规名称\": \"\
    关于加强国有企业资产负债约束的指导意见\",\n    \"法规文号\": \"中共中央办公厅、国务院办公厅印发\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第二部分\",\n    \"内容概述\"\
    : "
- expression: (EXISTS (案件概况 WHERE 败诉可能性 >= '很可能' AND 诉求金额 > 0) AND (计提金额.计算假设 < 诉求金额*合理估计比例))  ||  (SUM(登记台账.担保金额) * (1 -
    被担保方平均信用系数) > (计提金额-估计依据))  ||  (评估报告.或有负债披露金额 > 分析表.期末余额)
  description: “很可能”指概率大于50%，合理估计比例结合律师意见确定，通常不低于50%。若未决诉讼符合确认条件而未计提或计提严重不足即违规；对外担保存在代偿风险应依据被担保方财务状况计提相应损失，若计提比例低于预计代偿净额则视为低估负债。
  audit_item: 未按规定核算负债
  suspicion: 未按规定确认预计负债
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第13号——或有事项\",\n    \"法规文号\": \"财会[2006]3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"与或有事项相关的义务同时满足下列条件的，应当确认为预计负债：（一）该义务是企业承担的现时义务；（二）履行该义务很可能导致经济利益流出企业；（三）该义务的金额能够可靠地计量。\"\
    \n  }\n]"
- expression: (权属证明.法律状态（有效/失效/过期） = '失效' || 评估报告.可收回金额 <= 0) && (明细表.资产原值 - 明细表.累计摊销 - 明细表.减值准备余额 > 0)
  description: 无形资产法律保护期届满或预期不能带来经济利益时，其账面价值应全额计提减值或核销，若账面仍有余额则为虚增资产。
  audit_item: 未按规定核算资产
  suspicion: 已失效无形资产未作减值处理
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第6号——无形资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"无形资产预期不能为企业带来经济利益的，应当将该无形资产的账面价值予以转销。\"\n  }\n]"
- expression: 情况表.是否附评估报告!="是" || 情况表.评估报告审批状态!="通过" || (验收报告.评估预测能耗-项目实际能耗)/评估预测能耗>0.1
  description: 若项目缺失节能评估报告、审批未通过，或实际能耗超出评估预测值10%以上(可能为虚假评估)，则判定为违规。
  audit_item: 节能减排方面存在的问题
  suspicion: 未按规定开展固定资产投资项目节能评估审查
  regulation: "[\n  {\n    \"法规名称\": \"固定资产投资项目节能审查办法\",\n    \"法规文号\": \"国家发展和改革委员会令第44号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第三条、第九条、第十三条\",\n    \"内容概述\": \"固定资产投资项目投入生产、使用前，应通过节能审查；未按规定进行节能审查或审查未通过的项目，建设单位不得开工建设，已经建成的不得投入生产、使用。\"\
    \n  }\n]"
- expression: (出借合同.合同租金单价 < 评估报告.同期同类资产市场租金下限 * 0.8) || (闲置资产认定标准、处置时限要求、出租审批权限、招租程序要求、租金定价规则.出租审批权限缺失关键节点) || (出借台账.收款金额
    != 出借合同.实收租金与合同应计差异 && 无减免审批文件) || (出借合同.承租方股东 in (员工亲属名单) && 会议纪要.表决结果 != '通过')
  description: 当租金明显低于市场价（低于市场下限80%）、审批流程缺失关键控制节点、实收租金与合同约定不一致且无有效减免审批，或关联人承租未经集体决策时，均构成违反规定出租出借。
  audit_item: 资产管理方面存在的问题
  suspicion: 违反内部规定出租出借资产
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会 财政部令第32号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"企业国有资产交易应当遵守国家法律法规和政策规定，遵循等价有偿和公开、公平、公正的原则，在依法设立的产权交易机构中公开进行。\"\n  }\n]"
- expression: (记录表.接收方名称 in (文件清单) && (记录表.转移费用 = 0 || 资产使用条款.费用约定 = '无偿使用')) && (批准文件.批准状态 != '已批准' || 评估报告.评估价值 != 资产使用条款.费用约定)
  description: 向职工持股企业调拨资产且未收取任何费用或无对价约定，同时缺少董事会关联交易批准或评估定价依据缺失的，直接构成违规无偿提供资产。
  audit_item: 资产管理方面存在的问题
  suspicion: 无偿向职工持股企业提供资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十四条\",\n    \"内容概述\": \"国有独资企业、国有独资公司、国有资本控股公司不得无偿向关联方提供资金、商品、服务或者其他资产，不得以不公平的价格与关联方进行交易。\"\n  }\n]"
- expression: (授权使用费标准.授权使用费标准 = 0 || 使用台账.付费记录 = '无' && 备案使用主体.备案状态 = '未备案') && (使用台账.使用企业名称 in (参股企业名单) && 事故责任方.记录数 > 0)
    || (授权期价值变动.授权期价值变动 < -0.2)
  description: 向参股企业提供字号、资质等无形资产而未收取使用费、未备案或缺少监督，且引发质量事故导致品牌价值下降20%以上的，即构成违规授权且未有效维护权益。
  audit_item: 资产管理方面存在的问题
  suspicion: 违规向参股企业提供字号、资质等无形资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十四条\",\n    \"内容概述\": \"国有独资企业、国有独资公司、国有资本控股公司不得无偿向关联方提供资金、商品、服务或者其他资产，不得以不公平的价格与关联方进行交易。\"\n  }\n]"
- expression: 监控表.受托支付对象 = 贷款合同.借款方 && (ABS = 0 || 贷款合同.贷款金额 > 税申报表.销售收入 * 0.5) && 评估报告.评估价值 > 0
  description: 贷款资金支付给关联虚构供应商，且申请材料中贸易合同规模远超实际经营能力，抵押物价值虚高，三者结合判定骗取贷款。
  audit_item: 资金管理方面存在的问题
  suspicion: 虚构贸易背景套取贷款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百七十五条之一\"\
    ,\n    \"内容概述\": \"以欺骗手段取得银行或者其他金融机构贷款，给银行或者其他金融机构造成重大损失的，构成骗取贷款罪。\"\n  }\n]"
