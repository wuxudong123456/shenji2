name: audit/审查报告类/排查报告
type: model
description: 从审查报告类类文档（排查报告）中提取结构化元数据。涵盖字段如：保护区边界描述、整改措施、污染源分布情况、污染源整治状态。文档范围包括：水源保护区污染源排查报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 整改
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 排查报告
  member_count: 1
  member_details:
  - 水源保护区污染源排查报告
output:
  fields:
  - name: 保护区边界描述
    type: string
    description: 提取 保护区边界描述 的文本值
  - name: 整改措施
    type: string
    description: 提取 整改措施 的文本值
  - name: 污染源分布情况
    type: string
    description: 提取 污染源分布情况 的文本值
  - name: 污染源整治状态
    type: boolean
    description: 提取 污染源整治状态 的布尔值（是/否）
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 政府批文 IS NULL || 批文.保护区范围坐标 != 取水口实际缓冲区域 || (取水口投产日期 > 批文.批复日期+365天)
  description: 1.未划定：无政府关于该水源地保护区的正式批文；2.范围不符：在取水口周围应划定的一级、二级保护区范围未按规定(如一级保护区半径30米)落实；3.划定延迟：工程投产后超过一年仍未完成保护区划定，违反法定要求。满足任一条件即判定为违规。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 饮用水水源保护区未依法划定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第六十三条\",\n    \"内容概述\": \"县级以上人民政府应当划定饮用水水源保护区，报省级人民政府批准，并设立明确的地理界标和警示标志。\"\n  },\n  {\n    \"法规名称\": \"饮用水水源保护区污染防治管理规定\"\
    ,\n    \"法规文号\": \"国家环境保护局、卫生部、建设部、水利部、地矿部（89）环管字第201号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    "
- expression: (清单表.距取水口距离 < 保护区法定最小距离) || (排查报告.污染源整治状态='未整治' 且 距离取水口 < 500米) || (存在工业排污口且验收文件.处理工艺是否针对特定污染物未包含相应深度处理)
  description: 1.保护区内违规存在污染源：如养殖场、工厂排污口、垃圾填埋场等位于一级或二级保护区内；2.已知污染风险长期未整治：排查报告中标记为需整治但状态为未整改；3.工艺适应不足：存在特殊污染物(如重金属、氟化物)但净水工艺仅为常规处理，无法有效去除。满足任一条件即存在污染风险。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 水源保护区存在污染风险未整治
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国水污染防治法\",\n    \"法规文号\": \"主席令第70号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第六十五条\",\n    \"内容概述\": \"禁止在饮用水水源一级保护区内新建、改建、扩建与供水设施和保护水源无关的建设项目；已建成的，由县级以上人民政府责令拆除或者关闭。\"\n  },\n  {\n    \"\
    法规名称\": \"饮用水水源保护区污染防治管理规定\",\n    \"法规文号\": \"（89）环管字第201号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"\
    内容概述\""
