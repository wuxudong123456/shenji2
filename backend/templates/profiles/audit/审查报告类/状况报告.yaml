name: audit/审查报告类/状况报告
type: model
description: 从审查报告类类文档（状况报告）中提取结构化元数据。涵盖字段如：实际剩余经济寿命、技术淘汰评估。文档范围包括：资产使用状况报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 状况报告
  member_count: 1
  member_details:
  - 资产使用状况报告
output:
  fields:
  - name: 实际剩余经济寿命
    type: string
    description: 提取 实际剩余经济寿命 的文本值
  - name: 技术淘汰评估
    type: string
    description: 提取 技术淘汰评估 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: ((明细表.本年折旧年限 != 明细表.原折旧年限 && 政策文件.批准变更的董事会决议 IS NULL) || (ABS(明细表.本年折旧年限 - 行业平均水平) / 行业平均水平 > 0.5 && 政策文件.变更原因说明
    IS NULL) || (净残值率变更导致本期折旧额减少 > 上年折旧额的20% && 其他.涉及折旧年限调整的记录 IS NULL))
  description: 折旧年限与上年不同且无审批，或与行业均值偏差超50%且无充分依据，或净残值变更导致折旧额骤减20%以上，均属随意变更。
  audit_item: 未按规定确认成本费用
  suspicion: 随意变更资产折旧摊销年限或净残值
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第4号——固定资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十五条、第十九条\",\n    \"内容概述\": \"企业应当根据固定资产的性质和使用情况，合理确定使用寿命和预计净残值。使用寿命、预计净残值一经确定，不得随意变更。\"\n  }\n]"
