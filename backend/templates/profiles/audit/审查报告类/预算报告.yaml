name: audit/审查报告类/预算报告
type: model
description: 从审查报告类类文档（预算报告）中提取结构化元数据。涵盖字段如：农业保险保费补贴预算金额、动用上年结余预算科目、单位名称、申报人数、购房补贴预算金额、预算单位编码、预算支出科目代码、预算支出金额。文档范围包括：地方财政年度预算报告、被审计单位年度预算报告等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 审查报告类
- 审计
- 补贴
- 金额
- 预算
- 元数据提取
template_class:
  category: 审查报告类
  member_types:
  - 预算报告
  member_count: 1
  member_details:
  - 地方财政年度预算报告
  - 被审计单位年度预算报告
output:
  fields:
  - name: 农业保险保费补贴预算金额
    type: number
    description: 提取 农业保险保费补贴预算金额 的数值（含单位，如万元、吨等）
  - name: 动用上年结余预算科目
    type: number
    description: 提取 动用上年结余预算科目 的数值（含单位，如万元、吨等）
  - name: 单位名称
    type: string
    description: 提取 单位名称 的文本值
  - name: 申报人数
    type: number
    description: 提取 申报人数 的数值（含单位，如万元、吨等）
  - name: 购房补贴预算金额
    type: number
    description: 提取 购房补贴预算金额 的数值（含单位，如万元、吨等）
  - name: 预算单位编码
    type: number
    description: 提取 预算单位编码 的数值（含单位，如万元、吨等）
  - name: 预算支出科目代码
    type: number
    description: 提取 预算支出科目代码 的数值（含单位，如万元、吨等）
  - name: 预算支出金额
    type: number
    description: 提取 预算支出金额 的数值（含单位，如万元、吨等）
  - name: 预算收入科目代码
    type: number
    description: 提取 预算收入科目代码 的数值（含单位，如万元、吨等）
  - name: 预算收入金额
    type: number
    description: 提取 预算收入金额 的数值（含单位，如万元、吨等）
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 报告结论
    type: string
    description: 审查报告的最终结论或意见
    required: false
  - name: 问题清单
    type: string
    description: 审查中发现的问题列表或摘要
    required: false
  - name: 被审查对象
    type: string
    description: 被审查的单位、项目或个人
    required: false
violations:
- expression: 下属单位名单中(是否独立核算='否' 或 预算合并标记='应合并') && 单位名称 NOT IN 预算报告中的预算单位名称
  description: 筛查下属单位清单中应纳入部门预算合并范围（非独立核算或制度规定应合并），但未在预算报告中出现的单位，触发即为漏编。
  audit_item: 预算编制不完整
  suspicion: 所属单位未纳入部门预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第六条\",\n    \"内容概述\": \"各部门预算由本部门及其所属单位预算组成。\"\n  }\n]"
- expression: 动用金额 > 0 && (预算报告中动用上年结余科目金额 = 0 || 动用审批状态 != '已批复')
  description: 若存在实际动用以前年度结余资金的行为，但预算中未安排相应科目或数额为0，或者动用未获财政部门正式批复，则判定为预算不完整。
  audit_item: 预算编制不完整
  suspicion: 动用以前年度结余资金未纳入预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"预算由预算收入和预算支出组成。政府的全部收入和支出都应当纳入预算。\"\n  },\n  {\n    \"法规名称\": \"中央部门结转和结余资金管理办法\"\
    ,\n    \"法规文号\": \"财预〔2016〕18号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"中央部门动用结转结余资金，应当纳入年度预算，按照规定"
- expression: (非经营性收入金额 > 0 && 对应预算收入科目未设置 OR 预算收入金额 = 0) || (非经营性支出金额 > 0 && 对应预算支出科目未设置 OR 预算支出金额 = 0)
  description: 筛查存在实际非经营性收支（如租金、利息、捐赠、上级补助等），但预算中未编列相应科目或金额为零的情况，确认是否漏编。
  audit_item: 预算编制不完整
  suspicion: 非经营性收支未纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"预算由预算收入和预算支出组成。政府的全部收入和支出都应当纳入预算。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n\
    \    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条\",\n    \"内容概述\": \"各部门、各单位应当按照国务院财政部门制定"
- expression: 预算申报购房补贴金额 > 补贴标准 × 实际符合条件人数 && 实际发放金额 < 批复金额 * 0.9
  description: 申报预算金额超出按政策标准和实际符合人数计算的理论最大值，且财政批复金额远高于实际发放金额（实际发放占比低于90%），表明可能存在虚报人数或标准，多申财政资金。
  audit_item: 预算编制不完整
  suspicion: 购房补贴预算虚报多申财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位的支出必须按照预算执行，不得虚假列支。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"国家机关及其工作人员虚报、冒领财政资金，以及骗取财政拨款或者补贴"
- expression: 地方财政配套资金落实情况对比表.实际配套金额 < 地方财政配套资金落实情况对比表.应配套金额 * 0.95 || 地方财政年度预算报告.农业保险保费补贴预算金额 < 地方财政配套资金落实情况对比表.应配套金额 * 0.95
  description: 应配套金额=中央及省级下达资金×地方应承担比例；实际配套金额取自决算报告或银行拨付流水；低于应配套金额95%即视为重大未足额配套（考虑预算执行偏差容忍度），预算安排不足亦纳入疑点。
  audit_item: 农业保险保费补贴未按规定配套、拨付、管理和结算
  suspicion: 地方财政未按规定配套保费补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业保险保费补贴管理办法\",\n    \"法规文号\": \"财金〔2021〕113号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第七条、第八条\",\n    \"内容概述\": \"地方财政部门应按规定比例及时足额安排保费补贴预算，确保补贴资金到位，不得降低配套标准或转嫁配套责任。\"\n  }\n]"
