name: audit/登记台账类/识别台账+评估台账
type: model
description: 从登记台账类类文档（识别台账、评估台账）中提取结构化元数据。涵盖字段如：修订日期、条款号、法规名称、生效日期、禁止/限制/要求性标识。文档范围包括：法律法规评估台账、法律法规识别台账等。本模板合并了 2 个相似子类型。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 识别台账
  - 评估台账
  member_count: 2
  member_details:
  - 法律法规评估台账
  - 法律法规识别台账
output:
  fields:
  - name: 修订日期
    type: date
    description: 提取 修订日期 的日期值，格式 YYYY-MM-DD
  - name: 条款号
    type: number
    description: 提取 条款号 的数值（含单位，如万元、吨等）
  - name: 法规名称
    type: string
    description: 提取 法规名称 的文本值
  - name: 生效日期
    type: date
    description: 提取 生效日期 的日期值，格式 YYYY-MM-DD
  - name: 禁止-限制-要求性标识
    type: string
    description: 提取 禁止-限制-要求性标识 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (法律法规识别台账.条款号 IS NOT NULL && 审计事项清单.对应法规条款号 IS NULL) || (ABS(COUNT(法律法规识别台账.条款号) - COUNT(审计事项清单.对应法规条款号)) >
    0) || (法律法规识别台账.修订日期 < 法律法规识别台账.生效日期)
  description: 判定单位是否将外部法律法规中的禁止性、限制性及要求性条款完整、及时地转化为内部审计事项清单和审计关注重点。表达式第一部分：存在法规条款但未映射到任何审计事项，即为疑点；第二部分：法规条款总数与审计事项覆盖的法规条款数不一致，触发疑点；第三部分：内部审计制度修订时间早于新法规生效日期，表明制度未能跟进法规更新，存在合规断档。风险等级：法规条款缺失映射为高风险，总数偏差为低风险，制度滞后的为预警。
  audit_item: 从法规到事项
  suspicion: 未建立法规条款与审计事项动态映射机制
  regulation: "[\n  {\n    \"法规名称\": \"审计署关于内部审计工作的规定\",\n    \"法规文号\": \"审计署令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"内部审计机构应当对本单位及所属单位贯彻落实国家重大政策措施情况进行审计；对本单位及所属单位发展规划、战略决策、重大措施以及年度业务计划执行情况进行审计。\"\n  },\n  {\n\
    \    \"法规名称\": \"中国内部审计准则第2101号内部审计具体准则——审计计划\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第八条\"\
    ,\n  "
