name: audit/登记台账类/征收台账
type: model
description: 从登记台账类类文档（征收台账）中提取结构化元数据。涵盖字段如：实缴金额、实际征收单价/金额、实际征收日期、实际缴款人名称、征收金额、所属期、收费项目名称、纳税人名称。文档范围包括：税务征收台账、非税收入征收台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 征收台账
  member_count: 1
  member_details:
  - 税务征收台账
  - 非税收入征收台账
output:
  fields:
  - name: 实缴金额
    type: number
    description: 提取 实缴金额 的数值（含单位，如万元、吨等）
  - name: 实际征收单价-金额
    type: number
    description: 提取 实际征收单价-金额 的数值（含单位，如万元、吨等）
  - name: 实际征收日期
    type: date
    description: 提取 实际征收日期 的日期值，格式 YYYY-MM-DD
  - name: 实际缴款人名称
    type: number
    description: 提取 实际缴款人名称 的数值（含单位，如万元、吨等）
  - name: 征收金额
    type: number
    description: 提取 征收金额 的数值（含单位，如万元、吨等）
  - name: 所属期
    type: string
    description: 提取 所属期 的文本值
  - name: 收费项目名称
    type: number
    description: 提取 收费项目名称 的数值（含单位，如万元、吨等）
  - name: 纳税人名称
    type: string
    description: 提取 纳税人名称 的文本值
  - name: 计税金额
    type: number
    description: 提取 计税金额 的数值（含单位，如万元、吨等）
  - name: 费种
    type: number
    description: 提取 费种 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (征收台账.收费项目名称 IN (法定征收对象、法定收费标准上限、法定项目名称、法定征收标准、已取消项目名称、取消执行日期.已取消项目名称)) && (征收台账.实际征收日期 > 法定征收对象、法定收费标准上限、法定项目名称、法定征收标准、已取消项目名称、取消执行日期.取消执行日期)
    && (征收台账.征收金额 > 0)
  description: 该表达式用于识别在政策规定的取消执行日期之后，被审计单位仍存在征收已取消项目的行为。通过将征收台账中的项目名称与已取消项目清单匹配，并比对征收日期和金额，只要在取消日期后产生任何大于零的收费记录，即判定为违规。
  audit_item: 违反规定设立非税收入
  suspicion: 继续征收已明令取消的非税收入项目
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"非税收入项目应当依法设立。已明确取消、停征、减征、免征或者缓征的非税收入项目，执收单位应当严格按照规定执行。\"\n  }\n]"
- expression: (征收台账.实际缴款人名称 NOT IN (明细表.规定征收对象)) || (征收台账.实际征收单价/金额 > 明细表.规定收费标准) || (征收台账.实际征收单价/金额 > 政策文件.法定收费标准上限)
  description: 该表达式用于发现征收环节的两种违规越权行为：一是实际缴款人不属于政策批准的征收对象范围；二是征收标准超过了法定上限或本单位制定的内部标准。只要满足任一条件，即构成违规。其中，收费标准混淆了法定上限与内部标准，但凡超过任一标准即触发告警。
  audit_item: 违反规定设立非税收入
  suspicion: 扩大非税收入征收对象与提高收费标准
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"执收单位应当严格按照规定的非税收入项目、征收对象、征收标准、征收期限以及减免缓政策进行征收，不得擅自扩大征收范围、提高征收标准。\"\n  }\n]"
- expression: (征收台账.实际征收日期 > 明细表.规定征收截止日期) && (征收台账.征收金额 > 0)
  description: 该表达式用于检查是否存在已到规定截止期限的收费项目仍在继续征收的问题。通过逐行比对征收台账中每条收费记录的发生日期与该项目在政策文件或批准文件中载明的截至日期，一旦发现征收日期在截止日期之后且金额不为零，即判定为违规超期征收。
  audit_item: 违反规定设立非税收入
  suspicion: 超期限征收非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"执收单位应当严格按照规定的……征收期限……进行征收，不得擅自……延长征收期限。\"\n  }\n]"
- expression: 征收台账.费种（教育费附加/地方教育附加） IN ('教育费附加','地方教育附加') AND 征收台账.实缴金额>0 AND 项目清单.项目类型 IN ('公租房','棚户区改造','经济适用房') AND 征收台账.纳税人名称=项目清单.建设单位
  description: 根据财税〔2019〕61号等文件，保障性安居工程免收教育费附加和政府性基金，若税务机关对保障房建设企业实际征收，则判定违规。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规征收保障性安居工程建设企业教育费附加
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于保障性安居工程资金投入管理的通知\",\n    \"法规文号\": \"财税〔2019〕61号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"对保障性安居工程项目免征城市基础设施配套费、教育费附加、地方教育附加等政府性基金。\"\n  }\n]"
