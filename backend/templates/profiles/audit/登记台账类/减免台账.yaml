name: audit/登记台账类/减免台账
type: model
description: 从登记台账类类文档（减免台账）中提取结构化元数据。涵盖字段如：享受退役军人就业税收优惠企业名称、减免税种、减免金额、所属期。文档范围包括：税务部门税收减免台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 减免台账
  member_count: 1
  member_details:
  - 税务部门税收减免台账
output:
  fields:
  - name: 享受退役军人就业税收优惠企业名称
    type: string
    description: 提取 享受退役军人就业税收优惠企业名称 的文本值
  - name: 减免税种
    type: string
    description: 提取 减免税种 的文本值
  - name: 减免金额
    type: number
    description: 提取 减免金额 的数值（含单位，如万元、吨等）
  - name: 所属期
    type: string
    description: 提取 所属期 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 文件5 IS NULL || (文件5.优惠措施条款（税收减免、社保补贴、岗位补贴等） 不包含 '税收减免' && 文件5.优惠措施条款（税收减免、社保补贴、岗位补贴等） 不包含 '岗位补贴') || (COUNT(统计表.是否已享受优惠政策标记)
    / COUNT(统计表.招录企业名称) < 0.3) || (减免台账.减免金额 < 统计表.招录退役军人数 × 0.5)
  description: 条件1：未出台任何红包头文件；条件2：虽出台文件但缺乏核心优惠措施（税收或补贴）；条件3：实际享受优惠企业占招录企业总数比例低于30%，反映政策覆盖率低；条件4：税务系统实际减免企业数严重少于招录企业数（阈值50%），可能表现为政策宣传不到位或申报门槛过高。四个条件满足任一即触发疑点。30%和50%阈值参考典型审计经验设定。
  audit_item: 未按规定落实自主就业退役士兵安置政策
  suspicion: 未出台或未实质落实用人单位招用退役军人优惠政策
  regulation: "[\n  {\n    \"法规名称\": \"关于促进新时代退役军人就业创业工作的意见\",\n    \"法规文号\": \"退役军人部发〔2018〕26号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三部分第（七）条\",\n    \"内容概述\": \"明确企业招用自主就业退役士兵，可按有关规定享受税收优惠等政策，要求各地制定具体落实措施。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于进一步扶持自主就业退役士兵创业就业有关税收政策的通知\",\n    \"法规文号\": \"财税〔2019〕21号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条、第二条\"\
    ,\n  "
