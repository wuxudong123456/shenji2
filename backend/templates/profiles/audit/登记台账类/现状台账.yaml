name: audit/登记台账类/现状台账
type: model
description: 从登记台账类类文档（现状台账）中提取结构化元数据。涵盖字段如：原地块平均土层厚度、土层厚度、地力等级、地块编号、地类、有机质含量、面积、黑土层厚度。文档范围包括：黑土地资源现状台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 现状台账
  member_count: 1
  member_details:
  - 黑土地资源现状台账
output:
  fields:
  - name: 原地块平均土层厚度
    type: string
    description: 提取 原地块平均土层厚度 的文本值
  - name: 土层厚度
    type: string
    description: 提取 土层厚度 的文本值
  - name: 地力等级
    type: string
    description: 提取 地力等级 的文本值
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 地类
    type: string
    description: 提取 地类 的文本值
  - name: 有机质含量
    type: string
    description: 提取 有机质含量 的文本值
  - name: 面积
    type: string
    description: 提取 面积 的文本值
  - name: 黑土层厚度
    type: string
    description: 提取 黑土层厚度 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (变化图斑坐标、面积、变化类型、时间戳、实际占地图斑与审批红线比对差异、NDVI时序曲线.面积 > 0.5 公顷 && 变化图斑坐标、面积、变化类型、时间戳、实际占地图斑与审批红线比对差异、NDVI时序曲线.变化类型
    == '表土消失') && (地块编号、面积、地类、土层厚度、黑土层厚度、有机质含量、原地块平均土层厚度、地力等级.地块坐标 ∩ 变化图斑坐标、面积、变化类型、时间戳、实际占地图斑与审批红线比对差异、NDVI时序曲线.变化图斑坐标 !=
    ∅) && (项目坐标、审批文号、用地范围矢量、项目名称、占用黑土地面积、审批层级、坐标范围、地块坐标、施工周期、用地范围坐标.地块坐标 ∩ 变
  description: 判定未审批区域出现表土消失图斑且面积大于0.5公顷(约合7.5亩)且该区域属于黑土地数据库,同时存在违法案件记录或处罚记录的构成疑点;面积阈值可结合地方耕作层厚度敏感度调整,土方量条件用于排除已立案未移送情况。
  audit_item: 破坏或未有效利用黑土地
  suspicion: 盗挖、滥挖及非法买卖黑土行为
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十七条、第三十条\",\n    \"内容概述\": \"禁止盗挖、滥挖和非法买卖黑土;违反规定盗挖、滥挖黑土的,由县级以上人民政府自然资源、农业农村等主管部门按照职责责令改正,限期恢复原状,处每立方米五百元以上两千元以下罚款;非法买卖黑土的,没收违法所得,并处每立方米一千元以上五千元以下罚款。\"\
    \n  }\n]"
- expression: (备案表.占用黑土地面积 > 0 && 实施方案.计划剥离量(立方米) > 0) && (统计表.实际剥离量 < 实施方案.计划剥离量(立方米) * 0.9 || 统计表.实际利用量 / 统计表.实际剥离量 < 0.9)
    && (审批文件.完工时间 > 当前日期 - 365天)
  description: 审批占用黑土地的建设项目必须编制剥离方案并实施。实际剥离量低于方案计划量的90%视为未充分剥离;实际利用量(用于新开垦耕地或改良劣地的量)占实际剥离量的比例低于90%视为未有效利用。时间窗口限定为完工一年内项目,以避免历史遗留干扰。
  audit_item: 破坏或未有效利用黑土地
  suspicion: 建设项目未按规定实施耕作层土壤剥离利用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条、第二十条\",\n    \"内容概述\": \"建设项目占用黑土地的,应当按照标准和技术规范进行表土剥离,剥离的表土应当用于新开垦耕地和劣质耕地改良、高标准农田建设、土地复垦等;违反规定未进行表土剥离的,由县级以上人民政府自然资源主管部门责令限期改正,并处每平方米二百元以上五百元以下罚款。\"\
    \n  }\n]"
- expression: (检测报告.重金属含量(mg/kg) > GB 15618-2018风险筛选值 || 汇总表.土壤侵蚀模数(t/(km²·a)) > 500 t/(km²·a) ) && (其他.植被覆盖度变化率 < -15% ||
    NDVI均值 同比下降 0.2) && (责任书.考核结果 == '不合格' 或 存在未达标项)
  description: 根据土壤环境质量标准,重金属超过风险筛选值可视作污染风险;水利部界定东北黑土区允许土壤侵蚀模数为200-500 t/(km²·a),超过500异常;植被覆盖度下降超过15%或NDVI显著降低,结合考核不达标,表明保护措施失效。
  audit_item: 破坏或未有效利用黑土地
  suspicion: 黑土地保护不力导致污染或水土流失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十五条、第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当采取工程、生物等措施,防止黑土地污染和水土流失;任何组织和个人不得向黑土地倾倒废水、废弃物等;造成污染的应当修复。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国水土保持法\",\n    \"法规文号\": \"中华人民共和国主席令第39号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十七条\"\
    ,\n    \""
