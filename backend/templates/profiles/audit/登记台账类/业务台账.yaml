violations:
- expression: 业务台账.持股比例 > 0 && 业务台账.持股比例 < 100% && (业务台账.担保金额 / 计算表.被担保企业净资产) > 业务台账.持股比例 && (业务台账.是否有反担保标识 != '是')
  description: 对参股企业提供的担保金额与其净资产的比值超过公司持股比例，且未要求其他股东按股权比例共同提供担保，也未取得被担保方相应的反担保，即判定为超股权比例违规担保。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 对参股企业提供担保超出持股比例
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"中央企业应当严格按照持股比例对子公司和参股企业提供担保。严禁对参股企业超股比担保。\"\n  },\n  {\n    \"法规名称\": \"关于规范上市公司对外担保行为的通知\"\
    ,\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"上市公司对外担保必须经董"
- expression: (担保类型（是否全资子公司） != '全资子公司' OR 担保类型（是否全资子公司） != '控股子公司') && (反担保合同编号 IS NULL OR 反担保合同编号 = '')
  description: 根据监管规定，上市公司对外担保（除对全资子公司及控股子公司提供担保外）必须要求被担保人提供反担保。若台账中符合条件的担保事项缺乏有效的反担保合同，即构成违规。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 上市公司对外担保未要求被担保人提供反担保
  regulation: "[\n  {\n    \"法规名称\": \"关于规范上市公司对外担保行为的通知\",\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第一条（三）\",\n    \"内容概述\": \"上市公司对外担保必须要求对方提供反担保，且反担保的提供方应当具有实际承担能力。\"\n  },\n  {\n    \"法规名称\": \"上市公司监管指引第8号——上市公司资金往来、对外担保的监管要求\"\
    ,\n    \"法规文号\": \"证监会公告〔2022〕26号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \""
- expression: （被担保方名称、担保金额、担保类型、是否关联方、担保类型（是否全资子公司）、是否有反担保标识、担保合同编号、担保开始日.担保合同编号 NOT IN （披露的担保合同清单、金额.披露的担保合同清单 ∪ 披露的担保合同清单、金额.披露的担保合同清单））
    OR （涉诉担保合同编号、涉诉金额.涉诉担保合同编号 IS NOT NULL AND 涉诉担保合同编号、涉诉金额.涉诉担保合同编号 NOT IN （被担保方名称、担保金额、担保类型、是否关联方、担保类型（是否全资子公司）、是否有反担保标识、担保合同编号、担保开始日.担保合同编号））
  description: 担保台账中有记录但未在任何公开披露信息中出现的担保事项，表明信息披露缺失；诉讼记录中存在担保合同编号但台账中无对应记录，提示可能存有未入账、未披露的隐性担保。两者均触发疑点。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 上市公司存在未披露担保或隐性担保
  regulation: "[\n  {\n    \"法规名称\": \"上市公司信息披露管理办法\",\n    \"法规文号\": \"证监会令第182号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"发生可能对上市公司证券及其衍生品种交易价格产生较大影响的重大事件，投资者尚未得知时，上市公司应当立即披露。前款所称重大事件包括公司对外提供重大担保。\"\n  },\n  {\n\
    \    \"法规名称\": \"关于规范上市公司对外担保行为的通知\",\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\"\
    ,\n   "
- expression: (明细表.分类结果（负债/权益） = '权益工具') && (工具合同.强制付息条款 || 工具合同.赎回条款 || 业务台账.实际还本付息记录)
  description: 根据会计准则，当融资工具合同实质上存在不可避免的支付现金或其他金融资产的合同义务时，应分类为金融负债。若企业将其错误分类为权益工具，则属于虚假降杠杆。表达式通过审查合同条款和业务台账中的实质义务来判定违规。
  audit_item: 未按规定落实去杠杆政策措施
  suspicion: 将金融负债违规计入权益工具虚假降杠杆
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第37号——金融工具列报\",\n    \"法规文号\": \"财会〔2017〕14号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十条、第十一条\",\n    \"内容概述\": \"企业应当根据所发行金融工具的合同条款及其所反映的经济实质而非仅以法律形式，结合金融资产、金融负债和权益工具的定义，在初始确认时将金融工具或其组成部分分类为金融资产、金融负债或权益工具。如果企业不能无条件地避免以交付现金或其他金融资产来履行一项合同义务，则该合同义务符合金融负债的定义。\"\
    \n  }\n]"
- expression: (资产负债表.资产负债率 > 70%) && ( (投资项目名称、投资方向、投资金额、决策审批层级.投资方向 NOT IN 禁止类业务清单.主业目录) || (业务类型（衍生品、PPP等）、合约规模、风险敞口.业务类型（衍生品、PPP等）
    IN ('衍生品交易','PPP项目','明股实债投资') && 业务类型（衍生品、PPP等）、合约规模、风险敞口.合约规模 > 集团审批限额) )
  description: 资产负债率超过监管指导线（警戒线通常为70%）的企业，严格限制开展非主业投资和高风险业务。若高负债企业违规涉足负面清单业务或超限额开展高风险业务，即判定违规。
  audit_item: 未按规定落实去杠杆政策措施
  suspicion: 高负债企业违规开展非主业投资或高风险业务
  regulation: "[\n  {\n    \"法规名称\": \"中央企业投资监督管理办法\",\n    \"法规文号\": \"国资委令第34号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条、第十七条\",\n    \"内容概述\": \"中央企业应当聚焦主业发展，严格控制非主业投资，高负债企业原则上不得开展新增非主业投资和推高负债率的项目。不得开展超出自身承受能力的高风险投资。\"\n  }\n]"
- expression: ( (业务台账.资金收付时间 - 业务台账.货权转移时间 > 180天) AND (业务台账.客户名称 为 新成立空壳公司) ) OR ( 监控表.质押率 > 0.7 AND 监控表.货值变动率 < -10% ) OR
    ( 对比表.对外担保总额 / 对比表.净资产 > 0.5 ) OR ( 同一质押登记编号 出现在多份合同的质押协议中 )
  description: 该表达式从四个方面筛查：①融资性贸易周转天数远超行业合理水平（超过180天）且交易对手为无实质性经营的空壳公司，表明贸易背景虚假；②仓单质押率超过70%且对应货物市场价格跌幅超过10%，已突破风险预警线，担保效力严重不足；③对外担保总额超过企业净资产的50%，违反上市公司或国有企业担保限额规定；④存在“一女多嫁”现象，同一批货物仓单被重复质押给不同银行。任一条件触发即属严重违规。
  audit_item: 违规进行重大资本运作及高风险投资
  suspicion: 违规开展融资性贸易或仓单质押业务
  regulation: "[\n  {\n    \"法规名称\": \"关于规范上市公司对外担保行为的通知\",\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第一条\",\n    \"内容概述\": \"上市公司对外担保总额不得超过最近一个会计年度经审计净资产的50%，超过该限额须经特别决议，并履行信息披露义务。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于加强中央企业融资性贸易业务管控有关事项的通知\",\n    \"法规文号\": \"国资发财评规〔2017〕327号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二点\",\n\
    \    \""
