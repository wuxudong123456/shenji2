name: audit/登记台账类/业务台账
type: model
description: 从登记台账类类文档（业务台账）中提取结构化元数据。涵盖字段如：不良率、业务发生日期、业务类型、业务规模、交易流水号、交易金额、使用名称标识、借款主体。文档范围包括：住房公积金提取业务台账、住房公积金贷款业务台账、住房公积金贷款担保业务台账、担保业务台账、明股实债业务台账、融资性贸易业务台账、融资担保业务台账、表外融资业务台账、金融服务业务台账、高风险业务台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 合同
- 登记
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 业务台账
  member_count: 1
  member_details:
  - 住房公积金提取业务台账
  - 住房公积金贷款业务台账
  - 住房公积金贷款担保业务台账
  - 担保业务台账
  - 明股实债业务台账
  - 融资性贸易业务台账
  - 融资担保业务台账
  - 表外融资业务台账
  - 金融服务业务台账
  - 高风险业务台账
