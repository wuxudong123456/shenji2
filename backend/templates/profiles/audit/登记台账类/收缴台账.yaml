name: audit/登记台账类/收缴台账
type: model
description: 从登记台账类类文档（收缴台账）中提取结构化元数据。涵盖字段如：实收金额、应收金额、用户名称。文档范围包括：水费收缴台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 收缴台账
  member_count: 1
  member_details:
  - 水费收缴台账
output:
  fields:
  - name: 实收金额
    type: number
    description: 提取 实收金额 的数值（含单位，如万元、吨等）
  - name: 应收金额
    type: number
    description: 提取 应收金额 的数值（含单位，如万元、吨等）
  - name: 用户名称
    type: string
    description: 提取 用户名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 水费定价政策文件缺失 OR ABS(统计表.应收总额 - 收缴台账.实收金额) > 0 OR 统计表.实收总额 < 统计表.应收总额*0.9
  description: 存在以下任一情形即判定违规：定价政策文件缺失，水费标准无依据；收缴台账与统计表实收金额不一致，存在截留；实收率低于90%，可能收费不规范或未足额收取。
  audit_item: 农村供水工程管护不到位及运营不规范
  suspicion: 农村水费标准不明确或收缴不规范
  regulation: "[\n  {\n    \"法规名称\": \"水利部关于进一步加强农村饮水安全工程运行管护工作的指导意见\",\n    \"法规文号\": \"水农〔2015〕134号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"四、切实加强水费管理\",\n    \"内容概述\": \"应合理确定水价，建立完善的水费收缴制度，实行计量收费，确保水费足额收取、规范管理。\"\n  }\n]"
