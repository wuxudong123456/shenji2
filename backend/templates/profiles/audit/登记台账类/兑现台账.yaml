name: audit/登记台账类/兑现台账
type: model
description: 从登记台账类类文档（兑现台账）中提取结构化元数据。涵盖字段如：发放日期、实际发放金额、应分红金额、成员姓名。文档范围包括：农民股份收益分配兑现台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 兑现台账
  member_count: 1
  member_details:
  - 农民股份收益分配兑现台账
output:
  fields:
  - name: 发放日期
    type: date
    description: 提取 发放日期 的日期值，格式 YYYY-MM-DD
  - name: 实际发放金额
    type: number
    description: 提取 实际发放金额 的数值（含单位，如万元、吨等）
  - name: 应分红金额
    type: number
    description: 提取 应分红金额 的数值（含单位，如万元、吨等）
  - name: 成员姓名
    type: string
    description: 提取 成员姓名 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (财务报表.未分配利润期末 > 财务报表.未分配利润期初 AND 收益分配明细表.分红总额 = 0) OR (兑现台账.应分红金额 != 兑现台账.实际发放金额) OR (兑现台账.实际发放金额 > 0 AND 银行流水.金额合计
    != 兑现台账.实际发放金额) OR (兑现台账.发放日期逾期 > 30天 AND 收益分配方案规定发放期限)
  description: 连续有可分配收益但未分红（以未分配利润增加且分红为零为标志），或应分未足额分配，或发放记录与银行流水不匹配，或发放时间严重逾期，均表明收益分配权未得到有效保障。逾期阈值可根据方案中的约定发放日确定。
  audit_item: 集体经营性资产产权制度改革不到位
  suspicion: 农民集体资产股份收益分配权未得到保障
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四部分第（五）条及第（六）条\",\n    \"内容概述\": \"保障农民集体资产股份权利。组织实施好赋予农民对集体资产股份的占有、收益、有偿退出及抵押、担保、继承权等权能改革试点。\"\n \
    \ }\n]"
