    \ \"部门规章\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"农用薄膜生产者应当执行农用薄膜相关标准，确保产品质量合格。禁止生产、销售、使用国家明令禁止或者不符合强制性国家标准的农用薄膜。\"\n\
    \  },\n  {\n    \"法规名称\": \"聚乙烯吹塑农用地面覆盖薄膜\",\n    \"法规文号\": \"GB 13735-2017\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\":\
    \ \"4.4 "
- expression: (销售台账 IS NULL) || (地块编号、种植户、使用量（kg）、回收量（kg）、申报日期、台账存在性、使用量、回收量 IS NULL) || (台账存在性、回收总量 IS NULL) || (台账存在性、联单数量、处置数量、交膜方、收膜方、处理量、最终处置方式（再生/填埋/焚烧）
    IS NULL) || (ABS(销售台账.销售总量 - 发票存根.销售总量) / 发票存根.销售总量 > 0.10) || (地块编号、种植户、使用量（kg）、回收量（kg）、申报日期、台账存在性、使用量、回收量.回收量 > 地块编号、种植户、使用量（kg）、回收量（kg）、申报日期、台账存在性、使用量、回
  description: 任一环节台账缺失即构成违规；台账间逻辑矛盾提示数据不实，如销售台账与发票差异超过10%，回收量大于使用量10%以上，补贴量大于统计回收量10%以上，均视为可疑。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 未建立生产、销售、使用、回收记录或台账
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"农用薄膜生产者、销售者、回收网点、废旧农用薄膜回收再利用企业或其他组织等应当建立农用薄膜回收台账，如实记录废旧农用薄膜的重量、体积、杂质、缴膜人名称及其联系方式、回收时间等内容。台账保存期不少于两年。\"\
    \n  }\n]"
- expression: COUNT(回收数量等.记录行数) = 0 OR (SUM(销售台账.销售数量（包装单位）) - SUM(回收数量等.回收数量)) / SUM(销售台账.销售数量（包装单位）) > 0.7
  description: ①回收台账无任何记录，完全未开展回收工作；②以农药销售包装数量作为理论产生量，若实际回收量与理论量偏差率超过70%，即回收量不足理论量的30%，判定为未有效回收。
  audit_item: 农药化肥减量增效落实方面不符合相关规定
  suspicion: 农药包装废弃物未进行回收处理
  regulation: "[\n  {\n    \"法规名称\": \"农药包装废弃物回收处理管理办法\",\n    \"法规文号\": \"生态环境部 农业农村部令2020年第7号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"农药生产者、经营者、使用者应当积极履行农药包装废弃物回收处理义务，及时回收农药包装废弃物。\"\n  }\n]"
- expression: 明细表.生产企业名称 NOT IN (持证企业名称.持证企业名称) || 销售台账.经营单位名称 NOT IN (登记证明.持证经营单位名称)
  description: 将出厂销售明细表中的生产企业与许可证审批文件中的持证企业对比,若销售单位未取得生产许可证即为无证生产;将销售台账中的经营单位与备案登记证明对比,若未取得经营许可证即为无证经营。任一条件满足即可判定违规。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 未取得许可证生产销售农药
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十七条、第二十四条\",\n    \"内容概述\": \"国家实行农药生产许可制度,农药生产企业应当具备条件并取得农药生产许可证;国家实行农药经营许可制度,农药经营者应当具备条件并取得农药经营许可证,未取得许可证不得生产、经营农药。\"\
    \n  }\n]"
- expression: 表2.产品名称 IN (名单.禁用农药名单) || (报告.有效成分含量 < 明示值*0.9 || 报告.检测结果) || (登记表.实际数量与账面差异 ABS(账面库存-实盘库存)/账面库存 > 0.2 && 台账.购买方类型
    NOT IN ('授权单位'))
  description: 综合判定:销售品种在禁用名录中直接违规;第三方检测有效成分含量低于标称值90%或未检出即判为劣质或假农药;限用农药销售时购买方非授权单位,且库存盘点差异异常(>20%),可能涉及暗中销售禁限用农药。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 生产销售假农药、劣质农药或禁限用农药
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条、第四十五条、第四十六条\",\n    \"内容概述\": \"禁止生产、销售假农药(以非农药冒充农药或以此种农药冒充他种农药);禁止生产、销售劣质农药(不符合产品质量标准);禁止生产、销售国家明令禁止使用的农药。\"\n\
    \  }\n]"
- expression: 采购台账.供应商名称 IS NULL && 销售凭证.销售对象(经营单位) = '该经营单位' OR (销售台账.购买方名称 IS NULL && 销售凭证.数量 > 0)
  description: 经营单位有实际采购(依据生产企业销售给该经营单位的凭证)但采购台账无记录或关键字段缺失;或有销售记录但销售台账未建立或缺失购买方信息。任一条件成立,即判定未按规定建立台账。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 农药经营者未建立采购销售台账
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十六条、第二十七条\",\n    \"内容概述\": \"农药经营者应当建立采购台账,如实记录农药名称、数量、登记证号和供货商信息;应当建立销售台账,如实记录销售农药的名称、数量、购买方、销售日期等内容。经营台账应当保存2年以上。\"\
    \n  }\n]"
- expression: 销售台账.销售日期 < 当前日期 - 72小时 && (上传记录.平台接收时间 IS NULL || 上传时间.数据条数 < 销售台账.销售条目数*0.95)
  description: 按规定农药经营者应在销售后72小时内上传数据。若销售台账有记录但上传日志中无对应时间上传记录,或上传数据量明显少于同期销售条目数(如低于95%),则判定未按要求上传或选择性上传。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 农药经营者未上传经营数据至管理信息平台
  regulation: "[\n  {\n    \"法规名称\": \"《农药经营许可管理办法》\",\n    \"法规文号\": \"农业部令2017年第5号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"农药经营者应当将农药经营数据实时或按照农业主管部门规定的时限上传至农药管理信息平台,确保数据完整真实。\"\n  }\n]"
- expression: 销售台账.标称厚度 < 0.01 || (检测报告.检测厚度值 < 0.01 && 销售台账.产品批次 == 检测报告.检测批次) || (销售台账.标称厚度字段缺失 == true && 销售合同.经销商信息 !=
    null)
  description: 判定违规的三类条件（满足任一即违规）：1）台账记录的标称厚度直接低于0.01毫米；2）检测报告的实测厚度低于0.01毫米，且与台账批次匹配，揭示虚假标注；3）台账未标注厚度指标但存在销售行为，属于销售信息不完整的‘三无’产品。阈值0.01毫米为国家强制性标准。
  audit_item: 废弃农膜回收利用方面不符合相关规定
  suspicion: 生产或销售厚度小于0.010毫米的不合规农膜
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部令2020年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"禁止生产、销售、使用国家明令禁止或者不符合强制性国家标准的农用薄膜。农用薄膜生产者应当依法建立农用薄膜出厂销售记录制度。\"\n  },\n  {\n    \"法规名称\": \"\
    聚乙烯吹塑农用地面覆盖薄膜\",\n    \"法规文号\": \"GB 13735-2017\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"5.1\",\n    \"内容概述\": \"地膜的最小标称厚度"
- expression: 产品型号.销售总量 - 使用者信息.农膜用量合计 > 阈值 || 使用者信息.农膜用量合计 - 回收日期.回收重量合计 > 阈值 || (回收日期.回收日期 == NULL || 回收日期.交膜人（使用者） == NULL
    || 回收日期.回收网点经办人签字 == NULL) || ABS(回收日期.回收重量合计 - 联单编号.转运重量 WHERE 关联联单编号) > 0.1 * 回收日期.回收重量合计 || 月度处理总重量.月度处理总重量 != SUM(联单编号.转运重量
    WHERE 接收日期在当月)
  description: 从台账不完整性和数据勾稽关系异常两方面判定违规：1）销售总量与田间使用登记总量、使用登记总量与回收总量之间存在巨大差异，表明台账记录缺失严重，阈值可结合区域回收率考核标准设定（如差异率>30%为可疑）；2）回收交接记录关键字段（日期、交膜人、签字）为空，判定为无效记录或虚假台账；3)运输联单转运重量与回收交接记录重量的偏差超过±10%，揭示台账数据不实；4）月度处理统计总量与当月所有联单实际接收重
  audit_item: 废弃农膜回收利用方面不符合相关规定
  suspicion: 未按规定建立销售使用回收台账
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部令2020年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条、第十一条、第十四条\",\n    \"内容概述\": \"农用薄膜生产者、销售者、使用者、回收网点均应当依法建立台账。生产者应记录销售日期、数量、购货者等信息；使用者应记录使用时间、地点、数量等；回收网点应记录回收日期、数量、交膜人等信息。台账保存期不少于两年。\"\
    \n  }\n]"
- expression: (ABS(购房合同备案信息表.成交价格 - 房屋市场评估报告.评估价值) / 房屋市场评估报告.评估价值 > 0.2) && (贷款资金流向追踪表.收款账户 != 购房合同备案信息表.卖方账户 || 贷款资金流向追踪表.资金最终流向
    关联 购房合同备案信息表.购房人账户) || (SELECT COUNT(*) FROM 购房合同备案信息表 WHERE 房屋地址 = 本房屋地址) > 1
  description: 一是合同成交价格虚高，超出评估价20%以上，且贷款资金未按约定支付给卖方或最终回流至借款人关联账户；二是同一房屋地址在备案信息中有多条记录，涉嫌一房多贷。满足任一条件即为违规疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 个人利用虚假购房合同骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，由住房公积金管理中心责令限期退回贷款，并可处骗取金额百分之五以上百分之十以下罚款；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
- expression: (购房合同备案信息表.合同编号 NOT IN (SELECT 合同编号 FROM 房地产开发企业销售台账 WHERE 销售状态 = '真实成交')) || (贷款资金流向追踪表.最终收款账户 属于 房地产开发企业及其关联方账户
    && 购房合同备案信息表.购房人 IN (SELECT 身份证号 FROM 房地产开发企业员工名册))
  description: 第一个条件表示购房合同未在企业正常销售台账中登记，涉嫌虚构销售；第二个条件为贷款资金最终流入房企关联账户，且购房人为本企业员工，表明销售行为实质上是内部虚假操作。满足任一即构成虚假销售骗贷疑点。
