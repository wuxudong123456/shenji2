violations:
- expression: (ABS(利润表.净利润 - 现金流量表.经营活动产生的现金流量净额) / ABS(利润表.净利润)) > 0.5 && (利润表.净利润 / 利润表.营业收入) > 行业平均净利润率*1.3
  description: 以净利润为基准，经营活动现金净流量与净利润的偏差率超过50%，且净利润率显著高于行业平均水平30%以上，表明利润可能缺乏现金流支撑，存在虚构收入或提前确认收入的风险。
  audit_item: 企业财务杜邦分析
  suspicion: 净利润与经营现金流长期背离
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十三条、第二十条\",\n    \"内容概述\": \"会计凭证、会计帐簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定；单位提供的担保、未决诉讼等或有事项，应当按照国家统一的会计制度的规定，在财务会计报告中予以说明。不得以虚假的经济业务事项或者资料进行会计核算。\"\
    \n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n "
- expression: SUM(日期、原煤产量（吨）.原煤产量（吨） GROUP BY 年) > 矿井名称、核定产能（万吨/年）.核定产能（万吨/年） * 1.1 OR （日期、原煤产量（吨）.原煤产量（吨） > 矿井名称、核定产能（万吨/年）.核定产能（万吨/年）/12
    * 1.1 FOR 某月） AND 处罚日期、超产比例、处罚措施 IS EMPTY
  description: 煤矿年产量超过核定产能10%即属超能力生产，月产量超过核定月产能的10%且未被处罚记录覆盖的，表明企业有意隐瞒超产。表达式同时检查总量和月均超产，并关联处罚记录判断是否存在监管缺失。
  audit_item: 未按规定落实去产能政策措施
  suspicion: 煤矿企业超核定能力违规生产
  regulation: "[\n  {\n    \"法规名称\": \"煤矿生产能力管理办法和核定标准\",\n    \"法规文号\": \"安监总煤监〔2014〕112号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十四条\",\n    \"内容概述\": \"煤矿应当按照核定生产能力组织生产，严禁超能力生产，年度原煤产量不得超过核定生产能力的110%。\"\n  },\n  {\n    \"法规名称\": \"\
    国务院关于预防煤矿生产安全事故的特别规定\",\n    \"法规文号\": \"国务院令第446号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"\
    煤矿超能力、超强度或"
- expression: 销售台账.药品名称 not in 基本药品目录清单、基本药物名称.基本药物名称 && 报销药品名称、报销金额、报销机构名称、药品明细、总费用、患者身份证号、就诊时间、诊断.报销药品名称 = 销售台账.药品名称
  description: 将村卫生室实际销售并开具处方的药品与国家发布的基本药物目录进行比对，标记目录外药品。若此类目录外药品同时出现在医保结算中，表明存在违规报销。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 乡村医生超出基药目录用药
  regulation: "[\n  {\n    \"法规名称\": \"国家基本药物目录管理办法\",\n    \"法规文号\": \"国卫药政发〔2015〕52号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三条、第十三条\",\n    \"内容概述\": \"政府举办的基层医疗卫生机构全部配备和使用基本药物，其他各类医疗机构也都必须按规定使用基本药物。\"\n  }\n]"
- expression: (药品名称.采购渠道 not in 平台药品名称.配送企业) || (药品名称.销售单价 > 药品名称.采购单价 * 1.00 )
  description: 一是采购渠道不在省集采平台上（私自采购），二是销售单价大于采购进价（加价销售），违背零差率政策。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 私自采购并加价销售基药
  regulation: "[\n  {\n    \"法规名称\": \"关于印发巩固完善基本药物制度和基层运行新机制的意见\",\n    \"法规文号\": \"国办发〔2013〕14号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、（四）条\",\n    \"内容概述\": \"政府办基层医疗卫生机构全部配备和使用基本药物，并按购进价格实行零差率销售。\"\n  }\n]"
- expression: 销售台账.数量 > 规定.限量标准 || sum(销售台账.数量 by 患者) > 规定.限量标准
  description: 根据精麻及易成瘾药品管理规定设限，如安定片单次超7日用量或月度超限定频次即违规。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 超权限超量销售易成瘾处方药
  regulation: "[\n  {\n    \"法规名称\": \"处方管理办法\",\n    \"法规文号\": \"卫生部令第53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\"\
    ,\n    \"内容概述\": \"第二类精神药品一般每张处方不得超过7日常用量；对于慢性病或某些特殊情况的患者，处方用量可以适当延长，医师应当注明理由。\"\n  }\n]"
- expression: 销售台账.销售/使用日期 > 记录留痕类.有效期截止日
  description: 销售出库日期或注射日期晚于该批次药品的生产有效期，即构成“使用过期药”。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 销售使用过期失效药品
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国药品管理法\",\n    \"法规文号\": \"2019年修订（主席令第三十一号）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第九十八条\",\n    \"内容概述\": \"禁止生产、销售和使用劣药。超过有效期的药品为劣药。\"\n  }\n]"
- expression: 药品明细表.失败原因代码 包含 '药品编码对照错误' || '非基药超量' || '超限用药' || '未达起付线'
  description: 重点分析报销失败原因中的系统技术性错误（如医保对码错误）以及不合理的人为用药错误（如总量超限），区分系统故障和违规开药。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不符合相关规定
  suspicion: 未严格执行医保结算致农户报销失败
  regulation: "[\n  {\n    \"法规名称\": \"医疗保障基金使用监督管理条例\",\n    \"法规文号\": \"国务院令第735号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"定点医药机构应当确保医疗保障基金支付的费用符合规定的支付范围；除急诊、抢救等特殊情形外，提供医疗保障基金支付范围以外的医药服务的，应当经参保人员或者其近亲属、监护人同意。\"\n\
    \  }\n]"
- expression: (检测报告.实测厚度 < 0.010mm) || (销售台账.标注厚度 < 0.010mm) || (抽检记录.实测厚度 < 0.010mm) || (产品清单.实测厚度 < 0.010mm) && (产品类别 ==
    '农用薄膜')
  description: 依据国家标准，农用薄膜厚度不得小于0.010mm。若质检报告、台账标注厚度、市场监管抽检实测厚度任一小于0.010mm，即判定违规。同时可进一步比对标注厚度与实测厚度，若标注≥0.010mm而实测<0.010mm，则为虚假标注，属于严重违规。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 生产销售厚度小于0.010mm的农膜
