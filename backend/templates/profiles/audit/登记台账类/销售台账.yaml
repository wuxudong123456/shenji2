    法规名称\": \"关于规范住房公积金个人住房贷款政策有关问题的通知\",\n    \"法规文号\": \"建金〔2010〕179号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"三、\",\n\
    \   "
