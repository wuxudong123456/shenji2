name: audit/登记台账类/销售台账
type: model
description: 从登记台账类类文档（销售台账）中提取结构化元数据。涵盖字段如：主要产品销量、产品型号、产品批次、使用作物、农药名称、单价、台账存在性、售价。文档范围包括：产品销售台账、农膜生产销售台账、农药销售台账、房地产开发企业销售台账、村卫生室药品销售台账、销售台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 台账
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 销售台账
  member_count: 1
  member_details:
  - 产品销售台账
  - 农膜生产销售台账
  - 农药销售台账
  - 房地产开发企业销售台账
  - 村卫生室药品销售台账
  - 销售台账
output:
