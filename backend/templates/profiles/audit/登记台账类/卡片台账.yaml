name: audit/登记台账类/卡片台账
type: model
description: 从登记台账类类文档（卡片台账）中提取结构化元数据。涵盖字段如：使用状态、净值、原值、累计折旧、资产编码。文档范围包括：固定资产卡片台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 资产
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 卡片台账
  member_count: 1
  member_details:
  - 固定资产卡片台账
output:
  fields:
  - name: 使用状态
    type: boolean
    description: 提取 使用状态 的布尔值（是/否）
  - name: 净值
    type: string
    description: 提取 净值 的文本值
  - name: 原值
    type: string
    description: 提取 原值 的文本值
  - name: 累计折旧
    type: string
    description: 提取 累计折旧 的文本值
  - name: 资产编码
    type: string
    description: 提取 资产编码 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 固定资产卡片台账.使用状态 = '闲置' || 产能利用率统计表.利用率 < 0.3 && (固定资产卡片台账.净值 - 资产减值测试底稿.可收回金额) > 0 && 资产减值测试底稿.测试结论 != '已计提减值准备'
  description: 对于已明确闲置或连续12个月产能利用率不足30%的固定资产，若其账面净值高于可收回金额且企业未计提任何减值准备，表明存在资产价值虚增、粉饰财务状况的问题。
  audit_item: 企业经营资产分析
  suspicion: 固定资产闲置未计提减值造成资产虚增
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第8号——资产减值\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条、第六条\",\n    \"内容概述\": \"企业应当在资产负债表日判断资产是否存在可能发生减值的迹象，存在减值迹象的，应当估计其可收回金额，并计提相应的资产减值准备。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n    \"内容概述\": \"\
    各单位不得虚列资产、"
