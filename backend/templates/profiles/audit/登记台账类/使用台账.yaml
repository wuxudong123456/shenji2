name: audit/登记台账类/使用台账
type: model
description: 从登记台账类类文档（使用台账）中提取结构化元数据。涵盖字段如：上年结转结余金额、与工程进度匹配性、义务教育保障经费拨付记录、交通补助、产出量、付费记录、企业使用明细、使用人。文档范围包括：专项资金使用台账、以前年度结余资金使用台账、保费补贴资金使用台账、债券资金使用台账、创业担保贷款使用台账、厕所设施维护资金使用台账、参股企业品牌使用台账、合作社资产使用台账、城乡义务教育经费转移支付资金分配使用台账、基建工程项目资金使用台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 工程
- 明细
- 金额
- 元数据提取
