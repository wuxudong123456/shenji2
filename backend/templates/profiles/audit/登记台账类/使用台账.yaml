    ,\n    \"条款号\": \"第五条“加强公共厕所日常管护”\",\n    \"内容概述\": \"建立公共厕所管护制度，做到有专人管理、有保洁标准、有监督考核，确保公厕干净卫生、正常使用。\"\n  }\n]"
- expression: EXISTS(统计表.快递企业) AND 统计表.邮政网点行政村覆盖率=1 AND (合作协议.合作内容（是否含邮快合作）=否 OR 使用台账.邮政网点代投民营快递件数=0) AND 数据表.单件配送成本 > 数据表.派费收入*1.2
  description: 邮政网点已实现行政村全覆盖（覆盖率=100%），但民营快递未与邮政签订邮快合作协议或未实际使用邮政代投，且其自行配送成本超过派费收入的120%，判定为未协同配送导致资源闲置和成本过高。
  audit_item: 农村寄递物流服务体系不健全
  suspicion: 邮政与民营快递未实现末端协同配送
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加快农村寄递物流体系建设的意见\",\n    \"法规文号\": \"国办发〔2021〕26号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条（十）\",\n    \"内容概述\": \"支持邮政、快递、交通等资源整合，推广邮快合作、快快合作等共同配送模式\"\n  }\n]"
- expression: (分解表.计划完成时间 <= 系统日期) && (分解表.实际完成时间 IS NULL || 分解表.实际完成时间 > 分解表.计划完成时间)
  description: 以任务分解表中的计划完成时间为基准，若当前日期已超过计划截止日期，而任务状态仍为非“已完成”，或实际完成时间晚于计划时间，即判定为编制进度缓慢疑点。结合资金拨付率和招投标延期记录可进一步区分主要原因。
  audit_item: 村庄规划编制缓慢
  suspicion: 村庄规划编制任务逾期未完成
  regulation: "[\n  {\n    \"法规名称\": \"某地区村庄规划编制工作方案\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"工作目标及进度安排章节\"\
    ,\n    \"内容概述\": \"方案明确要求各镇（街道）应在202X年X月前完成全部应编村庄的规划编制任务，并制定了详细的季度、月度分解计划。\"\n  }\n]"
- expression: (资产清单.原值 / 资产清单.原值 > 0.2) || (使用台账.运行时长 / 使用台账.运行时长 < 0.1) || (分析表.单台设备投入产出比（ROI） < 1) || (使用台账.维护记录 && 资产清单.使用状态
    = '闲置')
  description: 闲置资产原值占比超过20%视为严重闲置；设备实际使用率低于设计量的10%为严重低效；投入产出比小于1意味着项目运行后不仅无收益，连运营成本都无法覆盖；资产无任何运行或维护记录且系统状态标记为闲置即为长期闲置。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 产业园资产闲置或效益低下
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价，提高财政资金使用效益。\"\n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n  \
    \  \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有截留、挪用财政资金，或以虚报、冒领等手段骗取财政资"
- expression: (已建成配送站点数 < 建制村总数) || (实际运营站点数 < 已建成站点数 * 0.9) || (补贴资金用于末端配送比例 < 80%)
  description: 已建成站点数低于建制村总数即为未全覆盖；仅有牌无运营的站点比例超过10%视为虚假覆盖；补贴资金若用于末端配送比例低于80%说明存在挪用。
  audit_item: 项目建设养护未实现政策目标
  suspicion: 建制村电商配送服务未全覆盖
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进电子商务与快递物流协同发展的意见\",\n    \"法规文号\": \"国办发〔2018〕1号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第（四）条\",\n    \"内容概述\": \"完善农村快递物流网络，推进‘快递下乡’工程，加快农村快递物流末端网络建设，实现建制村电商配送服务全覆盖。\"\n  }\n]"
