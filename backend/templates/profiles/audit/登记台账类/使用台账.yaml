violations:
- expression: (明细表.支出科目 CONTAINS ('基建','工程','装修','楼堂馆所') OR 收款方行业类别 == '建筑业') AND (明细表.项目名称 NOT IN (下达日期.预算项目名称)) AND (行对账单.交易对方名称
    == 基建合同.施工方名称)
  description: 筛查支出明细表中包含基建相关关键词或收款方为建筑业，且项目名称不在预算批复的允许范围内，同时银行流水收款方与基建合同施工单位一致。任一条件触发即视为挪用嫌疑，需进一步核实。
  audit_item: 挤占挪用套取财政资金
  suspicion: 挪用财政资金用于基建工程
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得……（二）截留、挪用财政资金；……\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\",\n    \"\
    内容概述\":"
- expression: 明细表.费用类型 IN ('车辆租赁费','保险费','维修费','年检费') AND 明细表.金额>0 AND 决算报表.购置费预算金额=0
  description: 费用明细表中实际发生且金额大于零的费用项目，但在预算报表中相应科目预算为零或未列示，即判定为该费用未纳入预算编制，属于预算编制不完整。
  audit_item: 未按规定编制和执行公务用车购置和运行费预算
  suspicion: 公务用车购置及运行费预算编制不完整
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第十二号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当根据预算科目和项目，按照政府收支分类科目细化编制预算，所有收支必须完整列入预算，不得少列、不列。\"\n  },\n  {\n    \"法规名称\": \"\
    党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"党政机关应将公务用"
