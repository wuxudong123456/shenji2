name: audit/登记台账类/资产台账
type: model
description: 从登记台账类类文档（资产台账）中提取结构化元数据。涵盖字段如：使用状态、使用部门、入账原值、入账日期、入账金额、卡片编号、原值、在册设备名称。文档范围包括：信息系统资产台账、农村集体经济组织资产台账、固定资产台账、国有资产台账、设备资产台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 登记
- 资产
- 车辆
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 资产台账
  member_count: 1
  member_details:
  - 信息系统资产台账
  - 农村集体经济组织资产台账
  - 固定资产台账
  - 国有资产台账
  - 设备资产台账
output:
  fields:
  - name: 使用状态
    type: boolean
    description: 提取 使用状态 的布尔值（是/否）
  - name: 使用部门
    type: string
    description: 提取 使用部门 的文本值
  - name: 入账原值
    type: string
    description: 提取 入账原值 的文本值
  - name: 入账日期
    type: date
    description: 提取 入账日期 的日期值，格式 YYYY-MM-DD
  - name: 入账金额
    type: number
    description: 提取 入账金额 的数值（含单位，如万元、吨等）
  - name: 卡片编号
    type: string
    description: 提取 卡片编号 的文本值
  - name: 原值
    type: string
    description: 提取 原值 的文本值
  - name: 在册设备名称
    type: string
    description: 提取 在册设备名称 的文本值
  - name: 型号
    type: string
    description: 提取 型号 的文本值
  - name: 处置日期
    type: date
    description: 提取 处置日期 的日期值，格式 YYYY-MM-DD
  - name: 存放地点
    type: string
    description: 提取 存放地点 的文本值
  - name: 安装位置
    type: string
    description: 提取 安装位置 的文本值
  - name: 物理位置
    type: string
    description: 提取 物理位置 的文本值
  - name: 系统名称
    type: string
    description: 提取 系统名称 的文本值
  - name: 累计折旧
    type: string
    description: 提取 累计折旧 的文本值
  - name: 设备状态
    type: boolean
    description: 提取 设备状态 的布尔值（是/否）
  - name: 责任人
    type: string
    description: 提取 责任人 的文本值
  - name: 购置日期
    type: date
    description: 提取 购置日期 的日期值，格式 YYYY-MM-DD
  - name: 资产原值
    type: string
    description: 提取 资产原值 的文本值
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 资产状态
    type: boolean
    description: 提取 资产状态 的布尔值（是/否）
  - name: 资产类别
    type: string
    description: 提取 资产类别 的文本值
  - name: 资产编号
    type: string
    description: 提取 资产编号 的文本值
  - name: 资产编码
    type: string
    description: 提取 资产编码 的文本值
  - name: 车辆资产登记信息
    type: string
    description: 提取 车辆资产登记信息 的文本值
  - name: 部署位置
    type: string
    description: 提取 部署位置 的文本值
  - name: 闲置起始日期
    type: date
    description: 提取 闲置起始日期 的日期值，格式 YYYY-MM-DD
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 资产负债表.固定资产净值 != (分类账.固定资产科目余额 - 分类账.累计折旧科目余额)
  description: 资产负债表固定资产项目应按扣除累计折旧及减值准备后的净额列示，与总账直接计算的结果不相等，则表明存在少提折旧、重分类错误或资产虚报。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 资产负债表固定资产项目金额与总账余额不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计报表进行核对，保证会计账簿记录与会计报表的有关内容相符。\"\n  }\n]"
- expression: (资产台账.资产状态（在库/已处置）=="已处置" && !EXISTS(批准的处置方式（拍卖、招标、协议等） WHERE 批准的处置方式（拍卖、招标、协议等）.审批资产编号==资产台账.资产编号)) || (对照表.实际处置日期
    < 对照表.审批日期)
  description: 当资产台账显示资产已处置，但在审批文件中找不到对应审批记录，即为未经审批擅自处置；或实际处置日期早于审批日期，则存在先处置后审批的违规行为。
  audit_item: 违规处置国有资产
  suspicion: 擅自处置国有资产（出售、调拨、报损、报废等）
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"各部门及其所属单位应当根据履行职责、事业发展需要和资产使用状况，经集体决策和履行审批程序，依据处置事项批复等相关文件及时处置行政事业性国有资产。\"\n  }\n]"
- expression: (明细表.资产原值 > 制度文件.需上级审批的资产类型或金额标准 || 资产台账.资产类别 IN (制度文件.需上级审批的资产类型或金额标准)) && (审批文件.上级批复文件编号 IS NULL)
  description: 依据内部审批流程制度，当处置资产的类别或原值达到需要上级（财政部门或国资委）审批的标准时，必须取得上级批复。若上级批复文件缺失，则构成未履行法定审批程序。
  audit_item: 违规处置国有资产
  suspicion: 国有资产处置未履行法定审批程序（应报未报上级/财政）
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"除国家另有规定外，各部门及其所属单位将行政事业性国有资产进行转让、拍卖、置换、对外投资等，应当按照国家有关规定办理审批手续。\"\n  }\n]"
- expression: (资产编号、争议情况.资产编号 对应 资产编号、处置类型、处置日期、资产原值、处置收入.资产编号) || (资产编号、资产类别、原值、资产状态（查封/抵押等）、资产状态（在库/已处置）、处置日期.资产状态（查封/抵押等）
    IN ('查封','抵押') && 查封/抵押未解除) || (权属人、共有情况、他项权利.他项权利 NOT IN ('无','已解除'))
  description: 当已处置资产的权属存在争议（已在争议登记表中记录），或资产状态显示被查封、抵押等权利受限且未解除，或权属证明文件显示存在未解除的他项权利时，均构成违规处置权属不清资产。
  audit_item: 违规处置国有资产
  suspicion: 违规处置权属不清或有争议的国有资产
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"转让方应当对转让标的进行产权界定和资产评估，产权应当清晰，不存在权属纠纷。\"\n  }\n]"
- expression: (销售费用明细表.运输费 + 销售费用明细表.广告费 + 销售费用明细表.职工薪酬 + 销售费用明细表.差旅费 + 销售费用明细表.业务招待费)增长率 - 销售业绩统计表.营业收入增长率 > 20% && (销售费用明细表.运输费
    + 销售费用明细表.广告费 + 销售费用明细表.职工薪酬 + 销售费用明细表.差旅费 + 销售费用明细表.业务招待费) / 销售业绩统计表.营业收入 比率同比波动 > 3个百分点 || ( (管理费用明细表.折旧费 + 管理费用明细表.办公费
    + 管理费用明细表.专业服务费)增长率 > 10% && 员工人数及薪酬统计表.各部门人数 下降 && 员工人数及薪酬统计表
  description: 销售费用应与业务规模同向变动，若费用增长远超收入增长，可能虚列费用套取资金或跨期调节。管理费用在人员规模收缩时仍大幅增长，存在异常，可能将不相关支出计入当期。
  audit_item: 企业财务报表分析
  suspicion: 期间费用与业务驱动因素脱节
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十三条、第三十五条\",\n    \"内容概述\": \"企业发生的支出不产生经济利益的，或者即使能够产生经济利益但不符合资产确认条件的，应当在发生时确认为费用。企业不得推迟确认费用，也不得提前确认未发生的费用。\"\n\
    \  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n    \"\
    内容概述\": \"公"
- expression: 购置合同.实际购置价格 > 负责人用车配备标准(含价格、排量).负责人用车配备标准(含价格、排量) || 购置合同.发动机排量 > 负责人用车配备标准(含价格、排量).负责人用车配备标准(含价格、排量) || 资产台账.使用状态
    == '待报废' && 资产台账.使用状态 < 负责人用车配备标准(含价格、排量).负责人用车配备标准(含价格、排量)
  description: 判定规则：1.将车辆实际购置价格与企业内部制度或上级主管部门规定的价格上限进行比对，超出即违规；2.将车辆实际发动机排量与制度规定的排量上限比对，超出即违规；3.核查车辆是否未达到规定最低使用年限即提前报废更新。
  audit_item: 未严格落实中央八项规定及实施细则精神
  suspicion: 超标准配备公务用车
  regulation: "[\n  {\n    \"法规名称\": \"中央企业负责人履职待遇、业务支出管理办法\",\n    \"法规文号\": \"国资发分配〔2015〕15号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第八条、第九条\",\n    \"内容概述\": \"企业负责人公务用车配置标准，参照中央和国家机关公务用车配备有关规定执行，不得超标准配备。车辆不得超编配备，实行集中管理，不得既领取公务交通补贴又违规使用公务用车。\"\
    \n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    "
- expression: EXISTS(捐赠协议) && (捐赠协议.价值 > 0) && (资产台账.资产名称 != 捐赠协议.资产名称 || 资产台账.入账金额 = 0) && (明细账.捐赠收入金额 = 0)
  description: 企业已接收捐赠资产但固定资产账上无对应资产记录，且未确认捐赠收入，表明资产被隐匿形成账外资产。
  audit_item: 未按规定核算资产
  suspicion: 接受捐赠资产不入账
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第76号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者事项为依据进行会计确认、计量和报告，如实反映符合确认和计量要求的各项会计要素，保证会计信息真实可靠、内容完整。\"\n  }\n]"
- expression: ( 相关制度.核心岗位职责分离说明=true ) OR ( 会议纪要.参会人员=0 ) OR ( 预案.演练日期=0 ) OR ( 理工单.审批人='未审批' )
  description: 1. 缺少信息化系统工作机制相关制度直接判定违规；2. 会议纪要或演练记录为空表明工作机制未实际运行；3. 变更工单中存在未审批即执行的情况代表变更管理缺失。任一条件满足即视为未建立有效工作机制。
  audit_item: 网络安全建设方面存在的问题
  suspicion: 未建立有效的信息化系统工作机制
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国网络安全法\",\n    \"法规文号\": \"主席令第53号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十一条\",\n    \"内容概述\": \"网络运营者应当制定内部安全管理制度和操作规程，确定网络安全负责人，落实网络安全保护责任。\"\n  },\n  {\n    \"法规名称\": \"信息安全技术 网络安全等级保护基本要求\"\
    ,\n    \"法规文号\": \"GB/T 22239-2019\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"安全管理制度要求（管理要求部分）\",\n    \"内容概述\": \"应建立日常管理"
- expression: ( 机房环境检测报告缺失=true ) OR ( 检测报告.温度（℃） < 18 OR 检测报告.温度（℃） > 26 ) OR ( 检测报告.湿度（%） < 40 OR 检测报告.湿度（%） > 70 ) OR (
    设备出入登记记录缺失=true ) OR ( 记录表.问题未整改数量 > 0 )
  description: 1. 缺少定期环境检测报告表明物理环境监测缺失；2. 温湿度超出标准范围（18-26℃，40%-70%）可能影响设备稳定运行；3. 无设备出入记录或检查记录中存在未整改问题均反映出物理安全管理松懈。满足任一条件即视为存在缺陷。
  audit_item: 网络安全建设方面存在的问题
  suspicion: 信息系统物理环境存在安全缺陷
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国网络安全法\",\n    \"法规文号\": \"主席令第53号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十一条\",\n    \"内容概述\": \"网络运营者应当履行安全保护义务，包括采取物理安全防护措施等。\"\n  },\n  {\n    \"法规名称\": \"信息安全技术 网络安全等级保护基本要求\",\n    \"\
    法规文号\": \"GB/T 22239-2019\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"物理安全部分\",\n    \"内容概述\": \"应设置机房专用区域，对机房出入进行控制和记录，配备温湿度调控、"
- expression: (资产台账.使用状态 = '闲置' || 闲置资产明细表.闲置时长 >= 365) && (资产使用效率分析表.年使用天数 <= 30 || 资产使用效率分析表.利用率 < 0.05) && (闲置资产专项报告.闲置原因分析不包含'不可抗力'
