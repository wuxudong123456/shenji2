name: audit/登记台账类/专项台账
type: model
description: 从登记台账类类文档（专项台账）中提取结构化元数据。涵盖字段如：借调人员信息、借调期限、债权人、占用形式、占用时间、占用金额、原债务金额、归还记录。文档范围包括：债务重组专项台账、控股股东资金占用专项台账、编制挪用挤占情况专项台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 人员
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 专项台账
  member_count: 1
  member_details:
  - 债务重组专项台账
  - 控股股东资金占用专项台账
  - 编制挪用挤占情况专项台账
output:
  fields:
  - name: 借调人员信息
    type: string
    description: 提取 借调人员信息 的文本值
  - name: 借调期限
    type: string
    description: 提取 借调期限 的文本值
  - name: 债权人
    type: string
    description: 提取 债权人 的文本值
  - name: 占用形式
    type: string
    description: 提取 占用形式 的文本值
  - name: 占用时间
    type: date
    description: 提取 占用时间 的日期值，格式 YYYY-MM-DD
  - name: 占用金额
    type: number
    description: 提取 占用金额 的数值（含单位，如万元、吨等）
  - name: 原债务金额
    type: number
    description: 提取 原债务金额 的数值（含单位，如万元、吨等）
  - name: 归还记录
    type: string
    description: 提取 归还记录 的文本值
  - name: 批准手续
    type: string
    description: 提取 批准手续 的文本值
  - name: 转换后余额
    type: number
    description: 提取 转换后余额 的数值（含单位，如万元、吨等）
  - name: 转换日期
    type: date
    description: 提取 转换日期 的日期值，格式 YYYY-MM-DD
  - name: 转股金额
    type: number
    description: 提取 转股金额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 存在 信息表.编制归属单位 != 信息表.现工作单位 && (专项台账.批准手续 || 专项台账.借调期限 > 规范期限)
  description: 人员编制在基层单位但实际在上级单位工作，且存在无审批借调或超出规定借调期限的，即构成挤占挪用基层编制。规范期限可参照有关借调文件规定，通常为6个月或1年。
  audit_item: 超编制使用工作人员或配备领导干部
  suspicion: 挤占挪用基层编制
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十八条\",\n    \"内容概述\": \"地方各级人民政府行政机构不得混用、挤占、挪用编制。\"\n  }\n]"
- expression: 转股协议.债务本金 > 0 AND 转股协议.债务本金 <= 当前日期 AND ( (明细账.债权人名称 = 转股协议.债权人名称 AND 明细账.期末余额 > 0) OR (明细账.债权人名称 = 转股协议.债权人名称
    AND 明细账.期末余额 > 0) OR (COALESCE(SUM(明细账.贷方金额) FILTER (WHERE 摘要 ~ '债转股' AND 明细账.股东名称 = 转股协议.债权人名称), 0) + COALESCE(SUM(明细账.贷方金额)
    FILTER (WHERE 摘要 ~ '债转股' AND 明细账.对应事项 ~ 转股协议.债权人名称), 0) < 转股协议.
  description: 已生效的债转股协议，若原债权人仍在“其他应付款”“长期应付款”等负债科目中存在余额，或“股本”“资本公积”科目未按协议约定增加足额的权益金额，即构成违规。负债科目余额未清零或权益增加金额不达标均触发疑点。
  audit_item: 未按规定核算所有者权益
  suspicion: 债转股资金违规挂账往来科目
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第12号——债务重组\",\n    \"法规文号\": \"财会〔2019〕9号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"债务人以债务转为权益工具方式清偿债务的，应当终止确认原有债务，按照权益工具的公允价值确认股本（或实收资本），公允价值与股本之间的差额计入资本公积，重组债务账面价值与权益工具公允价值之间的差额计入当期损益。\"\
    \n  }\n]"
- expression: 占用形式（预付款、借款、无商业实质的票据等） == '无商业背景的支付' && 占用金额 > 0 && 未计提资金占用费 || 利率 < 同期存款利率 && 占用时间 == '超过1个季度'
  description: 控股股东通过预付款、借款、代偿债务等方式占款持续存在且未按市场化原则支付占用费，即构成侵占上市公司利益。
  audit_item: 资金管理方面存在的问题
  suspicion: 控股股东非经营性占用上市公司资金
  regulation: "[\n  {\n    \"法规名称\": \"关于规范上市公司与关联方资金往来及上市公司对外担保若干问题的通知\",\n    \"法规文号\": \"证监发[2003]56号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"控股股东及其他关联方不得要求上市公司为其垫支工资、福利、保险、广告等期间费用，也不得互相代为承担成本和其他支出。\"\n  },\n\
    \  {\n    \"法规名称\": \"上市公司治理准则\",\n    \"法规文号\": \"证监发[2002]1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n \
    \   \"内容概述\""
