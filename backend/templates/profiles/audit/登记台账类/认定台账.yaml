name: audit/登记台账类/认定台账
type: model
description: 从登记台账类类文档（认定台账）中提取结构化元数据。涵盖字段如：从业类型、认定人姓名、认定日期、身份证号。文档范围包括：资格认定台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 认定台账
  member_count: 1
  member_details:
  - 资格认定台账
output:
  fields:
  - name: 从业类型
    type: string
    description: 提取 从业类型 的文本值
  - name: 认定人姓名
    type: string
    description: 提取 认定人姓名 的文本值
  - name: 认定日期
    type: date
    description: 提取 认定日期 的日期值，格式 YYYY-MM-DD
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (清单名册.培训课时 < 规定培训课时) || (清单名册.考核结果 = '不合格') || (主体证明.土地承包合同、农机购置证明等 = 无效) || (审批文件.审批流程记录缺失公示、审核环节)
  description: 新型职业农民认定必须经过完整培训并考核合格，且实际从事农业生产经营。若培训课时不达标，或考核不合格，或无法提供土地承包、生产经营等证明，或审批流程不完整，均应视为违规认定。
  audit_item: 培训等政策实施不合规，效果不佳
  suspicion: 不符合条件人员被认定为新型职业农民
  regulation: "[\n  {\n    \"法规名称\": \"新型职业农民认定管理办法（示例）\",\n    \"法规文号\": \"农人发〔20××〕×号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"申请认定新型职业农民须参加规定培训并考核合格，且具备一定规模的生产经营条件。\"\n  }\n]"
