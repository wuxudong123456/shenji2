name: audit/登记台账类/收支台账
type: model
description: 从登记台账类类文档（收支台账）中提取结构化元数据。涵盖字段如：上缴财政金额、交易对象、克扣资金用途、医疗服务收入金额、各项支出金额、摘要、支付金额、支出日期。文档范围包括：中介费/佣金收支台账、主管部门实体账户资金收支台账、乡镇实体账户资金收支台账、收支台账、职业技能鉴定考务费收支台账、运营单位财务收支台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 补贴
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 收支台账
  member_count: 1
  member_details:
  - 中介费/佣金收支台账
  - 主管部门实体账户资金收支台账
  - 乡镇实体账户资金收支台账
  - 收支台账
  - 职业技能鉴定考务费收支台账
  - 运营单位财务收支台账
output:
  fields:
  - name: 上缴财政金额
    type: number
    description: 提取 上缴财政金额 的数值（含单位，如万元、吨等）
  - name: 交易对象
    type: string
    description: 提取 交易对象 的文本值
  - name: 克扣资金用途
    type: string
    description: 提取 克扣资金用途 的文本值
  - name: 医疗服务收入金额
    type: number
    description: 提取 医疗服务收入金额 的数值（含单位，如万元、吨等）
  - name: 各项支出金额
    type: number
    description: 提取 各项支出金额 的数值（含单位，如万元、吨等）
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 支付金额
    type: number
    description: 提取 支付金额 的数值（含单位，如万元、吨等）
  - name: 支出日期
    type: date
    description: 提取 支出日期 的日期值，格式 YYYY-MM-DD
  - name: 支出用途
    type: number
    description: 提取 支出用途 的数值（含单位，如万元、吨等）
  - name: 支出金额
    type: number
    description: 提取 支出金额 的数值（含单位，如万元、吨等）
  - name: 收入来源
    type: number
    description: 提取 收入来源 的数值（含单位，如万元、吨等）
  - name: 收入金额
    type: number
    description: 提取 收入金额 的数值（含单位，如万元、吨等）
  - name: 收入项目名称
    type: number
    description: 提取 收入项目名称 的数值（含单位，如万元、吨等）
  - name: 收款方名称
    type: number
    description: 提取 收款方名称 的数值（含单位，如万元、吨等）
  - name: 收费金额合计
    type: number
    description: 提取 收费金额合计 的数值（含单位，如万元、吨等）
  - name: 收费项目
    type: number
    description: 提取 收费项目 的数值（含单位，如万元、吨等）
  - name: 日期
    type: date
    description: 提取 日期 的日期值，格式 YYYY-MM-DD
  - name: 有无实质交付物
    type: boolean
    description: 提取 有无实质交付物 的布尔值（是/否）
  - name: 服务内容摘要
    type: string
    description: 提取 服务内容摘要 的文本值
  - name: 科目
    type: string
    description: 提取 科目 的文本值
  - name: 租赁-出售对象
    type: string
    description: 提取 租赁-出售对象 的文本值
  - name: 缴入财政金额
    type: number
    description: 提取 缴入财政金额 的数值（含单位，如万元、吨等）
  - name: 药品销售收入金额
    type: number
    description: 提取 药品销售收入金额 的数值（含单位，如万元、吨等）
  - name: 补贴资金转入金额
    type: number
    description: 提取 补贴资金转入金额 的数值（含单位，如万元、吨等）
  - name: 账户名称
    type: string
    description: 提取 账户名称 的文本值
  - name: 转出对象
    type: string
    description: 提取 转出对象 的文本值
  - name: 转出时间
    type: date
    description: 提取 转出时间 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ((收支台账.服务内容摘要 = ‘无’ OR 收支台账.有无实质交付物 = ‘否’) AND 收支台账.支付金额 > 0 AND 收支台账.收款方名称 IN (领导人员姓名, 领导人员关联方)) OR (业务合同.约定折扣条款存在
    AND ABS(行对账单.收款金额 - 业务合同.合同金额) > 0 AND 处置台账 无对应上交记录) OR (报销凭证.事由 LIKE ‘%奖励资金%’ AND 报销凭证.报销人 = 领导人员 AND 无经审批的分配方案)
  description: 支付给无实质服务的个人或空壳公司的大额中介费、佣金；合同折扣款未上缴财务而由个人截留；政府奖励款项被以报销名义私分而未纳入公司账簿，均构成侵占。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 私分或侵占企业折扣费、中介费、佣金
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条第（二）项\",\n    \"内容概述\": \"不得将企业经济往来中的折扣费、中介费、佣金、礼金，以及因企业行为受到有关部门和单位奖励的财物等据为己有或者私分。\"\n  }\n]"
- expression: (收支台账.医疗服务收入金额 IS NULL AND 收支台账.药品销售收入金额 IS NULL AND 收支台账.各项支出金额 IS NULL) || (资产登记表.资产名称 IS NULL) || ABS(处方汇总.处方收入总额
    - 收支台账.医疗服务收入金额) / 处方汇总.处方收入总额 > 0.1 || (ABS(盘点表.实盘药品数量 - 盘点表.账面应有库存数量) / 盘点表.账面应有库存数量 > 0.05)
  description: 未建立收支账簿属严重内控缺失；账实差异率>10%或盘点差异率>5%表明资金、资产管理混乱，可能隐藏小金库或资产流失问题。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 村卫生室未建立规范的财务收支账目及资产登记
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第九条、第十六条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计账簿；不得私设会计账簿。\"\n  },\n  {\n    \"法规名称\": \"基层医疗卫生机构财务制度\"\
    ,\n    \"法规文号\": \"财社〔2010〕307号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第七条、第十八条\",\n    \"内容概述\": \"政府举办的基层医疗卫生机构应当建立健全"
- expression: 拨付路径.接收账户 IN ('主管部门实体账户','乡镇过渡账户') && (审批文件.批准使用范围 != '合规审批' || 拨付路径.拨付时间 > 审批文件.有效期限)
  description: 除经省级以上财政部门批准的特殊情况外，不得通过实体账户或过渡账户转发补贴资金。即使已批准，也必须在有效期内专款专用。若无审批手续或逾期仍在使用，即属违规。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 补贴资金拨付至实体账户或过渡账户发放
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（六）\",\n    \"内容概述\": \"除按规定设立的代发专户外，补贴资金不得通过主管部门、乡镇政府等实体账户或过渡账户层层转拨，严禁以拨代支。\"\n  }\n]"
- expression: 拨付路径.接收账户 包含 ('乡' || '镇' || '村') && (收支台账.支出用途 = '现金发放' || 明细表.发放日期 - 拨付路径.拨付时间 > 14天)
  description: 补贴资金不应通过乡镇、村层级转拨发放。若资金经过乡镇或村账户，并以现金等非直发方式支付，或者从拨付到最终发放至农户之间的时间明显过长（如超过2周），则表明存在层层转拨和资金滞留问题。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 补贴资金层层拨付至乡镇村发放
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（六）\",\n    \"内容概述\": \"补贴资金应由财政部门通过国库集中支付系统直接发放到受益人社会保障卡，严禁通过乡镇、村组转拨代发。\"\n  }\n]"
- expression: 明细表.实发金额 < 应纳入一卡通发放的补贴项目列表、政策生效日期、清单内容、补贴项目.标准单价 × 明细表.计发面积/数量 * 0.99
  description: 按照政策标准计算农户应发金额，与一卡通实际到账金额比对，若实发金额低于应发金额且偏差率超过1%（考虑可能的零头处理），在没有合法扣减文件（如代扣保险费等）的情况下，即涉嫌克扣。偏差率越大，违规可能性越高。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 克扣农民应得补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有截留、挪用、克扣财政资金的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。\"\n  }\n]"
- expression: (报备记录.报修原因包含‘拆除’‘破坏’‘拆改’ && 登记表.是否审批 = ‘否’) || (收支台账.摘要包含‘保证金扣除’ && 收支台账.收入项目名称包含‘违规装修’ && 登记表中无对应审批记录) || (检查记录.检查发现（如违规装修、破坏结构）包含‘违规改建’‘私改墙体’‘增加隔断’等)
    || (投诉记录.投诉内容包含‘违规装修’‘破坏结构’且属实)
  description: 表达式通过四种途径识别未获批的破坏性装修行为：维修记录中出现非正常破损且无装修审批的，表明承租人擅自施工损坏房屋；保证金扣除记录若因违规装修且没有审批追溯，系运营单位已发现并处理的证据；物业检查记录直接记载的违规装修现象、经核实的举报投诉，均可单独触发疑点。符合任一条件即判定为擅自装修或破坏。
  audit_item: 未按规定使用公共租赁住房
  suspicion: 承租人破坏或擅自装修公租房
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"承租人不得破坏或者擅自装修所承租公共租赁住房。\"\n  }\n]"
- expression: (审批表.批准变更用途 != 审批文件.批准用途 && 收支台账.摘要 != 收支台账.收入项目名称) || (照片.实际使用状况描述 != 审批文件.批准用途 && 审批表.审批文号 != 收支台账.金额) ||
    (收支台账.交易对象 != 收支台账.交易对象 && 审批文件.批准用途 != 图.规划功能)
  description: 表达式主要核查所有权人或运营单位是否未经批准或超出批准范围改变公租房及配套设施的保障性用途。通过规划文件与审批变更表比对，发现审批用途与规划不一致，且财务有商业收益，或实际现状与规划不符且无任何审批，或擅自出售配套用房，任一情况均构成违规改变性质用途。
  audit_item: 未按规定使用公共租赁住房
  suspicion: 所有权人或运营单位违规改变公租房性质及用途
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"公共租赁住房的所有权人及其委托的运营单位不得改变公共租赁住房的保障性住房性质、用途及其配套设施的规划用途。\"\n  }\n]"
- expression: (明细表.收费项目名称 IN (已取消资格名称)) AND (明细表.收费日期 > 取消日期) AND (明细表.收费金额 > 0)
  description: 将实际收费项目名称与已明文取消的职业资格清单进行精确匹配或关键词包含匹配，若收费行为发生在该资格正式取消日期之后且存在实质收费金额，即构成违规收费。‘IN’列表应包含所有已取消资格的原官方名称及常见变体名称。
  audit_item: 职业资格鉴定政策执行不到位
  suspicion: 对已取消职业资格项目继续鉴定并违规收费
  regulation: "[\n  {\n    \"法规名称\": \"人力资源社会保障部关于公布国家职业资格目录的通知\",\n    \"法规文号\": \"人社部发〔2017〕68号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各地、各部门未经批准不得在目录之外自行设置国家职业资格，严禁在目录之外开展职业资格许可和认定工作，严禁将目录之外的职业资格与就业创业、职称评审等挂钩。\"\
    \n  },\n  {\n    \"法规名称\": \"行政事业性收费标准管理办法\",\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号"
- expression: ABS(收费项目.收入金额 - 缴款台账.缴款金额) > 10000 && (收费项目.收费项目 NOT IN ('代收教材费','工本费'))
  description: 按鉴定收费项目分组汇总实际收取金额，与财政非税系统缴款台账的缴入金额比对。差额绝对值大于1万元（结合被审计单位规模设定）且排除合理代收代付项目后，即揭示可能存在截留、坐支、转移收费资金的问题。
  audit_item: 职业资格鉴定政策执行不到位
  suspicion: 职业资格鉴定收费未按规定上缴财政专户
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
