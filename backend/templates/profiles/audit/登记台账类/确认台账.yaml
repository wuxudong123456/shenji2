name: audit/登记台账类/确认台账
type: model
description: 从登记台账类类文档（确认台账）中提取结构化元数据。涵盖字段如：关联关系、成员基本信息、成员姓名、成员身份状态、户籍类别、确认依据、身份证号。文档范围包括：农村集体经济组织成员身份确认台账、集体经济组织成员身份确认台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 确认台账
  member_count: 1
  member_details:
  - 农村集体经济组织成员身份确认台账
  - 集体经济组织成员身份确认台账
output:
  fields:
  - name: 关联关系
    type: string
    description: 提取 关联关系 的文本值
  - name: 成员基本信息
    type: string
    description: 提取 成员基本信息 的文本值
  - name: 成员姓名
    type: string
    description: 提取 成员姓名 的文本值
  - name: 成员身份状态
    type: boolean
    description: 提取 成员身份状态 的布尔值（是/否）
  - name: 户籍类别
    type: string
    description: 提取 户籍类别 的文本值
  - name: 确认依据
    type: string
    description: 提取 确认依据 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (成员台账.成员身份状态 != '已确认' AND 成员台账.户籍类别='本村户籍') OR (成员台账.确认依据 NOT IN ('户籍、土地承包、贡献等') AND 确认办法.确认标准存在矛盾) OR (公示记录.公示天数
    < 7 AND 成员确认办法.公示要求天数 >= 7) OR (成员台账.成员身份状态='已确认' AND 成员台账.身份证号无关联户籍记录)
  description: 符合确认条件（如本村户籍、享有土地承包权）但未确认，或确认依据不符合政策要求，或公示天数不足，或疑似虚假确认（无关联户籍记录）时，视为成员身份确认不精准。公示天数阈值以各地规定为准，一般不少于7天。
  audit_item: 集体经营性资产产权制度改革不到位
  suspicion: 集体经济组织成员身份未确认或确认不精准
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四部分第（二）条\",\n    \"内容概述\": \"确认农村集体经济组织成员身份。依据有关法律法规，按照尊重历史、兼顾现实、程序规范、群众认可的原则，统筹考虑户籍关系、农村土地承包关系、对集体积累的贡献等因素，协调平衡各方利益。\"\
    \n  }\n]"
