name: audit/登记台账类/检查台账
type: model
description: 从登记台账类类文档（检查台账）中提取结构化元数据。涵盖字段如：公示时间、内容缺失项、处理结果、投诉记录、检查商户、问题类型。文档范围包括：七公开制度执行情况检查台账、渔获物交易市场突击检查台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 检查
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 检查台账
  member_count: 1
  member_details:
  - 七公开制度执行情况检查台账
  - 渔获物交易市场突击检查台账
output:
  fields:
  - name: 公示时间
    type: date
    description: 提取 公示时间 的日期值，格式 YYYY-MM-DD
  - name: 内容缺失项
    type: string
    description: 提取 内容缺失项 的文本值
  - name: 处理结果
    type: boolean
    description: 提取 处理结果 的布尔值（是/否）
  - name: 投诉记录
    type: string
    description: 提取 投诉记录 的文本值
  - name: 检查商户
    type: string
    description: 提取 检查商户 的文本值
  - name: 问题类型
    type: string
    description: 提取 问题类型 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (公示内容缺失任一项七要素) || (公示渠道未覆盖乡镇政务栏和省级平台) || (公示日期 < 施工进度关键节点)
  description: 七公开要素包括建设计划、补助政策、招标投标、施工管理、质量监管、资金使用、工程验收。缺失任何一项或渠道不符、公示滞后均属违规。
  audit_item: 项目建设管理不符合相关规定
  suspicion: 未落实农村公路建设“七公开”制度
  regulation: "[\n  {\n    \"法规名称\": \"关于推行农村公路建设“七公开”制度的意见\",\n    \"法规文号\": \"交公路发〔2015〕32号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"农村公路建设须公开建设计划、补助政策、招标投标、施工管理、质量监管、资金使用、工程验收等七项内容，并明确公开渠道和时限。\"\n  }\n]"
- expression: (登记表.供应商名称 NOT IN (SELECT 企业名称 FROM 档案)) OR (登记表.来源证明 IS NULL AND 登记表.采购品类 IN ('长江野生鱼','野生江鲜','江鱼')) OR (登记表.支付方式
    = '现金' AND 登记表.供应商名称 IN (SELECT 检查商户 FROM 检查台账 WHERE 问题类型 = '无合法来源'))
  description: 1. 采购记录中的供应商无涉渔经营许可的，属于向无资质主体采购；2. 采购声称野生鱼却无任何合法来源证明的，涉嫌收售非法渔获物；3. 对曾被突击检查发现问题的供应商，仍采用现金等不透明支付方式持续交易的，违规风险极高。
  audit_item: 违法捕捞售卖长江流域水生生物
  suspicion: 企业采购加工非法捕捞渔获物
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国长江保护法\",\n    \"法规文号\": \"中华人民共和国主席令第65号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条、第五十四条\",\n    \"内容概述\": \"禁止收购、加工、销售在长江流域重点水域非法捕捞的渔获物；任何单位和个人不得为非法捕捞提供交易服务。\"\n  }\n]"
