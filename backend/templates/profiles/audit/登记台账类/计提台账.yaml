name: audit/登记台账类/计提台账
type: model
description: 从登记台账类类文档（计提台账）中提取结构化元数据。涵盖字段如：土地性质、基金名称、计提金额、项目信息。文档范围包括：财政计提台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 计提台账
  member_count: 1
  member_details:
  - 财政计提台账
output:
  fields:
  - name: 土地性质
    type: string
    description: 提取 土地性质 的文本值
  - name: 基金名称
    type: string
    description: 提取 基金名称 的文本值
  - name: 计提金额
    type: number
    description: 提取 计提金额 的数值（含单位，如万元、吨等）
  - name: 项目信息
    type: string
    description: 提取 项目信息 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 审批文件.土地性质（划拨/出让）='划拨' AND 审批文件.项目名称='保障性住房' AND 计提台账.基金名称（农田水利建设基金）='农田水利建设基金' AND 计提台账.计提金额>0
  description: 保障房项目使用划拨土地的，按规定免计农田水利建设基金。若计提台账中出现该基金且金额大于0，即构成违规。
  audit_item: 违规向保障性安居工程项目收取应减免行政事业性收费和政府性基金
  suspicion: 违规在保障性安居工程划拨用地环节计提农田水利建设基金
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于保障性安居工程资金投入管理的通知\",\n    \"法规文号\": \"财税〔2019〕61号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"保障性安居工程划拨用地免征各项政府性基金，包括农田水利建设基金。\"\n  }\n]"
