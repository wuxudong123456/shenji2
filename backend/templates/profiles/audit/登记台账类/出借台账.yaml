name: audit/登记台账类/出借台账
type: model
description: 从登记台账类类文档（出借台账）中提取结构化元数据。涵盖字段如：入账日期、实收租金、实收租金与合同应计差异、实收租金金额、应收租金金额、承租方、收款金额、租金收入金额。文档范围包括：国有资产出租出借台账、资产出租出借台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 合同
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 出借台账
  member_count: 1
  member_details:
  - 国有资产出租出借台账
  - 资产出租出借台账
output:
  fields:
  - name: 入账日期
    type: date
    description: 提取 入账日期 的日期值，格式 YYYY-MM-DD
  - name: 实收租金
    type: string
    description: 提取 实收租金 的文本值
  - name: 实收租金与合同应计差异
    type: string
    description: 提取 实收租金与合同应计差异 的文本值
  - name: 实收租金金额
    type: number
    description: 提取 实收租金金额 的数值（含单位，如万元、吨等）
  - name: 应收租金金额
    type: number
    description: 提取 应收租金金额 的数值（含单位，如万元、吨等）
  - name: 承租方
    type: string
    description: 提取 承租方 的文本值
  - name: 收款金额
    type: number
    description: 提取 收款金额 的数值（含单位，如万元、吨等）
  - name: 租金收入金额
    type: number
    description: 提取 租金收入金额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ( (明细表.处置收入金额 + 出借台账.实收租金金额) > 0 ) && ( (流水.缴库金额 IS NULL) || (ABS(流水.缴库金额 - (明细表.处置收入金额 + 出借台账.实收租金金额)) / (明细表.处置收入金额
    + 出借台账.实收租金金额) > 0.05) || (批复文件.国有资产收入预算科目金额 = 0) )
  description: 当单位存在国有资产处置或出租收入时，若国库缴款凭证缺失，或上缴金额不足实际收入的95%（差异率>5%），或预算编制文件中未包含该笔国有资源（资产）有偿使用收入预算，则判定为违规。
  audit_item: 国有资产收入管理不合规
  suspicion: 国有资产处置和出租出借收入未上缴国库
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"各部门及其所属单位应当将资产处置和出租出借收入等国有资产收入，按照政府非税收入管理规定，及时足额上缴国库。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十六条\",\n    \"内容概述\": \"各级预算收入的编制，应当与经济社"
- expression: (流水.对方科目 IN ('国有资产处置收入','国有资产出租收入') OR 流水.摘要 LIKE '%国有资产收入%' OR 流水.支出账户 = 国有资产收入账户) && (流水.对方科目 LIKE '%人员经费%'
    OR 流水.对方科目 LIKE '%应付职工薪酬%' OR 流水.摘要 LIKE '%奖金%' OR 流水.摘要 LIKE '%工资%') && 流水.交易金额 > 0
  description: 检查人员经费支出的资金来源中是否直接包含国有资产处置或出租收入，只要存在一笔支出凭证的贷方为国有资产收入科目或摘要注明来源于相关收入，且借方为人员经费类科目，即判定为挪用。
  audit_item: 国有资产收入管理不合规
  suspicion: 国有资产收入挪用用于人员经费支出
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"行政单位出租、出借国有资产所形成的收入，以及处置国有资产取得的收入，应当按照政府非税收入管理规定，及时足额上缴国库，不得隐瞒、截留、占用、挪用和坐支。\"\n  },\n  {\n\
    \    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"\
    内容概述\""
- expression: (流水.交易金额 > 100000 && (流水.收款方 IN (个人账户, 疑似关联企业) || 流水.摘要 NOT LIKE '%上缴%' )) || (明细表.处置收入 + 出借台账.实收租金 - 流水.收款账户
    > 0.05 * (明细表.处置收入 + 出借台账.实收租金) ) || (合同.合同乙方 != 流水.付款方 && 流水.收入金额)
  description: 识别隐藏、截留、挪用行为的特征：大额资金（>10万元）流入个人或关联企业账户；实际收入台账金额与银行账户入账总额差异超过5%；合同签订方与银行回款方不一致且资金未进入单位正规账户。任一条件触发即列为疑点。
  audit_item: 国有资产收入管理不合规
  suspicion: 隐瞒截留挪用国有资产收入行为
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"国有资产收入应当按照政府非税收入管理规定及时足额上缴国库，严禁截留、挪用。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n  \
    \  \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条、第六条\",\n    \"内容概述\": \"对隐瞒、截留、挪用应当上缴的财政收入等行为，责令改正，追回资金"
- expression: (出借合同.合同租金单价 < 评估报告.同期同类资产市场租金下限 * 0.8) || (闲置资产认定标准、处置时限要求、出租审批权限、招租程序要求、租金定价规则.出租审批权限缺失关键节点) || (出借台账.收款金额
    != 出借合同.实收租金与合同应计差异 && 无减免审批文件) || (出借合同.承租方股东 in (员工亲属名单) && 会议纪要.表决结果 != '通过')
  description: 当租金明显低于市场价（低于市场下限80%）、审批流程缺失关键控制节点、实收租金与合同约定不一致且无有效减免审批，或关联人承租未经集体决策时，均构成违反规定出租出借。
  audit_item: 资产管理方面存在的问题
  suspicion: 违反内部规定出租出借资产
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会 财政部令第32号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"企业国有资产交易应当遵守国家法律法规和政策规定，遵循等价有偿和公开、公平、公正的原则，在依法设立的产权交易机构中公开进行。\"\n  }\n]"
