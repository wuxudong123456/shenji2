name: audit/登记台账类/理赔台账
type: model
description: 从登记台账类类文档（理赔台账）中提取结构化元数据。涵盖字段如：出险日期、受灾农户姓名、定损完成日期、案件状态、灾害类型、理赔金额、赔案编号、赔款支付日期。文档范围包括：保险公司理赔台账、保险理赔台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 理赔台账
  member_count: 1
  member_details:
  - 保险公司理赔台账
  - 保险理赔台账
output:
  fields:
  - name: 出险日期
    type: date
    description: 提取 出险日期 的日期值，格式 YYYY-MM-DD
  - name: 受灾农户姓名
    type: string
    description: 提取 受灾农户姓名 的文本值
  - name: 定损完成日期
    type: date
    description: 提取 定损完成日期 的日期值，格式 YYYY-MM-DD
  - name: 案件状态
    type: boolean
    description: 提取 案件状态 的布尔值（是/否）
  - name: 灾害类型
    type: string
    description: 提取 灾害类型 的文本值
  - name: 理赔金额
    type: number
    description: 提取 理赔金额 的数值（含单位，如万元、吨等）
  - name: 赔案编号
    type: string
    description: 提取 赔案编号 的文本值
  - name: 赔款支付日期
    type: date
    description: 提取 赔款支付日期 的日期值，格式 YYYY-MM-DD
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (保险公司理赔台账.出险日期 <> 气象局历史灾害记录.灾害发生日期) || (保险公司理赔台账.灾害类型 NOT IN (农业部门灾害记录.灾害类型)) || (财政补贴资金拨付凭证.理赔资金转入农户账户后3日内向保险公司关联账户转出)
  description: 理赔时段与气象部门记录的灾害发生时间无交集，或理赔灾害类型不在农业部门当年记录的灾种范围内，或理赔资金到账后短期内异常回流至保险公司关联方，均视为虚假理赔疑点。三种情形满足其一即触发，多个情形并存则风险极高。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 保险公司虚假理赔套取保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条第二项\"\
    ,\n    \"内容概述\": \"禁止保险公司通过虚假理赔、虚列费用、虚假退保或者截留、挪用保险金、经营费用等方式，骗取农业保险的保险费补贴。\"\n  }\n]"
- expression: (理赔记录.结案日期 - 理赔记录.出险报案日期) > 规定.法定最长理赔周期 || (理赔台账.赔款支付日期 - 理赔台账.定损完成日期) > 10个工作日
  description: 从农户报案到保险公司结案或实际支付赔款的时间超过《农业保险条例》规定的“达成赔偿协议后10日内支付”或地方规定的整体时限（如60天），构成理赔延迟。
  audit_item: 相关支持政策落实不到位
  suspicion: 政策性农业保险理赔严重超时限
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"保险机构应当在与被保险人达成赔偿协议后10日内，将应赔偿的保险金支付给被保险人。\"\n  }\n]"
