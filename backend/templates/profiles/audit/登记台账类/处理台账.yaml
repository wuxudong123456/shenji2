name: audit/登记台账类/处理台账
type: model
description: 从登记台账类类文档（处理台账）中提取结构化元数据。涵盖字段如：不合格原因、举报事项、兑奖状态、凭证编号、占用地块坐标、占用面积、处理完成时间、处理情况。文档范围包括：信访投诉处理台账、农民工工资投诉处理台账、定向生违约处理台账、审核不合格项目处理台账、投诉举报处理台账、无害化处理台账、畜禽养殖污染处理台账、病死畜禽无害化处理台账、粪污处理台账、资金发放异常情况处理台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 凭证
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 处理台账
  member_count: 1
  member_details:
  - 信访投诉处理台账
  - 农民工工资投诉处理台账
  - 定向生违约处理台账
  - 审核不合格项目处理台账
  - 投诉举报处理台账
  - 无害化处理台账
  - 畜禽养殖污染处理台账
  - 病死畜禽无害化处理台账
  - 粪污处理台账
  - 资金发放异常情况处理台账
  - 违规占用案件处理台账
  - 逾期未兑奖处理台账
  - 错误凭证处理台账
