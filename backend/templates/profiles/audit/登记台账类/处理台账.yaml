violations:
- expression: ((访问目标文件（标底文件）.访问内容（含评标专家查询） LIKE '%评标专家%' AND 访问时间 < 开标时间) AND 操作人 NOT IN (权限名单.允许查看人员)) || (相似度(投标文件.技术方案,
    招标文件.技术参数要求) > 0.90 AND 投标准备时长 < 3天)
  description: 开标前非授权人员查阅评标专家名单，或投标文件的技术方案与招标要求异常吻合且准备时间极短，均表明存在评标信息或关键技术参数被提前泄露的风险。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 泄露评标专家名单或关键信息影响公平竞争
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"招标人向他人透露已获取招标文件的潜在投标人的名称、数量或者可能影响公平竞争的有关招标投标的其他情况的，或者泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款。\"\n  }\n]"
- expression: (申报表.绩效目标内容 == '无' 或 申报表.绩效目标内容 == '暂无' 或 申报表.审核意见 == '不通过' 或 不合格台账.处理结果 == '保留预算') && 安排表.安排状态 == '已安排'
  description: 项目在绩效目标申报表中绩效目标为空或填写“无”“暂无”，或审核意见为不通过，或被列入审核不合格项目台账且未剔除预算安排，但年度预算安排计划表中依然安排了预算，即构成违规。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 违规为未设定或未通过绩效目标的项目安排预算
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"党内法规/行政法规\"\
    ,\n    \"条款号\": \"第三部分\",\n    \"内容概述\": \"未按要求设定绩效目标或审核未通过的项目，一律不得安排预算。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"未设定绩效目标或绩效目标审核未通过的，不得纳入预"
- expression: 定向生违约处理台账.应追缴金额 > 定向生违约处理台账.实际追缴金额 AND 定向生违约处理台账.处理状态 != '已全额追缴'
  description: 存在违约行为但未足额追缴培养费用和违约金的，即构成违规；重点关注应追缴金额与实际入库金额差额超过1000元且处理状态长期挂账的情形。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不合规
  suspicion: 订单定向医学生违约后未追缴违约金
  regulation: "[\n  {\n    \"法规名称\": \"关于做好农村订单定向免费培养医学生就业安置和履约管理工作的通知\",\n    \"法规文号\": \"国卫科教发〔2019〕56号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"四、加强违约管理\",\n    \"内容概述\": \"各级卫生健康行政部门要严肃履约管理，对违约人员按规定追缴培养费及违约金，并将违约记录纳入个人诚信档案，确保财政资金安全。\"\
    \n  }\n]"
- expression: 信访投诉处理台账.投诉内容 LIKE '%不交XX费就不给办%' AND 收费通知文件.捆绑要求描述 LIKE '%必须缴纳%' AND 相关公共服务政策文件.公共服务项目办理条件 NOT LIKE '%'||收费通知文件.收费项目||'%'
  description: 通过投诉线索和收费通知，发现一项公共服务的办理被强制以缴纳另一无关收费为前提，且该收费项目无政策关联时，认定为捆绑收费。
  audit_item: 乱集资、乱摊派、乱收费
  suspicion: 强制捆绑无关联收费项目作为公共服务前置条件
  regulation: "[\n  {\n    \"法规名称\": \"农民承担费用和劳务管理条例\",\n    \"法规文号\": \"国务院令第92号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三条\",\n    \"内容概述\": \"除依法承担的税费外，要求农民无偿提供财力、物力和劳务的，均为乱摊派，农民有权拒绝。\"\n  }\n]"
- expression: (调查表.是否倾倒生活污水 == "是") || (记录表.疏通原因 LIKE "%油污%" || 记录表.疏通原因 LIKE "%杂物%" ) || (处理台账.化粪池内容物状态描述 LIKE "%非粪污杂质%")
  description: 判定条件：1.农户调查表中明确反馈将生活污水倒入厕所；2.维护记录显示因油污、杂物等非粪污原因导致堵塞；3.清掏台账反映化粪池内含大量非粪污杂质。三者任一满足即存在混排行为。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 向水冲式厕所倾倒生活污水
  regulation: "[\n  {\n    \"法规名称\": \"农村户厕卫生规范\",\n    \"法规文号\": \"GB 19379-2012\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"4.2.2\",\n    \"内容概述\": \"水冲式厕所的排水系统不得接纳生活污水和其他废水，防止化粪池超负荷及污染。\"\n  }\n]"
- expression: (处理台账.清掏间隔天数 > 利用方案.规定清掏频率 * 1.5) || (调查表.清掏服务是否及时 == "否" && 调查表.粪污倾倒地点 != "指定处理站") || (处理台账.粪污去向 != "集中处理站"
    && 处理台账.粪污去向 != "资源化利用点")
  description: 判定条件：1.台账显示实际清掏间隔超过制度规定最大间隔的1.5倍；2.农户反映清掏不及时且随意倾倒至非指定地点；3.台账记录粪污去向非规定集中处理站点。满足任一组合触发疑点。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 户厕粪污清掏不及时且随意倾倒
  regulation: "[\n  {\n    \"法规名称\": \"关于推进农村“厕所革命”专项行动的指导意见\",\n    \"法规文号\": \"农社发〔2018〕2号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"建立健全粪污收集处理体系，严禁随意倾倒粪渣粪液，确保粪污无害化处理和资源化利用。\"\n  }\n]"
- expression: (SUM(处理台账.清掏量) - SUM(处理台账.接收量) > 0.2 * SUM(清掏量)) || (利用方案.实际运营记录 == NULL || 利用方案.预计产出（沼气/堆肥） == 0) || (明细表.运营补贴支出
    == 0)
  description: 判定条件：1.清掏总量与处理站接收量差异超过清掏总量的20%，说明大量粪污未入处理站；2.资源化利用方案无任何实际运营记录或产出为零；3.无运营补贴支出，表明集中处理站未运行。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 粪污未集中收集和资源化利用
  regulation: "[\n  {\n    \"法规名称\": \"畜禽规模养殖污染防治条例\",\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"推动畜禽粪便等废弃物资源化利用，但一般也适用农村粪污资源化利用方向，要求集中收集处理。\"\n  },\n  {\n    \"法规名称\": \"关于推进农村“厕所革命”专项行动的指导意见\"\
    ,\n    \"法规文号\": \"农社发〔2018〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"推进粪污资源化利用，统筹建设无害化处理和"
- expression: (第三方抽测数据.粪大肠菌群值 > 10^-4 || 第三方抽测数据.寄生虫卵沉降率 < 95%) || (调查表.是否使用未处理粪污 == "是" && 处理台账.无害化处理标识 == "未经处理") || (技术规范文件.发酵停留时间要求
    > 处理台账.接收量)
