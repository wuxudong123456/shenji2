name: audit/登记台账类/厕所台账
type: model
description: 从登记台账类类文档（厕所台账）中提取结构化元数据。涵盖字段如：拆除时间、被拆除户主姓名。文档范围包括：拆除厕所台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 厕所台账
  member_count: 1
  member_details:
  - 拆除厕所台账
output:
  fields:
  - name: 拆除时间
    type: date
    description: 提取 拆除时间 的日期值，格式 YYYY-MM-DD
  - name: 被拆除户主姓名
    type: string
    description: 提取 被拆除户主姓名 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (拆除时间台账.拆除时间 < 确认文件.签字时间) || (签字确认文件缺失) || (举报记录.反映强制拆除的投诉内容 && 无补偿发放记录)
  description: 拆除日期早于农户签字确认日期、或签字文件缺失、或有强制拆除投诉且补偿资金未发放，均构成强制改厕疑点。
  audit_item: 厕所改造实施不规范、质量不达标
  suspicion: 违规强制拆除厕所实施改厕
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国村民委员会组织法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"涉及村民利益的事项，村民委员会必须提请村民会议讨论决定，方可办理。改厕需经村民同意。\"\n  }\n]"
