name: audit/登记台账类/运输台账
type: model
description: 从登记台账类类文档（运输台账）中提取结构化元数据。涵盖字段如：月度外运量。文档范围包括：粪肥运输台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 运输台账
  member_count: 1
  member_details:
  - 粪肥运输台账
output:
  fields:
  - name: 月度外运量
    type: string
    description: 提取 月度外运量 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (月度外运量 / 月度产生量 < 0.7) || (月末库存量 / 月度产生量 > 0.3) || (运输半径 > 50 && 未配置专用车辆)
  description: 当月外运比例低于70%或月末积压率超过30%表明渠道严重不畅；运输半径超过50公里且缺乏专用设备，则规划脱离实际，易导致随意倾倒风险。
  audit_item: 项目实施不到位
  suspicion: 粪肥运输能力不足导致积压滞留
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加快推进畜禽养殖废弃物资源化利用的意见\",\n    \"法规文号\": \"国办发〔2017〕48号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、（八）\",\n    \"内容概述\": \"支持建设沼液田间输送管网、粪肥专用输送管道等设施，推广机械化施用。完善运输体系，降低运输成本。\"\n  },\n  {\n    \"法规名称\"\
    : \"畜禽规模养殖污染防治条例\",\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"畜禽粪便还田利"
