name: audit/登记台账类/物资台账
type: model
description: 从登记台账类类文档（物资台账）中提取结构化元数据。涵盖字段如：N95口罩、核酸快检设备可用数量、防护服、隔离衣等库存量。文档范围包括：防疫物资台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 物资台账
  member_count: 1
  member_details:
  - 防疫物资台账
output:
  fields:
  - name: N95口罩
    type: string
    description: 提取 N95口罩 的文本值
  - name: 核酸快检设备可用数量
    type: number
    description: 提取 核酸快检设备可用数量 的数值（含单位，如万元、吨等）
  - name: 防护服
    type: string
    description: 提取 防护服 的文本值
  - name: 隔离衣等库存量
    type: string
    description: 提取 隔离衣等库存量 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 建设情况统计表.是否设立独立发热诊室 = '否' || 现场检查记录.实际分区及通道隔离情况 = '未实现' || 现场检查记录.独立通风系统运行状态 = '无' || (防疫物资台账.N95口罩、防护服、隔离衣等库存量
    < 发热诊室建设专项规定.防护物资储备量标准) || 防疫物资台账.核酸快检设备可用数量 = 0
  description: 发热诊室是疫情防控前哨，任何一项不满足硬件分区要求或关键物资不足均为重大违规。7天消耗量基于日均就诊人数预估，具体标准参照当地联防联控机制要求。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 乡镇卫生院发热诊室（哨点）建设不符合规范
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强诊所等医疗机构疫情防控工作的通知\",\n    \"法规文号\": \"联防联控机制医疗发〔2021〕46号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、强化常态化疫情防控措施\",\n    \"内容概述\": \"要求设置发热门诊（诊室）的医疗机构必须严格落实三区两通道、独立通风等硬件要求。\"\n  },\n  {\n    \"\
    法规名称\": \"发热门诊设置管理规范\",\n    \"法规文号\": \"联防联控机制医疗发〔2021〕80号\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第三章 建设要求\",\n\
    \    \"内容"
