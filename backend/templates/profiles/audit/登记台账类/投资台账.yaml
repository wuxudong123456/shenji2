name: audit/登记台账类/投资台账
type: model
description: 从登记台账类类文档（投资台账）中提取结构化元数据。涵盖字段如：单项工程实际投资额、投资合同、投资金额、投资项目名称、效益评估。文档范围包括：实际投资台账、投资台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 合同
- 工程
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 投资台账
  member_count: 1
  member_details:
  - 实际投资台账
  - 投资台账
output:
  fields:
  - name: 单项工程实际投资额
    type: string
    description: 提取 单项工程实际投资额 的文本值
  - name: 投资合同
    type: string
    description: 提取 投资合同 的文本值
  - name: 投资金额
    type: number
    description: 提取 投资金额 的数值（含单位，如万元、吨等）
  - name: 投资项目名称
    type: string
    description: 提取 投资项目名称 的文本值
  - name: 效益评估
    type: string
    description: 提取 效益评估 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (投资台账.单项工程实际投资额 - 单项工程概算金额.单项工程概算金额 > 单项工程概算金额.单项工程概算金额 * 0.1) && (支付报表.累计已计量工程量 > 项目合同.合同工程量 * 1.1 || 支付报表.累计已支付金额
    > 项目合同.合同总价 * 1.1) && (申请单.费用增加金额 == null || 申请单.批复意见 != "同意")
  description: 单项工程实际投资超出概算10%以上，并且计量工程量或支付金额超出原合同10%以上，同时缺乏有效变更批复文件，判定为成本控制违规。10%阈值参照水利工程变更管理的一般规定，超出且未批可视为擅自扩大建设规模或提高标准。
  audit_item: 大型水利工程进度与成本审计
  suspicion: 成本超支项目未履行变更审批程序
  regulation: "[\n  {\n    \"法规名称\": \"水利工程建设项目管理暂行规定\",\n    \"法规文号\": \"水建[1995]128号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"建设项目投资必须严格控制在批准的概算范围内。确需调整概算的，必须按原审批程序报批。\"\n  },\n  {\n    \"法规名称\": \"水利工程设计变更管理暂行办法\"\
    ,\n    \"法规文号\": \"水规计[2012]93号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条、第十七条\",\n    \"内容概述\": \"重大设计变更及涉及投资增加的变更必"
- expression: (基金管理办法文件.办法是否存在 = '否') || (收支明细表.支出用途 NOT IN {规定用途集合}) || (收支明细表.审批人 IS NULL) || (银行流水.账户独立性 = '否')
  description: 基金管理办法缺失直接违规；支出用途超出规定范围、缺少审批流程、账户混用均认定为管理混乱。大额支出标准参照本级财政或内部规定（如单笔50万元以上）。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 合作发展基金运行和管理办法缺失或执行混乱
  regulation: "[\n  {\n    \"法规名称\": \"中华全国供销合作总社章程\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第三十条\"\
    ,\n    \"内容概述\": \"合作发展基金应当制定管理办法，实行专户管理、专款专用，主要用于基层社建设和为农服务项目。\"\n  }\n]"
