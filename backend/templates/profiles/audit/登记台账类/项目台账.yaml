name: audit/登记台账类/项目台账
type: model
description: 从登记台账类类文档（项目台账）中提取结构化元数据。涵盖字段如：供应商名称、参训人数、合作期限、培训地点、培训日期、实际建设内容、投资决策日期、投资方式。文档范围包括：培训项目台账、基础设施建设项目台账、电力设施改造项目台账、采购项目台账、重大投资项目台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 培训
- 补贴
- 采购
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 项目台账
  member_count: 1
  member_details:
  - 培训项目台账
  - 基础设施建设项目台账
  - 电力设施改造项目台账
  - 采购项目台账
  - 重大投资项目台账
output:
  fields:
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 参训人数
    type: number
    description: 提取 参训人数 的数值（含单位，如万元、吨等）
  - name: 合作期限
    type: string
    description: 提取 合作期限 的文本值
  - name: 培训地点
    type: string
    description: 提取 培训地点 的文本值
  - name: 培训日期
    type: date
    description: 提取 培训日期 的日期值，格式 YYYY-MM-DD
  - name: 实际建设内容
    type: string
    description: 提取 实际建设内容 的文本值
  - name: 投资决策日期
    type: date
    description: 提取 投资决策日期 的日期值，格式 YYYY-MM-DD
  - name: 投资方式
    type: string
    description: 提取 投资方式 的文本值
  - name: 投资金额
    type: number
    description: 提取 投资金额 的数值（含单位，如万元、吨等）
  - name: 改造内容
    type: string
    description: 提取 改造内容 的文本值
  - name: 改造完成日期
    type: date
    description: 提取 改造完成日期 的日期值，格式 YYYY-MM-DD
  - name: 机井编号
    type: string
    description: 提取 机井编号 的文本值
  - name: 申领补贴金额
    type: number
    description: 提取 申领补贴金额 的数值（含单位，如万元、吨等）
  - name: 采购内容
    type: string
    description: 提取 采购内容 的文本值
  - name: 采购时间
    type: date
    description: 提取 采购时间 的日期值，格式 YYYY-MM-DD
  - name: 采购金额
    type: number
    description: 提取 采购金额 的数值（含单位，如万元、吨等）
  - name: 采购项目名称
    type: string
    description: 提取 采购项目名称 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目状态
    type: boolean
    description: 提取 项目状态 的布尔值（是/否）
  - name: 项目类型
    type: string
    description: 提取 项目类型 的文本值
  - name: 项目类型标签
    type: string
    description: 提取 项目类型标签 的文本值
  - name: 验收结论
    type: string
    description: 提取 验收结论 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: SELECT 项目台账.项目名称, 项目台账.投资金额, 项目台账.投资决策日期 FROM 项目台账 LEFT JOIN 会议纪要 ON 项目台账.项目名称 = 会议纪要.项目名称 WHERE 项目台账.投资金额 >
    (投资金额分级审批标准.集体决策主体要求) AND 会议纪要.项目名称 IS NULL || 会议纪要.出席人员签字 NOT IN (投资金额分级审批标准.集体决策主体要求) || 会议纪要.出席人员签字 < (投资金额分级审批标准.集体决策主体要求)
    || 跟踪表.决策会议环节状态 != '已完成'
  description: 该表达式用于筛查金额超过制度规定门槛的重大投资项目，在会议纪要中无对应记录、签字人非规定决策主体、签字人数不足或流程跟踪表中决策环节未完成的情况。上述任一条件触发即判定为疑点，显示该项目可能未经合法集体决策程序。
  audit_item: 违规进行重大投资
  suspicion: 未经集体决策擅自进行对外投资
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进国有企业贯彻落实“三重一大”决策制度的意见\",\n    \"法规文号\": \"中办发〔2010〕17号\",\n    \"效力级别\": \"\
    制度文件\",\n    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"凡属重大决策、重要人事任免、重大项目安排和大额度资金运作事项必须由领导班子集体作出决定。重大项目安排事项包括重大投资项目。\"\n\
    \  }\n]"
- expression: SELECT 项目台账.项目名称, 项目台账.投资方式（现金/非货币资产/混合）, 投资协议.交易对价及定价依据 FROM 项目台账 INNER JOIN 投资协议 ON 项目台账.项目名称 = 投资协议.项目名称
    LEFT JOIN 评估报告 ON 项目台账.项目名称 = 评估报告.项目名称 WHERE 评估报告.评估报告文号 IS NULL && (项目台账.投资方式（现金/非货币资产/混合） != '全额现金' || 投资协议.交易对价及定价依据
    NOT LIKE '%审计报告%' && 投资协议.交易对价及定价依据 NOT LIKE '%评估报告%')
  description: 该表达式筛查在项目台账中，无法找到对应资产评估报告（即报告文号为空）的投资项目，特别是针对以非货币资产出资或者虽以现金出资但定价依据不清晰且无评估报告作为支撑的情况。若以现金出资并参考第三方审计报告定价，可视为有替代依据，否则判定为高度违规疑点。
  audit_item: 违规进行重大投资
  suspicion: 资产未经评估即进行对外投资
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十七条\",\n    \"内容概述\": \"国有独资企业、国有独资公司、国有资本控股公司合并、分立、改制，转让重大财产，以非货币财产对外投资，清算或者有法律、行政法规以及企业章程规定应当进行资产评估的其他情形的，应当按照规定对有关资产进行评估。\"\
    \n  }\n]"
- expression: SELECT 项目台账.项目名称, 项目台账.项目类型, 批文.银保监会/证监会的行政许可文号 FROM 项目台账 LEFT JOIN 批文 ON 项目台账.项目名称 = 批文.银保监会/证监会的行政许可文号 WHERE
    项目台账.项目类型 IN ('境外投资', '金融衍生品投资', '限制性文化投资') AND (批文.银保监会/证监会的行政许可文号 != '已批准' || 批文.银保监会/证监会的行政许可文号 IS NULL || 批文.银保监会/证监会的行政许可文号
    IS NULL)
  description: 该表达式针对项目类型被标记为境外投资、金融衍生品或限制性文化领域等受特别监管的项目，检查其审批流程跟踪表中的最终审批状态是否为“已批准”，且必备的批文号（如境外投资的发改委备案号、金融业务的经营许可证、文化领域的行业批文）是否完整存在。任何缺失或未批准状态均视为重大违规疑点。
  audit_item: 违规进行重大投资
  suspicion: 未经审批违规开展特别监管类项目投资
  regulation: "[\n  {\n    \"法规名称\": \"企业境外投资管理办法\",\n    \"法规文号\": \"国家发展和改革委员会令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条、第十四条\",\n    \"内容概述\": \"投资主体开展境外投资，应当履行境外投资项目核准、备案等手续。属于核准、备案管理范围的项目，投资主体未取得核准文件或备案通知书的，不得擅自实施。\"\n  }\n\
    ]"
- expression: SELECT 分析表.项目名称, 分析表.支出责任占比, 项目台账.项目类型标签（如境外、金融、文化） FROM 分析表 INNER JOIN 项目台账 ON 分析表.项目名称 = 项目台账.项目名称 WHERE (分析表.支出责任占比
    > 10 || 分析表.人大决议.该项目是否列入当年本级财政预算的决议文号 <地方人大决议文号> || 分析表.人大决议.该项目是否列入当年本级财政预算的决议文号 = <本级财政预算>) AND (项目台账.项目类型标签（如境外、金融、文化）
    NOT IN (企业主业目录) && 评价报告.定量和定性评价结论 = '合格')
  description: 该表达式筛查同时满足三个条件的PPP项目：一是政府付费或补贴支出责任在本级一般公共预算支出中的占比已超过10%的政策红线，或未提供纳入预算的人大决议文件；二是项目本身不属于投资企业的主业范畴；三是项目通过了物有所值评价，但忽视了财政风险。这界定了“明知不该上”且“无钱硬上”的违规情形。
  audit_item: 违规进行重大投资
  suspicion: 违规投资财政承受能力不足的非主业PPP项目
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于推进政府和社会资本合作规范发展的实施意见\",\n    \"法规文号\": \"财金〔2019〕10号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"确保每一年度本级全部PPP项目从一般公共预算列支的财政支出责任，不超过当年本级一般公共预算支出的10%。新签约项目不得从政府性基金预算、国有资本经营预算安排PPP项目运营补贴支出。\"\
    \n  }\n]"
- expression: 电力设施改造项目台账.改造完成日期 IS NOT NULL AND 机井电力设施资产权属证明文件.权属状态 IN ('未明确','争议') AND 电力设施改造项目台账.投资金额 > 0
  description: 已实际投入资金完成改造的机井，其电力设施权属仍为未明确或存在争议，即构成违规。权属状态为“未明确”指无任何产权登记或归属文件，“争议”指存在诉讼、仲裁或信访等纠纷。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 对未确定资产权属的机井电力设施改造升级
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第三十条\",\n    \"内容概述\": \"国家出资企业投资应当进行充分的可行性研究，重大投资项目的产权应清晰，不得投资产权关系不清的项目。\"\n  },\n  {\n    \"法规名称\": \"电力设施保护条例\"\
    ,\n    \"法规文号\": \"国务院令第239号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"电力设施产权人应当承担保护责任，产权不明晰时相关主体"
- expression: 项目台账.实际建设内容 != 村庄名称、规划建设内容、优先项目清单、规划项目清单、规划空间落位.规划建设内容
  description: 将项目验收或实际建设内容与村庄规划的强制性建设内容逐一比对，若存在擅自变更规划优先顺序、改变建设性质或提高建设标准等不一致情形，则触发疑点。严重违规包括：将规划优先项目（如防洪堤）替换为非优先项目（如文化广场），或擅自改变产业路为景观路导致功能失效。
  audit_item: 村庄规划引领作用不足
  suspicion: 未按村庄规划内容建设项目
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第74号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十一条\",\n    \"内容概述\": \"在乡、村庄规划区内进行乡镇企业、乡村公共设施和公益事业建设的，建设单位或者个人应当向乡、镇人民政府提出申请，由乡、镇人民政府报城市、县人民政府城乡规划主管部门核发乡村建设规划许可证。建设活动应当符合规划许可的要求。\"\
    \n  },\n  {\n    \"法规名称\": \"村庄和集镇规划建设管理条例\",\n    \"法规文号\": \"国务院令第116号\",\n    \"效力级别\": \"行政法规\",\n"
- expression: 参训人数 > 实际签到人数 || 签到表中同一身份证号在不同日期的签到笔迹明显雷同 || 培训场地理论最大承载量 < 参训人数 || 身份证号 NOT IN (名册.身份证号) || 项目结业考核通过率 > 95%
    且 抽查学员无实际技能提升
  description: 通过比对申报人数与签到记录、场地容量、学员真实性，当出现人数虚增、非就业帮扶对象参训、签到造假或培训结果明显异常时，判定为虚报培训人数骗取补贴。
  audit_item: 虚列就业补助资金支出
  suspicion: 虚报培训人数骗取培训补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"职业培训补贴资金应按培训合格率等实行分期拨付或绩效挂钩，培训机构需提交真实完整的培训资料，严禁伪造培训记录骗取补贴。\"\n  },\n  {\n    \"法规名称\": \"\
    财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"单位和个人有伪造、变造或者提供"
- expression: COUNT(采购合同.合同编号) > 1 && SUM(采购合同.合同金额) >= 其他.公开招标数额标准 && ABS(多份合同.签订日期差值) <= 30 && 采购合同.供应商名称相同 && 采购合同.采购内容同属一个项目
  description: 当同一供应商在30天内签订多份采购内容同属一个完整项目的合同时，若各合同金额均低于公开招标标准，但合计金额达到标准，则判定为化整为零规避公开招标。阈值30天为经验值，可根据审计期间调整。
  audit_item: 违规采购彩票设备和技术服务
  suspicion: 化整为零拆分采购规避公开招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第 68 号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第二十八条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第 658 号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"在一个财政年度内，采购人将一个预算项目下的"
