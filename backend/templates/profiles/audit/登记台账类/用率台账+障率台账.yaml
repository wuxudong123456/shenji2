name: audit/登记台账类/用率台账+障率台账
type: model
description: 从登记台账类类文档（用率台账、障率台账）中提取结构化元数据。涵盖字段如：使用次数、接入电源类型、月度充电量、桩编号、状态。文档范围包括：充电桩使用率台账、充电桩故障率台账等。本模板合并了 2 个相似子类型。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 用率台账
  - 障率台账
  member_count: 2
  member_details:
  - 充电桩使用率台账
  - 充电桩故障率台账
output:
  fields:
  - name: 使用次数
    type: string
    description: 提取 使用次数 的文本值
  - name: 接入电源类型
    type: string
    description: 提取 接入电源类型 的文本值
  - name: 月度充电量
    type: string
    description: 提取 月度充电量 的文本值
  - name: 桩编号
    type: string
    description: 提取 桩编号 的文本值
  - name: 状态
    type: boolean
    description: 提取 状态 的布尔值（是/否）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 桩编号.月度充电量（kWh） = 0 AND 桩编号.使用次数 >= 3 AND 桩编号.接入电源类型 != '专用变压器'
  description: 充电桩连续3个月无任何充电记录，且接入的是普通公用照明电路而非专用变压器，可判定因电力配套不足导致设施闲置，形成“僵尸桩”，属于财政资金浪费。
  audit_item: 农村用能清洁低碳转型不到位
  suspicion: 村级充电桩因电力配套不足沦为闲置设施
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条\"\
    ,\n    \"内容概述\": \"政府投资项目应当保障建设条件，确保项目建成后有效运行，避免形成闲置资产。\"\n  }\n]"
