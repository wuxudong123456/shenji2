name: audit/登记台账类/用车台账
type: model
description: 从登记台账类类文档（用车台账）中提取结构化元数据。涵盖字段如：使用部门、停放地点、净值、品牌型号、实有车辆总数、排量、权属单位、能源类型。文档范围包括：公务用车台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 车辆
- 预算
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 用车台账
  member_count: 1
  member_details:
  - 公务用车台账
output:
  fields:
  - name: 使用部门
    type: string
    description: 提取 使用部门 的文本值
  - name: 停放地点
    type: string
    description: 提取 停放地点 的文本值
  - name: 净值
    type: string
    description: 提取 净值 的文本值
  - name: 品牌型号
    type: string
    description: 提取 品牌型号 的文本值
  - name: 实有车辆总数
    type: string
    description: 提取 实有车辆总数 的文本值
  - name: 排量
    type: string
    description: 提取 排量 的文本值
  - name: 权属单位
    type: string
    description: 提取 权属单位 的文本值
  - name: 能源类型
    type: string
    description: 提取 能源类型 的文本值
  - name: 购入日期
    type: date
    description: 提取 购入日期 的日期值，格式 YYYY-MM-DD
  - name: 购置价格
    type: number
    description: 提取 购置价格 的数值（含单位，如万元、吨等）
  - name: 车牌号
    type: string
    description: 提取 车牌号 的文本值
  - name: 车辆品牌型号
    type: string
    description: 提取 车辆品牌型号 的文本值
  - name: 车辆型号
    type: string
    description: 提取 车辆型号 的文本值
  - name: 车辆状态
    type: boolean
    description: 提取 车辆状态 的布尔值（是/否）
  - name: 车辆管理部门
    type: string
    description: 提取 车辆管理部门 的文本值
  - name: 车辆费用预算归属
    type: number
    description: 提取 车辆费用预算归属 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ((登记表.用车时间 ∈ 非工作时段) AND ((记录表.车辆坐标位置 匹配 非公务场所) OR (登记表.事由 不包含 公务关键词))) OR ((用车台账.车牌号 != 明细表.车牌号) AND (明细表.加油时间
    无匹配 派车记录)) OR ((明细表.维修方 != 定点供应商) AND (明细表.费用日期 无匹配 对应车牌号在用记录))
  description: 非工作时段默认指国家法定节假日及工作日19:00至次日7:00；非公务场所包括但不限于学校、商场、居民小区、旅游景点等，由GPS数据与POI数据库比对；公务关键词包括“会议”、“调研”、“检查”、“出差”、“接待”等；当加油车辆为私家车或在无派车记录时段加油，则判定为私车公养；报销发票对应车牌号若无使用记录或维修商非定点，存在虚报维修嫌疑。
  audit_item: 违规管理或使用公务用车
  suspicion: 公车私用或私车公养
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"党政机关应当加强公务用车使用管理，严格按照规定使用公务用车，严禁公车私用、私车公养，不得既领取公务交通补贴又违规使用公务用车。\"\n  }\n]"
- expression: (登记台账类.车牌号 IN 登记表.车牌号) AND ((手续文件 IS NULL) OR (登记表.用车时间 > 手续文件.借用期限) OR (登记台账类.车辆费用预算归属 != 登记台账类.权属单位))
  description: 若单位公务用车台账中包含下属或其他单位的资产车辆，且无合规的调拨或借用审批文件，或实际使用期限严重超出批准期限（如超过1个月未续期），或相关运行费用未向原单位列支或补偿，则判定为违规占用。
  audit_item: 违规管理或使用公务用车
  suspicion: 违规占用下属或其他单位车辆
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"党政机关不得以任何方式换用、借用、占用下属单位或者其他单位和个人的车辆，不得接受企事业单位和个人赠送的车辆。\"\n  }\n]"
- expression: (管理主体.管理主体 != '集中调度部门') OR (登记表.审批人 分散于 多个非主管科室) OR (用车台账.车辆费用预算归属 跟随 单个部门独立核算)
  description: 若制度中未明确由一个专门的部门负责所有车辆的调度和管理，或在实际执行中，派车审批权分散在各个业务科室，且车辆费用直接计入各科室预算而不进行统一核算，则判定为未实行集中统一管理。
  audit_item: 违规管理或使用公务用车
  suspicion: 公务用车未实行集中统一管理
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"党政机关应当加强公务用车集中统一管理，建立公务用车管理台账，加强相关证照档案的保存和管理。\"\n  }\n]"
- expression: (ABS(分析表.百公里油耗或电耗 - 标准文件.标准百公里能耗上限) / 标准文件.标准百公里能耗上限 > 0.15) OR (用车台账.排量 > 1.8 AND 用车台账.购入日期 > 限定日期)
  description: 汽油车实际百公里油耗超过标准油耗15%以上，或新能源车实际百公里电耗超出标准电耗15%以上，视为能耗控制不达标。若车辆本身排量或价格超过国家规定的配备标准，直接从源头上违反能耗控制原则。限定日期参照各级车改后的新购车辆标准。
  audit_item: 违规管理或使用公务用车
  suspicion: 未按规定控制公务车能耗
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十四条\",\n    \"内容概述\": \"党政机关应当加强公务用车使用管理，严格按照规定用途使用公务用车，降低使用和维修保养成本……实行单车能耗核算。\"\n  }\n]"
- expression: (批准处置方式、处置价值、受让方.处置价值 < 批准处置方式、处置价值、受让方.评估价值 * 0.9) AND (未附有 情况说明) OR (批准处置方式、处置价值、受让方.处置价值 IS NULL) OR (批准处置方式、处置价值、受让方.处置价值
    > 入账金额、入账日期、收款凭证号.入账金额) OR (入账金额、入账日期、收款凭证号.入账金额 IS NULL)
  description: 规定车辆处置需进行资产评估并经批准。若最终处置价格显著低于评估价（例如低于90%），且无合理解释，则存在低价转让嫌疑。若实际处置已发生，但处置收益未全额、及时上缴国库或未记入财务账，则判定为截留、挪用处置收入。
  audit_item: 违规管理或使用公务用车
  suspicion: 违规处置公务用车
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"行政事业单位应当将依法处置的资产所产生的收入，按照政府非税收入和国库集中收缴制度的有关规定管理。\"\n  },\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\"\
    ,\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第二十四条\",\n    \"内容概述\": \"对于处置的公务用车，应当通过公开拍卖等"
- expression: (批复车辆编制数、实有车辆台数、车型.实有车辆台数 > 批复车辆编制数、实有车辆台数、车型.批复车辆编制数) OR (车牌号、车辆型号、权属单位、车辆品牌型号、使用部门、车辆管理部门、停放地点、车辆费用预算归属、购入日期、排量、能源类型、车辆状态、净值、实有车辆总数、品牌型号、购置价格.实有车辆总数
    > 批复车辆编制数、实有车辆台数、车型.实有车辆台数) OR (维修保养项目、维修方、报销金额、费用日期、收款方名称、保险、加油、维修实际支出金额.维修实际支出金额 远大于 批复车辆编制数、实有车辆台数、车型.批复车辆编制数)
  description: 若单位对上的正式报告中少报、瞒报实有车辆数，或超编制配备使用车辆；或实际运行维护费开支远超向上级报告的标准，均属于未严格执行统计报告制度。实有数大于上报数，或台账车辆与报告中车辆车牌号不符，是瞒报的直接证据。
  audit_item: 违规管理或使用公务用车
  suspicion: 未严格执行配备更新统计报告制度
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"各级公务用车主管部门应当建立公务用车配备更新和使用情况统计报告制度。党政机关应当定期向上级公务用车主管部门报告公务用车配备更新和使用情况。\"\n  }\n]"
