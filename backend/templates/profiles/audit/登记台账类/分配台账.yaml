name: audit/登记台账类/分配台账
type: model
description: 从登记台账类类文档（分配台账）中提取结构化元数据。涵盖字段如：人均救助金额、分配去向、分配状态、原接收记录、台账是否存在、地区名称、实际纳入保障房管理的房源套数、接收资金金额。文档范围包括：保障房分配台账、医疗救助资金地区分配台账、捐赠物资分配台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 台账
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 分配台账
  member_count: 1
  member_details:
  - 保障房分配台账
  - 医疗救助资金地区分配台账
  - 捐赠物资分配台账
output:
  fields:
  - name: 人均救助金额
    type: number
    description: 提取 人均救助金额 的数值（含单位，如万元、吨等）
  - name: 分配去向
    type: string
    description: 提取 分配去向 的文本值
  - name: 分配状态
    type: boolean
    description: 提取 分配状态 的布尔值（是/否）
  - name: 原接收记录
    type: string
    description: 提取 原接收记录 的文本值
  - name: 台账是否存在
    type: boolean
    description: 提取 台账是否存在 的布尔值（是/否）
  - name: 地区名称
    type: string
    description: 提取 地区名称 的文本值
  - name: 实际纳入保障房管理的房源套数
    type: string
    description: 提取 实际纳入保障房管理的房源套数 的文本值
  - name: 接收资金金额
    type: number
    description: 提取 接收资金金额 的数值（含单位，如万元、吨等）
  - name: 救助覆盖人数
    type: number
    description: 提取 救助覆盖人数 的数值（含单位，如万元、吨等）
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 是否重点帮扶县
    type: boolean
    description: 提取 是否重点帮扶县 的布尔值（是/否）
  - name: 物资名称
    type: string
    description: 提取 物资名称 的文本值
  - name: 物资有效期
    type: string
    description: 提取 物资有效期 的文本值
  - name: 规格
    type: string
    description: 提取 规格 的文本值
  - name: 金额物资
    type: number
    description: 提取 金额物资 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (重点帮扶县人均救助金额 <= 非重点帮扶县人均救助金额 * 1.05) || (重点帮扶县资金分配占比 < 专项政策要求的最低倾斜占比) || (分配审批文件.倾斜说明 IS NULL) || (重点帮扶县住院救助自付比例
    >= 非重点帮扶县同级别医疗机构平均自付比例 * 0.95)
  description: 表达式设置四项条件：①重点帮扶县人均救助金额未显著高于非重点县（仅高出5%以内或无优势），表明未实现政策倾斜；②县级资金分配占比低于政策明文规定的倾斜比例；③资金分配审批文件中未包含“重点帮扶县”要素，表明决策时未考虑倾斜因子；④重点帮扶县脱贫患者住院自付比例未明显低于非重点县（未降低5%以上）。条件①③④以轻微阈值容忍正常统计偏差，任意满足一条即视为未落实倾斜政策。
  audit_item: 防止返贫帮扶政策落实不到位
  suspicion: 医疗救助资金未向乡村振兴重点帮扶县倾斜
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于实现巩固拓展脱贫攻坚成果同乡村振兴有效衔接的意见\",\n    \"法规文号\": \"中发〔2020〕30号\",\n    \"效力级别\"\
    : \"党内法规和规范性文件\",\n    \"条款号\": \"第四部分（十四）\",\n    \"内容概述\": \"在乡村振兴重点帮扶县给予集中支持，强化脱贫地区医疗保障，完善脱贫人口医疗救助制度，对重点帮扶县在资金分配上予以适当倾斜。\"\
    \n  },\n  {\n    \"法规名称\": \"关于巩固拓展医疗保障脱贫攻坚成果有效衔接乡村振兴战略的实施意见\",\n    \"法规文号\": \"医保发〔2021〕10号\",\n    \"效力级别"
- expression: (分配台账.台账是否存在 = 0) || (分配台账.捐赠方名称 IS NULL || 分配台账.物资名称 IS NULL || 分配台账.分配去向 IS NULL)
  description: 未建立台账（记录数为0）或台账关键字段缺失，即无法实现捐赠物资的全流程追溯，属于严重不合规。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 捐赠物资未登记造册及未建立台账
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十八条\"\
    ,\n    \"内容概述\": \"慈善组织应当对募集的财产登记造册，严格管理，专款专用。\"\n  }\n]"
- expression: (分配台账.原接收记录 EXISTS) AND (票据编号.对应票据号码 IS NULL OR 票据编号.对应票据号码 != '公益事业捐赠票据')
  description: 存在捐赠接收记录但未能提供对应的公益事业捐赠票据存根联，或开具的票据非财政部门监制的合规票据，即属违规。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 接受捐赠款物未开具合规捐赠票据
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公益事业捐赠法\",\n    \"法规文号\": \"主席令第19号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"受赠人接受捐赠后，应当向捐赠人出具合法、有效的收据，将受赠财产登记造册，妥善保管。\"\n  },\n  {\n    \"法规名称\": \"公益事业捐赠票据使用管理办法\"\
    ,\n    \"法规文号\": \"财综〔2010〕112号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"公益事业捐赠票据是捐赠人对外捐赠并根据国家有关规定申请捐赠款"
- expression: (变卖物资名称、数量、单价、总额、购买方、审批记录.购买方) AND (审批文件.审批记录 IS NULL || 评估价值、评估机构、评估日期、物资名称 IS NULL || (评估价值、评估机构、评估日期、物资名称.评估价值
    - 变卖物资名称、数量、单价、总额、购买方、审批记录.单价) / 评估价值、评估机构、评估日期、物资名称.评估价值 > 0.1)
  description: 变卖捐赠物资须有审批文件和价值评估；若缺失任一文件，或变卖价格比评估价低10%以上且无合理解释，即视为违规变卖。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 未经批准擅自变卖捐赠物资或变卖程序违规
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十三条\"\
    ,\n    \"内容概述\": \"慈善组织的财产应当根据章程和捐赠协议的规定全部用于慈善目的，不得私分、挪用、截留或者侵占慈善财产。\"\n  }\n]"
- expression: (ABS(公示金额及数量.公示金额及数量 - 统计报表.统计期间接受捐赠总额) > 0) || (公示金额及数量.公示日期 - 分配台账.接收日期 > 30) || (公示金额及数量.公示内容摘要 IS NULL)
  description: 公示金额与统计报表总额不一致即不准确；接收日期与公示日期间隔超过30天为不及时；分配去向信息缺失为不完整。三者任一触发判定违规。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 捐赠信息公开不及时不准确不完整
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十二条\"\
    ,\n    \"内容概述\": \"慈善组织应当依法履行信息公开义务。信息公开应当真实、完整、及时。\"\n  }\n]"
- expression: 项目申报材料.保障房申报套数 != 保障房分配台账.实际纳入保障房管理套数  ||  项目申报材料.保障房面积占比 - (购房合同备案数据.房屋性质为'保障房'的套数面积合计 / 总规划面积) > 0.2
  description: 申报时承诺的保障房比例与实际纳入保障房管理系统或备案为保障房的比例相差超过20个百分点，即存在虚报。
  audit_item: 骗取银行贷款或住房公积金项目贷款
  suspicion: 虚报保障房比例骗取低息贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十五条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，应退回资金。\"\n  },\n  {\n    \"法规名称\": \"国务院关于解决城市低收入家庭住房困难的若干意见\",\n    \"法规文号\"\
    : \"国发〔2007〕24号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"三、（八）\",\n    \"内容概述\": \"应确保保障性住房的供应对象符合条件，不得将保障性住房变相用于商品住房开发。\"\
    \n"
