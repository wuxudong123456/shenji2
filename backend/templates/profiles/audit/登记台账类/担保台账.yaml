name: audit/登记台账类/担保台账
type: model
description: 从登记台账类类文档（担保台账）中提取结构化元数据。涵盖字段如：合同签订日期、实际代偿金额、审批层级记录、已追偿金额、担保份额、担保金额、未追偿金额。文档范围包括：对外担保台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 合同
- 审批
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 担保台账
  member_count: 1
  member_details:
  - 对外担保台账
output:
  fields:
  - name: 合同签订日期
    type: date
    description: 提取 合同签订日期 的日期值，格式 YYYY-MM-DD
  - name: 实际代偿金额
    type: number
    description: 提取 实际代偿金额 的数值（含单位，如万元、吨等）
  - name: 审批层级记录
    type: string
    description: 提取 审批层级记录 的文本值
  - name: 已追偿金额
    type: number
    description: 提取 已追偿金额 的数值（含单位，如万元、吨等）
  - name: 担保份额
    type: string
    description: 提取 担保份额 的文本值
  - name: 担保金额
    type: number
    description: 提取 担保金额 的数值（含单位，如万元、吨等）
  - name: 未追偿金额
    type: number
    description: 提取 未追偿金额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (担保合同.签订日期 < 决议文件.决议日期) || (担保合同.担保金额 > 其他.金额限额 && 决议文件.审批层级 != 其他.审批层级) || (其他.需经董事会或风控委员会审批的条件 == true &&
    批准文件.批复文号 == null)
  description: 判定规则：1. 合同签订日期早于决议日期，表明存在先操作后审批；2. 担保金额超过制度规定的该层级审批限额（如总经理权限1亿，实际担保2亿），且决议机构层级不符；3. 根据公司章程或上级规定须报国资委/集团审批而未取得书面批复，即视为违规。以上任一条件满足则触发疑点。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 未按规定履行决策程序对外担保或借款
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进国有企业贯彻落实“三重一大”决策制度的意见\",\n    \"法规文号\": \"中办发〔2010〕17号\",\n    \"效力级别\": \"\
    制度文件\",\n    \"条款号\": \"二、‘三重一大’事项的主要范围\",\n    \"内容概述\": \"重大决策、重要人事任免、重大项目安排和大额度资金运作事项必须由领导班子集体作出决定，不得以传阅、会签或个别征求意见等方式代替。\"\
    \n  }\n]"
- expression: (担保台账.实际代偿金额 > 担保份额条款.担保比例 * 1.05) && (担保台账.已追偿金额 == 0 || 担保台账.已追偿金额 < 50%)
  description: 实际代偿金额超过合同约定应承担份额的105%（容差5%）且未向其他共同担保人追偿或追偿率显著过低（低于50%），表明未按保证份额承担责任，可能存在怠于追偿或变相承担超额责任。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 未按保证份额承担担保责任
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"六、严格追究违规担保责任\",\n    \"内容概述\": \"对因违规担保造成资产损失或未按规定承担担保责任、代偿后未及时追偿造成损失的，要严肃追究相关责任人责任。\"\n  }\n]"
