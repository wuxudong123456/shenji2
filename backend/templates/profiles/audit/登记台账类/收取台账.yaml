name: audit/登记台账类/收取台账
type: model
description: 从登记台账类类文档（收取台账）中提取结构化元数据。涵盖字段如：参与对象名称、实收金额、实际执行租金单价、应收租金、承租人、收费日期、租金收入账户银行流水、租金收取台账。文档范围包括：租金收取台账、评比达标表彰活动费用收取台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 台账
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 收取台账
  member_count: 1
  member_details:
  - 租金收取台账
  - 评比达标表彰活动费用收取台账
output:
  fields:
  - name: 参与对象名称
    type: string
    description: 提取 参与对象名称 的文本值
  - name: 实收金额
    type: number
    description: 提取 实收金额 的数值（含单位，如万元、吨等）
  - name: 实际执行租金单价
    type: number
    description: 提取 实际执行租金单价 的数值（含单位，如万元、吨等）
  - name: 应收租金
    type: string
    description: 提取 应收租金 的文本值
  - name: 承租人
    type: string
    description: 提取 承租人 的文本值
  - name: 收费日期
    type: date
    description: 提取 收费日期 的日期值，格式 YYYY-MM-DD
  - name: 租金收入账户银行流水
    type: number
    description: 提取 租金收入账户银行流水 的数值（含单位，如万元、吨等）
  - name: 租金收取台账
    type: string
    description: 提取 租金收取台账 的文本值
  - name: 缴费名目
    type: number
    description: 提取 缴费名目 的数值（含单位，如万元、吨等）
  - name: 缴费金额
    type: number
    description: 提取 缴费金额 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 银行流水
    type: string
    description: 提取 银行流水 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 收取台账.实际开展活动名称 NOT IN (备案文件.已批准活动名称列表)
  description: 将协会实际执行的评比表彰活动与政府公布的保留项目目录或审批备案清单进行比对，若活动不在获批范围内，即判定为违规举办。
  audit_item: 行业协会商会违规收费
  suspicion: 未经批准开展评比达标表彰活动
  regulation: "[\n  {\n    \"法规名称\": \"社会组织评比达标表彰活动管理办法\",\n    \"法规文号\": \"国评组发〔2022〕3号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第四条\",\n    \"内容概述\": \"社会组织未经批准，不得自行创设或者擅自开展评比达标表彰活动。\"\n  }\n]"
- expression: (参与对象名称 IS NOT NULL) && (收取台账.缴费金额 > 0) && (收取台账.缴费名目（如评审费、宣传费） IN (评审费, 申报费, 宣传费, 奖牌制作费, 工本费))
  description: 凡是在评比活动组织期间，向参评对象收取任何与“评选资格”“荣誉证书”“奖牌制作”“宣传推广”等直接或间接相关费用的，无论名义为何，均触发违规判定。
  audit_item: 行业协会商会违规收费
  suspicion: 违规在评选前后向参评对象收费
  regulation: "[\n  {\n    \"法规名称\": \"社会组织评比达标表彰活动管理办法\",\n    \"法规文号\": \"国评组发〔2022〕3号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十六条\",\n    \"内容概述\": \"社会组织评比达标表彰活动不得向评选对象收取任何费用，不得在评选前后收取各种相关费用。\"\n  }\n]"
- expression: (租金收取台账.租金收入账户银行流水.交易摘要 LIKE '%付%' || 租金收取台账.租金收入账户银行流水.交易摘要 LIKE '%支%' || 租金收取台账.租金收入账户银行流水.对方户名 != '非税收入汇缴户'
    ) && ABS(租金收取台账.租金收入账户银行流水.金额) > 0 && 租金收取台账.租金收入账户银行流水.对方户名 != '财政专户'
  description: 筛查租金收入专用账户（或收取租金的账户）银行流水中，存在摘要为支付费用（含‘付’、‘支’等字样）或对方户名为第三方机构（如物业公司、维修公司、供应商）的支出记录，且该笔支出未通过‘上缴国库/财政专户’后通过预算拨付，则判定为坐支租金收入。ABS函数取绝对值，确保支出金额大于0。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 租金收入直接坐支用于日常运营
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条 及 第五十六条\",\n    \"内容概述\": \"各部门、各单位是本部门、本单位的预算执行主体，负责本部门、本单位的预算执行，并对执行结果负责。政府的全部收入应当上缴国家金库，任何部门、单位和个人不得截留、占用、挪用或者拖欠。\"\
    \n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n    \"法规文号\": \"中华人民共和国国务院令第427号\",\n    \"效力级别\": \"行政法"
- expression: 租金收取台账.银行流水.收款账户名称 != '财政非税收入汇缴专户' && 租金收取台账.银行流水.收款账户名称 != '单位基本户'
  description: 筛查实际收取租金的银行账户，既非财政指定的非税收入汇缴专户，也非单位经批准的对公基本户，而是流入工会账户、协会账户、个人账户等。只要收款账户主体异常，即触发疑点。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 租金收入存入自有账户或私设小金库
  regulation: "[\n  {\n    \"法规名称\": \"《政府非税收入管理办法》\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条 及 第十八条\",\n    \"内容概述\": \"非税收入应当由执收单位按照规定征收，并全额上缴国库，实行收支两条线管理。非税收入的收缴和清分，应当通过国库单一账户体系或者财政专户进行。任何单位和个人不得隐匿、截留、坐支和挪用非税收入。\"\
    \n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n    \"法规文号\": \"中华人民共和国国务院令第427号\",\n    \"效力级别\": \"行"
- expression: 租金收取台账.代收企业代收台账.缴纳日期 + 30天 < 非税收入缴款书.国库入账日期 && 租金收取台账.实收金额 > 0
  description: 设定一般缴库时限为30天（结合地方规定调整）。若代收企业收到租金之日起超过30天才上缴财政，且在此期间相关资金滞留在代收企业账户或单位归集户中形成大额沉淀余额，则判定为滞留非税收入。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 租金收入长期滞留代收企业未上缴
  regulation: "[\n  {\n    \"法规名称\": \"《政府非税收入管理办法》\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"执收单位应当加强非税收入征收管理，依照规定的范围和标准及时足额征收，并按照规定的时限和缴库方式，及时足额将非税收入缴入国库或者财政专户，不得多征、提前征收或者减征、免征、缓征非税收入。\"\
    \n  },\n  {\n    \"法规名称\": \"《中华人民共和国国家金库条例》\",\n    \"法规文号\": \"国发〔1985〕96号\",\n    \"效力级别\": \"行政法规\",\n    \"条"
- expression: 租赁合同.月租金标准 != 非税收入缴款书.国库实际入账金额 / 月份数 && (租金收取台账.第三方支付平台流水.扣款项名称 LIKE '%手续费%' || 租金收取台账.第三方支付平台流水.扣款项名称 LIKE
    '%服务费%')
  description: 比对租户应缴的月租金标准与最终缴入国库的非税收入金额，若存在差异，且差异金额在缴费渠道流水（如微信、支付宝、银联）中体现为被扣除的“手续费”、“平台服务费”、“管理费”等，即判定为违规截留。非税收入应全额上缴，代收成本应由财政预算另行安排，不得从中扣除。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 以手续费等名义截留部分租金
  regulation: "[\n  {\n    \"法规名称\": \"《政府非税收入管理办法》\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"除财政部另有规定外，执收单位不得擅自将非税收入分成或者转移。非税收入应当全额上缴国库，任何单位和个人不得截留、坐支、挪用。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政部关于加强政府非税收入管理的通知\",\n    \"法规文号\": \"财综〔2004〕53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三点（规范征收行为）\",\n  \
    \  \"内容概"
- expression: 租金缴存凭证.缴存银行账号 != 规定专户账号.规定专户账号 && 财务凭证.租金收入入账科目 != '保障房租金收入专户'
  description: 核对实际存放租金收入的银行账户是否与制度规定的财政专户一致；若租金存入单位基本户或通用非税账户，且未设立专户核算，即判定未实行专户管理，存在挪用风险。
  audit_item: 挪用或违规使用保障性安居工程专项资金
  suspicion: 保障房租金收入未实行专户管理
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"公共租赁住房租金收入应当按照政府非税收入管理的规定缴入同级国库，实行“收支两条线”管理。\"\n  },\n  {\n    \"法规名称\": \"政府非税收入管理办法\"\
    ,\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\": \"非税收入应当由执收单位通过非税收入收缴系统上缴财政，"
- expression: 收取台账.实收金额 - 缴存凭证.缴款金额 > 0 && 差额 > 5000 OR 台账.实收金额记录为现金收取而银行未体现
  description: 比对租金收取台账记录的实收金额与上缴银行的金额是否一致；若台账记录收取现金但银行缴款记录缺失，或两者差额累计超过5000元，则存在截留或私分嫌疑。结合租户访谈确认实际缴费数额，锁定私分事实。
  audit_item: 挪用或违规使用保障性安居工程专项资金
  suspicion: 截留私分保障房租金收入
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"任何单位和个人不得截留、挤占、挪用公共租赁住房租金收入。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"\
    无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三百八十二条\",\n    \"内容概述\": \"国家工作人员利用职务便利侵吞、窃取、骗取公共财物的，构成贪污罪。\"\n  }\n]"
- expression: 合同台账.合同租金单价 < 政策规定同地段、同类别保障房租金标准.政策规定同地段、同类别保障房租金标准 × 0.8 && 审核资料.关联单位/家庭成员属于公职人员
  description: 若合同约定的租金单价低于政府定价的80%，且承租人经筛查为管理单位公职人员或其近亲属，存在利益输送嫌疑。即使无关联人员，低于政府定价20%以上且无合法减免审批也构成违规。
  audit_item: 挪用或违规使用保障性安居工程专项资金
  suspicion: 违规低价出租保障房造成租金损失
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"公共租赁住房租金标准由市、县人民政府根据当地经济发展水平、市场租金水平等因素确定并公布，任何单位和个人不得擅自减免或变相减免租金。\"\n  }\n]"
