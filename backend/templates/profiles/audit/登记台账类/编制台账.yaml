name: audit/登记台账类/编制台账
type: model
description: 从登记台账类类文档（编制台账）中提取结构化元数据。涵盖字段如：变更日期、变更类型、批准文号。文档范围包括：机构编制台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 编制台账
  member_count: 1
  member_details:
  - 机构编制台账
output:
  fields:
  - name: 变更日期
    type: date
    description: 提取 变更日期 的日期值，格式 YYYY-MM-DD
  - name: 变更类型
    type: string
    description: 提取 变更类型 的文本值
  - name: 批准文号
    type: string
    description: 提取 批准文号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (设置清单.处置类型 IN ('设立','撤销','合并')) AND (设置清单.批准文号 IS NULL OR 设置清单.批准文号 = '' OR 设置清单.成立日期 < (SELECT 批准日期 FROM 审批文件
    WHERE 批准文号 = 设置清单.批准文号))
  description: 机构设置清单中记录为设立、撤销或合并的机构，若无法与有效的审批文件文号关联，或其实际执行日期早于批准日期，则判定为擅自行为。成立日期早于批准日期表明存在“先建后批”或“未批先建”。
  audit_item: 违规设置或变更机构
  suspicion: 擅自设立、撤销、合并机构
  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第九条\",\n    \"内容概述\": \"地方各级人民政府行政机构的设立、撤销、合并或者变更规格、名称，由本级人民政府提出方案，经上一级人民政府机构编制管理机关审核后，报上一级人民政府批准；县级以上地方各级人民政府行政机构的设立、撤销或者合并，还应当依法报本级人民代表大会常务委员会备案。\"\
    \n  }\n]"
