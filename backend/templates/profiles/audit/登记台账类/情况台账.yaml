name: audit/登记台账类/情况台账
type: model
description: 从登记台账类类文档（情况台账）中提取结构化元数据。涵盖字段如：企业名称、住房保障措施类型、原单位、培训项目、实际在岗月数、实际获批用地性质、就业状态、已落实帮扶户数。文档范围包括：城乡教师交流轮岗执行情况台账、帮扶措施落实情况台账、校长培训达标情况台账、渔民转产安置方案落实情况台账、畜禽养殖企业用地优惠政策落实情况台账、畜禽养殖企业用电优惠政策落实情况台账、转产安置方案落实情况台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 培训
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 情况台账
  member_count: 1
  member_details:
  - 城乡教师交流轮岗执行情况台账
  - 帮扶措施落实情况台账
  - 校长培训达标情况台账
  - 渔民转产安置方案落实情况台账
  - 畜禽养殖企业用地优惠政策落实情况台账
  - 畜禽养殖企业用电优惠政策落实情况台账
  - 转产安置方案落实情况台账
output:
  fields:
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 住房保障措施类型
    type: string
    description: 提取 住房保障措施类型 的文本值
  - name: 原单位
    type: string
    description: 提取 原单位 的文本值
  - name: 培训项目
    type: string
    description: 提取 培训项目 的文本值
  - name: 实际在岗月数
    type: string
    description: 提取 实际在岗月数 的文本值
  - name: 实际获批用地性质
    type: string
    description: 提取 实际获批用地性质 的文本值
  - name: 就业状态
    type: boolean
    description: 提取 就业状态 的布尔值（是/否）
  - name: 已落实帮扶户数
    type: string
    description: 提取 已落实帮扶户数 的文本值
  - name: 帮扶内容
    type: string
    description: 提取 帮扶内容 的文本值
  - name: 帮扶期限
    type: string
    description: 提取 帮扶期限 的文本值
  - name: 帮扶频次
    type: string
    description: 提取 帮扶频次 的文本值
  - name: 应执行的优惠电价类别
    type: string
    description: 提取 应执行的优惠电价类别 的文本值
  - name: 是否为骨干教师
    type: boolean
    description: 提取 是否为骨干教师 的布尔值（是/否）
  - name: 校长姓名
    type: string
    description: 提取 校长姓名 的文本值
  - name: 派往学校
    type: string
    description: 提取 派往学校 的文本值
  - name: 渔民ID
    type: string
    description: 提取 渔民ID 的文本值
  - name: 纳入对象户数
    type: string
    description: 提取 纳入对象户数 的文本值
  - name: 缴纳的土地相关费用
    type: number
    description: 提取 缴纳的土地相关费用 的数值（含单位，如万元、吨等）
  - name: 获得学时
    type: string
    description: 提取 获得学时 的文本值
  - name: 轮岗教师姓名
    type: string
    description: 提取 轮岗教师姓名 的文本值
  - name: 轮岗起止时间
    type: date
    description: 提取 轮岗起止时间 的日期值，格式 YYYY-MM-DD
  - name: 达标情况
    type: string
    description: 提取 达标情况 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 教师年度培训学时统计表（分城乡）.累计周期学时 < 360 || 校长培训达标情况台账.达标情况 = '否'
  description: 根据教师培训政策，每名教师（校长）每五年周期内累计培训学时须不少于360学时。统计表中任何教师累计学时不足360，或校长台账中任一人未达标，即判定违规。
  audit_item: 乡村教师技能培训不符合要求
  suspicion: 乡村教师校长未完成360学时培训任务
  regulation: "[\n  {\n    \"法规名称\": \"教育部关于大力加强中小学教师培训工作的意见\",\n    \"法规文号\": \"教师〔2011〕1号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"二、基本目标 （三）\",\n    \"内容概述\": \"每五年一个周期的教师培训累计学时不少于360学时，其中集中培训不少于160学时。\"\n  },\n  {\n    \"法规名称\":\
    \ \"国务院办公厅关于印发乡村教师支持计划（2015—2020年）的通知\",\n    \"法规文号\": \"国办发〔2015〕43号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三、（五）\"\
    ,\n  "
- expression: (实际轮岗教师人数 / 符合交流条件教师总数 < 规定比例) || (县镇至乡村轮岗教师人数 / 总轮岗人数 < 0.4) || (骨干教师轮岗占比 < 0.2) || (轮岗教师实际在岗率 < 0.8)
  description: 规定每年交流轮岗比例一般不低于10%，骨干教师占比不低于交流总数的20%，城镇至乡村轮岗比重应合理（如不低于40%），轮岗时间一般不少于一学年。若实际指标低于规定值的80%或关键指标未达标，即判定为执行不到位。在岗率低于80%视为挂名轮岗。
  audit_item: 乡村教师队伍建设不符合要求
  suspicion: 城乡教师交流轮岗制度执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于推进县（区）域内义务教育学校校长教师交流轮岗的意见\",\n    \"法规文号\": \"教师〔2014〕4号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四部分\",\n    \"内容概述\": \"城镇学校、优质学校每学年教师交流轮岗的比例不低于符合交流条件教师总数的10%，其中骨干教师交流轮岗应不低于交流总数的20%；校长教师交流轮岗一般不少于一学年。\"\
    \n  }\n]"
- expression: 实际获批用地性质 == '建设用地' && 资源化利用设施类型 in 国土部门批复的用地性质.政策规定的农业设施用地目录
  description: 若企业的粪污处理等资源化利用设施用地被自然资源部门批复为建设用地，但实际上该类设施属于国家政策规定的可按农业设施用地管理的范畴，则判定为变相增加企业用地成本。
  audit_item: 畜禽粪污资源化利用方面不符合相关规定
  suspicion: 养殖场资源化利用用地未按农业设施用地管理
  regulation: "[\n  {\n    \"法规名称\": \"自然资源部 农业农村部关于设施农业用地管理有关问题的通知\",\n    \"法规文号\": \"自然资规〔2019〕4号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"一、设施农业用地范围\",\n    \"内容概述\": \"畜禽养殖废弃物收集、存储、处理等环保设施用地属于设施农业用地，按农用地管理，不需办理建设用地审批手续。\"\n  }\n]"
- expression: 汇总表.实际执行电价 > 应执行农业用电标杆电价
  description: 将养殖企业的实际用电缴费单价与国家或地方价格主管部门发布的农业用电价格进行比对。若实际执行电价清晰高于应享受的农业电价（如按一般工商业电价收费），则判定为政策未落实。
  audit_item: 畜禽粪污资源化利用方面不符合相关规定
  suspicion: 养殖场未按规定享受农业用电价格优惠
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、销售电价分类适用范围\",\n    \"内容概述\": \"农业生产用电电价适用于蔬菜种植、畜禽养殖、水产养殖等农业设施用电。\"\n  }\n]"
- expression: （《监测标准与地方实际对比分析表》.本地监测对象占脱贫人口比例 - 周边同类地区均值）的绝对值 > 2% && （相关会议纪要 无 上级规模指导意见） &&  （《帮扶措施落实情况台账》 中 已帮扶户数 / 纳入对象户数
    < 60%）
  description: 该表达式综合判定规模合理性：1. 本地监测比例与周边同类地区均值偏离度大于2个百分点，视为异常；2. 若规模确定缺乏上级指导性文件或数据调研支撑，属人为硬性摊派；3. 辅助验证逻辑：若监测规模过大，往往伴随帮扶资源不足，已帮扶占比会显著偏低。以上三个条件同时成立时，触发严重违规疑点。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 人为设定监测对象规模脱离实际
  regulation: "[\n  {\n    \"法规名称\": \"关于健全防止返贫动态监测和帮扶机制的指导意见\",\n    \"法规文号\": \"中农发〔2021〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"二（二）\",\n    \"内容概述\": \"要综合考量收入支出、‘两不愁三保障’及饮水安全等因素，实事求是确定监测对象，不搞‘一刀切’，不盲目追求‘零风险’，也不随意扩大监测范围。\"\n  }\n\
    ]"
- expression: （《风险消除复核评估表》.稳定达标时长 < 6个月） || （《风险消除复核评估表》.家庭人均纯收入 < 当年监测标准基准线） || （《帮扶措施落实情况台账》 中 退出前最近3个月 无 任何帮扶记录） || （《风险消除评估审批文件》.审批日期
    早于 《帮扶台账》.最后帮扶日期）
  description: 判定标准：1. 收入达标等积极状态必须至少连续稳定6个月，不足则属于提前消险；2. 标注消除时点，其家庭人均纯收入仍低于省定防止返贫监测收入标准，一票否决；3. 按规定，风险消除前应有持续帮扶巩固期，若退出前3个月无任何帮扶痕迹，说明并非“稳定消除”，而是为甩包袱而放弃帮扶。4.
    审批流程逻辑倒置，表明评估审核是走过场。满足上述任一条件即为违规消除。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 风险未稳定消除即标注退出的“提前消险”
  regulation: "[\n  {\n    \"法规名称\": \"关于健全防止返贫动态监测和帮扶机制的指导意见\",\n    \"法规文号\": \"中农发〔2021〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"三（三）\",\n    \"内容概述\": \"对收入持续稳定、‘两不愁三保障’和饮水安全持续巩固、返贫致贫风险稳定消除的监测对象，标注‘风险消除’，不再按监测对象进行帮扶。对整户无劳动能力的监测对象，原则上暂不标注风险消除，长期跟踪监测。\"\
    \n  }\n]"
