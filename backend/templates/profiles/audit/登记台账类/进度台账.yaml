name: audit/登记台账类/进度台账
type: model
description: 从登记台账类类文档（进度台账）中提取结构化元数据。涵盖字段如：地块编号、成本、拿地时间。文档范围包括：开发进度台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 进度台账
  member_count: 1
  member_details:
  - 开发进度台账
output:
  fields:
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 成本
    type: string
    description: 提取 成本 的文本值
  - name: 拿地时间
    type: date
    description: 提取 拿地时间 的日期值，格式 YYYY-MM-DD
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ((中标文件.楼面价/数据.区域楼面均价) > 1.5) && (溢价率 > 100%)
  description: 溢价率=（成交总价-起始价）/起始价。当溢价率超过100%且成交楼面价超过同期同区域同类地块楼面均价1.5倍时，视为异常高价竞地。房地产主业国企参与此类竞拍，直接推高地价预期，助长房价，与国家去库存和稳地价政策相抵触。
  audit_item: 未按规定落实去库存政策措施
  suspicion: 房地产主业企业异常高价竞地推高房价
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步做好房地产市场调控工作有关问题的通知\",\n    \"法规文号\": \"国办发〔2011〕1号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"相关条文\",\n    \"内容概述\": \"要求加强土地出让管理，坚决防止出现高价地，对存在捂地、捂盘行为的房地产开发企业应暂停其土地竞买资格，确保房地产市场平稳健康发展。\"\n\
    \  }\n]"
