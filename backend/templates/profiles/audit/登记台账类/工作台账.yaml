name: audit/登记台账类/工作台账
type: model
description: 从登记台账类类文档（工作台账）中提取结构化元数据。涵盖字段如：检查内容、检查对象、检查时间、检查结果摘要。文档范围包括：监督检查工作台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 检查
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 工作台账
  member_count: 1
  member_details:
  - 监督检查工作台账
output:
  fields:
  - name: 检查内容
    type: string
    description: 提取 检查内容 的文本值
  - name: 检查对象
    type: string
    description: 提取 检查对象 的文本值
  - name: 检查时间
    type: date
    description: 提取 检查时间 的日期值，格式 YYYY-MM-DD
  - name: 检查结果摘要
    type: boolean
    description: 提取 检查结果摘要 的布尔值（是/否）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (工作台账.发现问题数量 < 监督检查工作部署记录.监督检查工作部署记录) || (工作台账.检查对象 / 工作台账.检查对象 < 0.9) || (落实清单.整改完成时间 - 落实清单.整改完成时间 > 30天)
    || (审批文件.合同金额 >= 100万 && 工作台账.检查结果摘要)
  description: 判定监督检查不到位：1.实际检查次数未达到本单位制度规定的年度检查频次；2.检查覆盖率低于90%（已检查单位数/应检查单位数<0.9），存在监督盲区；3.发现问题后整改超时，下达整改至完成时间差超过30天，整改拖沓；4.大额经济活动（≥100万）未纳入监督检查台账，存在监督缺失。以上条件满足任意一条即触发疑点。
  audit_item: 在经济活动中落实党风廉政建设责任方面存在的问题
  suspicion: 未严格实施党风廉政建设监督检查
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党党内监督条例\",\n    \"法规文号\": \"中发〔2016〕26号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"纪律检查机关必须把维护党的政治纪律和政治规矩放在首位，坚决纠正和查处上有政策、下有对策，有令不行、有禁不止，口是心非、阳奉阴违等行为。\"\n  },\n  {\n    \"\
    法规名称\": \"关于实行党风廉政建设责任制的规定\",\n    \"法规文号\": \"中发〔2010〕19号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第十九条\",\n    \"\
    内容概述\":"
