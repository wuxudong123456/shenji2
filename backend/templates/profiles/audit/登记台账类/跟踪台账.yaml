name: audit/登记台账类/跟踪台账
type: model
description: 从登记台账类类文档（跟踪台账）中提取结构化元数据。涵盖字段如：专家签名、产业引进完成情况、代建工程进度、办结日期、受理日期、因资金不足造成的烂尾或停业项目、地块编号、处理结果。文档范围包括：农民工投诉跟踪台账、农民工问题处理跟踪台账、改厕问题整改跟踪台账、项目审批流程跟踪台账、项目履行跟踪台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 工程
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 跟踪台账
  member_count: 1
  member_details:
  - 农民工投诉跟踪台账
  - 农民工问题处理跟踪台账
  - 改厕问题整改跟踪台账
  - 项目审批流程跟踪台账
  - 项目履行跟踪台账
output:
  fields:
  - name: 专家签名
    type: string
    description: 提取 专家签名 的文本值
  - name: 产业引进完成情况
    type: string
    description: 提取 产业引进完成情况 的文本值
  - name: 代建工程进度
    type: string
    description: 提取 代建工程进度 的文本值
  - name: 办结日期
    type: date
    description: 提取 办结日期 的日期值，格式 YYYY-MM-DD
  - name: 受理日期
    type: date
    description: 提取 受理日期 的日期值，格式 YYYY-MM-DD
  - name: 因资金不足造成的烂尾或停业项目
    type: string
    description: 提取 因资金不足造成的烂尾或停业项目 的文本值
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 处理结果
    type: boolean
    description: 提取 处理结果 的布尔值（是/否）
  - name: 投诉编号
    type: string
    description: 提取 投诉编号 的文本值
  - name: 评审日期
    type: date
    description: 提取 评审日期 的日期值，格式 YYYY-MM-DD
  - name: 评审结论
    type: string
    description: 提取 评审结论 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 对比表.违规类型 == '违规产业配套' && (出让合同.附加产业配套条款 == '无偿代建内容' > 0.3 * 清单表.出让起始价 || 出让合同.合同条款 == '附加产业配套条款') && (出让合同.地块编号
    == '受让人'.地块编号 < 3)
  description: 住宅或商服用地上强制要求无偿代建大型公共设施或引进世界500强总部等，若代建成本超过土地起始价的30%或产业要求明显超出地块辐射能力且无合理政策依据，导致报名少于3家，则构成利用附加条件限制竞争。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 违规设置产业配套要求
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让公告不得设定影响公平竞争的限制条件，附加不合理产业配套要求实质上提高了进入门槛。\"\n  },\n  {\n    \"法规名称\": \"节约集约利用土地规定\"\
    ,\n    \"法规文号\": \"国土资源部令第61号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"不得以招商引资等名义先行圈占土地，不得违背公平竞"
- expression: 各区域任务量.县级任务量 > 各区域任务量.省级任务量 * 1.1 OR (各区域任务量.县级任务量 * 各级财政配套资金总额.各级财政配套资金总额 > 各级财政配套资金总额.各级财政配套资金总额 * 1.2)
  description: 县级分解任务量超出省级下达任务量的10%以上，或推算所需资金显著超过可到位资金120%，反映任务加码且脱离财力实际。
  audit_item: 厕所改造规划设计等不符合规定
  suspicion: 改厕任务层层加码脱离实际
  regulation: "[\n  {\n    \"法规名称\": \"农村人居环境整治提升五年行动方案（2021－2025年）\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"政策性文件\",\n \
    \   \"条款号\": \"第四部分（四）\",\n    \"内容概述\": \"要求不搞层层加码，不盲目下指标、定时限，确保目标任务切合实际，并保障资金有效投入。\"\n  }\n]"
- expression: (记录留痕类-发放记录-工人姓名、应发日期、实发日期、应发金额、实发金额、缴款单位/个人名称、金额中同一工人连续2个月无发放记录) || (跟踪台账.办结日期 - 受理日期 > 30 天) || (其他杂项类-其他-投诉日期、被投诉单位、拖欠金额.处理状态
    = ‘未解决’ AND 拖欠天数 > 60)
  description: 工资发放记录出现连续2个月及以上断发，或投诉处理周期超过30个自然日，或欠薪问题超过60天仍未解决，均构成长效治理机制缺位。
  audit_item: 新型职业农民培育、农民工技能提升和返乡创业就业不符合相关规定
  suspicion: 拖欠农民工工资且投诉处理机制失效
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三条、第十六条、第四十二条\",\n    \"内容概述\": \"农民工有按时足额获得工资的权利，任何单位和个人不得拖欠农民工工资。用人单位应当按照与农民工书面约定或依法制定的规章制度规定的工资支付周期和具体支付日期足额支付工资。政府部门接到拖欠农民工工资的举报投诉，应当及时依法处理。\"\
    \n  }\n]"
- expression: (省级农田建设评审专家库设立文件 IS NULL) || (专家库成员资质核查表.非相关专业人数 > 专家库总人数 * 0.3) || (项目审批流程跟踪台账 EXISTS WHERE 专家签名 IS NULL AND
    项目投资额 > 规定限额)
  description: 专家库未正式设立，或库中非水利、农业、林业等相关专业成员占比超过30%，或达到限额以上项目无专家评审签名记录，均判定为评审机制不健全或流于形式；限额参照地方通常为500万元及以上项目。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 未建立省级农田建设评审专家库或评审不严格
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"省级农业农村部门负责建立省级农田建设项目评审专家库，专家库成员应具有相关专业高级技术职称，并实行专家回避等制度，确保评审质量。\"\n  }\n]"
