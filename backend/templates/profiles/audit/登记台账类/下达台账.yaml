name: audit/登记台账类/下达台账
type: model
description: 从登记台账类类文档（下达台账）中提取结构化元数据。涵盖字段如：收款单位名称、收款单位行政隶属关系、收款单位账户。文档范围包括：预算指标下达台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 下达台账
  member_count: 1
  member_details:
  - 预算指标下达台账
output:
  fields:
  - name: 收款单位名称
    type: number
    description: 提取 收款单位名称 的数值（含单位，如万元、吨等）
  - name: 收款单位行政隶属关系
    type: number
    description: 提取 收款单位行政隶属关系 的数值（含单位，如万元、吨等）
  - name: 收款单位账户
    type: number
    description: 提取 收款单位账户 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 部门预算汇总表.单位编码 NOT IN (机构编制文件.授权管理单位编码集合) && 部门预算汇总表.资金总额 > 0
  description: 筛选部门预算中列示但不在本部门三定方案授权管理范围内的单位，且确已安排预算资金，即视为将非所属预算单位纳入预算的违规行为。
  audit_item: 预算编制不规范
  suspicion: 将非所属预算单位纳入部门预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十三条\"\
    ,\n    \"内容概述\": \"各部门编制本部门预算、决算草案，组织和监督本部门预算的执行。部门预算由本部门及其所属各单位预算组成，不得将非所属单位纳入预算。\"\n  }\n]"
- expression: (补助地方支出明细表.拨款对象行政隶属关系 = '地方' || 项目名称 LIKE '%补助%') && 预算类别 = '部门预算' && 未列入转移支付预算
  description: 在部门预算支出项目中，收款方为地方政府或项目名称含有补助性质关键词，且该项目未经过转移支付审批程序，判定为违规安排补助地方支出。
  audit_item: 预算编制不规范
  suspicion: 部门预算中违规安排补助地方支出
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\"\
    ,\n    \"内容概述\": \"财政转移支付应当规范、公平、公开。在部门预算中不得直接安排对地方的补助支出，应当通过规范化的转移支付预算处理。\"\n  }\n]"
