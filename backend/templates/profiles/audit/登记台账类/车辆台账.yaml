name: audit/登记台账类/车辆台账
type: model
description: 从登记台账类类文档（车辆台账）中提取结构化元数据。涵盖字段如：使用状态、入账日期、权属单位、来源说明、车辆编号。文档范围包括：资产管理部门车辆台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 车辆
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 车辆台账
  member_count: 1
  member_details:
  - 资产管理部门车辆台账
output:
  fields:
  - name: 使用状态
    type: boolean
    description: 提取 使用状态 的布尔值（是/否）
  - name: 入账日期
    type: date
    description: 提取 入账日期 的日期值，格式 YYYY-MM-DD
  - name: 权属单位
    type: string
    description: 提取 权属单位 的文本值
  - name: 来源说明
    type: string
    description: 提取 来源说明 的文本值
  - name: 车辆编号
    type: string
    description: 提取 车辆编号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: COUNT(登记清单.车牌号) > 核定编制数.核定编制数 || (登记清单.价格 > 标准.价格上限 && 记录表.是否特批 != '是') || (登记清单.排量 > 标准.排量上限 && 记录表.是否特批 !=
    '是')
  description: 实有车辆数超过核定编制数即违规；车辆单价或排量超出当地规定上限，且无合规特批手续的，判定为超标准配备。
  audit_item: 违规配备公务用车
  suspicion: 超编制超标准配备公务用车
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条、第九条、第十条\",\n    \"内容概述\": \"公务用车编制根据机构设置和人员编制确定，不得超编制配备；公务用车配备标准由省级主管部门制定，党政机关不得超标准配备；确因特殊情况需超标准配备的，须报省级公务用车主管部门审批。\"\
    \n  }\n]"
- expression: (车辆原所属机构、处置方式、接收单位、交接日期.处置方式 = '转交国内单位' AND 车辆原所属机构、处置方式、接收单位、交接日期.接收单位 NOT IN (规定的上交接收单位列表)) OR (车牌号、车辆来源（是否退役转籍）、当前使用部门、车辆型号、价格、排量、购置日期、使用部门、车辆类型（越野车标识）、车辆来源（国产/进口）、采购方式、名义权属单位、实际使用部门、车辆购置日期、车辆状态.车辆来源（是否退役转籍）
    = '退役车辆' AND 入账日期、来源说明、车辆编号、使用状态、权属单位.来源说明 LIKE '%捐赠%' AND NOT EXISTS (车辆原所属机构、处置方式、接收单位、
  description: 退役车辆未按规定上交而违规转给关联单位，或通过虚假捐赠、改装等方式变相继续使用进口车，均构成变相违规。
  audit_item: 违规配备公务用车
  suspicion: 变相进口或未上交退役车辆
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"党政机关应当按规定对公务用车进行报废、更新和处置；国外机构退役车辆应按规定上交或处置，不得擅自留用或转移给关联单位。\"\n  }\n]"
