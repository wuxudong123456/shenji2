name: audit/登记台账类/缴款台账
type: model
description: 从登记台账类类文档（缴款台账）中提取结构化元数据。涵盖字段如：缴款日期、缴款金额、缴款项目、非税收入票据号。文档范围包括：财政非税收入缴款台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 缴款台账
  member_count: 1
  member_details:
  - 财政非税收入缴款台账
output:
  fields:
  - name: 缴款日期
    type: date
    description: 提取 缴款日期 的日期值，格式 YYYY-MM-DD
  - name: 缴款金额
    type: number
    description: 提取 缴款金额 的数值（含单位，如万元、吨等）
  - name: 缴款项目
    type: number
    description: 提取 缴款项目 的数值（含单位，如万元、吨等）
  - name: 非税收入票据号
    type: number
    description: 提取 非税收入票据号 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ABS(收费项目.收入金额 - 缴款台账.缴款金额) > 10000 && (收费项目.收费项目 NOT IN ('代收教材费','工本费'))
  description: 按鉴定收费项目分组汇总实际收取金额，与财政非税系统缴款台账的缴入金额比对。差额绝对值大于1万元（结合被审计单位规模设定）且排除合理代收代付项目后，即揭示可能存在截留、坐支、转移收费资金的问题。
  audit_item: 职业资格鉴定政策执行不到位
  suspicion: 职业资格鉴定收费未按规定上缴财政专户
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条、第二十条\",\n    \"内容概述\": \"非税收入应当依照法律、法规规定或者按照管理权限确定的收入归属和缴库要求，全额上缴国库或者财政专户，任何部门、单位和个人不得截留、占用、挪用、坐支或者拖欠。\"\n  },\n\
    \  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\",\n\
    \    \""
