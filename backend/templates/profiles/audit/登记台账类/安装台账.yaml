name: audit/登记台账类/安装台账
type: model
description: 从登记台账类类文档（安装台账）中提取结构化元数据。涵盖字段如：安装完成日期、实际完成改造户数、用户地址、用户身份证号、设备型号、设备序列号、详细地址。文档范围包括：清洁取暖设备安装台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 安装台账
  member_count: 1
  member_details:
  - 清洁取暖设备安装台账
output:
  fields:
  - name: 安装完成日期
    type: date
    description: 提取 安装完成日期 的日期值，格式 YYYY-MM-DD
  - name: 实际完成改造户数
    type: string
    description: 提取 实际完成改造户数 的文本值
  - name: 用户地址
    type: string
    description: 提取 用户地址 的文本值
  - name: 用户身份证号
    type: string
    description: 提取 用户身份证号 的文本值
  - name: 设备型号
    type: string
    description: 提取 设备型号 的文本值
  - name: 设备序列号
    type: string
    description: 提取 设备序列号 的文本值
  - name: 详细地址
    type: string
    description: 提取 详细地址 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
