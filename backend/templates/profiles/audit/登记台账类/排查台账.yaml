name: audit/登记台账类/排查台账
type: model
description: 从登记台账类类文档（排查台账）中提取结构化元数据。涵盖字段如：占用性质、占用状态、占用者、占用面积、排查日期。文档范围包括：村级文化室占用情况排查台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 排查台账
  member_count: 1
  member_details:
  - 村级文化室占用情况排查台账
output:
  fields:
  - name: 占用性质
    type: string
    description: 提取 占用性质 的文本值
  - name: 占用状态
    type: boolean
    description: 提取 占用状态 的布尔值（是/否）
  - name: 占用者
    type: string
    description: 提取 占用者 的文本值
  - name: 占用面积
    type: string
    description: 提取 占用面积 的文本值
  - name: 排查日期
    type: date
    description: 提取 排查日期 的日期值，格式 YYYY-MM-DD
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (排查台账.占用状态 = '非文化用途占用' && 排查台账.占用性质 != '临时借用且经审批') || (使用日期、使用行为描述、申请人/单位.使用行为描述 NOT IN ('图书阅览','文化活动','培训讲座','群众文体活动')
    && 使用日期、使用行为描述、申请人/单位.使用行为描述 IS NOT NULL) || (影像资料.实际用途照片 显示非文化功能使用)
  description: 排查台账明确记录为被非文化用途占用，且非经审批的临时借用即触发；或者使用登记表连续出现非文化类活动记录；或者现场影像显示堆放杂物、改为办公用房等情形均视为占用。
  audit_item: 文化馆（站）等建设运营管护不合规
  suspicion: 村级文化室及设施被违规占用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公共文化服务保障法\",\n    \"法规文号\": \"主席令第六十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"任何单位和个人不得擅自拆除公共文化设施，不得擅自改变公共文化设施的功能、用途或者妨碍其正常运行。\"\n  },\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\"\
    ,\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"文化站应确保业务用房使用面积和正常开放，不得挤占、挪作"
