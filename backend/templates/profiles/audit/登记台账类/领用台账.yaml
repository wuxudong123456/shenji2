name: audit/登记台账类/领用台账
type: model
description: 从登记台账类类文档（领用台账）中提取结构化元数据。涵盖字段如：数量、用途、领用人、领用日期、食材名称。文档范围包括：领用台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 领用台账
  member_count: 1
  member_details:
  - 领用台账
output:
  fields:
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 用途
    type: string
    description: 提取 用途 的文本值
  - name: 领用人
    type: string
    description: 提取 领用人 的文本值
  - name: 领用日期
    type: date
    description: 提取 领用日期 的日期值，格式 YYYY-MM-DD
  - name: 食材名称
    type: string
    description: 提取 食材名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (食堂采购清单.食材名称 IN ('海参','燕窝','鲍鱼','高档海鲜','高档茶叶') && 食堂采购清单.单价 > 食材价格对比分析表.市场同期均价 * 1.5) || (食材价格对比分析表.差异率 > 0.5)
    || (领用台账.领用人 NOT IN 食堂工作人员清单 && 领用台账.用途 != '员工正常餐饮') || (食堂采购清单.食材名称 LIKE '%生鲜食材%' && 单价异常高)
  description: 筛查食堂采购的高档食材且价格显著高于市场价，或领用记录显示领导个人领用，或采购品名刻意模糊但单价过高。设定价格偏差超过50%或直接购入高档食材即触发异常，需追溯实际使用去向。
  audit_item: 其他违反中央八项规定及其实施细则精神问题
  suspicion: 食堂高价采购高档食材用于隐性公款吃喝
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第十三条、第十四条\",\n    \"内容概述\": \"严禁用公款大吃大喝或安排与公务无关的宴请；不得提供高档菜肴和用野生保护动物制作的菜肴，不得提供高档烟酒。\"\n  }\n]"
