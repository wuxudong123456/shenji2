name: audit/登记台账类/流水台账
type: model
description: 从登记台账类类文档（流水台账）中提取结构化元数据。涵盖字段如：专户收支明细、交易日期、交易时间、交易金额、付款摘要、入账金额、对方户名、对方账号。文档范围包括：工资保证金专户资金流水台账、贷款账户资金流水台账、资本金专户银行流水台账、项目单位银行流水台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 付款
- 明细
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 流水台账
  member_count: 1
  member_details:
  - 工资保证金专户资金流水台账
  - 贷款账户资金流水台账
  - 资本金专户银行流水台账
  - 项目单位银行流水台账
output:
  fields:
  - name: 专户收支明细
    type: string
    description: 提取 专户收支明细 的文本值
  - name: 交易日期
    type: date
    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 交易时间
    type: date
    description: 提取 交易时间 的日期值，格式 YYYY-MM-DD
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款摘要
    type: number
    description: 提取 付款摘要 的数值（含单位，如万元、吨等）
  - name: 入账金额
    type: number
    description: 提取 入账金额 的数值（含单位，如万元、吨等）
  - name: 对方户名
    type: string
    description: 提取 对方户名 的文本值
  - name: 对方账号
    type: string
    description: 提取 对方账号 的文本值
  - name: 对方账户
    type: string
    description: 提取 对方账户 的文本值
  - name: 对方账户名称
    type: string
    description: 提取 对方账户名称 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 资金实际入账日期
    type: date
    description: 提取 资金实际入账日期 的日期值，格式 YYYY-MM-DD
  - name: 资金流向摘要
    type: string
    description: 提取 资金流向摘要 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 银行余额
    type: number
    description: 提取 银行余额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (项目资本金到位情况表.实际到位时间 > 资本金到位计划文件.计划到位时间节点) || (项目资本金到位情况表.实际到位金额 < 资本金到位计划文件.计划到位金额)
  description: 比较资本金实际到位的时间与金额是否满足计划要求。任一不满足（时间滞后或金额不足）均判定为违规。这反映了出资方未履行出资协议约定。
  audit_item: 项目资本金不符合要求
  suspicion: 资本金未按计划进度和数额到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"中华人民共和国主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"股东应当按期足额缴纳公司章程中规定的各自所认缴的出资额。\"\n  }\n]"
- expression: (资本金专户银行流水台账.对方户名 IN 关联方清单.关联方名称 && 资本金专户银行流水台账.摘要 NOT_LIKE '%工程款%' && 资本金专户银行流水台账.摘要 NOT_LIKE '%设备款%' && 资本金专户银行流水台账.交易金额
    > 项目资本金总额的 0.05) && (贷方科目 IN ('实收资本', '资本公积'))
  description: 资金在作为资本金进入项目公司（计入实收资本/资本公积）后，又以无真实业务背景的名义大额转出至股东或关联方。表达式设定大额标准为单笔或累计超过资本金总额的5%。摘要非工程、设备等正常款项是辅助判断条件。
  audit_item: 项目资本金不符合要求
  suspicion: 以各种形式抽逃、抽走项目资本金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"中华人民共和国主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十五条\",\n    \"内容概述\": \"公司成立后，股东不得抽逃出资。\"\n  }\n]"
- expression: (明细表.支出收款方 NOT IN (批复文件.建设内容)) || (明细表.用途说明 NOT LIKE '%安居工程%' && 明细表.用途说明 NOT LIKE '%棚改%' && 明细表.用途说明 NOT LIKE
    '%保障房%') || (明细表.支出日期 < 匹配表.实际已付款) || (对比表.偏差率 ABS > 0.3 && 对比表.预算科目 NOT IN ('不可预见费','材料价差'))
  description: 判定规则：1)贷款资金收款单位不在项目批复或合同约定的参建单位清单中，疑为挪用；2)资金用途摘要与保障房建设关键词（安居工程、棚改、保障房）均不相关；3)支付日期早于合同约定应付日期，可能存在超前支付挪用；4)实际支出超出预算30%以上且非合理科目，疑为虚列成本挪用。以上条件满足任一即触发高风险疑点。
  audit_item: 挪用或违规使用保障性安居工程银行贷款或住房公积金项目贷款
  suspicion: 商业银行保障房贷款资金挪用
  regulation: "[\n  {\n    \"法规名称\": \"固定资产贷款管理暂行办法\",\n    \"法规文号\": \"中国银行业监督管理委员会令2009年第2号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三十八条\",\n    \"内容概述\": \"贷款人应与借款人约定明确、合法的贷款用途，并按照约定检查、监督贷款的使用情况，防止贷款被挪用。\"\n  },\n  {\n    \"法规名称\":\
    \ \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三（六）\",\n \
    \   \"内容概述\""
- expression: (支出明细表.收款单位 NOT IN (项目立项批复文件.建设内容)) && (支出明细表.支出类别 IN ('市政道路','工资发放','偿还旧债') ) || (支出明细表.金额 > 1000000 && 支出明细表.用途说明
    NOT LIKE '%棚改%' && 支出明细表.用途说明 NOT LIKE '%保障房%') && (匹配表.累计支付比例 - 匹配表.实际工程进度 > 0.2)
  description: 判定规则：1)收款方非参建名录且支出类别为市政道路、工资、还债等非工程支出，直接判为挪用；2)单笔大于100万元的支付，用途与棚改或保障房不相关，且资金支付比例高于工程进度20个百分点以上，表明资金已拨付但工程严重滞后，存在截留挪用。满足任一条件触发高风险。
  audit_item: 挪用或违规使用保障性安居工程银行贷款或住房公积金项目贷款
  suspicion: 政策性银行贷款挪用于非保障房项目
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三（六）\",\n    \"内容概述\": \"对保障性安居工程贷款实行封闭管理、专款专用，严禁截留、挤占、挪用。\"\n  },\n  {\n    \"法规名称\": \"国家发展改革委关于印发《中央预算内投资保障性安居工程专项管理暂行办法》的通知\"\
    ,\n    \"法规文号\": \"发改投资规〔2019〕1098号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    "
