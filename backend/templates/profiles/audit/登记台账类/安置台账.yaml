name: audit/登记台账类/安置台账
type: model
description: 从登记台账类类文档（安置台账）中提取结构化元数据。涵盖字段如：身份证号。文档范围包括：搬迁安置台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 安置台账
  member_count: 1
  member_details:
  - 搬迁安置台账
output:
  fields:
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (渔民名单.年龄 >= 60 && 情况表.养老保险参保状态 IS NULL) || (情况表.医疗保险参保状态 IS NULL) || (渔民名单.家庭收入 < 当地低保标准 && 情况表.低保享受状态 IS NULL)
    || (安置台账.危房鉴定等级 IN ('C','D') && 安置台账.改造申请状态 IS NULL)
  description: 基于退捕渔民名单（表1）左连接社保落实情况表（表2）和危房改造台账（表3），筛选出：年龄60岁以上但无养老保险记录、或无医疗保险记录、或家庭收入低于当地低保标准但未享受低保、或住房鉴定为C/D级危房但无改造完成记录的人员，均属于应享未享违规。其中低保标准参照政策公布线。
  audit_item: 退捕渔民转产安置不合规
  suspicion: 退捕渔民未按规定享受社会保障及危房改造政策
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"要求做好退捕渔民社会保障工作，确保退捕渔民按规定参加基本养老保险、基本医疗保险，将符合条件的困难渔民纳入低保和住房保障。\"\n  }\n]"
