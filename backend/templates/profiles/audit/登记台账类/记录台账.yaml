name: audit/登记台账类/记录台账
type: model
description: 从登记台账类类文档（记录台账）中提取结构化元数据。涵盖字段如：下次检查日期、公示内容完整性、公示地点、公示场次内容、公示方式、公示日期、关联审批单号、农户姓名。文档范围包括：供电服务投诉处理记录台账、停电事件记录台账、公益放映公示记录台账、农户分红发放记录台账、学籍管理系统异动记录台账、投诉记录台账、投资计划调整记录台账、消防器材维护检查记录台账、禁捕区域巡查记录台账、草原监管巡查记录台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 审批
- 检查
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 记录台账
  member_count: 1
  member_details:
  - 供电服务投诉处理记录台账
  - 停电事件记录台账
  - 公益放映公示记录台账
  - 农户分红发放记录台账
  - 学籍管理系统异动记录台账
  - 投诉记录台账
  - 投资计划调整记录台账
  - 消防器材维护检查记录台账
  - 禁捕区域巡查记录台账
  - 草原监管巡查记录台账
  - 规划公示记录台账
