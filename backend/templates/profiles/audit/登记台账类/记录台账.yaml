violations:
- expression: (村庄规划编制批复文件.批复日期 - 村庄规划公示材料.公示起止日期 < 30天) || (村民会议或村民代表会议记录.规划讨论内容 == null) || (规划公示记录台账.处理率 == 0) || (村庄规划公示材料.照片时间戳
    == true)
  description: 公示期不足30日、会议记录缺失规划讨论、公示反馈意见处理率为0、公示照片存在篡改或时间戳异常，满足任一条件即判定程序违规。公示期<30天为最常见违规触发条件。
  audit_item: 不符合村庄规划编制要求
  suspicion: 村庄规划公示及村民参与程序缺失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十六条\",\n    \"内容概述\": \"城乡规划报送审批前，组织编制机关应当依法将城乡规划草案予以公告，并采取论证会、听证会或者其他方式征求专家和公众的意见。公告的时间不得少于三十日。\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国村民委员会组织法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十四条\",\n    \"内容概述\"\
    : \"涉及"
- expression: (渔船登记注销明细表.已封存渔船数量 / 渔船登记注销明细表.渔船总登记数 * 100 < 100) && (DATEDIFF(CURRENT_DATE, 捕捞渔船封存管理实施细则.渔船封存截止日期, 'day')
    > 0)
  description: 在封存管理实施细则规定的截止日期后，若已封存渔船数量未达到登记总数100%，即判定为未按时完成。表达式未设定宽限期，因渔船封存是禁捕生效的基本前提，必须按时完成。
  audit_item: 任务目标未按时完成
  suspicion: 未按时完成捕捞渔船全部封存
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分“实施重点水域禁捕”\",\n    \"内容概述\": \"要求科学划定禁捕区域，加快渔船退捕和封存处置，确保如期实现禁捕。\"\n  }\n]"
- expression: (执法人员资质审核备案表.实际在岗人数 < 专业执法队伍建设专项方案.编制人数 * 0.8) || (执法人员资质审核备案表.持执法证人数 / 执法人员资质审核备案表.实际在岗人数 < 1) || (执法装备采购验收单据.验收合格率
    < 1) && (DATEDIFF(CURRENT_DATE, 专业执法队伍建设专项方案.建成截止日期, 'day') > 30)
  description: 执法队伍建成标志为：在岗人数达到编制数80%以上、全部在岗人员持证上岗、装备采购到位率100%。三项任一未达标且在方案规定截止日期后超过30天仍不满足，即判定为未按时建成。编制数空缺率超过20%或存在无证人员执法为严重违规。
  audit_item: 任务目标未按时完成
  suspicion: 未按时建成专业执法队伍
  regulation: "[\n  {\n    \"法规名称\": \"关于深化农业综合行政执法改革的指导意见\",\n    \"法规文号\": \"中办发〔2018〕61号\",\n    \"效力级别\": \"制度文件\",\n\
    \    \"条款号\": \"第二部分“建强执法队伍”\",\n    \"内容概述\": \"要求各地按照核定编制配齐执法人员，严格实行持证上岗和资格管理制度，配备必要的执法装备，确保综合执法能力满足履职需要。\"\n  }\n]"
- expression: NVL(渔船登记注销明细表.已封存数量, 0) / 捕捞渔船封存管理实施细则.应封存渔船总数 < 1.0 && SYSDATE > 分阶段禁捕目标的时间节点安排表.封存完成截止日期 && 延期申请或未完成情况说明文件.有效延期批复
    IS NULL
  description: 截至规定截止日期，实际封存渔船数量未达到应封存总数，且无有效延期审批，即构成未按时完成封存。封存率低于90%或存在虚假封存（如GPS坐标重复、AIS轨迹移动）视为严重违规。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 未按时完成捕捞渔船全部封存
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农办渔〔2020〕8号\"\
    ,\n    \"效力级别\": \"部门规范性文件\",\n    \"条款号\": \"无明确条款\",\n    \"内容概述\": \"要求各地按照“一船一策”原则，限期完成捕捞渔船的回收拆解、封存或转用，严禁渔船在禁捕水域作业。\"\
    \n  }\n]"
- expression: (机构名称.有效期至 < 当前日期) || (机构名称.压力表状态 = '失效' || '无记录') || (检查日期.复查结果 = '未整改' && 限期整改日期 < 当前日期) || (抽检记录.压力表指针位置不在绿区
    或 应急灯功能状态 = '应急灯不亮') || (机构名称.检查日期距当前 > 30天 且 无合理说明)
  description: 条件一：器材已过有效期；条件二：台账记录显示器材失效或无检查记录；条件三：消防部门下达的整改通知超期未闭环；条件四：现场抽检发现器材功能失效；条件五：未按规定频率（如每月一次）进行维护检查。满足任一视为消防安全隐患疑点。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 消防器材过期或失效存在安全隐患
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国消防法\",\n    \"法规文号\": \"主席令第81号（2021年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十六条、第二十八条\",\n    \"内容概述\": \"单位应当按照国家标准、行业标准配置消防设施、器材，设置消防安全标志，并定期组织检验、维修，确保完好有效；任何单位、个人不得损坏、挪用或者擅自拆除、停用消防设施、器材。\"\
    \n  }\n]"
- expression: (＜验收报告.验收结论＞ != '合格') || (＜程量清单.实际完成抗灾改造点的设计参数（杆塔防风等级、地下电缆占比、配电房抗洪标高）＞ < ＜标准.所在地区设防标准要求（如基本风速≥35m/s、配电房地面高程高于百年一遇洪水位）＞)
    || (＜程量清单.实际完成抗灾改造点的设计参数（杆塔防风等级、地下电缆占比、配电房抗洪标高）＞ < ＜标准.所在地区设防标准要求（如基本风速≥35m/s、配电房地面高程高于百年一遇洪水位）＞) || (＜记录台账.近三年因自然灾害导致的停电次数与损失负荷＞
    > 1.5 * 相邻县平均值)
  description: 验收报告有不合格分项、抗灾改造后的设施参数不满足国家或行业技术标准，或该地区因灾停电次数明显高于类似气象条件的相邻区域（1.5倍以上），均判定为抗灾能力不达标。
  audit_item: 农村电网巩固提升工程存在短板
  suspicion: 农村电网抗灾防御能力不达标
  regulation: "[\n  {\n    \"法规名称\": \"配电网防灾技术导则\",\n    \"法规文号\": \"DL/T 5729-2016\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"全文\",\n    \"内容概述\": \"规定了配电网防风、防洪、防雷等防灾技术措施和最低设防标准，要求新建和改造工程严格执行。\"\n  }\n]"
- expression: ( <近三年因自然灾害导致的停电次数与损失负荷.抢修人员到场时间> - <近三年因自然灾害导致的停电次数与损失负荷.故障报修接报时间> > <承诺故障响应时间（如农村≤45分钟）.承诺故障响应时间（如农村≤45分钟）>
    ) || ( ( <计划停电时间及实际通知时间.计划停电时间及实际通知时间> / <计划停电时间及实际通知时间.计划停电时间及实际通知时间> ) > 0.05 ) || ( <投诉类型、重复投诉次数、同区域集中投诉情况、投诉内容、涉及区域、核实情况.重复投诉次数>
    >= 3 )
  description: 任何一次故障抢修的到场时间超过承诺标准，或者计划停电未提前通知的比例超过5%，或者同一区域、同一类型问题被用户重复投诉3次及以上，即视为未实现稳定可靠的供电服务。
  audit_item: 农村电网巩固提升工程存在短板
  suspicion: 供电服务承诺未有效落实
  regulation: "[\n  {\n    \"法规名称\": \"供电监管办法\",\n    \"法规文号\": \"国家电力监管委员会令第27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十四条、第十五条\",\n    \"内容概述\": \"要求供电企业履行供电服务承诺，及时抢修，并按规定提前公告计划停电，保障用户知情权。\"\n  }\n]"
- expression: ((统计表.申请用电容量（kVA） - 统计表.实际批复用电容量（kVA）) / 统计表.申请用电容量（kVA） > 0.10) && (监测表.电压合格率（%） < 95 || 数据表.变压器负载率（%） > 80)
  description: 当农业加工企业申请用电容量缺口率超过10%，且所在区域供电可靠性监测连续3个月电压合格率低于95%，或变压器负载率长期超过80%时，触发疑点。缺口率阈值10%根据一般需求保障偏差设定；电压合格率95%及变压器负载率80%为行业普遍公认的供电质量与安全边界。
  audit_item: 农村配套供电设施建设不到位
  suspicion: 农业生产电气化供电需求保障不到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电力法\",\n    \"法规文号\": \"主席令第60号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十八条\"\
    ,\n    \"内容概述\": \"供电企业应当保证供给用户的供电质量符合国家标准。对公用供电设施引起的供电质量问题，应当及时处理。\"\n  }\n]"
- expression: (园区名称、规划双回路电源要求、计划竣工时间、实际投运时间.实际投运时间 - 园区名称、规划双回路电源要求、计划竣工时间、实际投运时间.计划竣工时间 > 90天) || (区域、电压合格率（%）、停电频率（次/年）、园区所在区域、平均停电持续时间（小时/次）.停电频率（次/年）
    > 5次/年 && 故障地点、故障类型、报修时间、修复时间.修复时间 > 4小时) || 园区配电变压器负载率（%）、进线电压偏差（%）、监测点、变压器负载率（%）、峰值负荷（kW）、农田排灌变压器编号、负载率（%）、投运时间、机井变压器负载率（%）、电流值（A）.进线电压偏差（%）
    > 7%
  description: 工业园区供电配套迟于计划竣工时间90天以上视为建设滞后；年停电频率超过5次且平均抢修修复时间超过4小时，表明运行维护不到位；进线电压偏差超过国家标准±7%视为供电质量不合格。以上任一条件满足即触发疑点。
  audit_item: 农村配套供电设施建设不到位
  suspicion: 农村工业园区及新基建供电配套服务不到位
  regulation: "[\n  {\n    \"法规名称\": \"供电监管办法\",\n    \"法规文号\": \"国家电力监管委员会令第27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"供电企业应当按照法律、行政法规和规章的规定，向用户提供质量合格、安全可靠的电力，并按照国家规定的电能质量标准供电。\"\n  }\n]"
- expression: (调整记录台账.调整金额 IS NOT NULL AND ABS(调整记录台账.调整金额) > 0) && (审批记录.审批单号 IS NULL || 审批记录.审批层级 != 管理制度文件.调整审批权限)
  description: 筛选出所有发生了金额或用途调整的计划，若调整记录无对应的审批单号（即未经审批），或审批层级低于制度规定的权限（如大规模调整未经发改委审批），则判定为随意调整。调整幅度超过原计划金额20%且无有效审批的，视为严重违规。
  audit_item: 投资计划分解下达不合规
  suspicion: 未经审批擅自调整已下达投资计划
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当严格执行，任何单位和个人不得擅自变更。确需调整的，应当按照规定的权限和程序审批，并报原审批部门备案。\"\n  }\n]"
- expression: 记录台账.应发金额 - 记录台账.实发金额 > 0 && 当前日期 > 分红条款.支付截止日期
  description: 将协议约定的应发分红与台账及银行流水实际支付进行比对，到期后未足额支付的，即构成未兑现分红。零支付差异为零容忍。
  audit_item: 新型经营主体设立和发展不符合相关规定
  suspicion: 未按协议兑现农户分红
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第57号（2017年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第四十四条\",\n    \"内容概述\": \"可分配盈余主要按照成员与本社的交易量（额）比例返还，合作社应依法依约向成员分配盈余。\"\n  }\n]"
- expression: COUNT(记录表.申报场次编号) - COUNT(回执单.回执场次编号 WHERE 回执单.签字真实性核实结果='真实' AND 回执单.回执场次编号 IS NOT NULL) > 0
  description: 申报的放映场次数量减去经回执签字与村民电话回访核实确认真实放映的场次数量，差异大于0即怀疑虚报。若差异超过10%且涉及金额较大（如超2万元），则视为严重违规。表达式依赖回执签字与村民抽样核实结果。
  audit_item: 送戏曲（电影）下乡等活动开展不符合相关规定
  suspicion: 虚报场次套取财政补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员违反规定骗取财政资金，依据有关法律、法规的规定处理、处罚。\"\n  },\n  {\n    \"法规名称\": \"中央补助地方公共文化服务体系建设专项资金管理暂行办法\"\
    ,\n    \"法规文号\": \"财教〔2015〕423号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"专项资金不得用于与公共文化服务无关的"
- expression: （公示制度.公示制度缺失）||（公示制度.回执审核制度缺失）||（公示制度.奖励制度缺失）||（公示制度.社会监督举报制度是否涵盖缺失）
  description: 检查制度文件清单中是否包含公益放映公示制度、放映回执审核制度、放映单位奖励制度、社会监督及举报制度等四项核心制度。任意一项书面制度缺失即构成疑点。
  audit_item: 送戏曲（电影）下乡等活动开展不符合相关规定
  suspicion: 未建立公益放映管理所必需的四项制度
  regulation: "[\n  {\n    \"法规名称\": \"农村电影公益放映场次补贴管理实施细则\",\n    \"法规文号\": \"财教〔2008〕282号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十二条、第十三条\",\n    \"内容概述\": \"各地应当建立放映公示制度，接受群众监督；建立放映回执审核制度，确保场次真实；建立放映单位考核奖励制度，提高放映质量；公布举报电话，接受社会监督。\"\
    \n  }\n]"
- expression: (记录台账.被投诉单位 >= 制度文件.投诉次数阈值 && 登记表.退出日期) || (制度文件.卫生不达标次数标准 >= 制度文件.投诉次数阈值 && 登记表.退出日期)
  description: 当某供餐单位累计投诉次数或卫生检查不合格次数达到退出制度规定的阈值，但退出执行登记表中未查到该单位的退出记录时，判定为执行不到位，存在选择性监管或包庇风险。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 供餐退出机制执行不力
  regulation: "[\n  {\n    \"法规名称\": \"学校食品安全与营养健康管理规定\",\n    \"法规文号\": \"教育部、国家市场监督管理总局、国家卫生健康委员会令第45号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第三十七条\",\n    \"内容概述\": \"学校应当建立供餐单位食品安全信用档案，对有不良信用记录的供餐单位实施重点监管，并建立退出机制。\"\n  }\n]"
- expression: (补助学生名册及在校天数考勤记录表.身份证号 NOT IN 全校在籍学生名册.身份证号) || (补助学生名册及在校天数考勤记录表.上报在校天数 > 学校校历.学期起止日期) || (COUNT(补助学生名册及在校天数考勤记录表.身份证号
    GROUP BY 班级) > 全校在籍学生名册.在籍学生总数)
  description: 该表达式判断三条核心规则，满足任一即为疑点。规则1：补助名单中的学生身份证号不在全校学籍库中，判定为“幽灵学生”；规则2：单个学生的上报领取补助天数超过依据校历计算的实际应到天数（如扣除寒暑假），判定为虚报天数；规则3：按班级分组统计补助人数，如超出该班级学籍库中的实际在籍人数，判定为整体虚报。
  audit_item: 资金的管理和使用不规范
  suspicion: 虚报补助人数和在校天数套取资金
  regulation: "[\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划专项资金管理办法\",\n    \"法规文号\": \"财教〔2012〕2号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十六条、第十七条\",\n    \"内容概述\": \"专项资金应当足额用于为营养改善计划试点地区农村义务教育阶段学生提供等值优质的食品，不得以现金形式直接发放给学生个人和家长。学校应当建立健全学生营养改善计划管理制度，确定专人负责，对学生人数、补助标准、受益人次等情况进行动态管理，严禁虚报、冒领、套取专项资金。\"\
    \n  }\n]"
- expression: 名册.身份证号 = 记录台账.身份证号 && 记录台账.异动类型（转学/休学/毕业） IN ('转学', '休学', '毕业') && 名册.补助发放月份 > DATE_FORMAT(记录台账.异动生效日期, 'YYYY-MM')
  description: 该表达式判定：当某学生存在转学、休学或毕业记录，且在其异动生效日期之后的月份，补助名册中仍有其发放记录时，即构成违规领取补助。这里用月份比对，考虑到补助通常按月发放，异动生效当月是否发放需结合具体日期判断，通常次月起绝不应再发放。
  audit_item: 资金的管理和使用不规范
  suspicion: 学籍已变更学生违规持续享受补助
  regulation: "[\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划实名制学籍管理办法\",\n    \"法规文号\": \"教基二厅函〔2012〕12号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十一条\",\n    \"内容概述\": \"学生发生转学、休学、辍学、毕业等情况时，学校应及时在实名制学籍信息系统中进行标注，并从发生当月起停止发放营养改善计划补助资金。\"\n  },\n \
    \ {\n    \"法规名称\": \"城乡义务教育补助经费管理办法\",\n    \"法规文号\": \"财教〔2021〕72号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条\"\
    ,\n    "
- expression: (核定编制数.职能描述存在交叉或缺失) OR (数据台账.高火险区分布/数据台账.草原总面积 < 0.8) OR (整改台账.问题描述 > 0) OR (资质证书.人员姓名/资质证书.人员姓名 < 0.5) OR (资质证书.最近培训日期
    < 当前日期-730天) OR (近3年草原违法案件结案率 < 0.7)
  description: 监管机构职责不清、巡查覆盖率低于80%、整改未全部闭环、专业人员比例不足50%、近2年无任何培训、三年违法案件结案率低于70%，均反映监管机构及队伍建设严重滞后。
  audit_item: 草原风险防控落实不到位
  suspicion: 草原监管机构及队伍建设不到位
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国草原法》\",\n    \"法规文号\": \"中华人民共和国主席令第八十二号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十六条\",\n    \"内容概述\": \"草原行政主管部门和草原监督管理机构应当加强草原监督管理，依法查处违反草原法律法规的行为，保护草原资源。\"\n  }\n]"
