name: audit/登记台账类/收入台账
type: model
description: 从登记台账类类文档（收入台账）中提取结构化元数据。涵盖字段如：已缴金额、应缴金额、收费日期、收费项目、票据编号、缴库方式、缴库日期、缴库时间。文档范围包括：非税收入台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 收入台账
  member_count: 1
  member_details:
  - 非税收入台账
output:
  fields:
  - name: 已缴金额
    type: number
    description: 提取 已缴金额 的数值（含单位，如万元、吨等）
  - name: 应缴金额
    type: number
    description: 提取 应缴金额 的数值（含单位，如万元、吨等）
  - name: 收费日期
    type: date
    description: 提取 收费日期 的日期值，格式 YYYY-MM-DD
  - name: 收费项目
    type: number
    description: 提取 收费项目 的数值（含单位，如万元、吨等）
  - name: 票据编号
    type: string
    description: 提取 票据编号 的文本值
  - name: 缴库方式
    type: string
    description: 提取 缴库方式 的文本值
  - name: 缴库日期
    type: date
    description: 提取 缴库日期 的日期值，格式 YYYY-MM-DD
  - name: 缴库时间
    type: date
    description: 提取 缴库时间 的日期值，格式 YYYY-MM-DD
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (票据存根联金额合计 != 记账联金额合计) || (非税收入台账.票据编号缺失 || 非税收入台账.票据编号不在票据领用登记簿.核销记录内) && (银行对账单.收入金额 > 0 || 现金日记账.收入金额 > 0)
    && 非税收入台账.应缴金额 < 银行对账单.对应收入金额
  description: 当票据存根联金额与记账联金额不符，或收费台账中缺失规范票据编号且存在资金流入时，判定为隐瞒收入。差额即为疑似隐瞒金额，差异率超过10%列为重点疑点。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 未开具非税收入票据隐瞒收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十七条\",\n    \"内容概述\": \"执收单位不得隐匿、转移、截留、坐支、挪用、私分或者变相私分非税收入；非税收入应当依法开具票据，依法及时足额上缴。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政票据管理办法\",\n    \"法规文号\": \"财政部令第70号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条、第十七条\",\n    \"内容概述\": \"财政票据是财务收支和会计核"
- expression: 银行对账单.账户名称 NOT IN (银行账户开立审批文件.备案账户清单) && 银行对账单.收入摘要 REGEXP '收费|罚没|国有资产|资源费' && (非税收入台账.已缴金额 < 银行对账单.收入金额 OR
    往来款项明细表.应缴财政款_挂账金额 > 0)
  description: 当存在未备案的银行账户且有疑似非税收入流入，同时非税收入台账未反映对应上缴记录或长期挂账应缴款时，判定为通过过渡账户隐瞒收入。关注过渡账户期末余额突然清零等突击缴库异常行为。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 通过过渡账户隐瞒非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十五条\",\n    \"内容概述\": \"执收单位不得隐匿非税收入，非税收入应当全额缴入相应级次国库或财政专户，不得在过渡账户滞留、坐支。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强财政部门和预算单位资金存放管理的指导意见\"\
    ,\n    \"法规文号\": \"财库〔2017〕76号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"严格规范"
- expression: (实际缴库日期 - 收费日期) > 规定缴库时限 && ABS(非税收入台账.已缴金额 - 银行流水.收入金额) < 小额阈值
  description: 规定缴库时限依据当地非税收入收缴管理办法，通常为10至15个工作日。延时时长超过规定即为滞留；若延时期间资金被挪用则另案处理。滞留天数>30日定为严重违规。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 滞留应缴非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条、第二十二条\",\n    \"内容概述\": \"非税收入应当依法及时足额上缴，执收单位应在执收非税收入后10个工作日内上缴财政，最长不超过15个工作日。\"\n  }\n]"
- expression: 非税收入台账.已缴金额 < 非税收入台账.应缴金额 && 银行对账单.支出金额 ≈ (非税收入台账.应缴金额 - 非税收入台账.已缴金额) && 银行对账单.支出用途 IN ('工程款','采购款','办公费','装修费','工资奖金')
  description: 当非税收入未足额缴库且差额部分被用于单位各项经费支出，表明资金被挤占挪用。应进一步核实支出审批单是否注明资金来源于非税收入。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 挤占挪用应缴非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十六条\",\n    \"内容概述\": \"非税收入必须全额上缴国库或财政专户，任何单位和个人不得截留、坐支、挪用、私分。\"\n  }\n]"
- expression: 记账凭证.借方科目 IN ('管理费用','商品和服务支出','业务活动费用') && 记账凭证.贷方科目 IN ('应缴财政款','其他应付款-非税收入','非税收入') && 非税收入台账.已缴金额 < 非税收入台账.应缴金额
  description: 通过检查会计分录，若发现将非税收入类科目直接与费用类科目对冲，且未足额缴库，即可判定坐支或冲抵支出。关注“其他收入”直接冲减“管理费用”的异常账务处理。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 非税收入直接冲抵经费支出
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十六条\",\n    \"内容概述\": \"非税收入实行收支两条线管理，执收单位不得将非税收入直接用于冲抵经费支出、转为经营服务性收入等。\"\n  },\n  {\n    \"法规名称\": \"行政单位财务规则\"\
    ,\n    \"法规文号\": \"财政部令第71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"行政单位的各项收入应当全部纳入单位预算，统一管理，不"
