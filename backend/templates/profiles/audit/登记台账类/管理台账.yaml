name: audit/登记台账类/管理台账
type: model
description: 从登记台账类类文档（管理台账）中提取结构化元数据。涵盖字段如：产生量、低保对象姓名、作废登记、供应商名称、保质期、保障状态、入库/出库日期、入库日期。文档范围包括：低保动态管理台账、农民工实名制管理台账、农药库存管理台账、危险废物管理台账、发票管理台账、固废管理台账、寄宿制学校学生安全管理台账、工程质量问题整改闭环管理台账、库存管理台账、应急物资管理台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 台账
- 审批
- 登记
- 票据
- 元数据提取
