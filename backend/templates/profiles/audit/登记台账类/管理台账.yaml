violations:
- expression: (入库标准 IS NULL OR 入库标准.公开征集程序 = '无') AND (公告.资格条件中是否载明‘须为预选库/名录内供应商’ CONTAINS '需为库内供应商' OR '在名录内') AND (管理台账.库内供应商名单
    = 0) AND (中标供应商列表 不在 管理台账.库内供应商名单 中的中标次数 = 0)
  description: 同时满足以下条件即判为违规：1）名录库管理制度中入库标准缺失或从未公开对外征集；2）采购公告明确要求投标人必须是库内成员；3）近3年无任何新供应商成功入库；4）所有中标供应商无一例外均在库内。这表明该库已沦为排斥新进竞争者的壁垒。
  audit_item: 违反建设管理相关政策规定-政府采购活动中设置不合理的条件对供应商实行差别待遇或者歧视待遇
  suspicion: 通过设置不公开项目库/名录库限制潜在供应商
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十二条\",\n    \"内容概述\": \"禁止以不合理的条件对供应商实行差别待遇或者歧视待遇。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\":\
    \ \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条第八项\",\n    \"内容概述\": \"以其他不合理条件限制或者排斥潜在供应商的情形，属于差别待遇或歧视待遇。\"\
    \n  },\n "
- expression: (项目名称、责任单位（牵头部门、配合部门）、责任人、任务节点细化情况.责任单位（牵头部门、配合部门） IS NULL OR 项目名称、责任单位（牵头部门、配合部门）、责任人、任务节点细化情况.责任单位（牵头部门、配合部门）
    LIKE '%多部门%') && 计划开工日期、计划竣工日期、实际开工日期、实际竣工日期、滞后天数、项目名称、计划工期、实际形象进度数据、进度偏差率.滞后天数 > 90
  description: 国家规划项目责任分工表中未指定唯一明确的责任单位，或责任主体笼统描述为多部门共同负责，且对应项目实际进度较计划滞后超过90天，即判定为责任虚化导致推进不力。
  audit_item: 违反建设管理相关政策规定-重大工程项目推进缓慢
  suspicion: 国家规划重大项目责任分工不明确导致进度滞后
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\"\
    ,\n    \"内容概述\": \"国家通过建立项目库等方式，加强对使用政府投资资金项目的储备管理。项目单位应当加强项目的前期工作，保证前期工作的深度达到规定的要求，并对项目建议书、可行性研究报告、初步设计以及依法应当附具的其他文件的真实性负责。\"\
    \n  },\n  {\n    \"法规名称\": \"中央预算内直接投资管理办法\",\n    \"法规文号\": \"国家发展改革委令第7号\",\n    \"效力级别\": \"部门规章\",\n   "
- expression: (资产负债表.资产负债率 > 70%) && ( (投资项目名称、投资方向、投资金额、决策审批层级.投资方向 NOT IN 禁止类业务清单.主业目录) || (业务类型（衍生品、PPP等）、合约规模、风险敞口.业务类型（衍生品、PPP等）
    IN ('衍生品交易','PPP项目','明股实债投资') && 业务类型（衍生品、PPP等）、合约规模、风险敞口.合约规模 > 集团审批限额) )
  description: 资产负债率超过监管指导线（警戒线通常为70%）的企业，严格限制开展非主业投资和高风险业务。若高负债企业违规涉足负面清单业务或超限额开展高风险业务，即判定违规。
  audit_item: 未按规定落实去杠杆政策措施
  suspicion: 高负债企业违规开展非主业投资或高风险业务
  regulation: "[\n  {\n    \"法规名称\": \"中央企业投资监督管理办法\",\n    \"法规文号\": \"国资委令第34号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条、第十七条\",\n    \"内容概述\": \"中央企业应当聚焦主业发展，严格控制非主业投资，高负债企业原则上不得开展新增非主业投资和推高负债率的项目。不得开展超出自身承受能力的高风险投资。\"\n  }\n]"
- expression: (管理台账.产生量 > 0) && ((合同签订方 IS NULL) || (管理台账.产生量 - 管理台账.自行利用量 - 管理台账.委托处置量 > 0.1 * 管理台账.产生量))
  description: 有固废产生但无处置合同，或超过10%的产生量去向不明且无法提供合法利用、处置去向证明，即可疑为擅自倾倒、堆放。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 擅自倾倒、堆放固体废物
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"主席令第五十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"产生、收集、贮存、运输、利用、处置固体废物的单位和个人，应当采取防扬散、防流失、防渗漏或者其他防止污染环境的措施，不得擅自倾倒、堆放、丢弃、遗撒固体废物。\"\n  }\n]"
- expression: ((环评文件.危废种类 > 0) && (台账建立情况 IS NULL || 台账建立情况.记录完整性))
  description: 环评文件或生产工艺确认有危险废物产生的单位，未建立或未能提供符合规范的危废管理台账，即构成违规。关键信息缺失指未记录产生量、种类、去向、贮存情况等。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 未按规定建立危险废物管理台账
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"主席令第五十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第七十八条\",\n    \"内容概述\": \"产生危险废物的单位，应当按照国家有关规定制定危险废物管理计划，建立危险废物管理台账，如实记录有关信息。\"\n  }\n]"
- expression: (转移联单.接收单位名称 对应 许可证 IS NULL) || (转移联单.危废类别及数量 NOT IN 许可证.核准经营危险废物类别)
  description: 接收危废的单位必须持有相应类别的危险废物经营许可证。无许可证或核准类别不覆盖所接收的危废种类，均属委托无资质单位处置。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 委托无经营资质单位处置危险废物
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"主席令第五十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第八十条\",\n    \"内容概述\": \"禁止将危险废物提供或者委托给无许可证的单位或者其他生产经营者从事收集、贮存、利用、处置活动。\"\n  }\n]"
- expression: (票据管理台账.作废登记 != 财务账簿类-簿-使用日期、用途摘要、审批人签字、使用人签字、印鉴名称.使用日期) || (财务账簿类-簿-使用日期、用途摘要、审批人签字、使用人签字、印鉴名称.使用日期 < 80% AND
    财务账簿类-簿-使用日期、用途摘要、审批人签字、使用人签字、印鉴名称.使用日期 > 5) || (记录留痕类-分工记录-印鉴名称、保管人、存放地点、是否分管.保管人 = 记录留痕类-分工记录-印鉴名称、保管人、存放地点、是否分管.保管人)
    || (票据管理台账.核销日期 = '未核销' AND 票据管理台账.核销日期 < 当前日期 - 30天) || (财务账簿类-簿-使用日
  description: 空白票据账实不符；印鉴使用登记不全且累计使用超过5次；财务章和法人章由同一人保管；超过票期30天仍未核销；大额票据（>10万元）使用印鉴无审批签字，均视为管理薄弱。记录完整率＜80%为阈值。
