  - name: 收款账号
    type: number
    description: 提取 收款账号 的数值（含单位，如万元、吨等）
  - name: 收款账户
    type: number
    description: 提取 收款账户 的数值（含单位，如万元、吨等）
  - name: 时间
    type: date
    description: 提取 时间 的日期值，格式 YYYY-MM-DD
  - name: 立项批复文号
    type: string
    description: 提取 立项批复文号 的文本值
  - name: 累计拨付比例
    type: number
    description: 提取 累计拨付比例 的数值（含单位，如万元、吨等）
  - name: 补贴发放对象
    type: string
    description: 提取 补贴发放对象 的文本值
  - name: 计划拨付时间
    type: date
    description: 提取 计划拨付时间 的日期值，格式 YYYY-MM-DD
  - name: 财政拨付金额
    type: number
    description: 提取 财政拨付金额 的数值（含单位，如万元、吨等）
  - name: 资金下达单位
    type: string
    description: 提取 资金下达单位 的文本值
  - name: 资金拨付日期
    type: date
    description: 提取 资金拨付日期 的日期值，格式 YYYY-MM-DD
  - name: 资金类别
    type: string
    description: 提取 资金类别 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目建设地点
    type: string
    description: 提取 项目建设地点 的文本值
  - name: 首次拨付日期
    type: date
    description: 提取 首次拨付日期 的日期值，格式 YYYY-MM-DD
  - name: 票据类型
    type: string
