name: audit/登记台账类/拨付台账
type: model
description: 从登记台账类类文档（拨付台账）中提取结构化元数据。涵盖字段如：到账时间、学校名称、实际拨付时间、应拨付金额、开户行、投资总额、拨付审批完成日期、拨付对象。文档范围包括：不足100人小规模学校经费拨付台账、专项资金拨付台账、中央财政资金拨付台账、保障性安居工程项目资金拨付台账、土地整治项目资金拨付台账、涉农资金拨付台账、电商专项补贴资金拨付台账、补助资金拨付台账、财政补贴资金拨付台账、资金拨付台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 审批
- 拨款
- 补贴
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 拨付台账
  member_count: 1
  member_details:
  - 不足100人小规模学校经费拨付台账
  - 专项资金拨付台账
  - 中央财政资金拨付台账
  - 保障性安居工程项目资金拨付台账
  - 土地整治项目资金拨付台账
  - 涉农资金拨付台账
  - 电商专项补贴资金拨付台账
  - 补助资金拨付台账
  - 财政补贴资金拨付台账
  - 资金拨付台账
  - 转移支付资金拨付台账
output:
  fields:
  - name: 到账时间
    type: date
    description: 提取 到账时间 的日期值，格式 YYYY-MM-DD
  - name: 学校名称
    type: string
    description: 提取 学校名称 的文本值
  - name: 实际拨付时间
    type: date
    description: 提取 实际拨付时间 的日期值，格式 YYYY-MM-DD
  - name: 应拨付金额
    type: number
    description: 提取 应拨付金额 的数值（含单位，如万元、吨等）
  - name: 开户行
    type: string
    description: 提取 开户行 的文本值
  - name: 投资总额
    type: number
    description: 提取 投资总额 的数值（含单位，如万元、吨等）
  - name: 拨付审批完成日期
    type: date
    description: 提取 拨付审批完成日期 的日期值，格式 YYYY-MM-DD
  - name: 拨付对象
    type: string
    description: 提取 拨付对象 的文本值
  - name: 拨付年度
    type: date
    description: 提取 拨付年度 的日期值，格式 YYYY-MM-DD
  - name: 拨付批次
    type: string
    description: 提取 拨付批次 的文本值
  - name: 拨付日期
    type: date
    description: 提取 拨付日期 的日期值，格式 YYYY-MM-DD
  - name: 拨付时间
    type: date
    description: 提取 拨付时间 的日期值，格式 YYYY-MM-DD
  - name: 拨付状态
    type: boolean
    description: 提取 拨付状态 的布尔值（是/否）
  - name: 拨付金额
    type: number
    description: 提取 拨付金额 的数值（含单位，如万元、吨等）
  - name: 拨出日期
    type: date
    description: 提取 拨出日期 的日期值，格式 YYYY-MM-DD
  - name: 拨出金额
    type: number
    description: 提取 拨出金额 的数值（含单位，如万元、吨等）
  - name: 拨款到账金额
    type: number
