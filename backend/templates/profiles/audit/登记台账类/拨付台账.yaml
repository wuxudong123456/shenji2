violations:
- expression: (会计凭证.实际支付日期 - 指标下达日期.指标下达日期) > 规定拨付天数 || (审批文件.签收日期 - 指标下达日期.指标下达日期) > 规定拨付天数
  description: 比较资金拨付各环节时间差是否超过管理办法规定的时限（例如上级规定为30日）。计算指标下达日至实际支付日或最终签收日的自然天数，超过规定阈值即判定为违规。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 转移支付资金未在规定时限内拨付
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府财政部门必须依照法律、行政法规和国务院财政部门的规章，及时、足额地拨付预算支出资金。\"\n  }\n]"
- expression: (明细表.确认支出日期 >= '年末突击期' && 明细表.确认支出金额 > 预警阈值) || (跟踪表.实际使用资金量 / 拨付台账.拨出金额 < 使用率阈值 && 明细表.确认支出日期)
  description: 此表达式分为两种情况：① 年末（如11月、12月）存在大额密集的支出确认行为，但项目实际工程进度并未同步；② 资金拨付至下级单位账户后，长期（如超过一个季度）实际使用率低于50%，但上级已确认为支出。预警阈值可设为项目平均月度支出额的3倍以上，使用率阈值设为50%。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 为完成预算进度以拨代支转移支付资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十条\",\n    \"内容概述\": \"各级政府财政部门应当在本级预算经批准后，及时批复各部门预算。各部门、各单位应当按照规定的支出用途使用资金，不得虚列支出、转移或者套取预算资金。\"\n  }\n]"
- expression: 统计表.结转年限 >= 2 && (跟踪表.累计实际使用金额 / 跟踪表.资金拨付总额) < 使用率阈值
  description: 计算资金预算年度至审计截止日的时长，对于下达超过2年但总使用率仍处于低位（如低于80%）的项目资金进行筛查，识别沉淀闲置问题。对于无法实施、长期停工的项目，其使用率阈值应设为接近0。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 转移支付资金长期闲置沉淀未发挥效益
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强财政支出预算执行管理的通知\",\n    \"法规文号\": \"财预〔2017〕69号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"各级财政部门要进一步盘活财政存量资金，对结余资金和连续两年未用完的结转资金，一律收回总预算统筹使用。\"\n  }\n]"
- expression: ABS(SUM(拨付台账.拨付金额) - SUM(流水清单.金额)) > 100 OR 流水清单.收款账户 NOT IN (SELECT 银行账号 FROM 明细表) OR 财务账目.支出明细 LIKE '%补贴返还%'
    OR 财务账目.其他收入 > 0 AND 来源不明
  description: 财政拨付总额与银行实际代发到户总额存在差异（差值>100元），或补贴资金流向非农户账户，或村级账目中出现“补贴款返还”“捐赠”等异常收入，均表明资金可能被截留用于二次分配。
  audit_item: 惠农补贴发放不到位
  suspicion: 截留惠农补贴资金二次分配
  regulation: "[\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"截留、挪用财政资金的，责令改正，调整有关会计账目，追回违反规定使用的财政资金，并对单位给予警告或者通报批评。\"\n  }\n]"
- expression: 投资计划申请表.项目名称 IN (拨付台账.项目名称) WHERE 拨付台账.资金类别 = '中央预算内投资' OR 拨付台账.资金类别 = '中央财政资金'
  description: 若投资计划申请表中的项目在历史中央资金拨付台账中已存在相同项目获拨记录，即认定为重复申报。
  audit_item: 项目计划申报不合规
  suspicion: 同一项目重复申报中央财政投资计划
  regulation: "[\n  {\n    \"法规名称\": \"中央预算内投资补助和贴息项目管理办法\",\n    \"法规文号\": \"国家发展和改革委员会令第45号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十九条\",\n    \"内容概述\": \"严禁通过虚报、重复申报等手段骗取投资补助和贴息资金。\"\n  }\n]"
- expression: A.project_name == B.project_name || (ABS(A.longitude - B.longitude) < 0.0001 && ABS(A.latitude - B.latitude)
    < 0.0001 && A.funding_dept != B.funding_dept)
  description: 比对高标准农田建设项目（A）与土地整治项目（B）的名称及地块坐标。若名称完全相同，或建设地点坐标基本一致（经纬度偏差小于约10米）但资金分别来源于不同主管部门（如农业农村局与自然资源局），则判定为疑似重复立项，导致财政资金浪费。
  audit_item: 高标农田建设资金保障不到位
  suspicion: 高标准农田建设项目与土地整治项目重复立项
  regulation: "[\n  {\n    \"法规名称\": \"农田建设补助资金管理办法\",\n    \"法规文号\": \"财农〔2019〕46号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"各级财政、农业农村部门应当加强农田建设补助资金的统筹使用，避免重复投入。\"\n  }\n]"
- expression: (记录表.标准调整执行日期 - 国家最新政策生效日期.国家最新政策生效日期) > 90天 && 记录表.调整后每服役年补助标准 < 国家最新政策生效日期.国家最低补助标准 || (明细表.实发金额 != 记录表.调整后每服役年补助标准
    × 明细表.服役年限) && 明细表.发放日期 >= 记录表.标准调整执行日期
  description: 条件一：地方标准调整日期滞后于国家政策生效日超过90天，且地方标准低于国家最低标准，判定为标准调整违规。条件二：对于政策调整后发放的退役士兵，实际发放金额不等于新标准乘以服役年限，判定为未按标准足额发放。两个条件满足任一即触发疑点。90天为财政资金落实合理缓冲期；金额差异容许误差为0，严格一致性。
  audit_item: 未按规定落实自主就业退役士兵安置政策
  suspicion: 地方退役金补助标准调整滞后导致未按新标准发放
  regulation: "[\n  {\n    \"法规名称\": \"退役士兵安置条例\",\n    \"法规文号\": \"国务院、中央军委令第608号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"地方人民政府可以根据当地实际情况给予经济补助，经济补助标准及发放办法由省、自治区、直辖市人民政府规定，并适时调整。\"\n  }\n]"
- expression: （收款方为企业法人代表个人账户） || （补贴资金到账后30天内同一企业支付给分析表.是否关联方转账凭证.金额 >= 到账金额 * 0.9） || （收款方与申报单位不一致 且 无代收代付授权协议） || （同一地区多家不同申报单位的最终收款方指向同一账户）
  description: 追踪补贴资金末端流向，若发现直接汇入个人账户、短期大额转付给关联方、多家单位资金归集至同一账户等异常回流的特征，即触犯疑点。
  audit_item: 虚列就业补助资金支出
  suspicion: 截留挪用补贴资金转入关联方
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"就业补助资金必须专款专用，任何单位和个人不得截留、挤占、挪用，严禁通过虚假支付、资金回流等方式侵占。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"截留、挪用财政专项资金尚未构成犯罪的，予以追"
- expression: (财务报告.实际分配用于保障房金额) < (财务报告.当年增值收益总额 - MAX(财务报告.提取贷款风险准备金金额, 财务报告.当年增值收益总额*0.6) - 财务报告.管理费用) || ( (财务报告.提取贷款风险准备金金额
    / 财务报告.当年增值收益总额) > 0.6 AND 无合规审批文件 )
  description: 根据规定，增值收益扣除贷款风险准备金（通常不超过增值收益的60%）和管理费用后，余额应全部用于保障房。表达式第一部分判别实际安排金额是否低于可安排金额；第二部分单独警示风险准备金超额提取导致可安排资金被压减。若地方规定风险准备金上限比例不同，替换0.6。
  audit_item: 财政部门未按规定足额安排保障性安居工程资金
  suspicion: 未按规定安排住房公积金增值收益用于保障房
  regulation: "[\n  {\n    \"法规名称\": \"《住房公积金管理条例》\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"住房公积金的增值收益应当用于建立住房公积金贷款风险准备金、住房公积金管理中心的管理费用和建设城市廉租住房的补充资金。\"\n  }\n]"
- expression: (收到住房公积金增值收益拨款金额.实际拨付时间 - 会议纪要.关于资金拨付的决策依据) > 60天 || (对比表.结转结余金额 / 对比表.预算安排金额) > 0.3
  description: 资金在预算下达后超过60天仍未拨付至项目单位，或年末保障房资金结转结余率超过30%，表明存在人为滞留、延迟拨付问题。天数阈值和结余比例可根据地方财政管理规定调整。
  audit_item: 财政部门未按规定足额安排保障性安居工程资金
  suspicion: 保障性安居工程资金滞留未及时拨付至项目
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府财政部门必须依照法律、行政法规和国务院财政部门的规定，及时、足额地拨付预算支出资金，不得截留、滞留。\"\n  }\n]"
