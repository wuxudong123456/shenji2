name: audit/登记台账类/质疑台账
type: model
description: 从登记台账类类文档（质疑台账）中提取结构化元数据。涵盖字段如：处理结果、投诉事由、投诉记录。文档范围包括：投诉质疑台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 质疑台账
  member_count: 1
  member_details:
  - 投诉质疑台账
output:
  fields:
  - name: 处理结果
    type: boolean
    description: 提取 处理结果 的布尔值（是/否）
  - name: 投诉事由
    type: string
    description: 提取 投诉事由 的文本值
  - name: 投诉记录
    type: string
    description: 提取 投诉记录 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 通知书.中标人名称 NOT IN (评标报告.推荐中标候选人名称) && 评标报告.排序 >= 1
  description: 当中标人不在评标委员会依法推荐的任何中标候选人名单中时触发违规。该表达式直接比对中标通知书与评标报告的核心字段，忽略候选人排序，只要不在名单内即构成违规，前提是存在有效推荐的候选人。
  audit_item: 招标人违法确定中标人
  suspicion: 招标人在推荐中标候选人外确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十条\",\n    \"内容概述\": \"招标人根据评标委员会提出的书面评标报告和推荐的中标候选人确定中标人。招标人也可以授权评标委员会直接确定中标人。\"\n  }\n]"
- expression: 否决投标人名称、否决原因、被否决投标人数量.被否决投标人数量 = 招标文件.投标人数量要求 && 中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中标日期、评标委员会名单、中标通知书发出时间、中标人、中标联合体成员及分工、联合体协议条款.中标人名称
    IS NOT NULL
  description: 当评标委员会否决所有投标后，该项目不应产生任何中标通知书。若存在中标通知书或已签订合同，即表明招标人在未依法重新招标的情况下直接确定了中标人，构成违规。
  audit_item: 招标人违法确定中标人
  suspicion: 所有投标被否决后自行确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十二条\",\n    \"内容概述\": \"评标委员会经评审，认为所有投标都不符合招标文件要求的，可以否决所有投标。依法必须进行招标的项目的所有投标被否决的，招标人应当依照本法重新招标。\"\n  }\n]"
