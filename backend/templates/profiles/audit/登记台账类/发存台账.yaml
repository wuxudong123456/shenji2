name: audit/登记台账类/发存台账
type: model
description: 从登记台账类类文档（发存台账）中提取结构化元数据。涵盖字段如：出库单号、出库日期、商品、客户、数量、日期、金额。文档范围包括：存货收发存台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 发存台账
  member_count: 1
  member_details:
  - 存货收发存台账
output:
  fields:
  - name: 出库单号
    type: string
    description: 提取 出库单号 的文本值
  - name: 出库日期
    type: date
    description: 提取 出库日期 的日期值，格式 YYYY-MM-DD
  - name: 商品
    type: string
    description: 提取 商品 的文本值
  - name: 客户
    type: string
    description: 提取 客户 的文本值
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 日期
    type: date
    description: 提取 日期 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (明细账.发票号码 NOT IN 发票号码.发票号码) || (发票号码.购方名称 != 单据.收货单位) || (行对账单.付款方 != 销售合同.购方名称) || (发存台账.数量 < 发票号码.数量)
  description: 存在发票号码未正式登记、购货方与收货方不一致、付款方非合同购方或出库数量低于开票数量任一情况，即为虚开嫌疑。
  audit_item: 未按规定确认收入
  suspicion: 虚开商品销售发票虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国发票管理办法\",\n    \"法规文号\": \"国务院令第587号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"任何单位和个人不得为他人、为自己开具与实际经营业务情况不符的发票。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"\
    法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入"
- expression: (明细账.客户名称 IN 关联方清单) && (交易商品名称相同) && (购销金额相近) && (资金在30个自然日内形成回流) && (物流单据显示未实际移动或同一批货物反复出库)
  description: 关联方之间以相同商品进行金额相近的购销，资金短期内回流，且无实质物流，属于无真实贸易背景的循环交易。
  audit_item: 未按规定确认收入
  suspicion: 通过无实际贸易背景的循环交易虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"企业应当按照交易或者事项的经济实质进行会计确认、计量和报告，不应仅以交易或者事项的法律形式为依据。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\"\
    ,\n    \"法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"收入确认应反映向客户转让商品的对价金额，交易"
- expression: (银行对账单.收款金额 > 明细账.收入金额 * 1.1) || (数据.收款金额 > 税申报表.应税销售额) || (发存台账.金额 > 明细账.收入金额 * 1.05)
  description: 银行流水收入明显高于账面收入（偏差>10%）、业务系统收款大于申报销售额或出库金额大于账面收入（偏差>5%），均暗示存在账外收入。
  audit_item: 未按规定确认收入
  suspicion: 隐瞒业务少计收入
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计账簿，编制财务会计报告。\"\n  }\n]"
