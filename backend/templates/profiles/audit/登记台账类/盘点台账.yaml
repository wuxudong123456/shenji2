name: audit/登记台账类/盘点台账
type: model
description: 从登记台账类类文档（盘点台账）中提取结构化元数据。涵盖字段如：使用状态、型号、实盘数量、账面原值、资产名称。文档范围包括：固定资产盘点台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 资产
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 盘点台账
  member_count: 1
  member_details:
  - 固定资产盘点台账
output:
  fields:
  - name: 使用状态
    type: boolean
    description: 提取 使用状态 的布尔值（是/否）
  - name: 型号
    type: string
    description: 提取 型号 的文本值
  - name: 实盘数量
    type: number
    description: 提取 实盘数量 的数值（含单位，如万元、吨等）
  - name: 账面原值
    type: string
    description: 提取 账面原值 的文本值
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ABS(盘点台账.实盘数量 - 盘点台账.账面原值) > 0 || (盘点台账.使用状态 = "已报废" && 资产负债表.固定资产原值 仍包含该资产) || (盘点台账.账面原值 != 资产负债表.固定资产原值 -
    汇总表.资产盘盈盘亏调整分录)
  description: 实地盘点发现资产缺失或多出，或已报废资产仍挂账，或台账账面原值总计与资产负债表原值经调整后仍不一致，即构成固定资产账实不符。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 固定资产账实不符导致决算失真
  regulation: "[\n  {\n    \"法规名称\": \"《行政事业性国有资产管理条例》\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"各部门及其所属单位应当定期对资产进行盘点、对账，出现资产盘盈盘亏的，应当按照财务、会计和资产管理制度处理。\"\n  }\n]"
