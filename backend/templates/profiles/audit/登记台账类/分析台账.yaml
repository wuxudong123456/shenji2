name: audit/登记台账类/分析台账
type: model
description: 从登记台账类类文档（分析台账）中提取结构化元数据。涵盖字段如：产出效益指标值、年度资金拨付金额、累计支出金额、资金使用率、项目名称。文档范围包括：项目资金使用效益分析台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 分析台账
  member_count: 1
  member_details:
  - 项目资金使用效益分析台账
output:
  fields:
  - name: 产出效益指标值
    type: string
    description: 提取 产出效益指标值 的文本值
  - name: 年度资金拨付金额
    type: date
    description: 提取 年度资金拨付金额 的日期值，格式 YYYY-MM-DD
  - name: 累计支出金额
    type: number
    description: 提取 累计支出金额 的数值（含单位，如万元、吨等）
  - name: 资金使用率
    type: string
    description: 提取 资金使用率 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (跨年度项目绩效趋势分析表.连续3年绩效评分 < 60 || 项目资金使用效益分析台账.资金使用率连续2年 < 0.5 ) && (低效项目清单及历史整改记录.是否启动退出程序 = '否' || 低效项目清单及历史整改记录.整改措施
    != '停止拨款并退出' ) && 项目清理退出机制相关制度.退出条件阈值 <= 触发值
  description: 项目连续3年绩效评分低于60分（或连续2年资金使用率低于50%），且未按照本单位项目清理退出制度启动退出程序，继续安排预算拨款的，判定为低效项目未及时清理退出。触发条件需符合单位制度中明确的退出标准阈值。
  audit_item: 部门、单位预算绩效目标未完成
  suspicion: 预算绩效低下的项目未及时清理退出
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第十一条\",\n    \"内容概述\": \"强化绩效评价结果应用，将绩效评价结果与预算安排挂钩，对低效无效资金一律削减或取消。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"绩效评价结果应作为改进管理、安排"
