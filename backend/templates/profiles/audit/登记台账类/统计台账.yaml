name: audit/登记台账类/统计台账
type: model
description: 从登记台账类类文档（统计台账）中提取结构化元数据。涵盖字段如：产量、亲属联系方式、回收率计算过程、姓名、实际种植面积、年度农膜使用总量、年度实际回收量、年度或季度实际回收量。文档范围包括：农业部门年度统计台账、农膜回收统计台账、损失浪费事项统计台账、死亡人员统计台账、相关统计台账、研发费用投入统计台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 统计台账
  member_count: 1
  member_details:
  - 农业部门年度统计台账
  - 农膜回收统计台账
  - 损失浪费事项统计台账
  - 死亡人员统计台账
  - 相关统计台账
  - 研发费用投入统计台账
output:
  fields:
  - name: 产量
    type: string
    description: 提取 产量 的文本值
  - name: 亲属联系方式
    type: string
    description: 提取 亲属联系方式 的文本值
  - name: 回收率计算过程
    type: string
    description: 提取 回收率计算过程 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 实际种植面积
    type: string
    description: 提取 实际种植面积 的文本值
  - name: 年度农膜使用总量
    type: date
    description: 提取 年度农膜使用总量 的日期值，格式 YYYY-MM-DD
  - name: 年度实际回收量
    type: date
    description: 提取 年度实际回收量 的日期值，格式 YYYY-MM-DD
  - name: 年度或季度实际回收量
    type: date
    description: 提取 年度或季度实际回收量 的日期值，格式 YYYY-MM-DD
  - name: 折旧费
    type: number
    description: 提取 折旧费 的数值（含单位，如万元、吨等）
  - name: 损失原因
    type: string
    description: 提取 损失原因 的文本值
  - name: 损失金额
    type: number
    description: 提取 损失金额 的数值（含单位，如万元、吨等）
  - name: 死亡日期
    type: date
    description: 提取 死亡日期 的日期值，格式 YYYY-MM-DD
  - name: 直接投入费用
    type: number
    description: 提取 直接投入费用 的数值（含单位，如万元、吨等）
  - name: 规模经营比例
    type: number
    description: 提取 规模经营比例 的数值（含单位，如万元、吨等）
  - name: 计算得出的实际回收率
    type: string
    description: 提取 计算得出的实际回收率 的文本值
  - name: 证明存在支持定量评价的原始业务数据记录
    type: string
    description: 提取 证明存在支持定量评价的原始业务数据记录 的文本值
  - name: 责任认定
    type: string
    description: 提取 责任认定 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 项目月度实际研发人数
    type: number
    description: 提取 项目月度实际研发人数 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (绩效目标申报表.指标值 LIKE '%定性%' OR 绩效目标申报表.指标值 IS NULL OR 绩效目标申报表.指标数据来源说明 IS NULL) && (绩效指标量化标准表.计算公式 IS NULL)
  description: 该表达式判断目标是否可衡量。当申报表中的‘指标值’为纯定性文字描述（如‘好’、‘满意’、‘显著提升’）或空值，并且其‘数据来源说明’为空，表明不知道由谁、用什么方法收集数据；同时，在单位配套的‘量化标准表’中也找不到针对这个指标的计算公式或评分细则时，即可判定该目标完全不可衡量。一个既无量化值、也无计算方法、更无数据来源的目标，等同于一场‘自己既当运动员又当裁判员’且规则为空的游戏。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定不可衡量
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"预算支出绩效指标应当尽可能量化，不能量化的，应当设定定性指标，但应当具有可衡量性，并经充分论证。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\",\n    \"内容概述\": \"绩效指标应当明确指标解释、指标计算公式、"
- expression: (损失浪费事项统计台账.损失金额 > 企业净资产×0.005) || (重大项目执行进度跟踪表.超概算比例 > 0.2 && 未经追加审批) || (资源配置效率分析表.产能利用率 < 0.4) || (重大投资项目可行性研究报告.预期市场收益
    / 重大投资项目可行性研究报告.项目预期收益 < 0.5)
  description: 1.单个战略相关项目造成的损失超过净资产的0.5%即触发重大损失预警；2.超概算20%以上且缺少有效的追加审批，表明投资失控；3.建成后产能利用率不足40%，说明资产闲置浪费严重；4.实际收益不到可研预期的一半，反映决策严重失误。
  audit_item: 企业发展战略规划的制定、执行和效果
  suspicion: 战略规划执行中存在重大损失浪费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于建立国有企业违规经营投资责任追究制度的意见\",\n    \"法规文号\": \"国办发〔2016〕63号\",\n    \"效力级别\": \"\
    国务院规范性文件\",\n    \"条款号\": \"二、（一）\",\n    \"内容概述\": \"在投资并购方面，未按规定进行可行性研究或风险分析、投资概算严重偏离实际、项目管理混乱致使资产损失等情形，应当追究有关人员责任。\"\
    \n  }\n]"
- expression: (统计台账.项目月度实际研发人数 - 考勤记录.研发人员实际出勤天数) / 统计台账.项目月度实际研发人数 > 0.3 || (工时分摊比例与合同岗位不符) || (设备采购无研发关联性)
  description: 若申报研发人数与实际到岗人数偏差超过30%，或研发人员工时记录与工资分摊计算表不勾稽，或采购的设备与研发方向无实质性关联，即判定存在虚报。该表达式基于人数偏离度和费用归集真实性的组合条件。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 虚报研发费用数据造假
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局 科技部关于完善研究开发费用税前加计扣除政策的通知\",\n    \"法规文号\": \"财税〔2015〕119号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"三（一）\",\n    \"内容概述\": \"企业应按照财务会计制度要求，对研发支出进行会计处理；对研发费用和生产经营费用划分不清的，不得实行加计扣除。\"\n  },\n \
    \ {\n    \"法规名称\": \"中华人民共和国统计法\",\n    \"法规文号\": \"主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七条\",\n    \"内容概述\"\
    : \"国"
- expression: (ABS(试点县申报材料.申报特色农产品种植面积 - 农业部门年度统计台账.实际种植面积) / 农业部门年度统计台账.实际种植面积 > 0.3) || (电商平台交易数据汇总表.统计周期内该县农产品网络销售总额 <
    试点县申报材料.上年度农产品网络销售额 * 0.5) || (试点县申报材料.村级服务站覆盖率 < 0.7) || (试点县基本条件对照核查表.数据真实性核验标记 = '否' && 试点县基本条件对照核查表.专家评审签字栏 = '是')
    || (政府审批文件.会议召开日期与批复日期逻辑顺序 = '异常')
  description: 种植面积偏差率超过30%为虚报；实际网络销售额不足申报值的50%为严重造假；村级服务站覆盖率低于政策要求70%为不达标；核查表中任一关键指标未达标但审批通过为违规；审批时间倒置存在流程造假。以上条件满足任一即触发疑点。
  audit_item: “互联网+”农产品出村进城工程实施不到位
  suspicion: 试点县基本条件不满足工程要求
  regulation: "[\n  {\n    \"法规名称\": \"“互联网+”农产品出村进城工程试点工作方案\",\n    \"法规文号\": \"农办市〔2020〕7号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"二、试点县遴选条件\",\n    \"内容概述\": \"试点县应具备良好的产业基础、一定的电商发展水平和较为完善的县乡村三级物流体系，农产品网络销售额达到一定规模，且申报材料真实准确。\"\n  }\n\
    ]"
- expression: ABS(年度实际回收量、年度农膜使用总量、计算得出的实际回收率、年度或季度实际回收量、回收率计算过程.计算得出的实际回收率 - 上报年度实际回收率、年度、目标回收率、实际完成回收率、差异值.上报年度实际回收率) >
    0.05 || (政策要求年度回收率目标值、目标回收率.政策要求年度回收率目标值 - 年度实际回收量、年度农膜使用总量、计算得出的实际回收率、年度或季度实际回收量、回收率计算过程.计算得出的实际回收率) > 0.10
  description: 触发条件分为两层：（1）台账核实的实际回收率与上报统计表的回收率偏差超过5个百分点，涉嫌数据造假或虚报；（2）台账核实的实际回收率低于政策目标值超过10个百分点，认定为未达标。可进一步核查回收补贴资金的拨付使用情况，若补贴资金闲置或未足额发放，可加重认定违规情节。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 农膜回收利用率未达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"中华人民共和国主席令第四十三号\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第六十五条\",\n    \"内容概述\": \"产生秸秆、废弃农用薄膜、农药包装废弃物等农业固体废物的单位和其他生产经营者，应当采取回收利用和其他防止污染环境的措施。\"\n  },\n  {\n \
    \   \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"中华人民共和国农业农村部令2020年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\"\
    ,\n    \"内容概"
- expression: 上报年度实际回收率、年度、目标回收率、实际完成回收率、差异值.实际完成回收率 < 政策要求年度回收率目标值、目标回收率.目标回收率
  description: 当年实际农膜回收率低于政策文件规定的目标回收率，即触发疑点。若偏差超过10个百分点，视为严重未达标，需重点核查统计真实性及回收体系建设情况。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 农膜回收利用率未达标
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"地方人民政府应当建立农用薄膜回收利用体系，确定回收目标，促进农用薄膜回收利用。未完成回收目标的，应依法追究相关责任。\"\n  }\n\
    ]"
- expression: (死亡人员统计台账.死亡日期 IS NOT NULL || 民政部门死亡人员信息共享数据.死亡日期 IS NOT NULL) && (住房公积金缴存明细表.账户状态 NOT IN ('销户','冻结','呆滞'))
    && (DATEDIFF(DAY, COALESCE(死亡人员统计台账.死亡日期, 民政部门死亡人员信息共享数据.死亡日期), CURRENT_DATE) > 180)
  description: 违规判定：已掌握死亡信息且死亡超180天，但该职工公积金账户仍未销户或冻结，未启动继承提取程序。表达式采用死亡人员统计台账与民政部门数据双源确保死亡信息可靠，超过6个月视为未及时清理。部分地方政策要求单位在知晓死亡后一定期限内通知继承人办理，审计常用180天作为一般容忍上限。
  audit_item: 住房公积金账户未及时清理
  suspicion: 未向死亡人员家属退还住房公积金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十四条\",\n    \"内容概述\": \"职工死亡或者被宣告死亡的，职工的继承人、受遗赠人可以提取职工住房公积金账户内的存储余额；单位负有协助办理的义务，并应妥善保管资料。\"\n  },\n  {\n    \"法规名称\"\
    : \"住房公积金提取业务标准\",\n    \"法规文号\": \"GB/T 51353-2019\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"4.2.4\",\n    \"内容概述\"\
    : \"死亡提取"
