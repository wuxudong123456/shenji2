name: audit/登记台账类/参训台账
type: model
description: 从登记台账类类文档（参训台账）中提取结构化元数据。涵盖字段如：学员姓名、实际出勤课时、身份证号。文档范围包括：职业培训学员参训台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 参训台账
  member_count: 1
  member_details:
  - 职业培训学员参训台账
output:
  fields:
  - name: 学员姓名
    type: string
    description: 提取 学员姓名 的文本值
  - name: 实际出勤课时
    type: string
    description: 提取 实际出勤课时 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 实际上课总时长 < 规定总课时 * 0.85 || 参训台账.实际出勤课时 < 规定总课时 * 0.8 || ABS(参训台账.签到记录时间戳 - 监控记录.监控录像覆盖时段) > 15%
  description: 政策规定某职业培训最低课时（如120课时），实际完成不足85%或平均出勤低于80%属严重缩水；考勤与监控记录偏差超过15%涉嫌伪造考勤，可据此追回补贴。
  audit_item: 职业培训政策执行不到位
  suspicion: 职业培训实际时长未达规定标准
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规范性文件\",\n    \"\
    条款号\": \"第十条、第十六条\",\n    \"内容概述\": \"享受培训补贴的机构须按规定的课程和课时完成培训，对弄虚作假、虚报冒领行为将追回资金并追究责任。\"\n  }\n]"
