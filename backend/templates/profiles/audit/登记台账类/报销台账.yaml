name: audit/登记台账类/报销台账
type: model
description: 从登记台账类类文档（报销台账）中提取结构化元数据。涵盖字段如：加油频次、报销车牌号、维修日期、维修项目、金额。文档范围包括：车辆费用报销台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 报销台账
  member_count: 1
  member_details:
  - 车辆费用报销台账
output:
  fields:
  - name: 加油频次
    type: string
    description: 提取 加油频次 的文本值
  - name: 报销车牌号
    type: string
    description: 提取 报销车牌号 的文本值
  - name: 维修日期
    type: date
    description: 提取 维修日期 的日期值，格式 YYYY-MM-DD
  - name: 维修项目
    type: string
    description: 提取 维修项目 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 车辆费用报销台账.报销车牌号 NOT IN (公务用车调配登记表.公务车车牌号) AND 车辆费用报销台账.报销车牌号 = 领导人员私家车辆权属证明.车牌号 AND (车辆费用报销台账.金额 > 5000 OR 车辆费用报销台账.加油频次
    > 4)
  description: 报销车牌不在企业公务车清单内，且该车为领导本人或亲属名下，月度费用异常，即判定为公款支付私家车费用。
  audit_item: 公款用于个人支出
  suspicion: 公款报销领导私家车辆费用
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有企业负责人职务消费的指导意见\",\n    \"法规文号\": \"国资发分配〔2006〕69号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业负责人职务消费应坚持从紧必需原则，不得用于应由个人承担的费用，不得随意扩大职务消费范围或提高消费标准。\"\n  }\n]"
