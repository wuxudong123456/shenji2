name: audit/登记台账类/审核台账
type: model
description: 从登记台账类类文档（审核台账）中提取结构化元数据。涵盖字段如：不符合原因、主管部门审核完成日期、公示天数、公示照片、公示起始日期、农场名称、农户签字、发放名单生成日期。文档范围包括：家庭农场认定审核台账、补贴对象名单审核台账、补贴对象资格审核台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 人员
- 审批
- 补贴
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 审核台账
  member_count: 1
  member_details:
  - 家庭农场认定审核台账
  - 补贴对象名单审核台账
  - 补贴对象资格审核台账
output:
  fields:
  - name: 不符合原因
    type: string
    description: 提取 不符合原因 的文本值
  - name: 主管部门审核完成日期
    type: date
    description: 提取 主管部门审核完成日期 的日期值，格式 YYYY-MM-DD
  - name: 公示天数
    type: number
    description: 提取 公示天数 的数值（含单位，如万元、吨等）
  - name: 公示照片
    type: string
    description: 提取 公示照片 的文本值
  - name: 公示起始日期
    type: date
    description: 提取 公示起始日期 的日期值，格式 YYYY-MM-DD
  - name: 农场名称
    type: string
    description: 提取 农场名称 的文本值
  - name: 农户签字
    type: string
    description: 提取 农户签字 的文本值
  - name: 发放名单生成日期
    type: date
    description: 提取 发放名单生成日期 的日期值，格式 YYYY-MM-DD
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 审批人员
    type: string
    description: 提取 审批人员 的文本值
  - name: 审核依据标准名称
    type: string
    description: 提取 审核依据标准名称 的文本值
  - name: 审核对象姓名
    type: string
    description: 提取 审核对象姓名 的文本值
  - name: 审核批次
    type: string
    description: 提取 审核批次 的文本值
  - name: 审核日期
    type: date
    description: 提取 审核日期 的日期值，格式 YYYY-MM-DD
  - name: 审核状态
    type: boolean
    description: 提取 审核状态 的布尔值（是/否）
  - name: 审核结论
    type: string
    description: 提取 审核结论 的文本值
  - name: 审核通过状态
    type: boolean
    description: 提取 审核通过状态 的布尔值（是/否）
  - name: 应发金额
    type: number
    description: 提取 应发金额 的数值（含单位，如万元、吨等）
  - name: 指纹
    type: string
    description: 提取 指纹 的文本值
  - name: 申报面积
    type: string
    description: 提取 申报面积 的文本值
  - name: 补贴名单
    type: string
    description: 提取 补贴名单 的文本值
  - name: 补贴对象名单
    type: string
    description: 提取 补贴对象名单 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 银行账号
    type: string
    description: 提取 银行账号 的文本值
  - name: 附件完整度
    type: string
    description: 提取 附件完整度 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 文件存在性.文件存在性 == false || (文件存在性.经营规模量化指标 == '' || 文件存在性.农业收入占比要求 == '') || (审核台账.公示天数 < 5)
  description: 判定县级以上部门认定标准制度是否健全有效。条件1：认定标准文件完全缺失；或条件2：虽有文件但缺失经营规模、收入占比等核心量化指标导致标准虚置；或条件3：认定台账审核记录中公示天数少于法定5个工作日。任意一条触发即为疑点。
  audit_item: 家庭农场认定制度不健全
  suspicion: 县以上农业农村部门未制定家庭农场认定标准
  regulation: "[\n  {\n    \"法规名称\": \"关于实施家庭农场培育计划的指导意见\",\n    \"法规文号\": \"农政发〔2019〕16号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二条第四项\",\n    \"内容概述\": \"明确要求县以上农业农村部门制定家庭农场认定标准，建立名录系统，规范认定程序，并实行动态管理。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国行政许可法\",\n    \"法规文号\": \"主席令第七号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"行政机关作出行政许可决定，依法需要听证、招"
- expression: "((审核台账.主管部门审核完成日期 - 审核台账.乡镇上报日期) > 拨付文件.名单报送时限) \n||\n((明细表.失败日期 IS NOT NULL) AND (明细表.失败日期 - 审核台账.发放名单生成日期\
    \ > 拨付文件.发放时限))\n||\n(记录表.办结日期 IS NULL AND (当前日期 - 记录表.登记日期) > 30)"
  description: 判定逻辑：(1)从名单申报到审核完成的耗用工作日超过政策规定的报送时限，即为报送延迟；(2)发放名单生成后，因名单未传递导致银行首次发放失败日期间隔超出规定发放时限；(3)因名单错漏产生的异常情况超过30天未解决。风险等级：超时限30%以内为一般，超30%~100%为较重，超100%为严重。
  audit_item: 惠农补贴资金滞留、延压发放或长时间闲置
  suspicion: 补贴对象名单未及时报送导致补贴发放延迟
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财办〔2020〕37号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第三部分（规范补贴资金发放流程）\",\n    \"内容概述\": \"各地应明确补贴申报、审核、公示、发放各环节的工作时限，相关部门和单位应在规定时限内完成审核和名单报送工作，确保按时发放。\"\
    \n  }\n]"
- expression: 审核台账.审核状态 = '通过' && ! 是否满足政策条件（如土地承包合同缺失、非实际种粮农民等） || （明细表.存在发放记录 && 审核台账.无对应审核通过记录）
  description: 判定条件：政策文件规定的条件与补贴对象资格审核台账中的通过记录比对，若审核通过的对象未提供合规证明材料（如土地承包合同、实际种粮证明），或发放明细表中出现未经资格审核的对象，视为擅自调整补贴对象范围。需结合人工判断政策条件的具体字段。
  audit_item: 惠农财政补贴发放不到位
  suspicion: 擅自调整惠农补贴对象范围
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2017〕41号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十条\",\n    \"内容概述\": \"各级财政部门和农业主管部门应当加强对农业生产发展资金的管理和监督，不得擅自扩大或缩小资金使用范围，调整补助对象。\"\n  }\n]"
- expression: 审核台账.审核状态='通过' && 补贴项目明细表.发放状态 IS NULL） || （ABS(审核台账.应发金额 - 补贴项目明细表.发放金额) > 0.01） || （退回登记表.重新发放状态 != '已处理'
    && 退回登记表.退回金额 > 0）
  description: 判定条件1：资格审核通过的记录在发放明细表中不存在或发放状态为空，即为应发未发或漏发。判定条件2：审核台账中的应发金额与发放明细表中的实发金额不等（绝对值大于0.01元，排除角分误差），即为少发或多发。判定条件3：发放失败退回的资金未在合理期限内重新发放处理，形成实际漏发。上述条件任意满足一条即构成违规疑点。
  audit_item: 惠农财政补贴发放不到位
  suspicion: 惠农补贴资金应发未发、漏发或多发、少发
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。……（二）截留、挪用财政资金；（三）滞留应当下拨的财政资金……\"\
    \n  }\n]"
- expression: COUNTIF(明细表.身份证号) > 1 || 明细表.身份证号 LENGTH != 18 || 明细表.补贴面积 > 当地户均承包面积 * 10 || 明细表.姓名与审核台账.姓名 无法匹配
  description: 判定条件：身份证号重复出现2次及以上、身份证号位数不为18位、补贴面积超出当地户均面积10倍以上、姓名与资格台账不一致等，均表明基础数据存在严重错误或人为造假。任一条件满足即列为数据准确性质疑。
  audit_item: 惠农财政补贴发放不到位
  suspicion: 惠农补贴发放数据严重失准
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"违反规定使用、骗取财政资金的行为，包括以虚报、冒领等手段骗取财政资金等。数据造假、信息错误是虚报冒领的常见手段，应予以纠正和处罚。\"\n  }\n]"
- expression: 审核台账.附件完整度（合同、证明等） < 80% || (审核台账.附件完整度（合同、证明等） IS NULL || 明细表.审批签字 IS NULL || 登记表.公示照片 IS NULL)
  description: 判定条件：根据档案管理制度规定的必备归档材料清单，随机抽查或全查，若关键材料（如申请审批表、资格证明、公示证据）缺失比例超过20%，或某一类核心档案整体缺失，即判定为档案管理严重不规范。关键资料缺失率 = 缺失份数
    / 应归档份数。
  audit_item: 惠农财政补贴发放不到位
  suspicion: 惠农补贴发放档案管理严重缺失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国档案法\",\n    \"法规文号\": \"2020年修订版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十四条\",\n    \"内容概述\": \"国家规定应当归档的材料，必须向本单位档案机构或者档案工作人员移交，集中管理，任何个人不得拒绝归档或者据为己有。\"\n  },\n  {\n    \"法规名称\": \"会计档案管理办法\"\
    ,\n    \"法规文号\": \"财政部 国家档案局令第79号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"各单位应当加强会计档案管理工作，建立会计档案的"
- expression: ABS(SUM(银行卡号.实发金额) - SUM(银行卡号.应发金额)) > 0.01 || 资金.收款账户 NOT IN (惠农补贴专户清单) || 情况表.二次分配去向 IS NULL
  description: 实发总额与应发总额存在差异(精度0.01元)即触发；或补贴资金转入非专户账户如单位基本户、施工单位账户等；或结余资金被用于非补贴项目，无有效审批依据。
  audit_item: 监管不到位，惠农财政补贴资金被套取骗取、违规使用
  suspicion: 乡镇主管部门挤占挪用惠农补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员不得截留、挪用财政资金；违者责令改正、追回资金、给予警告或通报批评。\"\n  }\n]"
- expression: (分析表.申报面积 - 分析表.确权面积) / 分析表.确权面积 > 0.15 || (COUNT(DISTINCT 明细表.农户姓名) BY 明细表.银行卡号) > 2 || 笔迹相似度 > 0.8
  description: 申报面积超出确权面积15%以上即为虚报嫌疑；同一银行卡对应3人及以上农户补贴暗示集中冒领；签字笔迹雷同表示资料造假。
  audit_item: 监管不到位，惠农财政补贴资金被套取骗取、违规使用
  suspicion: 村集体虚报面积假借农户名义骗取套取补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业支持保护补贴资金管理办法\",\n    \"法规文号\": \"财农〔2016〕74号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"补贴资金发放要依据实际种植面积，严禁虚报、冒领。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\"\
    : \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金将受处罚。\"\n  }\n]"
- expression: (审核台账.补贴对象名单 IN (流水.资金最终流向账户与村干部关联性) AND 审核台账.不符合原因) || (COUNT(审核台账.补贴对象名单) BY 流水.资金最终流向账户与村干部关联性 > 5) || 审核台账.农户签字
  description: 村干部本人或亲属列入补贴名单，但经资格核验不满足条件；或一个村干部关联的账户集中领取5户以上补贴，疑似控制他人卡；签字或指纹经鉴定系伪造。
  audit_item: 监管不到位，惠农财政补贴资金被套取骗取、违规使用
  suspicion: 村委会村干部虚报冒领补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"严禁以虚报、冒领等手段骗取财政资金。\"\n  },\n  {\n    \"法规名称\": \"农村基层干部廉洁履行职责若干规定(试行)\",\n    \"法规文号\": \"\
    中办发〔2011〕21号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"不准在社会保障、政策扶持等事项中优亲厚友。\"\n  }\n]"
