name: audit/登记台账类/投诉台账
type: model
description: 从登记台账类类文档（投诉台账）中提取结构化元数据。涵盖字段如：投诉内容、投诉时间、涉及审批项目。文档范围包括：投诉台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 审批
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 投诉台账
  member_count: 1
  member_details:
  - 投诉台账
output:
  fields:
  - name: 投诉内容
    type: string
    description: 提取 投诉内容 的文本值
  - name: 投诉时间
    type: date
    description: 提取 投诉时间 的日期值，格式 YYYY-MM-DD
  - name: 涉及审批项目
    type: string
    description: 提取 涉及审批项目 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ((统计表.批复日期 IS NOT NULL AND DATEDIFF(统计表.批复日期, 统计表.申请日期) > 政策文件.审批时限规定) OR (统计表.批复日期 IS NULL AND DATEDIFF(CURRENT_DATE,
    统计表.申请日期) > 政策文件.审批时限规定)) && 档案.项目类型 IN ('设施农业','温室大棚','养殖场','看护房')
  description: 对于已批复项目，审批天数超过政策文件规定的最长时限（如20个工作日）的判定为违规；对于已申请但长期未批复的项目，自申请日起至审计日超过规定时限仍未处理的同样视为违规。阈值可根据地方实施细则调整，无明确规定的参照《行政许可法》20个工作日标准。
  audit_item: 相关支持政策落实不到位
  suspicion: 设施农业用地审批滞后导致项目延误
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国行政许可法\",\n    \"法规文号\": \"中华人民共和国主席令第7号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十二条\",\n    \"内容概述\": \"除当场作出行政许可决定外，行政机关应当自受理行政许可申请之日起二十日内作出行政许可决定。二十日内不能作出决定的，经本行政机关负责人批准，可以延长十日，并应当将延长期限的理由告知申请人。\"\
    \n  },\n  {\n    \"法规名称\": \"自然资源部 农业农村部关于设施农业用地管理有关问题的通知\",\n    \"法规文号\": \"自然资规〔2019〕4号\",\n    \"效力级别\":"
