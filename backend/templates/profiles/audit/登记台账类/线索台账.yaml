name: audit/登记台账类/线索台账
type: model
description: 从登记台账类类文档（线索台账）中提取结构化元数据。涵盖字段如：上报时间、举报内容摘要、举报内容涉及“牵线搭桥”“收取佣金”的关键词记录、举报时间、受理及处置结果、涉及企业名称、被举报人姓名。文档范围包括：信访举报线索台账、基层上报问题线索台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 线索台账
  member_count: 1
  member_details:
  - 信访举报线索台账
  - 基层上报问题线索台账
output:
  fields:
  - name: 上报时间
    type: date
    description: 提取 上报时间 的日期值，格式 YYYY-MM-DD
  - name: 举报内容摘要
    type: string
    description: 提取 举报内容摘要 的文本值
  - name: 举报内容涉及“牵线搭桥”“收取佣金”的关键词记录
    type: string
    description: 提取 举报内容涉及“牵线搭桥”“收取佣金”的关键词记录 的文本值
  - name: 举报时间
    type: date
    description: 提取 举报时间 的日期值，格式 YYYY-MM-DD
  - name: 受理及处置结果
    type: boolean
    description: 提取 受理及处置结果 的布尔值（是/否）
  - name: 涉及企业名称
    type: string
    description: 提取 涉及企业名称 的文本值
  - name: 被举报人姓名
    type: string
    description: 提取 被举报人姓名 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (企业法人/高管信息对照表.任职起始日期 - 领导干部离职/退休信息登记表.离职日期) < 3年 && 离职人员从业情况申报表.企业性质 IN ('民营企业','外商投资企业','中介机构') && (工商登记信息.注册地址
    ∈ 领导干部离职/退休信息登记表.分管领域 OR 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围) && (社会兼职申报.审批结果 != '批准' OR 社会兼职申报.审批结果 IS NULL)
  description: 禁业期按通常3年设定；若任职起始日期与离职日期间隔小于1095天即为在禁业期内；企业性质须为民营企业、外商投资企业或中介机构之一；业务关联判定采用地区匹配或关键词重合（审计中可设定重合度阈值>60%）；若未履行审批手续或审批不通过即触发疑点。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规接受原管辖范围内企业聘任
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"公务员辞去公职或者退休的，原系领导成员的公务员在离职三年内，不得到与原工作业务直接相关的企业或者其他营利性组织任职，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n \
    \ {\n    \"法规名称\": \"关于进一步规范党政领导干部在企业兼职（任职）问题的意见\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": "
- expression: '领导干部离职审批文件.离职日期 + 3年 >= 当前日期 && (企业法人/高管信息对照表.离职人员关联企业/中介机构名称 IN (SELECT 工商登记信息.企业名称 FROM 工商登记信息 WHERE 工商登记信息.经营范围
    LIKE ''%中介%'' OR 工商登记信息.经营范围 LIKE ''%经纪%'' OR 工商登记信息.经营范围 LIKE ''%咨询%'')) && ((银行资金流水明细表.交易摘要 LIKE ''%服务费%'' OR 银行资金流水明细表.交易摘要
    LIKE ''%佣金%'' OR 银行资金流水明细表.交易摘要 LIKE ''%居间费%'') AND 领导干部离职审批文件.管辖业务范围 '
  description: 在禁业期内，以中间人身份撮合交易并收取费用；通过企业名称或业务类型、银行流水中的佣金类收入、以及与原管辖对象的联系强度（通话频次前20%或直接出现审批加速）建立判违逻辑。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事有偿中介活动
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十六条\",\n    \"内容概述\": \"党员领导干部离职或者退（离）休后违反有关规定从事有偿中介活动，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务处分；情节严重的，给予留党察看处分。\"\n \
    \ },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百零七条\"\
    ,\n    \""
- expression: （《快速发现响应机制建设文件》 缺失） || （《预警信息处置反馈记录表》 中 （入户核实完成时间 - 接报时间） > 15个工作日） || （《线上申报系统或热线记录》 中 存在 超过10个工作日 仍为“待受理”状态的记录）
  description: 判定标准：1. 无法提供成文的机制建设文件，系统运转无据可依。2. 从发现预警到完成入户核实的全流程超15个工作日，响应效率低下。3. 线上渠道形同虚设，存在大量长期未受理的群众自主申报信息。满足任一情况，即认定快速发现和响应机制未建立或未有效运行。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 未建立或运行快速发现响应机制
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部关于进一步健全防止返贫监测帮扶机制的通知\",\n    \"法规文号\": \"农办发〔2023〕6号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"二\",\n    \"内容概述\": \"拓宽农户自主申报渠道，优化干部排查、部门筛查等方式，建立“多网合一”的快速发现机制，明确各环节办理时限，确保群众诉求及时发现、快速响应、及时办结。\"\n\
    \  }\n]"
