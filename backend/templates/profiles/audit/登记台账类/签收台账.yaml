name: audit/登记台账类/签收台账
type: model
description: 从登记台账类类文档（签收台账）中提取结构化元数据。涵盖字段如：签收人、签收日期、资金编号。文档范围包括：转移支付预算签收台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 签收台账
  member_count: 1
  member_details:
  - 转移支付预算签收台账
output:
  fields:
  - name: 签收人
    type: string
    description: 提取 签收人 的文本值
  - name: 签收日期
    type: date
    description: 提取 签收日期 的日期值，格式 YYYY-MM-DD
  - name: 资金编号
    type: string
    description: 提取 资金编号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 资金分配明细表.实际下达日期 > 资金分配明细表.规定下达截止日
  description: 制度要求自收到上级转移支付资金后X日内分解下达至下级或项目单位（具体时限依据管理办法，如一般转移支付30日内、专项转移支付90日内），实际下达日期超过规定截止日即为违规。延迟天数>0触发疑点。
  audit_item: 财政转移支付预算下达不及时、不准确
  suspicion: 转移支付资金未在规定时限内下达
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六十三条\",\n    \"内容概述\": \"中央对地方一般性转移支付在全国人民代表大会批准预算后30日内下达，专项转移支付在批准后90日内下达；省、自治区、直辖市政府接到中央转移支付后30日内下达。\"\n  }\n]"
- expression: DATEDIFF(签收台账.签收日期, 明细表.实际下达日期) > 3
  description: 签收日期与实际下达日期间隔超过3天，表明资金文件虽已印发但未及时送达接收单位，形成‘发文早、到位晚’的虚假及时下达。3天为通用合理送达时限，可根据当地管理制度调整。
  audit_item: 财政转移支付预算下达不及时、不准确
  suspicion: 转移支付资金发出后未及时签收（虚假及时下达）
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六十三条\",\n    \"内容概述\": \"要求转移支付资金在规定期限内下达，资金实际到达接收单位的时间也应在时限内，不得仅以发文时间作为下达时点。\"\n  }\n]"
