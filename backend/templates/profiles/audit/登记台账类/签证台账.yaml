name: audit/登记台账类/签证台账
type: model
description: 从登记台账类类文档（签证台账）中提取结构化元数据。涵盖字段如：变更内容、变更审批情况。文档范围包括：工程变更签证台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 审批
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 签证台账
  member_count: 1
  member_details:
  - 工程变更签证台账
output:
  fields:
  - name: 变更内容
    type: string
    description: 提取 变更内容 的文本值
  - name: 变更审批情况
    type: string
    description: 提取 变更审批情况 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (对照表.实际开工日期 IS NOT NULL) && ((对照表.规划许可证核发日期 IS NULL) || (对照表.实际开工日期 < 对照表.规划许可证核发日期) || (备案文件.实测总建筑面积 > 许可证.许可建筑面积)
    || (备案文件.实际用途 != 许可证.规划用途) || (用地位置.用地性质 != 许可证.规划用途))
  description: 任一条件成立即违规：1.规划许可证缺失；2.实际开工早于规划许可证核发；3.竣工验收实测建筑面积超出许可面积；4.实际建设用途或用地性质与规划许可不符。面积超出无容忍，任何正偏差均违规。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得规划许可或未按规划许可规定建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"中华人民共和国主席令第74号（2019修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十条、第六十四条\",\n    \"内容概述\": \"在城市、镇规划区内进行工程建设必须申请办理建设工程规划许可证。未取得许可证或未按许可规定建设的，由主管部门责令停止建设；尚可改正的限期改正，无法改正的限期拆除，并可处罚款。\"\
    \n  }\n]"
