name: audit/登记台账类/编号台账
type: model
description: 从登记台账类类文档（编号台账）中提取结构化元数据。涵盖字段如：归属代理商、终端编号。文档范围包括：彩票销售终端编号台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 编号台账
  member_count: 1
  member_details:
  - 彩票销售终端编号台账
output:
  fields:
  - name: 归属代理商
    type: string
    description: 提取 归属代理商 的文本值
  - name: 终端编号
    type: string
    description: 提取 终端编号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (信息.备案状态 != '已备案') || (信息.实际销售区域 != 审查文件.销售范围) || (代销证.代销证编号 == NULL)
  description: 代理商备案信息缺失或未备案，或实际销售区域超出合作协议批准的销售范围，或未取得有效的彩票代销证，均构成违规代理。
  audit_item: 彩票资金筹集审计常见违法违规问题
  suspicion: 违规代理销售彩票
  regulation: "[\n  {\n    \"法规名称\": \"彩票管理条例\",\n    \"法规文号\": \"国务院令第554号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十五条、第十六条\"\
    ,\n    \"内容概述\": \"彩票发行机构、销售机构可以委托其他单位代为销售彩票。委托方应当与受托方签订彩票代销合同，受托方应当取得彩票代销证。代销证应当悬挂于销售场所的显著位置。禁止未经批准擅自销售彩票。\"\n  }\n]"
