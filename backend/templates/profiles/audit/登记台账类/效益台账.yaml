name: audit/登记台账类/效益台账
type: model
description: 从登记台账类类文档（效益台账）中提取结构化元数据。涵盖字段如：实际产出、项目实际投资额、预期产出。文档范围包括：项目投资与经济效益台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 效益台账
  member_count: 1
  member_details:
  - 项目投资与经济效益台账
output:
  fields:
  - name: 实际产出
    type: string
    description: 提取 实际产出 的文本值
  - name: 项目实际投资额
    type: string
    description: 提取 项目实际投资额 的文本值
  - name: 预期产出
    type: string
    description: 提取 预期产出 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (年度预算数 / 年度预算数) > 0.15 || (CBR < 1.0)
  description: 资金闲置率=年末结余/年度预算×100%，阈值15%对应审计方法中资金闲置警戒线。CBR为成本效益比率（产出现值/投入现值），基准值应≥1，若低于1说明资金使用效益低下。任意条件触发即疑点。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 重大科技专项资金闲置或使用效益低下
  regulation: "[\n  {\n    \"法规名称\": \"财政部 科技部关于印发《中央财政科技计划（专项、基金等）后补助管理办法》的通知\",\n    \"法规文号\": \"财教〔2019〕226号\",\n    \"\
    效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条\",\n    \"内容概述\": \"项目承担单位应当建立健全财政科技资金管理制度，加快预算执行进度，提高资金使用效益。对资金使用效果差的，将减少或暂停后续支持。\"\
    \n  },\n  {\n    \"法规名称\": \"国务院关于改进加强中央财政科研项目和资金管理的若干意见\",\n    \"法规文号\": \"国发〔2014〕11号\",\n    \"效力级别\": \"行政法"
