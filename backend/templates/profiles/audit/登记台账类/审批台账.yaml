name: audit/登记台账类/审批台账
type: model
description: 从登记台账类类文档（审批台账）中提取结构化元数据。涵盖字段如：借款人姓名、借款用途、借款金额、减免金额、单次变更金额、参保记录、土地类型、审批文号。文档范围包括：保护区建设项目审批台账、农村公益性公墓用地审批台账、减免审批台账、减免非税收入审批台账、变更审批台账、小额信贷发放审批台账、建设用地审批台账、技能提升补贴申领审批台账、税收优惠审批台账、维修资金减免审批台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 审批
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 审批台账
  member_count: 1
  member_details:
  - 保护区建设项目审批台账
  - 农村公益性公墓用地审批台账
  - 减免审批台账
  - 减免非税收入审批台账
  - 变更审批台账
  - 小额信贷发放审批台账
  - 建设用地审批台账
  - 技能提升补贴申领审批台账
  - 税收优惠审批台账
  - 维修资金减免审批台账
  - 缓征审批台账
  - 缓征非税收入审批台账
output:
  fields:
  - name: 借款人姓名
    type: number
    description: 提取 借款人姓名 的数值（含单位，如万元、吨等）
  - name: 借款用途
    type: number
    description: 提取 借款用途 的数值（含单位，如万元、吨等）
  - name: 借款金额
    type: number
    description: 提取 借款金额 的数值（含单位，如万元、吨等）
  - name: 减免金额
    type: number
    description: 提取 减免金额 的数值（含单位，如万元、吨等）
  - name: 单次变更金额
    type: number
    description: 提取 单次变更金额 的数值（含单位，如万元、吨等）
  - name: 参保记录
    type: string
    description: 提取 参保记录 的文本值
  - name: 土地类型
    type: string
    description: 提取 土地类型 的文本值
  - name: 审批文号
    type: string
    description: 提取 审批文号 的文本值
  - name: 审批时长
    type: string
    description: 提取 审批时长 的文本值
  - name: 审批时间
    type: date
    description: 提取 审批时间 的日期值，格式 YYYY-MM-DD
  - name: 审批机关
    type: string
    description: 提取 审批机关 的文本值
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
  - name: 审批结果
    type: boolean
    description: 提取 审批结果 的布尔值（是/否）
  - name: 审批编号
    type: string
    description: 提取 审批编号 的文本值
  - name: 审批面积
    type: string
    description: 提取 审批面积 的文本值
  - name: 开工日期
    type: date
    description: 提取 开工日期 的日期值，格式 YYYY-MM-DD
  - name: 所有变更编号
    type: string
    description: 提取 所有变更编号 的文本值
  - name: 批准文号
    type: string
    description: 提取 批准文号 的文本值
  - name: 批准日期
    type: date
    description: 提取 批准日期 的日期值，格式 YYYY-MM-DD
  - name: 批准机关
    type: string
    description: 提取 批准机关 的文本值
  - name: 批准面积
    type: string
    description: 提取 批准面积 的文本值
  - name: 拒绝原因
    type: string
    description: 提取 拒绝原因 的文本值
  - name: 本年度申报状态
    type: date
    description: 提取 本年度申报状态 的日期值，格式 YYYY-MM-DD
  - name: 用地单位
    type: string
