  - name: 申报单位名称
    type: string
    description: 提取 申报单位名称 的文本值
  - name: 申请人姓名
    type: string
    description: 提取 申请人姓名 的文本值
  - name: 申请单位
    type: string
    description: 提取 申请单位 的文本值
  - name: 申请理由
    type: string
    description: 提取 申请理由 的文本值
  - name: 申请项目
    type: string
    description: 提取 申请项目 的文本值
  - name: 累计变更金额
    type: number
    description: 提取 累计变更金额 的数值（含单位，如万元、吨等）
  - name: 职业资格证书编号
    type: string
    description: 提取 职业资格证书编号 的文本值
  - name: 规划用途
    type: string
    description: 提取 规划用途 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (明细台账.征收金额 / 明细台账.计费数量) > (批准文件.批准标准（计费单位、单价） * 1.1) OR (明细台账.实收金额 < 批准文件.正常征收标准 AND 减免审批台账中无对应有效记录) OR (明细台账.实收金额
    > 批准文件.正常征收标准 AND 无合法调整文件)
  description: 允许标准上浮幅度设为10%（可按实际政策调整）。当实际收费标准超出批准标准上浮上限，或低于批准标准下限且无合法减免审批，或高于上限且无有效调整批准，均判定违规。擅自提高标准为常见加重负担行为，擅自降低标准可能导致财政收入流失。
  audit_item: 违反规定征收非税收入
  suspicion: 擅自提高或降低非税收入征收标准
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定擅自设立非税收入项目或者改变征收范围、标准、对象和期限。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n\
    \    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"单位和个人违反财政收入票据管理规定，或者有虚报、冒领、骗取财政收入"
- expression: (审批台账.审批机关 NOT IN ('省级人民政府', '法律规定的有权机关') AND 明细台账.减免标识 IN ('减征','免征','缓征')) OR (明细台账.应缴金额 - 明细台账.实缴金额 > 0 AND
    审批台账.申请项目 IS NULL)
  description: 非税收入减免缓征权限通常由法律、法规或省级人民政府决定。若审批机关不在合法有权机关列表内，视为越权审批；若实缴金额小于应缴金额且无法提供合法审批记录，则视为擅自减免。合法的临时性缓缴政策需与台账记录相互印证。
  audit_item: 违反规定征收非税收入
  suspicion: 违规减征、免征、缓征非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定擅自改变征收范围、标准、对象和期限，包括减征、免征、缓征。减免非税收入应当按照管理权限报批。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十五条\",\n    \"内容概述\": \"预算收入征收部门和单位，必须依照法律、行"
- expression: COUNT(审批台账.所有变更编号 GROUP BY 同一分部分项工程) > 1 && SUM(审批台账.累计变更金额) > 施工合同.合同金额*10% && MAX(审批台账.单次变更金额) < (施工合同.合同金额*10%*0.9)
  description: 对同一施工部位或分部分项在短期内多次申报小金额变更，每笔均低于合同价10%的审批门槛，但累计总额超过合同价10%，属于化整为零规避专项审批或重新招标。若单次变更金额均控制在限额的90%以下，且时间间隔小于30天，疑点等级为高。
  audit_item: 工程变更审计评估
  suspicion: 将同一变更项目化整为零规避招标或审批
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n   \
    \ \"法规文号\": \"国家发展和改革委员会令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"本规定第二条至第四条规定范围内的项目，其勘察、设计、施工"
- expression: (审批台账.审批编号 == NULL OR 权属证明.土地证号 == NULL) && 项目清单.占地面积 > 0 && (对照表.规划用地性质 != '殡葬用地' OR 影像资料.现状用途 == '农用地' OR
    影像资料.现状用途 == '林地')
  description: 判定规则：公墓已建设（项目清单中有占地），但用地审批台账或土地权属证明缺失，且实际占地不符合规划用途或涉及转用未批。触犯任一土地性质不符条件即为严重违规。
  audit_item: 农村公益性殡葬建设不符合相关规定
  suspicion: 农村公益性公墓无建设用地手续违规占地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号（2019年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十四条\",\n    \"内容概述\": \"建设占用土地，涉及农用地转为建设用地的，应当办理农用地转用审批手续。\"\n  },\n  {\n    \"法规名称\": \"殡葬管理条例\",\n\
    \    \"法规文号\": \"国务院令第225号（2012年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"建设殡葬设施，应当履行用地审批和规划许可手续，不"
- expression: (审批台账.是否符合优惠条件 && 审批台账.本年度申报状态='未申报' > 0) || (其他.减免税额=0 && 审批台账.是否符合优惠条件)
  description: 通过台账筛选出符合税收优惠条件但未进行申报备案的单位；或者检查纳税凭证中没有体现出任何减免税额，而该单位确属优惠目录范围内的，即判定违规。
  audit_item: 工程建后管护不到位
  suspicion: 农村供水工程运行管理单位未享受税收优惠
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于支持农村饮水安全工程建设运营税收政策的通知\",\n    \"法规文号\": \"财税〔2012〕30号\",\n    \"效力级别\"\
    : \"部门规范性文件\",\n    \"条款号\": \"第一条、第二条\",\n    \"内容概述\": \"对符合条件的农村饮水安全工程运营管理单位，免征契税、印花税、房产税和城镇土地使用税，企业所得税实行“三免三减半”，增值税按政策规定给予优惠。\"\
    \n  }\n]"
- expression: 审批台账.借款人姓名 LIKE '%自然人%' && (检查报告.实际资金用途描述 = '企业') && (检查报告.实际资金用途描述 NOT IN (名录.企业名称)) OR (名录.企业名称 IN (审批台账.借款人姓名)
    >= 5)
  description: 当满足以下条件之一时触发：1. 贷款申请人为农户个体，但资金经过其账户后最终转入了某企业账户，且该企业不在官方认定的帮扶企业名录中；2. 或是虽然企业在名录内，但出现了同一个小额信贷企业账户短期内收到超过5名及以上不同借款农户转账的情况，疑似集中归集农户贷款。
  audit_item: 帮扶产业配套支持政策不够精准有效
  suspicion: 小额信贷资金“户贷企用”违规使用
  regulation: "[\n  {\n    \"法规名称\": \"关于深入扎实做好过渡期脱贫人口小额信贷工作的通知\",\n    \"法规文号\": \"银保监发〔2021〕6号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"脱贫人口小额信贷要坚持户借、户用、户还，精准用于贷款户发展生产和开展经营。……坚决杜绝“户贷企用”等违规行为。\"\n  }\n]"
- expression: (项目地点位于保护范围内 && 批复文件中无对应许可) || (开工日期 < 许可证.签发日期) || (实际建设面积 > 许可面积 * 1.05)
  description: 项目在文保范围内施工但未取得文物部门批复，或未取得规划许可提前开工，或实际建设面积超出许可面积5%以上，均属违规。
  audit_item: 违反传统村落保护相关政策的行为
  suspicion: 传统村落保护项目实施方案违反用地或文保规定
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国文物保护法》\",\n    \"法规文号\": \"中华人民共和国主席令第八十一号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"文物保护单位的保护范围内不得进行其他建设工程，确需进行的须经相应人民政府批准并征得上级文物部门同意。\"\n  },\n  {\n    \"法规名称\": \"《中华人民共和国城乡规划法》\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"在城市、镇规划区内进行"
- expression: (检查记录中存在建设行为或经营行为) && (该行为对应的建设/经营活动审批记录中无审批通过记录) || (执照.经营范围包含保护区内禁止性业态，如烧烤、KTV等)
  description: 保护区内所有建设、经营活动均需审批并符合保护要求，若检查记录中存在活动但审批台账查无记录，或者营业执照核准的经营范围与保护区禁止业态冲突，即构成违规。
  audit_item: 违反传统村落保护相关政策的行为
  suspicion: 传统村落保护区内建设或经营活动审批管理不合规
  regulation: "[\n  {\n    \"法规名称\": \"《历史文化名城名镇名村保护条例》\",\n    \"法规文号\": \"国务院令第524号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二十四条\",\n    \"内容概述\": \"在保护范围内进行建设活动，应当符合保护规划的要求，依法办理审批手续。\"\n  }\n]"
- expression: 维修资金减免审批台账.减免金额 > 0 AND (维修资金减免审批台账.批准文号 IS NULL OR 主管部门的维修资金减免审批记录.政策依据文号 NOT IN (SELECT 有效依据 FROM 制度合规减免清单)
    OR 维修资金减免审批台账.减免金额/相关制度.减免上限标准 > 0.3)
  description: 存在未经合法审批的减免记录，或减免理由不在制度规定的合规减免情形内，或单户减免比例超过应缴金额30%且无特殊政策支撑的，判定为违规减免。
  audit_item: 住宅专项维修资金归集不到位
  suspicion: 主管部门违规减免住宅专项维修资金
  regulation: "[\n  {\n    \"法规名称\": \"物业管理条例\",\n    \"法规文号\": \"国务院令第379号（2018年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"住宅物业业主应当按照国家有关规定交纳专项维修资金。\"\n  },\n  {\n    \"法规名称\": \"住宅专项维修资金管理办法\",\n    \"法规文号\": \"\
    建设部、财政部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"未按本办法规定交存首期住宅专项维修资金的，开发建设单位不得将房屋交付购买人。\"\
    \n"
- expression: ((项目名称.审批面积 IS NULL OR 批准书.批准书文号 IS NULL) && (检查记录.开工状态 = '已占用')) || ((批准书.四至范围 != 许可证.红线图坐标及边界) && (ABS(批准书.批准面积
    - 权属证明.宗地面积) / 批准书.批准面积 > 0.05)) || (供应台账.受让人 != 发证台账.权利人 && 检查记录.开工状态 = '已占用')
  description: 表达式由三个或条件分支构成，触发任一即高度可疑。分支1：在审批台账或批准书缺失的情况下（未批），监察记录却显示已占用（先占），构成未批先占。分支2：实际批准的红线范围与许可的红线图不符，且权属证明的实际用地面积与批准面积偏差超过5%，构成批少占多。分支3：土地供应或登记的权利人与实际受让人（使用人）不一致，且已实际占用，构成违法转让或骗取批准后占用。
  audit_item: 未办理土地变更手续非法占用土地
  suspicion: 未经批准或骗取批准非法占用土地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第七十七条\",\n    \"内容概述\": \"未经批准或者采取欺骗手段骗取批准，非法占用土地的，由县级以上人民政府自然资源主管部门责令退还非法占用的土地，对违反土地利用总体规划擅自将农用地改为建设用地的，限期拆除在非法占用的土地上新建的建筑物和其他设施，恢复土地原状，对符合土地利用总体规划的，没收在非法占用的土地上新建的建筑物和其他设施，可以并处罚款；对非法占用土地单位的直接负责的主管人员和其他直接责任人员，依法"
- expression: (审批台账.审批机关 IN ('县级人民政府') && 规划地块文本.地块类型（基本农田/一般耕地/建设用地等） IN ('基本农田', '永久基本农田')) || (审批台账.审批机关 IN ('市级自然资源部门')
    && 审批台账.批准面积 > 35 单位=公顷 && 审批台账.土地类型（农用地/未利用地/建设用地） == '农用地') || (审批台账.审批文号 存在多次拆分记录 && SUM(审批台账.批准面积) > 对应上级机关审批权限面积阈值)
  description: 表达式核心是判断审批主体与法定权限的适配性。分支1：若审批机关为县级，却批准了基本农田类型的用地，直接触犯国务院专属权限，为严重越权。分支2：针对农用地转用，若市级审批机关一次性批准面积超过《土地管理法》规定的35公顷上限，即超权限审批。分支3：识别化整为零策略，通过追踪同一年度同一项目或同一区域立项的多宗地块，若累计审批面积超过本应上报的上级机关审批阈值，则构成实质上的超越权限。
  audit_item: 未办理土地变更手续非法占用土地
  suspicion: 违规超越审批权限审批土地
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"中华人民共和国主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十六条\",\n    \"内容概述\": \"征收下列土地的，由国务院批准：（一）永久基本农田；（二）永久基本农田以外的耕地超过三十五公顷的；（三）其他土地超过七十公顷的。征收前款规定以外的土地的，由省、自治区、直辖市人民政府批准。征收农用地的，应当依照本法第四十四条的规定先行办理农用地转用审批。其中，经国务院批准农用地转用的，同时办理征地审批手续，不再另行办理征地审批；经省、自治区、直辖市人民政府在征地批准权限"
- expression: (COUNT(数据.身份证号 NOT IN (审批台账.身份证号 WHERE 审批台账.审批状态（通过/未通过）='通过') && 数据.累计参保月数 >= 补贴对象条件（证书类型、参保月数要求).参保月数要求) >
    0 && 结余表.结余率 > 0.3) || (COUNT(审批台账.身份证号 WHERE 审批台账.审批状态（通过/未通过）='未通过' AND (审批台账.拒绝原因='材料不全' OR 审批台账.拒绝原因='不符合资格')) / COUNT(审批台账.身份证号
    WHERE 审批台账.审批状态（通过/未通过）='未通过') > 0.5 && 结余表.结余率 > 0.5)
  description: 符合申领条件（取得职业资格证书且参保累计满12个月）的人员未被发放补贴，且年度补贴资金结余率大于30%，视为存在应补未补；或者审批台账中因“材料不全”“不符合资格”等可纠正原因拒绝的比例超过50%且结余率超过50%，表明可能存在人为设置障碍或宣传不到位导致大量人员未成功申领。结余率越高违规风险越大。
  audit_item: 职业技能提升行动方案执行不到位
  suspicion: 符合条件人员未按规定享受技能提升补贴
  regulation: "[\n  {\n    \"法规名称\": \"人力资源社会保障部 财政部关于失业保险支持参保职工提升职业技能有关问题的通知\",\n    \"法规文号\": \"人社部发〔2017〕40号\",\n    \"\
    效力级别\": \"部门规章\",\n    \"条款号\": \"二、申领条件 三、审核程序\",\n    \"内容概述\": \"同时符合依法参加失业保险累计缴费12个月以上、取得职业资格证书或职业技能等级证书的，可申领技能提升补贴；审核应在规定期限内完成，补贴资金直接发放至申请人个人账户。\"\
    \n  }\n]"
