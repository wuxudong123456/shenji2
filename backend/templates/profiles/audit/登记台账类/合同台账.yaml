    type: number
    description: 提取 付款条件 的数值（含单位，如万元、吨等）
  - name: 付款条款
    type: number
    description: 提取 付款条款 的数值（含单位，如万元、吨等）
  - name: 供应商
    type: string
    description: 提取 供应商 的文本值
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 保修期
    type: string
    description: 提取 保修期 的文本值
  - name: 单价
    type: number
    description: 提取 单价 的数值（含单位，如万元、吨等）
  - name: 发放日期
    type: date
    description: 提取 发放日期 的日期值，格式 YYYY-MM-DD
  - name: 发货日期
    type: date
    description: 提取 发货日期 的日期值，格式 YYYY-MM-DD
  - name: 合同名称
    type: string
    description: 提取 合同名称 的文本值
  - name: 合同收入确认条款
