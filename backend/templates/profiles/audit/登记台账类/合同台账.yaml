  - name: 贷款状态
    type: number
    description: 提取 贷款状态 的数值（含单位，如万元、吨等）
  - name: 贷款金额
    type: number
    description: 提取 贷款金额 的数值（含单位，如万元、吨等）
  - name: 还款方式
    type: number
    description: 提取 还款方式 的数值（含单位，如万元、吨等）
  - name: 采购单价
    type: number
    description: 提取 采购单价 的数值（含单位，如万元、吨等）
  - name: 采购标的
    type: string
