    description: 提取 合同收入确认条款 的数值（含单位，如万元、吨等）
  - name: 合同租金单价
    type: number
    description: 提取 合同租金单价 的数值（含单位，如万元、吨等）
  - name: 合同签订日期
    type: date
    description: 提取 合同签订日期 的日期值，格式 YYYY-MM-DD
  - name: 合同类型
    type: string
    description: 提取 合同类型 的文本值
  - name: 合同约定租金标准
    type: string
    description: 提取 合同约定租金标准 的文本值
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 合同金额
