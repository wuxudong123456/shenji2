name: audit/登记台账类/合同台账
type: model
description: 从登记台账类类文档（合同台账）中提取结构化元数据。涵盖字段如：付款条件、付款条款、供应商、供应商名称、保修期、单价、发放日期、发货日期。文档范围包括：住房公积金贷款合同台账、合同台账、租赁合同台帐、采购合同台账、销售合同台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 付款
- 合同
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 合同台账
  member_count: 1
  member_details:
  - 住房公积金贷款合同台账
  - 合同台账
  - 租赁合同台帐
  - 采购合同台账
  - 销售合同台账
output:
  fields:
