violations:
- expression: 企业会计政策文件.收入确认标准(本期) != 企业会计政策文件.收入确认标准(上期) && 营业收入明细表.本期收入增长率 > 行业平均增长率*1.5 && (董事会决议 IS NULL || 董事会决议.批准日期
    > 收入确认标准变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE '%收入确认标准变更%'
  description: 当本期收入确认标准较上期发生改变（如由客户签收改为发货确认），且收入增长率远超行业水平，同时缺少董事会审批或审批滞后，未在附注中披露收入确认标准变更详情时，视为违规。
  audit_item: 随意变更会计处理方法
  suspicion: 随意改变收入确认标准虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业不得随意改变收入确认时间，虚列或者隐瞒收入，编制虚假利润。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"\
    财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条、第六条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。会"
- expression: (合同台账.金额 IS NULL) || (合同台账.签订日期 IS NULL) || (合同.标的 IS NULL) || (合同.数量 IS NULL) || (合同.价款 IS NULL) || (合同.履行期限
    IS NULL)
  description: 判定合同台账中金额、签订日期为空，或合同正本中标的、数量、价款、履行期限等核心条款缺失，任何一项为空即触发疑点。
  audit_item: 合同要素提取
  suspicion: 合同关键条款要素缺失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四百七十条\",\n    \"内容概述\": \"合同的内容由当事人约定，一般包括当事人的姓名或者名称和住所、标的、数量、质量、价款或者报酬、履行期限、地点和方式、违约责任和解决争议的方法。\"\n  }\n]"
- expression: (合同台账.合同类型='租赁' && (合同.合同标题 LIKE '%采购%' || 合同.合同内容关键词 LIKE '%购买%')) || (合同台账.合同类型='采购' && (合同.合同标题 LIKE '%施工%'
    || 合同.合同内容关键词 LIKE '%工程%')) || (合同台账.合同类型='借贷' && 合同.合同内容关键词 NOT LIKE '%借款%')
  description: 通过关键词匹配判定合同中约定的实质法律关系与台账登记类型不符，如将实质为采购的合同登记为租赁，将工程合同登记为采购，将非借贷合同登记为借贷等，触发疑点。
  audit_item: 合同要素提取
  suspicion: 合同类型分类错误
  regulation: "[\n  {\n    \"法规名称\": \"行政事业单位内部控制规范（试行）\",\n    \"法规文号\": \"财会〔2012〕21号\",\n    \"效力级别\": \"制度文件\",\n    \"\
    条款号\": \"第四十七条\",\n    \"内容概述\": \"单位应当建立健全合同管理制度，明确合同归口管理部门，对合同实施统一管理。\"\n  }\n]"
- expression: ((合同台账.供应商 股东/高管 集合 ∩ 合同台账.客户名称 股东/高管 集合)≠∅) && (合同台账.采购标的 == 合同台账.销售标的) && ( (合同台账.销售单价 - 合同台账.采购单价) / 合同台账.采购单价
    ≤ 0.02 ) && ( |合同台账.签订日期 - 合同台账.签订日期| ≤ 30天 )
  description: 判定条件：①采购供应商与销售客户的显名股东或高级管理人员存在交集（≥1人），构成实质关联；②同一标的物一进一出；③贸易毛利率≤2%，远低于正常商业利润，缺乏商业实质；④采购与销售合同签署时间间隔≤30天，呈现资金过账特征。满足全部条件即触发重大虚假贸易疑点，风险等级高。
  audit_item: 虚假贸易审计
  suspicion: 上下游关联方交易缺乏商业实质
  regulation: "[\n  {\n    \"法规名称\": \"关于规范中央企业贸易管理严禁各类虚假贸易的通知\",\n    \"法规文号\": \"国资发财评规〔2023〕74号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"不准参与特定利益关系企业间开展的无商业目的的贸易业务，严禁上下游为同一控制人或存在特定利益关系的空转贸易。\"\n  }\n]"
- expression: ( (合同台账.预付款比例 >= 0.8) && ( NOW() - 合同台账.约定交货日期 > 90天 ) && ( 入库单.对应采购合同编号 记录为空 ) ) || ( (合同台账.收款条件（赊销） == '赊销')
    && ( NOW() - 合同台账.约定交货日期 > 180天 ) && ( 明细账.金额 > 0 ) && ( 出库单.对应销售合同编号 记录为空 ) )
  description: 采购端：预付款比例≥80%，且超过约定交货期90天仍未收到货物，同时系统内无任何对应入库记录，表明资金已付出但实物流未发生，高度疑似融资性贸易。销售端：赊销方式下货物声称已交付超过180天，应收账款仍未收回，且无出库单流转记录，表明货权未真实转移，疑似空转贸易。任一条件满足即触发疑点，预付款情形风险等级高。
  audit_item: 虚假贸易审计
  suspicion: 大额预付款无货物交付或应收账款长期无回收
  regulation: "[\n  {\n    \"法规名称\": \"关于规范中央企业贸易管理严禁各类虚假贸易的通知\",\n    \"法规文号\": \"国资发财评规〔2023〕74号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条、第四条\",\n    \"内容概述\": \"严禁以贸易业务为名从事融资性贸易，严禁开展对交易标的没有控制权的空转贸易。\"\n  }\n]"
- expression: （ABS(销售合同台账.销售单价 - 同期同类产品销售价格明细表.同类产品同期平均销售单价) / 同期同类产品销售价格明细表.同类产品同期平均销售单价 > 0.15 ) && (定价审批单.申请折扣率 IS NULL
    OR 定价审批单.审批意见 != '集体决策通过') && 关联方关系清单.客户名称 = 销售合同台账.客户名称
  description: 筛选销售单价低于同期同类产品平均销售单价85%（即偏差率超过15%）的合同，且无集体决策审批记录或审批缺失，同时客户为关联方的交易，判定为异常。阈值15%参考除正常商业折扣外需说明定价公允性的通用标准。若客户非关联方但折扣异常且无合理审批，同样可视为疑点，需结合其他条件判断。
  audit_item: 销售与采购合同审计
  suspicion: 销售合同价格明显低于同期市场均价
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五百零九条\",\n    \"内容概述\": \"当事人应当按照约定全面履行自己的义务。若存在不合理低价交易损害国家利益或企业利益，可能构成违背诚实信用原则。\"\n  },\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\"\
    ,\n    \"法规文号\": \"国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"企业资产交易涉及关联交易的，应当"
- expression: 采购合同台账.采购金额 >= 企业内部采购管理制度.强制招标金额起点 && (采购方式审批单.审批方式 != '招标' || 采购方式审批单 IS NULL) && 中标通知书 IS NULL
  description: 当采购合同金额达到企业制度规定的强制招标起点时，如果采购方式审批单显示为非招标方式或无审批记录，且无法提供有效中标通知书，即判定为应招未招。需特别注意是否存在化整为零规避招标的情况。
  audit_item: 销售与采购合同审计
  suspicion: 采购合同未经招标直接签订
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三条\",\n    \"内容概述\": \"在中华人民共和国境内进行的大型基础设施、公用事业等关系社会公共利益、公众安全的项目，全部或者部分使用国有资金投资或者国家融资的项目，以及使用国际组织或者外国政府贷款、援助资金的项目，其采购必须进行招标。\"\
    \n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n    \"法规文号\": \"国家发展改革委令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条"
- expression: 采购合同台账.统一社会信用代码 IN (供应商黑名单库.统一社会信用代码) && 采购合同台账.合同签订日期 >= 供应商黑名单库.生效日期 && (采购合同台账.合同签订日期 <= 供应商黑名单库.截止日期 OR
    供应商黑名单库.截止日期 IS NULL) && (供应商资质审查表.审查结论 != '合格' || 供应商资质审查表 IS NULL)
