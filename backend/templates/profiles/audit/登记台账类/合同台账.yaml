  - name: 销售标的
    type: string
    description: 提取 销售标的 的文本值
  - name: 预付款支付日期
    type: date
    description: 提取 预付款支付日期 的日期值，格式 YYYY-MM-DD
  - name: 预付款比例
    type: number
