name: audit/登记台账类/资质台账
type: model
description: 从登记台账类类文档（资质台账）中提取结构化元数据。涵盖字段如：客户ID、客户名称、有效期止、有效期起、资质类型、资质证书编号。文档范围包括：客户资质台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 资质台账
  member_count: 1
  member_details:
  - 客户资质台账
output:
  fields:
  - name: 客户ID
    type: string
    description: 提取 客户ID 的文本值
  - name: 客户名称
    type: string
    description: 提取 客户名称 的文本值
  - name: 有效期止
    type: string
    description: 提取 有效期止 的文本值
  - name: 有效期起
    type: string
    description: 提取 有效期起 的文本值
  - name: 资质类型
    type: string
    description: 提取 资质类型 的文本值
  - name: 资质证书编号
    type: string
    description: 提取 资质证书编号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (燃气销售流向登记表.客户ID NOT IN (客户资质台账.客户ID WHERE 资质类型='燃气经营许可证')) || (客户资质台账.有效期起 > 燃气销售流向登记表.销售日期 OR 客户资质台账.有效期止 <
    燃气销售流向登记表.销售日期)
  description: 销售记录对应的客户在资质台账中不存在有效的燃气经营许可证，或资质有效期未覆盖销售日期，即判定为违规。未取得资质包括无证和资质过期。
  audit_item: 销售业务管理方面存在的问题
  suspicion: 违规向未取得资质单位或个人销售燃气
  regulation: "[\n  {\n    \"法规名称\": \"城镇燃气管理条例\",\n    \"法规文号\": \"国务院令第666号（2016年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十八条第（八）项\",\n    \"内容概述\": \"燃气经营者不得向未取得燃气经营许可证的单位或者个人提供用于经营的燃气。\"\n  }\n]"
