name: audit/登记台账类/出让台账
type: model
description: 从登记台账类类文档（出让台账）中提取结构化元数据。涵盖字段如：出让方式、受让人、土地用途、地块编号。文档范围包括：土地出让台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 出让台账
  member_count: 1
  member_details:
  - 土地出让台账
output:
  fields:
  - name: 出让方式
    type: string
    description: 提取 出让方式 的文本值
  - name: 受让人
    type: string
    description: 提取 受让人 的文本值
  - name: 土地用途
    type: string
    description: 提取 土地用途 的文本值
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (政府储备用地清单.规划用途 IN ('居住','保障性住房') OR 政府储备用地清单.规划用途 = '保障房优先') && 政府储备用地清单.地块编号 NOT IN (SELECT 地块编号 FROM 保障性安居工程供地明细表)
    && (政府储备用地实际使用情况对比表.实际用途 = '商品住宅' || 政府储备用地实际使用情况对比表.实际用途 = '商业开发' || 土地出让台账.受让人 != '保障房建设主体')
  description: 收回或储备地块规划可用于保障房建设，但未列入保障房供地明细表，且已实际用于商品住宅或商业开发，或受让人非保障房建设单位，即判定为未优先用于保障房。
  audit_item: 保障性安居工程项目建设用地未落实
  suspicion: 储备或收回土地未优先用于保障房建设
  regulation: "[\n  {\n    \"法规名称\": \"关于保障性安居工程用地供应管理的通知\",\n    \"法规文号\": \"国土资发〔2011〕218号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"通知正文相关要求\",\n    \"内容概述\": \"收回的国有建设用地和储备土地应当优先安排用于保障性安居工程建设，不得擅自改变用途或用于商业开发。\"\n  }\n]"
