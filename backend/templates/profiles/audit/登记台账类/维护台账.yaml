name: audit/登记台账类/维护台账
type: model
description: 从登记台账类类文档（维护台账）中提取结构化元数据。涵盖字段如：停机时长、响应时间、完成状态、实际月处理量、工单编号、生物处理效果异常记录、维护项目实际支出金额、药剂投加频率。文档范围包括：污水处理设施运行维护台账、灌溉设施运行维护台账、运行维护台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 维护台账
  member_count: 1
  member_details:
  - 污水处理设施运行维护台账
  - 灌溉设施运行维护台账
  - 运行维护台账
output:
  fields:
  - name: 停机时长
    type: string
    description: 提取 停机时长 的文本值
  - name: 响应时间
    type: date
    description: 提取 响应时间 的日期值，格式 YYYY-MM-DD
  - name: 完成状态
    type: boolean
    description: 提取 完成状态 的布尔值（是/否）
  - name: 实际月处理量
    type: string
    description: 提取 实际月处理量 的文本值
  - name: 工单编号
    type: string
    description: 提取 工单编号 的文本值
  - name: 生物处理效果异常记录
    type: string
    description: 提取 生物处理效果异常记录 的文本值
  - name: 维护项目实际支出金额
    type: number
    description: 提取 维护项目实际支出金额 的数值（含单位，如万元、吨等）
  - name: 药剂投加频率
    type: string
    description: 提取 药剂投加频率 的文本值
  - name: 设备故障类型
    type: string
    description: 提取 设备故障类型 的文本值
  - name: 运维起始日期
    type: date
    description: 提取 运维起始日期 的日期值，格式 YYYY-MM-DD
  - name: 运行时长
    type: string
    description: 提取 运行时长 的文本值
  - name: 闲置时段
    type: string
    description: 提取 闲置时段 的文本值
  - name: 首次投运记录
    type: string
    description: 提取 首次投运记录 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (维护台账.维护项目实际支出金额 / 支出明细.维护经费预算金额 < 0.2) || (支出明细.实际拨付金额 / 支出明细.维护经费预算金额 < 0.8) || (支出明细.维护经费预算金额 < 15%)
  description: 根据《水利工程维修养护定额标准》，维护经费占比不宜过低。若实际用于设施维护的支出低于总运行维护预算的20%，或预算到位率低于80%，或维护经费占财政拨款比例低于15%，则触发疑点。
  audit_item: 大中型灌区运行管护和取水用水不符合相关规定
  suspicion: 灌区运行维护经费保障不足
  regulation: "[\n  {\n    \"法规名称\": \"水利工程管理体制改革实施意见\",\n    \"法规文号\": \"国办发〔2002〕45号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第四部分（保障措施）\",\n    \"内容概述\": \"要合理测算和安排维修养护经费，确保工程正常运行。\"\n  }\n]"
- expression: (维护项目.响应时间 > 7天) || (维护项目.完成状态 < 90%) || (验收报告.整改闭环情况 < 70%) || (维修项目.修复日期 > 365天)
  description: 审计设定：报修日至修复日大于7天为响应延迟；年度维修工单完成率低于90%表明存在积压；检查报告指出的问题在规定时限内未整改闭环的比例超过30%为严重；台账中存在超过1年未修复记录即违规。
  audit_item: 大中型灌区运行管护和取水用水不符合相关规定
  suspicion: 灌区管理机构维修管护职责履行不到位
  regulation: "[\n  {\n    \"法规名称\": \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十七条\"\
    ,\n    \"内容概述\": \"运行维护主体应当履行维修养护责任，保证工程正常运行。\"\n  }\n]"
- expression: (SUM(维护台账.实际月处理量)/其他.设计处理能力 < 0.1 AND 维护台账.闲置时段 >= 3) OR (明细表.资金支出明细 > 80% AND 其他.设计处理能力 = 0)
  description: 当设施处理量连续3个月低于设计能力的10%或几乎无处理量，或资金高度集中于少数示范点而偏远区域零覆盖，表明项目盲目建设、形成闲置或选择性投建，属于形象工程。
  audit_item: 污水治理项目建设、运营、管护不到位
  suspicion: 盲目推进污水治理项目形成形象工程
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\"\
    ,\n    \"内容概述\": \"政府投资项目必须符合国民经济和社会发展规划、国土空间规划等，开展可行性研究，保证科学决策，不得建设形象工程或脱离实际需要的项目。\"\n  }\n]"
- expression: (汇总表.实际进水水质 > 技术方案.设计进出水水质 * 1.5 AND 汇总表.出水达标率 < 60%) OR (研究报告.专家论证意见 AND 技术方案.采纳情况) OR (技术方案.工艺类型 < 2)
  description: 实际进水水质严重偏离设计值且出水长期不达标，或专家意见已指出技术缺陷但仍被采用，或未进行多方案比选，均表明技术选择不科学，导致处理效果达不到预期。
  audit_item: 污水治理项目建设、运营、管护不到位
  suspicion: 污水处理技术模式与当地水质及环境条件不匹配
  regulation: "[\n  {\n    \"法规名称\": \"城镇排水与污水处理条例\",\n    \"法规文号\": \"国务院令第641号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"城镇排水与污水处理设施建设，应当符合城镇排水与污水处理规划，并执行国家规定的建设程序和技术标准，工艺选择应合理可行，满足处理要求。\"\n  }\n]"
- expression: (其他.竣工日期至维护台账.运维起始日期的间隔 > 60天) OR (维护台账.首次投运记录后90天内累计故障停机时间/总运行时间 > 0.3) OR (运维移交条款.运维费用预算及承担主体 / 项目总投资 < 0.03
    AND 项目总投资 > 500万元)
  description: 工程竣工后60天以上未移交运维，或投运初期频繁故障且维修响应滞后，或运维预算占总投资的比重低于3%且投资额较大，说明建设阶段未同步安排运行维护保障，存在脱节风险。
  audit_item: 污水治理项目建设、运营、管护不到位
  suspicion: 污水处理厂站建设与运维脱节导致闲置或停运
  regulation: "[\n  {\n    \"法规名称\": \"城镇排水与污水处理条例\",\n    \"法规文号\": \"国务院令第641号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"城镇排水与污水处理设施竣工验收后，建设单位应当及时向城镇排水主管部门移交完整的竣工资料，并明确维修养护单位，确保建成后正常运行。\"\n  }\n]"
