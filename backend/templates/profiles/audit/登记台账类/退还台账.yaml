name: audit/登记台账类/退还台账
type: model
description: 从登记台账类类文档（退还台账）中提取结构化元数据。涵盖字段如：供应商名称、保证金收取金额、保证金类型、实际扣留金额、实际退还日期、已退金额、应退还日期、应退金额。文档范围包括：保证金收取退还台账、质量保证金退还台账、贷款保证金收取退还台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 退还台账
  member_count: 1
  member_details:
  - 保证金收取退还台账
  - 质量保证金退还台账
  - 贷款保证金收取退还台账
output:
  fields:
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 保证金收取金额
    type: number
    description: 提取 保证金收取金额 的数值（含单位，如万元、吨等）
  - name: 保证金类型
    type: string
    description: 提取 保证金类型 的文本值
  - name: 实际扣留金额
    type: number
    description: 提取 实际扣留金额 的数值（含单位，如万元、吨等）
  - name: 实际退还日期
    type: date
    description: 提取 实际退还日期 的日期值，格式 YYYY-MM-DD
  - name: 已退金额
    type: number
    description: 提取 已退金额 的数值（含单位，如万元、吨等）
  - name: 应退还日期
    type: date
    description: 提取 应退还日期 的日期值，格式 YYYY-MM-DD
  - name: 应退金额
    type: number
    description: 提取 应退金额 的数值（含单位，如万元、吨等）
  - name: 开发企业名称
    type: string
    description: 提取 开发企业名称 的文本值
  - name: 收取日期
    type: date
    description: 提取 收取日期 的日期值，格式 YYYY-MM-DD
  - name: 收取金额
    type: number
    description: 提取 收取金额 的数值（含单位，如万元、吨等）
  - name: 未退余额
    type: number
    description: 提取 未退余额 的数值（含单位，如万元、吨等）
  - name: 约定退还日期
    type: date
    description: 提取 约定退还日期 的日期值，格式 YYYY-MM-DD
  - name: 贷款金额
    type: number
    description: 提取 贷款金额 的数值（含单位，如万元、吨等）
  - name: 贷款项目
    type: number
    description: 提取 贷款项目 的数值（含单位，如万元、吨等）
  - name: 退还日期
    type: date
    description: 提取 退还日期 的日期值，格式 YYYY-MM-DD
  - name: 退还金额
    type: number
    description: 提取 退还金额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (退还台账.收取金额 / 调整后的装修标准.合同金额 > 0.05) || (退还台账.实际退还日期 > 退还台账.应退还日期 + 15 && 退还台账.实际退还日期 IS NOT NULL) || (退还台账.应退还日期
    < '审计基准日' && 退还台账.实际退还日期 IS NULL)
  description: 判定条件一：对中小企业供应商，保证金收取比例超过合同金额的5%，判定为超标收取。判定条件二：延迟退还，即实际退还日期晚于合同/规定应退还日期后15个工作日。判定条件三：截至审计日，已满足退还条件但仍未退还，即长期挂账未退。以上任一条件触发，即为违规。
  audit_item: 未按规定落实降成本政策措施
  suspicion: 超标准收取保证金或未及时退还
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"机关、事业单位和大型企业应当按照合同约定及时退还保证金，不得非法占用。除依法设立投标保证金、履约保证金、工程质量保证金、农民工工资保证金外，不得设立其他保证金。保证金的收取比例应当符合国家有关规定。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步强化质量保证金管理的通知\",\n    \"法规文号\": \"建质[2017]138号\",\n    \"效力级别\": \"部门规章\""
- expression: (贷款保证金收取退还台账.保证金收取金额 > 0) && ( (与房地产开发企业签订的按揭合作协议.约定保证金比例 IS NULL) || (与房地产开发企业签订的按揭合作协议.约定保证金比例 == 0) || (与房地产开发企业签订的按揭合作协议.合作楼盘名称
    IS NULL) ) || (贷款保证金收取退还台账.保证金收取金额 / 贷款保证金收取退还台账.贷款金额 > 与房地产开发企业签订的按揭合作协议.约定保证金比例) || (贷款保证金收取退还台账.未退余额 > 0 && (当前日期 -
    贷款保证金收取退还台账.约定退还日期) > 0)
  description: 筛查三类违规：1.无合同依据或合同未约定保证金却实际收取；2.收取金额超过合同约定比例上限；3.贷款结清后超过约定退还日期仍未退还保证金。设定阈值：收取比例上限以合同为准，无约定则视为禁止收取；超期退还判定以约定日期为红线，当前日期大于约定退还日期且余额大于零即触发。
  audit_item: 住房公积金管理机构违规收取费用
  suspicion: 违规向房地产开发企业收取贷款保证金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十条\",\n    \"内容概述\": \"住房公积金管理中心的管理费用，由住房公积金管理中心按照规定的标准编制全年预算支出总额，报本级人民政府财政部门批准后，从住房公积金增值收益中上交本级财政，由本级财政拨付。住房公积金管理中心不得向管理对象收取任何费用。\"\
    \n  },\n  {\n    \"法规名称\": \"关于发展住房公积金个人住房贷款业务的通知\",\n    \"法规文号\": \"建金[2014]148号\",\n    \"效力级别\""
