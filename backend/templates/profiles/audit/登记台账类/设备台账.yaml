name: audit/登记台账类/设备台账
type: model
description: 从登记台账类类文档（设备台账）中提取结构化元数据。涵盖字段如：仪器精度指标、存放地点、投运年限、校准有效期、设备可检测项目、设备型号、设备校准状态、设备状态。文档范围包括：仪器设备台账、种子质量检测设备台账、老旧设备台账、设施设备台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 设备台账
  member_count: 1
  member_details:
  - 仪器设备台账
  - 种子质量检测设备台账
  - 老旧设备台账
  - 设施设备台账
output:
  fields:
  - name: 仪器精度指标
    type: string
    description: 提取 仪器精度指标 的文本值
  - name: 存放地点
    type: string
    description: 提取 存放地点 的文本值
  - name: 投运年限
    type: string
    description: 提取 投运年限 的文本值
  - name: 校准有效期
    type: string
    description: 提取 校准有效期 的文本值
  - name: 设备可检测项目
    type: string
    description: 提取 设备可检测项目 的文本值
  - name: 设备型号
    type: string
    description: 提取 设备型号 的文本值
  - name: 设备校准状态
    type: boolean
    description: 提取 设备校准状态 的布尔值（是/否）
  - name: 设备状态
    type: boolean
    description: 提取 设备状态 的布尔值（是/否）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (检测报告.具体部位使用的检测方法 使用 '钢尺/读数显微镜' && 对应病害位置 == '主梁关键受力区') || (检测报告.具体部位使用的检测方法 使用 '频率法' && 未附 '标定参数' ) || (设备台账.校准有效期
    < 检测实施日期)
  description: 钢结构疲劳裂缝检测精度要求高，使用钢尺无法捕获微观裂纹；索力测试若无标定参数则计算模型不可靠。使用过期或未经校准的设备出具的数据为无效数据。
  audit_item: 道路桥梁安全定期检测审计
  suspicion: 检测方法未达标准要求
  regulation: "[\n  {\n    \"法规名称\": \"公路桥梁承载能力检测评定规程\",\n    \"法规文号\": \"JTG/T J21-2011\",\n    \"效力级别\": \"行业规范\",\n   \
    \ \"条款号\": \"5.2/5.3\",\n    \"内容概述\": \"详细规定了结构几何参数、裂缝宽度、混凝土强度、索力等的检测方法及精度要求，例如裂缝宽度应采用读数显微镜或裂缝测宽仪，钢构件裂纹应采用磁粉探伤或超声检测。\"\
    \n  }\n]"
- expression: ( ＜投运年限.实际更新状态＞ = '未更新' ) && ( ＜投运年限.投运年限＞ > ＜最长允许使用年限.最长允许使用年限＞ ) && ( ＜投运年限.计划更新日期＞ <= 当前日期 )
  description: 设备投运年限已超过技术标准规定的淘汰年限，且原计划更新日期已经逾期仍未实施更新的，即判定为更新缓慢。同时也可辅助计算更新完成率，若年度更新完成率低于计划的80%亦为严重滞后。
  audit_item: 农村电网巩固提升工程存在短板
  suspicion: 老旧电网设备更新改造滞后
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改办能源〔2013〕1553号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第二十条\",\n    \"内容概述\": \"要求优先改造高损耗、超期运行的老旧设备，提升电网设备健康水平和能效。\"\n  }\n]"
- expression: (在编专职监管人员数.在编专职监管人员数 / (辖区种子企业数 * 0.3) < 1) || (专业技术人员占比 < 0.5) || (预算批复金额.实际支出金额 / 预算批复金额.预算批复金额 < 0.8) ||
    (设备台账.设备可检测项目 < 应检项目数 * 0.8)
  description: 人员充足率使用参考系数0.3，低于1即视为监管力量不足；专业技术人员占监管人员比例低于50%为能力薄弱；经费到位率低于80%或设备缺失20%以上关键检测项目，均判定为保障不足。任意条件满足即触发疑点。
  audit_item: 种业市场监管方面不符合相关规定
  suspicion: 种业监管机构检测能力或人员经费保障不足
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"中华人民共和国主席令第三十五号（2015年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第六十九条\",\n    \"内容概述\": \"国家加强种子执法能力建设。县级以上地方人民政府应当保障种子执法所需经费，配备与种子市场监管任务相适应的执法人员。省级以上人民政府应当支持种子执法条件和装备建设。\"\
    \n  }\n]"
- expression: (设施设备台账.设备状态='闲置' 的设备数量 / 设施设备采购清单.采购总数量 > 0.3) || ((COUNT(管护人员配置及巡查记录统计表.巡查日期) / DATEDIFF(项目结束日期, 项目开始日期) <
    管护责任书及制度办法.约定巡查频次 * 0.5) && 设施设备台账.设备状态='损毁')
  description: 设施设备闲置率超过30%，反映资产严重浪费；当实际巡查频次低于合同约定频次的50%时，与其关联的设施设备出现损毁状态，直接证明管护失职与资产物理损毁的强因果关系。
  audit_item: 黑土地保护治理缺少持续性，后期管护不到位
  suspicion: 设施设备因管护机制缺失导致大量闲置或损毁
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十一条\",\n    \"内容概述\": \"项目建成后，应当按照‘谁受益、谁管护’的原则，明确管护主体、落实管护责任、保障管护经费，确保项目设施正常运行并长期发挥效益。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作"
