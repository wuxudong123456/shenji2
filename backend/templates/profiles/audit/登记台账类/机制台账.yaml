name: audit/登记台账类/机制台账
type: model
description: 从登记台账类类文档（机制台账）中提取结构化元数据。涵盖字段如：实际带动增收金额、承诺增收幅度、承诺带动农户数。文档范围包括：联农带农利益联结机制台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 机制台账
  member_count: 1
  member_details:
  - 联农带农利益联结机制台账
output:
  fields:
  - name: 实际带动增收金额
    type: number
    description: 提取 实际带动增收金额 的数值（含单位，如万元、吨等）
  - name: 承诺增收幅度
    type: string
    description: 提取 承诺增收幅度 的文本值
  - name: 承诺带动农户数
    type: string
    description: 提取 承诺带动农户数 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 对比表.实际完成产值 < 批复文件.规划产值目标 OR 对比表.完成率 < 1 OR ABS(其他.自评完成产值 - 验收报告.验收认定产值)/验收报告.验收认定产值 > 0.1
  description: 当实际产值低于立项文件或任务书规定的目标产值，或自评报告产值与验收报告产值偏差超过10%时判为疑点。完成率<100%即为未完全达标，低于80%为严重未达标。联农带农承诺未兑现时同步计入成效不实疑点。
  audit_item: 现代农业产业园（集群、强镇）目标任务未完成
  suspicion: 现代农业产业园产值目标未实现
  regulation: "[\n  {\n    \"法规名称\": \"关于开展国家现代农业产业园创建工作的通知\",\n    \"法规文号\": \"农计发〔2017〕13号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"五、保障措施（三）加强考核评价\",\n    \"内容概述\": \"建立产业园创建考核评价机制，对创建进展、目标完成情况进行动态监测和绩效评价，未完成目标任务的要限期整改或取消创建资格。\"\n  }\n\
    ]"
