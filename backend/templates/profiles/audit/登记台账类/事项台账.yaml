name: audit/登记台账类/事项台账
type: model
description: 从登记台账类类文档（事项台账）中提取结构化元数据。涵盖字段如：与被担保方关系、担保编号、担保金额、被担保方、资产编号。文档范围包括：国有资产担保事项台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 资产
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 事项台账
  member_count: 1
  member_details:
  - 国有资产担保事项台账
output:
  fields:
  - name: 与被担保方关系
    type: string
    description: 提取 与被担保方关系 的文本值
  - name: 担保编号
    type: string
    description: 提取 担保编号 的文本值
  - name: 担保金额
    type: number
    description: 提取 担保金额 的数值（含单位，如万元、吨等）
  - name: 被担保方
    type: string
    description: 提取 被担保方 的文本值
  - name: 资产编号
    type: string
    description: 提取 资产编号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (担保合同.审批单 == null || 批复文件 == null) || (被担保方 IN (关联方清单) && 事项台账.与被担保方关系 IN ('个人关联', '子公司高管持股')) || (担保金额 > 净资产
    * 0.1)
  description: 判定逻辑：1. 担保行为无内部审批或上级财政审批；2. 为本单位或个人的关联企业提供担保；3. 对外担保总额超过企业净资产10%的警戒线（可结合公司章程调整）。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规利用国有资产对外担保
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十五条\",\n    \"内容概述\": \"未经履行出资人职责的机构同意，国有独资企业、国有独资公司不得为关联方提供担保。\"\n  },\n  {\n    \"法规名称\": \"关于规范国有企业对外担保行为的意见\"\
    ,\n    \"法规文号\": \"银监发〔2004〕24号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二点\",\n    \"内容概述\": \"国有企业对外担保必须严格履行内部审批程序，严"
