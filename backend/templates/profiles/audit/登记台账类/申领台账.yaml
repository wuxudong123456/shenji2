name: audit/登记台账类/申领台账
type: model
description: 从登记台账类类文档（申领台账）中提取结构化元数据。涵盖字段如：住房情况、免疫疫苗种类、养殖场名称、受益人身份证号、姓名、家庭人口、户主姓名、改造内容。文档范围包括：农村危房改造补贴申领台账、各类补贴申领台账、垦区危房改造补贴申领台账、强制免疫疫苗补贴申领台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 补贴
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 申领台账
  member_count: 1
  member_details:
  - 农村危房改造补贴申领台账
  - 各类补贴申领台账
  - 垦区危房改造补贴申领台账
  - 强制免疫疫苗补贴申领台账
output:
  fields:
  - name: 住房情况
    type: string
    description: 提取 住房情况 的文本值
  - name: 免疫疫苗种类
    type: string
    description: 提取 免疫疫苗种类 的文本值
  - name: 养殖场名称
    type: string
    description: 提取 养殖场名称 的文本值
  - name: 受益人身份证号
    type: string
    description: 提取 受益人身份证号 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 家庭人口
    type: string
    description: 提取 家庭人口 的文本值
  - name: 户主姓名
    type: string
    description: 提取 户主姓名 的文本值
  - name: 改造内容
    type: string
    description: 提取 改造内容 的文本值
  - name: 申报房屋地址
    type: string
    description: 提取 申报房屋地址 的文本值
  - name: 申请人姓名
    type: string
    description: 提取 申请人姓名 的文本值
  - name: 申领单位
    type: string
    description: 提取 申领单位 的文本值
  - name: 申领数量
    type: number
    description: 提取 申领数量 的数值（含单位，如万元、吨等）
  - name: 申领时间
    type: date
    description: 提取 申领时间 的日期值，格式 YYYY-MM-DD
  - name: 补贴期间
    type: string
    description: 提取 补贴期间 的文本值
  - name: 补贴类型
    type: string
    description: 提取 补贴类型 的文本值
  - name: 补贴金额
    type: number
    description: 提取 补贴金额 的数值（含单位，如万元、吨等）
  - name: 贫困类型
    type: string
    description: 提取 贫困类型 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (COUNT(DISTINCT 申领台账.养殖场名称) / COUNT(DISTINCT 库.养殖场名称)) < 政策文件.覆盖率目标值
  description: 以政策文件规定的覆盖率目标值（如≥80%）为基准，实际参与“先打后补”的规模场数量占全部规模场的比率低于目标值即判定为覆盖率低；若比率低于50%视为严重不达标。
  audit_item: 落实动物防疫不到位
  suspicion: 强制免疫疫苗“先打后补”政策覆盖率低
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国动物防疫法\",\n    \"法规文号\": \"主席令第69号（2021年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十六条\",\n    \"内容概述\": \"饲养动物的单位和个人应当履行动物疫病强制免疫义务，国家对严重危害养殖业生产和人体健康的动物疫病实施强制免疫。\"\n  },\n  {\n    \"法规名称\": \"\
    关于深入推进动物疫病强制免疫补助政策实施机制改革的通知\",\n    \"法规文号\": \"农办牧〔2021〕53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、（一）全面推进“先打后补”\""
- expression: (表5.申请人身份证号 NOT IN (垦区职工名单)) || (表5.改造前后对比照片相同或无验收签字) || (表5.同一房屋地址重复申请) || (表1.该家庭已享受其他住房保障补贴)
  description: 申领人非垦区在职或退休职工，身份不符；危房改造验收资料缺失或照片显示无明显改造痕迹，表明未实际改造；同一地址在不同年份或不同项目重复出现；家庭已享受过其他保障性住房补贴，重复享受应禁止。任一条件触发疑点。
  audit_item: 不符合条件的家庭违规获取住房保障待遇
  suspicion: 非垦区职工或未实际改造骗取垦区危房补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业部 国家发展改革委 住房城乡建设部关于做好农垦危房改造工作的意见\",\n    \"法规文号\": \"农垦发〔2011〕3号\",\n    \"效力级别\"\
    : \"部门规范性文件\",\n    \"条款号\": \"三、严格对象审核\",\n    \"内容概述\": \"严格审核申请对象资格，垦区危房改造资金必须用于垦区职工危房改造，不得虚报冒领。\"\n  }\n]"
- expression: (农村危房改造补贴申领台账.身份证号 NOT IN (民政部门贫困户建档立卡数据.贫困户名单)) || (农村危房改造补贴申领台账.身份证号 IN (SELECT 不动产登记信息.权利人身份证号 FROM 不动产登记信息
    WHERE 不动产登记信息.是否唯一住房 = '否')) || (农村危房改造补贴申领台账.身份证号 IN (SELECT 身份证号 FROM 农村危房改造补贴申领台账 GROUP BY 身份证号 HAVING COUNT(*) > 1))
    || (1=0)
  description: 申领人未纳入建档立卡贫困户、低保户等符合危房改造对象的范围；农户名下有多处房产，不符合唯一居住危房改造条件；同一地址或身份证重复申领补贴；已通过其他渠道享受住房保障补贴。任一触发。
  audit_item: 不符合条件的家庭违规获取住房保障待遇
  suspicion: 非贫困户或重复申报骗取农村危房改造补贴
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农村危房改造补助资金管理办法\",\n    \"法规文号\": \"财社〔2016〕216号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第七条\",\n    \"内容概述\": \"补助对象为居住在危房中的农村分散供养五保户、低保户、贫困残疾人家庭和其他贫困户，严格限定补助对象，非贫困户不得享受。\"\n  }\n]"
- expression: （同一身份证号 在 不同补贴类型申领台账中出现）&& （补贴期间存在重叠） || 同一项目合同（如培训合同）在不同补贴类型中被重复作为支撑材料 || 同一身份证号在同一补贴类型下跨年度重复申领（补贴期间连续但拆分申报）
  description: 以身份证号为唯一标识，合并所有就业补贴申领台账，筛选出同一人在同一时间段或基于同一就业事实多次申领不同类型补贴的记录，或同一项目材料被重复使用。重叠期间超过0个月即判定。
  audit_item: 虚列就业补助资金支出
  suspicion: 同一人员或项目重复申报各类补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"同一项目不得重复享受就业补助资金与其他财政专项资金，补助对象不得通过变换名目等方式重复申领补贴。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范就业补助资金使用管理的通知\"\
    ,\n    \"法规文号\": \"财社〔2019〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"严格审核补贴申领材料，防止跨项"
