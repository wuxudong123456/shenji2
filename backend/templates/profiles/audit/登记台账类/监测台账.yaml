name: audit/登记台账类/监测台账
type: model
description: 从登记台账类类文档（监测台账）中提取结构化元数据。涵盖字段如：各年度/季度实际成活率、检查日期、检测指标、检测日期、检测结果、监测指标、超标处理措施、超标情况。文档范围包括：林木成活率动态监测台账、灌溉水质监测台账、环境风险隐患点监测台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 检查
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 监测台账
  member_count: 1
  member_details:
  - 林木成活率动态监测台账
  - 灌溉水质监测台账
  - 环境风险隐患点监测台账
output:
  fields:
  - name: 各年度-季度实际成活率
    type: date
    description: 提取 各年度-季度实际成活率 的日期值，格式 YYYY-MM-DD
  - name: 检查日期
    type: date
    description: 提取 检查日期 的日期值，格式 YYYY-MM-DD
  - name: 检测指标
    type: string
    description: 提取 检测指标 的文本值
  - name: 检测日期
    type: date
    description: 提取 检测日期 的日期值，格式 YYYY-MM-DD
  - name: 检测结果
    type: boolean
    description: 提取 检测结果 的布尔值（是/否）
  - name: 监测指标
    type: string
    description: 提取 监测指标 的文本值
  - name: 超标处理措施
    type: string
    description: 提取 超标处理措施 的文本值
  - name: 超标情况
    type: string
    description: 提取 超标情况 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 各年度/季度实际成活率、检查日期.各年度/季度实际成活率 < 合同约定成活率标准.合同约定成活率标准 × (1 - 0.05) || 管护专项资金拨付金额、支付日期.管护专项资金拨付金额 / 管护经费预算金额、实际到位金额.管护经费预算金额
    < 1.0 || 管护人员名单.巡查频次 < 规定频次
  description: 实际成活率较合同承诺值低5%以上视为管护缺位；管护资金拨付率未达100%直接影响管护作业；管护人员巡查频次低于责任书要求同样构成履职不到位。三个条件满足任一即产生疑点。
  audit_item: 村容村貌整体提升不符合相关规定
  suspicion: 村庄绿化后期管护不到位致林木成活率低
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于科学绿化的指导意见\",\n    \"法规文号\": \"国办发〔2021〕19号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十二条\",\n    \"内容概述\": \"加强绿化后期管护，建立完善养护管理制度，明确管护责任主体和资金来源，确保造林成活率和保存率。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"招标人和中标人应当依照招标投"
- expression: (表7.场地现状 = '复堆') || (文件8中存在针对该点的复堆投诉且处理状态 != '已销号') || (文件10.监测指标 > GB16889-2008限值)
  description: 登记表明确记录复堆、群众投诉反映复堆未销号，或后期环境监测指标反弹超标，均表明后续管护不到位，存在复堆或污染隐患。
  audit_item: 非正规垃圾堆放点清理整治不合规
  suspicion: 整治后场地复堆或存在污染反弹隐患
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"中华人民共和国主席令第四十三号\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第四十九条\",\n    \"内容概述\": \"生活垃圾处理设施运营单位应当做好维护管理，防止污染环境。\"\n  },\n  {\n    \"法规名称\": \"关于做好非正规垃圾堆放点排查和整治工作的通知\"\
    ,\n    \"法规文号\": \"建办村〔2017〕55号\",\n    \"效力级别\": \"部门规范性文件\",\n    \"条款号\": \"五\",\n    \"内容概述\": \"要建立长效管护机制，巩固整治成果，防止复堆"
