name: audit/登记台账类/登记台账
type: model
description: 从登记台账类类文档（登记台账）中提取结构化元数据。涵盖字段如：业务范围、丢失/损坏日期、书屋功能设施完备性、企业名称、作价金额、使用人、使用患者信息、使用日期。文档范围包括：一次性医疗器械使用登记台账、信息化设备使用登记台账、信息进村入户工程设备使用登记台账、农家书屋资产登记台账、医学证明开具登记台账、合作社注销/吊销登记台账、国有资产登记台账、地块面积变更登记台账、处理登记台账、担保/抵押事项登记台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 合同
- 金额
- 元数据提取
