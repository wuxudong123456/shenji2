    部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"设施农业用地包括农业生产中直接用于作物种植和畜禽水产养殖的设施用地，设施农业属于农业内部结构调整，可以使用一般耕地，不需落实占补平衡，按农用地管理，不需办理建设用地审批手续。\"\
    \n  }\n]"
- expression: (登记台账.实际藏书总量 < 政策文件.规定最低藏书数量) || (登记台账.实际图书种类明细（分类数量） / 政策文件.规定图书种类覆盖率或品种目录 < 1) || (采购合同.采购图书种类清单与统计表.村民需求图书种类分布重合度
    < 50%)
  description: 当藏书总册数低于国家或地方规定的最低标准（如1500册），或规定应当配备的图书种类（如农业科技、法律、少儿等）存在缺失，或采购图书与村民实际需求调研结果严重脱节（重合度不足50%）时判定为疑点。重合度=采购图书种类与需求调研高频需求种类的交集数量/需求调研高频需求种类总数。
  audit_item: 农家书屋建设运营管护不符合相关规定
  suspicion: 农家书屋图书配备数量与种类不达标
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"新出印发〔2007〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"每个农家书屋配备图书一般不少于1500册，报刊不少于30种，电子音像制品不少于100种（张），并可根据实际情况对出版物配备数量作出调整。\"\n  },\n  {\n \
    \   \"法规名称\": \"农家书屋工程实施意见\",\n    \"法规文号\": \"新出联〔2007〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"\
    内容概述\": \"出版"
- expression: (MAX(登记台账.图书出版年份列表) - 当前年份 > 3) || (登记台账.近三年新入库图书数量 / 登记台账.藏书总量 < 0.1) || (明细表.图书更新专项资金实际支出金额 = 0 && 账面无结转说明)
  description: 所有在架图书中最迟出版年份距今超过3年，则视为严重更新不及时；近3年新增图书数量占当前藏书总量的比例低于10%，未达到年度更新要求（参照《农家书屋工程建设管理暂行办法》第十条）；或上级拨付的图书更新专项资金长期未使用且无合理结转依据。
  audit_item: 农家书屋建设运营管护不符合相关规定
  suspicion: 农家书屋出版物长期未更新
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"新出印发〔2007〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"农家书屋的出版物根据村民阅读需求适当更新，每年更新补充的出版物一般不少于图书总量的10%。\"\n  }\n]"
- expression: 场地用途限定条款.约定使用性质 != '农家书屋' && (其他.值班记录连续性 || 登记表.月借阅人次) && 登记台账.场地物理状态（是否堆放杂物、有无办公桌椅）
  description: 当现场核实书屋空间被用于非阅读类活动（如改为办公室、小卖部、仓库），且考勤表显示长期无专职管理人员值守、借阅登记表持续无读者记录，同时现场存在办公家具、商品货架等与书屋功能无关物品时，判定为违规占用。
  audit_item: 农家书屋建设运营管护不符合相关规定
  suspicion: 农家书屋场地被违规占用挪作他用
  regulation: "[\n  {\n    \"法规名称\": \"农家书屋工程建设管理暂行办法\",\n    \"法规文号\": \"新出印发〔2007〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"农家书屋用房由当地村民委员会无偿提供，应确保房屋安全、专用，任何单位和个人不得挤占、挪用。\"\n  }\n]"
- expression: (消毒登记台账.消毒日期 / 管理制度.规定消毒频次（如公共区域每日≥2次）) < 0.8
  description: 应消毒次数依据机构依法建立的卫生制度确定，如规定公共活动区域每日消毒不少于2次，房间每周不少于3次等。月度消毒执行率低于80%即视为未定期消毒清洗；若同期出现感染事件或第三方检测不合格，则风险等级上调。
  audit_item: 农村养老服务政策实施不规范、建设质量不达标
  suspicion: 养老机构未按规定对场所物品进行消毒清洗
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十条\",\n    \"内容概述\": \"养老机构应当建立卫生消毒制度，定期对老年人活动、生活场所和物品进行消毒和清洗，防止疾病传播。\"\n  }\n]"
- expression: （登记台账.处置去向 NOT IN （指导文件.指定处置点清单）） || （ABS（登记台账.清运量 - 记录表.接收量） / 登记台账.清运量 > 0.2） || （登记台账.接收单位签章 IS NULL）
  description: 处置去向非文件指定的无害化处理点，或清运量与无害化处理接收量偏差率超过20%，或接收联单无签章，均表明粪污未按规定进入正规处理渠道，存在随意倾倒的高风险。
  audit_item: 农村厕所粪污治理不符合相关规定
