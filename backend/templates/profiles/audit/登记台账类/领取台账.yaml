name: audit/登记台账类/领取台账
type: model
description: 从登记台账类类文档（领取台账）中提取结构化元数据。涵盖字段如：支付企业、时间、金额、领取人。文档范围包括：报酬领取台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 领取台账
  member_count: 1
  member_details:
  - 报酬领取台账
output:
  fields:
  - name: 支付企业
    type: string
    description: 提取 支付企业 的文本值
  - name: 时间
    type: date
    description: 提取 时间 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 领取人
    type: string
    description: 提取 领取人 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 兼职审批文件.批准文号为空 || 兼职人员名册.应发报酬 > 0
  description: 参公管理人员未经批准在企业兼职即构成违规；无论是否批准，领取任何形式的报酬、补贴、奖金等均属违规，表达式判定领取金额大于0即触发。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 联合社参公管理人员未经批准在企业兼职并领取报酬
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"公务员因工作需要在机关外兼职，应当经有关机关批准，并不得领取兼职报酬。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范党政领导干部在企业兼职（任职）问题的意见\"\
    ,\n    \"法规文号\": \"中组部发〔2013〕18号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"现职和不担任现职但未办理退（离）休手续的党政领导"
