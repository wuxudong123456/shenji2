name: audit/登记台账类/注销台账
type: model
description: 从登记台账类类文档（注销台账）中提取结构化元数据。涵盖字段如：注销经办人、渔船编号、证书注销日期。文档范围包括：渔船证书注销台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 注销台账
  member_count: 1
  member_details:
  - 渔船证书注销台账
output:
  fields:
  - name: 注销经办人
    type: string
    description: 提取 注销经办人 的文本值
  - name: 渔船编号
    type: string
    description: 提取 渔船编号 的文本值
  - name: 证书注销日期
    type: date
    description: 提取 证书注销日期 的日期值，格式 YYYY-MM-DD
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (注销台账.处置完成日期 IS NOT NULL AND (日志表.渔船状态='在册' AND ABS(日志表.最后更新时间 - 注销台账.处置完成日期) > 2)) OR (日志表.渔船编号 IS NULL) OR
    (日志表.船主姓名 IS NULL OR 日志表.拆解日期 IS NULL) OR (注销台账.渔船编号 NOT IN (SELECT 渔船编号 FROM 日志表)) OR (注销台账.处置完成日期 IS NOT NULL AND 日志表.最后更新时间
    > 注销台账.处置完成日期 + 30)
  description: 渔船已处置完成但系统状态仍未更新且滞后超2天；系统缺失必填字段（编号、船主、拆解日期等）；处置记录在系统无对应档案；系统更新时间显著滞后处置日期超30天。满足任一条件判为违规。
  audit_item: 补偿制度落实不到位（渔业）
  suspicion: 渔船信息系统数据未动态更新
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农长渔发〔2019〕1号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条第（二）款\",\n    \"内容概述\": \"要求建立健全退捕渔船管理信息系统，及时录入更新渔船信息，实行动态管理。\"\n  }\n]"
- expression: (注销台账.处置完成日期 IS NOT NULL AND 注销台账.证书注销日期 IS NULL) OR (注销台账.证书注销日期 - 注销台账.处置完成日期 > 30) OR (注销台账.处置方式 NOT IN ('拆解','销毁','回收','无害化处理'))
    OR (拆解证明.拆解日期 IS NOT NULL AND 注销台账.处置方式 != '拆解')
  description: 渔船已完成处置但捕捞证书未注销；证书注销日期晚于处置完成日超过30天；处置方式不符合操作指南规定的类型；已有拆解证明但台账记录的处置方式并非拆解，均属违规。
  audit_item: 补偿制度落实不到位（渔业）
  suspicion: 渔船处置与证书注销未同步
  regulation: "[\n  {\n    \"法规名称\": \"渔业捕捞许可管理规定\",\n    \"法规文号\": \"农业农村部令2018年第1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
