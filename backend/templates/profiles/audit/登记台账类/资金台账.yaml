name: audit/登记台账类/资金台账
type: model
description: 从登记台账类类文档（资金台账）中提取结构化元数据。涵盖字段如：结转年限、结转结余金额、资金下达年份、项目名称。文档范围包括：涉农专项转移支付结转结余资金台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 资金台账
  member_count: 1
  member_details:
  - 涉农专项转移支付结转结余资金台账
output:
  fields:
  - name: 结转年限
    type: string
    description: 提取 结转年限 的文本值
  - name: 结转结余金额
    type: number
    description: 提取 结转结余金额 的数值（含单位，如万元、吨等）
  - name: 资金下达年份
    type: string
    description: 提取 资金下达年份 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (项目名称.结转年限 >= 2) && (项目名称.结转结余金额 > 0) && (项目状态 != '在建' || 项目状态 != '未清算')
  description: 筛选出资金已下达超过两年、已完成或无法实施的项目中，仍存在大额结转结余资金（金额>0）未上缴财政统筹使用的记录，判定为未按规定及时清理盘活。
  audit_item: 资金管理使用不符合相关规定
  suspicion: 未及时清理盘活涉农结转结余资金
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于印发推进财政资金统筹使用方案的通知\",\n    \"法规文号\": \"国发〔2015〕35号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第二条（二）\",\n    \"内容概述\": \"对结余资金和连续两年未用完的结转资金，一律收回统筹使用。\"\n  }\n]"
