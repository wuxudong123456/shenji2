name: audit/登记台账类/发放台账
type: model
description: 从登记台账类类文档（发放台账）中提取结构化元数据。涵盖字段如：人员姓名、农户姓名、医生姓名、发放周期、发放对象姓名、发放总额、发放日期、发放时间。文档范围包括：业务主管部门资金发放台账、乡村建设规划许可证发放台账、乡村教师工资发放台账、乡村教师补贴发放台账、企业领导人员薪酬发放台账、农机购置补贴资金发放台账、农村客运财政补贴发放台账、农民工工资发放台账、创业担保贷款贴息发放台账、待安排工作期间补贴发放台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 人员
- 培训
- 审批
- 补贴
- 元数据提取
