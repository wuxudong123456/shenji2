violations:
- expression: (企业领导人员薪酬发放台账.实际年薪 > 国资监管部门批准的薪酬手册.批准薪酬总额) || (补贴发放审批单.补贴项目名称 NOT IN (国资监管部门批准的薪酬手册.各类补贴标准及项目清单)) || (补贴发放审批单.补贴金额
    > 国资监管部门批准的薪酬手册.各类补贴标准及项目清单) || (个人所得税申报与薪酬发放差异表.差异额 > 0)
  description: 将实际发放的薪酬及补贴与国资监管部门批准的薪酬手册逐项比对。任何超出批准总额的发放、不在批准范围内的补贴项目、金额超出单项标准的部分均触发违规。个税申报收入与实际发放存在差异且无正当理由（如年终奖计税方式差异等），视为违规发放的线索。
  audit_item: 其他违反中央八项规定及其实施细则精神问题
  suspicion: 超核定薪酬手册标准发放领导人员薪酬或补贴
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"无（中共中央纪委、中共中央组织部、监察部、国务院国资委等联合发布）\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第四条、第六条\",\n    \"内容概述\": \"国有企业领导人员应当切实维护国家和出资人利益，不得违反规定获取个人利益；不得违反规定发放薪酬、津贴、补贴等。\"\n  }\n\
    ]"
- expression: 履约情况表.实际月均工资 < 培养协议.承诺工资标准 * 90% || 履约情况表.社保参保状态 != '正常参保'
  description: 实际到账工资显著低于协议承诺标准（低于90%视为违规），或未缴纳社会保险，均属待遇保障不足。
  audit_item: 乡镇、村公共卫生医生配备、培训、经费保障等不符合相关规定
  suspicion: 订单定向医学生工资待遇未按协议保障
  regulation: "[\n  {\n    \"法规名称\": \"农村订单定向医学生免费培养工作实施意见\",\n    \"法规文号\": \"发改社会〔2010〕1194号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"四、（二）\",\n    \"内容概述\": \"定向医学生在服务期间，享受与当地同类人员同等待遇，并按协议约定保障其工资、福利和社会保险。\"\n  },\n  {\n    \"法规名称\":\
    \ \"关于做好农村订单定向免费医学生就业安置和履约管理工作的通知\",\n    \"法规文号\": \"国卫科教发〔2019〕56号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、（二）\"\
    ,\n    "
- expression: (经费拨付明细表.拨入金额 - 经费拨付明细表.拨出至基层金额) / 经费拨付明细表.拨入金额 * 100% > 合理截留比例(如5%) || 补助发放台账.实发补助金额 < 经费保障政策文件.人均补助标准 * 90%
  description: 上级拨付的乡村医生经费，实际到达村医手中的比例显著低于拨款额（允许合理管理费外截留超过5%），或村医实际收到补助显著低于政策标准（差额超10%），均指向经费保障不足或截留挪用。
  audit_item: 乡镇、村公共卫生医生配备、培训、经费保障等不符合相关规定
  suspicion: 乡村医生人员经费拨付不足或被截留
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步加强乡村医生队伍建设的实施意见\",\n    \"法规文号\": \"国办发〔2015〕13号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"五、（十六）\",\n    \"内容概述\": \"各地要足额落实乡村医生各项补助经费，任何单位和个人不得截留、挪用、挤占，确保补助资金及时发放到乡村医生个人账户。\"\n  },\n  {\n \
    \   \"法规名称\": \"基层医疗卫生机构财务制度\",\n    \"法规文号\": \"财社〔2010〕277号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十八条、第二十一条\""
- expression: DATEDIFF(补助发放台账.实际发放时间, 补助发放台账.应发放时间) > 政策规定最长发放天数(如60天) || 连续N个季度(如2)存在发放延迟
  description: 若补助发放日距离应发日期（如季度结束后第一天）超过合理时限（如60天），或连续多季度延迟，则判定为发放不及时。严重情形为跨年度拖欠。
  audit_item: 乡镇、村公共卫生医生配备、培训、经费保障等不符合相关规定
  suspicion: 乡村医生补助跨季度超时限发放
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步加强乡村医生队伍建设的实施意见\",\n    \"法规文号\": \"国办发〔2015〕13号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"五、（十六）\",\n    \"内容概述\": \"各地要完善乡村医生补助发放机制，明确补助经费拨付时间和流程，确保准时发放，不得无故拖延。\"\n  },\n  {\n    \"法规名称\":\
    \ \"基本公共卫生服务补助资金管理办法\",\n    \"法规文号\": \"财社〔2019〕113号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\"\
    : "
- expression: (建设规划许可项目登记表.许可证状态 == '无证' || 乡村建设规划许可证发放台账.许可证编号 IS NULL) && 建设规划许可项目登记表.建设地点 CONTAINS '核心保护区'
