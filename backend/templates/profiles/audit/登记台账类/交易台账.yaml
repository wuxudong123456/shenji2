name: audit/登记台账类/交易台账
type: model
description: 从登记台账类类文档（交易台账）中提取结构化元数据。涵盖字段如：交易日期、交易类型、交易编号、交易金额、指标交易文号、指标来源项目名称、评估报告编号、账面值。文档范围包括：国有资产交易台账、耕地占补平衡指标交易台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 资产
- 金额
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 交易台账
  member_count: 1
  member_details:
  - 国有资产交易台账
  - 耕地占补平衡指标交易台账
output:
  fields:
  - name: 交易日期
    type: date
    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 交易类型
    type: string
    description: 提取 交易类型 的文本值
  - name: 交易编号
    type: string
    description: 提取 交易编号 的文本值
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 指标交易文号
    type: string
    description: 提取 指标交易文号 的文本值
  - name: 指标来源项目名称
    type: string
    description: 提取 指标来源项目名称 的文本值
  - name: 评估报告编号
    type: string
    description: 提取 评估报告编号 的文本值
  - name: 账面值
    type: string
    description: 提取 账面值 的文本值
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 交易台账.交易类型 IN ('资产转让','实物出资','划转','并购','置换') && 交易台账.账面值 > 0 && (项目清单.评估状态 IN ('未评估','') OR 交易台账.评估报告编号 IS NULL)
  description: 筛查涉及国有资产处置的重大交易，若在评估项目清单中未找到对应记录或评估状态为未评估/缺失，且无上级豁免评估批复，则判定为应评估未评估违规。重点关注单价资产账面值≥净资产5%的项目。
  audit_item: 违反国有资产评估相关规定
  suspicion: 国有资产应当评估未评估
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产评估管理暂行办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第12号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第六条\",\n    \"内容概述\": \"企业有下列行为之一的，应当对相关资产进行评估：（一）整体或者部分改建为有限责任公司或者股份有限公司；（二）以非货币资产对外投资；（三）合并、分立、破产、解散；（四）非上市公司国有股东股权比例变动；（五）产权转让；（六）资产转让、置换；（七）整体资产或者部分资产租赁给非国有单位；（八）以非货币资产偿还债务；（九）资产涉讼；（十）收购非国有单位的资产；（十一"
- expression: (T.amount * 0.3) > SUM(CASE WHEN M.usage LIKE '%农田建设%' AND T.source_project == M.project_name THEN M.receive_amount
    ELSE 0 END) AND T.recipient_account != 'FARMLAND_SPECIAL_ACCOUNT'
  description: 追踪指标交易收益（T）的最终流向。计算回流至原高标准农田建设项目（T.source_project）的资金总和。如果回流资金低于交易金额的30%（通用审计标准阈值），或收益直接存入非农田建设专户（如城投公司或财政非税专户），则判定为违规。
  audit_item: 高标农田建设资金保障不到位
  suspicion: 占补平衡指标交易收益未返还农田建设
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\",\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\"\
    : \"行政法规\",\n    \"条款号\": \"第三条第（八）款\",\n    \"内容概述\": \"高标准农田建设新增耕地指标经核定后，其调剂收益应当用于高标准农田建设。\"\n  }\n]"
