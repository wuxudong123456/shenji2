  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"不得组织与公务活动无关的参观和活动，不得以任何名义发放纪念品或变相福利。\"\n  }\n]"
- expression: 公务接待明细台账.接待场所名称 IS NULL || TRIM(公务接待明细台账.接待场所名称) = ''
  description: 当接待场所字段为空或空白时直接判定违规，因为缺失关键要素，无法验证接待合规性。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务接待清单未记录具体场所信息
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"接待费报销凭证应当包括财务票据、派出单位公函和接待清单。接待清单应包括接待对象的单位、姓名、职务和公务活动项目、时间、场所、费用等内容。\"\n  }\n]"
- expression: (公务接待明细台账.对应审批单编号 IS NULL) OR (接待审批单.审批日期 > 公务接待明细台账.接待日期) OR (接待审批单.审批人签字 IS NULL) OR (财务报销凭证.所附审批单情况 IS NULL)
  description: 台账中无对应审批单编号、审批日期晚于实际接待日期(先接待后审批)、审批单无有效签字、报销时未附审批单，满足任一条件即告违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 未履行公务接待审批程序
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第七条、第十四条\",\n    \"内容概述\": \"接待单位应当严格接待审批控制，无公函的公务活动和来访人员一律不予接待；接待费报销凭证应当包括财务票据、派出单位公函和接待清单。\"\n  }\n]"
- expression: (会议/调研/考察活动通知及行程安排.门票费用 > 0) OR (会议/调研/考察活动通知及行程安排.公务内容占比 < 0.5) OR (差旅费报销汇总表.地点 属于旅游景区 AND DATEDIFF(差旅费报销汇总表.出差日期,
    差旅费报销汇总表.差旅日期) > 公务天数 * 2)
  description: 行程中含景点门票或导游费，或公务活动(会议、调研)时间不足总行程一半，或差旅天数明显多于公务所需天数(如公务1天差旅3天)，均触发变相旅游疑点。
  audit_item: 公务接待管理不符合规定
  suspicion: 以公务名义变相旅游
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"国内公务接待不得组织旅游和与公务活动无关的参观，不得以任何名义赠送礼金、有价证券、纪念品和土特产品等。\"\n  }\n]"
- expression: (任务批件中文.所属单位 = 本单位) AND (明细台账.收款单位 != 本单位 AND 明细台账.对应出国任务 = 任务批件中文.任务名称) OR (单据.付款方 != 本单位 AND 单据.收款方 = 本单位
    且摘要含出国事由)
  description: 本单位人员的出国费用理应由本单位承担，若发现费用由所属单位或外单位支付（即分摊台账中收款方为外单位，但对应的是本单位人员任务，或银行流水显示外单位向本单位支付出国相关费用），可能构成摊派。无合规分摊协议或协议显失公平均属违规。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 向所属或其他单位摊派因公出国费用
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"党政机关不得向下属单位、企业、社会组织等摊派或转嫁因公出国（境）等费用，不得以任何名义要求其他单位提供资金或物品。\"\n  }\n]"
- expression: (信息.股东姓名 IN (项申报表.申报人姓名, 项申报表.配偶及子女姓名)) AND (信息.企业名称 IN (名录.关联企业名称)) AND (项申报表.投资企业名称 不包含 信息.企业名称 OR 项申报表.持股比例
    != 信息.持股比例) AND (信息.出资日期 BETWEEN 领导人员任职开始日期 AND 审计基准日)
  description: 领导人员或其近亲属在关联企业持有股份且未如实申报，或申报持股比例与工商登记不符，同时入股时间发生在任职期间内，触发违规判定。持股比例>0即视为投资入股。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 领导人员违规投资入股关联企业
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第一款\",\n    \"内容概述\": \"国有企业领导人员不得个人从事营利性经营活动和有偿中介活动，或者在本企业的同类经营企业、关联企业和与本企业有业务关系的企业投资入股。\"\n  }\n]"
- expression: (离职人员利益往来登记表.利益输送企业名称 IN 关联企业及业务关系企业名录.关联企业名称) AND (离职人员利益往来登记表.发生日期 BETWEEN 离职人员利益往来登记表.离职日期 AND 离职人员利益往来登记表.离职日期+1095天)
    AND (离职人员利益往来登记表.金额 > 0) AND (关联交易明细台账.审批人 = 该离职人员) AND (关联交易明细台账.交易日期在离职前)
  description: 离职人员在离职后三年内从原关联企业获取报酬或物质利益，且该关联企业曾与离职人员任职企业发生业务往来并由其审批，线索即为违规。利益类型包括顾问费、咨询费、无偿提供财物等。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 离职后三年内接受原关联企业利益
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（二）项\",\n    \"内容概述\": \"不得在职或者离职后接受、索取本企业的关联企业、与本企业有业务关系的企业，以及管理和服务对象提供的物质性利益。\"\n  }\n]"
- expression: ((收支台账.服务内容摘要 = ‘无’ OR 收支台账.有无实质交付物 = ‘否’) AND 收支台账.支付金额 > 0 AND 收支台账.收款方名称 IN (领导人员姓名, 领导人员关联方)) OR (业务合同.约定折扣条款存在
    AND ABS(行对账单.收款金额 - 业务合同.合同金额) > 0 AND 处置台账 无对应上交记录) OR (报销凭证.事由 LIKE ‘%奖励资金%’ AND 报销凭证.报销人 = 领导人员 AND 无经审批的分配方案)
  description: 支付给无实质服务的个人或空壳公司的大额中介费、佣金；合同折扣款未上缴财务而由个人截留；政府奖励款项被以报销名义私分而未纳入公司账簿，均构成侵占。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 私分或侵占企业折扣费、中介费、佣金
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条第（二）项\",\n    \"内容概述\": \"不得将企业经济往来中的折扣费、中介费、佣金、礼金，以及因企业行为受到有关部门和单位奖励的财物等据为己有或者私分。\"\n  }\n]"
- expression: 明细台账.保证金项目名称 NOT IN (法定保证金项目名称、设立依据、法定保证金比例上限（如质量保证金不超过3%）.法定保证金项目名称) || (收取通知.保证金项目名称 未在单位设定的保证金项目名称、设立依据中载明  &&
    无任何政策文件依据)
  description: 若实际收取的保证金项目名称未出现在国务院或省级公布的涉企保证金目录清单中，或单位无法提供该保证金项目的设立依据文件、政策文件编号，则判定为违规收取无依据保证金。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 违规收取无政策依据的涉企保证金
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于清理规范工程建设领域保证金的通知\",\n    \"法规文号\": \"国办发〔2016〕49号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"全面清理各类保证金。对建筑业企业在工程建设中需缴纳的保证金，除依法依规设立的投标保证金、履约保证金、工程质量保证金、农民工工资保证金外，其他保证金一律取消。\"\
    \n  },\n  {\n    \"法规名称\": \"关于公布涉企保证金目录清单的通知\",\n    \"法规文号\": \"工信部联运行〔2017〕236号\",\n    \"效力级别\": \"部门规章\",\n  "
- expression: (明细台账.保证金类型 IN ('质量保证金','工程质保金') AND (明细台账.实际收取金额/采购合同.合同金额) > 0.03) OR (明细台账.保证金类型='履约保证金' AND (明细台账.实际收取金额/采购合同.合同金额)
    > 0.10)
  description: 根据《建设工程质量保证金管理办法》，质量保证金总预留比例不得高于工程价款结算总额的3%；履约保证金不得超过政府采购合同金额的10%。超出上述比例即构成超标准收取保证金。注意区分保证金类型，不同类型适用不同法定上限。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 超法定比例收取质量保证金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第四十八条\",\n    \"内容概述\": \"采购人或者采购代理机构应当在采购文件中明确是否收取履约保证金，以及履约保证金的数额和提交方式。履约保证金的数额不得超过政府采购合同金额的10%。\"\n  },\n\
    \  {\n    \"法规名称\": \"建设工程质量保证金管理办法\",\n    \"法规文号\": \"建质〔2017〕138号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条\"\
    ,\n    \"内"
- expression: (日记账.现金余额 - 盘点记录.实盘现金余额 < 0 && ABS(差异) > 2000 && 无书面说明) || (银行对账单.借贷方金额转账至个人账户 && 金额 > 50000 && 缺少对应业务合同) ||
    (明细台账.备用金 > 100000 && 长期未冲账且无实际库存现金)
  description: 突击盘点发现现金溢余且无合理解释，可能为公款私存。银行转账至个人账户大额无业务支撑，揭示公款被挪用或私存。备用金余额异常且无法盘实，疑为以备用金名义提取现金私存。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 私存私放财政资金或公款
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"单位和个人违反财务管理的规定，私存私放财政资金或者其他公款的，责令改正，调整有关会计账目，追回私存私放的资金，没收违法所得。对单位处3000元以上5万元以下的罚款；对直接负责的主管人员和其他直接责任人员处2000元以上2万元以下的罚款……\"\
    \n  }\n]"
- expression: (票据存根.收费项目 NOT IN 合法收费项目清单及标准.批准收费项目) || (票据存根.金额 > 合法收费项目清单及标准.计费标准及收费依据*数量) || (SUM(票据存根.金额) - SUM(明细表.金额)
    > 0 && 收款银行账户非单位零余额账户或汇缴专户)
  description: 擅自设立收费项目或超标准收费，且收入未缴入法定账户，即构成违规收费账外存放。票据存根中未经批准的项目、超标准收费的差额，均指向账外资金。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 违规收费罚款摊派资金账外存放
  regulation: "[\n  {\n    \"法规名称\": \"违反行政事业性收费和罚没收入收支两条线管理规定行政处分暂行规定\",\n    \"法规文号\": \"国务院令第281号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"第七条\",\n    \"内容概述\": \"对违反规定擅自设立行政事业性收费项目或者设置罚没处罚的，对直接负责的主管人员和其他直接责任人员给予降级或者撤职处分。违反规定，将行政事业性收费、罚没收入截留、挪用、坐收坐支的，给予记大过处分；情节严重的，给予降级或者撤职处分。\"\
    \n  }\n]"
- expression: 现金支取凭证及审批单.发票 > 0 && (经济合同.合同事项 IS NULL || 现金支取凭证及审批单.验收单) && 明细表.金额 > 20000) || (经济合同.乙方信息 != 行对账单.收款人名称 &&
    经济合同.合同事项) || (现金支取凭证及审批单.发票 && 存货台账.资产名称) || (明细台账.其他应收款挂账及核销 && 行对账单.收入流水)
  description: 缺少合同/验收的大额支出、资金收款方与合同方不一致，或资本支出后无实物资产，均提示虚假支出套取资金。往来款异常核销可能意味着资金已私下转出。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 虚报支出套取资金账外存放
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十四号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十三条\",\n    \"内容概述\": \"伪造、变造会计凭证、会计账簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。尚不构成犯罪的，由县级以上人民政府财政部门予以通报，可以对单位并处五千元以上十万元以下的罚款……\"\
    \n  }\n]"
