name: audit/登记台账类/明细台账
type: model
description: 从登记台账类类文档（明细台账）中提取结构化元数据。涵盖字段如：12月大额支付汇总、业务编号、中介方、交易对手方、交易对手方名称、交易日期、交易类型、交易金额。文档范围包括：二次分配资金明细台账、公务接待明细台账、公积金缴存使用明细台账、关联交易明细台账、农业保险投保明细台账、农业保险理赔明细台账、农村产权交易明细台账、创业担保贷款发放明细台账、年末突击支付明细台账、往来款项明细台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
