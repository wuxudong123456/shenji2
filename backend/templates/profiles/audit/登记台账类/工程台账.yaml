name: audit/登记台账类/工程台账
type: model
description: 从登记台账类类文档（工程台账）中提取结构化元数据。涵盖字段如：工程名称、转固日期、项目名称。文档范围包括：在建工程台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 工程
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 工程台账
  member_count: 1
  member_details:
  - 在建工程台账
output:
  fields:
  - name: 工程名称
    type: string
    description: 提取 工程名称 的文本值
  - name: 转固日期
    type: date
    description: 提取 转固日期 的日期值，格式 YYYY-MM-DD
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (验收结论及问题记录.竣工验收合格日期 IS NOT NULL && 工程台账.转固日期 IS NULL) || (DATEDIFF(工程台账.转固日期, 验收结论及问题记录.竣工验收合格日期) > 90) || (生产记录.首次投产日期
    < 工程台账.转固日期)
  description: 工程已验收合格或已实际投产，但迟迟未转固，延迟超过90天或未转固，即存在通过推迟折旧调节利润的嫌疑。
  audit_item: 未按规定核算资产
  suspicion: 在建工程达到预定可使用状态后未及时转固
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第4号——固定资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"自行建造的固定资产，按照建造该项资产达到预定可使用状态前所发生的必要支出构成入账价值。\"\n  }\n]"
- expression: (审批文件.审批转固日期 < 监理报告.预计完工百分比) && (工程台账.转固后同一项目发生的大额支出) && (监理报告.预计完工百分比 < 95%)
  description: 转固日期早于工程预计主要完工日期，且转固后仍有大量该工程支出发生，监理报告进度未达95%，表明工程未完工即提前结转，虚增固定资产。
  audit_item: 未按规定核算资产
  suspicion: 在建工程未完工提前转为固定资产
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第4号——固定资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十七条\",\n    \"内容概述\": \"固定资产应在其达到预定可使用状态时，才能正式确认为资产。\"\n  }\n]"
