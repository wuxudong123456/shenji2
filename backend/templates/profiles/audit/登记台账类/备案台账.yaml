name: audit/登记台账类/备案台账
type: model
description: 从登记台账类类文档（备案台账）中提取结构化元数据。涵盖字段如：备案回执编号、备案时间、备案状态、项目名称。文档范围包括：绩效目标备案台账（含财政部备案回执）等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 备案台账
  member_count: 1
  member_details:
  - 绩效目标备案台账（含财政部备案回执）
output:
  fields:
  - name: 备案回执编号
    type: string
    description: 提取 备案回执编号 的文本值
  - name: 备案时间
    type: date
    description: 提取 备案时间 的日期值，格式 YYYY-MM-DD
  - name: 备案状态
    type: boolean
    description: 提取 备案状态 的布尔值（是/否）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 安排表.项目存在 && 备案台账.备案状态 == '未备案'
  description: 若项目已在年度预算安排计划表中安排预算，但在绩效目标备案台账中未找到对应备案记录或备案状态为“未备案”，则判定为绩效目标未报财政部备案即安排预算。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 绩效目标未报财政部备案
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"各部门审核后的项目支出绩效目标应报财政部备案，未备案的不得安排预算。\"\n  },\n  {\n    \"法规名称\": \"财政部关于贯彻落实〈中共中央 国务院关于全面实施预算绩效管理的意见〉的通知\"\
    ,\n    \"法规文号\": \"财预〔2018〕167号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"强化绩效目标管理，严"
