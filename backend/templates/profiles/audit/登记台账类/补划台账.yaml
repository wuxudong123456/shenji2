name: audit/登记台账类/补划台账
type: model
description: 从登记台账类类文档（补划台账）中提取结构化元数据。涵盖字段如：实际占用面积、实际补划面积、补划地块验收状态。文档范围包括：永久基本农田补划台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 验收
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 补划台账
  member_count: 1
  member_details:
  - 永久基本农田补划台账
output:
  fields:
  - name: 实际占用面积
    type: string
    description: 提取 实际占用面积 的文本值
  - name: 实际补划面积
    type: string
    description: 提取 实际补划面积 的文本值
  - name: 补划地块验收状态
    type: boolean
    description: 提取 补划地块验收状态 的布尔值（是/否）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (项目占地红线图.占用基本农田面积 > 永久基本农田补划台账.实际补划面积) || (补划地块的耕地质量等别评定报告.实测等别 < 被占用地块的原质量等别) || (土地利用现状图.补划地块坡度 > 25)
  description: 判定规则：1）项目建设实际占用的永久基本农田面积，大于实际完成的补划面积，即触犯“占优补劣、占多补少”的违规情形；2）补划地块经过实测的质量等别，低于被占用地块占用前的质量等别，属于典型的“占优补劣”；3）补划地块自身条件不达标，如位于大于25度的陡坡上，不宜耕种，属于虚假补划。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 未按规定补足或补划永久基本农田
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"2019年修正版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十二条\",\n    \"内容概述\": \"国家实行永久基本农田保护制度。……禁止通过擅自调整县级土地利用总体规划、乡（镇）土地利用总体规划等方式规避永久基本农田农用地转用或者土地征收的审批。\"\n  }\n]"
