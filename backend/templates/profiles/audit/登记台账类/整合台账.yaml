name: audit/登记台账类/整合台账
type: model
description: 从登记台账类类文档（整合台账）中提取结构化元数据。涵盖字段如：建设内容、整合后项目名称、整合资金来源、资金来源部门。文档范围包括：涉农资金整合台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 项目
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 整合台账
  member_count: 1
  member_details:
  - 涉农资金整合台账
output:
  fields:
  - name: 建设内容
    type: string
    description: 提取 建设内容 的文本值
  - name: 整合后项目名称
    type: string
    description: 提取 整合后项目名称 的文本值
  - name: 整合资金来源
    type: string
    description: 提取 整合资金来源 的文本值
  - name: 资金来源部门
    type: string
    description: 提取 资金来源部门 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: A.project_name == B.project_name || (ABS(A.longitude - B.longitude) < 0.0001 && ABS(A.latitude - B.latitude)
    < 0.0001 && A.funding_dept != B.funding_dept)
  description: 比对高标准农田建设项目（A）与土地整治项目（B）的名称及地块坐标。若名称完全相同，或建设地点坐标基本一致（经纬度偏差小于约10米）但资金分别来源于不同主管部门（如农业农村局与自然资源局），则判定为疑似重复立项，导致财政资金浪费。
  audit_item: 高标农田建设资金保障不到位
  suspicion: 高标准农田建设项目与土地整治项目重复立项
  regulation: "[\n  {\n    \"法规名称\": \"农田建设补助资金管理办法\",\n    \"法规文号\": \"财农〔2019〕46号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"各级财政、农业农村部门应当加强农田建设补助资金的统筹使用，避免重复投入。\"\n  }\n]"
