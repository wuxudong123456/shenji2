name: audit/登记台账类/组织台账
type: model
description: 从登记台账类类文档（组织台账）中提取结构化元数据。涵盖字段如：摘要、支出科目、支出金额、资金来源。文档范围包括：集体经济组织台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 组织台账
  member_count: 1
  member_details:
  - 集体经济组织台账
output:
  fields:
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 支出科目
    type: number
    description: 提取 支出科目 的数值（含单位，如万元、吨等）
  - name: 支出金额
    type: number
    description: 提取 支出金额 的数值（含单位，如万元、吨等）
  - name: 资金来源
    type: string
    description: 提取 资金来源 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ((分析表.支出同比增长率 < 地方财政经常性收入同比增长率) OR (分析表.支出占公共预算比例 < 上年比重)) AND (组织台账.支出科目 LIKE '%环卫%' OR '%道路%' OR '%公共设施%')
    AND (组织台账.资金来源（自筹/拨款）='自筹')
  description: 当财政决算中农村公共服务支出增幅低于财政经常性收入增幅，或其在预算中占比下降，且同期集体经济组织账目存在应由财政承担的公共服务支出（如环卫、道路等）自筹资金支付时，判定为支出不达标或负担转嫁。
  audit_item: 政策支持落实和监督检查不到位
  suspicion: 农村公共服务支出未达规定增幅或转嫁负担
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"国家主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十二条\",\n    \"内容概述\": \"各级预算应当统筹兼顾，保证基本公共服务有效提供，支出应与经济社会发展水平相适应。\"\n  },\n  {\n    \"法规名称\": \"关于稳步推进农村集体产权制度改革的意见\"\
    ,\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"地方政府应逐步增加对农村的公共服务支出，减少农村集体经"
