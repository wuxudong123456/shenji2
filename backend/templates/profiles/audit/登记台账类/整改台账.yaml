violations:
- expression: 绩效管理责任分工相关文件.存在性 = '否' OR (绩效管理责任分工相关文件.是否明确考核与问责条款 = '否') OR (绩效评价问题整改台账.问题项目数 > 0 AND 绩效评价问题整改台账.问责记录 = '无')
  description: 若未制定责任分工文件，或虽有分工但未提及绩效考核与问责措施，或者存在绩效评价不合格项目却无任何问责和整改记录，说明责任约束制度缺失。三者满足任一即判违规。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 未建立绩效管理责任约束制度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第五部分（十四）\",\n    \"内容概述\": \"强化绩效管理责任约束，明确各部门各单位全面实施预算绩效管理的主体责任，建立绩效问责机制，对绩效管理不力、导致财政资金损失浪费的，依法依规追究责任人责任。\"\
    \n  }\n]"
- expression: (发现问题整改通知书.签发日期 - 绩效运行监控报告.问题发现日期) > 30 || (绩效偏差问题整改台账.整改完成状态 != '已完成' && 绩效偏差问题整改台账.计划完成日期 < TODAY()) || (绩效指标完成情况对比表.后续完成率
    <= 首次监控完成率)
  description: 三种条件任一满足即触发违规：①整改通知书下发滞后超过30天；②整改台账中已逾期仍未完成整改；③整改后绩效指标完成率未改善甚至下降，表明措施无效。时限标准结合《政府预算绩效管理操作规程》中‘发现问题后原则上30日内启动纠偏’的常用要求。
  audit_item: 部门、单位预算绩效运行监控不合规
  suspicion: 绩效运行监控发现问题未及时采取有效措施
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（五）款\",\n    \"内容概述\": \"发现问题及时督促整改，加强绩效结果与预算安排、政策调整挂钩。\"\n  },\n  {\n    \"法规名称\": \"关于贯彻落实《中共中央\
    \ 国务院关于全面实施预算绩效管理的意见》的通知\",\n    \"法规文号\": \"财预〔2018〕167号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三部分\",\n    \"\
    内容概述\": \"对"
- expression: (落实方案.节点目标（季度/月度） != '月度' && 落实方案.节点目标（季度/月度） != '季度') && 跟踪表.进度偏差率 > 20%
  description: 专项规划中的重大工程任务分解方案未将任务细化到至少季度或者月度工作节点（即缺少可衡量的里程碑），且对应的项目总体进度偏差率超过20%，表明管理粗放，缺乏有效的进度监控抓手，导致落实不力。
  audit_item: 违反建设管理相关政策规定-重大工程项目推进缓慢
  suspicion: 专项规划任务未细化分解导致项目推进缓慢
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照国家有关规定合理确定并严格执行建设工期，不得无故拖延。任何单位和个人不得非法干预建设工期的确定。项目单位应当加强项目进度控制，确保项目按期建成投入使用。\"\n  },\n  {\n\
    \    \"法规名称\": \"关于完善固定资产投资项目代码制度的若干意见\",\n    \"法规文号\": \"国办发〔2020〕47号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \""
- expression: (保护工程项目验收报告.实施方案要点 CONTAINS '墙面出新' && !(保护工程项目验收报告.实施方案要点 CONTAINS '结构加固')) || (保护工程项目验收报告.绩效目标达成率 < 0.6) ||
    (保护工程问题整改台账.是否反复出现 = '是') || (村民满意度调查问卷统计表.整体满意度评分 < 60)
  description: 若保护工程项目内容主要为表面粉刷装饰而忽略结构安全等核心问题，即被定性为面子工程。绩效目标达成率不足60%、同一房屋质量缺陷或同一片区风貌问题在整改台账中反复出现超过2次、村民满意度调查整体评分低于60分，满足以上任一条件即判为违规，反映项目重形式轻实效。
  audit_item: 传统村落保护不到位
  suspicion: 保护工程沦为面子工程实效差
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方传统村落保护补助资金管理办法\",\n    \"法规文号\": \"财建〔2014〕432号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十一条\",\n    \"内容概述\": \"项目单位应对专项资金实施全过程绩效管理，确保项目达到预期绩效目标。应优先保障传统建筑的安全抢修与防灾减灾，严禁搞形式主义的'涂脂抹粉'。\"\n  }\n\
    ]"
- expression: GIS_OVERLAP(规划路线坐标.规划路线坐标, 政策文件.基本农田保护区范围) == TRUE && (登记台账.整改状态 != '已解决' || 登记台账.解决时效超过6个月)
  description: 通过空间分析发现公路规划线与基本农田、生态红线等禁止建设区重叠，且未及时调整规划或未在规定期限（如6个月）内解决冲突，判定为规划不协调。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 农村公路建设规划与土地利用总体规划冲突
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"农村公路建设规划应当符合国民经济和社会发展规划、土地利用总体规划，并与城乡规划、环境保护规划等相协调。\"\n  }\n]"
- expression: ( ( 统计表.实际供电可靠率 < 考核制度.年度供电可靠率目标 ) || ( 统计表.实际电压合格率 < 考核制度.年度电压合格率目标 ) || ( 记录表.实测户均配变容量 < 规划文件.目标户均配变容量 ) )
    && ( 统计表.考核周期已结束 )
  description: 在考核期末，只要供电可靠率、电压合格率或户均配变容量中任一项实际值低于规划或考核目标值，即触发疑点。偏差幅度分级：偏差≤1%为一般风险，1%-3%为较大风险，>3%为重大风险。
  audit_item: 农村电网巩固提升工程存在短板
  suspicion: 供电可靠性及电压合格率未达标
  regulation: "[\n  {\n    \"法规名称\": \"关于实施农村电网巩固提升工程的指导意见\",\n    \"法规文号\": \"发改能源〔2021〕154号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"明确各地按期完成供电可靠率、综合电压合格率、户均配变容量等指标提升任务，并加强考核。\"\n  }\n]"
- expression: (关键指标检测结果.关键指标检测结果 != 合格) || (缺陷内容.实际闭环状态 = '未闭环' && 缺陷内容.超期天数 > 30)
  description: 工程检测报告中任意一项关键质量指标不合格，直接判定工程质量差；或已发现质量缺陷但整改逾期未闭环超过30天的，视为建设标准低、整改不及时。
  audit_item: 国家种子生产基地建设方面不符合相关规定
  suspicion: 基地工程项目偷工减料致质量缺陷
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十八条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。\"\n  }\n]"
- expression: (明细表.身份证号 NOT REGEXP '^[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[0-9Xx]$') OR (明细表.身份证号
    出现重复) OR (明细表.银行账号 IS NULL OR 明细表.银行账号 = '') OR (管理目录.存档文件名 未包含 '公示文件' AND '发放明细表' AND '审批表')
  description: 身份证号不符合18位格式或出现重复，银行账号缺失，档案目录中缺少公示文件、发放表或审批表等关键存档资料，均表明数据质量和档案管理存在严重缺陷。
  audit_item: 惠农补贴发放不到位
  suspicion: 惠农补贴发放数据错误或档案缺失
  regulation: "[\n  {\n    \"法规名称\": \"《农业生产发展资金管理办法》\",\n    \"法规文号\": \"财农〔2022〕25号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十二条\",\n    \"内容概述\": \"农业农村部门应加强补贴信息档案管理，确保补贴对象、面积、金额等数据真实、完整、准确，做到资料齐全、归档及时。\"\n  }\n]"
- expression: "(统计表.闲置年限 >= 2 AND 统计表.清理状态 != '已清理')\n||\n(明细表.科目名称 LIKE '%惠农补贴%' \n   AND 明细表.余额 > 0 \n   AND (当前日期 - 明细表.最后交易日期)\
    \ > 730)"
  description: 判定逻辑：从结余统计表直接筛选闲置2年以上且未清理的资金；从账户流水表发现惠农补贴专户余额超过2年无变动且未上缴财政的款项。两项条件满足其一即构成闲置未清理。风险等级：闲置2-3年且金额较小为关注，闲置3年以上或金额较大为严重。
