name: audit/登记台账类/整改台账
type: model
description: 从登记台账类类文档（整改台账）中提取结构化元数据。涵盖字段如：不合格点位数量、关联审批事项、冲突点位编号、冲突类型、历史问题描述、同类问题重复次数、复发情况、完成时间。文档范围包括：传统村落保护问题整改台账、保护工程问题整改台账、养殖场环评验收不合格整改台账、实施方案问题整改台账、审计整改台账、工程质量问题整改台账、工程项目质量缺陷整改台账、整改台账、电压不合格点位整改台账、监督检查发现问题整改台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 审批
- 整改
- 项目
- 验收
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 整改台账
  member_count: 1
  member_details:
  - 传统村落保护问题整改台账
  - 保护工程问题整改台账
  - 养殖场环评验收不合格整改台账
  - 实施方案问题整改台账
  - 审计整改台账
  - 工程质量问题整改台账
  - 工程项目质量缺陷整改台账
  - 整改台账
  - 电压不合格点位整改台账
  - 监督检查发现问题整改台账
  - 绩效偏差问题整改台账
  - 绩效评价问题整改台账
  - 草原风险隐患问题整改台账
  - 补贴发放问题整改台账
  - 规划冲突问题整改台账
  - 规划编制滞后问题整改台账
  - 近三年审计发现问题整改台账
  - 违规占用农业用地整改台账
  - 违规收费整改台账
  - 项目问题整改台账
  - 风险排查问题整改台账
