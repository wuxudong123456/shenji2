name: audit/登记台账类/融资台账
type: model
description: 从登记台账类类文档（融资台账）中提取结构化元数据。涵盖字段如：利率、融资期限、融资金额、资金用途。文档范围包括：融资台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 融资台账
  member_count: 1
  member_details:
  - 融资台账
output:
  fields:
  - name: 利率
    type: string
    description: 提取 利率 的文本值
  - name: 融资期限
    type: string
    description: 提取 融资期限 的文本值
  - name: 融资金额
    type: number
    description: 提取 融资金额 的数值（含单位，如万元、吨等）
  - name: 资金用途
    type: string
    description: 提取 资金用途 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (融资台账.融资金额总和 / 审计报告.净资产 > 1.0) || (对比表.经营性现金流 / 对比表.到期债务金额 < 1.2) || (融资台账.资金用途 != 融资方案.申报用途)
  description: 设置三项触发条件：①资产负债率超过100%仍大额融资；②未来12个月经营性现金流对到期债务的覆盖率不足1.2倍，偿付压力过大；③实际融资用途与申报用途不符，存在挪用。满足任一条件即判定为超额融资或偿付能力不足疑点。
  audit_item: 投融资管理方面存在的问题
  suspicion: 融资超过企业实际发展需求或偿付能力
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产监督管理暂行条例\",\n    \"法规文号\": \"国务院令第378号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第30条\",\n    \"内容概述\": \"国有及国有控股企业应当加强内部监督和风险控制，依照国家有关规定建立健全财务、审计、企业法律顾问和职工民主监督等制度。\"\n  },\n  {\n    \"法规名称\": \"\
    关于加强国有企业资产负债约束的指导意见\",\n    \"法规文号\": \"中共中央办公厅、国务院办公厅印发\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第二部分\",\n    \"内容概述\"\
    : "
