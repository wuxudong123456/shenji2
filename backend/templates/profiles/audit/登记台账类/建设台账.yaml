name: audit/登记台账类/建设台账
type: model
description: 从登记台账类类文档（建设台账）中提取结构化元数据。涵盖字段如：实际建成数、月均服务人次、运营状态。文档范围包括：农村综合服务社建设台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 建设台账
  member_count: 1
  member_details:
  - 农村综合服务社建设台账
output:
  fields:
  - name: 实际建成数
    type: string
    description: 提取 实际建成数 的文本值
  - name: 月均服务人次
    type: string
    description: 提取 月均服务人次 的文本值
  - name: 运营状态
    type: boolean
    description: 提取 运营状态 的布尔值（是/否）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 农村综合服务社建设台账.实际建成数 / 城乡社区服务中心建设目标文件.年度建设目标数量 < 0.8 OR COUNT(农村综合服务社建设台账.月均服务人次 < 50) / COUNT(农村综合服务社建设台账.实际建成数)
    > 0.3
  description: 建成数量完成率低于80%或月均服务人次低于50人次的站点占比超过30%，反映建设不到位或者运营虚化。前者是数量硬指标，后者衡量服务质量与可及性。
  audit_item: 为农服务职责履行不到位
  suspicion: 农村综合服务社和城乡社区服务中心建设不足
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"（十二）\",\n    \"内容概述\": \"发展农村综合服务社和城乡社区服务中心，为城乡居民提供日用消费品、文体娱乐、养老幼教、就业培训等多样化服务，构建综合性服务平台。\"\n  }\n]"
