name: audit/登记台账类/负债台账
type: model
description: 从登记台账类类文档（负债台账）中提取结构化元数据。涵盖字段如：借款金额、利率、到期日、担保方式。文档范围包括：有息负债台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 负债台账
  member_count: 1
  member_details:
  - 有息负债台账
output:
  fields:
  - name: 借款金额
    type: number
    description: 提取 借款金额 的数值（含单位，如万元、吨等）
  - name: 利率
    type: string
    description: 提取 利率 的文本值
  - name: 到期日
    type: string
    description: 提取 到期日 的文本值
  - name: 担保方式
    type: string
    description: 提取 担保方式 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (资产负债表.总资产 / 资产负债表.股东权益) > 行业均值*1.8 && ((资产负债表.短期借款 + 资产负债表.一年内到期的非流动负债) / (利润表.营业利润/4) > 2 || (利润表.营业利润 / (利润表.财务费用-利息支出+0.01))
    < 1)
  description: 权益乘数超过行业均值1.8倍，且短期有息负债（短期借款+一年内到期非流动负债）与季度平均营业利润之比大于2，表明短期偿债压力极大；或利息保障倍数小于1，即营业利润无法覆盖利息支出，面临资金链断裂风险。设定财务费用利息支出加0.01以防止分母为零。
  audit_item: 企业财务杜邦分析
  suspicion: 权益乘数畸高伴随有息负债偿付能力不足
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第17号——借款费用\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"企业发生的借款费用，可直接归属于符合资本化条件的资产的购建或者生产的，应当予以资本化，计入相关资产成本；其他借款费用，应当在发生时根据其发生额确认为费用，计入当期损益。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"主席令第15号（2023年修订）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一"
