name: audit/登记台账类/存货台账
type: model
description: 从登记台账类类文档（存货台账）中提取结构化元数据。涵盖字段如：入库日期、入账原值、存放地点、资产名称、资产编码。文档范围包括：存货台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 资产
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 存货台账
  member_count: 1
  member_details:
  - 存货台账
output:
  fields:
  - name: 入库日期
    type: date
    description: 提取 入库日期 的日期值，格式 YYYY-MM-DD
  - name: 入账原值
    type: string
    description: 提取 入账原值 的文本值
  - name: 存放地点
    type: string
    description: 提取 存放地点 的文本值
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 资产编码
    type: string
    description: 提取 资产编码 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 现金支取凭证及审批单.发票 > 0 && (经济合同.合同事项 IS NULL || 现金支取凭证及审批单.验收单) && 明细表.金额 > 20000) || (经济合同.乙方信息 != 行对账单.收款人名称 &&
    经济合同.合同事项) || (现金支取凭证及审批单.发票 && 存货台账.资产名称) || (明细台账.其他应收款挂账及核销 && 行对账单.收入流水)
  description: 缺少合同/验收的大额支出、资金收款方与合同方不一致，或资本支出后无实物资产，均提示虚假支出套取资金。往来款异常核销可能意味着资金已私下转出。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 虚报支出套取资金账外存放
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十四号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十三条\",\n    \"内容概述\": \"伪造、变造会计凭证、会计账簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。尚不构成犯罪的，由县级以上人民政府财政部门予以通报，可以对单位并处五千元以上十万元以下的罚款……\"\
    \n  }\n]"
- expression: (盘点记录.实盘数量 - 存货台账.入账原值 > 0) || (经济合同.合同金额 > 10000 && 存货台账.资产编码 IS NULL) || (盘点记录.处置审批及处置收入 > 0 && 分类账.发生额及余额)
  description: 实物盘点超出台账数量，或依据采购合同、付款记录证实有资产购入但台账未登记，均为账外资产。处置资产收益未入账，可能形成新的账外资金或私分。
  audit_item: 私设会计账簿、私存私放财政资金或者其他公款、资产
  suspicion: 存在账外资产未纳入统一核算
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十条\",\n    \"内容概述\": \"各部门及其所属单位应当对下列资产及时予以报废、报损：……资产的处置收入、收益等，应当按照政府非税收入和国库集中收缴制度的有关规定上缴……\"\n  },\n  {\n    \"\
    法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十四号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\"\
    : \""
