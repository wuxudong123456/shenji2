name: audit/登记台账类/协议台账
type: model
description: 从登记台账类类文档（协议台账）中提取结构化元数据。涵盖字段如：付款约定、协议价格、合同服务期限止、合同服务期限起、合同金额、定点酒店名称、适用区域。文档范围包括：合同或服务协议台账、定点酒店/餐馆合作协议台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 付款
- 协议
- 合同
- 金额
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 协议台账
  member_count: 1
  member_details:
  - 合同或服务协议台账
  - 定点酒店/餐馆合作协议台账
output:
  fields:
  - name: 付款约定
    type: number
    description: 提取 付款约定 的数值（含单位，如万元、吨等）
  - name: 协议价格
    type: number
    description: 提取 协议价格 的数值（含单位，如万元、吨等）
  - name: 合同服务期限止
    type: string
    description: 提取 合同服务期限止 的文本值
  - name: 合同服务期限起
    type: string
    description: 提取 合同服务期限起 的文本值
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 定点酒店名称
    type: string
    description: 提取 定点酒店名称 的文本值
  - name: 适用区域
    type: string
    description: 提取 适用区域 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (财务报销凭证.住宿发票开具方 NOT IN (定点酒店/餐馆合作协议台账.定点酒店名称)) OR (财务报销凭证.金额 > 定点酒店/餐馆合作协议台账.协议价格 * 1.1) OR (财务报销凭证.所附审批单情况
    != '特殊情况说明' AND 财务报销凭证.住宿发票开具方 NOT IN (定点酒店/餐馆合作协议台账.定点酒店名称))
  description: 入住非协议定点酒店，或实际支付价格超出协议价10%以上且无合理说明，即视为违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 未执行定点住宿制度
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关差旅费管理办法\",\n    \"法规文号\": \"财行〔2013〕531号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条、第十一条\",\n    \"内容概述\": \"出差人员应当到定点饭店住宿，住宿费按照定点饭店的协议价格结算；未按规定等级乘坐交通工具、住宿的，超支部分由个人自理。\"\n  }\n]"
- expression: 记账凭证.费用归属期间 > 协议台账.合同服务期限止 || (记账凭证.费用归属期间 > 记账凭证.记账日期 && 协议台账.付款约定 != '预付')
  description: 此表达式用于识别提前或滞后确认费用的跨期调节行为。核心逻辑：1.凭证上标明的费用归属期间，晚于合同约定的服务结束日期，即费用所属期间无对应服务，属于提前或滞后违规计提；2.在非预付合同约定下，记账凭证标明的费用归属期间晚于记账日期，表明将未来期间的费用提前计入了当期，属于提前计提。
  audit_item: 违规提取管理费用
  suspicion: 跨期违规计提管理费用
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第30号——财务报表列报\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第七条\",\n    \"内容概述\": \"企业应当以持续经营为基础，根据实际发生的交易和事项，按照《企业会计准则——基本准则》和其他各项会计准则的规定进行确认和计量，在此基础上编制财务报表。\"\n  },\n\
    \  {\n    \"法规名称\": \"中华人民共和国企业所得税法实施条例\",\n    \"法规文号\": \"国务院令第512号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\"\
    ,\n  "
