name: audit/登记台账类/落实台账
type: model
description: 从登记台账类类文档（落实台账）中提取结构化元数据。涵盖字段如：对应问题编号、整改完成情况、整改完成日期。文档范围包括：整改落实台账等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 登记台账类
- 审计
- 整改
- 元数据提取
template_class:
  category: 登记台账类
  member_types:
  - 落实台账
  member_count: 1
  member_details:
  - 整改落实台账
output:
  fields:
  - name: 对应问题编号
    type: string
    description: 提取 对应问题编号 的文本值
  - name: 整改完成情况
    type: string
    description: 提取 整改完成情况 的文本值
  - name: 整改完成日期
    type: date
    description: 提取 整改完成日期 的日期值，格式 YYYY-MM-DD
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记日期
    type: date
    description: 登记/录入日期，格式 YYYY-MM-DD
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 数量
    type: number
    description: 涉及数量
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (管护评估评价报告.发现问题编号 IS NOT NULL) AND (整改落实台账中无对应问题编号的整改记录 OR 整改落实台账.整改完成情况 = '未完成')
  description: 管护评估报告指出的问题未在整改台账中找到对应闭环记录，或记录显示“未完成”，判定为评估结果未有效应用。
  audit_item: 高标准农田管护使用不符合相关规定
  suspicion: 管护评估评价结果未有效应用
  regulation: "[\n  {\n    \"法规名称\": \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十七条\"\
    ,\n    \"内容概述\": \"县级以上人民政府水行政主管部门和有关部门应当对农田水利设施的管护情况定期进行检查评估，对发现的问题督促整改。\"\n  }\n]"
