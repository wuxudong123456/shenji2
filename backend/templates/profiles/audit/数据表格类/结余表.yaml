name: audit/数据表格类/结余表
type: model
description: 从数据表格类类文档（结余表）中提取结构化元数据。涵盖字段如：实际支出、年度预算、结余率、结余金额。文档范围包括：技能提升专项资金结余表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 预算
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 结余表
  member_count: 1
  member_details:
  - 技能提升专项资金结余表
output:
  fields:
  - name: 实际支出
    type: number
    description: 提取 实际支出 的数值（含单位，如万元、吨等）
  - name: 年度预算
    type: date
    description: 提取 年度预算 的日期值，格式 YYYY-MM-DD
  - name: 结余率
    type: string
    description: 提取 结余率 的文本值
  - name: 结余金额
    type: number
    description: 提取 结余金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (COUNT(数据.身份证号 NOT IN (审批台账.身份证号 WHERE 审批台账.审批状态（通过/未通过）='通过') && 数据.累计参保月数 >= 补贴对象条件（证书类型、参保月数要求).参保月数要求) >
    0 && 结余表.结余率 > 0.3) || (COUNT(审批台账.身份证号 WHERE 审批台账.审批状态（通过/未通过）='未通过' AND (审批台账.拒绝原因='材料不全' OR 审批台账.拒绝原因='不符合资格')) / COUNT(审批台账.身份证号
    WHERE 审批台账.审批状态（通过/未通过）='未通过') > 0.5 && 结余表.结余率 > 0.5)
  description: 符合申领条件（取得职业资格证书且参保累计满12个月）的人员未被发放补贴，且年度补贴资金结余率大于30%，视为存在应补未补；或者审批台账中因“材料不全”“不符合资格”等可纠正原因拒绝的比例超过50%且结余率超过50%，表明可能存在人为设置障碍或宣传不到位导致大量人员未成功申领。结余率越高违规风险越大。
  audit_item: 职业技能提升行动方案执行不到位
  suspicion: 符合条件人员未按规定享受技能提升补贴
  regulation: "[\n  {\n    \"法规名称\": \"人力资源社会保障部 财政部关于失业保险支持参保职工提升职业技能有关问题的通知\",\n    \"法规文号\": \"人社部发〔2017〕40号\",\n    \"\
    效力级别\": \"部门规章\",\n    \"条款号\": \"二、申领条件 三、审核程序\",\n    \"内容概述\": \"同时符合依法参加失业保险累计缴费12个月以上、取得职业资格证书或职业技能等级证书的，可申领技能提升补贴；审核应在规定期限内完成，补贴资金直接发放至申请人个人账户。\"\
    \n  }\n]"
