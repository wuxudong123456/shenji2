name: audit/数据表格类/计划表
type: model
description: 从数据表格类类文档（计划表）中提取结构化元数据。涵盖字段如：保供量、剩余使用年限计算值、剩余库容、安排年份、安排年度、安排状态、安排金额、实际授课内容。文档范围包括：三年滚动投资计划表、培训课程实施计划表、填埋场扩容计划表、年度预算安排计划表、用气需求量与气源供应计划表、禁捕工作任务分解与时间节点计划表、重点项目计划表、项目进度计划表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 项目
- 预算
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 计划表
  member_count: 1
  member_details:
  - 三年滚动投资计划表
  - 培训课程实施计划表
  - 填埋场扩容计划表
  - 年度预算安排计划表
  - 用气需求量与气源供应计划表
  - 禁捕工作任务分解与时间节点计划表
  - 重点项目计划表
  - 项目进度计划表
output:
  fields:
  - name: 保供量
    type: string
    description: 提取 保供量 的文本值
  - name: 剩余使用年限计算值
    type: string
    description: 提取 剩余使用年限计算值 的文本值
  - name: 剩余库容
    type: string
    description: 提取 剩余库容 的文本值
  - name: 安排年份
    type: string
    description: 提取 安排年份 的文本值
  - name: 安排年度
    type: date
    description: 提取 安排年度 的日期值，格式 YYYY-MM-DD
  - name: 安排状态
    type: boolean
    description: 提取 安排状态 的布尔值（是/否）
  - name: 安排金额
    type: number
    description: 提取 安排金额 的数值（含单位，如万元、吨等）
  - name: 实际授课内容
    type: string
    description: 提取 实际授课内容 的文本值
  - name: 年度投资计划
    type: date
    description: 提取 年度投资计划 的日期值，格式 YYYY-MM-DD
  - name: 应急储备天数
    type: number
    description: 提取 应急储备天数 的数值（含单位，如万元、吨等）
  - name: 扩容计划立项日期
    type: date
    description: 提取 扩容计划立项日期 的日期值，格式 YYYY-MM-DD
  - name: 授课教师
    type: string
    description: 提取 授课教师 的文本值
  - name: 授课时间
    type: date
    description: 提取 授课时间 的日期值，格式 YYYY-MM-DD
  - name: 计划完成日期
    type: date
    description: 提取 计划完成日期 的日期值，格式 YYYY-MM-DD
  - name: 计划完成时间
    type: date
    description: 提取 计划完成时间 的日期值，格式 YYYY-MM-DD
  - name: 计划工期
    type: string
    description: 提取 计划工期 的文本值
  - name: 计划年度
    type: date
    description: 提取 计划年度 的日期值，格式 YYYY-MM-DD
  - name: 计划进度百分比
    type: string
    description: 提取 计划进度百分比 的文本值
  - name: 计划里程碑名称
    type: string
    description: 提取 计划里程碑名称 的文本值
  - name: 设计总库容
    type: string
    description: 提取 设计总库容 的文本值
  - name: 责任单位
    type: string
    description: 提取 责任单位 的文本值
  - name: 资金需求总额
    type: number
    description: 提取 资金需求总额 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 高峰日用气量
    type: string
    description: 提取 高峰日用气量 的文本值
  - name: 方案名称
    type: string
    description: 方案/计划全称
    required: false
  - name: 编制单位
    type: string
    description: 方案编制单位
    required: false
  - name: 编制日期
    type: date
    description: 编制日期，格式 YYYY-MM-DD
    required: false
  - name: 目标
    type: string
    description: 方案目标/预期成果
    required: false
  - name: 实施期限
    type: string
    description: 实施起止时间
    required: false
  - name: 资金来源
    type: string
    description: 资金来源/拨款渠道
    required: false
  - name: 实施步骤
    type: string
    description: 主要实施步骤/阶段
    required: false
  - name: 责任人
    type: string
    description: 主要责任人
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 安排表.项目存在 && 备案台账.备案状态 == '未备案'
  description: 若项目已在年度预算安排计划表中安排预算，但在绩效目标备案台账中未找到对应备案记录或备案状态为“未备案”，则判定为绩效目标未报财政部备案即安排预算。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 绩效目标未报财政部备案
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"各部门审核后的项目支出绩效目标应报财政部备案，未备案的不得安排预算。\"\n  },\n  {\n    \"法规名称\": \"财政部关于贯彻落实〈中共中央 国务院关于全面实施预算绩效管理的意见〉的通知\"\
    ,\n    \"法规文号\": \"财预〔2018〕167号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"强化绩效目标管理，严"
- expression: (申报表.审核意见 == '不通过' 或 审核记录.审核结论 == '不合格') && 安排表.安排状态 == '已安排预算'
  description: 若项目绩效目标审核意见为“不通过”或审核过程记录显示“不合格”，但该项目却出现在年度预算安排计划表中且状态为“已安排预算”，则判定为审核不合格即进入预算安排流程。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 审核不合格即进入预算安排流程
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"2014年修正\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条\"\
    ,\n    \"内容概述\": \"各部门、各单位应当按照绩效目标管理等预算绩效管理要求编制预算草案。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条、第十七条\",\n    \"内容概述\": \"绩效目标审核不合格的项目不得进入预算安排环节，需修改完善后重新审核。\"\n  "
- expression: (申报表.绩效目标内容 == '无' 或 申报表.绩效目标内容 == '暂无' 或 申报表.审核意见 == '不通过' 或 不合格台账.处理结果 == '保留预算') && 安排表.安排状态 == '已安排'
  description: 项目在绩效目标申报表中绩效目标为空或填写“无”“暂无”，或审核意见为不通过，或被列入审核不合格项目台账且未剔除预算安排，但年度预算安排计划表中依然安排了预算，即构成违规。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 违规为未设定或未通过绩效目标的项目安排预算
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"党内法规/行政法规\"\
    ,\n    \"条款号\": \"第三部分\",\n    \"内容概述\": \"未按要求设定绩效目标或审核未通过的项目，一律不得安排预算。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"未设定绩效目标或绩效目标审核未通过的，不得纳入预"
- expression: (月报.实际里程碑完成日期 - 计划完成日期 > 30 && (会议纪要.预警事项记录 == null || 审批表.批复日期 > 月报.实际里程碑完成日期))
  description: 当任一关键里程碑实际完成时间超出计划30天以上，且项目进度会议纪要中无相应进度预警及纠偏指令，或工期延期审批滞后于实际延误发生时间，判定为进度管理失控，存在未及时识别并纠正偏差的违规行为。
  audit_item: 大型水利工程进度与成本审计
  suspicion: 关键里程碑节点延误未实施纠偏措施
  regulation: "[\n  {\n    \"法规名称\": \"水利工程建设项目管理规定（试行）\",\n    \"法规文号\": \"水建[1995]128号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十条\",\n    \"内容概述\": \"项目法人应加强建设项目的管理，严格控制工程进度，建立进度控制目标体系，定期进行进度分析，采取有效赶工措施纠正偏差。\"\n  },\n  {\n    \"法规名称\"\
    : \"建设工程监理规范\",\n    \"法规文号\": \"GB/T 50319-2013\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"6.2.5\",\n    \"内容概述\": \"\
    项目监理机构"
- expression: (监测报告.重金属含量 > 国家标准 && 监测报告.异常热源坐标 < 500米) || (监测报告.渗滤液处理指标 < 0.9) || (验收报告.防渗措施 != '通过' && 计划表.每日填埋量 > 0)
  description: 填埋场周边500米内地下水重金属超标或渗滤液处理达标率低于90%，或防渗未通过验收却已启用，均判定为违规填埋，存在污染风险。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 收集垃圾违规填埋造成污染隐患
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"建设利用填埋方式处置生活垃圾的，应当按照国家有关规定采取防渗漏、防扬散、防流失等环境保护措施。\"\n  },\n  {\n    \"法规名称\": \"生活垃圾填埋场污染控制标准\"\
    ,\n    \"法规文号\": \"GB 16889-2008\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"4.4\",\n    \"内容概述\": \"填埋场必须设置防渗层，并确保渗滤液有效"
- expression: (扩容计划立项日期.剩余库容 / 设计总库容 < 0.05) && (扩容计划立项日期.扩容计划立项日期 IS NULL || 专项规划.规划替代或扩建方案 IS NULL) && (每日清运趟次.日进场垃圾量 >
    0)
  description: 当剩余库容不足5%（接近饱和），且无扩容计划或替代方案立项，同时仍在继续接收垃圾，即判定为存在饱和风险未及时应对，可能导致未来垃圾无处可去甚至超量填埋。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 垃圾填埋场趋于饱和未及时扩容
  regulation: "[\n  {\n    \"法规名称\": \"城镇生活垃圾卫生填埋场运行维护技术规程\",\n    \"法规文号\": \"CJJ 93-2011\",\n    \"效力级别\": \"行业规范\",\n \
    \   \"条款号\": \"3.2.6\",\n    \"内容概述\": \"填埋场达到设计使用年限或填埋容量达到设计库容时，应及时封场并同步建设新的处理设施或采取替代方案。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"\
    县级以上人民政府应当统筹安"
- expression: (保供量 < 需求量 * 1.1) || (应急储备天数 < 3) || (照付不议条款 == '无' ) || (实际通气率 < 0.8 && 散煤复烧率 > 0.3)
  description: 气源协议保供量未达需求量的110%，或应急储备不足3天，或未签订照付不议合同，均视为气源保障不足；管道已通但实际通气率低于80%且散煤复烧率超30%，反映气源或气价问题导致弃用。
  audit_item: 项目规划统筹衔接不到位
  suspicion: 煤改气工程气源保障存在断供风险
  regulation: "[\n  {\n    \"法规名称\": \"城镇燃气管理条例\",\n    \"法规文号\": \"国务院令第583号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十四条、第十八条\",\n    \"内容概述\": \"县级以上地方人民政府应当建立健全燃气应急储备制度；燃气经营者应当保障燃气稳定供应，不得擅自停气、换气。\"\n  }\n]"
- expression: 投资计划申请表.项目名称 NOT IN (计划表.项目名称) WHERE 计划表.覆盖年度 = 投资计划申请表.申报年度 || 计划表无任何记录
  description: 申报项目必须列入对应年度的三年滚动投资计划，若项目不在计划表单内，或计划表缺失，则判定为违规。
  audit_item: 项目计划申报不合规
  suspicion: 涉农项目申报未纳入三年滚动投资计划
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于加强政府投资项目储备编制三年滚动投资计划的通知\",\n    \"法规文号\": \"发改投资[2015]2463号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二部分\",\n    \"内容概述\": \"各地区、各部门要建立健全项目储备制度，编制三年滚动投资计划，未纳入计划的项目原则上不得安排年度投资。\"\n  }\n]"
- expression: (禁捕工作阶段总结报告.实际完成时间 > 禁捕工作任务分解与时间节点计划表.计划完成时间) || (禁捕工作阶段总结报告.实际完成率 < 禁捕工作任务分解与时间节点计划表.计划进度百分比 && (禁捕工作阶段总结报告.实际完成时间
    - 禁捕工作任务分解与时间节点计划表.计划完成时间) > 30) || (上级部门督办通知.要求完成时限 < 上级部门督办通知.整改反馈时间 && ABS(上级部门督办通知.整改反馈时间 - 上级部门督办通知.要求完成时限) > 15)
    || (禁捕专项资金分配与使用情况说明.资金拨付时间 > 长江禁捕分阶段实施方案.阶段目标完成时限 && (禁捕专项资金分配与使用
  description: 判定规则：计划完成时间为长江禁捕分阶段实施方案或任务分解计划表中的截止时间；实际完成日期来自阶段总结报告或进度汇报材料。若实际完成日期超过计划时间，或完成率未达标且滞后超过30天，即为违规。上级督办事项整改反馈时间超过要求完成日期15天以上的视同推进不力。专项资金到位时间较计划拨付时间滞后超过30天的，判定为资金保障不到位导致推进慢。
  audit_item: 任务目标未按时完成（长江全面禁捕）
  suspicion: 长江禁捕分阶段工作推进滞后
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第五条（十五）项\",\n    \"内容概述\": \"要求稳步推进长江流域重点水域禁捕工作，明确时间表和路线图，确保按时完成各项任务。\"\n  }\n]"
- expression: (数据表格类-计划表-实际授课内容不符合政策文件类-政策文件-各培训类型应包含的内容模块要求) || (清单名册类-人员名单-职业与数据表格类-对照表-培训类型所要求的对象职业要求不匹配)
  description: 例如，新型职业农民培训应包含农业技术、经营管理等核心模块，如课程表中缺少相应模块，或实际授课内容为简单家政服务，则判定违规；培训对象筛选标准要求参训人员为农业从业者，若出现职业为“学生”“企业职员”等非农人员，则触发疑点。
