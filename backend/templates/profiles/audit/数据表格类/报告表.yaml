name: audit/数据表格类/报告表
type: model
description: 从数据表格类类文档（报告表）中提取结构化元数据。涵盖字段如：上报时间、事故发现时间、兼职单位及职务、兼职取酬情况、兼职收入、出资比例、出资额、劳务报酬所得。文档范围包括：个人事项报告表、党员领导干部个人事项报告表、第三方检测机构电压质量评估报告表、耕地质量监测绩效评价报告表、食品安全事故处理报告表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 资产
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 报告表
  member_count: 1
  member_details:
  - 个人事项报告表
  - 党员领导干部个人事项报告表
  - 第三方检测机构电压质量评估报告表
  - 耕地质量监测绩效评价报告表
  - 食品安全事故处理报告表
output:
  fields:
  - name: 上报时间
    type: date
    description: 提取 上报时间 的日期值，格式 YYYY-MM-DD
  - name: 事故发现时间
    type: date
    description: 提取 事故发现时间 的日期值，格式 YYYY-MM-DD
  - name: 兼职单位及职务
    type: string
    description: 提取 兼职单位及职务 的文本值
  - name: 兼职取酬情况
    type: string
    description: 提取 兼职取酬情况 的文本值
  - name: 兼职收入
    type: number
    description: 提取 兼职收入 的数值（含单位，如万元、吨等）
  - name: 出资比例
    type: number
    description: 提取 出资比例 的数值（含单位，如万元、吨等）
  - name: 出资额
    type: string
    description: 提取 出资额 的文本值
  - name: 劳务报酬所得
    type: string
    description: 提取 劳务报酬所得 的文本值
  - name: 发病人数
    type: number
    description: 提取 发病人数 的数值（含单位，如万元、吨等）
  - name: 填报的经商办企业情况
    type: string
    description: 提取 填报的经商办企业情况 的文本值
  - name: 处置措施
    type: string
    description: 提取 处置措施 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 承包租赁经营活动申报
    type: string
    description: 提取 承包租赁经营活动申报 的文本值
  - name: 投资企业名称
    type: string
    description: 提取 投资企业名称 的文本值
  - name: 投资方式
    type: string
    description: 提取 投资方式 的文本值
  - name: 投资金额
    type: number
    description: 提取 投资金额 的数值（含单位，如万元、吨等）
  - name: 本人身份
    type: string
    description: 提取 本人身份 的文本值
  - name: 独立检测的电压合格率
    type: string
    description: 提取 独立检测的电压合格率 的文本值
  - name: 电压偏差值
    type: string
    description: 提取 电压偏差值 的文本值
  - name: 监测数值
    type: string
    description: 提取 监测数值 的文本值
  - name: 监测日期
    type: date
    description: 提取 监测日期 的日期值，格式 YYYY-MM-DD
  - name: 监测点编号
    type: string
    description: 提取 监测点编号 的文本值
  - name: 监测项目
    type: string
    description: 提取 监测项目 的文本值
  - name: 直系亲属及特定关系人经商办企业情况
    type: string
    description: 提取 直系亲属及特定关系人经商办企业情况 的文本值
  - name: 职务
    type: string
    description: 提取 职务 的文本值
  - name: 评价结论
    type: string
    description: 提取 评价结论 的文本值
  - name: 资产情况
    type: string
    description: 提取 资产情况 的文本值
  - name: 报告名称
    type: string
    description: 报告/文档标题全称
    required: false
  - name: 报告类型
    type: string
    description: 报告类型（审计/评估/检测/验收/总结等）
    required: false
  - name: 报告日期
    type: date
    description: 报告日期，格式 YYYY-MM-DD
    required: false
  - name: 报告期间
    type: string
    description: 报告涵盖的会计期间/时间段
    required: false
  - name: 编制单位
    type: string
    description: 报告编制单位全称
    required: false
  - name: 编制人
    type: string
    description: 报告编制人/撰写人姓名
    required: false
  - name: 审核人
    type: string
    description: 报告审核人姓名
    required: false
  - name: 批准人
    type: string
    description: 报告批准人/签发人姓名
    required: false
  - name: 报告文号
    type: string
    description: 报告文号/编号
    required: false
  - name: 密级
    type: string
    description: 密级（公开/内部/秘密/机密/绝密）
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (党员领导干部个人事项报告表.填报的经商办企业情况 IS NULL OR 党员领导干部个人事项报告表.投资企业名称 NOT CONTAINS 企业名称) AND (工商注册登记信息.股东/发起人姓名及身份证号 = 领导干部身份证号
    OR 工商注册登记信息.法定代表人姓名及身份证号 = 领导干部身份证号) AND (工商注册登记信息.出资比例 > 0) AND (工商注册登记信息.企业状态 = '存续')
  description: 依据个人报告表与工商登记信息比对，如果领导干部未在报告表中申报任何经商办企业记录，但在工商注册登记中直接登记为股东或法定代表人且持股比例大于0，则视为违反规定个人独资或与他人合资合股经商办企业。同时排除企业已注销等状态。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 个人独资或与他人合资合股经办企业
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（一）项\",\n    \"内容概述\": \"违反有关规定从事营利活动，经商办企业的，视情节给予警告直至开除党籍处分。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n\
    \    \"法规文号\": \"主席令第二十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十九条第十六项\",\n    \"内容概述\": \"公务员不得违反有关规定从事或者参与营利性活动，在企业或者其他"
- expression: (企业股东及股权变更记录.受让方姓名 IN 领导干部直系亲属及特定关系人名单.亲属姓名) && (企业股东及股权变更记录.转让价格 < 企业净资产负债比例对应股权价值*0.7 OR 企业股东及股权变更记录.转让价格为0
    OR 企业股东及股权变更记录.转让方与受让方为无对价转让) && (银行账户流水.付款方==领导干部 OR 银行账户流水.付款方==领导干部配偶 && 银行账户流水.资金用途 CONTAINS '投资款' OR '股权款') && 党员领导干部个人有关事项报告表.未填报该亲属名下的企业投资
  description: 筛选股权变更记录中受让方为领导干部直系亲属或特定关系人，且转让价格明显低于公允价值（低于70%）甚至无偿转让，同时存在领导干部或其配偶账户向原股东或亲属支付大额款项的痕迹，并且领导干部未在个人事项报告中申报亲属的该笔投资。表达式考虑了代持行为核心特征：低价转让、资金来源于领导干部、未如实申报。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 以他人名义入股形式经办企业
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（一）项、第（二）项\",\n    \"内容概述\": \"违反规定从事营利活动，经商办企业，或者拥有非上市公司（企业）的股份或者证券的，给予相应处分。以他人名义持股仍属违规。\"\n  },\n  {\n   \
    \ \"法规名称\": \"关于领导干部报告个人有关事项的规定\",\n    \"法规文号\": \"中办发〔2017〕12号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第四条\",\n\
    \    \"内容概"
- expression: (聘用协议文件.甲乙双方名称及签章 CONTAINS 领导干部姓名 OR 聘用协议文件.甲乙双方名称及签章 CONTAINS 领导干部化名) && (党员领导干部个人事项报告表.兼职取酬情况 IS NULL OR 党员领导干部个人事项报告表.承包租赁经营活动申报
    IS NULL) && (银行账户流水.交易金额 == 聘用协议文件.酬金/租金金额及支付方式 OR 银行账户流水.交易金额 累计超过 5000元/月) && (银行账户流水.资金用途（顾问费/租金/承包费） IN ['顾问费','租赁费','承包费','咨询费'])
    && (单位考勤记录.请假记录 IS NOT NULL OR 单位
  description: 当存在承包、租赁、聘用协议文件且协议乙方为领导干部本人或其化名，但个人事项报告表未申报该项兼职或经营活动，同时银行流水显示有规律性金额转账（累计月均超5000元作为参考阈值）且备注为经营类款项，并辅以考勤异常，则判定为私自从事经营活动。
  audit_item: 党员领导干部个人或者借他人名义经商、办企业
  suspicion: 私自以承包、租赁、受聘等方式从事经营活动
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"2023年修订\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"\
    第一百零三条第一款第（五）项、第（六）项\",\n    \"内容概述\": \"违反有关规定从事营利活动，有下列行为之一的：（五）违规在经济组织、社会组织等单位中兼职，或者经批准兼职但获取薪酬、奖金、津贴等额外利益；（六）利用参与企业重组改制、定向增发、兼并投资等工作中掌握的信息买卖股票，或者以其他方式非正常获利。私自承包、租赁、受聘属于违规兼职或从事营利活动。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国公务员"
- expression: (在职人员兼职申报审批表.审批状态 != '批准' OR 在职人员兼职申报审批表.兼职单位 NOT IN (行业协会商会成员名单.任职单位)) AND (党员领导干部个人事项报告表.兼职单位及职务 = 行业协会商会成员名单.任职单位
    OR 行业协会商会成员名单.身份证号 IS NOT NULL)
  description: 判断是否存在在职人员（尤其是领导干部）在行业协会商会兼职但未申报或审批未通过的情形：1.兼职申报表中无对应兼职记录或审批未批准；2.个人事项报告中披露了该兼职但审批缺失；或者未在个人报告中披露但在行业协会名单中发现。满足任一条件即触发疑点，需结合职级判定领导干部身份。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 在职人员违规在行业协会商会兼职
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十四条\",\n    \"内容概述\": \"违反有关规定在经济组织、社会组织等单位中兼职，或者经批准兼职但获取薪酬、奖金、津贴等额外利益的，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"中华人民共和国主席令第二十号\",\n    \"效力级别\": \"法"
- expression: (经济实体股东高管名单.人员姓名 IN (在职人员兼职申报审批表.姓名) AND (在职人员兼职申报审批表.审批状态 != '批准' OR 在职人员兼职申报审批表.兼职单位 != 经济实体股东高管名单.企业名称))
    AND (薪酬发放凭证.收款人姓名 == 经济实体股东高管名单.人员姓名 OR 工资外收入明细表.对方单位 == 经济实体股东高管名单.企业名称 AND 工资外收入明细表.金额 > 0)
  description: 首先识别在职人员在经济实体兼任股东或高管且未履行批准程序，然后判定存在从该实体收取报酬的证据（如银行流水显示顾问费、工资外收入明细中的劳务费等）。两个条件同时满足即构成违规兼职取酬。若仅兼职未发现取酬，仍可能构成违规兼职，另案处理。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 在职人员违规兼职取酬
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十四条\",\n    \"内容概述\": \"违反有关规定在经济组织、社会组织等单位中兼职，或者经批准兼职但获取薪酬、奖金、津贴等额外利益的，依照前款规定处理。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国公职人员政务处分法\",\n    \"法规文号\": \"中华人民共和国主席令第四十六号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十六条\",\n    \"内容概述\"\
    : \"违反规定从"
- expression: ([报告表].独立检测的电压合格率 < [目标供电可靠率].目标综合电压合格率) && (当前日期 > [目标供电可靠率].任务完成时间节点)
  description: 监测数据表的实际综合电压合格率低于实施方案规定的目标值，且已超过政府限定的任务完成时限，即判定为未完成。若低于目标值3个百分点以上，或末端用户电压偏差超过国家允许范围（如低于198V），可视为严重违规。
  audit_item: 农村电网改造升级任务目标未完成
  suspicion: 综合电压合格率未按期实现任务目标
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2013〕678号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十三条\",\n    \"内容概述\": \"项目应实现规定的电压合格率等电能质量指标，未达标的应分析原因并限期整改。\"\n  },\n  {\n    \"法规名称\": \"供电监管办法\",\n\
    \    \"法规文号\": \"国家电力监管委员会令第27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条、第十二条\",\n    \"内容概述\": \"供电企业应当保证供电电压质量符合国家标准，发现电压"
- expression: (预案.发布日期 == '无') || (演练记录.演练日期 < 当前日期 - 365天) || (报告表.上报时间 - 事故发现时间 > 2小时)
  description: 未制定书面应急预案、一年内未组织开展应急演练，或发生疑似食品安全事故后超过2小时才向相关部门报告，均属重大管理缺陷。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 食品安全应急预案缺失或事故处理延迟
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国食品安全法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零二条、第一百零三条\",\n    \"内容概述\": \"学校等集中用餐单位应当制定食品安全事故应急预案；发生食品安全事故的单位应当在2小时内向事故发生地县级人民政府食品安全监督管理部门和卫生行政部门报告。\"\n  }\n]"
