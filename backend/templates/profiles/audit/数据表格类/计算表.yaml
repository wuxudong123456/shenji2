name: audit/数据表格类/计算表
type: model
description: 从数据表格类类文档（计算表）中提取结构化元数据。涵盖字段如：分配标准及分配率、制造费用分摊、各产品分摊的制造费用、员工工号、在产品数量、在产品约当产量、处置作价、姓名。文档范围包括：专用基金计提计算表、产品成本计算表、利息资本化计算表、参股企业股权结构及担保比例计算表、工资计算表、资产处置收益计算表、递延收益摊销计算表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 薪酬
- 资产
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 计算表
  member_count: 1
  member_details:
  - 专用基金计提计算表
  - 产品成本计算表
  - 利息资本化计算表
  - 参股企业股权结构及担保比例计算表
  - 工资计算表
  - 资产处置收益计算表
  - 递延收益摊销计算表
output:
  fields:
  - name: 分配标准及分配率
    type: string
    description: 提取 分配标准及分配率 的文本值
  - name: 制造费用分摊
    type: number
    description: 提取 制造费用分摊 的数值（含单位，如万元、吨等）
  - name: 各产品分摊的制造费用
    type: number
    description: 提取 各产品分摊的制造费用 的数值（含单位，如万元、吨等）
  - name: 员工工号
    type: string
    description: 提取 员工工号 的文本值
  - name: 在产品数量
    type: number
    description: 提取 在产品数量 的数值（含单位，如万元、吨等）
  - name: 在产品约当产量
    type: string
    description: 提取 在产品约当产量 的文本值
  - name: 处置作价
    type: string
    description: 提取 处置作价 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 完工数量
    type: number
    description: 提取 完工数量 的数值（含单位，如万元、吨等）
  - name: 工资额
    type: string
    description: 提取 工资额 的文本值
  - name: 已完工产品单位成本
    type: string
    description: 提取 已完工产品单位成本 的文本值
  - name: 当期制造费用转入额
    type: number
    description: 提取 当期制造费用转入额 的数值（含单位，如万元、吨等）
  - name: 持股比例
    type: number
    description: 提取 持股比例 的数值（含单位，如万元、吨等）
  - name: 按持股比例计算应承担的担保上限
    type: number
    description: 提取 按持股比例计算应承担的担保上限 的数值（含单位，如万元、吨等）
  - name: 摊销金额
    type: number
    description: 提取 摊销金额 的数值（含单位，如万元、吨等）
  - name: 期末存货金额
    type: number
    description: 提取 期末存货金额 的数值（含单位，如万元、吨等）
  - name: 直接人工
    type: string
    description: 提取 直接人工 的文本值
  - name: 直接人工成本分配率
    type: string
    description: 提取 直接人工成本分配率 的文本值
  - name: 直接材料
    type: string
    description: 提取 直接材料 的文本值
  - name: 相关税费
    type: number
    description: 提取 相关税费 的数值（含单位，如万元、吨等）
  - name: 确认的资产处置收益金额
    type: number
    description: 提取 确认的资产处置收益金额 的数值（含单位，如万元、吨等）
  - name: 被担保企业净资产
    type: string
    description: 提取 被担保企业净资产 的文本值
  - name: 计提基数
    type: string
    description: 提取 计提基数 的文本值
  - name: 计提比例
    type: number
    description: 提取 计提比例 的数值（含单位，如万元、吨等）
  - name: 计提金额
    type: number
    description: 提取 计提金额 的数值（含单位，如万元、吨等）
  - name: 资产账面净值
    type: string
    description: 提取 资产账面净值 的文本值
  - name: 资本化开始-暂停-停止日期
    type: date
    description: 提取 资本化开始-暂停-停止日期 的日期值，格式 YYYY-MM-DD
  - name: 资本化金额计算过程
    type: number
    description: 提取 资本化金额计算过程 的数值（含单位，如万元、吨等）
  - name: 递延收益科目本期贷方发生额
    type: string
    description: 提取 递延收益科目本期贷方发生额 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (计提表.计提基数 != 余额表.事业收入 + 余额表.经营收入) || (计提表.计提比例 != 政策文件.规定计提比例) || (ABS(计提表.计提金额 - 计提表.计提基数 * 政策文件.规定计提比例) >
    0)
  description: 专用基金计提基数与科目余额表中对应收入合计数不一致，或实际采用的计提比例与政策规定不符，或计算出的计提金额不等于基数乘比例，任一条成立即触发疑点。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 专用基金计提基数或比例错误
  regulation: "[\n  {\n    \"法规名称\": \"《事业单位财务规则》\",\n    \"法规文号\": \"财政部令第108号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第二十六条\",\n    \"内容概述\": \"事业单位应当按规定提取修购基金、职工福利基金和其他专用基金，不得随意改变计提基数、比例和支出用途。\"\n  }\n]"
- expression: 业务台账.持股比例 > 0 && 业务台账.持股比例 < 100% && (业务台账.担保金额 / 计算表.被担保企业净资产) > 业务台账.持股比例 && (业务台账.是否有反担保标识 != '是')
  description: 对参股企业提供的担保金额与其净资产的比值超过公司持股比例，且未要求其他股东按股权比例共同提供担保，也未取得被担保方相应的反担保，即判定为超股权比例违规担保。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 对参股企业提供担保超出持股比例
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"中央企业应当严格按照持股比例对子公司和参股企业提供担保。严禁对参股企业超股比担保。\"\n  },\n  {\n    \"法规名称\": \"关于规范上市公司对外担保行为的通知\"\
    ,\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"上市公司对外担保必须经董"
- expression: 资产处置收益计算表.处置作价 - 资产处置收益计算表.资产账面净值 - 资产处置收益计算表.相关税费 < ABS(样本.贷方科目 - 样本.借方科目)
  description: 该逻辑检查是否将资产处置总价款直接计入营业收入或未冲减资产账面价值。正确的处理应为按净额（售价-账面价值-税费）确认资产处置损益，并分别冲销固定资产原值和累计折旧。若利润表项目的发生额大于计算出的净收益，则存在净额法误用为总额法的嫌疑。
  audit_item: 未按规定核算收益及营业外收支
  suspicion: 资产处置收益未按净额法确认
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第4号——固定资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十三条\",\n    \"内容概述\": \"企业出售、转让、报废固定资产或发生固定资产毁损，应当将处置收入扣除账面价值和相关税费后的金额计入当期损益。\"\n  }\n]"
- expression: (记录表.工时数 / 产日报表.实际开工台时 > 1.5) || (ABS(记录表.工资额 - 产日报表.产量*薪酬制度.工时单价) / (产日报表.产量*薪酬制度.工时单价) > 0.2) || (记录表.员工工号
    > 16)
  description: 记录工时与机器实际开工台时比超1.5倍疑虚增；工资额偏离产量与定额工时乘积20%以上；同一人日工时超16小时明显不合理。三者满足其一即触发疑点。
  audit_item: 未按规定确认成本费用
  suspicion: 虚构工时多计成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条、第十七条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，不得以虚假的经济业务事项或者资料进行会计核算。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则——基本准则\"\
    ,\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条、第三十三条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者"
- expression: (明细表.发出商品数量 > 0 && 相应销售收入已确认超过 30天) || (明细表.库存商品期末数量/平均月销量 > 3 且 无合理积压说明)
  description: 已确认收入但发出商品长期未结转成本，或库存商品周转天数远超正常水平（>90天），均可能为少转成本导致存货虚高。
  audit_item: 未按规定确认成本费用
  suspicion: 未及时结转已售存货成本
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"企业应当在客户取得相关商品控制权时，确认收入并结转相应成本。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n   \
    \ \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"企业销售存货，应当将已售存货的成本结转为当期损益。\"\
    \n  }\n]"
- expression: (ABS(直接人工成本分配率计算表.各产品分摊的制造费用 - (各生产线实际工时或机器工时.各生产线实际工时或机器工时/各生产线实际工时或机器工时.各生产线实际工时或机器工时)*制造费用分摊) / 各产品分摊的制造费用
    > 0.1) || (费用项目、金额、归属期间.金额 > 0)
  description: 实际分配额与按统一标准重新计算之差超出10%，或制造费用中混入了应计入管理/销售费用的项目，即构成违规。
  audit_item: 未按规定确认成本费用
  suspicion: 制造费用归集和分配不正确
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"制造费用应当按合理方法分配计入产品成本，分配方法一经确定不得随意变更；非正常消耗的直接材料、直接人工和制造费用不计入存货成本。\"\n  },\n  {\n    \"法规名称\"\
    : \"企业产品成本核算制度（试行）\",\n    \"法规文号\": \"财会〔2013〕17号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十二条\",\n    \"内容概述\"\
    : \""
- expression: (ABS(直接人工成本分配率、已完工产品单位成本、各产品分摊的制造费用、分配标准及分配率、完工数量、在产品数量、在产品约当产量、直接材料、直接人工、制造费用分摊、期末存货金额、当期制造费用转入额.在产品约当产量 -
    审计重新计算的约当产量) / 审计约当产量 > 0.15) || (直接人工成本分配率、已完工产品单位成本、各产品分摊的制造费用、分配标准及分配率、完工数量、在产品数量、在产品约当产量、直接材料、直接人工、制造费用分摊、期末存货金额、当期制造费用转入额.已完工产品单位成本与历史平均差异率
    > 0.2 且 无重大工艺变更)
  description: 重新计算在产品约当产量，与账面差异超过15%即疑分配不当，可能导致完工产品和在产品成本错配。单位成本异常波动作为辅助指标。
  audit_item: 未按规定确认成本费用
  suspicion: 完工产品与在产品成本分配错误
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"在同一生产过程中，同时生产两种或两种以上的产品，且每种产品的加工成本不能直接区分的，其加工成本应当按照合理的方法在各种产品之间进行分配。\"\n  },\n  {\n    \"\
    法规名称\": \"企业产品成本核算制度（试行）\",\n    \"法规文号\": \"财会〔2013〕17号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十五条\",\n    \"\
    内容概述\": "
- expression: (资本化金额计算过程.资本化开始/暂停/停止日期 < 借款合同.签订日期) || (资本化金额计算过程.资本化开始/暂停/停止日期 > 进度报告.竣工决算日期) || (资本化金额 > (专门借款当期实际利息额 -
    暂时闲置资金投资收益) 且 超出部分无合理解释)
  description: 资本化开始晚于提款或存在暂停资本化条件未暂停，结束晚于竣工验收，或金额计算不准确，均属错误。
  audit_item: 未按规定确认成本费用
  suspicion: 固定资产借款费用资本化期间或金额错误
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第17号——借款费用\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条、第六条、第十二条\",\n    \"内容概述\": \"借款费用只有同时满足资产支出已经发生、借款费用已经发生、为使资产达到预定可使用状态所必要的购建活动已经开始才能资本化；购建发生非正常中断连续超过3个月应暂停资本化；达到预定可使用状态时停止资本化。\"\
    \n  }\n]"
- expression: (明细表.盘盈/盘亏金额 > 0 && 处理记录.审批意见) || (明细表.期末存货数量*最新采购单价 - 账面金额 > 存货余额的5%) || (毛利率同比上升超过10个百分点 && 无涨价因素)
  description: 盘盈未冲减成本直接增加收益，或通过虚列盘点数量导致存货虚增少转成本；毛利率异常飙升也常为少转成本信号。
  audit_item: 未按规定确认成本费用
  suspicion: 多计期末存货或少转营业成本
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十四条、第十五条\",\n    \"内容概述\": \"企业销售存货，应当将成本结转为当期损益；盘盈的存货应冲减当期管理费用或调整相关成本。\"\n  }\n]"
- expression: (费用项目、摘要、金额、供应商.摘要包含‘行政’‘办公用房’‘非生产部门工资’等 且 金额 > 0) || (旅游服务合同、导游费用等、服务内容、受益部门、服务/物资的用途.受益部门为管理部门 && 费用记入制造费用科目)
  description: 制造费用中包含应属于管理或销售性质的支出，或合同明确服务对象为非生产部门但计入生产成本，即构成费用分类错误。
  audit_item: 未按规定确认成本费用
  suspicion: 将期间费用计入生产成本
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条、第八条\",\n    \"内容概述\": \"存货成本仅包括与生产和劳务直接相关的支出，管理费用和销售费用应当作为期间费用处理。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第30号——财务报表列报\"\
    ,\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十四条\",\n    \"内容概述\": \"费用应当按照功能分类，分为从事经营业务"
