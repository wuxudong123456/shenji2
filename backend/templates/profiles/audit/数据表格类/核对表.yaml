name: audit/数据表格类/核对表
type: model
description: 从数据表格类类文档（核对表）中提取结构化元数据。涵盖字段如：业主分户账号、交易时间、交易用途、付款方、关联对方账户、分户账余额、分账标识、利息支出。文档范围包括：住房公积金与其他账户资金往来核对表、供应商配送清单核对表、养殖产量与补贴申报核对表、分户账总账与分户账核对表、分账核算专项管理核对表、国有资产收益入账核对表、应付利息/费用计提核对表、施工日志与监理月报核对表、银行流水核对表、非税收入票据存根联与记账联核对表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 付款
- 合同
- 补贴
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 核对表
  member_count: 1
  member_details:
  - 住房公积金与其他账户资金往来核对表
  - 供应商配送清单核对表
  - 养殖产量与补贴申报核对表
  - 分户账总账与分户账核对表
  - 分账核算专项管理核对表
  - 国有资产收益入账核对表
  - 应付利息/费用计提核对表
  - 施工日志与监理月报核对表
  - 银行流水核对表
  - 非税收入票据存根联与记账联核对表
output:
  fields:
  - name: 业主分户账号
    type: string
    description: 提取 业主分户账号 的文本值
  - name: 交易时间
    type: date
    description: 提取 交易时间 的日期值，格式 YYYY-MM-DD
  - name: 交易用途
    type: string
    description: 提取 交易用途 的文本值
  - name: 付款方
    type: number
    description: 提取 付款方 的数值（含单位，如万元、吨等）
  - name: 关联对方账户
    type: string
    description: 提取 关联对方账户 的文本值
  - name: 分户账余额
    type: number
    description: 提取 分户账余额 的数值（含单位，如万元、吨等）
  - name: 分账标识
    type: string
    description: 提取 分账标识 的文本值
  - name: 利息支出
    type: number
    description: 提取 利息支出 的数值（含单位，如万元、吨等）
  - name: 合同约定收益金额
    type: number
    description: 提取 合同约定收益金额 的数值（含单位，如万元、吨等）
  - name: 增值收益累计入账金额
    type: number
    description: 提取 增值收益累计入账金额 的数值（含单位，如万元、吨等）
  - name: 存根联金额
    type: number
    description: 提取 存根联金额 的数值（含单位，如万元、吨等）
  - name: 实收股利
    type: string
    description: 提取 实收股利 的文本值
  - name: 实际入账金额
    type: number
    description: 提取 实际入账金额 的数值（含单位，如万元、吨等）
  - name: 实际核验产量
    type: string
    description: 提取 实际核验产量 的文本值
  - name: 对应借款
    type: number
    description: 提取 对应借款 的数值（含单位，如万元、吨等）
  - name: 对方账户性质
    type: string
    description: 提取 对方账户性质 的文本值
  - name: 应收股利
    type: string
    description: 提取 应收股利 的文本值
  - name: 收款人
    type: number
    description: 提取 收款人 的数值（含单位，如万元、吨等）
  - name: 收款方
    type: number
    description: 提取 收款方 的数值（含单位，如万元、吨等）
  - name: 收益入账日期
    type: date
    description: 提取 收益入账日期 的日期值，格式 YYYY-MM-DD
  - name: 是否设立专户
    type: boolean
    description: 提取 是否设立专户 的布尔值（是/否）
  - name: 最早施工记录日期
    type: date
    description: 提取 最早施工记录日期 的日期值，格式 YYYY-MM-DD
  - name: 最近入账日期
    type: date
    description: 提取 最近入账日期 的日期值，格式 YYYY-MM-DD
  - name: 最近入账金额
    type: number
    description: 提取 最近入账金额 的数值（含单位，如万元、吨等）
  - name: 最近收益入账日期
    type: date
    description: 提取 最近收益入账日期 的日期值，格式 YYYY-MM-DD
  - name: 申报产量
    type: string
    description: 提取 申报产量 的文本值
  - name: 监理签认开工日期
    type: date
    description: 提取 监理签认开工日期 的日期值，格式 YYYY-MM-DD
  - name: 票据号码
    type: string
    description: 提取 票据号码 的文本值
  - name: 补贴金额
    type: number
    description: 提取 补贴金额 的数值（含单位，如万元、吨等）
  - name: 被投资单位名称
    type: string
    description: 提取 被投资单位名称 的文本值
  - name: 计提利息金额
    type: number
    description: 提取 计提利息金额 的数值（含单位，如万元、吨等）
  - name: 记账联金额
    type: number
    description: 提取 记账联金额 的数值（含单位，如万元、吨等）
  - name: 质押担保相关信息
    type: string
    description: 提取 质押担保相关信息 的文本值
  - name: 资产编号
    type: string
    description: 提取 资产编号 的文本值
  - name: 资金混用记录
    type: string
    description: 提取 资金混用记录 的文本值
  - name: 配送数量
    type: number
    description: 提取 配送数量 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (批准接待人数、人员名单、变卖审批决议、审批人签字、审批日期、合作制条款、民主管理要求、申请时间、审批通过时间为空 || 批准接待人数、人员名单、变卖审批决议、审批人签字、审批日期、合作制条款、民主管理要求、申请时间、审批通过时间.审批日期
    > 合同签订日期) || (合同签订日期 < 招租公告发布日期) || (资产编号 IN (SELECT 资产编号 FROM 登记台账 WHERE 是否可出租标识 = '否')) || (年化租金 < 市场参考价 * 0.8 && 承租方
    IN (关联方清单)) || (实际入账金额 < 合同约定收益金额 * 0.9)
  description: 判定逻辑：1. 缺失审批或先签约后审批；2. 未经招租直接签约；3. 出租禁止出租资产；4. 以低于市场价20%租给关联方；5. 租金收缴率低于90%，存在截留。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规出租出借国有资产
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"行政单位国有资产出租、出借，应当履行必要的审批程序，公开进行，并签订合同。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n\
    \    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十一条\",\n    \"内容概述\": \"企业国有资产转让应当依法进行评估，并公开进行。未经批准，不"
- expression: (决策文件.决策会议记录 == null || 批复文件.资产处置批复文件 == null) || (决策文件.投资金额 > 批复文件.批复金额) || (项目清单.被投资单位名称 IN (关联方清单) && 决策文件.风险评估结论
    != '低风险' && 项目清单.持股比例 > 50%) || (注册资料.工商登记股东名册 IN (SELECT 工商登记股东名册 FROM 注册资料 WHERE 项目清单.资产评估报告编号 == null) ) || (核对表.实收股利
    < 核对表.应收股利 * 0.8 && 投资年限 > 2)
  description: 判定逻辑：1. 投资缺失财政审批或风险评估；2. 投资额超批复；3. 对关联方进行高风险大额投资；4. 投资时未履行资产评估程序；5. 投资超过2年但股利回收率低于80%。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规对外投资国有资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十二条\",\n    \"内容概述\": \"企业对外投资应当依法进行可行性研究和风险评估，并按照规定权限履行审批程序。\"\n  },\n  {\n    \"法规名称\": \"事业单位国有资产管理暂行办法\"\
    ,\n    \"法规文号\": \"财政部令第36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十六条\",\n    \"内容概述\": \"事业单位利用国有资产对外投资，应当进行可行性论证和资产评估"
- expression: (批复文件 == null) || (使用方 IN (关联方清单)) || (使用期限 > 1年) || (资产编号 IN (SELECT 资产编号 FROM 明细表 WHERE 年租金 > 0))
  description: 判定逻辑：1. 无偿出借无财政批复；2. 将国有资产无偿提供给关联企业或个人使用；3. 长期无偿出借；4. 针对同一资产，同时存在出租收益和无偿使用记录，疑似阴阳合同。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规无偿提供国有资产使用
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"行政事业单位对外出租、出借国有资产，应当公开、公平、公正。国家另有规定的除外。严禁无偿或以明显低于市场的价格将国有资产出租、出借给关联单位和个人。\"\n  }\n]"
- expression: (票据存根联金额合计 != 记账联金额合计) || (非税收入台账.票据编号缺失 || 非税收入台账.票据编号不在票据领用登记簿.核销记录内) && (银行对账单.收入金额 > 0 || 现金日记账.收入金额 > 0)
    && 非税收入台账.应缴金额 < 银行对账单.对应收入金额
  description: 当票据存根联金额与记账联金额不符，或收费台账中缺失规范票据编号且存在资金流入时，判定为隐瞒收入。差额即为疑似隐瞒金额，差异率超过10%列为重点疑点。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 未开具非税收入票据隐瞒收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十七条\",\n    \"内容概述\": \"执收单位不得隐匿、转移、截留、坐支、挪用、私分或者变相私分非税收入；非税收入应当依法开具票据，依法及时足额上缴。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政票据管理办法\",\n    \"法规文号\": \"财政部令第70号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条、第十七条\",\n    \"内容概述\": \"财政票据是财务收支和会计核"
- expression: (对照表.实际开工日期 IS NOT NULL) && (对照表.施工许可证发证日期 IS NULL || 对照表.实际开工日期 < 对照表.施工许可证发证日期 || 施工合同.首笔工程款支付日期 < 对照表.施工许可证发证日期)
  description: 实际开工日期或首笔工程款支付日期早于施工许可证发证日期，或者施工许可证缺失但已开工，均构成违规。该表达式不考虑短时间容差，任何时序倒置即判定。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得施工许可证擅自施工或先开工后办证
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"中华人民共和国主席令第29号（2019修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第七条、第六十四条\",\n    \"内容概述\": \"建筑工程开工前，建设单位必须申请领取施工许可证（特定小型工程除外）。未取得施工许可证擅自施工的，责令改正，并处罚款。\"\n  },\n  {\n\
    \    \"法规名称\": \"建筑工程施工许可管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第18号（2018修正）\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条、第十二条\""
- expression: (SUM(借款合同.合同金额) - (余额表.期末余额 + 余额表.期末余额 + 余额表.期末余额)) > 余额表.期末余额*1%  ||  (EXISTS (银行对账单 WHERE 银行对账单.借贷方金额 > 余额表.期末余额
    AND 银行对账单.对方账户名称 NOT IN (银行对账单.对方账户名称) AND 银行对账单.摘要 LIKE '%借款%') AND NOT EXISTS (明细表 WHERE 明细表.借款金额))
  description: 以资产总额1%作为重要性阈值：应收账款合同中全部合同金额合计超出账面记录的负债科目余额且差额超过资产总额1%时，判定为存在未入账借款合同；银行流水中出现非合作银行账户的大额入账且摘要明确涉及借贷，但未能在任何负债科目明细账中找到对应贷方记录时，判定为存在未入账债务。
  audit_item: 未按规定核算负债
  suspicion: 债务未按规定入账形成表外负债
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号（2014年修改）\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二十三条、第二十四条\",\n    \"内容概述\": \"负债是指企业过去的交易或者事项形成的、预期会导致经济利益流出企业的现时义务；符合负债定义的义务，同时满足与该义务有关的经济利益很可能流出企业且金额能够可靠计量时，应确认为负债。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\","
- expression: (投资金额、回购条款、固定收益条款、清算优先权 WHERE (固定收益条款包含 '保证本金' OR '年化收益率' OR '强制回购') AND 明细项目 IN ('实收资本','资本公积')) && (计提利息金额、对应借款、利息支出、收款人
    WHERE 收款人 = 上述投资方 AND 支付固定回报不依赖利润分配决议)
  description: 若股权投资合同中明确约定了刚性兑付义务（如保本、固定收益及无条件回购条款），且该出资已计入了权益科目，同时企业定期向投资方支付与利润无关的固定款项，该笔“股”实质为债，必须重分类为金融负债，支付的回报应作为利息费用处理。
  audit_item: 未按规定核算负债
  suspicion: 通过名股实债方式隐匿负债
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第37号——金融工具列报\",\n    \"法规文号\": \"财会[2017]14号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第七条\",\n    \"内容概述\": \"企业应当根据所发行金融工具的合同条款及其所反映的经济实质而非仅以法律形式，结合金融资产、金融负债和权益工具的定义，在初始确认时将该金融工具或其组成部分分类为金融资产、金融负债或权益工具。\"\
    \n  }\n]"
- expression: (流向证明.最终收款方名称 != 捐赠协议.受赠方名称) OR (核对表.收款方 IN 捐赠协议.捐赠人名称) OR (捐赠协议.附加商业条款 != '') OR (调查资料.实际控制人 IN 交易清单.关联方名称)
  description: 资金收款方与协议受赠方不一致，或存在资金闭环回流，均表明捐赠不真实；协议中含有商业回报条款，借捐赠名义获取对价，属于变相交易；若受赠方与捐赠方存在未披露关联关系，构成利益输送；上述任一条件满足即触发疑点。
  audit_item: 违规对外大额捐赠
  suspicion: 借捐赠之名从事营利活动或转移资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公益事业捐赠法\",\n    \"法规文号\": \"中华人民共和国主席令第十九号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"捐赠应当是自愿和无偿的，不得以捐赠为名从事营利活动。\"\n  },\n  {\n    \"法规名称\": \"关于加强企业对外捐赠财务管理的通知\",\n    \"\
    法规文号\": \"财企〔2003〕95号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"企业对外捐赠后，不得要求受赠方在融资、市场准入、行政许可、占有其他资源等"
- expression: 农业保险保费补贴会计账簿.科目设置 NOT LIKE '%农业保险保费补贴%' OR 分账核算专项管理核对表.分账标识 != '是' OR (分账核算专项管理核对表.资金混用记录 LIKE '%医疗救助%' OR 分账核算专项管理核对表.资金混用记录
    LIKE '%公用经费%')
  description: 未设立专户或未在会计核算系统中单独设置保费补贴科目，或虽然设立但存在非保费补贴资金收付记录，即判为未专项管理。
  audit_item: 农业保险保费补贴未按规定配套、拨付、管理和结算
  suspicion: 保费补贴未专项管理、分账核算
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业保险保费补贴管理办法\",\n    \"法规文号\": \"财金〔2021〕113号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十四条\",\n    \"内容概述\": \"保费补贴资金实行专项管理、分账核算，各级财政部门应开设专门科目核算，确保资金封闭运行、专款专用。\"\n  }\n]"
- expression: (比对表.实际养殖水面面积 < 核对表.申报面积*0.9) || (核对表.申报产量 > 发票.销售数量*1.3 || 核对表.申报产量 > 数据.年度总用电量/数据.单位面积理论最低用电量*1.5)
  description: 当遥感实测面积不足申报面积的90%，或申报产量超出销售记录的130%且超出基于用电量反推产量的150%时，判定为虚报建设成果或产量。单位面积理论最低用电量可根据当地同类养殖模式设定。多条件同时满足可锁定严重虚报。
  audit_item: 水产养殖补助项目建设运营管护不合规
  suspicion: 虚报水产养殖补助项目建设成果骗取资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号（2011年修订）\",\n    \"效力级别\": \"行政法规\",\n \
    \   \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。……（四）以虚报、冒领等手段骗取财政资金。\"\
    \n  },\n  {\n    \"法规名称\": \"中央财政渔业发展补助资金管理办法\",\n    \"法规文号\": \"财农〔2021〕24号\",\n    \"效力级别\": \"部门规章\",\n    \""
- expression: (拨付凭证.实拨付金额 < 拨付凭证.应拨付金额) || (明细分类账.支出类别 NOT IN ('食材采购','食堂设备','水电燃料','食堂人员工资') && 明细分类账.金额 > 10000 && 明细分类账.收款方非食材供应商)
    || (其他.公用经费支出 < 拨付凭证.到账日期 * 0.85)
  description: 财政拨付金额未足额到账判定为拖欠；补助资金用于非食堂直接相关支出且单笔超1万元且流向非供应商账户，判定挤占挪用；全校年度营养餐实际支出不足拨付金额85%的，疑为部分资金被挤占或变相挪用。
  audit_item: 违反农村义务教育学生营养改善计划相关规定的行为
  suspicion: 拖欠、挤占、挪用营养膳食补助资金
  regulation: "[\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划专项资金管理办法\",\n    \"法规文号\": \"财教〔2021〕174号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"营养改善计划补助资金应足额用于为农村义务教育阶段学生提供营养膳食补助，不得以任何理由挤占、截留、挪用。\"\n  }\n]"
- expression: (分户账总账与分户账核对表.最近入账日期 IS NULL) || (DATEDIFF(分户账总账与分户账核对表.最近入账日期, 住宅专项维修资金归集明细表.缴存日期) > 30) || (ABS(SUM(分户账总账与分户账核对表.分户账余额)
    - 维修资金专户银行对账单.余额) > 银行手续费阈值)
  description: 1. 分户账无入账记录，即资金未分配至任何业主分户账。2. 从业主缴存日到分户账首次入账日的间隔超过30天（或地方制度规定时限），判定为未及时分配；超过90天为严重违规。3. 所有分户账余额之和与专户银行总余额存在差异（超出合理手续费范围），表明存在未分配资金挂在其他科目。
  audit_item: 住宅专项维修资金及增值收益未分配至业主分户账
  suspicion: 住宅专项维修资金未及时分配至业主分户账
  regulation: "[\n  {\n    \"法规名称\": \"住宅专项维修资金管理办法\",\n    \"法规文号\": \"建设部、财政部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"业主交存的住宅专项维修资金，应当及时存入维修资金专户。已成立业主大会的，由业主委员会通知所在地市、县建设（房地产）主管部门，将代管的维修资金划转至业主大会开立的维修资金专户。\"\
    \n  },\n  {\n    \"法规名称\": \"住宅专项维修资金管理办法\",\n    \"法规文号\": \"建设部、财政部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": "
- expression: (增值收益计算分配表.实际入账日期 IS NULL) || (DATEDIFF(增值收益计算分配表.实际入账日期, 增值收益计算分配表.分配基准日) > 90) || (ABS(分户账总账与分户账核对表.增值收益累计入账金额
    - (增值收益计算分配表.收益总额 * (业主信息登记表.房屋面积 / 小区总面积))) > 0.01)
  description: 1. 增值收益计算后，分配表中有分配方案但无实际入账日期，即收益未分配至分户账。2. 从分配基准日到实际入账日间隔超过90天，判定为未及时分配；超过180天为严重滞留。3. 单个业主分户账实际收到的增值收益与按房屋面积占比计算的应分金额偏差超过0.01元（或1%），表明存在分配错误或截留。
  audit_item: 住宅专项维修资金及增值收益未分配至业主分户账
  suspicion: 住宅专项维修资金增值收益未及时分配至业主分户账
  regulation: "[\n  {\n    \"法规名称\": \"住宅专项维修资金管理办法\",\n    \"法规文号\": \"建设部、财政部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十七条\",\n    \"内容概述\": \"住宅专项维修资金的存储利息、利用住宅专项维修资金购买国债的增值收益等，应当转入住宅专项维修资金滚存使用。收益属于全体业主所有，管理单位应按照规定分摊到业主分户账。\"\
    \n  },\n  {\n    \"法规名称\": \"住宅专项维修资金管理办法\",\n    \"法规文号\": \"建设部、财政部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第二十"
- expression: (追踪表.资金去向类别 IS NULL OR 追踪表.资金去向类别 NOT IN ('提取','贷款','购买国债','上划上级')) AND (追踪表.收款方名称 IN (登记表.关联方名称) OR 付款账户.交易摘要
    NOT LIKE '%提取%' AND NOT LIKE '%贷款%' AND NOT LIKE '%国债%' AND NOT LIKE '%上划%') AND 付款账户.交易金额 > 100000
  description: 筛查资金去向不明或收款方为非业务合作对象且与关联方有关的支出，排除因上划上级、购买国债等合规用途。设定大额阈值10万元作为初步疑点，小额可疑需结合频次分析。
  audit_item: 挪用住房公积金
  suspicion: 直接挪用住房公积金至非业务关联账户
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十一条\",\n    \"内容概述\": \"住房公积金管理中心违反本条例规定，挪用住房公积金的，追回挪用的住房公积金；有违法所得的，没收违法所得，并入住房公积金；构成犯罪的，依法追究刑事责任；尚不构成犯罪的，对直接负责的主管人员和其他直接责任人员依法给予行政处分。\"\
    \n  }\n]"
- expression: 交易摘要 LIKE '%质押%' OR 交易摘要 LIKE '%担保%' OR 质押冻结记录 = '质押' OR 检查发现的问题描述 = '外部报告指出存在违规担保'
  description: 条例明确禁止公积金管理中心为他人提供担保。若银行流水中出现质押或担保标记，或外部监管报告指出问题，不论金额大小，直接判定违规。
  audit_item: 挪用住房公积金
  suspicion: 违规使用住房公积金存款为第三方提供质押担保
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十八条第二款\",\n    \"内容概述\": \"住房公积金管理中心不得向他人提供担保。\"\n  }\n]"
