name: audit/数据表格类/流程表
type: model
description: 从数据表格类类文档（流程表）中提取结构化元数据。涵盖字段如：原隶属单位、变更依据、审批事项名称、审批层级、审批状态、审批节点与签批人、新隶属单位、时限要求。文档范围包括：应急调用申请审批流程表、重大事项决策审批流程表、隶属关系变更审批流程表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 审批
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 流程表
  member_count: 1
  member_details:
  - 应急调用申请审批流程表
  - 重大事项决策审批流程表
  - 隶属关系变更审批流程表
output:
  fields:
  - name: 原隶属单位
    type: string
    description: 提取 原隶属单位 的文本值
  - name: 变更依据
    type: string
    description: 提取 变更依据 的文本值
  - name: 审批事项名称
    type: string
    description: 提取 审批事项名称 的文本值
  - name: 审批层级
    type: string
    description: 提取 审批层级 的文本值
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
  - name: 审批节点与签批人
    type: string
    description: 提取 审批节点与签批人 的文本值
  - name: 新隶属单位
    type: string
    description: 提取 新隶属单位 的文本值
  - name: 时限要求
    type: string
    description: 提取 时限要求 的文本值
  - name: 流程完整性
    type: string
    description: 提取 流程完整性 的文本值
  - name: 签批日期
    type: date
    description: 提取 签批日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (隶属关系变更审批流程表.新隶属单位 NOT IN ("供销合作社系统","联合社")) && (机构编制调整的上级批复文件 IS NULL || 机构编制调整的上级批复文件.批复内容 != "同意划转") && 社员代表大会决议
    IS NULL
  description: 社有企业被划转至国资委、财政局等非供销社系统，且缺少上级审批同意文件及社员代表大会表决通过决议，属于擅自改变隶属关系的行为。高风险。
  audit_item: 供销合作社综合改革不合规
  suspicion: 擅自改变社有企业隶属关系
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第二部分（四）\",\n    \"内容概述\": \"要维护供销合作社组织体系的完整性，保持各级联合社的监督和指导职责，不得随意改变供销合作社及其所属企事业单位的隶属关系。\"\n  }\n]"
- expression: (库存检查制度.调用流程章节.isBlank() || 应急响应时限.应急响应时限.isBlank()) || (检查记录.groupby(检查日期).count() == 0) || (检查记录.发现问题摘要 >=
    3 && 检查记录.整改完成状态 == "未整改") || (演练计划章节.演练计划章节.isNull())
  description: 制度文件缺失调用流程或预案未明确响应时限即视为制度核心要素缺失；若近一年内无任何监督检查记录，表明监管完全缺位；同一问题连续出现3次及以上且均未整改闭环，体现监管失效；无任何演练记录证明应急预案从未经过验证，可操作性存疑。满足任一条件即触发疑点。
  audit_item: 救灾备荒种子储备方面不符合相关规定
  suspicion: 主管部门救灾备荒种子调用制度与应急预案不健全
  regulation: "[\n  {\n    \"法规名称\": \"国家救灾备荒种子储备管理办法\",\n    \"法规文号\": \"农农发〔2015〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条、第十四条\",\n    \"内容概述\": \"县级以上地方人民政府农业农村主管部门应当建立健全救灾备荒种子储备管理制度和应急预案，定期开展监督检查，确保制度有效运行。\"\n  }\n]"
- expression: 住房公积金管理委员会会议纪要（近三年）.参会人员名单 !包含 分支机构代表 || 重大事项决策审批流程表.审批节点与签批人 缺失 设区城市中心审批环节 || 重大合同备案表.合同签订主体 == 分支机构 && 重大合同备案表.合同审批人
    != 设区城市中心分管领导
  description: 审查管委会近三年会议记录，若无分支机构负责人参会记录则判定决策参与缺失；抽取重大事项（如大额资金调度、对外合作协议）的审批流程表，若缺少中心审批节点，或分支机构以自身名义签订重大合同且审批人非中心领导，则判定其存在独立决策的违规行为。
  audit_item: 住房公积金管理体制调整不到位
  suspicion: 住房公积金管理分支机构未纳入统一决策体系
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第九条、第十条\",\n    \"内容概述\": \"住房公积金管理委员会是住房公积金管理的决策机构，住房公积金管理中心是直属城市人民政府的不以营利为目的的独立的事业单位，管理中心依法对所有分支机构进行统一决策和领导。\"\n  }\n\
    ]"
