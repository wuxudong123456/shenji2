name: audit/数据表格类/采集表
type: model
description: 从数据表格类类文档（采集表）中提取结构化元数据。涵盖字段如：因素名称、因素数据值、数据时间节点、数据来源、数据来源部门、权重设置、采集周期、采集指标项。文档范围包括：分配因素指标数据采集表、绩效监控数据采集表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 采集表
  member_count: 1
  member_details:
  - 分配因素指标数据采集表
  - 绩效监控数据采集表
output:
  fields:
  - name: 因素名称
    type: string
    description: 提取 因素名称 的文本值
  - name: 因素数据值
    type: string
    description: 提取 因素数据值 的文本值
  - name: 数据时间节点
    type: date
    description: 提取 数据时间节点 的日期值，格式 YYYY-MM-DD
  - name: 数据来源
    type: string
    description: 提取 数据来源 的文本值
  - name: 数据来源部门
    type: string
    description: 提取 数据来源部门 的文本值
  - name: 权重设置
    type: string
    description: 提取 权重设置 的文本值
  - name: 采集周期
    type: string
    description: 提取 采集周期 的文本值
  - name: 采集指标项
    type: string
    description: 提取 采集指标项 的文本值
  - name: 采集结果
    type: boolean
    description: 提取 采集结果 的布尔值（是/否）
  - name: 采集记录数
    type: string
    description: 提取 采集记录数 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ({采集表.因素名称} NOT IN ({管理办法.规定的分配因素清单})) || ({采集表.权重设置} NOT BETWEEN {管理办法.各因素权重范围} AND {管理办法.资金上限}) || ({说明文件.实际采用的评分因素}
    IS NULL) && ({分配方案.审议通过的分配因素} IS NULL)
  description: 以上级管理办法规定的因素清单和权重范围为基准，采集表中出现的因素或权重若超出授权，且会议纪要无合规审批记录，即判为违规。缺少评分规则专家论证等合理性说明，同样触发疑点。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 分配因素不合规或评分规则不科学
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条、第十一条\",\n    \"内容概述\": \"专项转移支付应科学设置资金分配方法；采用因素法等，因素选择、权重设定应当科学合理。\"\n  }\n]"
- expression: ABS({因素名称.数据值} - {差异说明.真实值}) > 0 || ({因素名称.数据时间节点} 距离分配年度 > 3) || ({验证数据差异结论.验证数据差异结论} = '不可接受' && {分配金额.分配金额}
    使用该因素数据值计算)
  description: 数据采集值与校验真实值存在任何绝对值差异，或引用数据年份距分配年度超过3年（时效性超标），或第三方验证报告判定数据不可信且该数据被用于计算金额，均判定为基础数据错误导致分配偏差。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 分配引用基础数据错误
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条、第五十七条\"\
    ,\n    \"内容概述\": \"各级政府预算编制应依据真实、准确的数据；各部门应完整、准确地向财政部门提供预算编制所需数据。\"\n  }\n]"
- expression: COUNT(绩效运行监控报告) == 0 && SUM(预算执行进度统计表.支出金额) > 0
  description: 当预算执行进度统计表中存在资金支出记录，但对应的绩效运行监控报告数量为零时，触发违规。说明单位在有预算执行的情况下未开展任何绩效运行监控，直接判定为未开展监控。
  audit_item: 部门、单位预算绩效运行监控不合规
  suspicion: 未开展预算绩效运行监控
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（五）款\",\n    \"内容概述\": \"各级政府及各部门各单位要建立绩效运行监控机制，加强对绩效目标实现程度和预算执行进度的跟踪管理，发现问题及时督促整改。\"\n  }\n]"
- expression: (COUNT(绩效目标申报表.绩效指标) - COUNT(绩效运行监控报告.监控指标)) > 0 && COUNT(绩效目标申报表.绩效指标) > 0
  description: 将绩效目标申报表中设定的全部绩效指标与监控报告中实际纳入监控的指标进行比对，若存在差异（即目标申报表中的指标未被监控），且目标申报表指标总数大于0，则判定为监控不全面。监控指标缺失即构成违规，不设容差。
  audit_item: 部门、单位预算绩效运行监控不合规
  suspicion: 绩效运行监控不全面
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条第（五）款\",\n    \"内容概述\": \"要对绩效目标实现程度和预算执行进度实行‘双监控’，确保绩效目标如期保质保量实现。\"\n  },\n  {\n    \"法规名称\": \"\
    项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"绩效运行监控是全过程预算绩效"
