name: audit/数据表格类/余额表
type: model
description: 从数据表格类类文档（余额表）中提取结构化元数据。涵盖字段如：事业收入、各级科目余额、外币相关科目余额、对方单位、期初余额、期末余额、现金期末余额、科目名称。文档范围包括：会计科目余额表（结账前/后）、科目余额表、负债类科目余额表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 余额表
  member_count: 1
  member_details:
  - 会计科目余额表（结账前/后）
  - 科目余额表
  - 负债类科目余额表
output:
  fields:
  - name: 事业收入
    type: number
    description: 提取 事业收入 的数值（含单位，如万元、吨等）
  - name: 各级科目余额
    type: number
    description: 提取 各级科目余额 的数值（含单位，如万元、吨等）
  - name: 外币相关科目余额
    type: number
    description: 提取 外币相关科目余额 的数值（含单位，如万元、吨等）
  - name: 对方单位
    type: string
    description: 提取 对方单位 的文本值
  - name: 期初余额
    type: number
    description: 提取 期初余额 的数值（含单位，如万元、吨等）
  - name: 期末余额
    type: number
    description: 提取 期末余额 的数值（含单位，如万元、吨等）
  - name: 现金期末余额
    type: number
    description: 提取 现金期末余额 的数值（含单位，如万元、吨等）
  - name: 科目名称
    type: string
    description: 提取 科目名称 的文本值
  - name: 累计折旧本期发生额
    type: string
    description: 提取 累计折旧本期发生额 的文本值
  - name: 经营收入
    type: number
    description: 提取 经营收入 的数值（含单位，如万元、吨等）
  - name: 银行存款期末余额
    type: number
    description: 提取 银行存款期末余额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (计提表.计提基数 != 余额表.事业收入 + 余额表.经营收入) || (计提表.计提比例 != 政策文件.规定计提比例) || (ABS(计提表.计提金额 - 计提表.计提基数 * 政策文件.规定计提比例) >
    0)
  description: 专用基金计提基数与科目余额表中对应收入合计数不一致，或实际采用的计提比例与政策规定不符，或计算出的计提金额不等于基数乘比例，任一条成立即触发疑点。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 专用基金计提基数或比例错误
  regulation: "[\n  {\n    \"法规名称\": \"《事业单位财务规则》\",\n    \"法规文号\": \"财政部令第108号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第二十六条\",\n    \"内容概述\": \"事业单位应当按规定提取修购基金、职工福利基金和其他专用基金，不得随意改变计提基数、比例和支出用途。\"\n  }\n]"
- expression: (明细表.资金来源性质 = "财政专项拨款" && 余额表.各级科目余额 != "财政拨款收入—项目支出") || (明细表.使用会计科目 IN ("其他应付款","其他应收款") && 管理办法.核算科目要求)
  description: 财政专项资金未在规定的收入科目或支出科目核算，而错误列入往来款等科目，导致决算报表无法真实反映专项资金收支，即构成科目列报错误。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 专项资金列报科目错误
  regulation: "[\n  {\n    \"法规名称\": \"《政府会计制度——行政事业单位会计科目和报表》\",\n    \"法规文号\": \"财会〔2017〕25号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三部分 会计科目使用说明\",\n    \"内容概述\": \"财政拨款收入等专项资金应按规定科目单独核算，不得与其他资金混淆核算。\"\n  }\n]"
- expression: (库存现金实存数.库存现金实存数 != 余额表.现金期末余额) || (银行对账单.期末余额 != 余额表.银行存款期末余额 && 未编制有效调节表) || (银行对账单.调节后余额 != 余额表.银行存款期末余额
    && 无审计调整说明)
  description: 现金盘点实存数与账面不一致，或银行对账单余额与账面银行存款不一致，且未能提供调节表或调节后仍有差异，且无合理审计调整说明，视为账实不符且未查明原因。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 货币资金账实不符且未查明原因
  regulation: "[\n  {\n    \"法规名称\": \"《会计基础工作规范》\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十二条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证账实相符。\"\n  }\n]"
- expression: (变动表.折算汇率 != 政策文件.规定汇率来源) || (ABS(变动表.原币金额 * 政策文件.规定汇率来源 - 变动表.折算后人民币金额) > 0) || (汇兑损益未计入财务费用)
  description: 若使用汇率非期末央行中间价，或折算金额计算错误，或汇兑损益未在恰当科目反映，均属折算处理错误。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 年终外币折算汇率或方法错误
  regulation: "[\n  {\n    \"法规名称\": \"《企业会计准则第19号——外币折算》\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十一条\",\n    \"内容概述\": \"企业在资产负债表日，应当对外币货币性项目采用期末即期汇率折算，因汇率变动产生的差额计入当期损益。\"\n  }\n]"
- expression: 本期发生额、余额、科目名称、期末余额、固定资产科目余额、累计折旧科目余额、科目设置、发生额及余额、内部往来科目发生额、固定资产、无形资产等科目.期末余额 != SUM(明细分类账.各明细期末余额合计)
  description: 总账科目余额与其所属明细账余额合计数不相等，且无有效的重分类调整支持，即为账账不符疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 总账与明细账期末余额不一致
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期核对会计账簿之间相对应的记录，保证会计账簿之间相对应的记录相符。\"\n  }\n]"
- expression: ABS(科目余额表.累计折旧本期发生额 - 按上期折旧方法模拟计提的累计折旧本期发生额) / 利润总额 > 0.05 && (董事会决议 IS NULL || 董事会决议.批准日期 > 企业会计政策文件.变更生效日期)
    && 财务报表附注.会计政策变更说明 NOT LIKE '%折旧方法变更%'
  description: 当企业本期折旧方法与上期不一致，且新旧方法下折旧费用差异对利润总额的影响超过5%，同时未取得董事会有效审批或审批滞后，且财务报告附注未披露变更内容及影响金额时，触发违规疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意改变固定资产折旧方法调节利润
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业进行会计核算不得随意改变资产、负债、所有者权益的确认标准或者计量方法，虚列、多列、不列或者少列资产、负债、所有者权益。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\"\
    ,\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第十五条\",\n    \"内"
- expression: (SUM(借款合同.合同金额) - (余额表.期末余额 + 余额表.期末余额 + 余额表.期末余额)) > 余额表.期末余额*1%  ||  (EXISTS (银行对账单 WHERE 银行对账单.借贷方金额 > 余额表.期末余额
    AND 银行对账单.对方账户名称 NOT IN (银行对账单.对方账户名称) AND 银行对账单.摘要 LIKE '%借款%') AND NOT EXISTS (明细表 WHERE 明细表.借款金额))
  description: 以资产总额1%作为重要性阈值：应收账款合同中全部合同金额合计超出账面记录的负债科目余额且差额超过资产总额1%时，判定为存在未入账借款合同；银行流水中出现非合作银行账户的大额入账且摘要明确涉及借贷，但未能在任何负债科目明细账中找到对应贷方记录时，判定为存在未入账债务。
  audit_item: 未按规定核算负债
  suspicion: 债务未按规定入账形成表外负债
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号（2014年修改）\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二十三条、第二十四条\",\n    \"内容概述\": \"负债是指企业过去的交易或者事项形成的、预期会导致经济利益流出企业的现时义务；符合负债定义的义务，同时满足与该义务有关的经济利益很可能流出企业且金额能够可靠计量时，应确认为负债。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\","
- expression: (EXISTS (明细表 WHERE 对方单位 IN (供应商主数据) AND 账龄 > 365)) || (EXISTS (明细表 WHERE 利息计提分录贷方科目 != '应付利息' AND 贷方科目 != '长期借款-应计利息'
    AND 利息计提借方为财务费用))
  description: 其他应付款明细中出现与供应商相同的对方单位，且挂账时间超过1年，基本可判定为应付账款分类错误；借款利息计提时如贷方科目不是“应付利息”或“长期借款-应计利息”而误挂其他应付款或直接冲减借款本金，均属科目错配。
  audit_item: 未按规定核算负债
  suspicion: 负债入账科目分类错误
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第30号——财务报表列报\",\n    \"法规文号\": \"财会[2014]7号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十二条\",\n    \"内容概述\": \"资产和负债应当分别流动资产和非流动资产、流动负债和非流动负债列示，金融负债的列报应遵循相关具体准则。\"\n  },\n  {\n    \"法规名称\": \"\
    企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者事项为"
