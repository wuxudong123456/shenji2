name: audit/数据表格类/汇总表
type: model
description: 从数据表格类类文档（汇总表）中提取结构化元数据。涵盖字段如：一票否决项命中标记、上报数据、上报时间、上次核查日期、中标供应商确定日期、中标单位、中标确定日期、中标金额。文档范围包括：下属单位车辆费用汇总表、中标候选人谈判内容汇总表、企业资质审查结果汇总表、养殖企业年度用电缴费凭证汇总表、农户满意度调查结果汇总表、动态核查结果汇总表、土地流转备案信息汇总表、存货收发存汇总表、学籍异动学生名单汇总表、审计调整分录汇总表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 差旅
- 金额
- 元数据提取
