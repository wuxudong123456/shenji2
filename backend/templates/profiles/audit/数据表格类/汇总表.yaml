violations:
- expression: (差旅费报销汇总表.出差日期 < 出差审批单.批准起止日期) OR (差旅费报销汇总表.出差日期 > 出差审批单.批准起止日期) OR (出差审批单.审批人签字 IS NULL) OR (差旅费报销汇总表.差旅人 NOT
    IN (出差审批单.出差人))
  description: 报销单据中的出差日期超出审批起止范围、审批单无有效签字、报销人未在审批单出差人员之列，任一项成立即为违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 未严格执行出差审批管理
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关差旅费管理办法\",\n    \"法规文号\": \"财行〔2013〕531号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条、第十四条\",\n    \"内容概述\": \"各单位应当建立健全出差审批制度，严格差旅费预算管理，控制差旅费支出规模；出差人员必须按规定报经单位有关领导批准后方可出差。\"\n  }\n]"
- expression: (会议/调研/考察活动通知及行程安排.门票费用 > 0) OR (会议/调研/考察活动通知及行程安排.公务内容占比 < 0.5) OR (差旅费报销汇总表.地点 属于旅游景区 AND DATEDIFF(差旅费报销汇总表.出差日期,
    差旅费报销汇总表.差旅日期) > 公务天数 * 2)
  description: 行程中含景点门票或导游费，或公务活动(会议、调研)时间不足总行程一半，或差旅天数明显多于公务所需天数(如公务1天差旅3天)，均触发变相旅游疑点。
  audit_item: 公务接待管理不符合规定
  suspicion: 以公务名义变相旅游
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
