  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十七条\",\n    \"内容概述\": \"建立健全专项转移支付定期评估和退出机制，对绩效评价结果不佳或政策目标已实现的项目，应当及时取消或调整。\"\n  },\n  {\n    \"法规名称\": \"\
    国务院关于深化预算管理制度改革的决定\",\n    \"法规文号\": \"国发〔2014〕45号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三、（一）\",\n    \"内容概述\"\
    : \"建立健全专项"
- expression: (汇总表.评价等次/得分 = '差' || 评价得分 < 60) && (明细表.下一年度预算安排金额 >= 明细表.本年度预算安排金额) || (存在绩效评价结果但未在预算安排文件中体现任何调整)
  description: 评价结果为“差”或得分低于60分的项目，下一年度预算应予以压减，若预算未减少或反而增加，即认定违规。不合理的应用包括未追责、未扣减预算等。
  audit_item: 财政转移支付资金政策绩效评价不规范
  suspicion: 绩效评价结果未有效应用于预算安排
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"绩效评价结果应当作为预算安排、完善政策和改进管理的重要依据。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\"\
    : \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价，并将评价结果作为改进管理和编制下一年度预算的依"
- expression: 部门预算汇总表.单位编码 NOT IN (机构编制文件.授权管理单位编码集合) && 部门预算汇总表.资金总额 > 0
  description: 筛选部门预算中列示但不在本部门三定方案授权管理范围内的单位，且确已安排预算资金，即视为将非所属预算单位纳入预算的违规行为。
  audit_item: 预算编制不规范
  suspicion: 将非所属预算单位纳入部门预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十三条\"\
    ,\n    \"内容概述\": \"各部门编制本部门预算、决算草案，组织和监督本部门预算的执行。部门预算由本部门及其所属各单位预算组成，不得将非所属单位纳入预算。\"\n  }\n]"
- expression: 通知书.中标人名称 NOT IN (评标报告.推荐中标候选人名称) && 评标报告.排序 >= 1
  description: 当中标人不在评标委员会依法推荐的任何中标候选人名单中时触发违规。该表达式直接比对中标通知书与评标报告的核心字段，忽略候选人排序，只要不在名单内即构成违规，前提是存在有效推荐的候选人。
  audit_item: 招标人违法确定中标人
  suspicion: 招标人在推荐中标候选人外确定中标人
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十条\",\n    \"内容概述\": \"招标人根据评标委员会提出的书面评标报告和推荐的中标候选人确定中标人。招标人也可以授权评标委员会直接确定中标人。\"\n  }\n]"
- expression: SUM(汇总表.预算金额) GROUP BY (建设单位, LEFT(建设内容摘要,10), YEAR(审批时间)) HAVING SUM(预算金额) > (SELECT 审批金额门槛 FROM 制度文件 WHERE
    层级='上级') AND COUNT(*)>1 AND MAX(汇总表.预算金额) <= (SELECT 审批金额门槛 FROM 制度文件 WHERE 层级='本级')
  description: 分组条件：同一建设单位，建设内容前10字相似（如含相同关键词），且审批时间在同一年度内。若分组后项目总预算超过上级审批金额阈值，且单个项目预算均未超过本级审批阈值，且子项目数量大于1，则高度疑似拆分规避审批。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 以拆分项目方式规避审批权限
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照规定的程序审批，不得超越审批权限审批政府投资项目；禁止通过化整为零等方式规避审批权限。\"\n  }\n]"
- expression: (汇总表.批准标准参数（如设计使用年限、材料规格、排放标准） < 标准编号.强制性技术参数（如抗震设防烈度、环保排放浓度、防火等级）) OR (项目合同.合同技术条款中的实际执行标准参数 < 汇总表.批准标准参数（如设计使用年限、材料规格、排放标准）)
    OR (验收报告.实测质量数据 < 汇总表.批准标准参数（如设计使用年限、材料规格、排放标准）)
  description: 三重判定：1.审批环节即降低强制性标准（批准值低于国家强制值）；2.合同约定进一步低于批准标准（执行值低于批准值）；3.实际建设成果未达到批准标准（验收实测值低于批准值）。任一环节成立即可认定为降低标准违规。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 降低建设标准批准建设项目
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十条\",\n    \"内容概述\": \"建设单位不得明示或者暗示设计单位或者施工单位违反工程建设强制性标准，降低建设工程质量。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国标准化法\",\n\
    \    \"法规文号\": \"中华人民共和国主席令第78号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十五条\",\n    \"内容概述\": \"不符合强制性标准的产品、服务，不得生产、销售、进口或者提供。"
- expression: ABS((存货收发存汇总表.期初余额 + 产量统计表.当期完工产量 - 产品销售量统计表.当期销售量) - 存货收发存汇总表.期末余额（分产品）) > 存货收发存汇总表.期末余额（分产品） * 5% || (((存货收发存汇总表.期末余额（分产品）
    - 存货收发存汇总表.期初余额) / 存货收发存汇总表.期初余额) > (产品销售量统计表.销售增长率 + 30%))
  description: 产销量与库存变动应满足永续盘存等式，差异超过5%表明账实不符或虚列存货。存货余额增速远超收入增速，可能意味着产品滞销、虚假入库或未及时结转成本，构成异常信号。
  audit_item: 企业财务报表分析
  suspicion: 存货余额与产销量勾稽关系异常
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第四条、第十五条\",\n    \"内容概述\": \"存货同时满足与该存货有关的经济利益很可能流入企业、成本能够可靠计量时予以确认。企业应当在资产负债表日，按成本与可变现净值孰低计量，差额计提跌价准备，不得隐瞒减值迹象。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n   \
    \ \"内容概"
