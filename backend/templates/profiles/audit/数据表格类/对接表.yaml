name: audit/数据表格类/对接表
type: model
description: 从数据表格类类文档（对接表）中提取结构化元数据。涵盖字段如：参与部门、对接议题、落实情况。文档范围包括：跨部门协同治理工作对接表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 对接表
  member_count: 1
  member_details:
  - 跨部门协同治理工作对接表
output:
  fields:
  - name: 参与部门
    type: string
    description: 提取 参与部门 的文本值
  - name: 对接议题
    type: string
    description: 提取 对接议题 的文本值
  - name: 落实情况
    type: string
    description: 提取 落实情况 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (治理台账.主要污染源类型 == '农业面源' || 治理台账.主要污染源类型 == '畜禽养殖') && (协同治理责任部门.衔接措施 == NULL || 对接表.落实情况 != '已落实')
  description: 治理台账已锁定污染源为农业畜禽类，但未制定专项衔接方案或跨部门协同治理未落实，表明黑臭水治理与面源污染治理严重脱节，形成“治水不治源”的无效治理局面。
  audit_item: 农村生活污水治理不符合相关规定
  suspicion: 黑臭水体治理与面源污染治理工作脱节
  regulation: "[\n  {\n    \"法规名称\": \"农业农村污染治理攻坚战行动方案（2021—2025年）\",\n    \"法规文号\": \"环土壤〔2022〕11号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"加强种植业、养殖业等农业面源污染防治，与农村黑臭水体治理统筹推进，实现系统治理。\"\n  },\n  {\n    \"法规名称\": \"畜禽规模养殖污染防治条例\"\
    ,\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条\",\n    \"内容概述\": \"畜禽养殖须配套建设废弃物综合利用"
