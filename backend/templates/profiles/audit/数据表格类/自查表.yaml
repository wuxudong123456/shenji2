name: audit/数据表格类/自查表
type: model
description: 从数据表格类类文档（自查表）中提取结构化元数据。涵盖字段如：功能科室设置情况、填报的建筑面积、无障碍设施配置情况、违规计提记录。文档范围包括：中央资金使用合规性自查表、达标自查表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 自查表
  member_count: 1
  member_details:
  - 中央资金使用合规性自查表
  - 达标自查表
output:
  fields:
  - name: 功能科室设置情况
    type: string
    description: 提取 功能科室设置情况 的文本值
  - name: 填报的建筑面积
    type: string
    description: 提取 填报的建筑面积 的文本值
  - name: 无障碍设施配置情况
    type: string
    description: 提取 无障碍设施配置情况 的文本值
  - name: 违规计提记录
    type: string
    description: 提取 违规计提记录 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 竣工验收文件.实际竣工面积 < 建设标准文件.最小建筑面积要求 || 实地测量记录.功能分区独立性检查 != '合格' || 达标自查表.无障碍设施配置情况 != '合格' || 竣工验收文件.消防验收意见 != '合格'
    || 竣工验收文件.污水处理设施合格证明 != '合格'
  description: 以《乡镇卫生院建设标准》及地方具体标准为依据，面积低于标准即构成违规；功能分区缺失直接影响服务能力，属重大缺陷。消防、污水、无障碍设施缺一不可。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 乡镇卫生院/村卫生室业务用房面积或功能分区不达标
  regulation: "[\n  {\n    \"法规名称\": \"乡镇卫生院建设标准\",\n    \"法规文号\": \"建标107-2008\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\":\
    \ \"第十五条、第十九条\",\n    \"内容概述\": \"规定乡镇卫生院业务用房面积指标和功能分区要求，包括门诊、急诊、住院、医技等基本用房设置标准。\"\n  },\n  {\n    \"法规名称\": \"村卫生室管理办法（试行）\"\
    ,\n    \"法规文号\": \"国卫基层发〔2014〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十一条、第十二条\",\n    \"内容概述\": \"村卫生室应当分设诊断室、治疗"
- expression: (费用计提与使用明细表.前期工作费 / 中央到位资金 > 0.015) OR (基本预备费 使用于管理支出) OR (费用计提与使用明细表.项目管理费 / 中央到位资金 > 0.03) OR (计提基数 包含 不应计入的征地拆迁费)
  description: 前期工作费比例超过1.5%；基本预备费用于管理支出而非不可预见支出；项目管理费超过3%上限；计提基数违规包含征地费用。
  audit_item: 项目资金使用不合规
  suspicion: 违规在中央资金中计提项目管理费等费用
  regulation: "[\n  {\n    \"法规名称\": \"《基本建设项目建设成本管理规定》\",\n    \"法规文号\": \"财建〔2020〕23号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条、第五条\",\n    \"内容概述\": \"项目建设管理费总额控制数以项目审批部门批准的项目总投资（经批准的动态投资，不含项目建设管理费）扣除征地拆迁费后为基数，分档计算；前期工作费属于工程建设其他费用，按合同或协议规定计列，不得重复计取。\"\
    \n  },\n  {\n    \"法规名称\": \"《中央预算内投资补助和贴息项目管理办法》\",\n    \"法规文号\": \"国家发展改革委令第45号\",\n    \"效力"
