name: audit/数据表格类/体系表
type: model
description: 从数据表格类类文档（体系表）中提取结构化元数据。涵盖字段如：关键指标权重分配、指标数量、指标来源、是否个性化定制、量化程度。文档范围包括：绩效评价指标体系表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 体系表
  member_count: 1
  member_details:
  - 绩效评价指标体系表
output:
  fields:
  - name: 关键指标权重分配
    type: string
    description: 提取 关键指标权重分配 的文本值
  - name: 指标数量
    type: number
    description: 提取 指标数量 的数值（含单位，如万元、吨等）
  - name: 指标来源
    type: string
    description: 提取 指标来源 的文本值
  - name: 是否个性化定制
    type: boolean
    description: 提取 是否个性化定制 的布尔值（是/否）
  - name: 量化程度
    type: string
    description: 提取 量化程度 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 部门内部绩效评价规章制度.文件存在性 = '否' OR (部门内部绩效评价规章制度.细化程度 = '直接套用通用模板' AND 绩效评价指标体系表.指标来源 = '全部通用') OR 第三方评价管理相关制度.存在性
    = '否'
  description: 部门未制定本部门绩效评价实施细则或操作规范，或者文件虽存在但完全照搬上级通用条款无任何本行业、本单位细化指标，或委托第三方评价但缺失选聘与质量管理制度，均视为规章制度不健全。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 未制定本部门绩效评价规章制度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第二部分（二）\",\n    \"内容概述\": \"各部门各单位要健全绩效指标和标准体系，制定本部门本单位绩效评价规章制度，完善评价操作流程，提高评价的针对性和有效性。\"\n  }\n]"
- expression: (绩效管理制度与考核办法.存在标识 == 0) || (绩效目标完成情况对照表.连续缺失月数 >= 3) || (绩效评价指标体系表.指标数量 == 0) || (绩效评价指标体系表.关键指标权重合计 < 0.5)
    || (项目验收报告.绩效结论 == '基本完成' AND ABS(绩效目标完成情况对照表.目标偏差率) > 0.2)
  description: 无制度直接违规；绩效监控数据连续缺失3个月以上视为未实质开展；无任何评价指标或关键指标权重低于50%，表明绩效体系虚设；验收报告结论模糊（如'基本完成'）但实际偏差超过20%，存在选择性评价嫌疑。
  audit_item: 项目建设组织实施不到位
  suspicion: 未建立绩效管理制度或绩效管理流于形式
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价。未建立绩效管理制度或未实质开展绩效管理，违反该条规定。\"\n  },\n  {\n    \"\
    法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第二条\",\n\
    \    \"内容概"
