name: audit/数据表格类/披露表
type: model
description: 从数据表格类类文档（披露表）中提取结构化元数据。涵盖字段如：披露的担保合同清单、金额。文档范围包括：财务报表附注中的担保事项披露表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 合同
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 披露表
  member_count: 1
  member_details:
  - 财务报表附注中的担保事项披露表
output:
  fields:
  - name: 披露的担保合同清单
    type: string
    description: 提取 披露的担保合同清单 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: （被担保方名称、担保金额、担保类型、是否关联方、担保类型（是否全资子公司）、是否有反担保标识、担保合同编号、担保开始日.担保合同编号 NOT IN （披露的担保合同清单、金额.披露的担保合同清单 ∪ 披露的担保合同清单、金额.披露的担保合同清单））
    OR （涉诉担保合同编号、涉诉金额.涉诉担保合同编号 IS NOT NULL AND 涉诉担保合同编号、涉诉金额.涉诉担保合同编号 NOT IN （被担保方名称、担保金额、担保类型、是否关联方、担保类型（是否全资子公司）、是否有反担保标识、担保合同编号、担保开始日.担保合同编号））
  description: 担保台账中有记录但未在任何公开披露信息中出现的担保事项，表明信息披露缺失；诉讼记录中存在担保合同编号但台账中无对应记录，提示可能存有未入账、未披露的隐性担保。两者均触发疑点。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 上市公司存在未披露担保或隐性担保
  regulation: "[\n  {\n    \"法规名称\": \"上市公司信息披露管理办法\",\n    \"法规文号\": \"证监会令第182号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"发生可能对上市公司证券及其衍生品种交易价格产生较大影响的重大事件，投资者尚未得知时，上市公司应当立即披露。前款所称重大事件包括公司对外提供重大担保。\"\n  },\n  {\n\
    \    \"法规名称\": \"关于规范上市公司对外担保行为的通知\",\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\"\
    ,\n   "
