name: audit/数据表格类/完成表
type: model
description: 从数据表格类类文档（完成表）中提取结构化元数据。涵盖字段如：实物工程完成率、累计完成工程量、计划完成量。文档范围包括：基础设施项目实物工程量完成表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 工程
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 完成表
  member_count: 1
  member_details:
  - 基础设施项目实物工程量完成表
output:
  fields:
  - name: 实物工程完成率
    type: string
    description: 提取 实物工程完成率 的文本值
  - name: 累计完成工程量
    type: string
    description: 提取 累计完成工程量 的文本值
  - name: 计划完成量
    type: string
    description: 提取 计划完成量 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ((日志.关键路径节点时间 - 日志.关键路径节点时间) / 批复总工期.批复总工期) > 0.2 || (批复总工期.计划竣工日期 && 日志.巡检日期 > 批复总工期.计划竣工日期 && 申请.审批状态)
  description: 关键路径延误率>20%或合同工期已满仍未能竣工且无有效延期审批，直接判定为进展缓慢。实物工程量完成率与计划完成率偏差也是辅助判断指标，但以工期偏离为准。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 重大基础设施项目进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十九条\"\
    ,\n    \"内容概述\": \"建筑工程发包单位应当按照约定的日期开工，按期完成。因故不能按期开工或者竣工的，应当及时办理延期手续。\"\n  },\n  {\n    \"法规名称\": \"财政部关于印发《基本建设项目建设成本管理规定》的通知\"\
    ,\n    \"法规文号\": \"财建〔2016〕504号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"建设单位应加强项目工期管"
