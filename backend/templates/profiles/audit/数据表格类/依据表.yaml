name: audit/数据表格类/依据表
type: model
description: 从数据表格类类文档（依据表）中提取结构化元数据。涵盖字段如：依据的因素及权重、参数设置、因素权重、实际采用的分配方法、审批依据、计算公式、选用的因素指标名称。文档范围包括：放大倍率参数依据表、资金分配测算依据表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 审批
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 依据表
  member_count: 1
  member_details:
  - 放大倍率参数依据表
  - 资金分配测算依据表
output:
  fields:
  - name: 依据的因素及权重
    type: string
    description: 提取 依据的因素及权重 的文本值
  - name: 参数设置
    type: string
    description: 提取 参数设置 的文本值
  - name: 因素权重
    type: string
    description: 提取 因素权重 的文本值
  - name: 实际采用的分配方法
    type: string
    description: 提取 实际采用的分配方法 的文本值
  - name: 审批依据
    type: string
    description: 提取 审批依据 的文本值
  - name: 计算公式
    type: string
    description: 提取 计算公式 的文本值
  - name: 选用的因素指标名称
    type: string
    description: 提取 选用的因素指标名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 实际采用的分配方法、依据的因素及权重、选用的因素指标名称、因素权重、计算公式.实际采用的分配方法 NOT IN 规定申报主体资质条件、必须提交材料清单、申报截止时限、申报程序要求、明文要求的资金分配方法（因素法、项目法、基数法等）、规定的最长拨付时限（如30日内）、明确规定的享受资金地区资格条件（如国家贫困县、产粮大县、西部干旱地区等）.明文要求的资金分配方法（因素法、项目法、基数法等）
  description: 若政策明确规定必须采用因素法、项目法等特定分配方式，而实际采用了其他方法（如简单平均分配、基数分配等）且无合规审批依据，则判为违规。
  audit_item: 资金申报、分配不符合政策要求
  suspicion: 资金分配测算方法不恰当
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"专项转移支付资金的分配主要采取因素法、项目法等。采用因素法分配的，应当选取客观、可量化的因素并合理确定权重。\"\n  }\n]"
- expression: ABS( (按权威数据重新测算的分配金额 - 分配方案.各地区/项目实际分配金额) / 分配方案.各地区/项目实际分配金额 ) > 0.1
  description: 利用政策规定公式和从统计部门等权威来源获取的因素数据，独立计算理论分配金额。若理论与实际分配金额偏差率超过10%，则表明测算过程中可能存在数据引用错误、计算方法错误或人为篡改，触发疑点。
  audit_item: 资金申报、分配不符合政策要求
  suspicion: 因素法分配测算资金不准确
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"采取因素法分配专项转移支付资金，所使用数据应当真实、准确、及时。\"\n  }\n]"
