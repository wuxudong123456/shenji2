name: audit/数据表格类/趋势表
type: model
description: 从数据表格类类文档（趋势表）中提取结构化元数据。涵盖字段如：PH值、变化率、年度、有机质含量、监测区域。文档范围包括：质量变化趋势表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 趋势表
  member_count: 1
  member_details:
  - 质量变化趋势表
output:
  fields:
  - name: PH值
    type: string
    description: 提取 PH值 的文本值
  - name: 变化率
    type: string
    description: 提取 变化率 的文本值
  - name: 年度
    type: date
    description: 提取 年度 的日期值，格式 YYYY-MM-DD
  - name: 有机质含量
    type: string
    description: 提取 有机质含量 的文本值
  - name: 监测区域
    type: string
    description: 提取 监测区域 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (动态监测数据库结构表为空) || (计算平原区监测点位密度 < 1个/万亩) || (MAX(质量变化趋势表.年度)间隔 > 季度) || (EXISTS(SELECT 1 FROM 质量变化趋势表 WHERE 有机质含量连续3期无变化))
    || (监测报告连续缺失超过3期)
  description: 判定违规的条件：1.无监测数据库或库结构表为空；2.平原区监测点密度低于1个/万亩的最低标准；3.数据更新频率低于季度要求，即最新年度数据间隔大于3个月；4.质量变化趋势表中关键指标（如有机质含量）连续3期数据雷同，疑似数据造假；5.监测报告连续缺失超过3期。
  audit_item: 黑土地保护机制不完善
  suspicion: 未建立黑土地常态化监测与动态数据库
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第八十七号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十四条\",\n    \"内容概述\": \"国家建立黑土地质量监测制度，县级以上人民政府农业农村、自然资源等有关部门应当加强对黑土地质量变化的监测，建立黑土地质量动态数据库。\"\n  }\n]"
