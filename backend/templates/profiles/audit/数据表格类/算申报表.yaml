name: audit/数据表格类/算申报表
type: model
description: 从数据表格类类文档（算申报表）中提取结构化元数据。涵盖字段如：人均公用经费定额、会议名称、申报人数、申报会议名称、申报公用经费预算金额、预算总金额、预算明细科目、预算申报人数。文档范围包括：年度会议费预算申报表、日常公用经费预算申报表、预算申报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 会议
- 明细
- 金额
- 预算
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 算申报表
  member_count: 1
  member_details:
  - 年度会议费预算申报表
  - 日常公用经费预算申报表
  - 预算申报表
output:
  fields:
  - name: 人均公用经费定额
    type: number
    description: 提取 人均公用经费定额 的数值（含单位，如万元、吨等）
  - name: 会议名称
    type: string
    description: 提取 会议名称 的文本值
  - name: 申报人数
    type: number
    description: 提取 申报人数 的数值（含单位，如万元、吨等）
  - name: 申报会议名称
    type: string
    description: 提取 申报会议名称 的文本值
  - name: 申报公用经费预算金额
    type: number
    description: 提取 申报公用经费预算金额 的数值（含单位，如万元、吨等）
  - name: 预算总金额
    type: number
    description: 提取 预算总金额 的数值（含单位，如万元、吨等）
  - name: 预算明细科目
    type: number
    description: 提取 预算明细科目 的数值（含单位，如万元、吨等）
  - name: 预算申报人数
    type: number
    description: 提取 预算申报人数 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (会议费报销明细表.会议名称 NOT IN 年度会议费预算申报表.会议名称) && 会议费报销明细表.实际支出金额 > 0 || (SUM(会议费报销明细表.实际支出金额) > 年度会议费预算申报表.批复预算金额 *
    1.1 && 预算调整审批记录表.调整金额 IS NULL)
  description: 筛查两类违规：一是存在实际报销的会议但未在年度预算申报表中列报，即会议脱离预算管控；二是所有会议费实际总支出超出批复预算10%以上，且无任何预算调整审批记录，表明预算约束失效。两条件满足任一即触发疑点。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 未将会议费全部纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条\",\n    \"内容概述\": \"会议费预算要细化到具体会议项目，执行中不得突破。会议费应纳入部门预算，并单独列示。\"\n  }\n]"
- expression: （会议费预算编制与执行对比表.分项实际支出金额 > 会议费预算编制与执行对比表.分项预算金额 * 1.2） || （会议费报销明细表.费用科目 IN ['住宿费','资料印刷费','设备租赁费'] && 年度会议费预算申报表.预算明细科目
    NOT INCLUDE 会议费报销明细表.费用科目）
  description: 若某项费用实际支出超出预算20%以上，或实际发生了住宿费、资料费等必要支出但预算申报时未列示该科目，判定为预算编制不完整。预算编制应涵盖会议必要的全部费用构成，缺失关键科目即构成违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 会议费预算编制不完整
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条\",\n    \"内容概述\": \"各单位应当按照规定编制会议费预算，详细列示会议名称、主要内容、时间、地点、代表人数、工作人员数、所需经费及列支渠道等。\"\n  }\n]"
- expression: 算申报表.申报人数（或测算依据人数） > 核定文件.核定编制数 || 算申报表.申报人数（或测算依据人数） > 名册.在编实有人数
  description: 将预算申报表中作为经费测算基础的申报人数与编制部门核定的编制数、人事部门提供的实际在编人数逐一比对。若申报人数大于核定编制数或大于实际在编人数，即存在多报人数套取公用经费的嫌疑；申报人数偏差率超过0%即触发疑点预警，偏差越大违规风险越高。
  audit_item: 审计事项深入研究
  suspicion: 未按人员编制数申报日常公用经费预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号（2014年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第三十二条\",\n    \"内容概述\": \"各部门、各单位编制预算草案，应当真实、准确，按照政府收支分类科目、预算支出标准和要求以及绩效目标管理规定编制；预算编制不实、不准确的，应予纠正。\"\n\
    \  }\n]"
- expression: (人员名单.实际在岗人数 > 编制文件.核定编制总数) && (算申报表.预算申报人数 > 编制文件.核定编制总数) && (ABS(人员名单.实际在岗人数 - 算申报表.预算申报人数) <= 1)
  description: 实际在岗总人数超过上级核定编制总数，且日常公用经费预算申报表中所使用的预算人数同样超过编制总数，同时预算申报人数与实际在岗人数基本一致（允许±1人的统计误差）。表明单位在预算编报时未按编制数控制，而是据实以超编人数申报，导致公用经费预算虚增。超编比例超过10%为严重违规。
  audit_item: 生成模拟审计数据
  suspicion: 超编制配置人员虚报公用经费预算
  regulation: "[\n  {\n    \"法规名称\": \"行政单位财务规则\",\n    \"法规文号\": \"财政部令第71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第十三条\",\n    \"内容概述\": \"行政单位编制预算，应当综合考虑机构设置、人员编制和实际人数等因素，不得以超编人数作为预算编制基数，确保预算真实性。\"\n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\"\
    ,\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条\",\n    \"内容概述\": \"党政机关应当遵循先有预算、后有支出的"
