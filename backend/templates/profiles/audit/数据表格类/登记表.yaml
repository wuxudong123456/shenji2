name: audit/数据表格类/登记表
type: model
description: 从数据表格类类文档（登记表）中提取结构化元数据。涵盖字段如：不合格处理记录、不合格项、不符合条件原因、与单位关联关系、与实际申报一致性结论、业主分户账号、业主姓名、主体名称。文档范围包括：“一卡通”办理费用收取登记表、一卡通办理登记表、下属单位车辆资产登记表、专利实施许可备案登记表、业主信息登记表、乡村医生人员流动与空缺岗位登记表、乡村医生投诉举报处理登记表、乡村教师离职/调动登记表、产权限制状态登记表、企事业单位车辆调换/借用登记表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 培训
- 元数据提取
