violations:
- expression: (企业法人/高管信息对照表.任职起始日期 - 领导干部离职/退休信息登记表.离职日期) < 3年 && 离职人员从业情况申报表.企业性质 IN ('民营企业','外商投资企业','中介机构') && (工商登记信息.注册地址
    ∈ 领导干部离职/退休信息登记表.分管领域 OR 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围) && (社会兼职申报.审批结果 != '批准' OR 社会兼职申报.审批结果 IS NULL)
  description: 禁业期按通常3年设定；若任职起始日期与离职日期间隔小于1095天即为在禁业期内；企业性质须为民营企业、外商投资企业或中介机构之一；业务关联判定采用地区匹配或关键词重合（审计中可设定重合度阈值>60%）；若未履行审批手续或审批不通过即触发疑点。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规接受原管辖范围内企业聘任
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"公务员辞去公职或者退休的，原系领导成员的公务员在离职三年内，不得到与原工作业务直接相关的企业或者其他营利性组织任职，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n \
    \ {\n    \"法规名称\": \"关于进一步规范党政领导干部在企业兼职（任职）问题的意见\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": "
- expression: (工商登记信息.成立日期 >= 领导干部离职审批文件.离职日期 - 缓冲期) && (领导干部离职审批文件.离职日期 + 3年 >= 当前日期 OR 当前日期 - 领导干部离职审批文件.离职日期 <= 3年) &&
    ((工商登记信息.投资人/股东姓名及身份证号 = 领导干部离职审批文件.姓名) OR (工商登记信息.企业名称 = 直系亲属经商办企业备案表.企业名称 AND 工商登记信息.投资人/股东姓名及身份证号 = 直系亲属经商办企业备案表.亲属姓名))
    && (关联企业清单.企业名称 = 工商登记信息.企业名称 AND 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围
  description: 缓冲期可设定为6个月，避免离职前已谋划的合理情形；禁业期以3年为限；企业投资人或实际控制人为本人或直系亲属（代持）；业务关联性通过关键词匹配（如原分管住建，企业主营房地产开发、建筑工程咨询），叠加与原任职单位存在交易或利用原权力获得审批，即触发违规。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事与原职务相关的营利性活动
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"原系领导成员的公务员在离职三年内，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"\
    法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第九十六条\",\n    \"内容概述\": \"离职或者退（离）休后违反有关规定从事与原任职务管辖业务相关的营利活动，视"
- expression: (行业协会商会领导成员任职表.任职起始日期 - 离退休人员信息登记表.离职日期) <= 1095 AND (离退休人员返聘审批文件.审批结果 != '批准' OR 离退休人员返聘审批文件.批准兼职单位 != 行业协会商会领导成员任职表.任职单位
    OR 离退休人员返聘审批文件 IS NULL)
  description: 计算退休人员到行业协会商会任职的起始日期与离职日期的相差天数，若小于等于1095天（3年）且无合规审批，则构成违规。审批文件需明确批准该人员在该协会任职，否则触发疑点。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 退（离）休三年内违规到行业协会商会兼职
  regulation: "[\n  {\n    \"法规名称\": \"关于规范退（离）休领导干部在社会团体兼职问题的通知\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"退（离）休领导干部在社会团体兼职，须按干部管理权限审批或备案后方可兼职。除工作特殊需要外，年龄一般不超过70周岁，且兼职不得超过1个。兼职不得领取社会团体的薪酬、奖金、津贴等报酬和获取其他额外利益，也不得领取各种名目的补贴等。原任领导干部职务的退（离）休领导干部在社会团体兼职，届满后连任不超过两届，兼职的任职年龄界限为70周岁。\"\
    \n  },\n  "
- expression: (离退休人员信息登记表.离职日期 <= (当前日期 - 1095)) AND (行业协会商会领导成员任职表.是否领取报酬 == '是' OR 薪酬发放凭证.付款方 IN (行业协会商会领导成员任职表.任职单位) OR
    经济实体股东高管名单.人员姓名 IN (离退休人员信息登记表.姓名) AND 经济实体股东高管名单.企业名称 IN (原任职务管辖地区和业务范围内的企业名单))
  description: 对退休已满3年人员，仍须检查其在行业协会兼职是否违规取酬，或是否在原管辖范围企业违规任职、取酬。表达式判定三类情形：1.在协会兼职但领取报酬；2.从协会或原管辖企业获取薪酬；3.在原管辖业务范围内企业持股或任职。存在任一情形则触发疑点。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 退（离）休三年后违规兼职或变相取酬
  regulation: "[\n  {\n    \"法规名称\": \"关于规范退（离）休领导干部在社会团体兼职问题的通知\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"退（离）休领导干部经批准兼任社会团体职务，兼职不得领取社会团体的薪酬、奖金、津贴等报酬和获取其他额外利益，也不得领取各种名目的补贴等。\"\n  },\n\
    \  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第九十五条\"\
    ,\n  "
- expression: (礼品发放记录.采购物品名称 LIKE '%购物卡%' OR 礼品发放记录.采购物品名称 LIKE '%高档烟酒%' OR 礼品发放记录.采购物品名称 LIKE '%礼金%') OR (礼品发放记录.单价 > 300)
    OR (财务报销凭证.报销科目 LIKE '%办公用品%' AND 财务报销凭证.金额 > 2000 AND 财务报销凭证.所附审批单情况 = '无明细清单') OR (礼品收发登记表.领取人签字 IS NULL)
  description: 采购购物卡、高档烟酒等违禁品；礼品单价超过300元（参考标准）；大额办公用品报销无实际采购明细涉嫌伪装礼品支出；礼品发放无领取人签字无法追溯去向，均视为违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务接待中赠送违规礼品
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第十六条\",\n    \"内容概述\": \"接待单位不得以任何名义赠送礼金、有价证券、纪念品和土特产品等。\"\n  }\n]"
- expression: (离职人员利益往来登记表.利益输送企业名称 IN 关联企业及业务关系企业名录.关联企业名称) AND (离职人员利益往来登记表.发生日期 BETWEEN 离职人员利益往来登记表.离职日期 AND 离职人员利益往来登记表.离职日期+1095天)
    AND (离职人员利益往来登记表.金额 > 0) AND (关联交易明细台账.审批人 = 该离职人员) AND (关联交易明细台账.交易日期在离职前)
  description: 离职人员在离职后三年内从原关联企业获取报酬或物质利益，且该关联企业曾与离职人员任职企业发生业务往来并由其审批，线索即为违规。利益类型包括顾问费、咨询费、无偿提供财物等。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 离职后三年内接受原关联企业利益
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（二）项\",\n    \"内容概述\": \"不得在职或者离职后接受、索取本企业的关联企业、与本企业有业务关系的企业，以及管理和服务对象提供的物质性利益。\"\n  }\n]"
- expression: (分析表.差异数量 > 0 && 分析表.差异原因 NOT IN ('已审批销毁','依法移交')) || (检查记录.防火防潮防盗检查结果 = '不合格') || (检查记录.电子备份检查结论 IS NULL OR
    检查记录.电子备份检查结论 > 7天) || (存档清单.资料名称 NOT IN (资料清单.资料名称) AND 登记表.归还日期 IS NULL)
  description: 1. 盘点差异表中存在缺失资料，且无合规销毁或移交记录，视为毁损灭失；2. 保管环境检查不合格，包括物理环境不达标或电子备份缺失/失败，直接判定违规；3. 存档清单中的应保存资料不在现存清单中，且借阅未归还，也视为保管不善丢失。电子备份机制缺失（如连续7日未成功备份）作为灭失风险纳入。
  audit_item: 未按规定保管会计资料，造成会计资料毁损、灭失；隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告
  suspicion: 未按规定保管会计资料造成毁损灭失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十二条\",\n    \"内容概述\": \"未按照规定保管会计资料，致使会计资料毁损、灭失的，由县级以上人民政府财政部门责令限期改正，可以对单位并处三千元以上五万元以下的罚款；对其直接负责的主管人员和其他直接责任人员，可以处二千元以上二万元以下的罚款；属于国家工作人员的，还应当依法给予行政处分；构成犯罪的，依法追究刑事责任。\"\
    \n  },\n  {\n    \"法规名称\": \"会计档案管理办法\",\n    \"法规文号"
- expression: (销毁登记表.销毁日期 - 销毁登记表.资料形成日期 < 计算法定保管年限(默认30年)) || (系统操作日志.操作类型（删除/修改）= '删除' AND 系统操作日志.操作对象 NOT IN (销毁登记表.销毁资料名称))
    || (盘点差异分析表.缺失资料名称 IN ('原始凭证','记账凭证','会计账簿','财务报告') AND 盘点差异分析表.差异原因 NOT IN ('已审批销毁','依法移交') AND 借阅调取登记表.借出状态 != '未归还')
    || (涉事人员询问笔录 LIKE '%故意销毁%' OR '%隐匿%')
  description: 1. 销毁登记表中销毁的资料形成到销毁年限短于法定保管年限（凭证、账簿30年，年报永久），无论审批是否齐全，均构成故意销毁；2. 系统日志存在删除操作且删除对象不在正规销毁清册中，视为隐匿销毁；3. 盘点发现重要会计资料缺失，且无合规销毁记录、无借阅记录，疑为故意隐匿；4.
    询问笔录中相关人员承认隐匿或销毁的直接作为线索。
  audit_item: 未按规定保管会计资料，造成会计资料毁损、灭失；隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告
  suspicion: 隐匿或者故意销毁依法应当保存的会计资料
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十四条\",\n    \"内容概述\": \"隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告，构成犯罪的，依法追究刑事责任。尚不构成犯罪的，由县级以上人民政府财政部门予以通报，可以对单位并处五千元以上十万元以下的罚款；对其直接负责的主管人员和其他直接责任人员，可以处三千元以上五万元以下的罚款；属于国家工作人员的，还应当由其所在单位或者有关单位依法给予撤职直至开除的行政处分；其中的会计人员，五年内不"
- expression: 明细台账.征收项目 NOT IN (征收范围描述.项目名称) OR (明细台账.缴费单位/个人名称 NOT IN (征收范围描述.征收对象))
  description: 当征收台账中出现的项目名称不在财政、物价部门公布的征收范围目录内，或者虽项目名称相符但实际征收对象（如个人、非营利组织）超出了目录规定的对象类型，判定为违规扩大征收范围。
  audit_item: 违反规定征收非税收入
  suspicion: 违规扩大非税收入征收范围
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"非税收入项目由法律、法规、规章设立。设立和征收非税收入，应当依据法 律、法规、规章的规定，并按照管理权限予以批准。任何部门和单位不得违反规定擅自设立非税收入项目或者改变征收范围、标准、对象和期限。\"\
    \n  }\n]"
- expression: (资产编号、争议情况.资产编号 对应 资产编号、处置类型、处置日期、资产原值、处置收入.资产编号) || (资产编号、资产类别、原值、资产状态（查封/抵押等）、资产状态（在库/已处置）、处置日期.资产状态（查封/抵押等）
    IN ('查封','抵押') && 查封/抵押未解除) || (权属人、共有情况、他项权利.他项权利 NOT IN ('无','已解除'))
  description: 当已处置资产的权属存在争议（已在争议登记表中记录），或资产状态显示被查封、抵押等权利受限且未解除，或权属证明文件显示存在未解除的他项权利时，均构成违规处置权属不清资产。
  audit_item: 违规处置国有资产
  suspicion: 违规处置权属不清或有争议的国有资产
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"转让方应当对转让标的进行产权界定和资产评估，产权应当清晰，不存在权属纠纷。\"\n  }\n]"
- expression: ((登记表.用车时间 ∈ 非工作时段) AND ((记录表.车辆坐标位置 匹配 非公务场所) OR (登记表.事由 不包含 公务关键词))) OR ((用车台账.车牌号 != 明细表.车牌号) AND (明细表.加油时间
    无匹配 派车记录)) OR ((明细表.维修方 != 定点供应商) AND (明细表.费用日期 无匹配 对应车牌号在用记录))
  description: 非工作时段默认指国家法定节假日及工作日19:00至次日7:00；非公务场所包括但不限于学校、商场、居民小区、旅游景点等，由GPS数据与POI数据库比对；公务关键词包括“会议”、“调研”、“检查”、“出差”、“接待”等；当加油车辆为私家车或在无派车记录时段加油，则判定为私车公养；报销发票对应车牌号若无使用记录或维修商非定点，存在虚报维修嫌疑。
  audit_item: 违规管理或使用公务用车
  suspicion: 公车私用或私车公养
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"党政机关应当加强公务用车使用管理，严格按照规定使用公务用车，严禁公车私用、私车公养，不得既领取公务交通补贴又违规使用公务用车。\"\n  }\n]"
- expression: (登记台账类.车牌号 IN 登记表.车牌号) AND ((手续文件 IS NULL) OR (登记表.用车时间 > 手续文件.借用期限) OR (登记台账类.车辆费用预算归属 != 登记台账类.权属单位))
  description: 若单位公务用车台账中包含下属或其他单位的资产车辆，且无合规的调拨或借用审批文件，或实际使用期限严重超出批准期限（如超过1个月未续期），或相关运行费用未向原单位列支或补偿，则判定为违规占用。
  audit_item: 违规管理或使用公务用车
  suspicion: 违规占用下属或其他单位车辆
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"党政机关不得以任何方式换用、借用、占用下属单位或者其他单位和个人的车辆，不得接受企事业单位和个人赠送的车辆。\"\n  }\n]"
- expression: (管理主体.管理主体 != '集中调度部门') OR (登记表.审批人 分散于 多个非主管科室) OR (用车台账.车辆费用预算归属 跟随 单个部门独立核算)
  description: 若制度中未明确由一个专门的部门负责所有车辆的调度和管理，或在实际执行中，派车审批权分散在各个业务科室，且车辆费用直接计入各科室预算而不进行统一核算，则判定为未实行集中统一管理。
  audit_item: 违规管理或使用公务用车
  suspicion: 公务用车未实行集中统一管理
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"党政机关应当加强公务用车集中统一管理，建立公务用车管理台账，加强相关证照档案的保存和管理。\"\n  }\n]"
- expression: (批复车辆编制数、实有车辆台数、车型.实有车辆台数 > 批复车辆编制数、实有车辆台数、车型.批复车辆编制数) OR (车牌号、车辆型号、权属单位、车辆品牌型号、使用部门、车辆管理部门、停放地点、车辆费用预算归属、购入日期、排量、能源类型、车辆状态、净值、实有车辆总数、品牌型号、购置价格.实有车辆总数
    > 批复车辆编制数、实有车辆台数、车型.实有车辆台数) OR (维修保养项目、维修方、报销金额、费用日期、收款方名称、保险、加油、维修实际支出金额.维修实际支出金额 远大于 批复车辆编制数、实有车辆台数、车型.批复车辆编制数)
  description: 若单位对上的正式报告中少报、瞒报实有车辆数，或超编制配备使用车辆；或实际运行维护费开支远超向上级报告的标准，均属于未严格执行统计报告制度。实有数大于上报数，或台账车辆与报告中车辆车牌号不符，是瞒报的直接证据。
  audit_item: 违规管理或使用公务用车
  suspicion: 未严格执行配备更新统计报告制度
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"各级公务用车主管部门应当建立公务用车配备更新和使用情况统计报告制度。党政机关应当定期向上级公务用车主管部门报告公务用车配备更新和使用情况。\"\n  }\n]"
- expression: (借用单位、出借单位、车辆品牌型号、车牌号、借用起止日期.借用单位 = 某机关单位 AND (借用单位、出借单位、车辆品牌型号、车牌号、借用起止日期.借用起止日期 > 规定期限 OR 借用单位、出借单位、车辆品牌型号、车牌号、借用起止日期.借用起止日期
    IS NULL)) OR (实际支付金额、车辆型号、支付金额、供应商名称、支付单位名称.支付单位名称 LIKE '%企业%' AND 车牌号、车辆型号、价格、排量、购置日期、使用部门、车辆类型（越野车标识）、车辆来源（国产/进口）、采购方式、车辆来源（是否退役转籍）、当前使用部门、名义权属单位、实际使用部门、车辆购置日期、车辆状态.实际使用部门
  description: 机关单位长期借用企事业单位车辆、由企事业单位支付购车款或承担车辆运行费用，均属利用职权违规配备车辆。
  audit_item: 违规配备公务用车
  suspicion: 利用职权调换借用或摊派购车
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十一条\",\n    \"内容概述\": \"党政机关不得以任何方式换用、借用、占用下属单位或者其他单位和个人的车辆，不得接受企事业单位和个人赠送的车辆，不得向企事业单位摊派款项购买车辆。\"\n  }\n]"
- expression: 收费明细表.收费项目名称 CONTAINS ('U盾','CA证书','电子密钥','数字证书','电子介质') && (收费明细表.单价 > 电子介质采购及发放登记表.采购单价 * 1.5 || (电子介质采购及发放登记表.发放数量
    < 收费明细表.采购数量 && 收费明细表.金额 > 0) || 政策文件.禁止收费项目清单中关于电子介质的规定 包含 '电子介质成本费')
  description: 当收取电子介质费用时，若单价远超采购价的1.5倍，或收费数量大于实际发放数量（即空转收费），或此类收费被政策明令禁止，均构成违规。倍数阈值1.5倍可根据实际情况调整，用于识别明显不合理加价。
  audit_item: 违规收费-要求企业承担电子政务平台技术维护费、服务费、电子介质成本费等经营服务性费用
  suspicion: 违规收取电子介质成本费
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委 财政部关于清理规范电子政务平台收费有关问题的通知\",\n    \"法规文号\": \"发改价格〔2011〕2352号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"全文\",\n    \"内容概述\": \"明确要求不得以电子介质成本费等名义向企业收费，电子政务平台所需的电子认证、数字证书等成本应由财政承担。\"\n  },\n  {\n\
    \    \"法规名称\": \"政务信息系统整合共享实施方案\",\n    \"法规文号\": \"国办发〔2017〕39号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三部分第（五）条\"\
    ,\n "
- expression: (整改验收报告或证明材料.电子文件创建日期 > 整改验收报告或证明材料.文件落款日期 AND ABS(整改验收报告或证明材料.电子文件创建日期 - 整改验收报告或证明材料.文件落款日期) > 1) OR (同一日期签发的整改关键文件数量
    >= 5) OR (管理层会议纪要.会议日期 NOT IN (会议室使用登记表.使用日期) AND 管理层会议纪要.会议日期 != 会议室使用登记表.使用日期)
  description: 通过文件元数据日期逻辑（创建晚于落款为后补）、集中补签异常（同一天签发大量整改文件）、会议时间与物理空间使用记录矛盾来识别材料造假。创建日期晚于落款日期且相差超过1天，排除时区等误差；同一日期签发5份及以上为异常集中；会议时间无对应会议室使用记录则存疑。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 整改佐证材料事后补编或造假
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"审计整改情况应当真实、完整，不得弄虚作假。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017修正）\"\
    ,\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十三条\",\n    \"内容概述\": \"伪造、变造会计凭证、会计帐簿，编制虚假财务会计报告，构成犯罪的，依法追究刑事责任。\"\n  }"
- expression: 车辆费用报销台账.报销车牌号 NOT IN (公务用车调配登记表.公务车车牌号) AND 车辆费用报销台账.报销车牌号 = 领导人员私家车辆权属证明.车牌号 AND (车辆费用报销台账.金额 > 5000 OR 车辆费用报销台账.加油频次
    > 4)
  description: 报销车牌不在企业公务车清单内，且该车为领导本人或亲属名下，月度费用异常，即判定为公款支付私家车费用。
  audit_item: 公款用于个人支出
  suspicion: 公款报销领导私家车辆费用
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有企业负责人职务消费的指导意见\",\n    \"法规文号\": \"国资发分配〔2006〕69号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业负责人职务消费应坚持从紧必需原则，不得用于应由个人承担的费用，不得随意扩大职务消费范围或提高消费标准。\"\n  }\n]"
