name: audit/数据表格类/变动表
type: model
description: 从数据表格类类文档（变动表）中提取结构化元数据。涵盖字段如：与合同约定差异、产品平均售价及同比变动、付款进度、原币金额、折算后人民币金额、折算汇率。文档范围包括：主要产品销售价格变动表、外币账户余额及汇率变动表、资金支付异常变动表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 付款
- 合同
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 变动表
  member_count: 1
  member_details:
  - 主要产品销售价格变动表
  - 外币账户余额及汇率变动表
  - 资金支付异常变动表
output:
  fields:
  - name: 与合同约定差异
    type: string
    description: 提取 与合同约定差异 的文本值
  - name: 产品平均售价及同比变动
    type: string
    description: 提取 产品平均售价及同比变动 的文本值
  - name: 付款进度
    type: number
    description: 提取 付款进度 的数值（含单位，如万元、吨等）
  - name: 原币金额
    type: number
    description: 提取 原币金额 的数值（含单位，如万元、吨等）
  - name: 折算后人民币金额
    type: number
    description: 提取 折算后人民币金额 的数值（含单位，如万元、吨等）
  - name: 折算汇率
    type: string
    description: 提取 折算汇率 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (采购方式.采购方式 == 竞争性谈判) && (采购方式.项目预算 >= 公开招标限额标准) && (谈判轮次.谈判轮次 >= 2) && (谈判轮次.服务范围变更 == 是)
  description: 公开招标限额标准依据现行法规（如政府采购限额标准）；项目预算达到标准但未公开招标，采用竞争性谈判方式，且谈判中要求投标人多轮调整价格或服务内容，属于规避公开招标并实质性谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 利用多轮报价变相进行实质性谈判
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\"\
    ,\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容"
- expression: (变动表.折算汇率 != 政策文件.规定汇率来源) || (ABS(变动表.原币金额 * 政策文件.规定汇率来源 - 变动表.折算后人民币金额) > 0) || (汇兑损益未计入财务费用)
  description: 若使用汇率非期末央行中间价，或折算金额计算错误，或汇兑损益未在恰当科目反映，均属折算处理错误。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 年终外币折算汇率或方法错误
  regulation: "[\n  {\n    \"法规名称\": \"《企业会计准则第19号——外币折算》\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十一条\",\n    \"内容概述\": \"企业在资产负债表日，应当对外币货币性项目采用期末即期汇率折算，因汇率变动产生的差额计入当期损益。\"\n  }\n]"
- expression: 利润表.营业收入增长率 - 产品销售量统计表.销售增长率 > 20% && 主要产品销售价格变动表.产品平均售价及同比变动 < 10% && 同行业可比公司数据.收入增长率 < (利润表.营业收入增长率 - 产品销售量统计表.销售增长率)
  description: 当收入增长率远超销售量增长率，而产品售价基本稳定且显著高于行业平均水平时，可能存在虚增收入、人为调节销售数量或单价的风险。阈值可根据行业波动适当调整，一般偏差超过20%视为高度可疑。
  audit_item: 企业财务报表分析
  suspicion: 收入增长与销售量变动逻辑背离
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。收入金额应反映企业因交付商品而预期有权收取的对价，禁止在未满足条件时提前确认或虚构收入。\"\n\
    \  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n    \"\
    内容概述\": \"公"
