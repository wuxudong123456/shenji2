name: audit/数据表格类/评估表
type: model
description: 从数据表格类类文档（评估表）中提取结构化元数据。涵盖字段如：不合格人数、两不愁三保障状况、亩均减产量、供应商名单、全县畜禽粪污综合利用率、前后有机质含量对比、单位水量灌溉面积、合格人数。文档范围包括：PPP项目债务风险评估表、产业技术培训效果评估表、仓储条件评估表、供应商合作评估表、土壤改良措施实施效果评估表、捐赠物资价值评估表、效益评估表、数字技能培训效果评估表、灌溉用水效率评估表、畜禽粪污资源化利用效果评估表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 培训
- 预算
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 评估表
  member_count: 1
  member_details:
  - PPP项目债务风险评估表
  - 产业技术培训效果评估表
  - 仓储条件评估表
  - 供应商合作评估表
  - 土壤改良措施实施效果评估表
  - 捐赠物资价值评估表
  - 效益评估表
  - 数字技能培训效果评估表
  - 灌溉用水效率评估表
  - 畜禽粪污资源化利用效果评估表
  - 膳食营养搭配合理性评估表
  - 返乡创业项目评估表
  - 风险消除复核评估表
