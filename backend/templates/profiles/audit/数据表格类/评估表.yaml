violations:
- expression: (要求推行EMC的项目类型与范围 == '政策强制要求') && (项目协议 == null || 项目协议.节能效益分享比例 == null || 项目协议.节能量计算方式 == null)
  description: 对于国家或地方政策明确要求采用合同能源管理模式的项目（如公共机构节能改造），未签订EMC协议，或协议中缺少效益分享、节能量计算等核心条款，均属违规。
  audit_item: 节能减排方面存在的问题
  suspicion: 应推行而未推行合同能源管理或合同核心条款缺失
  regulation: "[\n  {\n    \"法规名称\": \"合同能源管理技术通则\",\n    \"法规文号\": \"GB/T 24915-2020\",\n    \"效力级别\": \"国家推荐性标准\",\n   \
    \ \"条款号\": \"第4章、第5章\",\n    \"内容概述\": \"合同能源管理项目应签订书面合同，明确基准能耗、节能量计算与确认方法、效益分享方式等内容。\"\n  },\n  {\n    \"法规名称\": \"国务院办公厅转发发展改革委等部门关于加快推行合同能源管理促进节能服务产业发展意见的通知\"\
    ,\n    \"法规文号\": \"国办发〔2010〕25号\",\n    \"效力级别\": \"国务院规范性文件\",\n    \"条款号\": \"二"
- expression: 耕地土壤有机质含量监测数据表.有机质含量 < 土壤有机质提升技术规程.有机质目标值
  description: 以地方制定的有机质提升技术规程或考核目标中的有机质含量标准为依据，当监测数据表中任一有效监测点位的土壤有机质含量低于该目标值时，即判定为该点位未达标；若未达标点位数量达到一定比例（如超过10%）或连续年度下降，则认定为耕地土壤有机质含量整体未达标。
  audit_item: 任务目标未完成
  suspicion: 耕地土壤有机质含量未达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当将黑土地保护纳入国民经济和社会发展规划，安排资金，确保黑土地面积不减、质量不降，生态功能不退化。\"\n  }\n]"
- expression: (对比表.实际有效灌溉面积 / 对比表.设计灌溉面积 < 0.85) || (因设施损毁导致的区域减产比例 > 10%)
  description: 设计面积与实际有效灌溉面积差异超过15%（即有效面积占比<85%）预警；若因设施损毁导致局部区域无法正常灌溉，且造成减产比例超过10%，则判定为设施管护效果违规。
  audit_item: 大中型灌区运行管护和取水用水不符合相关规定
  suspicion: 灌区设施损毁致灌溉保证率不足
  regulation: "[\n  {\n    \"法规名称\": \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\"\
    ,\n    \"内容概述\": \"灌区管理单位应当保障灌溉用水需求，确保工程运行安全。\"\n  }\n]"
- expression: (许可证.许可作物种类 not.in 年度储备任务计划文件.计划储备品种) || (评估表.有效库容 < 储备任务分解表.计划总数量) || ((评估表.温湿度控制设备 == "无" || 评估表.防潮通风设施 ==
    "不达标") && 监测表.种子霉变记录 > 0)
  description: 种子经营许可证的许可范围未覆盖储备品种即属超范围承储；库容小于任务计划总量则仓储能力先天不足；仓库缺乏必要的温湿度控制设备且库存记录已出现霉变，证明管理能力实质性缺失。三项条件任一成立即构成疑点。
  audit_item: 救灾备荒种子储备方面不符合相关规定
  suspicion: 承储企业资质不达标或储备管理能力不足
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"2021年修订版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十一条、第六十条\",\n    \"内容概述\": \"从事种子生产经营须取得种子生产经营许可证；承担救灾备荒种子储备任务的企业应具备相应的仓储设施、技术能力和信用条件。\"\n  }\n]"
- expression: (明细表.参训人次 < 计划培训次数.应覆盖人数) || (评估表.合格率 < 0.7) || (登记台账.月均使用次数 < 4 && 明细表.培训日期 > 当前日期 - 90天)
  description: 培训覆盖率未达100%，或参训人员考核合格率低于70%，或在最近一次培训结束后90天内设备月均使用次数仍不足4次（即平均每周不足1次），均表明培训无效或管理缺失，导致设备无人会用、无人使用。
  audit_item: 数字乡村建设人才不足
  suspicion: 培训管理不到位导致数字设备设施无人使用
  regulation: "[\n  {\n    \"法规名称\": \"关于加快推进乡村人才振兴的意见\",\n    \"法规文号\": \"中办发〔2021〕27号\",\n    \"效力级别\": \"制度文件\",\n    \"\
    条款号\": \"三、（九）加强乡村公共服务人才队伍建设\",\n    \"内容概述\": \"面向乡村公共服务人才广泛开展数字化技能培训，确保培训内容与实际岗位需求相匹配，强化培训考核与效果评估，保障培训实效。\"\n  }\n]"
- expression: 政府支出责任.保底收益条款 == '是' OR 政府支出责任.隐性担保条款 == '是' OR (年度财政支出责任.年度财政支出责任 / 本级一般公共预算支出.本级一般公共预算支出 * 100 > 10)
  description: 合同存在固定回报或隐性担保，或者测算的年度财政支出责任超过一般公共预算支出的10%，即认定为变相举债，形成政府隐性债务。
  audit_item: 违反高标准农田项目规划和管理规定的行为
  suspicion: 利用PPP模式变相举债建设高标准农田
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于推进政府和社会资本合作规范发展的实施意见\",\n    \"法规文号\": \"财金〔2019〕10号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"二（二）\",\n    \"内容概述\": \"确保每一年度本级全部PPP项目从一般公共预算列支的财政支出责任，不超过当年本级一般公共预算支出的10%。严禁通过‘保底承诺’‘回购安排’等方式变相举债。\"\
    \n  }\n]"
- expression: （《风险消除复核评估表》.稳定达标时长 < 6个月） || （《风险消除复核评估表》.家庭人均纯收入 < 当年监测标准基准线） || （《帮扶措施落实情况台账》 中 退出前最近3个月 无 任何帮扶记录） || （《风险消除评估审批文件》.审批日期
    早于 《帮扶台账》.最后帮扶日期）
  description: 判定标准：1. 收入达标等积极状态必须至少连续稳定6个月，不足则属于提前消险；2. 标注消除时点，其家庭人均纯收入仍低于省定防止返贫监测收入标准，一票否决；3. 按规定，风险消除前应有持续帮扶巩固期，若退出前3个月无任何帮扶痕迹，说明并非“稳定消除”，而是为甩包袱而放弃帮扶。4.
    审批流程逻辑倒置，表明评估审核是走过场。满足上述任一条件即为违规消除。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
  suspicion: 风险未稳定消除即标注退出的“提前消险”
  regulation: "[\n  {\n    \"法规名称\": \"关于健全防止返贫动态监测和帮扶机制的指导意见\",\n    \"法规文号\": \"中农发〔2021〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"三（三）\",\n    \"内容概述\": \"对收入持续稳定、‘两不愁三保障’和饮水安全持续巩固、返贫致贫风险稳定消除的监测对象，标注‘风险消除’，不再按监测对象进行帮扶。对整户无劳动能力的监测对象，原则上暂不标注风险消除，长期跟踪监测。\"\
    \n  }\n]"
- expression: (方案中明确要求覆盖中小散户 && 实际改造中小散户数量 / 计划改造中小散户数量 < 0.8) || (畜禽粪污综合利用率 < 75% && 项目已验收合格)
  description: 方案覆盖中小散户但实际改造完成率低于80%为可疑；全县综合利用率未达到国家整县推进最低目标75%，项目仍通过验收则可能存在验收不实风险。
  audit_item: 项目实施不到位
  suspicion: 整县推进目标未覆盖中小散户
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加快推进畜禽养殖废弃物资源化利用的意见\",\n    \"法规文号\": \"国办发〔2017〕48号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、（四）\",\n    \"内容概述\": \"以畜牧大县和规模养殖场为重点，整县推进畜禽养殖废弃物资源化利用，确保到2020年全国畜禽粪污综合利用率达到75%以上。\"\n  },\n  {\n\
    \    \"法规名称\": \"畜禽规模养殖污染防治条例\",\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十条\",\n    \"\
    内容概述"
- expression: (签约种植主体数量 / 应配套种植主体总数量 < 0.8) || (实际粪肥使用量 / 协议约定量 < 0.6) || (粪污直排事件次数 > 0 && 协议约定消纳量充足)
  description: 种养循环协议签订覆盖率低于80%为可疑；协议履约率低于60%说明机制运行失效；若存在粪污直排投诉且协议消纳能力足够，指向协议执行流于形式。
  audit_item: 项目实施不到位
  suspicion: 种养循环粪肥消纳协议未全覆盖
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加快推进畜禽养殖废弃物资源化利用的意见\",\n    \"法规文号\": \"国办发〔2017〕48号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、（六）\",\n    \"内容概述\": \"构建种养循环发展机制，推动建立畜禽粪污等农业有机废弃物收集、转化、利用网络体系，鼓励在养殖密集区域建立粪污集中处理中心，探索规模化、专业化、社会化运营机制。\"\
