name: audit/数据表格类/决算报表
type: model
description: 从数据表格类类文档（决算报表）中提取结构化元数据。涵盖字段如：上年支出数、公务接待费决算支出金额、公务接待费决算数、变动率、各单位合计决算数、各款级科目支出数、实际支出金额、执行数。文档范围包括：上年度决算报表、公务用车购置及运行费预决算报表、年度决算报表、年度财务决算报表、年度预决算报表、部门/单位年度预决算报表、部门决算报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 决算
- 明细
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 决算报表
  member_count: 1
  member_details:
  - 上年度决算报表
  - 公务用车购置及运行费预决算报表
  - 年度决算报表
  - 年度财务决算报表
  - 年度预决算报表
  - 部门/单位年度预决算报表
  - 部门决算报表
output:
  fields:
  - name: 上年支出数
    type: number
    description: 提取 上年支出数 的数值（含单位，如万元、吨等）
  - name: 公务接待费决算支出金额
    type: number
    description: 提取 公务接待费决算支出金额 的数值（含单位，如万元、吨等）
  - name: 公务接待费决算数
    type: number
    description: 提取 公务接待费决算数 的数值（含单位，如万元、吨等）
  - name: 变动率
    type: string
    description: 提取 变动率 的文本值
  - name: 各单位合计决算数
    type: number
    description: 提取 各单位合计决算数 的数值（含单位，如万元、吨等）
  - name: 各款级科目支出数
    type: number
    description: 提取 各款级科目支出数 的数值（含单位，如万元、吨等）
  - name: 实际支出金额
    type: number
    description: 提取 实际支出金额 的数值（含单位，如万元、吨等）
  - name: 执行数
    type: string
    description: 提取 执行数 的文本值
  - name: 支出功能分类科目
    type: number
    description: 提取 支出功能分类科目 的数值（含单位，如万元、吨等）
  - name: 支出金额
    type: number
    description: 提取 支出金额 的数值（含单位，如万元、吨等）
  - name: 收入金额
    type: number
    description: 提取 收入金额 的数值（含单位，如万元、吨等）
  - name: 本年支出数
    type: number
    description: 提取 本年支出数 的数值（含单位，如万元、吨等）
  - name: 购置费决算金额
    type: number
    description: 提取 购置费决算金额 的数值（含单位，如万元、吨等）
  - name: 购置费预算金额
    type: number
    description: 提取 购置费预算金额 的数值（含单位，如万元、吨等）
  - name: 资金来源类别
    type: string
    description: 提取 资金来源类别 的文本值
  - name: 运行费决算金额
    type: number
    description: 提取 运行费决算金额 的数值（含单位，如万元、吨等）
  - name: 运行费预算金额
    type: number
    description: 提取 运行费预算金额 的数值（含单位，如万元、吨等）
  - name: 部门整体支出预算数
    type: number
    description: 提取 部门整体支出预算数 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目支出名称
    type: number
    description: 提取 项目支出名称 的数值（含单位，如万元、吨等）
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 预算项目明细
    type: number
    description: 提取 预算项目明细 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (财务凭证.发票金额 / 财务凭证.用餐人数 > 公务接待管理制度.人均餐费标准) || (财务凭证.用餐人数 > 公务接待管理制度.陪餐人数上限) || ((财务凭证.菜单明细 LIKE '%烟%' OR 财务凭证.菜单明细
    LIKE '%酒%' OR 财务凭证.发票内容 LIKE '%烟%' OR 财务凭证.发票内容 LIKE '%酒%') AND 公务接待管理制度.是否禁烟酒 = '是') || (财务凭证.接待事由 IS NULL OR 财务凭证.接待事由
    NOT LIKE '%公务%')
  description: 人均消费超出标准、陪餐人数违规、违规消费烟酒、接待事由非公务，任一条件触发即视为违规。人均标准以单位制度和地方规定中较严者为准。
  audit_item: 公务接待费预算执行不合规
  suspicion: 公务接待费超标准或超范围支出
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"行业规范\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"接待对象按照规定标准自行用餐，确需安排工作餐的，应严格控制陪餐人数，接待对象10人以内的，陪餐人数不得超过3人；超过10人的，不得超过接待对象人数的三分之一。工作餐应当供应家常菜，不得提供高档菜肴和香烟、高档酒水。\"\
    \n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\""
- expression: ((会议费用明细表.摘要 包含 “餐费” OR 会议费用明细表.摘要 包含 “住宿”) OR (培训费用明细表.摘要 包含 “餐费” OR 培训费用明细表.摘要 包含 “住宿”)) && (会议培训支撑材料.签到表
    IS NULL OR 会议培训支撑材料.签到表 = '' OR 会议培训支撑材料.照片 IS NULL OR 会议培训支撑材料.照片 = '' OR 培训活动预决算文件.议程 IS NULL OR 培训活动预决算文件.议程 = '')
    && ((会议费用明细表.餐饮支出 / 会议费用明细表.实际总支出金额 > 0.5 OR 培训费用明细表.餐饮支出 / 培训费用明细表.金额 > 0
  description: 会议或培训中餐饮住宿支出占比过高且缺乏实质性活动佐证，强烈暗示接待费伪装记入。餐饮占比超过50%或人均支出畸高触发异常。
  audit_item: 公务接待费预算执行不合规
  suspicion: 在其他科目隐匿列支公务接待费
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当加强对预算支出的管理，不得擅自改变预算支出的用途。\"\n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n   \
    \ \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条、第二十条\",\n    \"内容概述\": \"严禁以培训、会议等名义变相公款消费，不得在会议费中列支"
- expression: (填报说明文本.必填章节清单 < 必填章节清单.必填章节清单) || (决算报表.变动率 > 0.2 AND 填报说明文本.特殊事项解释阈值规则 = '该支出项变动说明为空')
  description: 规范性判定依据两点：一是填报说明的结构完整性，若缺失模板规定的任意必填章节（如“重大事项说明”“主要指标变动说明”等），视为不规范；二是关键数据变动的解释充分性，当决算报表中任一支出科目的变动率超过20%（即ABS(本年支出-上年支出)/上年支出
    > 0.2）时，对应的填报说明中必须包含具体的变动原因说明，否则即为不规范。两项条件满足其一即触发疑点。
  audit_item: 决算报告编报事项不准确
  suspicion: 决算填报说明编报不符合规范性要求
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"部门决算报表应当根据完整、核对无误的账簿记录和其他有关会计核算资料编制，做到数据真实准确、内容完整……部门决算填报说明应当按照财政部门规定的格式和要求编制，如实反映预算执行情况、财务管理状况和决算编制中需要说明的事项。\"\
    \n  }\n]"
- expression: 预算单位、公务接待费预算金额.公务接待费预算金额 > 公务接待费决算支出金额.公务接待费决算支出金额 * (1 - 规定压缩比例或上限标准.规定压缩比例或上限标准)
  description: 假设地方政府规定压缩比例为10%，则表达式为：本年度预算金额 > 上年度决算支出 * 0.9。若实际压缩比例不同，须替换对应数值。计算结果成立且单位未能提供合规预算调整审批文件及正当理由，则确认为未按规定压缩预算。
  audit_item: 未按规定编制公务接待费预算
  suspicion: 未按规定压缩公务接待费预算
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第十一条\",\n    \"内容概述\": \"县级以上人民政府应当将公务接待费纳入预算管理，严格控制公务接待费支出，按规定压缩。\"\n  },\n  {\n    \"法规名称\": \"地方政府或上级部门关于公务接待费的管理规定\"\
    ,\n    \"法规文号\": \"无（依据具体地方文件）\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"相关压缩比例条款\",\n    \"内容概述\": \"明确年度公务接待费预算在上"
- expression: ABS(决算报表.运行费决算金额 - 报销凭证.维修费、保险费合计)/报销凭证.维修费、保险费合计 > 0.1 || ABS(决算报表.购置费决算金额 - 报销凭证.实际购置发票金额)/报销凭证.实际购置发票金额 >
    0.1
  description: 决算数据与实际支出凭证汇总金额偏差率超过10%，判定为预决算编制不实。如虚报燃油费、低报购置费等情形均可能触发此条件。偏差率可根据行业审计标准调整，严重违规阈值可设为30%。
  audit_item: 未按规定编制和执行公务用车购置和运行费预算
  suspicion: 公务用车购置及运行费预决算编制不实
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第十二号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当根据预算科目和项目，按照政府收支分类科目细化编制预算，不得虚列支出、隐瞒收入。\"\n  },\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\"\
    ,\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"党政机关应当加强公务用车经费预算管理"
- expression: 明细表.费用类型 IN ('车辆租赁费','保险费','维修费','年检费') AND 明细表.金额>0 AND 决算报表.购置费预算金额=0
  description: 费用明细表中实际发生且金额大于零的费用项目，但在预算报表中相应科目预算为零或未列示，即判定为该费用未纳入预算编制，属于预算编制不完整。
  audit_item: 未按规定编制和执行公务用车购置和运行费预算
  suspicion: 公务用车购置及运行费预算编制不完整
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第十二号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当根据预算科目和项目，按照政府收支分类科目细化编制预算，所有收支必须完整列入预算，不得少列、不列。\"\n  },\n  {\n    \"法规名称\": \"\
    党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"党政机关应将公务用"
- expression: (年度预算项目清单及自评状态标记表.自评状态 = '未自评' || 年度预算项目清单及自评状态标记表.自评状态 = NULL) && 年度预算项目清单及自评状态标记表.项目金额 > 0 && (未开展自评项目清单及原因说明表.未自评原因
    NOT IN ('制度规定可豁免', '项目未执行', '资金未拨付') || 未开展自评项目清单及原因说明表.项目名称 IS NULL)
  description: 筛选自评状态为空或标记为未自评且有实际资金支出的项目，排除因制度规定可豁免、项目未执行、资金未拨付等合理原因未自评的情况。若未自评项目清单缺失或无正当理由说明，则判定为完全未开展自评违规。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 完全未开展项目绩效自评
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条、第七条\",\n    \"内容概述\": \"各部门、各单位应对所有项目支出开展绩效自评，确保自评全覆盖；绩效自评由项目实施单位负责，对预算批复的项目绩效目标完成情况进行自我评价。\"\n  }\n]"
- expression: 年度预算项目清单及自评状态标记表.自评状态 = '未自评' && 年度预算项目清单及自评状态标记表.项目金额 > 0 && 年度预决算报表.实际支出金额 > 0 && 年度预算项目清单及自评状态标记表.项目名称 NOT
    IN (SELECT 项目名称 FROM 绩效自评报告及支撑材料) && (绩效自评覆盖率统计表.项目数量覆盖率 < 100% || 绩效自评覆盖率统计表.金额覆盖率 < 100%)
  description: 将预算项目清单与自评报告项目清单进行比对，找出有实际支出但未自评的项目，并计算项目数量和金额覆盖率。当覆盖率未达到100%且无制度豁免时，即存在选择性自评。重点关注金额大、问题多的项目被故意遗漏的情形。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 选择性开展绩效自评
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"各部门、各单位应对所有项目支出实施绩效自评，确保自评全覆盖。\"\n  },\n  {\n    \"法规名称\": \"关于贯彻落实《中共中央 国务院关于全面实施预算绩效管理的意见》的通知\"\
    ,\n    \"法规文号\": \"财预〔2018〕167号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二部分第（三）项\",\n    \"内容概述\": \"硬化绩效责任约束，部门整"
- expression: (年度预决算报表.资金来源类别 = '中央转移支付' OR 年度预决算报表.资金来源类别 = '省级专项补助') && 年度预决算报表.支出金额 > 0 && 年度预决算报表.项目名称 NOT IN (SELECT
    项目名称 FROM 绩效自评报告及支撑材料) && 上级转移支付指标文件.要求自评 = '是'
  description: 筛选资金来源为上级转移支付且已形成支出的项目，检查其是否包含在自评报告项目清单中。若上级资金管理办法明确要求自评而单位未对其自评，则构成违规。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 未对转移支付资金开展绩效自评
  regulation: "[\n  {\n    \"法规名称\": \"中央对地方专项转移支付管理办法\",\n    \"法规文号\": \"财预〔2015〕230号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"地方各级财政部门应当会同有关部门对本级使用的专项转移支付资金的绩效进行自评，并将自评报告报送上级财政部门和主管部门。\"\n  },\n  {\n    \"法规名称\"\
