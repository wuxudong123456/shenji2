name: audit/数据表格类/报名表
type: model
description: 从数据表格类类文档（报名表）中提取结构化元数据。涵盖字段如：学校属地类型、所在学校、报名教师姓名、报名项目。文档范围包括：培训报名表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 报名表
  member_count: 1
  member_details:
  - 培训报名表
output:
  fields:
  - name: 学校属地类型
    type: string
    description: 提取 学校属地类型 的文本值
  - name: 所在学校
    type: string
    description: 提取 所在学校 的文本值
  - name: 报名教师姓名
    type: string
    description: 提取 报名教师姓名 的文本值
  - name: 报名项目
    type: string
    description: 提取 报名项目 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (培训通知.培训项目面向对象要求 = '乡村教师' AND 近三年国培计划参训教师名单（含学校属地标识）.参训项目名称 = 培训通知.培训内容 AND 近三年国培计划参训教师名单（含学校属地标识）.学校属地类型 =
    '城区') OR (培训报名表.学校属地类型 = '乡村' AND 近三年国培计划参训教师名单（含学校属地标识）.学校属地类型 = '城区' AND 培训报名表.报名教师姓名 = 近三年国培计划参训教师名单（含学校属地标识）.教师姓名)
  description: 培训项目明确规定仅限乡村教师参加，但实际参训人员中出现城区教师，或报名时显示乡村教师但实际参训人是城区教师，构成挤占。两个条件满足任一即判定违规。
  audit_item: 乡村教师技能培训不符合要求
  suspicion: 城区学校教师挤占乡村教师培训名额
  regulation: "[\n  {\n    \"法规名称\": \"教育部关于深化中小学教师培训模式改革全面提升培训质量的指导意见\",\n    \"法规文号\": \"教师〔2013〕6号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"十二、加强培训对象遴选\",\n    \"内容概述\": \"严格培训对象遴选，杜绝‘关系’培训、‘人情’培训，确保最需要的教师获得培训机会，防止培训名额被挤占。\"\n  },\n\
    \  {\n    \"法规名称\": \"国务院办公厅关于印发乡村教师支持计划（2015—2020年）的通知\",\n    \"法规文号\": \"国办发〔2015〕43号\",\n    \"效力级别\": \"行政法规\",\n\
    \ "
