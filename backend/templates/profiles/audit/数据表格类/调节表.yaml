name: audit/数据表格类/调节表
type: model
description: 从数据表格类类文档（调节表）中提取结构化元数据。涵盖字段如：付款记录、企业调节后余额、对方账户信息、对方账户名及账号、对账单余额、收款人账号及户名、收款记录、收款账户。文档范围包括：余额调节表、银行余额调节表、银行存款余额调节表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 付款
- 采购
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 调节表
  member_count: 1
  member_details:
  - 余额调节表
  - 银行余额调节表
  - 银行存款余额调节表
output:
  fields:
  - name: 付款记录
    type: number
    description: 提取 付款记录 的数值（含单位，如万元、吨等）
  - name: 企业调节后余额
    type: number
    description: 提取 企业调节后余额 的数值（含单位，如万元、吨等）
  - name: 对方账户信息
    type: string
    description: 提取 对方账户信息 的文本值
  - name: 对方账户名及账号
    type: string
    description: 提取 对方账户名及账号 的文本值
  - name: 对账单余额
    type: number
    description: 提取 对账单余额 的数值（含单位，如万元、吨等）
  - name: 收款人账号及户名
    type: number
    description: 提取 收款人账号及户名 的数值（含单位，如万元、吨等）
  - name: 收款记录
    type: number
    description: 提取 收款记录 的数值（含单位，如万元、吨等）
  - name: 收款账户
    type: number
    description: 提取 收款账户 的数值（含单位，如万元、吨等）
  - name: 未达账项
    type: string
    description: 提取 未达账项 的文本值
  - name: 设备采购付款记录
    type: number
    description: 提取 设备采购付款记录 的数值（含单位，如万元、吨等）
  - name: 调节后余额
    type: number
    description: 提取 调节后余额 的数值（含单位，如万元、吨等）
  - name: 账面余额
    type: number
    description: 提取 账面余额 的数值（含单位，如万元、吨等）
  - name: 转账记录
    type: string
    description: 提取 转账记录 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 银行对账单余额
    type: number
    description: 提取 银行对账单余额 的数值（含单位，如万元、吨等）
  - name: 银行调节后余额
    type: number
    description: 提取 银行调节后余额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 调节表.企业调节后余额 != 调节表.银行调节后余额
  description: 编制银行余额调节表后，若企业调整后余额与银行调整后余额不相等，说明存在记账差错、未达账项不实或挪用资金等情况，即为账实不符疑点。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 银行存款日记账与银行对账单调节后余额不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证会计账簿记录与实物及款项的实有数额相符。\"\n  }\n]"
- expression: (专项资金预算批复.未分配金额 > 0 && 专项资金结余结转情况说明.结余金额 / 专项资金预算批复.预算批复总额 > 0.2 && 相关资金审批记录.结余分配讨论记录 == '' ) || (专项资金收入支出明细表.累计结余
    > 0 && ABS(银行存款余额调节表.账面余额 - 银行对账单.专户期末余额) == 0 && 专项资金结余结转情况说明.后续分配计划 == '' )
  description: 该表达式综合判定资金结余闲置。条件一：未分配金额大于0，且结余占预算总额比例超过20%，且无任何资金统筹分配的会议讨论记录，表明管理缺位导致闲置。条件二：账面存在累计结余，且银行账户余额与账面一致（资金真实沉淀），但无后续分配计划说明，直接判定为闲置。满足任一条件即触发疑点。
  audit_item: 专项资金长期闲置未发挥效益
  suspicion: 专项资金结余未分配使用形成闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十二条\",\n    \"内容概述\": \"各级政府上一年预算的结转资金，应当在下一年用于结转项目的支出；连续两年未用完的结转资金，应当作为结余资金管理。各部门、各单位上一年预算的结转、结余资金按照财政部的规定办理。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步加强地方财政结余结转资金管理的通知\",\n    \"法规文号\": \"财预〔2013〕372号\",\n    \"效力级别\": \"部门规章\",\n    "
