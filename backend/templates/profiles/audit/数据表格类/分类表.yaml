name: audit/数据表格类/分类表
type: model
description: 从数据表格类类文档（分类表）中提取结构化元数据。涵盖字段如：土地出让收入总额、币种、年度、报销金额、支出子科目名称、特殊审批痕迹、用于农业农村支出总额、科目名称。文档范围包括：土地出让收入支出明细分类表、对外投资风险评级分类表、费用明细分类表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 审批
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 分类表
  member_count: 1
  member_details:
  - 土地出让收入支出明细分类表
  - 对外投资风险评级分类表
  - 费用明细分类表
output:
  fields:
  - name: 土地出让收入总额
    type: number
    description: 提取 土地出让收入总额 的数值（含单位，如万元、吨等）
  - name: 币种
    type: string
    description: 提取 币种 的文本值
  - name: 年度
    type: date
    description: 提取 年度 的日期值，格式 YYYY-MM-DD
  - name: 报销金额
    type: number
    description: 提取 报销金额 的数值（含单位，如万元、吨等）
  - name: 支出子科目名称
    type: number
    description: 提取 支出子科目名称 的数值（含单位，如万元、吨等）
  - name: 特殊审批痕迹
    type: string
    description: 提取 特殊审批痕迹 的文本值
  - name: 用于农业农村支出总额
    type: number
    description: 提取 用于农业农村支出总额 的数值（含单位，如万元、吨等）
  - name: 科目名称
    type: string
    description: 提取 科目名称 的文本值
  - name: 费用类别
    type: number
    description: 提取 费用类别 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 项目风险等级
    type: string
    description: 提取 项目风险等级 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 对比表.预算金额 IS NULL AND 对比表.实际支出金额 > 0) OR (对比表.实际支出金额 > 对比表.预算金额)
  description: 无预算：存在实际支出但预算批复文件中无对应任务且无预算金额；超预算：同一任务下实际支出合计大于批复预算金额。两者均构成违规。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 无预算或超预算支出因公出国（境）费
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第四条\",\n    \"内容概述\": \"各单位应强化预算约束，严格控制因公临时出国经费，在核定的预算内统筹安排，不得无预算或超预算安排出访团组。\"\n  }\n]"
- expression: (分类表.费用类别（住宿、交通、伙食补助等） = '住宿' AND 分类表.报销金额 > 管理制度.住宿费标准上限（按国家/地区）) OR (分类表.费用类别（住宿、交通、伙食补助等） = '交通' AND 分类表.舱位等级
    > 管理制度.交通工具等级标准) OR (分类表.费用类别（住宿、交通、伙食补助等） = '伙食补助' AND 分类表.报销金额 > 管理制度.伙食补助标准 * 其他.停留天数)
  description: 住宿费、伙食补助等根据出访国家/地区按规定标准上限比对，超出即违规；交通工具舱位等级需符合规定（如厅局级以下人员乘坐经济舱），超出即违规。外币金额需按报销当日汇率折算后与标准比较。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 超标准列支因公出国（境）费用
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条、第八条、第九条\",\n    \"内容概述\": \"住宿费、伙食费、公杂费等支出均按国家规定标准执行，严禁超标准安排住宿和乘坐交通工具，各职级人员乘坐交通工具等级有严格限定。\"\n  }\n]"
- expression: 项目明细表.计划内外标识 = '计划外' && 项目明细表.项目名称 NOT IN (批准项目清单.批准项目清单)
  description: 筛选标记为计划外且无法在董事会或股东会审批文件中找到对应批准记录的投资项目。若对外投资项目明细表中无计划内外标识，则比对项目决策日期是否早于审批日期，或投资金额超出制度规定的审批权限而未见相应层级审批文件。
  audit_item: 投融资管理方面存在的问题
  suspicion: 未经批准在投资计划外开展对外投资
  regulation: "[\n  {\n    \"法规名称\": \"中央企业投资监督管理办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第34号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第15条\",\n    \"内容概述\": \"中央企业应当编制年度投资计划，纳入预算管理，并按照规定报送国资委。未经国资委批准，企业不得在年度投资计划外安排新增投资项目。\"\n  }\n]"
- expression: (SUM_AR / SUM_LR) < 0.05 && (SUM_GB / SUM_AR) < 0.5
  description: 计算连续年份土地出让收入用于农业农村的总支出（SUM_AR）占土地出让总收入（SUM_LR）的比例。若小于5%的法定或政策红线，则触发一级预警。进一步，在已投入农业农村的资金中，计算明确用于高标准农田建设的资金（SUM_GB）占农业农村总支出（SUM_AR）的比例，若低于50%的审计预设合理阈值，则表明高标准农田建设未获得重点保障。
  audit_item: 高标农田建设资金保障不到位
  suspicion: 土地出让收入用于高标准农田建设比例过低
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于实施乡村振兴战略的意见\",\n    \"法规文号\": \"中发〔2018〕1号\",\n    \"效力级别\": \"法律\",\n  \
    \  \"条款号\": \"第八条第（一）款\",\n    \"内容概述\": \"调整完善土地出让收入使用范围，进一步提高农业农村投入比例。\"\n  },\n  {\n    \"法规名称\": \"关于调整完善土地出让收入使用范围优先支持乡村振兴的意见\"\
    ,\n    \"法规文号\": \"中办发〔2020〕9号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"到“十四五”期末，以省为单位核算"
