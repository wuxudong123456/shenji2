    description: 提取 倾倒频率 的文本值
  - name: 关于卫生清洁方面的投诉内容及时间
    type: date
    description: 提取 关于卫生清洁方面的投诉内容及时间 的日期值，格式 YYYY-MM-DD
  - name: 农户编号
    type: string
    description: 提取 农户编号 的文本值
  - name: 办卡是否交费
    type: number
    description: 提取 办卡是否交费 的数值（含单位，如万元、吨等）
  - name: 受访老人
    type: string
    description: 提取 受访老人 的文本值
  - name: 变更日期
