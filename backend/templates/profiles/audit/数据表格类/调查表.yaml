name: audit/数据表格类/调查表
type: model
description: 从数据表格类类文档（调查表）中提取结构化元数据。涵盖字段如：交费金额、倾倒频率、关于卫生清洁方面的投诉内容及时间、农户编号、办卡是否交费、受访老人、变更日期、图斑坐标。文档范围包括：企业/农户政策受益情况调查表、入住老人满意度调查表、农户补贴领取情况抽样调查表、土地利用现状变更调查表、家庭经济状况调查表、户厕使用情况调查表、治理效果群众满意度调查表、满意度调查表、燃煤比例调查表、适应性调查表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 补贴
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 调查表
  member_count: 1
  member_details:
  - 企业/农户政策受益情况调查表
  - 入住老人满意度调查表
  - 农户补贴领取情况抽样调查表
  - 土地利用现状变更调查表
  - 家庭经济状况调查表
  - 户厕使用情况调查表
  - 治理效果群众满意度调查表
  - 满意度调查表
  - 燃煤比例调查表
  - 适应性调查表
