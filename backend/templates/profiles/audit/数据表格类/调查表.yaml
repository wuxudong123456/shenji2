violations:
- expression: (消毒登记台账.消毒日期 / 管理制度.规定消毒频次（如公共区域每日≥2次）) < 0.8
  description: 应消毒次数依据机构依法建立的卫生制度确定，如规定公共活动区域每日消毒不少于2次，房间每周不少于3次等。月度消毒执行率低于80%即视为未定期消毒清洗；若同期出现感染事件或第三方检测不合格，则风险等级上调。
  audit_item: 农村养老服务政策实施不规范、建设质量不达标
  suspicion: 养老机构未按规定对场所物品进行消毒清洗
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十条\",\n    \"内容概述\": \"养老机构应当建立卫生消毒制度，定期对老年人活动、生活场所和物品进行消毒和清洗，防止疾病传播。\"\n  }\n]"
- expression: (核查表.是否公示 = '否') || (入住合同.约定收费项目 NOT IN (管理制度.允许收费项目)) || (ABS(入住合同.各项收费标准 - 管理制度.对应收费标准上限) > 0 且 无超标准审批文件)
    || (调查表.收费投诉内容 >= 1 && 投诉内容涉及隐藏收费或标准不符)
  description: 条件一：公示核查表记录为未公示即触发；条件二：合同约定收费项目超出制度允许范围；条件三：实际收费金额超过制度上限且无特批文件；条件四：老人满意度调查中反馈收费与公示不一致。任一条件成立即为疑点。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 农村养老机构收费项目及标准未公示
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十九条\",\n    \"内容概述\": \"养老机构应当公示服务项目收费标准和依据，接受社会监督。不得以任何名义收取公示以外的费用。\"\n  }\n]"
- expression: (农村适应性分析专章.农民习惯调研内容 = '') || (投放时间合理性评分.总体满意度 < 60) || (智能设备日均扫码次数.智能设备日均扫码次数 < 10)
  description: 可行性研究未考虑农村实际，或村民满意度平均分低于60分，或智能设备日均使用次数低于10人次，表明处理模式脱离农民习惯，难以推行。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 分类处理模式照搬城市不符合农村实际
  regulation: "[\n  {\n    \"法规名称\": \"《农村人居环境整治提升五年行动方案（2021－2025年）》\",\n    \"法规文号\": \"厅字〔2021〕44号\",\n    \"效力级别\": \"\
    制度文件\",\n    \"条款号\": \"第二部分第（四）条\",\n    \"内容概述\": \"推进农村生活垃圾分类减量与利用，要因地制宜，结合农村特点和农民习惯，分类施策，不搞“一刀切”。\"\n  }\n]"
- expression: (操作规范文件缺失) || (灰土收集重量.灰土收集重量 < 理论产生量 * 0.3) || (冬季垃圾清运量中灰土占比估算 > 20% && 无灰土单独收集台账)
  description: 未制定灰土单独收集规范，或灰土收集率低于理论产生量的30%，或冬季垃圾中灰土占比明显偏高（>20%）却无单独收集记录，均表明灰土未有效分类。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 燃煤地区灰土未单独分类收集
  regulation: "[\n  {\n    \"法规名称\": \"《农村生活垃圾治理导则》\",\n    \"法规文号\": \"建村〔2018〕101号\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"第4.3.2条\",\n    \"内容概述\": \"在北方以燃煤为主要能源的地区，灰土应实行单独收集，就地就近资源化利用，不得混入生活垃圾。\"\n  }\n]"
- expression: 清淤量、堆放地点坐标、处置方式、接收处置单位.堆放地点坐标 == NULL || 清淤量、堆放地点坐标、处置方式、接收处置单位.处置方式 LIKE '%简易堆放%' || (合同签订日期、合同约定工期、合同条款中的底泥处置规范
    LIKE '%合规处置%' && 清淤量、堆放地点坐标、处置方式、接收处置单位.接收处置单位 == NULL)
  description: 台账内无明确的处置去向坐标，或处置方式为简单堆弃，或合同虽要求规范处置但台账无正规接收单位，表明底泥被随意倾倒或堆放于非指定场所，触发二次污染风险预警。
  audit_item: 农村生活污水治理不符合相关规定
  suspicion: 清淤底泥未规范处置造成二次污染
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"主席令第58号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"产生、收集、贮存、运输、利用、处置固体废物的单位，应当采取防扬散、防流失、防渗漏等措施，严禁擅自倾倒、堆放。\"\n  },\n  {\n    \"法规名称\": \"河湖生态缓冲带保护修复技术指南\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第六章\",\n    \"内容概述\": \"清淤底泥需科学处置，经检测属于污染底泥的应运至"
- expression: (巡查表.巡查日期 IS NULL && DATEDIFF(TODAY(), 治理工程立项审批及验收报告.竣工验收日期) > 365) || (管护责任主体、巡检频次要求.维修记录 IS NULL && 调查表.设施停运投诉
    > 3) || (明细表.支出进度 < 30%)
  description: 已竣工超一年的污水处理设施无任何巡检记录，或群众已累计多次投诉停运但运维台账无维修响应，以及年度运维资金支出极低截留闲置，共同指向管护严重缺失，存在“晒太阳工程”风险。
  audit_item: 农村生活污水治理不符合相关规定
  suspicion: 农村黑臭水体治理工程管护不到位
  regulation: "[\n  {\n    \"法规名称\": \"农村生活污水处理设施运行维护管理办法\",\n    \"法规文号\": \"环办土壤函〔2020〕533号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第七条、第十条\",\n    \"内容概述\": \"各地要明确运维主体，建立运维台账和巡检制度，保障运维资金，确保农村污水处理设施正常运行，严禁闲置。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于推进农村黑臭水体治理工作的指导意见\",\n    \"法规文号\": \"环办土壤〔2019〕586号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"\
    内容概述\":"
- expression: (调查表.是否倾倒生活污水 == "是") || (记录表.疏通原因 LIKE "%油污%" || 记录表.疏通原因 LIKE "%杂物%" ) || (处理台账.化粪池内容物状态描述 LIKE "%非粪污杂质%")
  description: 判定条件：1.农户调查表中明确反馈将生活污水倒入厕所；2.维护记录显示因油污、杂物等非粪污原因导致堵塞；3.清掏台账反映化粪池内含大量非粪污杂质。三者任一满足即存在混排行为。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 向水冲式厕所倾倒生活污水
  regulation: "[\n  {\n    \"法规名称\": \"农村户厕卫生规范\",\n    \"法规文号\": \"GB 19379-2012\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"4.2.2\",\n    \"内容概述\": \"水冲式厕所的排水系统不得接纳生活污水和其他废水，防止化粪池超负荷及污染。\"\n  }\n]"
- expression: (处理台账.清掏间隔天数 > 利用方案.规定清掏频率 * 1.5) || (调查表.清掏服务是否及时 == "否" && 调查表.粪污倾倒地点 != "指定处理站") || (处理台账.粪污去向 != "集中处理站"
    && 处理台账.粪污去向 != "资源化利用点")
  description: 判定条件：1.台账显示实际清掏间隔超过制度规定最大间隔的1.5倍；2.农户反映清掏不及时且随意倾倒至非指定地点；3.台账记录粪污去向非规定集中处理站点。满足任一组合触发疑点。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 户厕粪污清掏不及时且随意倾倒
  regulation: "[\n  {\n    \"法规名称\": \"关于推进农村“厕所革命”专项行动的指导意见\",\n    \"法规文号\": \"农社发〔2018〕2号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"建立健全粪污收集处理体系，严禁随意倾倒粪渣粪液，确保粪污无害化处理和资源化利用。\"\n  }\n]"
- expression: (第三方抽测数据.粪大肠菌群值 > 10^-4 || 第三方抽测数据.寄生虫卵沉降率 < 95%) || (调查表.是否使用未处理粪污 == "是" && 处理台账.无害化处理标识 == "未经处理") || (技术规范文件.发酵停留时间要求
    > 处理台账.接收量)
  description: 判定条件：1.检测报告显示粪大肠菌群值大于10^-4或寄生虫卵沉降率低于95%，不满足无害化标准；2.调查表中农户反馈直接使用未处理粪污且台账记录印证其未经过处理；3.实际发酵时间短于规范要求。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 未经无害化处理粪污直接浇灌农作物
  regulation: "[\n  {\n    \"法规名称\": \"粪便无害化卫生要求\",\n    \"法规文号\": \"GB 7959-2012\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\"\
    : \"4.1\",\n    \"内容概述\": \"用于农业的粪便必须经无害化处理，粪大肠菌群值≤10^-4，寄生虫卵沉降率≥95%，不得检出活虫卵和致病菌。\"\n  }\n]"
- expression: (明细表.实际到位金额/预算文件.预算金额 < 0.8) || (拨付延迟天数 > 90) || (挪用金额 > 0) || (ABS(对比表.实际完成值-对比表.绩效目标值)/对比表.绩效目标值 > 0.3)
  description: 财政资金实际到位率低于预算的80%，或资金拨付周期（从预算下达至到账）超过90天，或支出明细与预算项目不匹配存在挪用，或主要绩效指标偏差率超过30%，以上任一条件触发即判定财政扶持政策未落实，资金使用合规性或效果存在突出问题。
  audit_item: 现代农业产业园（集群、强镇）政策扶持不到位
