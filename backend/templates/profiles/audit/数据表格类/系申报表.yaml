name: audit/数据表格类/系申报表
type: model
description: 从数据表格类类文档（系申报表）中提取结构化元数据。涵盖字段如：与领导人员关系、亲属姓名、关联企业、关联企业名称、姓名、特定关系人企业名称、特定关系人姓名、特定关系人姓名及其关联企业。文档范围包括：己方亲属关系申报表、领导人员亲属关系申报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 系申报表
  member_count: 1
  member_details:
  - 己方亲属关系申报表
  - 领导人员亲属关系申报表
output:
  fields:
  - name: 与领导人员关系
    type: string
    description: 提取 与领导人员关系 的文本值
  - name: 亲属姓名
    type: string
    description: 提取 亲属姓名 的文本值
  - name: 关联企业
    type: string
    description: 提取 关联企业 的文本值
  - name: 关联企业名称
    type: string
    description: 提取 关联企业名称 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 特定关系人企业名称
    type: string
    description: 提取 特定关系人企业名称 的文本值
  - name: 特定关系人姓名
    type: string
    description: 提取 特定关系人姓名 的文本值
  - name: 特定关系人姓名及其关联企业
    type: string
    description: 提取 特定关系人姓名及其关联企业 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (亲属投资入股企业清单.投资企业名称 IN (供应商/客户名录.企业名称)) && (明细表.交易对手方 == 亲属投资入股企业清单.投资企业名称) && (明细表.交易金额 > 5000000 || ABS(明细表.单价-明细表.同期其他供应商报价)/明细表.同期其他供应商报价
    > 0.1)
  description: 筛查领导人员亲属投资入股企业与本单位发生业务往来的情况，当累计交易金额超过500万元或单笔交易价格偏离市场价10%以上时触发预警。阈值可根据企业规模及行业水平调整。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 特定关系人在关联企业或业务往来企业投资入股
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第一项\",\n    \"内容概述\": \"国有企业领导人员不得在本企业的关联企业、与本企业有业务关系的企业投资入股。\"\n  }\n]"
- expression: (承租方/承包人名称、租赁单价、租赁期限、决策方式.承租方/承包人名称 IN (姓名、身份证号、与领导人员关系、特定关系人姓名、特定关系人姓名及其关联企业、特定关系人企业名称、亲属姓名、关联企业名称.特定关系人姓名及其关联企业))
    && (ABS(承租方/承包人名称、租赁单价、租赁期限、决策方式.租赁单价-同期同类资产市场租金或承包费标准.同期同类资产市场租金或承包费标准)/同期同类资产市场租金或承包费标准.同期同类资产市场租金或承包费标准 > 0.3 || 承租方/承包人名称、租赁单价、租赁期限、决策方式.决策方式
    != '公开招租')
  description: 筛查国有资产租赁或承包给领导人员特定关系人且租金明显低于市场价30%以上，或未经过公开招租程序的情况。未进行市场评估或未公开招租直接视为可疑线索。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 国有资产委托租赁承包给特定关系人经营
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第二项\",\n    \"内容概述\": \"不得将国有资产委托、租赁、承包给配偶、子女及其他特定关系人经营。\"\n  }\n]"
- expression: (销售合同.购方名称 IN (系申报表.特定关系人企业名称)) && (审批记录.采购方式 == '单一来源采购' || 审批记录.是否必需) && (明细表.交易价格 > 明细表.同期其他供应商报价 * 1.2)
  description: 筛查领导人员利用职权直接指定特定关系人企业作为供应商且价格显著高于其他供应商（高20%以上），或采购方式不合规的情况。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 利用职权为特定关系人营利性经营活动提供便利
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第三项\",\n    \"内容概述\": \"不得利用职权为配偶、子女及其他特定关系人从事营利性经营活动提供便利条件。\"\n  }\n]"
- expression: (亲属姓名.关联企业 IN (交易记录.交易对手方名称)) && (亲属姓名.关联企业 IN (交易记录.交易对手方名称)) && (合同协议类-销售合同-合同相对方 > 1000000 || 交易记录.付款条件 >
    交易记录.付款条件)
  description: 筛查两家或多家国企领导之间互相照顾对方亲属企业的业务，形成利益互换。以累计采购额100万元或付款条件异常优惠为初步阈值。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 领导人员相互为对方特定关系人提供经营便利
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第四项\",\n    \"内容概述\": \"不得利用职权相互为对方及其配偶、子女和其他特定关系人从事营利性经营活动提供便利条件。\"\n  }\n]"
- expression: (明细表.交易对手方 IN (系申报表.特定关系人企业名称)) && (ABS(合同单价.合同单价-信息.同期同类商品/服务市场价格)/信息.同期同类商品/服务市场价格 > 0.15 || 其他.验收合格率 > 0.1
    || 明细表.付款条件为'预付80%以上' || 账期超过180天)
  description: 筛查与特定关系人企业的交易是否存在价格不公（偏差±15%以上）、质量低劣（不合格率超10%）或付款条件异常（大额预付或超长账期）等问题，任一异常即触发。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 特定关系人企业与本企业发生可能侵害利益的经济业务往来
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第五项\",\n    \"内容概述\": \"不得有本人的配偶、子女及其他特定关系人投资或者经营的企业与本企业或者有出资关系的企业发生可能侵害公共利益、企业利益的经济业务往来。\"\n  }\n]"
- expression: (会议记录.参会人员 IN (应回避人员)) && (会议记录.议题涉及的企业名称 IN (该人员亲属控制企业)) && (会议记录.主动回避记录 == NULL)
  description: 筛查在涉及特定关系人企业的经营决策会议中，相关领导人员未进行回避，直接参与表决或审批。缺乏主动回避记录即为违规。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 未按规定执行任职回避和公务回避
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第六项\",\n    \"内容概述\": \"按照规定应当实行任职回避和公务回避而没有回避。\"\n  }\n]"
