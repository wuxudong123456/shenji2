name: audit/数据表格类/说明表
type: model
description: 从数据表格类类文档（说明表）中提取结构化元数据。涵盖字段如：分配理由、单位名称、原因说明、受益人姓名、变动单位名称、变动类型、变更状态、延迟原因。文档范围包括：单位合并或拆分情况说明表、延迟发放原因说明表、未开展自评项目原因说明表、特殊分配情况说明表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 说明表
  member_count: 1
  member_details:
  - 单位合并或拆分情况说明表
  - 延迟发放原因说明表
  - 未开展自评项目原因说明表
  - 特殊分配情况说明表
output:
  fields:
  - name: 分配理由
    type: string
    description: 提取 分配理由 的文本值
  - name: 单位名称
    type: string
    description: 提取 单位名称 的文本值
  - name: 原因说明
    type: string
    description: 提取 原因说明 的文本值
  - name: 受益人姓名
    type: string
    description: 提取 受益人姓名 的文本值
  - name: 变动单位名称
    type: string
    description: 提取 变动单位名称 的文本值
  - name: 变动类型
    type: string
    description: 提取 变动类型 的文本值
  - name: 变更状态
    type: boolean
    description: 提取 变更状态 的布尔值（是/否）
  - name: 延迟原因
    type: string
    description: 提取 延迟原因 的文本值
  - name: 接收单位
    type: string
    description: 提取 接收单位 的文本值
  - name: 未自评原因
    type: string
    description: 提取 未自评原因 的文本值
  - name: 物资价值
    type: string
    description: 提取 物资价值 的文本值
  - name: 生效日期
    type: date
    description: 提取 生效日期 的日期值，格式 YYYY-MM-DD
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (单位清单.单位编码 NOT IN 单位清单.单位编码) || (说明文件.项目编码 NOT IN 资金清单.项目编码)
  description: 将应编入的单位清单与实际编入的单位清单按单位编码（或统一社会信用代码）进行比对，若存在应编入单位未出现在实际编入清单中，判定为遗漏单位；同理，应编入的资金项目（如专项资金）未出现在实际编入资金清单中，判定为遗漏资金。两者满足任一条件即触发疑点。
  audit_item: 决算报告编报事项不准确
  suspicion: 应纳入决算编报范围的单位或资金遗漏未编入
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"各部门应当按照财政部门的要求，及时向预算单位布置决算编制工作，并督促其准确编制决算。各部门应当将本部门所属各单位全部纳入决算编制范围，认真审核汇总本部门决算，确保数据完整、真实、准确。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第"
- expression: (单位编码、单位名称、单位状态.单位编码 NOT IN 单位编码、单位名称、单位状态.单位编码 AND 单位编码、单位名称、单位状态.单位状态 = '存续') || (项目编码、项目名称、金额、资金来源、资金来源类别.资金来源类别
    NOT IN ('一般公共预算拨款','政府性基金预算拨款','国有资本经营预算拨款'))
  description: 排查两种违规情形：一是单位不在应编报目录中但仍被编入决算（如已撤销单位、非预算单位），用实际单位清单与应编单位清单差集判定，同时排除因机构合并而消失的正常单位；二是将非财政预算资金（如代管社会团体资金、往来款）作为决算资金编报，通过资金来源类别字段识别，只要来源不属于三类法定预算资金即判定为违规编入。
  audit_item: 决算报告编报事项不准确
  suspicion: 将非编报范围单位或资金违规纳入决算编报
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"各部门应当将本部门所属各单位全部纳入决算编制范围，认真审核汇总本部门决算，确保数据完整、真实、准确，不得多报、少报、漏报。\"\n  },\n  {\n    \"法规名称\"\
    : \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十五条\",\n    \"内容概述\": \"\
    编制决算草案，必须符合"
- expression: (单据.受益人姓名 IN (核查表.受益人姓名)) || (分配方案.分配人 == 分配方案.受益人名单) || (说明表.分配理由 == 无正当理由 && 说明表.物资价值 > 设定阈值)
  description: 该表达式用于识别分配环节的优亲厚友行为。首先，将签收单上的受益人姓名与工作人员亲属名单比对，若存在亲属关系则直接触发疑点。其次，若分配人与审批人，或分配人与受益人为同一人，违反了不相容职务分离原则，高度可疑。最后，针对理由牵强的高价值物资特批分配，需重点审查以判断是否存在利益输送。
  audit_item: 社会捐赠款物使用不合规
  suspicion: 违规优亲厚友分配捐赠物资
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"中华人民共和国主席令第43号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十八条\",\n    \"内容概述\": \"慈善组织确定慈善受益人，应当坚持公开、公平、公正的原则，不得指定慈善组织管理人员的利害关系人作为受益人。\"\n  },\n  {\n    \"法规名称\": \"关于规范基金会行为的若干规定（试行）\"\
    ,\n    \"法规文号\": \"民发〔2012〕124号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二部分第（四）项\",\n    \"内容概述\": \"基金会不得"
- expression: (单据.签收单位 ∉ 捐赠协议.指定用途) || (说明表.接收单位 存在 商业合作关系 && 说明表.分配理由 == 无公益性质说明) || (单据.签收单位对捐赠财产进行了销售或收费)
  description: 该表达式用于识别捐赠财产被挪作私用或商业输送。一是签收单位不在捐赠协议约定的受益范围内，属于改变用途。二是向存在商业合作关系的企业分配高价值物资且无合理公益理由，涉嫌利益输送。三是受益单位将本应免费的捐赠物资进行销售或收费，属于变相侵吞。
  audit_item: 社会捐赠款物使用不合规
  suspicion: 违规向相关利益人分配捐赠财产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公益事业捐赠法\",\n    \"法规文号\": \"中华人民共和国主席令第19号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"受赠人应当依照国家有关规定，建立健全财务会计制度，将受赠财产的使用、管理情况及时向社会公开，并接受监督。不得擅自改变捐赠财产的用途。如果确需改变用途的，应当征得捐赠人的同意。\"\
    \n  },\n  {\n    \"法规名称\": \"慈善组织信息公开办法\",\n    \"法规文号\": \"民政部令第61号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、"
