name: audit/数据表格类/关联表
type: model
description: 从数据表格类类文档（关联表）中提取结构化元数据。涵盖字段如：上年度分配金额、上年度绩效评级、上年绩效评分、关联关系、分配决策依据、子项目收款方、实际完成决算日期、拨付金额。文档范围包括：专项资金分配与绩效结果关联表、基建项目竣工决算与结余资金关联表、涉农专项资金分配与绩效评价结果关联表、资金拨付与使用关联表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 决算
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 关联表
  member_count: 1
  member_details:
  - 专项资金分配与绩效结果关联表
  - 基建项目竣工决算与结余资金关联表
  - 涉农专项资金分配与绩效评价结果关联表
  - 资金拨付与使用关联表
output:
  fields:
  - name: 上年度分配金额
    type: date
    description: 提取 上年度分配金额 的日期值，格式 YYYY-MM-DD
  - name: 上年度绩效评级
    type: date
    description: 提取 上年度绩效评级 的日期值，格式 YYYY-MM-DD
  - name: 上年绩效评分
    type: string
    description: 提取 上年绩效评分 的文本值
  - name: 关联关系
    type: string
    description: 提取 关联关系 的文本值
  - name: 分配决策依据
    type: string
    description: 提取 分配决策依据 的文本值
  - name: 子项目收款方
    type: number
    description: 提取 子项目收款方 的数值（含单位，如万元、吨等）
  - name: 实际完成决算日期
    type: date
    description: 提取 实际完成决算日期 的日期值，格式 YYYY-MM-DD
  - name: 拨付金额
    type: number
    description: 提取 拨付金额 的数值（含单位，如万元、吨等）
  - name: 收款方
    type: number
    description: 提取 收款方 的数值（含单位，如万元、吨等）
  - name: 是否关联方
    type: boolean
    description: 提取 是否关联方 的布尔值（是/否）
  - name: 最终收款方
    type: number
    description: 提取 最终收款方 的数值（含单位，如万元、吨等）
  - name: 本年度分配金额
    type: date
    description: 提取 本年度分配金额 的日期值，格式 YYYY-MM-DD
  - name: 本次分配金额
    type: number
    description: 提取 本次分配金额 的数值（含单位，如万元、吨等）
  - name: 结余上缴日期
    type: date
    description: 提取 结余上缴日期 的日期值，格式 YYYY-MM-DD
  - name: 结余金额
    type: number
    description: 提取 结余金额 的数值（含单位，如万元、吨等）
  - name: 资金最终用途
    type: string
    description: 提取 资金最终用途 的文本值
  - name: 资金来源项目
    type: string
    description: 提取 资金来源项目 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目实施单位
    type: string
    description: 提取 项目实施单位 的文本值
  - name: 项目编码
    type: string
    description: 提取 项目编码 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (((决算报告.项目竣工日期 IS NOT NULL) && (决算报告.决算报告编制日期 IS NULL)) && (DATEDIFF(当前日期, 决算报告.项目竣工日期) > 365)) || ((决算报告.项目竣工日期
    IS NOT NULL) && (决算报告.决算报告编制日期 IS NOT NULL) && (DATEDIFF(决算报告.决算报告编制日期, 决算报告.项目竣工日期) > 90) && (关联表.结余金额 > 0))
  description: 基建项目竣工后，若超过1年仍未完成决算，或决算完成时间超出竣工后3个月（90天）且存在结余资金，即触发疑点。前者反映决算组织工作严重滞后，后者反映决算后结余资金未及时清理上缴。
  audit_item: 结余资金管理不规范
  suspicion: 基建项目竣工决算及结余资金清理滞后
  regulation: "[\n  {\n    \"法规名称\": \"基本建设财务规则\",\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"项目建设单位应在项目竣工后三个月内完成竣工财务决算的编制工作，并按照规定报送审批。结余资金应在竣工财务决算批复后30日内上缴国库。\"\n  }\n]"
- expression: (明细表.金额 > 0 && 执行记录.拨付金额 > 0) && (验收报告.验收结论 缺失 || 验收报告.实际完成内容 != 申报材料.实施内容 || 关联表.最终收款方 与 申报材料.申报单位 无业务关联) &&
    筛查表.项目内容空泛度评分 > 80
  description: 筛选已拨付资金但验收缺失或实际完成内容与申报严重不符，且资金流向与项目无关方或空壳公司的项目；风险评分基于项目内容空泛度、申报单位资质不匹配、预算与行业标准偏离度等加权计算，超过80分触发严重疑点。
  audit_item: 编制虚假预算
  suspicion: 虚构不存在项目套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号（2014年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第九十三条第一款\",\n    \"内容概述\": \"各级政府及有关部门、单位不得虚列收入和支出；虚列支出包括虚构项目申报预算、套取财政资金的行为。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条第一款\",\n    \"内容概述\": \"\
    以虚报、冒领等手段骗"
- expression: (对比表.项目名称 > 0.85 || 对比表.实施内容摘要 > 0.7) && (明细表.申报年度 != 决算报告.竣工时间 或 明细表.申报部门 != 其他渠道批复部门) && 明细表.金额 > 0
  description: 利用文本相似度分析比对项目名称和实施内容，当相似度超过阈值且在不同年度或不同部门重复获取资金时触发疑点；重叠度通过对建设规模、技术方案、绩效目标等关键词对比计算。
  audit_item: 编制虚假预算
  suspicion: 重复申报同一项目套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号（2014年修订）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第九十三条第一款\",\n    \"内容概述\": \"各级政府及有关部门、单位不得虚列支出，通过重复申报骗取财政资金属于虚列支出行为。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条第一款\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，"
- expression: (申报材料.实施主体对比表.子项目列表 > 1 && ABS(SUM(子项目金额) - 申报材料.总预算) < 申报材料.总预算*0.05) && (采购文件.招标公告 == '非公开招标' && SUM(子项目金额)
    > 管理制度.公开招标限额) && (关联表.子项目收款方 存在 采购文件.供应商 或 关联表.关联关系)
  description: 将一个整体项目拆分为多个子项目，每个子项目金额均低于公开招标限额，但总额超出限额且供应商高度集中，同时实际总支出与原预算总规模一致，即可疑为人为拆分规避招标并可能虚增费用。
  audit_item: 编制虚假预算
  suspicion: 拆分项目规避监管套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"中华人民共和国主席令第六十八号（2014年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第二十八条、第六十四条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购；采购代理机构不得以不合理条件限制或者排斥潜在供应商。\"\
    \n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第"
- expression: 关联表.分配决策依据 == '否' OR CORREL(关联表.上年绩效评分, 关联表.本次分配金额) < 0.3
  description: 查核资金分配文件中是否明确说明依据绩效评价结果，或通过计算同一项目连续两年绩效评分与分配金额的相关系数（R²），若R²<0.3说明分配与绩效基本脱钩。同时检查是否存在绩效评级为'差'但仍获同等甚至更多资金的项目。
  audit_item: 绩效管理不到位
  suspicion: 涉农专项资金分配未考虑绩效评价结果
  regulation: "[\n  {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"绩效评价结果应当作为下一年度预算安排的重要依据，绩效好的优先保障，绩效差的应当调减或取消预算。\"\n  }\n]"
- expression: 上年度绩效评级 IN ('不合格','差') && (本年度分配金额 >= 上年度分配金额 * 0.9)
  description: 对于上年度绩效评价结果为“不合格”或“差”的项目实施单位，当年继续安排涉农专项资金且金额未作实质性削减（削减幅度小于10%视为未应用绩效结果），判定资金分配未考虑绩效评价结果。
  audit_item: 资金绩效管理不到位
  suspicion: 涉农专项资金分配未挂钩绩效评价结果
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分“强化绩效评价结果应用”\",\n    \"内容概述\": \"将绩效评价结果与预算安排和政策调整挂钩，对绩效好的优先保障，对绩效差的削减预算或取消项目，形成奖优罚劣的机制。\"\n  }\n\
    ]"
