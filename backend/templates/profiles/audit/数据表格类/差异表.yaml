name: audit/数据表格类/差异表
type: model
description: 从数据表格类类文档（差异表）中提取结构化元数据。涵盖字段如：保单信息、实盘数量、实际发放金额、差异原因、差异数量、差异标志、差异比例、差异类型。文档范围包括：个人所得税申报与薪酬发放差异表、年度资产盘点差异表、跨部门保单信息比对差异表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 资产
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 差异表
  member_count: 1
  member_details:
  - 个人所得税申报与薪酬发放差异表
  - 年度资产盘点差异表
  - 跨部门保单信息比对差异表
output:
  fields:
  - name: 保单信息
    type: string
    description: 提取 保单信息 的文本值
  - name: 实盘数量
    type: number
    description: 提取 实盘数量 的数值（含单位，如万元、吨等）
  - name: 实际发放金额
    type: number
    description: 提取 实际发放金额 的数值（含单位，如万元、吨等）
  - name: 差异原因
    type: string
    description: 提取 差异原因 的文本值
  - name: 差异数量
    type: number
    description: 提取 差异数量 的数值（含单位，如万元、吨等）
  - name: 差异标志
    type: boolean
    description: 提取 差异标志 的布尔值（是/否）
  - name: 差异比例
    type: number
    description: 提取 差异比例 的数值（含单位，如万元、吨等）
  - name: 差异类型
    type: string
    description: 提取 差异类型 的文本值
  - name: 差异金额
    type: number
    description: 提取 差异金额 的数值（含单位，如万元、吨等）
  - name: 差异面积-数量
    type: number
    description: 提取 差异面积-数量 的数值（含单位，如万元、吨等）
  - name: 差异额
    type: string
    description: 提取 差异额 的文本值
  - name: 申报收入金额
    type: number
    description: 提取 申报收入金额 的数值（含单位，如万元、吨等）
  - name: 盘点年度
    type: date
    description: 提取 盘点年度 的日期值，格式 YYYY-MM-DD
  - name: 账面数量
    type: number
    description: 提取 账面数量 的数值（含单位，如万元、吨等）
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (企业领导人员薪酬发放台账.实际年薪 > 国资监管部门批准的薪酬手册.批准薪酬总额) || (补贴发放审批单.补贴项目名称 NOT IN (国资监管部门批准的薪酬手册.各类补贴标准及项目清单)) || (补贴发放审批单.补贴金额
    > 国资监管部门批准的薪酬手册.各类补贴标准及项目清单) || (个人所得税申报与薪酬发放差异表.差异额 > 0)
  description: 将实际发放的薪酬及补贴与国资监管部门批准的薪酬手册逐项比对。任何超出批准总额的发放、不在批准范围内的补贴项目、金额超出单项标准的部分均触发违规。个税申报收入与实际发放存在差异且无正当理由（如年终奖计税方式差异等），视为违规发放的线索。
  audit_item: 其他违反中央八项规定及其实施细则精神问题
  suspicion: 超核定薪酬手册标准发放领导人员薪酬或补贴
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"无（中共中央纪委、中共中央组织部、监察部、国务院国资委等联合发布）\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第四条、第六条\",\n    \"内容概述\": \"国有企业领导人员应当切实维护国家和出资人利益，不得违反规定获取个人利益；不得违反规定发放薪酬、津贴、补贴等。\"\n  }\n\
    ]"
- expression: (农业保险投保明细表.投保面积 > 农业部门种植/养殖面积统计表.统计面积 * 1.2) || (农业保险投保明细表.投保面积/数量 > 投保人身份证明.养殖档案存栏量 * 1.2) || (跨部门保单信息比对差异表.差异比例
    > 0.2)
  description: 当投保面积超出农业部门核实面积的20%以上，或投保牲畜数量超出养殖档案存栏上限的20%，或跨部门差异表中面积/数量偏差率超过20%时，判定为虚构或虚增保险标的。阈值可根据当地实际调整，偏差率越高风险越大。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 虚构或虚增保险标的骗取保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条第一项\"\
    ,\n    \"内容概述\": \"禁止投保人虚构或者虚增保险标的、以同一保险标的多次重复投保，骗取农业保险的保险费补贴。\"\n  }\n]"
- expression: 跨部门保单信息比对差异表.差异金额 > 0 && (跨部门保单信息比对差异表.差异类型 IN ('面积超限','撂荒投保','多头补贴')) && (财政补贴资金发放清单.发放时间 > 农业部门种植/养殖面积统计表.数据生成日期)
  description: 跨部门差异表中存在差异金额，且差异属于面积虚增、已撂荒地块投保或多头补贴类型，同时财政补贴发放时点晚于农业部门数据更新日期，表明共享数据未有效利用，造成无效补贴。差异金额大于零即触发疑点。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 部门数据共享不足导致财政资金浪费
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\"\
    ,\n    \"内容概述\": \"国务院财政、农业、林业、保险监督管理等部门应当建立农业保险相关信息的共享机制。\"\n  },\n  {\n    \"法规名称\": \"中央财政农业保险保险费补贴管理办法\",\n    \"\
    法规文号\": \"财金〔2021〕41号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"地方财政部门应会同有关部门加强投保标的真实性、准确性审核，确保财政补"
- expression: (清产核资完成时间、资产清查范围.验收结论 != '已完成') || (清产核资完成时间、资产清查范围.第三方签字确认 != TRUE) || (ABS(盘点年度、资产名称、账面数量、实盘数量、差异数量、差异原因.差异数量)
    > 0 && 盘点年度、资产名称、账面数量、实盘数量、差异数量、差异原因.差异原因为空) || (资产名称、资产类别、数量、价值、登记日期、资产编号、保管责任人、使用状态、存放地点、原值、存放地点或位置.登记日期 > 清产核资截止日期要求、资产分类标准.清产核资截止日期要求)
  description: 判定清产核资任务未完成的逻辑：1）验收结论非“已完成”或验收报告缺少第三方签字，视为形式未完成；2）年度盘点存在账实差异且无合理解释，视为实质未完成；3）台账登记日期晚于上级政策文件规定的清产核资完成时限，视为逾期未完成。以上任一条件触发则构成疑点。
  audit_item: 农村集体资产管理不到位
  suspicion: 集体资产清产核资任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"要求全面开展集体资产清产核资，明确清产核资的范围、任务和时间表，确保账实相符、底数清晰。\"\n  },\n  {\n    \"法规名称\": \"\
    农村集体资产清产核资办法\",\n    \"法规文号\": \"农经发〔2018〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条、第十条\",\n    \"内容概述\": \"\
    农村集体经济组织"
