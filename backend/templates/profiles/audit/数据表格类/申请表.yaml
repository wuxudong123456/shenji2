violations:
- expression: (预算单位、预算科目、公务接待费预算金额.公务接待费预算金额 == 0) && (预算单位、支出科目、公务接待费实际支出金额.公务接待费实际支出金额 > 0)
  description: 当单位本年度未编制公务接待费预算（或预算金额为零），但在决算报表中实际发生了公务接待费支出，则触发疑点。此表达式直接筛查未纳入预算而有支出的违规情形。
  audit_item: 未按规定编制公务接待费预算
  suspicion: 公务接待费未全部纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2014年修订）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"各部门、各单位应当按照国务院财政部门制定的政府收支分类科目编制预算，依法将所有收支全部纳入预算，不得少列、隐瞒。\"\n  }\n]"
- expression: 申报产值.申报产值 > 评定表.同意的累计完成产值 * 1.05 && 申请表.申请支付金额 > 申报产值.申报产值 * 合同约定的支付比例
  description: 监理审定的累计完成产值若高于质量验收评定核定的产值5%以上，且建设单位据此超额支付进度款（支付金额超过应支付额），可能存在虚报进度、套取资金。5%为审计容忍合理偏差，超过即视为异常。
  audit_item: 大型水利工程进度与成本审计
  suspicion: 虚报工程进度及完成产值以提前套取工程款
  regulation: "[\n  {\n    \"法规名称\": \"水利基本建设资金管理办法\",\n    \"法规文号\": \"财基字[1999]139号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"工程价款应按照建设工程合同规定条款、实际完成工程量及工程监理情况结算与支付。项目法人应严格核实工程量，防止虚报冒领。\"\n  },\n  {\n    \"法规名称\"\
    : \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建[2004]369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"\
    工程进度款结算应"
- expression: 投资计划申请表.申报项目名称 NOT IN (储备库清单.项目名称) || 储备库清单无记录
  description: 申报项目应在涉农项目储备库中，通过左连接查找申报项目是否在库，匹配为空或储备库无任何数据则触发疑点。
  audit_item: 项目计划申报不合规
  suspicion: 涉农项目未纳入储备库直接申报投资计划
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\"\
    ,\n    \"内容概述\": \"政府投资项目应当纳入项目储备库，未纳入储备库的项目不得安排政府投资。\"\n  }\n]"
- expression: 投资计划申请表.项目名称 NOT IN (计划表.项目名称) WHERE 计划表.覆盖年度 = 投资计划申请表.申报年度 || 计划表无任何记录
  description: 申报项目必须列入对应年度的三年滚动投资计划，若项目不在计划表单内，或计划表缺失，则判定为违规。
  audit_item: 项目计划申报不合规
  suspicion: 涉农项目申报未纳入三年滚动投资计划
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委关于加强政府投资项目储备编制三年滚动投资计划的通知\",\n    \"法规文号\": \"发改投资[2015]2463号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二部分\",\n    \"内容概述\": \"各地区、各部门要建立健全项目储备制度，编制三年滚动投资计划，未纳入计划的项目原则上不得安排年度投资。\"\n  }\n]"
- expression: 投资计划申请表.申报日期 < 前期手续文件.批复日期（针对任一必需要件） || 要件办理状态 = '未完成'
  description: 投资计划申报日期必须晚于所有法定前置审批手续（如可研、环评、用地等）的批准日期，若申报时任一要件状态为“未完成”或申报日期早于批复日期，即构成违规。
  audit_item: 项目计划申报不合规
  suspicion: 前期手续不完备即申报涉农投资计划
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条、第二十条\"\
    ,\n    \"内容概述\": \"项目单位应当依法办理相关前期审批手续，项目达到规定的开工条件后方可开工建设；申报投资计划时应当已完成可行性研究报告批复及必要的环评等手续。\"\n  }\n]"
- expression: 投资计划申请表.申报日期 > 竣工验收报告.竣工日期 || 进度跟踪表.项目状态 = '已完工' AND 投资计划申请表.申报日期 > 进度跟踪表.实际完工日期
  description: 若投资计划申报时项目已完成竣工验收或实际已完工，则属于以已完工项目申报新建投资，触发违规。
  audit_item: 项目计划申报不合规
  suspicion: 涉农项目已竣工仍申报新建投资计划
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部中央预算内直接投资农业建设项目管理办法\",\n    \"法规文号\": \"农计财发〔2018〕3号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"项目单位不得将已完工项目申报中央预算内投资，不得以同一项目重复申报投资计划。\"\n  }\n]"
- expression: 投资计划申请表.项目名称 IN (拨付台账.项目名称) WHERE 拨付台账.资金类别 = '中央预算内投资' OR 拨付台账.资金类别 = '中央财政资金'
  description: 若投资计划申请表中的项目在历史中央资金拨付台账中已存在相同项目获拨记录，即认定为重复申报。
  audit_item: 项目计划申报不合规
  suspicion: 同一项目重复申报中央财政投资计划
  regulation: "[\n  {\n    \"法规名称\": \"中央预算内投资补助和贴息项目管理办法\",\n    \"法规文号\": \"国家发展和改革委员会令第45号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十九条\",\n    \"内容概述\": \"严禁通过虚报、重复申报等手段骗取投资补助和贴息资金。\"\n  }\n]"
- expression: 信用信息核查记录表.失信状态 = '列入严重失信名单' AND 投资计划申请表.申报单位 = 信用信息核查记录表.单位名称
  description: 申报单位若在信用信息系统中处于严重失信名单状态，则不符合投资计划申报条件。
  audit_item: 项目计划申报不合规
  suspicion: 严重失信主体违规申报涉农投资计划
  regulation: "[\n  {\n    \"法规名称\": \"关于对财政性资金管理使用领域相关失信责任主体实施联合惩戒的合作备忘录\",\n    \"法规文号\": \"发改财金〔2016〕2641号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"二（一）\",\n    \"内容概述\": \"依法限制失信责任主体申请中央预算内投资、财政补助补贴等财政性资金。\"\n  }\n]"
- expression: 投资计划申请表.建设内容 != 可研报告.批复建设内容 || ABS(投资计划申请表.投资概算 - 可研报告.投资估算)/可研报告.投资估算 > 0.1
  description: 投资计划申报的建设内容必须严格对应可研批复内容，投资概算超出批复估算10%以上视为违规；建设内容不一致直接判定违规。
  audit_item: 项目计划申报不合规
  suspicion: 涉农投资计划建设内容与可研批复不符
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条、第二十一条\"\
    ,\n    \"内容概述\": \"经核定的投资概算是控制政府投资项目总投资的依据，项目建设不得擅自增加建设内容、扩大建设规模、提高建设标准；确需变更的须报原审批部门审批。\"\n  }\n]"
- expression: (竣工验收测绘报告.上报建成面积 - 土地利用现状图.地块图斑面积 > 0) || (耕地质量等别评定报告.地块等别未提升 && 竣工验收测绘报告.上报建成面积 > 0)
  description: 判定规则：1）将项目竣工测绘报告的上报建成面积，与自然资源部门权威的土地利用现状图叠加分析，若上报面积大于现状图认定的高标准农田图斑面积，即存在虚报嫌疑；2）若某地块已在上报建成面积中，但耕地质量等别评定报告显示其质量等别未达到高标准农田标准（即等别未提升），则预警为该地块以非高标准农田冒充高标准农田进行虚报。
  audit_item: 高标准农田项目建设不符合相关规定
  suspicion: 虚报高标准农田建成面积
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。其中包括以虚报、冒领等手段骗取财政资金。\"\n\
    \  }\n]"
- expression: 审批文件.预售许可证 IS NULL OR 合同台账.贷款发放日期 < 审批文件.预售许可证 OR 申请表.房屋性质 NOT IN ('普通住宅')
  description: 满足任一条件即判定违规：①项目未取得《商品房预售许可证》；②贷款发放日期早于预售许可证取得日期，存在无证先售；③房屋性质为商业公寓、小产权房等非普通住宅，超出公积金贷款支持范围。均为严重违规行为。
  audit_item: 违规发放住房公积金贷款
  suspicion: 违规向不符合条件项目发放住房公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"关于规范住房公积金个人住房贷款政策有关问题的通知\",\n    \"法规文号\": \"建金[2010]179号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"住房公积金个人住房贷款只能用于缴存职工购买、建造、翻建、大修普通自住住房，严禁用于购买非普通自住住房、商业用房等。\"\n  }\n]"
- expression: COUNT(数据表.身份证号 按家庭归并) >= 3 && 申请表.购房套数声明 = '已发放'
  description: 按核心家庭（含借款人、配偶及未成年子女）合并计算名下房产套数，若实际房产套数≥3套而公积金中心仍批准并发放贷款，即认定违规。家庭归并需使用婚姻登记信息关联配偶身份证号。
  audit_item: 违规发放住房公积金贷款
  suspicion: 违规向购买第3套及以上职工家庭发放住房公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"关于规范住房公积金个人住房贷款政策有关问题的通知\",\n    \"法规文号\": \"建金[2010]179号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"停止向购买第三套及以上住房的缴存职工家庭发放住房公积金个人住房贷款。\"\n  }\n]"
- expression: 贷款金额、贷款期限、发放日期、还款方式、合同编号、放款日期、贷款状态、执行年利率、贷款发放日期、贷款期限（年）.贷款金额 > 管理办法.最高贷款额度标准 || (贷款金额、贷款期限、发放日期、还款方式、合同编号、放款日期、贷款状态、执行年利率、贷款发放日期、贷款期限（年）.贷款金额
    > (申请表.借款人月缴存基数+申请表.配偶月缴存基数) * 管理办法.还贷能力系数 * 贷款年限 * 12) || 贷款金额、贷款期限、发放日期、还款方式、合同编号、放款日期、贷款状态、执行年利率、贷款发放日期、贷款期限（年）.贷款金额
    > 评估报告.评估价值 * 贷款成数
  description: 超额度违规包括：①贷款金额超过当地规定的单笔最高限额；②按还贷能力计算的月供超出（月缴存基数×还贷能力系数），导致贷款金额超过应核定额度；③贷款金额超过抵押物评估价值与政策规定的贷款最高成数之积。满足任意一条即为超额度发放。
  audit_item: 违规发放住房公积金贷款
  suspicion: 超额度发放住房公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"关于住房公积金管理若干具体问题的指导意见\",\n    \"法规文号\": \"建金管[2005]5号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"各地要根据当地经济适用住房或普通商品住房销售价格，拟订住房公积金个人住房贷款最高额度。职工个人贷款具体额度的确定，要综合考虑购建住房价格、借款人还款能力及其住房公积金账户存储余额等因素。\"\
    \n  }\n]"
