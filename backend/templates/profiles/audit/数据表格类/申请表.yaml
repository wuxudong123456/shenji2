    description: 提取 调整金额 的数值（含单位，如万元、吨等）
  - name: 购房套数声明
    type: string
    description: 提取 购房套数声明 的文本值
  - name: 购房项目名称
    type: string
    description: 提取 购房项目名称 的文本值
  - name: 配偶月缴存基数
    type: string
    description: 提取 配偶月缴存基数 的文本值
  - name: 项目名称
