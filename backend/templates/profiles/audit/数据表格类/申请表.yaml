name: audit/数据表格类/申请表
type: model
description: 从数据表格类类文档（申请表）中提取结构化元数据。涵盖字段如：借款人出生日期、借款人性别、借款人月缴存基数、入股凭证、共同借款人信息、共同申请人信息、合同编号、同意的累计完成产值。文档范围包括：中央预算内投资计划申请表、住房公积金贷款申请表、入社申请表、困难群体救助申请表、工程款支付申请表、投资计划申请表、救助对象申请表（文件7）、项目工程款支付申请表、预算调整申请表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 凭证
- 合同
- 审批
- 工程
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 申请表
  member_count: 1
  member_details:
  - 中央预算内投资计划申请表
  - 住房公积金贷款申请表
  - 入社申请表
  - 困难群体救助申请表
  - 工程款支付申请表
  - 投资计划申请表
  - 救助对象申请表（文件7）
  - 项目工程款支付申请表
  - 预算调整申请表
output:
  fields:
  - name: 借款人出生日期
    type: date
    description: 提取 借款人出生日期 的日期值，格式 YYYY-MM-DD
  - name: 借款人性别
    type: number
    description: 提取 借款人性别 的数值（含单位，如万元、吨等）
  - name: 借款人月缴存基数
    type: number
    description: 提取 借款人月缴存基数 的数值（含单位，如万元、吨等）
  - name: 入股凭证
    type: string
    description: 提取 入股凭证 的文本值
  - name: 共同借款人信息
    type: number
    description: 提取 共同借款人信息 的数值（含单位，如万元、吨等）
  - name: 共同申请人信息
    type: string
    description: 提取 共同申请人信息 的文本值
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 同意的累计完成产值
    type: string
    description: 提取 同意的累计完成产值 的文本值
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
