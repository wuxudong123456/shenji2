    description: 提取 家庭财产申报总额 的数值（含单位，如万元、吨等）
  - name: 家庭资产声明
    type: string
    description: 提取 家庭资产声明 的文本值
  - name: 建设内容
    type: string
    description: 提取 建设内容 的文本值
  - name: 房屋坐落
