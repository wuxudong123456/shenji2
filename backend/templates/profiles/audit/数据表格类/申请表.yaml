    > 管理办法.房龄与贷款年限关系规则)
  description: 三项条件任一满足即为超年限放款：①贷款到期时借款人年龄超过法定退休年龄后5年；②贷款期限本身超出规定的最长年限（如超过30年）；③对于二手房，房龄与贷款年限之和超出当地规定的上限（如超过50年）。均为违规。
  audit_item: 违规发放住房公积金贷款
  suspicion: 超年限发放住房公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"关于住房公积金管理若干具体问题的指导意见\",\n    \"法规文号\": \"建金管[2005]5号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"各地要根据实际情况，合理确定住房公积金个人住房贷款期限。贷款最长期限不得超过30年。借款人年龄与贷款期限之和不得超过法定退休年龄后5年。\"\n  }\n]"
