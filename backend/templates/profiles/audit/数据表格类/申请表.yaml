  - name: 申请的计量支付面积或工程量
    type: string
    description: 提取 申请的计量支付面积或工程量 的文本值
  - name: 申请调整科目
    type: string
    description: 提取 申请调整科目 的文本值
  - name: 相关佐证材料
    type: string
