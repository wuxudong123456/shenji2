name: audit/数据表格类/动态表
type: model
description: 从数据表格类类文档（动态表）中提取结构化元数据。涵盖字段如：监测指标完整度、预警记录。文档范围包括：金融业务风险监测指标动态表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 动态表
  member_count: 1
  member_details:
  - 金融业务风险监测指标动态表
output:
  fields:
  - name: 监测指标完整度
    type: string
    description: 提取 监测指标完整度 的文本值
  - name: 预警记录
    type: string
    description: 提取 预警记录 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (缺失制度列表包含 '风险准备金制度' OR 缺失制度列表包含 '审贷决策流程制度' OR 缺失制度列表包含 '信息披露制度' OR 缺失制度列表包含 '动态监测制度') AND (准备金账户.余额 < 准备金制度.要求应计提金额*0.8
    OR 监测表.核心指标缺失数 > 3 OR 抵押合同.权属证明缺失= '是')
  description: 判定：必备的风控制度（风险准备金制度、审贷决策制度、信息披露制度、动态监测制度）中任一项缺失，且在实际运行中，风险准备金账户余额未达到制度规定金额的80%、或监测指标动态表中关键指标缺失超过3个、或抵押合同缺失权属证明，即判定制度体系不健全且执行失效。
  audit_item: 供销合作社金融服务不规范
  suspicion: 审贷决策及风险准备等关键制度缺失
  regulation: "[\n  {\n    \"法规名称\": \"农村资金互助社管理暂行规定\",\n    \"法规文号\": \"银监发〔2007〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"农村资金互助社应当建立审慎经营机制，建立贷款管理制度、内部审计制度、风险准备金制度和信息披露制度等。\"\n  }\n]"
