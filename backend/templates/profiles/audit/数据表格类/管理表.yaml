name: audit/数据表格类/管理表
type: model
description: 从数据表格类类文档（管理表）中提取结构化元数据。涵盖字段如：入驻企业名称、入驻日期、实际办公状态、年租金、承租人、租赁面积、计划外调整次数、资产名称。文档范围包括：入驻企业动态管理表、资产租赁/承包合同管理表、项目实施进度管理表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 资产
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 管理表
  member_count: 1
  member_details:
  - 入驻企业动态管理表
  - 资产租赁/承包合同管理表
  - 项目实施进度管理表
output:
  fields:
  - name: 入驻企业名称
    type: string
    description: 提取 入驻企业名称 的文本值
  - name: 入驻日期
    type: date
    description: 提取 入驻日期 的日期值，格式 YYYY-MM-DD
  - name: 实际办公状态
    type: boolean
    description: 提取 实际办公状态 的布尔值（是/否）
  - name: 年租金
    type: string
    description: 提取 年租金 的文本值
  - name: 承租人
    type: string
    description: 提取 承租人 的文本值
  - name: 租赁面积
    type: string
    description: 提取 租赁面积 的文本值
  - name: 计划外调整次数
    type: string
    description: 提取 计划外调整次数 的文本值
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 进度偏差率
    type: string
    description: 提取 进度偏差率 的文本值
  - name: 退租日期
    type: date
    description: 提取 退租日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ((价格资料.市场平均年租金 - 管理表.年租金) / 价格资料.市场平均年租金) * 100 > 30
  description: 判定低价承包的逻辑：将合同年租金与周边同类资产市场平均年租金对比，计算偏低比例。公式为(市场均价-合同价)/市场均价*100%。超过30%视为严重偏离市场价格，存在利益输送或恶意低价发包嫌疑，易导致集体收益流失。
  audit_item: 农村集体资产管理不到位
  suspicion: 集体资产承包合同价格显失公允
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国村民委员会组织法\",\n    \"法规文号\": \"主席令第37号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第八条\",\n    \"内容概述\": \"村民委员会应当尊重并支持集体经济组织依法独立进行经济活动的自主权，保障集体经济组织和村民、承包经营户、联户或者合伙的合法财产权和其他合法权益。\"\n  },\n  {\n   \
    \ \"法规名称\": \"关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n\
    \    \"内容概述"
- expression: (项目实施方案及审批文件.存在标识 == 0) || ((项目实施方案及审批文件.建设目标缺失?1:0) + (项目实施方案及审批文件.进度计划缺失?1:0) + (项目实施方案及审批文件.预算缺失?1:0) + (项目实施方案及审批文件.责任分工缺失?1:0)
    >= 3) || (项目实施方案及审批文件.模糊表述占比 > 0.3)
  description: 方案文件缺失即违规；文件存在但核心要素（建设目标、进度计划、预算、责任分工）缺失数量达到3个及以上；或方案中模糊描述（如“其他事项”等）占比超过30%，均视为方案严重不细化。
  audit_item: 项目建设组织实施不到位
  suspicion: 未编制实施方案或内容严重不细化
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资项目开工建设应当符合规定建设条件，项目单位应当加强项目实施管理，严格按照批准的建设地点、建设规模和建设内容实施，未编制细化实施方案影响项目规范执行。\"\n  }\n]"
- expression: (统计表.空置面积 / 统计表.载体总面积 > 0.5) AND (统计表.连续空置月数 >= 6) AND (监测报告.培训活动次数 < 4) AND (管理表.入驻企业名称 < 认定标准.应入驻企业数 * 0.3)
  description: 同时满足空置率超过50%、连续空置半年以上、近一年创业服务活动少于4次、实际入驻企业数不足认定基线30%的载体，判定为严重闲置浪费或运营低效。该表达式综合了物理空间使用、服务活跃度、持续周期及入驻规模，避免仅凭单一指标误判。
  audit_item: 创业载体政策执行不到位
  suspicion: 创业载体建成后长期闲置或运营低效
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十四条\"\
    ,\n    \"内容概述\": \"项目单位应当加强政府投资项目资产管理，建立健全项目管理制度，确保项目建成后达到预期效果，不得将项目资产闲置或者低效使用。\"\n  },\n  {\n    \"法规名称\": \"就业补助资金管理办法\"\
    ,\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十条\",\n    \"内容概述\": \"各级财政、人力资源社会保障部门应当"
