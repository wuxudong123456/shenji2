name: audit/数据表格类/权限表
type: model
description: 从数据表格类类文档（权限表）中提取结构化元数据。涵盖字段如：出纳账号角色、权限清单。文档范围包括：财务系统用户权限表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 权限表
  member_count: 1
  member_details:
  - 财务系统用户权限表
output:
  fields:
  - name: 出纳账号角色
    type: string
    description: 提取 出纳账号角色 的文本值
  - name: 权限清单
    type: string
    description: 提取 权限清单 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (出纳职责描述.出纳职责描述（是否包含稽核、档案保管、收入/费用/债权债务账登记） CONTAINS ('稽核' OR '会计档案保管' OR '收入账登记' OR '费用账登记' OR '债权债务账登记')) OR
    (权限表.出纳账号角色、权限清单（审核、记账、修改凭证等） IN ('会计凭证审核','总账登记','明细账修改')) OR (制单人、复核人、审批人签名及岗位.制单人 = '出纳' AND 制单人、复核人、审批人签名及岗位.复核人 =
    '出纳') OR (档案保管责任人.档案保管责任人 = 出纳人员姓名)
  description: 任何一条条件满足即违规：出纳职责明文包含不相容工作；出纳拥有会计审核、记账等系统权限；同一笔支付的制单与复核均为出纳；或出纳兼任会计档案保管，均违反《会计法》第三十七条关于出纳不得兼任的规定。
  audit_item: 违反会计管理规定的行为
  suspicion: 出纳人员兼管稽核、档案及账目登记等不相容职务
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第三十七条\",\n    \"内容概述\": \"出纳人员不得兼任稽核、会计档案保管和收入、支出、费用、债权债务账目的登记工作。\"\n  }\n]"
