violations:
- expression: (非税收入缴库明细表.预算级次 != 预算管理制度.法定级次归属) OR (非税收入缴库明细表.预算科目代码 NOT IN (预算管理制度.科目代码规则)) OR (ABS(非税收入缴库明细表.金额 - 预算执行情况报表.实际入库金额)
    > 合理容差) OR (财政专户与国库对账记录.差异说明 IS NOT NULL AND 财政专户与国库对账记录.差异说明 NOT LIKE '%已更正%')
  description: 通过四类条件发现入库乱象：预算级次错挂（如中央收入入地方库）；科目错误（如一般公共预算收入放入政府性基金科目）；缴库金额与报表差异超出容差；财政专户与国库差异未及时调整。容差一般设为缴库金额的1%或1000元。
  audit_item: 不按照规定的预算级次、预算科目入库
  suspicion: 非税收入未按规定预算级次或科目缴库
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"2018年修正\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十五条\"\
    ,\n    \"内容概述\": \"预算收入征收部门和单位必须依照法律、行政法规的规定，及时、足额征收应征的预算收入，不得擅自减征、免征或者缓征，不得截留、占用或者挪用。\"\n  },\n  {\n    \"法规名称\": \"\
    财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"财政收入执收单位及其工作"
- expression: (重大交易合同.货物/服务交付条款 == 无物流单证 || 无交付记录) && (应付账款明细表.账龄 > 360天) || (原始会计凭证.对方单位 IN (关联方交易披露文件.关联方名称 WHERE 关联方交易披露文件.交易内容
    == NULL) && (银行对账单.交易对手 != 原始会计凭证.对方单位))
  description: 筛查虚构交易以虚增收入的疑点：条件一，合同缺乏关键交付证明且形成长期大额应收款（超过360天），可能为虚假销售；条件二，交易对手为未披露的关联方且资金未直接流向对手方，表明交易可能无商业实质。满足任一组合条件即判定为疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 虚构经济业务交易进行虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条、第十六条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者事项为依据进行会计确认、计量和报告，如实反映符合确认和计量要求的各项会计要素及其他相关信息，保证会计信息真实可靠、内容完整。\"\n  }\n\
    ]"
- expression: (会议费报销明细表.会议名称 NOT IN 年度会议费预算申报表.会议名称) && 会议费报销明细表.实际支出金额 > 0 || (SUM(会议费报销明细表.实际支出金额) > 年度会议费预算申报表.批复预算金额 *
    1.1 && 预算调整审批记录表.调整金额 IS NULL)
  description: 筛查两类违规：一是存在实际报销的会议但未在年度预算申报表中列报，即会议脱离预算管控；二是所有会议费实际总支出超出批复预算10%以上，且无任何预算调整审批记录，表明预算约束失效。两条件满足任一即触发疑点。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 未将会议费全部纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条\",\n    \"内容概述\": \"会议费预算要细化到具体会议项目，执行中不得突破。会议费应纳入部门预算，并单独列示。\"\n  }\n]"
- expression: （会议费预算编制与执行对比表.分项实际支出金额 > 会议费预算编制与执行对比表.分项预算金额 * 1.2） || （会议费报销明细表.费用科目 IN ['住宿费','资料印刷费','设备租赁费'] && 年度会议费预算申报表.预算明细科目
    NOT INCLUDE 会议费报销明细表.费用科目）
  description: 若某项费用实际支出超出预算20%以上，或实际发生了住宿费、资料费等必要支出但预算申报时未列示该科目，判定为预算编制不完整。预算编制应涵盖会议必要的全部费用构成，缺失关键科目即构成违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 会议费预算编制不完整
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条\",\n    \"内容概述\": \"各单位应当按照规定编制会议费预算，详细列示会议名称、主要内容、时间、地点、代表人数、工作人员数、所需经费及列支渠道等。\"\n  }\n]"
- expression: (下属单位会议费支出明细表.会议费支出摘要 LIKE '%上级会议%' || 会议费转嫁/分摊台账.分摊金额 > 0) && (下属单位/关联方会议费分摊协议.分摊方 IS NULL || 银行流水.用途 = '会议分摊费')
  description: 若下属单位账面出现与上级单位会议相关的费用支出，或无正式分摊协议但资金已划转，或分摊台账显示存在分摊行为，则判定为转嫁或摊派会议费。重点确认分摊是否经正式协议且合规，缺乏协议或资金流向明确为会议分摊费即构成违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 向下属机构、企事业单位、地方转嫁或摊派会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"会议费由召开单位承担，不得向参会人员收取，不得以任何方式向下属机构、企事业单位、地方转嫁或摊派。\"\n  }\n]"
- expression: (会议费报销明细表.参会人数 > 会议签到表.实际签到人数 * 1.2) || (SUM(会议费报销明细表.报销金额) - SUM(会议费预算编制与执行对比表.实际支出金额) > 0 && 银行流水.收款方 IN (虚假会议套取资金关联方资金流向表.关联方名称))
    || (会议费预算编制与执行对比表.结余金额 > 0 && 会议费报销明细表.实际支出明细（场地费、餐费、住宿费、资料费等） IS NULL)
  description: 通过虚报参会人数多申领费用、将会议结余资金转入关联方或个人账户、结余资金未退还财政等情形判定挪用、截留或侵占。人数虚报比例超过20%，或报销金额大于实际支出且收款方为关联方，或有结余但无退款记录均触发疑点。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 挪用、截留、侵占会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁各单位借会议名义组织会餐或安排宴请；严禁套取会议费设立‘小金库’；严禁在会议费中列支公务接待费。会议费支付应当严格按国库集中支付和公务卡管理规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\
    \n  }\n]"
- expression: （NOT EXISTS（会议签到表.会议名称 = 会议费报销明细表.会议名称）|| 会议签到表.实际签到人数 = 0 || 会议纪要.会议现场照片 IS NULL） && 会议费报销明细表.报销金额 > 5000 &&
    （银行流水.收款方 IN （虚假会议套取资金关联方资金流向表.关联方名称）|| 银行流水.用途摘要 IS NULL）
  description: 判断会议是否虚构：无签到记录或签到人数为0，或缺乏影像资料等实质性证明，且报销金额较大（如超过5000元），同时资金流向关联方或用途不明，视为虚列会议套取资金。重点关注报销后资金回流至经手人或关联账户的特征。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 虚列会议费套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有虚报、冒领等手段骗取财政资金的行为，将给予相应处理。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n  \
    \  \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁套取会议费设立‘小金库’；严禁在会议费中列支公务接待费等规"
- expression: 会议费结算方式统计表.现金金额占比 > 0 && (会议费结算方式统计表.现金金额占比 > 0.05 || 会议费报销明细表.金额 >= 1000)
  description: 根据规定，会议费应使用银行转账或公务卡结算，禁止现金方式。凡存在现金结算且现金总额占总费用比例超过5%，或单笔现金支付达到1000元及以上，均构成违规。特殊情况下确需现金支付的应提供书面说明，若无合理说明则判定违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 违规以现金方式结算会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"会议费支付，应当严格按照国库集中支付制度和公务卡管理制度的有关规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\n  }\n]"
- expression: '领导干部离职审批文件.离职日期 + 3年 >= 当前日期 && (企业法人/高管信息对照表.离职人员关联企业/中介机构名称 IN (SELECT 工商登记信息.企业名称 FROM 工商登记信息 WHERE 工商登记信息.经营范围
    LIKE ''%中介%'' OR 工商登记信息.经营范围 LIKE ''%经纪%'' OR 工商登记信息.经营范围 LIKE ''%咨询%'')) && ((银行资金流水明细表.交易摘要 LIKE ''%服务费%'' OR 银行资金流水明细表.交易摘要
    LIKE ''%佣金%'' OR 银行资金流水明细表.交易摘要 LIKE ''%居间费%'') AND 领导干部离职审批文件.管辖业务范围 '
  description: 在禁业期内，以中间人身份撮合交易并收取费用；通过企业名称或业务类型、银行流水中的佣金类收入、以及与原管辖对象的联系强度（通话频次前20%或直接出现审批加速）建立判违逻辑。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事有偿中介活动
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十六条\",\n    \"内容概述\": \"党员领导干部离职或者退（离）休后违反有关规定从事有偿中介活动，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务处分；情节严重的，给予留党察看处分。\"\n \
    \ },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百零七条\"\
    ,\n    \""
- expression: (经济实体股东高管名单.人员姓名 IN (在职人员兼职申报审批表.姓名) AND (在职人员兼职申报审批表.审批状态 != '批准' OR 在职人员兼职申报审批表.兼职单位 != 经济实体股东高管名单.企业名称))
    AND (薪酬发放凭证.收款人姓名 == 经济实体股东高管名单.人员姓名 OR 工资外收入明细表.对方单位 == 经济实体股东高管名单.企业名称 AND 工资外收入明细表.金额 > 0)
  description: 首先识别在职人员在经济实体兼任股东或高管且未履行批准程序，然后判定存在从该实体收取报酬的证据（如银行流水显示顾问费、工资外收入明细中的劳务费等）。两个条件同时满足即构成违规兼职取酬。若仅兼职未发现取酬，仍可能构成违规兼职，另案处理。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 在职人员违规兼职取酬
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十四条\",\n    \"内容概述\": \"违反有关规定在经济组织、社会组织等单位中兼职，或者经批准兼职但获取薪酬、奖金、津贴等额外利益的，依照前款规定处理。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国公职人员政务处分法\",\n    \"法规文号\": \"中华人民共和国主席令第四十六号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十六条\",\n    \"内容概述\"\
    : \"违反规定从"
- expression: (行程单.公务活动时长 / 行程单.总时长 < 0.5) || (费用报销明细表.
  description: 公务活动（会议、实地调研）时间占整个出行时间的比例低于50%，或费用中出现明确的旅游特征项目，或与旅行社签订的合同包含游览服务，均触犯变相旅游。
  audit_item: 公务接待管理不符合规定
  suspicion: 以考察调研名义组织变相公款旅游
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"不得组织旅游和与公务活动无关的参观，不得以任何名义赠送礼金、纪念品。\"\n  }\n]"
- expression: (财务报销凭证.支付方式 = '现金' AND 财务报销凭证.报销金额 > 1000) OR (财务报销凭证.支付方式 NOT IN ('公务卡','对公转账') AND 财务报销凭证.报销金额 > 2000) OR
    (公务卡消费明细表.消费金额 <> 财务报销凭证.报销金额)
  description: 单笔1000元以上的公务支出未使用公务卡而用现金，或2000元以上未采用公务卡或对公转账，或公务卡消费记录与报销金额不一致，即违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 未按规定使用公务卡结算
  regulation: "[\n  {\n    \"法规名称\": \"关于实施中央预算单位公务卡强制结算目录的通知\",\n    \"法规文号\": \"财库〔2011〕160号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条、第二条\",\n    \"内容概述\": \"中央预算单位必须严格执行公务卡强制结算目录，凡目录规定的公务支出项目，应使用公务卡结算，原则上不再使用现金。\"\n  }\n]"
- expression: (关联单位相关支出明细.摘要 包含 "接待费" OR 关联单位相关支出明细.摘要 包含 "餐费" OR 关联单位相关支出明细.收款方 = '本单位经常消费的酒店' OR 关联单位相关支出明细.收款方 = '本单位')
    AND (合同协议.费用分担条款 为空 OR 未办理资金划转审批) AND 公务接待费明细账.同期接待费变动 < 关联单位相关支出明细.金额
  description: 关联单位账目中出现接待性质支出且收款方指向本单位经常消费场所，同时缺乏合法费用转移依据，或本单位同期接待费异常偏低，极可能为转嫁摊派。
  audit_item: 公务接待费预算执行不合规
  suspicion: 向所属单位或关联方转嫁摊派接待费
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"不得向下级单位以及其他单位、企业、个人转嫁公务活动费用。\"\n  },\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"\
    法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"禁止向下级单位以及其他单位、企业、个人摊派、转嫁公务接待费用。\"\
    \n  }\n"
- expression: ((会议费用明细表.摘要 包含 “餐费” OR 会议费用明细表.摘要 包含 “住宿”) OR (培训费用明细表.摘要 包含 “餐费” OR 培训费用明细表.摘要 包含 “住宿”)) && (会议培训支撑材料.签到表
    IS NULL OR 会议培训支撑材料.签到表 = '' OR 会议培训支撑材料.照片 IS NULL OR 会议培训支撑材料.照片 = '' OR 培训活动预决算文件.议程 IS NULL OR 培训活动预决算文件.议程 = '')
    && ((会议费用明细表.餐饮支出 / 会议费用明细表.实际总支出金额 > 0.5 OR 培训费用明细表.餐饮支出 / 培训费用明细表.金额 > 0
  description: 会议或培训中餐饮住宿支出占比过高且缺乏实质性活动佐证，强烈暗示接待费伪装记入。餐饮占比超过50%或人均支出畸高触发异常。
  audit_item: 公务接待费预算执行不合规
  suspicion: 在其他科目隐匿列支公务接待费
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当加强对预算支出的管理，不得擅自改变预算支出的用途。\"\n  },\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n   \
    \ \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第八条、第二十条\",\n    \"内容概述\": \"严禁以培训、会议等名义变相公款消费，不得在会议费中列支"
- expression: (会议费用明细表.餐饮支出 > 会议费用明细表.实际总支出金额*0.6 OR 培训费用明细表.餐饮支出 > 培训费用明细表.金额*0.6) AND (会议培训支撑材料.签到表 IS NULL OR 会议培训支撑材料.签到表笔迹雷同
    OR 会议培训支撑材料.签到人员与人员考勤记录矛盾) AND ((会议费用明细表.实际总支出金额/会议费用明细表.参会人数) > 近三年同类活动人均支出*3 OR (培训费用明细表.金额) > 近三年同类活动人均支出*3)
  description: 会议/培训餐饮占比畸高（>60%）、活动佐证材料虚假或缺失、人均支出异常超高，三者叠加表明活动极可能不实，实为接待费转移。
  audit_item: 公务接待费预算执行不合规
