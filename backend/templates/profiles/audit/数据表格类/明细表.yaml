name: audit/数据表格类/明细表
type: model
description: 从数据表格类类文档（明细表）中提取结构化元数据。涵盖字段如：GPS坐标、一般公共预算支出额、上划上级账户日期、上年预算金额、上期同期金额、上期计提金额、上级补助实际拨付额、上缴情况。文档范围包括：2022年后转移支付资金支出明细表、“一卡通”银行流水明细表、下属单位会议费支出明细表、不动产登记费收取明细表、专项经费使用明细表、专项费用支出明细表、专项资金使用明细表、专项资金分配明细表、专项资金支出明细表、专项资金收入支出明细表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 预算
- 元数据提取
