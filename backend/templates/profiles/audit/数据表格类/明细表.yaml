  description: 一项费用已在本年度审计期间实际发生，且单位内部验收、入库等流程已完成，但财务部门故意压单、不进行账务处理，待到下一年度才确认支出并付款。这种将费用‘递延’到下一年度的行为，直接导致本年度决算报表少计了成本和负债。重点关注12月份发生的业务，但其报销审批和账务处理却在次年1月份及以后的业务。
