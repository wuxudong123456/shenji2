    条款号\": \"第八条、第二十条\",\n    \"内容概述\": \"严禁以会议、培训等名义进行公款消费，严禁虚列会议费套取资金用于接待。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\"\
    ,\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"各单位应当严格会议费管理，不得虚报、冒领会议费，不"
- expression: (单位编码、单位名称、单位状态.单位编码 NOT IN 单位编码、单位名称、单位状态.单位编码 AND 单位编码、单位名称、单位状态.单位状态 = '存续') || (项目编码、项目名称、金额、资金来源、资金来源类别.资金来源类别
    NOT IN ('一般公共预算拨款','政府性基金预算拨款','国有资本经营预算拨款'))
  description: 排查两种违规情形：一是单位不在应编报目录中但仍被编入决算（如已撤销单位、非预算单位），用实际单位清单与应编单位清单差集判定，同时排除因机构合并而消失的正常单位；二是将非财政预算资金（如代管社会团体资金、往来款）作为决算资金编报，通过资金来源类别字段识别，只要来源不属于三类法定预算资金即判定为违规编入。
  audit_item: 决算报告编报事项不准确
  suspicion: 将非编报范围单位或资金违规纳入决算编报
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"各部门应当将本部门所属各单位全部纳入决算编制范围，认真审核汇总本部门决算，确保数据完整、真实、准确，不得多报、少报、漏报。\"\n  },\n  {\n    \"法规名称\"\
    : \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十五条\",\n    \"内容概述\": \"\
    编制决算草案，必须符合"
- expression: ABS((银行对账单.收款金额与付款给委托方的记录 - 收入支出明细表.非税收入决算数) / 银行对账单.收款金额与付款给委托方的记录) > 0.05 || (银行对账单.收款金额与付款给委托方的记录 > 0 &&
    非税收入一般缴款书.票据存根缺失)
  description: 该表达式判定两种违规场景：1. 将单位所有银行账户收到的疑似非税收入资金，与财务账面及上缴财政的票据进行比对，若资金流入与确认收入总额偏差率绝对值超过5%，视为异常，可能存在资金滞留或挪用，即少计收入。2. 若银行账户存在疑似非税收入性质的收款记录，但审计无法获取对应的非税收入一般缴款书存根，直接判定为隐匿收入。
  audit_item: 决算报表内容不真实
  suspicion: 隐匿非税收入导致决算少计
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十六条\",\n    \"内容概述\": \"政府的全部收入应当上缴国家金库，任何部门、单位和个人不得截留、占用、挪用或者拖欠。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n\
    \    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"财政收入执收单位及其工作人员有违反规定设立财政收入项目、擅自改"
- expression: (原始凭证.原始单据（如学费票据、合同）日期 > 原始凭证.记账凭证做账日期) && (原始凭证.记账凭证做账日期 >= 明细表.确认期间（或记账日期）) || (合同协议.合同约定的服务期/产品交付期/学籍所属期
    > 明细表.确认期间（或记账日期） && 明细表.收入来源 > 明细表.确认金额)
  description: 表达式包含两种风险判断逻辑：1. 原始业务单据（如学费票据）开具日期在未来（下一年度），而记账凭证将其提前到本决算年度进行确认，这违反了权责发生制原则。2. 依据合同约定，收入对应的服务、商品交付主要发生在下一年度（如下学期学费），但在本年度决算中一次性或分期确认了大额收入，且缺乏合理的完工进度证据，判定为提前确认。重点关注年末12月份及次年1月的大额收入凭证。
