name: audit/数据表格类/使用表
type: model
description: 从数据表格类类文档（使用表）中提取结构化元数据。涵盖字段如：剩余使用年限计算值、剩余库容、填埋标高、实际完成进度、已填埋量、每日填埋量、计划完成进度、设计总库容。文档范围包括：填埋场容量使用表、建设进度与资金使用表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 使用表
  member_count: 1
  member_details:
  - 填埋场容量使用表
  - 建设进度与资金使用表
output:
  fields:
  - name: 剩余使用年限计算值
    type: string
    description: 提取 剩余使用年限计算值 的文本值
  - name: 剩余库容
    type: string
    description: 提取 剩余库容 的文本值
  - name: 填埋标高
    type: string
    description: 提取 填埋标高 的文本值
  - name: 实际完成进度
    type: string
    description: 提取 实际完成进度 的文本值
  - name: 已填埋量
    type: string
    description: 提取 已填埋量 的文本值
  - name: 每日填埋量
    type: string
    description: 提取 每日填埋量 的文本值
  - name: 计划完成进度
    type: string
    description: 提取 计划完成进度 的文本值
  - name: 设计总库容
    type: string
    description: 提取 设计总库容 的文本值
  - name: 资金到位及支付
    type: string
    description: 提取 资金到位及支付 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 采购合同.实际采购设备品牌型号 NOT IN 设计建设标准及设备型号及功能要求.设备型号及功能要求 OR 使用表.实际完成进度<使用表.计划完成进度*80% OR 维修记录.故障次数>同类型设施行业平均故障次数*3
    OR 资金支付流向缺乏对应采购合同
  description: 完工进度严重滞后、设备以普通充智能、质量缺陷导致异常高故障率，或资金支付与建设内容不匹配，均构成疑点。故障倍数及进度偏差阈值参考建设项目管理常规审计指标。
  audit_item: 现代农业产业园（集群、强镇）规划、设计、立项不科学
  suspicion: 现代农业产业园基础设施虚报或建设不达标
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十四条\"\
    ,\n    \"内容概述\": \"项目单位应当按照有关规定和批复的建设内容、建设规模、建设标准等进行建设，不得擅自增加或减少建设内容。\"\n  }\n]"
