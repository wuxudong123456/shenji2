name: audit/数据表格类/监控表
type: model
description: 从数据表格类类文档（监控表）中提取结构化元数据。涵盖字段如：压减方式、发票号、受托支付对象、工商注销通知书文号、已完成压减数、市场价格、执行启动时间、穿透后的实际控制层级及剩余企业数。文档范围包括：仓单质押业务风险预警监控表、法人户数压减动态监控表、贷款资金流向监控表、预算执行进度监控表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 票据
- 金额
- 预算
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 监控表
  member_count: 1
  member_details:
  - 仓单质押业务风险预警监控表
  - 法人户数压减动态监控表
  - 贷款资金流向监控表
  - 预算执行进度监控表
output:
  fields:
  - name: 压减方式
    type: string
    description: 提取 压减方式 的文本值
  - name: 发票号
    type: string
    description: 提取 发票号 的文本值
  - name: 受托支付对象
    type: string
    description: 提取 受托支付对象 的文本值
  - name: 工商注销通知书文号
    type: string
    description: 提取 工商注销通知书文号 的文本值
  - name: 已完成压减数
    type: string
    description: 提取 已完成压减数 的文本值
  - name: 市场价格
    type: number
    description: 提取 市场价格 的数值（含单位，如万元、吨等）
  - name: 执行启动时间
    type: date
    description: 提取 执行启动时间 的日期值，格式 YYYY-MM-DD
  - name: 穿透后的实际控制层级及剩余企业数
    type: string
    description: 提取 穿透后的实际控制层级及剩余企业数 的文本值
  - name: 货值评估基准价
    type: string
    description: 提取 货值评估基准价 的文本值
  - name: 质押率
    type: string
    description: 提取 质押率 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 预算执行率
    type: number
    description: 提取 预算执行率 的数值（含单位，如万元、吨等）
  - name: 预算批复时间
    type: date
    description: 提取 预算批复时间 的日期值，格式 YYYY-MM-DD
  - name: 预警阈值
    type: string
    description: 提取 预警阈值 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ${规定时限、实际批复时间.实际批复时间} > ${规定的截止日期.规定的截止日期}
  description: 当对所属单位预算的实际批复日期晚于法规或上级部门明文规定的最晚批复日期时，触发违规判定。规定时限通常为人大批准预算后20日内向本级部门批复，部门在接到批复后15日内向所属单位批复。实际批复时间取批复文件日期或签收记录中的较晚者，任何超期均视为违规。
  audit_item: 违规批复预算
  suspicion: 未按规定时限批复所属单位预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第五十二条\",\n    \"内容概述\": \"各级预算经本级人民代表大会批准后，本级政府财政部门应当在二十日内向本级各部门批复预算。各部门应当在接到本级政府财政部门批复的本部门预算后十五日内向所属各单位批复预算。\"\
    \n  }\n]"
- expression: (监控表.压减方式 == "注销" && 监控表.工商注销通知书文号 == null) || (已标识为压减完成 && 监控表.穿透后的实际控制层级及剩余企业数 > 目标层级数 && 穿透后仍存在关联业务往来)
  description: 表达式筛查两类核心造假情形：1.上报通过“注销”方式完成压减，但在工商系统中未查到注销公告，无法提供注销凭证；2.虽然名义上完成了层级或户数压减，但通过穿透股权结构发现其实际控制的企业层级并未减少，或“已注销”企业仍有开票、资金流水等经营行为。
  audit_item: 国有企业重点改革任务推进方面存在的问题
  suspicion: 法人层级压缩不力存在“假注销、真存续”壳公司
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推动国有企业改革压缩管理层级减少法人户数的指导意见\",\n    \"法规文号\": \"国资发改革〔2017〕42号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二条、第四条\",\n    \"内容概述\": \"明确清理整合目标任务，有效压缩管理层级，减少法人户数，消除‘壳公司’，坚决防止已清理企业‘死灰复燃’。\"\n  }\n]"
- expression: 监控表.受托支付对象 = 贷款合同.借款方 && (ABS = 0 || 贷款合同.贷款金额 > 税申报表.销售收入 * 0.5) && 评估报告.评估价值 > 0
  description: 贷款资金支付给关联虚构供应商，且申请材料中贸易合同规模远超实际经营能力，抵押物价值虚高，三者结合判定骗取贷款。
  audit_item: 资金管理方面存在的问题
  suspicion: 虚构贸易背景套取贷款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百七十五条之一\"\
    ,\n    \"内容概述\": \"以欺骗手段取得银行或者其他金融机构贷款，给银行或者其他金融机构造成重大损失的，构成骗取贷款罪。\"\n  }\n]"
- expression: ( (业务台账.资金收付时间 - 业务台账.货权转移时间 > 180天) AND (业务台账.客户名称 为 新成立空壳公司) ) OR ( 监控表.质押率 > 0.7 AND 监控表.货值变动率 < -10% ) OR
    ( 对比表.对外担保总额 / 对比表.净资产 > 0.5 ) OR ( 同一质押登记编号 出现在多份合同的质押协议中 )
  description: 该表达式从四个方面筛查：①融资性贸易周转天数远超行业合理水平（超过180天）且交易对手为无实质性经营的空壳公司，表明贸易背景虚假；②仓单质押率超过70%且对应货物市场价格跌幅超过10%，已突破风险预警线，担保效力严重不足；③对外担保总额超过企业净资产的50%，违反上市公司或国有企业担保限额规定；④存在“一女多嫁”现象，同一批货物仓单被重复质押给不同银行。任一条件触发即属严重违规。
  audit_item: 违规进行重大资本运作及高风险投资
  suspicion: 违规开展融资性贸易或仓单质押业务
  regulation: "[\n  {\n    \"法规名称\": \"关于规范上市公司对外担保行为的通知\",\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第一条\",\n    \"内容概述\": \"上市公司对外担保总额不得超过最近一个会计年度经审计净资产的50%，超过该限额须经特别决议，并履行信息披露义务。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于加强中央企业融资性贸易业务管控有关事项的通知\",\n    \"法规文号\": \"国资发财评规〔2017〕327号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二点\",\n\
    \    \""
