name: audit/数据表格类/统计表
type: model
description: 从数据表格类类文档（统计表）中提取结构化元数据。涵盖字段如：500米服务半径覆盖率、GPS定位记录、一般性转移支付占比、上年度收入额、上年度覆盖率、上年末结转余额、上报企业利用量、上报参与人数。文档范围包括：三公经费支出统计表、三无船舶查扣处置统计表、不足100人小规模学校学生人数统计表、业务区域覆盖统计表、中方陪同人员职务统计表、临时救助资金使用情况统计表、为农服务创新举措实施统计表、主业与非主业投资项目分类统计表、乡村医生人员配备统计表、乡村医生待遇发放异常情况统计表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
