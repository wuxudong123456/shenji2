name: audit/数据表格类/追溯表
type: model
description: 从数据表格类类文档（追溯表）中提取结构化元数据。涵盖字段如：各环节审批意见、签字人员及职务。文档范围包括：审批流程追溯表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 审批
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 追溯表
  member_count: 1
  member_details:
  - 审批流程追溯表
output:
  fields:
  - name: 各环节审批意见
    type: string
    description: 提取 各环节审批意见 的文本值
  - name: 签字人员及职务
    type: string
    description: 提取 签字人员及职务 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 对照表.差异说明 IN (产业目录版本.淘汰类条目明细) && 审批清单.审批状态 == '已批准/核准' && 批复文件.批复结论 > 产业目录版本.准入能耗/排放限值
  description: 将项目申报的产业类别与国家发布的《产业结构调整指导目录》淘汰类目录进行精确比对，若匹配淘汰类条目且在此期间获得审批通过，则直接判定为违规。表达式考虑了政策时效性，只有当批复在政策生效后仍违规批准才触发。
  audit_item: 批准、核准建设不符合国家有关规定的建设项目
  suspicion: 批准建设列入国家淘汰类产业目录的项目
  regulation: "[\n  {\n    \"法规名称\": \"产业结构调整指导目录（最新版本）\",\n    \"法规文号\": \"国家发展和改革委员会令第29号（示例）\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三类 淘汰类 说明部分\",\n    \"内容概述\": \"淘汰类项目禁止投资，各金融机构不得发放贷款，土地管理、城乡规划、环境保护、消防、海关等部门不得办理相关手续。\"\n  },\n  {\n\
    \    \"法规名称\": \"企业投资项目核准和备案管理条例\",\n    \"法规文号\": \"国务院令第673号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条\",\n \
    \   \"内容"
