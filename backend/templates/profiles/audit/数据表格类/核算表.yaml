name: audit/数据表格类/核算表
type: model
description: 从数据表格类类文档（核算表）中提取结构化元数据。涵盖字段如：单方造价、年度收益总额、年度累计排放量、总成本、月度实际排放量、注入比例、注入金额。文档范围包括：建设工程成本核算表、污染物排放总量核算表、注入比例核算表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 核算表
  member_count: 1
  member_details:
  - 建设工程成本核算表
  - 污染物排放总量核算表
  - 注入比例核算表
output:
  fields:
  - name: 单方造价
    type: string
    description: 提取 单方造价 的文本值
  - name: 年度收益总额
    type: date
    description: 提取 年度收益总额 的日期值，格式 YYYY-MM-DD
  - name: 年度累计排放量
    type: date
    description: 提取 年度累计排放量 的日期值，格式 YYYY-MM-DD
  - name: 总成本
    type: string
    description: 提取 总成本 的文本值
  - name: 月度实际排放量
    type: string
    description: 提取 月度实际排放量 的文本值
  - name: 注入比例
    type: number
    description: 提取 注入比例 的数值（含单位，如万元、吨等）
  - name: 注入金额
    type: number
    description: 提取 注入金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (原始记录.实际排放浓度 > 许可证.许可排放浓度限值) || (核算表.年度累计排放量 > 许可证.核定年度排放总量) || (原始记录.污染物种类 NOT IN 许可证.允许排放污染物种类)
  description: 任一种超限行为均构成违规：浓度超标、总量超限、排放未许可的污染物种类。阈值直接对照许可证数值，超过即触发。
  audit_item: 污染防治攻坚战存在的问题
  suspicion: 超排污许可证规定排放废水
  regulation: "[\n  {\n    \"法规名称\": \"排污许可管理条例\",\n    \"法规文号\": \"国务院令第736号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十七条\",\n    \"内容概述\": \"排污单位应当遵守排污许可证规定，按照生态环境管理要求运行和维护污染防治设施，建立环境管理制度，严格控制污染物排放。\"\n  }\n]"
- expression: (注入比例核算表.注入金额 / 注入比例核算表.年度收益总额 < 0.2) || EXISTS (SELECT 1 FROM 基金账户银行流水, 基金注入记录 WHERE 基金账户银行流水.交易摘要 = '转出' AND
    基金账户银行流水.金额 = 基金注入记录.实际注入基金账户金额 AND 基金账户银行流水.交易日期 > 基金注入记录.入账日期 AND 基金账户银行流水.交易日期 <= 基金注入记录.入账日期 + 5)
  description: 注入比例低于20%直接认定违规；若银行流水显示资金注入后短期内（5日）转出至原账户或关联方，视为虚假注资，同样构成违规。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 合作发展基金未按不低于20%比例注入
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"当年社有资产收益按不低于20%的比例注入本级供销合作社合作发展基金。\"\n  }\n]"
- expression: (验收报告.实际竣工面积 > 90) || (登记表.单套售价 > 核定文件.核定单价上限 * 1.05) || (核算表.单方造价超出当地经适房造价指导标准30%以上)
  description: 经济适用住房建设须严格执行面积标准（一般不超过90平方米）和价格核定。若单套面积超标、销售价突破核定上限或建设成本异常偏高，即触发疑点。采用超面积、溢价超5%、成本超指导标准30%等量化阈值判定。
  audit_item: 违规集资合作建房
  suspicion: 未按经济适用住房规定建设或销售
  regulation: "[\n  {\n    \"法规名称\": \"经济适用住房管理办法\",\n    \"法规文号\": \"建住房〔2007〕258号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条、第二十条\",\n    \"内容概述\": \"经济适用住房单套建筑面积控制在60平方米左右，政府应根据情况确定建设规模和各种套型比例；销售价格以保本微利为原则，实行政府指导价，不得擅自提价。\"\n  }\n]"
