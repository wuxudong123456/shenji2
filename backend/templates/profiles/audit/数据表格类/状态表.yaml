name: audit/数据表格类/状态表
type: model
description: 从数据表格类类文档（状态表）中提取结构化元数据。涵盖字段如：养老险停缴日期、出租合同、办理状态、员工编号、处置方式、手续类型、是否纳入清单、村庄名称。文档范围包括：应编尽编村庄规划清单完成状态表、社保系统退休人员参保状态表、闲置校舍资产利用状态表、项目前期要件办理状态表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 合同
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 状态表
  member_count: 1
  member_details:
  - 应编尽编村庄规划清单完成状态表
  - 社保系统退休人员参保状态表
  - 闲置校舍资产利用状态表
  - 项目前期要件办理状态表
output:
  fields:
  - name: 养老险停缴日期
    type: date
    description: 提取 养老险停缴日期 的日期值，格式 YYYY-MM-DD
  - name: 出租合同
    type: string
    description: 提取 出租合同 的文本值
  - name: 办理状态
    type: boolean
    description: 提取 办理状态 的布尔值（是/否）
  - name: 员工编号
    type: string
    description: 提取 员工编号 的文本值
  - name: 处置方式
    type: string
    description: 提取 处置方式 的文本值
  - name: 手续类型
    type: string
    description: 提取 手续类型 的文本值
  - name: 是否纳入清单
    type: boolean
    description: 提取 是否纳入清单 的布尔值（是/否）
  - name: 村庄名称
    type: string
    description: 提取 村庄名称 的文本值
  - name: 村庄编码
    type: string
    description: 提取 村庄编码 的文本值
  - name: 租金收入
    type: number
    description: 提取 租金收入 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 投资计划申请表.申报日期 < 前期手续文件.批复日期（针对任一必需要件） || 要件办理状态 = '未完成'
  description: 投资计划申报日期必须晚于所有法定前置审批手续（如可研、环评、用地等）的批准日期，若申报时任一要件状态为“未完成”或申报日期早于批复日期，即构成违规。
  audit_item: 项目计划申报不合规
  suspicion: 前期手续不完备即申报涉农投资计划
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条、第二十条\"\
    ,\n    \"内容概述\": \"项目单位应当依法办理相关前期审批手续，项目达到规定的开工条件后方可开工建设；申报投资计划时应当已完成可行性研究报告批复及必要的环评等手续。\"\n  }\n]"
- expression: (员工编号、缴纳时间、缴纳金额.缴纳时间 > 员工编号、入职日期、退休日期、职务状态.退休日期 AND 员工编号、入职日期、退休日期、职务状态.退休日期 IS NOT NULL) OR (员工编号、缴纳时间、缴纳金额.缴纳时间
    >= 员工编号、养老金发放日期.养老金发放日期)
  description: 当公积金缴纳时间晚于员工退休日期，或养老金已发放后仍有公积金缴纳记录，即判定为违规。退休日期以员工基本信息表记录为准，养老金发放日期作为补充验证。两条子条件为“或”关系，任一成立即触发疑点。
  audit_item: 退休人员未停缴住房公积金
  suspicion: 退休人员未停缴住房公积金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二十四条\",\n    \"内容概述\": \"职工离休、退休的，可以提取住房公积金账户内的存储余额，同时注销账户。退休后不再缴存住房公积金。\"\n  },\n  {\n    \"法规名称\": \"关于住房公积金管理若干具体问题的指导意见\"\
    ,\n    \"法规文号\": \"建金管〔2005〕5号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条第（一）款\",\n    \"内容概述\": \"职工离退休"
