name: audit/数据表格类/预算报表
type: model
description: 从数据表格类类文档（预算报表）中提取结构化元数据。涵盖字段如：单位名称、预算合并标记。文档范围包括：预算报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 预算
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 预算报表
  member_count: 1
  member_details:
  - 预算报表
output:
  fields:
  - name: 单位名称
    type: string
    description: 提取 单位名称 的文本值
  - name: 预算合并标记
    type: number
    description: 提取 预算合并标记 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
