- expression: (退捕渔民信息登记台账.已建档渔民数 / 退捕渔民建档立卡工作制度.应建档渔民总数 * 100 < 100) && (DATEDIFF(CURRENT_DATE, 退捕渔民建档立卡工作制度.建档立卡截止日期, 'day')
    > 30)
  description: 在建档立卡制度规定的截止日期之后，若实际建档完成率仍未达到100%，且超期天数超过30天，即判定为未按时完成。建档完成率=已建档数÷应建档总数×100%。
  audit_item: 任务目标未按时完成
  suspicion: 未按时完成退捕渔民建档立卡工作
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农办计财〔2019〕8号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条“精准识别退捕渔船渔民”\",\n    \"内容概述\": \"要求各地对退捕渔船和渔民进行精准识别，建档立卡，做到一船一档、一户一档，为实施补偿和转产安置提供依据。\"\
    \n  }\n]"
- expression: NVL(退捕渔民信息登记台账.已建档数量, 0) / 退捕渔民建档立卡工作制度.应建档总数 < 1.0 && SYSDATE > 分阶段禁捕目标的时间节点安排表.建档完成截止日期 && 延期申请或未完成情况说明文件.有效延期批复
    IS NULL
  description: 截至规定截止日期，实际建档数量未达到应建档总数，且无经批准的延期手续，即构成未按时完成。若建档率低于90%或虚假建档（如身份证重复率>0.5%），判定为严重违规。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 未按时完成退捕渔民建档立卡工作
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"无明确条款\",\n    \"内容概述\": \"要求抓紧完成退捕渔民建档立卡工作，确保信息准确完整，为后续补偿和安置提供依据。\"\n  }\n]"
- expression: (SUM(实际收费记录.实际穴位费,实际收费记录.实际管理费,实际收费记录.实际其他收费项目) > SUM(批复文件.穴位费单价上限,批复文件.管理费单价上限)) || ( (收支凭证.总收入 - 收支凭证.运营支出)
    / 收支凭证.运营支出 > 0.1 )
  description: 当实际各项收费总和超过物价部门批复的最高标准，或根据财务凭证计算的成本利润率超过10%（非营利组织通常控制在5%以内，10%为异常阈值）时，判定存在以公益性名义违规营利的疑点。
  audit_item: 农村公益性殡葬政策未有效落实
  suspicion: 农村公益性公墓违规营利性收费
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推动殡葬改革促进殡葬事业发展的指导意见\",\n    \"法规文号\": \"民发〔2018〕5号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第（六）条\",\n    \"内容概述\": \"加强农村公益性墓地建设管理，坚持公益性，不以营利为目的。收费标准由物价部门会同民政部门合理核定，不得随意提价或变相收费。\"\n  }\n]"
- expression: (宣传覆盖率、群众知晓率（如有）.宣传覆盖率 < 80%) || (宣传方式、覆盖村数.开展次数 = 0) || (专项补贴收入、实际支出、专项资金预算额、实际支出额、结余额.专项资金结余率 > 0.5 && 投诉内容中涉及加价收费的记录、反映不知晓政策的投诉记录.申领人数
    / 应保人数 < 0.3)
  description: 宣传覆盖村（社区）比例低于80%、全年无宣传实施记录，或殡葬补贴专项资金年底结余率超过50%且实际申领补贴的困难群众比例低于30%时，判定为宣传不到位，导致政策知晓率低、执行率低。
  audit_item: 农村公益性殡葬政策未有效落实
  suspicion: 殡葬惠民政策宣传执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推动殡葬改革促进殡葬事业发展的指导意见\",\n    \"法规文号\": \"民发〔2018〕5号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第（五）条\",\n    \"内容概述\": \"加大宣传引导力度，深入解读殡葬改革政策和惠民殡葬措施，提高群众知晓率和参与度，确保政策家喻户晓。\"\n  }\n]"
- expression: (勘察记录.在用面积/情况表.规划可出租面积 < 60%) || (情况表.转租记录/情况表.规划可出租面积 > 10%) || (规划.土地性质证明缺失)
  description: 入驻率=已签约入驻返乡创业企业实际使用面积/园区规划可出租面积，低于60%视为园区闲置严重；违规转租指将创业园场地出租给非返乡创业项目或非创业者自营项目，转租面积占比超10%视为严重改变用途；缺少土地性质合规审批或规划许可视为建设程序违规。
  audit_item: 农民工返乡创业政策实施不到位
  suspicion: 返乡创业园建设不合规
  regulation: "[\n  {\n    \"法规名称\": \"关于结合新型城镇化开展支持农民工等人员返乡创业试点工作的通知\",\n    \"法规文号\": \"发改就业〔2015〕2811号\",\n    \"效力级别\"\
    : \"部门规范性文件\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"试点地区建设的返乡创业园要专门用于支持返乡创业项目，不得擅自改变用途或将场地转租给非返乡创业主体。\"\n  }\n]"
