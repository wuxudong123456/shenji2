violations:
- expression: (当前年份 - 支出标准体系建设相关制度文件.标准最近修订年份 > 3) && (支出标准与实际费用对比分析表.差异率绝对值 > 0.3)
  description: 当支出标准超过3年未修订，且实际支出与标准差异率超过30%时，表明标准明显脱离实际，可能已失效，导致预算约束不足或资源浪费。差异率 = ABS(实际支出 - 标准金额) / 标准金额。
  audit_item: 预算编制不科学
  suspicion: 支出标准设定不合理或更新严重滞后
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"制度文件\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"科学合理制定和调整支出标准，建立支出标准动态调整机制。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\"\
    : \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十八条\",\n    \"内容概述\": \"各部门、各单位应当根据支出标准和预算项目需求编制本部门、本单位预算。\"\
    \n  }\n"
- expression: 资金拨付明细.收款单位 NOT IN (部门年度预算批复文件.预算单位) AND (SELECT COUNT(*) FROM 预算调整审批记录 WHERE 调入单位 = 资金拨付明细.收款单位 AND 调剂金额 =
    资金拨付明细.金额 AND 财政部批复文号 IS NOT NULL) = 0
  description: 筛查收款单位为非预算单位、下属单位或其他部门的资金拨付记录，若无法匹配到经财政部审批的预算调剂批复，即判定为违规。排除正常政府采购、工资发放等常规支出后，重点关注大额、异常转账。
  audit_item: 预算调剂不规范
  suspicion: 未经批准在部门内外调剂预算资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"2018年修正版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第七十三条\",\n    \"内容概述\": \"各级政府、各部门、各单位的支出必须以经批准的预算为依据，未列入预算的不得支出。各部门、各单位应当加强对预算支出的管理，严格执行预算和财政制度，不得擅自扩大支出范围、提高开支标准。\"\n\
    \  },\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第七十二条\""
- expression: 预算执行情况表.功能科目代码 != 部门年度预算批复文件.功能科目代码 AND (SELECT COUNT(*) FROM 预算调整审批记录 WHERE 原科目 = 部门年度预算批复文件.功能科目代码 AND 新科目
    = 预算执行情况表.功能科目代码 AND 金额 = 预算执行情况表.支出金额 AND 财政部批复文号 IS NOT NULL) = 0
  description: 比对每一笔支出的实际执行功能科目与预算批复的功能科目，若二者不一致且未找到对应的财政部批准调剂记录，则触发违规。重点关注“类”“款”“项”层级科目的交叉调整。
  audit_item: 预算调剂不规范
  suspicion: 未经批准在功能分类科目间调剂预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第七十二条\",\n    \"内容概述\": \"各部门、各单位的预算支出应当按照本级政府财政部门批复的预算科目和数额执行，不得挪用；确需调剂使用的，应当按照国家有关规定报经本级政府财政部门批准。\"\n  }\n]"
- expression: (情况表.累计到位率 < 80% && 日期差(系统日期, 项目计划开工日期) > 90天) || (政策文件.政策发布日期 > 项目融资招标公告日期 + 30天 && 项目.资金筹措状态 = '未完成')
  description: 财政资金到位率低于80%且项目开工超3个月未补足，或金融扶持政策出台时间明显晚于项目融资需求节点（晚于招标公告30天以上），这两种情况均表明政策工具与项目需求时间窗口错配，直接导致资金断档、工程款拖欠乃至停工。
  audit_item: 违反建设管理相关政策规定-重大工程项目推进缓慢
  suspicion: 财政金融政策与重大项目需求错配导致建设资金断档
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条、第二十二条\"\
    ,\n    \"内容概述\": \"政府投资应与经济社会发展水平和财政收支状况相适应，不得由施工单位垫资建设。财政部门应当根据批准的预算，按照法律、行政法规和国库管理的有关规定，及时、足额办理政府投资资金拨付。\"\n  }\n]"
- expression: (实收资本金累计到位总额 / 项目总投资额) < 政策文件中对应项目所属行业的最低资本金比例要求
  description: 计算项目实际资本金比例（实收资本金/项目总投资），若该比例低于国务院及相关部委发布的行业最低资本金比例标准，则判定为违规。阈值标准依据《国务院关于加强固定资产投资项目资本金管理的通知》等文件。
  audit_item: 项目资本金不符合要求
  suspicion: 项目最低资本金比例不符合规定
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于加强固定资产投资项目资本金管理的通知\",\n    \"法规文号\": \"国发〔2019〕26号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"进一步完善投资项目资本金制度，明确规定了港口、沿海及内河航运、机场、铁路、公路、房地产开发等多个行业和领域投资项目的最低资本金比例。\"\n  }\n]"
- expression: (项目资本金到位情况表.实际到位时间 > 资本金到位计划文件.计划到位时间节点) || (项目资本金到位情况表.实际到位金额 < 资本金到位计划文件.计划到位金额)
  description: 比较资本金实际到位的时间与金额是否满足计划要求。任一不满足（时间滞后或金额不足）均判定为违规。这反映了出资方未履行出资协议约定。
  audit_item: 项目资本金不符合要求
  suspicion: 资本金未按计划进度和数额到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"中华人民共和国主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"股东应当按期足额缴纳公司章程中规定的各自所认缴的出资额。\"\n  }\n]"
- expression: (首笔工程款支付凭证.支付日期 < 项目资本金到位情况表.首笔资本金到位时间) || (项目施工许可证.发证日期 < 项目资本金到位情况表.首笔资本金到位时间)
  description: 若项目开始建设（以取得施工许可证或支付首笔工程款为标志）的日期，早于项目资本金首次到位的时间，则判定为“未落实资本金就进行建设”的违规行为。
  audit_item: 项目资本金不符合要求
  suspicion: 项目未落实资本金即开工建设
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于加强固定资产投资项目资本金管理的通知\",\n    \"法规文号\": \"国发〔2019〕26号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"投资项目的资本金一次认缴，并根据批准的建设进度按比例逐年到位。项目开工建设前，项目资本金应到位一定比例。\"\n  }\n]"
- expression: (权益型/股权类金融工具使用情况表.金融工具出资总额 / 项目资本金总额) > 0.5
