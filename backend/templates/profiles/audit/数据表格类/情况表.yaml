name: audit/数据表格类/情况表
type: model
description: 从数据表格类类文档（情况表）中提取结构化元数据。涵盖字段如：专项补贴收入、专项资金预算额、二次分配去向、企业信用等级、企业名称、优惠类别、低保享受状态、低保资金年度预算金额。文档范围包括：产业园土地审批情况表、公共租赁住房租金缴纳情况表、养护资金延迟拨付情况表、养护资金缺口情况表、养殖场用地审批情况表、养殖场用电优惠执行情况表、农民工工资保证金缴纳情况表、参股企业投资收益回收情况表、基本农田林网建设达标情况表、审计发现问题整改落实情况表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 凭证
- 合同
- 补贴
- 金额
- 元数据提取
