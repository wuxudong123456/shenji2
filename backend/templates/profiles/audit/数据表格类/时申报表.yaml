name: audit/数据表格类/时申报表
type: model
description: 从数据表格类类文档（时申报表）中提取结构化元数据。涵盖字段如：培训起止日期、学员名单、申报课时数。文档范围包括：培训课时申报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 培训
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 时申报表
  member_count: 1
  member_details:
  - 培训课时申报表
output:
  fields:
  - name: 培训起止日期
    type: date
    description: 提取 培训起止日期 的日期值，格式 YYYY-MM-DD
  - name: 学员名单
    type: string
    description: 提取 学员名单 的文本值
  - name: 申报课时数
    type: string
    description: 提取 申报课时数 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 申报课时数 > (实际出勤天数 * 每日标准课时) && ABS(申报补贴金额 - (实际出勤人数 * 补贴标准/人)) > 0
  description: 当培训机构申报的培训课时数大于学员实际出勤天数乘以每日标准课时（如8课时），或按实际出勤人数计算的应补金额与实拨金额存在差异，即触发虚报疑点。严重违规：申报课时超出实际课时30%以上或申报人数超出实际签到人数20%以上。
  audit_item: 骗取、套取资金或补贴
  suspicion: 虚报培训课时骗取职业培训补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条、第十八条\",\n    \"内容概述\": \"职业培训补贴按照实际培训天数和补贴标准据实结算，培训机构不得虚报培训人数和培训时间骗取补贴资金。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"单位和个人有下列违反国家有关投资建设项目"
