name: audit/数据表格类/反馈表
type: model
description: 从数据表格类类文档（反馈表）中提取结构化元数据。涵盖字段如：分类参与满意度评分、反馈意见、反馈意见关键词、反馈问题数、执行状态、整改措施、整改状态、绩效挂钩情况。文档范围包括：满意度反馈表、绩效评价结果应用跟踪反馈表、群众反馈表、资金使用单位绩效评价结果应用反馈表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 整改
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 反馈表
  member_count: 1
  member_details:
  - 满意度反馈表
  - 绩效评价结果应用跟踪反馈表
  - 群众反馈表
  - 资金使用单位绩效评价结果应用反馈表
output:
  fields:
  - name: 分类参与满意度评分
    type: string
    description: 提取 分类参与满意度评分 的文本值
  - name: 反馈意见
    type: string
    description: 提取 反馈意见 的文本值
  - name: 反馈意见关键词
    type: string
    description: 提取 反馈意见关键词 的文本值
  - name: 反馈问题数
    type: string
    description: 提取 反馈问题数 的文本值
  - name: 执行状态
    type: boolean
    description: 提取 执行状态 的布尔值（是/否）
  - name: 整改措施
    type: string
    description: 提取 整改措施 的文本值
  - name: 整改状态
    type: boolean
    description: 提取 整改状态 的布尔值（是/否）
  - name: 绩效挂钩情况
    type: string
    description: 提取 绩效挂钩情况 的文本值
  - name: 评价结果
    type: boolean
    description: 提取 评价结果 的布尔值（是/否）
  - name: 负面反馈关键词
    type: string
    description: 提取 负面反馈关键词 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (汇总表.评价等次/得分 = '差' || 评价得分 < 60) && (明细表.下一年度预算安排金额 >= 明细表.本年度预算安排金额) || (存在绩效评价结果但未在预算安排文件中体现任何调整)
  description: 评价结果为“差”或得分低于60分的项目，下一年度预算应予以压减，若预算未减少或反而增加，即认定违规。不合理的应用包括未追责、未扣减预算等。
  audit_item: 财政转移支付资金政策绩效评价不规范
  suspicion: 绩效评价结果未有效应用于预算安排
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"绩效评价结果应当作为预算安排、完善政策和改进管理的重要依据。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\"\
    : \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价，并将评价结果作为改进管理和编制下一年度预算的依"
- expression: (制度文件.结果应用要求条款 IS NULL) || (反馈表.项目名称 IN (反馈表.项目名称) AND 反馈表.评价结果 < 60 AND 批示文件.决策内容 IS NULL) || (反馈表.执行状态 IS
    NULL OR 反馈表.执行状态 = '未执行')
  description: 从制度、决策、执行三个层面筛查结果应用机制缺失。制度层面检查是否建立了结果与预算挂钩的规定；决策层面检查评价结果是否真正上会讨论并形成决议；执行层面检查整改措施是否落地。任一层面的缺失均构成应用机制不健全的疑点。
  audit_item: 部门、单位绩效评价结果未得到有效应用
  suspicion: 绩效评价结果应用机制缺失
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"各级财政部门、预算部门和单位应建立健全绩效评价结果反馈制度和绩效问题整改责任制，将评价结果作为本部门、本单位编报预算、完善政策和改进管理的重要依据。\"\n  }\n]"
- expression: (实施方案文件缺失 || 实施方案中无具体时间表与任务分解) || (进度表.完成率 < 计划完成率 * 0.7) || (统计表.同比变化率 > -5% && 专项资金中无分类减量支出条目)
  description: 实施方案缺失或无明确时间表，或实际完成率低于计划的70%，或垃圾清运量无明显下降趋势（降幅小于5%）且未见资金投入，均判定为未有效开展或进展缓慢。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 垃圾分类减量工作未开展或进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国固体废物污染环境防治法》\",\n    \"法规文号\": \"主席令第四十三号（2020年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当加强农村生活垃圾污染环境的防治，推行生活垃圾分类制度，保护和改善农村人居环境。\"\n  }\n]"
- expression: (农村适应性分析专章.农民习惯调研内容 = '') || (投放时间合理性评分.总体满意度 < 60) || (智能设备日均扫码次数.智能设备日均扫码次数 < 10)
  description: 可行性研究未考虑农村实际，或村民满意度平均分低于60分，或智能设备日均使用次数低于10人次，表明处理模式脱离农民习惯，难以推行。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 分类处理模式照搬城市不符合农村实际
  regulation: "[\n  {\n    \"法规名称\": \"《农村人居环境整治提升五年行动方案（2021－2025年）》\",\n    \"法规文号\": \"厅字〔2021〕44号\",\n    \"效力级别\": \"\
    制度文件\",\n    \"条款号\": \"第二部分第（四）条\",\n    \"内容概述\": \"推进农村生活垃圾分类减量与利用，要因地制宜，结合农村特点和农民习惯，分类施策，不搞“一刀切”。\"\n  }\n]"
