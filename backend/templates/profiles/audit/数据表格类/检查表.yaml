name: audit/数据表格类/检查表
type: model
description: 从数据表格类类文档（检查表）中提取结构化元数据。涵盖字段如：检查项名称、缺项记录、规范性判断。文档范围包括：决算报表填报说明规范性检查表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 检查
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 检查表
  member_count: 1
  member_details:
  - 决算报表填报说明规范性检查表
output:
  fields:
  - name: 检查项名称
    type: string
    description: 提取 检查项名称 的文本值
  - name: 缺项记录
    type: string
    description: 提取 缺项记录 的文本值
  - name: 规范性判断
    type: string
    description: 提取 规范性判断 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (填报说明文本.必填章节清单 < 必填章节清单.必填章节清单) || (决算报表.变动率 > 0.2 AND 填报说明文本.特殊事项解释阈值规则 = '该支出项变动说明为空')
  description: 规范性判定依据两点：一是填报说明的结构完整性，若缺失模板规定的任意必填章节（如“重大事项说明”“主要指标变动说明”等），视为不规范；二是关键数据变动的解释充分性，当决算报表中任一支出科目的变动率超过20%（即ABS(本年支出-上年支出)/上年支出
    > 0.2）时，对应的填报说明中必须包含具体的变动原因说明，否则即为不规范。两项条件满足其一即触发疑点。
  audit_item: 决算报告编报事项不准确
  suspicion: 决算填报说明编报不符合规范性要求
  regulation: "[\n  {\n    \"法规名称\": \"部门决算管理制度\",\n    \"法规文号\": \"财库〔2013〕209号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"部门决算报表应当根据完整、核对无误的账簿记录和其他有关会计核算资料编制，做到数据真实准确、内容完整……部门决算填报说明应当按照财政部门规定的格式和要求编制，如实反映预算执行情况、财务管理状况和决算编制中需要说明的事项。\"\
    \n  }\n]"
