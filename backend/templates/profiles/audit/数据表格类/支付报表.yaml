name: audit/数据表格类/支付报表
type: model
description: 从数据表格类类文档（支付报表）中提取结构化元数据。涵盖字段如：累计已支付金额、累计已计量工程量。文档范围包括：计量支付报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 工程
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 支付报表
  member_count: 1
  member_details:
  - 计量支付报表
output:
  fields:
  - name: 累计已支付金额
    type: number
    description: 提取 累计已支付金额 的数值（含单位，如万元、吨等）
  - name: 累计已计量工程量
    type: string
    description: 提取 累计已计量工程量 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (投资台账.单项工程实际投资额 - 单项工程概算金额.单项工程概算金额 > 单项工程概算金额.单项工程概算金额 * 0.1) && (支付报表.累计已计量工程量 > 项目合同.合同工程量 * 1.1 || 支付报表.累计已支付金额
    > 项目合同.合同总价 * 1.1) && (申请单.费用增加金额 == null || 申请单.批复意见 != "同意")
  description: 单项工程实际投资超出概算10%以上，并且计量工程量或支付金额超出原合同10%以上，同时缺乏有效变更批复文件，判定为成本控制违规。10%阈值参照水利工程变更管理的一般规定，超出且未批可视为擅自扩大建设规模或提高标准。
  audit_item: 大型水利工程进度与成本审计
  suspicion: 成本超支项目未履行变更审批程序
  regulation: "[\n  {\n    \"法规名称\": \"水利工程建设项目管理暂行规定\",\n    \"法规文号\": \"水建[1995]128号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"建设项目投资必须严格控制在批准的概算范围内。确需调整概算的，必须按原审批程序报批。\"\n  },\n  {\n    \"法规名称\": \"水利工程设计变更管理暂行办法\"\
    ,\n    \"法规文号\": \"水规计[2012]93号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条、第十七条\",\n    \"内容概述\": \"重大设计变更及涉及投资增加的变更必"
