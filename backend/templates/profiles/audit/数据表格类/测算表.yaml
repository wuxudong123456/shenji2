name: audit/数据表格类/测算表
type: model
description: 从数据表格类类文档（测算表）中提取结构化元数据。涵盖字段如：上期损益调增/调减额、区域可回收物年理论产生量、参数取值、可变现净值、实际计算公式、对当期利润影响数、对期初留存收益影响数、影响金额合计。文档范围包括：会计政策变更影响数测算表、债务重组损益测算表、动态调整待遇金额的测算表（表4）、履约进度测算表、理论产生量测算表、跌价测算表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 测算表
  member_count: 1
  member_details:
  - 会计政策变更影响数测算表
  - 债务重组损益测算表
  - 动态调整待遇金额的测算表（表4）
  - 履约进度测算表
  - 理论产生量测算表
  - 跌价测算表
output:
  fields:
  - name: 上期损益调增-调减额
    type: string
    description: 提取 上期损益调增-调减额 的文本值
  - name: 区域可回收物年理论产生量
    type: string
    description: 提取 区域可回收物年理论产生量 的文本值
  - name: 参数取值
    type: string
    description: 提取 参数取值 的文本值
  - name: 可变现净值
    type: string
    description: 提取 可变现净值 的文本值
  - name: 实际计算公式
    type: string
    description: 提取 实际计算公式 的文本值
  - name: 对当期利润影响数
    type: string
    description: 提取 对当期利润影响数 的文本值
  - name: 对期初留存收益影响数
    type: string
    description: 提取 对期初留存收益影响数 的文本值
  - name: 影响金额合计
    type: number
    description: 提取 影响金额合计 的数值（含单位，如万元、吨等）
  - name: 期初留存收益调增-调减额
    type: string
    description: 提取 期初留存收益调增-调减额 的文本值
  - name: 测完进度百分比
    type: string
    description: 提取 测完进度百分比 的文本值
  - name: 测算方法
    type: string
    description: 提取 测算方法 的文本值
  - name: 测算方法及结果
    type: boolean
    description: 提取 测算方法及结果 的布尔值（是/否）
  - name: 确认日期
    type: date
    description: 提取 确认日期 的日期值，格式 YYYY-MM-DD
  - name: 确认的债务重组利得金额
    type: number
    description: 提取 确认的债务重组利得金额 的数值（含单位，如万元、吨等）
  - name: 累计影响数
    type: string
    description: 提取 累计影响数 的文本值
  - name: 计提金额
    type: number
    description: 提取 计提金额 的数值（含单位，如万元、吨等）
  - name: 预计售价
    type: string
    description: 提取 预计售价 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 明细表.债权人是否为关联方 == '关联方' && 重组协议.重组后债务公允价值 < 重组协议.原债务金额 && 样本.营业外收入金额 > 0
  description: 根据会计准则，与关联方发生的债务豁免，若交易不具有商业实质，其产生的利得应视为权益性交易，计入资本公积而非营业外收入。该表达式用于筛查将关联方债务豁免不当确认为利润的违规行为。若上述“且”条件同时满足，即触发疑点。
  audit_item: 未按规定核算收益及营业外收支
  suspicion: 虚构或不当确认债务重组收益
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第12号——债务重组\",\n    \"法规文号\": \"财会〔2019〕9号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十一条\",\n    \"内容概述\": \"将债务转为权益工具方式进行债务重组的，债务人应当在所清偿债务符合终止确认条件时予以终止确认。债务人初始确认权益工具时应当按照权益工具的公允价值计量。所清偿债务账面价值与权益工具确认金额之间的差额，应当计入当期损益。\"\
    \n  },\n  {\n    \"法规名称\": \"关于做好执行企业会计准则的企业2012年年报工作的通知\",\n    \"法规文号\": \"财会〔2012〕25"
- expression: 存货类别、库龄、跌价准备计提金额、入库日期、物料名称、数量、物料编码、期末数量、库存地点、账面成本、出入库单价、金额.账面成本 > 可变现净值、预计售价、计提金额.可变现净值 && 可变现净值、预计售价、计提金额.计提金额
    < (存货类别、库龄、跌价准备计提金额、入库日期、物料名称、数量、物料编码、期末数量、库存地点、账面成本、出入库单价、金额.账面成本 - 可变现净值、预计售价、计提金额.可变现净值)
  description: 存货成本高于可变现净值时，应当至少按差额计提跌价准备，若计提金额不足，则为低估跌价损失。同时，库龄超过1年且无近期销售的存货未计提，也视为疑似。
  audit_item: 未按规定核算资产
  suspicion: 存货跌价准备计提不充分
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"资产负债表日，存货应当按照成本与可变现净值孰低计量。存货成本高于其可变现净值的，应当计提存货跌价准备。\"\n  }\n]"
- expression: ABS(测完进度百分比.测完进度百分比 - 确认单.监理确认进度百分比) > 5% || (合同约定进度款比例 ≠ 分析表.预收账款余额与合同进度对应/合同总金额 且 按进度应确认收入未确认)
  description: 企业自行测算的履约进度与独立监理确认进度偏差超过5%，或已按进度收款却未相应确认收入，均提示履约进度核算违规。
  audit_item: 未按规定确认收入
  suspicion: 未在资产负债表日按履约进度确认收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"对于在某一时段内履行的履约义务，企业应当在该段时间内按照履约进度确认收入。\"\n  }\n]"
- expression: 累计实际发生成本预计合同总成本完工百分比.完工百分比 != ROUND(累计实际发生成本预计合同总成本完工百分比.累计实际发生成本 / 累计实际发生成本预计合同总成本完工百分比.预计合同总成本, 2) && ABS(累计实际发生成本预计合同总成本完工百分比.完工百分比
    - 测完进度百分比测算方法测算方法及结果.测完进度百分比) > 0.05 && 科目余额差额.科目余额差额
  description: 企业实际发生的累计成本占预计总成本的比例与账面确认的完工进度偏差超过5%，导致收入与成本不配比。
  audit_item: 未按规定确认收入
  suspicion: 未按完工进度及时确认建造合同收入并结转成本
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第15号——建造合同\",\n    \"法规文号\": \"财会[2006]3号（部分有效）\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十八条\",\n    \"内容概述\": \"在建造合同的结果能够可靠估计的情况下，企业应在资产负债表日按完工百分比法确认合同收入和合同费用。\"\n  }\n]"
- expression: (制度文件.变更条件 == '' || 审批记录.变更理由 不包含 '法律法规要求' && 审批记录.变更理由 不包含 '更可靠计量') && (审批记录 IS NULL || 审批记录.审批日期 > 实际执行日期)
    && (台账.同性质变更年度次数 > 1 || ABS(测算表.对当期利润影响数 / 上一会计年度净利润) > 0.05)
  description: 同时满足以下条件视为可疑：1.无准则允许的正当理由（如法律强制要求或能提供更可靠信息）；2.审批程序缺失或先执行后补批；3.变更频繁（一年内同一政策多次变更）或影响利润超过上年净利润5%。
  audit_item: 随意变更或未按规定变更会计政策、会计处理方法
  suspicion: 随意变更会计政策且无合理理由
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条、第六条\",\n    \"内容概述\": \"企业采用的会计政策，前后各期应当保持一致，不得随意变更；确需变更的，应当在变更原因符合准则规定（法律、行政法规或国家统一会计制度等要求，或变更能提供更可靠、更相关的会计信息）时方可变更，并履行相应审批程序。\"\
    \n  }\n]"
- expression: (测算表.累计影响数 <> 0 && (比较报表.期初未分配利润调整额 != 测算表.期初留存收益调减额 || 比较报表.上期损益调整额 == 0)) || (测算表.累计影响数 <> 0 && 附注.追溯调整披露内容
    IS NULL)
  description: 若变更存在影响数但比较报表期初未分配利润或上期损益未同步调整，或附注未披露任何追溯调整信息，则触发疑点。允许小额差异（因计算尾差），但偏差绝对值超过利润总额1%需重点核查。
  audit_item: 随意变更或未按规定变更会计政策、会计处理方法
  suspicion: 会计政策变更未按规定追溯调整前期数据
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第七条、第十四条\",\n    \"内容概述\": \"会计政策变更采用追溯调整法，应当将累积影响数调整列报前期最早期初留存收益，其他相关项目的期初余额和列报前期披露的其他比较数据也应当一并调整；并在附注中披露追溯调整对前期相关损益、权益项目的影响金额。\"\
    \n  }\n]"
- expression: 对照表.变更性质 == '否' || 对照表.变更原因 == '否' || 对照表.影响金额 == '否' || (测算表.累计影响数 <> 0 && 附注.影响金额描述 IS NULL) || (附注.披露内容 包含
    '无重大影响' && 测算表.累计影响数 / 总资产 > 0.01)
  description: 对照表中准则要求披露的四大项（性质、原因、影响金额、无法追溯原因）任一项未披露，即触发疑点；或附注声称无重大影响，但测算表显示影响金额超过总资产1%，属于披露不充分。
  audit_item: 随意变更或未按规定变更会计政策、会计处理方法
  suspicion: 会计政策变更未在财务报告附注中充分披露
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第30号——财务报表列报\",\n    \"法规文号\": \"财会〔2014〕7号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第三十九条\",\n    \"内容概述\": \"企业应当在附注中披露会计政策变更的性质、内容和原因，当期和各个列报前期财务报表中受影响的项目名称和调整金额；无法进行追溯调整的，说明该事实和原因以及开始应用变更后的会计政策的时点、具体应用情况。\"\
    \n  },\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\",\n    \"法规文号\": \"财会〔2006〕3号\",\n   "
- expression: (建设规划文件缺失 || 实际建成数量 < 建设规划.规划站点数量 * 0.5) || (运营台账.月均回收量 < 测算表.区域可回收物年理论产生量 * 0.2) || (专项资金中无再生资源回收相关支出)
  description: 无体系建设规划或建成率低于50%，或实际回收量远低于理论产生量的20%，或财政资金未对回收体系进行任何投入，即判定体系未实质建立。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 再生资源回收利用体系未建立
  regulation: "[\n  {\n    \"法规名称\": \"《再生资源回收管理办法》\",\n    \"法规文号\": \"商务部令2007年第8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"国家鼓励各类市场主体在城乡结合部和农村地区建立再生资源回收网络，拓展回收渠道。\"\n  }\n]"
- expression: 明细表.发放金额 > 测算表.实际计算公式 * 1.0 AND ABS(测算表.参数取值 - 政策文件.地方自行制定的补贴标准) > 0
  description: 将地方实际执行的计算基数或补贴标准与上级文件规定标准比对，若存在超出或擅自提高系数，即视为违规。计算金额基于上级标准重算，允许微小四舍五入误差。
  audit_item: 社会保障待遇计算、发放错误
  suspicion: 地方擅自提高残疾人补贴标准
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于全面建立困难残疾人生活补贴和重度残疾人护理补贴制度的意见\",\n    \"法规文号\": \"国发〔2015〕52号\",\n    \"效力级别\"\
    : \"行政法规\",\n    \"条款号\": \"三、补贴标准\",\n    \"内容概述\": \"残疾人两项补贴标准由省级政府统筹确定，并适时调整，但不得低于中央指导标准，地方不得随意提高标准造成财政负担压力过大。\"\n\
    \  }\n]"
