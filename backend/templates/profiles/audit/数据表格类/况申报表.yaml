name: audit/数据表格类/况申报表
type: model
description: 从数据表格类类文档（况申报表）中提取结构化元数据。涵盖字段如：企业性质、入职日期、兼职/任职机构名称、兼职单位/投资企业名称、姓名、工作人员姓名、职务、配偶姓名。文档范围包括：工作人员兼职/投资情况申报表、离职人员从业情况申报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 况申报表
  member_count: 1
  member_details:
  - 工作人员兼职/投资情况申报表
  - 离职人员从业情况申报表
output:
  fields:
  - name: 企业性质
    type: string
    description: 提取 企业性质 的文本值
  - name: 入职日期
    type: date
    description: 提取 入职日期 的日期值，格式 YYYY-MM-DD
  - name: 兼职-任职机构名称
    type: string
    description: 提取 兼职-任职机构名称 的文本值
  - name: 兼职单位-投资企业名称
    type: string
    description: 提取 兼职单位-投资企业名称 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 工作人员姓名
    type: string
    description: 提取 工作人员姓名 的文本值
  - name: 职务
    type: string
    description: 提取 职务 的文本值
  - name: 配偶姓名
    type: string
    description: 提取 配偶姓名 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (企业法人/高管信息对照表.任职起始日期 - 领导干部离职/退休信息登记表.离职日期) < 3年 && 离职人员从业情况申报表.企业性质 IN ('民营企业','外商投资企业','中介机构') && (工商登记信息.注册地址
    ∈ 领导干部离职/退休信息登记表.分管领域 OR 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围) && (社会兼职申报.审批结果 != '批准' OR 社会兼职申报.审批结果 IS NULL)
  description: 禁业期按通常3年设定；若任职起始日期与离职日期间隔小于1095天即为在禁业期内；企业性质须为民营企业、外商投资企业或中介机构之一；业务关联判定采用地区匹配或关键词重合（审计中可设定重合度阈值>60%）；若未履行审批手续或审批不通过即触发疑点。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规接受原管辖范围内企业聘任
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"公务员辞去公职或者退休的，原系领导成员的公务员在离职三年内，不得到与原工作业务直接相关的企业或者其他营利性组织任职，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n \
    \ {\n    \"法规名称\": \"关于进一步规范党政领导干部在企业兼职（任职）问题的意见\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": "
- expression: 况申报表.工作人员姓名 IN (审批文件.主要股东姓名) || 况申报表.配偶姓名 IN (审批文件.法定代表人姓名) || 决定书.关联人员 IN (况申报表.工作人员姓名)
  description: 将工作人员及其配偶申报信息与农药生产经营企业股东、法定代表人进行比对。如有重合,或者行政处罚案件中涉及该工作人员,则可能存在公职人员参与经营活动。
  audit_item: 农药生产经营管理不符合规定
  suspicion: 农业主管部门工作人员参与农药生产经营活动
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十二条\",\n    \"内容概述\": \"县级以上人民政府农业主管部门及其工作人员不得参与农药生产、经营活动;违反规定的,依法给予处分;构成犯罪的,依法追究刑事责任。\"\n  }\n]"
