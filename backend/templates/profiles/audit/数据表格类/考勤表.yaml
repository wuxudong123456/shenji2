name: audit/数据表格类/考勤表
type: model
description: 从数据表格类类文档（考勤表）中提取结构化元数据。涵盖字段如：参训人员名单、在岗时段、培训内容、管护人员出勤日期、考勤记录。文档范围包括：管护人员培训考勤表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 培训
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 考勤表
  member_count: 1
  member_details:
  - 管护人员培训考勤表
output:
  fields:
  - name: 参训人员名单
    type: string
    description: 提取 参训人员名单 的文本值
  - name: 在岗时段
    type: string
    description: 提取 在岗时段 的文本值
  - name: 培训内容
    type: string
    description: 提取 培训内容 的文本值
  - name: 管护人员出勤日期
    type: date
    description: 提取 管护人员出勤日期 的日期值，格式 YYYY-MM-DD
  - name: 考勤记录
    type: string
    description: 提取 考勤记录 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (制度发布文号.制度发布文号 == NULL) || (制度发布文号.责任主体 == NULL || 制度发布文号.责任主体 == "") || (拨付凭证.拨付项目名称 NOT LIKE "%管护%" && 拨付凭证.拨付项目名称
    NOT LIKE "%维护%") || (考勤表.参训人员名单 == NULL)
  description: 判定条件：1.未出台管护制度文件；2.制度中未明确管护责任主体；3.财政拨付中无任何后期管护专项经费；4.无管护人员培训记录。满足任一条件触发疑点，表明未建立管护机制。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 未建立厕所管护机制
  regulation: "[\n  {\n    \"法规名称\": \"关于推进农村“厕所革命”专项行动的指导意见\",\n    \"法规文号\": \"农社发〔2018〕2号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"要求各地建立健全长效管护机制，明确管护责任，落实管护经费，确保厕所建成后正常可持续运行。\"\n  }\n]"
- expression: (检查制度.清洁评分 < 60 || 检查制度.消毒记录 == NULL || COUNT(检查制度.检查日期) < 制度规定频次*0.7) || (公厕卫生投诉次数.公厕卫生投诉次数 > 3 && 处理结果 ==
    "未整改") || (考勤表.管护人员出勤日期 IS NULL)
  description: 判定条件：1.检查登记表评分低于60分或消毒记录缺失，或月检查次数低于制度规定频率的70%；2.投诉记录中卫生投诉超3次且未整改；3.管护人员无出勤记录。满足任一条件存在清扫缺失。
  audit_item: 厕所建后管护不到位、使用效果不佳
  suspicion: 公厕未定期清扫消毒
  regulation: "[\n  {\n    \"法规名称\": \"城市公共厕所管理办法\",\n    \"法规文号\": \"建设部令第9号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第十三条\",\n    \"内容概述\": \"公共厕所必须按规定时间、规定标准进行清扫、保洁和消毒，确保干净卫生。\"\n  }\n]"
