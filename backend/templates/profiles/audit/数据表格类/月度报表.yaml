name: audit/数据表格类/月度报表
type: model
description: 从数据表格类类文档（月度报表）中提取结构化元数据。涵盖字段如：区域、发现火点数、处理情况、实际并网电量、巡查覆盖村数、巡查频次、弃电率、理论发电量。文档范围包括：乡镇秸秆资源化利用月度报表、可再生能源消纳率月度报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 月度报表
  member_count: 1
  member_details:
  - 乡镇秸秆资源化利用月度报表
  - 可再生能源消纳率月度报表
output:
  fields:
  - name: 区域
    type: string
    description: 提取 区域 的文本值
  - name: 发现火点数
    type: string
    description: 提取 发现火点数 的文本值
  - name: 处理情况
    type: string
    description: 提取 处理情况 的文本值
  - name: 实际并网电量
    type: string
    description: 提取 实际并网电量 的文本值
  - name: 巡查覆盖村数
    type: string
    description: 提取 巡查覆盖村数 的文本值
  - name: 巡查频次
    type: string
    description: 提取 巡查频次 的文本值
  - name: 弃电率
    type: string
    description: 提取 弃电率 的文本值
  - name: 理论发电量
    type: string
    description: 提取 理论发电量 的文本值
  - name: 电源类型
    type: string
    description: 提取 电源类型 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 月度报表.弃电率 > 0.05
  description: 弃电率=（理论发电量-实际并网电量）/理论发电量。国家清洁能源消纳行动计划要求弃风率、弃光率控制在5%以内，超过即构成违规。弃电率>10%表明消纳问题严重，可能涉及电网调度歧视或接网工程滞后。
  audit_item: 农村用能清洁低碳转型不到位
  suspicion: 农村分布式可再生能源发电弃风弃光率超标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国可再生能源法\",\n    \"法规文号\": \"中华人民共和国主席令第三十三号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十四条、第二十九条\",\n    \"内容概述\": \"电网企业应当全额收购其电网覆盖范围内可再生能源并网发电项目的上网电量，并提供上网服务。未全额收购造成弃电的，属于违规。\"\n  }\n]"
- expression: (火点坐标、火点时间、火点强度、卫星火点坐标、火点影像等级.卫星火点坐标 NOT IN 处罚地点、处罚决定书文号、处罚金额、处罚时间、处罚案件编号、违规地点坐标.违规地点坐标) OR (处罚地点、处罚决定书文号、处罚金额、处罚时间、处罚案件编号、违规地点坐标.处罚金额
    < 法定最低处罚金额) OR (宣传日期、覆盖村数、参与人数、宣传方式、宣传覆盖村数、宣传场次、宣传经费投入.覆盖村数 / 总村数 < 0.9) OR (巡查频次、巡查覆盖村数、发现火点数、处理情况.巡查频次 = 0)
  description: 1. 将卫星火点坐标与处罚台账地点进行空间匹配，存在火点但无对应处罚记录即视为监管缺失；2. 处罚金额低于《大气污染防治法》规定的最低罚款标准（如500元以下）判定为执法不严；3. 禁烧宣传覆盖率不足90%反映预防措施不到位；4.
    月度巡查频次为0则直接认定未履行监管职责。满足任一条件即生成疑点。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 禁烧区违规焚烧秸秆且监管缺位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国大气污染防治法\",\n    \"法规文号\": \"主席令第三十二号（2018年修订）\",\n    \"效力级别\": \"法律\",\n  \
    \  \"条款号\": \"第七十六条、第一百一十九条\",\n    \"内容概述\": \"禁止在人口集中地区、机场周围、交通干线附近等区域露天焚烧秸秆；违反者由县级以上地方人民政府确定的监督管理部门责令改正，并可处五百元以上二千元以下罚款。\"\
    \n  },\n  {\n    \"法规名称\": \"关于进一步做好秸秆禁烧和综合利用工作的通知\",\n    \"法规文号\": \"环办函〔2019〕670号\",\n    \"效力级别\": \"部门规章\",\n"
