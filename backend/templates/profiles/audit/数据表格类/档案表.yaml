name: audit/数据表格类/档案表
type: model
description: 从数据表格类类文档（档案表）中提取结构化元数据。涵盖字段如：信息员姓名、兼职站点数、参训次数、学历、是否在岗、考核成绩、聘用方式、身份证号。文档范围包括：信息员档案表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 档案表
  member_count: 1
  member_details:
  - 信息员档案表
output:
  fields:
  - name: 信息员姓名
    type: string
    description: 提取 信息员姓名 的文本值
  - name: 兼职站点数
    type: string
    description: 提取 兼职站点数 的文本值
  - name: 参训次数
    type: string
    description: 提取 参训次数 的文本值
  - name: 学历
    type: string
    description: 提取 学历 的文本值
  - name: 是否在岗
    type: boolean
    description: 提取 是否在岗 的布尔值（是/否）
  - name: 考核成绩
    type: string
    description: 提取 考核成绩 的文本值
  - name: 聘用方式
    type: string
    description: 提取 聘用方式 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (信息员档案表.学历 < '高中' 或 '中专') || (信息员档案表.聘用方式 != '公开竞聘') || (信息员档案表.兼职站点数 > 1 && 站点间距 > 5公里)
  description: 信息员学历不达标，或未经过公开竞聘程序直接任命，或一人兼任多个相距较远的站点无法保证在岗履职，均属选聘违规。
  audit_item: 信息进村入户工程实施不到位
  suspicion: 村级信息员选聘不符合要求
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推进信息进村入户工程的实施意见\",\n    \"法规文号\": \"农市发[2016]3号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"第二部分第（二）条\",\n    \"内容概述\": \"信息员应具备高中以上文化程度，通过公开竞聘选聘，原则上实行一人一村，不得优亲厚友，确保能够履行服务职责。\"\n  }\n]"
- expression: (信息员档案表.参训次数 < 信息员培训计划.应到人数 * 0.8) || (信息员档案表.考核成绩 < 60 && 信息员档案表.聘用方式 = '继续聘用') || (信息员培训计划.课程目录 !包含 '设备操作'
    || 信息员培训计划.课程目录 !包含 '电商平台使用')
  description: 参训率不足80%，或考核不合格仍留任，或培训内容缺失核心实操课程，均表明培训管理流于形式、有效性不足。
  audit_item: 信息进村入户工程实施不到位
  suspicion: 村级信息员培训管理不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推进信息进村入户工程的实施意见\",\n    \"法规文号\": \"农市发[2016]3号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"第二部分第（二）条\",\n    \"内容概述\": \"应建立信息员常态化培训机制，培训内容须涵盖设备操作、电商服务等实操技能，培训不合格者不得上岗或继续聘用。\"\n  }\n]"
