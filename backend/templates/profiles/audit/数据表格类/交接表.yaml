name: audit/数据表格类/交接表
type: model
description: 从数据表格类类文档（交接表）中提取结构化元数据。涵盖字段如：交接日期、接收人、未决债务明细、移交人、责任划分栏。文档范围包括：离任领导干部债务交接表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 明细
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 交接表
  member_count: 1
  member_details:
  - 离任领导干部债务交接表
output:
  fields:
  - name: 交接日期
    type: date
    description: 提取 交接日期 的日期值，格式 YYYY-MM-DD
  - name: 接收人
    type: string
    description: 提取 接收人 的文本值
  - name: 未决债务明细
    type: string
    description: 提取 未决债务明细 的文本值
  - name: 移交人
    type: string
    description: 提取 移交人 的文本值
  - name: 责任划分栏
    type: string
    description: 提取 责任划分栏 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (管理制度文件.制度文本内容 NOT LIKE '%债务追责%' AND 管理制度文件.制度文本内容 NOT LIKE '%离任审计%' ) OR ( (SELECT COUNT(*) FROM 审计报告 WHERE
    离任干部姓名 IN (SELECT 姓名 FROM 近三年离任干部名单)) = 0 ) OR (交接表.责任划分栏 IS NULL OR 交接表.接收人 IS NULL)
  description: 制度缺失、执行缺失同步触发：1. 审查村级债务管理制度文件内容，若未包含债务追责或离任审计关键词，视为制度未建立；2. 从乡镇组织人事获取近三年离任村干部名单，与现有离任债务审计报告交叉比对，若所有离任人员均无对应审计报告，则为系统性执行缺失；3.
    抽查任一时点以后的交接表，若无债务责任划分或接收人未签字，属于责任悬空。
  audit_item: 村级债务管理不规范
  suspicion: 未建立或执行离任债务审计及新债追责制度
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于坚决制止发生新的乡村债务有关问题的通知\",\n    \"法规文号\": \"国办发〔2005〕39号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"要建立乡村干部新债责任追究制度和离任债务审计制度，将防止新债和化解旧债作为考核干部的重要内容。\"\n  }\n]"
