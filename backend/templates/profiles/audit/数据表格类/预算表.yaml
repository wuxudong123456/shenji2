name: audit/数据表格类/预算表
type: model
description: 从数据表格类类文档（预算表）中提取结构化元数据。涵盖字段如：公用经费年度预算总额、学校名称、定额金额、预算项目、领导姓名。文档范围包括：各校年度公用经费预算表、领导人员履职待遇和业务支出预算表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 项目
- 预算
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 预算表
  member_count: 1
  member_details:
  - 各校年度公用经费预算表
  - 领导人员履职待遇和业务支出预算表
output:
  fields:
  - name: 公用经费年度预算总额
    type: date
    description: 提取 公用经费年度预算总额 的日期值，格式 YYYY-MM-DD
  - name: 学校名称
    type: string
    description: 提取 学校名称 的文本值
  - name: 定额金额
    type: number
    description: 提取 定额金额 的数值（含单位，如万元、吨等）
  - name: 预算项目
    type: number
    description: 提取 预算项目 的数值（含单位，如万元、吨等）
  - name: 领导姓名
    type: string
    description: 提取 领导姓名 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (费用报销明细表.费用类别 = '福利费' && 费用报销明细表.摘要 包含 '充值') && (公款消费卡使用流水记录表.消费项目 NOT IN ('会议费','差旅费','业务招待') && 公款消费卡使用流水记录表.消费时间
    IN ('周末','法定节假日','20:00-次日08:00')) && (领导人员个人消费与公务消费对比分析表.个人消费占比 > 0.3)
  description: 定额发放的消费卡若主要用于非公务消费项目，且消费时间集中在非工作时段或个人消费金额占比超过30%，则判定为公款支付个人消费。
  audit_item: 公款用于个人支出
  suspicion: 违规为领导人员定额发放个人消费卡
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有企业负责人职务消费的指导意见\",\n    \"法规文号\": \"国资发分配〔2006〕69号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业负责人职务消费应坚持从紧必需原则，不得用于应由个人承担的费用，不得随意扩大职务消费范围或提高消费标准。\"\n  }\n]"
- expression: 学校.教师培训费预算金额 / 学校.公用经费年度预算总额 < 5%
  description: 学校年度公用经费预算中，教师培训费占比必须达到5%。表达式计算预算安排比例，若低于5%即为违规。也可加入对实际支出的检查：实际支出占比若逐年低于4%且无合理调整手续，视为变相违规。
  audit_item: 农村义务教育经费保障落实不到位
  suspicion: 未按公用经费预算总额5%安排教师培训经费
  regulation: "[\n  {\n    \"法规名称\": \"财政部 教育部关于印发《农村中小学公用经费支出管理暂行办法》的通知\",\n    \"法规文号\": \"财教〔2006〕5号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"教师培训费按照学校年度公用经费预算总额的5%安排，用于教师按照学校年度培训计划参加培训所需的差旅费、伙食补助费、资料费和住宿费等开支。\"\
    \n  }\n]"
