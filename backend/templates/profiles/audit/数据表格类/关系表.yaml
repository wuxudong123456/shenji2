name: audit/数据表格类/关系表
type: model
description: 从数据表格类类文档（关系表）中提取结构化元数据。涵盖字段如：关联地块列表、关联编号、出让公告编号、捆绑类型、转入方、转出方、转包层级。文档范围包括：彩票经营权转包关系表、捆绑地块关联关系表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 关系表
  member_count: 1
  member_details:
  - 彩票经营权转包关系表
  - 捆绑地块关联关系表
output:
  fields:
  - name: 关联地块列表
    type: string
    description: 提取 关联地块列表 的文本值
  - name: 关联编号
    type: string
    description: 提取 关联编号 的文本值
  - name: 出让公告编号
    type: string
    description: 提取 出让公告编号 的文本值
  - name: 捆绑类型
    type: string
    description: 提取 捆绑类型 的文本值
  - name: 转入方
    type: string
    description: 提取 转入方 的文本值
  - name: 转出方
    type: string
    description: 提取 转出方 的文本值
  - name: 转包层级
    type: string
    description: 提取 转包层级 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 转出方、转入方、转包层级.转包层级 >= 2 || (禁止转包条款、承包方名称、承包范围.禁止转包条款 == '是' && 转出方、转入方、转包层级.转出方 != 禁止转包条款、承包方名称、承包范围.承包方名称) ||
    (收款方名称、付款方名称、渠道标识、交易金额、交易时间.收款方名称 != 禁止转包条款、承包方名称、承包范围.承包方名称 && 收款方名称、付款方名称、渠道标识、交易金额、交易时间.收款方名称 不在 转出方、转入方、转包层级.转入方 中)
  description: 转包层级超过一级，或合同明确禁止转包但存在转包关系，或资金流向主体与合同承包方不一致且转包关系表未体现，均推定为违规转包。资金流向与合同主体不匹配可能指向隐性转包。
  audit_item: 彩票资金筹集审计常见违法违规问题
  suspicion: 违规转包彩票经营权
  regulation: "[\n  {\n    \"法规名称\": \"彩票管理条例\",\n    \"法规文号\": \"国务院令第554号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十五条\"\
    ,\n    \"内容概述\": \"彩票代销合同应当约定双方权利义务，代销者不得转手代销彩票。\"\n  },\n  {\n    \"法规名称\": \"彩票管理条例实施细则\",\n    \"法规文号\": \"财政部 民政部\
    \ 国家体育总局令第67号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"彩票代销者应当按照彩票代销合同的约定销售彩票，不得委托他人代销彩票。\"\
    \n  }\n]"
- expression: EXISTS(SELECT 1 FROM 关系表 WHERE 关系表.出让公告编号 = 登记表.公告编号) OR (出让合同.合同条款 LIKE '%同时竞得%' OR '%整体开发%' OR '%打包出让%')
  description: 若捆绑地块关联关系表存在对应出让公告记录，则认定为捆绑出让；或在合同条款中检索‘同时竞得’‘整体开发’‘打包出让’等强制关联竞买关键词。满足任一条件即判定为疑点。
  audit_item: 违规捆绑或以“毛地”方式出让土地
  suspicion: 违规将两宗以上地块捆绑出让土地
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步规范土地出让管理工作的通知\",\n    \"法规文号\": \"国土资发〔2003〕400号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"严禁将两宗以上地块捆绑出让，严禁以各种名义规避招标拍卖挂牌出让。\"\n  }\n]"
