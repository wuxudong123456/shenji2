name: audit/数据表格类/对账表
type: model
description: 从数据表格类类文档（对账表）中提取结构化元数据。涵盖字段如：专项资金支出金额、专项资金收入金额、中央下达资金总额、入账日期、入账金额、受益学生总数、合并发放给学生的人均补助标准、地方实际到位资金总额。文档范围包括：中央专项资金与地方补助资金对账表、银行代收对账表、银行账户资金流水对账表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 项目
- 预算
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 对账表
  member_count: 1
  member_details:
  - 中央专项资金与地方补助资金对账表
  - 银行代收对账表
  - 银行账户资金流水对账表
output:
  fields:
  - name: 专项资金支出金额
    type: number
    description: 提取 专项资金支出金额 的数值（含单位，如万元、吨等）
  - name: 专项资金收入金额
    type: number
    description: 提取 专项资金收入金额 的数值（含单位，如万元、吨等）
  - name: 中央下达资金总额
    type: number
    description: 提取 中央下达资金总额 的数值（含单位，如万元、吨等）
  - name: 入账日期
    type: date
    description: 提取 入账日期 的日期值，格式 YYYY-MM-DD
  - name: 入账金额
    type: number
    description: 提取 入账金额 的数值（含单位，如万元、吨等）
  - name: 受益学生总数
    type: string
    description: 提取 受益学生总数 的文本值
  - name: 合并发放给学生的人均补助标准
    type: string
    description: 提取 合并发放给学生的人均补助标准 的文本值
  - name: 地方实际到位资金总额
    type: number
    description: 提取 地方实际到位资金总额 的数值（含单位，如万元、吨等）
  - name: 地方年初预算应配套资金总额
    type: number
    description: 提取 地方年初预算应配套资金总额 的数值（含单位，如万元、吨等）
  - name: 对方账户名称
    type: string
    description: 提取 对方账户名称 的文本值
  - name: 执收单位名称
    type: string
    description: 提取 执收单位名称 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 支出用途摘要
    type: number
    description: 提取 支出用途摘要 的数值（含单位，如万元、吨等）
  - name: 收款金额
    type: number
    description: 提取 收款金额 的数值（含单位，如万元、吨等）
  - name: 收款项目
    type: number
    description: 提取 收款项目 的数值（含单位，如万元、吨等）
  - name: 缴款人
    type: number
    description: 提取 缴款人 的数值（含单位，如万元、吨等）
  - name: 缴款单位-个人
    type: number
    description: 提取 缴款单位-个人 的数值（含单位，如万元、吨等）
  - name: 缴费项目
    type: number
    description: 提取 缴费项目 的数值（含单位，如万元、吨等）
  - name: 资金流向
    type: string
    description: 提取 资金流向 的文本值
  - name: 资金结余
    type: string
    description: 提取 资金结余 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (信息表.单位名称 NOT IN (批准文件.批准执收单位名称) AND 信息表.执收权限截止日 >= 明细台账.征收日期) OR (协议文件 IS NULL AND 明细台账.执收单位 <> 批准文件.批准执收单位名称)
    OR (协议文件.协议有效期 < 明细台账.征收日期)
  description: 判定逻辑：1)实际征收单位不在财政部门批准的执收单位清单内，且征收时该单位权限名义上有效，属擅自变更；2)存在委托征收但无正式协议或批准文件；3)跨部门协作协议已超期仍继续征收。任意条件满足即视为违规。
  audit_item: 违反规定征收非税收入
  suspicion: 未经批准擅自改变非税收入执收单位
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"非税收入由法律、法规、规章规定的部门、单位征收；法律、法规、规章未规定征收部门、单位的，由财政部门直接征收；财政部门可以依法委托其他部门、单位征收。未经批准，不得擅自改变非税收入执收单位。\"\
    \n  }\n]"
- expression: (明细台账.征收金额 / 明细台账.计费数量) > (批准文件.批准标准（计费单位、单价） * 1.1) OR (明细台账.实收金额 < 批准文件.正常征收标准 AND 减免审批台账中无对应有效记录) OR (明细台账.实收金额
    > 批准文件.正常征收标准 AND 无合法调整文件)
  description: 允许标准上浮幅度设为10%（可按实际政策调整）。当实际收费标准超出批准标准上浮上限，或低于批准标准下限且无合法减免审批，或高于上限且无有效调整批准，均判定违规。擅自提高标准为常见加重负担行为，擅自降低标准可能导致财政收入流失。
  audit_item: 违反规定征收非税收入
  suspicion: 擅自提高或降低非税收入征收标准
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定擅自设立非税收入项目或者改变征收范围、标准、对象和期限。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n\
    \    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"单位和个人违反财政收入票据管理规定，或者有虚报、冒领、骗取财政收入"
- expression: (明细台账.实收金额 = 0 AND 当前日期 - 入申报表.缴费截止日 > 法定缓征期) OR (明细台账.实收日期 - 入申报表.缴费截止日 > 规定文件.法定追缴期限 AND 明细台账.实收金额 > 0)
  description: 应收未收：超过缴费截止日且宽限期后仍未收到款项；超期征收：实际征收日期距缴费截止日已超过法定追缴时效（如《行政处罚法》规定的执行期限）仍继续收取。具体截止日和追缴期依据具体项目规定和法律法规确定，原则上非税收入应按时足额征收。
  audit_item: 违反规定征收非税收入
  suspicion: 应收未收或超期征收非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定改变征收期限。非税收入应当按照规定的缴款期限收缴入库。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国行政处罚法\",\n \
    \   \"法规文号\": \"主席令第70号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十二条\",\n    \"内容概述\": \"当事人逾期不履行行政处罚决定的，作出行政处罚决定的行政机关可以申请人民法院"
- expression: (明细台账.实收日期 < 明细台账.应收时间) OR (ABS(明细台账.实收金额 - 批准文件.正常征收标准) > 批准文件.正常征收标准*0.10) OR (明细台账.实收金额 > 明细台账.应缴金额*1.05)
  description: 提前征收：实收日期早于政策或合同约定的应缴开始日期。多征：累计实收金额超出按进度应缴金额10%以上，或单次实收金额超出应缴金额5%且无合理解释。分期缴纳项目如一次性收取，按多征处理。
  audit_item: 违反规定征收非税收入
  suspicion: 多征或提前征收非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定擅自改变征收范围、标准、对象和期限。包括不得提前征收、多征非税收入。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范非税收入征收管理的通知\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"严禁采取一次性、集中等方式提前征收非税收入，严禁超标准、超范"
- expression: (审批台账.审批机关 NOT IN ('省级人民政府', '法律规定的有权机关') AND 明细台账.减免标识 IN ('减征','免征','缓征')) OR (明细台账.应缴金额 - 明细台账.实缴金额 > 0 AND
    审批台账.申请项目 IS NULL)
  description: 非税收入减免缓征权限通常由法律、法规或省级人民政府决定。若审批机关不在合法有权机关列表内，视为越权审批；若实缴金额小于应缴金额且无法提供合法审批记录，则视为擅自减免。合法的临时性缓缴政策需与台账记录相互印证。
  audit_item: 违反规定征收非税收入
  suspicion: 违规减征、免征、缓征非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定擅自改变征收范围、标准、对象和期限，包括减征、免征、缓征。减免非税收入应当按照管理权限报批。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十五条\",\n    \"内容概述\": \"预算收入征收部门和单位，必须依照法律、行"
- expression: (银行流水.收款方名称 != 合同.乙方名称) AND (银行流水.金额 > 200000) OR (银行流水.摘要 包含 "工资" 或 "福利" AND 收款方为关联企业) OR (费用报销凭证.发票查验结果 =
    "虚假" OR 重复报销)
  description: 资金拨付对象与合同签订方不一致且金额超过20万元；资金用途摘要与项目无关，或收款方为关联方个人或企业；发票虚假或重复报销。
  audit_item: 项目资金使用不合规
  suspicion: 项目建设资金被转移、侵占或挪用
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十七条\",\n    \"内容概述\": \"各部门、各单位不得截留、挪用预算资金，不得擅自改变预算支出用途。\"\n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n    \"法规文号\"\
    : \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员违反规定，以虚报、冒领等手段骗取财政资金；截留、挪用财政资金等行为"
- expression: 禁止支出事项.各支出科目（办公费、维修费、水电气费等）预算金额 IN ('办公费', '维修费', '水电气费', '人员经费') && 禁止支出事项.禁止支出事项 LIKE '%膳食补助%' && 禁止支出事项.公用经费预算总额
    > 0
  description: 该表达式用于识别公用经费明细账中的异常记录。当一笔记账记录的会计科目为标准公用经费科目（如办公费、维修费等），但其摘要内容中包含“膳食”、“补助”等字样时，表明本应列支在膳食补助专项资金中的开销，被记入了学校公用经费科目。这直接构成挤占公用经费以弥补补助资金不足的事实。
  audit_item: 资金的管理和使用不规范
  suspicion: 公用经费挤占国家膳食补助资金
  regulation: "[\n  {\n    \"法规名称\": \"城乡义务教育补助经费管理办法\",\n    \"法规文号\": \"财教〔2021〕72号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"补助经费要全额用于义务教育学校，不得用于教职工福利、临时聘用人员工资等人员经费，不得用于基建投资、偿还债务等方面。对挤占、截留、挪用补助经费的行为，应依法依规追究相关单位和人员责任。\"\
    \n  },\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划专项资金管理办法\",\n    \"法规文号\": \"财教〔2012〕2号\",\n    \"效力级别\": \"部门规章\",\n"
- expression: (对账表.地方实际到位资金总额 < 对账表.地方年初预算应配套资金总额) && (对账表.合并发放给学生的人均补助标准 == (对账表.中央下达资金总额/对账表.受益学生总数))
  description: 该表达式判定：当地方实际到位的配套资金低于其年初预算或政策规定应承担的金额，但同时学生收到的合并补助标准仅等于中央资金按人头均摊的标准时，即构成“抵减”疑点。本应由中央加地方资金共同构成的更高补助标准，被中央单方面资金所替代，地方应承担部分被抽走。
  audit_item: 资金的管理和使用不规范
  suspicion: 中央补助资金违规抵减地方应承担支出
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于实施农村义务教育学生营养改善计划的意见\",\n    \"法规文号\": \"国办发〔2011〕54号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、主要措施\",\n    \"内容概述\": \"各地要统筹中央补助资金和自身财力，确保补助标准落实到位。不得以中央补助资金抵减地方应承担的义务教育阶段家庭经济困难寄宿生生活费补助资金，不得减少地方本级财政应安排的补助经费。\"\
    \n  },\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划专项资金管理办法\",\n    \"法规文号\": \"财教〔2012〕2号\",\n    \"效力"
