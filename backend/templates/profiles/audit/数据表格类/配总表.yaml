name: audit/数据表格类/配总表
type: model
description: 从数据表格类类文档（配总表）中提取结构化元数据。涵盖字段如：分配金额、最终分配金额、计算依据的因素数据值、项目名称、项目类别。文档范围包括：财政转移支付资金分配总表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 配总表
  member_count: 1
  member_details:
  - 财政转移支付资金分配总表
output:
  fields:
  - name: 分配金额
    type: number
    description: 提取 分配金额 的数值（含单位，如万元、吨等）
  - name: 最终分配金额
    type: number
    description: 提取 最终分配金额 的数值（含单位，如万元、吨等）
  - name: 计算依据的因素数据值
    type: string
    description: 提取 计算依据的因素数据值 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目类别
    type: string
    description: 提取 项目类别 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ABS({因素名称.数据值} - {差异说明.真实值}) > 0 || ({因素名称.数据时间节点} 距离分配年度 > 3) || ({验证数据差异结论.验证数据差异结论} = '不可接受' && {分配金额.分配金额}
    使用该因素数据值计算)
  description: 数据采集值与校验真实值存在任何绝对值差异，或引用数据年份距分配年度超过3年（时效性超标），或第三方验证报告判定数据不可信且该数据被用于计算金额，均判定为基础数据错误导致分配偏差。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 分配引用基础数据错误
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条、第五十七条\"\
    ,\n    \"内容概述\": \"各级政府预算编制应依据真实、准确的数据；各部门应完整、准确地向财政部门提供预算编制所需数据。\"\n  }\n]"
- expression: ({配总表.申请单位} NOT IN ({资质审核材料.合格单位名单})) || ({项目合规性审查清单.审查结论} = '不合格' && {配总表.分配金额} > 0) || ({资质审核材料.经营范围} NOT
    LIKE '%{政策要求行业关键词}%' && {配总表.分配金额} > 0)
  description: 三个独立触发条件：分配总表中的单位未出现在资质审核合格名单中；审查清单明确判定不合格但仍获得资金；申报单位经营范围与政策支持的行业不匹配但配置金额>0。满足任一条件即判定为向不符合条件项目分配资金。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 向不符合条件的项目分配资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员擅自扩大支出范围、提高支出标准，或以虚报、冒领等手段骗取财政资金的，应责令改正并追回资金。\"\n  }\n]"
- expression: ({配总表.分配金额} > {管理办法.资金上限}) || ({配总表.项目类别} NOT IN ({管理办法.补助范围}) && {配总表.分配金额} > 0) || ({统计表.超出金额} > 0)
  description: 实际分配金额超出管理办法明确的同类别资金上限即为超标准；项目类别不属于管理办法划定的补助范围却获得资金即为超范围；超标准分配情况统计表中有记录直接判定违规。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 超标准或超范围分配资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员擅自提高支出标准、扩大支出范围的，责令改正，追回资金，并予处罚。\"\n  }\n]"
