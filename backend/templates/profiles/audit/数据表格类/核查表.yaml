- expression: (文本相似度（%）.文本相似度（%） > 60% || 路网结构相似度（%）.路网结构相似度（%） > 80% || 公共服务设施布局相似度（%）.公共服务设施布局相似度（%） > 80%) && (调研记录.产业规划与实际产业不符
