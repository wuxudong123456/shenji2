name: audit/数据表格类/核查表
type: model
description: 从数据表格类类文档（核查表）中提取结构化元数据。涵盖字段如：GPS坐标、上报还田量、与公司业务关联说明、与工作人员关系、专业领域、专家姓名、专家评审签字栏、中标单位名称。文档范围包括：“七公开”制度执行情况核查表、专家库成员资质核查表、保证金缴纳比例核查表、养老机构收费公示核查表、农业生产电价政策执行情况核查表、受益人关联关系核查表、同一项目多途径申报核查表、土地用途实际使用情况核查表、大额消费支出专项核查表、学籍核查表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 会议
- 金额
- 项目
- 元数据提取
