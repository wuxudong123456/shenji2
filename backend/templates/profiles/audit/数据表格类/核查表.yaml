violations:
- expression: 明细表.金额 > 0 && (COALESCE(签到表.实际签到人数,0) < 统计表.人数 * 0.3 OR 核查表.异常特征标记（四要件缺失、笔迹雷同、场地矛盾等） == 1) && (明细表.收款方户名 !=
    原始凭证.合同供应商 OR 明细表.收款方户名 LIKE '%个人%')
  description: 培训项目有支出但实际签到人数严重不足（低于应参训人数的30%），或异常特征表标记为1（如通知、签到、日程、照片四要件缺失），且资金支付对象与合同供应商不一致或支付给个人账户，则高度疑为虚构培训套取资金。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 虚列培训费套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第（一）项\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，责令改正，追回有关财政资金，对单位给予警告或者通报批评，对直接负责的主管人员和其他直接责任人员给予记大过处分。\"\n  }\n]"
- expression: (流水.交易金额 > 100000 && (流水.收款方 IN (个人账户, 疑似关联企业) || 流水.摘要 NOT LIKE '%上缴%' )) || (明细表.处置收入 + 出借台账.实收租金 - 流水.收款账户
    > 0.05 * (明细表.处置收入 + 出借台账.实收租金) ) || (合同.合同乙方 != 流水.付款方 && 流水.收入金额)
  description: 识别隐藏、截留、挪用行为的特征：大额资金（>10万元）流入个人或关联企业账户；实际收入台账金额与银行账户入账总额差异超过5%；合同签订方与银行回款方不一致且资金未进入单位正规账户。任一条件触发即列为疑点。
  audit_item: 国有资产收入管理不合规
  suspicion: 隐瞒截留挪用国有资产收入行为
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"国有资产收入应当按照政府非税收入管理规定及时足额上缴国库，严禁截留、挪用。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n  \
    \  \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条、第六条\",\n    \"内容概述\": \"对隐瞒、截留、挪用应当上缴的财政收入等行为，责令改正，追回资金"
- expression: (DATEDIFF(实际公开日期, 绩效评价报告出具日期) > 30) OR (公示内容 NOT LIKE '%第三方机构名称%' OR NOT LIKE '%评价标准%' OR NOT LIKE '%评价结果%'
    OR NOT LIKE '%问题及建议%')
  description: 从报告出具日算起超过30个工作日未公开即触发延迟公开疑点；公示内容缺少第三方机构名称、评价标准、结果或问题建议等关键要素之一即触发选择性公开或不完整性疑点。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 未按规定及时充分公开第三方绩效评价信息
