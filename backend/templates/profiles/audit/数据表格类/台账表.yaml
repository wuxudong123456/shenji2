name: audit/数据表格类/台账表
type: model
description: 从数据表格类类文档（台账表）中提取结构化元数据。涵盖字段如：不合格品处理记录、价值、使用状态、保管责任人、停水时长、农户数量、原值、去向。文档范围包括：供水设备运行维护台账表、农村污水现状基础台账表、农药包装废弃物回收台账表、回收台账表、集体资产分类台账表、食品采购验收台账表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 台账
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 台账表
  member_count: 1
  member_details:
  - 供水设备运行维护台账表
  - 农村污水现状基础台账表
  - 农药包装废弃物回收台账表
  - 回收台账表
  - 集体资产分类台账表
  - 食品采购验收台账表
output:
  fields:
  - name: 不合格品处理记录
    type: string
    description: 提取 不合格品处理记录 的文本值
  - name: 价值
    type: string
    description: 提取 价值 的文本值
  - name: 使用状态
    type: boolean
    description: 提取 使用状态 的布尔值（是/否）
  - name: 保管责任人
    type: string
    description: 提取 保管责任人 的文本值
  - name: 停水时长
    type: string
    description: 提取 停水时长 的文本值
  - name: 农户数量
    type: number
    description: 提取 农户数量 的数值（含单位，如万元、吨等）
  - name: 原值
    type: string
    description: 提取 原值 的文本值
  - name: 去向
    type: string
    description: 提取 去向 的文本值
  - name: 台账是否存在
    type: boolean
    description: 提取 台账是否存在 的布尔值（是/否）
  - name: 回收单位
    type: string
    description: 提取 回收单位 的文本值
  - name: 回收数量
    type: number
    description: 提取 回收数量 的数值（含单位，如万元、吨等）
  - name: 回收日期
    type: date
    description: 提取 回收日期 的日期值，格式 YYYY-MM-DD
  - name: 回收时间
    type: date
    description: 提取 回收时间 的日期值，格式 YYYY-MM-DD
  - name: 处理去向
    type: string
    description: 提取 处理去向 的文本值
  - name: 处理去向字段
    type: string
    description: 提取 处理去向字段 的文本值
  - name: 处理去向记录
    type: string
    description: 提取 处理去向记录 的文本值
  - name: 处理方式等字段完整性
    type: string
    description: 提取 处理方式等字段完整性 的文本值
  - name: 存放地点
    type: string
    description: 提取 存放地点 的文本值
  - name: 存放地点或位置
    type: string
    description: 提取 存放地点或位置 的文本值
  - name: 实际供水量
    type: string
    description: 提取 实际供水量 的文本值
  - name: 已建处理设施数量与位置
    type: number
    description: 提取 已建处理设施数量与位置 的数值（含单位，如万元、吨等）
  - name: 排放方式
    type: string
    description: 提取 排放方式 的文本值
  - name: 故障频率
    type: string
    description: 提取 故障频率 的文本值
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 数量字段
    type: number
    description: 提取 数量字段 的数值（含单位，如万元、吨等）
  - name: 时间
    type: date
    description: 提取 时间 的日期值，格式 YYYY-MM-DD
  - name: 时间字段
    type: date
    description: 提取 时间字段 的日期值，格式 YYYY-MM-DD
  - name: 是否有检疫证明
    type: boolean
    description: 提取 是否有检疫证明 的布尔值（是/否）
  - name: 来源
    type: string
    description: 提取 来源 的文本值
  - name: 来源字段
    type: string
    description: 提取 来源字段 的文本值
  - name: 污水日产生量
    type: string
    description: 提取 污水日产生量 的文本值
  - name: 漏损率
    type: string
    description: 提取 漏损率 的文本值
  - name: 登记日期
    type: date
    description: 提取 登记日期 的日期值，格式 YYYY-MM-DD
  - name: 管网覆盖率
    type: string
    description: 提取 管网覆盖率 的文本值
  - name: 行政村-自然村名称
    type: string
    description: 提取 行政村-自然村名称 的文本值
  - name: 记录条数
    type: string
    description: 提取 记录条数 的文本值
  - name: 记录行数
    type: string
    description: 提取 记录行数 的文本值
  - name: 设备编号
    type: string
    description: 提取 设备编号 的文本值
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 资产类别
    type: string
    description: 提取 资产类别 的文本值
  - name: 资产编号
    type: string
    description: 提取 资产编号 的文本值
  - name: 运行状态
    type: boolean
    description: 提取 运行状态 的布尔值（是/否）
  - name: 验收人签字
    type: string
    description: 提取 验收人签字 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 台账名称
    type: string
    description: 台账全称
    required: false
  - name: 台账期间
    type: string
    description: 台账记录的起止日期
    required: false
  - name: 登记人
    type: string
    description: 登记人/录入人姓名
    required: false
  - name: 登记事项
    type: string
    description: 登记事项/内容摘要
    required: false
  - name: 金额
    type: number
    description: 涉及金额
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (验收文件.设备清单 != 维护记录.采购设备数量) || (TODAY - 维护记录.采购日期 > 设计使用年限*365) || (台账表.漏损率 > 0.2) || (台账表.停水时长 > 48)
  description: 1.设备短缺：实际采购数量少于设计要求；2.设备老化：当前日期减去安装日期超过设计使用年限(如水泵、管网一般为15-20年)；3.损失浪费：漏损率(漏损水量/供水总量)根据行业标准，超过20%为严重漏损；4.供水保障不足：月累计停水时长超过48小时(相当于2天)，视为保障不足。满足任一条件即判定为疑点。
  audit_item: 农村供水水质保障和工程运营管理不到位
  suspicion: 供水设备短缺老化致供水保障不足
  regulation: "[\n  {\n    \"法规名称\": \"农村饮水安全工程建设管理办法\",\n    \"法规文号\": \"发改农经[2013]2673号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二十一条\",\n    \"内容概述\": \"农村饮水安全工程建成后应落实管理主体，建立健全运行管理制度，保障工程正常运行，确保供水安全。\"\n  },\n  {\n    \"法规名称\": \"\
    城镇供水管网漏损控制及评定标准\",\n    \"法规文号\": \"CJJ92-2016\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"4.2.1\",\n    \"内容概述\": \"\
    城镇供水管网基本漏损率不应"
- expression: (清产核资完成时间、资产清查范围.验收结论 != '已完成') || (清产核资完成时间、资产清查范围.第三方签字确认 != TRUE) || (ABS(盘点年度、资产名称、账面数量、实盘数量、差异数量、差异原因.差异数量)
    > 0 && 盘点年度、资产名称、账面数量、实盘数量、差异数量、差异原因.差异原因为空) || (资产名称、资产类别、数量、价值、登记日期、资产编号、保管责任人、使用状态、存放地点、原值、存放地点或位置.登记日期 > 清产核资截止日期要求、资产分类标准.清产核资截止日期要求)
  description: 判定清产核资任务未完成的逻辑：1）验收结论非“已完成”或验收报告缺少第三方签字，视为形式未完成；2）年度盘点存在账实差异且无合理解释，视为实质未完成；3）台账登记日期晚于上级政策文件规定的清产核资完成时限，视为逾期未完成。以上任一条件触发则构成疑点。
  audit_item: 农村集体资产管理不到位
  suspicion: 集体资产清产核资任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"要求全面开展集体资产清产核资，明确清产核资的范围、任务和时间表，确保账实相符、底数清晰。\"\n  },\n  {\n    \"法规名称\": \"\
    农村集体资产清产核资办法\",\n    \"法规文号\": \"农经发〔2018〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条、第十条\",\n    \"内容概述\": \"\
    农村集体经济组织"
- expression: (集体资产登记、保管、使用等管理制度文件.是否涵盖全生命周期条款 != TRUE) || (集体资产登记、保管、使用等管理制度文件.是否包含定期盘点条款 != TRUE) || (台账表.资产编号为空 || 台账表.保管责任人为空)
    || (计提表.资产名称 NOT IN 台账表.资产名称)
  description: 判定制度缺失或未实行台账管理的逻辑：1）书面制度文件缺失资产全生命周期管理或定期盘点条款，属于制度设计缺陷；2）台账记录中关键管理字段（如资产编号、保管责任人）缺失，视为台账形同虚设；3）财务计提折旧表中有资产记录但实物台账中无对应记录，证明账表脱节、未实现统一台账管理。上述条件任一满足即触发疑点。
  audit_item: 农村集体资产管理不到位
  suspicion: 未建立健全资产登记保管制度并实行台账管理
  regulation: "[\n  {\n    \"法规名称\": \"村集体经济组织会计制度\",\n    \"法规文号\": \"财会〔2004〕12号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"村集体经济组织必须建立健全资产物资的登记、保管、领用等制度，并定期进行盘点清查，做到账实相符。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强农村集体资金资产资源管理的若干意见\"\
    ,\n    \"法规文号\": \"农经发〔2013〕5号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"全面建立集体资产台账，"
- expression: ((资产名称、处置方式.评估价值 - 资产名称、处置日期、处置价格、审批人.处置价格) / 资产名称、处置方式.评估价值) * 100 > 10
  description: 判定资产处置价格异常的逻辑：计算处置价格与评估价值的偏差率，公式为（评估价-处置价）/评估价*100%。偏差率超过10%视为显著异常，可能存在利益输送、暗箱操作或低价处置导致集体资产流失。该阈值参考国有资产评估管理规定及审计实务经验设定。
  audit_item: 农村集体资产管理不到位
  suspicion: 集体资产处置价格严重低于评估价
  regulation: "[\n  {\n    \"法规名称\": \"农村集体资产清产核资办法\",\n    \"法规文号\": \"农经发〔2018〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"集体资产的处置要进行资产评估，评估结果要经集体经济组织成员大会或成员代表大会确认，处置价格不得明显低于评估价值。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强农村集体资金资产资源管理的若干意见\"\
    ,\n    \"法规文号\": \"农经发〔2013〕5号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"集体"
- expression: (台账表.资产名称 NOT IN 入账凭证.资产名称) || (台账表.使用状态 == '被占用' && 明细表.收入项目 无对应资产租金收入)
  description: 判定无理占用的核心逻辑：1）台账记录的经营性或可租用资产，在租赁合同及收益入账记录中不存在，且资产使用状态显示为被他人使用，即为无偿占用。2) 更为直接的判定是结合收益表，若某资产正在被人使用但集体账户从未收到过该笔租金收入，则坐实了无偿侵占。
  audit_item: 农村集体资产管理不到位
  suspicion: 集体资产被个人无偿占用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第45号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二百六十五条\"\
    ,\n    \"内容概述\": \"集体所有的财产受法律保护，禁止任何组织或者个人侵占、哄抢、私分、破坏。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强农村集体资金资产资源管理的若干意见\",\n   \
    \ \"法规文号\": \"农经发〔2013〕5号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"任何单位和个人不得侵占、平调、挪用集体资产，对于集体资产"
- expression: (统计表.农药采购量 > 0) && (台账表.记录行数 = 0) && (管理制度文件.回收设施配置要求 不包含 '回收桶' 或 '回收点') || (统计表.实际回收率 < 0.3) && (台账表.处理去向字段
    缺失 或 为空)
  description: 当存在持续的农药采购行为，但回收台账无任何记录且制度中未设置回收设施时，或者回收率低于30%且台账去向信息空缺，判定为未履行回收处理义务。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 农药包装废弃物未进行回收处理
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十八条、第四十条\",\n    \"内容概述\": \"农药经营者应履行农药包装废弃物回收义务；农药经营者应建立农药采购、销售台账，并如实记录废弃物回收情况。\"\n  }\n]"
- expression: (统计表.农药采购总量 > 0) && (处理方式等字段完整性.记录行数 = 0 或 处理方式等字段完整性.台账是否存在 缺失) || (处理方式等字段完整性.来源字段 为空 的记录数 / 处理方式等字段完整性.记录条数
    > 0.3) && (处理方式等字段完整性.处理去向字段 为空 的记录数 / 处理方式等字段完整性.记录条数 > 0.3)
  description: 凡有农药经营活动但回收台账不存在或无任何记录，或已建立的台账中来源、去向等关键字段缺失率超过30%，均判定为未建立或台账严重不完整，丧失追溯功能。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 未建立农药包装废弃物回收台账
  regulation: "[\n  {\n    \"法规名称\": \"《农药管理条例》\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十条\",\n    \"内容概述\": \"农药经营者应当建立农药采购、销售台账，并如实记录农药包装废弃物的回收日期、数量、来源和去向等信息。\"\n  }\n]"
- expression: (记录表.收款方名称 不为空 且 收款方名称 不在 处理合同.合同约定接收单位 列表) && (记录表.金额 > 0) || (交接单.接收方 不在 证明文件.合法资质单位清单 内) || (台账表.处理去向 !=
    处理合同.合同约定接收单位)
  description: 存在向非合同约定或非资质的个人/单位支付大额款项，转运接收方与资质单位不符，或台账去向与合同约定不一致，均表明存在违规倒卖或非法转交行为。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 违规倒卖农药包装废弃物
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国固体废物污染环境防治法》\",\n    \"法规文号\": \"主席令第四十三号（2020年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第八十条\",\n    \"内容概述\": \"禁止将危险废物提供或者委托给无许可证的单位或者其他生产经营者从事收集、贮存、利用、处置活动。\"\n  }\n]"
- expression: COUNT(回收数量等.记录行数) = 0 OR (SUM(销售台账.销售数量（包装单位）) - SUM(回收数量等.回收数量)) / SUM(销售台账.销售数量（包装单位）) > 0.7
  description: ①回收台账无任何记录，完全未开展回收工作；②以农药销售包装数量作为理论产生量，若实际回收量与理论量偏差率超过70%，即回收量不足理论量的30%，判定为未有效回收。
  audit_item: 农药化肥减量增效落实方面不符合相关规定
  suspicion: 农药包装废弃物未进行回收处理
  regulation: "[\n  {\n    \"法规名称\": \"农药包装废弃物回收处理管理办法\",\n    \"法规文号\": \"生态环境部 农业农村部令2020年第7号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"农药生产者、经营者、使用者应当积极履行农药包装废弃物回收处理义务，及时回收农药包装废弃物。\"\n  }\n]"
- expression: COUNT(回收数量、来源、时间、处理去向、记录行数、时间字段、数量字段、来源字段、处理去向字段、处理去向记录、回收日期、回收单位、台账是否存在、记录条数、回收时间、数量、处理方式等字段完整性.记录行数) = 0 OR
    (回收数量、来源、时间、处理去向、记录行数、时间字段、数量字段、来源字段、处理去向字段、处理去向记录、回收日期、回收单位、台账是否存在、记录条数、回收时间、数量、处理方式等字段完整性.回收时间 IS NULL OR 回收数量、来源、时间、处理去向、记录行数、时间字段、数量字段、来源字段、处理去向字段、处理去向记录、回收日期、回收单位、台账是否存在、记录条数、回收时间、数量、处理
  description: ①台账表完全空白，即未建立回收台账；②台账中存在记录但关键字段（回收时间、来源、处理方式）缺失，台账不完整，视为未规范建立台账。
  audit_item: 农药化肥减量增效落实方面不符合相关规定
  suspicion: 未按规定建立农药包装废弃物回收台账
  regulation: "[\n  {\n    \"法规名称\": \"农药包装废弃物回收处理管理办法\",\n    \"法规文号\": \"生态环境部 农业农村部令2020年第7号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十一条\",\n    \"内容概述\": \"农药经营者和农药包装废弃物回收站（点）应当建立农药包装废弃物回收台账，记录数量和去向信息，并保存两年以上。\"\n  }\n]"
- expression: (ABS(SUM(回收数量、去向.回收数量) - SUM(接收单位、数量、接收单位资质.数量)) / SUM(回收数量、去向.回收数量) > 0.05) OR (倒卖事实、处罚情况.倒卖事实 = TRUE) OR (接收单位、数量、接收单位资质.接收单位
    NOT IN (接收单位、数量、接收单位资质.接收单位资质) AND 数量 > 0)
  description: ①回收总量与移交有资质处理单位的数量差异超过5%，且无法提供去向说明，疑似倒卖流失；②案件查处记录中确认存在倒卖行为；③转移联单上的接收单位不具备处理资质，直接表明废弃物被转移给无资质主体。任一条件触发。
  audit_item: 农药化肥减量增效落实方面不符合相关规定
  suspicion: 违规倒卖农药包装废弃物
  regulation: "[\n  {\n    \"法规名称\": \"农药包装废弃物回收处理管理办法\",\n    \"法规文号\": \"生态环境部 农业农村部令2020年第7号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"禁止将农药包装废弃物转移给没有资质的单位或者个人进行处置。\"\n  }\n]"
- expression: (台账表.行政村/自然村名称 IS NULL) || (台账表.农户数量字段为空 || 台账表.排放方式字段为空 || 台账表.管网覆盖率字段为空) || (ABS(台账表.已建处理设施数量与位置 - 检查记录.实地设施实际运行状况)
    / 检查记录.实地设施实际运行状况 > 0.3) || (台账表.设立台账日期 > 监测报告.规划批复日期)
  description: 台账完全缺失；或关键字段（农户数量、排放方式等）为空值；或台账记录的设施数量与现场核查数量偏差超过30%（差异值/现场核查值>0.3），表明数据严重失真；或台账建立日期晚于规划批复日期，存在事后补建倒签嫌疑。以上任一条件触发即为违规。
  audit_item: 污水治理规划不符合规定
  suspicion: 未建立农村污水现状基础台账
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进农村生活污水治理的指导意见\",\n    \"法规文号\": \"环办土壤〔2021〕24号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条第（二）项\",\n    \"内容概述\": \"全面摸清辖区内农村生活污水治理现状，建立详细的基础信息台账，做到底数清、情况明。\"\n  }\n]"
- expression: (台账表.是否有检疫证明 == '否' && 食材类别 IN ['肉类','禽类','水产品']) || (监测记录.冷藏温度 > 4℃ && 持续时间 > 1小时) || (检查记录.生熟分离情况 == '不合格')
  description: 肉类等高风险食材采购无检疫证明，冷藏冷冻温度持续超标超过1小时，生熟食品未分离存放或加工，只要触发任一项即判定违规。
  audit_item: 营养餐食品安全与膳食营养不符合要求
  suspicion: 食品采购加工贮存卫生不达标
  regulation: "[\n  {\n    \"法规名称\": \"餐饮服务食品安全操作规范\",\n    \"法规文号\": \"国家市场监督管理总局公告2018年第12号\",\n    \"效力级别\": \"行业规范\",\n\
    \    \"条款号\": \"6.1.3、7.1.2\",\n    \"内容概述\": \"采购食品原料应查验供货者许可证和产品合格证明；加工制作过程中应避免交叉污染，生熟食品加工用具、容器分开使用。\"\n  }\n]"
