name: audit/数据表格类/指标表
type: model
description: 从数据表格类类文档（指标表）中提取结构化元数据。涵盖字段如：支小支农业务考核指标设置情况、权重、目标值、考核指标名称。文档范围包括：绩效考核指标表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 指标表
  member_count: 1
  member_details:
  - 绩效考核指标表
output:
  fields:
  - name: 支小支农业务考核指标设置情况
    type: string
    description: 提取 支小支农业务考核指标设置情况 的文本值
  - name: 权重
    type: string
    description: 提取 权重 的文本值
  - name: 目标值
    type: string
    description: 提取 目标值 的文本值
  - name: 考核指标名称
    type: string
    description: 提取 考核指标名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (客户类型分布.支小支农担保金额 / 客户类型分布.担保总额) < 0.8 && 支小支农业务考核指标设置情况.支小支农业务考核指标设置情况 == 未设置
  description: 根据国办发〔2019〕6号文要求，政府性融资担保机构支小支农业务占比不得低于80%。当计算占比低于80%且机构内部未将支小支农业务纳入考核，表明业务结构偏离政策导向，构成政策执行不到位。
  audit_item: 政府性融资担保支持创业和企业稳定发展政策执行不到位
  suspicion: 支小支农融资担保业务规模占比未达标
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于有效发挥政府性融资担保基金作用切实支持小微企业和“三农”发展的指导意见\",\n    \"法规文号\": \"国办发〔2019〕6号\",\n  \
    \  \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"政府性融资担保、再担保机构要聚焦小微企业和“三农”融资担保业务，逐步提高支小支农担保业务规模和占比，实现支小支农业务占比80%以上。\"\
    \n  }\n]"
- expression: 支小支农业务考核指标设置情况.考核指标名称 不包含 ('支小支农','小微担保增长率','三农担保增长率','政策性业务占比')
  description: 根据绩效评价指引，政府性融资担保机构考核应突出支小支农业务指标。若考核体系中完全没有反映政策导向的指标，说明管理层未将政策目标融入日常经营，存在履职缺失。
  audit_item: 政府性融资担保支持创业和企业稳定发展政策执行不到位
  suspicion: 内部绩效考核未设置支小支农业务指标
  regulation: "[\n  {\n    \"法规名称\": \"政府性融资担保、再担保机构绩效评价指引\",\n    \"法规文号\": \"财金〔2020〕31号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第六条、第七条\",\n    \"内容概述\": \"绩效评价以政策效益、经营能力、风险控制和体系建设为导向，支小支农业务规模、占比及担保费率是核心评价指标，机构内部考核应与之衔接。\"\n  }\n]"
