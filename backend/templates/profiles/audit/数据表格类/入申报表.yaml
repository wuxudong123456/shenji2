name: audit/数据表格类/入申报表
type: model
description: 从数据表格类类文档（入申报表）中提取结构化元数据。涵盖字段如：应缴金额、申报日期、申报金额、申报项目、约定缴款计划、缴费人类型、缴费截止日。文档范围包括：非税收入申报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 入申报表
  member_count: 1
  member_details:
  - 非税收入申报表
output:
  fields:
  - name: 应缴金额
    type: number
    description: 提取 应缴金额 的数值（含单位，如万元、吨等）
  - name: 申报日期
    type: date
    description: 提取 申报日期 的日期值，格式 YYYY-MM-DD
  - name: 申报金额
    type: number
    description: 提取 申报金额 的数值（含单位，如万元、吨等）
  - name: 申报项目
    type: string
    description: 提取 申报项目 的文本值
  - name: 约定缴款计划
    type: number
    description: 提取 约定缴款计划 的数值（含单位，如万元、吨等）
  - name: 缴费人类型
    type: number
    description: 提取 缴费人类型 的数值（含单位，如万元、吨等）
  - name: 缴费截止日
    type: number
    description: 提取 缴费截止日 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 明细台账.征收项目 NOT IN (征收范围描述.项目名称) OR (明细台账.缴费单位/个人名称 NOT IN (征收范围描述.征收对象))
  description: 当征收台账中出现的项目名称不在财政、物价部门公布的征收范围目录内，或者虽项目名称相符但实际征收对象（如个人、非营利组织）超出了目录规定的对象类型，判定为违规扩大征收范围。
  audit_item: 违反规定征收非税收入
  suspicion: 违规扩大非税收入征收范围
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"非税收入项目由法律、法规、规章设立。设立和征收非税收入，应当依据法 律、法规、规章的规定，并按照管理权限予以批准。任何部门和单位不得违反规定擅自设立非税收入项目或者改变征收范围、标准、对象和期限。\"\
    \n  }\n]"
- expression: (明细台账.实收金额 = 0 AND 当前日期 - 入申报表.缴费截止日 > 法定缓征期) OR (明细台账.实收日期 - 入申报表.缴费截止日 > 规定文件.法定追缴期限 AND 明细台账.实收金额 > 0)
  description: 应收未收：超过缴费截止日且宽限期后仍未收到款项；超期征收：实际征收日期距缴费截止日已超过法定追缴时效（如《行政处罚法》规定的执行期限）仍继续收取。具体截止日和追缴期依据具体项目规定和法律法规确定，原则上非税收入应按时足额征收。
  audit_item: 违反规定征收非税收入
  suspicion: 应收未收或超期征收非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定改变征收期限。非税收入应当按照规定的缴款期限收缴入库。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国行政处罚法\",\n \
    \   \"法规文号\": \"主席令第70号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十二条\",\n    \"内容概述\": \"当事人逾期不履行行政处罚决定的，作出行政处罚决定的行政机关可以申请人民法院"
- expression: (明细台账.实收日期 < 明细台账.应收时间) OR (ABS(明细台账.实收金额 - 批准文件.正常征收标准) > 批准文件.正常征收标准*0.10) OR (明细台账.实收金额 > 明细台账.应缴金额*1.05)
  description: 提前征收：实收日期早于政策或合同约定的应缴开始日期。多征：累计实收金额超出按进度应缴金额10%以上，或单次实收金额超出应缴金额5%且无合理解释。分期缴纳项目如一次性收取，按多征处理。
  audit_item: 违反规定征收非税收入
  suspicion: 多征或提前征收非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"任何部门和单位不得违反规定擅自改变征收范围、标准、对象和期限。包括不得提前征收、多征非税收入。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范非税收入征收管理的通知\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"严禁采取一次性、集中等方式提前征收非税收入，严禁超标准、超范"
