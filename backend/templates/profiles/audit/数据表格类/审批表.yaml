    ,\n    \"条款号\": \"二（三）\",\n    \"内容概述\": \"要严格监测对象识别认定程序，坚持公开公平公正原则，由村‘两委’、驻村工作队、包村干部组织开展入户走访、信息比对、民主评议和公示公告，确保群众知情权、参与权、监督权。\"\
    \n  }\n]"
- expression: (住房公积金缴存明细表.缴存状态 = '正常') && (人力资源系统在职人员清单.状态 = '退休') && (DATEDIFF(DAY, 人力资源系统在职人员清单.退休日期, CURRENT_DATE) > 365)
