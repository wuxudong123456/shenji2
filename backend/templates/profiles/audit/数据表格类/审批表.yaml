    第三条\",\n    \"内容概述\": \"在中华人民共和国境内进行的大型基础设施、公用事业等关系社会公共利益、公众安全的项目，全部或者部分使用国有资金投资或者国家融资的项目，以及使用国际组织或者外国政府贷款、援助资金的项目，其采购必须进行招标。\"\
    \n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n    \"法规文号\": \"国家发展改革委令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条"
- expression: (验收文件.规划用途 = '养老服务设施' || 土地证.土地性质 = '社会福利') && (登记表.实际用途 != '养老服务' && 登记表.实际用途 != '配套办公') && (审批表 IS NULL OR
    审批表.审批结果 != '同意')
  description: 原规划用途为养老服务设施，实际用途变为非养老服务（如出租商业、仓储、餐饮），且未取得合法用途变更审批，即构成违规改变房屋用途。若存在审批但审批流程不合规（如越权审批）也属违规。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 违规改变农村养老机构房屋用途
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第三十三条\",\n    \"内容概述\": \"养老机构应当依法保障收住老年人的合法权益，未经批准不得擅自改变养老服务设施的使用性质。任何组织或者个人不得侵占、挪用或者擅自拆除养老服务设施。\"\n  }\n]"
- expression: (资金用途、拨付对象.资金用途 != 明细表.支出摘要 && 明细表.金额 > 补贴标准*0.1) || (审批表.资金用途变更审批记录 && 明细表.收款方名称 != '农户' && 明细表.金额 > 50000)
  description: 比对分配方案中明确的惠农用途与实际支出凭证的摘要，若不一致且金额偏离超过补贴标准的10%，视为可疑；或者存在未经上级审批的资金用途变更且金额超过5万元的大额转账至非农户账户，触发违规警报。
  audit_item: 监管不到位，惠农补贴资金被套取骗取、违规使用
  suspicion: 乡镇主管部门挤占挪用惠农补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员违反规定，擅自占有、使用、处置国有资产的，或截留、挪用财政资金的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。对单位给予警告或者通报批评。对直接负责的主管人员和其他直接责任人员给予记大过处分；情节较重的，给予降级或者撤职处分；情节严重的，给予开除处分。\"\
    \n  }\n]"
- expression: （《监测对象识别纳入审批表》.行政村意见栏 无 签字 或 日期） || （《民主评议会议记录》.参会人数 < 村户籍人口代表比例要求） || （《监测对象公示公告原始材料》.公示日期差 < 5天） || （《审批表》.审批通过日期
    < 《民主评议会议记录》.评议日期）
  description: 程序违规判定规则：1. 审批表上无村两委负责人签字或有签字无日期，视为程序缺失；2. 民主评议参会代表人数不足，无法代表广泛民意；3. 公示公告的起始日到结束日时间差不足5天（或未达当地政策要求的最短公示期），属于假公示或走过场；4.
    审批通过的日期竟然早于民主评议的开会日期，属于典型的先审批后补程序的时间逻辑错误。以上任一条件成立，均判定为识别程序不合规。
  audit_item: 防止返贫监测对象和范围、方式和程序不符合规定
