name: audit/数据表格类/审批表
type: model
description: 从数据表格类类文档（审批表）中提取结构化元数据。涵盖字段如：乡镇审核意见栏、兼职单位、决策参会人员、前置条件清单及文件编号、参会人员、变更前用途、变更后用途、各级审批日期。文档范围包括：低保申请审批表、公共设施用途变更审批表、医保定点医疗机构申报审批表、单一来源采购审批表、因公出国（境）预算调整或追加审批表、在职人员兼职申报审批表、工期延期审批表、工程变更审批表、房屋用途变更审批表、招标立项审批表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 安全
- 审批
- 招投标
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 审批表
  member_count: 1
  member_details:
