    \n  },\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n   "
- expression: '( DATEDIFF(公示对象姓名.公示起止日期, 公示对象姓名.公示起止日期) < 7 OR 公示对象姓名.公示内容 NOT LIKE ''%家庭人口%'' OR 公示对象姓名.公示内容 NOT LIKE ''%保障金额%''
    OR 公示对象姓名.公示照片 IS NULL OR (拍摄时间.拍摄时间 < 公示对象姓名.公示起止日期 OR 拍摄时间.拍摄时间 > 公示对象姓名.公示起止日期) OR EXISTS (SELECT 1 FROM 审批表 WHERE
    审批通过名单 AND 申请人姓名 NOT IN (SELECT 公示对象姓名.公示对象姓名 FROM 公示对象姓名 WHERE 公示起止日期 '
  description: 满足任一条件视为公示程序违规：1.公示期不足7天（或地方规定天数）；2.公示内容未包含家庭人口或保障金额等关键信息；3.无公示照片或照片拍摄时间不在公示期内，属无效公示或虚假公示；4.存在已审批通过的对象未出现在任何批次公示名单中，即未经公示直接纳入。
  audit_item: 最低生活保障审核审批程序不合规
  suspicion: 未按规定对低保对象进行公示
  regulation: "[\n  {\n    \"法规名称\": \"最低生活保障审核确认办法\",\n    \"法规文号\": \"民发〔2021〕57号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"对拟确认为低保对象的，乡镇人民政府（街道办事处）应当在申请人家庭所在村、社区进行公示，公示期为7天；公示内容应当包括申请人姓名、家庭人口数、保障金额等信息。\"\n  },\n\
    \  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十一条\",\n   \
    \ \"内容概述\""
- expression: (审批表.批准变更用途 != 审批文件.批准用途 && 收支台账.摘要 != 收支台账.收入项目名称) || (照片.实际使用状况描述 != 审批文件.批准用途 && 审批表.审批文号 != 收支台账.金额) ||
    (收支台账.交易对象 != 收支台账.交易对象 && 审批文件.批准用途 != 图.规划功能)
  description: 表达式主要核查所有权人或运营单位是否未经批准或超出批准范围改变公租房及配套设施的保障性用途。通过规划文件与审批变更表比对，发现审批用途与规划不一致，且财务有商业收益，或实际现状与规划不符且无任何审批，或擅自出售配套用房，任一情况均构成违规改变性质用途。
  audit_item: 未按规定使用公共租赁住房
  suspicion: 所有权人或运营单位违规改变公租房性质及用途
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"公共租赁住房的所有权人及其委托的运营单位不得改变公共租赁住房的保障性住房性质、用途及其配套设施的规划用途。\"\n  }\n]"
