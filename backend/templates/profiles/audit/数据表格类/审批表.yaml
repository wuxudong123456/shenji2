violations:
- expression: (在职人员兼职申报审批表.审批状态 != '批准' OR 在职人员兼职申报审批表.兼职单位 NOT IN (行业协会商会成员名单.任职单位)) AND (党员领导干部个人事项报告表.兼职单位及职务 = 行业协会商会成员名单.任职单位
    OR 行业协会商会成员名单.身份证号 IS NOT NULL)
  description: 判断是否存在在职人员（尤其是领导干部）在行业协会商会兼职但未申报或审批未通过的情形：1.兼职申报表中无对应兼职记录或审批未批准；2.个人事项报告中披露了该兼职但审批缺失；或者未在个人报告中披露但在行业协会名单中发现。满足任一条件即触发疑点，需结合职级判定领导干部身份。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
