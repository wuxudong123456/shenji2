  - 公共设施用途变更审批表
  - 医保定点医疗机构申报审批表
  - 单一来源采购审批表
  - 因公出国（境）预算调整或追加审批表
  - 在职人员兼职申报审批表
  - 工期延期审批表
  - 工程变更审批表
  - 房屋用途变更审批表
  - 招标立项审批表
  - 监测对象识别纳入审批表
