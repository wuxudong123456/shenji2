  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十四条\",\n    \"内容概述\": \"违反有关规定在经济组织、社会组织等单位中兼职，或者经批准兼职但获取薪酬、奖金、津贴等额外利益的，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"中华人民共和国主席令第二十号\",\n    \"效力级别\": \"法"
- expression: (经济实体股东高管名单.人员姓名 IN (在职人员兼职申报审批表.姓名) AND (在职人员兼职申报审批表.审批状态 != '批准' OR 在职人员兼职申报审批表.兼职单位 != 经济实体股东高管名单.企业名称))
    AND (薪酬发放凭证.收款人姓名 == 经济实体股东高管名单.人员姓名 OR 工资外收入明细表.对方单位 == 经济实体股东高管名单.企业名称 AND 工资外收入明细表.金额 > 0)
  description: 首先识别在职人员在经济实体兼任股东或高管且未履行批准程序，然后判定存在从该实体收取报酬的证据（如银行流水显示顾问费、工资外收入明细中的劳务费等）。两个条件同时满足即构成违规兼职取酬。若仅兼职未发现取酬，仍可能构成违规兼职，另案处理。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 在职人员违规兼职取酬
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十四条\",\n    \"内容概述\": \"违反有关规定在经济组织、社会组织等单位中兼职，或者经批准兼职但获取薪酬、奖金、津贴等额外利益的，依照前款规定处理。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国公职人员政务处分法\",\n    \"法规文号\": \"中华人民共和国主席令第四十六号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十六条\",\n    \"内容概述\"\
    : \"违反规定从"
- expression: 明细表.采购方式 = '单一来源采购' AND (审批文件 IS NULL OR 审批文件.批准文号 IS NULL) AND (审批表.审批结论 != '同意' OR 审批表.论证专家意见 IS NULL)
  description: 单一来源采购属于非竞争性采购方式，必须经过严格的专家论证和审批程序。若项目采用单一来源采购但缺少审批文件或论证审批表未通过，即判定为违规。
  audit_item: 政府采购组织管理不规范
  suspicion: 未经批准擅自采用单一来源方式采购
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十一条\",\n    \"内容概述\": \"符合下列情形之一的货物或者服务，可以依照本法采用单一来源方式采购：（一）只能从唯一供应商处采购的；（二）发生了不可预见的紧急情况不能从其他供应商处采购的；（三）必须保证原有采购项目一致性或者服务配套的要求，需要继续从原供应商处添购，且添购资金总额不超过原合同采购金额百分之十的。采购人申请单一来源采购，应当报经主管预算单位同意，同级财政部门批准。\"\
    \n  },\n  {\n    \"法规名"
- expression: (预算编制表.预算团组编号 NOT IN (SELECT 团组明细表.实际团组编号 FROM 团组明细表 WHERE 团组明细表.出访任务 NOT LIKE '%取消%')) OR (费用报销明细表.报销团组编号 IS
    NOT NULL AND 费用报销明细表.报销团组编号 NOT IN (SELECT 预算编制表.预算团组编号 FROM 预算编制表) AND 费用报销明细表.报销团组编号 NOT IN (SELECT 预算调整审批表.调整团组编号 FROM
    预算调整审批表 WHERE 预算调整审批表.审批状态 = '已批准'))
  description: 此表达式用于筛查两类违规：1. 预算编制表中已列支预算的团组，在团组明细表中缺失，疑为虚假预算或预算未执行，需核实原因；2. 费用报销明细表中存在实际发生的团组报销，但该团组既不在年初预算表也不在预算调整审批表中，直接判定为“未纳入预算管理”。紧急任务等特殊情况需结合批复文件人工复核。
  audit_item: 未按规定编制因公出国（境）经费预算
  suspicion: 因公出国（境）团组未纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"《党政机关厉行节约反对浪费条例》\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"党政机关应当建立健全并严格执行国内差旅内部审批制度，从严控制国内差旅人数和天数，严禁无明确公务目的的差旅活动，严禁以公务差旅为名变相旅游，严禁异地部门间无实质内容的学习交流和考察调研。\"\
    \n  },\n  {\n    \"法规名称\": \"《因公临时出国经费管理办法》\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n  "
- expression: (月报.实际里程碑完成日期 - 计划完成日期 > 30 && (会议纪要.预警事项记录 == null || 审批表.批复日期 > 月报.实际里程碑完成日期))
  description: 当任一关键里程碑实际完成时间超出计划30天以上，且项目进度会议纪要中无相应进度预警及纠偏指令，或工期延期审批滞后于实际延误发生时间，判定为进度管理失控，存在未及时识别并纠正偏差的违规行为。
  audit_item: 大型水利工程进度与成本审计
  suspicion: 关键里程碑节点延误未实施纠偏措施
  regulation: "[\n  {\n    \"法规名称\": \"水利工程建设项目管理规定（试行）\",\n    \"法规文号\": \"水建[1995]128号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十条\",\n    \"内容概述\": \"项目法人应加强建设项目的管理，严格控制工程进度，建立进度控制目标体系，定期进行进度分析，采取有效赶工措施纠正偏差。\"\n  },\n  {\n    \"法规名称\"\
    : \"建设工程监理规范\",\n    \"法规文号\": \"GB/T 50319-2013\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"6.2.5\",\n    \"内容概述\": \"\
    项目监理机构"
