    : \"第十三条\",\n    \"内容概述\": \"工程设计变更确定后14天内，如承包人未提出变更工程价款报告，则发包人可根据所掌握的资料决定是否调整合同价款和调整的具体金额。重大工程变更涉及工程价款变更报告和确认的时限应当严格掌握。\"\
    \n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条"
- expression: (分配表.授权金额上限 < 审批表.项目预算金额) || (分配表.授权项目类型 NOT CONTAINS 审批表.项目类型) || (审批表.审批日期 < 分配表.有效期开始 OR 审批表.审批日期 > 分配表.有效期结束)
    || (日志表.操作人 对应的 分配表.审批人姓名 不存在)
  description: 判定逻辑：1.审批人的授权金额上限小于项目预算金额；2.审批人的授权项目类型不包含该项目类型；3.审批日期不在该审批人权限有效期内；4.操作日志中的审批操作人无任何有效权限记录。满足任一条件即触发越权审批疑点。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 超越规定审批权限审批建设项目
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照规定的程序审批，不得超越审批权限审批政府投资项目。\"\n  }\n]"
- expression: SUM(汇总表.预算金额) GROUP BY (建设单位, LEFT(建设内容摘要,10), YEAR(审批时间)) HAVING SUM(预算金额) > (SELECT 审批金额门槛 FROM 制度文件 WHERE
    层级='上级') AND COUNT(*)>1 AND MAX(汇总表.预算金额) <= (SELECT 审批金额门槛 FROM 制度文件 WHERE 层级='本级')
  description: 分组条件：同一建设单位，建设内容前10字相似（如含相同关键词），且审批时间在同一年度内。若分组后项目总预算超过上级审批金额阈值，且单个项目预算均未超过本级审批阈值，且子项目数量大于1，则高度疑似拆分规避审批。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 以拆分项目方式规避审批权限
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照规定的程序审批，不得超越审批权限审批政府投资项目；禁止通过化整为零等方式规避审批权限。\"\n  }\n]"
- expression: (审批表.前置条件清单（如环评批复、用地预审、规划许可）及文件编号 > 审批表.审批日期) OR (审批表.前置条件清单（如环评批复、用地预审、规划许可）及文件编号 IS NULL AND 说明文件.必须取得顺序要求)
    OR (验收报告.实际开工日期 < 审批表.前置条件清单（如环评批复、用地预审、规划许可）及文件编号)
  description: 条件1：关键前置文件（如环评批复）的批准日期晚于项目立项审批日期；条件2：立项审批表中必填的前置文件编号缺失；条件3：项目实际开工日期早于前置条件取得日期，表明未批先建。三者满足任一即构成违规。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 未取得法定前置审批条件违规批准建设项目
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\": \"中华人民共和国主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十五条\",\n    \"内容概述\": \"建设项目的环境影响评价文件未依法经审批部门审查或者审查后未予批准的，建设单位不得开工建设。\"\n  },\n  {\n    \"法规名称\": \"政府投资条例\"\
    ,\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十二条\",\n    \"内容概述\": \"项目单位应当依法办理相关审批手续，在取得规定的前置审批文件"
- expression: ( (审批表.表决结果 IS NULL OR 审批表.审批日期 > 明细表.交易日期) AND 明细表.金额 > 0 ) OR ( 明细表.风险敞口占净资产比例 > 管理制度.止损限额 ) OR ( 明细表.品种 IN
    (管理制度.禁止交易品种清单) )
  description: 分三部分判定：①交易发生但无对应集体决策审批记录，或者审批日期晚于实际交易日期，表明先斩后奏或未经审批；②风险敞口占净资产比例超过企业风险管理制度规定的最高限额，表明内控执行失效；③交易品种属于企业制度明令禁止的高风险衍生品，属于违规超范围经营。任一条件成立即触发疑点。
  audit_item: 违规进行重大资本运作及高风险投资
