  regulation: "[\n  {\n    \"法规名称\": \"中央企业投资监督管理办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第34号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十四条\",\n    \"内容概述\": \"中央企业应当建立健全投资管理制度，明确投资决策程序，重大投资应当经董事会审议决定，不得违规决策，严禁任何个人或组织擅自决定重大投资事项。\"\n  },\n\
    \  {\n    \"法规名称\": \"关于切实加强金融衍生业务管理有关事项的通知\",\n    \"法规文号\": \"国资发财评规〔2020〕8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第"
- expression: 采购合同台账.采购金额 >= 企业内部采购管理制度.强制招标金额起点 && (采购方式审批单.审批方式 != '招标' || 采购方式审批单 IS NULL) && 中标通知书 IS NULL
