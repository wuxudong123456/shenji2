name: audit/数据表格类/排查表
type: model
description: 从数据表格类类文档（排查表）中提取结构化元数据。涵盖字段如：发放次数、培训项目、累计金额、身份证号。文档范围包括：职业技能鉴定/培训补贴重复发放排查表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 培训
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 排查表
  member_count: 1
  member_details:
  - 职业技能鉴定/培训补贴重复发放排查表
output:
  fields:
  - name: 发放次数
    type: string
    description: 提取 发放次数 的文本值
  - name: 培训项目
    type: string
    description: 提取 培训项目 的文本值
  - name: 累计金额
    type: number
    description: 提取 累计金额 的数值（含单位，如万元、吨等）
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (COUNT(身份证号、培训项目名称、培训起止时间、补贴金额.身份证号) > 1) || (同一身份证号在不同补贴项目(如职业技能鉴定与职业培训)中出现) || (SUM(身份证号、培训项目名称、培训起止时间、补贴金额.补贴金额)
    > 政策上限(如2000元/人))
  description: 以身份证号为主键，对补贴发放台账进行分组聚合，当同一人在同类补贴中出现次数超过1次，或者跨不同补贴项目均出现，或者累计领取金额超过政策规定每人每年上限，即判定为重复或超额发放违规。
  audit_item: 违规发放资金或补贴
  suspicion: 违规向同一人员重复发放职业技能培训补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"职业培训补贴、职业技能鉴定补贴等，同一项目不得重复享受，享受补贴的个人应按照规定提供真实有效的培训证明材料。\"\n  },\n  {\n    \"法规名称\": \"关于进一步做好职业培训补贴资金使用管理工作的通知\"\
    ,\n    \"法规文号\": \"人社厅发〔2019〕117号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"各地"
