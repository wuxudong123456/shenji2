name: audit/数据表格类/核验表
type: model
description: 从数据表格类类文档（核验表）中提取结构化元数据。涵盖字段如：与普查数据库一致性比例、享受其他保障政策记录、入库面积、关键字段完整率、出生日期、坐标、复核得分、复核满意度百分比。文档范围包括：个人身份信息核验表、信息平台数据完整性与准确性核验表、受益对象信息交叉核验表、第三方评估数据核验表、项目入库数据核验表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 核验表
  member_count: 1
  member_details:
  - 个人身份信息核验表
  - 信息平台数据完整性与准确性核验表
  - 受益对象信息交叉核验表
  - 第三方评估数据核验表
  - 项目入库数据核验表
output:
  fields:
  - name: 与普查数据库一致性比例
    type: number
    description: 提取 与普查数据库一致性比例 的数值（含单位，如万元、吨等）
  - name: 享受其他保障政策记录
    type: string
    description: 提取 享受其他保障政策记录 的文本值
  - name: 入库面积
    type: string
    description: 提取 入库面积 的文本值
  - name: 关键字段完整率
    type: string
    description: 提取 关键字段完整率 的文本值
  - name: 出生日期
    type: date
    description: 提取 出生日期 的日期值，格式 YYYY-MM-DD
  - name: 坐标
    type: string
    description: 提取 坐标 的文本值
  - name: 复核得分
    type: string
    description: 提取 复核得分 的文本值
  - name: 复核满意度百分比
    type: string
    description: 提取 复核满意度百分比 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 性别
    type: string
    description: 提取 性别 的文本值
  - name: 户籍状态
    type: boolean
    description: 提取 户籍状态 的布尔值（是/否）
  - name: 收入水平
    type: number
    description: 提取 收入水平 的数值（含单位，如万元、吨等）
  - name: 社保缴纳地
    type: string
    description: 提取 社保缴纳地 的文本值
  - name: 质量等级
    type: string
    description: 提取 质量等级 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (功能模块.验收通过结论 IS NULL) || (功能模块.验收通过结论 = '未通过') || (核验表.关键字段完整率 < 90%) || (核验表.与普查数据库一致性比例 < 85%)
  description: 建设方案缺失或未通过验收，即视为未建设平台；平台数据完整率低于90%或与底层普查数据库关键信息匹配率低于85%，说明平台未有效运行，形成“空壳”或数据孤岛，存在监管盲区。
  audit_item: 农村危房改造（含农房改善、撤村并居）不符合相关规定
  suspicion: 未建设农村房屋综合信息管理平台
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部关于进一步加强农村危房改造工作的通知\",\n    \"法规文号\": \"建村〔2018〕63号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"各地要加快农村危房改造信息化建设，建立农户档案信息系统，实现危房改造全过程监管和数据动态更新。\"\n  }\n]"
- expression: ABS(自评指标得分.自评指标得分 - 复核得分.复核得分) / 复核得分.复核得分 > 0.15 OR (自评满意度百分比.自评满意度百分比 - 复核满意度百分比.复核满意度百分比) > 20
  description: 自评得分与第三方复核得分差异率超过15%，或群众满意度自评值与复核实测值相差20个百分点以上，且无合理调整依据，提示自评或第三方评估失真，存在弄虚作假嫌疑。
  audit_item: 资金绩效管理不到位
  suspicion: 绩效自评与第三方评估数据弄虚作假
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"绩效评价应当确保数据真实、准确、完整，部门和单位应当对绩效自评结果的真实性、准确性负责；对弄虚作假、严重失实的，依规追究责任。\"\n  }\n]"
- expression: ABS(入库面积、坐标、质量等级.入库面积 - 监测面积、坐标、质量等级.监测面积) / 监测面积、坐标、质量等级.监测面积 > 0.05 OR SQRT(POW(入库面积、坐标、质量等级.坐标X - 监测面积、坐标、质量等级.坐标X,
    2) + POW(入库面积、坐标、质量等级.坐标Y - 监测面积、坐标、质量等级.坐标Y, 2)) > 100 OR 入库面积、坐标、质量等级.质量等级 != 监测面积、坐标、质量等级.质量等级
  description: 面积偏差率超过5%，或坐标偏移超过100米，或质量等级不匹配，均判定数据不准确或涉嫌虚报。
  audit_item: 违反高标准农田项目规划和管理规定的行为
  suspicion: 上图入库数据不准确或虚报
  regulation: "[\n  {\n    \"法规名称\": \"高标准农田建设质量管理办法（试行）\",\n    \"法规文号\": \"农建发〔2021〕1号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十五条\",\n    \"内容概述\": \"上图入库信息应当真实、准确、完整，不得虚报、瞒报、篡改。\"\n  }\n]"
- expression: (COUNT(信息表 WHERE 账户状态='正常' GROUP BY 身份证号) > 1) && (EXISTS (SELECT 缴存月份 FROM 记录表 WHERE 身份证号 IN (SELECT 身份证号 FROM
    信息表 WHERE 账户状态='正常' GROUP BY 身份证号 HAVING COUNT(*) > 1) GROUP BY 缴存月份 HAVING COUNT(DISTINCT 账户编号) > 1))
  description: 以身份证号为唯一标识，当同一公积金管理中心内同一身份证号下存在2个及以上状态为正常的账户，且至少在一个缴存月份内，这些不同账户均存在缴存记录，则触发违规判定。阈值设为正常账户数>1，且同一月份不同账户缴存记录数≥2，两条件同时满足视为严重违规疑点。
  audit_item: 多个账户重复缴存住房公积金
  suspicion: 同一人在一个公积金管理中心重复设立多个正常缴存账户
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"每个职工只能有一个住房公积金账户。单位应当到住房公积金管理中心办理住房公积金缴存登记，并为本单位职工办理住房公积金账户设立手续。\"\n  }\n]"
- expression: (COUNT(比对表 WHERE 账户状态='正常' GROUP BY 身份证号) > 1) && (EXISTS (SELECT 缴存月份 FROM (SELECT 身份证号, 缴存月份, 管理中心归属 FROM
    信息表) GROUP BY 身份证号, 缴存月份 HAVING COUNT(DISTINCT 管理中心归属) > 1))
  description: 基于跨中心缴存记录比对表，当同一身份证号在2个及以上公积金管理中心均存在正常状态账户，且缴存明细中存在同一缴存月份不同管理中心同时有缴存记录的情况，即判定为跨中心重复缴存违规。若无跨中心比对表，则需通过身份证号+姓名模糊匹配各中心数据，逻辑相同。阈值设为不同管理中心正常账户数>1，且存在月份内多中心缴存重叠。
  audit_item: 多个账户重复缴存住房公积金
  suspicion: 同一人在多个公积金管理中心重复设立正常缴存账户
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"每个职工只能有一个住房公积金账户。单位应当到住房公积金管理中心办理住房公积金缴存登记，并为本单位职工办理住房公积金账户设立手续。\"\n  }\n]"
- expression: ( (ABS(申报材料.改造户数 - 验收报告.实际完成户数) / 申报材料.改造户数 > 0.2) || (受益对象信息交叉核验表.户籍状态 = '注销' OR 受益对象信息交叉核验表.收入水平 > 当地准入标准)
    || (申报项目地址的土地用途 NOT IN ('保障性安居工程用地','划拨建设用地') ) || (银行账户流水.收款方名称 NOT IN (受益人名单.姓名) && 金额 > 50万元) || (项目申报材料.批复日期 > 项目资金拨付记录表.拨付日期)
    )
  description: 1. 虚实偏差阈值：申报改造户数与验收实际户数偏差超过20%即触发可疑；2. 受益人资格异常：发现受益人为已死亡/高收入/已享受其他安置政策的个体；3. 土地性质不符：项目地址土地非安居住地性质；4. 大额资金流向非受益人：单笔超50万元拨款未转入受益人名下，可能流向关联方；5.
    时间逻辑矛盾：拨款早于项目批复，可能为虚构项目提前套取。满足任一条件则判定为虚假申报疑点。
  audit_item: 骗取或套取中央财政保障性安居工程专项资金
  suspicion: 虚假申报材料骗取安居工程专项资金
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程专项资金管理办法\",\n    \"法规文号\": \"财综〔2019〕31号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十四条\",\n    \"内容概述\": \"申报使用资金的单位和个人，应当严格按照规定使用资金，不得弄虚作假、虚报冒领，不得以任何形式骗取、套取专项资金。\"\n  },\n  {\n    \"\
    法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\"\
    : \"国家机关及其工作"
