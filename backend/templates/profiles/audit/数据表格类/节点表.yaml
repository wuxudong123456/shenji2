name: audit/数据表格类/节点表
type: model
description: 从数据表格类类文档（节点表）中提取结构化元数据。涵盖字段如：实际完成时间、当前进度状态、规划编号、计划完成时间、计划开始时间。文档范围包括：村庄规划编制时间节点表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 节点表
  member_count: 1
  member_details:
  - 村庄规划编制时间节点表
output:
  fields:
  - name: 实际完成时间
    type: date
    description: 提取 实际完成时间 的日期值，格式 YYYY-MM-DD
  - name: 当前进度状态
    type: boolean
    description: 提取 当前进度状态 的布尔值（是/否）
  - name: 规划编号
    type: string
    description: 提取 规划编号 的文本值
  - name: 计划完成时间
    type: date
    description: 提取 计划完成时间 的日期值，格式 YYYY-MM-DD
  - name: 计划开始时间
    type: date
    description: 提取 计划开始时间 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
