    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 利润表.营业收入 != (SUM(主营业务收入贷方合计、销售退回借方合计.主营业务收入贷方合计) - SUM(主营业务收入贷方合计、销售退回借方合计.销售退回借方合计))
  description: 利润表营业收入应与收入明细账计算出的净收入一致，如不相等且无合理重分类调整，则疑点成立。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 利润表营业收入与收入明细账合计不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计报表进行核对，保证会计账簿记录与会计报表的有关内容相符。\"\n  }\n]"
- expression: ((明细表.税收返还类型 = '增值税即征即退') AND (会计凭证.贷方科目 = '应交税费' OR 会计凭证.贷方科目包含'税金') AND (会计凭证.借方科目 = '银行存款') AND (明细账.发生额中未包含该笔金额))
    OR ((会计凭证.摘要 LIKE '%退税%' OR '%返还%') AND (明细账.账龄 > 365天) AND (明细表.已返金额 > 0))
  description: 增值税即征即退等税收返还应按规定确认为其他收益，但企业可能直接冲减应交税费科目，未确认损益；出口退税等款项可能错误挂账在其他应付款长期不结转。表达式检测：有税务返还银行收款，但会计处理贷方为税金冲减而非收益确认，则违规；或者税务返还长期挂账其他应付款超过一年，也属隐匿收益。
  audit_item: 未按规定核算政府补助
  suspicion: 税收返还资金未按规定确认为当期收益
  regulation: "[\n  {\n    \"法规名称\": \"增值税会计处理规定\",\n    \"法规文号\": \"财会[2016]22号\",\n    \"效力级别\": \"部门规范性文件\",\n    \"条款号\"\
    : \"二、账务处理（十）\",\n    \"内容概述\": \"增值税即征即退、先征后退等各项税收返还，应于收到时计入“其他收益”科目。\"\n  }\n]"
- expression: (银行对账单.收款金额 > 明细账.收入金额 * 1.1) || (数据.收款金额 > 税申报表.应税销售额) || (发存台账.金额 > 明细账.收入金额 * 1.05)
  description: 银行流水收入明显高于账面收入（偏差>10%）、业务系统收款大于申报销售额或出库金额大于账面收入（偏差>5%），均暗示存在账外收入。
  audit_item: 未按规定确认收入
  suspicion: 隐瞒业务少计收入
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计账簿，编制财务会计报告。\"\n  }\n]"
- expression: 监控表.受托支付对象 = 贷款合同.借款方 && (ABS = 0 || 贷款合同.贷款金额 > 税申报表.销售收入 * 0.5) && 评估报告.评估价值 > 0
  description: 贷款资金支付给关联虚构供应商，且申请材料中贸易合同规模远超实际经营能力，抵押物价值虚高，三者结合判定骗取贷款。
  audit_item: 资金管理方面存在的问题
  suspicion: 虚构贸易背景套取贷款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百七十五条之一\"\
    ,\n    \"内容概述\": \"以欺骗手段取得银行或者其他金融机构贷款，给银行或者其他金融机构造成重大损失的，构成骗取贷款罪。\"\n  }\n]"
- expression: ((SUM(银行账户交易流水[贷方发生额]) - 利润表.主营业务收入) / 利润表.主营业务收入 > 0.1) && (发票管理台账.发票金额 < 利润表.主营业务收入 * 0.9)
  description: 通过银行经营性质贷方流入（剔除同名互转、借款等）与企业账面主营收入的偏差率超过10%，且开具发票金额明显低于账面收入，表明存在未开票未入账收入。偏差率10%为可疑阈值，超过则触发疑点。
  audit_item: 违反税收征管规定的行为
  suspicion: 隐匿销售收入少缴企业所得税
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业所得税法\",\n    \"法规文号\": \"主席令第六十三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第六条\",\n    \"内容概述\": \"企业以货币形式和非货币形式从各种来源取得的收入，为收入总额，包括销售货物收入、提供劳务收入等。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国税收征收管理法\"\
    ,\n    \"法规文号\": \"主席令第四十九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第六十三条\",\n    \"内容概述\": \"纳税人伪造、变造、隐匿、擅自销毁账簿、记账凭证，或者在账簿"
- expression: (采购合同.合同总额 != 入库单.数量) || (管理台账.发票金额 > 付款记录.金额 * 1.2) || (固定资产折旧与摊销明细表.本期折旧 > (固定资产原值 * 税法最低折旧率上限))
  description: 逻辑判断：采购合同、入库单、发票三单金额不一致，或发票金额显著超过实际付款（无真实交易），或折旧摊销超出税法允许上限，均构成虚列成本。其中发票金额超过付款金额20%视为异常。
  audit_item: 违反税收征管规定的行为
  suspicion: 虚列成本费用少缴企业所得税
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业所得税法\",\n    \"法规文号\": \"主席令第六十三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第八条\",\n    \"内容概述\": \"企业实际发生的与取得收入有关的、合理的支出，包括成本、费用、税金、损失和其他支出，准予在计算应纳税所得额时扣除。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国税收征收管理法\"\
    ,\n    \"法规文号\": \"主席令第四十九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第六十三条\",\n    \"内容概述\": \"多列支出属于偷税行为，由税务机关追缴其不"
- expression: (明细表.毛利率 < 明细表.非关联方价格 * 0.75) && (利润表.整体毛利率 < 数据.利润水平区间 * 0.5)
  description: 关联交易毛利率低于可比非关联交易毛利率的75%，且企业整体利润水平显著低于行业中位数50%时，表明可能通过转让定价向低税地区或关联方转移利润。
  audit_item: 违反税收征管规定的行为
  suspicion: 关联交易定价不公允转移利润少缴企业所得税
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业所得税法\",\n    \"法规文号\": \"主席令第六十三号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第四十一条\",\n    \"内容概述\": \"企业与其关联方之间的业务往来，不符合独立交易原则而减少企业或者其关联方应纳税收入或者所得额的，税务机关有权按照合理方法调整。\"\n  },\n  {\n    \"法规名称\"\
    : \"中华人民共和国企业所得税法实施条例\",\n    \"法规文号\": \"国务院令第512号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第一百一十条\",\n    \"内容概述\"\
    : \"独立交易原"
- expression: (城市维护建设税计税依据、税率、应纳税额.城市维护建设税计税依据 != (实际缴纳增值税额、销项税额、视同销售金额、进项税额、进项税额转出额.实际缴纳增值税额 + 实际缴纳消费税额、应税销售额、计税数量、适用税率.实际缴纳消费税额))
    || (城市维护建设税计税依据、税率、应纳税额.应纳税额 < (实际缴纳增值税额、销项税额、视同销售金额、进项税额、进项税额转出额.实际缴纳增值税额 + 实际缴纳消费税额、应税销售额、计税数量、适用税率.实际缴纳消费税额) * 城市维护建设税计税依据、税率、应纳税额.税率)
  description: 城市维护建设税以纳税人实际缴纳的增值税、消费税税额为计税依据。若附加税申报表中的计税依据小于主税种实际缴纳总额，或计算税额低于法定乘积，则存在少缴。适用税率按7%（市区）、5%（县城、镇）、1%（其他）。
  audit_item: 违反税收征管规定的行为
  suspicion: 未按实际缴纳增值税消费税计缴城市维护建设税
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城市维护建设税法\",\n    \"法规文号\": \"主席令第五十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二条\",\n    \"内容概述\": \"城市维护建设税以纳税人依法实际缴纳的增值税、消费税税额为计税依据。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国城市维护建设税法\",\n    \"\
    法规文号\": \"主席令第五十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"城市维护建设税税率如下：纳税人所在地在市区的，税率为百分之七；在县城、镇的，税率为百"
- expression: (明细账.对方科目为‘应付职工薪酬’或‘在建工程’等非销售科目) && 该部分商品未在税申报表.视同销售金额栏次申报
  description: 将自产或委托加工的货物用于集体福利、个人消费、投资、分配、无偿赠送等，应视同销售计算销项税额。若库存商品出库记录对应的非销售科目金额未包含在增值税申报销售收入或视同销售金额中，即存在漏报销项税。
  audit_item: 违反税收征管规定的行为
  suspicion: 视同销售行为未计提增值税销项税额
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国增值税暂行条例实施细则\",\n    \"法规文号\": \"财政部 国家税务总局令第50号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"单位或者个体工商户将自产、委托加工的货物用于集体福利或者个人消费、投资、分配、无偿赠送等行为，视同销售货物。\"\n  }\n]"
- expression: 明细表中存在(费用性质为‘餐饮服务’、‘居民日常服务’、‘娱乐服务’、‘贷款服务’) 或 (明细表.用途用于集体福利、个人消费) 且 实际缴纳增值税额.进项税额转出额 = 0
  description: 用于简易计税方法计税项目、免征增值税项目、集体福利或者个人消费的购进货物、劳务、服务，以及购进的贷款服务、餐饮服务、居民日常服务和娱乐服务的进项税额不得从销项税额中抵扣。若已申报抵扣且未做转出，即为违规。
  audit_item: 违反税收征管规定的行为
  suspicion: 不得抵扣进项税额违规抵扣
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国增值税暂行条例\",\n    \"法规文号\": \"国务院令第691号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
