name: audit/数据表格类/税申报表
type: model
description: 从数据表格类类文档（税申报表）中提取结构化元数据。涵盖字段如：企业名称、减免税额栏填报情况、利润、城市维护建设税计税依据、存货、实际缴纳增值税额、实际缴纳消费税额、实际缴纳税额。文档范围包括：企业所得税申报表、企业纳税申报表、农业企业增值税申报表、增值税申报表、消费税申报表、税务机关个人所得税申报表、纳税申报表、附加税申报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 税申报表
  member_count: 1
  member_details:
  - 企业所得税申报表
  - 企业纳税申报表
  - 农业企业增值税申报表
  - 增值税申报表
  - 消费税申报表
  - 税务机关个人所得税申报表
  - 纳税申报表
  - 附加税申报表
output:
  fields:
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 减免税额栏填报情况
    type: string
    description: 提取 减免税额栏填报情况 的文本值
  - name: 利润
    type: string
    description: 提取 利润 的文本值
  - name: 城市维护建设税计税依据
    type: string
    description: 提取 城市维护建设税计税依据 的文本值
  - name: 存货
    type: string
    description: 提取 存货 的文本值
  - name: 实际缴纳增值税额
    type: string
    description: 提取 实际缴纳增值税额 的文本值
  - name: 实际缴纳消费税额
    type: number
    description: 提取 实际缴纳消费税额 的数值（含单位，如万元、吨等）
  - name: 实际缴纳税额
    type: string
    description: 提取 实际缴纳税额 的文本值
  - name: 应税销售额
    type: string
    description: 提取 应税销售额 的文本值
  - name: 应纳税所得额
    type: string
    description: 提取 应纳税所得额 的文本值
  - name: 应纳税额
    type: string
    description: 提取 应纳税额 的文本值
  - name: 申报年度
