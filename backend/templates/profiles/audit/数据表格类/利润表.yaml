name: audit/数据表格类/利润表
type: model
description: 从数据表格类类文档（利润表）中提取结构化元数据。涵盖字段如：主营业务收入、其他业务收入、净利润、净利率、凭证号、利息费用、整体毛利率、营业利润。文档范围包括：利润表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 凭证
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 利润表
  member_count: 1
  member_details:
  - 利润表
output:
  fields:
  - name: 主营业务收入
    type: number
    description: 提取 主营业务收入 的数值（含单位，如万元、吨等）
  - name: 其他业务收入
    type: number
    description: 提取 其他业务收入 的数值（含单位，如万元、吨等）
  - name: 净利润
    type: string
    description: 提取 净利润 的文本值
  - name: 净利率
    type: string
    description: 提取 净利率 的文本值
  - name: 凭证号
    type: string
    description: 提取 凭证号 的文本值
  - name: 利息费用
    type: number
    description: 提取 利息费用 的数值（含单位，如万元、吨等）
  - name: 整体毛利率
    type: string
    description: 提取 整体毛利率 的文本值
  - name: 营业利润
    type: string
    description: 提取 营业利润 的文本值
  - name: 营业收入
    type: number
    description: 提取 营业收入 的数值（含单位，如万元、吨等）
  - name: 营业收入增长率
    type: number
    description: 提取 营业收入增长率 的数值（含单位，如万元、吨等）
  - name: 营业收入金额
    type: number
    description: 提取 营业收入金额 的数值（含单位，如万元、吨等）
  - name: 财务费用-利息支出
    type: number
    description: 提取 财务费用-利息支出 的数值（含单位，如万元、吨等）
  - name: 销售成本
    type: string
    description: 提取 销售成本 的文本值
  - name: 销售收入
    type: number
    description: 提取 销售收入 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 利润表.营业收入 != (SUM(主营业务收入贷方合计、销售退回借方合计.主营业务收入贷方合计) - SUM(主营业务收入贷方合计、销售退回借方合计.销售退回借方合计))
  description: 利润表营业收入应与收入明细账计算出的净收入一致，如不相等且无合理重分类调整，则疑点成立。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 利润表营业收入与收入明细账合计不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计报表进行核对，保证会计账簿记录与会计报表的有关内容相符。\"\n  }\n]"
- expression: 利润表.营业收入增长率 - 产品销售量统计表.销售增长率 > 20% && 主要产品销售价格变动表.产品平均售价及同比变动 < 10% && 同行业可比公司数据.收入增长率 < (利润表.营业收入增长率 - 产品销售量统计表.销售增长率)
  description: 当收入增长率远超销售量增长率，而产品售价基本稳定且显著高于行业平均水平时，可能存在虚增收入、人为调节销售数量或单价的风险。阈值可根据行业波动适当调整，一般偏差超过20%视为高度可疑。
  audit_item: 企业财务报表分析
  suspicion: 收入增长与销售量变动逻辑背离
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。收入金额应反映企业因交付商品而预期有权收取的对价，禁止在未满足条件时提前确认或虚构收入。\"\n\
    \  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n    \"\
    内容概述\": \"公"
- expression: (ABS(利润表.净利润 - 现金流量表.经营活动产生的现金流量净额) / ABS(利润表.净利润)) > 0.5 && (利润表.净利润 / 利润表.营业收入) > 行业平均净利润率*1.3
  description: 以净利润为基准，经营活动现金净流量与净利润的偏差率超过50%，且净利润率显著高于行业平均水平30%以上，表明利润可能缺乏现金流支撑，存在虚构收入或提前确认收入的风险。
  audit_item: 企业财务杜邦分析
  suspicion: 净利润与经营现金流长期背离
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十三条、第二十条\",\n    \"内容概述\": \"会计凭证、会计帐簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定；单位提供的担保、未决诉讼等或有事项，应当按照国家统一的会计制度的规定，在财务会计报告中予以说明。不得以虚假的经济业务事项或者资料进行会计核算。\"\
    \n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n "
- expression: (利润表.营业收入 / ((资产负债表.总资产（期初）+资产负债表.总资产（期末）)/2)) < 行业数据.行业平均总资产周转率*0.7 && (资产负债表.存货净额 / 资产负债表.总资产) > 行业均值*1.5
    && (资产负债表.应收账款净额 / 资产负债表.总资产) > 行业均值*1.5
  description: 企业总资产周转率低于行业平均水平70%，且存货占总资产比重、应收账款占总资产比重均超过行业均值的1.5倍，表明资产营运效率严重低下，资产质量可能被高估，存在未足额计提减值准备或滞销存货未及时处理的可能性。
  audit_item: 企业财务杜邦分析
  suspicion: 总资产周转率异常下滑且存货与应收账款双高
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"资产负债表日，存货应当按照成本与可变现净值孰低计量。存货成本高于其可变现净值的，应当计提存货跌价准备，计入当期损益。\"\n  },\n  {\n    \"法规名称\": \"\
    企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\": \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\"\
    : \"企业"
- expression: (资产负债表.总资产 / 资产负债表.股东权益) > 行业均值*1.8 && ((资产负债表.短期借款 + 资产负债表.一年内到期的非流动负债) / (利润表.营业利润/4) > 2 || (利润表.营业利润 / (利润表.财务费用-利息支出+0.01))
    < 1)
  description: 权益乘数超过行业均值1.8倍，且短期有息负债（短期借款+一年内到期非流动负债）与季度平均营业利润之比大于2，表明短期偿债压力极大；或利息保障倍数小于1，即营业利润无法覆盖利息支出，面临资金链断裂风险。设定财务费用利息支出加0.01以防止分母为零。
  audit_item: 企业财务杜邦分析
  suspicion: 权益乘数畸高伴随有息负债偿付能力不足
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第17号——借款费用\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"企业发生的借款费用，可直接归属于符合资本化条件的资产的购建或者生产的，应当予以资本化，计入相关资产成本；其他借款费用，应当在发生时根据其发生额确认为费用，计入当期损益。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"主席令第15号（2023年修订）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一"
- expression: (ABS((本年流动比率 - 前两年平均流动比率) / 前两年平均流动比率) > 0.3) || (ABS((本年存货周转率 - 前两年平均存货周转率) / 前两年平均存货周转率) > 0.5 && 利润表.净利润
    < 0) || (ABS((本年应收账款周转率 - 前两年平均应收账款周转率) / 前两年平均应收账款周转率) > 0.4 && (现金流量表.销售商品提供劳务收到的现金 / 利润表.销售收入) < 0.8)
  description: 该表达式用于筛查财务比率在年度间发生剧烈且不合理的波动。第一个条件：流动比率波动超过30%，可能指向粉饰流动性或隐瞒短期债务。第二个条件：在净利润为负的情况下，存货周转率却大幅提升超过50%，可能存在通过大幅降价或虚构销售来消化存货，存在操纵利润嫌疑。第三个条件：应收账款周转率波动超过40%，同时销售回款率低于80%，可能存在虚构收入、虚增利润但资金未实际流入的舞弊风险。
  audit_item: 企业财务比率分析
  suspicion: 财务比率纵向异常波动疑点
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条、第二十六条\",\n    \"内容概述\": \"第九条要求各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计帐簿，编制财务会计报告。第二十六条禁止虚列或者隐瞒收入，推迟或者提前确认收入。\"\n\
    \  },\n  {\n    \"法规名称\": \"企业会计准则第30号——财务报表列报\",\n    \"法规文号\": \"财会[2014]7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : "
- expression: (资产负债表.总负债/资产负债表.总资产 - 行业基准数据.行业平均资产负债率) > 0.2 && (利润表.营业利润 + 利润表.利息费用)/利润表.利息费用 < 2 || (利润表.整体毛利率 > 行业基准数据.行业平均毛利率
    * 1.5 && 利润表.净利润 == 0) || (利润表.净利润/资产负债表.股东权益 > 行业基准数据.行业平均ROE * 2 && 利润表.净利率 < 行业基准数据.行业平均净利率) || (资产负债表.总负债/资产负债表.总资产
    < 行业基准数据.行业平均资产负债率 * 0.5 && 利润表.营业收入/资产负债表.总资产 < 行业基准数据.行业平均总资产周
  description: 该表达式用于识别偏离行业正常水平的极端风险。第一条：负债率比行业均值高20个百分点且利息保障倍数低于2，提示偿债能力极弱。第二条：毛利率远高于行业平均水平（1.5倍）但净利润为0，可疑为费用资本化或关联方承担费用，虚增毛利。第三条：ROE（权益报酬率）奇高但净利率低，提示企业可能过度使用高负债杠杆（权益乘数极高），存在重大财务风险。第四条：负债率极低但总资产周转率也极低，可能存在大额闲置资产、资金
  audit_item: 企业财务比率分析
  suspicion: 财务比率与行业基准严重偏离疑点
  regulation: "[\n  {\n    \"法规名称\": \"中央企业负责人经营业绩考核办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第40号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二十一条\",\n    \"内容概述\": \"要引导企业突出主业、做强实业，加快剥离非主业、非优势业务，严禁开展融资性贸易和“空转”“走单”等虚假贸易业务。\"\n  },\n  {\n   \
    \ \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\"\
    : \"企业应当按"
- expression: ((利润表.销售收入 - 利润表.销售收入) / 利润表.销售收入 > 0.3) && ((本年(资产负债表.应收账款 + 资产负债表.存货) - 上年(资产负债表.应收账款 + 资产负债表.存货)) / 利润表.销售收入
    < 0.05) && ((现金流量表.销售商品提供劳务收到的现金 / 利润表.销售收入) < 0.7) && (现金流量表.经营活动产生的现金流量净额 / 利润表.净利润 < 0.5)
  description: 该表达式旨在识别收入增长缺乏经营现金流支撑的矛盾现象。当收入增长超过30%，但营运资金（应收+存货）的增量微乎其微（收入增量的5%以下），且销售回款率低于70%，同时经营现金流净额与净利润严重不匹配（比值<0.5）时，高度疑似虚构收入，因为正常的收入增长会相应拉动营运资金和现金流入的增长。
  audit_item: 企业财务比率分析
  suspicion: 关键财务比率间勾稽矛盾疑点
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计帐簿，编制财务会计报告。任何单位不得以虚假的经济业务事项或者资料进行会计核算。\"\n  }\n]"
- expression: ABS(记账日期.记账日期 - 业务实质发生日期) > 会计分期截止容忍度
  description: 业务实质发生日期取自合同生效日、法院判决生效日、资产交割日等客观证据；会计分期截止容忍度通常为0天（即不可跨期），除非存在跨期调整的合理依据。若记账日期早于或晚于实质发生日期，即触发疑点。
  audit_item: 未按规定核算收益及营业外收支
  suspicion: 提前或推迟确认营业外收支
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"企业应当以权责发生制为基础进行会计确认、计量和报告。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\":\
    \ \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。\"\
    \n  }\n]"
- expression: ((SUM(银行账户交易流水[贷方发生额]) - 利润表.主营业务收入) / 利润表.主营业务收入 > 0.1) && (发票管理台账.发票金额 < 利润表.主营业务收入 * 0.9)
  description: 通过银行经营性质贷方流入（剔除同名互转、借款等）与企业账面主营收入的偏差率超过10%，且开具发票金额明显低于账面收入，表明存在未开票未入账收入。偏差率10%为可疑阈值，超过则触发疑点。
