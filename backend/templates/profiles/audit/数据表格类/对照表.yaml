    : \"第二十条第（七）项\",\n    \"内容概述\": \"行政机关应主动公开财政预算、决算信息及其他应当主动公开的政府信息，绩效信息作为财政信息公开的重要组成部分，应向社会公开。\"\n  },\n  {\n    \"法规名称\"\
    : \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"\
    各级"
- expression: (内部版《绩效评价报告》.扣分项 IS NOT NULL && 内部版《绩效评价报告》.扣分项 != '') && (公开版对应章节 IS NULL || 公开版对应章节 = '')
  description: 将内部存档的完整绩效评价报告与对外公开版本进行文本比对，若内部版明确记载了扣分项、问题分析、整改要求等非成绩内容，而公开版中对应部分被完全删除或留空，即构成公开内容不完整。阈值：存在任何一项关键负面信息未公开即触发违规。
  audit_item: 部门、单位绩效评价结果未公开
  suspicion: 绩效评价关键信息公开不完整
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府信息公开条例\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"行政机关应当及时、准确地公开政府信息。行政机关发现影响或者可能影响社会稳定、扰乱社会管理秩序的虚假或者不完整信息的，应当在其职责范围内发布准确的政府信息予以澄清。\"\n  },\n\
    \  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十八条\"\
    ,\n"
- expression: 绩效目标下达日期 IS NULL OR 绩效目标下达日期 > 预算批复日期
  description: 若不存在绩效目标下达记录，或绩效目标下达日期晚于预算批复日期（即使晚1天），均视为未同步批复下达。在实务中，同步批复要求预算和绩效目标在同一文件或同一批次同步下达，时间差应为0。
  audit_item: 部门、单位预算绩效目标下达或调整不合规
  suspicion: 预算绩效目标未与预算同步批复下达
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"各级财政部门要将绩效目标设置作为预算安排的前置条件，加强绩效目标审核，将绩效目标与预算同步批复下达。\"\n  }\n]"
- expression: (年终自评报告中的目标值 != 年初申报表中的目标值) AND (对应的绩效目标调整申请及批复记录 IS NULL OR 批复结果为未批准)
  description: 若任何一项绩效指标的目标值在年末自评报告或执行文件中与年初申报值不一致，且找不到合法合规的审批记录（包括内部决策和财政批复），即判定为擅自调整。调整包括降低指标值、删除指标、新增指标等。
