  regulation: "[\n  {\n    \"法规名称\": \"地方各级人民政府机构设置和编制管理条例\",\n    \"法规文号\": \"国务院令第486号\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第九条\",\n    \"内容概述\": \"地方各级人民政府行政机构的设立、撤销、合并或者变更规格、名称，由本级人民政府提出方案，经上一级人民政府机构编制管理机关审核后，报上一级人民政府批准。\"\n  }\n\
    ]"
- expression: (委托协议工作内容 CONTAINS '绩效目标设定' OR CONTAINS '绩效运行监控' OR CONTAINS '部门整体支出绩效评价' 且制度规定禁止外包) OR (委托事项对照表.是否超范围标记 = '是'
    AND 项目已执行) OR (涉密标记 = '是' AND 无保密部门审批记录)
  description: 委托内容包含制度明确禁止外包的核心职能（如绩效目标设定、监控）即触发；对照表已标记为超范围但仍实际委托代表流程失控；涉密项目未经保密审批即为严重违规。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 超范围委托第三方机构参与预算绩效管理工作
  regulation: "[\n  {\n    \"法规名称\": \"关于委托第三方机构参与预算绩效管理的指导意见\",\n    \"法规文号\": \"财预〔2021〕6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"委托第三方机构参与预算绩效管理的范围应当严格界定，不得将应当由自身履行的绩效管理主体责任委托第三方，如绩效目标设定、绩效运行监控等。\"\n  }\n]"
- expression: 《绩效目标与评价结果公开情况对照表》.应公开项='是' && 《绩效目标与评价结果公开情况对照表》.实际公开记录='无'
  description: 根据法规与制度应主动公开的绩效目标或评价结果，在公开对照表中标记为‘应公开’，但实际公开记录为空（无任何公开痕迹），即判定为未公开违规。已扣除经合法保密审查豁免公开的情形。
