violations:
- expression: (企业法人/高管信息对照表.任职起始日期 - 领导干部离职/退休信息登记表.离职日期) < 3年 && 离职人员从业情况申报表.企业性质 IN ('民营企业','外商投资企业','中介机构') && (工商登记信息.注册地址
    ∈ 领导干部离职/退休信息登记表.分管领域 OR 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围) && (社会兼职申报.审批结果 != '批准' OR 社会兼职申报.审批结果 IS NULL)
  description: 禁业期按通常3年设定；若任职起始日期与离职日期间隔小于1095天即为在禁业期内；企业性质须为民营企业、外商投资企业或中介机构之一；业务关联判定采用地区匹配或关键词重合（审计中可设定重合度阈值>60%）；若未履行审批手续或审批不通过即触发疑点。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规接受原管辖范围内企业聘任
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"公务员辞去公职或者退休的，原系领导成员的公务员在离职三年内，不得到与原工作业务直接相关的企业或者其他营利性组织任职，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n \
    \ {\n    \"法规名称\": \"关于进一步规范党政领导干部在企业兼职（任职）问题的意见\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": "
- expression: '领导干部离职审批文件.离职日期 + 3年 >= 当前日期 && (企业法人/高管信息对照表.离职人员关联企业/中介机构名称 IN (SELECT 工商登记信息.企业名称 FROM 工商登记信息 WHERE 工商登记信息.经营范围
    LIKE ''%中介%'' OR 工商登记信息.经营范围 LIKE ''%经纪%'' OR 工商登记信息.经营范围 LIKE ''%咨询%'')) && ((银行资金流水明细表.交易摘要 LIKE ''%服务费%'' OR 银行资金流水明细表.交易摘要
    LIKE ''%佣金%'' OR 银行资金流水明细表.交易摘要 LIKE ''%居间费%'') AND 领导干部离职审批文件.管辖业务范围 '
  description: 在禁业期内，以中间人身份撮合交易并收取费用；通过企业名称或业务类型、银行流水中的佣金类收入、以及与原管辖对象的联系强度（通话频次前20%或直接出现审批加速）建立判违逻辑。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事有偿中介活动
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十六条\",\n    \"内容概述\": \"党员领导干部离职或者退（离）休后违反有关规定从事有偿中介活动，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务处分；情节严重的，给予留党察看处分。\"\n \
    \ },\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百零七条\"\
    ,\n    \""
- expression: (姓名、所属单位、费用承担方.所属单位 != 本单位 AND 姓名、所属单位、费用承担方.费用承担方 = 本单位) AND (团组人员组成、费用承担约定.费用承担约定 中未明确由我方承担 OR 无相关批件)
  description: 除上级批文明确约定由本单位负担外，不得用公款报销非本单位人员的出国费用。若人员所属单位非本单位且费用由本单位承担又无合规批准，即为违规。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 违规负担外单位人员因公出国费用
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第五条\",\n    \"内容概述\": \"各单位应严格按照出访团组人员名单报销费用，不得为本单位以外的人员报销与因公出国相关的费用，确因双边协议需承担的须在批件中明确。\"\n  }\n]"
- expression: (明细台账.保证金类型 IN ('质量保证金','工程质保金') AND (明细台账.实际收取金额/采购合同.合同金额) > 0.03) OR (明细台账.保证金类型='履约保证金' AND (明细台账.实际收取金额/采购合同.合同金额)
    > 0.10)
  description: 根据《建设工程质量保证金管理办法》，质量保证金总预留比例不得高于工程价款结算总额的3%；履约保证金不得超过政府采购合同金额的10%。超出上述比例即构成超标准收取保证金。注意区分保证金类型，不同类型适用不同法定上限。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 超法定比例收取质量保证金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第四十八条\",\n    \"内容概述\": \"采购人或者采购代理机构应当在采购文件中明确是否收取履约保证金，以及履约保证金的数额和提交方式。履约保证金的数额不得超过政府采购合同金额的10%。\"\n  },\n\
    \  {\n    \"法规名称\": \"建设工程质量保证金管理办法\",\n    \"法规文号\": \"建质〔2017〕138号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条\"\
    ,\n    \"内"
- expression: (业务主管单位.业务主管单位 IS NOT NULL AND 业务主管单位.业务主管单位 包含 行政机关名称) OR (关系类型、脱钩状态.关系类型 IN ('主办', '主管', '联系', '挂靠') AND 关系类型、脱钩状态.脱钩状态
    != '已完成')
  description: 章程或登记证书中仍列示行政机关为业务主管单位，或关联关系对照表中标明存在主办、主管、联系、挂靠关系且脱钩状态未完成，即触发疑点。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 未取消主办主管挂靠关系
  regulation: "[\n  {\n    \"法规名称\": \"行业协会商会与行政机关脱钩总体方案\",\n    \"法规文号\": \"中办发〔2015〕39号\",\n    \"效力级别\": \"党内法规/规范性文件\"\
    ,\n    \"条款号\": \"第二条主要任务（一）机构分离\",\n    \"内容概述\": \"取消行政机关（包括下属单位）与行业协会商会的主办、主管、联系和挂靠关系，行业协会商会依法直接登记和独立运行。\"\n  }\n]"
- expression: (结余资金确认日期.实际上报日期 > 结余资金确认日期.规定上报截止日期) && (结余资金确认日期.结余金额 > 0)
  description: 将结余资金上缴国库时间节点对照表中的实际上报日期与制度规定的上报截止日期进行比较。当实际上报日期晚于规定截止日期，且对应项目结余金额大于零时，判定为未按规定时限上报。规定时限依据财政部制度，通常为项目终止后或年度终了后30日内。
  audit_item: 结余资金管理不规范
  suspicion: 未按规定时限上报结余资金清理情况
  regulation: "[\n  {\n    \"法规名称\": \"中央部门财政拨款结转和结余资金管理办法\",\n    \"法规文号\": \"财预〔2015〕82号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十四条\",\n    \"内容概述\": \"中央部门应在年度终了后30日内，将本部门财政拨款结转和结余资金清理情况报财政部。项目终止或完成后，应及时清理相应结余资金并按规定上报。\"\n  }\n]"
- expression: (对照表.实际上缴日期 > 对照表.规定上缴截止日期) && (结余金额 > 0) && (上缴状态 == '已上缴')
  description: 结余资金确认后，单位应在制度规定时限内（如15个工作日内）将资金上缴国库。当实际上缴日期晚于规定截止日期，且上缴凭证显示已上缴时，判定为上缴不及时。若上缴状态为空或未上缴，则合并其他疑点（如未清理、未上报）。
  audit_item: 结余资金管理不规范
  suspicion: 结余资金未及时上缴国库
  regulation: "[\n  {\n    \"法规名称\": \"中央部门财政拨款结转和结余资金管理办法\",\n    \"法规文号\": \"财预〔2015〕82号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第十五条\",\n    \"内容概述\": \"经财政部确认的结余资金，中央部门应在收到确认文件后15个工作日内上缴中央国库。\"\n  }\n]"
- expression: (对照表.实际入境日期 - 对照表.实际出境日期) > 审批单.批准出访天数 || ((对照表.实际入境日期 - 对照表.计划入境日期) > 0 && 对比表.审批意见 != '同意')
  description: 判定规则：1.根据出入境记录计算的实际在外停留天数，超过任务审批单批准的出访天数，即为超期滞留；2.实际入境日期晚于计划，且经查阅档案，未发现任何与行程变更相关的获批记录，说明擅自延期。两个条件任一满足即触发疑点。
  audit_item: 违反出国团组管理相关规定
  suspicion: 出国团组违规滞留或超期停留
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国（境）管理办法\",\n    \"法规文号\": \"中办发〔2012〕5号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"因公临时出国（境）团组应当在批准的在外停留天数内活动，期满按时回国。\"\n  },\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"\
    法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\": \"出国人员不得擅自增加出访国家或者地区，不得擅自延长在国外停留时间。"
- expression: 行程变更对比表.实际行程国家/城市列表 != 行程变更对比表.原审批行程国家/城市列表 && (行程变更对比表.审批意见 IS_NULL || 行程变更对比表.审批意见 != '同意') || (出国（境）费用报销明细表.交通票据（如机票）出发地/目的地
    NOT_IN 出国团组任务审批单.批准的出访国家/地区列表)
  description: 判定规则：1.将实际访问的城市/国家列表与审批列表比对，若存在差异，且无法提供经批准的变更申请记录，则为擅自更改行程或增加访问地点；2.财务凭证中出现批准行程之外的国家或城市的消费，作为物理证据证实行程变更。任一条件触发疑点。
  audit_item: 违反出国团组管理相关规定
  suspicion: 擅自变更出国行程或增加访问国家
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"出国人员应当严格按照批准的事由、国家、城市、日程执行出访任务，不得擅自更改行程，不得以任何理由绕道旅行。\"\n  },\n  {\n    \"法规名称\": \"因公临时出国（境）管理办法\"\
    ,\n    \"法规文号\": \"中办发〔2012〕5号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"各派出单位要严格执行批准的出访"
- expression: 对照表.实际停留天数 > 审批单.批准停留天数
  description: 通过出入境记录计算的实际在境外停留天数（离境日至入境日）超出任务审批单中批准的天数，即为超期停留。表达式直接比较两个数值，实际停留天数大于批准天数即触发。
  audit_item: 违反出国团组管理相关规定
  suspicion: 因公出国团组超期停留
  regulation: "[\n  {\n    \"法规名称\": \"《因公临时出国经费管理办法》\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"出国人员应当严格按照批准的天数安排行程，不得擅自延长在国外停留时间。\"\n  }\n]"
- expression: (采购合同.合同金额 > 审批限额标准、审批层级、所需附件.审批限额标准 && 采购金额区间、对应审批人级别、审批记录.对应审批人级别 < 要求审批级别) || (COUNT(采购合同 BY 供应商, 同类设备, 时间差<90天)
    >= 2 && SUM(合同金额) >= 审批限额标准、审批层级、所需附件.审批限额标准 && 无合并审批记录)
