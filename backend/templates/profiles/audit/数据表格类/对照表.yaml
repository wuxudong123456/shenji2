name: audit/数据表格类/对照表
type: model
description: 从数据表格类类文档（对照表）中提取结构化元数据。涵盖字段如：一般公共预算支出总额、上级下达指标日期、不合理条件条款摘录、业务类型、事项名称、产品型号及价格、亩均投资额/人均补贴标准等比值、人员缺口数。文档范围包括：《绩效目标与评价结果公开情况对照表》、三同时制度执行情况对照表、不同机构风险承担比例对照表、个人费用转嫁核查对照表、中期财政规划与三年滚动计划衔接对照表、交通安全设施配套情况对照表、产业政策符合性对照表、人才激励措施落实情况对照表、任务清单与预算匹配对照表、任务量及补助标准对照表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 补贴
- 金额
- 项目
- 元数据提取
