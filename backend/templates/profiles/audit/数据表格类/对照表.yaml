  audit_item: 违规处置国有资产
  suspicion: 擅自处置国有资产（出售、调拨、报损、报废等）
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"各部门及其所属单位应当根据履行职责、事业发展需要和资产使用状况，经集体决策和履行审批程序，依据处置事项批复等相关文件及时处置行政事业性国有资产。\"\n  }\n]"
- expression: (明细表.资产原值 > 制度文件.需上级审批的资产类型或金额标准 || 资产台账.资产类别 IN (制度文件.需上级审批的资产类型或金额标准)) && (审批文件.上级批复文件编号 IS NULL)
  description: 依据内部审批流程制度，当处置资产的类别或原值达到需要上级（财政部门或国资委）审批的标准时，必须取得上级批复。若上级批复文件缺失，则构成未履行法定审批程序。
  audit_item: 违规处置国有资产
  suspicion: 国有资产处置未履行法定审批程序（应报未报上级/财政）
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"除国家另有规定外，各部门及其所属单位将行政事业性国有资产进行转让、拍卖、置换、对外投资等，应当按照国家有关规定办理审批手续。\"\n  }\n]"
- expression: (明细表.机构名称 != 三定方案.核定机构名称 OR 明细表.规格 != 三定方案.规格 OR 对照表.实际履行的职责 != 划分文件.正式赋予的职责) AND NOT EXISTS (SELECT 1 FROM
    批复文件 WHERE 批准变更内容='变更' AND 批准内容 AND 规格='已生效')
