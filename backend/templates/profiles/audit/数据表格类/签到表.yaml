- expression: (身份证号.身份证号出现次数 > 1) || (签到表.签到人员名单 - 签到表.签到人员名单) > 签到表.签到人员名单*10% || (明细表.收款账号出现次数 > 1) || (登记表.职业字段与实际严重不符，如职业='农民'但社保记录显示为单位在职职工)
  description: 虚报培训人员的常见特征包括：同一人重复出现在不同班次培训名单中；签到人数与申报人数存在显著差异；补贴资金向同一账户多次发放；职业信息虚假。通过身份证号及资金收款账号频次统计、名单与签到人数偏差率，可自动识别异常；偏差率阈值设为10%，超过则触发疑点。
