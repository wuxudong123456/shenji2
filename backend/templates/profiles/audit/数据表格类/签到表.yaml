  - name: 实际签到人员姓名
    type: string
    description: 提取 实际签到人员姓名 的文本值
  - name: 实际签到人数
    type: number
    description: 提取 实际签到人数 的数值（含单位，如万元、吨等）
  - name: 教师姓名
