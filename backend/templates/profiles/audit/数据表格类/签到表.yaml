  regulation: "[\n  {\n    \"法规名称\": \"关于实施青年就业见习计划的通知\",\n    \"法规文号\": \"人社部函〔2019〕36号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"三（四）\",\n    \"内容概述\": \"见习单位应如实记录见习人员出勤，据实申领补贴，不得虚报、谎报见习人数和留用情况。\"\n  },\n  {\n    \"法规名称\": \"就业补助资金管理办法\"\
