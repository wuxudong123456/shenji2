violations:
- expression: (会议费报销明细表.参会人数 > 会议签到表.实际签到人数 * 1.2) || (SUM(会议费报销明细表.报销金额) - SUM(会议费预算编制与执行对比表.实际支出金额) > 0 && 银行流水.收款方 IN (虚假会议套取资金关联方资金流向表.关联方名称))
    || (会议费预算编制与执行对比表.结余金额 > 0 && 会议费报销明细表.实际支出明细（场地费、餐费、住宿费、资料费等） IS NULL)
  description: 通过虚报参会人数多申领费用、将会议结余资金转入关联方或个人账户、结余资金未退还财政等情形判定挪用、截留或侵占。人数虚报比例超过20%，或报销金额大于实际支出且收款方为关联方，或有结余但无退款记录均触发疑点。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 挪用、截留、侵占会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁各单位借会议名义组织会餐或安排宴请；严禁套取会议费设立‘小金库’；严禁在会议费中列支公务接待费。会议费支付应当严格按国库集中支付和公务卡管理规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\
    \n  }\n]"
- expression: （NOT EXISTS（会议签到表.会议名称 = 会议费报销明细表.会议名称）|| 会议签到表.实际签到人数 = 0 || 会议纪要.会议现场照片 IS NULL） && 会议费报销明细表.报销金额 > 5000 &&
    （银行流水.收款方 IN （虚假会议套取资金关联方资金流向表.关联方名称）|| 银行流水.用途摘要 IS NULL）
  description: 判断会议是否虚构：无签到记录或签到人数为0，或缺乏影像资料等实质性证明，且报销金额较大（如超过5000元），同时资金流向关联方或用途不明，视为虚列会议套取资金。重点关注报销后资金回流至经手人或关联账户的特征。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 虚列会议费套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有虚报、冒领等手段骗取财政资金的行为，将给予相应处理。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n  \
    \  \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁套取会议费设立‘小金库’；严禁在会议费中列支公务接待费等规"
- expression: 公务接待明细台账.接待事由 = '公务考察学习' && (公务活动方案 IS NULL || 签到表 IS NULL || 考察报告 IS NULL || LENGTH(公务接待明细台账.活动内容描述) < 10)
  description: 若接待事由仅为笼统的“考察学习”，缺乏具体的调研题目、学习内容文字描述，且无法提供对应的活动方案、参会签到或成果报告中的任意两项证明，视为虚构活动疑点。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务考察学习活动缺乏具体内容涉嫌虚构
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"无公函的公务活动和来访人员一律不予接待；接待单位应当根据规定的接待范围，严格接待审批控制，建立公务接待清单制度。\"\n  }\n]"
- expression: (SUM(明细表.金额) / COUNT(统计表.人员身份信息) > 综合定额标准（元/人天）.综合定额标准（元/人天）) || (签到表.实际签到人数 > 培训通知.批准培训人数 * 1.1) || (租赁协议.最大容纳人数
    < 签到表.实际签到人数)
  description: 人均综合培训费超出管理制度规定的定额标准；或实际签到参训人数超过审批人数的10%以上；或培训场地最大容纳人数低于实际签到人数，三个条件满足其一即视为超标准或超人数违规。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 超标准、超人数举办培训
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关培训费管理办法\",\n    \"法规文号\": \"财行〔2016〕540号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条、第十条\",\n    \"内容概述\": \"培训费实行综合定额标准控制，分项核定、总额控制；组织培训的工作人员人数不得超过参训人员数量的10%。\"\n  }\n]"
- expression: 明细表.金额 > 0 && (COALESCE(签到表.实际签到人数,0) < 统计表.人数 * 0.3 OR 核查表.异常特征标记（四要件缺失、笔迹雷同、场地矛盾等） == 1) && (明细表.收款方户名 !=
    原始凭证.合同供应商 OR 明细表.收款方户名 LIKE '%个人%')
  description: 培训项目有支出但实际签到人数严重不足（低于应参训人数的30%），或异常特征表标记为1（如通知、签到、日程、照片四要件缺失），且资金支付对象与合同供应商不一致或支付给个人账户，则高度疑为虚构培训套取资金。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 虚列培训费套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第（一）项\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，责令改正，追回有关财政资金，对单位给予警告或者通报批评，对直接负责的主管人员和其他直接责任人员给予记大过处分。\"\n  }\n]"
- expression: (明细表.餐饮费金额 / (明细表.用餐人数 × 明细表.用餐次数)) > 人均餐费标准.人均餐费标准
  description: 计算每餐人均实际支出，与制度规定的每人每餐标准比对，超出即为违规。需确保用餐人数与签到表一致，防止虚增用餐人次。若发票明细包含高档菜肴、酒水等禁止供应品，可进一步确证。
  audit_item: 超标准举办会议
  suspicion: 会议餐饮费用超出规定标准
  regulation: "[\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十四条、第十七条\",\n    \"内容概述\": \"会议伙食费按标准定额控制；会议用餐应严格控制菜品种类、数量和份量，安排自助餐，严禁提供高档菜肴，不安排宴请，不上烟酒。\"\n  }\n]"
- expression: 明细表.按人结算的费用项目（住宿间夜数、餐券数）及对应人数 > 签到表.实际签到人数 && 明细表.按人结算的费用项目（住宿间夜数、餐券数）及对应人数 > 批复文件.批准参会人数
  description: 以签到表确认的实际参会人数为基准，若按人结算的费用项目（如住宿、餐费）所用人数明显超出实际签到人数，且超出批准名额，则存在虚增参会社员套取经费的嫌疑。
  audit_item: 超标准举办会议
  suspicion: 虚列参会人数套取会议经费
  regulation: "[\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十五条\",\n    \"内容概述\": \"各单位应当严格控制会议规模，参会人员原则上不得超过规定人数，申报时须列明参会人员数量。\"\n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员不得虚报、冒领财政资金；"
- expression: ( 签到表.参训单位 && 通知文件.参训要求措辞（如‘必须’‘全员参加’） ) && ( 签到表.参训单位 && 票据.缴费金额 )
  description: 若培训通知明确要求‘必须参训’、‘未参训不得通过考核’等强制性语句，且参加培训的人员与后续接受该机关监督检查、资质续期的对象几乎完全重合，同时培训收费未按经营服务性收费管理规定报批或备案，则判定为利用行政权力强制培训并收费。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 以行政命令强制参加培训并收费
  regulation: "[\n  {\n    \"法规名称\": \"中共中央办公厅 国务院办公厅关于严禁党政机关到风景名胜区开会的通知（含延伸规定精神）\",\n    \"法规文号\": \"厅字〔2014〕50号\",\n   \
    \ \"效力级别\": \"制度文件\",\n    \"条款号\": \"总体要求\",\n    \"内容概述\": \"严禁党政机关以培训等名义变相收费。\"\n  },\n  {\n    \"法规名称\": \"行政事业性收费标准管理办法\"\
    ,\n    \"法规文号\": \"发改价格规〔2018〕988号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"行政事业性收费实行目录清单管理，未列"
- expression: 缺失(会议通知) || 缺失(参会人员签到表) || 缺失(费用原始明细单据) || 缺失(发票) || (参会人员签到表.签到人数 != 发票.金额 / 人均定额 AND ABS(偏差) > 10%)
  description: 每笔会议费报销必须附有完整的支撑材料。若缺少会议通知、签到表、费用明细、发票中的任一项，直接判为违规。此外，若签到人数与费用结算人数逻辑不匹配（如按人头计算的费用），偏差超过10%，则可能存在虚增人数。
  audit_item: 会议费审计
  suspicion: 会议费报销凭证关键附件缺失
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"会议费报销时应当提供会议审批文件、会议通知及实际参会人员签到表、定点会议场所等会议服务单位提供的费用原始明细单据、电子结算单等凭证。\"\n  }\n]"
- expression: 参会人员签到表.签到人数 <= 3 || (会议费发票.金额 >= 本期同类会议平均金额 * 3) || (银行付款凭证.收款方名称 关联 利益关系人)
  description: 若报销的会议没有任何现场照片、视频等痕迹，且签到人数极少（如≤3人），或单笔会议费金额异常巨大（超出同类会议平均3倍），或收款方与本单位人员存在关联关系，则高度疑似虚假会议套现。
  audit_item: 会议费审计
  suspicion: 虚列会议费套取资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条、第二十六条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，不得以虚假的经济业务事项或者资料进行会计核算。\"\n  }\n]"
- expression: (乡村教师信息化培训签到表.实到人数/乡村教师信息化培训计划.应参训人数 < 0.8) || (乡村教师信息化培训签到表.考核成绩 < 60) || (专项资金使用明细表.培训费用支出金额 < 计划预算的50% &&
    乡村教师信息化培训签到表.实到人数 > 0)
  description: 培训参与率低于80%视为覆盖不足；考核平均分未达60分表明培训效果不达标；培训经费执行率低于50%但有签到记录，暗示培训造假或走过场。
  audit_item: 乡村学校薄弱环节改善不符合相关规定
  suspicion: 乡村教师信息化培训开展不实
  regulation: "[\n  {\n    \"法规名称\": \"教育部关于实施全国中小学教师信息技术应用能力提升工程2.0的意见\",\n    \"法规文号\": \"教师〔2019〕1号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"无\",\n    \"内容概述\": \"要求建立教师信息化培训考核机制，确保培训学时达标、内容实用、考核有效，并将培训成效纳入学校考评。\"\n  }\n]"
- expression: 教师年度培训学时统计表（分城乡）.累计周期学时 < 360 || 校长培训达标情况台账.达标情况 = '否'
  description: 根据教师培训政策，每名教师（校长）每五年周期内累计培训学时须不少于360学时。统计表中任何教师累计学时不足360，或校长台账中任一人未达标，即判定违规。
  audit_item: 乡村教师技能培训不符合要求
  suspicion: 乡村教师校长未完成360学时培训任务
  regulation: "[\n  {\n    \"法规名称\": \"教育部关于大力加强中小学教师培训工作的意见\",\n    \"法规文号\": \"教师〔2011〕1号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"二、基本目标 （三）\",\n    \"内容概述\": \"每五年一个周期的教师培训累计学时不少于360学时，其中集中培训不少于160学时。\"\n  },\n  {\n    \"法规名称\":\
    \ \"国务院办公厅关于印发乡村教师支持计划（2015—2020年）的通知\",\n    \"法规文号\": \"国办发〔2015〕43号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三、（五）\"\
    ,\n  "
- expression: (会议纪要.会议时间 IS NULL) || (会议纪要.主持人 IS NULL) || (会议纪要.出席人员 IS NULL) || (会议纪要.决定事项 IS NULL)
  description: 当会议纪要中时间、主持人、出席人员、决定事项任一字段为NULL或空字符串时，即判定为记录要素缺失，存在重大决策记录不完整风险，可能影响决策效力。
  audit_item: 整理会议记录
  suspicion: 会议纪要缺失关键决策要素
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党党组工作条例\",\n    \"法规文号\": \"中发〔2019〕15号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第三十三条\",\n    \"内容概述\": \"党组会议应当有专门记录，编发会议纪要，并按照规定存档备查。记录内容包括会议时间、地点、主持人、出席人员、列席人员、请假人员、记录人等基本情况，议题，讨论发言，表决情况，决定等。\"\
    \n  }\n]"
- expression: COUNT(实际签到人数.签到人员 BY 会议时间) != COUNT(会议纪要.出席人员 BY 会议时间) || 实际签到人数.签到人员 NOT IN 会议纪要.出席人员
  description: 以会议时间为关联键，对比实际签到人数与纪要记录的出席人数，若人数不一致或存在签到人员未出现在出席名单中，则视为记录不实，可能存在代签、冒签或虚假编造出席人员的情况。
  audit_item: 整理会议记录
  suspicion: 会议签到人数与纪要出席人数不符
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党党组工作条例\",\n    \"法规文号\": \"中发〔2019〕15号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第三十三条\",\n    \"内容概述\": \"党组会议记录应如实反映出席人员等基本情况，会议纪要应当准确记载出席人员与列席人员。\"\n  }\n]"
- expression: (明细表.参训人次 < 计划培训次数.应覆盖人数) || (评估表.合格率 < 0.7) || (登记台账.月均使用次数 < 4 && 明细表.培训日期 > 当前日期 - 90天)
  description: 培训覆盖率未达100%，或参训人员考核合格率低于70%，或在最近一次培训结束后90天内设备月均使用次数仍不足4次（即平均每周不足1次），均表明培训无效或管理缺失，导致设备无人会用、无人使用。
  audit_item: 数字乡村建设人才不足
