    type: string
    description: 提取 会议名称 的文本值
  - name: 参会人员签到记录
    type: string
    description: 提取 参会人员签到记录 的文本值
  - name: 参会签名
    type: string
    description: 提取 参会签名 的文本值
  - name: 参训人数
    type: number
    description: 提取 参训人数 的数值（含单位，如万元、吨等）
  - name: 参训单位
    type: string
    description: 提取 参训单位 的文本值
  - name: 培训日期
    type: date
    description: 提取 培训日期 的日期值，格式 YYYY-MM-DD
  - name: 培训项目
    type: string
    description: 提取 培训项目 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 实到人数
