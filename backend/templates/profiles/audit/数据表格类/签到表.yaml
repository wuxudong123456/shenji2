name: audit/数据表格类/签到表
type: model
description: 从数据表格类类文档（签到表）中提取结构化元数据。涵盖字段如：会议名称、单位、参会人员签到记录、参会签名、参训人数、参训单位、培训日期、培训项目。文档范围包括：乡村教师信息化培训签到表、会议签到表、参会人员签到表、参训人员签到表、培训签到表、实际举办会议签到表、教师培训签到表、签到表、见习人员签到表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 会议
- 培训
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 签到表
  member_count: 1
  member_details:
  - 乡村教师信息化培训签到表
  - 会议签到表
  - 参会人员签到表
  - 参训人员签到表
  - 培训签到表
  - 实际举办会议签到表
  - 教师培训签到表
  - 签到表
  - 见习人员签到表
