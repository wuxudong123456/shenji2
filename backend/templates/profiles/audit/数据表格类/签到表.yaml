  - name: 实际举办时间
    type: date
    description: 提取 实际举办时间 的日期值，格式 YYYY-MM-DD
  - name: 实际会议名称
    type: string
    description: 提取 实际会议名称 的文本值
  - name: 实际参会人数
    type: number
    description: 提取 实际参会人数 的数值（含单位，如万元、吨等）
  - name: 实际参加人员
    type: string
    description: 提取 实际参加人员 的文本值
  - name: 实际地点
