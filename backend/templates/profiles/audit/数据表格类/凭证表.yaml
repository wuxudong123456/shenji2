name: audit/数据表格类/凭证表
type: model
description: 从数据表格类类文档（凭证表）中提取结构化元数据。涵盖字段如：交易日期、交易金额、付款方名称、付款方户名、收款金额。文档范围包括：银行流水或财务收款凭证表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 付款
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 凭证表
  member_count: 1
  member_details:
  - 银行流水或财务收款凭证表
output:
  fields:
  - name: 交易日期
    type: date
    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款方名称
    type: number
    description: 提取 付款方名称 的数值（含单位，如万元、吨等）
  - name: 付款方户名
    type: number
    description: 提取 付款方户名 的数值（含单位，如万元、吨等）
  - name: 收款金额
    type: number
    description: 提取 收款金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: （欠缴台账.欠费月数 >= 6） && （凭证表.收款金额 != 欠缴台账.应收金额 或 缴费记录缺失）
  description: 承租人连续欠费达6个月及以上，且银行实际到账金额与应收金额不符或无缴费记录，符合严重违规。本表达式以《公共租赁住房管理办法》规定的无正当理由连续6个月未缴纳租金为阈值，需结合银行流水排除台账错漏。
  audit_item: 承租人未按照规定缴纳公共租赁住房租金
  suspicion: 承租人长期拖欠公共租赁住房租金
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条、第三十一条\",\n    \"内容概述\": \"承租人应当根据合同约定按时交纳租金；无正当理由连续6个月以上未缴纳租金的，应当腾退公共租赁住房，并记入管理档案。\"\n  }\n]"
- expression: SUM(欠缴台账.实收月金额) < SUM(欠缴台账.应收月金额) && (SUM(欠缴台账.应收月金额)-SUM(欠缴台账.实收月金额))/SUM(欠缴台账.应收月金额) > 0.2
  description: 按月汇总对比，若承租人实际缴纳总额小于应收总额，且差额比例超过20%（即不足额缴纳达显著程度），判定为违规。20%阈值可根据当地欠费容忍度调整，连续数月差额稳定存在则疑点升级。
  audit_item: 承租人未按照规定缴纳公共租赁住房租金
  suspicion: 承租人部分缴纳或不足额缴纳租金
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"承租人应当根据合同约定按时交纳租金，不得少缴或拖欠。承租人未按规定缴纳租金的，住房保障主管部门可责令其限期缴纳。\"\n  }\n]"
