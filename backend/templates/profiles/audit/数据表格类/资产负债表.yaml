name: audit/数据表格类/资产负债表
type: model
description: 从数据表格类类文档（资产负债表）中提取结构化元数据。涵盖字段如：一年内到期的非流动负债、专用基金期末余额、专项应付款等、事业收入、其他应付款、其他应收款、净资产、固定资产净值。文档范围包括：单体资产负债表、合并资产负债表、担保公司资产负债表、资产负债表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 付款
- 拨款
- 资产
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 资产负债表
  member_count: 1
  member_details:
  - 单体资产负债表
  - 合并资产负债表
  - 担保公司资产负债表
  - 资产负债表
output:
  fields:
  - name: 一年内到期的非流动负债
    type: string
    description: 提取 一年内到期的非流动负债 的文本值
  - name: 专用基金期末余额
    type: number
    description: 提取 专用基金期末余额 的数值（含单位，如万元、吨等）
  - name: 专项应付款等
    type: number
    description: 提取 专项应付款等 的数值（含单位，如万元、吨等）
  - name: 事业收入
    type: number
    description: 提取 事业收入 的数值（含单位，如万元、吨等）
  - name: 其他应付款
    type: number
    description: 提取 其他应付款 的数值（含单位，如万元、吨等）
  - name: 其他应收款
    type: number
    description: 提取 其他应收款 的数值（含单位，如万元、吨等）
  - name: 净资产
    type: string
    description: 提取 净资产 的文本值
  - name: 固定资产净值
    type: string
    description: 提取 固定资产净值 的文本值
  - name: 固定资产原值
    type: string
    description: 提取 固定资产原值 的文本值
  - name: 固定资产期末金额
    type: number
    description: 提取 固定资产期末金额 的数值（含单位，如万元、吨等）
  - name: 外币负债
    type: string
    description: 提取 外币负债 的文本值
  - name: 外币资产
    type: string
    description: 提取 外币资产 的文本值
  - name: 存货
    type: string
    description: 提取 存货 的文本值
  - name: 存货净额
    type: string
    description: 提取 存货净额 的文本值
  - name: 实收资本
    type: string
    description: 提取 实收资本 的文本值
  - name: 应付债券
    type: string
    description: 提取 应付债券 的文本值
  - name: 应付账款
    type: number
    description: 提取 应付账款 的数值（含单位，如万元、吨等）
  - name: 应收账款
    type: number
    description: 提取 应收账款 的数值（含单位，如万元、吨等）
  - name: 应收账款净额
    type: number
    description: 提取 应收账款净额 的数值（含单位，如万元、吨等）
  - name: 总权益
    type: string
    description: 提取 总权益 的文本值
  - name: 总负债
    type: string
    description: 提取 总负债 的文本值
  - name: 总资产
    type: string
    description: 提取 总资产 的文本值
  - name: 流动负债
    type: string
    description: 提取 流动负债 的文本值
  - name: 流动资产
    type: string
    description: 提取 流动资产 的文本值
  - name: 短期-长期借款的期初与期末余额
    type: number
    description: 提取 短期-长期借款的期初与期末余额 的数值（含单位，如万元、吨等）
  - name: 短期借款
    type: number
    description: 提取 短期借款 的数值（含单位，如万元、吨等）
  - name: 累计折旧
    type: string
