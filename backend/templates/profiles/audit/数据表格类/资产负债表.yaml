  - name: 股东权益
    type: string
    description: 提取 股东权益 的文本值
  - name: 负债总额
    type: number
    description: 提取 负债总额 的数值（含单位，如万元、吨等）
  - name: 财政拨款收入
    type: number
    description: 提取 财政拨款收入 的数值（含单位，如万元、吨等）
  - name: 货币资金-外币
    type: string
    description: 提取 货币资金-外币 的文本值
  - name: 资产总额
    type: number
    description: 提取 资产总额 的数值（含单位，如万元、吨等）
  - name: 资产负债率
    type: string
    description: 提取 资产负债率 的文本值
  - name: 长期借款
    type: number
    description: 提取 长期借款 的数值（含单位，如万元、吨等）
  - name: 预付账款
    type: number
    description: 提取 预付账款 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (原始会计凭证.凭证日期 > 资产负债表.日期) && (记账凭证.贷方科目 LIKE '%负债%') || (银行对账单.借贷标志 == '贷' AND 银行对账单.金额 > 大额阈值 AND 银行对账单.对方户名
    LIKE '%供应商%贷款%') && (税务申报表.扣除项目 NOT INCLUDE 对应负债利息或费用) || (外部审计报告.调整分录 == 补记负债) && (资产负债表.应付账款.期末余额 == 资产负债表.应付账款.期初余额)
  description: 识别隐匿负债疑点：1）将本应属于报表期间的负债凭证记入下一期（截止性差异）；2）银行已收到贷款资金，但账面未见新增负债，且税务申报无相关融资费用扣除（帐外负债）；3）外部审计师已提示需补记负债，但账面未调整；4）应付账款余额长期不变，可能未记账新产生的应付款项。满足任一条件即判定为疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 企业提供虚假财务会计报告隐匿负债
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号（2017年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条、第二十六条\",\n    \"内容概述\": \"会计凭证、会计账簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定。公司、企业进行会计核算不得有下列行为：随意改变资产、负债、所有者权益的确认标准或者计量方法，虚列、多列、不列或者少列资产、负债、所有者权益。\"\
    \n  }\n]"
- expression: ABS(科目名称、债务人/债权人、期末余额、账龄.期末余额) > 0 && 科目名称、债务人/债权人、期末余额、账龄.账龄 > 365 && (合同履约状态、约定结算日期.合同履约状态 = "已履约" || 合同履约状态、约定结算日期.约定结算日期
    < "决算日") && 收付款记录、未达账项、付款方、收款方、金额、用途摘要、对方账户名、账务发生额、交易金额、交易对方名称、摘要、大额转出金额、收款方名称、交易摘要、交易对方（金融机构）、账户余额、付款金额、收款方户名、账号、收入流水、对方户名、对方账号、收款金额、期末余额、银行账户、大额转账记录、对方账户名称、现金支取金额、频繁取现记录、重大资
  description: 筛选往来款项明细表中挂账超过一年且余额不为零的记录，若对应合同已履约或约定结算日期早于决算日，但银行对账单中无相应资金收付冲销，视为应结未结违规。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 预收预付款项应结清未结清
  regulation: "[\n  {\n    \"法规名称\": \"《政府会计制度——行政事业单位会计科目和报表》\",\n    \"法规文号\": \"财会〔2017〕25号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第五部分 年终结账\",\n    \"内容概述\": \"单位在年度终了前，应对各项往来款项进行清理，及时办理结算，不得长期挂账。\"\n  }\n]"
- expression: (计提表.计提基数 != 余额表.事业收入 + 余额表.经营收入) || (计提表.计提比例 != 政策文件.规定计提比例) || (ABS(计提表.计提金额 - 计提表.计提基数 * 政策文件.规定计提比例) >
    0)
  description: 专用基金计提基数与科目余额表中对应收入合计数不一致，或实际采用的计提比例与政策规定不符，或计算出的计提金额不等于基数乘比例，任一条成立即触发疑点。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 专用基金计提基数或比例错误
  regulation: "[\n  {\n    \"法规名称\": \"《事业单位财务规则》\",\n    \"法规文号\": \"财政部令第108号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第二十六条\",\n    \"内容概述\": \"事业单位应当按规定提取修购基金、职工福利基金和其他专用基金，不得随意改变计提基数、比例和支出用途。\"\n  }\n]"
- expression: (明细表.资金来源性质 = "财政专项拨款" && 余额表.各级科目余额 != "财政拨款收入—项目支出") || (明细表.使用会计科目 IN ("其他应付款","其他应收款") && 管理办法.核算科目要求)
  description: 财政专项资金未在规定的收入科目或支出科目核算，而错误列入往来款等科目，导致决算报表无法真实反映专项资金收支，即构成科目列报错误。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 专项资金列报科目错误
  regulation: "[\n  {\n    \"法规名称\": \"《政府会计制度——行政事业单位会计科目和报表》\",\n    \"法规文号\": \"财会〔2017〕25号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三部分 会计科目使用说明\",\n    \"内容概述\": \"财政拨款收入等专项资金应按规定科目单独核算，不得与其他资金混淆核算。\"\n  }\n]"
- expression: ABS(盘点台账.实盘数量 - 盘点台账.账面原值) > 0 || (盘点台账.使用状态 = "已报废" && 资产负债表.固定资产原值 仍包含该资产) || (盘点台账.账面原值 != 资产负债表.固定资产原值 -
    汇总表.资产盘盈盘亏调整分录)
  description: 实地盘点发现资产缺失或多出，或已报废资产仍挂账，或台账账面原值总计与资产负债表原值经调整后仍不一致，即构成固定资产账实不符。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 固定资产账实不符导致决算失真
  regulation: "[\n  {\n    \"法规名称\": \"《行政事业性国有资产管理条例》\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"各部门及其所属单位应当定期对资产进行盘点、对账，出现资产盘盈盘亏的，应当按照财务、会计和资产管理制度处理。\"\n  }\n]"
- expression: (变动表.折算汇率 != 政策文件.规定汇率来源) || (ABS(变动表.原币金额 * 政策文件.规定汇率来源 - 变动表.折算后人民币金额) > 0) || (汇兑损益未计入财务费用)
  description: 若使用汇率非期末央行中间价，或折算金额计算错误，或汇兑损益未在恰当科目反映，均属折算处理错误。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 年终外币折算汇率或方法错误
  regulation: "[\n  {\n    \"法规名称\": \"《企业会计准则第19号——外币折算》\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十一条\",\n    \"内容概述\": \"企业在资产负债表日，应当对外币货币性项目采用期末即期汇率折算，因汇率变动产生的差额计入当期损益。\"\n  }\n]"
- expression: 资产负债表.固定资产净值 != (分类账.固定资产科目余额 - 分类账.累计折旧科目余额)
  description: 资产负债表固定资产项目应按扣除累计折旧及减值准备后的净额列示，与总账直接计算的结果不相等，则表明存在少提折旧、重分类错误或资产虚报。
  audit_item: 账实不符、账证不符、账账不符、账表不符
  suspicion: 资产负债表固定资产项目金额与总账余额不符
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第十七条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与会计报表进行核对，保证会计账簿记录与会计报表的有关内容相符。\"\n  }\n]"
- expression: (利润表.营业收入 / ((资产负债表.总资产（期初）+资产负债表.总资产（期末）)/2)) < 行业数据.行业平均总资产周转率*0.7 && (资产负债表.存货净额 / 资产负债表.总资产) > 行业均值*1.5
    && (资产负债表.应收账款净额 / 资产负债表.总资产) > 行业均值*1.5
  description: 企业总资产周转率低于行业平均水平70%，且存货占总资产比重、应收账款占总资产比重均超过行业均值的1.5倍，表明资产营运效率严重低下，资产质量可能被高估，存在未足额计提减值准备或滞销存货未及时处理的可能性。
  audit_item: 企业财务杜邦分析
  suspicion: 总资产周转率异常下滑且存货与应收账款双高
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"资产负债表日，存货应当按照成本与可变现净值孰低计量。存货成本高于其可变现净值的，应当计提存货跌价准备，计入当期损益。\"\n  },\n  {\n    \"法规名称\": \"\
    企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\": \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\"\
    : \"企业"
- expression: (资产负债表.总资产 / 资产负债表.股东权益) > 行业均值*1.8 && ((资产负债表.短期借款 + 资产负债表.一年内到期的非流动负债) / (利润表.营业利润/4) > 2 || (利润表.营业利润 / (利润表.财务费用-利息支出+0.01))
    < 1)
  description: 权益乘数超过行业均值1.8倍，且短期有息负债（短期借款+一年内到期非流动负债）与季度平均营业利润之比大于2，表明短期偿债压力极大；或利息保障倍数小于1，即营业利润无法覆盖利息支出，面临资金链断裂风险。设定财务费用利息支出加0.01以防止分母为零。
  audit_item: 企业财务杜邦分析
  suspicion: 权益乘数畸高伴随有息负债偿付能力不足
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第17号——借款费用\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"企业发生的借款费用，可直接归属于符合资本化条件的资产的购建或者生产的，应当予以资本化，计入相关资产成本；其他借款费用，应当在发生时根据其发生额确认为费用，计入当期损益。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"主席令第15号（2023年修订）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一"
- expression: (ABS((本年流动比率 - 前两年平均流动比率) / 前两年平均流动比率) > 0.3) || (ABS((本年存货周转率 - 前两年平均存货周转率) / 前两年平均存货周转率) > 0.5 && 利润表.净利润
    < 0) || (ABS((本年应收账款周转率 - 前两年平均应收账款周转率) / 前两年平均应收账款周转率) > 0.4 && (现金流量表.销售商品提供劳务收到的现金 / 利润表.销售收入) < 0.8)
  description: 该表达式用于筛查财务比率在年度间发生剧烈且不合理的波动。第一个条件：流动比率波动超过30%，可能指向粉饰流动性或隐瞒短期债务。第二个条件：在净利润为负的情况下，存货周转率却大幅提升超过50%，可能存在通过大幅降价或虚构销售来消化存货，存在操纵利润嫌疑。第三个条件：应收账款周转率波动超过40%，同时销售回款率低于80%，可能存在虚构收入、虚增利润但资金未实际流入的舞弊风险。
  audit_item: 企业财务比率分析
  suspicion: 财务比率纵向异常波动疑点
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条、第二十六条\",\n    \"内容概述\": \"第九条要求各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计帐簿，编制财务会计报告。第二十六条禁止虚列或者隐瞒收入，推迟或者提前确认收入。\"\n\
    \  },\n  {\n    \"法规名称\": \"企业会计准则第30号——财务报表列报\",\n    \"法规文号\": \"财会[2014]7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : "
- expression: (资产负债表.总负债/资产负债表.总资产 - 行业基准数据.行业平均资产负债率) > 0.2 && (利润表.营业利润 + 利润表.利息费用)/利润表.利息费用 < 2 || (利润表.整体毛利率 > 行业基准数据.行业平均毛利率
    * 1.5 && 利润表.净利润 == 0) || (利润表.净利润/资产负债表.股东权益 > 行业基准数据.行业平均ROE * 2 && 利润表.净利率 < 行业基准数据.行业平均净利率) || (资产负债表.总负债/资产负债表.总资产
    < 行业基准数据.行业平均资产负债率 * 0.5 && 利润表.营业收入/资产负债表.总资产 < 行业基准数据.行业平均总资产周
  description: 该表达式用于识别偏离行业正常水平的极端风险。第一条：负债率比行业均值高20个百分点且利息保障倍数低于2，提示偿债能力极弱。第二条：毛利率远高于行业平均水平（1.5倍）但净利润为0，可疑为费用资本化或关联方承担费用，虚增毛利。第三条：ROE（权益报酬率）奇高但净利率低，提示企业可能过度使用高负债杠杆（权益乘数极高），存在重大财务风险。第四条：负债率极低但总资产周转率也极低，可能存在大额闲置资产、资金
  audit_item: 企业财务比率分析
  suspicion: 财务比率与行业基准严重偏离疑点
  regulation: "[\n  {\n    \"法规名称\": \"中央企业负责人经营业绩考核办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第40号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二十一条\",\n    \"内容概述\": \"要引导企业突出主业、做强实业，加快剥离非主业、非优势业务，严禁开展融资性贸易和“空转”“走单”等虚假贸易业务。\"\n  },\n  {\n   \
    \ \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\"\
    : \"企业应当按"
- expression: ((利润表.销售收入 - 利润表.销售收入) / 利润表.销售收入 > 0.3) && ((本年(资产负债表.应收账款 + 资产负债表.存货) - 上年(资产负债表.应收账款 + 资产负债表.存货)) / 利润表.销售收入
    < 0.05) && ((现金流量表.销售商品提供劳务收到的现金 / 利润表.销售收入) < 0.7) && (现金流量表.经营活动产生的现金流量净额 / 利润表.净利润 < 0.5)
  description: 该表达式旨在识别收入增长缺乏经营现金流支撑的矛盾现象。当收入增长超过30%，但营运资金（应收+存货）的增量微乎其微（收入增量的5%以下），且销售回款率低于70%，同时经营现金流净额与净利润严重不匹配（比值<0.5）时，高度疑似虚构收入，因为正常的收入增长会相应拉动营运资金和现金流入的增长。
  audit_item: 企业财务比率分析
  suspicion: 关键财务比率间勾稽矛盾疑点
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计帐簿，编制财务会计报告。任何单位不得以虚假的经济业务事项或者资料进行会计核算。\"\n  }\n]"
- expression: (资产负债表.资产负债率 > 70%) && ( (投资项目名称、投资方向、投资金额、决策审批层级.投资方向 NOT IN 禁止类业务清单.主业目录) || (业务类型（衍生品、PPP等）、合约规模、风险敞口.业务类型（衍生品、PPP等）
    IN ('衍生品交易','PPP项目','明股实债投资') && 业务类型（衍生品、PPP等）、合约规模、风险敞口.合约规模 > 集团审批限额) )
  description: 资产负债率超过监管指导线（警戒线通常为70%）的企业，严格限制开展非主业投资和高风险业务。若高负债企业违规涉足负面清单业务或超限额开展高风险业务，即判定违规。
  audit_item: 未按规定落实去杠杆政策措施
  suspicion: 高负债企业违规开展非主业投资或高风险业务
  regulation: "[\n  {\n    \"法规名称\": \"中央企业投资监督管理办法\",\n    \"法规文号\": \"国资委令第34号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条、第十七条\",\n    \"内容概述\": \"中央企业应当聚焦主业发展，严格控制非主业投资，高负债企业原则上不得开展新增非主业投资和推高负债率的项目。不得开展超出自身承受能力的高风险投资。\"\n  }\n]"
- expression: (担保公司.实收资本 < 资质要求.最低注册资本要求) || (流水.交易日期 - 验资报告.实缴日期 <= 60 && 流水.贷方金额 >= 验资报告.验资金额*0.9 && 流水.对方户名 IN (股东名册))
  description: 实收资本低于当地公积金中心规定的担保公司最低注册资本限额（如地方要求1亿元），或验资后60日内有大额资金转回股东账户且金额达到或超过验资金额的90%，即认定为资本不实或抽逃出资。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 担保公司注册资本不实或低于监管标准
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第七条\",\n    \"内容概述\": \"设立融资担保公司应当符合最低限额的实缴注册资本要求，具体限额由省、自治区、直辖市根据本地实际确定，但不得低于人民币2000万元。\"\n  }\n]"
- expression: (明细表.在保余额 / 资产负债表.净资产) > 10 || (使用记录.已计提准备金 < 明细表.在保余额 * 0.01) || (代偿记录.代偿金额 / 明细表.在保余额) > 0.03
  description: 担保放大倍数（在保余额/净资产）超过10倍，或风险准备金计提低于在保余额的1%，或历史代偿率超过3%，任一指标突破则反映担保公司偿付能力不足，无法有效覆盖住房公积金贷款风险。
  audit_item: 未按规定开展住房公积金贷款担保业务
  suspicion: 担保公司担保放大倍数超限或准备金不足
  regulation: "[\n  {\n    \"法规名称\": \"《融资担保公司监督管理条例》\",\n    \"法规文号\": \"国务院令第683号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条、第十六条\",\n    \"内容概述\": \"融资担保公司的担保责任余额不得超过其净资产的10倍；融资担保公司应当按照国家有关规定提取未到期责任准备金、担保赔偿准备金，确保准备金充足。\"\n  }\n]"
