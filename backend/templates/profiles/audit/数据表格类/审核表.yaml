name: audit/数据表格类/审核表
type: model
description: 从数据表格类类文档（审核表）中提取结构化元数据。涵盖字段如：与单位关系、住房安全等级、姓名、审核状态、家庭住址、家庭收入、就业意愿、年龄。文档范围包括：购房资格审核表、退捕渔民资格审核表、集资合作建房资格审核表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 培训
- 安全
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 审核表
  member_count: 1
  member_details:
  - 购房资格审核表
  - 退捕渔民资格审核表
  - 集资合作建房资格审核表
output:
  fields:
  - name: 与单位关系
    type: string
    description: 提取 与单位关系 的文本值
  - name: 住房安全等级
    type: string
    description: 提取 住房安全等级 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 审核状态
    type: boolean
    description: 提取 审核状态 的布尔值（是/否）
  - name: 家庭住址
    type: string
    description: 提取 家庭住址 的文本值
  - name: 家庭收入
    type: number
    description: 提取 家庭收入 的数值（含单位，如万元、吨等）
  - name: 就业意愿
    type: string
    description: 提取 就业意愿 的文本值
  - name: 年龄
    type: string
    description: 提取 年龄 的文本值
  - name: 户籍地
    type: string
    description: 提取 户籍地 的文本值
  - name: 技能特长
    type: string
    description: 提取 技能特长 的文本值
  - name: 文化程度
    type: string
    description: 提取 文化程度 的文本值
  - name: 是否已享受保障性住房政策
    type: boolean
    description: 提取 是否已享受保障性住房政策 的布尔值（是/否）
  - name: 是否有培训意愿
    type: boolean
    description: 提取 是否有培训意愿 的布尔值（是/否）
  - name: 是否符合保障条件
    type: boolean
    description: 提取 是否符合保障条件 的布尔值（是/否）
  - name: 渔民ID
    type: string
    description: 提取 渔民ID 的文本值
  - name: 经审核的集资人名单
    type: string
    description: 提取 经审核的集资人名单 的文本值
  - name: 购房人身份信息
    type: string
    description: 提取 购房人身份信息 的文本值
  - name: 资格审核通过日期
    type: date
    description: 提取 资格审核通过日期 的日期值，格式 YYYY-MM-DD
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (明细表.交易日期 - 时间表.购买日期（合同备案日/产权登记日）) < 5年 && 登记表.限制标记（是否限制上市） = '限制上市'
  description: 判定交易过户日期与保障房购买取得日期（以产权登记或合同备案较早者为准）间隔是否不足5年，同时产权限制登记仍为限制状态，两者均满足则视为未满5年违规上市交易。5年按1825天计算，可容差1天。若限制标记已解除但实际年限未满仍视为违规，表达式可简化为ABS(交易日期-取得日期)<1825。
  audit_item: 经济适用住房和限价商品住房违规上市交易
  suspicion: 经济适用住房未满5年违规上市交易
  regulation: "[\n  {\n    \"法规名称\": \"经济适用住房管理办法\",\n    \"法规文号\": \"建住房[2007]258号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十条\",\n    \"内容概述\": \"购买经济适用住房不满5年，不得直接上市交易。购房人因特殊原因确需转让的，由政府按照原价格并考虑折旧和物价水平等因素进行回购。\"\n  }\n]"
