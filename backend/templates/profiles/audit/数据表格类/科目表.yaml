name: audit/数据表格类/科目表
type: model
description: 从数据表格类类文档（科目表）中提取结构化元数据。涵盖字段如：科目代码、科目名称。文档范围包括：功能分类科目表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 科目表
  member_count: 1
  member_details:
  - 功能分类科目表
output:
  fields:
  - name: 科目代码
    type: string
    description: 提取 科目代码 的文本值
  - name: 科目名称
    type: string
    description: 提取 科目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 预算执行情况表.功能科目代码 != 部门年度预算批复文件.功能科目代码 AND (SELECT COUNT(*) FROM 预算调整审批记录 WHERE 原科目 = 部门年度预算批复文件.功能科目代码 AND 新科目
    = 预算执行情况表.功能科目代码 AND 金额 = 预算执行情况表.支出金额 AND 财政部批复文号 IS NOT NULL) = 0
  description: 比对每一笔支出的实际执行功能科目与预算批复的功能科目，若二者不一致且未找到对应的财政部批准调剂记录，则触发违规。重点关注“类”“款”“项”层级科目的交叉调整。
  audit_item: 预算调剂不规范
  suspicion: 未经批准在功能分类科目间调剂预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第七十二条\",\n    \"内容概述\": \"各部门、各单位的预算支出应当按照本级政府财政部门批复的预算科目和数额执行，不得挪用；确需调剂使用的，应当按照国家有关规定报经本级政府财政部门批准。\"\n  }\n]"
