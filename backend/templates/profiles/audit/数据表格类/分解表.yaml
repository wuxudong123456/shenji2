name: audit/数据表格类/分解表
type: model
description: 从数据表格类类文档（分解表）中提取结构化元数据。涵盖字段如：分解区域、单位、各问题当前状态、各项措施状态、后续计划标记、子企业名称、实际储备品种、实际完成资产负债率。文档范围包括：年度就业见习任务分解表、年度黑土地保护任务分解表、救灾备荒种子储备任务分解表、整改任务分解表、村庄规划编制任务分解表、绩效指标量化分解表、资产负债率考核指标分解表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 资产
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 分解表
  member_count: 1
  member_details:
  - 年度就业见习任务分解表
  - 年度黑土地保护任务分解表
  - 救灾备荒种子储备任务分解表
  - 整改任务分解表
  - 村庄规划编制任务分解表
  - 绩效指标量化分解表
  - 资产负债率考核指标分解表
output:
  fields:
  - name: 分解区域
    type: string
    description: 提取 分解区域 的文本值
  - name: 各问题当前状态
    type: boolean
    description: 提取 各问题当前状态 的布尔值（是/否）
  - name: 各项措施状态
    type: boolean
    description: 提取 各项措施状态 的布尔值（是/否）
  - name: 后续计划标记
    type: string
    description: 提取 后续计划标记 的文本值
  - name: 子企业名称
    type: string
    description: 提取 子企业名称 的文本值
  - name: 实际储备品种
    type: string
    description: 提取 实际储备品种 的文本值
  - name: 实际完成资产负债率
    type: string
    description: 提取 实际完成资产负债率 的文本值
  - name: 实际数量
    type: number
    description: 提取 实际数量 的数值（含单位，如万元、吨等）
  - name: 实际资产负债率
    type: string
    description: 提取 实际资产负债率 的文本值
  - name: 指标名称
    type: string
    description: 提取 指标名称 的文本值
  - name: 指标类型
    type: string
    description: 提取 指标类型 的文本值
  - name: 时间节点
    type: date
    description: 提取 时间节点 的日期值，格式 YYYY-MM-DD
  - name: 是否量化
    type: boolean
    description: 提取 是否量化 的布尔值（是/否）
  - name: 最新更新日期
    type: date
    description: 提取 最新更新日期 的日期值，格式 YYYY-MM-DD
  - name: 权重
    type: string
    description: 提取 权重 的文本值
  - name: 目标人数
    type: number
    description: 提取 目标人数 的数值（含单位，如万元、吨等）
  - name: 目标值
    type: string
    description: 提取 目标值 的文本值
  - name: 目标资产负债率
    type: string
    description: 提取 目标资产负债率 的文本值
  - name: 规划编号
    type: string
    description: 提取 规划编号 的文本值
  - name: 计划完成时间
    type: date
    description: 提取 计划完成时间 的日期值，格式 YYYY-MM-DD
  - name: 计划开始时间
    type: date
    description: 提取 计划开始时间 的日期值，格式 YYYY-MM-DD
  - name: 计划面积
    type: string
    description: 提取 计划面积 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (合并及单体资产负债表.资产负债率 > 分解表.目标资产负债率) || (分解表.实际完成资产负债率 > 分解表.目标资产负债率 && 未提交有效压降计划)
  description: 当企业实际资产负债率超过国资委或集团设定的管控目标，或未完成年度考核指标且无合规审批的压降计划时，判定为违规。阈值以制度文件中的管控线为准。
  audit_item: 未按规定落实去杠杆政策措施
  suspicion: 企业资产负债率超过管控线或未完成考核指标
  regulation: "[\n  {\n    \"法规名称\": \"关于加强国有企业资产负债约束的指导意见\",\n    \"法规文号\": \"中办发〔2018〕28号\",\n    \"效力级别\": \"制度文件\",\n\
    \    \"条款号\": \"第二条第（四）款\",\n    \"内容概述\": \"国有企业应合理设定资产负债率管控线和预警线，建立健全资产负债率约束机制，强化考核监督，确保资产负债率控制在合理水平。\"\n  }\n]"
- expression: 财务报表.资产负债率 > 制度文件.分层设定负债率指标的要求 && !分解表.子企业名称.contains(该子公司名称)
  description: 当某一子公司资产负债率超出集团统一规定或该层级应有的管控标准，而该子公司未被纳入考核指标分解表覆盖范围时，判定为违规。旨在发现通过规避考核而放任高风险子企业杠杆失控的问题。
  audit_item: 未按规定落实去杠杆政策措施
  suspicion: 未按规定将子企业资产负债率纳入考核
  regulation: "[\n  {\n    \"法规名称\": \"中央企业资产负债率分类管控工作方案\",\n    \"法规文号\": \"国资发财管〔2019〕132号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条第（二）款\",\n    \"内容概述\": \"中央企业应将各级子企业资产负债率纳入管控体系，实施分类管理和考核，不得遗漏重要子企业，确保全级次杠杆水平可控。\"\n  }\n]"
- expression: 保护任务完成进度跟踪表.实际完成面积 < 年度黑土地保护任务分解表.计划面积
  description: 将进度跟踪表按区域或年度汇总的实际完成面积与任务分解表中对应分区的计划面积累加值进行比对，当实际完成面积小于计划面积时，触发疑点，完成率低于100%即判定为面积任务未完成，偏差越大问题越严重。
  audit_item: 任务目标未完成
  suspicion: 黑土地保护面积任务未完成
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当将黑土地保护纳入国民经济和社会发展规划，安排资金，确保黑土地面积不减、质量不降，生态功能不退化。\"\n  }\n]"
- expression: (监测表.实时库存量 < 分解表.计划数量 * 0.9) || (检测报告.判定结论 == "不合格" && 登记表.不合格处理记录.isBlank()) || (监测表.储备品种 not.in 计划文件.计划储备品种)
  description: 以年度任务计划为基准，实际库存量低于计划数量的90%即视为数量未达标；质量检测结论为不合格且抽检登记表中无任何处理措施（如降级、转商、销毁）则判定质量管控失效；实际库存品种与计划品种存在差异且无审批变更手续的，视为擅自变更储备品种。三项满足任一即为疑点。
  audit_item: 救灾备荒种子储备方面不符合相关规定
  suspicion: 救灾备荒种子储备任务未完成或质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"国家救灾备荒种子储备管理办法\",\n    \"法规文号\": \"农农发〔2015〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条、第十条\",\n    \"内容概述\": \"承储单位应严格按照下达的储备计划完成储备任务，确保储备种子的品种、数量和质量符合要求；储备种子质量应符合国家或行业标准。\"\n  }\n]"
- expression: (分解表.计划完成时间 <= 系统日期) && (分解表.实际完成时间 IS NULL || 分解表.实际完成时间 > 分解表.计划完成时间)
  description: 以任务分解表中的计划完成时间为基准，若当前日期已超过计划截止日期，而任务状态仍为非“已完成”，或实际完成时间晚于计划时间，即判定为编制进度缓慢疑点。结合资金拨付率和招投标延期记录可进一步区分主要原因。
  audit_item: 村庄规划编制缓慢
  suspicion: 村庄规划编制任务逾期未完成
  regulation: "[\n  {\n    \"法规名称\": \"某地区村庄规划编制工作方案\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"工作目标及进度安排章节\"\
    ,\n    \"内容概述\": \"方案明确要求各镇（街道）应在202X年X月前完成全部应编村庄的规划编制任务，并制定了详细的季度、月度分解计划。\"\n  }\n]"
- expression: 分解表.是否量化 == '否' || (分解表.指标类型 NOT IN ('数量','质量','时效','成本') AND 指标类型空值)
  description: 如果指标分解表中存在未量化的指标（如仅有定性描述无具体数值），或关键绩效指标类型中缺失数量、质量、时效、成本四维中任何一个，即判定未细化量化。
  audit_item: 绩效管理不到位
  suspicion: 绩效指标未细化量化
  regulation: "[\n  {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"绩效指标应当量化，不能量化的，可采用分级分档形式定性描述，但应具有可衡量性。\"\n  }\n]"
- expression: 是否专家论证 == '否' || 权重分配 NOT BETWEEN 行业下限 AND 行业上限 || 指标类型 IN ('经济效益') AND 权重 > 0.6
  description: 若评审记录显示未经专家论证或集体决策；或关键指标权重严重偏离行业基准（如经济效益权重>60%偏重财务；或社会效益权重<20%）；或指标仅关注产出而忽略效果、满意度等，即视为不合理。
  audit_item: 绩效管理不到位
  suspicion: 绩效指标设计不合理不全面
  regulation: "[\n  {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"绩效指标应当与绩效目标密切相关，突出重点，系统全面；优先选择最具代表性、最能反映项目绩效的关键指标。\"\n  }\n]"
