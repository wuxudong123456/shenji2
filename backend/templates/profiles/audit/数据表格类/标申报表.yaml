    ,\n    \"条款号\": \"第二条第（五）款\",\n    \"内容概述\": \"要对绩效目标实现程度和预算执行进度实行‘双监控’，确保绩效目标如期保质保量实现。\"\n  },\n  {\n    \"法规名称\": \"\
