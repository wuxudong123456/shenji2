name: audit/数据表格类/标申报表
type: model
description: 从数据表格类类文档（标申报表）中提取结构化元数据。涵盖字段如：上年产出任务数量、产出指标、产出指标值、任务计划数、关键效益/产出指标名称、分项指标是否设有具体指标值、原定目标值、原定绩效指标名称。文档范围包括：年度/项目绩效目标申报表、年度预算绩效目标申报表、绩效目标申报表、项目支出绩效目标申报表、预算绩效目标申报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 标申报表
  member_count: 1
  member_details:
  - 年度/项目绩效目标申报表
  - 年度预算绩效目标申报表
  - 绩效目标申报表
  - 项目支出绩效目标申报表
  - 预算绩效目标申报表
output:
  fields:
  - name: 上年产出任务数量
    type: number
    description: 提取 上年产出任务数量 的数值（含单位，如万元、吨等）
  - name: 产出指标
    type: string
    description: 提取 产出指标 的文本值
  - name: 产出指标值
    type: string
    description: 提取 产出指标值 的文本值
  - name: 任务计划数
    type: string
    description: 提取 任务计划数 的文本值
  - name: 关键效益-产出指标名称
    type: string
    description: 提取 关键效益-产出指标名称 的文本值
  - name: 分项指标是否设有具体指标值
    type: boolean
    description: 提取 分项指标是否设有具体指标值 的布尔值（是/否）
  - name: 原定目标值
    type: string
    description: 提取 原定目标值 的文本值
  - name: 原定绩效指标名称
    type: string
    description: 提取 原定绩效指标名称 的文本值
  - name: 实际完成情况
    type: string
    description: 提取 实际完成情况 的文本值
  - name: 审核人
    type: string
    description: 提取 审核人 的文本值
  - name: 审核意见
    type: string
    description: 提取 审核意见 的文本值
  - name: 审核时间
    type: date
    description: 提取 审核时间 的日期值，格式 YYYY-MM-DD
  - name: 审核结论
    type: string
    description: 提取 审核结论 的文本值
  - name: 年度绩效指标
    type: date
    description: 提取 年度绩效指标 的日期值，格式 YYYY-MM-DD
  - name: 总目标
    type: string
    description: 提取 总目标 的文本值
  - name: 总目标描述
    type: string
    description: 提取 总目标描述 的文本值
  - name: 总目标文本
    type: string
    description: 提取 总目标文本 的文本值
  - name: 指标值
    type: string
    description: 提取 指标值 的文本值
  - name: 指标名称
    type: string
    description: 提取 指标名称 的文本值
  - name: 指标数据来源说明
    type: string
    description: 提取 指标数据来源说明 的文本值
  - name: 效益指标
    type: string
    description: 提取 效益指标 的文本值
  - name: 是否分解为多级子目标
    type: boolean
    description: 提取 是否分解为多级子目标 的布尔值（是/否）
  - name: 本年产出任务数量
    type: number
    description: 提取 本年产出任务数量 的数值（含单位，如万元、吨等）
  - name: 满意度指标
    type: string
    description: 提取 满意度指标 的文本值
  - name: 申报单位
    type: string
    description: 提取 申报单位 的文本值
  - name: 申报日期
    type: date
    description: 提取 申报日期 的日期值，格式 YYYY-MM-DD
  - name: 目标值
    type: string
    description: 提取 目标值 的文本值
  - name: 绩效指标
    type: string
    description: 提取 绩效指标 的文本值
  - name: 绩效指标名称
    type: string
    description: 提取 绩效指标名称 的文本值
  - name: 绩效目标
    type: string
    description: 提取 绩效目标 的文本值
  - name: 绩效目标内容
    type: string
    description: 提取 绩效目标内容 的文本值
  - name: 绩效目标申报日期
    type: date
    description: 提取 绩效目标申报日期 的日期值，格式 YYYY-MM-DD
  - name: 评价标准
    type: string
    description: 提取 评价标准 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 预算资金规模
    type: number
    description: 提取 预算资金规模 的数值（含单位，如万元、吨等）
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 绩效目标下达日期 IS NULL OR 绩效目标下达日期 > 预算批复日期
  description: 若不存在绩效目标下达记录，或绩效目标下达日期晚于预算批复日期（即使晚1天），均视为未同步批复下达。在实务中，同步批复要求预算和绩效目标在同一文件或同一批次同步下达，时间差应为0。
  audit_item: 部门、单位预算绩效目标下达或调整不合规
  suspicion: 预算绩效目标未与预算同步批复下达
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第三条第（六）款\",\n    \"内容概述\": \"各级财政部门要将绩效目标设置作为预算安排的前置条件，加强绩效目标审核，将绩效目标与预算同步批复下达。\"\n  }\n]"
- expression: (年终自评报告中的目标值 != 年初申报表中的目标值) AND (对应的绩效目标调整申请及批复记录 IS NULL OR 批复结果为未批准)
  description: 若任何一项绩效指标的目标值在年末自评报告或执行文件中与年初申报值不一致，且找不到合法合规的审批记录（包括内部决策和财政批复），即判定为擅自调整。调整包括降低指标值、删除指标、新增指标等。
  audit_item: 部门、单位预算绩效目标下达或调整不合规
  suspicion: 未经批准自行调整预算绩效目标
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第四条第（十）款\",\n    \"内容概述\": \"预算执行中，各部门各单位应对绩效目标实现程度和预算执行进度实行‘双监控’，确需调整预算和绩效目标的，应按程序报批。\"\n  },\n  {\n\
    \    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\",\n\
    \    \"内容"
- expression: 申报表.审核意见 == '通过' && (申报表.绩效目标内容 不包含量化指标 或 审核记录.审核要素完整性 != '完整' 或 审核记录.审核人员资质 != 符合制度要求)
  description: 若绩效目标申报表审核意见为“通过”，但绩效目标描述未包含可量化指标（如覆盖率、使用率等）或审核过程记录显示审核要素不完整、审核人员未达到制度规定的资质，则判定为审核不规范，可能存在形式化审核。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 未按规定审核预算绩效目标
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"党内法规/行政法规\"\
    ,\n    \"条款号\": \"第三部分\",\n    \"内容概述\": \"明确要求各部门各单位编制预算时要设置全面、可衡量的绩效目标，并严格审核绩效目标。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条、第十四条\",\n    \"内容概述\": \"绩效目标应清晰、量"
- expression: 项目库.入库状态 == '已入库' && (申报表.审核意见 == '不通过' 或 审核记录.审核结论 == '不通过' 或 审核记录.审核结论 == '退回' )
  description: 若项目库中项目的入库状态为“已入库”，但关联的绩效目标申报表审核意见或审核过程记录表显示审核结论为“不通过”或“退回”，则判定为违规将未通过审核的项目纳入项目库。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 未通过审核的项目进入项目库
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十四条、第十六条\",\n    \"内容概述\": \"绩效目标审核未通过的项目不得纳入项目库，不得安排预算。\"\n  },\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\"\
    ,\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"党内法规/行政法规\",\n    \"条款号\": \"第三部分\",\n    \"内容概述\": \"将绩效目标审核结果作为项目入库和预算安排的"
- expression: (申报表.审核意见 == '不通过' 或 审核记录.审核结论 == '不合格') && 安排表.安排状态 == '已安排预算'
  description: 若项目绩效目标审核意见为“不通过”或审核过程记录显示“不合格”，但该项目却出现在年度预算安排计划表中且状态为“已安排预算”，则判定为审核不合格即进入预算安排流程。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 审核不合格即进入预算安排流程
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"2014年修正\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条\"\
    ,\n    \"内容概述\": \"各部门、各单位应当按照绩效目标管理等预算绩效管理要求编制预算草案。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条、第十七条\",\n    \"内容概述\": \"绩效目标审核不合格的项目不得进入预算安排环节，需修改完善后重新审核。\"\n  "
- expression: (申报表.绩效目标内容 == '无' 或 申报表.绩效目标内容 == '暂无' 或 申报表.审核意见 == '不通过' 或 不合格台账.处理结果 == '保留预算') && 安排表.安排状态 == '已安排'
  description: 项目在绩效目标申报表中绩效目标为空或填写“无”“暂无”，或审核意见为不通过，或被列入审核不合格项目台账且未剔除预算安排，但年度预算安排计划表中依然安排了预算，即构成违规。
  audit_item: 部门、单位预算绩效目标审核不规范
  suspicion: 违规为未设定或未通过绩效目标的项目安排预算
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"党内法规/行政法规\"\
    ,\n    \"条款号\": \"第三部分\",\n    \"内容概述\": \"未按要求设定绩效目标或审核未通过的项目，一律不得安排预算。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效目标管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"未设定绩效目标或绩效目标审核未通过的，不得纳入预"
- expression: (项目绩效指标完成情况统计表.完成率 < 0.8 && 预算执行进度与绩效目标对比表.累计支出金额 / 预算金额 < 0.8) || (ABS(绩效自评报告.自评完成率 - 第三方评价报告.第三方评价完成率) / 绩效自评报告.自评完成率
    > 0.3) || (预算执行进度与绩效目标对比表.实际完成进度 < 预算执行进度与绩效目标对比表.计划完成进度 * 0.7)
  description: 同时满足项目完成率低于80%且资金执行率低于80%判定为目标未完成；或自评完成率与第三方评价完成率偏差超过自评完成率的30%，表明绩效数据失真或实际效果不匹配；或实际进度落后计划进度30%以上且执行率偏低。以上任一条件触发疑点。
  audit_item: 部门、单位预算绩效目标未完成
  suspicion: 预算绩效目标未完成
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位应当对预算支出情况开展绩效评价。\"\n  },\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n\
    \    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第七条、第十一条\",\n    \"内容概述\": \"严格绩效目标管理，未按要求设定绩效目标或审核未通过的"
- expression: (绩效目标申报表.产出指标 IS NULL OR 绩效目标申报表.效益指标 IS NULL OR 绩效目标申报表.满意度指标 IS NULL) && (项目可行性研究报告或立项论证材料.项目预期成果清单 != '无'
    OR 年度工作计划.重点工作目标 != '缺失')
  description: 此表达式用于侦测绩效目标覆盖不完整。当‘绩效目标申报表’中财务部规定的核心指标（如产出、效益、满意度）有一项或多项完全缺失（IS NULL），但审核其立项源头，如‘项目可行性研究报告或立项论证材料’中却明确描述了相关的预期成果，或‘年度工作计划’中对该项工作有明确的多维度目标要求，说明申报表未能完整转化应设定的全部目标，构成不完整式违规。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定不完整，缺失核心指标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十一条\",\n    \"内容概述\": \"各部门、各单位应当按照国务院财政部门制定的绩效目标管理办法，设置指向明确、细化量化、合理可行的项目支出绩效目标，并作为编制和安排预算的重要依据。\"\n  },\n  {\n\
    \    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n  \
    \  \"内容概述"
- expression: ABS(预算批复金额 / 产出指标值 - 历史平均单位成本) / 历史平均单位成本 > 0.5
  description: 计算项目单位产出的预算成本，并与本单位同类项目过去三年（若历史数据不足，则参考同地区同行业标杆值）平均单位成本进行对比。当两者偏差率的绝对值（ABS）超过50%时，判定为资金与目标严重不匹配。例如，某培训项目预算批复100万元，计划培训100人次，单位成本为1万元/人次，而近三年历史平均单位成本仅为0.3万元/人次，偏差率达233%，触发异常。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标与预算资金量严重不匹配
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位的支出必须按照预算执行，不得虚假列支。各级政府、各部门、各单位应当对预算支出情况开展绩效评价。\"\n  },\n  {\n    \"法规名称\":\
    \ \"预算绩效管理工作考核办法\",\n    \"法规文号\": \"财预〔2011〕433号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"\
    绩效目标设定要与预算"
- expression: (本年预算金额 / 上年预算金额 - 1) / (本年产出任务数量 / 上年产出任务数量 - 1) < 0.5 && 本年预算金额 > 上年预算金额
  description: 此表达式用于检测资金与任务量变动的协同性。计算预算增长率与任务量增长率的比值（弹性系数）。当预算增长但任务量增长显著滞后，即弹性系数小于0.5（例如，预算增长100%，任务量仅增长10%，比值为0.1），且本年预算确实增加时，判定为“资金量与任务数不匹配”。这说明资金增加缺乏对应的实物工作量支撑。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标与任务计划数不匹配
  regulation: "[\n  {\n    \"法规名称\": \"关于加强和改进中央部门项目支出预算管理的通知\",\n    \"法规文号\": \"财预〔2015〕82号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"项目绩效目标应与预算资金量、项目任务量相匹配。在预算编制和评审中，要对绩效目标与资金规模的合理性、相关性进行重点审核。\"\n  },\n  {\n   \
    \ \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条\",\n    \"\
    内容概述\": \"绩效"
- expression: (目标值 / 历史最佳完成值 > 2) || (目标值 / 行业平均先进值 > 1.5)
  description: 当项目申报的目标值远超其自身及其所在区域/行业的历史最佳水平。例如，设定的GDP增长目标为该地区历史最高增速的2倍以上，或远超同类地区的平均先进水平1.5倍以上，且无任何重大外部条件变化（如特大投资、政策红利）佐证时，判定为不合理可行。比值越高，不合理的确定性越高。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定不合理，远超实际可行
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"绩效目标要包括产出、成本、经济效益、社会效益、生态效益、可持续影响和服务对象满意度等绩效指标。绩效目标要科学合理、实事求是。\"\n  },\n  {\n\
    \    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n   \
    \ \"内容概述\":"
- expression: (绩效目标申报表.目标层级 = 1) && (绩效目标申报表.总目标 LIKE '%改善环境%' OR 绩效目标申报表.总目标 LIKE '%提升服务%') && (年度工作计划.任务分解颗粒度 = '粗放')
  description: 检查目标是否仅有一个宏大笼统的总目标，而没有分层级的细化指标。当申报表仅有一级目标，总目标文本中出现“改善”、“提升”、“加强”等无法衡量具体方向和内容的动词，并且配套的年度工作计划中对实现该目标的步骤描述颗粒度极为粗放（例：仅为‘一季度开展、二季度推进’），则认定为未细化。这违反了目标
    SMART 原则中的 Specific 和 Measurable。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定过于笼统未细化
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十四条\",\n    \"内容概述\": \"绩效指标应当定量指标与定性指标相结合，优先使用定量指标。绩效目标的设置应当细化量化，并将其分解为清晰、可衡量的绩效指标。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"\
    绩效目标要能清晰"
- expression: (绩效目标申报表.指标值 LIKE '%定性%' OR 绩效目标申报表.指标值 IS NULL OR 绩效目标申报表.指标数据来源说明 IS NULL) && (绩效指标量化标准表.计算公式 IS NULL)
  description: 该表达式判断目标是否可衡量。当申报表中的‘指标值’为纯定性文字描述（如‘好’、‘满意’、‘显著提升’）或空值，并且其‘数据来源说明’为空，表明不知道由谁、用什么方法收集数据；同时，在单位配套的‘量化标准表’中也找不到针对这个指标的计算公式或评分细则时，即可判定该目标完全不可衡量。一个既无量化值、也无计算方法、更无数据来源的目标，等同于一场‘自己既当运动员又当裁判员’且规则为空的游戏。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定不可衡量
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"预算支出绩效指标应当尽可能量化，不能量化的，应当设定定性指标，但应当具有可衡量性，并经充分论证。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\",\n    \"内容概述\": \"绩效指标应当明确指标解释、指标计算公式、"
- expression: (申报评价标准.优 >= 历史实际完成最差值) || (申报评价标准.合格 < 政策文件.最低要求标准)
  description: 此表达式排查评价标准‘低定高评’的问题。第一种情况，评价标准过于宽松：如果申报的优秀线（如完成任务80%即优秀），甚至低于本单位过去三年最差年份的实际完成值，说明该标准形同虚设，起不到任何激励约束作用。第二种情况，评价标准过低：如果部门自行设定的合格线（如满意度60%即合格），显著低于上级政策文件或行业通用的最低服务标准（如80%），属于刻意降低及格门槛，以掩盖实际绩效的低下。两者均构成评价标准不
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效评价标准设定过低或过高不合理
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"绩效评价标准是指衡量财政支出绩效目标完成情况的尺度，应当符合客观公正、科学合理的原则。绩效评价标准的设定应当与项目的实际情况、历史数据、行业标准等相匹配。\"\n  },\n \
    \ {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\"\
    ,\n   "
- expression: 部门/单位发布的预算绩效管理制度文件.文件存在性 = '不存在' || 部门/单位发布的预算绩效管理制度文件.发布日期 IS NULL
  description: 若该部门未以正式发文形式发布任何预算绩效管理制度文件，或声称有制度但无法提供正式发文日期和文号，即判定为未建立制度，违规成立。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 未按规定建立预算绩效管理制度
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第二部分（二）\",\n    \"内容概述\": \"各部门各单位要结合本部门本单位职责、行业发展规划，完善预算绩效管理制度，健全绩效指标和标准体系，将绩效管理融入预算编制、执行、监督全过程。\"\n\
    \  }\n]"
- expression: (绩效自评报告及支撑材料.绩效目标完成值 IS NULL OR 绩效自评报告及支撑材料.偏差原因分析 IS NULL OR 绩效自评报告及支撑材料.改进措施 IS NULL) && 上级制度文件.内容要求.必须有偏差分析等字段
    = '是'
  description: 比照制度规定的自评报告必须包含的内容要素（如绩效指标完成情况、偏差原因分析、下一步改进措施等），若任一关键字段缺失，即视为报告内容不完整。若报告仅描述资金使用进度而缺少绩效目标完成数据，触发违规。
  audit_item: 部门、单位预算绩效自评不规范
  suspicion: 自评报告关键要素缺失
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"绩效自评报告应当内容完整、数据真实、结果客观，主要包括绩效目标完成情况、偏离绩效目标的原因、下一步改进措施等内容。\"\n  }\n]"
- expression: COUNT(绩效运行监控报告) == 0 && SUM(预算执行进度统计表.支出金额) > 0
