name: audit/数据表格类/时间表
type: model
description: 从数据表格类类文档（时间表）中提取结构化元数据。涵盖字段如：事项名称、任务名称、公告日、决议日、各环节实际审批完成日期、意向形成日、房屋坐落、批复日期。文档范围包括：年度投资计划下达时间表、建设项目全周期审批流程时间表、经济适用住房/限价房购买时间表、股份合作制改革任务时间表、重大事项决策时间表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 审批
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 时间表
  member_count: 1
  member_details:
  - 年度投资计划下达时间表
  - 建设项目全周期审批流程时间表
  - 经济适用住房/限价房购买时间表
  - 股份合作制改革任务时间表
  - 重大事项决策时间表
output:
  fields:
  - name: 事项名称
    type: string
    description: 提取 事项名称 的文本值
  - name: 任务名称
    type: string
    description: 提取 任务名称 的文本值
  - name: 公告日
    type: string
    description: 提取 公告日 的文本值
  - name: 决议日
    type: string
    description: 提取 决议日 的文本值
  - name: 各环节实际审批完成日期
    type: date
    description: 提取 各环节实际审批完成日期 的日期值，格式 YYYY-MM-DD
  - name: 意向形成日
    type: string
    description: 提取 意向形成日 的文本值
  - name: 房屋坐落
    type: string
    description: 提取 房屋坐落 的文本值
  - name: 批复日期
    type: date
    description: 提取 批复日期 的日期值，格式 YYYY-MM-DD
  - name: 法定应完成日期
    type: date
    description: 提取 法定应完成日期 的日期值，格式 YYYY-MM-DD
  - name: 计划下达日期
    type: date
    description: 提取 计划下达日期 的日期值，格式 YYYY-MM-DD
  - name: 计划完成时间
    type: date
    description: 提取 计划完成时间 的日期值，格式 YYYY-MM-DD
  - name: 购买日期
    type: date
    description: 提取 购买日期 的日期值，格式 YYYY-MM-DD
  - name: 购房人姓名
    type: string
    description: 提取 购房人姓名 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ((流水.账户持有人姓名 IN (领导人员配偶子女)) AND (流水.买入日期 BETWEEN 时间表.意向形成日 AND 时间表.公告日-1日) AND (流水.股票代码 = 本企业或并购标的股票)) OR (授权费用审批记录.授权费用
    < 评估报告.无形资产公允价值*0.5 AND 无形资产使用审批记录.授权对象名称为领导人员相关企业)
  description: 配偶、子女等在重大信息形成后、公告前突击买入本企业或相关上市公司股票，即推定为内幕交易。无形资产以明显不公允的价格授权给领导人员关联企业，亦属违规，定价低于公允价值50%触发。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 利用内幕信息或无形资产为关系人谋利
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（五）项\",\n    \"内容概述\": \"不得利用企业上市或者上市公司并购、重组、定向增发等过程中的内幕消息、商业秘密以及企业的知识产权、业务渠道等无形资产或者资源，为本人或者配偶、子女及其他特定关系人谋取利益。\"\
    \n  }\n]"
- expression: (许可证.发证日期 < 批复文件.批复日期) || (设计文件.批复日期 < 研究报告.批复日期) || (项目清单.实际开工日期 < 意见书.批复日期) || (许可证.发证日期 IS NULL && 项目清单.实际开工日期
    IS NOT NULL) || (评价报告.批复日期 < 批复文件.批复日期)
  description: 该表达式用于判定审批程序倒置或未批先建。主要逻辑包括：1) 规划许可证日期早于立项批复日期，表明程序倒置；2) 初设批复早于可研批复，违反基本建设程序；3) 实际开工日期早于用地审批文件日期，构成未批先建；4) 未取得规划许可证但已有实际开工记录，属于严重违法行为；5)
    环评批复早于立项批复，通常不符合逻辑，涉嫌程序违规。所有条件满足其一即触发疑点。
  audit_item: 未按规定办理项目审批等手续
  suspicion: 未批先建或程序倒置违规
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条、第十三条\"\
    ,\n    \"内容概述\": \"政府投资项目必须严格执行基本建设程序，项目单位不得在开工前缺失任何法定审批手续，不得在审批手续办结前开工建设。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\"\
    ,\n    \"法规文号\": \"主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"在城市、镇规划区内进行建筑物、构筑物、道路、"
- expression: DATEDIFF(day, 时间表.批复日期, 时间表.计划下达日期) > 30
  description: 比较投资计划实际下达日期与上级批复日期的时间差，超过制度规定时限（如30个自然日）即触发违规。具体时限阈值以投资计划管理制度文件中的规定为准，若无明确规定则采用30日常用审计标准。
  audit_item: 投资计划分解下达不合规
  suspicion: 未按规定时限下达投资计划
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当和本级预算相衔接，并按照预算管理要求及时分解下达，确保项目按期执行。\"\n  }\n]"
- expression: (明细表.交易日期 - 时间表.购买日期（合同备案日/产权登记日）) < 5年 && 登记表.限制标记（是否限制上市） = '限制上市'
  description: 判定交易过户日期与保障房购买取得日期（以产权登记或合同备案较早者为准）间隔是否不足5年，同时产权限制登记仍为限制状态，两者均满足则视为未满5年违规上市交易。5年按1825天计算，可容差1天。若限制标记已解除但实际年限未满仍视为违规，表达式可简化为ABS(交易日期-取得日期)<1825。
  audit_item: 经济适用住房和限价商品住房违规上市交易
  suspicion: 经济适用住房未满5年违规上市交易
  regulation: "[\n  {\n    \"法规名称\": \"经济适用住房管理办法\",\n    \"法规文号\": \"建住房[2007]258号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十条\",\n    \"内容概述\": \"购买经济适用住房不满5年，不得直接上市交易。购房人因特殊原因确需转让的，由政府按照原价格并考虑折旧和物价水平等因素进行回购。\"\n  }\n]"
