name: audit/数据表格类/下达表
type: model
description: 从数据表格类类文档（下达表）中提取结构化元数据。涵盖字段如：分解日期、计划下达日期、项目名称、项目编码。文档范围包括：年度投资计划分解下达表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 下达表
  member_count: 1
  member_details:
  - 年度投资计划分解下达表
output:
  fields:
  - name: 分解日期
    type: date
    description: 提取 分解日期 的日期值，格式 YYYY-MM-DD
  - name: 计划下达日期
    type: date
    description: 提取 计划下达日期 的日期值，格式 YYYY-MM-DD
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目编码
    type: string
    description: 提取 项目编码 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 投资计划分解下达表.计划下达日期 > 内部制度.规定的计划下达截止日期
  description: 若计划实际下达日期晚于单位内部制度或上级主管部门规定的截止日期，则触发违规。此表达式用于审查下达的时效性。
  audit_item: 项目计划分解下达不合规
  suspicion: 项目投资计划未在规定时限内下达
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当根据预算安排及时下达。\"\n  },\n  {\n    \"法规名称\": \"关于加强中央预算内投资管理有关问题的通知\",\n    \"法规文号\": \"发改投资〔2017〕1806号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各地、各部门要切实加快投资计划分解下达进度，明确各环节时间节点。\"\n  }\n]"
- expression: (项目库备案记录表.项目编码 is NULL) || (ABS(项目库备案记录表.备案日期 - 年度投资计划分解下达表.分解日期) > 5)
  description: 筛选条件1：在项目库备案记录表中找不到与分解下达表对应的项目编码，判定为未备案。筛选条件2：备案日期与分解日期的绝对天数差超过5个工作日，判定为未及时备案（具体天数可按制度调整）。
  audit_item: 项目计划分解下达不合规
  suspicion: 项目库未及时备案投资计划分解情况
  regulation: "[\n  {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"各部门应建立完善的项目库管理制度，及时将项目分解信息、绩效目标等信息录入项目库，并报财政部门备案。\"\n  },\n  {\n    \"法规名称\": \"某单位项目库管理办法及相关备案流程制度\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"具体条款\",\n    \"内容概述\": \"明确规定项目计划分解后，责任单位须在规定"
- expression: 直接投资项目前期工作文件.可研报告批复日期 > 年度投资计划分解下达表.计划下达日期
  description: 判断项目可行性研究报告批复（立项）日期是否晚于将该项目列入年度投资计划的下达日期。若批复日期晚于计划下达日期，则说明项目在未取得合规身份的情况下违规被列入计划。
  audit_item: 项目计划分解下达不合规
  suspicion: 直接投资项目前期工作未完成即列入年度投资计划
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条、第十一条\"\
    ,\n    \"内容概述\": \"政府投资项目应当编制项目建议书、可行性研究报告等，并按照规定审批。投资主管部门应当根据国民经济和社会发展规划、中期财政规划等，审查项目建设的必要性、可行性。审批通过后方可列入投资计划。\"\n  }\n\
    ]"
