name: audit/数据表格类/计提表
type: model
description: 从数据表格类类文档（计提表）中提取结构化元数据。涵盖字段如：原值、实际计提比例、是否正常使用、累计折旧、计提金额、资产名称、预计使用年限。文档范围包括：固定资产折旧计提表、坏账准备计提表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 资产
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 计提表
  member_count: 1
  member_details:
  - 固定资产折旧计提表
  - 坏账准备计提表
output:
  fields:
  - name: 原值
    type: string
    description: 提取 原值 的文本值
  - name: 实际计提比例
    type: number
    description: 提取 实际计提比例 的数值（含单位，如万元、吨等）
  - name: 是否正常使用
    type: boolean
    description: 提取 是否正常使用 的布尔值（是/否）
  - name: 累计折旧
    type: string
    description: 提取 累计折旧 的文本值
  - name: 计提金额
    type: number
    description: 提取 计提金额 的数值（含单位，如万元、吨等）
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 预计使用年限
    type: string
    description: 提取 预计使用年限 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (信用报告.破产公告 = '破产' && 计提表.实际计提比例 < 0.95) || (计提表.实际计提比例 < 政策.预期信用损失率)
  description: 对已破产客户未100%计提坏账，或组合计提比例低于企业自身制定的预期信用损失率，均属计提不足。
  audit_item: 未按规定核算资产
  suspicion: 坏账准备计提严重不足
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\": \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第四十六条至第四十八条\",\n    \"内容概述\": \"企业应采用预期信用损失模型对金融资产计提减值准备，合理反映信用风险。\"\n  }\n]"
- expression: (集体资产登记、保管、使用等管理制度文件.是否涵盖全生命周期条款 != TRUE) || (集体资产登记、保管、使用等管理制度文件.是否包含定期盘点条款 != TRUE) || (台账表.资产编号为空 || 台账表.保管责任人为空)
    || (计提表.资产名称 NOT IN 台账表.资产名称)
  description: 判定制度缺失或未实行台账管理的逻辑：1）书面制度文件缺失资产全生命周期管理或定期盘点条款，属于制度设计缺陷；2）台账记录中关键管理字段（如资产编号、保管责任人）缺失，视为台账形同虚设；3）财务计提折旧表中有资产记录但实物台账中无对应记录，证明账表脱节、未实现统一台账管理。上述条件任一满足即触发疑点。
  audit_item: 农村集体资产管理不到位
  suspicion: 未建立健全资产登记保管制度并实行台账管理
  regulation: "[\n  {\n    \"法规名称\": \"村集体经济组织会计制度\",\n    \"法规文号\": \"财会〔2004〕12号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"村集体经济组织必须建立健全资产物资的登记、保管、领用等制度，并定期进行盘点清查，做到账实相符。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强农村集体资金资产资源管理的若干意见\"\
    ,\n    \"法规文号\": \"农经发〔2013〕5号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"全面建立集体资产台账，"
