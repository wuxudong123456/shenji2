name: audit/数据表格类/分布表
type: model
description: 从数据表格类类文档（分布表）中提取结构化元数据。涵盖字段如：全部服务地块坐标、可服务乡镇/村列表、各服务地块面积、服务地块分布图、站点经纬度、站点间距、覆盖半径、设施经纬度。文档范围包括：农业社会化服务实施区域分布表、地理信息分布表、建制村客运停靠站点分布表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 分布表
  member_count: 1
  member_details:
  - 农业社会化服务实施区域分布表
  - 地理信息分布表
  - 建制村客运停靠站点分布表
output:
  fields:
  - name: 全部服务地块坐标
    type: string
    description: 提取 全部服务地块坐标 的文本值
  - name: 可服务乡镇-村列表
    type: string
    description: 提取 可服务乡镇-村列表 的文本值
  - name: 各服务地块面积
    type: string
    description: 提取 各服务地块面积 的文本值
  - name: 服务地块分布图
    type: string
    description: 提取 服务地块分布图 的文本值
  - name: 站点经纬度
    type: string
    description: 提取 站点经纬度 的文本值
  - name: 站点间距
    type: string
    description: 提取 站点间距 的文本值
  - name: 覆盖半径
    type: string
    description: 提取 覆盖半径 的文本值
  - name: 设施经纬度
    type: string
    description: 提取 设施经纬度 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (重复建设比对分析表.重叠面积或距离 < 5 && 重复建设比对分析表.功能相似度 > 0.8) || (资金拨付和使用台账.收款单位名称对应不同资金拨付和使用台账.对应项目名称的数量 > 1) || (资金拨付和使用台账.收款单位名称对应不同资金拨付和使用台账.对应项目名称
    && 重复建设比对分析表.功能相似度 > 0.8) || (规划合理性分析文件.新建必要性论证结论 = '必要' && 规划合理性分析文件.区域需求覆盖率 < 0.6)
  description: 两设施间距离小于5公里且功能高度相似视为重复建设；同一地理坐标出现多个项目资金记录直接触发；同一供应商承接相邻同类项目且无功能互补视为拆包重复建设；必要性论证忽略已有低利用率设施仍获批准属于规划决策失当。以上任一条件满足即生成疑点。
  audit_item: “互联网+”农产品出村进城工程实施不到位
  suspicion: 仓储物流基础设施项目存在重复建设
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"政府投资项目不得重复建设，已有类似设施能够满足需求的，不得另行建设。\"\n  }\n]"
- expression: (MAX(农业社会化服务实施区域分布表.各服务地块面积) < 农业社会化服务相关政策文件.集中连片标准定义（如最小连片面积）) || (计算服务点间平均距离 / 农业社会化服务相关政策文件.地理边界划定要求 > 1)
    || (项目验收报告.批复建筑面积 * 0.5 > 项目验收报告.验收面积)
  description: 通过三个维度判定：1. 服务区域中最大单块地块面积未达到实施方案中明确的集中连片最小面积标准；2. 利用GIS计算服务点位的离散度指数，即所有服务点之间的平均距离与政策要求的连片区域内点最大允许距离的比值，比值大于1表示服务区域过于分散；3.
    将申报材料中声称的连片区域面积与经GIS核实后的实际连片区域面积比对，若实际面积不足申报面积的50%，则判定为未集中连片。
  audit_item: 农业社会化服务实施不合规
  suspicion: 农业社会化服务实施区域未集中连片
  regulation: "[\n  {\n    \"法规名称\": \"农业部办公厅 财政部办公厅关于支持农业生产社会化服务工作的通知\",\n    \"法规文号\": \"农办财〔2017〕41号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"项目任务实施应相对集中连片，重点支持规模经营，推进机械化、规模化、集约化的绿色高效现代农业生产方式。\"\n  }\n]"
- expression: (站点最小覆盖半径 > 2000米) || (相邻站点间距 < 300米 AND 前后站平均间距 > 800米) || (投诉站点不合理比例 > 20%)
  description: 依据《农村客运服务规范》等行业标准，单站点覆盖半径大于2千米为覆盖盲区；相邻站点间距过小（<300米）且与全线平均站距偏差过大，表明设置密集不合理；群众投诉比例超过20%反映突出矛盾。
  audit_item: 项目建设养护未实现政策目标
  suspicion: 农村客运班线停靠站点设置不合理
  regulation: "[\n  {\n    \"法规名称\": \"农村道路旅客运输班线通行条件审核规则\",\n    \"法规文号\": \"交运发〔2014〕258号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"农村客运站点设置应科学合理，保障覆盖人口聚集区，通行线路应具备安全通行条件，停靠站点设置要方便群众、兼顾效率。\"\n  }\n]"
