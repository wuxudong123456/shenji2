name: audit/数据表格类/对比表
type: model
description: 从数据表格类类文档（对比表）中提取结构化元数据。涵盖字段如：上年结转指标、不合格原因、不规范项目、不通过原因、中央实际到位金额、乡村名额数、乡村教师占比、享受待遇起始时间。文档范围包括：“三公”经费公开内容与规定模板对比表、专项资金预算执行对比表、中央与地方财政投入对比表、交通安全设施建设同步性核查对比表、产业园产值目标与实际完成对比表（分产业类别）、价格对比表、任务完成进度对比表、优惠政策执行对比表、优惠政策落实情况对比表、会议天数及议程执行对比表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 决算
- 拨款
- 资产
- 金额
- 元数据提取
