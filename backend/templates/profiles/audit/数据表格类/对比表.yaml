    条款号\": \"第二十三条\",\n    \"内容概述\": \"行政机关应当建立健全政府信息发布机制，通过政府公报、政府网站或者其他互联网政务媒体等便于公众知晓的方式公开信息。\"\n  },\n  {\n    \"法规名称\"\
    : \"《关于推进部门所属单位预算公开工作的指导意见》\",\n    \"法规文号\": \"财预〔2021〕27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"\
