name: audit/数据表格类/现金流量表
type: model
description: 从数据表格类类文档（现金流量表）中提取结构化元数据。涵盖字段如：分配股利、利润或偿付利息支付的现金、经营活动产生的现金流量净额、销售商品提供劳务收到的现金。文档范围包括：现金流量表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 现金流量表
  member_count: 1
  member_details:
  - 现金流量表
output:
  fields:
  - name: 分配股利
    type: string
    description: 提取 分配股利 的文本值
  - name: 利润或偿付利息支付的现金
    type: string
    description: 提取 利润或偿付利息支付的现金 的文本值
  - name: 经营活动产生的现金流量净额
    type: string
    description: 提取 经营活动产生的现金流量净额 的文本值
  - name: 销售商品提供劳务收到的现金
    type: string
    description: 提取 销售商品提供劳务收到的现金 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (ABS(利润表.净利润 - 现金流量表.经营活动产生的现金流量净额) / ABS(利润表.净利润)) > 0.5 && (利润表.净利润 / 利润表.营业收入) > 行业平均净利润率*1.3
  description: 以净利润为基准，经营活动现金净流量与净利润的偏差率超过50%，且净利润率显著高于行业平均水平30%以上，表明利润可能缺乏现金流支撑，存在虚构收入或提前确认收入的风险。
  audit_item: 企业财务杜邦分析
  suspicion: 净利润与经营现金流长期背离
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十三条、第二十条\",\n    \"内容概述\": \"会计凭证、会计帐簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定；单位提供的担保、未决诉讼等或有事项，应当按照国家统一的会计制度的规定，在财务会计报告中予以说明。不得以虚假的经济业务事项或者资料进行会计核算。\"\
    \n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n "
- expression: (资产负债表.总资产 / 资产负债表.股东权益) > 行业均值*1.8 && ((资产负债表.短期借款 + 资产负债表.一年内到期的非流动负债) / (利润表.营业利润/4) > 2 || (利润表.营业利润 / (利润表.财务费用-利息支出+0.01))
    < 1)
  description: 权益乘数超过行业均值1.8倍，且短期有息负债（短期借款+一年内到期非流动负债）与季度平均营业利润之比大于2，表明短期偿债压力极大；或利息保障倍数小于1，即营业利润无法覆盖利息支出，面临资金链断裂风险。设定财务费用利息支出加0.01以防止分母为零。
  audit_item: 企业财务杜邦分析
  suspicion: 权益乘数畸高伴随有息负债偿付能力不足
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第17号——借款费用\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"企业发生的借款费用，可直接归属于符合资本化条件的资产的购建或者生产的，应当予以资本化，计入相关资产成本；其他借款费用，应当在发生时根据其发生额确认为费用，计入当期损益。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"主席令第15号（2023年修订）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一"
- expression: (ABS((本年流动比率 - 前两年平均流动比率) / 前两年平均流动比率) > 0.3) || (ABS((本年存货周转率 - 前两年平均存货周转率) / 前两年平均存货周转率) > 0.5 && 利润表.净利润
    < 0) || (ABS((本年应收账款周转率 - 前两年平均应收账款周转率) / 前两年平均应收账款周转率) > 0.4 && (现金流量表.销售商品提供劳务收到的现金 / 利润表.销售收入) < 0.8)
  description: 该表达式用于筛查财务比率在年度间发生剧烈且不合理的波动。第一个条件：流动比率波动超过30%，可能指向粉饰流动性或隐瞒短期债务。第二个条件：在净利润为负的情况下，存货周转率却大幅提升超过50%，可能存在通过大幅降价或虚构销售来消化存货，存在操纵利润嫌疑。第三个条件：应收账款周转率波动超过40%，同时销售回款率低于80%，可能存在虚构收入、虚增利润但资金未实际流入的舞弊风险。
  audit_item: 企业财务比率分析
  suspicion: 财务比率纵向异常波动疑点
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条、第二十六条\",\n    \"内容概述\": \"第九条要求各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计帐簿，编制财务会计报告。第二十六条禁止虚列或者隐瞒收入，推迟或者提前确认收入。\"\n\
    \  },\n  {\n    \"法规名称\": \"企业会计准则第30号——财务报表列报\",\n    \"法规文号\": \"财会[2014]7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : "
- expression: ((利润表.销售收入 - 利润表.销售收入) / 利润表.销售收入 > 0.3) && ((本年(资产负债表.应收账款 + 资产负债表.存货) - 上年(资产负债表.应收账款 + 资产负债表.存货)) / 利润表.销售收入
    < 0.05) && ((现金流量表.销售商品提供劳务收到的现金 / 利润表.销售收入) < 0.7) && (现金流量表.经营活动产生的现金流量净额 / 利润表.净利润 < 0.5)
  description: 该表达式旨在识别收入增长缺乏经营现金流支撑的矛盾现象。当收入增长超过30%，但营运资金（应收+存货）的增量微乎其微（收入增量的5%以下），且销售回款率低于70%，同时经营现金流净额与净利润严重不匹配（比值<0.5）时，高度疑似虚构收入，因为正常的收入增长会相应拉动营运资金和现金流入的增长。
  audit_item: 企业财务比率分析
  suspicion: 关键财务比率间勾稽矛盾疑点
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十八号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计帐簿，编制财务会计报告。任何单位不得以虚假的经济业务事项或者资料进行会计核算。\"\n  }\n]"
