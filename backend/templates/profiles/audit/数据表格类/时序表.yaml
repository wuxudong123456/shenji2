name: audit/数据表格类/时序表
type: model
description: 从数据表格类类文档（时序表）中提取结构化元数据。涵盖字段如：任务覆盖区域、影像时间、用地类型识别结果、计划完成日期、责任单位、高质量发展专项规划的计划完成日期。文档范围包括：卫星影像监测土地利用变化时序表、省级规划编制任务分解时序表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 时序表
  member_count: 1
  member_details:
  - 卫星影像监测土地利用变化时序表
  - 省级规划编制任务分解时序表
output:
  fields:
  - name: 任务覆盖区域
    type: string
    description: 提取 任务覆盖区域 的文本值
  - name: 影像时间
    type: date
    description: 提取 影像时间 的日期值，格式 YYYY-MM-DD
  - name: 用地类型识别结果
    type: boolean
    description: 提取 用地类型识别结果 的布尔值（是/否）
  - name: 计划完成日期
    type: date
    description: 提取 计划完成日期 的日期值，格式 YYYY-MM-DD
  - name: 责任单位
    type: string
    description: 提取 责任单位 的文本值
  - name: 高质量发展专项规划的计划完成日期
    type: date
    description: 提取 高质量发展专项规划的计划完成日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (批复文件 IS NULL) OR (批复文件.批复日期 > 政策文件.规划编制要求截止时间) OR (批复文件.规划覆盖市县列表 不包含 全部应覆盖市县)
  description: 判定规划编制是否存在或逾期。如果省级发展规划文件缺失、批复日期晚于国家政策要求的截止时间，或覆盖区域存在盲区，则视为违规。重点关注“十四五”规划截止节点。
  audit_item: 农村供水工程建设不符合相关规定
  suspicion: 未按规定编制省级农村供水发展规划
  regulation: "[\n  {\n    \"法规名称\": \"《水利部关于做好“十四五”农村供水保障工作的指导意见》\",\n    \"法规文号\": \"水农〔2021〕246号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二部分“明确目标任务”第(三)项\",\n    \"内容概述\": \"要求各省级水行政主管部门组织编制本省农村供水保障“十四五”规划，明确目标任务、建设布局和保障措施，按规定时限报备，不得拖延。\"\
    \n  }\n]"
- expression: (批复文件 IS NULL) OR (批复文件.批复日期 > 规划编制要求截止时间等.规划编制要求截止时间) OR (批复文件.规划内容（是否包含规模化供水比例、水质在线监测、数字化管理等） 不包含 智慧水务指标 AND
    不包含 水质提升量化目标)
  description: 检查是否出台高质量发展专项规划及编制时效。若规划文件缺失、批复超期或内容未对标国家最新要求（如未纳入智慧水务、规模化供水比例、水质在线监测等核心指标），则构成违规。
  audit_item: 农村供水工程建设不符合相关规定
  suspicion: 未按规定编制省级农村供水高质量发展规划
  regulation: "[\n  {\n    \"法规名称\": \"《关于推进农村供水高质量发展的指导意见》\",\n    \"法规文号\": \"水农〔2023〕XXX号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二部分“重点任务”第(一)项\",\n    \"内容概述\": \"要求各省制定农村供水高质量发展专项规划，明确规模化供水工程覆盖率、水质达标率、智慧化管理覆盖率等指标，2024年底前完成批复。\"\n\
    \  }\n]"
- expression: ((核查表.实际用途 != 出让合同.约定土地用途) && (核查表.实际用途 != 许可证.许可土地用途)) && (批复文件.批复文号 IS NULL || 批复文件.批准变更用途 != 核查表.实际用途)
  description: 实际核查用途既不符合土地出让合同约定，也不符合规划许可证许可，且未取得合法的政府批准变更文件，或批准用途与实际用途仍不一致时，判定为违规改变用途。触发条件为合同、规划、实际三者不一致且无有效审批。
  audit_item: 未经批准改变土地用途、性质或容积率
  suspicion: 未经批准擅自改变土地实际用途
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第32号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十六条\",\n    \"内容概述\": \"建设单位使用国有土地应按照合同约定或批准文件的规定使用土地；确需改变土地建设用途的，应经自然资源主管部门同意，并报原批准用地的人民政府批准。\"\n  },\n  {\n\
    \    \"法规名称\": \"中华人民共和国城市房地产管理法\",\n    \"法规文号\": \"主席令第18号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十八条\"\
    ,\n  "
