name: audit/数据表格类/值班表
type: model
description: 从数据表格类类文档（值班表）中提取结构化元数据。涵盖字段如：值班表日期、值班记录连续性、每日开放时段记录、陪餐人员名单。文档范围包括：书屋管理人员值班表、学校负责人陪餐值班表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 值班表
  member_count: 1
  member_details:
  - 书屋管理人员值班表
  - 学校负责人陪餐值班表
output:
  fields:
  - name: 值班表日期
    type: date
    description: 提取 值班表日期 的日期值，格式 YYYY-MM-DD
  - name: 值班记录连续性
    type: string
    description: 提取 值班记录连续性 的文本值
  - name: 每日开放时段记录
    type: string
    description: 提取 每日开放时段记录 的文本值
  - name: 陪餐人员名单
    type: string
    description: 提取 陪餐人员名单 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
