name: audit/数据表格类/公示表
type: model
description: 从数据表格类类文档（公示表）中提取结构化元数据。涵盖字段如：公示日期、受益人姓名、救助方式。文档范围包括：住房救助资格审核公示表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 公示表
  member_count: 1
  member_details:
  - 住房救助资格审核公示表
output:
  fields:
  - name: 公示日期
    type: date
    description: 提取 公示日期 的日期值，格式 YYYY-MM-DD
  - name: 受益人姓名
    type: string
    description: 提取 受益人姓名 的文本值
  - name: 救助方式
    type: string
    description: 提取 救助方式 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (数据表.房产登记信息（私有房产套数、人均面积） == 0 || 数据表.房产登记信息（私有房产套数、人均面积） < 当地住房困难面积标准) && 在保人员姓名、身份证号、保障人口数、享受低保的老年人、残疾人名单、在保人员身份标识（身份证号）、家庭人口数、年龄、就业状态标记.就业状态标记
    == '在保' && 受益人姓名、救助方式（公租房/补贴/危房改造）、公示日期.受益人姓名 == null
  description: 筛查'应救未救'疑点。当低保家庭在房产系统中显示'无房'或'人均面积低于困难标准'，却从未出现在住房救助的任何公示或审批名单中时，判定为疑似遗漏救助。若叠加投诉台账中有相关投诉，则风险等级进一步提升。
  audit_item: 未按规定对城乡困难群体给予相应社会救助
  suspicion: 住房困难低保家庭未获住房救助
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十八条、第三十九条\",\n    \"内容概述\": \"国家对符合规定标准的住房困难的最低生活保障家庭、分散供养的特困人员，给予住房救助。住房救助通过配租公共租赁住房、发放住房租赁补贴、农村危房改造等方式实施。\"\n  }\n\
    ]"
