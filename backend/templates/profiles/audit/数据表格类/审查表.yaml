name: audit/数据表格类/审查表
type: model
description: 从数据表格类类文档（审查表）中提取结构化元数据。涵盖字段如：供应商名称、信用代码、受让方名称、合规审查结论、审查人、审查日期、审查结论、最终控制人国籍。文档范围包括：供应商资质审查表、外资受让方资质及交易领域合规性审查表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 审查表
  member_count: 1
  member_details:
  - 供应商资质审查表
  - 外资受让方资质及交易领域合规性审查表
output:
  fields:
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 信用代码
    type: string
    description: 提取 信用代码 的文本值
  - name: 受让方名称
    type: string
    description: 提取 受让方名称 的文本值
  - name: 合规审查结论
    type: string
    description: 提取 合规审查结论 的文本值
  - name: 审查人
    type: string
    description: 提取 审查人 的文本值
  - name: 审查日期
    type: date
    description: 提取 审查日期 的日期值，格式 YYYY-MM-DD
  - name: 审查结论
    type: string
    description: 提取 审查结论 的文本值
  - name: 最终控制人国籍
    type: string
    description: 提取 最终控制人国籍 的文本值
  - name: 标的企业所属行业代码
    type: string
    description: 提取 标的企业所属行业代码 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ( 受让方名称、最终控制人国籍、标的企业所属行业代码、合规审查结论.标的企业所属行业代码 IN (禁止投资领域条目、限制投资领域及股比限制.禁止投资领域条目) ) && ( 禁止投资领域条目、限制投资领域及股比限制.特殊审批文件文号
    IS NULL || 禁止投资领域条目、限制投资领域及股比限制.特殊审批文件文号 == '' )
  description: 该表达式检测外资受让方是否违规进入禁止类投资领域。首先，将交易标的所属行业代码与国务院发布的最新版《外商投资准入特别管理措施（负面清单）》中的禁止类行业代码进行精确比对。若匹配，则核查企业是否持有国务院等相关最高权限机构的特批文件。若无任何审批文件，直接定性为严重违规。对于限制类领域，则需进一步验证是否有审批，且外资股比是否超出限制。
  audit_item: 违规处置重大资产
  suspicion: 违规向外资方转让禁止领域资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国外商投资法\",\n    \"法规文号\": \"主席令第26号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
