    \   "
- expression: (经办人员操作日志表.操作类型 = '修改' && 操作内容 LIKE '%缴存基数%' || 操作内容 LIKE '%缴存月数%') && (操作时间.HOUR NOT BETWEEN 6 AND 20 || 操作时间
    属于 非工作日) && (SELECT 贷款金额 FROM 住房公积金贷款申请清单 WHERE 审批人ID = 操作员ID) > 同类贷款平均金额 * 1.5) || (存在 经办人员银行账户流水.对方账户 与 住房公积金贷款申请清单.申请人ID
    关联的资金记录)
  description: 一是信贷经办人员或系统管理员在非工作时间或节假日修改关键缴存字段，且经手审批的贷款金额明显高于平均水平；二是经办人员个人账户与贷款申请人之间存在异常资金往来。上述任一条件成立，即构成内外勾结骗贷重大疑点。
  audit_item: 骗取套取住房公积金贷款
