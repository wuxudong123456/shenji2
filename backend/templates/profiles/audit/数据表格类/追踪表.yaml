name: audit/数据表格类/追踪表
type: model
description: 从数据表格类类文档（追踪表）中提取结构化元数据。涵盖字段如：交易金额、付款方、付款账户、代偿资金去向、借款人账户流水、变更人、变更前指标值、变更后指标值。文档范围包括：住房公积金资金流向追踪表、刷单行为关联资金流水追踪表、募集资金使用情况追踪表、审计期间异常资金流水追踪表、小额信贷资金流向追踪表、撤并学校学生分流情况追踪表、撤并学校学生辍学情况追踪表、整改落实情况追踪表、绩效目标指标值变更追踪表、财政结转资金使用周期追踪表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 付款
- 整改
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 追踪表
  member_count: 1
  member_details:
  - 住房公积金资金流向追踪表
  - 刷单行为关联资金流水追踪表
  - 募集资金使用情况追踪表
  - 审计期间异常资金流水追踪表
  - 小额信贷资金流向追踪表
  - 撤并学校学生分流情况追踪表
  - 撤并学校学生辍学情况追踪表
  - 整改落实情况追踪表
  - 绩效目标指标值变更追踪表
  - 财政结转资金使用周期追踪表
  - 贷款资金流向追踪表
  - 资金流向追踪表
  - 银行账户资金流向追踪表
output:
  fields:
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款方
    type: number
    description: 提取 付款方 的数值（含单位，如万元、吨等）
  - name: 付款账户
    type: number
    description: 提取 付款账户 的数值（含单位，如万元、吨等）
  - name: 代偿资金去向
    type: string
    description: 提取 代偿资金去向 的文本值
  - name: 借款人账户流水
    type: number
    description: 提取 借款人账户流水 的数值（含单位，如万元、吨等）
  - name: 变更人
    type: string
    description: 提取 变更人 的文本值
  - name: 变更前指标值
    type: string
    description: 提取 变更前指标值 的文本值
