violations:
- expression: 公务接待管理制度文件 IS NULL OR 公务接待管理制度文件.接待标准条款 IS NULL OR 公务接待管理制度文件.审批权限条款 IS NULL OR 公务接待管理制度文件.禁止事项条款 IS NULL
  description: 制度文件缺失，或制度中未包含接待标准、审批流程、禁止事项等核心条款，即判定为制度不健全。
  audit_item: 公务接待管理不符合规定
  suspicion: 公务接待管理制度不健全
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第四条、第五条\",\n    \"内容概述\": \"各级党政机关应当建立健全公务接待管理制度，明确接待范围、标准、审批程序、经费管理、监督检查等内容。\"\n  }\n]"
- expression: (亲属投资入股企业清单.投资企业名称 IN (供应商/客户名录.企业名称)) && (明细表.交易对手方 == 亲属投资入股企业清单.投资企业名称) && (明细表.交易金额 > 5000000 || ABS(明细表.单价-明细表.同期其他供应商报价)/明细表.同期其他供应商报价
    > 0.1)
  description: 筛查领导人员亲属投资入股企业与本单位发生业务往来的情况，当累计交易金额超过500万元或单笔交易价格偏离市场价10%以上时触发预警。阈值可根据企业规模及行业水平调整。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 特定关系人在关联企业或业务往来企业投资入股
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第一项\",\n    \"内容概述\": \"国有企业领导人员不得在本企业的关联企业、与本企业有业务关系的企业投资入股。\"\n  }\n]"
- expression: (年终自评报告中的目标值 != 年初申报表中的目标值) AND (对应的绩效目标调整申请及批复记录 IS NULL OR 批复结果为未批准)
  description: 若任何一项绩效指标的目标值在年末自评报告或执行文件中与年初申报值不一致，且找不到合法合规的审批记录（包括内部决策和财政批复），即判定为擅自调整。调整包括降低指标值、删除指标、新增指标等。
  audit_item: 部门、单位预算绩效目标下达或调整不合规
  suspicion: 未经批准自行调整预算绩效目标
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第四条第（十）款\",\n    \"内容概述\": \"预算执行中，各部门各单位应对绩效目标实现程度和预算执行进度实行‘双监控’，确需调整预算和绩效目标的，应按程序报批。\"\n  },\n  {\n\
    \    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\",\n\
    \    \"内容"
- expression: 追踪表.每笔支出金额 > 0 && (追踪表.对应项目 != 说明书.原定投资项目名称) && (无相应股东会/董事会关于变更用途的决议 || 会议纪要.变更资金用途的决议日期 > 追踪表.支出日期)
  description: 当募集资金实际用于非说明书载明项目，且未履行变更审批程序或先支出后补程序，即构成擅自改变募集资金用途。
  audit_item: 资金管理方面存在的问题
  suspicion: 擅自改变募集资金用途
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国证券法\",\n    \"法规文号\": \"主席令第37号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百八十五条\"\
    ,\n    \"内容概述\": \"发行人擅自改变公开发行证券所募集资金的用途的，责令改正，处以罚款；相关责任人员给予警告并处罚款。\"\n  }\n]"
- expression: (担保台账.实际代偿金额 > 担保份额条款.担保比例 * 1.05) && (担保台账.已追偿金额 == 0 || 担保台账.已追偿金额 < 50%)
  description: 实际代偿金额超过合同约定应承担份额的105%（容差5%）且未向其他共同担保人追偿或追偿率显著过低（低于50%），表明未按保证份额承担责任，可能存在怠于追偿或变相承担超额责任。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 未按保证份额承担担保责任
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"六、严格追究违规担保责任\",\n    \"内容概述\": \"对因违规担保造成资产损失或未按规定承担担保责任、代偿后未及时追偿造成损失的，要严肃追究相关责任人责任。\"\n  }\n]"
- expression: (匹配表.签收状态 = NULL) OR (分析表.同一IP当日下单数 > 10 OR 分析表.同一收货地址当月下单数 > 50) OR (追踪表.资金闭环标记 = FALSE) OR (内控制度.是否建立IP监控
    = FALSE OR 承诺书.承诺书签署状态 = '未签署')
  description: 物流信息缺失率超过30%表明存在空包刷单嫌疑；同一IP短期内大量下单或同一地址异常集中下单，反映批量虚假交易特征；退款资金回流至卖方账户是自买自退的典型标志；企业缺少反刷单内控或未签署真实性承诺，表明主观放任。以上条件满足任意一条均触发疑点。
  audit_item: 农村电子商务发展不到位
  suspicion: 电商企业虚构交易刷单造假销售数据
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电子商务法\",\n    \"法规文号\": \"主席令第7号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十七条\",\n    \"内容概述\": \"电子商务经营者不得以虚构交易、编造用户评价等方式进行虚假或者引人误解的商业宣传，欺骗、误导消费者。\"\n  }\n]"
- expression: 审批台账.借款人姓名 LIKE '%自然人%' && (检查报告.实际资金用途描述 = '企业') && (检查报告.实际资金用途描述 NOT IN (名录.企业名称)) OR (名录.企业名称 IN (审批台账.借款人姓名)
    >= 5)
  description: 当满足以下条件之一时触发：1. 贷款申请人为农户个体，但资金经过其账户后最终转入了某企业账户，且该企业不在官方认定的帮扶企业名录中；2. 或是虽然企业在名录内，但出现了同一个小额信贷企业账户短期内收到超过5名及以上不同借款农户转账的情况，疑似集中归集农户贷款。
  audit_item: 帮扶产业配套支持政策不够精准有效
  suspicion: 小额信贷资金“户贷企用”违规使用
  regulation: "[\n  {\n    \"法规名称\": \"关于深入扎实做好过渡期脱贫人口小额信贷工作的通知\",\n    \"法规文号\": \"银保监发〔2021〕6号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"脱贫人口小额信贷要坚持户借、户用、户还，精准用于贷款户发展生产和开展经营。……坚决杜绝“户贷企用”等违规行为。\"\n  }\n]"
- expression: (审批记录.提取金额 / 明细台账.拨付金额) > 管理办法.管理费提取比例上限 || 审批记录.审批人签字 IS NULL || (明细表.支出用途 NOT IN 管理办法.允许支出范围 AND 明细表.支出金额
    / 审批记录.提取金额 > 0.3)
  description: 判定条件一：提取比例超过制度规定的上限（例如常见标准为5%或2%），直接判定违规；条件二：提取管理费无有效审批记录，构成擅自提取；条件三：管理费支出中与项目无关的开支（如招待费、福利费、购车）占比超过30%，视为名义上提管理费实为截留挪用的高风险特征。满足任一条件即标记为疑点。
  audit_item: 截留挪用涉农财政专项资金
  suspicion: 违规超比例或虚构名目提取涉农专项资金管理费
  regulation: "[\n  {\n    \"法规名称\": \"农业专项转移支付资金管理办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第X条（示例：关于管理费提取比例和用途的规定）\"\
    ,\n    \"内容概述\": \"涉农专项资金管理费提取不得超过规定比例，必须经过审批，专项用于项目管理相关支出，严禁用于人员经费、福利、购置车辆等与项目无关的支出。\"\n  }\n]"
- expression: 财政结转资金使用周期追踪表.首次结转日期 <= DATE_SUB(CURDATE(), INTERVAL 730 DAY) && (财政结转资金使用周期追踪表.最近支出日期 IS NULL || 财政结转资金使用周期追踪表.最近支出日期
    < DATE_SUB(CURDATE(), INTERVAL 730 DAY))
  description: 结转资金首次结转日期距当前已超过2年，且最近一次支出日期为空或也在2年前，表明该笔结转资金已连续24个月未动用。
  audit_item: 保障性安居工程财政资金长期闲置未用
  suspicion: 结转资金连续24个月以上未动用
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十二条\",\n    \"内容概述\": \"连续两年未用完的结转资金，应当作为结余资金管理，由同级财政收回统筹使用。\"\n  },\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程补助资金管理办法\"\
    ,\n    \"法规文号\": \"财综〔2022〕37号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"对年度执行中形成的闲置资金，应当及时清理收回。\""
- expression: (追踪表.资金去向类别 IS NULL OR 追踪表.资金去向类别 NOT IN ('提取','贷款','购买国债','上划上级')) AND (追踪表.收款方名称 IN (登记表.关联方名称) OR 付款账户.交易摘要
    NOT LIKE '%提取%' AND NOT LIKE '%贷款%' AND NOT LIKE '%国债%' AND NOT LIKE '%上划%') AND 付款账户.交易金额 > 100000
  description: 筛查资金去向不明或收款方为非业务合作对象且与关联方有关的支出，排除因上划上级、购买国债等合规用途。设定大额阈值10万元作为初步疑点，小额可疑需结合频次分析。
  audit_item: 挪用住房公积金
  suspicion: 直接挪用住房公积金至非业务关联账户
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十一条\",\n    \"内容概述\": \"住房公积金管理中心违反本条例规定，挪用住房公积金的，追回挪用的住房公积金；有违法所得的，没收违法所得，并入住房公积金；构成犯罪的，依法追究刑事责任；尚不构成犯罪的，对直接负责的主管人员和其他直接责任人员依法给予行政处分。\"\
    \n  }\n]"
- expression: (支出事由 LIKE '%采购%' OR 支出事由 LIKE '%工程%' OR 支出事由 LIKE '%设备%') AND (流程记录.验收记录 IS NULL OR 发票验真结果 = '虚假' OR ABS(流程记录.合同金额
    - 发票金额) / 流程记录.合同金额 > 0.05) AND 收款方与供应商名称一致
  description: 筛选因采购或工程发生的公积金支出，但合同未验收、发票虚假或金额偏差超5%的记录，识别虚构交易套取资金。
  audit_item: 挪用住房公积金
  suspicion: 虚构采购合同套取住房公积金资金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十一条\",\n    \"内容概述\": \"挪用住房公积金的，追回挪用的住房公积金；有违法所得的，没收违法所得；构成犯罪的，依法追究刑事责任；尚不构成犯罪的，给予行政处分。\"\n  }\n]"
- expression: (ABS(购房合同备案信息表.成交价格 - 房屋市场评估报告.评估价值) / 房屋市场评估报告.评估价值 > 0.2) && (贷款资金流向追踪表.收款账户 != 购房合同备案信息表.卖方账户 || 贷款资金流向追踪表.资金最终流向
    关联 购房合同备案信息表.购房人账户) || (SELECT COUNT(*) FROM 购房合同备案信息表 WHERE 房屋地址 = 本房屋地址) > 1
  description: 一是合同成交价格虚高，超出评估价20%以上，且贷款资金未按约定支付给卖方或最终回流至借款人关联账户；二是同一房屋地址在备案信息中有多条记录，涉嫌一房多贷。满足任一条件即为违规疑点。
  audit_item: 骗取套取住房公积金贷款
