name: audit/数据表格类/编制表
type: model
description: 从数据表格类类文档（编制表）中提取结构化元数据。涵盖字段如：单位名称、同等条件人员平均工资、在职总人数、是否考虑上年结转、本年申请预算金额、项目名称、预算团组编号、预算金额。文档范围包括：人员编制表、本年度因公出国（境）经费预算编制表、机关/事业单位/国有企业人员编制表、部门年度预算编制表（含项目支出）等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 薪酬
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 编制表
  member_count: 1
  member_details:
  - 人员编制表
  - 本年度因公出国（境）经费预算编制表
  - 机关/事业单位/国有企业人员编制表
  - 部门年度预算编制表（含项目支出）
output:
  fields:
  - name: 单位名称
    type: string
    description: 提取 单位名称 的文本值
  - name: 同等条件人员平均工资
    type: string
    description: 提取 同等条件人员平均工资 的文本值
  - name: 在职总人数
    type: number
    description: 提取 在职总人数 的数值（含单位，如万元、吨等）
  - name: 是否考虑上年结转
    type: boolean
    description: 提取 是否考虑上年结转 的布尔值（是/否）
  - name: 本年申请预算金额
    type: number
    description: 提取 本年申请预算金额 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 预算团组编号
    type: number
    description: 提取 预算团组编号 的数值（含单位，如万元、吨等）
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 预算项目名称
    type: number
    description: 提取 预算项目名称 的数值（含单位，如万元、吨等）
  - name: 预算项目编码
    type: number
    description: 提取 预算项目编码 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (预算编制表.预算团组编号 NOT IN (SELECT 团组明细表.实际团组编号 FROM 团组明细表 WHERE 团组明细表.出访任务 NOT LIKE '%取消%')) OR (费用报销明细表.报销团组编号 IS
    NOT NULL AND 费用报销明细表.报销团组编号 NOT IN (SELECT 预算编制表.预算团组编号 FROM 预算编制表) AND 费用报销明细表.报销团组编号 NOT IN (SELECT 预算调整审批表.调整团组编号 FROM
    预算调整审批表 WHERE 预算调整审批表.审批状态 = '已批准'))
  description: 此表达式用于筛查两类违规：1. 预算编制表中已列支预算的团组，在团组明细表中缺失，疑为虚假预算或预算未执行，需核实原因；2. 费用报销明细表中存在实际发生的团组报销，但该团组既不在年初预算表也不在预算调整审批表中，直接判定为“未纳入预算管理”。紧急任务等特殊情况需结合批复文件人工复核。
  audit_item: 未按规定编制因公出国（境）经费预算
  suspicion: 因公出国（境）团组未纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"《党政机关厉行节约反对浪费条例》\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"党政机关应当建立健全并严格执行国内差旅内部审批制度，从严控制国内差旅人数和天数，严禁无明确公务目的的差旅活动，严禁以公务差旅为名变相旅游，严禁异地部门间无实质内容的学习交流和考察调研。\"\
    \n  },\n  {\n    \"法规名称\": \"《因公临时出国经费管理办法》\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n  "
- expression: 对应团组编号.会计科目代码 NOT LIKE '出国经费类编码%' AND (对应团组编号.摘要 LIKE '%出国%' OR 对应团组编号.摘要 LIKE '%境外%' OR 对应团组编号.摘要 LIKE '%国际%'
    OR 对应团组编号.对应团组编号 IS NOT NULL) AND 对应团组编号.会计科目代码 NOT IN (SELECT 预算项目名称（通常为出国费类款项） FROM 预算项目名称（通常为出国费类款项） WHERE 预算项目名称 LIKE
    '%出国%')
  description: 设定出国经费类科目编码前缀（如30212），筛查摘要明确含有出国、境外等字段，或明确关联了出国团组编号的报销记录。当这些报销记录的会计科目并非出国经费专用科目，且该科目也不在年初预算的出国经费项目列表中时，判定为在非预算渠道列支。需关注通过‘培训费’、‘其他商品和服务支出’、‘项目支出’等科目列支的情况。
  audit_item: 未按规定编制因公出国（境）经费预算
  suspicion: 使用非出国经费专用科目列支出国费用
  regulation: "[\n  {\n    \"法规名称\": \"《因公临时出国经费管理办法》\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"因公临时出国经费应当全部纳入预算管理，不得超预算或无预算安排团组出访。各单位应当加强因公临时出国经费的预算管理，严格控制因公临时出国经费总额。\"\n  },\n  {\n\
    \    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十二条\",\n\
    \    \"内容"
- expression: 结转结余资金统计明细表.结转金额 > 0 && 部门年度预算编制表.对应项目申请金额 > 0 && (部门年度预算编制表.对应项目申请金额 + 结转结余资金统计明细表.结转金额) > 财政拨款收入支出对比表.对应项目本年预算数
    * 1.5
  description: 当上年度存在结转结余资金的项目，本年度继续申请预算，且申请金额与结转资金之和显著超过项目合理预算需求（超过本年预算数150%），视为未充分预计结转资金、重复申请预算，可能造成资金闲置。需结合预算编制制度中是否要求先抵扣结转再申请。
  audit_item: 预算编制不科学
  suspicion: 未充分预计结转资金重复申请预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"各部门、各单位应当按照规定编制本部门、本单位预算草案，参考上一年预算执行情况、有关支出绩效评价结果和本年度收支预测，确保预算编制科学准确。\"\n  },\n  {\n   \
    \ \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十三条\",\n    \"\
    内容概述\""
- expression: 统计表.接收退役士兵数 / 单位名称在职总人数.在职总人数 < 规定接收比例.规定接收比例
  description: 将接收退役士兵数除以单位在职总人数，与地方政策规定的最低接收比例（如不低于1%）比较，若低于则为违规。
  audit_item: 未按规定落实退役士兵安置政策
  suspicion: 接收退役士兵占在职人数比例低于政策标准
  regulation: "[\n  {\n    \"法规名称\": \"退役士兵安置条例\",\n    \"法规文号\": \"国务院、中央军委令第608号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十三条\",\n    \"内容概述\": \"安置地县级以上地方人民政府应当按照属地管理的原则，对符合安排工作条件的退役士兵进行安置，保障其第一次就业。地方可根据实际情况制定具体接收比例。\"\n  },\n  {\n \
    \   \"法规名称\": \"地方退役士兵安置实施细则\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"相关接收比例条款\",\n    \"内容概述\"\
    : \"明确规定"
- expression: (从统计表.安置介绍信开出日期次月起至上岗前，生活费发放记录为空) || (发放表.生活费金额 < 编制表.同等条件人员平均工资 × 80%)
  description: 根据《退役士兵安置条例》，非因退役士兵本人原因未上岗的，接收单位应从安置介绍信开出当月起，按不低于本单位同等条件人员平均工资80%的标准逐月发放生活费。若未发放或发放标准低于80%，构成违规。
  audit_item: 未按规定落实退役士兵安置政策
  suspicion: 未向未安排上岗退役士兵发放生活费或发放标准不足
  regulation: "[\n  {\n    \"法规名称\": \"退役士兵安置条例\",\n    \"法规文号\": \"国务院、中央军委令第608号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"非因退役士兵本人原因，接收单位未按照规定安排上岗的，应当从安置部门开出介绍信的当月起，按照不低于本单位同等条件人员平均工资80%的标准，逐月发给生活费直至上岗为止。\"\n \
    \ }\n]"
