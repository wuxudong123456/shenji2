name: audit/数据表格类/安排表
type: model
description: 从数据表格类类文档（安排表）中提取结构化元数据。涵盖字段如：封存完成截止日期、建档完成截止日期、计划完成日期、里程碑节点、队伍建设完成截止日期、阶段目标。文档范围包括：分阶段禁捕目标的时间节点安排表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 安排表
  member_count: 1
  member_details:
  - 分阶段禁捕目标的时间节点安排表
output:
  fields:
  - name: 封存完成截止日期
    type: date
    description: 提取 封存完成截止日期 的日期值，格式 YYYY-MM-DD
  - name: 建档完成截止日期
    type: date
    description: 提取 建档完成截止日期 的日期值，格式 YYYY-MM-DD
  - name: 计划完成日期
    type: date
    description: 提取 计划完成日期 的日期值，格式 YYYY-MM-DD
  - name: 里程碑节点
    type: string
    description: 提取 里程碑节点 的文本值
  - name: 队伍建设完成截止日期
    type: date
    description: 提取 队伍建设完成截止日期 的日期值，格式 YYYY-MM-DD
  - name: 阶段目标
    type: string
    description: 提取 阶段目标 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: DATEDIFF(禁捕工作月度进度统计表.实际完成日期, 分阶段禁捕目标的时间节点安排表.计划完成日期, 'day') > 90
  description: 对比各阶段任务的实际完成日期与计划完成日期，若滞后天数超过90天，则判定为重大滞后。已审批的合理延期天数可从滞后天数中扣除，但延期申请需经上级部门批复同意。
  audit_item: 任务目标未按时完成
  suspicion: 分阶段禁捕任务推进滞后
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加强长江水生生物保护工作的意见\",\n    \"法规文号\": \"国办发〔2018〕95号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三部分“实施重点水域禁捕”\",\n    \"内容概述\": \"要求2019年底前完成水生生物保护区渔民退捕，2020年底前完成长江干流和重要支流除保护区以外水域的渔民退捕，各地需严格按时间节点推进禁捕工作。\"\
    \n  }\n]"
- expression: (NVL(禁捕工作月度进度统计表.实际完成日期, '2099-12-31') - 分阶段禁捕目标的时间节点安排表.计划完成日期) > 0 && 延期申请或未完成情况说明文件.有效延期批复 IS NULL && 禁捕工作月度进度统计表.完成比例
    < 100
  description: 实际完成日期晚于计划完成日期，且无上级批准的延期文件，同时阶段完成比例未达100%，判定为推进滞后。超期3个月以上为严重滞后。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 分阶段实现长江全面禁捕工作推进慢
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"无明确条款\",\n    \"内容概述\": \"要求各地倒排工期、挂图作战，确保按期完成各阶段禁捕目标任务，对进度滞后的予以通报督办。\"\n  }\n]"
- expression: NVL(退捕渔民信息登记台账.已建档数量, 0) / 退捕渔民建档立卡工作制度.应建档总数 < 1.0 && SYSDATE > 分阶段禁捕目标的时间节点安排表.建档完成截止日期 && 延期申请或未完成情况说明文件.有效延期批复
    IS NULL
  description: 截至规定截止日期，实际建档数量未达到应建档总数，且无经批准的延期手续，即构成未按时完成。若建档率低于90%或虚假建档（如身份证重复率>0.5%），判定为严重违规。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 未按时完成退捕渔民建档立卡工作
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"无明确条款\",\n    \"内容概述\": \"要求抓紧完成退捕渔民建档立卡工作，确保信息准确完整，为后续补偿和安置提供依据。\"\n  }\n]"
- expression: NVL(渔船登记注销明细表.已封存数量, 0) / 捕捞渔船封存管理实施细则.应封存渔船总数 < 1.0 && SYSDATE > 分阶段禁捕目标的时间节点安排表.封存完成截止日期 && 延期申请或未完成情况说明文件.有效延期批复
    IS NULL
  description: 截至规定截止日期，实际封存渔船数量未达到应封存总数，且无有效延期审批，即构成未按时完成封存。封存率低于90%或存在虚假封存（如GPS坐标重复、AIS轨迹移动）视为严重违规。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 未按时完成捕捞渔船全部封存
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农办渔〔2020〕8号\"\
    ,\n    \"效力级别\": \"部门规范性文件\",\n    \"条款号\": \"无明确条款\",\n    \"内容概述\": \"要求各地按照“一船一策”原则，限期完成捕捞渔船的回收拆解、封存或转用，严禁渔船在禁捕水域作业。\"\
    \n  }\n]"
- expression: (NVL(执法人员资质审核备案表.实际在岗人数, 0) < 专业执法队伍建设专项方案.计划编制人数 || NVL(执法装备采购验收单据.装备采购数量, 0) < 专业执法队伍建设专项方案.装备配置标准) && SYSDATE
    > 分阶段禁捕目标的时间节点安排表.队伍建设完成截止日期 && 延期申请或未完成情况说明文件.有效延期批复 IS NULL
  description: 在规划的截止日期，实际在岗执法人员数量或已验收合格的关键装备数量未达到专项方案要求，且无有效延期批复，即构成未按时建成。持证率低于80%或装备到位率低于70%为严重未达标。
  audit_item: 任务目标未按时完成（长江禁捕）
  suspicion: 未按时建成专业执法队伍
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实做好长江流域禁捕有关工作的通知\",\n    \"法规文号\": \"国办发明电〔2020〕21号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"无明确条款\",\n    \"内容概述\": \"要求加快组建专业化的渔政执法队伍，配齐执法船艇、无人机等装备，确保禁捕水域执法力量全覆盖。\"\n  }\n]"
