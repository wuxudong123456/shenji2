    description: 提取 合并范围子公司 的文本值
  - name: 在建工程
    type: string
    description: 提取 在建工程 的文本值
  - name: 子公司资产总额
    type: number
    description: 提取 子公司资产总额 的数值（含单位，如万元、吨等）
  - name: 应付账款
    type: number
    description: 提取 应付账款 的数值（含单位，如万元、吨等）
  - name: 影响金额
