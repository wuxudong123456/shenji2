  - name: 未纳入合并范围的被投资单位清单及原因说明
    type: string
    description: 提取 未纳入合并范围的被投资单位清单及原因说明 的文本值
  - name: 流动负债
    type: string
    description: 提取 流动负债 的文本值
  - name: 经营现金流
    type: string
    description: 提取 经营现金流 的文本值
  - name: 营业收入
    type: number
    description: 提取 营业收入 的数值（含单位，如万元、吨等）
  - name: 负债总额
    type: number
    description: 提取 负债总额 的数值（含单位，如万元、吨等）
  - name: 货币资金余额
    type: number
    description: 提取 货币资金余额 的数值（含单位，如万元、吨等）
  - name: 资产负债率
    type: string
    description: 提取 资产负债率 的文本值
  - name: 附注金额单位
    type: number
    description: 提取 附注金额单位 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ABS(科目余额表.累计折旧本期发生额 - 按上期折旧方法模拟计提的累计折旧本期发生额) / 利润总额 > 0.05 && (董事会决议 IS NULL || 董事会决议.批准日期 > 企业会计政策文件.变更生效日期)
    && 财务报表附注.会计政策变更说明 NOT LIKE '%折旧方法变更%'
  description: 当企业本期折旧方法与上期不一致，且新旧方法下折旧费用差异对利润总额的影响超过5%，同时未取得董事会有效审批或审批滞后，且财务报告附注未披露变更内容及影响金额时，触发违规疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意改变固定资产折旧方法调节利润
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业进行会计核算不得随意改变资产、负债、所有者权益的确认标准或者计量方法，虚列、多列、不列或者少列资产、负债、所有者权益。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\"\
    ,\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第十五条\",\n    \"内"
- expression: 企业会计政策文件.收入确认标准(本期) != 企业会计政策文件.收入确认标准(上期) && 营业收入明细表.本期收入增长率 > 行业平均增长率*1.5 && (董事会决议 IS NULL || 董事会决议.批准日期
    > 收入确认标准变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE '%收入确认标准变更%'
  description: 当本期收入确认标准较上期发生改变（如由客户签收改为发货确认），且收入增长率远超行业水平，同时缺少董事会审批或审批滞后，未在附注中披露收入确认标准变更详情时，视为违规。
  audit_item: 随意变更会计处理方法
  suspicion: 随意改变收入确认标准虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业不得随意改变收入确认时间，虚列或者隐瞒收入，编制虚假利润。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"\
    财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条、第六条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。会"
- expression: 企业会计政策文件.存货计价方法(本期) != 企业会计政策文件.存货计价方法(上期) && ABS(主营业务成本明细表.本期销售成本 - 按上期方法计算的销售成本) / 利润总额 > 0.05 && (董事会决议 IS
    NULL || 董事会决议.批准日期 > 变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE '%存货计价方法变更%'
  description: 当企业本期存货计价方法改变，且对销售成本的影响超过利润总额5%，同时无董事会审批或审批滞后，且未在附注中披露时，触发疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意变更存货计价方法调节销售成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业不得随意改变费用、成本的确认标准或者计量方法，导致多列、少列成本。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\"\
    : \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条、第二十二条\",\n    \"内容概述\": \"企业应当采用先进先出法、加权平均法或者个别计价法确定发出存货的实"
- expression: 坏账准备计提明细表.本期平均计提比例(按账龄加权) != 上期平均计提比例 && (董事会决议 IS NULL || 董事会决议.批准日期 > 变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE
    '%坏账准备计提比例变更%' && ABS(本期计提金额 - 按上期比例测算的计提金额) / 利润总额 > 0.05
  description: 若坏账准备计提比例发生变动，且影响利润总额超过5%，同时无董事会审批或审批滞后，未在附注中披露时，判定为违规。
  audit_item: 随意变更会计处理方法
  suspicion: 随意变更坏账准备计提比例且未披露
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业不得随意改变费用的确认标准或者计量方法，虚列或者少列费用。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\"\
    : \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条、第四十七条\",\n    \"内容概述\": \"企业应当以预期信用损失为基础计提坏账准备，会计政策变更"
- expression: 企业会计政策文件.研发支出资本化条件(本期) != 上期资本化条件 && (研发支出辅助账.本期资本化金额增长率 > 同期研发投入增长率*2) && (董事会决议 IS NULL || 董事会决议.批准日期 > 政策变更生效日期)
    && 财务报表附注.会计政策变更说明 NOT LIKE '%研发支出资本化政策变更%'
  description: 若本期研发支出资本化条件放宽，导致资本化金额异常增长，且缺少董事会审批或审批滞后，未在附注中披露，则触发疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意调整研发费用资本化政策虚增资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"不得随意改变费用的确认标准或者计量方法，导致虚增资产、虚减费用。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第6号——无形资产\",\n    \"法规文号\": \"\
    财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条、第八条、第九条\",\n    \"内容概述\": \"企业内部研发项目研究阶段支出应当费用化，开发阶段支出满足条件方可资本化"
- expression: (应付账款账龄.应付账款账龄 > 365 AND 应付账款账龄.应付金额 > 0) AND ((货币资金余额.货币资金余额 + 货币资金余额.交易性金融资产) / 货币资金余额.流动负债 > 1)
  description: 筛选账龄超过1年的应付账款，同时计算大型企业的现金比率。若现金比率大于1，说明企业具有较强的即期支付能力，此时仍长期拖欠中小企业款项，高度指向利用优势地位恶意拖欠。
  audit_item: 违规收费-拖欠工程款和农民工工资
  suspicion: 大型企业利用优势地位长期拖欠中小企业账款
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"大型企业从中小企业采购货物、工程、服务，应当合理约定付款期限并及时支付款项，不得利用优势地位强迫中小企业接受不合理的付款期限、方式或变相延长付款期限。\"\n  }\n]"
- expression: 业务台账.持股比例 > 0 && 业务台账.持股比例 < 100% && (业务台账.担保金额 / 计算表.被担保企业净资产) > 业务台账.持股比例 && (业务台账.是否有反担保标识 != '是')
  description: 对参股企业提供的担保金额与其净资产的比值超过公司持股比例，且未要求其他股东按股权比例共同提供担保，也未取得被担保方相应的反担保，即判定为超股权比例违规担保。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 对参股企业提供担保超出持股比例
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"中央企业应当严格按照持股比例对子公司和参股企业提供担保。严禁对参股企业超股比担保。\"\n  },\n  {\n    \"法规名称\": \"关于规范上市公司对外担保行为的通知\"\
    ,\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"上市公司对外担保必须经董"
- expression: (合并范围内子公司名单、未纳入合并范围的被投资单位清单及原因说明.包含(子公司) && 持股比例、表决权比例、重大事项决策条款（如一致同意、否决权）.持股比例 >= 0.5 && (持股比例、表决权比例、重大事项决策条款（如一致同意、否决权）.重大事项决策条款（如一致同意、否决权）
    = '全体股东一致同意' || 实际控制权评估文件.母公司委派董事人数 < 0.5))
  description: 持股比例≥50%视为名义控制，但需结合董事会席位和决策条款判断实质控制。若章程规定重大经营决策需全体股东一致同意或母公司委派董事未过半数，则母公司无法单方面控制，不应合并。触发条件：上述条件同时满足。
  audit_item: 未按规定编制合并财务报表
  suspicion: 将无实际控制权的公司纳入合并范围
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第33号——合并财务报表\",\n    \"法规文号\": \"财会〔2014〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第七条、第八条\",\n    \"内容概述\": \"合并财务报表的合并范围应当以控制为基础予以确定。控制是指投资方拥有对被投资方的权力，通过参与被投资方的相关活动而享有可变回报，并且有能力运用对被投资方的权力影响其回报金额。\"\
    \n  }\n]"
- expression: ((子公司持股比例变动记录 >= 0.5 && 收购日期 <= 资产负债表日 - 1 && !合并范围内子公司名单.该实体) || (协议控制条款 && !合并范围内子公司名单.该实体))
  description: 判断实际控制的标准：持股比例达到50%以上且购买日在报告年度内，或者虽无直接持股但通过协议安排（如VIE、一致行动人）能够控制，均应纳入合并范围。若未纳入，则违规。
  audit_item: 未按规定编制合并财务报表
  suspicion: 未将具有实际控制权的公司纳入合并范围
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第33号——合并财务报表\",\n    \"法规文号\": \"财会〔2014〕10号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第七条、第十三条\",\n    \"内容概述\": \"母公司应当将其控制的所有子公司（包括基于协议控制等）纳入合并财务报表。合并范围应当以控制为基础确定，不得故意遗漏。\"\n  }\n]"
- expression: 财务报表.资产负债率 > 制度文件.分层设定负债率指标的要求 && !分解表.子企业名称.contains(该子公司名称)
  description: 当某一子公司资产负债率超出集团统一规定或该层级应有的管控标准，而该子公司未被纳入考核指标分解表覆盖范围时，判定为违规。旨在发现通过规避考核而放任高风险子企业杠杆失控的问题。
  audit_item: 未按规定落实去杠杆政策措施
  suspicion: 未按规定将子企业资产负债率纳入考核
  regulation: "[\n  {\n    \"法规名称\": \"中央企业资产负债率分类管控工作方案\",\n    \"法规文号\": \"国资发财管〔2019〕132号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条第（二）款\",\n    \"内容概述\": \"中央企业应将各级子企业资产负债率纳入管控体系，实施分类管理和考核，不得遗漏重要子企业，确保全级次杠杆水平可控。\"\n  }\n]"
- expression: (审计报告.金额单位声明 == '万元' && (底稿.对应事项的审定金额 >= 1000000 || 财务报表.报表金额 >= 1000000) && (审计报告.报告正文全部金额数字 / 底稿.对应事项的审定金额)
    < 0.01) || (审计报告.报告正文全部金额数字带有'元'字 && 底稿.底稿中金额单位标记 == '万元')
  description: 当报告声明单位为万元，但底稿或报表金额达到百万元级，且报告数字远小于底稿金额（比值<0.01）时，疑似误用单位；或报告中数字带有‘元’但底稿单位为万元，判定为单位不一致错误。
  audit_item: 审计文书校验
  suspicion: 审计报告金额单位使用错误
  regulation: "[\n  {\n    \"法规名称\": \"中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告\",\n    \"法规文号\": \"财会〔2019〕5号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"审计报告应当内容完整、表述清晰、数据准确，包括对金额单位的明确说明，避免产生误导。\"\n  }\n]"
- expression: (被担保方.资产负债率 > 70% || 被担保方.不良信用记录 == 不良 || 被担保方.连续亏损年数 >= 3) && 审查结论、各指标评估值.审查结论 == 通过
  description: 根据内部制度规定，担保对象资产负债率超过70%、征信存在不良记录或连续三年亏损应不予担保，但通过审查结论却为“通过”，表明审查流于形式或违规批准。具体阈值可根据企业制度调整。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 违规向不符合担保条件的对象提供担保
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、严格控制融资担保对象\",\n    \"内容概述\": \"中央企业严禁对集团外无股权关系企业提供担保；不得对进入重组或破产清算程序、资不抵债、连续三年及以上亏损且经营净现金流为负等不具备持续经营能力的子企业提供担保。\"\
    \n  }\n]"
- expression: (测算表.累计影响数 <> 0 && (比较报表.期初未分配利润调整额 != 测算表.期初留存收益调减额 || 比较报表.上期损益调整额 == 0)) || (测算表.累计影响数 <> 0 && 附注.追溯调整披露内容
    IS NULL)
  description: 若变更存在影响数但比较报表期初未分配利润或上期损益未同步调整，或附注未披露任何追溯调整信息，则触发疑点。允许小额差异（因计算尾差），但偏差绝对值超过利润总额1%需重点核查。
  audit_item: 随意变更或未按规定变更会计政策、会计处理方法
  suspicion: 会计政策变更未按规定追溯调整前期数据
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第28号——会计政策、会计估计变更和差错更正\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第七条、第十四条\",\n    \"内容概述\": \"会计政策变更采用追溯调整法，应当将累积影响数调整列报前期最早期初留存收益，其他相关项目的期初余额和列报前期披露的其他比较数据也应当一并调整；并在附注中披露追溯调整对前期相关损益、权益项目的影响金额。\"\
    \n  }\n]"
- expression: (收益分配方案 IS NULL) OR (表决记录表.表决事项 != '收益分配方案' AND 收益分配明细表.分配总额 > 0) OR (ABS(收益分配明细表.分配总额 / 财务报表.净利润 - 方案规定比例)
    > 0.2) OR (收益分配明细表.可分配收益基数 < 财务报表.净利润 * 0.5)
  description: 无收益分配方案；有分配但未经成员（代表）大会表决；实际分配比例与方案规定比例偏差超过20%；可分配收益基数低于净利润的50%（表明留存过多）均可能构成不合理。阈值可依据地方规定调整，通常成员分红不宜低于可分配收益的70%。
  audit_item: 集体经营性资产产权制度改革不到位
  suspicion: 集体资产收益分配制度未建立或不合理
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四部分第（五）条\",\n    \"内容概述\": \"健全集体收益分配制度，明确分配范围、顺序和比例，做好收益分配的核算、公示和审批工作。\"\n  }\n]"
- expression: (财务报表.未分配利润期末 > 财务报表.未分配利润期初 AND 收益分配明细表.分红总额 = 0) OR (兑现台账.应分红金额 != 兑现台账.实际发放金额) OR (兑现台账.实际发放金额 > 0 AND 银行流水.金额合计
    != 兑现台账.实际发放金额) OR (兑现台账.发放日期逾期 > 30天 AND 收益分配方案规定发放期限)
  description: 连续有可分配收益但未分红（以未分配利润增加且分红为零为标志），或应分未足额分配，或发放记录与银行流水不匹配，或发放时间严重逾期，均表明收益分配权未得到有效保障。逾期阈值可根据方案中的约定发放日确定。
  audit_item: 集体经营性资产产权制度改革不到位
  suspicion: 农民集体资产股份收益分配权未得到保障
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于稳步推进农村集体产权制度改革的意见\",\n    \"法规文号\": \"中发〔2016〕37号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四部分第（五）条及第（六）条\",\n    \"内容概述\": \"保障农民集体资产股份权利。组织实施好赋予农民对集体资产股份的占有、收益、有偿退出及抵押、担保、继承权等权能改革试点。\"\n \
    \ }\n]"
- expression: 施工合同.合同单价 / 同类项目市场平均单价 > 1.3  ||  SUM(工程款支付台账.支付金额 WHERE 支付对象为无实际经营供应商) > 贷款总额*0.2  ||  ABS(施工合同.合同总价 - 企业财务报表.在建工程)
    / 企业财务报表.在建工程 > 0.15
  description: 合同单价超出市场均价30%以上，或大额支付向无实际经营的供应商，或合同总价与账面在建工程差异超过15%，均表示建设成本虚增。支付给异常供应商的金额超过贷款总额20%为严重违规。
  audit_item: 骗取银行贷款或住房公积金项目贷款
  suspicion: 虚增项目建设成本骗取贷款
  regulation: "[\n  {\n    \"法规名称\": \"贷款通则\",\n    \"法规文号\": \"中国人民银行令1996年第2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第二十条\",\n    \"内容概述\": \"借款人不得采取欺诈手段骗取贷款。\"\n  },\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\"\
    ,\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十五条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的，应责令限期退回资金。\"\n  }\n]"
- expression: 企业财务报表.关联方交易占比 > 0.8  &&  企业财务报表.营业收入 * 0.7 > 纳税申报表.营业收入  &&  银行贷款发放明细表.贷款金额 / 企业财务报表.净利润 > 10
  description: 财务报表中关联方收入超过80%，且报表收入远高于纳税申报收入（差异超30%），同时贷款金额超过净利润10倍，表明借款人通过关联交易虚增收入以满足贷款资质要求。
  audit_item: 骗取银行贷款或住房公积金项目贷款
  suspicion: 通过关联交易伪造借款人资质骗取贷款
  regulation: "[\n  {\n    \"法规名称\": \"贷款通则\",\n    \"法规文号\": \"中国人民银行令1996年第2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第二十条\",\n    \"内容概述\": \"借款人不得提供虚假的财务报表等资料骗取贷款。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国商业银行法\",\n    \"法规文号\": \"主席令第13号\"\
    ,\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十五条\",\n    \"内容概述\": \"商业银行贷款应当实行审贷分离、分级审批的制度，并对借款人的借款用途、偿还能力、还款方式等情况进行严格审查。\"\
    \n "
