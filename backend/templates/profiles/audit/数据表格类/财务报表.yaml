name: audit/数据表格类/财务报表
type: model
description: 从数据表格类类文档（财务报表）中提取结构化元数据。涵盖字段如：上期营业收入/成本调整额、个别报表中内部销售收入、交易性金融资产、会计政策变更说明、关联方交易占比、内部往来科目余额、净利润、净资产金额。文档范围包括：企业财务报表、各级子公司财务报表、合并财务报表、大型企业财务报表、子公司财务报表、被审计单位财务报表、被担保企业财务报表、被担保方财务报表、财务报表、追溯调整前后比较财务报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 工程
- 报表
- 资产
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 财务报表
  member_count: 1
  member_details:
  - 企业财务报表
  - 各级子公司财务报表
  - 合并财务报表
  - 大型企业财务报表
  - 子公司财务报表
  - 被审计单位财务报表
  - 被担保企业财务报表
  - 被担保方财务报表
  - 财务报表
  - 追溯调整前后比较财务报表
  - 集体资产年度财务报表
output:
  fields:
  - name: 上期营业收入-成本调整额
    type: number
    description: 提取 上期营业收入-成本调整额 的数值（含单位，如万元、吨等）
  - name: 个别报表中内部销售收入
    type: number
    description: 提取 个别报表中内部销售收入 的数值（含单位，如万元、吨等）
  - name: 交易性金融资产
    type: string
    description: 提取 交易性金融资产 的文本值
  - name: 会计政策变更说明
    type: string
    description: 提取 会计政策变更说明 的文本值
  - name: 关联方交易占比
    type: string
    description: 提取 关联方交易占比 的文本值
  - name: 内部往来科目余额
    type: number
    description: 提取 内部往来科目余额 的数值（含单位，如万元、吨等）
  - name: 净利润
    type: string
    description: 提取 净利润 的文本值
  - name: 净资产金额
    type: number
    description: 提取 净资产金额 的数值（含单位，如万元、吨等）
  - name: 变更原因
