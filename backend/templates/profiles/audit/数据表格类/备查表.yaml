name: audit/数据表格类/备查表
type: model
description: 从数据表格类类文档（备查表）中提取结构化元数据。涵盖字段如：事项描述、发生日期、披露日期、披露载体。文档范围包括：重大事项披露登记备查表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 备查表
  member_count: 1
  member_details:
  - 重大事项披露登记备查表
output:
  fields:
  - name: 事项描述
    type: string
    description: 提取 事项描述 的文本值
  - name: 发生日期
    type: date
    description: 提取 发生日期 的日期值，格式 YYYY-MM-DD
  - name: 披露日期
    type: date
    description: 提取 披露日期 的日期值，格式 YYYY-MM-DD
  - name: 披露载体
    type: string
    description: 提取 披露载体 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (备查表.发生日期到披露日期 > 2个工作日) && (事项涉及金额占净资产比例 > 10% 或 金额 > 5000万元) && 事项类别属于应披露的重大资金交易（如重大贷款、担保、资金占用等）
  description: 发生可能对上市公司证券价格产生较大影响的重大资金事件，必须立即公告，延迟公告超过2个工作日即构成信息披露违规。
  audit_item: 资金管理方面存在的问题
  suspicion: 未及时公告重大资金事项
  regulation: "[\n  {\n    \"法规名称\": \"上市公司信息披露管理办法\",\n    \"法规文号\": \"证监会令第182号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"发生可能对上市公司证券及其衍生品种交易价格产生较大影响的重大事件，投资者尚未得知时，上市公司应当立即披露，说明事件的起因、目前的状态和可能产生的影响。\"\n  }\n]"
