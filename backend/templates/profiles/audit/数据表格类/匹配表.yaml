    description: 提取 付款对象 的数值（含单位，如万元、吨等）
  - name: 付款时间
    type: date
    description: 提取 付款时间 的日期值，格式 YYYY-MM-DD
  - name: 付款金额
    type: number
    description: 提取 付款金额 的数值（含单位，如万元、吨等）
  - name: 任务清单编号
