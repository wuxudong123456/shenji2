name: audit/数据表格类/匹配表
type: model
description: 从数据表格类类文档（匹配表）中提取结构化元数据。涵盖字段如：付款对应的合同清单项、付款对象、付款时间、付款金额、任务清单编号、保费金额、共享状态、冲突点标注。文档范围包括：任务清单与绩效目标匹配表、保障房建设进度与资金支付匹配表、农户投保清单与保费补贴匹配表、合同付款记录与发票匹配表、合同履约进度与付款匹配表、合同执行进度与付款匹配表、工程项目进度与资金支付匹配表、建设资金流向与规划匹配表、民政部门与乡村振兴局数据共享匹配表、清洁能源设施与乡村规划空间布局匹配表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 付款
- 合同
- 工程
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 匹配表
  member_count: 1
  member_details:
  - 任务清单与绩效目标匹配表
  - 保障房建设进度与资金支付匹配表
  - 农户投保清单与保费补贴匹配表
  - 合同付款记录与发票匹配表
  - 合同履约进度与付款匹配表
  - 合同执行进度与付款匹配表
  - 工程项目进度与资金支付匹配表
  - 建设资金流向与规划匹配表
  - 民政部门与乡村振兴局数据共享匹配表
  - 清洁能源设施与乡村规划空间布局匹配表
  - 电商企业销售数据与物流单据匹配表
  - 绩效目标与资金规模匹配表
  - 高标准农田建设资金匹配表
