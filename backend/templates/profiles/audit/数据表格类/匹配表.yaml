violations:
- expression: (文本.变更后的技术标准 < 公告.技术标准与规格) || (文本.品牌 != 投标文件.投标品牌及型号) || (ABS(文本.工程量或单价) > 15%) || (文本.合同期限 < 审批文件.审批日期) ||
    (匹配表.收款单位账户信息 != 中标人.名称)
  description: 筛查通过补充协议等方式在合同签订后另行订立背离实质性内容协议的行为。典型表现包括：降低技术标准或更换品牌、变更工程量超15%、审批流程倒置等。若出现向非中标单位付款，高度预示违规转包。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 招标人与中标人订立背离实质性内容的协议
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n\
    ]"
- expression: 招标文件.计价方式 == '固定总价' && 文本.价格形式 != '固定总价'
  description: 当招标文件明确要求采用固定总价合同时，正式合同却采用单价可调或其他计价方式，即构成实质性内容背离，触犯法规。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 合同价格条款与招标文件实质性偏离
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n]"
- expression: 文本.预付款比例 > 招标文件.预付款比例 || (招标文件.付款节点及比例（如验收后付至90%） != 文本.付款条件)
  description: 招标文件明确验收后支付高比例，合同改为更前置的高比例预付款，显著改变资金支付风险分配，背离实质性内容。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 合同付款条件与招标文件重大背离
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n]"
- expression: (明细表.实际付款日期 IS NULL OR 明细表.实际付款日期 > 匹配表.应付未付节点日期) && 明细表.账龄 > 60 && 补充协议.供应商名称（中小企业标识） == '中小企业'
  description: 筛选供应商为中小企业，其应付账款实际未付款或实际付款日期晚于合同（或履约进度）约定的付款日期，且账龄（从约定付款日到审计基准日的天数）超过60天（用于识别非偶发性、短期的合理延迟）的交易，判定为疑似违约拖欠。
  audit_item: 未按规定落实降成本政策措施
  suspicion: 违约拖欠中小企业货物、工程、服务款项
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"机关、事业单位从中小企业采购货物、工程、服务，应当自货物、工程、服务交付之日起30日内支付款项；合同另有约定的，付款期限最长不得超过60日。大型企业从中小企业采购货物、工程、服务，应当按照行业规范、交易习惯合理约定付款期限并及时支付款项。不得强制中小企业接受商业汇票等非现金支付方式，不得利用商业汇票等非现金支付方式变相延长付款期限。\"\
    \n  }\n]"
- expression: 农业保险覆盖率统计表.实际覆盖率 < 农业保险政策目标文件.目标覆盖率 || 农业保险覆盖率统计表.实际深度 < 农业保险政策目标文件.目标深度 || 农业保险覆盖率统计表.实际密度 < 农业保险政策目标文件.目标密度
  description: 任一实际指标值低于政策文件规定的年度目标值，即构成目标未实现的疑点。差异率通常大于0%即触发，可结合数据质量排除小数点舍入误差。
  audit_item: 农业保险保费补贴政策落实不到位
  suspicion: 农业保险覆盖率深度密度目标未实现
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业保险保险费补贴管理办法\",\n    \"法规文号\": \"财金〔2021〕94号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十四条\",\n    \"内容概述\": \"省级财政部门应结合本地实际，合理确定并下达本地区农业保险绩效目标，包括农业保险覆盖率、农业保险深度和农业保险密度等，并对目标实现情况进行考核。\"\n  }\n\
    ]"
- expression: (匹配表.签收状态 = NULL) OR (分析表.同一IP当日下单数 > 10 OR 分析表.同一收货地址当月下单数 > 50) OR (追踪表.资金闭环标记 = FALSE) OR (内控制度.是否建立IP监控
    = FALSE OR 承诺书.承诺书签署状态 = '未签署')
  description: 物流信息缺失率超过30%表明存在空包刷单嫌疑；同一IP短期内大量下单或同一地址异常集中下单，反映批量虚假交易特征；退款资金回流至卖方账户是自买自退的典型标志；企业缺少反刷单内控或未签署真实性承诺，表明主观放任。以上条件满足任意一条均触发疑点。
  audit_item: 农村电子商务发展不到位
  suspicion: 电商企业虚构交易刷单造假销售数据
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电子商务法\",\n    \"法规文号\": \"主席令第7号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十七条\",\n    \"内容概述\": \"电子商务经营者不得以虚构交易、编造用户评价等方式进行虚假或者引人误解的商业宣传，欺骗、误导消费者。\"\n  }\n]"
- expression: 标申报表.预算资金规模 > 1000000 AND (标申报表.绩效目标内容 IS NULL OR 标申报表.绩效目标内容 NOT LIKE '%[0-9]%')
  description: 当单个项目资金安排超过100万元（可根据实际情况调整阈值）且设定的绩效目标仅为定性描述、不含任何数字或百分比等量化指标时，判定为未结合资金规模和任务安排制定可衡量的绩效目标。
  audit_item: 资金绩效管理不到位
  suspicion: 未结合资金规模制定可衡量绩效目标
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二部分“全方位、全过程、全覆盖预算绩效管理”\",\n    \"内容概述\": \"各部门各单位编制预算时要全面设置部门和单位整体绩效目标、政策及项目绩效目标，绩效目标要包括产出、成本、经济效益、社会效益等绩效指标，绩效指标应尽可能量化。\"\
    \n  }\n]"
- expression: (社会救助资金发放明细表.身份证号 IN (死亡人员信息库.身份证号)) || (社会救助资金发放明细表.身份证号 IN (财政供养人员信息库.身份证号)) || (脱贫人口与救助对象交叉比对清单.退出时间 IS NOT
    NULL && 社会救助资金发放明细表.发放时间 > DATEADD(DAY, 30, 脱贫人口与救助对象交叉比对清单.退出时间) && 社会救助资金发放明细表.发放状态 = '正常') || (特殊群体身份认定数据库.身份类型 = '低保'
    && 家庭收入核查信息.实际收入 > 当地低保标准 * 1.2 && 社会救助资金发放明细表.发放状态 = '正常')
  description: 表达式包含四条或条件规则：①救助对象身份证号存在于死亡人员库中，判定为死亡冒领；②身份证号存在于财政供养人员库中，判定为公职人员违规享受；③脱贫交叉清单中已记录退出时间，且发放时间超出退出后30天缓冲期仍正常发放，判定为应退未退；④低保对象实际收入超过低保标准1.2倍以上仍持续发放，判定为收入超标未退出。阈值1.2倍为收入合规弹性上限，缓冲期30天参照动态调整一般时限。满足任一条件即生成疑点。
  audit_item: 防止返贫帮扶政策落实不到位
  suspicion: 社会救助资金发放对象不合规
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十一条、第十三条\",\n    \"内容概述\": \"申请最低生活保障需按规定程序审核；县级民政部门及乡镇、街道应对低保家庭实行动态管理，定期核查保障对象家庭财产与收入，对不再符合条件的及时清退。\"\n  },\n  {\n \
    \   \"法规名称\": \"关于进一步加强和改进最低生活保障工作的意见\",\n    \"法规文号\": \"国发〔2012〕45号\",\n    \"效力级别\": \"国务院规范性文件\",\n    \"条款号\": \"\
    第三条\",\n"
- expression: 冲突类型 == '占用基本农田' || 冲突类型 == '位于生态红线内' || (规划调整日期 > 0 && 能源方案修订日期 - 规划调整日期 > 30 天)
  description: 设施选址坐标落入基本农田或生态红线范围，直接判定违规；乡村规划调整后超过30天清洁能源方案未同步修订，视为规划衔接不到位。
  audit_item: 项目规划统筹衔接不到位
  suspicion: 清洁能源设施选址与国土空间规划冲突
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第32号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十五条\",\n    \"内容概述\": \"永久基本农田经依法划定后，任何单位和个人不得擅自占用或者改变其用途。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\"\
    : \"主席令第74号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"在城市、镇规划区内进行建筑物、构筑物、道路、管线和其他工程建设的，应当向城乡规划主管部门申请"
- expression: (银行流水.收款方名称 != 合同.乙方名称) AND (银行流水.金额 > 200000) OR (银行流水.摘要 包含 "工资" 或 "福利" AND 收款方为关联企业) OR (费用报销凭证.发票查验结果 =
    "虚假" OR 重复报销)
  description: 资金拨付对象与合同签订方不一致且金额超过20万元；资金用途摘要与项目无关，或收款方为关联方个人或企业；发票虚假或重复报销。
  audit_item: 项目资金使用不合规
  suspicion: 项目建设资金被转移、侵占或挪用
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十七条\",\n    \"内容概述\": \"各部门、各单位不得截留、挪用预算资金，不得擅自改变预算支出用途。\"\n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n    \"法规文号\"\
    : \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员违反规定，以虚报、冒领等手段骗取财政资金；截留、挪用财政资金等行为"
- expression: (验收材料.实际完成工程量 < 合同.工程量的50%) AND (付款匹配表.累计付款 / 合同金额 > 0.5) OR (发票.单价 > 同期市场均价 * 1.3) OR (农民工工资发放名单 与实际考勤记录不符)
  description: 实际完成工程量不足合同量50%但已付超50%款项；采购单价高于市场均价30%以上；工资名单与考勤不符。
  audit_item: 项目资金使用不合规
  suspicion: 通过虚报工程量或冒领骗取项目资金
  regulation: "[\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的，责令改正，追回有关财政资金，对单位给予警告或者通报批评，对直接负责的主管人员和其他直接责任人员给予记大过处分；情节较重的，给予降级或者撤职处分；情节严重的，给予开除处分。\"\
    \n  },\n  {\n    \"法规名称\": \"《中华人民共和国招标投标法》\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    "
- expression: (资金拨付凭证.用途 != 合同.约定用途) AND (未提供预算调整审批记录) OR (费用报销凭证.报销内容 与 项目可研报告建设内容无关)
  description: 资金实际用于非合同约定或批复的建设内容，且无正规变更审批。
  audit_item: 项目资金使用不合规
  suspicion: 擅自改变建设资金使用方式或用途
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十七条\",\n    \"内容概述\": \"各部门、各单位不得截留、挪用预算资金，不得擅自改变预算支出用途。\"\n  },\n  {\n    \"法规名称\": \"《基本建设财务规则》\",\n    \"法规文号\":\
    \ \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"项目建设管理单位应当严格按照批准的概算内容使用资金，不得擅自改变建设内容、规模和标准。\"\
    \n  "
- expression: (项目实施方案与规划对比分析报告.偏差率 > 15%) || (历年项目验收与规划符合性报告.偏差率 > 15%) || (建设资金流向与规划匹配表.非重点区域投资金额 / 总投资金额 > 30%)
  description: 当实际建设内容与规划要求的偏差率超过15%（如集中连片比例、节水灌溉覆盖率等），或资金投向非规划重点区域的比例超过30%时，判定为规划与建设脱节；阈值可根据地方管理细则调整。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 高标准农田规划与项目建设内容严重不符
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"农田建设项目应当按照批准的初步设计组织实施，涉及建设地点、建设内容、建设规模等重大变更，须按程序报原审批机关批准，不得擅自调整。\"\n  }\n]"
- expression: (投资计划下达正式文件.任务清单编号 is NULL || 投资计划下达正式文件.绩效目标编号 is NULL) || (任务清单与绩效目标匹配表.投资计划文号 is NULL)
  description: 检查投资计划下达文件中是否缺失任务清单编号或绩效目标编号，或者匹配表中无对应投资计划文号记录。任意条件满足，则判定为未同步下达，高风险。
  audit_item: 项目计划分解下达不合规
  suspicion: 投资计划未与任务清单及绩效目标同步下达
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十六条\"\
    ,\n    \"内容概述\": \"政府投资年度计划应当和本级预算相衔接。项目单位应当编制项目预算，明确项目绩效目标。\"\n  },\n  {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\"\
    : \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述\": \"预算绩效目标应与部门预算同步申报、同步审核、同步批复下达。\"\n\
    \  }"
- expression: 拨付文件.工程进度说明 != 监理报告.监理记录的实际进度 && (合同约定付款比例 × 合同总价 - 累计已付金额) > 拨付文件.申请金额 && 收款金额与付款给委托方的记录.资金最终流向属于关联企业或个人账户
  description: 比对资金申请时申报的工程进度与独立监理报告的实际进度是否一致；若申报进度大幅超前于实际进度，且申请金额超出合同约定应付比例，同时资金后续转入关联企业或个人账户形成回流，则高度疑似虚列支出套取资金。
  audit_item: 挪用或违规使用保障性安居工程专项资金
  suspicion: 虚列工程进度套取专项资金
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程专项资金管理办法\",\n    \"法规文号\": \"财综〔2019〕31号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十五条\",\n    \"内容概述\": \"专项资金支付应严格按照工程进度和合同约定执行，不得超进度、超标准拨付资金。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\"\
    ,\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"单位和个人有虚报、冒领、骗取财政资金行为的，责令改正"
- expression: (明细表.支出收款方 NOT IN (批复文件.建设内容)) || (明细表.用途说明 NOT LIKE '%安居工程%' && 明细表.用途说明 NOT LIKE '%棚改%' && 明细表.用途说明 NOT LIKE
    '%保障房%') || (明细表.支出日期 < 匹配表.实际已付款) || (对比表.偏差率 ABS > 0.3 && 对比表.预算科目 NOT IN ('不可预见费','材料价差'))
  description: 判定规则：1)贷款资金收款单位不在项目批复或合同约定的参建单位清单中，疑为挪用；2)资金用途摘要与保障房建设关键词（安居工程、棚改、保障房）均不相关；3)支付日期早于合同约定应付日期，可能存在超前支付挪用；4)实际支出超出预算30%以上且非合理科目，疑为虚列成本挪用。以上条件满足任一即触发高风险疑点。
  audit_item: 挪用或违规使用保障性安居工程银行贷款或住房公积金项目贷款
  suspicion: 商业银行保障房贷款资金挪用
  regulation: "[\n  {\n    \"法规名称\": \"固定资产贷款管理暂行办法\",\n    \"法规文号\": \"中国银行业监督管理委员会令2009年第2号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三十八条\",\n    \"内容概述\": \"贷款人应与借款人约定明确、合法的贷款用途，并按照约定检查、监督贷款的使用情况，防止贷款被挪用。\"\n  },\n  {\n    \"法规名称\":\
    \ \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三（六）\",\n \
    \   \"内容概述\""
- expression: (支出明细表.收款单位 NOT IN (项目立项批复文件.建设内容)) && (支出明细表.支出类别 IN ('市政道路','工资发放','偿还旧债') ) || (支出明细表.金额 > 1000000 && 支出明细表.用途说明
    NOT LIKE '%棚改%' && 支出明细表.用途说明 NOT LIKE '%保障房%') && (匹配表.累计支付比例 - 匹配表.实际工程进度 > 0.2)
  description: 判定规则：1)收款方非参建名录且支出类别为市政道路、工资、还债等非工程支出，直接判为挪用；2)单笔大于100万元的支付，用途与棚改或保障房不相关，且资金支付比例高于工程进度20个百分点以上，表明资金已拨付但工程严重滞后，存在截留挪用。满足任一条件触发高风险。
  audit_item: 挪用或违规使用保障性安居工程银行贷款或住房公积金项目贷款
  suspicion: 政策性银行贷款挪用于非保障房项目
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三（六）\",\n    \"内容概述\": \"对保障性安居工程贷款实行封闭管理、专款专用，严禁截留、挤占、挪用。\"\n  },\n  {\n    \"法规名称\": \"国家发展改革委关于印发《中央预算内投资保障性安居工程专项管理暂行办法》的通知\"\
    ,\n    \"法规文号\": \"发改投资规〔2019〕1098号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    "
