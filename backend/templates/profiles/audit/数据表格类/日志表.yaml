name: audit/数据表格类/日志表
type: model
description: 从数据表格类类文档（日志表）中提取结构化元数据。涵盖字段如：IP地址、修改前后值、变更类型、员工编号、审批动作、审批项目ID、必填字段完整度、操作人。文档范围包括：人事系统中员工状态变更日志表、内部员工操作审批日志表、建设项目审批操作日志表、渔船管理信息系统数据录入日志表、经办人员操作日志表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 审批
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 日志表
  member_count: 1
  member_details:
  - 人事系统中员工状态变更日志表
  - 内部员工操作审批日志表
  - 建设项目审批操作日志表
  - 渔船管理信息系统数据录入日志表
  - 经办人员操作日志表
output:
  fields:
  - name: IP地址
    type: string
    description: 提取 IP地址 的文本值
  - name: 修改前后值
    type: string
    description: 提取 修改前后值 的文本值
  - name: 变更类型
    type: string
    description: 提取 变更类型 的文本值
  - name: 员工编号
    type: string
    description: 提取 员工编号 的文本值
  - name: 审批动作
    type: string
    description: 提取 审批动作 的文本值
  - name: 审批项目ID
    type: string
    description: 提取 审批项目ID 的文本值
  - name: 必填字段完整度
    type: string
    description: 提取 必填字段完整度 的文本值
  - name: 操作人
    type: string
    description: 提取 操作人 的文本值
  - name: 操作内容
    type: string
    description: 提取 操作内容 的文本值
  - name: 操作员ID
    type: string
    description: 提取 操作员ID 的文本值
  - name: 操作员工号
    type: string
    description: 提取 操作员工号 的文本值
  - name: 操作时间
    type: date
    description: 提取 操作时间 的日期值，格式 YYYY-MM-DD
  - name: 操作类型
    type: string
    description: 提取 操作类型 的文本值
  - name: 最后更新时间
    type: date
    description: 提取 最后更新时间 的日期值，格式 YYYY-MM-DD
  - name: 渔船状态
    type: boolean
    description: 提取 渔船状态 的布尔值（是/否）
  - name: 渔船编号
    type: string
    description: 提取 渔船编号 的文本值
  - name: 状态变更日期
    type: date
    description: 提取 状态变更日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (分配表.授权金额上限 < 审批表.项目预算金额) || (分配表.授权项目类型 NOT CONTAINS 审批表.项目类型) || (审批表.审批日期 < 分配表.有效期开始 OR 审批表.审批日期 > 分配表.有效期结束)
    || (日志表.操作人 对应的 分配表.审批人姓名 不存在)
  description: 判定逻辑：1.审批人的授权金额上限小于项目预算金额；2.审批人的授权项目类型不包含该项目类型；3.审批日期不在该审批人权限有效期内；4.操作日志中的审批操作人无任何有效权限记录。满足任一条件即触发越权审批疑点。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 超越规定审批权限审批建设项目
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照规定的程序审批，不得超越审批权限审批政府投资项目。\"\n  }\n]"
- expression: (注销台账.处置完成日期 IS NOT NULL AND (日志表.渔船状态='在册' AND ABS(日志表.最后更新时间 - 注销台账.处置完成日期) > 2)) OR (日志表.渔船编号 IS NULL) OR
    (日志表.船主姓名 IS NULL OR 日志表.拆解日期 IS NULL) OR (注销台账.渔船编号 NOT IN (SELECT 渔船编号 FROM 日志表)) OR (注销台账.处置完成日期 IS NOT NULL AND 日志表.最后更新时间
    > 注销台账.处置完成日期 + 30)
  description: 渔船已处置完成但系统状态仍未更新且滞后超2天；系统缺失必填字段（编号、船主、拆解日期等）；处置记录在系统无对应档案；系统更新时间显著滞后处置日期超30天。满足任一条件判为违规。
  audit_item: 补偿制度落实不到位（渔业）
  suspicion: 渔船信息系统数据未动态更新
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发《长江流域重点水域禁捕和建立补偿制度实施方案》的通知\",\n    \"法规文号\": \"农长渔发〔2019〕1号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条第（二）款\",\n    \"内容概述\": \"要求建立健全退捕渔船管理信息系统，及时录入更新渔船信息，实行动态管理。\"\n  }\n]"
- expression: (员工编号、缴纳时间、缴纳金额.缴纳时间 > 员工编号、入职日期、退休日期、职务状态.退休日期 AND 员工编号、入职日期、退休日期、职务状态.退休日期 IS NOT NULL) OR (员工编号、缴纳时间、缴纳金额.缴纳时间
    >= 员工编号、养老金发放日期.养老金发放日期)
  description: 当公积金缴纳时间晚于员工退休日期，或养老金已发放后仍有公积金缴纳记录，即判定为违规。退休日期以员工基本信息表记录为准，养老金发放日期作为补充验证。两条子条件为“或”关系，任一成立即触发疑点。
  audit_item: 退休人员未停缴住房公积金
  suspicion: 退休人员未停缴住房公积金
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二十四条\",\n    \"内容概述\": \"职工离休、退休的，可以提取住房公积金账户内的存储余额，同时注销账户。退休后不再缴存住房公积金。\"\n  },\n  {\n    \"法规名称\": \"关于住房公积金管理若干具体问题的指导意见\"\
    ,\n    \"法规文号\": \"建金管〔2005〕5号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条第（一）款\",\n    \"内容概述\": \"职工离退休"
- expression: (经办人员操作日志表.操作类型 = '修改' && 操作内容 LIKE '%缴存基数%' || 操作内容 LIKE '%缴存月数%') && (操作时间.HOUR NOT BETWEEN 6 AND 20 || 操作时间
    属于 非工作日) && (SELECT 贷款金额 FROM 住房公积金贷款申请清单 WHERE 审批人ID = 操作员ID) > 同类贷款平均金额 * 1.5) || (存在 经办人员银行账户流水.对方账户 与 住房公积金贷款申请清单.申请人ID
    关联的资金记录)
  description: 一是信贷经办人员或系统管理员在非工作时间或节假日修改关键缴存字段，且经手审批的贷款金额明显高于平均水平；二是经办人员个人账户与贷款申请人之间存在异常资金往来。上述任一条件成立，即构成内外勾结骗贷重大疑点。
  audit_item: 骗取套取住房公积金贷款
  suspicion: 经办管理人员内外勾结骗取公积金贷款
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第四十条\",\n    \"内容概述\": \"住房公积金管理中心未按照规定审批住房公积金贷款，或者有其他违反本条例规定行为的，对主管人员和其他直接责任人员依法给予行政处分。\"\n  },\n  {\n    \"法规名称\": \"\
    住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四十四条\",\n    \"内容概述\": \"以欺骗手段获得住房公积金贷款的"
