name: audit/数据表格类/缴申报表
type: model
description: 从数据表格类类文档（缴申报表）中提取结构化元数据。涵盖字段如：利息股息红利所得申报记录、已扣缴税款、已缴税额、应纳税所得额、应纳税额、申报收入总额、申报收入额。文档范围包括：个人所得税代扣代缴申报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 缴申报表
  member_count: 1
  member_details:
  - 个人所得税代扣代缴申报表
output:
  fields:
  - name: 利息股息红利所得申报记录
    type: string
    description: 提取 利息股息红利所得申报记录 的文本值
  - name: 已扣缴税款
    type: number
    description: 提取 已扣缴税款 的数值（含单位，如万元、吨等）
  - name: 已缴税额
    type: string
    description: 提取 已缴税额 的文本值
  - name: 应纳税所得额
    type: string
    description: 提取 应纳税所得额 的文本值
  - name: 应纳税额
    type: string
    description: 提取 应纳税额 的文本值
  - name: 申报收入总额
    type: number
    description: 提取 申报收入总额 的数值（含单位，如万元、吨等）
  - name: 申报收入额
    type: number
    description: 提取 申报收入额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (SUM(发放明细表.金额) - 申报表.应纳税所得额) > 0 && (员工福利费明细表.福利费领取签名)
  description: 除税法明文规定的免税福利项目外，企业向员工发放的节日补贴、购物卡、过节费等货币性福利，均应并入当月工资、薪金所得代扣代缴个人所得税。若申报表未包含该部分福利，触发疑点。
  audit_item: 违反税收征管规定的行为
  suspicion: 发放货币福利未并入工资薪金代扣个人所得税
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国个人所得税法\",\n    \"法规文号\": \"主席令第九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第九条\",\n    \"内容概述\": \"个人所得税以所得人为纳税人，以支付所得的单位或者个人为扣缴义务人。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国个人所得税法实施条例\",\n    \"法规文号\"\
    : \"国务院令第707号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"工资、薪金所得，是指个人因任职或者受雇取得的工资、薪金、奖金、年终加薪、劳动分红、"
- expression: (明细表.未还款余额 > 0) && (借款合同.借款期间 > 365) && (申报收入总额.利息股息红利所得申报记录)
  description: 纳税年度内个人投资者从其投资企业借款，在该纳税年度终了后既不归还，又未用于企业生产经营的，其未归还的借款应视为企业对个人投资者的红利分配，依照“利息、股息、红利所得”项目计征个人所得税。超过365天未归还且无经营用途，即触发。
  audit_item: 违反税收征管规定的行为
  suspicion: 股东借款长期挂账未视同分红代扣个人所得税
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于规范个人投资者个人所得税征收管理的通知\",\n    \"法规文号\": \"财税〔2003〕158号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"纳税年度内个人投资者从其投资企业借款，在该纳税年度终了后既不归还，又未用于企业生产经营的，其未归还的借款可视为企业对个人投资者的红利分配，依照“利息、股息、红利所得”项目计征个人所得税。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国个人所得税法\",\n    \"法规文号\": \"主席令第九号\",\n    \"效力级别\": \""
- expression: (缴申报表.应纳税额 < 明细表.代扣个人所得税 * 0.9) || (报销凭证.费用类型 IN ['物业费', '子女教育费', '个人通讯费', '个人旅游费'] && 报销凭证.报销人 IN 职工名单 && 报销凭证.事由
    NULL 公司业务关联) || (明细账.会计科目 == '管理费用-福利费' && 摘要 LIKE '%代缴个税%')
  description: 企业实缴个税远低于应代扣金额（容差10%），则很可能单位替职工承担了税款；费用报销中出现应由个人负担的消费且无合理业务理由，即为违规承担个人支出；会计账务中直接出现“代缴个税”等分录时直接触发。
  audit_item: 违规支付职工薪酬及股份
  suspicion: 违规承担职工个人应承担的社保、个税等支出
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国个人所得税法\",\n    \"法规文号\": \"中华人民共和国主席令第九号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"个人所得税以所得人为纳税人，以支付所得的单位或者个人为扣缴义务人。扣缴义务人应当按照国家规定办理全员全额扣缴申报，不得少扣或多扣，亦不得为纳税人负担税款。\"\n  },\n  {\n\
    \    \"法规名称\": \"国家税务总局关于雇主为雇员承担全年一次性奖金部分税款有关个人所得税计算方法问题的公告\",\n    \"法规文号\": \"国家税务总局公告2011年第28号\",\n    \"效力级"
