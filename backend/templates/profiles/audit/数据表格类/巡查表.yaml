name: audit/数据表格类/巡查表
type: model
description: 从数据表格类类文档（巡查表）中提取结构化元数据。涵盖字段如：发现问题、处理结果、巡查日期、设施运行状况。文档范围包括：农村污水治理工程管护巡查表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 巡查表
  member_count: 1
  member_details:
  - 农村污水治理工程管护巡查表
output:
  fields:
  - name: 发现问题
    type: string
    description: 提取 发现问题 的文本值
  - name: 处理结果
    type: boolean
    description: 提取 处理结果 的布尔值（是/否）
  - name: 巡查日期
    type: date
    description: 提取 巡查日期 的日期值，格式 YYYY-MM-DD
  - name: 设施运行状况
    type: string
    description: 提取 设施运行状况 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (巡查表.巡查日期 IS NULL && DATEDIFF(TODAY(), 治理工程立项审批及验收报告.竣工验收日期) > 365) || (管护责任主体、巡检频次要求.维修记录 IS NULL && 调查表.设施停运投诉
    > 3) || (明细表.支出进度 < 30%)
  description: 已竣工超一年的污水处理设施无任何巡检记录，或群众已累计多次投诉停运但运维台账无维修响应，以及年度运维资金支出极低截留闲置，共同指向管护严重缺失，存在“晒太阳工程”风险。
  audit_item: 农村生活污水治理不符合相关规定
  suspicion: 农村黑臭水体治理工程管护不到位
  regulation: "[\n  {\n    \"法规名称\": \"农村生活污水处理设施运行维护管理办法\",\n    \"法规文号\": \"环办土壤函〔2020〕533号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第七条、第十条\",\n    \"内容概述\": \"各地要明确运维主体，建立运维台账和巡检制度，保障运维资金，确保农村污水处理设施正常运行，严禁闲置。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于推进农村黑臭水体治理工作的指导意见\",\n    \"法规文号\": \"环办土壤〔2019〕586号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"\
    内容概述\":"
