name: audit/数据表格类/流水表
type: model
description: 从数据表格类类文档（流水表）中提取结构化元数据。涵盖字段如：交易对手方账户类型、交易摘要、交易时间、交易类型、交易金额、付款摘要、付款方、付款方名称。文档范围包括：国库支付流水表、大额资金往来流水表、客户账户交易流水表、彩票销售资金流水表、租赁补贴资金发放流水表、补贴资金拨付流水表、财政专项资金使用流水表、财政专项资金拨付流水表、银行代发交易流水表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 付款
- 审批
- 补贴
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 流水表
  member_count: 1
  member_details:
  - 国库支付流水表
  - 大额资金往来流水表
  - 客户账户交易流水表
  - 彩票销售资金流水表
  - 租赁补贴资金发放流水表
  - 补贴资金拨付流水表
  - 财政专项资金使用流水表
  - 财政专项资金拨付流水表
  - 银行代发交易流水表
output:
  fields:
  - name: 交易对手方账户类型
    type: string
    description: 提取 交易对手方账户类型 的文本值
  - name: 交易摘要
    type: string
    description: 提取 交易摘要 的文本值
  - name: 交易时间
    type: date
    description: 提取 交易时间 的日期值，格式 YYYY-MM-DD
  - name: 交易类型
    type: string
    description: 提取 交易类型 的文本值
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款摘要
    type: number
    description: 提取 付款摘要 的数值（含单位，如万元、吨等）
  - name: 付款方
    type: number
    description: 提取 付款方 的数值（含单位，如万元、吨等）
  - name: 付款方名称
    type: number
    description: 提取 付款方名称 的数值（含单位，如万元、吨等）
  - name: 付款方账号
    type: number
    description: 提取 付款方账号 的数值（含单位，如万元、吨等）
  - name: 付款金额
    type: number
    description: 提取 付款金额 的数值（含单位，如万元、吨等）
  - name: 审批单号
    type: string
    description: 提取 审批单号 的文本值
  - name: 对方账户名称
    type: string
    description: 提取 对方账户名称 的文本值
  - name: 拨付时间
    type: date
    description: 提取 拨付时间 的日期值，格式 YYYY-MM-DD
  - name: 拨付路径
    type: string
    description: 提取 拨付路径 的文本值
  - name: 拨付金额
    type: number
    description: 提取 拨付金额 的数值（含单位，如万元、吨等）
  - name: 拨入金额
    type: number
    description: 提取 拨入金额 的数值（含单位，如万元、吨等）
  - name: 拨出日期
    type: date
    description: 提取 拨出日期 的日期值，格式 YYYY-MM-DD
  - name: 拨出金额
    type: number
    description: 提取 拨出金额 的数值（含单位，如万元、吨等）
  - name: 接收账户
    type: string
    description: 提取 接收账户 的文本值
  - name: 支付日期
