violations:
- expression: 购订单.合同金额 > 企业内部三重一大上会标准金额 && 企业“三重一大”决策会议记录 IS NULL
  description: 企业的合同或采购订单金额超过了制度规定的必须经领导班子集体研究决策的起点金额，但在三重一大会议记录中未找到相应议题记录，即存在拆分合同或故意规避集体决策，由个人或少数人决断的嫌疑。
  audit_item: 违反廉洁从业有关规定问题
  suspicion: 决策事项故意规避集体决策程序
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进国有企业贯彻落实“三重一大”决策制度的意见\",\n    \"法规文号\": \"中办发〔2010〕17号\",\n    \"效力级别\": \"\
    党内法规\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"凡属重大决策、重要人事任免、重大项目安排和大额度资金运作事项必须由领导班子集体作出决定。\"\n  }\n]"
- expression: 流水表.收款方名称 IN (档案.供应商名称) && (档案.实际控制人 IN (登记表.亲属姓名)) && (流水表.交易金额 / 档案.成立日期 < 合理的年均业务承载量) && (发票.服务/货物交付证据 IS
    NULL)
  description: 企业资金流向由管理人员亲属控制的供应商，且作为收款方的供应商成立时间短、经营规模显然与该笔交易金额不符，同时缺少实质性交付证据（如验收单、物流单等），高度疑似无真实商业背景的资金支付，实为利益输送。
  audit_item: 违反廉洁从业有关规定问题
  suspicion: 通过虚构业务向特定关系人输送资金
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规\",\n   \
    \ \"条款号\": \"第六条（三）项\",\n    \"内容概述\": \"不得利用职权为配偶、子女及其他特定关系人从事营利性经营活动提供便利条件。\"\n  }\n]"
- expression: 明细表.发放方式 == '现金' && 明细表.补贴类型 IN (政策禁止现金发放的补贴清单) && 明细表.金额 > 0
  description: 筛选发放方式为现金且补贴类型属于国家或地方政策明确规定必须通过‘一卡通’银行卡发放的惠农补贴，认定违规；现金发放脱离银行监管，存在截留冒领风险。
  audit_item: 惠农补贴“一卡通”管理不规范
  suspicion: 违规以现金形式发放惠农补贴资金
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财办〔2020〕35号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条、第四条\",\n    \"内容概述\": \"规范补贴资金发放方式，要求所有直接兑付到人到户的补贴资金原则上均通过‘一卡通’平台集中发放，严禁以现金形式发放补贴资金。\"\n  }\n]"
- expression: 明细表.领取人姓名 != 明细表.银行账户名称 && 缺乏有效代领审批文件
  description: 比较发放明细表中领取人姓名与银行账户名称，二者不一致即存在代领嫌疑；若无法提供合规的代领审批文件、委托书或监护人证明，则判定违规；代领脱离户主监控，资金被占用克扣风险高。
  audit_item: 惠农补贴“一卡通”管理不规范
  suspicion: 补贴资金转入他人银行卡代领
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财办〔2020〕35号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"严格规范补贴资金发放流程，补贴资金必须通过审核确认的对象本人银行账户或社保卡发放，因特殊原因确需代领的，应严格审核代领资格并留存相关证明资料。\"\
    \n  }\n]"
- expression: 交易流水表.交易对手方账户类型 in ('实体账户','过渡账户','专用账户') && 交易流水表.交易摘要 like '%补贴%' && 明细表.发放时间 - 拨付记录.拨入时间 > 规定时限
  description: 通过银行流水追踪发现补贴资金先流入非农户个人账户的实体账户或过渡账户，且从拨入到实际发放至农户账户的时间超过政策规定时限（如3个工作日或30日），构成违规；过渡账户造成资金停留，存在挪用或延迟风险。
  audit_item: 惠农补贴“一卡通”管理不规范
  suspicion: 补贴资金通过主管部门或乡镇实体账户过渡发放
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财办〔2020〕35号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第三条、第四条\",\n    \"内容概述\": \"补贴资金应通过国库集中支付和‘一卡通’系统直接发放到受益人账户，严禁将资金拨付到主管部门或乡镇中间账户再转付，减少资金流转环节，确保及时足额发放。\"\
    \n  }\n]"
- expression: 接收方名称（乡镇/村） like '%乡镇%' or 接收方名称（乡镇/村） like '%村%' && 资金最终去向 in (惠农补贴项目清单) && 发放金额 != 发放金额
  description: 检查补贴资金拨付路径发现资金流向乡镇或村集体经济组织，且乡镇村自行制作的发放名册金额与上级下达的补贴金额不一致，存在分配调整空间；政策要求直达农户，禁止层层转拨。
  audit_item: 惠农补贴“一卡通”管理不规范
  suspicion: 补贴资金由主管部门拨付到乡镇或村代为发放
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财办〔2020〕35号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第二条、第四条\",\n    \"内容概述\": \"严肃查处补贴资金层层转拨、优亲厚友等行为，补贴资金应由县级财政部门通过一卡通系统统一发放到户，不得将资金拨付至乡镇或村再行发放。\"\
    \n  }\n]"
- expression: 拨付流水表.接收账户 包含 ('乡镇财政所' || '主管部门账户' || '过渡账户') && 拨付流水表.拨付时间 < 补贴发放明细表.发放日期
  description: 国库集中支付制度要求补贴资金直接支付到最终收款人（农户一卡通）账户。若拨付流水显示资金先转入乡镇、主管部门或过渡账户，再由这些账户转付给农户，且存在时间差，即为未按规定执行国库集中支付，存在资金沉淀或挪用的风险。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 未按国库集中支付制度发放补贴
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（六）\",\n    \"内容概述\": \"各级财政部门要严格按照国库集中支付制度有关规定，将补贴资金直接发放到户，严禁违规设立发放过渡账户。\"\n  }\n]"
- expression: 拨付路径.接收账户 IN ('主管部门实体账户','乡镇过渡账户') && (审批文件.批准使用范围 != '合规审批' || 拨付路径.拨付时间 > 审批文件.有效期限)
  description: 除经省级以上财政部门批准的特殊情况外，不得通过实体账户或过渡账户转发补贴资金。即使已批准，也必须在有效期内专款专用。若无审批手续或逾期仍在使用，即属违规。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 补贴资金拨付至实体账户或过渡账户发放
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（六）\",\n    \"内容概述\": \"除按规定设立的代发专户外，补贴资金不得通过主管部门、乡镇政府等实体账户或过渡账户层层转拨，严禁以拨代支。\"\n  }\n]"
- expression: 拨付路径.接收账户 包含 ('乡' || '镇' || '村') && (收支台账.支出用途 = '现金发放' || 明细表.发放日期 - 拨付路径.拨付时间 > 14天)
  description: 补贴资金不应通过乡镇、村层级转拨发放。若资金经过乡镇或村账户，并以现金等非直发方式支付，或者从拨付到最终发放至农户之间的时间明显过长（如超过2周），则表明存在层层转拨和资金滞留问题。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 补贴资金层层拨付至乡镇村发放
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（六）\",\n    \"内容概述\": \"补贴资金应由财政部门通过国库集中支付系统直接发放到受益人社会保障卡，严禁通过乡镇、村组转拨代发。\"\n  }\n]"
- expression: (不动产登记信息与住房保障名单比对表.申请人及家庭成员名下房产数量 > 0) || (家庭收入与个人所得税缴纳比对表.收入反推数据 > 当地租赁补贴收入标准) || (租赁补贴资金发放流水表.收款账户重复且对应不同收款人)
    || (住房保障申请家庭信息表.住房情况为空或重复)
  description: 家庭名下拥有任何自有房产即不符合补贴条件；税务反推收入超过准入标准，可能隐瞒真实收入；同一银行账户为多个不同家庭收取补贴，可能系虚假租赁集中套取；租赁合同未进行备案或不同申请人使用相同备案号，合同真实性存疑。满足任一条件触发疑点。
  audit_item: 不符合条件的家庭违规获取住房保障待遇
  suspicion: 隐瞒房产或虚假租赁骗取租赁补贴
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部 财政部关于公共租赁住房和廉租住房并轨运行的通知\",\n    \"法规文号\": \"建保〔2013〕178号\",\n    \"效力级别\":\
    \ \"部门规范性文件\",\n    \"条款号\": \"三、健全准入退出机制\",\n    \"内容概述\": \"严格审核保障对象资格，租赁补贴发放对象应当为符合条件的无房家庭，严禁通过虚报瞒报骗取补贴。\"\n  }\n]"
- expression: (渠道清单.渠道类型 == '互联网' || 渠道清单.渠道类型 == '电话') && (证明文件.批准文件编号 == NULL || 证明文件.批准渠道 != 渠道清单.渠道标识) && 流水表.交易金额 > 0
  description: 当渠道清单中存在互联网或电话销售类型，但无法提供相应的合规性证明文件，或证明文件批准的渠道与清单渠道不一致，且对应渠道有实际资金流水时，判定为违规销售。存在流水但无批文即为可疑。
  audit_item: 彩票资金筹集审计常见违法违规问题
  suspicion: 违规开展互联网或电话销售彩票业务
  regulation: "[\n  {\n    \"法规名称\": \"彩票管理条例\",\n    \"法规文号\": \"国务院令第554号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三条、第三十八条\"\
    ,\n    \"内容概述\": \"国务院特许发行彩票。未经国务院批准，禁止擅自利用互联网销售彩票。违反规定擅自利用互联网销售彩票的，由财政部门责令改正，没收违法所得，并处罚款。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于严厉查处擅自利用互联网销售彩票的通知\",\n    \"法规文号\": \"财综〔2018〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"全文\",\n    \"内容概述"
- expression: 转出方、转入方、转包层级.转包层级 >= 2 || (禁止转包条款、承包方名称、承包范围.禁止转包条款 == '是' && 转出方、转入方、转包层级.转出方 != 禁止转包条款、承包方名称、承包范围.承包方名称) ||
    (收款方名称、付款方名称、渠道标识、交易金额、交易时间.收款方名称 != 禁止转包条款、承包方名称、承包范围.承包方名称 && 收款方名称、付款方名称、渠道标识、交易金额、交易时间.收款方名称 不在 转出方、转入方、转包层级.转入方 中)
  description: 转包层级超过一级，或合同明确禁止转包但存在转包关系，或资金流向主体与合同承包方不一致且转包关系表未体现，均推定为违规转包。资金流向与合同主体不匹配可能指向隐性转包。
  audit_item: 彩票资金筹集审计常见违法违规问题
  suspicion: 违规转包彩票经营权
  regulation: "[\n  {\n    \"法规名称\": \"彩票管理条例\",\n    \"法规文号\": \"国务院令第554号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十五条\"\
    ,\n    \"内容概述\": \"彩票代销合同应当约定双方权利义务，代销者不得转手代销彩票。\"\n  },\n  {\n    \"法规名称\": \"彩票管理条例实施细则\",\n    \"法规文号\": \"财政部 民政部\
    \ 国家体育总局令第67号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"彩票代销者应当按照彩票代销合同的约定销售彩票，不得委托他人代销彩票。\"\
    \n  }\n]"
- expression: ((发放台账.发放日期 - 发放台账.接收日期) > 分配时限要求.分配时限要求) || ((流水表.拨出日期 - 流水表.资金到账日期) > 规定拨付时限) || (登记表.库存状态 > 0 && (系统当前日期
    - 登记表.入库日期) > 规定存储期限)
  description: 救灾物资应在接收后24小时内分配，资金应在到账后3个工作日内拨付。超出上述时限或物资长期积压即构成分配不及时。需结合延迟说明排除因交通中断、二次转运等不可抗力导致的延迟。
  audit_item: 未及时足额发放待遇
  suspicion: 救灾款物接收后未及时分配
  regulation: "[\n  {\n    \"法规名称\": \"自然灾害救助条例\",\n    \"法规文号\": \"国务院令第577号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十二条\",\n    \"内容概述\": \"受灾地区人民政府民政部门……应当在确保安全的前提下，对受灾人员进行过渡性安置，并及时发放救助资金和物资。\"\n  }\n]"
- expression: (发放台账.接收总额 - 发放台账.发放总额 > 0) || (拨出日期、拨出金额、支出用途.拨入金额 - 拨出日期、拨出金额、支出用途.拨出金额 > 0) || (发放台账.受益人签收金额 < 应发标准金额)
  description: 接收总额大于发放总额，即存在资金或物资去向不明，未足额发放；专项资金中有部分被用于非救灾支出，说明存在挪用；个别受益人实收金额低于应发标准，可能存在截留。以上任一条件触发均指示违规。
  audit_item: 未及时足额发放待遇
  suspicion: 救灾款物被截留挪用未足额发放
  regulation: "[\n  {\n    \"法规名称\": \"自然灾害救助条例\",\n    \"法规文号\": \"国务院令第577号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十四条\",\n    \"内容概述\": \"自然灾害救助款物应当用于受灾人员的紧急转移安置、基本生活救助……不得截留、挪用。\"\n  }\n]"
- expression: (流水表.收款方 NOT IN 合规安居工程项目单位清单) || (流水表.用途摘要 NOT LIKE '%保障房%' && 支付金额>100万) || (SUM(应下达金额) - SUM(支付金额) > 截留阈值)
  description: 合规清单为各地住建部门或项目单位；用途未包含保障房关键字且大额的为可疑；应拨付与已拨付至项目金额差额超过5%且无在途说明的，视为截留。
  audit_item: 财政部门未按规定分配下达保障性安居工程专项资金
  suspicion: 中央财政部门截留或挪用专项资金
  regulation: "[\n  {\n    \"法规名称\": \"中央财政城镇保障性安居工程补助资金管理办法\",\n    \"法规文号\": \"财综〔2022〕1号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十五条\",\n    \"内容概述\": \"补助资金必须专项用于保障性安居工程，任何单位不得截留、挪用、挤占。\"\n  }\n]"
- expression: (融资业务收费明细台账.收费项目 IN ('财务顾问费', '融资咨询费', '资金管理费') && 贷款合同.服务内容条款 IS NULL) || (融资业务收费明细台账.收费项目 IN ('财务顾问费', '融资咨询费',
    '资金管理费') && NOT EXISTS (SELECT 1 FROM 交付成果记录 WHERE 客户名称 = 融资业务收费明细台账.客户名称 AND 服务内容 = 融资业务收费明细台账.收费项目))
  description: 筛选出收费项目为监管明令禁止或需提供实质性服务的费用（如财务顾问费），但贷款合同中未约定具体服务内容，或无法提供任何如服务报告、咨询记录等交付成果的，判定为虚构服务违规收费。
  audit_item: 金融机构或管理单位违规收取不合理融资中间费用
  suspicion: 无实质性服务收取财务顾问费
  regulation: "[\n  {\n    \"法规名称\": \"中国银保监会 工业和信息化部 发展改革委 财政部 人民银行 市场监管总局关于进一步规范信贷融资收费 降低企业融资综合成本的通知\",\n    \"法规文号\": \"\
    银保监发〔2020〕18号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"银行不得收取信贷资金受托支付划拨费。对于已划拨但企业暂未使用的信贷资金，不得收取资金管理费。对于小微企业信贷融资，不得在贷款合同中约定提前还款或延迟用款违约金，取消法人账户透支承诺费和信贷资信证明费。\"\
    \n  },\n  {\n    \"法规名称\": \"商业银行服务价格管理办"
- expression: (融资业务收费明细台账.收费项目 IN ('抵押物评估费', '抵押登记费', '公证费') && 贷款合同.费用承担方条款 != '银行承担') || ( EXISTS (SELECT 1 FROM 客户账户交易流水表
    WHERE 收款方 IN (SELECT 合作方名称 FROM 与合作机构的合作协议 WHERE 返点条款 IS NOT NULL) AND 付款方 = 融资业务收费明细台账.客户名称 AND 交易金额 = 融资中间费用收取凭证.金额
    ))
  description: 监管规定抵押品评估等相关费用应由银行承担。若贷款合同中约定此类费用由企业承担，或虽然形式上由企业支付，但收款方与银行存在利益分成关系，则判定为转嫁成本。通过资金流水追踪收款方与银行的关联关系是发现隐蔽违规的关键。
  audit_item: 金融机构或管理单位违规收取不合理融资中间费用
  suspicion: 向借款企业转嫁抵押评估等费用
  regulation: "[\n  {\n    \"法规名称\": \"中国银保监会 工业和信息化部 发展改革委 财政部 人民银行 市场监管总局关于进一步规范信贷融资收费 降低企业融资综合成本的通知\",\n    \"法规文号\": \"\
    银保监发〔2020〕18号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条第（一）款\",\n    \"内容概述\": \"除银团贷款外，商业银行不得向小微企业收取贷款承诺费、资金管理费，严格限制向小微企业收取财务顾问费、咨询费等费用。银行业金融机构应承担信贷融资各环节的尽职调查、授信审批、贷款发放、资金监管、贷后管理等责任，不得将上述职责转为收费项目。\"\
    \n  },\n  {\n   "
