name: audit/数据表格类/清单表
type: model
description: 从数据表格类类文档（清单表）中提取结构化元数据。涵盖字段如：与取水口距离、中标金额、主体类型、位置坐标、使用部门、出让起始价、列入清单时间、到期日期。文档范围包括：专项资金项目清单表（含实施状态）、供餐单位餐饮服务许可证清单表、农村供水工程清单表、农村公路规划项目库清单表、农村黑臭水体排查清单表、国有资产配置清单表、土地招拍挂项目清单表、大型规模养殖场粪污处理设施清单表、政府投资项目清单表、村庄分类清单表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 合同
- 工程
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 清单表
  member_count: 1
  member_details:
  - 专项资金项目清单表（含实施状态）
  - 供餐单位餐饮服务许可证清单表
  - 农村供水工程清单表
  - 农村公路规划项目库清单表
  - 农村黑臭水体排查清单表
  - 国有资产配置清单表
  - 土地招拍挂项目清单表
  - 大型规模养殖场粪污处理设施清单表
  - 政府投资项目清单表
  - 村庄分类清单表
  - 水源保护区污染源清单表
  - 项目清单表
  - 黑臭水体治理问题清单表
