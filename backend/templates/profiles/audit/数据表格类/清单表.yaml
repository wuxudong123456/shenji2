violations:
- expression: (清单表.单价 > 标准文件.配置标准单价上限) || (清单表.数量 > 标准文件.配置标准数量上限 && 审批单.豁免审批文件编号 == null)
  description: 将实际配置资产单价或数量与财政/行业配置标准上限逐一比对，单价超出或数量超出且无合规豁免审批文件时，判定为超标准配置国有资产。
  audit_item: 违反规定配置国有资产
  suspicion: 超标准配置国有资产
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十一条\",\n    \"内容概述\": \"各部门及其所属单位应当根据依法履行职能和事业发展的需要，结合资产存量、资产配置标准、绩效目标和财政承受能力配置资产，资产配置重大事项应当经可行性研究和集体决策。\"\n  }\n\
    ]"
- expression: (对比表.合规性判断 == '不合规' && 对比表.违规类型 == '与项目无关的资质要求') && (信息表[地块编号].竞买人数量 < 3)
  description: 当资质条件设置与政策要求对比表判定资质要求不合规且违规类型确认为无关资质，同时该地块符合条件的竞买人少于3家，表明竞争受限，触发违规疑点。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 设置与项目无关的资质要求
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让人在招标拍卖挂牌出让公告中不得设定影响公平、公正竞争的限制条件。\"\n  },\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有土地使用权规范\"\
    ,\n    \"法规文号\": \"国土资发〔2006〕114号\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第5.4.2条\",\n    \"内容概述\": \"竞买资格条件不得设置要求特定行业、特"
- expression: (资质条件设置与政策要求对比表.违规类型 == '量身定制排他条款') && (信息表[地块编号].竞买人数量 == 1) && (流程记录[地块编号].定向出让批示 == '是' || 竞得单位提前介入土地规划 ==
    '是')
  description: 当资质条款与特定竞买人高度吻合，导致仅有一家符合条件，且存在会议纪要或批示显示定向出让意图，或竞得企业提前参与规划，判定为排他性条款违规。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 量身定制排他性条款
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让人在招标拍卖挂牌出让公告中不得设定影响公平、公正竞争的限制条件，禁止为特定竞买人量身定制条件。\"\n  },\n  {\n    \"法规名称\": \"\
    关于落实工业用地招标拍卖挂牌出让制度有关问题的通知\",\n    \"法规文号\": \"国土资发〔2007〕78号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"\
    内容概述\": \""
- expression: (对比表.违规类型 == '不合理技术参数') && (ABS(详细规划.规划建筑高度) / 详细规划.规划建筑高度 > 0.3 || 存在单一来源进口设备强制要求) && (信息表[地块编号].竞买人数量 <= 2)
  description: 当出让文件中的技术参数如建筑高度、设备来源等与区域控规或常规标准偏差超过30%，或强制要求采用某国进口设备，且同时满足竞买人不足3家时，视为通过不合理参数变相指定竞买人。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 设置不合理的技术参数
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让公告不得设定影响公平竞争的限制条件，包括通过不合理技术参数排斥潜在竞买人。\"\n  },\n  {\n    \"法规名称\": \"城乡规划法\",\n\
    \    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十三条\",\n    \"内容概述\": \"建设用地规划许可证确定的规划条件，任何单位不得擅自变更。"
- expression: (资质条件设置与政策要求对比表.违规类型 == '本地化限制') && (竞买人报名信息表汇总表[地块编号].竞买人数量 == 0 || 本地纳税额 > 同期同类企业年均纳税额3倍)
  description: 当出让文件要求竞买人须在本县注册满3年或纳税额超1亿元等地方保护条款，导致外地企业完全被排除，或设定的纳税标准远高于正常水平（>3倍），判定违规。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 违规设置本地化限制
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"禁止设定影响公平竞争的限制条件，包括地域歧视条款。\"\n  },\n  {\n    \"法规名称\": \"公平竞争审查制度实施细则\",\n    \"\
    法规文号\": \"国市监反垄规〔2021〕2号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"不得限定为本地区注册、在本地区纳税或要求须在本地设立分支机构等影响公平"
- expression: (保证金与起始价比对表.保证金比例 > 0.5) && (信息表[地块编号].是否缴纳保证金 < 3 || 存在放弃竞买记录) || (出让合同.付款时间要求 <= 3个自然日  && 出让合同.首付比例 == 1.0
    && 竞买人报名数量 == 1)
  description: 保证金比例超过50%（远高于常规的20%）或要求成交后3日内一次性付清全部出让金，且出现大量弃购或唯一竞买人情形的，判定为通过资金门槛操纵排斥竞争。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 操纵保证金或付款条件
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让公告不得设定影响公平竞争的其他条件，包括通过不合理的保证金或付款要求限制竞买人。\"\n  },\n  {\n    \"法规名称\": \"关于落实工业用地招标拍卖挂牌出让制度有关问题的通知\"\
    ,\n    \"法规文号\": \"国土资发〔2007〕78号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条第（三）款\",\n    \"内容概述\": \"竞买"
- expression: 对比表.违规类型 == '违规产业配套' && (出让合同.附加产业配套条款 == '无偿代建内容' > 0.3 * 清单表.出让起始价 || 出让合同.合同条款 == '附加产业配套条款') && (出让合同.地块编号
    == '受让人'.地块编号 < 3)
  description: 住宅或商服用地上强制要求无偿代建大型公共设施或引进世界500强总部等，若代建成本超过土地起始价的30%或产业要求明显超出地块辐射能力且无合理政策依据，导致报名少于3家，则构成利用附加条件限制竞争。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 违规设置产业配套要求
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让公告不得设定影响公平竞争的限制条件，附加不合理产业配套要求实质上提高了进入门槛。\"\n  },\n  {\n    \"法规名称\": \"节约集约利用土地规定\"\
