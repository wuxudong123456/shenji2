name: audit/数据表格类/执行表
type: model
description: 从数据表格类类文档（执行表）中提取结构化元数据。涵盖字段如：年度计划文号、年度计划项目编码、是否紧急追加、资金规模、项目名称、项目清单。文档范围包括：年度建设项目计划执行表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 执行表
  member_count: 1
  member_details:
  - 年度建设项目计划执行表
output:
  fields:
  - name: 年度计划文号
    type: date
    description: 提取 年度计划文号 的日期值，格式 YYYY-MM-DD
  - name: 年度计划项目编码
    type: date
    description: 提取 年度计划项目编码 的日期值，格式 YYYY-MM-DD
  - name: 是否紧急追加
    type: boolean
    description: 提取 是否紧急追加 的布尔值（是/否）
  - name: 资金规模
    type: string
    description: 提取 资金规模 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 项目清单
    type: string
    description: 提取 项目清单 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 规划项目库清单为空 || (规划项目库清单.项目编码存在重复) || (抽取30%项目，其中任一项目无工可批复或无环评批复 || 投资估算字段缺失 || 时序安排字段缺失)
  description: 制度文件要求建立项目库但事实上未建立，或项目库清单中无数据；或项目编码不唯一；或抽查项目中缺少立项、环评等前期要件，或缺失关键字段（投资估算、时序安排），即判定违规。
  audit_item: 项目规划及资金使用不符合规定
  suspicion: 未同步建立农村公路建设规划项目库
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条\",\n    \"内容概述\": \"农村公路建设规划应当与国民经济和社会发展规划、土地利用总体规划、城乡规划等内容相衔接，建立规划项目库，实行动态管理。\"\n  }\n]"
- expression: 年度建设项目计划执行表.年度计划文号缺失 || (年度建设项目计划执行表.项目数量为0) || (年度建设项目计划执行表.资金规模与建设项目资金使用台账.年度实际拨付资金偏差率>20%)
  description: 无经政府批复的年度计划文号或计划表为空，即判定未编制年度计划；若存在计划但实际拨付资金与计划资金偏差过大（超±20%），反证计划未起到约束作用。
  audit_item: 项目规划及资金使用不符合规定
  suspicion: 未编制农村公路建设项目年度计划
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"县级以上地方交通运输主管部门应当根据农村公路建设规划，编制农村公路建设项目年度计划，并报上一级交通运输主管部门备案。\"\n  }\n]"
- expression: 年度建设项目计划执行表.项目编码 NOT IN (规划项目库清单.项目编码) && (项目调整审批记录中无对应增补入库审批文号 || 无补录论证材料)
  description: 将年度计划项目清单与规划项目库进行比对，若项目编码在项目库中不存在，且无法提供正式的补录审批和完整论证材料，即认定为年度计划包含非入库项目，属于违规。
  audit_item: 项目规划及资金使用不符合规定
  suspicion: 年度计划包含不在规划项目库中的项目
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十条、第十二条\",\n    \"内容概述\": \"未纳入规划项目库的项目，不得列入年度计划。农村公路建设项目年度计划应当依据规划项目库编制。\"\n  }\n]"
- expression: 年度计划项目编码 NOT IN (规划项目库项目编码) && 项目调整审批记录中不存在该项目的‘同意增补’记录
  description: 将年度计划项目与规划项目库进行编码关联，筛选出不在库中的项目，再核查这些项目是否有合规的入库增补审批，无审批则违规。
  audit_item: 项目规划及资金使用不符合规定
  suspicion: 年度计划项目超出规划项目库范围
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条、第十五条\",\n    \"内容概述\": \"规划项目库是编制年度计划的基础，未纳入项目库的项目原则上不得列入年度建设计划。\"\n  }\n]"
