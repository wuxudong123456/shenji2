    \   \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有下列违反规定使用、骗取财政资金的行为之一的，责令改正，调整有关会计账目，追回有关财政资金，限期退还违法所得。……（四）以虚报、冒领等手段骗取财政资金。\"\
    \n  },\n  {\n    \"法规名称\": \"中央财政渔业发展补助资金管理办法\",\n    \"法规文号\": \"财农〔2021〕24号\",\n    \"效力级别\": \"部门规章\",\n    \""
- expression: (对比表.是否占压基本农田 == '是') && (比对表.实际养殖水面面积 < 项目总面积的30% || 比对表.显示设施完好变化 == '是')
  description: 当项目用地坐标与永久基本农田图斑重叠，且在同一地块上水稻实际种植面积比例低于30%（稻渔综合种养要求水稻为主要种植），或者出现固化养殖池等永久性破坏耕作层的设施，即认定为假借稻渔名义违规占用基本农田。
  audit_item: 水产养殖补助项目建设运营管护不合规
  suspicion: 假借稻渔综合种养名义占用永久基本农田
  regulation: "[\n  {\n    \"法规名称\": \"基本农田保护条例\",\n    \"法规文号\": \"国务院令第257号（2011年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十七条、第三十三条\",\n    \"内容概述\": \"禁止任何单位和个人在基本农田保护区内建窑、建房、建坟、挖砂、采石、采矿、取土、堆放固体废弃物或者进行其他破坏基本农田的活动。违反本条例规定，占用基本农田建窑、建房、建坟、挖砂、采石、采矿、取土、堆放固体废弃物或者从事其他活动破坏基本农田，毁坏种植条件的，由县级以上人民政府土地行政主管部门责令改正或者治理，恢复原种植条件，处占用基本农田的耕地开垦费1倍以上"
- expression: (NOW_DATE - 项目清单.建成时间 > 365天) && (比对表.划入日期 IS NULL || 比对表.划入日期 - 项目清单.建成时间 > 365天)
  description: 高标准农田建成后超过1年仍未划入永久基本农田，或实际划入日期晚于建成日期1年以上，构成未及时划入违规。建成时间以验收报告中确定的日期为准。
  audit_item: 违反高标农田建后管护及使用规定的行为
  suspicion: 已建成高标准农田未及时划入永久基本农田
  regulation: "[\n  {\n    \"法规名称\": \"基本农田保护条例\",\n    \"法规文号\": \"国务院令第257号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十五条第二款\",\n    \"内容概述\": \"已建成的高标准农田应当及时划入基本农田保护区，具体期限由省级人民政府规定。\"\n  },\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\"\
    ,\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"三（八）\",\n    \"内容概述\": \"建成的高标准农田要划为永"
- expression: EXISTS (SELECT 1 FROM 跨部门规划重叠区域清单 WHERE 重叠面积 > 0) OR EXISTS (SELECT 1 FROM 重复建设项目比对表)
  description: 一旦跨部门规划重叠区域清单中存在记录，或者重复建设项目比对表中有同一地块不同项目信息，就认定规划不衔接或存在重复投资建设，无需设置阈值。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 高标准农田规划与国土空间、水资源等专项规划冲突
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\",\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\"\
    : \"国务院规范性文件\",\n    \"条款号\": \"第四部分\",\n    \"内容概述\": \"加强规划衔接，将高标准农田建设规划与国土空间规划、水资源利用规划等充分衔接，避免规划冲突和重复建设，确保一张蓝图绘到底。\"\
    \n  }\n]"
- expression: EXISTS (SELECT 1 FROM 项目选址坐标与禁限区域比对表 WHERE 重叠面积 > 0)
  description: 项目选址坐标与任何法定禁止或限制建设区域存在空间重叠，无论面积大小，均直接判定为选址违规。
  audit_item: 高标准农田项目规划不符合相关规定
  suspicion: 高标准农田建设项目选址涉及禁止或限制建设区域
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于切实加强高标准农田建设提升国家粮食安全保障能力的意见\",\n    \"法规文号\": \"国办发〔2019〕50号\",\n    \"效力级别\"\
    : \"国务院规范性文件\",\n    \"条款号\": \"第三部分\",\n    \"内容概述\": \"严禁在生态保护红线区域、重要湿地保护区、河流湖库管理范围、地下水严重超采区等区域开展高标准农田建设，确保建设区域生态安全。\"\
    \n  }\n]"
- expression: (住房保障申请家庭信息表.收入 > 住房保障政策文件.准入收入标准) || (不动产登记信息与住房保障名单比对表.房产面积 > 0) || (公租房实物配租名单.同一身份证号存在多条不同区域配租记录) || (家庭收入与个人所得税缴纳比对表.收入反推数据
    > 住房保障政策文件.准入收入标准 && 住房保障申请家庭信息表.申报年收入 < 家庭收入与个人所得税缴纳比对表.收入反推数据*0.7)
  description: 家庭人均年收入超过当地公布的公租房收入准入线；家庭成员名下有任何房产即不符合无房或住房困难条件；同一身份证号在不同城区或不同项目有实物配租记录，存在重复享受；当税务或社保反推收入高于政策收入线，且申报收入低于反推收入的70%时，视为虚假收入申报。以上任一条件满足即触发疑点。
  audit_item: 不符合条件的家庭违规获取住房保障待遇
  suspicion: 家庭收入或房产超标违规获取公租房
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七条、第三十一条\",\n    \"内容概述\": \"申请公共租赁住房，应当符合在本地无住房或者住房面积低于规定标准、收入财产低于规定标准等条件；申请人隐瞒有关情况或提供虚假材料的，取消保障资格，并记入信用档案。\"\n\
    \  }\n]"
- expression: (表3.被拆迁人身份证号对应不动产登记信息中, 被拆迁房屋产权人与被拆迁人不一致且无合法继承或转让证明) || (表3.被拆迁人户籍不在拆迁范围内) || (表1.该家庭已享受公租房或租赁补贴等住房保障福利) ||
    (表3.同一房产证号重复发放补偿) || (表3.补偿时间早于审批时间)
  description: 被拆迁房屋产权登记人与补偿名单不一致，且无法提供合法获取产权的依据；被拆迁人户籍不在项目征收范围内；该家庭同时享受其他住房保障，属于重复享受；同一房产证号多次出现在补偿发放记录中；补偿发放时间早于审批通过时间，程序倒置。任一条件满足即触发疑点。
  audit_item: 不符合条件的家庭违规获取住房保障待遇
  suspicion: 虚假或违规享受棚改拆迁安置补偿
  regulation: "[\n  {\n    \"法规名称\": \"国有土地上房屋征收与补偿条例\",\n    \"法规文号\": \"国务院令第590号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十四条\",\n    \"内容概述\": \"市、县级人民政府作出房屋征收决定前，应当组织有关部门依法对征收范围内未经登记的建筑进行调查、认定和处理。对认定为违法建筑和超过批准期限的临时建筑的，不予补偿。\"\n  }\n\
    ]"
- expression: (不动产登记信息与住房保障名单比对表.申请人及家庭成员名下房产数量 > 0) || (家庭收入与个人所得税缴纳比对表.收入反推数据 > 当地租赁补贴收入标准) || (租赁补贴资金发放流水表.收款账户重复且对应不同收款人)
    || (住房保障申请家庭信息表.住房情况为空或重复)
  description: 家庭名下拥有任何自有房产即不符合补贴条件；税务反推收入超过准入标准，可能隐瞒真实收入；同一银行账户为多个不同家庭收取补贴，可能系虚假租赁集中套取；租赁合同未进行备案或不同申请人使用相同备案号，合同真实性存疑。满足任一条件触发疑点。
  audit_item: 不符合条件的家庭违规获取住房保障待遇
  suspicion: 隐瞒房产或虚假租赁骗取租赁补贴
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部 财政部关于公共租赁住房和廉租住房并轨运行的通知\",\n    \"法规文号\": \"建保〔2013〕178号\",\n    \"效力级别\":\
    \ \"部门规范性文件\",\n    \"条款号\": \"三、健全准入退出机制\",\n    \"内容概述\": \"严格审核保障对象资格，租赁补贴发放对象应当为符合条件的无房家庭，严禁通过虚报瞒报骗取补贴。\"\n  }\n]"
- expression: (比对表.身份证号 IN (信息表.参保人身份证号) && 信息表.参保地区 DISTINCT && 信息表.参保状态 = '正常参保') && (明细表.发票号码 GROUP BY 明细表.报销地区 COUNT >
    1)
  description: 一个身份证号在多个地区同时正常参保即构成重复参保；在此基础上，若同一张医疗发票在多个地区进行了报销，即构成重复报销骗取医保基金。
  audit_item: 向不符合条件的人员发放保障待遇
  suspicion: 跨地区重复参加医保并重复报销医疗费用
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国社会保险法》\",\n    \"法规文号\": \"中华人民共和国主席令第三十五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第八十八条\",\n    \"内容概述\": \"以欺诈、伪造证明材料或者其他手段骗取社会保险待遇的，由社会保险行政部门责令退回骗取的社会保险金，处骗取金额二倍以上五倍以下的罚款。\"\n  }\n]"
- expression: (COUNT(比对表 WHERE 账户状态='正常' GROUP BY 身份证号) > 1) && (EXISTS (SELECT 缴存月份 FROM (SELECT 身份证号, 缴存月份, 管理中心归属 FROM
    信息表) GROUP BY 身份证号, 缴存月份 HAVING COUNT(DISTINCT 管理中心归属) > 1))
  description: 基于跨中心缴存记录比对表，当同一身份证号在2个及以上公积金管理中心均存在正常状态账户，且缴存明细中存在同一缴存月份不同管理中心同时有缴存记录的情况，即判定为跨中心重复缴存违规。若无跨中心比对表，则需通过身份证号+姓名模糊匹配各中心数据，逻辑相同。阈值设为不同管理中心正常账户数>1，且存在月份内多中心缴存重叠。
  audit_item: 多个账户重复缴存住房公积金
  suspicion: 同一人在多个公积金管理中心重复设立正常缴存账户
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"每个职工只能有一个住房公积金账户。单位应当到住房公积金管理中心办理住房公积金缴存登记，并为本单位职工办理住房公积金账户设立手续。\"\n  }\n]"
- expression: ABS(比对表.销售金额 * 比对表.应缴比例 - 比对表.实缴金额) > 0 && (比对表.上缴时间 - 明细表.收入确认日期) > 管理办法.上缴时限
  description: 比较应缴金额（销售金额×应缴比例）与实缴金额，差异绝对值大于0即为截留疑点；若上缴时间超过规定的上缴时限，加重违规判定。通常应缴比例按现行政策执行，上缴时限不超过次月中旬。
  audit_item: 彩票资金管理使用审计常见违法违规问题
  suspicion: 截留彩票资金未足额上缴
  regulation: "[\n  {\n    \"法规名称\": \"彩票管理条例\",\n    \"法规文号\": \"国务院令第554号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十三条\"\
    ,\n    \"内容概述\": \"彩票发行机构、彩票销售机构应当按照国务院财政部门的规定，及时、足额上缴彩票公益金和彩票发行费，不得截留或者挪作他用。\"\n  }\n]"
- expression: (比对表.死亡日期 IS NOT NULL && 明细表.发放日期 > 比对表.死亡日期) || (COUNT(信息台账.身份证号) OVER (PARTITION BY 信息台账.身份证号) > 1) || (记录表.异常类型
    IN ('非本人账户代领','多人共用账户'))
  description: 条件1：死亡日期早于发放日期，说明已死亡仍发放资金，属家属冒领；条件2：同一身份证号在多地存在有效记录，说明重复享受抚恤待遇；条件3：银行流水异常类型为非本人代领或多人共用同一账户，说明资金被冒领或账户混用。任一条件触发即视为冒领疑点。
  audit_item: 抚恤优待对象违反抚恤优待政策
  suspicion: 冒领抚恤金、优待金、补助金
  regulation: "[\n  {\n    \"法规名称\": \"军人抚恤优待条例\",\n    \"法规文号\": \"国务院、中央军委令第788号（2024年修订）\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"抚恤优待对象被判处有期徒刑、剥夺政治权利或者被通缉期间，中止其抚恤优待；弄虚作假、伪造证明材料骗取抚恤金、优待金、补助金的，由县级以上地方人民政府退役军人事务部门给予警告，限期退回非法所得；情节严重的，停止其享受的抚恤优待；构成犯罪的，依法追究刑事责任。\"\
    \n  }\n]"
