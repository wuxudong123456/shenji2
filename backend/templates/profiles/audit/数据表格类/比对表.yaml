name: audit/数据表格类/比对表
type: model
description: 从数据表格类类文档（比对表）中提取结构化元数据。涵盖字段如：上缴时间、不动产登记信息、不动产登记过户状态、交叉验证状态、住房保障系统认定年限、保证金比例、关联银行卡号列表、出现地区。文档范围包括：不动产登记与住房保障系统差异比对表、不动产登记信息与住房保障名单比对表、保证金与起始价比对表、卫星遥感监测图斑比对表、同一房产多次提取关联人员比对表、基础数据校验比对表、多卡发放同一户补贴关联比对表、多部门数据交叉比对表、家庭收入与个人所得税缴纳比对表、彩票销售数据与资金上缴比对表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 登记
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 比对表
  member_count: 1
  member_details:
  - 不动产登记与住房保障系统差异比对表
  - 不动产登记信息与住房保障名单比对表
  - 保证金与起始价比对表
  - 卫星遥感监测图斑比对表
  - 同一房产多次提取关联人员比对表
  - 基础数据校验比对表
  - 多卡发放同一户补贴关联比对表
  - 多部门数据交叉比对表
  - 家庭收入与个人所得税缴纳比对表
  - 彩票销售数据与资金上缴比对表
  - 死亡人员销户信息与抚恤对象名单比对表
  - 永久基本农田数据库与高标准农田比对表
  - 物资质检结果比对表
  - 申报单位历史申报项目比对表
  - 社保缴纳比对表
  - 评标评分比对表
  - 跨中心缴存记录比对表
  - 跨地区数据比对表
  - 跨部门数据比对表
  - 重复建设站点坐标比对表
  - 重复建设项目比对表
  - 重复申领补助资金交叉比对表
  - 项目选址坐标与禁限区域比对表
