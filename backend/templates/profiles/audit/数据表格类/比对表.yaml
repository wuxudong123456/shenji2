violations:
- expression: ((ABS(比对表.投标总价 - 记录表.最终标底金额) / 记录表.最终标底金额 < 0.02) 的比对表.各投标人名称数量 >= 2) || (日志.访问目标文件（标底文件） = '标底文件' AND 日志.操作人
    NOT IN (记录表.知悉人员清单))
  description: 两家及以上投标人报价与标底偏差率低于2%，或存在非授权人员访问标底文件，即触发泄露标底疑点。偏差率阈值2%基于审计实务中围标、串标典型特征。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 招标人违法泄露标底
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款；对单位直接负责的主管人员和其他直接责任人员依法给予处分；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
- expression: ABS({因素名称.数据值} - {差异说明.真实值}) > 0 || ({因素名称.数据时间节点} 距离分配年度 > 3) || ({验证数据差异结论.验证数据差异结论} = '不可接受' && {分配金额.分配金额}
    使用该因素数据值计算)
  description: 数据采集值与校验真实值存在任何绝对值差异，或引用数据年份距分配年度超过3年（时效性超标），或第三方验证报告判定数据不可信且该数据被用于计算金额，均判定为基础数据错误导致分配偏差。
  audit_item: 财政转移支付预算分配不科学
  suspicion: 分配引用基础数据错误
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条、第五十七条\"\
    ,\n    \"内容概述\": \"各级政府预算编制应依据真实、准确的数据；各部门应完整、准确地向财政部门提供预算编制所需数据。\"\n  }\n]"
- expression: (保证金与起始价比对表.保证金比例 > 0.5) && (信息表[地块编号].是否缴纳保证金 < 3 || 存在放弃竞买记录) || (出让合同.付款时间要求 <= 3个自然日  && 出让合同.首付比例 == 1.0
    && 竞买人报名数量 == 1)
  description: 保证金比例超过50%（远高于常规的20%）或要求成交后3日内一次性付清全部出让金，且出现大量弃购或唯一竞买人情形的，判定为通过资金门槛操纵排斥竞争。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 操纵保证金或付款条件
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让公告不得设定影响公平竞争的其他条件，包括通过不合理的保证金或付款要求限制竞买人。\"\n  },\n  {\n    \"法规名称\": \"关于落实工业用地招标拍卖挂牌出让制度有关问题的通知\"\
    ,\n    \"法规文号\": \"国土资发〔2007〕78号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条第（三）款\",\n    \"内容概述\": \"竞买"
- expression: (EXISTS (SELECT * FROM 重复建设站点坐标比对表 A, 重复建设站点坐标比对表 B WHERE 距离(A.站点坐标, B.站点坐标) < 5公里 AND (A.管理归属部门 != B.管理归属部门)
    AND 多站合一整合情况对比表.整合标志 != true))
  description: 地理距离小于5公里且管理分散、功能高度重叠的服务站点未进行整合，违背“多站合一、一点多能”政策要求。
  audit_item: 信息进村入户、电子商务进农村等村级服务站使用效果不佳
  suspicion: 同一区域重复建设服务站未实现资源整合
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于推进基层综合性文化服务中心建设的指导意见\",\n    \"法规文号\": \"国办发〔2015〕74号\",\n    \"效力级别\": \"\
    行政法规\",\n    \"条款号\": \"二（四）\",\n    \"内容概述\": \"统筹整合各级各类面向基层的公共资源，推动不同部门、不同用途的服务设施共建共享，实现‘多站合一、一点多能’。\"\n  }\n]"
- expression: (明细表.身份证号出现次数>1) || (改厕点经纬度坐标.GPS坐标数量 < 信息.户籍在册户数) || (明细表.发放清单数量 > 信息.户籍在册户数)
  description: 同一身份证号重复出现在不同村或不同批次发放记录、实际定位坐标数少于上报数、发放户数超出该村总户籍数均指向虚报套取。
  audit_item: 厕所改造实施不规范、质量不达标
  suspicion: 虚报改厕户数骗取套取补助资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"以虚报、冒领等手段骗取财政资金的行为，责令改正，追回有关资金，予以处罚。\"\n  }\n]"
- expression: COUNT(DISTINCT 明细表.银行卡号) GROUP BY 明细表.身份证号 > 1
  description: 按照一卡通管理要求，原则上实行一户一卡，即同一家庭成员的不同补贴均应通过同一张一卡通发放。若同一身份证号（或户主）在不同补贴项目中对应多张不同银行卡，即可能存在管理不规范，增加了冒领、多领的风险。
  audit_item: 惠农财政补贴“一卡通”管理不规范
  suspicion: 同一户主通过多张卡折发放不同补贴
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强惠民惠农财政补贴资金“一卡通”管理的指导意见\",\n    \"法规文号\": \"财农〔2020〕17号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二（六）\",\n    \"内容概述\": \"规范‘一卡通’发放管理，原则上对一人（户）一卡，清理整合各类补贴发放银行卡，确保各项补贴资金安全、及时、准确发放。\"\n  }\n\
    ]"
- expression: (汇总表.实测值 < 关键设施设计强度指标（如混凝土强度等级C30）.标准值*0.9) || (汇总表.偏差率 > 15%) || (比对表.实际养殖水面面积 < 设计面积*0.95)
  description: 当关键设施（如人工鱼礁混凝土强度、沟渠宽度）实测值低于标准值的90%，或偏差率超过15%，或建成面积严重缩水（低于设计95%）时，判定为建设质量不达标。缺陷严重程度可按偏差值进一步分级。
  audit_item: 水产养殖补助项目建设运营管护不合规
  suspicion: 水产养殖补助项目建设质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十八条、第六十四条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。违反本条例规定，施工单位在施工中偷工减料的，责令改正，处工程合同价款2%以上4%以下的罚款。\"\
    \n  },\n  {\n    \"法规名称\": \"海洋牧场建设技术规范\",\n    \"法规文号\": \"SC/T 9401-2010\",\n    \"效力级别\": \"行业规范\",\n"
- expression: (巡查记录.巡查发现的问题 < 规定巡查频率（如每周/每月）.规定巡查频率（如每周/每月）*0.5) || (保养记录表.最近一次维保日期 < 当前日期-保养周期*1.5) || (比对表.显示设施完好变化 > 项目总面积的15%)
  description: 巡查次数未达到制度规定的一半，或设备超过1.5个保养周期未维护，或从卫星影像分析设施损毁面积超过15%，即认定管护不到位。若管护资金被挪用则加重违规性质。
  audit_item: 水产养殖补助项目建设运营管护不合规
