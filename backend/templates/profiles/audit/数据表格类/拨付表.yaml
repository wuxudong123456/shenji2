name: audit/数据表格类/拨付表
type: model
description: 从数据表格类类文档（拨付表）中提取结构化元数据。涵盖字段如：实际拨付金额、拨付金额、资金到位率、资金拨付日期、资金支出进度、预算金额。文档范围包括：项目资金拨付表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 预算
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 拨付表
  member_count: 1
  member_details:
  - 项目资金拨付表
output:
  fields:
  - name: 实际拨付金额
    type: number
    description: 提取 实际拨付金额 的数值（含单位，如万元、吨等）
  - name: 拨付金额
    type: number
    description: 提取 拨付金额 的数值（含单位，如万元、吨等）
  - name: 资金到位率
    type: string
    description: 提取 资金到位率 的文本值
  - name: 资金拨付日期
    type: date
    description: 提取 资金拨付日期 的日期值，格式 YYYY-MM-DD
  - name: 资金支出进度
    type: number
    description: 提取 资金支出进度 的数值（含单位，如万元、吨等）
  - name: 预算金额
    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
