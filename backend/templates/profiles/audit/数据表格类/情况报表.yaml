name: audit/数据表格类/情况报表
type: model
description: 从数据表格类类文档（情况报表）中提取结构化元数据。涵盖字段如：实际入库金额、应入库金额、科目代码、科目名称、级次。文档范围包括：预算执行情况报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 情况报表
  member_count: 1
  member_details:
  - 预算执行情况报表
output:
  fields:
  - name: 实际入库金额
    type: number
    description: 提取 实际入库金额 的数值（含单位，如万元、吨等）
  - name: 应入库金额
    type: number
    description: 提取 应入库金额 的数值（含单位，如万元、吨等）
  - name: 科目代码
    type: string
    description: 提取 科目代码 的文本值
  - name: 科目名称
    type: string
    description: 提取 科目名称 的文本值
  - name: 级次
    type: string
    description: 提取 级次 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (非税收入缴库明细表.预算级次 != 预算管理制度.法定级次归属) OR (非税收入缴库明细表.预算科目代码 NOT IN (预算管理制度.科目代码规则)) OR (ABS(非税收入缴库明细表.金额 - 预算执行情况报表.实际入库金额)
    > 合理容差) OR (财政专户与国库对账记录.差异说明 IS NOT NULL AND 财政专户与国库对账记录.差异说明 NOT LIKE '%已更正%')
  description: 通过四类条件发现入库乱象：预算级次错挂（如中央收入入地方库）；科目错误（如一般公共预算收入放入政府性基金科目）；缴库金额与报表差异超出容差；财政专户与国库差异未及时调整。容差一般设为缴库金额的1%或1000元。
  audit_item: 不按照规定的预算级次、预算科目入库
  suspicion: 非税收入未按规定预算级次或科目缴库
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"2018年修正\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十五条\"\
    ,\n    \"内容概述\": \"预算收入征收部门和单位必须依照法律、行政法规的规定，及时、足额征收应征的预算收入，不得擅自减征、免征或者缓征，不得截留、占用或者挪用。\"\n  },\n  {\n    \"法规名称\": \"\
    财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"财政收入执收单位及其工作"
