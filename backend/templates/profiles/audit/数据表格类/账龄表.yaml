name: audit/数据表格类/账龄表
type: model
description: 从数据表格类类文档（账龄表）中提取结构化元数据。涵盖字段如：坏账准备计提比例、客户名称、账龄。文档范围包括：应收账款账龄表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 账龄表
  member_count: 1
  member_details:
  - 应收账款账龄表
output:
  fields:
  - name: 坏账准备计提比例
    type: number
    description: 提取 坏账准备计提比例 的数值（含单位，如万元、吨等）
  - name: 客户名称
    type: string
    description: 提取 客户名称 的文本值
  - name: 账龄
    type: string
    description: 提取 账龄 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (利润表.营业收入 / ((资产负债表.总资产（期初）+资产负债表.总资产（期末）)/2)) < 行业数据.行业平均总资产周转率*0.7 && (资产负债表.存货净额 / 资产负债表.总资产) > 行业均值*1.5
    && (资产负债表.应收账款净额 / 资产负债表.总资产) > 行业均值*1.5
  description: 企业总资产周转率低于行业平均水平70%，且存货占总资产比重、应收账款占总资产比重均超过行业均值的1.5倍，表明资产营运效率严重低下，资产质量可能被高估，存在未足额计提减值准备或滞销存货未及时处理的可能性。
  audit_item: 企业财务杜邦分析
  suspicion: 总资产周转率异常下滑且存货与应收账款双高
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"资产负债表日，存货应当按照成本与可变现净值孰低计量。存货成本高于其可变现净值的，应当计提存货跌价准备，计入当期损益。\"\n  },\n  {\n    \"法规名称\": \"\
    企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\": \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\"\
    : \"企业"
