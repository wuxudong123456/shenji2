name: audit/数据表格类/产品BOM表
type: model
description: 从数据表格类类文档（产品BOM表）中提取结构化元数据。涵盖字段如：标准单位耗用量。文档范围包括：产品BOM表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 产品BOM表
  member_count: 1
  member_details:
  - 产品BOM表
output:
  fields:
  - name: 标准单位耗用量
    type: string
    description: 提取 标准单位耗用量 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (领料单号.领料单号 重复) || (领料单号.数量 > 标准单位耗用量.标准单位耗用量*生产日报表.实际产量*1.1) || (领料单号.领用料单未连续编号 且 审批人不在领料流程.审批权限内)
  description: 领料单号重复表明重复报销；领用量超出标准耗用量10%以上且无超领审批单异常；单据编号不连续且审批人无权限可能为冒领。
  audit_item: 未按规定确认成本费用
  suspicion: 冒领或重复列支原材料
  regulation: "[\n  {\n    \"法规名称\": \"企业内部控制应用指引第8号——资产管理\",\n    \"法规文号\": \"财会〔2010〕11号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第六条、第八条\",\n    \"内容概述\": \"企业应当建立严格的存货领用制度，明确审批权限，定期核对实存与账存，防止浪费、被盗和流失。\"\n  },\n  {\n    \"法规名称\": \"\
    企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条、第六条第（二）款\",\n    \"内容概述\"\
    : \"存货成本包括采"
