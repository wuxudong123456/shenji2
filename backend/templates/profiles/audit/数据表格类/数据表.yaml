name: audit/数据表格类/数据表
type: model
description: 从数据表格类类文档（数据表）中提取结构化元数据。涵盖字段如：COD浓度、上报坐标、上报监测值、上报面积、不合格时间段分布、与因素对应的各地区原始数据、交通距离、产区名称。文档范围包括：全国垃圾堆放点信息系统录入数据表、农业面源污染监测点数据表、农村供电设施负荷测试数据表、农民就业增收数据表、地区经济数据表、基地耕地质量监测数据表、废弃物贮存环境监测数据表、当地资源禀赋基础数据表、惠农补贴信息管理系统数据表、房产交易登记系统数据表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 薪酬
- 元数据提取
