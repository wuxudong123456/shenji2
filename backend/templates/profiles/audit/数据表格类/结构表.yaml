name: audit/数据表格类/结构表
type: model
description: 从数据表格类类文档（结构表）中提取结构化元数据。涵盖字段如：企业总收入、其他股东信息、农业相关收入、加工收入、可分配利润、实缴出资额、我方持股比例、持股比例。文档范围包括：入园企业营收结构表、动态监测数据库结构表、参股企业股权结构表、股权结构表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 报表
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 结构表
  member_count: 1
  member_details:
  - 入园企业营收结构表
  - 动态监测数据库结构表
  - 参股企业股权结构表
  - 股权结构表
output:
  fields:
  - name: 企业总收入
    type: number
    description: 提取 企业总收入 的数值（含单位，如万元、吨等）
  - name: 其他股东信息
    type: string
    description: 提取 其他股东信息 的文本值
  - name: 农业相关收入
    type: number
    description: 提取 农业相关收入 的数值（含单位，如万元、吨等）
  - name: 加工收入
    type: number
    description: 提取 加工收入 的数值（含单位，如万元、吨等）
  - name: 可分配利润
    type: string
    description: 提取 可分配利润 的文本值
  - name: 实缴出资额
    type: string
    description: 提取 实缴出资额 的文本值
  - name: 我方持股比例
    type: number
    description: 提取 我方持股比例 的数值（含单位，如万元、吨等）
  - name: 持股比例
    type: number
    description: 提取 持股比例 的数值（含单位，如万元、吨等）
  - name: 指标字段
    type: string
    description: 提取 指标字段 的文本值
  - name: 数据更新日期
    type: date
    description: 提取 数据更新日期 的日期值，格式 YYYY-MM-DD
  - name: 是否取得财务报表
    type: boolean
    description: 提取 是否取得财务报表 的布尔值（是/否）
  - name: 是否派驻董事
    type: boolean
    description: 提取 是否派驻董事 的布尔值（是/否）
  - name: 服务收入
    type: number
    description: 提取 服务收入 的数值（含单位，如万元、吨等）
  - name: 监测点位编号
    type: string
    description: 提取 监测点位编号 的文本值
  - name: 监测频次
    type: string
    description: 提取 监测频次 的文本值
  - name: 股东名称
    type: string
    description: 提取 股东名称 的文本值
  - name: 股东类别
    type: string
    description: 提取 股东类别 的文本值
  - name: 认缴出资额
    type: string
    description: 提取 认缴出资额 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (股权结构表.股东类别 = '农民股东' AND 股权结构表.持股比例 < 0.51) || (章程.民主管理条款不包含'民主管理') || (章程.按交易额返利条款不包含'按交易额返利')
  description: 农民股东持股比例必须≥51%以体现农民主体地位；章程须明确民主管理和按交易额返利等核心合作制原则。任何一项不满足即判定为违规新建。
  audit_item: 供销合作社基层社改造不到位
  suspicion: 新建基层社未按合作制原则规范创办
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"二、拓展经营服务领域，强化为农服务（三）加强基层社建设\",\n    \"内容概述\": \"坚持合作经济基本属性，按照合作制要求，推动基层社改造升级，规范新建基层社创办。\"\n  }\n]"
- expression: (分析表.各环节交易占比 < 0.3) || (合同协议.采购量 < 0.5) || (结构表.农业相关收入 < 0.3) || (评价文件.实际达成指标 < 0)
  description: 一二三产企业间交易额占总营收比例低于30%表明产业链关联度弱；深加工企业本地原料采购率低于50%说明种养与加工脱节；企业农业相关收入（种养、加工、休闲农业）占比低于30%说明企业偏离农业主业；绩效评价中三产融合指标未达标直接判定。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 一二三产业关联度低未形成融合发展
  regulation: "[\n  {\n    \"法规名称\": \"《关于推进农村一二三产业融合发展的指导意见》\",\n    \"法规文号\": \"国办发〔2015〕93号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、发展多类型农村产业融合方式\",\n    \"内容概述\": \"鼓励通过延伸产业链、打造供应链、提升价值链等方式，推动种养业与加工流通、休闲旅游等深度融合。\"\n  }\n]"
- expression: (动态监测数据库结构表为空) || (计算平原区监测点位密度 < 1个/万亩) || (MAX(质量变化趋势表.年度)间隔 > 季度) || (EXISTS(SELECT 1 FROM 质量变化趋势表 WHERE 有机质含量连续3期无变化))
    || (监测报告连续缺失超过3期)
  description: 判定违规的条件：1.无监测数据库或库结构表为空；2.平原区监测点密度低于1个/万亩的最低标准；3.数据更新频率低于季度要求，即最新年度数据间隔大于3个月；4.质量变化趋势表中关键指标（如有机质含量）连续3期数据雷同，疑似数据造假；5.监测报告连续缺失超过3期。
  audit_item: 黑土地保护机制不完善
  suspicion: 未建立黑土地常态化监测与动态数据库
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第八十七号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十四条\",\n    \"内容概述\": \"国家建立黑土地质量监测制度，县级以上人民政府农业农村、自然资源等有关部门应当加强对黑土地质量变化的监测，建立黑土地质量动态数据库。\"\n  }\n]"
