violations:
- expression: (分配表.实际分红到账金额 > 0) && ( (缴款凭证.上缴收益金额 IS NULL) || (ABS(分配表.实际分红到账金额 - 批复文件.非税收入-国有资本经营收益预算金额) / 分配表.实际分红到账金额
    > 0.1) || (预算编制及调整文件未列示投资收益预算) )
  description: 若事业单位取得对外投资收益，但未开具非税收入缴款书缴库，或实际到账金额与预算列入数偏差超过10%，或预算未安排该笔收益，即属于未按规定纳入预算管理。
  audit_item: 国有资产收入管理不合规
  suspicion: 事业单位对外投资收益未纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"事业单位国有资产管理暂行办法\",\n    \"法规文号\": \"财政部令第36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"事业单位对外投资收益以及利用国有资产出租、出借取得的收入，应当纳入单位预算，统一核算，统一管理。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十六条\",\n    \"内容概述\": \"政府的全部收入应当上缴国家金库，任何部门、"
- expression: 异常操作日志记录表.操作描述 CONTAINS ('投标人名单'、'导出报名表') && (访问时间 NOT BETWEEN '09:00:00' AND '18:00:00' || 操作人 NOT IN (可访问标底人员列表、授权人员账号及姓名.授权人员账号及姓名))
  description: 检出非工作时间或非授权人员对投标人名单数据进行查看、导出的异常记录，符合条件的即为涉嫌泄露投标人名称、数量的高疑点行为。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 向他人透露潜在投标人名称及数量
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"招标人向他人透露已获取招标文件的潜在投标人的名称、数量或者可能影响公平竞争的有关招标投标的其他情况的，或者泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款；对单位直接负责的主管人员和其他直接责任人员依法给予处分；构成犯罪的，依法追究刑事责任。\"\
    \n  }\n]"
- expression: ((ABS(比对表.投标总价 - 记录表.最终标底金额) / 记录表.最终标底金额 < 0.02) 的比对表.各投标人名称数量 >= 2) || (日志.访问目标文件（标底文件） = '标底文件' AND 日志.操作人
    NOT IN (记录表.知悉人员清单))
  description: 两家及以上投标人报价与标底偏差率低于2%，或存在非授权人员访问标底文件，即触发泄露标底疑点。偏差率阈值2%基于审计实务中围标、串标典型特征。
  audit_item: 招标人违法泄漏招标秘密
  suspicion: 招标人违法泄露标底
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第五十二条\",\n    \"内容概述\": \"泄露标底的，给予警告，可以并处一万元以上十万元以下的罚款；对单位直接负责的主管人员和其他直接责任人员依法给予处分；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
- expression: (分配表.授权金额上限 < 审批表.项目预算金额) || (分配表.授权项目类型 NOT CONTAINS 审批表.项目类型) || (审批表.审批日期 < 分配表.有效期开始 OR 审批表.审批日期 > 分配表.有效期结束)
    || (日志表.操作人 对应的 分配表.审批人姓名 不存在)
  description: 判定逻辑：1.审批人的授权金额上限小于项目预算金额；2.审批人的授权项目类型不包含该项目类型；3.审批日期不在该审批人权限有效期内；4.操作日志中的审批操作人无任何有效权限记录。满足任一条件即触发越权审批疑点。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 超越规定审批权限审批建设项目
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照规定的程序审批，不得超越审批权限审批政府投资项目。\"\n  }\n]"
- expression: (对比表.农村生均公用经费拨款金额 <= 对比表.城镇生均公用经费拨款金额) || (分配表.农村学校分配金额 / 分配表.总分配金额 < 政策要求农村最低占比)
  description: 农村生均公用经费拨款未高于城镇水平，或转移支付资金中农村学校分配比例低于省级政策明确要求的农村最低占比（如60%），则判定为未落实农村倾斜政策；需结合地域经济水平，若经济社会发展水平相近但农村拨款更低，视为严重违规。
  audit_item: 农村义务教育师资配备及经费保障方面不符合相关规定
  suspicion: 义务教育经费投入未向农村地区倾斜
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于进一步完善城乡义务教育经费保障机制的通知\",\n    \"法规文号\": \"国发〔2015〕67号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、主要内容（一）\",\n    \"内容概述\": \"统一城乡义务教育学校生均公用经费基准定额，中央和地方按比例分担，重点向农村地区倾斜，适当提高寄宿制学校、规模较小学校公用经费补助水平。\"\n\
    \  }\n]"
- expression: (收益分配表.实际签约人数 / 收益分配表.应覆盖人数) < 0.7 || (合同或协议.技能培训条款 == '无' && 合同或协议.就业岗位约定 == '无' && 合同或协议.股权配置 == '无') || ABS(合同或协议.分配比例
    - 收益分配表.分配比例) > 0.05
  description: 实际签约带动率低于70%表明覆盖面不足；合同缺乏技能培训、就业岗位、股权配置等实质性联结条款，属于简单分红式联结；合同约定分配比例与实际执行偏差超过5%，反映利益分配不规范。上述条件满足任一即视为利益联结机制不健全。
  audit_item: 帮扶产业项目联农带农机制不够持续稳固
  suspicion: 帮扶项目未与脱贫群众建立有效利益联结
  regulation: "[\n  {\n    \"法规名称\": \"中央财政衔接推进乡村振兴补助资金管理办法\",\n    \"法规文号\": \"财农〔2021〕19号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十三条\",\n    \"内容概述\": \"严禁简单发钱发物，帮扶项目应通过订单收购、吸纳就业、入股分红等方式，带动脱贫人口直接参与产业发展并稳定增收。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于建立健全帮扶项目联农带农机制的实施意见\",\n    \"法规文号\": \"国乡振发〔2022〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条、第五条\",\n \
    \   \"内"
- expression: (规划用地性质.规划用地性质 != 实际用途) || (企业清单.注册日期 / 规划用地性质.规划入驻企业数 < 0.5) || EXISTS(企业清单.注册日期 < 规划用地性质.开园日期)
  description: 实际建设用途与规划用地不符，或入驻率低于50%，或存在企业在创业园正式开园前已完成注册（疑似虚假入驻），均构成建设不合规。
  audit_item: 新型职业农民培育、农民工技能提升和返乡创业就业不符合相关规定
  suspicion: 返乡创业园建设用途不合规或空置率超标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第74号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十三条\",\n    \"内容概述\": \"建设单位应当按照规划条件进行建设；确需变更的，必须向城市、县人民政府城乡规划主管部门提出申请。未按照规划条件建设的，由主管部门责令改正，并处罚款。\"\n  }\n]"
- expression: 各年度/季度实际成活率、检查日期.各年度/季度实际成活率 < 合同约定成活率标准.合同约定成活率标准 × (1 - 0.05) || 管护专项资金拨付金额、支付日期.管护专项资金拨付金额 / 管护经费预算金额、实际到位金额.管护经费预算金额
    < 1.0 || 管护人员名单.巡查频次 < 规定频次
  description: 实际成活率较合同承诺值低5%以上视为管护缺位；管护资金拨付率未达100%直接影响管护作业；管护人员巡查频次低于责任书要求同样构成履职不到位。三个条件满足任一即产生疑点。
  audit_item: 村容村貌整体提升不符合相关规定
  suspicion: 村庄绿化后期管护不到位致林木成活率低
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于科学绿化的指导意见\",\n    \"法规文号\": \"国办发〔2021〕19号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十二条\",\n    \"内容概述\": \"加强绿化后期管护，建立完善养护管理制度，明确管护责任主体和资金来源，确保造林成活率和保存率。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第五十七条\",\n    \"内容概述\": \"招标人和中标人应当依照招标投"
- expression: SUM(分配表.已分配功率) > 政策文件.功率控制总量指标 && EXIST(管理台账.审批时间 > 政策文件.指标有效期)
