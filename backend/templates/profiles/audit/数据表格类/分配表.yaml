name: audit/数据表格类/分配表
type: model
description: 从数据表格类类文档（分配表）中提取结构化元数据。涵盖字段如：农村学校分配金额、农村所占比例、分配基准日、分配比例、到账日期、占用功率、占用指标渔船编号、可访问标底人员列表。文档范围包括：业务系统权限分配表、中央及地方义务教育专项转移支付资金分配表、乡村绿化财政专项资金分配表、事业单位对外投资收益分配表、企业商业化育种资金分配表、住房公积金增值收益分配表、信息系统权限分配表、增值收益计算分配表、岗位权限分配表、权限分配表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 审批
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 分配表
  member_count: 1
  member_details:
  - 业务系统权限分配表
  - 中央及地方义务教育专项转移支付资金分配表
  - 乡村绿化财政专项资金分配表
  - 事业单位对外投资收益分配表
  - 企业商业化育种资金分配表
  - 住房公积金增值收益分配表
  - 信息系统权限分配表
  - 增值收益计算分配表
  - 岗位权限分配表
  - 权限分配表
  - 渔船功率指标分配表
  - 脱贫群众参与项目收益分配表
  - 课时分配表
  - 返乡创业项目扶持资金分配表
