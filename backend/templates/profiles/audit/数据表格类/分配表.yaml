    type: number
    description: 提取 农村学校分配金额 的数值（含单位，如万元、吨等）
  - name: 农村所占比例
    type: number
    description: 提取 农村所占比例 的数值（含单位，如万元、吨等）
  - name: 分配基准日
    type: string
    description: 提取 分配基准日 的文本值
  - name: 分配比例
    type: number
    description: 提取 分配比例 的数值（含单位，如万元、吨等）
  - name: 到账日期
    type: date
    description: 提取 到账日期 的日期值，格式 YYYY-MM-DD
  - name: 占用功率
    type: string
    description: 提取 占用功率 的文本值
