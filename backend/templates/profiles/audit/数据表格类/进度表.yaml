name: audit/数据表格类/进度表
type: model
description: 从数据表格类类文档（进度表）中提取结构化元数据。涵盖字段如：任务完成率、任务完成量、任务属性字段、任务户数、任务节点、修复完成日期、修复状态、修复记录编号。文档范围包括：三通工程项目进度表（含完成时间、验收状态）、业务合同执行进度表、付款进度表、传统村落保护项目实施进度表、保费补贴资金拨付进度表、保障性安居工程实施进度表、农田设施修复进度表、土地确权登记颁证进度表、地方建设资金到位进度表、改厕进度表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 合同
- 金额
- 项目
- 元数据提取
