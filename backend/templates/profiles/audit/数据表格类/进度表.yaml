    \    \"法规名称\": \"畜禽规模养殖污染防治条例\",\n    \"法规文号\": \"国务院令第643号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十条\",\n    \"\
    内容概述"
- expression: 实际完成工程量 < 计划任务量
