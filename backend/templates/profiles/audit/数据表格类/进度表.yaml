  audit_item: 农业保险保费补贴未按规定配套、拨付、管理和结算
  suspicion: 保费补贴拨付不及时，长期拖欠保险机构保费
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业保险保费补贴管理办法\",\n    \"法规文号\": \"财金〔2021〕113号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二十五条\",\n    \"内容概述\": \"地方财政部门应按规定及时审核拨付保费补贴资金，不得无故拖延，确保保险机构足额及时收到补贴。\"\n  }\n]"
- expression: (实施方案文件缺失 || 实施方案中无具体时间表与任务分解) || (进度表.完成率 < 计划完成率 * 0.7) || (统计表.同比变化率 > -5% && 专项资金中无分类减量支出条目)
  description: 实施方案缺失或无明确时间表，或实际完成率低于计划的70%，或垃圾清运量无明显下降趋势（降幅小于5%）且未见资金投入，均判定为未有效开展或进展缓慢。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 垃圾分类减量工作未开展或进展缓慢
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国固体废物污染环境防治法》\",\n    \"法规文号\": \"主席令第四十三号（2020年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当加强农村生活垃圾污染环境的防治，推行生活垃圾分类制度，保护和改善农村人居环境。\"\n  }\n]"
- expression: ( ( 进度表.各类智能终端实际安装数量 / 研究报告.终端设备安装数量目标 ) < 0.9 ) || ( 进度表.功能投运率 < 1 ) && ( 计划投运日期 <= 当前日期 )
  description: 以可研报告批准的数量和时间为基准，若实际安装完成率低于计划的90%，或已到投运日期但关键功能（如馈线自动化、远程抄表）未全部投运，均视为进度缓慢。偏差10%考虑了正常的实施弹性。
  audit_item: 农村电网巩固提升工程存在短板
  suspicion: 智能配电网建设项目进度严重滞后
  regulation: "[\n  {\n    \"法规名称\": \"国家能源局关于加快推进配电自动化和智能用电信息采集系统建设的通知\",\n    \"法规文号\": \"国能电力〔2016〕290号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"要求按规划稳步推进配电自动化和智能用电信息采集系统建设，确保智能配电网建设任务按期完成。\"\n  }\n]"
- expression: (进度表.颁证完成率<95%) && (当前日期>政策文件.完成时限要求) && (拨付凭证.拨付金额 无异常)
