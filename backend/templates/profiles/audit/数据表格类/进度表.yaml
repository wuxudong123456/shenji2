violations:
- expression: (明细账.企业类型 IN ('中小企业','民营企业') AND (明细账.应付款日期 IS NOT NULL) AND (明细账.实际付款日期 IS NULL AND DATE_DIFF(CURRENT_DATE,
    明细账.应付款日期, 'DAY') > 60) ) OR (明细账.实际付款日期 - 明细账.应付款日期 > 60)
  description: 依据《保障中小企业款项支付条例》，机关、事业单位从中小企业采购货物、工程、服务，应当自交付之日起30日内支付款项；合同另有约定的，付款期限最长不得超过60日。超过60日未付，即构成逾期拖欠。表达式以60天为阈值判定违规。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 长期拖欠中小企业采购账款
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"机关、事业单位从中小企业采购货物、工程、服务，应当自货物、工程、服务交付之日起30日内支付款项；合同另有约定的，付款期限最长不得超过60日。不得以法定代表人或者主要负责人变更，履行内部付款流程，或者在合同未作约定的情况下以等待竣工验收批复、决算审计等为由，拒绝或者迟延支付中小企业款项。\"\
    \n  }\n]"
- expression: (申报材料.实施主体对比表.子项目列表 > 1 && ABS(SUM(子项目金额) - 申报材料.总预算) < 申报材料.总预算*0.05) && (采购文件.招标公告 == '非公开招标' && SUM(子项目金额)
    > 管理制度.公开招标限额) && (关联表.子项目收款方 存在 采购文件.供应商 或 关联表.关联关系)
  description: 将一个整体项目拆分为多个子项目，每个子项目金额均低于公开招标限额，但总额超出限额且供应商高度集中，同时实际总支出与原预算总规模一致，即可疑为人为拆分规避招标并可能虚增费用。
  audit_item: 编制虚假预算
  suspicion: 拆分项目规避监管套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"中华人民共和国主席令第六十八号（2014年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第二十八条、第六十四条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购；采购代理机构不得以不合理条件限制或者排斥潜在供应商。\"\
    \n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第"
- expression: MONTH(明细表.实际下达日期) = 12 AND 明细表.金额 > (SELECT AVG(金额) FROM 明细表) * 3
  description: 筛选12月份下达且单笔金额超过全年平均单笔金额3倍的记录，识别异常大额年末下达。结合预算执行进度表分析12月份执行率异常上升可作为辅助证据。
  audit_item: 财政转移支付预算下达不及时、不准确
  suspicion: 年末突击下达大额转移支付资金
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于深化预算管理制度改革的决定\",\n    \"法规文号\": \"国发〔2014〕45号\",\n    \"效力级别\": \"行政法规\",\n  \
    \  \"条款号\": \"第四条\",\n    \"内容概述\": \"强化预算执行管理，提高财政资金使用效益，严禁年底突击花钱，防止形成新的沉淀。\"\n  }\n]"
- expression: (支付凭证.摘要 LIKE '%拨付%' OR 支付凭证.摘要 LIKE '%转拨%' OR 支付凭证.经济分类科目 IN ('转移性支出','对附属单位补助支出')) AND 支付凭证.支付日期 BETWEEN '当年-11-01'
    AND '当年-12-31' AND (项目进度报告 IS NULL OR 项目进度报告.完工百分比 < 50%) AND (收款方银行流水.资金转出日期 IS NULL OR DATEDIFF(收款方银行流水.资金转出日期, 收款方银行流水.收款日期)
    > 30)
  description: 年末支付凭证中支付摘要出现拨付类字样或经济分类为转移性支出，收款项目对应的实际完工进度不足50%或缺乏验收材料，且资金在收款方账户停留超过30天未实际使用，构成以拨作支。若项目进度报告缺失，直接判定为高风险。
  audit_item: 预算执行率不真实
  suspicion: 以拨作支虚列预算支出
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当对预算支出情况开展绩效评价，不得虚列支出。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\"\
    : \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员违反规定以虚报、冒领等手段骗取财政资金，或者违反规定挪用、截"
- expression: (财政授权支付明细表.累计支付金额/合同总金额) > (项目进度报告.实际完工百分比 + 0.1) AND 项目进度报告.实际完工百分比 < 90%
  description: 当累计支付比例超过项目实际完工比例10个百分点以上，且项目尚未竣工（完工<90%）时，判定为超进度付款。偏差10%以内为预警，超过20%为严重违规。须同时排除合同约定有合理预付款条款的情况。
  audit_item: 预算执行率不真实
  suspicion: 未按项目进度提前支付合同款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"各部门、各单位应当加强对预算支出的管理，严格按照预算规定的支出用途使用资金，按照项目进度和合同约定拨付资金。\"\n  },\n  {\n    \"法规名称\": \"基本建设财务规则\"\
    ,\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"项目建设单位应当严格按照合同约定和工程价"
- expression: ((SUM(12月支付金额)/全年支付总额) > 0.3) AND (最后5个工作日支付总额/12月支付总额 > 0.4) AND (存在单笔支付金额>全年月均支出3倍的事项)
  description: 12月支出占全年支出比例超过30%为异常；12月最后5个工作日支出占整月比例超过40%表明集中抢付；同时满足单笔支付金额超月均支出3倍的大额事项存在，高度疑似突击花钱。各项阈值可结合单位往年正常水平调整。
  audit_item: 预算执行率不真实
  suspicion: 年底突击花钱虚增预算执行率
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"各部门、各单位应当依法组织预算支出，不得在预算执行中随意变更预算用途，不得无预算安排支出，不得违反规定扩大开支范围、提高开支标准。\"\n  },\n  {\n    \"法规名称\"\
    : \"国务院关于深化预算管理制度改革的决定\",\n    \"法规文号\": \"国发〔2014〕45号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四部分\",\n    \"内容概述"
- expression: (进度表.累计完成量 / 任务书.计划数量 < 0.95) || (盘点记录.实际检测数量 < 单据.库存余额 - 允许损耗) || (检测证明.样品热值 < 标准下限 || 检测证明.甲烷纯度 < 标准下限)
  description: 截至计划完成日期，累计完成量低于计划量的95%，或现场盘点数量明显低于账面库存且超出允许损耗，或关键质量指标（热值、纯度）未达到国家标准，均构成任务未完成。
  audit_item: 落实“六稳”“六保”政策存在的其他问题
  suspicion: 未完成石油、天然气储备任务
  regulation: "[\n  {\n    \"法规名称\": \"《国家石油储备条例》\",\n    \"法规文号\": \"无公开文号，依据《国务院办公厅关于加强石油储备管理的通知》（国办发〔2017〕32号）\",\n   \
    \ \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二条、第八条\",\n    \"内容概述\": \"承担国家石油储备任务的企业应按计划完成实物收储，确保库存数量与质量符合规定，禁止虚报瞒报库存。\"\n\
    \  },\n  {\n    \"法规名称\": \"《天然气储备管理办法（试行）》\",\n    \"法规文号\": \"发改能源规〔2019〕138号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十"
- expression: 三通工程项目进度表（含完成时间、验收状态）.实际完成时间 IS NULL || 三通工程项目进度表（含完成时间、验收状态）.实际完成时间 > 三通工程项目进度表（含完成时间、验收状态）.计划完成时间 || 三通工程项目进度表（含完成时间、验收状态）.验收状态
    = '未通过' || LENGTH(薄弱学校改善项目验收报告.整改问题) > 0
  description: 项目进度表中未填写实际完成时间、实际完成时间晚于方案规定时限、验收结论为不合格或存在逾期未整改问题，均判定为未完成三通工程建设。
  audit_item: 乡村学校薄弱环节改善不符合相关规定
  suspicion: 未按期完成三通工程建设
  regulation: "[\n  {\n    \"法规名称\": \"教育部 国家发展改革委 财政部关于深入推进义务教育薄弱环节改善与能力提升工作的意见\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"无\",\n    \"内容概述\": \"要求各地按照规划时间表完成信息化基础设施建设，实现宽带网络校校通、优质资源班班通、网络学习空间人人通，确保所有项目学校达到标准要求。\"\n \
    \ }\n]"
- expression: (保费补贴资金拨付进度表.实际拨付日期 - 保费补贴资金拨付进度表.应拨付日期) > 90天 || (保险机构保费结算申请.申请日期 - 保费补贴资金拨付文件.拨付审批日期) > 30天 AND 无正当理由延期说明
