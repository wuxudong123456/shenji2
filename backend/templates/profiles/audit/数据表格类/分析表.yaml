name: audit/数据表格类/分析表
type: model
description: 从数据表格类类文档（分析表）中提取结构化元数据。涵盖字段如：一二三产企业间交易额、上年结余资金纳入预算的金额、下单时间、不同处室/地区对同一项目的口径定义、与申报图斑重叠区、个人消费占比、个人消费金额、中介机构名称。文档范围包括：PPP项目付费保障分析表、三产关联度分析表、中介机构关联提取记录分析表、交通事故与隐患关联分析表、会计档案盘点差异分析表、公用电网覆盖率对比分析表、关联交易价格对比分析表、关键人员通讯记录分析表、农村公共服务支出对比分析表、农牧区未通电用户清单原因分析表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 培训
- 金额
- 项目
- 预算
- 元数据提取
