  audit_item: 违反规定配置国有资产
  suspicion: 新增资产未考虑存量资产
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"各部门及其所属单位应当加强资产使用管理，对于长期闲置、低效运转或者超标准配置的资产，应当进行调剂。\"\n  }\n]"
- expression: (分析表.实际支出金额 > 分析表.预算金额 && 专项说明.审批状态 != '已批准') || (采购合同.商品名称 = '' || 批复文件.项目名称 = '')
  description: 采购金额超出对应预算科目批复数且无合规的追加审批手续，或采购项目在预算批复中根本不存在，均构成无预算或超预算购置违规。
  audit_item: 违反规定配置国有资产
  suspicion: 无预算、超预算购置国有资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2014年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"各部门、各单位的支出必须以经批准的预算为依据，未列入预算的不得支出。\"\n  }\n]"
- expression: (ABS(分析表.百公里油耗或电耗 - 标准文件.标准百公里能耗上限) / 标准文件.标准百公里能耗上限 > 0.15) OR (用车台账.排量 > 1.8 AND 用车台账.购入日期 > 限定日期)
  description: 汽油车实际百公里油耗超过标准油耗15%以上，或新能源车实际百公里电耗超出标准电耗15%以上，视为能耗控制不达标。若车辆本身排量或价格超过国家规定的配备标准，直接从源头上违反能耗控制原则。限定日期参照各级车改后的新购车辆标准。
  audit_item: 违规管理或使用公务用车
  suspicion: 未按规定控制公务车能耗
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十四条\",\n    \"内容概述\": \"党政机关应当加强公务用车使用管理，严格按照规定用途使用公务用车，降低使用和维修保养成本……实行单车能耗核算。\"\n  }\n]"
- expression: (跨年度项目绩效趋势分析表.连续3年绩效评分 < 60 || 项目资金使用效益分析台账.资金使用率连续2年 < 0.5 ) && (低效项目清单及历史整改记录.是否启动退出程序 = '否' || 低效项目清单及历史整改记录.整改措施
    != '停止拨款并退出' ) && 项目清理退出机制相关制度.退出条件阈值 <= 触发值
  description: 项目连续3年绩效评分低于60分（或连续2年资金使用率低于50%），且未按照本单位项目清理退出制度启动退出程序，继续安排预算拨款的，判定为低效项目未及时清理退出。触发条件需符合单位制度中明确的退出标准阈值。
  audit_item: 部门、单位预算绩效目标未完成
  suspicion: 预算绩效低下的项目未及时清理退出
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第十一条\",\n    \"内容概述\": \"强化绩效评价结果应用，将绩效评价结果与预算安排挂钩，对低效无效资金一律削减或取消。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"内容概述\": \"绩效评价结果应作为改进管理、安排"
- expression: (NOT(绩效管理流程说明.内容 LIKE '%运行监控%' AND 绩效管理流程说明.内容 LIKE '%绩效评价%' AND 绩效管理流程说明.内容 LIKE '%结果应用%')) OR (绩效运行监控分析表.记录数
    = 0 AND 绩效评价报告.评价结论 IS NULL)
  description: 制度文件未完整涵盖目标设定、监控、评价、结果应用全部必要环节，或实际执行中未生成关键节点文档记录（如无任何监控记录、评价报告），视为流程不完善。前者检查制度文本完整性，后者检查实际执行痕迹，满足任一条件即触发违规。
  audit_item: 部门、单位预算绩效管理制度不健全
  suspicion: 预算绩效管理流程不完善
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于全面实施预算绩效管理的意见\",\n    \"法规文号\": \"中发〔2018〕34号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第二部分（三）\",\n    \"内容概述\": \"健全绩效运行监控机制，对绩效目标实现程度和预算执行进度实行双监控；健全绩效评价机制和结果应用机制，将评价结果作为预算安排和政策调整的重要依据。\"\
    \n  }\n]"
- expression: 坏账准备计提明细表.本期平均计提比例(按账龄加权) != 上期平均计提比例 && (董事会决议 IS NULL || 董事会决议.批准日期 > 变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE
    '%坏账准备计提比例变更%' && ABS(本期计提金额 - 按上期比例测算的计提金额) / 利润总额 > 0.05
  description: 若坏账准备计提比例发生变动，且影响利润总额超过5%，同时无董事会审批或审批滞后，未在附注中披露时，判定为违规。
  audit_item: 随意变更会计处理方法
  suspicion: 随意变更坏账准备计提比例且未披露
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业不得随意改变费用的确认标准或者计量方法，虚列或者少列费用。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第22号——金融工具确认和计量\",\n    \"法规文号\"\
    : \"财会〔2017〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四十六条、第四十七条\",\n    \"内容概述\": \"企业应当以预期信用损失为基础计提坏账准备，会计政策变更"
- expression: (实际缴库日期 - 收费日期) > 规定缴库时限 && ABS(非税收入台账.已缴金额 - 银行流水.收入金额) < 小额阈值
  description: 规定缴库时限依据当地非税收入收缴管理办法，通常为10至15个工作日。延时时长超过规定即为滞留；若延时期间资金被挪用则另案处理。滞留天数>30日定为严重违规。
  audit_item: 隐瞒、滞留、挪用、坐支应当上缴的非税收入
  suspicion: 滞留应缴非税收入
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条、第二十二条\",\n    \"内容概述\": \"非税收入应当依法及时足额上缴，执收单位应在执收非税收入后10个工作日内上缴财政，最长不超过15个工作日。\"\n  }\n]"
