    : \"第二十条、第三十二条\",\n    \"内容概述\": \"第二十条：评估机构应当依法独立、客观、公正开展业务，建立健全质量控制制度，保证评估报告的真实性、合法性和合理性。第三十二条：委托人或者评估报告使用人应当按照法律规定和评估报告载明的使用范围使用评估报告。\"\
    \n  },\n  {\n    \"法规名称\": \"企业国有资产评估管理暂行办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第12号\",\n   "
- expression: 申请资料.存量资产核查结论 != '已核查' || (闲置资产名称.数量 > 0 && 申请资料.数量 > 0 && 申请资料.闲置资产不可用说明缺失)
