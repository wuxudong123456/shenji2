    \n  }\n]"
- expression: (({调整前后因素名称、权重值、调整原因、审批记录.调整原因} IS NULL || {调整前后因素名称、权重值、调整原因、审批记录.审批记录} IS NULL) && ABS({调整前后因素名称、权重值、调整原因、审批记录.权重值}
    - {调整前后因素名称、权重值、调整原因、审批记录.权重值})/{调整前后因素名称、权重值、调整原因、审批记录.权重值} > 0.1) || ({不同处室/地区对同一项目的口径定义.不同处室/地区对同一项目的口径定义} != {各年度规定因素、口径、权重.口径})
    || ({各年度规定因素、口径、权重} 对比同类型项目同一因素权重差异 > 20% && 无政策文
