violations:
- expression: (分析表.预算金额 == 0 OR 分析表.实际支出 > 分析表.预算金额) && 明细表.分摊金额 > 0 && (分摊协议.审批状态 != '已审批' OR 分摊协议.分摊依据 NOT IN ('参训人数比例','实际费用分摊'))
  description: 当年度培训费预算为零或实际支出突破预算批复总额，同时存在向所属单位分摊培训费的记录，且无法提供经批准的合规分摊协议或分摊依据不合法（如未按参训人数比例分摊）时，触发预警，属于无预算或超预算违规摊派。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 无预算或超预算摊派培训费
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第（五）项\",\n    \"内容概述\": \"国家机关及其工作人员不得违反规定扩大开支范围、提高开支标准，不得转嫁、摊派费用。\"\n  }\n]"
- expression: (ABS(分析表.实际成交价格 - 评估报告.评估价值) / 评估报告.评估价值 > 0.2) AND (交易合同.对方单位 IN 关系名单) AND (交易类型 = ‘领导人员卖出’ OR 交易类型 = ‘领导人员买入’)
  description: 企业领导人员与特定关系人交易的资产价格偏离评估价值或市场均价超过20%，即为异常。卖出价格明显低于评估价值（<0.8倍），或买入价格明显高于评估价值（>1.2倍）均触发。特定关系人包括亲属、特定关联方。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 向特定关系人低价出售或高价购买资产
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（三）项\",\n    \"内容概述\": \"不得以明显低于市场的价格向请托人购买或者以明显高于市场的价格向请托人出售房屋、汽车等物品，或者以其他交易形式非法收受请托人财物。\"\n  }\n]"
- expression: (投标人名称、初始报价、最终报价、报价变更率.报价变更率 > 10%) && (沟通时间、涉及投标人、通讯次数.通讯次数 > 0) && (ABS(中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中标日期、评标委员会名单、中标通知书发出时间、中标人、中标联合体成员及分工、联合体协议条款.合同金额
    - 投标人名称、初始报价、最终报价、报价变更率.最终报价) / 中标人名称、发出日期、中标项目编号、要求合同签订时限、中标金额、招标方式、承诺工期、项目名称、中标供应商、签发日期、中标供应商名称、定标日期、中
  description: 报价变更率指（最终报价-初始报价）/初始报价的绝对值，超过10%为异常；评标期间指投标截止至中标通知书发出前。若该期间存在私下沟通且合同金额与变更后报价一致（偏差<1%），则判定存在实质性价格谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人私下与投标人协商修改投标报价
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  }\n]"
- expression: (差异条款.合同条款 >= 1) && (沟通记录.评标前合作记录 == 是) && (处理记录.投诉内容 == 是)
  description: 实质性条款差异指价格、付款条件、工期、技术标准等关键内容发生变化；评标前沟通指招标公告发布前已有接触记录；未中标人投诉中直接指认内定。三项条件同时满足，可认定为内定并违法谈判。
  audit_item: 招标人违法进行实质性谈判
  suspicion: 招标人提前内定中标人并通过谈判变更合同条款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十三条\",\n    \"内容概述\": \"在确定中标人前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\"\n  }\n]"
- expression: 原预算金额、调整后金额、调整金额、调整原因.调整金额 != 0 && (调整金额、调整原因、审批日期、审批文号、审批意见、调整项目名称、调整后金额、调整事由、财政审批意见、调整批准日期、调整理由、预算调整批复日期、调整内容.审批文号
    IS NULL OR 调整金额、调整原因、审批日期、审批文号、审批意见、调整项目名称、调整后金额、调整事由、财政审批意见、调整批准日期、调整理由、预算调整批复日期、调整内容.审批日期 < 调整年度-预算开始日期) && ABS(调整金额/原预算金额)
