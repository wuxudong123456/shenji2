    || (盘点差异分析表.缺失资料名称 IN ('原始凭证','记账凭证','会计账簿','财务报告') AND 盘点差异分析表.差异原因 NOT IN ('已审批销毁','依法移交') AND 借阅调取登记表.借出状态 != '未归还')
    || (涉事人员询问笔录 LIKE '%故意销毁%' OR '%隐匿%')
  description: 1. 销毁登记表中销毁的资料形成到销毁年限短于法定保管年限（凭证、账簿30年，年报永久），无论审批是否齐全，均构成故意销毁；2. 系统日志存在删除操作且删除对象不在正规销毁清册中，视为隐匿销毁；3. 盘点发现重要会计资料缺失，且无合规销毁记录、无借阅记录，疑为故意隐匿；4.
    询问笔录中相关人员承认隐匿或销毁的直接作为线索。
  audit_item: 未按规定保管会计资料，造成会计资料毁损、灭失；隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告
  suspicion: 隐匿或者故意销毁依法应当保存的会计资料
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第21号（2017年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十四条\",\n    \"内容概述\": \"隐匿或者故意销毁依法应当保存的会计凭证、会计账簿、财务会计报告，构成犯罪的，依法追究刑事责任。尚不构成犯罪的，由县级以上人民政府财政部门予以通报，可以对单位并处五千元以上十万元以下的罚款；对其直接负责的主管人员和其他直接责任人员，可以处三千元以上五万元以下的罚款；属于国家工作人员的，还应当由其所在单位或者有关单位依法给予撤职直至开除的行政处分；其中的会计人员，五年内不"
- expression: (分析表.实际支出金额 > 分析表.预算金额 AND 分析表.调整标志 = '否') || (明细表.支出用途摘要 NOT REGEXP '车辆|燃油|维修|保险|过路' AND 明细表.金额 > 10000)
  description: 条件1：实际支出超出预算且无有效的预算调整审批记录；条件2：单笔金额超过1万元的公务用车费用支出，但用途摘要未包含车辆相关关键字，疑似挪用经费。两者满足其一即可识别为预算执行不严格。
  audit_item: 未按规定编制和执行公务用车购置和运行费预算
