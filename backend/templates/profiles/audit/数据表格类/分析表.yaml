  description: 调整金额不为零，但缺失对应的审批文件，或审批日期在预算执行开始之前不合常理，且调整幅度超过10%时，视为调整程序不规范。10%阈值可依据单位内部制度调整。
  audit_item: 政府采购预算编制和实施不规范
