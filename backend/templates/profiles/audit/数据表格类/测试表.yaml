name: audit/数据表格类/测试表
type: model
description: 从数据表格类类文档（测试表）中提取结构化元数据。涵盖字段如：可变现净值、跌价准备计提金额。文档范围包括：存货跌价准备测试表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 测试表
  member_count: 1
  member_details:
  - 存货跌价准备测试表
output:
  fields:
  - name: 可变现净值
    type: string
    description: 提取 可变现净值 的文本值
  - name: 跌价准备计提金额
    type: number
    description: 提取 跌价准备计提金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ABS((存货收发存汇总表.期初余额 + 产量统计表.当期完工产量 - 产品销售量统计表.当期销售量) - 存货收发存汇总表.期末余额（分产品）) > 存货收发存汇总表.期末余额（分产品） * 5% || (((存货收发存汇总表.期末余额（分产品）
    - 存货收发存汇总表.期初余额) / 存货收发存汇总表.期初余额) > (产品销售量统计表.销售增长率 + 30%))
  description: 产销量与库存变动应满足永续盘存等式，差异超过5%表明账实不符或虚列存货。存货余额增速远超收入增速，可能意味着产品滞销、虚假入库或未及时结转成本，构成异常信号。
  audit_item: 企业财务报表分析
  suspicion: 存货余额与产销量勾稽关系异常
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第四条、第十五条\",\n    \"内容概述\": \"存货同时满足与该存货有关的经济利益很可能流入企业、成本能够可靠计量时予以确认。企业应当在资产负债表日，按成本与可变现净值孰低计量，差额计提跌价准备，不得隐瞒减值迹象。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n   \
    \ \"内容概"
