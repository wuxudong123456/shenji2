name: audit/数据表格类/验证表
type: model
description: 从数据表格类类文档（验证表）中提取结构化元数据。涵盖字段如：关键假设是否被外部证据支持、预测数据的贝蒂反值。文档范围包括：可行性研究核心数据验证表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 验证表
  member_count: 1
  member_details:
  - 可行性研究核心数据验证表
output:
  fields:
  - name: 关键假设是否被外部证据支持
    type: boolean
    description: 提取 关键假设是否被外部证据支持 的布尔值（是/否）
  - name: 预测数据的贝蒂反值
    type: string
    description: 提取 预测数据的贝蒂反值 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: SELECT 分析表.预期销售额/净利 vs. 实际完成率, 分析表.预期销售额/净利 vs. 实际完成率, 验证表.关键假设是否被外部证据支持 FROM 分析表 INNER JOIN 验证表 ON 分析表.预期销售额/净利
    vs. 实际完成率 = 验证表.关键假设是否被外部证据支持 LEFT JOIN 调查报告 ON 分析表.预期销售额/净利 vs. 实际完成率 = 调查报告.被投资企业的最终实际控制人声明及核实记录 WHERE 分析表.预期销售额/净利
    vs. 实际完成率 > 0.50 AND (验证表.关键假设是否被外部证据支持 = '不合理' || 调查报告.尽调团队资质 = '不满足
  description: 该表达式用于识别因前期论证不充分导致的投资失败。当一项投资的实际业绩完成率不足预期的50%，且经过复审，可研报告的关键假设被评判为不合理（如技术可行性存疑），或者尽职调查报告在团队独立性、资质或覆盖范围上存在根本性缺陷时，可判定为可研与尽调流于形式的典型表现。
  audit_item: 违规进行重大投资
  suspicion: 可行性研究及尽职调查流于形式导致投资失败
  regulation: "[\n  {\n    \"法规名称\": \"中央企业违规经营投资责任追究实施办法（试行）\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第37号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"在投资并购方面，对投资项目未进行必要的尽职调查，或尽职调查未进行风险分析等，存在重大疏漏；可行性研究报告编制依据不充分、内容不完整等，造成较大资产损失或其他严重不良后果的，应当追究责任。\"\
    \n  }\n]"
