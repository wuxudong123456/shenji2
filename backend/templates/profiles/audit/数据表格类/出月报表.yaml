name: audit/数据表格类/出月报表
type: model
description: 从数据表格类类文档（出月报表）中提取结构化元数据。涵盖字段如：内部往来科目金额、归集金额、提取金额。文档范围包括：资金归集支出月报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 出月报表
  member_count: 1
  member_details:
  - 资金归集支出月报表
output:
  fields:
  - name: 内部往来科目金额
    type: number
    description: 提取 内部往来科目金额 的数值（含单位，如万元、吨等）
  - name: 归集金额
    type: number
    description: 提取 归集金额 的数值（含单位，如万元、吨等）
  - name: 提取金额
    type: number
    description: 提取 提取金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 会计科目余额对照表（中心与分支机构）.科目编码 != 会计科目余额对照表（中心与分支机构）.科目编码 || 会计科目余额对照表（中心与分支机构）.核算口径 != 会计科目余额对照表（中心与分支机构）.核算口径 ||
    ABS(资金归集支出月报表.归集金额 - SUM(资金归集支出月报表.提取金额) - 资金归集支出月报表.内部往来科目金额) > 0
  description: 比对中心与分支机构会计科目余额对照表，若存在科目编码不一致（如利息支出挂账科目不同）或同一科目核算口径不同，则判定违规；在进行合并报表测试时，若各分支机构支出合计经过内部往来抵消后，与中心汇总报表的支出总额不平（存在差异），则表明存在并表逻辑错误或未抵消关联交易，未实现统一核算。
  audit_item: 住房公积金管理体制调整不到位
  suspicion: 住房公积金分支机构未与中心实现统一核算
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金会计核算办法\",\n    \"法规文号\": \"财会字〔1999〕35号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第七十七条、第五章\",\n    \"内容概述\": \"管理中心应统一设置和管理住房公积金会计科目，所有二级核算单位（包括分支机构）必须使用与中心一致的会计科目及代码，按规定生成财务报表，并确保总账与各项明细账、银行存款日记账核对相符，实现账账相符。\"\
    \n  }\n]"
