- expression: (分析表.实际支出金额 > 分析表.预算金额 AND 分析表.调整标志 = '否') || (明细表.支出用途摘要 NOT REGEXP '车辆|燃油|维修|保险|过路' AND 明细表.金额 > 10000)
  description: 条件1：实际支出超出预算且无有效的预算调整审批记录；条件2：单笔金额超过1万元的公务用车费用支出，但用途摘要未包含车辆相关关键字，疑似挪用经费。两者满足其一即可识别为预算执行不严格。
  audit_item: 未按规定编制和执行公务用车购置和运行费预算
  suspicion: 公务用车购置及运行费预算执行不严格
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第十二号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第七十二条\",\n    \"内容概述\": \"各部门、各单位应当加强对预算支出的管理，严格执行预算，不得超预算、无预算安排支出；按规定程序进行预算调整的除外。\"\n  },\n  {\n    \"法规名称\": \"\
    党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"公务用车运行费用实行"
- expression: (记录表.划拨金额 - (明细台账.本期发生额 + 本期发生额) != 0) || (行对账单.大额转出金额 > 100000 && 摘要为“借款” && 对方户名为下级/上级单位 && (ABS(明细台账.期末余额)
