name: audit/数据表格类/记录表
type: model
description: 从数据表格类类文档（记录表）中提取结构化元数据。涵盖字段如：上报在校天数、上报记录、上缴国库金额、不合格项描述、不满意原因分类、专家评审结论、专用卫生间设置情况、业主单位。文档范围包括：三会会议记录表、专职人员考勤与履职记录表、临时收储执行记录表、主管部门监管检查记录表、乡村医生培训实施记录表、乡村建设工匠工程分配记录表、产业项目运营维护记录表、产品质量验收记录表、任务清单动态调整记录表、会员投诉/反馈记录表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 金额
- 元数据提取
