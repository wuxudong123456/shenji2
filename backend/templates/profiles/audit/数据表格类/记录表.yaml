violations:
- expression: (被审计单位实际公开的“三公”经费文件.公开日期 - 被审计单位“三公”经费预算批复文件.批复日期) > 地方政府或部门关于“三公”经费公开的相关制度文件.规定公开时限
  description: 实际公开日期取公开文件印发日期或网站发布记录的最早日期，预算批复日期为批复文件落款日期；制度规定时限如《预算法》规定的20日内。差值超过规定天数即为违规，超期天数越多风险越高。
  audit_item: “三公”经费预算公开不符合规定
  suspicion: “三公”经费预算未按时公开
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国预算法》\",\n    \"法规文号\": \"主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十四条\",\n    \"内容概述\": \"经本级政府财政部门批复的部门预算、决算及报表，应当在批复后二十日内由各部门向社会公开。\"\n  },\n  {\n    \"法规名称\": \"《中华人民共和国政府信息公开条例》\"\
    ,\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"行政机关应当主动公开财政预算、决算信息。\"\
    \n  },\n  "
- expression: 被审计单位实际公开的“三公”经费文件.发布平台名称 NOT IN (地方政府或部门关于“三公”经费公开的相关制度文件.法定公开平台清单（如政府门户网站、财政专栏）) OR (被审计单位实际公开的“三公”经费文件.发布平台名称
    IN ('内部网站','微信公众号','朋友圈') AND 被审计单位实际公开的“三公”经费文件.发布平台名称 NOT IN (地方政府或部门关于“三公”经费公开的相关制度文件.法定公开平台清单（如政府门户网站、财政专栏）))
  description: 法定公开平台一般指地方政府门户网站、财政厅（局）官方网站或预决算公开统一平台等。仅在社交媒体等非法定渠道公开，导致信息获取受限，属于渠道不合规。
  audit_item: “三公”经费预算公开不符合规定
  suspicion: “三公”经费预算公开渠道不合规
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国政府信息公开条例》\",\n    \"法规文号\": \"国务院令第711号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二十四条\",\n    \"内容概述\": \"行政机关应当加强政府信息资源的规范化、标准化、信息化管理，通过统一的政府信息公开平台集中发布信息。\"\n  },\n  {\n    \"法规名称\": \"《地方预决算公开操作规程》\"\
    ,\n    \"法规文号\": \"财预〔2016〕143号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"地方各部门应当在政府门户网站或"
- expression: (会计凭证列表 LEFT JOIN 会计凭证审核记录表 ON 会计凭证列表.凭证编号 = 会计凭证审核记录表.凭证编号 LEFT JOIN 会计账簿 ON 会计凭证列表.凭证编号 = 会计账簿.凭证编号) WHERE
    (会计凭证审核记录表.审核结果 IS NULL OR 会计凭证审核记录表.审核时间 >= 会计账簿.账簿登记日期) AND 会计凭证列表.凭证编号 IN (SELECT 凭证编号 FROM 会计账簿)
  description: 凭证审核记录表中无对应凭证的审核通过记录，或审核时间晚于或等于账簿登记日期，表明凭证未经审核即入账。
  audit_item: 以未经审核的会计凭证为依据登记会计账簿或者会计账簿登记不符合规定
  suspicion: 以未经审核会计凭证登记账簿
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十条\",\n    \"内容概述\": \"会计人员应当根据审核无误的会计凭证登记会计账簿。\"\n  }\n]"
- expression: (会计账簿.更正方法 NOT IN ('划线更正法', '红字冲销法', '补充登记法')) OR (会计账簿.更正人签章 IS NULL) OR (会计账簿.会计主管签章 IS NULL)
  description: 若更正采用涂改、刮擦、删除或未留下可辨认原有字迹，或更正处无记账人员及会计主管盖章，均为违规。
  audit_item: 以未经审核的会计凭证为依据登记会计账簿或者会计账簿登记不符合规定
