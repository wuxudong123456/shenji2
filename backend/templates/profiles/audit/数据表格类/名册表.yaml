name: audit/数据表格类/名册表
type: model
description: 从数据表格类类文档（名册表）中提取结构化元数据。涵盖字段如：成员姓名、成员总数、成员类型、职业分类、身份证号。文档范围包括：农民专业合作社成员名册表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 名册表
  member_count: 1
  member_details:
  - 农民专业合作社成员名册表
output:
  fields:
  - name: 成员姓名
    type: string
    description: 提取 成员姓名 的文本值
  - name: 成员总数
    type: string
    description: 提取 成员总数 的文本值
  - name: 成员类型
    type: string
    description: 提取 成员类型 的文本值
  - name: 职业分类
    type: string
    description: 提取 职业分类 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 成员姓名、身份证号、职业分类、成员类型（农民/非农民）、成员总数.职业分类 != '农民' AND NOT EXISTS (户籍性质、职业信息、农民资格证明.农民资格证明)
  description: 筛出成员名册中职业分类非农民的成员，若无法提供农业农村部门认可的农民资格证明（如土地承包合同、务农记录、职业农民认定文件等），则判定为成员身份违规。每个不符合条件的成员单独标记。
  audit_item: 农民专业合作社认定不合规
  suspicion: 农民专业合作社成员身份不符合规定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第83号（2017年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第十二条、第十四条\",\n    \"内容概述\": \"农民专业合作社成员中，农民至少应当占成员总数的百分之八十；成员总数二十人以下的，可以有一个企业、事业单位或者社会组织成员；成员总数超过二十人的，企业、事业单位和社会组织成员不得超过成员总数的百分之五。具有民事行为能力的公民，以及从事与农民专业合作社业务直接有关的生产经营活动的企业、事业单位或者社会组织，可以成为成员。\"\
    \n  }\n]"
- expression: COUNT(名册表 WHERE 成员类型（农民/非农民）='农民') / COUNT(名册表) < 0.80
  description: 统计成员名册中农民成员数量与总成员数量，计算农民成员占比，若低于80%则触发疑点。同时需关注企业、事业单位和社会组织成员数量是否超限（20人以下最多1个，20人以上不超过5%），一并作为风险提示。
  audit_item: 农民专业合作社认定不合规
  suspicion: 农民成员占成员总数比例低于80%
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国农民专业合作社法\",\n    \"法规文号\": \"中华人民共和国主席令第83号（2017年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"农民专业合作社的成员中，农民至少应当占成员总数的百分之八十。成员总数二十人以下的，可以有一个企业、事业单位或者社会组织成员；成员总数超过二十人的，企业、事业单位和社会组织成员不得超过成员总数的百分之五。\"\
    \n  }\n]"
- expression: (执照.经营范围 != 章程.经营范围) OR (备案表.成员人数 != 名册表.成员总数) OR (备案表.年报信息 = '未报') OR (执照.登记状态 = '经营异常')
  description: 合作社的工商登记信息应与章程及内部记录一致；未按时公示年度报告、被列入经营异常名录均属违规。任意一项不一致即触发疑点。
  audit_item: 农民专业合作社认定不合规
  suspicion: 未依法进行工商登记或登记信息不实
  regulation: "[\n  {\n    \"法规名称\": \"农民专业合作社登记管理条例\",\n    \"法规文号\": \"中华人民共和国国务院令第498号（2014年修订）\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条、第四条、第十七条\",\n    \"内容概述\": \"农民专业合作社依照本条例登记，取得法人资格。合作社登记事项包括名称、住所、成员出资总额、业务范围等。登记事项发生变更的，应当申请变更登记。合作社应于每年1月1日至6月30日，通过企业信用信息公示系统报送上一年度年度报告。\"\
    \n  }\n]"
