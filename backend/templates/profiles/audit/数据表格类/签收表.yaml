name: audit/数据表格类/签收表
type: model
description: 从数据表格类类文档（签收表）中提取结构化元数据。涵盖字段如：发放日期、发放月份、学生姓名、实发金额、实际领取补助金额、应享政策补助标准、收款账号、渔民姓名。文档范围包括：村医补助签收表、补助资金发放签收表、补助资金签收表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 签收表
  member_count: 1
  member_details:
  - 村医补助签收表
  - 补助资金发放签收表
  - 补助资金签收表
output:
  fields:
  - name: 发放日期
    type: date
    description: 提取 发放日期 的日期值，格式 YYYY-MM-DD
  - name: 发放月份
    type: string
    description: 提取 发放月份 的文本值
  - name: 学生姓名
    type: string
    description: 提取 学生姓名 的文本值
  - name: 实发金额
    type: number
    description: 提取 实发金额 的数值（含单位，如万元、吨等）
  - name: 实际领取补助金额
    type: number
    description: 提取 实际领取补助金额 的数值（含单位，如万元、吨等）
  - name: 应享政策补助标准
    type: string
    description: 提取 应享政策补助标准 的文本值
  - name: 收款账号
    type: number
    description: 提取 收款账号 的数值（含单位，如万元、吨等）
  - name: 渔民姓名
    type: string
    description: 提取 渔民姓名 的文本值
  - name: 签字栏
    type: string
    description: 提取 签字栏 的文本值
  - name: 签收人
    type: string
    description: 提取 签收人 的文本值
  - name: 签收日期
    type: date
    description: 提取 签收日期 的日期值，格式 YYYY-MM-DD
  - name: 签收状态
    type: boolean
    description: 提取 签收状态 的布尔值（是/否）
  - name: 银行卡号
    type: string
    description: 提取 银行卡号 的文本值
  - name: 领取人姓名
    type: string
    description: 提取 领取人姓名 的文本值
  - name: 领取人签名
    type: string
    description: 提取 领取人签名 的文本值
  - name: 领取人身份
    type: string
    description: 提取 领取人身份 的文本值
  - name: 领取方式
    type: string
    description: 提取 领取方式 的文本值
  - name: 领取日期
    type: date
    description: 提取 领取日期 的日期值，格式 YYYY-MM-DD
  - name: 领取金额
    type: number
    description: 提取 领取金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 经费拨付与使用明细表.实际拨付金额 < 经费拨付与使用明细表.应拨付总额 && 经费拨付与使用明细表.拨付日期 - 经费保障政策文件.拨付时间要求 > 30 || 银行支付凭证.收款账户名称 = '乡镇卫生院' &&
    银行支付凭证.转账日期 - 当前日期 > 15 || 村医补助签收表.实发金额 < 经费保障政策文件.乡村医生岗位补助标准 || 访谈记录.拨款及时性 = '长期欠拨'
  description: 应拨付金额=辖区服务人口数×人均补助标准+乡村医生岗位补助。资金滞留、少拨、迟拨均构成经费保障不足。村医反映作为重要辅证。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 村卫生室公共卫生服务等经费拨付不足或被截留
  regulation: "[\n  {\n    \"法规名称\": \"基本公共卫生服务补助资金管理办法\",\n    \"法规文号\": \"财社〔2019〕113号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十条、第十二条\",\n    \"内容概述\": \"补助资金应当按照服务人口和人均标准足额安排并及时拨付，任何单位和个人不得克扣、截留、挪用。\"\n  },\n  {\n    \"法规名称\": \"\
    关于进一步加强乡村医生队伍建设的实施意见\",\n    \"法规文号\": \"国办发〔2015〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三、明确乡村医生功能和任务，建立乡村医生收入保障机制"
- expression: (对账表.地方实际到位资金总额 < 对账表.地方年初预算应配套资金总额) && (对账表.合并发放给学生的人均补助标准 == (对账表.中央下达资金总额/对账表.受益学生总数))
  description: 该表达式判定：当地方实际到位的配套资金低于其年初预算或政策规定应承担的金额，但同时学生收到的合并补助标准仅等于中央资金按人头均摊的标准时，即构成“抵减”疑点。本应由中央加地方资金共同构成的更高补助标准，被中央单方面资金所替代，地方应承担部分被抽走。
  audit_item: 资金的管理和使用不规范
  suspicion: 中央补助资金违规抵减地方应承担支出
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于实施农村义务教育学生营养改善计划的意见\",\n    \"法规文号\": \"国办发〔2011〕54号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、主要措施\",\n    \"内容概述\": \"各地要统筹中央补助资金和自身财力，确保补助标准落实到位。不得以中央补助资金抵减地方应承担的义务教育阶段家庭经济困难寄宿生生活费补助资金，不得减少地方本级财政应安排的补助经费。\"\
    \n  },\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划专项资金管理办法\",\n    \"法规文号\": \"财教〔2012〕2号\",\n    \"效力"
- expression: 名册.身份证号 = 记录台账.身份证号 && 记录台账.异动类型（转学/休学/毕业） IN ('转学', '休学', '毕业') && 名册.补助发放月份 > DATE_FORMAT(记录台账.异动生效日期, 'YYYY-MM')
  description: 该表达式判定：当某学生存在转学、休学或毕业记录，且在其异动生效日期之后的月份，补助名册中仍有其发放记录时，即构成违规领取补助。这里用月份比对，考虑到补助通常按月发放，异动生效当月是否发放需结合具体日期判断，通常次月起绝不应再发放。
  audit_item: 资金的管理和使用不规范
  suspicion: 学籍已变更学生违规持续享受补助
  regulation: "[\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划实名制学籍管理办法\",\n    \"法规文号\": \"教基二厅函〔2012〕12号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第十一条\",\n    \"内容概述\": \"学生发生转学、休学、辍学、毕业等情况时，学校应及时在实名制学籍信息系统中进行标注，并从发生当月起停止发放营养改善计划补助资金。\"\n  },\n \
    \ {\n    \"法规名称\": \"城乡义务教育补助经费管理办法\",\n    \"法规文号\": \"财教〔2021〕72号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第七条\"\
    ,\n    "
- expression: 签收表.领取方式（现金/转账） == '现金' && 签收表.签字栏 IS NOT NULL && 签收表.银行卡号 IS NULL && 流水.交易摘要 NOT LIKE '%膳食补助%'
  description: 该表达式判定补助资金存在以现金方式直接发放的违规行为。条件包括：发放签收表明确标注为现金发放，且存在手写签字但没有对应的银行卡号记录。同时，通过关联银行流水，发现无对应的对公转账支付给供餐企业或学生营养餐卡，进一步证实资金未用于集中供餐，而是被以现金形式化整为零地发放给个人。
  audit_item: 资金的管理和使用不规范
  suspicion: 违规以现金形式直接发放膳食补助
  regulation: "[\n  {\n    \"法规名称\": \"农村义务教育学生营养改善计划专项资金管理办法\",\n    \"法规文号\": \"财教〔2012〕2号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十四条\",\n    \"内容概述\": \"专项资金应当足额用于向学生提供等值优质的食品，不得以现金形式直接发放给学生个人和家长。\"\n  },\n  {\n    \"法规名称\": \"学校食品安全与营养健康管理规定\"\
    ,\n    \"法规文号\": \"教育部、国家市场监督管理总局、国家卫生健康委员会令第45号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十七条\",\n    \"内容概述"
