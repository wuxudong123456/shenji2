name: audit/数据表格类/结果表
type: model
description: 从数据表格类类文档（结果表）中提取结构化元数据。涵盖字段如：举报内容、处理结果、核实情况、核实结果。文档范围包括：患者投诉举报处理结果表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 结果表
  member_count: 1
  member_details:
  - 患者投诉举报处理结果表
output:
  fields:
  - name: 举报内容
    type: string
    description: 提取 举报内容 的文本值
  - name: 处理结果
    type: boolean
    description: 提取 处理结果 的布尔值（是/否）
  - name: 核实情况
    type: string
    description: 提取 核实情况 的文本值
  - name: 核实结果
    type: boolean
    description: 提取 核实结果 的布尔值（是/否）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 明细表.收费金额 > 0 && (明细表.收费项目名称 LIKE '%签约%' || 明细表.收费项目名称 IN (免费服务项目清单.免费服务项目清单))
  description: 收费明细中存在金额大于0的记录，且收费项目包含‘签约’字样或项目名称属于政策规定的免费基本公共卫生服务项目，即构成违规收费疑点。签约服务中的公卫项目应由财政补贴支付，不得转嫁居民。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不合规
  suspicion: 乡村医生签约服务违规收费
  regulation: "[\n  {\n    \"法规名称\": \"基本公共卫生服务补助资金管理办法\",\n    \"法规文号\": \"财社〔2022〕44号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"基本公共卫生服务项目免费向居民提供，补助资金用于乡村医生等承担服务的机构和人员支出，不得以任何形式向居民收取相关费用。\"\n  }\n]"
- expression: SUM(登记表.领用数量) - SUM(登记表.销毁数量) > 0 && (ABS(登记表.领用日期) < 处理记录.消毒间隔时长 || 结果表.举报内容（涉及器械重复使用相关描述） > 0)
  description: 按器械名称汇总领用数与销毁数，若领用量减销毁量的差值大于0，表明存在未销毁的一次性器械；同时若同批器械领用间隔小于规定消毒所需时长，或患者投诉中明确提及复用，则涉嫌重复使用违规。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不合规
  suspicion: 重复使用一次性医疗器械和卫生材料
  regulation: "[\n  {\n    \"法规名称\": \"医疗器械监督管理条例\",\n    \"法规文号\": \"国务院令第739号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第五十七条\",\n    \"内容概述\": \"医疗器械使用单位不得重复使用一次性使用的医疗器械，使用后应当按照国家有关规定销毁并如实记录。\"\n  }\n]"
- expression: (登记台账.证明类型 NOT IN 规范文件.乡村医生可开具证明类型) || (COUNT(登记台账.证明编号 BY 开具医生, 周) > 10)
  description: 若出现乡村医生无权开具的证明类型（如死亡证明、残疾等级证明等），或同一医生一周内开具同类证明超过10份，均视为违规出具医学证明疑点。需结合签名比对和患者核实确认。
  audit_item: 农村基本公共卫生服务和基本药物制度执行不合规
  suspicion: 乡村医生违规出具医学证明
  regulation: "[\n  {\n    \"法规名称\": \"乡村医生从业管理条例\",\n    \"法规文号\": \"国务院令第386号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十七条\",\n    \"内容概述\": \"乡村医生不得出具与执业范围无关或者与执业范围不相符的医学证明，不得出具虚假医学证明文件。\"\n  }\n]"
