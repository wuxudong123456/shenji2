name: audit/数据表格类/构成表
type: model
description: 从数据表格类类文档（构成表）中提取结构化元数据。涵盖字段如：成员姓名、支出类别、是否独立董事、来源、资金来源、金额。文档范围包括：省级农业园区建设资金构成表、董事会成员构成表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 构成表
  member_count: 1
  member_details:
  - 省级农业园区建设资金构成表
  - 董事会成员构成表
output:
  fields:
  - name: 成员姓名
    type: string
    description: 提取 成员姓名 的文本值
  - name: 支出类别
    type: number
    description: 提取 支出类别 的数值（含单位，如万元、吨等）
  - name: 是否独立董事
    type: boolean
    description: 提取 是否独立董事 的布尔值（是/否）
  - name: 来源
    type: string
    description: 提取 来源 的文本值
  - name: 资金来源
    type: string
    description: 提取 资金来源 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (法人治理章程.独立董事人数及比例 == 0) || (法人治理章程.董事会/监事会设置 = '监事会缺失') || (激励约束制度文件.绩效考核指标为空) || ((企业年度审计报告.净利润 < 0) AND (高管薪酬记录.年度薪酬总额
    > 0))
  description: 独立董事为零或监事会缺失，表明治理结构不健全；激励约束制度无绩效考核条款或薪酬与业绩无关联，视为约束机制失效。关联度弱负相关可通过计算近3年高管薪酬变化率与净利润变化率的相关系数判定，若企业亏损而高管薪酬持续增长或未明显下降，即触发。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 社有企业法人治理结构和激励约束机制不健全
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十一条、第一百一十七条\"\
    ,\n    \"内容概述\": \"有限责任公司/股份有限公司应设立监事会，规模较小的可设一至二名监事；上市公司应设独立董事，国有独资公司董事会成员中应当有公司职工代表。\"\n  }\n]"
- expression: 资金来源构成表.资金来源 LIKE "%中央财政%" && (资金来源构成表.支出类别 IN ("景观工程","雕塑","旅游设施","非生产性建筑") && (非生产性支出金额 / 园区中央资金总额) > 0.3
    && 资金来源构成表.金额>0
  description: 中央财政涉农资金使用负面清单明确禁止用于景观雕塑等非生产性支出。若省级农业园区使用中央资金且非生产性支出占比超过30%，即可判定为违规切块，严重偏离农业产业发展方向。
  audit_item: 涉农资金统筹整合不规范
  suspicion: 中央涉农资金切块用于省级农业园区非生产性支出
  regulation: "[\n  {\n    \"法规名称\": \"中央财政农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2022〕36号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"资金不得用于修建楼堂馆所、景观雕塑等与农业生产发展无关的支出。\"\n  }\n]"
