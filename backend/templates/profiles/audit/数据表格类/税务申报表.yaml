name: audit/数据表格类/税务申报表
type: model
description: 从数据表格类类文档（税务申报表）中提取结构化元数据。涵盖字段如：扣除项目、收入确认期间、申报期间、纳税调整金额、费用明细。文档范围包括：税务申报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 明细
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 税务申报表
  member_count: 1
  member_details:
  - 税务申报表
output:
  fields:
  - name: 扣除项目
    type: string
    description: 提取 扣除项目 的文本值
  - name: 收入确认期间
    type: number
    description: 提取 收入确认期间 的数值（含单位，如万元、吨等）
  - name: 申报期间
    type: string
    description: 提取 申报期间 的文本值
  - name: 纳税调整金额
    type: number
    description: 提取 纳税调整金额 的数值（含单位，如万元、吨等）
  - name: 费用明细
    type: number
    description: 提取 费用明细 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (原始会计凭证.凭证日期 > 资产负债表.日期) && (记账凭证.贷方科目 LIKE '%负债%') || (银行对账单.借贷标志 == '贷' AND 银行对账单.金额 > 大额阈值 AND 银行对账单.对方户名
    LIKE '%供应商%贷款%') && (税务申报表.扣除项目 NOT INCLUDE 对应负债利息或费用) || (外部审计报告.调整分录 == 补记负债) && (资产负债表.应付账款.期末余额 == 资产负债表.应付账款.期初余额)
  description: 识别隐匿负债疑点：1）将本应属于报表期间的负债凭证记入下一期（截止性差异）；2）银行已收到贷款资金，但账面未见新增负债，且税务申报无相关融资费用扣除（帐外负债）；3）外部审计师已提示需补记负债，但账面未调整；4）应付账款余额长期不变，可能未记账新产生的应付款项。满足任一条件即判定为疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 企业提供虚假财务会计报告隐匿负债
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号（2017年修订）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十三条、第二十六条\",\n    \"内容概述\": \"会计凭证、会计账簿、财务会计报告和其他会计资料，必须符合国家统一的会计制度的规定。公司、企业进行会计核算不得有下列行为：随意改变资产、负债、所有者权益的确认标准或者计量方法，虚列、多列、不列或者少列资产、负债、所有者权益。\"\
    \n  }\n]"
- expression: ABS(记账日期.记账日期 - 业务实质发生日期) > 会计分期截止容忍度
  description: 业务实质发生日期取自合同生效日、法院判决生效日、资产交割日等客观证据；会计分期截止容忍度通常为0天（即不可跨期），除非存在跨期调整的合理依据。若记账日期早于或晚于实质发生日期，即触发疑点。
  audit_item: 未按规定核算收益及营业外收支
  suspicion: 提前或推迟确认营业外收支
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"企业应当以权责发生制为基础进行会计确认、计量和报告。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\":\
    \ \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。\"\
    \n  }\n]"
