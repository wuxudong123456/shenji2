name: audit/数据表格类/惠申报表
type: model
description: 从数据表格类类文档（惠申报表）中提取结构化元数据。涵盖字段如：企业名称、优惠类型、退税金额。文档范围包括：税收优惠申报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 惠申报表
  member_count: 1
  member_details:
  - 税收优惠申报表
output:
  fields:
  - name: 企业名称
    type: string
    description: 提取 企业名称 的文本值
  - name: 优惠类型
    type: string
    description: 提取 优惠类型 的文本值
  - name: 退税金额
    type: number
    description: 提取 退税金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: ( SELECT DISTINCT 企业名称 FROM 登记台账 WHERE 业务范围 LIKE '%秸秆%' ) NOT IN ( SELECT 企业名称 FROM 惠申报表 WHERE 优惠类型 IN ('增值税即征即退','所得税减免')
    UNION SELECT 企业名称 FROM 明细表 WHERE 用电类别='农业生产用电' )
  description: 从秸秆收储运台账中提取实际从事秸秆回收利用的企业名单，与税收优惠、用电优惠享受企业名单进行比对，若台账企业未出现在任何优惠名单中，且优惠政策文件明确此类企业应享受优惠，则判定优惠政策未落实。
  audit_item: 秸秆回收利用政策落实不到位
  suspicion: 税收、信贷、用地、用电优惠政策未落实
  regulation: "[\n  {\n    \"法规名称\": \"《资源综合利用产品和劳务增值税优惠目录》\",\n    \"法规文号\": \"财税〔2015〕78号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"附件目录\",\n    \"内容概述\": \"利用农作物秸秆生产纤维板、刨花板等产品，实行增值税即征即退70%政策。\"\n  },\n  {\n    \"法规名称\": \"《关于加快推进农作物秸秆综合利用的意见》\"\
    ,\n    \"法规文号\": \"国办发〔2008〕105号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三、(十)\",\n    \"内容概述\": \"落实国家关于资源综合利用的税收"
