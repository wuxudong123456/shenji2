- expression: (空置房源统计表.累计空置时长（天） > 365) && (空置房源清单.空置原因说明 NOT IN ('合理装修期','合理轮候期','维修保养期','政策预留期'))
  description: 筛查累计空置天数超过365天且空置原因不属于合理情形的房源，合理空置情形需有明确制度或官方文件依据，如装修期（一般不超过3个月）、轮候期等。累计空置时长由交付可达入住状态日期至分配或实际入住日期计算，若仍未分配则计算至审计基准日。表达式区分刻意闲置与非正常管理滞后，阈值365天依据住房城乡建设部关于竣工后1年内完成分配的要求。
