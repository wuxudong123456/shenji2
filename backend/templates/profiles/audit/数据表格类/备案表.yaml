violations:
- expression: (工商登记信息.成立日期 >= 领导干部离职审批文件.离职日期 - 缓冲期) && (领导干部离职审批文件.离职日期 + 3年 >= 当前日期 OR 当前日期 - 领导干部离职审批文件.离职日期 <= 3年) &&
    ((工商登记信息.投资人/股东姓名及身份证号 = 领导干部离职审批文件.姓名) OR (工商登记信息.企业名称 = 直系亲属经商办企业备案表.企业名称 AND 工商登记信息.投资人/股东姓名及身份证号 = 直系亲属经商办企业备案表.亲属姓名))
    && (关联企业清单.企业名称 = 工商登记信息.企业名称 AND 关联企业清单.主营业务关键词 匹配 领导干部离职审批文件.管辖业务范围
  description: 缓冲期可设定为6个月，避免离职前已谋划的合理情形；禁业期以3年为限；企业投资人或实际控制人为本人或直系亲属（代持）；业务关联性通过关键词匹配（如原分管住建，企业主营房地产开发、建筑工程咨询），叠加与原任职单位存在交易或利用原权力获得审批，即触发违规。
  audit_item: 党员领导干部离职或者退休后违反规定接受聘任或从事盈利性活动，或者个人从事与原任职务管辖业务相关的营利性活动
  suspicion: 离职或退休后违规从事与原职务相关的营利性活动
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第一百零七条\",\n    \"内容概述\": \"原系领导成员的公务员在离职三年内，不得从事与原工作业务直接相关的营利性活动。\"\n  },\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"\
    法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第九十六条\",\n    \"内容概述\": \"离职或者退（离）休后违反有关规定从事与原任职务管辖业务相关的营利活动，视"
- expression: 明细表.是否进口产品 = '是' AND (审批文件 IS NULL OR 审批文件.批准文号 IS NULL) AND (备案表.备案状态 != '已备案' OR 备案表.审核意见 != '同意')
  description: 政府采购进口产品必须事先获得同级财政部门审批，并完成备案。若项目明细中标识为进口产品，但无法匹配到有效的审批文件和备案记录，则视为擅自采购进口产品。
  audit_item: 政府采购组织管理不规范
  suspicion: 未经批准擅自采购进口产品
  regulation: "[\n  {\n    \"法规名称\": \"政府采购进口产品管理办法\",\n    \"法规文号\": \"财库〔2007〕119号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第四条、第五条\",\n    \"内容概述\": \"采购进口产品时，应当坚持有利于本国企业自主创新或消化吸收核心技术的原则，在采购活动开始前须获得设区的市、自治州以上人民政府财政部门的核准，并依法进行进口产品采购论证和组织进口产品论证专家进行评审。\"\
    \n  },\n  {\n    \"法规名称\": \"关于政府采购进口产品管理有关问题的通知\",\n    \"法规文号\": \"财办库〔2008〕248号\",\n    \"效力级别\""
- expression: (财政部备案系统查询结果.财政部备案系统查询结果 == '无' || 机构名称、证券评估资质、备案编号.证券评估资质 < 业务所需资质) || (选聘方式、评委打分记录、审批文件.选聘方式 == '直接指定' &&
    选聘方式、评委打分记录、审批文件.审批文件) || (企业信用信息查询.评估机构与被审计单位存在股权关联)
  description: 判定评估机构是否具备法定资质、选聘程序是否合规以及是否存在利益冲突。机构未在财政部备案系统登记、资质不满足业务要求、未经公开选聘直接指定且无合规审批、或与被审计单位存在关联关系，均属主体不合规。
  audit_item: 违反国有资产评估相关规定
  suspicion: 国有资产评估主体不合规
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国资产评估法\",\n    \"法规文号\": \"中华人民共和国主席令第46号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十五条、第十六条\",\n    \"内容概述\": \"评估机构应当依法采用合伙或者公司形式，聘用评估专业人员开展评估业务。评估机构应当具备与评估业务范围相适应的专业人员、专业能力和风险防范能力，并依法进行备案。\"\n \
    \ },\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n   "
- expression: (信息表.单位名称 NOT IN (批准文件.批准执收单位名称) AND 信息表.执收权限截止日 >= 明细台账.征收日期) OR (协议文件 IS NULL AND 明细台账.执收单位 <> 批准文件.批准执收单位名称)
    OR (协议文件.协议有效期 < 明细台账.征收日期)
  description: 判定逻辑：1)实际征收单位不在财政部门批准的执收单位清单内，且征收时该单位权限名义上有效，属擅自变更；2)存在委托征收但无正式协议或批准文件；3)跨部门协作协议已超期仍继续征收。任意条件满足即视为违规。
  audit_item: 违反规定征收非税收入
  suspicion: 未经批准擅自改变非税收入执收单位
  regulation: "[\n  {\n    \"法规名称\": \"政府非税收入管理办法\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"非税收入由法律、法规、规章规定的部门、单位征收；法律、法规、规章未规定征收部门、单位的，由财政部门直接征收；财政部门可以依法委托其他部门、单位征收。未经批准，不得擅自改变非税收入执收单位。\"\
    \n  }\n]"
- expression: 部门预算汇总表.单位编码 NOT IN (机构编制文件.授权管理单位编码集合) && 部门预算汇总表.资金总额 > 0
  description: 筛选部门预算中列示但不在本部门三定方案授权管理范围内的单位，且确已安排预算资金，即视为将非所属预算单位纳入预算的违规行为。
  audit_item: 预算编制不规范
  suspicion: 将非所属预算单位纳入部门预算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十三条\"\
    ,\n    \"内容概述\": \"各部门编制本部门预算、决算草案，组织和监督本部门预算的执行。部门预算由本部门及其所属各单位预算组成，不得将非所属单位纳入预算。\"\n  }\n]"
- expression: （备案表.项目名称 LIKE '%技术改造%' AND 备案表.备案产能 - 验收报告.验收时实际建成产能 > 0 AND 明细表.置换比例 < 政策规定比例） OR （备案表.所属行业 IN 限制类、淘汰类生产工艺和装备条目、禁止类、限制类项目清单.限制类
    AND 备案表.备案产能 > 0）
  description: 技术改造项目原则上应不新增产能或在政策允许范围内等量置换。若技改备案产能大于原有产能且未执行产能置换或置换比例不足，即属变相扩产。同时，若项目属于产业结构调整目录限制类而违规备案新增产能，则直接触发违规。
  audit_item: 未按规定落实去产能政策措施
  suspicion: 以技改之名违规扩增落后产能
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于化解产能严重过剩矛盾的指导意见\",\n    \"法规文号\": \"国发〔2013〕41号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"三、（二）严禁建设新增产能项目\",\n    \"内容概述\": \"严禁各地备案和建设新增产能项目，确有必要新建的必须实行产能等量或减量置换。\"\n  },\n  {\n    \"法规名称\":\
    \ \"企业投资项目核准和备案管理条例\",\n    \"法规文号\": \"国务院令第673号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"\
    项目应当符合国家产业政策"
- expression: 备案表.项目行业类别 IN 限制类、淘汰类生产工艺和装备条目 OR （备案表.项目行业类别 IN 限制类、淘汰类生产工艺和装备条目 AND 备案表.备案时间 > 目录发布日期）
  description: 若项目所属行业或工艺在产业结构调整指导目录中被列为禁止类，无论任何情况均不得新建；若属于限制类，则原则上不得新建，除非经国务院投资主管部门核准。违规表达式直接检测项目是否属于禁止类或属于限制类但已备案，以此判定违规建设。
