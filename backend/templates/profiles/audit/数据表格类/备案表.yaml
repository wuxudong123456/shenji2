name: audit/数据表格类/备案表
type: model
description: 从数据表格类类文档（备案表）中提取结构化元数据。涵盖字段如：主要工艺、亲属关系、亲属姓名、企业名称、占用黑土地面积、变更后执收单位、变更日期、合同审批人。文档范围包括：会计账簿设置备案表、公共租赁住房竣工验收备案表、单一来源采购审批备案表、培训机构资质审核备案表、处理企业资质备案表、建设项目占用黑土地审批备案表、执法人员资质审核备案表、新建项目审批备案表、登记备案表、直系亲属经商办企业备案表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 合同
- 培训
- 审批
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 备案表
  member_count: 1
  member_details:
  - 会计账簿设置备案表
  - 公共租赁住房竣工验收备案表
  - 单一来源采购审批备案表
  - 培训机构资质审核备案表
  - 处理企业资质备案表
  - 建设项目占用黑土地审批备案表
  - 执法人员资质审核备案表
  - 新建项目审批备案表
  - 登记备案表
  - 直系亲属经商办企业备案表
  - 紧急维修审批备案表
  - 评估机构资质审查备案表
  - 跨区域垃圾转移联单备案表
  - 进口产品采购审批备案表
  - 重大合同备案表
  - 非税收入项目变动备案表
  - 预算单位银行账户备案表
