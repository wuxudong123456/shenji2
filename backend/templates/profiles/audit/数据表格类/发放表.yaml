name: audit/数据表格类/发放表
type: model
description: 从数据表格类类文档（发放表）中提取结构化元数据。涵盖字段如：人员姓名、其他收入、出勤天数、发放方式、发放日期、发放月份、发放金额、奖金。文档范围包括：工资发放表、村庄保洁员考勤与薪酬发放表、民政局补助发放表、社有企业工资发放表、薪酬发放表、退役军人事务局补助发放表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 薪酬
- 金额
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 发放表
  member_count: 1
  member_details:
  - 工资发放表
  - 村庄保洁员考勤与薪酬发放表
  - 民政局补助发放表
  - 社有企业工资发放表
  - 薪酬发放表
  - 退役军人事务局补助发放表
output:
  fields:
  - name: 人员姓名
    type: string
    description: 提取 人员姓名 的文本值
  - name: 其他收入
    type: number
    description: 提取 其他收入 的数值（含单位，如万元、吨等）
  - name: 出勤天数
    type: number
    description: 提取 出勤天数 的数值（含单位，如万元、吨等）
  - name: 发放方式
    type: string
    description: 提取 发放方式 的文本值
  - name: 发放日期
    type: date
    description: 提取 发放日期 的日期值，格式 YYYY-MM-DD
  - name: 发放月份
    type: string
    description: 提取 发放月份 的文本值
  - name: 发放金额
    type: number
    description: 提取 发放金额 的数值（含单位，如万元、吨等）
  - name: 奖金
    type: string
    description: 提取 奖金 的文本值
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 实发工资
    type: string
    description: 提取 实发工资 的文本值
  - name: 工资薪金
    type: string
    description: 提取 工资薪金 的文本值
  - name: 应发工资
    type: string
    description: 提取 应发工资 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 支付对象姓名
    type: string
    description: 提取 支付对象姓名 的文本值
  - name: 生活费金额
    type: number
    description: 提取 生活费金额 的数值（含单位，如万元、吨等）
  - name: 补助项目类别
    type: string
    description: 提取 补助项目类别 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (申报记录.扣缴义务人名称 != 本企业名称 && 申报记录.姓名 IN (登记表.姓名)) && (任职期间 IS NULL OR 登记表.是否申报兼职信息 = '否') && 申报记录.所得项目 IN ('劳务报酬所得','工资薪金所得')
  description: 通过个人所得税申报记录发现管理人员从本企业之外的其他单位取得工资或劳务报酬，但企业在册的兼职台账中无该记录或个人事项报告中未申报此项兼职，即认定违规兼职取酬。劳务报酬所得和工资薪金所得是判断外部雇佣关系的关键。
  audit_item: 违反廉洁从业有关规定问题
  suspicion: 管理人员在外违规兼职并获取报酬
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规\",\n   \
    \ \"条款号\": \"第五条（二）项\",\n    \"内容概述\": \"不得违反规定从事营利性经营活动，包括个人或者借他人名义经商、办企业。\"\n  },\n  {\n    \"法规名称\": \"关于规范国有企业职工持股、投资的意见\"\
    ,\n    \"法规文号\": \"国资发改革〔2008〕139号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"国有企业领导人员不得未经批准兼任本企"
- expression: 兼职审批文件.批准文号为空 || 兼职人员名册.应发报酬 > 0
  description: 参公管理人员未经批准在企业兼职即构成违规；无论是否批准，领取任何形式的报酬、补贴、奖金等均属违规，表达式判定领取金额大于0即触发。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 联合社参公管理人员未经批准在企业兼职并领取报酬
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十四条\",\n    \"内容概述\": \"公务员因工作需要在机关外兼职，应当经有关机关批准，并不得领取兼职报酬。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范党政领导干部在企业兼职（任职）问题的意见\"\
    ,\n    \"法规文号\": \"中组部发〔2013〕18号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"现职和不担任现职但未办理退（离）休手续的党政领导"
- expression: COUNT(负责村庄.保洁员姓名) < 应覆盖村庄数 || (发放表.姓名 NOT IN 缴纳记录.姓名) || (发放表.实发工资 > 0 && 发放表.出勤天数 = 0)
  description: 应设立保洁员的村庄实际合同人数小于需要的村庄数，或工资发放人员无社保记录疑为虚列，或有工资发放但无考勤记录判定为“幽灵员工”。
  audit_item: 农村生活垃圾收运处不符合规定
  suspicion: 未设立村庄保洁员或虚列保洁员
  regulation: "[\n  {\n    \"法规名称\": \"住房和城乡建设部等部门关于全面推进农村垃圾治理的指导意见\",\n    \"法规文号\": \"建村〔2015〕170号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、（五）\",\n    \"内容概述\": \"建立村庄保洁制度，建立稳定的村庄保洁队伍，明确保洁员职责和考核办法。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\"\
    ,\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当组织、指导对"
- expression: (COUNT(工资发放表.姓名) != COUNT(农民工实名制管理台账.姓名)) || (工资发放表.银行转账记录/现金签收笔迹 == "无" && 对工资发放表.银行转账记录/现金签收笔迹进行相似度分析 > 90%)
  description: 判定规则：1. 工资发放表中的人员数量或姓名与实名制考勤台账中的人员不一致，存在虚增人头、顶替名额等情况；2. 工资发放记录为现金发放且无银行转账凭证，同时多人签名字迹高度雷同（相似度超90%），疑似集中代签、伪造工资发放记录套取资金。符合任一条件即判定可疑。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 虚列农民工考勤及工资发放表
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十八条、第三十一条\",\n    \"内容概述\": \"施工总承包单位或者分包单位应当依法与所招用的农民工订立劳动合同并进行用工实名登记。施工总承包单位、分包单位应当建立用工管理台账，并保存至工程完工且工资全部结清后至少3年。用于支付农民工工资的银行账户所绑定的农民工本人社会保障卡或者银行卡，用人单位或者其他人员不得以任何理由扣押或者变相扣押。\"\
    \n  }\n]"
- expression: (资金划拨凭证.收款方 == 劳务分包公司账号) && (工程款支付凭证.收款单位 == 个人账户 && 工程款支付凭证.收款人姓名 IN (农民工实名制管理台账.姓名) && 工程款支付凭证.付款金额 > 200000)
  description: 判定规则：工资专用账户将款项划拨至合法的劳务分包公司账户后，总包单位或分包公司再通过其银行账户将大额资金（单笔或累计超过20万元）转给某个班组长等个人账户，并由其代为发放工资。这种将工资款交给‘包工头’个人、脱离银行直接代发的行为，极易引发挪用和拖欠风险。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 总包单位通过个人账户违规发放工资
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十一条\",\n    \"内容概述\": \"工程建设领域推行分包单位农民工工资委托施工总承包单位代发制度。施工总承包单位根据分包单位编制的工资支付表，通过农民工工资专用账户直接将工资支付到农民工本人的银行账户，并向分包单位提供代发工资凭证。用于支付农民工工资的银行账户所绑定的农民工本人社会保障卡或者银行卡，用人单位或者其他人员不得以任何理由扣押或者变相扣押。\"\
    \n  }\n]"
- expression: 身份证号、补助项目类别、发放金额、发放日期.身份证号 = 身份证号、补助项目类别、发放金额、发放日期.身份证号 && 身份证号、补助项目类别、发放金额、发放日期.补助项目类别 = 身份证号、补助项目类别、发放金额、发放日期.补助项目类别
  description: 若同一人在退役军人事务局和民政局均领取了性质相同的生活补助项目，且政策未允许叠加享受，即构成多部门重复发放违规。
  audit_item: 向不符合条件的人员发放保障待遇
  suspicion: 多部门重复发放同类生活补助给同一退役军人
  regulation: "[\n  {\n    \"法规名称\": \"《关于加强困难退役军人帮扶援助工作的意见》\",\n    \"法规文号\": \"退役军人部发〔2019〕49号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三（二）\",\n    \"内容概述\": \"建立帮扶援助台账，加强部门间信息共享，防止重复救助。\"\n  }\n]"
- expression: (从统计表.安置介绍信开出日期次月起至上岗前，生活费发放记录为空) || (发放表.生活费金额 < 编制表.同等条件人员平均工资 × 80%)
  description: 根据《退役士兵安置条例》，非因退役士兵本人原因未上岗的，接收单位应从安置介绍信开出当月起，按不低于本单位同等条件人员平均工资80%的标准逐月发放生活费。若未发放或发放标准低于80%，构成违规。
  audit_item: 未按规定落实退役士兵安置政策
  suspicion: 未向未安排上岗退役士兵发放生活费或发放标准不足
  regulation: "[\n  {\n    \"法规名称\": \"退役士兵安置条例\",\n    \"法规文号\": \"国务院、中央军委令第608号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"非因退役士兵本人原因，接收单位未按照规定安排上岗的，应当从安置部门开出介绍信的当月起，按照不低于本单位同等条件人员平均工资80%的标准，逐月发给生活费直至上岗为止。\"\n \
    \ }\n]"
