name: audit/数据表格类/流向表
type: model
description: 从数据表格类类文档（流向表）中提取结构化元数据。涵盖字段如：与经办人关系、关联方名称、到位日期、到位资金、拨付日期、拨付金额、收款单位、收款金额。文档范围包括：虚假会议套取资金关联方资金流向表、资源化利用项目财政补贴资金流向表、项目建设资金流向表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 拨款
- 明细
- 补贴
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 流向表
  member_count: 1
  member_details:
  - 虚假会议套取资金关联方资金流向表
  - 资源化利用项目财政补贴资金流向表
  - 项目建设资金流向表
output:
  fields:
  - name: 与经办人关系
    type: string
    description: 提取 与经办人关系 的文本值
  - name: 关联方名称
    type: string
    description: 提取 关联方名称 的文本值
  - name: 到位日期
    type: date
    description: 提取 到位日期 的日期值，格式 YYYY-MM-DD
  - name: 到位资金
    type: string
    description: 提取 到位资金 的文本值
  - name: 拨付日期
    type: date
    description: 提取 拨付日期 的日期值，格式 YYYY-MM-DD
  - name: 拨付金额
    type: number
    description: 提取 拨付金额 的数值（含单位，如万元、吨等）
  - name: 收款单位
    type: number
    description: 提取 收款单位 的数值（含单位，如万元、吨等）
  - name: 收款金额
    type: number
    description: 提取 收款金额 的数值（含单位，如万元、吨等）
  - name: 施工方垫资款金额
    type: number
    description: 提取 施工方垫资款金额 的数值（含单位，如万元、吨等）
  - name: 来源
    type: string
    description: 提取 来源 的文本值
  - name: 补贴批次
    type: string
    description: 提取 补贴批次 的文本值
  - name: 补贴类型
    type: string
    description: 提取 补贴类型 的文本值
  - name: 财政拨款明细
    type: number
    description: 提取 财政拨款明细 的数值（含单位，如万元、吨等）
  - name: 转入金额
    type: number
    description: 提取 转入金额 的数值（含单位，如万元、吨等）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (会议费报销明细表.参会人数 > 会议签到表.实际签到人数 * 1.2) || (SUM(会议费报销明细表.报销金额) - SUM(会议费预算编制与执行对比表.实际支出金额) > 0 && 银行流水.收款方 IN (虚假会议套取资金关联方资金流向表.关联方名称))
    || (会议费预算编制与执行对比表.结余金额 > 0 && 会议费报销明细表.实际支出明细（场地费、餐费、住宿费、资料费等） IS NULL)
  description: 通过虚报参会人数多申领费用、将会议结余资金转入关联方或个人账户、结余资金未退还财政等情形判定挪用、截留或侵占。人数虚报比例超过20%，或报销金额大于实际支出且收款方为关联方，或有结余但无退款记录均触发疑点。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 挪用、截留、侵占会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁各单位借会议名义组织会餐或安排宴请；严禁套取会议费设立‘小金库’；严禁在会议费中列支公务接待费。会议费支付应当严格按国库集中支付和公务卡管理规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\
    \n  }\n]"
- expression: （NOT EXISTS（会议签到表.会议名称 = 会议费报销明细表.会议名称）|| 会议签到表.实际签到人数 = 0 || 会议纪要.会议现场照片 IS NULL） && 会议费报销明细表.报销金额 > 5000 &&
    （银行流水.收款方 IN （虚假会议套取资金关联方资金流向表.关联方名称）|| 银行流水.用途摘要 IS NULL）
  description: 判断会议是否虚构：无签到记录或签到人数为0，或缺乏影像资料等实质性证明，且报销金额较大（如超过5000元），同时资金流向关联方或用途不明，视为虚列会议套取资金。重点关注报销后资金回流至经手人或关联账户的特征。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 虚列会议费套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有虚报、冒领等手段骗取财政资金的行为，将给予相应处理。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n  \
    \  \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁套取会议费设立‘小金库’；严禁在会议费中列支公务接待费等规"
- expression: (沼气发电项目上网电量统计表.实际上网电量 < 沼气发电项目上网电量统计表.可发电量 * 0.95) OR (电力公司收购协议.合同电价 < 沼气发电上网标杆电价政策执行文件.标杆电价) OR (DATEDIFF(结算日期,应结算日期)
    > 30)
  description: 三个或条件：1.电量全额保障性收购率低于95%（即弃电率>5%），收购率=实际上网电量/可发电量；2.实际结算电价低于国家规定的沼气发电标杆电价（如0.75元/度）；3.电网公司结算周期超过政策规定的月度或季度结算时限，延迟超过30天。符合任一条件判定为政策落实不到位。
  audit_item: 配套政策支持不到位
  suspicion: 沼气发电上网电价及全额保障收购政策执行打折
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国可再生能源法\",\n    \"法规文号\": \"中华人民共和国主席令第二十三号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十四条、第十九条\",\n    \"内容概述\": \"电网企业应当全额收购其电网覆盖范围内可再生能源并网发电项目的上网电量；可再生能源发电项目的上网电价，由政府价格主管部门按照有利于促进可再生能源开发利用和经济合理的原则确定。\"\
    \n  },\n  {\n    \"法规名称\": \"关于促进生物天然气产业化发展的指导意见\",\n    \"法规文号\": \"发改能源规〔2019〕1895号\",\n    \"效力级别\": \"部门"
- expression: (补贴发放明细表.实际发放金额 < 补贴发放明细表.应补贴金额 * 0.90) OR (补贴发放明细表.设备名称 NOT IN (推荐清单.推荐装备名称) AND 补贴发放明细表.实际发放金额 > 0) OR (DATEDIFF(资金流向表.到位日期,
    补贴发放明细表.申报日期) > 180)
  description: 三个异常条件：1.补贴资金到位率低于90%（即个别或整体欠拨超过10%）；2.发放的补贴设备不在农业农村部推荐清单或地方补贴目录内，存在非目录设备违规划入补贴范围；3.从申报到资金到账周期超过6个月，显示资金拨付滞留。满足任一条件即认定补贴不到位。
  audit_item: 配套政策支持不到位
  suspicion: 畜禽粪污资源化利用装备补贴资金滞留或未覆盖
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部办公厅关于印发《畜禽粪污资源化利用技术装备推荐清单》的通知\",\n    \"法规文号\": \"农办机〔2022〕4号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"全文\",\n    \"内容概述\": \"明确了鼓励推广的粪污收集、处理、利用等环节的技术装备种类，要求各地在政策支持中参照执行。\"\n  },\n  {\n    \"法规名称\"\
    : \"农业部 国家发展改革委 财政部等关于推进畜禽养殖废弃物资源化利用的意见\",\n    \"法规文号\": \"农科教发〔2017〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \""
- expression: (协议内容包含‘施工方垫付资本金’ OR 资金流出现垫资记录) && (协议内容包含‘政府回购’ OR 融资审批中明确BT模式)
  description: 施工方带资并约定政府远期回购义务，属于违规BT模式。根据财预〔2017〕50号文禁止，同时违反《政府投资条例》不得垫资建设的规定。
  audit_item: 项目建设管理不符合相关规定
  suspicion: 农村公路建设违规采用施工方带资的BT模式
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十二条第一款\"\
    ,\n    \"内容概述\": \"政府投资项目不得由施工单位垫资建设。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范地方政府举债融资行为的通知\",\n    \"法规文号\": \"财预〔2017〕50号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条、第四条\",\n    \"内容概述\": \"严禁地方政府利用PPP、政府出资的各类投资基金等方式违法违规变相举债，禁止以BT方式举借"
