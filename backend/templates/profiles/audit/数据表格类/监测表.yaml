name: audit/数据表格类/监测表
type: model
description: 从数据表格类类文档（监测表）中提取结构化元数据。涵盖字段如：停电频率、储备品种、区域、呼吸道感染等事件发生日期、园区所在区域、在册学生人数、学年月份、学校ID。文档范围包括：入住老人健康监测表、入库资源存活率监测表、农村配电网供电可靠性指标监测表、库存动态监测表、房屋使用状态动态监测表、班级学生人数动态监测表、资金结存状态动态监测表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 监测表
  member_count: 1
  member_details:
  - 入住老人健康监测表
  - 入库资源存活率监测表
  - 农村配电网供电可靠性指标监测表
  - 库存动态监测表
  - 房屋使用状态动态监测表
  - 班级学生人数动态监测表
  - 资金结存状态动态监测表
output:
  fields:
  - name: 停电频率
    type: string
    description: 提取 停电频率 的文本值
  - name: 储备品种
    type: string
    description: 提取 储备品种 的文本值
  - name: 区域
    type: string
    description: 提取 区域 的文本值
  - name: 呼吸道感染等事件发生日期
    type: date
    description: 提取 呼吸道感染等事件发生日期 的日期值，格式 YYYY-MM-DD
  - name: 园区所在区域
    type: string
    description: 提取 园区所在区域 的文本值
  - name: 在册学生人数
    type: number
    description: 提取 在册学生人数 的数值（含单位，如万元、吨等）
  - name: 学年月份
    type: date
    description: 提取 学年月份 的日期值，格式 YYYY-MM-DD
  - name: 学校ID
    type: string
    description: 提取 学校ID 的文本值
  - name: 实时库存量
    type: string
    description: 提取 实时库存量 的文本值
  - name: 平均停电持续时间
    type: date
    description: 提取 平均停电持续时间 的日期值，格式 YYYY-MM-DD
  - name: 异常情况
    type: string
    description: 提取 异常情况 的文本值
  - name: 感染性腹泻
    type: string
    description: 提取 感染性腹泻 的文本值
  - name: 房屋编号
    type: string
    description: 提取 房屋编号 的文本值
  - name: 日常实到人数
    type: number
    description: 提取 日常实到人数 的数值（含单位，如万元、吨等）
  - name: 样本数量
    type: number
    description: 提取 样本数量 的数值（含单位，如万元、吨等）
  - name: 沉淀原因分类
    type: string
    description: 提取 沉淀原因分类 的文本值
  - name: 沉淀时长
    type: string
    description: 提取 沉淀时长 的文本值
  - name: 沉淀起始日期
    type: date
    description: 提取 沉淀起始日期 的日期值，格式 YYYY-MM-DD
  - name: 涉及人数
    type: number
    description: 提取 涉及人数 的数值（含单位，如万元、吨等）
  - name: 混杂记录
    type: string
    description: 提取 混杂记录 的文本值
  - name: 班级代码
    type: string
    description: 提取 班级代码 的文本值
  - name: 班级名称
    type: string
    description: 提取 班级名称 的文本值
  - name: 电压合格率
    type: string
    description: 提取 电压合格率 的文本值
  - name: 监测异常描述
    type: string
    description: 提取 监测异常描述 的文本值
  - name: 监测日期
    type: date
    description: 提取 监测日期 的日期值，格式 YYYY-MM-DD
  - name: 监测时间
    type: date
    description: 提取 监测时间 的日期值，格式 YYYY-MM-DD
  - name: 种子霉变记录
    type: string
    description: 提取 种子霉变记录 的文本值
  - name: 结存金额
    type: number
    description: 提取 结存金额 的数值（含单位，如万元、吨等）
  - name: 账户余额
    type: number
    description: 提取 账户余额 的数值（含单位，如万元、吨等）
  - name: 资源编码
    type: string
    description: 提取 资源编码 的文本值
  - name: 资金性质
    type: string
    description: 提取 资金性质 的文本值
  - name: 轮换记录
    type: string
    description: 提取 轮换记录 的文本值
  - name: 闲置资金金额
    type: number
    description: 提取 闲置资金金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (消毒登记台账.消毒日期 / 管理制度.规定消毒频次（如公共区域每日≥2次）) < 0.8
  description: 应消毒次数依据机构依法建立的卫生制度确定，如规定公共活动区域每日消毒不少于2次，房间每周不少于3次等。月度消毒执行率低于80%即视为未定期消毒清洗；若同期出现感染事件或第三方检测不合格，则风险等级上调。
  audit_item: 农村养老服务政策实施不规范、建设质量不达标
  suspicion: 养老机构未按规定对场所物品进行消毒清洗
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十条\",\n    \"内容概述\": \"养老机构应当建立卫生消毒制度，定期对老年人活动、生活场所和物品进行消毒和清洗，防止疾病传播。\"\n  }\n]"
- expression: ((统计表.申请用电容量（kVA） - 统计表.实际批复用电容量（kVA）) / 统计表.申请用电容量（kVA） > 0.10) && (监测表.电压合格率（%） < 95 || 数据表.变压器负载率（%） > 80)
  description: 当农业加工企业申请用电容量缺口率超过10%，且所在区域供电可靠性监测连续3个月电压合格率低于95%，或变压器负载率长期超过80%时，触发疑点。缺口率阈值10%根据一般需求保障偏差设定；电压合格率95%及变压器负载率80%为行业普遍公认的供电质量与安全边界。
  audit_item: 农村配套供电设施建设不到位
  suspicion: 农业生产电气化供电需求保障不到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电力法\",\n    \"法规文号\": \"主席令第60号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十八条\"\
    ,\n    \"内容概述\": \"供电企业应当保证供给用户的供电质量符合国家标准。对公用供电设施引起的供电质量问题，应当及时处理。\"\n  }\n]"
- expression: (园区名称、规划双回路电源要求、计划竣工时间、实际投运时间.实际投运时间 - 园区名称、规划双回路电源要求、计划竣工时间、实际投运时间.计划竣工时间 > 90天) || (区域、电压合格率（%）、停电频率（次/年）、园区所在区域、平均停电持续时间（小时/次）.停电频率（次/年）
    > 5次/年 && 故障地点、故障类型、报修时间、修复时间.修复时间 > 4小时) || 园区配电变压器负载率（%）、进线电压偏差（%）、监测点、变压器负载率（%）、峰值负荷（kW）、农田排灌变压器编号、负载率（%）、投运时间、机井变压器负载率（%）、电流值（A）.进线电压偏差（%）
    > 7%
  description: 工业园区供电配套迟于计划竣工时间90天以上视为建设滞后；年停电频率超过5次且平均抢修修复时间超过4小时，表明运行维护不到位；进线电压偏差超过国家标准±7%视为供电质量不合格。以上任一条件满足即触发疑点。
  audit_item: 农村配套供电设施建设不到位
  suspicion: 农村工业园区及新基建供电配套服务不到位
  regulation: "[\n  {\n    \"法规名称\": \"供电监管办法\",\n    \"法规文号\": \"国家电力监管委员会令第27号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"供电企业应当按照法律、行政法规和规章的规定，向用户提供质量合格、安全可靠的电力，并按照国家规定的电能质量标准供电。\"\n  }\n]"
- expression: (对照表.实际拨付农户日期-对照表.资金到账日期>30) && (流程文件.延期审批单==null || 流程文件.审批结果!="同意延期")
  description: 资金到达财政、主管部门或乡镇账户后，超过30天未拨付至下一环节或受益农户，且无合规的延期审批手续，视为资金滞留。30天阈值依据常见管理要求设定，可根据实际制度调整；超过60天且金额较大为高风险。
  audit_item: 惠农财政补贴资金滞留、闲置
  suspicion: 补贴资金滞留在财政、业务主管部门或乡镇账户
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\"\
    ,\n    \"内容概述\": \"各级政府财政部门必须依照法律、行政法规和国务院财政部门的规定，及时、足额地拨付预算支出资金，加强对预算支出的管理和监督。\"\n  },\n  {\n    \"法规名称\": \"惠农财政补贴资金管理办法及实施细则\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第X条（假设）\",\n    \"内容概述\": \"明确资金拨付各环节时限要求，超过时限需提交延期说"
- expression: (明细表.失败原因代码=="账号错误|户名不符|账户不存在") && (当前日期-退回凭证.退回日期>30) && (监测表.资金性质=="未重发")
  description: 银行转账失败后，资金退回至财政或部门账户，若30天内主管部门未启动信息核实与重新发放程序，即形成闲置。30天为发现问题至启动处理的合理期限，各地制度可能有更严要求。退回后超过90天未处置为高风险，金额累计超10万元需重点预警。
  audit_item: 惠农财政补贴资金滞留、闲置
  suspicion: 农户账户信息错误导致补贴资金退回长期闲置
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十七条\"\
    ,\n    \"内容概述\": \"及时、足额拨付预算支出资金，因发放失败导致的资金退回，仍负有及时足额发放的义务，不得无故使资金闲置。\"\n  },\n  {\n    \"法规名称\": \"惠农财政补贴资金管理办法及实施细则\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第XXX条（假设）\",\n    \"内容概述\": \"明确规定因账户信息错误导致发放失败的，应在10个工作日内通知农户"
- expression: (当前日期-资金清单.未发放起始年月>730天) && (监测表.沉淀原因分类!=true) && (流程文件.审批结果==null)
  description: 资金连续未发放时间超过730天（2年），且未按规定程序进行清理收回或重新安排使用，即构成资金闲置违规。2年红线依据国办发〔2014〕70号文规定，凡结转资金超2年一律收回财政统筹。若同时产息未上缴，应另案处理。
  audit_item: 惠农财政补贴资金滞留、闲置
  suspicion: 补贴资金闲置超过2年未清理
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步做好盘活财政存量资金工作的通知\",\n    \"法规文号\": \"国办发〔2014〕70号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各部门、各单位要加大结余结转资金统筹使用力度，对结余资金和连续两年未用完的结转资金，一律收回财政统筹使用。\"\n  },\n  {\n    \"法规名称\"\
    : \"惠农财政补贴资金管理办法及实施细则\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第X章关于存量清理的条款\",\n    \"内容概述\"\
    : "
- expression: (监测表.实时库存量 < 分解表.计划数量 * 0.9) || (检测报告.判定结论 == "不合格" && 登记表.不合格处理记录.isBlank()) || (监测表.储备品种 not.in 计划文件.计划储备品种)
  description: 以年度任务计划为基准，实际库存量低于计划数量的90%即视为数量未达标；质量检测结论为不合格且抽检登记表中无任何处理措施（如降级、转商、销毁）则判定质量管控失效；实际库存品种与计划品种存在差异且无审批变更手续的，视为擅自变更储备品种。三项满足任一即为疑点。
  audit_item: 救灾备荒种子储备方面不符合相关规定
  suspicion: 救灾备荒种子储备任务未完成或质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"国家救灾备荒种子储备管理办法\",\n    \"法规文号\": \"农农发〔2015〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条、第十条\",\n    \"内容概述\": \"承储单位应严格按照下达的储备计划完成储备任务，确保储备种子的品种、数量和质量符合要求；储备种子质量应符合国家或行业标准。\"\n  }\n]"
- expression: (许可证.许可作物种类 not.in 年度储备任务计划文件.计划储备品种) || (评估表.有效库容 < 储备任务分解表.计划总数量) || ((评估表.温湿度控制设备 == "无" || 评估表.防潮通风设施 ==
    "不达标") && 监测表.种子霉变记录 > 0)
  description: 种子经营许可证的许可范围未覆盖储备品种即属超范围承储；库容小于任务计划总量则仓储能力先天不足；仓库缺乏必要的温湿度控制设备且库存记录已出现霉变，证明管理能力实质性缺失。三项条件任一成立即构成疑点。
  audit_item: 救灾备荒种子储备方面不符合相关规定
  suspicion: 承储企业资质不达标或储备管理能力不足
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国种子法\",\n    \"法规文号\": \"2021年修订版\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十一条、第六十条\",\n    \"内容概述\": \"从事种子生产经营须取得种子生产经营许可证；承担救灾备荒种子储备任务的企业应具备相应的仓储设施、技术能力和信用条件。\"\n  }\n]"
- expression: (出库台账.出库类型 == "销售" && 出库台账.品名.like("%救灾备荒种子%")) || (出库台账.出库类型 == "调拨" && 审批文件.审批编号.isNull()) || (监测表.储备品种 not.in
    审批文件.调用事由 && 监测表.轮换记录.isNull())
  description: 出库类型为销售且品名含救灾备荒种子关键词即直接判定为违规销售；调拨出库记录必须匹配唯一的审批编号，若为空则属私自调用；实际库存中出现计划外品种且无法提供主管部门批准的轮换或调剂手续，视为擅自变更储备作物种类。三种情形直接触犯储备种子动用红线。
  audit_item: 救灾备荒种子储备方面不符合相关规定
  suspicion: 承储企业违规调用、售卖救灾备荒种子或擅自改变储备品种
  regulation: "[\n  {\n    \"法规名称\": \"国家救灾备荒种子储备管理办法\",\n    \"法规文号\": \"农农发〔2015〕1号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条、第十六条\",\n    \"内容概述\": \"储备种子仅限用于农业救灾、备荒等应急情形，未经省级农业农村主管部门批准，任何单位和个人不得动用、销售或进行商业性经营利用；储备品种需保持相对稳定，轮换须报批。\"\
    \n  }\n]"
- expression: ((监测表.监测时间 > 规定监测频率（如每季度/半年/1年）、繁殖更新周期标准（如3年/5年）.规定监测频率（如每季度/半年/1年） * 3) || (对比表.实际更新日期 - 对比表.计划更新日期 > 365天))
    && (操作记录.休眠期标注 IS NULL || 监测表.异常情况 == '无')
