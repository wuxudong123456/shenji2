name: audit/数据表格类/盘点表
type: model
description: 从数据表格类类文档（盘点表）中提取结构化元数据。涵盖字段如：存储位置、实盘数量、实盘药品数量、差异说明、库存现金余额、库存现金实存数、物资名称、白条抵库记录。文档范围包括：存货盘点表、库存物资盘点表、库存现金盘点表、捐赠物资库存盘点表、现金盘点表、盘点表、货币资金盘点表（含现金/银行存款）等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 盘点表
  member_count: 1
  member_details:
  - 存货盘点表
  - 库存物资盘点表
  - 库存现金盘点表
  - 捐赠物资库存盘点表
  - 现金盘点表
  - 盘点表
  - 货币资金盘点表（含现金/银行存款）
output:
  fields:
  - name: 存储位置
    type: string
    description: 提取 存储位置 的文本值
  - name: 实盘数量
    type: number
    description: 提取 实盘数量 的数值（含单位，如万元、吨等）
  - name: 实盘药品数量
    type: number
    description: 提取 实盘药品数量 的数值（含单位，如万元、吨等）
  - name: 差异说明
    type: string
    description: 提取 差异说明 的文本值
  - name: 库存现金余额
    type: number
    description: 提取 库存现金余额 的数值（含单位，如万元、吨等）
  - name: 库存现金实存数
    type: string
    description: 提取 库存现金实存数 的文本值
  - name: 物资名称
    type: string
    description: 提取 物资名称 的文本值
  - name: 白条抵库记录
    type: string
    description: 提取 白条抵库记录 的文本值
  - name: 盘点人签名
    type: string
    description: 提取 盘点人签名 的文本值
  - name: 盘点日期
    type: date
    description: 提取 盘点日期 的日期值，格式 YYYY-MM-DD
  - name: 盘点现金余额
    type: number
    description: 提取 盘点现金余额 的数值（含单位，如万元、吨等）
  - name: 账面应有库存数量
    type: number
    description: 提取 账面应有库存数量 的数值（含单位，如万元、吨等）
  - name: 账面现金余额
    type: number
    description: 提取 账面现金余额 的数值（含单位，如万元、吨等）
  - name: 质量状态标识
    type: boolean
    description: 提取 质量状态标识 的布尔值（是/否）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 银行存款实存数
    type: number
    description: 提取 银行存款实存数 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (库存现金实存数.库存现金实存数 != 余额表.现金期末余额) || (银行对账单.期末余额 != 余额表.银行存款期末余额 && 未编制有效调节表) || (银行对账单.调节后余额 != 余额表.银行存款期末余额
    && 无审计调整说明)
  description: 现金盘点实存数与账面不一致，或银行对账单余额与账面银行存款不一致，且未能提供调节表或调节后仍有差异，且无合理审计调整说明，视为账实不符且未查明原因。
  audit_item: 未按规定进行年终清理结算和结账，导致决算报表数据与实际情况不符
  suspicion: 货币资金账实不符且未查明原因
  regulation: "[\n  {\n    \"法规名称\": \"《会计基础工作规范》\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十二条\",\n    \"内容概述\": \"各单位应当定期将会计账簿记录与实物、款项及有关资料相互核对，保证账实相符。\"\n  }\n]"
- expression: ABS((存货收发存汇总表.期初余额 + 产量统计表.当期完工产量 - 产品销售量统计表.当期销售量) - 存货收发存汇总表.期末余额（分产品）) > 存货收发存汇总表.期末余额（分产品） * 5% || (((存货收发存汇总表.期末余额（分产品）
    - 存货收发存汇总表.期初余额) / 存货收发存汇总表.期初余额) > (产品销售量统计表.销售增长率 + 30%))
  description: 产销量与库存变动应满足永续盘存等式，差异超过5%表明账实不符或虚列存货。存货余额增速远超收入增速，可能意味着产品滞销、虚假入库或未及时结转成本，构成异常信号。
  audit_item: 企业财务报表分析
  suspicion: 存货余额与产销量勾稽关系异常
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第四条、第十五条\",\n    \"内容概述\": \"存货同时满足与该存货有关的经济利益很可能流入企业、成本能够可靠计量时予以确认。企业应当在资产负债表日，按成本与可变现净值孰低计量，差额计提跌价准备，不得隐瞒减值迹象。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n   \
    \ \"内容概"
- expression: EXISTS(出租合同.合同编号) && (出租合同.租金总额 - SUM(明细账.确认收入金额)) > 0
  description: 存在出租合同，但账面未全额确认相应租金收入，差额部分资金可能落入账外账户或个人账户，形成“小金库”。
  audit_item: 未按规定核算资产
  suspicion: 违规设置“小金库”
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第81号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"各单位发生的各项经济业务事项应当在依法设置的会计账簿上统一登记、核算，不得违反本法和国家统一的会计制度的规定私设会计账簿登记、核算。\"\n  }\n]"
- expression: (收支台账.医疗服务收入金额 IS NULL AND 收支台账.药品销售收入金额 IS NULL AND 收支台账.各项支出金额 IS NULL) || (资产登记表.资产名称 IS NULL) || ABS(处方汇总.处方收入总额
    - 收支台账.医疗服务收入金额) / 处方汇总.处方收入总额 > 0.1 || (ABS(盘点表.实盘药品数量 - 盘点表.账面应有库存数量) / 盘点表.账面应有库存数量 > 0.05)
  description: 未建立收支账簿属严重内控缺失；账实差异率>10%或盘点差异率>5%表明资金、资产管理混乱，可能隐藏小金库或资产流失问题。
  audit_item: 乡镇卫生院、村卫生室布局和标准化建设不符合相关规定
  suspicion: 村卫生室未建立规范的财务收支账目及资产登记
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第九条、第十六条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计账簿；不得私设会计账簿。\"\n  },\n  {\n    \"法规名称\": \"基层医疗卫生机构财务制度\"\
    ,\n    \"法规文号\": \"财社〔2010〕307号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第七条、第十八条\",\n    \"内容概述\": \"政府举办的基层医疗卫生机构应当建立健全"
- expression: (比对表.实际检测值 < 比对表.标准要求值) || (证明文件.保质期截止日 < 物资接收日期) || (证明文件.生产许可证号 == null || 证明文件.合格证编号 == null)
  description: 存在以下任一情况即判定为接收不合格物资：①关键质量指标检测值低于行业或合同约定标准（如口罩过滤效率<95%）；②物资接收时已超过保质期；③缺少必要的生产许可证或合格证。
  audit_item: 社会捐赠款物接收管理不合规
  suspicion: 接收质量不合格的捐赠物资
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号（2016年）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十五条\",\n    \"内容概述\": \"慈善组织接受捐赠，应当查验捐赠物资是否符合安全、卫生、环保等标准；不符合标准的，不得接受。\"\n  }\n]"
- expression: (是否明确专人管理条款.是否明确专人管理条款 = TRUE) || (物资管理岗位名称、指定责任人.指定责任人 IS NULL) || (经手人签名、审核人签名、领用人签名、登记日期、物资名称数量、物资编号、关联台账记录号.经手人签名
    IS NULL || 经手人签名、审核人签名、领用人签名、登记日期、物资名称数量、物资编号、关联台账记录号.审核人签名 IS NULL || 经手人签名、审核人签名、领用人签名、登记日期、物资名称数量、物资编号、关联台账记录号.领用人签名
    IS NULL)
  description: 任一条件触发即视为违规：制度文件未明确专人管理；岗位职责未指定具体责任人；出入库登记表存在签字缺失。该类问题反映管理责任不清、手续不全，可能导致物资失控。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 捐赠物资未落实专人管理且出入库手续不健全
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公益事业捐赠法\",\n    \"法规文号\": \"主席令第19号\",\n    \"效力级别\": \"法律\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"受赠人应当建立健全财务会计制度和受赠财产的使用制度，加强对受赠财产的管理。\"\n  }\n]"
