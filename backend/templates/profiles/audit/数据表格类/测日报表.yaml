name: audit/数据表格类/测日报表
type: model
description: 从数据表格类类文档（测日报表）中提取结构化元数据。涵盖字段如：同比涨幅、猪粮比价、猪肉零售均价、生猪出场价格、监测日期。文档范围包括：市场价格波动监测日报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 测日报表
  member_count: 1
  member_details:
  - 市场价格波动监测日报表
output:
  fields:
  - name: 同比涨幅
    type: string
    description: 提取 同比涨幅 的文本值
  - name: 猪粮比价
    type: string
    description: 提取 猪粮比价 的文本值
  - name: 猪肉零售均价
    type: string
    description: 提取 猪肉零售均价 的文本值
  - name: 生猪出场价格
    type: number
    description: 提取 生猪出场价格 的数值（含单位，如万元、吨等）
  - name: 监测日期
    type: date
    description: 提取 监测日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (日报表.猪粮比价 < 机制文件.过度下跌预警阈值（如猪粮比） && DATEDIFF(决策文件.投放令签发日期, 日报表.监测日期) > 机制文件.时限要求) || (日报表.猪粮比价 < 机制文件.过度下跌预警阈值（如猪粮比）
    && 决策文件 == NULL)
  description: 当价格监测数据达到过度下跌预警阈值（如猪粮比低于5:1）后，未在规定时限内（如7个工作日）作出收储决策或未形成任何决策文件，即判定为未按规定实施临时收储。
  audit_item: 落实政府猪肉储备政策不到位
  suspicion: 价格过度下跌时未启动临时储备收储
  regulation: "[\n  {\n    \"法规名称\": \"关于完善政府猪肉储备调节机制 做好猪肉市场保供稳价工作预案\",\n    \"法规文号\": \"发改价格〔2021〕770号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"三、（二）临时储备收储\",\n    \"内容概述\": \"当猪粮比价进入过度下跌一级预警区间时，由地方人民政府负责启动临时储备收储，收储数量、时间、价格等由各地根据预案具体确定，并规定响应启动时限和资金保障。\"\
    \n  }\n]"
- expression: (测日报表.同比涨幅 > 过度下跌预警阈值（如猪粮比）.过度上涨预警阈值 && DATEDIFF(决策文件.投放令签发日期, 测日报表.监测日期) > 过度下跌预警阈值（如猪粮比）.投放响应时限) || (决策文件.计划投放数量
    > 0 && 记录表.投放数量 / 决策文件.计划投放数量 < 0.8)
  description: 当猪肉零售价同比涨幅超过制度规定的过度上涨阈值（如40%）后，超过规定响应时限未作出投放决策，或虽已决策但实际投放量不足计划量的80%，均属违规。
  audit_item: 落实政府猪肉储备政策不到位
  suspicion: 价格过度上涨时未及时投放政府猪肉储备
  regulation: "[\n  {\n    \"法规名称\": \"关于完善政府猪肉储备调节机制 做好猪肉市场保供稳价工作预案\",\n    \"法规文号\": \"发改价格〔2021〕770号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"三、（三）储备投放\",\n    \"内容概述\": \"当猪肉价格出现过度上涨时，地方政府应适时投放政府猪肉储备，增加市场供应，引导价格合理运行，投放数量、价格和区域需满足预案要求，确保投放实效。\"\
    \n  }\n]"
