name: audit/数据表格类/路线表
type: model
description: 从数据表格类类文档（路线表）中提取结构化元数据。涵盖字段如：路线编号、运营车辆类型、途经路段桩号。文档范围包括：隐患路段客运运行路线表、隐患路段校车运行路线表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 车辆
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 路线表
  member_count: 1
  member_details:
  - 隐患路段客运运行路线表
  - 隐患路段校车运行路线表
output:
  fields:
  - name: 路线编号
    type: string
    description: 提取 路线编号 的文本值
  - name: 运营车辆类型
    type: string
    description: 提取 运营车辆类型 的文本值
  - name: 途经路段桩号
    type: string
    description: 提取 途经路段桩号 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (运营车辆类型表.途经路段桩号 IN (问题台账.隐患路段桩号 WHERE 问题台账.防护设施状态='缺失' OR 问题台账.隐患类型 IN ('急弯视距不足','临崖无护栏'))) AND (审批文件.审批状态='有效')
    OR (分析表.事故原因 LIKE '%隐患未整改%' AND 分析表.事故地点桩号 IN 运营车辆类型表.途经路段桩号)
  description: 客运或校车审批路线途经的桩号与隐患台账中防护设施缺失或急弯视距不足的隐患路段重合，且审批有效，即构成违规运营；已发生事故且事故原因与未整改隐患直接相关，进一步证实隐患未排除即允许运营的问题。
  audit_item: 安全隐患排查整治不到位
  suspicion: 存在隐患路段违规运营客运班线或校车
  regulation: "[\n  {\n    \"法规名称\": \"农村道路客运旅客运输班线安全通行条件审核规则\",\n    \"法规文号\": \"交运发〔2014〕258号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"农村道路客运班线途经的急弯、陡坡、临崖、临水等危险路段，应当设置必要的安全防护设施和警示标志。\"\n  },\n  {\n    \"法规名称\":\
    \ \"校车安全管理条例\",\n    \"法规文号\": \"国务院令第617号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"校车行驶线路应当尽量避开急弯、陡"
