    \n  }\n]"
- expression: 剥离企业办社会职能进度跟踪表.计划完成率 < 100% && (当前日期 - 改革完成时间节点责任部门.改革完成时间节点 > 0) && 医疗机构执业许可证.登记性质 仍为 '企业办'
  description: 进度跟踪表中教育医疗机构改革完成率未达100%，且当前日期已超过实施方案规定的最晚完成时间，同时医疗机构执业许可证仍登记为企业办性质，表明改革滞后或未完成。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
