name: audit/数据表格类/跟踪表
type: model
description: 从数据表格类类文档（跟踪表）中提取结构化元数据。涵盖字段如：上报时间、交易实施日、会议纪要编号、关联会议记录编号、决策主体类型、决策会议环节状态、决策内容、决策层级。文档范围包括：企业债券或新股发行资金流向跟踪表、保护任务完成进度跟踪表、保证金退还审批流程跟踪表、保障房项目建设进度跟踪表、公路质量抽检问题整改跟踪表、决策流程跟踪表、剥离企业办社会职能进度跟踪表、危桥改造进度跟踪表、培训后就业率/技能等级提升跟踪表、备案/核准流程跟踪表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 会议
- 培训
- 审批
- 元数据提取
