  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 选择性整改：仅整改简单问题，回避重大风险问题
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"被审计单位应当全面整改审计查出的问题，不得选择性整改。\"\n  }\n]"
- expression: (战略目标分解及完成情况对照表.目标完成率 < 0.8) || (ABS(核心指标完成率趋势分析表.连续三年核心指标完成率趋势) < -0.1 && 战略目标分解及完成情况对照表.目标完成率 < 同业对标数据比较表.行业平均完成水平)
    || (重大项目执行进度跟踪表.滞后天数 > 项目总工期的20% && 战略目标分解及完成情况对照表.未达标指标项)
  description: 1.规划期内设定的国家级战略指标（如研发突破数、产能利用率）完成率低于80%为可疑；2.若完成率连续三年下滑且低于行业均值，说明执行持续恶化；3.关键支撑项目进度延误超过20%且直接导致战略目标未达成，视为执行层面重大缺陷。
  audit_item: 企业发展战略规划的制定、执行和效果
  suspicion: 战略规划核心目标未按期完成或未达预期
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强中央企业战略规划管理工作的指导意见\",\n    \"法规文号\": \"国资发规划〔2018〕54号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"四、（三）\",\n    \"内容概述\": \"中央企业应建立战略规划执行评估机制，对规划目标完成情况进行动态跟踪和考核，对未完成目标的责任人按相关规定进行问责。\"\n  }\n]"
- expression: (损失浪费事项统计台账.损失金额 > 企业净资产×0.005) || (重大项目执行进度跟踪表.超概算比例 > 0.2 && 未经追加审批) || (资源配置效率分析表.产能利用率 < 0.4) || (重大投资项目可行性研究报告.预期市场收益
    / 重大投资项目可行性研究报告.项目预期收益 < 0.5)
  description: 1.单个战略相关项目造成的损失超过净资产的0.5%即触发重大损失预警；2.超概算20%以上且缺少有效的追加审批，表明投资失控；3.建成后产能利用率不足40%，说明资产闲置浪费严重；4.实际收益不到可研预期的一半，反映决策严重失误。
  audit_item: 企业发展战略规划的制定、执行和效果
  suspicion: 战略规划执行中存在重大损失浪费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于建立国有企业违规经营投资责任追究制度的意见\",\n    \"法规文号\": \"国办发〔2016〕63号\",\n    \"效力级别\": \"\
