    type: number
    description: 提取 预算金额 的数值（含单位，如万元、吨等）
  - name: 验收结论
    type: string
    description: 提取 验收结论 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (批复文件.投资估算金额 >= 项目清单.限额标准) && (招标文件.招标方式 == '邀请招标') && (申请.批复文件编号 IS NULL || 跟踪表.审批节点 != '已完成')
  description: 当项目满足依法必须公开招标的规模标准（如施工合同估算价400万元以上），而实际采用邀请招标，且无法提供合规的审批文件或审批流程未完成时，判定为违规。金额标准依据国家发改委16号令等规定，具体阈值需根据该类项目现行有效规定设定。
  audit_item: 未经批准，擅自改变工程建设项目招标方式
  suspicion: 未经批准擅自将公开招标改为邀请招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十一条\",\n    \"内容概述\": \"国家重点项目和地方重点项目应当进行公开招标，确需采用邀请招标方式的，须经国务院发展计划部门或者省、自治区、直辖市人民政府批准。\"\n  },\n  {\n    \"法规名称\": \"\
    必须招标的工程项目规定\",\n    \"法规文号\": \"国家发展和改革委员会令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"规定必须招标的工程项"
- expression: (明细表.确认支出日期 >= '年末突击期' && 明细表.确认支出金额 > 预警阈值) || (跟踪表.实际使用资金量 / 拨付台账.拨出金额 < 使用率阈值 && 明细表.确认支出日期)
  description: 此表达式分为两种情况：① 年末（如11月、12月）存在大额密集的支出确认行为，但项目实际工程进度并未同步；② 资金拨付至下级单位账户后，长期（如超过一个季度）实际使用率低于50%，但上级已确认为支出。预警阈值可设为项目平均月度支出额的3倍以上，使用率阈值设为50%。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 为完成预算进度以拨代支转移支付资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十条\",\n    \"内容概述\": \"各级政府财政部门应当在本级预算经批准后，及时批复各部门预算。各部门、各单位应当按照规定的支出用途使用资金，不得虚列支出、转移或者套取预算资金。\"\n  }\n]"
- expression: 统计表.结转年限 >= 2 && (跟踪表.累计实际使用金额 / 跟踪表.资金拨付总额) < 使用率阈值
  description: 计算资金预算年度至审计截止日的时长，对于下达超过2年但总使用率仍处于低位（如低于80%）的项目资金进行筛查，识别沉淀闲置问题。对于无法实施、长期停工的项目，其使用率阈值应设为接近0。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 转移支付资金长期闲置沉淀未发挥效益
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强财政支出预算执行管理的通知\",\n    \"法规文号\": \"财预〔2017〕69号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"各级财政部门要进一步盘活财政存量资金，对结余资金和连续两年未用完的结转资金，一律收回总预算统筹使用。\"\n  }\n]"
- expression: (跟踪表.备案/核准编号 IS NULL OR 跟踪表.实际完成日 IS NULL) && 评估报告.报告出具日期 <= 跟踪表.交易实施日 OR (跟踪表.实际完成日 < 评估报告.报告出具日期) OR (ABS(实际完成日
    - 评估报告出具日) > 设定时限阈值)
  description: 评估报告出具后、交易实施前未完成备案/核准，或备案/核准日期早于报告出具日期（时间倒置），或完成日期与报告出具日间隔超过规定时限（如10个工作日），均属违规。阈值参照被审计单位内部制度及国家规定。
  audit_item: 违反国有资产评估相关规定
  suspicion: 国有资产评估未经核准或未按规定备案
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产评估管理暂行办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第12号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十七条、第二十条\",\n    \"内容概述\": \"第十七条：资产评估项目的核准按照下列程序执行：...（三）国有资产监督管理机构或其所出资企业自收到核准申请后，在20个工作日内完成核准...第二十条：企业收到资产评估机构出具的评估报告后，应当逐级上报备案，自评估基准日起8个月内提出备案申请。\"\
    \n  }\n]"
- expression: (外宾姓名、邀请事由.审批日期 > 外宾姓名、接待日期、接待事由、外宾人数、陪同人数、接待总费用、外宾团组名称.接待日期) || (审批流程跟踪表缺少关键审批环节签字) || (外宾姓名、邀请事由.审批日期为空) ||
    (外宾姓名、邀请事由.邀请事由与单位业务无关)
  description: 判定条件：1.审批日期晚于接待开始日期，即构成'先接待后补批'；2.审批表中若缺少制度规定层级（如部门负责人或外事部门）的签字；3.审批记录缺失；4.接待事由与单位职能或业务无关。任一条件满足即视为违规。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 未经审批擅自邀请外宾来访
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"相关条款\",\n    \"内容概述\": \"因公出国及外事接待活动均需履行事前审批程序，严禁无预算、无审批组织开展接待活动。\"\n  }\n]"
- expression: (项目可行性研究报告.论证结论 IS NULL OR 项目可行性研究报告.关键论证要素缺失) && 预算执行进度跟踪表.预算金额 > 0 && 预算执行进度跟踪表.执行率 < 0.2
  description: 当项目申报了预算（金额大于0），但缺少可行性研究报告或报告未对技术、经济、实施条件等关键要素进行充分论证（如无专家评审意见、未分析土地性质等），且该项目预算执行率低于20%时，判定为论证不充分导致项目无法实施，资金闲置。
  audit_item: 预算编制不科学
  suspicion: 项目支出可行性论证缺失或流于形式
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第22号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十二条\",\n    \"内容概述\": \"各部门、各单位应当按照规定编制本部门、本单位预算草案，参考上一年预算执行情况、有关支出绩效评价结果和本年度收支预测，确保预算编制科学准确。\"\n  },\n  {\n   \
    \ \"法规名称\": \"中央本级项目支出预算管理办法\",\n    \"法规文号\": \"财预〔2020〕4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条、第六条\",\n \
    \   \"内容"
- expression: (项目名称、责任单位（牵头部门、配合部门）、责任人、任务节点细化情况.责任单位（牵头部门、配合部门） IS NULL OR 项目名称、责任单位（牵头部门、配合部门）、责任人、任务节点细化情况.责任单位（牵头部门、配合部门）
    LIKE '%多部门%') && 计划开工日期、计划竣工日期、实际开工日期、实际竣工日期、滞后天数、项目名称、计划工期、实际形象进度数据、进度偏差率.滞后天数 > 90
  description: 国家规划项目责任分工表中未指定唯一明确的责任单位，或责任主体笼统描述为多部门共同负责，且对应项目实际进度较计划滞后超过90天，即判定为责任虚化导致推进不力。
  audit_item: 违反建设管理相关政策规定-重大工程项目推进缓慢
  suspicion: 国家规划重大项目责任分工不明确导致进度滞后
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\"\
    ,\n    \"内容概述\": \"国家通过建立项目库等方式，加强对使用政府投资资金项目的储备管理。项目单位应当加强项目的前期工作，保证前期工作的深度达到规定的要求，并对项目建议书、可行性研究报告、初步设计以及依法应当附具的其他文件的真实性负责。\"\
    \n  },\n  {\n    \"法规名称\": \"中央预算内直接投资管理办法\",\n    \"法规文号\": \"国家发展改革委令第7号\",\n    \"效力级别\": \"部门规章\",\n   "
- expression: (落实方案.节点目标（季度/月度） != '月度' && 落实方案.节点目标（季度/月度） != '季度') && 跟踪表.进度偏差率 > 20%
  description: 专项规划中的重大工程任务分解方案未将任务细化到至少季度或者月度工作节点（即缺少可衡量的里程碑），且对应的项目总体进度偏差率超过20%，表明管理粗放，缺乏有效的进度监控抓手，导致落实不力。
  audit_item: 违反建设管理相关政策规定-重大工程项目推进缓慢
  suspicion: 专项规划任务未细化分解导致项目推进缓慢
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照国家有关规定合理确定并严格执行建设工期，不得无故拖延。任何单位和个人不得非法干预建设工期的确定。项目单位应当加强项目进度控制，确保项目按期建成投入使用。\"\n  },\n  {\n\
    \    \"法规名称\": \"关于完善固定资产投资项目代码制度的若干意见\",\n    \"法规文号\": \"国办发〔2020〕47号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \""
- expression: (台账记录.实际退还日期 IS NULL AND 台账记录.约定返还日期 IS NOT NULL AND DATEDIFF(NOW(), 台账记录.约定返还日期) > 0) OR (台账记录.实际退还日期 > 台账记录.约定返还日期)
    OR (台账记录.保证金类型 = '工程质量保证金' AND 台账记录.实际退还日期 IS NULL AND 验收报告.竣工日期 IS NOT NULL AND DATEDIFF(NOW(), 验收报告.竣工日期) > 730)
  description: 保证金返还时间超过合同约定或法定最后期限，即构成未及时返还。对于工程质量保证金，法定最长缺陷责任期为24个月（2年），若竣工后超过2年仍未退还，直接判定违规。对于投标保证金、履约保证金，以合同约定时间为准，凡超过一天均违规。退款日期为空且当前日期已超过约定日，也视为逾期。
  audit_item: 违规收费-工程建设领域保证金清理规范不到位
  suspicion: 未及时返还保证金
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量保证金管理办法\",\n    \"法规文号\": \"建质〔2017〕138号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"缺陷责任期届满，承包人向发包人申请返还保证金。发包人接到申请后，应在14天内进行核实，无异议并同意支付的，应将保证金连同利息在核实后14天内返还，逾期未返还的，应承担违约责任。缺陷责任期一般不超过2年。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规"
- expression: 整改任务进度跟踪表.各问题当前状态 IN ('持续推进','部分整改','未整改') AND (被审计单位整改方案.计划整改完成时间 IS NULL OR (当前日期 - 被审计单位整改方案.计划整改完成时间 > 365))
    AND (MAX(整改任务进度跟踪表.最新更新日期) < 当前日期 - 180 OR COUNT(管理层关于整改的会议纪要.会议日期) = 0)
  description: 问题未关闭且超过承诺整改期限一年仍未完成，或未设定明确时限且近半年内无任何进展更新或管理层讨论记录，即判定为拖延整改。365天覆盖一个完整年度，180天（半年）作为无进展监控阈值。
  audit_item: 以往审计发现问题整改情况存在的问题
  suspicion: 整改措施长期无实质进展或无限期拖延
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国审计法\",\n    \"法规文号\": \"主席令第48号（2021修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"被审计单位应当按照规定时间整改审计查出的问题，将整改情况报告审计机关。\"\n  }\n]"
- expression: COUNT(以往审计报告.问题编号) - COUNT(整改验收报告或证明材料.已销号问题清单) > 0 AND (以往审计报告.风险等级 = '高' OR (以往审计报告.风险等级 = '中' AND 以往审计报告.涉及金额
    > 500000)) AND (整改任务进度跟踪表.后续计划标记 IS NULL OR 整改任务进度跟踪表.后续计划标记 = '无')
