    || (机构名称、改革类型、当前状态、计划完成率、厂办大集体企业改革状态、完成标志、该医疗机构改革状态.完成标志 / 企业名称、隶属关系
  description: 清册企业数与工商注册的分离实体数不一致，表明底数不清；改革完成率低于70%为进度严重滞后；补偿金领取人数少于应安置人数意味着安置未全部落实。任一条件满足即触发疑点。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
