name: audit/数据表格类/产日报表
type: model
description: 从数据表格类类文档（产日报表）中提取结构化元数据。涵盖字段如：产量、单件定额工时、各工序产出、实际开工台时、废品数量、月末在线半成品数量、机型。文档范围包括：生产日报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 产日报表
  member_count: 1
  member_details:
  - 生产日报表
output:
  fields:
  - name: 产量
    type: string
    description: 提取 产量 的文本值
  - name: 单件定额工时
    type: string
    description: 提取 单件定额工时 的文本值
  - name: 各工序产出
    type: string
    description: 提取 各工序产出 的文本值
  - name: 实际开工台时
    type: string
    description: 提取 实际开工台时 的文本值
  - name: 废品数量
    type: number
    description: 提取 废品数量 的数值（含单位，如万元、吨等）
  - name: 月末在线半成品数量
    type: number
    description: 提取 月末在线半成品数量 的数值（含单位，如万元、吨等）
  - name: 机型
    type: string
    description: 提取 机型 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (记录表.工时数 / 产日报表.实际开工台时 > 1.5) || (ABS(记录表.工资额 - 产日报表.产量*薪酬制度.工时单价) / (产日报表.产量*薪酬制度.工时单价) > 0.2) || (记录表.员工工号
    > 16)
  description: 记录工时与机器实际开工台时比超1.5倍疑虚增；工资额偏离产量与定额工时乘积20%以上；同一人日工时超16小时明显不合理。三者满足其一即触发疑点。
  audit_item: 未按规定确认成本费用
  suspicion: 虚构工时多计成本
