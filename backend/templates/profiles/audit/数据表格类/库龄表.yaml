name: audit/数据表格类/库龄表
type: model
description: 从数据表格类类文档（库龄表）中提取结构化元数据。涵盖字段如：库龄超过1年的物料清单及金额。文档范围包括：存货库龄表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 库龄表
  member_count: 1
  member_details:
  - 存货库龄表
output:
  fields:
  - name: 库龄超过1年的物料清单及金额
    type: number
    description: 提取 库龄超过1年的物料清单及金额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (明细表.可收回金额 < 明细表.账面价值 && 明细表.实际计提额 = 0) || (库龄表.库龄超过1年的物料清单及金额 && 减值计提率 < 50%) || (上期已计提减值的资产本期价值进一步下跌但未追加计提)
  description: 有减值迹象但未计提；长库龄存货未足额计提跌价；已减值资产未追加计提，均属违反准则。
  audit_item: 未按规定确认成本费用
  suspicion: 未按规定计提资产减值准备
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第8号——资产减值\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条、第六条\",\n    \"内容概述\": \"企业应当在资产负债表日判断资产是否存在可能发生减值的迹象；资产可收回金额低于其账面价值的，应当计提减值准备。\"\n  }\n]"
