name: audit/数据表格类/统计报表
type: model
description: 从数据表格类类文档（统计报表）中提取结构化元数据。涵盖字段如：上报日期、主体名称、减免税种、减免金额、填报单位、所属期、所属行业、汇总接收与分配数据。文档范围包括：主管部门农药使用统计报表、捐赠统计报表、税务部门减免税统计报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 统计报表
  member_count: 1
  member_details:
  - 主管部门农药使用统计报表
  - 捐赠统计报表
  - 税务部门减免税统计报表
output:
  fields:
  - name: 上报日期
    type: date
    description: 提取 上报日期 的日期值，格式 YYYY-MM-DD
  - name: 主体名称
    type: string
    description: 提取 主体名称 的文本值
  - name: 减免税种
    type: string
    description: 提取 减免税种 的文本值
  - name: 减免金额
    type: number
    description: 提取 减免金额 的数值（含单位，如万元、吨等）
  - name: 填报单位
    type: string
    description: 提取 填报单位 的文本值
  - name: 所属期
    type: string
    description: 提取 所属期 的文本值
  - name: 所属行业
    type: string
    description: 提取 所属行业 的文本值
  - name: 汇总接收与分配数据
    type: string
    description: 提取 汇总接收与分配数据 的文本值
  - name: 物资总数量
    type: number
    description: 提取 物资总数量 的数值（含单位，如万元、吨等）
  - name: 统一社会信用代码
    type: string
    description: 提取 统一社会信用代码 的文本值
  - name: 统计年度-周期
    type: date
    description: 提取 统计年度-周期 的日期值，格式 YYYY-MM-DD
  - name: 统计指标
    type: string
    description: 提取 统计指标 的文本值
  - name: 统计期间接受捐赠总额
    type: number
    description: 提取 统计期间接受捐赠总额 的数值（含单位，如万元、吨等）
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 统计报表 IS NULL || (MAX(统计报表.上报日期) < DATE_SUB(当前日期, INTERVAL 1 YEAR))
  description: 判定规则：无任何统计报表，或最近一次统计截止日期距今超过一年（即未按要求至少每年开展一次统计）视为未定期调查。需结合上级部门规定，若规定频率为半年，则阈值调整为半年。
  audit_item: 农药使用管理不符合规定
  suspicion: 农业主管部门未定期调查统计农药使用情况
  regulation: "[\n  {\n    \"法规名称\": \"农药管理条例\",\n    \"法规文号\": \"国务院令第677号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十八条\"\
    ,\n    \"内容概述\": \"县级以上地方人民政府农业主管部门应当对农药使用情况进行监测、调查和统计，并向本级人民政府报告。\"\n  }\n]"
- expression: 主体名称、统一社会信用代码、申报税种、减免所得额、申报日期.统一社会信用代码 IN (所属期、主体名称、统一社会信用代码、减免税种、减免金额、所属行业.统一社会信用代码 WHERE 减免税种='增值税' AND 减免金额=0)
    || (主体名称、统一社会信用代码、申报税种、减免所得额、申报日期.核准状态（通过/驳回/待审）='驳回' && 主体名称、统一社会信用代码、申报税种、减免所得额、申报日期.驳回原因包含'未备案'或'资格不符' && 主体名称、统一社会信用代码、申报税种、减免所得额、申报日期.主体类型
    IN ('家庭农场','合作社') && 主体经营范围包含'自产农产品销售')
  description: 若新型经营主体从事农业生产且符合免税条件，但减免税统计表中相应税种减免金额为0，或减免申报被税务机关以不合理的理由（如未备案）驳回，则视为政策落实不到位。重点关注增值税、企业所得税两大税种，对主体经营范围进行关键词匹配（如种植、养殖）。
  audit_item: 新型经营主体支持政策落实不到位
  suspicion: 新型农业经营主体税收优惠政策落实不到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国增值税暂行条例\",\n    \"法规文号\": \"国务院令第691号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"农业生产者销售的自产农产品免征增值税。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国企业所得税法\",\n    \"法规文号\": \"主席令第64号\"\
    ,\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十七条\",\n    \"内容概述\": \"从事农、林、牧、渔业项目的所得，可以免征、减征企业所得税。\"\n  }\n]"
- expression: (分配台账.台账是否存在 = 0) || (分配台账.捐赠方名称 IS NULL || 分配台账.物资名称 IS NULL || 分配台账.分配去向 IS NULL)
  description: 未建立台账（记录数为0）或台账关键字段缺失，即无法实现捐赠物资的全流程追溯，属于严重不合规。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 捐赠物资未登记造册及未建立台账
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十八条\"\
    ,\n    \"内容概述\": \"慈善组织应当对募集的财产登记造册，严格管理，专款专用。\"\n  }\n]"
- expression: (ABS(公示金额及数量.公示金额及数量 - 统计报表.统计期间接受捐赠总额) > 0) || (公示金额及数量.公示日期 - 分配台账.接收日期 > 30) || (公示金额及数量.公示内容摘要 IS NULL)
  description: 公示金额与统计报表总额不一致即不准确；接收日期与公示日期间隔超过30天为不及时；分配去向信息缺失为不完整。三者任一触发判定违规。
  audit_item: 社会捐赠款物管理和信息公开不合规
  suspicion: 捐赠信息公开不及时不准确不完整
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十二条\"\
    ,\n    \"内容概述\": \"慈善组织应当依法履行信息公开义务。信息公开应当真实、完整、及时。\"\n  }\n]"
