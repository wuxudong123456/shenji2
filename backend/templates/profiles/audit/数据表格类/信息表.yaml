- expression: (承诺退出日期.承诺退出日期 < 当前审计日) && (实际完成退出日期.实际完成退出日期 IS NULL) && (审计报告.房地产业务收入 > 0 || 信息表.房地产子公司状态 = '存续')
  description: 企业已书面承诺在某个日期前退出房地产行业，但截止审计日，实际完成退出日期为空且报表中仍有房地产收入，或其名下的房地产子公司仍在存续状态，表明未履行退出承诺。
  audit_item: 未按规定落实去库存政策措施
  suspicion: 非主业企业未按规定退出商业房地产业务
  regulation: "[\n  {\n    \"法规名称\": \"国务院国资委关于中央企业退出房地产业务的通知\",\n    \"法规文号\": \"国资发改革〔2010〕142号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"全文\",\n    \"内容概述\": \"要求非房地产主业中央企业加快剥离房地产业务，在规定期限内完成退出，并报告退出情况。\"\n  }\n]"
- expression: 信息表.股东名称 IN (登记表.管理人员姓名) && (信息表.企业名称 NOT IN (申报材料.对外投资企业名称) OR 信息表.持股比例 != 申报材料.持股比例)
  description: 通过工商登记信息发现管理人员直接持股但未在个人申报材料中披露，或者申报的持股比例与实际不一致，即认定为隐瞒持股。即便申报但未如实报告也属违规。
  audit_item: 违反廉洁从业有关规定问题
  suspicion: 管理人员违规持有非上市企业股权未申报
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规\",\n   \
    \ \"条款号\": \"第五条（三）项\",\n    \"内容概述\": \"不得个人从事营利性经营活动和有偿中介活动，或者在本企业的同类经营企业、关联企业和与本企业有业务关系的企业投资入股。\"\n  }\n]"
- expression: (COUNT(社员信息表.农民/新型农业主体标识='是') / COUNT(社员信息表)) < 0.8 || COUNT(社员信息表.农民/新型农业主体标识='是') = 0
  description: 农民社员占比低于80%或完全没有新型农业经营主体入社即视为违规。虚假入股可结合异常资金流水进一步筛查。
  audit_item: 供销合作社基层社改造不到位
  suspicion: 未吸纳农民和新型农业经营主体入社
  regulation: "[\n  {\n    \"法规名称\": \"中共中央国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"二、拓展经营服务领域，强化为农服务（三）加强基层社建设\",\n    \"内容概述\": \"要求广泛吸纳农民和各类新型农业经营主体加入供销合作社，强化基层社与农民的组织和利益联结。\"\n  }\n\
    ]"
- expression: (COUNT(农业主管部门监测检查记录表.检查日期) < 农业主管部门监测工作实施方案或通知.年度监测计划频次) || ((COUNT(DISTINCT 农业主管部门监测检查记录表.被检查组织) / 农业社会化服务组织基础信息表.组织总数)
    < 农业主管部门监测工作实施方案或通知.抽查比例)
  description: 实际监测次数低于政策或方案规定的最低监测频次（如年度至少2次全面检查），或者被抽查组织数量占全部组织总数比例低于规定抽查比例（如不低于30%）时，判定监测不到位。优先以实施方案中的量化指标为准，若无明确比例，参照行业通行的30%红线。
  audit_item: 农业社会化服务管理不到位
  suspicion: 农业社会化服务监测频次与覆盖面不达标
  regulation: "[\n  {\n    \"法规名称\": \"关于加快发展农业社会化服务的指导意见\",\n    \"法规文号\": \"农经发〔2021〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"第三条（十）\",\n    \"内容概述\": \"建立健全服务组织名录库，实行服务组织名录库动态管理，加强服务组织动态监测，及时掌握服务组织数量、能力、业绩、信誉等情况。\"\n  }\n]"
