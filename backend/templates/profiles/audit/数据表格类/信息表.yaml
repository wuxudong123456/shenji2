name: audit/数据表格类/信息表
type: model
description: 从数据表格类类文档（信息表）中提取结构化元数据。涵盖字段如：中标人名称、主体名称、主体类型、书屋位置、交付日期、人口数、企业名称、低收入群体标识。文档范围包括：个人公积金账户信息表、中标候选人公示信息表、企业工商登记信息表、住房保障申请家庭信息表、供应商基本信息表、公共租赁住房保障对象基本信息表、公共租赁住房房源信息表、农业社会化服务组织基础信息表、农家书屋基本信息表、农户基本信息表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 信息表
  member_count: 1
  member_details:
