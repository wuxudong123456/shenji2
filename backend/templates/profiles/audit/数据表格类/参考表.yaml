name: audit/数据表格类/参考表
type: model
description: 从数据表格类类文档（参考表）中提取结构化元数据。涵盖字段如：同期限LPR。文档范围包括：同期市场贷款利率参考表（如LPR等）等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 参考表
  member_count: 1
  member_details:
  - 同期市场贷款利率参考表（如LPR等）
output:
  fields:
  - name: 同期限LPR
    type: string
    description: 提取 同期限LPR 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (企业财务费用明细账.财务顾问费 + 项目贷款合同补充协议（含利率条款）.其他费用条款) / 贷款本金 * 贷款期限（年） + 项目贷款合同补充协议（含利率条款）.约定年利率 > 同期市场贷款利率参考表（如LPR等）.同期限LPR
    + 政策允许上浮幅度 || 存在单独收取与贷款直接挂钩的企业财务费用明细账.财务顾问费
  description: 将贷款存续期内所有向银行或其指定方支付的财务顾问费、咨询费、账户管理费等除正常利息外的费用折合为年化费率，与合同利率加总计算综合融资成本。若综合成本超过同期LPR基准加上监管允许的合理点差，或存在违背服务实质的纯粹顾问费，即视为违规变相提高利率。同时需核对银行是否提供了实质性服务。
  audit_item: 保障性安居工程建设项目银行贷款未按规定享受优惠利率
  suspicion: 以财务顾问费等名义变相提高贷款利率
  regulation: "[\n  {\n    \"法规名称\": \"中国银监会关于整治银行业金融机构不规范经营的通知\",\n    \"法规文号\": \"银监发〔2012〕3号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"一、二\",\n    \"内容概述\": \"银行业金融机构不得以贷收费，不得浮利分费，不得借贷搭售，不得转嫁成本。不得将利息分解为费用收取。\"\n  },\n  {\n    \"法规名称\"\
    : \"商业银行服务价格管理办法\",\n    \"法规文号\": \"中国银监会、国家发展改革委令2014年第1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、第二十三条\",\n\
    \    \"内容"
