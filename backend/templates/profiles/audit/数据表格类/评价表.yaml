name: audit/数据表格类/评价表
type: model
description: 从数据表格类类文档（评价表）中提取结构化元数据。涵盖字段如：实际参会次数、应参会次数、成员姓名、连续缺席次数。文档范围包括：考核评价表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 评价表
  member_count: 1
  member_details:
  - 考核评价表
output:
  fields:
  - name: 实际参会次数
    type: string
    description: 提取 实际参会次数 的文本值
  - name: 应参会次数
    type: string
    description: 提取 应参会次数 的文本值
  - name: 成员姓名
    type: string
    description: 提取 成员姓名 的文本值
  - name: 连续缺席次数
    type: string
    description: 提取 连续缺席次数 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 考核评价表.连续缺席次数 >= 3 AND 任免文件.当前成员资格状态 = '在任'
  description: 依据地方管委会章程，成员无正当理由连续三次缺席会议应取消其委员资格。累计分析考核评价表，若某成员连续缺席达到阈值而资格仍为在任，即为违规。
  audit_item: 住房公积金决策机构未按规定履职
  suspicion: 管委会成员连续缺席未按规定取消资格
  regulation: "[\n  {\n    \"法规名称\": \"地方住房公积金管理委员会章程\",\n    \"法规文号\": \"无（依据各地自行制定的管委会章程）\",\n    \"效力级别\": \"制度文件\",\n\
    \    \"条款号\": \"有关委员资格终止的条款\",\n    \"内容概述\": \"委员连续三次无正当理由缺席会议，应自动丧失其委员资格，由管委会提请政府予以调整。\"\n  }\n]"
