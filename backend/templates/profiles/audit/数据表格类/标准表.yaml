name: audit/数据表格类/标准表
type: model
description: 从数据表格类类文档（标准表）中提取结构化元数据。涵盖字段如：优秀/良好/合格/不合格阈值定义、保障状态、分类型的指标分解模板、对应指标的标准计算公式、指标名称、指标定义、指标类型、数据采集路径。文档范围包括：待遇标准表（表1）、绩效指标量化标准表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 标准表
  member_count: 1
  member_details:
  - 待遇标准表（表1）
  - 绩效指标量化标准表
output:
  fields:
  - name: 优秀-良好-合格-不合格阈值定义
    type: string
    description: 提取 优秀-良好-合格-不合格阈值定义 的文本值
  - name: 保障状态
    type: boolean
    description: 提取 保障状态 的布尔值（是/否）
  - name: 分类型的指标分解模板
    type: string
    description: 提取 分类型的指标分解模板 的文本值
  - name: 对应指标的标准计算公式
    type: string
    description: 提取 对应指标的标准计算公式 的文本值
  - name: 指标名称
    type: string
    description: 提取 指标名称 的文本值
  - name: 指标定义
    type: string
    description: 提取 指标定义 的文本值
  - name: 指标类型
    type: string
    description: 提取 指标类型 的文本值
  - name: 数据采集路径
    type: string
    description: 提取 数据采集路径 的文本值
  - name: 是否提供了分阶段的
    type: boolean
    description: 提取 是否提供了分阶段的 的布尔值（是/否）
  - name: 考核权重
    type: string
    description: 提取 考核权重 的文本值
  - name: 行业或区域标杆单位成本参考值
    type: string
    description: 提取 行业或区域标杆单位成本参考值 的文本值
  - name: 赋分规则
    type: string
    description: 提取 赋分规则 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (绩效目标申报表.产出指标 IS NULL OR 绩效目标申报表.效益指标 IS NULL OR 绩效目标申报表.满意度指标 IS NULL) && (项目可行性研究报告或立项论证材料.项目预期成果清单 != '无'
    OR 年度工作计划.重点工作目标 != '缺失')
  description: 此表达式用于侦测绩效目标覆盖不完整。当‘绩效目标申报表’中财务部规定的核心指标（如产出、效益、满意度）有一项或多项完全缺失（IS NULL），但审核其立项源头，如‘项目可行性研究报告或立项论证材料’中却明确描述了相关的预期成果，或‘年度工作计划’中对该项工作有明确的多维度目标要求，说明申报表未能完整转化应设定的全部目标，构成不完整式违规。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定不完整，缺失核心指标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十一条\",\n    \"内容概述\": \"各部门、各单位应当按照国务院财政部门制定的绩效目标管理办法，设置指向明确、细化量化、合理可行的项目支出绩效目标，并作为编制和安排预算的重要依据。\"\n  },\n  {\n\
    \    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n  \
    \  \"内容概述"
- expression: ABS(预算批复金额 / 产出指标值 - 历史平均单位成本) / 历史平均单位成本 > 0.5
  description: 计算项目单位产出的预算成本，并与本单位同类项目过去三年（若历史数据不足，则参考同地区同行业标杆值）平均单位成本进行对比。当两者偏差率的绝对值（ABS）超过50%时，判定为资金与目标严重不匹配。例如，某培训项目预算批复100万元，计划培训100人次，单位成本为1万元/人次，而近三年历史平均单位成本仅为0.3万元/人次，偏差率达233%，触发异常。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标与预算资金量严重不匹配
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"中华人民共和国主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各级政府、各部门、各单位的支出必须按照预算执行，不得虚假列支。各级政府、各部门、各单位应当对预算支出情况开展绩效评价。\"\n  },\n  {\n    \"法规名称\":\
    \ \"预算绩效管理工作考核办法\",\n    \"法规文号\": \"财预〔2011〕433号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"\
    绩效目标设定要与预算"
- expression: (绩效目标申报表.目标层级 = 1) && (绩效目标申报表.总目标 LIKE '%改善环境%' OR 绩效目标申报表.总目标 LIKE '%提升服务%') && (年度工作计划.任务分解颗粒度 = '粗放')
  description: 检查目标是否仅有一个宏大笼统的总目标，而没有分层级的细化指标。当申报表仅有一级目标，总目标文本中出现“改善”、“提升”、“加强”等无法衡量具体方向和内容的动词，并且配套的年度工作计划中对实现该目标的步骤描述颗粒度极为粗放（例：仅为‘一季度开展、二季度推进’），则认定为未细化。这违反了目标
    SMART 原则中的 Specific 和 Measurable。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定过于笼统未细化
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十四条\",\n    \"内容概述\": \"绩效指标应当定量指标与定性指标相结合，优先使用定量指标。绩效目标的设置应当细化量化，并将其分解为清晰、可衡量的绩效指标。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"\
    绩效目标要能清晰"
- expression: (绩效目标申报表.指标值 LIKE '%定性%' OR 绩效目标申报表.指标值 IS NULL OR 绩效目标申报表.指标数据来源说明 IS NULL) && (绩效指标量化标准表.计算公式 IS NULL)
  description: 该表达式判断目标是否可衡量。当申报表中的‘指标值’为纯定性文字描述（如‘好’、‘满意’、‘显著提升’）或空值，并且其‘数据来源说明’为空，表明不知道由谁、用什么方法收集数据；同时，在单位配套的‘量化标准表’中也找不到针对这个指标的计算公式或评分细则时，即可判定该目标完全不可衡量。一个既无量化值、也无计算方法、更无数据来源的目标，等同于一场‘自己既当运动员又当裁判员’且规则为空的游戏。
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效目标设定不可衡量
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第五十二条\",\n    \"内容概述\": \"预算支出绩效指标应当尽可能量化，不能量化的，应当设定定性指标，但应当具有可衡量性，并经充分论证。\"\n  },\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\"\
    ,\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十五条\",\n    \"内容概述\": \"绩效指标应当明确指标解释、指标计算公式、"
- expression: (申报评价标准.优 >= 历史实际完成最差值) || (申报评价标准.合格 < 政策文件.最低要求标准)
  description: 此表达式排查评价标准‘低定高评’的问题。第一种情况，评价标准过于宽松：如果申报的优秀线（如完成任务80%即优秀），甚至低于本单位过去三年最差年份的实际完成值，说明该标准形同虚设，起不到任何激励约束作用。第二种情况，评价标准过低：如果部门自行设定的合格线（如满意度60%即合格），显著低于上级政策文件或行业通用的最低服务标准（如80%），属于刻意降低及格门槛，以掩盖实际绩效的低下。两者均构成评价标准不
  audit_item: 部门、单位预算绩效目标设定不科学不合理
  suspicion: 绩效评价标准设定过低或过高不合理
  regulation: "[\n  {\n    \"法规名称\": \"项目支出绩效评价管理办法\",\n    \"法规文号\": \"财预〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"绩效评价标准是指衡量财政支出绩效目标完成情况的尺度，应当符合客观公正、科学合理的原则。绩效评价标准的设定应当与项目的实际情况、历史数据、行业标准等相匹配。\"\n  },\n \
    \ {\n    \"法规名称\": \"中央部门预算绩效目标管理办法\",\n    \"法规文号\": \"财预〔2015〕88号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\"\
    ,\n   "
- expression: (保障状态.保障状态='在保' AND 明细表.发放金额>0) AND (比对表.死亡信息='是' OR (比对表.就业登记='在职' AND 比对表.学历信息.毕业时间 < 当前日期-180天) OR (DATEDIFF(当前日期,
    保障状态.最后复核日期) > 180))
  description: 在保对象存在死亡、子女毕业超6个月或就业登记在职等收入超标情况，或超6个月未进行动态复核，仍持续发放待遇的，判定为动态管理失效。180天周期依据一般定期核查要求，可调整。
  audit_item: 社会保障待遇计算、发放错误
  suspicion: 动态管理失效致不符合条件人员继续享受待遇
  regulation: "[\n  {\n    \"法规名称\": \"社会救助暂行办法\",\n    \"法规文号\": \"国务院令第649号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十三条\",\n    \"内容概述\": \"县级民政部门及乡镇、街道应当对获得最低生活保障家庭的人口、收入、财产状况定期核查，根据变化情况及时增发、减发或停发。\"\n  }\n]"
