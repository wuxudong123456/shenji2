name: audit/数据表格类/比价表
type: model
description: 从数据表格类类文档（比价表）中提取结构化元数据。涵盖字段如：供应商名称、报价、标的、评审人、选定理由。文档范围包括：采购比价表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 比价表
  member_count: 1
  member_details:
  - 采购比价表
output:
  fields:
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 报价
    type: string
    description: 提取 报价 的文本值
  - name: 标的
    type: string
    description: 提取 标的 的文本值
  - name: 评审人
    type: string
    description: 提取 评审人 的文本值
  - name: 选定理由
    type: string
    description: 提取 选定理由 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: （采购合同台账.采购单价 - MAX（市场询价记录.报价））/ MAX（市场询价记录.报价） > 0.10 && (采购比价表.选定理由 不包含 '唯一供应商' 或 采购比价表 IS NULL) && 价格审批单.审批意见
    != '超预算审核通过'
  description: 将采购合同单价与至少三家市场询价中的最高报价比较，超出10%以上，且无合理选定理由或审批手续，视为价格虚高。若因唯一供应商导致价格偏高，需重点审核其唯一性证明是否真实。
  audit_item: 销售与采购合同审计
  suspicion: 采购合同价格明显高于市场可比价格
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第六十四条\",\n    \"内容概述\": \"招标人与投标人串通投标，以不合理高价确定中标人的，中标无效。非招标采购也应遵循价格合理原则。\"\n  },\n  {\n    \"法规名称\": \"企业国有资产监督管理暂行条例\"\
    ,\n    \"法规文号\": \"国务院令第378号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条\",\n    \"内容概述\": \"国有及国有控股企业应当加强财务管理，严控"
