name: audit/数据表格类/工资表
type: model
description: 从数据表格类类文档（工资表）中提取结构化元数据。涵盖字段如：发放日期、发放月份、发放金额、姓名。文档范围包括：协会工资表、合作社工资表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 金额
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 工资表
  member_count: 1
  member_details:
  - 协会工资表
  - 合作社工资表
output:
  fields:
  - name: 发放日期
    type: date
    description: 提取 发放日期 的日期值，格式 YYYY-MM-DD
  - name: 发放月份
    type: string
    description: 提取 发放月份 的文本值
  - name: 发放金额
    type: number
    description: 提取 发放金额 的数值（含单位，如万元、吨等）
  - name: 姓名
    type: string
    description: 提取 姓名 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (兼职名单.姓名 IN 名册 AND 兼职名单.审批状态 = '未审批') OR (名册.退休时间 IS NOT NULL AND 兼职名单.任职起始时间 - 名册.退休时间 < 3年 AND 兼职名单.领取报酬 =
    true AND 名册.原职务 关联 兼职名单.兼职协会)
  description: 在职公务员未经批准在协会兼职，或退休公务员在脱钩后3年内到原管辖业务的协会任职并领取薪酬，满足任一条件即生成疑点。退休时间差<3年且存在利益关联的判定为高风险。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 公务员违规在行业协会商会任职兼职
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"中华人民共和国主席令第20号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十四条、第一百零七条\",\n    \"内容概述\": \"公务员不得在营利性组织中兼任职务；辞去公职或退休后，原系领导成员的公务员在离职三年内不得到与原工作业务直接相关的企业或者其他营利性组织任职。\"\n  }\n]"
- expression: (任职文件.身份证号 IN 名册.身份证号) && (登记表.是否审批 != '已审批' || 登记表 IS NULL) && (工资表.发放金额 > 0)
  description: 合作社任职人员身份证号与公职人员库匹配，且未履行审批程序或存在领取报酬行为，即判定为违规兼职。触发条件：身份匹配且（无审批记录或领取报酬）。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 公务人员违规担任合作社职务
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公务员法\",\n    \"法规文号\": \"中华人民共和国主席令第二十号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十九条\",\n    \"内容概述\": \"公务员不得违反有关规定从事或者参与营利性活动，在企业或者其他营利性组织中兼任职务。\"\n  }\n]"
