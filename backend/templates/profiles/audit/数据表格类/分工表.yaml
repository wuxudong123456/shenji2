name: audit/数据表格类/分工表
type: model
description: 从数据表格类类文档（分工表）中提取结构化元数据。涵盖字段如：人员姓名、任务节点细化情况、出纳职责描述、各行政村厕所改造任务完成时间、垃圾中转站设置方案、实际执行人、岗位、是否明确“三重一大”事项分工。文档范围包括：会计人员岗位职责分工表、会计档案保管分工表、党风廉政建设责任分工表、国家“十三五”规划重大工程项目责任分工表、多部门联合治理任务分工表、岗位职责分工表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 人员
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 分工表
  member_count: 1
  member_details:
  - 会计人员岗位职责分工表
  - 会计档案保管分工表
  - 党风廉政建设责任分工表
  - 国家“十三五”规划重大工程项目责任分工表
  - 多部门联合治理任务分工表
  - 岗位职责分工表
output:
  fields:
  - name: 人员姓名
    type: string
    description: 提取 人员姓名 的文本值
  - name: 任务节点细化情况
    type: string
    description: 提取 任务节点细化情况 的文本值
  - name: 出纳职责描述
    type: string
    description: 提取 出纳职责描述 的文本值
  - name: 各行政村厕所改造任务完成时间
    type: date
    description: 提取 各行政村厕所改造任务完成时间 的日期值，格式 YYYY-MM-DD
  - name: 垃圾中转站设置方案
    type: string
    description: 提取 垃圾中转站设置方案 的文本值
  - name: 实际执行人
    type: string
    description: 提取 实际执行人 的文本值
  - name: 岗位
    type: string
    description: 提取 岗位 的文本值
  - name: 是否明确“三重一大”事项分工
    type: boolean
    description: 提取 是否明确“三重一大”事项分工 的布尔值（是/否）
  - name: 是否细化责任清单
    type: boolean
    description: 提取 是否细化责任清单 的布尔值（是/否）
  - name: 档案保管责任人
    type: string
    description: 提取 档案保管责任人 的文本值
  - name: 污水管网敷设完成时间
    type: date
    description: 提取 污水管网敷设完成时间 的日期值，格式 YYYY-MM-DD
  - name: 责任人
    type: string
    description: 提取 责任人 的文本值
  - name: 责任单位
    type: string
    description: 提取 责任单位 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (会计凭证列表 LEFT JOIN 会计凭证审核记录表 ON 会计凭证列表.凭证编号 = 会计凭证审核记录表.凭证编号 LEFT JOIN 会计账簿 ON 会计凭证列表.凭证编号 = 会计账簿.凭证编号) WHERE
    (会计凭证审核记录表.审核结果 IS NULL OR 会计凭证审核记录表.审核时间 >= 会计账簿.账簿登记日期) AND 会计凭证列表.凭证编号 IN (SELECT 凭证编号 FROM 会计账簿)
  description: 凭证审核记录表中无对应凭证的审核通过记录，或审核时间晚于或等于账簿登记日期，表明凭证未经审核即入账。
  audit_item: 以未经审核的会计凭证为依据登记会计账簿或者会计账簿登记不符合规定
  suspicion: 以未经审核会计凭证登记账簿
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十条\",\n    \"内容概述\": \"会计人员应当根据审核无误的会计凭证登记会计账簿。\"\n  }\n]"
- expression: (项目名称、责任单位（牵头部门、配合部门）、责任人、任务节点细化情况.责任单位（牵头部门、配合部门） IS NULL OR 项目名称、责任单位（牵头部门、配合部门）、责任人、任务节点细化情况.责任单位（牵头部门、配合部门）
    LIKE '%多部门%') && 计划开工日期、计划竣工日期、实际开工日期、实际竣工日期、滞后天数、项目名称、计划工期、实际形象进度数据、进度偏差率.滞后天数 > 90
  description: 国家规划项目责任分工表中未指定唯一明确的责任单位，或责任主体笼统描述为多部门共同负责，且对应项目实际进度较计划滞后超过90天，即判定为责任虚化导致推进不力。
  audit_item: 违反建设管理相关政策规定-重大工程项目推进缓慢
  suspicion: 国家规划重大项目责任分工不明确导致进度滞后
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\"\
    ,\n    \"内容概述\": \"国家通过建立项目库等方式，加强对使用政府投资资金项目的储备管理。项目单位应当加强项目的前期工作，保证前期工作的深度达到规定的要求，并对项目建议书、可行性研究报告、初步设计以及依法应当附具的其他文件的真实性负责。\"\
    \n  },\n  {\n    \"法规名称\": \"中央预算内直接投资管理办法\",\n    \"法规文号\": \"国家发展改革委令第7号\",\n    \"效力级别\": \"部门规章\",\n   "
- expression: (制度文件.文件存在状态 == false) || (制度文件.制度内容文本.indexOf("三重一大") == -1 && 制度文件.制度内容文本.indexOf("招标采购") == -1 && 制度文件.制度内容文本.indexOf("资金使用")
    == -1) || (制度文件.最近修订日期 < 中央八项规定最新修订日期 && 制度文件.内容未覆盖新增风险领域) || (分工表.是否明确“三重一大”事项分工 == false)
  description: 判定制度缺失或内容不完整：1.制度文件不存在直接判定为违规；2.制度内容中同时缺失“三重一大”“招标采购”“资金使用”三个核心关键词，说明未覆盖关键经济领域；3.制度修订日期滞后于中央八项规定最新修订日期且未更新风险领域，视为滞后；4.责任分工表未明确“一岗双责”及“三重一大”具体分工则责任不落实。
  audit_item: 在经济活动中落实党风廉政建设责任方面存在的问题
  suspicion: 未建立健全党风廉政建设专项制度
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党党内监督条例\",\n    \"法规文号\": \"中发〔2016〕26号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"党委（党组）应当加强对领导干部的日常管理监督，掌握其思想、工作、作风、生活状况。建立健全党的领导干部廉洁档案，对党风廉政方面存在的问题做到早发现、早提醒、早处置。\"\n  },\n\
    \  {\n    \"法规名称\": \"关于实行党风廉政建设责任制的规定\",\n    \"法规文号\": \"中发〔2010〕19号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第七条\"\
    ,"
- expression: (出纳职责描述.出纳职责描述（是否包含稽核、档案保管、收入/费用/债权债务账登记） CONTAINS ('稽核' OR '会计档案保管' OR '收入账登记' OR '费用账登记' OR '债权债务账登记')) OR
    (权限表.出纳账号角色、权限清单（审核、记账、修改凭证等） IN ('会计凭证审核','总账登记','明细账修改')) OR (制单人、复核人、审批人签名及岗位.制单人 = '出纳' AND 制单人、复核人、审批人签名及岗位.复核人 =
    '出纳') OR (档案保管责任人.档案保管责任人 = 出纳人员姓名)
  description: 任何一条条件满足即违规：出纳职责明文包含不相容工作；出纳拥有会计审核、记账等系统权限；同一笔支付的制单与复核均为出纳；或出纳兼任会计档案保管，均违反《会计法》第三十七条关于出纳不得兼任的规定。
  audit_item: 违反会计管理规定的行为
  suspicion: 出纳人员兼管稽核、档案及账目登记等不相容职务
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第三十七条\",\n    \"内容概述\": \"出纳人员不得兼任稽核、会计档案保管和收入、支出、费用、债权债务账目的登记工作。\"\n  }\n]"
- expression: (正式文件 IS NULL) || (正式文件.规划文本中是否包含与改厕、垃圾处理衔接的专门章节或表述) || (分工表.污水管网敷设完成时间 > 分工表.各行政村厕所改造任务完成时间 + 90天) || (会议纪要.会议召开频次
    < 2次/年)
  description: 未制定统筹工作方案；或规划文本完全缺失与厕所改造、垃圾处理的衔接内容；或任务分工表中同一村庄的污水管网铺设完成时间晚于户厕改造完成时间超过90天，导致改厕后粪污无法接入管网，造成衔接脱节；或一年内跨部门专题协调会议次数少于2次，反映统筹协作流于形式。满足任一条件即触发疑点。
  audit_item: 污水治理规划不符合规定
  suspicion: 污水治理规划未与垃圾治理、厕所革命统筹衔接
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进农村生活污水治理的指导意见\",\n    \"法规文号\": \"环办土壤〔2021〕24号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条第（三）项\",\n    \"内容概述\": \"统筹考虑农村生活污水治理与改厕、村庄清洁、生活垃圾治理等协同推进，协调安排相关建设任务。\"\n  }\n]"
