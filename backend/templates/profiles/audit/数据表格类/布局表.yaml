name: audit/数据表格类/布局表
type: model
description: 从数据表格类类文档（布局表）中提取结构化元数据。涵盖字段如：实施区域坐标、机井编号、通电状态、项目名称。文档范围包括：机井通电工程布局表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 布局表
  member_count: 1
  member_details:
  - 机井通电工程布局表
output:
  fields:
  - name: 实施区域坐标
    type: string
    description: 提取 实施区域坐标 的文本值
  - name: 机井编号
    type: string
    description: 提取 机井编号 的文本值
  - name: 通电状态
    type: boolean
    description: 提取 通电状态 的布尔值（是/否）
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (机井通电工程布局表.实施区域坐标 与 高标准农田建设规划.规划配套电力设施范围 不相交 && 机井通电工程布局表.通电状态 == '是') || (已通电机井清单.位置坐标 与 高标准农田建设规划.规划机井坐标 距离
    > 500米 && 机井通电工程布局表.通电状态 == '是')
  description: 当已通电机井位于规划电网覆盖范围之外，或实际机井位置与规划点位偏差超过500米但仍通电，表明规划与建设严重脱节，导致重复建设或无效投资。阈值500米根据电力接入经济半径设定，超出此距离需额外架设线路，增加不合理支出。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 机井布局与高标准农田规划衔接不畅
  regulation: "[\n  {\n    \"法规名称\": \"全国高标准农田建设规划（2021—2030年）\",\n    \"法规文号\": \"国函〔2021〕86号批复\",\n    \"效力级别\": \"国务院规范性文件\"\
    ,\n    \"条款号\": \"第四章第二节\",\n    \"内容概述\": \"高标准农田建设应统筹田、水、路、林、电等工程布局，实现各项设施协调配套。\"\n  },\n  {\n    \"法规名称\": \"高标准农田建设\
    \ 通则\",\n    \"法规文号\": \"GB/T 30600-2022\",\n    \"效力级别\": \"国家标准\",\n    \"条款号\": \"6.3.3\",\n    \"内容概述\": \"农田输配电工程应与田间"
- expression: 机井通电工程布局表.实施区域坐标 WITHIN 地下水禁采区划定范围.禁采区边界坐标 AND 机井通电工程布局表.通电状态 == '已通电' AND 机井合规性审查记录.水利部门取水许可审批意见 != '批准'
  description: 机井的坐标落在禁采区多边形内，且已通电，同时水利部门未出具批准取水许可或明确否决，即构成违规。如水利部门已批准但在禁采区划定后仍实施，需结合审批日期和禁采区生效日期判断。
  audit_item: 农业生产电价政策执行不到位
  suspicion: 在地下水禁采区布局机井通电工程
  regulation: "[\n  {\n    \"法规名称\": \"地下水管理条例\",\n    \"法规文号\": \"国务院令第748号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第三十五条\",\n    \"内容概述\": \"禁止在地下水禁采区开凿新的取水井，不得新增地下水取水量。\"\n  },\n  {\n    \"法规名称\": \"取水许可和水资源费征收管理条例\",\n    \"法规文号\"\
    : \"国务院令第460号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二条、第六条\",\n    \"内容概述\": \"直接从地下取水的单位和个人应当申领取水许可证，禁采区内原则上不予批准。\"\
    \n  }\n]"
