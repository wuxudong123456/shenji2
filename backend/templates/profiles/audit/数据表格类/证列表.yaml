name: audit/数据表格类/证列表
type: model
description: 从数据表格类类文档（证列表）中提取结构化元数据。涵盖字段如：凭证号、凭证日期、凭证编号、摘要、日期。文档范围包括：会计凭证列表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 凭证
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 证列表
  member_count: 1
  member_details:
  - 会计凭证列表
output:
  fields:
  - name: 凭证号
    type: string
    description: 提取 凭证号 的文本值
  - name: 凭证日期
    type: date
    description: 提取 凭证日期 的日期值，格式 YYYY-MM-DD
  - name: 凭证编号
    type: string
    description: 提取 凭证编号 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 日期
    type: date
    description: 提取 日期 的日期值，格式 YYYY-MM-DD
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: (会计凭证列表 LEFT JOIN 会计凭证审核记录表 ON 会计凭证列表.凭证编号 = 会计凭证审核记录表.凭证编号 LEFT JOIN 会计账簿 ON 会计凭证列表.凭证编号 = 会计账簿.凭证编号) WHERE
    (会计凭证审核记录表.审核结果 IS NULL OR 会计凭证审核记录表.审核时间 >= 会计账簿.账簿登记日期) AND 会计凭证列表.凭证编号 IN (SELECT 凭证编号 FROM 会计账簿)
  description: 凭证审核记录表中无对应凭证的审核通过记录，或审核时间晚于或等于账簿登记日期，表明凭证未经审核即入账。
  audit_item: 以未经审核的会计凭证为依据登记会计账簿或者会计账簿登记不符合规定
  suspicion: 以未经审核会计凭证登记账簿
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十条\",\n    \"内容概述\": \"会计人员应当根据审核无误的会计凭证登记会计账簿。\"\n  }\n]"
- expression: (对现金日记账按日期排序，计算日期差：LEAD(现金日记账.日期) OVER (ORDER BY 现金日记账.日期) - 现金日记账.日期 > 1 工作日) OR (同日现金日记账记录笔数 < 同日会计凭证列表笔数
    AND 现金日记账.金额=多笔凭证合计)
  description: 若相邻两笔记录间隔超过1个工作日（排除节假日），说明未逐日登记；若同日有多笔业务而账簿合并为一笔且金额汇总，说明未逐笔登记。
  audit_item: 以未经审核的会计凭证为依据登记会计账簿或者会计账簿登记不符合规定
  suspicion: 日记账未逐日逐笔序时登记
  regulation: "[\n  {\n    \"法规名称\": \"会计基础工作规范\",\n    \"法规文号\": \"财会字〔1996〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第六十条第（七）项\",\n    \"内容概述\": \"现金日记账和银行存款日记账必须逐日结出余额，并按照业务发生顺序逐笔登记，不得汇总登记。\"\n  }\n]"
