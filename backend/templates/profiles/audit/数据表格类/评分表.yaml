name: audit/数据表格类/评分表
type: model
description: 从数据表格类类文档（评分表）中提取结构化元数据。涵盖字段如：不合格描述、产区名称、公厕编号、农药减量完成率、化肥减量完成率、化肥减量率、卫生评分、各指标得分。文档范围包括：公厕卫生检查评分表、农业社会化服务绩效考核评分表、目标考核评分表、目标责任考核评分表、绩效考核评分表、耕地保护绩效考核评分表、食堂卫生检查评分表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 整改
- 检查
- 项目
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 评分表
  member_count: 1
  member_details:
  - 公厕卫生检查评分表
  - 农业社会化服务绩效考核评分表
  - 目标考核评分表
  - 目标责任考核评分表
  - 绩效考核评分表
  - 耕地保护绩效考核评分表
  - 食堂卫生检查评分表
output:
  fields:
  - name: 不合格描述
    type: string
    description: 提取 不合格描述 的文本值
  - name: 产区名称
    type: string
    description: 提取 产区名称 的文本值
  - name: 公厕编号
    type: string
    description: 提取 公厕编号 的文本值
  - name: 农药减量完成率
    type: string
    description: 提取 农药减量完成率 的文本值
  - name: 化肥减量完成率
    type: string
    description: 提取 化肥减量完成率 的文本值
  - name: 化肥减量率
    type: string
    description: 提取 化肥减量率 的文本值
  - name: 卫生评分
    type: string
    description: 提取 卫生评分 的文本值
  - name: 各指标得分
    type: string
    description: 提取 各指标得分 的文本值
  - name: 定性指标占比
    type: string
    description: 提取 定性指标占比 的文本值
  - name: 得分
    type: string
    description: 提取 得分 的文本值
  - name: 扣分原因
    type: string
    description: 提取 扣分原因 的文本值
  - name: 指标权重实际值
    type: string
    description: 提取 指标权重实际值 的文本值
  - name: 整改情况
    type: string
    description: 提取 整改情况 的文本值
  - name: 有机质含量考核得分
    type: string
    description: 提取 有机质含量考核得分 的文本值
  - name: 样本选取方法
    type: string
    description: 提取 样本选取方法 的文本值
  - name: 核查方式说明
    type: string
    description: 提取 核查方式说明 的文本值
  - name: 检查人
    type: string
    description: 提取 检查人 的文本值
  - name: 检查日期
    type: date
    description: 提取 检查日期 的日期值，格式 YYYY-MM-DD
  - name: 检查项目
    type: string
    description: 提取 检查项目 的文本值
  - name: 火点核减数量
    type: number
    description: 提取 火点核减数量 的数值（含单位，如万元、吨等）
  - name: 秸秆禁烧考核项得分
    type: string
    description: 提取 秸秆禁烧考核项得分 的文本值
  - name: 考核区域
    type: string
    description: 提取 考核区域 的文本值
  - name: 考核年度
    type: date
    description: 提取 考核年度 的日期值，格式 YYYY-MM-DD
  - name: 考核指标版本
    type: string
    description: 提取 考核指标版本 的文本值
  - name: 考核结果
    type: boolean
    description: 提取 考核结果 的布尔值（是/否）
  - name: 评分项
    type: string
    description: 提取 评分项 的文本值
  - name: 适用服务类型说明
    type: string
    description: 提取 适用服务类型说明 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 耕地土壤有机质含量监测数据表.有机质含量 < 土壤有机质提升技术规程.有机质目标值
  description: 以地方制定的有机质提升技术规程或考核目标中的有机质含量标准为依据，当监测数据表中任一有效监测点位的土壤有机质含量低于该目标值时，即判定为该点位未达标；若未达标点位数量达到一定比例（如超过10%）或连续年度下降，则认定为耕地土壤有机质含量整体未达标。
  audit_item: 任务目标未完成
  suspicion: 耕地土壤有机质含量未达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国黑土地保护法\",\n    \"法规文号\": \"中华人民共和国主席令第103号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"县级以上人民政府应当将黑土地保护纳入国民经济和社会发展规划，安排资金，确保黑土地面积不减、质量不降，生态功能不退化。\"\n  }\n]"
- expression: (服务台账.服务面积 > 当地耕地总面积) || (抽查不符率 > 0.2) || (评分表.核查方式说明 != '实地抽查')
  description: 若同一地区服务组织上报的服务总面积超过当地耕地总面积，或对台账数据电话/实地抽查的不符合比例超过20%，或考核评分表未载明任何实地核查记录，均视为考核流于形式。
  audit_item: 农业社会化服务绩效考核不科学
  suspicion: 绩效考核仅依据台账未开展实地核查
  regulation: "[\n  {\n    \"法规名称\": \"农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"绩效评价应当采取资料审核、实地核查、满意度测评等多种方式，确保评价结果的真实性和准确性。\"\n  }\n]"
- expression: (评分表.定性指标占比 > 0.3) || (数据表.调查样本量 < 30) || (数据表.满意度评分 == 0 && 数据表.满意度评分 >= 95)
  description: 定性指标（如仅描述性评价无公式计算）占比超过30%，或满意度调查有效样本量不足30份，或所有样本得分完全一致且平均分在95分以上，均提示指标设计空洞或数据造假。
  audit_item: 农业社会化服务绩效考核不科学
  suspicion: 绩效考核指标缺乏量化标准满意度失真
  regulation: "[\n  {\n    \"法规名称\": \"财政支出绩效评价管理暂行办法\",\n    \"法规文号\": \"财预〔2011〕285号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十五条\",\n    \"内容概述\": \"绩效评价指标应当遵循科学、规范、可行原则，尽可能量化，对无法量化的指标可采用分级描述，但应具有可衡量性。\"\n  }\n]"
- expression: (评分表.指标权重实际值 < 0.2) && (评分表.指标权重实际值 > 0.5)
  description: 若绩效评价方案中反映服务质量（如技术指导实效、农户增产率）的指标权重合计低于20%，而仅体现规模扩张的覆盖率指标权重超过50%，则权重设置严重失衡，重数量轻质量。
  audit_item: 农业社会化服务绩效考核不科学
  suspicion: 绩效评价方案指标权重偏向严重失衡
  regulation: "[\n  {\n    \"法规名称\": \"农业生产发展资金管理办法\",\n    \"法规文号\": \"财农〔2020〕10号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"绩效评价指标体系应当科学合理，突出产出和效益，权重设置应当体现各指标的重要程度。\"\n  }\n]"
- expression: (实施方案.服务类型划分 > 1) && (评分表.考核指标版本 == 1) && (佐证材料.材料类型 == '无差异化佐证要求')
  description: 当项目涉及多种服务类型（如病虫害防治、秸秆还田等），但仅使用同一套考核指标模板，且未规定各类服务应提供的差异化佐证材料（如病虫害防治需实验室检测报告）时，评价方案未予细化。
  audit_item: 农业社会化服务绩效考核不科学
  suspicion: 绩效评价方案未区分服务类型考核标准
  regulation: "[\n  {\n    \"法规名称\": \"财政支出绩效评价管理暂行办法\",\n    \"法规文号\": \"财预〔2011〕285号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"绩效评价指标应当根据评价对象的具体情况设定，具有针对性和可比性，能够反映评价对象的实际特点和水平。\"\n  }\n]"
- expression: （检查日期、公厕编号、卫生评分、不合格描述、整改情况.卫生评分 < 60） && （检查日期、公厕编号、卫生评分、不合格描述、整改情况.检查日期 间隔月 >= 1 && COUNT(检查日期、公厕编号、卫生评分、不合格描述、整改情况
    FILTER 卫生评分 < 60) >= 3 ） || （SUM(资金支出日期、金额、支出项目（是否含运维费用）、收款单位、支出日期、支出金额、用途说明、关联户厕编号、支出项目、对应公厕名称.金额 FILTER 支出项目 LIKE '%保洁%')
    = 0 && 检查日期、公厕编号、卫生评分、不合格描述、整改情况.记录数 = 0）
  description: 连续3个月及以上卫生评分均低于60分，或虽有年度考评分但从未发生保洁费用支出，以及完全无卫生检查评分记录，三种情况均认定为管护严重缺位。
  audit_item: 农村厕所粪污治理不符合相关规定
  suspicion: 农村公厕管护缺位导致环境卫生差
  regulation: "[\n  {\n    \"法规名称\": \"关于推进农村厕所粪污无害化处理与资源化利用的指导意见\",\n    \"法规文号\": \"农社发〔2020〕2号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第五条“加强公共厕所日常管护”\",\n    \"内容概述\": \"建立公共厕所管护制度，做到有专人管理、有保洁标准、有监督考核，确保公厕干净卫生、正常使用。\"\n  }\n]"
- expression: ( ( [统计表.化肥使用量（吨）] - [统计表.化肥使用量（吨）] ) / [统计表.化肥使用量（吨）] > 0 ) || ( ( [统计表.农药使用量（吨）] - [统计表.农药使用量（吨）] ) / [统计表.农药使用量（吨）]
    > 0 ) || ( [评分表.考核结果] == '达标' && ( [数据表.年度水体氮含量（mg/L）] > [数据表.年度水体氮含量（mg/L）]*1.1 || [调查台账.化肥购买量（吨）]按区域汇总 > [统计表.化肥使用量（吨）]*1.15
    ) )
  description: 以2015年为基准年，计算当年化肥或农药使用量增长率，若大于0即未实现零增长；同时引入环保监测数据和农户抽样数据作为验证条件：若考核结果声称达标，但水体氮含量同比上升超过10%或抽样调查汇总用量超过统计表用量15%以上，则涉嫌数据造假掩盖未达标事实。阈值1.1和1.15为审计经验值，可根据实际基线调整。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 化肥农药使用量未实现零增长
  regulation: "[\n  {\n    \"法规名称\": \"到2020年化肥使用量零增长行动方案\",\n    \"法规文号\": \"农农发〔2015〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n\
    \    \"条款号\": \"全文\",\n    \"内容概述\": \"力争到2020年主要农作物化肥使用量实现零增长\"\n  },\n  {\n    \"法规名称\": \"到2020年农药使用量零增长行动方案\",\n \
    \   \"法规文号\": \"农农发〔2015〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n    \"条款号\": \"全文\",\n    \"内容概述\": \"力争到2020年主要农作物农药使用量实现零增长\"\
    \n  }\n]"
- expression: '[数据表.化肥减量完成率（%）] = ( [数据表.基线化肥用量（吨/亩）] - [数据表.当期化肥用量（吨/亩）] ) / [数据表.基线化肥用量（吨/亩）] < 0.2 || ( [评分表.考核结果] == ''完成''
    && ( [数据表.化肥减量完成率（%）] < 0.2 || ( [情况文件.实际用于果菜茶产区金额（万元）] / [情况文件.资金拨付总额（万元）] < 0.6 ) ) )'
  description: 计算果菜茶优势产区的化肥减量率，若低于20%即判定未达标。同时设置隐蔽违规逻辑：即便考核结果填报为‘完成’，但只要实际减量率小于20%，或项目资金中仅有不足60%真正投向果菜茶产区（即资金被挪作他用），则认定为目标任务未完成且存在违规行为。阈值60%可根据责任书中规定的资金专款专用比例调整。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 果菜茶优势产区化肥用量未减少20%以上
  regulation: "[\n  {\n    \"法规名称\": \"开展果菜茶有机肥替代化肥行动方案\",\n    \"法规文号\": \"农农发〔2017〕2号\",\n    \"效力级别\": \"部门规范性文件\",\n \
    \   \"条款号\": \"第二部分 目标任务\",\n    \"内容概述\": \"到2020年，果菜茶优势产区化肥用量减少20%以上。\"\n  }\n]"
- expression: (COUNT(数据.卫星火点坐标) > COUNT(案件台账.违规地点坐标) * 1.2) || (SUM(CASE WHEN 同一地点火点次数 >= 2 AND 案件台账.处罚案件编号 IS NULL THEN 1
    ELSE 0 END) > 0)
  description: 当区域卫星监测火点数量超过已处罚案件数量的1.2倍（即未处罚率超过16.7%），或存在同一坐标点2次及以上焚烧但无任何处罚记录（重复火点未处罚），则判定为焚烧监管缺位，存在瞒报、漏查或执法不到位的情况。阈值1.2为通用审计经验值，可根据当地实际监管能力调整。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 秸秆禁烧监管缺位导致违规焚烧火点多发
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国大气污染防治法\",\n    \"法规文号\": \"中华人民共和国主席令第三十一号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第七十六条、第一百一十九条\",\n    \"内容概述\": \"省、自治区、直辖市人民政府应当划定区域，禁止露天焚烧秸秆、落叶等产生烟尘污染的物质。违反本法规定，在人口集中地区对树木、花草喷洒剧毒、高毒农药，或者露天焚烧秸秆、落叶等产生烟尘污染的物质的，由县级以上地方人民政府确定的监督管理部门责令改正，并可以处五百元以上二千元以下的罚款。\"\
    \n  }\n]"
- expression: (食堂卫生检查评分表.总分 < 70) || (食堂卫生检查报告及整改记录.发现问题 != '' && 食堂卫生检查报告及整改记录.整改完成日期 == '') || 消毒设备.最近使用日期 < (当前日期 - [此处填充文本])
  description: 卫生检查评分低于70分（假设满分100）属于严重脏乱差；检查发现问题但无后续整改完成记录，表明问题未闭环管理；消毒设备长期无使用记录（如超过3天），怀疑餐具未经消毒。任一条件触发即判定为卫生管理不合规。
  audit_item: 食堂建设管理不符合规定
  suspicion: 食堂加工操作间卫生不达标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国食品安全法\",\n    \"法规文号\": \"中华人民共和国主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第三十三条\",\n    \"内容概述\": \"食品生产经营应当具有与生产经营的食品品种、数量相适应的生产经营设备或者设施，有相应的消毒、更衣、盥洗、采光、照明、通风、防腐、防尘、防蝇、防鼠、防虫、洗涤以及处理废水、存放垃圾和废弃物的设备或者设施。\"\
    \n  },\n  {\n    \"法规名称\": \"学校食品安全与营养健康管理规定\",\n    \"法规文号\": \"教育部、国家市场监督管理总局、国家卫生健康委员会令第45号\""
