name: audit/数据表格类/程量报表
type: model
description: 从数据表格类类文档（程量报表）中提取结构化元数据。涵盖字段如：申报产值、申报完成一量。文档范围包括：月完成工程量报表等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 数据表格类
- 审计
- 元数据提取
template_class:
  category: 数据表格类
  member_types:
  - 程量报表
  member_count: 1
  member_details:
  - 月完成工程量报表
output:
  fields:
  - name: 申报产值
    type: string
    description: 提取 申报产值 的文本值
  - name: 申报完成一量
    type: string
    description: 提取 申报完成一量 的文本值
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
violations:
- expression: 申报产值.申报产值 > 评定表.同意的累计完成产值 * 1.05 && 申请表.申请支付金额 > 申报产值.申报产值 * 合同约定的支付比例
  description: 监理审定的累计完成产值若高于质量验收评定核定的产值5%以上，且建设单位据此超额支付进度款（支付金额超过应支付额），可能存在虚报进度、套取资金。5%为审计容忍合理偏差，超过即视为异常。
  audit_item: 大型水利工程进度与成本审计
  suspicion: 虚报工程进度及完成产值以提前套取工程款
  regulation: "[\n  {\n    \"法规名称\": \"水利基本建设资金管理办法\",\n    \"法规文号\": \"财基字[1999]139号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"工程价款应按照建设工程合同规定条款、实际完成工程量及工程监理情况结算与支付。项目法人应严格核实工程量，防止虚报冒领。\"\n  },\n  {\n    \"法规名称\"\
    : \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建[2004]369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十三条\",\n    \"内容概述\": \"\
    工程进度款结算应"
