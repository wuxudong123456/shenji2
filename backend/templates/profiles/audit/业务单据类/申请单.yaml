name: audit/业务单据类/申请单
type: model
description: 从业务单据类类文档（申请单）中提取结构化元数据。涵盖字段如：变更事项、变更内容描述、变更提出日期、变更编号、变更金额、变更项目名称、申请单位、费用增加金额。文档范围包括：工程变更申请单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 金额
- 项目
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 申请单
  member_count: 1
  member_details:
  - 工程变更申请单
output:
  fields:
  - name: 变更事项
    type: string
    description: 提取 变更事项 的文本值
  - name: 变更内容描述
    type: string
    description: 提取 变更内容描述 的文本值
  - name: 变更提出日期
    type: date
    description: 提取 变更提出日期 的日期值，格式 YYYY-MM-DD
  - name: 变更编号
    type: string
    description: 提取 变更编号 的文本值
  - name: 变更金额
    type: number
    description: 提取 变更金额 的数值（含单位，如万元、吨等）
  - name: 变更项目名称
    type: string
    description: 提取 变更项目名称 的文本值
  - name: 费用增加金额
    type: number
    description: 提取 费用增加金额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (投资台账.单项工程实际投资额 - 单项工程概算金额.单项工程概算金额 > 单项工程概算金额.单项工程概算金额 * 0.1) && (支付报表.累计已计量工程量 > 项目合同.合同工程量 * 1.1 || 支付报表.累计已支付金额
    > 项目合同.合同总价 * 1.1) && (申请单.费用增加金额 == null || 申请单.批复意见 != "同意")
  description: 单项工程实际投资超出概算10%以上，并且计量工程量或支付金额超出原合同10%以上，同时缺乏有效变更批复文件，判定为成本控制违规。10%阈值参照水利工程变更管理的一般规定，超出且未批可视为擅自扩大建设规模或提高标准。
  audit_item: 大型水利工程进度与成本审计
  suspicion: 成本超支项目未履行变更审批程序
  regulation: "[\n  {\n    \"法规名称\": \"水利工程建设项目管理暂行规定\",\n    \"法规文号\": \"水建[1995]128号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"建设项目投资必须严格控制在批准的概算范围内。确需调整概算的，必须按原审批程序报批。\"\n  },\n  {\n    \"法规名称\": \"水利工程设计变更管理暂行办法\"\
    ,\n    \"法规文号\": \"水规计[2012]93号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条、第十七条\",\n    \"内容概述\": \"重大设计变更及涉及投资增加的变更必"
- expression: MIN(日志.变更实施旁站记录日期, 日志.变更实施旁站记录日期) < MAX(审批表.最终批准日期, 通知单.设计单位出图日期) || (申请单.变更提出日期 IS NULL && 签证单.签证日期 IS NOT
    NULL)
  description: 若实际施工日期早于最终审批日期或设计变更图纸发出日期，即存在未批先建行为；或仅有现场签证而无变更申请单，属于先干后报。当施工或监理记录的变更时间早于审批完成时间，触发疑点；风险等级：差异天数>15天为严重违规。
  audit_item: 工程变更审计评估
  suspicion: 工程变更未经审批擅自实施
  regulation: "[\n  {\n    \"法规名称\": \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建[2004]369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"工程设计变更确定后14天内，如承包人未提出变更工程价款报告，则发包人可根据所掌握的资料决定是否调整合同价款和调整的具体金额。重大工程变更涉及工程价款变更报告和确认的时限应当严格掌握。\"\
    \n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条"
- expression: COUNT(审批台账.所有变更编号 GROUP BY 同一分部分项工程) > 1 && SUM(审批台账.累计变更金额) > 施工合同.合同金额*10% && MAX(审批台账.单次变更金额) < (施工合同.合同金额*10%*0.9)
  description: 对同一施工部位或分部分项在短期内多次申报小金额变更，每笔均低于合同价10%的审批门槛，但累计总额超过合同价10%，属于化整为零规避专项审批或重新招标。若单次变更金额均控制在限额的90%以下，且时间间隔小于30天，疑点等级为高。
  audit_item: 工程变更审计评估
  suspicion: 将同一变更项目化整为零规避招标或审批
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n   \
    \ \"法规文号\": \"国家发展和改革委员会令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"本规定第二条至第四条规定范围内的项目，其勘察、设计、施工"
