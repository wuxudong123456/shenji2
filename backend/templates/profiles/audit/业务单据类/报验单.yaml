name: audit/业务单据类/报验单
type: model
description: 从业务单据类类文档（报验单）中提取结构化元数据。涵盖字段如：报验日期、报验材料批次、监理审核签字。文档范围包括：材料报验单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 报验单
  member_count: 1
  member_details:
  - 材料报验单
output:
  fields:
  - name: 报验日期
    type: date
    description: 提取 报验日期 的日期值，格式 YYYY-MM-DD
  - name: 报验材料批次
    type: string
    description: 提取 报验材料批次 的文本值
  - name: 监理审核签字
    type: string
    description: 提取 监理审核签字 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (材料进场台账.进场日期 不为空) && (材料复验报告.报告出具日期 为空 || 材料复验报告.报告出具日期 > 施工日志.使用日期 || 材料复验报告.检测结论 == '不合格') && (材料报验单.监理审核签字
    存在)
  description: 材料已进场且有使用记录，但未见对应的合格复验报告，或复验报告出具日期晚于材料使用日期，或复验结论为不合格但仍通过报验并投入使用，均属于违规。监理审核签字存在说明流程形式上走完，实质审核缺失。
  audit_item: 工程质量事故调查
  suspicion: 主要建筑材料未经检验投入使用
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十九条\",\n    \"内容概述\": \"施工单位必须按照工程设计要求、施工技术标准和合同约定，对建筑材料、建筑构配件、设备和商品混凝土进行检验，检验应当有书面记录和专人签字；未经检验或者检验不合格的，不得使用。\"\n\
    \  }\n]"
