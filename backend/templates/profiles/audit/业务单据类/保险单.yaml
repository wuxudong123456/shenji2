name: audit/业务单据类/保险单
type: model
description: 从业务单据类类文档（保险单）中提取结构化元数据。涵盖字段如：承保机构名称。文档范围包括：车辆保险单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 保险单
  member_count: 1
  member_details:
  - 车辆保险单
output:
  fields:
  - name: 承保机构名称
    type: string
    description: 提取 承保机构名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (保险单.承保机构名称 != 服务合同.定点供应商名称) OR (记录表.维修站点名称 != 服务合同.定点供应商名称) OR (明细表.加油站名称 != 服务合同.定点供应商名称) OR (明细表.收款方名称 NOT
    IN 服务合同.定点供应商名称)
  description: 将实际发生费用的供应商与有效的政府采购定点合同进行比对，若保险、维修、加油服务的实际提供者不在定点名录内，或虽然名称相同但没有签订当期有效合同，即判定为未执行定点服务制度。
  audit_item: 违规管理或使用公务用车
  suspicion: 未执行定点服务政府采购制度
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第七条\",\n    \"内容概述\": \"政府采购实行集中采购和分散采购相结合。纳入集中采购目录的政府采购项目，应当实行集中采购。\"\n  },\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n \
    \   \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第十五条\",\n    \"内容概述\": \"公务用车保险、维修、加油等实行政府集中采购和定点服务，严格执行"
