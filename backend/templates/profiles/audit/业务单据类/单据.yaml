  description: 已满5年允许上市交易的保障房，须按规定补交土地收益等价款。表达式筛选已完成交易的记录，然后检查补缴台账中是否缺失补缴记录（IS NULL），或者实补金额低于根据政策计算的应补金额下限。应补金额按（同地段市场评估价×规定的补缴比例-原购买价）计算，实补金额与应补金额的偏差超过5%视为可疑。具体补缴比例依地方政策设定，通常不低于差价的50%。
