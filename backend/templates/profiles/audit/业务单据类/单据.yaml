violations:
- expression: (任务批件中文.所属单位 = 本单位) AND (明细台账.收款单位 != 本单位 AND 明细台账.对应出国任务 = 任务批件中文.任务名称) OR (单据.付款方 != 本单位 AND 单据.收款方 = 本单位
    且摘要含出国事由)
  description: 本单位人员的出国费用理应由本单位承担，若发现费用由所属单位或外单位支付（即分摊台账中收款方为外单位，但对应的是本单位人员任务，或银行流水显示外单位向本单位支付出国相关费用），可能构成摊派。无合规分摊协议或协议显失公平均属违规。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 向所属或其他单位摊派因公出国费用
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"党政机关不得向下属单位、企业、社会组织等摊派或转嫁因公出国（境）等费用，不得以任何名义要求其他单位提供资金或物品。\"\n  }\n]"
- expression: (单据.支付方式（转账/现金） = '现金' AND 单据.金额 > 管理制度.公务卡强制结算起点金额) OR (单据.收款方类型（对公/个人） = '个人' AND 单据.金额 > 对公支付起点 AND 无合同约定付个人)
  description: 大额出国费用（如超过公务卡强制结算起点1000元或单位规定阈值）通过现金支付，或直接转账至个人账户而非服务提供方对公账户，均违反支付管理规定，存在资金被挪用或虚报风险。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 出国费用支付方式不合规
  regulation: "[\n  {\n    \"法规名称\": \"公务卡强制结算目录\",\n    \"法规文号\": \"财库〔2011〕160号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"全文\",\n    \"内容概述\": \"预算单位因公出国（境）费用等大额支出，应当使用公务卡结算，不得使用现金支付，强制结算起点一般为1000元。\"\n  },\n  {\n    \"法规名称\": \"现金管理暂行条例\"\
    ,\n    \"法规文号\": \"国务院令第12号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"开户单位之间的经济往来，除按条例规定的范围可以使用现金外"
- expression: 企业会计政策文件.存货计价方法(本期) != 企业会计政策文件.存货计价方法(上期) && ABS(主营业务成本明细表.本期销售成本 - 按上期方法计算的销售成本) / 利润总额 > 0.05 && (董事会决议 IS
    NULL || 董事会决议.批准日期 > 变更生效日期) && 财务报表附注.会计政策变更说明 NOT LIKE '%存货计价方法变更%'
  description: 当企业本期存货计价方法改变，且对销售成本的影响超过利润总额5%，同时无董事会审批或审批滞后，且未在附注中披露时，触发疑点。
  audit_item: 随意变更会计处理方法
  suspicion: 随意变更存货计价方法调节销售成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"公司、企业不得随意改变费用、成本的确认标准或者计量方法，导致多列、少列成本。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n    \"法规文号\"\
    : \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条、第二十二条\",\n    \"内容概述\": \"企业应当采用先进先出法、加权平均法或者个别计价法确定发出存货的实"
- expression: 缺失(会议通知) || 缺失(参会人员签到表) || 缺失(费用原始明细单据) || 缺失(发票) || (参会人员签到表.签到人数 != 发票.金额 / 人均定额 AND ABS(偏差) > 10%)
  description: 每笔会议费报销必须附有完整的支撑材料。若缺少会议通知、签到表、费用明细、发票中的任一项，直接判为违规。此外，若签到人数与费用结算人数逻辑不匹配（如按人头计算的费用），偏差超过10%，则可能存在虚增人数。
  audit_item: 会议费审计
  suspicion: 会议费报销凭证关键附件缺失
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"会议费报销时应当提供会议审批文件、会议通知及实际参会人员签到表、定点会议场所等会议服务单位提供的费用原始明细单据、电子结算单等凭证。\"\n  }\n]"
- expression: (明细账.发票号码 NOT IN 发票号码.发票号码) || (发票号码.购方名称 != 单据.收货单位) || (行对账单.付款方 != 销售合同.购方名称) || (发存台账.数量 < 发票号码.数量)
  description: 存在发票号码未正式登记、购货方与收货方不一致、付款方非合同购方或出库数量低于开票数量任一情况，即为虚开嫌疑。
  audit_item: 未按规定确认收入
  suspicion: 虚开商品销售发票虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国发票管理办法\",\n    \"法规文号\": \"国务院令第587号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
