name: audit/业务单据类/单据
type: model
description: 从业务单据类类文档（单据）中提取结构化元数据。涵盖字段如：事由、交货验收签字、产品名称、人员姓名、付款方、住址、入库量、出入库日期。文档范围包括：储存库出入库单据、公务卡报销单据、农药生产企业出厂销售物流单据、原始单据、存货发货单据、存货采购单据、审计期间内原始单据、执法装备采购验收单据、沼气发电上网结算单据、物流单据等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 人员
- 付款
- 审批
- 票据
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 单据
  member_count: 1
  member_details:
  - 储存库出入库单据
  - 公务卡报销单据
  - 农药生产企业出厂销售物流单据
  - 原始单据
  - 存货发货单据
  - 存货采购单据
  - 审计期间内原始单据
  - 执法装备采购验收单据
  - 沼气发电上网结算单据
  - 物流单据
  - 物资发放签收单据
  - 疫苗运输冷链物流单据
  - 研发费用归集原始单据
  - 粮油购销出入库单据
  - 经纪机构成交单据
  - 设备采购验收单据
  - 费用原始明细单据
  - 费用支付方式相关银行流水单据
  - 银行流水单据
  - 项目设备验收单据
