name: audit/业务单据类/置联单
type: model
description: 从业务单据类类文档（置联单）中提取结构化元数据。涵盖字段如：处置场所签收量、清运量、联单编号、运输车辆号。文档范围包括：垃圾转运处置联单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 车辆
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 置联单
  member_count: 1
  member_details:
  - 垃圾转运处置联单
output:
  fields:
  - name: 处置场所签收量
    type: string
    description: 提取 处置场所签收量 的文本值
  - name: 清运量
    type: string
    description: 提取 清运量 的文本值
  - name: 联单编号
    type: string
    description: 提取 联单编号 的文本值
  - name: 运输车辆号
    type: string
    description: 提取 运输车辆号 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (存在联单编号断号) || (SUM(表4.清运量) - 终端处理厂接收量 > 0) || (GPS轨迹终点坐标 NOT IN 合法处理场所坐标) || (GPS停留点坐标与备案接收地距离 > 1公里)
  description: 联单编号不连续表明存在未记录的转移；同一堆放点清运总量大于终端处理厂接收量，差额即为去向不明垃圾；车辆GPS轨迹终点或长时间停留点不在合法处理场所，则涉嫌非法倾倒。
  audit_item: 非正规垃圾堆放点清理整治不合规
  suspicion: 虚假治理转移生活垃圾至别处堆放
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"中华人民共和国主席令第四十三号\",\n    \"效力级别\": \"法律\",\n\
    \    \"条款号\": \"第二十条\",\n    \"内容概述\": \"禁止擅自倾倒、堆放、丢弃、遗撒固体废物。\"\n  },\n  {\n    \"法规名称\": \"关于做好非正规垃圾堆放点排查和整治工作的通知\",\n\
    \    \"法规文号\": \"建办村〔2017〕55号\",\n    \"效力级别\": \"部门规范性文件\",\n    \"条款号\": \"三、（二）\",\n    \"内容概述\": \"严禁将垃圾简单转移至其他地方堆放，必须进行无害化处理"
