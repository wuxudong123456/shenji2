violations:
- expression: (会议费报销明细表.会议名称 NOT IN 年度会议费预算申报表.会议名称) && 会议费报销明细表.实际支出金额 > 0 || (SUM(会议费报销明细表.实际支出金额) > 年度会议费预算申报表.批复预算金额 *
    1.1 && 预算调整审批记录表.调整金额 IS NULL)
  description: 筛查两类违规：一是存在实际报销的会议但未在年度预算申报表中列报，即会议脱离预算管控；二是所有会议费实际总支出超出批复预算10%以上，且无任何预算调整审批记录，表明预算约束失效。两条件满足任一即触发疑点。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 未将会议费全部纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第八条\",\n    \"内容概述\": \"会议费预算要细化到具体会议项目，执行中不得突破。会议费应纳入部门预算，并单独列示。\"\n  }\n]"
- expression: （会议费预算编制与执行对比表.分项实际支出金额 > 会议费预算编制与执行对比表.分项预算金额 * 1.2） || （会议费报销明细表.费用科目 IN ['住宿费','资料印刷费','设备租赁费'] && 年度会议费预算申报表.预算明细科目
    NOT INCLUDE 会议费报销明细表.费用科目）
  description: 若某项费用实际支出超出预算20%以上，或实际发生了住宿费、资料费等必要支出但预算申报时未列示该科目，判定为预算编制不完整。预算编制应涵盖会议必要的全部费用构成，缺失关键科目即构成违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 会议费预算编制不完整
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条\",\n    \"内容概述\": \"各单位应当按照规定编制会议费预算，详细列示会议名称、主要内容、时间、地点、代表人数、工作人员数、所需经费及列支渠道等。\"\n  }\n]"
- expression: (下属单位会议费支出明细表.会议费支出摘要 LIKE '%上级会议%' || 会议费转嫁/分摊台账.分摊金额 > 0) && (下属单位/关联方会议费分摊协议.分摊方 IS NULL || 银行流水.用途 = '会议分摊费')
  description: 若下属单位账面出现与上级单位会议相关的费用支出，或无正式分摊协议但资金已划转，或分摊台账显示存在分摊行为，则判定为转嫁或摊派会议费。重点确认分摊是否经正式协议且合规，缺乏协议或资金流向明确为会议分摊费即构成违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 向下属机构、企事业单位、地方转嫁或摊派会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"会议费由召开单位承担，不得向参会人员收取，不得以任何方式向下属机构、企事业单位、地方转嫁或摊派。\"\n  }\n]"
- expression: (会议费报销明细表.参会人数 > 会议签到表.实际签到人数 * 1.2) || (SUM(会议费报销明细表.报销金额) - SUM(会议费预算编制与执行对比表.实际支出金额) > 0 && 银行流水.收款方 IN (虚假会议套取资金关联方资金流向表.关联方名称))
    || (会议费预算编制与执行对比表.结余金额 > 0 && 会议费报销明细表.实际支出明细（场地费、餐费、住宿费、资料费等） IS NULL)
  description: 通过虚报参会人数多申领费用、将会议结余资金转入关联方或个人账户、结余资金未退还财政等情形判定挪用、截留或侵占。人数虚报比例超过20%，或报销金额大于实际支出且收款方为关联方，或有结余但无退款记录均触发疑点。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 挪用、截留、侵占会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁各单位借会议名义组织会餐或安排宴请；严禁套取会议费设立‘小金库’；严禁在会议费中列支公务接待费。会议费支付应当严格按国库集中支付和公务卡管理规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\
    \n  }\n]"
- expression: （NOT EXISTS（会议签到表.会议名称 = 会议费报销明细表.会议名称）|| 会议签到表.实际签到人数 = 0 || 会议纪要.会议现场照片 IS NULL） && 会议费报销明细表.报销金额 > 5000 &&
    （银行流水.收款方 IN （虚假会议套取资金关联方资金流向表.关联方名称）|| 银行流水.用途摘要 IS NULL）
  description: 判断会议是否虚构：无签到记录或签到人数为0，或缺乏影像资料等实质性证明，且报销金额较大（如超过5000元），同时资金流向关联方或用途不明，视为虚列会议套取资金。重点关注报销后资金回流至经手人或关联账户的特征。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 虚列会议费套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员有虚报、冒领等手段骗取财政资金的行为，将给予相应处理。\"\n  },\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n  \
    \  \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十一条\",\n    \"内容概述\": \"严禁套取会议费设立‘小金库’；严禁在会议费中列支公务接待费等规"
- expression: (公务接待明细台账.接待场所名称 NOT IN (定点接待场所名录.酒店名称)) && (公务接待明细台账.接待场所名称 IN (高档酒店预警清单) || (公务接待明细台账.接待金额 / 公务接待明细台账.接待人数)
    > 地区公务接待餐费标准)
  description: 接待场所不在定点名录内，且属于审计预设的高档酒店（如五星级、豪华型）清单，或人均消费超出当地公务接待标准（如超出10%），触发违规判定。需结合当地接待标准及酒店价格水平实施。
  audit_item: 公务接待管理不符合规定
  suspicion: 在高档酒店进行公务接待
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条\",\n    \"内容概述\": \"工作餐应当供应家常菜，不得提供鱼翅、燕窝等高档菜肴和用野生保护动物制作的菜肴，不得提供香烟和高档酒水，不得使用私人会所、高消费餐饮场所。\"\n  }\n]"
- expression: 报销凭证.审批单附置情况 NOT CONTAIN '公务接待审批单' || 公务接待审批单.审批日期 > 接待清单.接待时间 || 公务接待审批单.审批人 NOT IN (有审批权限人员名单)
  description: 报销时缺少审批单，或审批日期晚于接待实际发生日期（事后补批），或审批人不在单位授权审批人清单内，均视为未履行审批程序。
  audit_item: 公务接待管理不符合规定
  suspicion: 接待未按规定履行审批程序
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第七条\",\n    \"内容概述\": \"接待单位应当根据规定的接待范围，严格接待审批控制，对能够合并的公务接待统筹安排。\"\n  }\n]"
- expression: (出差审批单 IS NULL) || (住宿费发票.酒店名称 NOT IN (定点酒店目录.酒店名称) && 住宿费发票.住宿金额 > 差旅住宿费地区标准 || 住宿费发票.住宿日期 NOT BETWEEN 出差审批单.批准起止日期)
  description: 无出差审批单、住宿酒店非定点且价格超过当地差旅住宿费标准、或住宿日期与审批日期不符，均构成违规。定点目录和地区标准依据当地财政部门公布的文件。
  audit_item: 公务接待管理不符合规定
  suspicion: 出差未审批或未入住定点酒店
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关差旅费管理办法\",\n    \"法规文号\": \"财行〔2013〕531号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条、第二十条\",\n    \"内容概述\": \"出差人员应当按规定等级乘坐交通工具，按规定标准住宿；未按规定等级乘坐交通工具和住宿的，超支部分由个人自理。各单位应按规定选择定点饭店住宿。\"\n  }\n]"
- expression: (公务接待明细台账.对应审批单编号 IS NULL) OR (接待审批单.审批日期 > 公务接待明细台账.接待日期) OR (接待审批单.审批人签字 IS NULL) OR (财务报销凭证.所附审批单情况 IS NULL)
  description: 台账中无对应审批单编号、审批日期晚于实际接待日期(先接待后审批)、审批单无有效签字、报销时未附审批单，满足任一条件即告违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 未履行公务接待审批程序
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第七条、第十四条\",\n    \"内容概述\": \"接待单位应当严格接待审批控制，无公函的公务活动和来访人员一律不予接待；接待费报销凭证应当包括财务票据、派出单位公函和接待清单。\"\n  }\n]"
- expression: (差旅费报销汇总表.出差日期 < 出差审批单.批准起止日期) OR (差旅费报销汇总表.出差日期 > 出差审批单.批准起止日期) OR (出差审批单.审批人签字 IS NULL) OR (差旅费报销汇总表.差旅人 NOT
    IN (出差审批单.出差人))
  description: 报销单据中的出差日期超出审批起止范围、审批单无有效签字、报销人未在审批单出差人员之列，任一项成立即为违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 未严格执行出差审批管理
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关差旅费管理办法\",\n    \"法规文号\": \"财行〔2013〕531号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条、第十四条\",\n    \"内容概述\": \"各单位应当建立健全出差审批制度，严格差旅费预算管理，控制差旅费支出规模；出差人员必须按规定报经单位有关领导批准后方可出差。\"\n  }\n]"
- expression: (财务报销凭证.住宿发票开具方 NOT IN (定点酒店/餐馆合作协议台账.定点酒店名称)) OR (财务报销凭证.金额 > 定点酒店/餐馆合作协议台账.协议价格 * 1.1) OR (财务报销凭证.所附审批单情况
    != '特殊情况说明' AND 财务报销凭证.住宿发票开具方 NOT IN (定点酒店/餐馆合作协议台账.定点酒店名称))
  description: 入住非协议定点酒店，或实际支付价格超出协议价10%以上且无合理说明，即视为违规。
  audit_item: 公务接待管理不符合规定
  suspicion: 未执行定点住宿制度
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关差旅费管理办法\",\n    \"法规文号\": \"财行〔2013〕531号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十条、第十一条\",\n    \"内容概述\": \"出差人员应当到定点饭店住宿，住宿费按照定点饭店的协议价格结算；未按规定等级乘坐交通工具、住宿的，超支部分由个人自理。\"\n  }\n]"
- expression: (流水.对方科目 IN ('国有资产处置收入','国有资产出租收入') OR 流水.摘要 LIKE '%国有资产收入%' OR 流水.支出账户 = 国有资产收入账户) && (流水.对方科目 LIKE '%人员经费%'
    OR 流水.对方科目 LIKE '%应付职工薪酬%' OR 流水.摘要 LIKE '%奖金%' OR 流水.摘要 LIKE '%工资%') && 流水.交易金额 > 0
  description: 检查人员经费支出的资金来源中是否直接包含国有资产处置或出租收入，只要存在一笔支出凭证的贷方为国有资产收入科目或摘要注明来源于相关收入，且借方为人员经费类科目，即判定为挪用。
  audit_item: 国有资产收入管理不合规
  suspicion: 国有资产收入挪用用于人员经费支出
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"行政单位出租、出借国有资产所形成的收入，以及处置国有资产取得的收入，应当按照政府非税收入管理规定，及时足额上缴国库，不得隐瞒、截留、占用、挪用和坐支。\"\n  },\n  {\n\
    \    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"\
    内容概述\""
- expression: (分析表.实际支出金额 > 分析表.预算金额 AND 分析表.调整标志 = '否') || (明细表.支出用途摘要 NOT REGEXP '车辆|燃油|维修|保险|过路' AND 明细表.金额 > 10000)
  description: 条件1：实际支出超出预算且无有效的预算调整审批记录；条件2：单笔金额超过1万元的公务用车费用支出，但用途摘要未包含车辆相关关键字，疑似挪用经费。两者满足其一即可识别为预算执行不严格。
  audit_item: 未按规定编制和执行公务用车购置和运行费预算
  suspicion: 公务用车购置及运行费预算执行不严格
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第十二号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第七十二条\",\n    \"内容概述\": \"各部门、各单位应当加强对预算支出的管理，严格执行预算，不得超预算、无预算安排支出；按规定程序进行预算调整的除外。\"\n  },\n  {\n    \"法规名称\": \"\
    党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"公务用车运行费用实行"
- expression: 摘要.费用明细摘要（如景点门票、旅游项目费用） CONTAINS ('门票'||'旅游'||'游览') &&摘要.金额 >0||对比表.每日公务活动及自由活动时间占比 <对比表.每日公务活动及自由活动时间占比 *0.5
    ||其他.邀请单位业务范围 NOT_CONTAINS 被审计单位主要职能
  description: 判定规则：1.报销明细中出现“门票”、“旅游”、“游览”等非常规公务费用，视为直接证据；2.实际行程中公务活动时间占比不足计划的50%，存在以公务为名行旅游之实的嫌疑；3.邀请单位业务范围与被审计单位职能完全不相关，为虚假公务邀请提供可能性。满足任一条件即触发疑点。
  audit_item: 违反出国团组管理相关规定
  suspicion: 违规组织公款出国（境）旅游
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"出国人员应当严格按照批准的事由、国家、城市、日程执行出访任务，不得擅自更改行程，不得以任何理由绕道旅行或以过境名义变相增加出访国家和时间。\"\n  },\n  {\n    \"\
    法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十五条\",\n    \"内容概述\""
- expression: 审批单.审批人及职务 != 审批权限层级规定.审批权限层级规定 || (审批单.审批意见 != '同意' && 审批单.出访事由) || (统计表.单位名称 存在跨部门/跨地区 && 未关联到对应专项审批文件)
  description: 判定规则：1.审批人职务级别低于单位制度规定的审批权限，构成越权审批；2.无“同意”等明确审批意见或缺少关键审批人签字，但团组已实际成行，为未经批准擅自出访；3.团组成员涉及跨地区跨部门，但在档案中无法找到相应的外事部门专项审批文件，为违规组织双跨团组。满足任一条件触发疑点。
  audit_item: 违反出国团组管理相关规定
  suspicion: 因公出国（境）审核审批不严格
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强因公出国（境）管理的若干规定\",\n    \"法规文号\": \"中办发〔2008〕9号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"严格履行因公出国（境）审批程序。各级外事、组织、财政等部门要按照各自职责，严格审批。严禁未经批准擅自组团，严禁一般性考察和重复考察。\"\n  },\n \
    \ {\n    \"法规名称\": \"因公出国人员审批管理规定\",\n    \"法规文号\": \"中办发〔2012〕5号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n\
    \    \"内容概述"
- expression: (对照表.实际入境日期 - 对照表.实际出境日期) > 审批单.批准出访天数 || ((对照表.实际入境日期 - 对照表.计划入境日期) > 0 && 对比表.审批意见 != '同意')
  description: 判定规则：1.根据出入境记录计算的实际在外停留天数，超过任务审批单批准的出访天数，即为超期滞留；2.实际入境日期晚于计划，且经查阅档案，未发现任何与行程变更相关的获批记录，说明擅自延期。两个条件任一满足即触发疑点。
  audit_item: 违反出国团组管理相关规定
  suspicion: 出国团组违规滞留或超期停留
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国（境）管理办法\",\n    \"法规文号\": \"中办发〔2012〕5号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"因公临时出国（境）团组应当在批准的在外停留天数内活动，期满按时回国。\"\n  },\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"\
    法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\": \"出国人员不得擅自增加出访国家或者地区，不得擅自延长在国外停留时间。"
- expression: 行程变更对比表.实际行程国家/城市列表 != 行程变更对比表.原审批行程国家/城市列表 && (行程变更对比表.审批意见 IS_NULL || 行程变更对比表.审批意见 != '同意') || (出国（境）费用报销明细表.交通票据（如机票）出发地/目的地
    NOT_IN 出国团组任务审批单.批准的出访国家/地区列表)
  description: 判定规则：1.将实际访问的城市/国家列表与审批列表比对，若存在差异，且无法提供经批准的变更申请记录，则为擅自更改行程或增加访问地点；2.财务凭证中出现批准行程之外的国家或城市的消费，作为物理证据证实行程变更。任一条件触发疑点。
  audit_item: 违反出国团组管理相关规定
  suspicion: 擅自变更出国行程或增加访问国家
  regulation: "[\n  {\n    \"法规名称\": \"因公临时出国经费管理办法\",\n    \"法规文号\": \"财行〔2013〕516号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"出国人员应当严格按照批准的事由、国家、城市、日程执行出访任务，不得擅自更改行程，不得以任何理由绕道旅行。\"\n  },\n  {\n    \"法规名称\": \"因公临时出国（境）管理办法\"\
    ,\n    \"法规文号\": \"中办发〔2012〕5号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"各派出单位要严格执行批准的出访"
- expression: 明细表.报销凭证摘要 CONTAINS '中介服务费' &&明细表.支付对象为旅行社||中介机构) &&其他.联系方式 无法验证 || (其他.邀请事由 !=审批单.拟访单位名称) &&对比表.实际行程 中无任何对应会议/洽谈记录
  description: 判定规则：1.存在向旅行社或中介机构支付服务费的记录，且该机构提供的邀请函经查证，其联系方式、单位信息虚假或无法核实；2.邀请函上的事由与出访团组主业的业务范围毫无关联，且在实际行程中无法找到任何与该邀请事由匹配的公务活动记录。两个条件必须同时满足：有中介服务费支出，且有伪劣邀请函或虚假日程的证据。
  audit_item: 违反出国团组管理相关规定
