name: audit/业务单据类/审批单
type: model
description: 从业务单据类类文档（审批单）中提取结构化元数据。涵盖字段如：专项审批文件编号、主办单位、乙方名称、会议名称、会议日期、借款对象名称、借款金额、公务活动日程安排。文档范围包括：三公经费支出审批单、人员经费支出审批单、价格审批单、会议审批单、公务接待审批单、冲减审批单、出国团组任务审批单、出差审批单、大额现金支付审批单、定价审批单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 人员
- 会议
- 凭证
- 合同
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 审批单
  member_count: 1
  member_details:
  - 三公经费支出审批单
  - 人员经费支出审批单
  - 价格审批单
  - 会议审批单
  - 公务接待审批单
  - 冲减审批单
  - 出国团组任务审批单
  - 出差审批单
  - 大额现金支付审批单
  - 定价审批单
  - 捐赠事项审批单
  - 接待审批单
  - 补贴发放审批单
  - 资产采购审批单
  - 资金拆借审批单
  - 资金支付审批单
  - 车辆购置审批单
  - 采购/销售合同的比价审批单
  - 采购方式审批单
  - 采购申请审批单
