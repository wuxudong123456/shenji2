name: audit/业务单据类/结算单
type: model
description: 从业务单据类类文档（结算单）中提取结构化元数据。涵盖字段如：佣金比例、单价、总金额、户号、用电量、结算方式、结算时段、结算电价。文档范围包括：代理业务佣金结算单、企业电费结算单原件、电费结算单原件等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 金额
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 结算单
  member_count: 1
  member_details:
  - 代理业务佣金结算单
  - 企业电费结算单原件
  - 电费结算单原件
output:
  fields:
  - name: 佣金比例
    type: number
    description: 提取 佣金比例 的数值（含单位，如万元、吨等）
  - name: 单价
    type: number
    description: 提取 单价 的数值（含单位，如万元、吨等）
  - name: 总金额
    type: number
    description: 提取 总金额 的数值（含单位，如万元、吨等）
  - name: 户号
    type: string
    description: 提取 户号 的文本值
  - name: 用电量
    type: string
    description: 提取 用电量 的文本值
  - name: 结算方式
    type: string
    description: 提取 结算方式 的文本值
  - name: 结算时段
    type: string
    description: 提取 结算时段 的文本值
  - name: 结算电价
    type: string
    description: 提取 结算电价 的文本值
  - name: 计费时段
    type: number
    description: 提取 计费时段 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 用户名称.执行电价 != 农业用电优惠电价标准.农业用电优惠电价标准 && 用户户号.电价类别代码 != 农业用电代码
  description: 锁定“应享未享”疑点。当人工核査表记录或企业实际结算单价未按政策执行农业优惠电价，且供电公司营销系统的客户档案中，该企业的电价类别未被标识为农业用电代码时，即可判定优惠政策未落实。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 涉农企业未享受用电优惠政策
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国电力法\",\n    \"法规文号\": \"中华人民共和国主席令第二十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十四条\",\n    \"内容概述\": \"禁止任何单位和个人在电费中加收其他费用；但是，法律、行政法规另有规定的，按照规定执行。地方集资办电在电费中加收费用的，由省、自治区、直辖市人民政府依照国务院有关规定制定办法。\"\
    \n  },\n  {\n    \"法规名称\": \"关于加快建立健全绿色低碳循环发展经济体系的指导意见\",\n    \"法规文号\": \"国发〔2021〕4号\",\n    \"效力级别\": \"制度文件\",\n "
- expression: (企业/农户税收优惠申报及审批材料.资质证明 && 实际享受优惠企业名单.享受主体名称 != 企业/农户税收优惠申报及审批材料.申报主体名称) || (核查表.实际结算电价 > 农业用电优惠电价标准.优惠幅度（减免税种、税率、电价标准）
    && 纳入农业用电名录的主体清单、执行电价标准、更新机制.纳入农业用电名录的主体清单 = 是)
  description: 对符合政策条件的涉农主体，若未出现在税收优惠享受清单中，或虽在名录中但实际结算电价高于规定的优惠电价，即判定为政策未落实。需重点排查应享未享、非农主体违规享受以及政策宣传不到位等情形。当累积未享受金额超过10万元或涉及户数超过总户数的20%，应列为重点核实对象。
  audit_item: 目标任务未完成、进展慢，支持政策未落实
  suspicion: 税收、用电支持政策未落实
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于有机肥产品免征增值税的通知\",\n    \"法规文号\": \"财税〔2008〕56号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第一条、第三条\",\n    \"内容概述\": \"对纳税人生产销售和批发、零售有机肥料、有机-无机复混肥料和生物有机肥免征增值税，纳税人应按规定申请备案，主管税务机关应落实优惠政策。\"\n \
    \ },\n  {\n    \"法规名称\": \"国家发展改革委关于调整销售电价分类结构有关问题的通知\",\n    \"法规文号\": \"发改价格〔2013〕973号\",\n    \"效力级别\": \"部门规章\",\n\
