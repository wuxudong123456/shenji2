name: audit/业务单据类/出库单
type: model
description: 从业务单据类类文档（出库单）中提取结构化元数据。涵盖字段如：出库日期、品名、客户名称、对应产品批号、对应销售合同编号、数量、物料名称、货物名称。文档范围包括：出库单、原材料出库单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 合同
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 出库单
  member_count: 1
  member_details:
  - 出库单
  - 原材料出库单
output:
  fields:
  - name: 出库日期
    type: date
    description: 提取 出库日期 的日期值，格式 YYYY-MM-DD
  - name: 品名
    type: string
    description: 提取 品名 的文本值
  - name: 客户名称
    type: string
    description: 提取 客户名称 的文本值
  - name: 对应产品批号
    type: string
    description: 提取 对应产品批号 的文本值
  - name: 对应销售合同编号
    type: string
    description: 提取 对应销售合同编号 的文本值
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 物料名称
    type: string
    description: 提取 物料名称 的文本值
  - name: 货物名称
    type: string
    description: 提取 货物名称 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (ABS(DATEDIFF('day', 对应存货品种.凭证日期, 出库单.出库日期)) > 30) || (对应存货品种.凭证日期 < 出库单.出库日期 && 明细表.期末发出商品数量异常增长) || (对应存货品种.凭证日期
    跨年 && 无合理在途说明)
  description: 结转日期与出库日期差异超过30天视为跨期，凭证日期早于出库日期表明提前结转，跨年结转且无合理在途物资说明为推迟结转。同时检查期末发出商品异常增加，可能暗示已发货未及时确认收入并结转成本。
  audit_item: 未按规定确认成本费用
  suspicion: 提前或推迟结转成本费用
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条、第五条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入，并同时或在对应期间结转相应的成本。\"\n  }\n]"
- expression: (明细表.发出商品数量 > 0 && 相应销售收入已确认超过 30天) || (明细表.库存商品期末数量/平均月销量 > 3 且 无合理积压说明)
  description: 已确认收入但发出商品长期未结转成本，或库存商品周转天数远超正常水平（>90天），均可能为少转成本导致存货虚高。
  audit_item: 未按规定确认成本费用
  suspicion: 未及时结转已售存货成本
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"企业应当在客户取得相关商品控制权时，确认收入并结转相应成本。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第1号——存货\",\n   \
    \ \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"企业销售存货，应当将已售存货的成本结转为当期损益。\"\
    \n  }\n]"
- expression: ((合同台账.供应商 股东/高管 集合 ∩ 合同台账.客户名称 股东/高管 集合)≠∅) && (合同台账.采购标的 == 合同台账.销售标的) && ( (合同台账.销售单价 - 合同台账.采购单价) / 合同台账.采购单价
    ≤ 0.02 ) && ( |合同台账.签订日期 - 合同台账.签订日期| ≤ 30天 )
  description: 判定条件：①采购供应商与销售客户的显名股东或高级管理人员存在交集（≥1人），构成实质关联；②同一标的物一进一出；③贸易毛利率≤2%，远低于正常商业利润，缺乏商业实质；④采购与销售合同签署时间间隔≤30天，呈现资金过账特征。满足全部条件即触发重大虚假贸易疑点，风险等级高。
  audit_item: 虚假贸易审计
  suspicion: 上下游关联方交易缺乏商业实质
  regulation: "[\n  {\n    \"法规名称\": \"关于规范中央企业贸易管理严禁各类虚假贸易的通知\",\n    \"法规文号\": \"国资发财评规〔2023〕74号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"不准参与特定利益关系企业间开展的无商业目的的贸易业务，严禁上下游为同一控制人或存在特定利益关系的空转贸易。\"\n  }\n]"
- expression: ( (合同台账.预付款比例 >= 0.8) && ( NOW() - 合同台账.约定交货日期 > 90天 ) && ( 入库单.对应采购合同编号 记录为空 ) ) || ( (合同台账.收款条件（赊销） == '赊销')
    && ( NOW() - 合同台账.约定交货日期 > 180天 ) && ( 明细账.金额 > 0 ) && ( 出库单.对应销售合同编号 记录为空 ) )
  description: 采购端：预付款比例≥80%，且超过约定交货期90天仍未收到货物，同时系统内无任何对应入库记录，表明资金已付出但实物流未发生，高度疑似融资性贸易。销售端：赊销方式下货物声称已交付超过180天，应收账款仍未收回，且无出库单流转记录，表明货权未真实转移，疑似空转贸易。任一条件满足即触发疑点，预付款情形风险等级高。
  audit_item: 虚假贸易审计
  suspicion: 大额预付款无货物交付或应收账款长期无回收
  regulation: "[\n  {\n    \"法规名称\": \"关于规范中央企业贸易管理严禁各类虚假贸易的通知\",\n    \"法规文号\": \"国资发财评规〔2023〕74号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条、第四条\",\n    \"内容概述\": \"严禁以贸易业务为名从事融资性贸易，严禁开展对交易标的没有控制权的空转贸易。\"\n  }\n]"
