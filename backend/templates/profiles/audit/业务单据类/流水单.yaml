name: audit/业务单据类/流水单
type: model
description: 从业务单据类类文档（流水单）中提取结构化元数据。涵盖字段如：交易日期、交易时间、交易金额、实际付款日期、实际收款日期、实际收款金额、对方账号、对方账户。文档范围包括：银行代发工资流水单、银行住房公积金专户流水单、银行流水单、零余额账户银行流水单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 付款
- 金额
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 流水单
  member_count: 1
  member_details:
  - 银行代发工资流水单
  - 银行住房公积金专户流水单
  - 银行流水单
  - 零余额账户银行流水单
output:
  fields:
  - name: 交易日期
    type: date
    description: 提取 交易日期 的日期值，格式 YYYY-MM-DD
  - name: 交易时间
    type: date
    description: 提取 交易时间 的日期值，格式 YYYY-MM-DD
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 实际付款日期
    type: date
    description: 提取 实际付款日期 的日期值，格式 YYYY-MM-DD
  - name: 实际收款日期
    type: date
    description: 提取 实际收款日期 的日期值，格式 YYYY-MM-DD
  - name: 实际收款金额
    type: number
    description: 提取 实际收款金额 的数值（含单位，如万元、吨等）
  - name: 对方账号
    type: string
    description: 提取 对方账号 的文本值
  - name: 对方账户
    type: string
    description: 提取 对方账户 的文本值
  - name: 对方账户名称
    type: string
    description: 提取 对方账户名称 的文本值
  - name: 摘要
    type: string
    description: 提取 摘要 的文本值
  - name: 支付日期
    type: date
    description: 提取 支付日期 的日期值，格式 YYYY-MM-DD
  - name: 收款人
    type: number
    description: 提取 收款人 的数值（含单位，如万元、吨等）
  - name: 收款日期
    type: date
    description: 提取 收款日期 的日期值，格式 YYYY-MM-DD
  - name: 收款账号
    type: number
    description: 提取 收款账号 的数值（含单位，如万元、吨等）
  - name: 收款金额
    type: number
    description: 提取 收款金额 的数值（含单位，如万元、吨等）
  - name: 日期
    type: date
    description: 提取 日期 的日期值，格式 YYYY-MM-DD
  - name: 日终余额
    type: number
    description: 提取 日终余额 的数值（含单位，如万元、吨等）
  - name: 补缴款项实际划转金额
    type: number
    description: 提取 补缴款项实际划转金额 的数值（含单位，如万元、吨等）
  - name: 资金转出日期
    type: date
    description: 提取 资金转出日期 的日期值，格式 YYYY-MM-DD
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
