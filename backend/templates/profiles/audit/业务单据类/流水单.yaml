    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: (支付凭证.摘要 LIKE '%拨付%' OR 支付凭证.摘要 LIKE '%转拨%' OR 支付凭证.经济分类科目 IN ('转移性支出','对附属单位补助支出')) AND 支付凭证.支付日期 BETWEEN '当年-11-01'
    AND '当年-12-31' AND (项目进度报告 IS NULL OR 项目进度报告.完工百分比 < 50%) AND (收款方银行流水.资金转出日期 IS NULL OR DATEDIFF(收款方银行流水.资金转出日期, 收款方银行流水.收款日期)
    > 30)
  description: 年末支付凭证中支付摘要出现拨付类字样或经济分类为转移性支出，收款项目对应的实际完工进度不足50%或缺乏验收材料，且资金在收款方账户停留超过30天未实际使用，构成以拨作支。若项目进度报告缺失，直接判定为高风险。
  audit_item: 预算执行率不真实
  suspicion: 以拨作支虚列预算支出
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十七条\",\n    \"内容概述\": \"各部门、各单位应当对预算支出情况开展绩效评价，不得虚列支出。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\"\
    : \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"国家机关及其工作人员违反规定以虚报、冒领等手段骗取财政资金，或者违反规定挪用、截"
- expression: (财政授权支付明细表.累计支付金额/合同总金额) > (项目进度报告.实际完工百分比 + 0.1) AND 项目进度报告.实际完工百分比 < 90%
  description: 当累计支付比例超过项目实际完工比例10个百分点以上，且项目尚未竣工（完工<90%）时，判定为超进度付款。偏差10%以内为预警，超过20%为严重违规。须同时排除合同约定有合理预付款条款的情况。
  audit_item: 预算执行率不真实
  suspicion: 未按项目进度提前支付合同款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第12号（2018年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第五十三条\",\n    \"内容概述\": \"各部门、各单位应当加强对预算支出的管理，严格按照预算规定的支出用途使用资金，按照项目进度和合同约定拨付资金。\"\n  },\n  {\n    \"法规名称\": \"基本建设财务规则\"\
    ,\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n    \"内容概述\": \"项目建设单位应当严格按照合同约定和工程价"
- expression: (零余额账户流水.对方账户 = 实有资金账户账号) AND (零余额账户流水.交易金额 > 0) AND (零余额账户流水.摘要 NOT IN ('归还垫款','归还原渠道资金','上缴财政款') OR 资金划拨审批记录.审批签字缺失)
  description: 当零余额账户发生向本单位或关联实有资金账户的转账，且摘要非合规的归还垫款或上缴财政等特定事项，或审批手续不完整，即构成违规划转。无审批记录直接判定为严重违规。
  audit_item: 预算执行率不真实
  suspicion: 违规从零余额账户向实有资金账户划转资金
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于进一步加强和规范国库集中支付管理的通知\",\n    \"法规文号\": \"财库〔2013〕105号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"预算单位零余额账户资金不得违反规定向本单位其他账户划转，不得用于向本单位实有资金账户归集资金。\"\n  },\n  {\n    \"法规名称\":\
    \ \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"违反规定开设财政专户或者将"
- expression: ABS(记账日期.记账日期 - 业务实质发生日期) > 会计分期截止容忍度
  description: 业务实质发生日期取自合同生效日、法院判决生效日、资产交割日等客观证据；会计分期截止容忍度通常为0天（即不可跨期），除非存在跨期调整的合理依据。若记账日期早于或晚于实质发生日期，即触发疑点。
  audit_item: 未按规定核算收益及营业外收支
  suspicion: 提前或推迟确认营业外收支
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"企业应当以权责发生制为基础进行会计确认、计量和报告。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\":\
    \ \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。\"\
    \n  }\n]"
- expression: 资产处置收益计算表.处置作价 - 资产处置收益计算表.资产账面净值 - 资产处置收益计算表.相关税费 < ABS(样本.贷方科目 - 样本.借方科目)
  description: 该逻辑检查是否将资产处置总价款直接计入营业收入或未冲减资产账面价值。正确的处理应为按净额（售价-账面价值-税费）确认资产处置损益，并分别冲销固定资产原值和累计折旧。若利润表项目的发生额大于计算出的净收益，则存在净额法误用为总额法的嫌疑。
  audit_item: 未按规定核算收益及营业外收支
  suspicion: 资产处置收益未按净额法确认
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第4号——固定资产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十三条\",\n    \"内容概述\": \"企业出售、转让、报废固定资产或发生固定资产毁损，应当将处置收入扣除账面价值和相关税费后的金额计入当期损益。\"\n  }\n]"
- expression: (报销凭证.发票号码 连续 AND 报销凭证.金额 > 100000) || (验证报告.验证结果 == '假发票' && 报销凭证.收款银行账号 NOT IN 正常供应商账号库) || (流水单.收款人 IN 名录
    && 流水单.金额 未出现在 其他 中 && 报销凭证.报销摘要 NULL 真实劳务内容)
  description: 连号大额发票（10万以上）高度可疑；查证为虚假发票且资金流入非正常供应账户，直接判定为套取；银行代发流水中有职工收款但未列入奖金发放清单且无合理业务摘要的，即为账外发放奖金。
  audit_item: 违规支付职工薪酬及股份
  suspicion: 虚列支出套取资金发放职工奖金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条、第二十六条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算；不得伪造、变造会计凭证、会计账簿及其他会计资料，不得提供虚假的财务会计报告。\"\n  },\n  {\n    \"\
    法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\"\
    : \"国家机关及"
- expression: SUM(清册.正常月缴存额) + SUM(补缴人员、补缴月份、补缴金额、补缴事由.补缴金额) > (政策文件.月缴存基数上限 × (政策文件.单位和职工缴存比例上限 + 政策文件.单位和职工缴存比例上限) × 12)
  description: 按职工以年度为单位汇总全部正常缴存金额与补缴金额，若合计总额超出政策规定的年度缴存上限（月基数上限×合计最高比例×12个月），即属于通过补缴突破上限。即使补缴事由合理，但合计超限亦属违规。
  audit_item: 违规多缴住房公积金
  suspicion: 通过补缴方式突破缴存上限多缴住房公积金
  regulation: "[\n  {\n    \"法规名称\": \"关于住房公积金管理若干具体问题的指导意见\",\n    \"法规文号\": \"建金管[2005]5号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条、第三条\",\n    \"内容概述\": \"住房公积金月缴存基数上限为当地社平工资3倍，缴存比例原则上不高于12%。补缴应基于历史真实工资，不得通过补缴变相突破月缴存额上限或年度上限。\"\n\
    \  },\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条\"\
    ,\n    \"内"
