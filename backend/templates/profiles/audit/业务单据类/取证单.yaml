name: audit/业务单据类/取证单
type: model
description: 从业务单据类类文档（取证单）中提取结构化元数据。涵盖字段如：取证问题编号、对应建议条目。文档范围包括：审计取证单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 取证单
  member_count: 1
  member_details:
  - 审计取证单
output:
  fields:
  - name: 取证问题编号
    type: string
    description: 提取 取证问题编号 的文本值
  - name: 对应建议条目
    type: string
    description: 提取 对应建议条目 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: COUNT(报告正文.问题段落序号) != COUNT(报告正文.建议段落序号) || (EXISTS(底稿.问题编号) && NOT EXISTS(底稿.对应建议条目))
  description: 报告正文中问题描述段落数量与建议段落数量不一致，或审计底稿中记录的问题没有匹配的审计建议，均判定为问题与建议不匹配。
  audit_item: 审计文书校验
  suspicion: 审计发现问题与审计建议不匹配
  regulation: "[\n  {\n    \"法规名称\": \"国家审计准则\",\n    \"法规文号\": \"审计署令第8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一百一十条\"\
    ,\n    \"内容概述\": \"审计报告应当针对审计发现的问题提出纠正意见和改进建议，做到事实清楚、定性准确、建议可行。\"\n  }\n]"
