name: audit/业务单据类/签证单
type: model
description: 从业务单据类类文档（签证单）中提取结构化元数据。涵盖字段如：GPS坐标、变更估价、变更内容、审批日期、工程量、建设单位签章、提出日期、施工单位及监理签章日期。文档范围包括：工程变更签证单、现场签证单、隐蔽工程验收签证单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 审批
- 工程
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 签证单
  member_count: 1
  member_details:
  - 工程变更签证单
  - 现场签证单
  - 隐蔽工程验收签证单
output:
  fields:
  - name: GPS坐标
    type: string
    description: 提取 GPS坐标 的文本值
  - name: 变更估价
    type: string
    description: 提取 变更估价 的文本值
  - name: 变更内容
    type: string
    description: 提取 变更内容 的文本值
  - name: 审批日期
    type: date
    description: 提取 审批日期 的日期值，格式 YYYY-MM-DD
  - name: 工程量
    type: string
    description: 提取 工程量 的文本值
  - name: 建设单位签章
    type: string
    description: 提取 建设单位签章 的文本值
  - name: 提出日期
    type: date
    description: 提取 提出日期 的日期值，格式 YYYY-MM-DD
  - name: 施工单位及监理签章日期
    type: date
    description: 提取 施工单位及监理签章日期 的日期值，格式 YYYY-MM-DD
  - name: 施工单位签章
    type: string
    description: 提取 施工单位签章 的文本值
  - name: 时间水印
    type: date
    description: 提取 时间水印 的日期值，格式 YYYY-MM-DD
  - name: 监理签章
    type: string
    description: 提取 监理签章 的文本值
  - name: 签证内容
    type: string
    description: 提取 签证内容 的文本值
  - name: 签证日期
    type: date
    description: 提取 签证日期 的日期值，格式 YYYY-MM-DD
  - name: 签证签字盖章完整性
    type: string
    description: 提取 签证签字盖章完整性 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: MIN(日志.变更实施旁站记录日期, 日志.变更实施旁站记录日期) < MAX(审批表.最终批准日期, 通知单.设计单位出图日期) || (申请单.变更提出日期 IS NULL && 签证单.签证日期 IS NOT
    NULL)
  description: 若实际施工日期早于最终审批日期或设计变更图纸发出日期，即存在未批先建行为；或仅有现场签证而无变更申请单，属于先干后报。当施工或监理记录的变更时间早于审批完成时间，触发疑点；风险等级：差异天数>15天为严重违规。
  audit_item: 工程变更审计评估
  suspicion: 工程变更未经审批擅自实施
  regulation: "[\n  {\n    \"法规名称\": \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建[2004]369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"工程设计变更确定后14天内，如承包人未提出变更工程价款报告，则发包人可根据所掌握的资料决定是否调整合同价款和调整的具体金额。重大工程变更涉及工程价款变更报告和确认的时限应当严格掌握。\"\
    \n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条"
- expression: (ABS(签证单.工程量 - 踏勘记录.尺寸) > 0) || (验收记录.验收部位 != 签证单.签证内容) || (日志.施工内容 != 签证单.签证内容 && 日志.旁站记录 IS NULL)
  description: 签证工程量与实际核查工程量存在正偏差即判定为虚假；隐蔽验收记录部位与签证部位不匹配，或施工日志无对应记录且监理未旁站，均表明签证内容虚假。若工程量虚增比例>15%，属于严重虚报冒领。
  audit_item: 工程变更审计评估
  suspicion: 虚假工程变更套取建设资金
  regulation: "[\n  {\n    \"法规名称\": \"建设项目审计处理暂行规定\",\n    \"法规文号\": \"审投发[1996]105号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"建设项目不突破设计概算，对超出设计概算的投资，审计中发现有高估冒算、虚假签证等行为的，应当予以核减，并按规定处理。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第九条\",\n    \"内容概述\": \"单位和个人有下列骗取财政资金"
- expression: (签证单.变更估价 < 签证单.审批日期) || (设计变更或签证发生金额 > 50万) && (其他.变更程序约定（先审批后施工条款）)
  description: 违反基建程序，属于先实施后审批。判定条件之一是签证单上记录的施工完成或隐蔽日期早于各级（监理、业主、财政）最终审批日期。对于超过50万元的大额变更，若档案中缺失事前技术、经济论证及审批文件，视为严重违规，该签证真实性及合理性存疑。
  audit_item: 某公共建筑合同履行审
  suspicion: 工程变更签证未经审批即施工
  regulation: "[\n  {\n    \"法规名称\": \"建设工程监理规范\",\n    \"法规文号\": \"GB/T 50319-2013\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"6.3.1\",\n    \"内容概述\": \"项目监理机构应按约定程序进行工程变更处理。在工程变更实施前，应审查工程变更的可行性和必要性。\"\n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n\
    \    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\",\n    \"内容概述\": \"政府投资项目投资原则上不得超过经核定的投资概算，确需增加投资的"
