name: audit/业务单据类/验收单
type: model
description: 从业务单据类类文档（验收单）中提取结构化元数据。涵盖字段如：受益部门、合同编号、复检结果、实际交货日期、实际到货日期、实际到货规格、实际进场数量、实际采购数量。文档范围包括：产品销售合同或验收单、入库验收单、学校食堂食材采购验收单、放流物种采购验收单、材料进场验收单、相关合同验收单、货物验收单、资产验收单、资源化利用项目验收单、采购物资验收单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 合同
- 票据
- 资产
- 采购
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 验收单
  member_count: 1
  member_details:
  - 产品销售合同或验收单
  - 入库验收单
  - 学校食堂食材采购验收单
  - 放流物种采购验收单
  - 材料进场验收单
  - 相关合同验收单
  - 货物验收单
  - 资产验收单
  - 资源化利用项目验收单
  - 采购物资验收单
  - 验收单
output:
  fields:
  - name: 受益部门
    type: string
    description: 提取 受益部门 的文本值
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 复检结果
    type: boolean
    description: 提取 复检结果 的布尔值（是/否）
  - name: 实际交货日期
    type: date
    description: 提取 实际交货日期 的日期值，格式 YYYY-MM-DD
  - name: 实际到货日期
    type: date
    description: 提取 实际到货日期 的日期值，格式 YYYY-MM-DD
  - name: 实际到货规格
    type: string
    description: 提取 实际到货规格 的文本值
  - name: 实际进场数量
    type: number
    description: 提取 实际进场数量 的数值（含单位，如万元、吨等）
  - name: 实际采购数量
    type: number
    description: 提取 实际采购数量 的数值（含单位，如万元、吨等）
  - name: 实际采购设备品牌型号
    type: string
    description: 提取 实际采购设备品牌型号 的文本值
  - name: 实际验收金额
    type: number
    description: 提取 实际验收金额 的数值（含单位，如万元、吨等）
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 服务-物资的用途
    type: string
    description: 提取 服务-物资的用途 的文本值
  - name: 服务内容
    type: string
    description: 提取 服务内容 的文本值
  - name: 材料规格型号
    type: string
    description: 提取 材料规格型号 的文本值
  - name: 检疫合格证明文件编号
    type: string
    description: 提取 检疫合格证明文件编号 的文本值
  - name: 检疫日期
    type: date
    description: 提取 检疫日期 的日期值，格式 YYYY-MM-DD
  - name: 物料名称
    type: string
    description: 提取 物料名称 的文本值
  - name: 设备采购发票金额
    type: number
    description: 提取 设备采购发票金额 的数值（含单位，如万元、吨等）
  - name: 资产状况
    type: string
    description: 提取 资产状况 的文本值
  - name: 采购单价
    type: number
    description: 提取 采购单价 的数值（含单位，如万元、吨等）
  - name: 采购日期
    type: date
    description: 提取 采购日期 的日期值，格式 YYYY-MM-DD
  - name: 采购物种名称
    type: string
    description: 提取 采购物种名称 的文本值
  - name: 风险报酬转移时点
    type: string
    description: 提取 风险报酬转移时点 的文本值
  - name: 验收人
    type: string
    description: 提取 验收人 的文本值
  - name: 验收数量
    type: number
    description: 提取 验收数量 的数值（含单位，如万元、吨等）
  - name: 验收日期
    type: date
    description: 提取 验收日期 的日期值，格式 YYYY-MM-DD
  - name: 验收结论
    type: string
    description: 提取 验收结论 的文本值
  - name: 验收资产名称
    type: string
    description: 提取 验收资产名称 的文本值
  - name: 验收金额
    type: number
    description: 提取 验收金额 的数值（含单位，如万元、吨等）
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: 申请资料.存量资产核查结论 != '已核查' || (闲置资产名称.数量 > 0 && 申请资料.数量 > 0 && 申请资料.闲置资产不可用说明缺失)
  description: 新增资产购置前必须核查本单位存量资产，若存在同类可调剂的闲置资产，且未提供合理的不可用说明或无调剂记录，即认定新增资产未考虑存量、造成闲置浪费。
  audit_item: 违反规定配置国有资产
  suspicion: 新增资产未考虑存量资产
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"各部门及其所属单位应当加强资产使用管理，对于长期闲置、低效运转或者超标准配置的资产，应当进行调剂。\"\n  }\n]"
- expression: (采购合同.合同金额 > 审批限额标准、审批层级、所需附件.审批限额标准 && 采购金额区间、对应审批人级别、审批记录.对应审批人级别 < 要求审批级别) || (COUNT(采购合同 BY 供应商, 同类设备, 时间差<90天)
    >= 2 && SUM(合同金额) >= 审批限额标准、审批层级、所需附件.审批限额标准 && 无合并审批记录)
  description: 单笔合同金额超过本级审批权限但未经上级审批；或通过化整为零方式将大额采购拆分为若干小额合同，每笔均未达审批上限，但累计金额超过阈值且无整体报批记录，均属程序违规。
  audit_item: 违反规定配置国有资产
  suspicion: 购置国有资产未按规定程序报批
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十三条\",\n    \"内容概述\": \"各部门及其所属单位购置规定限额以上的资产，应当经主管部门审核同意后报同级财政部门审批。国家另有规定的，从其规定。\"\n  }\n]"
- expression: 材料采购合同.采购单价 > 信息.同期市场均价 * 1.1 && 材料采购合同.签订日期 < 验收单.验收日期
  description: 当采购合同单价超出同期市场均价的110%时，视为价格异常；同时满足合同签订日期早于材料进场验收日期，排除时间错配，初步判定为虚高采购价格。
  audit_item: 工程项目成本异常调查
  suspicion: 材料采购单价异常偏高
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第五十一条\",\n    \"内容概述\": \"招标人应当自收到评标报告之日起3日内公示中标候选人，公示期不得少于3日。投标人或者其他利害关系人对评标结果有异议的，应当在中标候选人公示期间提出。\"\n  },\n\
    \  {\n    \"法规名称\": \"基本建设财务规则\",\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十一条\",\n   \
    \ \"内容概述\": "
- expression: 预付款项明细账.账龄 > 180天 && (货物验收单.实际交货日期 - 存货采购合同.交货期限) > 90天 && 供应商往来台账.供应商性质（是否关联方） = '关联方' && 存货采购合同.预付款比例 > 行业惯例5%
  description: 当预付账款挂账超过半年，且延期交货超过3个月，同时供应商为关联方且预付款比例明显高于同期同类交易平均水平时，存在通过预付形式变相拆借资金或利益输送的重大嫌疑。
  audit_item: 企业经营资产分析
  suspicion: 存货采购预付款安排异常涉嫌资金占用
  regulation: "[\n  {\n    \"法规名称\": \"关于规范上市公司与关联方资金往来及上市公司对外担保若干问题的通知\",\n    \"法规文号\": \"证监发〔2003〕56号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"上市公司不得以垫付工资、福利、保险、广告等期间费用，预付购货款等方式将资金直接或间接提供给控股股东及其他关联方使用。\"\n  },\n\
    \  {\n    \"法规名称\": \"企业财务通则\",\n    \"法规文号\": \"财政部令第41号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十三条\",\n    \"\
    内容概述\": "
- expression: 检测报告.检测结论 = "不合格" || 整改清单.质量问题描述 = "结构性安全缺陷未整改闭合"
  description: 工程实体质量不满足设计文件或国家强制性标准要求，特别是地基基础和主体结构存在安全问题。表达式直接引用第三方检测报告的不合格结论，或验收遗留问题中存在涉及结构安全的未整改项。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 工程质量低劣存在安全隐患
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第二十八条、第六十四条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得偷工减料；违反本条例规定，施工单位在施工中偷工减料的，使用不合格的建筑材料、建筑构配件和设备的，责令改正，处工程合同价款2%以上4%以下的罚款。\"\
    \n  }\n]"
- expression: EXISTS(捐赠协议) && (捐赠协议.价值 > 0) && (资产台账.资产名称 != 捐赠协议.资产名称 || 资产台账.入账金额 = 0) && (明细账.捐赠收入金额 = 0)
  description: 企业已接收捐赠资产但固定资产账上无对应资产记录，且未确认捐赠收入，表明资产被隐匿形成账外资产。
  audit_item: 未按规定核算资产
  suspicion: 接受捐赠资产不入账
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第76号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者事项为依据进行会计确认、计量和报告，如实反映符合确认和计量要求的各项会计要素，保证会计信息真实可靠、内容完整。\"\n  }\n]"
- expression: (验收单.验收日期 < 明细账.入库日期) && DATEDIFF(明细账.入库日期, 验收单.验收日期) > 5
  description: 验收单日期早于存货系统或明细账记载的入库日期，且间隔天数超过正常入库流程所需的5个工作日，属于不及时入账。跨月或跨年延迟尤需关注。
  audit_item: 未按规定核算资产
  suspicion: 存货验收后跨期延迟入账
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第76号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十九条\",\n    \"内容概述\": \"企业对于已经发生的交易或者事项，应当及时进行会计确认、计量和报告，不得提前或者延后。\"\n  }\n]"
- expression: (ABS(DATEDIFF('day', 对应存货品种.凭证日期, 出库单.出库日期)) > 30) || (对应存货品种.凭证日期 < 出库单.出库日期 && 明细表.期末发出商品数量异常增长) || (对应存货品种.凭证日期
    跨年 && 无合理在途说明)
  description: 结转日期与出库日期差异超过30天视为跨期，凭证日期早于出库日期表明提前结转，跨年结转且无合理在途物资说明为推迟结转。同时检查期末发出商品异常增加，可能暗示已发货未及时确认收入并结转成本。
  audit_item: 未按规定确认成本费用
  suspicion: 提前或推迟结转成本费用
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会〔2017〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条、第五条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入，并同时或在对应期间结转相应的成本。\"\n  }\n]"
- expression: ( (ABS(采购台账.单价 - 比价文件.同期同类物资市场均价)/比价文件.同期同类物资市场均价 > 0.10) || (验收单.验收结论 = '合格' && 检测报告.检测指标结果 = '否') || (验收单.实际到货规格
    != 采购合同.规格型号) )
  description: 第一个条件判断采购单价较同期同类市场均价溢价超过10%；第二个条件识别验收环节舞弊，即质量检测不合格但验收单仍签署合格；第三个条件判断实际到货规格与合同约定不符，属于以次充好。任一条件成立即产生疑点。
  audit_item: 违规开展重大物资（服务）采购
  suspicion: 采购物资价格虚高且质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产法\",\n    \"法规文号\": \"主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十九条\"\
    ,\n    \"内容概述\": \"国家出资企业应当建立健全内部监督管理和风险控制制度，防止国有资产损失。\"\n  },\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\"\
    : \"中纪发〔2004〕25号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"第六条第（二）款\",\n    \"内容概述\": \"不得利用职权进行关联交易，以明显不合理的价格购买商品或者服务。\"\
    \n  },"
- expression: （付款凭证.付款金额累计 > 0 && 入库验收单 IS NULL）&& (当前日期 - 采购合同台账.约定交货日期) > 30 天
  description: 以合同为单位，统计付款总金额大于零，但未匹配到任何入库验收单，且当前日期超过合同约定交货日期30天以上，即视为已付款未收货。30天为常规容忍期，可结合行业与具体物资调货周期调整。
  audit_item: 销售与采购合同审计
  suspicion: 已付款但长期未收到采购货物
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
