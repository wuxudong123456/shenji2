name: audit/业务单据类/报销单
type: model
description: 从业务单据类类文档（报销单）中提取结构化元数据。涵盖字段如：会议名称、出差人姓名、地点、报销日期、报销金额、时间、职务。文档范围包括：会议费报销单、差旅费报销单等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 业务单据类
- 审计
- 会议
- 差旅
- 金额
- 元数据提取
template_class:
  category: 业务单据类
  member_types:
  - 报销单
  member_count: 1
  member_details:
  - 会议费报销单
  - 差旅费报销单
output:
  fields:
  - name: 会议名称
    type: string
    description: 提取 会议名称 的文本值
  - name: 出差人姓名
    type: string
    description: 提取 出差人姓名 的文本值
  - name: 地点
    type: string
    description: 提取 地点 的文本值
  - name: 报销日期
    type: date
    description: 提取 报销日期 的日期值，格式 YYYY-MM-DD
  - name: 报销金额
    type: number
    description: 提取 报销金额 的数值（含单位，如万元、吨等）
  - name: 时间
    type: date
    description: 提取 时间 的日期值，格式 YYYY-MM-DD
  - name: 职务
    type: string
    description: 提取 职务 的文本值
  - name: 票据类型
    type: string
    description: 票据类型（发票/收据/行程单/凭证等）
    required: false
  - name: 票据编号
    type: string
    description: 票据唯一编号
    required: false
  - name: 开具日期
    type: date
    description: 票据开具日期，格式 YYYY-MM-DD
    required: false
  - name: 开具单位
    type: string
    description: 票据开具单位全称
    required: false
  - name: 接收单位
    type: string
    description: 票据接收单位/购买方全称
    required: false
  - name: 金额合计
    type: number
    description: 票据金额合计（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种（人民币/美元等），默认人民币
    required: false
  - name: 经办人
    type: string
    description: 经办人/经手人姓名
    required: false
  - name: 摘要
    type: string
    description: 业务摘要/事项说明
    required: false
  - name: 单据类型
    type: string
    description: 单据类型
    required: false
  - name: 单据编号
    type: string
    description: 单据唯一编号
    required: false
  - name: 审批人
    type: string
    description: 审批人姓名
    required: false
  - name: 业务内容
    type: string
    description: 业务内容描述
    required: false
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
violations:
- expression: ((DAYOFWEEK(接待公函.接待日期) IN (6,7) || 接待公函.接待日期 IN (法定节假日列表)) && 住宿费发票.地址 DISTANCE 被接待人信息.家庭住址 < 100km) || 接待公函.邀请单位
    IS NOT EXIST
  description: 接待发生在周末或节假日，且住宿地点距被接待人家庭地址不足100公里，或无法查到发函单位真实存在，高度怀疑借公务之名搭车报销个人探亲旅游费用。
  audit_item: 公务接待管理不符合规定
  suspicion: 将个人休假探亲费用纳入公务接待报销
  regulation: "[\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条\",\n    \"内容概述\": \"接待单位应当严格控制国内公务接待范围，不得用公款报销或者支付应由个人负担的费用。\"\n  }\n]"
- expression: 缺失(会议通知) || 缺失(参会人员签到表) || 缺失(费用原始明细单据) || 缺失(发票) || (参会人员签到表.签到人数 != 发票.金额 / 人均定额 AND ABS(偏差) > 10%)
  description: 每笔会议费报销必须附有完整的支撑材料。若缺少会议通知、签到表、费用明细、发票中的任一项，直接判为违规。此外，若签到人数与费用结算人数逻辑不匹配（如按人头计算的费用），偏差超过10%，则可能存在虚增人数。
  audit_item: 会议费审计
  suspicion: 会议费报销凭证关键附件缺失
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"会议费报销时应当提供会议审批文件、会议通知及实际参会人员签到表、定点会议场所等会议服务单位提供的费用原始明细单据、电子结算单等凭证。\"\n  }\n]"
