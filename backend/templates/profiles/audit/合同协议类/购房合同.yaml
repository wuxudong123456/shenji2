name: audit/合同协议类/购房合同
type: model
description: 从合同协议类类文档（购房合同）中提取结构化元数据。涵盖字段如：借款人姓名、合同编号、备案价格、购房地址。文档范围包括：借款人购房合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 购房合同
  member_count: 1
  member_details:
  - 借款人购房合同
output:
  fields:
  - name: 借款人姓名
    type: number
    description: 提取 借款人姓名 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 备案价格
    type: number
    description: 提取 备案价格 的数值（含单位，如万元、吨等）
  - name: 购房地址
    type: string
    description: 提取 购房地址 的文本值
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (批准贷款项目清单.批准贷款项目清单 NOT CONTAIN 明细表.收款单位) || (明细表.收款单位 NOT LIKE '%保障房建设%' && 明细表.用途 IN ('绿化工程','市政设施','股权投资'))
    || (购房合同.借款人姓名 重复次数 > 3 && 购房合同.备案价格 > 同地段市场均价 * 1.3) || (记录表.还款来源账户 NOT IN (住房公积金专户,项目销售收入账户))
  description: 判定规则：1)资金使用未对应审批清单内的项目，直接违规；2)支出收款方非保障房建设相关单位，且用途为绿化、市政等非住房项目；3)多名借款人笔迹相似、备案价畸高（高出市场价30%以上），疑似虚假购房套取；4)还款来源非项目自身收入或公积金专户，可能挪用贷款偿还其他债务。满足任一条件即触发疑点。
  audit_item: 挪用或违规使用保障性安居工程银行贷款或住房公积金项目贷款
  suspicion: 住房公积金项目贷款挪作他用
  regulation: "[\n  {\n    \"法规名称\": \"住房公积金管理条例\",\n    \"法规文号\": \"国务院令第350号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第二十四条、第二十六条、第二十九条\",\n    \"内容概述\": \"住房公积金贷款应当用于购买、建造、翻建、大修自住住房，增值收益可用于廉租住房建设补充资金；项目贷款必须专项用于经批准的保障性住房建设项目。\"\
    \n  },\n  {\n    \"法规名称\": \"关于印发《利用住房公积金发放保障性住房建设项目贷款管理办法》的通知\",\n    \"法规文号\": \"建金〔2010〕156号\",\n    \"效力级别\": \""
