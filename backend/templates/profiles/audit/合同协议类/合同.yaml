name: audit/合同协议类/合同
type: model
description: 从合同协议类类文档（合同）中提取结构化元数据。涵盖字段如：付款条件、价款、供应商名称、保证金条款、各自承担风险比例、合同乙方、合同内容关键词、合同标题。文档范围包括：与中小企业签订的合同、合同、合同正本、风险共担机制建设相关协议或合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 人员
- 付款
- 合同
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 合同
  member_count: 1
  member_details:
  - 与中小企业签订的合同
  - 合同
  - 合同正本
  - 风险共担机制建设相关协议或合同
output:
  fields:
  - name: 付款条件
    type: number
    description: 提取 付款条件 的数值（含单位，如万元、吨等）
  - name: 价款
    type: number
    description: 提取 价款 的数值（含单位，如万元、吨等）
  - name: 供应商名称
    type: string
    description: 提取 供应商名称 的文本值
  - name: 保证金条款
    type: number
    description: 提取 保证金条款 的数值（含单位，如万元、吨等）
  - name: 各自承担风险比例
    type: number
    description: 提取 各自承担风险比例 的数值（含单位，如万元、吨等）
  - name: 合同乙方
    type: string
    description: 提取 合同乙方 的文本值
  - name: 合同内容关键词
    type: string
    description: 提取 合同内容关键词 的文本值
  - name: 合同标题
    type: string
    description: 提取 合同标题 的文本值
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 履行期限
    type: string
    description: 提取 履行期限 的文本值
  - name: 当事人名称
    type: string
    description: 提取 当事人名称 的文本值
  - name: 承诺函
    type: string
    description: 提取 承诺函 的文本值
  - name: 拟投入人员名单
    type: string
    description: 提取 拟投入人员名单 的文本值
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 标的
    type: string
    description: 提取 标的 的文本值
  - name: 签约机构
    type: string
    description: 提取 签约机构 的文本值
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 约定付款日期
    type: date
    description: 提取 约定付款日期 的日期值，格式 YYYY-MM-DD
  - name: 约定履约开始日期
    type: date
    description: 提取 约定履约开始日期 的日期值，格式 YYYY-MM-DD
  - name: 赔付触发条件
    type: string
    description: 提取 赔付触发条件 的文本值
  - name: 违约责任条款
    type: number
    description: 提取 违约责任条款 的数值（含单位，如万元、吨等）
  - name: 退还条件
    type: string
    description: 提取 退还条件 的文本值
  - name: 逾期利息条款
    type: number
    description: 提取 逾期利息条款 的数值（含单位，如万元、吨等）
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (流水.交易金额 > 100000 && (流水.收款方 IN (个人账户, 疑似关联企业) || 流水.摘要 NOT LIKE '%上缴%' )) || (明细表.处置收入 + 出借台账.实收租金 - 流水.收款账户
    > 0.05 * (明细表.处置收入 + 出借台账.实收租金) ) || (合同.合同乙方 != 流水.付款方 && 流水.收入金额)
  description: 识别隐藏、截留、挪用行为的特征：大额资金（>10万元）流入个人或关联企业账户；实际收入台账金额与银行账户入账总额差异超过5%；合同签订方与银行回款方不一致且资金未进入单位正规账户。任一条件触发即列为疑点。
  audit_item: 国有资产收入管理不合规
  suspicion: 隐瞒截留挪用国有资产收入行为
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条\",\n    \"内容概述\": \"国有资产收入应当按照政府非税收入管理规定及时足额上缴国库，严禁截留、挪用。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n  \
    \  \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条、第六条\",\n    \"内容概述\": \"对隐瞒、截留、挪用应当上缴的财政收入等行为，责令改正，追回资金"
- expression: (合同台账.金额 IS NULL) || (合同台账.签订日期 IS NULL) || (合同.标的 IS NULL) || (合同.数量 IS NULL) || (合同.价款 IS NULL) || (合同.履行期限
    IS NULL)
  description: 判定合同台账中金额、签订日期为空，或合同正本中标的、数量、价款、履行期限等核心条款缺失，任何一项为空即触发疑点。
  audit_item: 合同要素提取
  suspicion: 合同关键条款要素缺失
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国民法典\",\n    \"法规文号\": \"主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四百七十条\",\n    \"内容概述\": \"合同的内容由当事人约定，一般包括当事人的姓名或者名称和住所、标的、数量、质量、价款或者报酬、履行期限、地点和方式、违约责任和解决争议的方法。\"\n  }\n]"
- expression: (合同台账.合同类型='租赁' && (合同.合同标题 LIKE '%采购%' || 合同.合同内容关键词 LIKE '%购买%')) || (合同台账.合同类型='采购' && (合同.合同标题 LIKE '%施工%'
    || 合同.合同内容关键词 LIKE '%工程%')) || (合同台账.合同类型='借贷' && 合同.合同内容关键词 NOT LIKE '%借款%')
  description: 通过关键词匹配判定合同中约定的实质法律关系与台账登记类型不符，如将实质为采购的合同登记为租赁，将工程合同登记为采购，将非借贷合同登记为借贷等，触发疑点。
  audit_item: 合同要素提取
  suspicion: 合同类型分类错误
  regulation: "[\n  {\n    \"法规名称\": \"行政事业单位内部控制规范（试行）\",\n    \"法规文号\": \"财会〔2012〕21号\",\n    \"效力级别\": \"制度文件\",\n    \"\
    条款号\": \"第四十七条\",\n    \"内容概述\": \"单位应当建立健全合同管理制度，明确合同归口管理部门，对合同实施统一管理。\"\n  }\n]"
- expression: (合同.签订日期 > 合同.约定履约开始日期) || (合同.签订日期 > 合同.约定履约开始日期) || (首次付款凭证.首次付款日期 < 合同.签订日期)
  description: 合同签订日期晚于约定的或实际的履约开始日期，或者首次付款发生在合同签订之前，表明存在先实施后签合同的情况。任一条件成立即触发疑点。
  audit_item: 合同要素提取
  suspicion: 合同签订时间晚于履约开始日期
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。\"\n  },\n  {\n    \"法规名称\": \"政府投资条例\",\n  \
    \  \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条\",\n    \"内容概述\": \"项目单位应当严格执行招标投标法律法规等有关规定，不得将依法应当招标的"
- expression: ((合同.保证金条款 / 合同.合同金额) > 0.1) && (合同.保证金条款 > 0)
  description: 若合同约定或实际收取的履约保证金金额与合同金额的比例超过10%（0.1），且招标文件中无更高法定上限依据，则判定违规。保证金金额大于0时触发计算。
  audit_item: 合同要素提取
  suspicion: 履约保证金比例超出法定上限
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第五十八条\",\n    \"内容概述\": \"招标文件要求中标人提交履约保证金的，中标人应当按照招标文件的要求提交，但履约保证金不得超过中标合同金额的10%。\"\n  }\n]"
- expression: (签约机构、各自承担风险比例、赔付触发条件 缺失) OR (对照表.协议约定比例 != 政策规定比例) OR (ABS(情况表.实际执行比例 - 政策文件.规定的风险分担比例要求) > 5%)
  description: 政策规定通常要求政府、银行、担保机构按约定比例（如70%:20%:10%）共同承担贷款风险。如果未签订任何风险共担协议，或协议约定的分担比例与政策文件要求明显不符，或实际代偿执行时各机构承担比例与协议约定偏差率超过5%，均视为违规。经济下行期若因未调整比例导致银行承担过高风险，同样构成执行不到位。
  audit_item: 创业担保贷款政策执行不到位
  suspicion: 未按规定建立或执行创业担保贷款风险共担机制
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加大创业担保贷款贴息力度全力支持重点群体创业就业的通知\",\n    \"法规文号\": \"财金〔2020〕21号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"优化风险分担机制，担保基金、省级再担保机构、经办银行原则上按约定比例分担风险，经办银行承担比例不低于20%。\"\n  },\n \
    \ {\n    \"法规名称\": \"关于印发《普惠金融发展专项资金管理办法》的通知\",\n    \"法规文号\": \"财金〔2019〕96号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条\""
