name: audit/合同协议类/劳动合同
type: model
description: 从合同协议类类文档（劳动合同）中提取结构化元数据。涵盖字段如：农民工姓名、工种、工资标准、约定上岗时间、计薪方式。文档范围包括：劳动合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 薪酬
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 劳动合同
  member_count: 1
  member_details:
  - 劳动合同
output:
  fields:
  - name: 农民工姓名
    type: string
    description: 提取 农民工姓名 的文本值
  - name: 工种
    type: string
    description: 提取 工种 的文本值
  - name: 工资标准
    type: string
    description: 提取 工资标准 的文本值
  - name: 约定上岗时间
    type: date
    description: 提取 约定上岗时间 的日期值，格式 YYYY-MM-DD
  - name: 计薪方式
    type: string
    description: 提取 计薪方式 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (应发工资、实发工资、欠薪月份、欠薪金额.应发工资 - 应发工资、实发工资、欠薪月份、欠薪金额.实发工资) > 0 AND 应发工资、实发工资、欠薪月份、欠薪金额.欠薪月份 >= 1 OR 其他.专户资金余额 < SUM(应发工资、实发工资、欠薪月份、欠薪金额.应发工资
    - 应发工资、实发工资、欠薪月份、欠薪金额.实发工资)
  description: 将劳动合同约定或计薪周期应发工资金额与实际银行流水发放金额进行比对，差额大于零且拖欠超过1个月即触发违规；若专用账户余额不足以覆盖所有拖欠工资总和，说明资金被挪用或未足额缴存，属严重违规。
  audit_item: 违规收费-拖欠工程款和农民工工资
  suspicion: 施工企业未按规定足额支付农民工工资
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条、第二十八条、第三十条\",\n    \"内容概述\": \"施工总承包单位应当开设农民工工资专用账户，专项用于支付农民工工资；施工总承包单位或分包单位应当与农民工签订劳动合同并进行实名制管理；分包单位拖欠农民工工资的，由施工总承包单位先行清偿。\"\
    \n  }\n]"
- expression: (从统计表.安置介绍信开出日期次月起至上岗前，生活费发放记录为空) || (发放表.生活费金额 < 编制表.同等条件人员平均工资 × 80%)
  description: 根据《退役士兵安置条例》，非因退役士兵本人原因未上岗的，接收单位应从安置介绍信开出当月起，按不低于本单位同等条件人员平均工资80%的标准逐月发放生活费。若未发放或发放标准低于80%，构成违规。
  audit_item: 未按规定落实退役士兵安置政策
  suspicion: 未向未安排上岗退役士兵发放生活费或发放标准不足
  regulation: "[\n  {\n    \"法规名称\": \"退役士兵安置条例\",\n    \"法规文号\": \"国务院、中央军委令第608号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第三十七条\",\n    \"内容概述\": \"非因退役士兵本人原因，接收单位未按照规定安排上岗的，应当从安置部门开出介绍信的当月起，按照不低于本单位同等条件人员平均工资80%的标准，逐月发给生活费直至上岗为止。\"\n \
    \ }\n]"
