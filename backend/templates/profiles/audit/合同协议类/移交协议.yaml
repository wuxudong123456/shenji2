name: audit/合同协议类/移交协议
type: model
description: 从合同协议类类文档（移交协议）中提取结构化元数据。涵盖字段如：分离移交范围、接收单位名称、接收单位签章、移交协议签署日期、移交方和接收方盖章、移交时间节点、费用分摊条款、资产明细列表。文档范围包括：三供一业分离移交协议、产权移交协议、公路工程移交协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 协议
- 明细
- 资产
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 移交协议
  member_count: 1
  member_details:
  - 三供一业分离移交协议
  - 产权移交协议
  - 公路工程移交协议
output:
  fields:
  - name: 分离移交范围
    type: string
    description: 提取 分离移交范围 的文本值
  - name: 接收单位名称
    type: string
    description: 提取 接收单位名称 的文本值
  - name: 接收单位签章
    type: string
    description: 提取 接收单位签章 的文本值
  - name: 移交协议签署日期
    type: date
    description: 提取 移交协议签署日期 的日期值，格式 YYYY-MM-DD
  - name: 移交方和接收方盖章
    type: string
    description: 提取 移交方和接收方盖章 的文本值
  - name: 移交时间节点
    type: date
    description: 提取 移交时间节点 的日期值，格式 YYYY-MM-DD
  - name: 费用分摊条款
    type: number
    description: 提取 费用分摊条款 的数值（含单位，如万元、吨等）
  - name: 资产明细列表
    type: string
    description: 提取 资产明细列表 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: 经费支出摘要.经费支出摘要 包含 '供暖'或'供水'或'供电'或'物业' && 经费支出摘要.收款单位 != 移交接收方 && ABS(福利费科目明细.摘要) > 0
  description: 分离移交后，企业不应再承担本应由接收方负责的运行费用。若改革经费使用台账中存在支付给非接收方的供暖、供水等费用，或应付职工薪酬-福利费中仍列支家属区相关补贴，表明企业违规承担移交后费用。
  audit_item: 国有经济布局优化和结构调整方面存在的问题
  suspicion: 三供一业分离移交后企业违规承担费用
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅转发国务院国资委、财政部关于国有企业职工家属区“三供一业”分离移交工作指导意见的通知\",\n    \"法规文号\": \"国办发〔2016〕45号\"\
    ,\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"分离移交工作完成后，国有企业不再以任何方式为职工家属区“三供一业”承担相关费用，不得在工资福利外对职工家属区“三供一业”进行补贴。\"\
    \n  }\n]"
