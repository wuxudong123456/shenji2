name: audit/合同协议类/运维合同
type: model
description: 从合同协议类类文档（运维合同）中提取结构化元数据。涵盖字段如：质保期限、运维移交条款、运维费用预算及承担主体。文档范围包括：建设与运维合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 预算
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 运维合同
  member_count: 1
  member_details:
  - 建设与运维合同
output:
  fields:
  - name: 质保期限
    type: string
    description: 提取 质保期限 的文本值
  - name: 运维移交条款
    type: number
    description: 提取 运维移交条款 的数值（含单位，如万元、吨等）
  - name: 运维费用预算及承担主体
    type: number
    description: 提取 运维费用预算及承担主体 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (其他.竣工日期至维护台账.运维起始日期的间隔 > 60天) OR (维护台账.首次投运记录后90天内累计故障停机时间/总运行时间 > 0.3) OR (运维移交条款.运维费用预算及承担主体 / 项目总投资 < 0.03
    AND 项目总投资 > 500万元)
  description: 工程竣工后60天以上未移交运维，或投运初期频繁故障且维修响应滞后，或运维预算占总投资的比重低于3%且投资额较大，说明建设阶段未同步安排运行维护保障，存在脱节风险。
  audit_item: 污水治理项目建设、运营、管护不到位
  suspicion: 污水处理厂站建设与运维脱节导致闲置或停运
  regulation: "[\n  {\n    \"法规名称\": \"城镇排水与污水处理条例\",\n    \"法规文号\": \"国务院令第641号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"城镇排水与污水处理设施竣工验收后，建设单位应当及时向城镇排水主管部门移交完整的竣工资料，并明确维修养护单位，确保建成后正常运行。\"\n  }\n]"
