name: audit/合同协议类/原始合同
type: model
description: 从合同协议类类文档（原始合同）中提取结构化元数据。涵盖字段如：标的、签订方、金额。文档范围包括：原始合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 原始合同
  member_count: 1
  member_details:
  - 原始合同
output:
  fields:
  - name: 标的
    type: string
    description: 提取 标的 的文本值
  - name: 签订方
    type: string
    description: 提取 签订方 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (财务凭证.附件完整性 == FALSE OR 发票.货物或应税劳务名称 == '虚开') OR (信息.参保人数 == 0 AND 信息.实缴资本 < 10万) OR (行对账单.收款方 != 原始合同.签订方 AND
    无合法转包协议) OR (行对账单.资金流水)
  description: 构建四条独立触发条件：附件缺失或虚假发票；供应商为空壳公司（社保人数0且注册资本较低）；资金收款方与合同签订方不一致且无转包手续；资金闭环回流。任一条件成立即属套取资金疑点，需全面核查。
  audit_item: 挤占挪用套取财政资金
  suspicion: 虚列支出套取财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第二十一号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第九条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计账簿，编制财务会计报告。任何单位不得以虚假的经济业务事项或者资料进行会计核算。\"\n  },\n  {\n   \
    \ \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\",\n    \"内容概述\"\
    : \"国家机关及"
