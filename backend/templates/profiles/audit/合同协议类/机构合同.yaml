name: audit/合同协议类/机构合同
type: model
description: 从合同协议类类文档（机构合同）中提取结构化元数据。涵盖字段如：手续费率、服务机构性质、资质证明。文档范围包括：代发机构合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 机构合同
  member_count: 1
  member_details:
  - 代发机构合同
output:
  fields:
  - name: 手续费率
    type: number
    description: 提取 手续费率 的数值（含单位，如万元、吨等）
  - name: 服务机构性质
    type: string
    description: 提取 服务机构性质 的文本值
  - name: 资质证明
    type: string
    description: 提取 资质证明 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (服务机构性质.服务机构性质 != '金融机构' AND 服务机构性质.手续费率 > 行业标准费率*1.2) OR (规定文件.公开招标要求='公开招标' AND 服务机构性质.采购方式 != '公开招标')
  description: 代发机构必须为具备资质的金融机构，手续费率明显高于同类银行交易费率20%以上或未通过公开招标选择，均为违规。行业标准费率可参考当地银行代发平均费率。
  audit_item: 社会保障待遇计算、发放错误
  suspicion: 指定非金融机构代发养老金手续费超支
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十六条、第二十八条\",\n    \"内容概述\": \"采购应采用公开招标等法定方式，选择合格供应商。\"\n  }\n]"
