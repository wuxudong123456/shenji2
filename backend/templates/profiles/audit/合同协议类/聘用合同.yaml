name: audit/合同协议类/聘用合同
type: model
description: 从合同协议类类文档（聘用合同）中提取结构化元数据。涵盖字段如：人员姓名、保洁员姓名、劳动合同期限、合同期限、合同签订岗位、岗位名称、岗位职责描述、是否为专职条款。文档范围包括：专职文化管理人员聘用合同、文化管理人员聘用合同、村庄保洁员聘用合同、管理岗位说明书或聘用合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 人员
- 合同
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 聘用合同
  member_count: 1
  member_details:
  - 专职文化管理人员聘用合同
  - 文化管理人员聘用合同
  - 村庄保洁员聘用合同
  - 管理岗位说明书或聘用合同
output:
  fields:
  - name: 人员姓名
    type: string
    description: 提取 人员姓名 的文本值
  - name: 保洁员姓名
    type: string
    description: 提取 保洁员姓名 的文本值
  - name: 劳动合同期限
    type: string
    description: 提取 劳动合同期限 的文本值
  - name: 合同期限
    type: string
    description: 提取 合同期限 的文本值
  - name: 合同签订岗位
    type: string
    description: 提取 合同签订岗位 的文本值
  - name: 岗位名称
    type: string
    description: 提取 岗位名称 的文本值
  - name: 岗位职责描述
    type: string
    description: 提取 岗位职责描述 的文本值
  - name: 是否为专职条款
    type: number
    description: 提取 是否为专职条款 的数值（含单位，如万元、吨等）
  - name: 用工性质
    type: string
    description: 提取 用工性质 的文本值
  - name: 负责村庄
    type: string
    description: 提取 负责村庄 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: 职责分工文件缺失 || (职责划分明确度 == "否") || (维护记录.维护单位/责任人签字 与 规定责任人不一致占比 > 20%)
  description: 若无法提供正式职责分工文件，或文件中未清晰界定政府、市场、用水协会各方管护责任边界，或实际维护记录签字人与文件规定责任人比对不一致比例超过20%，则判定为违规。
  audit_item: 大中型灌区运行管护和取水用水不符合相关规定
  suspicion: 灌区管护责任主体未明确划分
  regulation: "[\n  {\n    \"法规名称\": \"农田水利条例\",\n    \"法规文号\": \"国务院令第669号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十二条\"\
    ,\n    \"内容概述\": \"政府应当明确农田水利工程运行维护主体，落实管护责任。\"\n  }\n]"
- expression: 情况表.在岗姓名 NOT IN 合同签订岗位.人员姓名 OR 合同签订岗位.是否为专职条款 != '专职文化管理'
  description: 检查考勤在岗的管理人员姓名是否与专职聘用合同上的人员姓名一致。同时检查聘用合同中明确的岗位职责是否为‘专职’从事文化管理，若有村干部兼职或合同岗位为其他职务，则判定为未配备专职人员。
  audit_item: 文化站（中心）等建设运营管护不符合相关规定
  suspicion: 未按要求配备专职文化管理人员
  regulation: "[\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\",\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第十三条\",\n    \"内容概述\": \"文化站应当配备专职人员进行管理。文化站站长应当具有较高的政治素质和业务水平。\"\n  }\n]"
- expression: 培训内容.年度累计培训学时_GROUP_BY_NAME < 72
  description: 以专职管理人员姓名为分组依据，汇总其在培训考核记录中的年度总培训学时，总学时低于72小时（即行业通用年度培训标准）的，判定为培训不足。
  audit_item: 文化站（中心）等建设运营管护不符合相关规定
  suspicion: 专职文化管理人员培训学时不足
  regulation: "[\n  {\n    \"法规名称\": \"关于加快构建现代公共文化服务体系的意见\",\n    \"法规文号\": \"中办发〔2015〕2号\",\n    \"效力级别\": \"制度文件\",\n \
    \   \"条款号\": \"第十五条\",\n    \"内容概述\": \"完善基层公共文化服务人才培训制度，加强基层文化骨干培训，提升服务能力。\"\n  }\n]"
- expression: (岗位名称、用工性质（专职/兼职）、劳动合同期限.用工性质（专职/兼职） != '专职') || (姓名、岗位、出勤天数、在岗状态.在岗状态 = 0) || (核定编制数、岗位设置.岗位设置 || 岗位名称、用工性质（专职/兼职）、劳动合同期限.劳动合同期限)
  description: 聘用合同明确为兼职，或考勤表长期无专职人员在岗记录，或有专职编制却未签订专职聘用合同，均视为未配备专职管理人员。
  audit_item: 文化馆（站）等建设运营管护不合规
  suspicion: 未配备专职文化管理人员
  regulation: "[\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\",\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第十三条\",\n    \"内容概述\": \"文化站应配备专职人员，每个文化站编制不少于1名，工作时间内应保证有专人值班。\"\n  },\n  {\n    \"法规名称\": \"关于推进全国美术馆公共图书馆文化馆（站）免费开放工作的意见\"\
    ,\n    \"法规文号\": \"文财务发〔2011〕5号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"相关条款\",\n    \"内容概述\": \"确保免费开放后人员不减、队伍加强，"
- expression: 参训人员统计表.参训人员 < 政策要求最低培训课时 || (年度.课程内容 缺失 近X个年度记录)
  description: 以《乡镇综合文化站管理办法》等要求的年培训课时为基准（如每年不少于48学时），若专职人员年参训课时未达标，或缺少培训计划记录，即判定为培训不足。
  audit_item: 文化馆（站）等建设运营管护不合规
  suspicion: 专职文化管理人员培训不足
  regulation: "[\n  {\n    \"法规名称\": \"乡镇综合文化站管理办法\",\n    \"法规文号\": \"文化部令第48号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第十四条\",\n    \"内容概述\": \"县级文化主管部门应当加强对文化站工作人员的培训，文化站工作人员应当定期参加业务培训。\"\n  },\n  {\n    \"法规名称\": \"关于加快构建现代公共文化服务体系的意见\"\
    ,\n    \"法规文号\": \"中办发〔2015〕2号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"相关部分\",\n    \"内容概述\": \"加强基层文化队伍培训，提升服务能力，实行培训上岗"
