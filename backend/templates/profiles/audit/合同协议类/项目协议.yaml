name: audit/合同协议类/项目协议
type: model
description: 从合同协议类类文档（项目协议）中提取结构化元数据。涵盖字段如：基准能耗、节能效益分享比例、节能量计算方式。文档范围包括：项目协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 项目协议
  member_count: 1
  member_details:
  - 项目协议
output:
  fields:
  - name: 基准能耗
    type: string
    description: 提取 基准能耗 的文本值
  - name: 节能效益分享比例
    type: number
    description: 提取 节能效益分享比例 的数值（含单位，如万元、吨等）
  - name: 节能量计算方式
    type: string
    description: 提取 节能量计算方式 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (要求推行EMC的项目类型与范围 == '政策强制要求') && (项目协议 == null || 项目协议.节能效益分享比例 == null || 项目协议.节能量计算方式 == null)
  description: 对于国家或地方政策明确要求采用合同能源管理模式的项目（如公共机构节能改造），未签订EMC协议，或协议中缺少效益分享、节能量计算等核心条款，均属违规。
  audit_item: 节能减排方面存在的问题
  suspicion: 应推行而未推行合同能源管理或合同核心条款缺失
  regulation: "[\n  {\n    \"法规名称\": \"合同能源管理技术通则\",\n    \"法规文号\": \"GB/T 24915-2020\",\n    \"效力级别\": \"国家推荐性标准\",\n   \
    \ \"条款号\": \"第4章、第5章\",\n    \"内容概述\": \"合同能源管理项目应签订书面合同，明确基准能耗、节能量计算与确认方法、效益分享方式等内容。\"\n  },\n  {\n    \"法规名称\": \"国务院办公厅转发发展改革委等部门关于加快推行合同能源管理促进节能服务产业发展意见的通知\"\
    ,\n    \"法规文号\": \"国办发〔2010〕25号\",\n    \"效力级别\": \"国务院规范性文件\",\n    \"条款号\": \"二"
