name: audit/合同协议类/合作合同
type: model
description: 从合同协议类类文档（合作合同）中提取结构化元数据。涵盖字段如：付款义务、供应商与供电企业关联关系、合同收费条款、合同金额、是否包含排他性条款。文档范围包括：供应商合作合同、农机生产/销售企业合作合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 合同
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 合作合同
  member_count: 1
  member_details:
  - 供应商合作合同
  - 农机生产/销售企业合作合同
output:
  fields:
  - name: 付款义务
    type: number
    description: 提取 付款义务 的数值（含单位，如万元、吨等）
  - name: 供应商与供电企业关联关系
    type: string
    description: 提取 供应商与供电企业关联关系 的文本值
  - name: 合同收费条款
    type: number
    description: 提取 合同收费条款 的数值（含单位，如万元、吨等）
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 是否包含排他性条款
    type: number
    description: 提取 是否包含排他性条款 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: 支出金额支出事由收款方对应项目编号.支出事由 不属于 资金用途范围禁止挪用条款.资金用途范围 || (支出金额支出事由收款方对应项目编号.支出金额 > 资金用途范围禁止挪用条款.预算批复金额 && 无追加审批文件)
    || (支出金额支出事由收款方对应项目编号.收款方 关联供电企业 && 无合理交易背景) || (申报完工户数 - 核实完工户数 > 0.05 * 核实完工户数 && 拨付金额=全额)
  description: 专项资金必须专款专用，严禁用于非农网改造项目；支出不得超预算无审批；虚报改造户数套取资金或挪用资金均属违规。
  audit_item: 电网改造和供电服务不合规
  suspicion: 农网改造升级资金使用不合规
  regulation: "[\n  {\n    \"法规名称\": \"农村电网改造升级项目管理办法\",\n    \"法规文号\": \"发改能源〔2016〕2119号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二十条\",\n    \"内容概述\": \"农村电网改造升级工程投资应专款专用，任何单位和个人不得截留、挪用、虚列支出，不得用于非生产性支出。\"\n  }\n]"
- expression: 合作合同.是否包含排他性条款 == '唯一指定' || '独家供应' || ( 采购记录.供应商 == 指定供应商 && 采购记录.价格 > 市场同期均价 * 1.3 ) || 合作合同.供应商与供电企业关联关系
  description: 强制指定供应商、利用垄断地位抬高价格或存在利益输送均属违规；价格偏差超过30%为异常阈值。
  audit_item: 电网改造和供电服务不合规
  suspicion: 强制农户在指定厂家购买表后线及设施
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国反垄断法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第十七条\",\n    \"内容概述\": \"禁止具有市场支配地位的经营者没有正当理由，限定交易相对人只能与其交易或者只能与其指定的经营者进行交易。\"\n  }\n]"
