name: audit/合同协议类/使用协议
type: model
description: 从合同协议类类文档（使用协议）中提取结构化元数据。涵盖字段如：使用方名称、使用用途、使用资产描述、协议期限、品种名称、品种权人、租赁期限、租金金额。文档范围包括：使用协议、国有资产无偿使用协议、植物新品种权授权使用协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 协议
- 资产
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 使用协议
  member_count: 1
  member_details:
  - 使用协议
  - 国有资产无偿使用协议
  - 植物新品种权授权使用协议
output:
  fields:
  - name: 使用方名称
    type: string
    description: 提取 使用方名称 的文本值
  - name: 使用用途
    type: string
    description: 提取 使用用途 的文本值
  - name: 使用资产描述
    type: string
    description: 提取 使用资产描述 的文本值
  - name: 协议期限
    type: string
    description: 提取 协议期限 的文本值
  - name: 品种名称
    type: string
    description: 提取 品种名称 的文本值
  - name: 品种权人
    type: string
    description: 提取 品种权人 的文本值
  - name: 租赁期限
    type: string
    description: 提取 租赁期限 的文本值
  - name: 租金金额
    type: number
    description: 提取 租金金额 的数值（含单位，如万元、吨等）
  - name: 被许可人
    type: string
    description: 提取 被许可人 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: 占用房屋位置台账.产权单位 IN 行政机关名单 AND 占用房屋位置台账.使用性质 = '占用' AND (占用房屋位置台账.租金标准 = 0 OR 占用房屋位置台账.租金标准 < 市场租金评估价 * 0.5) AND
    占用房屋位置台账.腾退状态 = '未腾退'
  description: 协会仍占用行政机关房产，且未支付租金或租金严重低于市场价50%以上，且未完成腾退即触发。面积>0即生成疑点。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 未清理腾退行业协会商会占用行政用房
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推开行业协会商会与行政机关脱钩改革的实施意见\",\n    \"法规文号\": \"发改经体〔2019〕1063号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"三、脱钩任务和措施（四）资产分离\",\n    \"内容概述\": \"行业协会商会占用的行政办公用房，应按照规定清理腾退，实现办公场所独立。\"\n  }\n]"
- expression: (批复文件 == null) || (使用方 IN (关联方清单)) || (使用期限 > 1年) || (资产编号 IN (SELECT 资产编号 FROM 明细表 WHERE 年租金 > 0))
  description: 判定逻辑：1. 无偿出借无财政批复；2. 将国有资产无偿提供给关联企业或个人使用；3. 长期无偿出借；4. 针对同一资产，同时存在出租收益和无偿使用记录，疑似阴阳合同。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规无偿提供国有资产使用
  regulation: "[\n  {\n    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"行政事业单位对外出租、出借国有资产，应当公开、公平、公正。国家另有规定的除外。严禁无偿或以明显低于市场的价格将国有资产出租、出借给关联单位和个人。\"\n  }\n]"
