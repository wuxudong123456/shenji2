name: audit/合同协议类/借贷合同
type: model
description: 从合同协议类类文档（借贷合同）中提取结构化元数据。涵盖字段如：合同签订日期、固定收益支付义务、担保措施、是否存在强制回购条款。文档范围包括：项目借贷合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 借贷合同
  member_count: 1
  member_details:
  - 项目借贷合同
output:
  fields:
  - name: 合同签订日期
    type: date
    description: 提取 合同签订日期 的日期值，格式 YYYY-MM-DD
  - name: 固定收益支付义务
    type: string
    description: 提取 固定收益支付义务 的文本值
  - name: 担保措施
    type: string
    description: 提取 担保措施 的文本值
  - name: 是否存在强制回购条款
    type: number
    description: 提取 是否存在强制回购条款 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (首笔工程款支付凭证.支付日期 < 项目资本金到位情况表.首笔资本金到位时间) || (项目施工许可证.发证日期 < 项目资本金到位情况表.首笔资本金到位时间)
  description: 若项目开始建设（以取得施工许可证或支付首笔工程款为标志）的日期，早于项目资本金首次到位的时间，则判定为“未落实资本金就进行建设”的违规行为。
  audit_item: 项目资本金不符合要求
  suspicion: 项目未落实资本金即开工建设
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于加强固定资产投资项目资本金管理的通知\",\n    \"法规文号\": \"国发〔2019〕26号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"投资项目的资本金一次认缴，并根据批准的建设进度按比例逐年到位。项目开工建设前，项目资本金应到位一定比例。\"\n  }\n]"
- expression: (项目借贷合同及“名股实债”相关协议.条款内容 CONTAINS ('按期赎回' || '固定利率' || '提供担保' || '保底收益')) && (资本金来源说明及证明材料.资金性质认定 == '项目资本金')
  description: 透过形式审查实质。若一笔被认定为项目资本金的资金，其底层协议中存在按期赎回、固定收益、担保或保底条款等债权特征的条款，则判定其为“名股实债”，属于虚假资本金。该表达式采用关键字匹配逻辑。
  audit_item: 项目资本金不符合要求
  suspicion: 将“名股实债”资金违规认定为资本金
  regulation: "[\n  {\n    \"法规名称\": \"关于加强固定资产投资项目资本金管理的通知\",\n    \"法规文号\": \"国发〔2019〕26号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第四条\",\n    \"内容概述\": \"投资项目资本金对投资项目来说必须是非债务性资金，项目法人不承担这部分资金的任何利息和债务；投资者可以按其出资的比例依法享有所有者权益，也可转让其出资，但不得以任何方式抽回。\"\
    \n  }\n]"
