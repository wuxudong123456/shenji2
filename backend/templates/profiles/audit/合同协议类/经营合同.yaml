name: audit/合同协议类/经营合同
type: model
description: 从合同协议类类文档（经营合同）中提取结构化元数据。涵盖字段如：承租方、支付方式、租金金额、签订日期。文档范围包括：集体资产经营合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 经营合同
  member_count: 1
  member_details:
  - 集体资产经营合同
output:
  fields:
  - name: 承租方
    type: string
    description: 提取 承租方 的文本值
  - name: 支付方式
    type: string
    description: 提取 支付方式 的文本值
  - name: 租金金额
    type: number
    description: 提取 租金金额 的数值（含单位，如万元、吨等）
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (明细表.身份证号 重复计数 > 1 且 分配金额 > 0) || (明细表.身份证号 关联 公安死亡人口数据 存在匹配且分配金额 > 0) AND (该村集体经济组织在监督检查台账中无最近两年检查记录 || 对应问题未出现在任何底稿中)
  description: 满足以下任一条件：①同一身份证号多次分配；②死亡人员仍参与分配。同时对应村集体近两年未被检查或检查底稿中未提及此类异常，表明监督检查缺失导致侵害未被发现。
  audit_item: 政策支持落实和监督检查不到位
  suspicion: 监督检查不到位未发现侵害集体经济组织权益行为
  regulation: "[\n  {\n    \"法规名称\": \"农村集体经济组织审计规定\",\n    \"法规文号\": \"农办经〔2008〕8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第五条\",\n    \"内容概述\": \"各级农村经营管理部门应当对农村集体经济组织财务收支、资产运营等情况进行定期审计，及时发现和纠正违法违纪问题。\"\n  }\n]"
