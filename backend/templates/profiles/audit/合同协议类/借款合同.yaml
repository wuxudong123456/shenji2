name: audit/合同协议类/借款合同
type: model
description: 从合同协议类类文档（借款合同）中提取结构化元数据。涵盖字段如：借款对象、借款性质、借款期间、借款期限、借款条件、借款用途、借款金额、偿还计划。文档范围包括：借款合同、对外借款合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 借款合同
  member_count: 1
  member_details:
  - 借款合同
  - 对外借款合同
output:
  fields:
  - name: 借款对象
    type: number
    description: 提取 借款对象 的数值（含单位，如万元、吨等）
  - name: 借款性质
    type: number
    description: 提取 借款性质 的数值（含单位，如万元、吨等）
  - name: 借款期间
    type: number
    description: 提取 借款期间 的数值（含单位，如万元、吨等）
  - name: 借款期限
    type: number
    description: 提取 借款期限 的数值（含单位，如万元、吨等）
  - name: 借款条件
    type: number
    description: 提取 借款条件 的数值（含单位，如万元、吨等）
  - name: 借款用途
    type: number
    description: 提取 借款用途 的数值（含单位，如万元、吨等）
  - name: 借款金额
    type: number
    description: 提取 借款金额 的数值（含单位，如万元、吨等）
  - name: 偿还计划
    type: string
    description: 提取 偿还计划 的文本值
  - name: 利率
    type: string
    description: 提取 利率 的文本值
  - name: 合同利息
    type: string
    description: 提取 合同利息 的文本值
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 期限
    type: string
    description: 提取 期限 的文本值
  - name: 签约日期
    type: date
    description: 提取 签约日期 的日期值，格式 YYYY-MM-DD
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 约定利率
    type: string
    description: 提取 约定利率 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (统计表.借款余额 > 0) AND (借款合同.审批环节缺失 == TRUE OR 借款合同.审批层级 < 政府常务会议) AND (借款合同.借款对象性质 != '预算单位') AND (行对账单.资金来源于财政国库或专户
    == TRUE)
  description: 当存在未清偿借款，且借款审批程序不完整（如无政府常务会议决议），借款对象为非预算单位企业或个人，且资金来源为财政性资金时，判定为违规。许可阈值：审批文件缺失或借款对象非预算单位即直接触发疑点。
  audit_item: 挤占挪用套取财政资金
  suspicion: 违规对外出借财政资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国预算法\",\n    \"法规文号\": \"主席令第十二号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十九条\"\
    ,\n    \"内容概述\": \"各级政府不得向非预算单位出借财政资金。\"\n  },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n \
    \   \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"财政收入执收单位及其工作人员……隐瞒应当上缴的财政收入，截留代收的财政收入，其他不缴或者少缴财政收入的行为……\"\
    \n  }"
- expression: (SUM(借款合同.合同金额) - (余额表.期末余额 + 余额表.期末余额 + 余额表.期末余额)) > 余额表.期末余额*1%  ||  (EXISTS (银行对账单 WHERE 银行对账单.借贷方金额 > 余额表.期末余额
    AND 银行对账单.对方账户名称 NOT IN (银行对账单.对方账户名称) AND 银行对账单.摘要 LIKE '%借款%') AND NOT EXISTS (明细表 WHERE 明细表.借款金额))
  description: 以资产总额1%作为重要性阈值：应收账款合同中全部合同金额合计超出账面记录的负债科目余额且差额超过资产总额1%时，判定为存在未入账借款合同；银行流水中出现非合作银行账户的大额入账且摘要明确涉及借贷，但未能在任何负债科目明细账中找到对应贷方记录时，判定为存在未入账债务。
  audit_item: 未按规定核算负债
  suspicion: 债务未按规定入账形成表外负债
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号（2014年修改）\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第二十三条、第二十四条\",\n    \"内容概述\": \"负债是指企业过去的交易或者事项形成的、预期会导致经济利益流出企业的现时义务；符合负债定义的义务，同时满足与该义务有关的经济利益很可能流出企业且金额能够可靠计量时，应确认为负债。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号（2017年修正）\",\n    \"效力级别\": \"法律\","
- expression: (EXISTS (明细表 WHERE 对方单位 IN (供应商主数据) AND 账龄 > 365)) || (EXISTS (明细表 WHERE 利息计提分录贷方科目 != '应付利息' AND 贷方科目 != '长期借款-应计利息'
    AND 利息计提借方为财务费用))
  description: 其他应付款明细中出现与供应商相同的对方单位，且挂账时间超过1年，基本可判定为应付账款分类错误；借款利息计提时如贷方科目不是“应付利息”或“长期借款-应计利息”而误挂其他应付款或直接冲减借款本金，均属科目错配。
  audit_item: 未按规定核算负债
  suspicion: 负债入账科目分类错误
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第30号——财务报表列报\",\n    \"法规文号\": \"财会[2014]7号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十二条\",\n    \"内容概述\": \"资产和负债应当分别流动资产和非流动资产、流动负债和非流动负债列示，金融负债的列报应遵循相关具体准则。\"\n  },\n  {\n    \"法规名称\": \"\
    企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者事项为"
- expression: (投资金额、回购条款、固定收益条款、清算优先权 WHERE (固定收益条款包含 '保证本金' OR '年化收益率' OR '强制回购') AND 明细项目 IN ('实收资本','资本公积')) && (计提利息金额、对应借款、利息支出、收款人
    WHERE 收款人 = 上述投资方 AND 支付固定回报不依赖利润分配决议)
  description: 若股权投资合同中明确约定了刚性兑付义务（如保本、固定收益及无条件回购条款），且该出资已计入了权益科目，同时企业定期向投资方支付与利润无关的固定款项，该笔“股”实质为债，必须重分类为金融负债，支付的回报应作为利息费用处理。
  audit_item: 未按规定核算负债
  suspicion: 通过名股实债方式隐匿负债
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第37号——金融工具列报\",\n    \"法规文号\": \"财会[2017]14号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第七条\",\n    \"内容概述\": \"企业应当根据所发行金融工具的合同条款及其所反映的经济实质而非仅以法律形式，结合金融资产、金融负债和权益工具的定义，在初始确认时将该金融工具或其组成部分分类为金融资产、金融负债或权益工具。\"\
    \n  }\n]"
- expression: (资本化金额计算过程.资本化开始/暂停/停止日期 < 借款合同.签订日期) || (资本化金额计算过程.资本化开始/暂停/停止日期 > 进度报告.竣工决算日期) || (资本化金额 > (专门借款当期实际利息额 -
    暂时闲置资金投资收益) 且 超出部分无合理解释)
  description: 资本化开始晚于提款或存在暂停资本化条件未暂停，结束晚于竣工验收，或金额计算不准确，均属错误。
  audit_item: 未按规定确认成本费用
  suspicion: 固定资产借款费用资本化期间或金额错误
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第17号——借款费用\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条、第六条、第十二条\",\n    \"内容概述\": \"借款费用只有同时满足资产支出已经发生、借款费用已经发生、为使资产达到预定可使用状态所必要的购建活动已经开始才能资本化；购建发生非正常中断连续超过3个月应暂停资本化；达到预定可使用状态时停止资本化。\"\
    \n  }\n]"
- expression: (明细表.未还款余额 > 0) && (借款合同.借款期间 > 365) && (申报收入总额.利息股息红利所得申报记录)
  description: 纳税年度内个人投资者从其投资企业借款，在该纳税年度终了后既不归还，又未用于企业生产经营的，其未归还的借款应视为企业对个人投资者的红利分配，依照“利息、股息、红利所得”项目计征个人所得税。超过365天未归还且无经营用途，即触发。
  audit_item: 违反税收征管规定的行为
  suspicion: 股东借款长期挂账未视同分红代扣个人所得税
  regulation: "[\n  {\n    \"法规名称\": \"财政部 国家税务总局关于规范个人投资者个人所得税征收管理的通知\",\n    \"法规文号\": \"财税〔2003〕158号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"纳税年度内个人投资者从其投资企业借款，在该纳税年度终了后既不归还，又未用于企业生产经营的，其未归还的借款可视为企业对个人投资者的红利分配，依照“利息、股息、红利所得”项目计征个人所得税。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国个人所得税法\",\n    \"法规文号\": \"主席令第九号\",\n    \"效力级别\": \""
