name: audit/合同协议类/带资协议
type: model
description: 从合同协议类类文档（带资协议）中提取结构化元数据。涵盖字段如：回购承诺条款、垫资条款、资金支付安排。文档范围包括：施工方带资协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 带资协议
  member_count: 1
  member_details:
  - 施工方带资协议
output:
  fields:
  - name: 回购承诺条款
    type: number
    description: 提取 回购承诺条款 的数值（含单位，如万元、吨等）
  - name: 垫资条款
    type: number
    description: 提取 垫资条款 的数值（含单位，如万元、吨等）
  - name: 资金支付安排
    type: string
    description: 提取 资金支付安排 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (协议内容包含‘施工方垫付资本金’ OR 资金流出现垫资记录) && (协议内容包含‘政府回购’ OR 融资审批中明确BT模式)
  description: 施工方带资并约定政府远期回购义务，属于违规BT模式。根据财预〔2017〕50号文禁止，同时违反《政府投资条例》不得垫资建设的规定。
  audit_item: 项目建设管理不符合相关规定
  suspicion: 农村公路建设违规采用施工方带资的BT模式
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十二条第一款\"\
    ,\n    \"内容概述\": \"政府投资项目不得由施工单位垫资建设。\"\n  },\n  {\n    \"法规名称\": \"关于进一步规范地方政府举债融资行为的通知\",\n    \"法规文号\": \"财预〔2017〕50号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条、第四条\",\n    \"内容概述\": \"严禁地方政府利用PPP、政府出资的各类投资基金等方式违法违规变相举债，禁止以BT方式举借"
