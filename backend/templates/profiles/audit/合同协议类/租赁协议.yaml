name: audit/合同协议类/租赁协议
type: model
description: 从合同协议类类文档（租赁协议）中提取结构化元数据。涵盖字段如：最大容纳人数、租赁金额。文档范围包括：培训场地租赁协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 租赁协议
  member_count: 1
  member_details:
  - 培训场地租赁协议
output:
  fields:
  - name: 最大容纳人数
    type: number
    description: 提取 最大容纳人数 的数值（含单位，如万元、吨等）
  - name: 租赁金额
    type: number
    description: 提取 租赁金额 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (SUM(明细表.金额) / COUNT(统计表.人员身份信息) > 综合定额标准（元/人天）.综合定额标准（元/人天）) || (签到表.实际签到人数 > 培训通知.批准培训人数 * 1.1) || (租赁协议.最大容纳人数
    < 签到表.实际签到人数)
  description: 人均综合培训费超出管理制度规定的定额标准；或实际签到参训人数超过审批人数的10%以上；或培训场地最大容纳人数低于实际签到人数，三个条件满足其一即视为超标准或超人数违规。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 超标准、超人数举办培训
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关培训费管理办法\",\n    \"法规文号\": \"财行〔2016〕540号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条、第十条\",\n    \"内容概述\": \"培训费实行综合定额标准控制，分项核定、总额控制；组织培训的工作人员人数不得超过参训人员数量的10%。\"\n  }\n]"
