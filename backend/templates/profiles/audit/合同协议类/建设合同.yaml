name: audit/合同协议类/建设合同
type: model
description: 从合同协议类类文档（建设合同）中提取结构化元数据。涵盖字段如：合同约定数量。文档范围包括：建设合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 建设合同
  member_count: 1
  member_details:
  - 建设合同
output:
  fields:
  - name: 合同约定数量
    type: number
    description: 提取 合同约定数量 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (合同约定数量.实际安装数量 < 合同约定数量.合同约定数量 * 0.9) || (日均投放次数.日均投放次数 == 0 && 日均投放次数.完好状态) || (维护记录.故障报修记录中连续30天无投放记录且未做故障报修)
  description: 实际配备数量不足合同约定90%，或设施完好但投放记录为零，或连续30天无使用记录却无任何报修，均表明设施未配备到位或闲置浪费。
  audit_item: 农村生活垃圾治理不符合相关规定
  suspicion: 分类回收设施未配备或建成后闲置
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国固体废物污染环境防治法》\",\n    \"法规文号\": \"主席令第四十三号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十六条\",\n    \"内容概述\": \"地方各级人民政府应当采取措施，建设和配备符合垃圾分类要求的生活垃圾分类收集设施，并保障其正常运行。\"\n  }\n]"
