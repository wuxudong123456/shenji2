name: audit/合同协议类/搬迁协议
type: model
description: 从合同协议类类文档（搬迁协议）中提取结构化元数据。涵盖字段如：搬迁完成时间、补偿标准。文档范围包括：补偿或搬迁协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 搬迁协议
  member_count: 1
  member_details:
  - 补偿或搬迁协议
output:
  fields:
  - name: 搬迁完成时间
    type: date
    description: 提取 搬迁完成时间 的日期值，格式 YYYY-MM-DD
  - name: 补偿标准
    type: string
    description: 提取 补偿标准 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (禁养区内合规养殖场关停数 / 禁养区内养殖场总数 > 0.2) || (实际划定面积 / 技术指南规定面积上限 > 1.3) || (补偿标准 < 地方政府规定标准 && 仍实施搬迁)
  description: 合规养殖场被迫关停比例超过20%可能反映划定不合理；划定面积超出技术指南上限30%以上为显著扩大；补偿低于标准且仍实施属侵害权益。
  audit_item: 项目实施不到位
  suspicion: 禁养区随意扩大致合规养殖场关停
  regulation: "[\n  {\n    \"法规名称\": \"畜禽养殖禁养区划定技术指南\",\n    \"法规文号\": \"环办水体〔2016〕99号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"四、划定范围\",\n    \"内容概述\": \"明确规定禁养区包括饮用水水源保护区、风景名胜区、自然保护区的核心区和缓冲区等，不得随意扩大范围。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国畜牧法\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第四十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第四十条\",\n    \"内容概述\": \"禁止在划定的禁养区域内建设畜禽养"
