name: audit/合同协议类/安置协议
type: model
description: 从合同协议类类文档（安置协议）中提取结构化元数据。涵盖字段如：搬迁方式、补偿是否到位标志、补偿标准。文档范围包括：村民搬迁安置协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 安置协议
  member_count: 1
  member_details:
  - 村民搬迁安置协议
output:
  fields:
  - name: 搬迁方式
    type: string
    description: 提取 搬迁方式 的文本值
  - name: 补偿是否到位标志
    type: boolean
    description: 提取 补偿是否到位标志 的布尔值（是/否）
  - name: 补偿标准
    type: string
    description: 提取 补偿标准 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: 村民搬迁安置协议.搬迁方式 == '整体搬迁' && 村民搬迁安置协议.开发后土地用途 CONTAINS '商业' && (村民搬迁安置协议.补偿是否到位标志 == '否' || 旅游开发收益分配明细表.村民人均分红金额
    < 当地低保标准 || 村民满意度调查问卷统计表.搬迁自愿性评价 == '强制')
  description: 核心判定标准：实施了整村搬迁，且原址用途变更为商业经营。在此前提下，若安置补偿未足额到位、或搬迁非村民自愿、或村民未来从商业开发中获得的收益分红低于当地低保标准，均属违背保护初衷的严重违规。
  audit_item: 传统村落保护不到位
  suspicion: 以保护为由实施整体搬迁后搞商业开发
  regulation: "[\n  {\n    \"法规名称\": \"关于加强传统村落保护发展工作的指导意见\",\n    \"法规文号\": \"建材〔2012〕184号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"要坚持保护优先，禁止以保护利用为由把村民全部迁出，实施商业性整体开发。\"\n  }\n]"
