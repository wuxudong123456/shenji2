name: audit/合同协议类/收购协议
type: model
description: 从合同协议类类文档（收购协议）中提取结构化元数据。涵盖字段如：合同电价。文档范围包括：电力公司沼气发电收购协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 收购协议
  member_count: 1
  member_details:
  - 电力公司沼气发电收购协议
output:
  fields:
  - name: 合同电价
    type: string
    description: 提取 合同电价 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (沼气发电项目上网电量统计表.实际上网电量 < 沼气发电项目上网电量统计表.可发电量 * 0.95) OR (电力公司收购协议.合同电价 < 沼气发电上网标杆电价政策执行文件.标杆电价) OR (DATEDIFF(结算日期,应结算日期)
    > 30)
  description: 三个或条件：1.电量全额保障性收购率低于95%（即弃电率>5%），收购率=实际上网电量/可发电量；2.实际结算电价低于国家规定的沼气发电标杆电价（如0.75元/度）；3.电网公司结算周期超过政策规定的月度或季度结算时限，延迟超过30天。符合任一条件判定为政策落实不到位。
  audit_item: 配套政策支持不到位
  suspicion: 沼气发电上网电价及全额保障收购政策执行打折
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国可再生能源法\",\n    \"法规文号\": \"中华人民共和国主席令第二十三号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十四条、第十九条\",\n    \"内容概述\": \"电网企业应当全额收购其电网覆盖范围内可再生能源并网发电项目的上网电量；可再生能源发电项目的上网电价，由政府价格主管部门按照有利于促进可再生能源开发利用和经济合理的原则确定。\"\
    \n  },\n  {\n    \"法规名称\": \"关于促进生物天然气产业化发展的指导意见\",\n    \"法规文号\": \"发改能源规〔2019〕1895号\",\n    \"效力级别\": \"部门"
