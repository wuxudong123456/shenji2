name: audit/合同协议类/就业协议
type: model
description: 从合同协议类类文档（就业协议）中提取结构化元数据。涵盖字段如：合同起止日期、员工姓名、岗位、月工资标准、身份证号。文档范围包括：劳动合同或就业协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 薪酬
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 就业协议
  member_count: 1
  member_details:
  - 劳动合同或就业协议
output:
  fields:
  - name: 合同起止日期
    type: date
    description: 提取 合同起止日期 的日期值，格式 YYYY-MM-DD
  - name: 员工姓名
    type: string
    description: 提取 员工姓名 的文本值
  - name: 岗位
    type: string
    description: 提取 岗位 的文本值
  - name: 月工资标准
    type: string
    description: 提取 月工资标准 的文本值
  - name: 身份证号
    type: string
    description: 提取 身份证号 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: （申领吸纳就业补贴的身份证号 NOT IN (缴纳记录.身份证号)） || （合同起止日期 < 缴纳记录.首次参保日期 超过 30 天） || （发放凭证.实发工资金额在补贴申报后连续3个月无流水） || （合同起止日期与补贴申报期限不符）
  description: 通过查验劳动合同是否伴随真实用工行为（社保缴纳、工资发放）来判断，若未参保、参保时间滞后超过30天、或补贴期间无任何工资发放记录，则视为虚假用工合同。
  audit_item: 虚列就业补助资金支出
  suspicion: 虚构用工合同骗取吸纳就业补贴
  regulation: "[\n  {\n    \"法规名称\": \"就业补助资金管理办法\",\n    \"法规文号\": \"财社〔2017〕164号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"吸纳就业困难人员社保补贴或岗位补贴须以建立稳定劳动关系并按规定缴纳社保费为前提，仅凭无实质履行的合同不得申领。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国劳动合同法\"\
    ,\n    \"法规文号\": \"主席令第六十五号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"建立劳动关系应当订立书面劳动合同，但劳动关"
