name: audit/合同协议类/担保合同
type: model
description: 从合同协议类类文档（担保合同）中提取结构化元数据。涵盖字段如：借款方/担保对象名称、共同担保人清单、反担保合同编号、反担保物价值、合同编号、对应担保合同编号、抵押物评估价值、担保/借款金额。文档范围包括：反担保合同、国有资产担保合同、担保合同、贷款担保合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 担保合同
  member_count: 1
  member_details:
  - 反担保合同
  - 国有资产担保合同
  - 担保合同
  - 贷款担保合同
output:
  fields:
  - name: 借款方-担保对象名称
    type: number
    description: 提取 借款方-担保对象名称 的数值（含单位，如万元、吨等）
  - name: 共同担保人清单
    type: string
    description: 提取 共同担保人清单 的文本值
  - name: 反担保合同编号
    type: string
    description: 提取 反担保合同编号 的文本值
  - name: 反担保物价值
    type: string
    description: 提取 反担保物价值 的文本值
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 对应担保合同编号
    type: string
    description: 提取 对应担保合同编号 的文本值
  - name: 抵押物评估价值
    type: string
    description: 提取 抵押物评估价值 的文本值
  - name: 担保-借款金额
    type: number
    description: 提取 担保-借款金额 的数值（含单位，如万元、吨等）
  - name: 担保份额条款
    type: number
    description: 提取 担保份额条款 的数值（含单位，如万元、吨等）
  - name: 担保合同编号
    type: string
    description: 提取 担保合同编号 的文本值
  - name: 担保对象-借款方
    type: number
    description: 提取 担保对象-借款方 的数值（含单位，如万元、吨等）
  - name: 担保对象名称
    type: string
    description: 提取 担保对象名称 的文本值
  - name: 担保方式
    type: string
    description: 提取 担保方式 的文本值
  - name: 担保日期
    type: date
    description: 提取 担保日期 的日期值，格式 YYYY-MM-DD
  - name: 担保期限
    type: string
    description: 提取 担保期限 的文本值
  - name: 担保比例
    type: number
    description: 提取 担保比例 的数值（含单位，如万元、吨等）
  - name: 担保金额
    type: number
    description: 提取 担保金额 的数值（含单位，如万元、吨等）
  - name: 是否为央企标识
    type: boolean
    description: 提取 是否为央企标识 的布尔值（是/否）
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 被担保人
    type: string
    description: 提取 被担保人 的文本值
  - name: 被担保方名称
    type: string
    description: 提取 被担保方名称 的文本值
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (担保合同.审批单 == null || 批复文件 == null) || (被担保方 IN (关联方清单) && 事项台账.与被担保方关系 IN ('个人关联', '子公司高管持股')) || (担保金额 > 净资产
    * 0.1)
  description: 判定逻辑：1. 担保行为无内部审批或上级财政审批；2. 为本单位或个人的关联企业提供担保；3. 对外担保总额超过企业净资产10%的警戒线（可结合公司章程调整）。满足任一条件即触发疑点。
  audit_item: 违规使用国有资产
  suspicion: 违规利用国有资产对外担保
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十五条\",\n    \"内容概述\": \"未经履行出资人职责的机构同意，国有独资企业、国有独资公司不得为关联方提供担保。\"\n  },\n  {\n    \"法规名称\": \"关于规范国有企业对外担保行为的意见\"\
    ,\n    \"法规文号\": \"银监发〔2004〕24号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二点\",\n    \"内容概述\": \"国有企业对外担保必须严格履行内部审批程序，严"
- expression: 存在担保合同.合同编号，且（无对应的董事会/股东大会决议记录）或（决议担保事项清单、决议金额、决议日期、出席董事/股东签名.决议日期晚于合同签订日期）或（决议担保事项清单、决议金额、决议日期、出席董事/股东签名.决议金额小于担保合同.担保金额）或（审批节点、审批人、审批意见、审批时间.审批人权限不符合担保审批权限规定（金额阈值、审批层级）.审批层级）
  description: 担保合同若无对应的决议记录；或决议签署日期晚于合同签订日期（先签合同后补程序）；或决议批准的担保金额无法覆盖合同金额；或最终审批人未达到制度规定的权限级别，均触发疑点。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 担保事项未履行董事会或股东大会审批程序
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十六条\",\n\
    \    \"内容概述\": \"公司向其他企业投资或者为他人提供担保，依照公司章程的规定，由董事会或者股东会、股东大会决议；公司章程对投资或者担保的总额及单项投资或者担保的数额有限额规定的，不得超过规定的限额。\"\n  },\n \
    \ {\n    \"法规名称\": \"企业内部控制应用指引第12号——担保业务\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第四条\",\n \
    \   \"内容概述\""
- expression: (担保类型（是否全资子公司） != '全资子公司' OR 担保类型（是否全资子公司） != '控股子公司') && (反担保合同编号 IS NULL OR 反担保合同编号 = '')
  description: 根据监管规定，上市公司对外担保（除对全资子公司及控股子公司提供担保外）必须要求被担保人提供反担保。若台账中符合条件的担保事项缺乏有效的反担保合同，即构成违规。
  audit_item: 担保业务管理方面存在的问题
  suspicion: 上市公司对外担保未要求被担保人提供反担保
  regulation: "[\n  {\n    \"法规名称\": \"关于规范上市公司对外担保行为的通知\",\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第一条（三）\",\n    \"内容概述\": \"上市公司对外担保必须要求对方提供反担保，且反担保的提供方应当具有实际承担能力。\"\n  },\n  {\n    \"法规名称\": \"上市公司监管指引第8号——上市公司资金往来、对外担保的监管要求\"\
    ,\n    \"法规文号\": \"证监会公告〔2022〕26号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \""
- expression: (担保合同.签订日期 < 决议文件.决议日期) || (担保合同.担保金额 > 其他.金额限额 && 决议文件.审批层级 != 其他.审批层级) || (其他.需经董事会或风控委员会审批的条件 == true &&
    批准文件.批复文号 == null)
  description: 判定规则：1. 合同签订日期早于决议日期，表明存在先操作后审批；2. 担保金额超过制度规定的该层级审批限额（如总经理权限1亿，实际担保2亿），且决议机构层级不符；3. 根据公司章程或上级规定须报国资委/集团审批而未取得书面批复，即视为违规。以上任一条件满足则触发疑点。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 未按规定履行决策程序对外担保或借款
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步推进国有企业贯彻落实“三重一大”决策制度的意见\",\n    \"法规文号\": \"中办发〔2010〕17号\",\n    \"效力级别\": \"\
    制度文件\",\n    \"条款号\": \"二、‘三重一大’事项的主要范围\",\n    \"内容概述\": \"重大决策、重要人事任免、重大项目安排和大额度资金运作事项必须由领导班子集体作出决定，不得以传阅、会签或个别征求意见等方式代替。\"\
    \n  }\n]"
- expression: (担保台账.实际代偿金额 > 担保份额条款.担保比例 * 1.05) && (担保台账.已追偿金额 == 0 || 担保台账.已追偿金额 < 50%)
  description: 实际代偿金额超过合同约定应承担份额的105%（容差5%）且未向其他共同担保人追偿或追偿率显著过低（低于50%），表明未按保证份额承担责任，可能存在怠于追偿或变相承担超额责任。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 未按保证份额承担担保责任
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"六、严格追究违规担保责任\",\n    \"内容概述\": \"对因违规担保造成资产损失或未按规定承担担保责任、代偿后未及时追偿造成损失的，要严肃追究相关责任人责任。\"\n  }\n]"
- expression: (被担保方.资产负债率 > 70% || 被担保方.不良信用记录 == 不良 || 被担保方.连续亏损年数 >= 3) && 审查结论、各指标评估值.审查结论 == 通过
  description: 根据内部制度规定，担保对象资产负债率超过70%、征信存在不良记录或连续三年亏损应不予担保，但通过审查结论却为“通过”，表明审查流于形式或违规批准。具体阈值可根据企业制度调整。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 违规向不符合担保条件的对象提供担保
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、严格控制融资担保对象\",\n    \"内容概述\": \"中央企业严禁对集团外无股权关系企业提供担保；不得对进入重组或破产清算程序、资不抵债、连续三年及以上亏损且经营净现金流为负等不具备持续经营能力的子企业提供担保。\"\
    \n  }\n]"
- expression: (担保对象名称、是否集团内企业标识.是否集团内企业标识 == 否 || 关联方清单.股权关系 == 无) && 批准文件.批复文号 == null
  description: 根据制度规定，为集团外企业提供担保必须取得国资委或集团总部书面批准。若被担保对象经股权穿透不属于集团内企业，且无有效批复文件，即构成违规。
  audit_item: 违规对外提供重大担保或借款
  suspicion: 未经批准违规为集团外企业提供担保
  regulation: "[\n  {\n    \"法规名称\": \"关于加强中央企业融资担保管理工作的通知\",\n    \"法规文号\": \"国资发财评规〔2021〕75号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、严格控制融资担保对象\",\n    \"内容概述\": \"中央企业严禁对集团外无股权关系的企业提供任何形式担保。\"\n  }\n]"
