name: audit/合同协议类/工具合同
type: model
description: 从合同协议类类文档（工具合同）中提取结构化元数据。涵盖字段如：清算顺序。文档范围包括：特殊融资工具合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 工具合同
  member_count: 1
  member_details:
  - 特殊融资工具合同
output:
  fields:
  - name: 清算顺序
    type: string
    description: 提取 清算顺序 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (明细表.分类结果（负债/权益） = '权益工具') && (工具合同.强制付息条款 || 工具合同.赎回条款 || 业务台账.实际还本付息记录)
  description: 根据会计准则，当融资工具合同实质上存在不可避免的支付现金或其他金融资产的合同义务时，应分类为金融负债。若企业将其错误分类为权益工具，则属于虚假降杠杆。表达式通过审查合同条款和业务台账中的实质义务来判定违规。
  audit_item: 未按规定落实去杠杆政策措施
  suspicion: 将金融负债违规计入权益工具虚假降杠杆
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第37号——金融工具列报\",\n    \"法规文号\": \"财会〔2017〕14号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十条、第十一条\",\n    \"内容概述\": \"企业应当根据所发行金融工具的合同条款及其所反映的经济实质而非仅以法律形式，结合金融资产、金融负债和权益工具的定义，在初始确认时将金融工具或其组成部分分类为金融资产、金融负债或权益工具。如果企业不能无条件地避免以交付现金或其他金融资产来履行一项合同义务，则该合同义务符合金融负债的定义。\"\
    \n  }\n]"
