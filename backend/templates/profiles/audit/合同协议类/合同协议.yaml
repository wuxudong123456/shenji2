name: audit/合同协议类/合同协议
type: model
description: 从合同协议类类文档（合同协议）中提取结构化元数据。涵盖字段如：中标方/承包商名称、二次分红条款、付款节点要求、付款记录、保底收购价、借款合同编号、借款用途、借款金额。文档范围包括：债务相关合同协议、利益联结机制相关合同协议、合同协议、政府购买养老服务合同协议、第三方机构合同协议、重大基础设施项目合同协议、项目合同协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 合同
- 工程
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 合同协议
  member_count: 1
  member_details:
  - 债务相关合同协议
  - 利益联结机制相关合同协议
  - 合同协议
  - 政府购买养老服务合同协议
  - 第三方机构合同协议
  - 重大基础设施项目合同协议
  - 项目合同协议
