violations:
- expression: (关联单位相关支出明细.摘要 包含 "接待费" OR 关联单位相关支出明细.摘要 包含 "餐费" OR 关联单位相关支出明细.收款方 = '本单位经常消费的酒店' OR 关联单位相关支出明细.收款方 = '本单位')
    AND (合同协议.费用分担条款 为空 OR 未办理资金划转审批) AND 公务接待费明细账.同期接待费变动 < 关联单位相关支出明细.金额
  description: 关联单位账目中出现接待性质支出且收款方指向本单位经常消费场所，同时缺乏合法费用转移依据，或本单位同期接待费异常偏低，极可能为转嫁摊派。
  audit_item: 公务接待费预算执行不合规
  suspicion: 向所属单位或关联方转嫁摊派接待费
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"不得向下级单位以及其他单位、企业、个人转嫁公务活动费用。\"\n  },\n  {\n    \"法规名称\": \"党政机关国内公务接待管理规定\",\n    \"\
    法规文号\": \"中办发〔2013〕22号\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"禁止向下级单位以及其他单位、企业、个人摊派、转嫁公务接待费用。\"\
    \n  }\n"
- expression: (原始凭证.原始单据（如学费票据、合同）日期 > 原始凭证.记账凭证做账日期) && (原始凭证.记账凭证做账日期 >= 明细表.确认期间（或记账日期）) || (合同协议.合同约定的服务期/产品交付期/学籍所属期
    > 明细表.确认期间（或记账日期） && 明细表.收入来源 > 明细表.确认金额)
  description: 表达式包含两种风险判断逻辑：1. 原始业务单据（如学费票据）开具日期在未来（下一年度），而记账凭证将其提前到本决算年度进行确认，这违反了权责发生制原则。2. 依据合同约定，收入对应的服务、商品交付主要发生在下一年度（如下学期学费），但在本年度决算中一次性或分期确认了大额收入，且缺乏合理的完工进度证据，判定为提前确认。重点关注年末12月份及次年1月的大额收入凭证。
  audit_item: 决算报表内容不真实
  suspicion: 违规提前确认收入以虚增决算
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第二十四号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，填制会计凭证，登记会计账簿，编制财务会计报告。任何单位不得以虚假的经济业务事项或者资料进行会计核算。\"\n  },\n  {\n\
    \    \"法规名称\": \"政府会计准则——基本准则\",\n    \"法规文号\": \"财政部令第78号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n    \"\
    内容概述\":"
- expression: (合同协议.合同金额 != 实施主体.预算金额 || 发票金额 != 合同协议.合同金额) || (会计凭证.最终收款方名称及账号 != 合同协议.中标方/承包商名称) || 合同协议.验收工程量 > 实际工程量 ||
    项目申报主体无实际运营
  description: 通过多单匹配检查资金支付与业务支撑材料的逻辑一致性。任何金额、主体、工程量不符的情况，或资金最终流向与合同方无关的第三方（特别是关联方或个人账户），均视为骗取、套取资金的疑点。'实际工程量'需通过现场勘查核实。
  audit_item: 转移支付资金管理和使用不规范
  suspicion: 虚构项目或虚增工程量骗取转移支付资金
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"单位和个人有虚报、冒领等手段骗取财政资金的行为的，责令改正，调整有关会计账目，追回违反规定使用、骗取的有关资金，给予警告，没收违法所得。\"\n  }\n]"
- expression: (采购方式 IN ('直接委托','单一来源','询价') AND 合同金额 >= 2000000) OR (同一第三方机构年度合同金额累计 >= 2000000 AND 采购方式 NOT IN ('公开招标','竞争性磋商')
    AND 合同签订日期间隔 <= 90 天) OR (合同金额 != 中标通知书金额)
  description: 单项合同金额达到公开招标限额（默认200万元）但未采用公开招标或竞争性磋商方式时触发；同一第三方机构在短期内多次签约且累计金额超过限额，且未使用公开招标等方式，反映化整为零规避招标；合同金额与中标通知书金额不一致，存在违规变更风险。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 第三方绩效评价服务采购未执行政府购买服务相关规定
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"在一个财政年度内，采购人将一个预算项目下的同一品目"
- expression: (登记表.登记状态 = '运营中' && 统计表.年均床位利用率 < 0.3) || (明细表.拨付金额 > 0 && 登记表.关停日期 IS NOT NULL && 登记表.登记状态 != '注销')
  description: 条件一：登记为运营中但年均床位利用率低于30%，属于隐性闲置；条件二：机构已关停但财政补贴仍持续拨付，属于资源错配。满足任一条件即触发疑点，其中条件二为严重违规线索。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 农村养老机构建成后长期关停闲置
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第二十七条\",\n    \"内容概述\": \"养老机构暂停或者终止服务的，应当于暂停或者终止服务60日前，向备案的民政部门提交老年人安置方案，经书面审核同意后实施。未经批准不得擅自停业或者关闭。\"\n  }\n]"
- expression: (验收文件.规划用途 = '养老服务设施' || 土地证.土地性质 = '社会福利') && (登记表.实际用途 != '养老服务' && 登记表.实际用途 != '配套办公') && (审批表 IS NULL OR
    审批表.审批结果 != '同意')
  description: 原规划用途为养老服务设施，实际用途变为非养老服务（如出租商业、仓储、餐饮），且未取得合法用途变更审批，即构成违规改变房屋用途。若存在审批但审批流程不合规（如越权审批）也属违规。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 违规改变农村养老机构房屋用途
  regulation: "[\n  {\n    \"法规名称\": \"养老机构管理办法\",\n    \"法规文号\": \"民政部令第66号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第三十三条\",\n    \"内容概述\": \"养老机构应当依法保障收住老年人的合法权益，未经批准不得擅自改变养老服务设施的使用性质。任何组织或者个人不得侵占、挪用或者擅自拆除养老服务设施。\"\n  }\n]"
- expression: (合同协议 IS NULL) || (合同协议.保底收购价 IS NULL && 合同协议.二次分红条款 IS NULL) && (明细表.补贴项目要求带动的农户数 > 0)
  description: 享受财政扶持资金的合作社，未与农户签订任何协议，或协议中缺少保底收益、二次分红等核心联结条款，即判定机制缺失。尤其需关注与补贴项目要求背离的情况。
  audit_item: 新型经营主体运营管理不规范、效果不佳
  suspicion: 未建立利益联结分享机制
  regulation: "[\n  {\n    \"法规名称\": \"关于开展土地经营权入股发展农业产业化经营试点的指导意见\",\n    \"法规文号\": \"农经发〔2018〕4号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"三、主要任务（四）\",\n    \"内容概述\": \"要建立健全风险防范机制，鼓励探索‘保底收益+按股分红’等利益联结方式。\"\n  }\n]"
- expression: ( NOT EXISTS (SELECT 1 FROM 债务编号、债权人名称、债务金额、债务类型、入账日期) ) OR ( EXISTS ( SELECT 1 FROM 合同协议 WHERE ABS(合同协议.合同金额
    - (SELECT SUM(债务金额) FROM 债务编号、债权人名称、债务金额、债务类型、入账日期 WHERE 债权人名称 = 合同协议.债权人)) > 0.05 * 合同协议.合同金额 ) ) OR ( EXISTS ( SELECT
    1 FROM 使用凭证 LEFT JOIN 债务编号、债权人名称、债务金额、债务类型、入账日期 ON 使用凭证.对方户名 = 债务编号、债权
  description: 触发条件：1. 债权债务台账缺失或无记录；2. 抽样比对合同金额与台账记录的债务金额偏差超过5%；3. 筛选银行流水中单笔支出超5万元，且对方户名不在台账债权人清单中，表示可能存在未入账的隐性债务。满足任一条件即生成疑点。
  audit_item: 村级债务管理不规范
  suspicion: 村级债权债务台账数据账实不符
  regulation: "[\n  {\n    \"法规名称\": \"农业部关于进一步加强村级债务管理工作的通知\",\n    \"法规文号\": \"农经发〔2011〕3号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"要全面清理核实村级债务，摸清债务底数，建立台账，实行动态管理，确保债务数据真实完整。\"\n  }\n]"
- expression: (明细表.审批文件编号 IS NULL) OR (明细表.审批文件编号 IS NOT NULL AND 明细表.举债金额 > (SELECT MAX(单个项目审批限额) FROM 政策文件 WHERE 政策文件.审批权限要求
    = '村')) OR (合同协议.年利率 > (SELECT 利率上限 FROM 政策文件)) OR (EXISTS (SELECT 1 FROM 使用凭证 WHERE 使用凭证.债务编号 = 明细表.债务编号 AND 使用凭证.用途摘要
    NOT LIKE 明细表.举债用途))
  description: 违反新增债务管理规定的情形：1. 明细表中审批文件编号为空的，即无任何审批程序；2. 举债金额超过本级审批权限限额且未见上级批复；3. 借款合同年利率超过地方政府规定的上限（如12%）；4. 资金实际用途与申报用途明显不一致，通过比对银行流水摘要和审批用途字段，当相似度低于80%或出现大额公积金向个人账户转移时触发。满足任一条件即构成违规新增债务疑点。
  audit_item: 村级债务管理不规范
  suspicion: 未经审批程序违规新增村级债务
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于坚决制止发生新的乡村债务有关问题的通知\",\n    \"法规文号\": \"国办发〔2005〕39号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第一条、第三条\",\n    \"内容概述\": \"严禁发生新的乡村债务，特殊情况确需举债的必须经村民会议或村民代表会议讨论决定，并报乡镇政府审核；严禁高息借债。\"\n  },\n  {\n \
    \   \"法规名称\": \"中华人民共和国村民委员会组织法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十四条\",\n    \"内容概述\"\
    : \"涉及村"
- expression: ( (进度表.计划还款金额 - 进度表.实际还款金额) / 进度表.计划还款金额 > 0.2 ) OR (进度表.化解状态 = '已化解' AND NOT EXISTS (SELECT 1 FROM 使用凭证 WHERE
    使用凭证.收款户名 = 进度表.债权人 AND 使用凭证.付款金额 >= 进度表.实际还款金额 AND 使用凭证.付款时间 <= 进度表.还款日期)) OR ( ABS(进度表.实际还款金额 - (SELECT SUM(付款金额) FROM
    使用凭证 WHERE 收款户名 = 进度表.债权人 AND 用途摘要 LIKE '%化债%')) > 1000 )
  description: 判定逻辑：1. 当期（或累计）还款计划完成率低于80%即视为化解进度严重滞后；2. 台账标记“已化解”但在债务人银行流水中找不到向原债权人支付化债资金记录，构成虚假化债；3. 实际支付金额与台账记录还款额偏差超过1000元且无法提供正当理由，疑似化债资金被截留或挪用。满足任一条件视为化债不到位。
  audit_item: 村级债务管理不规范
  suspicion: 旧债化解进度缓慢或虚假化债
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于坚决制止发生新的乡村债务有关问题的通知\",\n    \"法规文号\": \"国办发〔2005〕39号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"要积极稳妥地化解乡村债务，建立偿债机制，逐年消化旧债，严禁借新债还旧债。\"\n  },\n  {\n    \"法规名称\": \"农业部关于进一步加强村级债务管理工作的通知\"\
    ,\n    \"法规文号\": \"农经发〔2011〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"要制定切实可行的化债"
- expression: (债券资金使用台账.收款方 NOT IN (项目合同协议.合同供应商名称) AND 债券资金使用台账.金额 > 100000) OR 债券资金使用台账.用途 NOT LIKE '%保障%'
  description: 单笔支出金额超过10万元且收款方非项目合同签约供应商，或支出用途未包含保障性安居工程关键词（如保障、安居、棚改），均判定为挪用。
  audit_item: 保障性安居工程企业债券使用不合规
  suspicion: 债券资金被挪用于非保障性安居工程项目
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强企业债券存续期监管工作有关问题的通知\",\n    \"法规文号\": \"发改办财金〔2011〕1765号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、（一）\",\n    \"内容概述\": \"企业债券募集资金必须严格按照募集说明书披露的用途使用，严禁挪作他用。\"\n  }\n]"
- expression: 债券资金使用台账.收款方 IN (关联方清单.关联企业名称) && (合同协议.合同服务内容 IS NULL || 合同协议.合同金额 / 市场公允价 > 1.5 || 合同协议.验收确认日期 IS NULL)
  description: 当收款方为关联企业，且对应合同无实质性服务内容、或合同价格超出市场公允价50%以上、或无成果验收记录，即认定为无商业实质的关联交易，目的在于转移债券资金。
  audit_item: 保障性安居工程企业债券使用不合规
  suspicion: 通过虚构关联交易转移债券资金
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强企业债券存续期监管工作有关问题的通知\",\n    \"法规文号\": \"发改办财金〔2011〕1765号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"二、（一）\",\n    \"内容概述\": \"严禁通过关联交易、虚构交易等方式变相挪用或抽逃债券资金。\"\n  }\n]"
