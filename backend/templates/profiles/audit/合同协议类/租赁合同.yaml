violations:
- expression: (数据.申报作物类型 NOT IN ('水稻','小麦','玉米','大豆','薯类'等粮食作物)) && (审批文件.非粮化审批批准文件 IS NULL) && (数据.地块现状影像)
  description: 在划定的粮食主产区高标准农田内，种植非粮食作物且无合法审批手续，判定为“非粮化”违规。非粮食作物包括苗木、花卉、果树、草皮、鱼塘等。
  audit_item: 违反高标农田建后管护及使用规定的行为
  suspicion: 粮食主产区高标准农田“非粮化”
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于防止耕地“非粮化”稳定粮食生产的意见\",\n    \"法规文号\": \"国办发〔2020〕44号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"二（四）\",\n    \"内容概述\": \"永久基本农田重点用于发展粮食生产，特别是保障稻谷、小麦、玉米三大谷物的种植面积。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\"\
    ,\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十三条\",\n    \"内容概述\": \"国家保护耕地，严格控制耕地转为非耕地……禁止占用永"
- expression: (空置房源统计表.累计空置时长（天） > 365) && (空置房源清单.空置原因说明 NOT IN ('合理装修期','合理轮候期','维修保养期','政策预留期'))
  description: 筛查累计空置天数超过365天且空置原因不属于合理情形的房源，合理空置情形需有明确制度或官方文件依据，如装修期（一般不超过3个月）、轮候期等。累计空置时长由交付可达入住状态日期至分配或实际入住日期计算，若仍未分配则计算至审计基准日。表达式区分刻意闲置与非正常管理滞后，阈值365天依据住房城乡建设部关于竣工后1年内完成分配的要求。
  audit_item: 公共租赁住房未按规定及时分配入住形成空置
  suspicion: 已竣工验收公租房空置超1年未分配
  regulation: "[\n  {\n    \"法规名称\": \"住房城乡建设部办公厅关于加快公共租赁住房分配入住的通知\",\n    \"法规文号\": \"建办保函〔2015〕212号\",\n    \"效力级别\": \"\
    部门规范性文件\",\n    \"条款号\": \"二、加快分配入住\",\n    \"内容概述\": \"各地要对已竣工的公共租赁住房项目，抓紧制定分配方案，尽快分配入住，原则上要在竣工后1年内完成分配。\"\n  },\n  {\n\
    \    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十条\",\n  \
    \  \"内容概"
- expression: 租金收取台账.银行流水.收款账户名称 != '财政非税收入汇缴专户' && 租金收取台账.银行流水.收款账户名称 != '单位基本户'
  description: 筛查实际收取租金的银行账户，既非财政指定的非税收入汇缴专户，也非单位经批准的对公基本户，而是流入工会账户、协会账户、个人账户等。只要收款账户主体异常，即触发疑点。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 租金收入存入自有账户或私设小金库
  regulation: "[\n  {\n    \"法规名称\": \"《政府非税收入管理办法》\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条 及 第十八条\",\n    \"内容概述\": \"非税收入应当由执收单位按照规定征收，并全额上缴国库，实行收支两条线管理。非税收入的收缴和清分，应当通过国库单一账户体系或者财政专户进行。任何单位和个人不得隐匿、截留、坐支和挪用非税收入。\"\
    \n  },\n  {\n    \"法规名称\": \"《财政违法行为处罚处分条例》\",\n    \"法规文号\": \"中华人民共和国国务院令第427号\",\n    \"效力级别\": \"行"
- expression: 租金收取台账.代收企业代收台账.缴纳日期 + 30天 < 非税收入缴款书.国库入账日期 && 租金收取台账.实收金额 > 0
  description: 设定一般缴库时限为30天（结合地方规定调整）。若代收企业收到租金之日起超过30天才上缴财政，且在此期间相关资金滞留在代收企业账户或单位归集户中形成大额沉淀余额，则判定为滞留非税收入。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 租金收入长期滞留代收企业未上缴
  regulation: "[\n  {\n    \"法规名称\": \"《政府非税收入管理办法》\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十条\",\n    \"内容概述\": \"执收单位应当加强非税收入征收管理，依照规定的范围和标准及时足额征收，并按照规定的时限和缴库方式，及时足额将非税收入缴入国库或者财政专户，不得多征、提前征收或者减征、免征、缓征非税收入。\"\
    \n  },\n  {\n    \"法规名称\": \"《中华人民共和国国家金库条例》\",\n    \"法规文号\": \"国发〔1985〕96号\",\n    \"效力级别\": \"行政法规\",\n    \"条"
- expression: 租赁合同.月租金标准 != 非税收入缴款书.国库实际入账金额 / 月份数 && (租金收取台账.第三方支付平台流水.扣款项名称 LIKE '%手续费%' || 租金收取台账.第三方支付平台流水.扣款项名称 LIKE
    '%服务费%')
  description: 比对租户应缴的月租金标准与最终缴入国库的非税收入金额，若存在差异，且差异金额在缴费渠道流水（如微信、支付宝、银联）中体现为被扣除的“手续费”、“平台服务费”、“管理费”等，即判定为违规截留。非税收入应全额上缴，代收成本应由财政预算另行安排，不得从中扣除。
  audit_item: 公共租赁住房（含廉租住房）租金收入未上缴国库实行收支两条线管理
  suspicion: 以手续费等名义截留部分租金
  regulation: "[\n  {\n    \"法规名称\": \"《政府非税收入管理办法》\",\n    \"法规文号\": \"财税〔2016〕33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十八条\",\n    \"内容概述\": \"除财政部另有规定外，执收单位不得擅自将非税收入分成或者转移。非税收入应当全额上缴国库，任何单位和个人不得截留、坐支、挪用。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政部关于加强政府非税收入管理的通知\",\n    \"法规文号\": \"财综〔2004〕53号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三点（规范征收行为）\",\n  \
    \  \"内容概"
- expression: （欠缴台账.欠费月数 >= 6） && （凭证表.收款金额 != 欠缴台账.应收金额 或 缴费记录缺失）
  description: 承租人连续欠费达6个月及以上，且银行实际到账金额与应收金额不符或无缴费记录，符合严重违规。本表达式以《公共租赁住房管理办法》规定的无正当理由连续6个月未缴纳租金为阈值，需结合银行流水排除台账错漏。
  audit_item: 承租人未按照规定缴纳公共租赁住房租金
  suspicion: 承租人长期拖欠公共租赁住房租金
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条、第三十一条\",\n    \"内容概述\": \"承租人应当根据合同约定按时交纳租金；无正当理由连续6个月以上未缴纳租金的，应当腾退公共租赁住房，并记入管理档案。\"\n  }\n]"
- expression: SUM(欠缴台账.实收月金额) < SUM(欠缴台账.应收月金额) && (SUM(欠缴台账.应收月金额)-SUM(欠缴台账.实收月金额))/SUM(欠缴台账.应收月金额) > 0.2
  description: 按月汇总对比，若承租人实际缴纳总额小于应收总额，且差额比例超过20%（即不足额缴纳达显著程度），判定为违规。20%阈值可根据当地欠费容忍度调整，连续数月差额稳定存在则疑点升级。
  audit_item: 承租人未按照规定缴纳公共租赁住房租金
  suspicion: 承租人部分缴纳或不足额缴纳租金
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十九条\",\n    \"内容概述\": \"承租人应当根据合同约定按时交纳租金，不得少缴或拖欠。承租人未按规定缴纳租金的，住房保障主管部门可责令其限期缴纳。\"\n  }\n]"
- expression: 租赁合同.合同截止日期 < 当前系统日期 AND 登记表.退租状态 != '已退租' AND (欠缴台账.合同期满后各月应收/实收记录 == 0 或 无缴纳记录) AND 房屋使用状态记录.当前状态 == '占用'
  description: 合同到期但未办退租且仍占用房屋，同时没有为占用期间缴纳租金，构成非法占用公共租赁住房。表达式需结合房屋使用状态确认实际占用，防止系统未更新退租状态导致误判。
  audit_item: 承租人未按照规定缴纳公共租赁住房租金
  suspicion: 租赁合同到期后拒不搬离且未缴纳租金
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十一条\",\n    \"内容概述\": \"承租人有下列情形之一的，应当腾退公共租赁住房：……无正当理由连续6个月以上未缴纳租金，经催告后仍不支付的；……不再符合保障条件，应当腾退。租赁期满未续租且不符合续租条件的，应及时腾退。\"\
    \n  }\n]"
- expression: 同一承租人信息登记表.房屋编号下，承租人变更记录 >= 2 && (同户户籍关系 == '无' 或 变更记录 < 6个月 ) && 欠缴台账.欠费金额 > 0
  description: 同一房源短期内多次变更承租人姓名，且前后承租人无亲属关系或变更间隔极短，同时该房屋存在累计欠费未清，疑似通过“换人签约”方式规避欠费追缴和黑名单管理。无亲属关系及短间隔为强化特征。
  audit_item: 承租人未按照规定缴纳公共租赁住房租金
  suspicion: 通过频繁变更承租人规避欠费追缴
  regulation: "[\n  {\n    \"法规名称\": \"公共租赁住房管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十七条\",\n    \"内容概述\": \"承租人不得擅自调换所承租公共租赁住房；承租人之间互换租赁住房的，应向产权单位提出书面申请，经同意后方可互换。利用虚假信息变更承租人以逃避租金义务属于违规行为。\"\n  }\n\
    ]"
- expression: (统计表.缴费户名 != 租赁合同.承租人姓名) || (缴纳记录.缴纳单位地址 != 房屋地址 && 缴纳月份 >= 6) || (申报记录.申报单位地址 != 房屋地址 && 申报月份 >= 6) || (检查记录.实际居住人姓名
