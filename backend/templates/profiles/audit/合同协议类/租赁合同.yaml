name: audit/合同协议类/租赁合同
type: model
description: 从合同协议类类文档（租赁合同）中提取结构化元数据。涵盖字段如：入住时间、出租物业名称、合同截止日期、合同约定月租金标准、合同约定种植类型、合同编号、房号、房屋地址。文档范围包括：入住确认书或租赁合同、公共租赁住房租赁合同、土地租赁合同、租赁合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 租赁合同
  member_count: 1
  member_details:
  - 入住确认书或租赁合同
  - 公共租赁住房租赁合同
  - 土地租赁合同
  - 租赁合同
output:
  fields:
  - name: 入住时间
    type: date
    description: 提取 入住时间 的日期值，格式 YYYY-MM-DD
  - name: 出租物业名称
    type: string
    description: 提取 出租物业名称 的文本值
  - name: 合同截止日期
    type: date
    description: 提取 合同截止日期 的日期值，格式 YYYY-MM-DD
  - name: 合同约定月租金标准
    type: string
    description: 提取 合同约定月租金标准 的文本值
  - name: 合同约定种植类型
    type: string
    description: 提取 合同约定种植类型 的文本值
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 房号
    type: string
    description: 提取 房号 的文本值
  - name: 房屋地址
    type: string
    description: 提取 房屋地址 的文本值
  - name: 房源编号
