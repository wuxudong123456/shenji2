  - name: 承租人姓名及房号
    type: string
    description: 提取 承租人姓名及房号 的文本值
  - name: 承租方
    type: string
    description: 提取 承租方 的文本值
  - name: 支付周期
    type: string
    description: 提取 支付周期 的文本值
  - name: 是否允许非粮经作
