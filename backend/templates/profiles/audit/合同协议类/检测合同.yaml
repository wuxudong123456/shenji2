name: audit/合同协议类/检测合同
type: model
description: 从合同协议类类文档（检测合同）中提取结构化元数据。涵盖字段如：合同约定的检测范围、检测项目清单。文档范围包括：检测合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 项目
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 检测合同
  member_count: 1
  member_details:
  - 检测合同
output:
  fields:
  - name: 合同约定的检测范围
    type: string
    description: 提取 合同约定的检测范围 的文本值
  - name: 检测项目清单
    type: string
    description: 提取 检测项目清单 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (检测合同.合同约定的检测范围 包含 '斜拉索/吊杆/系杆/钢结构节点/橡胶支座' && 检测报告.检测结论 不包含 对应构件) || (检测报告.实际检测部位清单 不包含 结构受力特性、结构易损性部位、桥梁结构类型、特殊构件设计详图（如斜拉索、吊杆、支座）.特殊构件设计详图（如斜拉索、吊杆、支座）)
  description: 针对缆索承重体系或特殊结构桥梁，常规表观检查无法涉及其核心受力构件。若合同约定或规范要求必须检查，而检测报告无对应构件的任何数据，判定为实质性缺项。
  audit_item: 道路桥梁安全定期检测审计
  suspicion: 特殊结构部位检测缺项
  regulation: "[\n  {\n    \"法规名称\": \"公路桥涵养护规范\",\n    \"法规文号\": \"JTG 5120-2021\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\"\
    : \"4.4.2\",\n    \"内容概述\": \"定期检查应根据桥梁结构类型，对桥面系、上部结构、下部结构和附属设施的所有构件进行详细检查。对于缆索、吊杆、支座等特殊构件，应作为重点检查内容。\"\n  },\n  {\n \
    \   \"法规名称\": \"公路桥梁技术状况评定标准\",\n    \"法规文号\": \"JTG/T H21-2011\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"4.1.5\",\n\
    \    \"内容概"
