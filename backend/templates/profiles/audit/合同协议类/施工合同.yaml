violations:
- expression: COUNT(审批台账.所有变更编号 GROUP BY 同一分部分项工程) > 1 && SUM(审批台账.累计变更金额) > 施工合同.合同金额*10% && MAX(审批台账.单次变更金额) < (施工合同.合同金额*10%*0.9)
  description: 对同一施工部位或分部分项在短期内多次申报小金额变更，每笔均低于合同价10%的审批门槛，但累计总额超过合同价10%，属于化整为零规避专项审批或重新招标。若单次变更金额均控制在限额的90%以下，且时间间隔小于30天，疑点等级为高。
  audit_item: 工程变更审计评估
  suspicion: 将同一变更项目化整为零规避招标或审批
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"中华人民共和国主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n   \
    \ \"法规文号\": \"国家发展和改革委员会令第16号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第五条\",\n    \"内容概述\": \"本规定第二条至第四条规定范围内的项目，其勘察、设计、施工"
- expression: 明细表.实际交付日期 IS NOT NULL AND (验收报告.验收日期 IS NULL OR 明细表.实际交付日期 < 验收报告.验收日期)
  description: 若项目存在明确的交付使用记录（如交房、移交物业等），但竣工验收报告显示验收日期在交付之后或根本没有组织竣工验收，则构成未组织验收擅自交付的违规行为。同时，若尾款支付日期早于验收日期，也可作为交付迹象辅助判定。
  audit_item: 建设项目初步设计概算投资超过可研批准估算%及以上未报告审批部门
  suspicion: 建设工程竣工后未组织验收擅自交付使用
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十六条\",\n    \"内容概述\": \"建设单位收到建设工程竣工报告后，应当组织设计、施工、工程监理等有关单位进行竣工验收。建设工程经验收合格的，方可交付使用。\"\n  }\n]"
- expression: (环评批复日期.实际开工日期 IS NOT NULL) && (环评批复日期.环评批复日期 IS NULL || 环评批复日期.实际开工日期 < 环评批复日期.环评批复日期)
  description: 当项目存在明确的实际开工日期，但环评批复文件缺失，或实际开工日期早于环评批复日期时，判定为未批先建，触发违规。日期比较精确到日，无容差。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得环评批复擅自开工建设
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国环境影响评价法\",\n    \"法规文号\": \"中华人民共和国主席令第24号（2018修正）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第二十五条、第三十一条\",\n    \"内容概述\": \"建设项目的环境影响评价文件未依法经审批部门审查或者审查后未予批准的，建设单位不得开工建设。未批先建的，由县级以上生态环境主管部门责令停止建设，根据违法情节和危害后果处以罚款，并可责令恢复原状。\"\
    \n  }\n]"
- expression: (对照表.实际开工日期 IS NOT NULL) && (对照表.施工许可证发证日期 IS NULL || 对照表.实际开工日期 < 对照表.施工许可证发证日期 || 施工合同.首笔工程款支付日期 < 对照表.施工许可证发证日期)
  description: 实际开工日期或首笔工程款支付日期早于施工许可证发证日期，或者施工许可证缺失但已开工，均构成违规。该表达式不考虑短时间容差，任何时序倒置即判定。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得施工许可证擅自施工或先开工后办证
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"中华人民共和国主席令第29号（2019修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第七条、第六十四条\",\n    \"内容概述\": \"建筑工程开工前，建设单位必须申请领取施工许可证（特定小型工程除外）。未取得施工许可证擅自施工的，责令改正，并处罚款。\"\n  },\n  {\n\
    \    \"法规名称\": \"建筑工程施工许可管理办法\",\n    \"法规文号\": \"住房和城乡建设部令第18号（2018修正）\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二条、第十二条\""
- expression: (日志.实际开工日期 IS NOT NULL) && (对照表.开工报告批复日期 IS NULL || 日志.实际开工日期 < 对照表.开工报告批复日期)
  description: 对于法规规定必须取得开工报告的项目，若实际开工日期早于开工报告批复日期，或未取得批复即开工，则判定违规。该表达式要求开工报告批复日期必须存在且不晚于实际开工日期。
  audit_item: 建设项目违规开工或违规建设
  suspicion: 未取得开工报告擅自开工
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"中华人民共和国主席令第29号（2019修正）\",\n    \"效力级别\": \"法律\",\n \
    \   \"条款号\": \"第七条\",\n    \"内容概述\": \"按照国务院规定的权限和程序批准开工报告的建筑工程，不再领取施工许可证。此类项目必须获得开工报告批准方可开工建设。\"\n  },\n  {\n    \"法规名称\"\
    : \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十条、第三十三条\",\n    \"内容概述\": \"政府投资项目开工建"
- expression: (合同签订日期 > 批准开工日期) && (批准开工日期 - 合同签订日期 > 30天) || (合同签订日期 > 中标通知书发出时间 + 30天)
  description: 违反招标文件和中标通知书中关于合同签订时限的规定。通常规定中标通知书发出后30日内签订合同。若合同签订日期晚于监理或业主批准的开工日期，且超出30天或法定签订时限，则判定为'先干后签'违规。30天为常用行业阈值，可结合具体招标文件条款调整。
  audit_item: 某公共建筑合同履行审
  suspicion: 先干后签，倒签施工合同
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。\"\n  }\n]"
- expression: 对同一项目中，存在多个施工合同且每个合同金额低于必须招标限额，但合计金额超过限额，且各合同施工内容属于同一概算项下的可独立发包单元，即（(合同1.合同金额 + 合同2.合同金额 + ...) > 必须招标限额) &&
    各合同.施工范围在功能上紧密相连 && 各合同.签约日期相近(30天内) && 中标通知书.招标方式 != '公开招标'
  description: 必须招标限额通常为施工单项合同估算价400万元（按国家现行规定）。当多个关联合同金额总和超过限额，但均未采用公开招标而是直接发包或邀请招标，且合同签订时间集中、内容关联，即判定为涉嫌肢解工程规避招标。
  audit_item: 重大工程项目全过程审计
  suspicion: 通过不合理划分标段或肢解工程规避招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第86号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条、第四十九条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。违反本法规定，将必须进行招标的项目化整为零或者以其他任何方式规避招标的，责令限期改正，可以处项目合同金额千分之五以上千分之十以下的罚款。\"\
    \n  },\n  {\n    \"法规名称\": \"必须招标的工程项目规定\",\n    \"法规文号\": \"国家发展改革委令第16号\",\n    \"效力级别\": \"部门"
- expression: 正式施工合同.结算方式 != 招标文件.结算方式 || 正式施工合同.质量标准 != 招标文件.质量标准 || ABS(正式施工合同.工期 - 中标通知书.承诺工期) > 可接受偏差 || 补充协议中对付款条件或违约责任作出有利于承包人的重大修改
  description: 对比正式合同与招标文件、中标通知书中的实质性内容（价款、工期、质量等），若出现结算方式改变、工期放宽、质量标准降低或付款条件优待化等情况，则构成背离。实质性条款更改即触发，工期差异若大于合同约定可调整范围（如15天）作为警示。
  audit_item: 重大工程项目全过程审计
  suspicion: 中标合同与招标文件实质性条款不符背离
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法实施条例\",\n    \"法规文号\": \"国务院令第613号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第五十七条\",\n    \"内容概述\": \"招标人和中标人应当依照招标投标法和本条例的规定签订书面合同，合同的标的、价款、质量、履行期限等主要条款应当与招标文件和中标人的投标文件的内容一致。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\
    \n  }\n]"
- expression: 实际开工报告或监理日志.实际开工日期 > 施工合同.合同约定开工日期 && (延期审批文件.审批状态或审批意见 != '同意' || 延期审批文件 IS NULL)
  description: 实际开工日期晚于合同约定开工日期，且未取得有效的延期审批同意，即构成项目未按时开工违规。行业一般容忍偏差为0天，若存在特殊客观原因且已获批延期，则不视为违规。
  audit_item: 不符合高标准农田建设相关规定的行为
