    ,\n    \"内容概述\": \"政府投资项目应当按照国家有关规定合理确定并严格执行建设工期，任何单位和个人不得非法干预。项目单位应当加强项目管理，保证项目按期建成。\"\n  },\n  {\n    \"法规名称\": \"中央预算内投资补助和贴息项目管理办法\"\
    ,\n    \"法规文号\": \"国家发展改革委令2016年第45号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十二条\",\n    \"内容概述\""
