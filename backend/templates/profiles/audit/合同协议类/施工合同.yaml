  description: 当关键设施（如人工鱼礁混凝土强度、沟渠宽度）实测值低于标准值的90%，或偏差率超过15%，或建成面积严重缩水（低于设计95%）时，判定为建设质量不达标。缺陷严重程度可按偏差值进一步分级。
  audit_item: 水产养殖补助项目建设运营管护不合规
  suspicion: 水产养殖补助项目建设质量不达标
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号（2019年修订）\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第二十八条、第六十四条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。违反本条例规定，施工单位在施工中偷工减料的，责令改正，处工程合同价款2%以上4%以下的罚款。\"\
    \n  },\n  {\n    \"法规名称\": \"海洋牧场建设技术规范\",\n    \"法规文号\": \"SC/T 9401-2010\",\n    \"效力级别\": \"行业规范\",\n"
- expression: (公开内容缺少`年度建设计划` OR 缺少`补助标准` OR 缺少`资金来源`) OR (公示照片 IS NULL) OR (核查表.村民代表签字数量 < 应签字人数的50%)
  description: 七公开包括年度计划、补助政策、资金来源、招标投标、施工管理、质量监督、竣工验收七项内容。任何一项缺失或公示文件不实、群众未参与，均视为未落实制度。
  audit_item: 项目建设不符合规定
