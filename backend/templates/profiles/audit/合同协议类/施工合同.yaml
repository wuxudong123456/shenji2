    \ \"第二十八条\",\n    \"内容概述\": \"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。\"\n  }\n]"
- expression: (对比表.累计拨付金额 > 对比表.应拨付金额) || (明细表.收款方名称 != 施工合同.承包方名称 && 明细表.金额 > 50000) || (审批文件.变更金额 / 批复文件.批复资金总额 > 0.1 &&
    益户清单.实际入户安装量 < 益户清单.受益户数 * 0.95) || (拨付凭证.拨付日期 < 对比表.累计实际进度百分比)
