- expression: 实际完工报告或竣工验收报告.实际完工日期 > 施工合同.合同约定完工日期 && (延期审批文件.审批状态或审批意见 != '同意' || 延期审批文件 IS NULL)
  description: 实际完工日期晚于合同约定完工日期，且无有效延期审批，即构成未按期完工违规。工期延误可能导致工程错过农时、影响验收和资金拨付，风险较高。
  audit_item: 不符合高标准农田建设相关规定的行为
  suspicion: 项目未按期完工
  regulation: "[\n  {\n    \"法规名称\": \"农田建设项目管理办法\",\n    \"法规文号\": \"农业农村部令2019年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十八条\",\n    \"内容概述\": \"项目建设单位应当严格按照项目实施计划组织项目实施，按期完成任务。\"\n  }\n]"
- expression: (村级建设项目筹资台账.项目名称 NOT IN (村民会议记录.讨论通过的项目名称)) || ((村级财务收支明细表.支出摘要 IN ('差旅费','餐饮费','办公费')) && (SUM(村级财务收支明细表.金额)
