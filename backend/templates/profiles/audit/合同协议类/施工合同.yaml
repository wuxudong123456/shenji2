  description: 工程检测报告中任意一项关键质量指标不合格，直接判定工程质量差；或已发现质量缺陷但整改逾期未闭环超过30天的，视为建设标准低、整改不及时。
  audit_item: 国家种子生产基地建设方面不符合相关规定
