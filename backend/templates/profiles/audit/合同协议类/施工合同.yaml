name: audit/合同协议类/施工合同
type: model
description: 从合同协议类类文档（施工合同）中提取结构化元数据。涵盖字段如：人工费用约定条款、付款条件、信息化建设合同签订及完工日期、关键里程碑节点及完成时间、厚度等技术指标、变更条款约定、合同价款构成、合同单价。文档范围包括：侵蚀沟治理工程施工合同、基地工程项目施工合同、建设项目施工合同、施工合同、正式施工合同、项目施工合同、食堂建设施工合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 合同
- 工程
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 施工合同
  member_count: 1
  member_details:
  - 侵蚀沟治理工程施工合同
  - 基地工程项目施工合同
  - 建设项目施工合同
  - 施工合同
  - 正式施工合同
  - 项目施工合同
  - 食堂建设施工合同
