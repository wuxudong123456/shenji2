    \ \"内容概述\":"
- expression: (对比表.计划竣工日期 < 当前审计基准日) && (对比表.实际竣工日期 IS NULL || 对比表.实际竣工日期 > 对比表.计划竣工日期+180天) && (对比表.实际完成百分比 < 80%) && (明细台账.资金到位时间
