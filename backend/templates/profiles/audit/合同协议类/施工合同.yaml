  regulation: "[\n  {\n    \"法规名称\": \"关于推进“四好农村路”建设的意见\",\n    \"法规文号\": \"国办发〔2014〕25号\",\n    \"效力级别\": \"制度文件\",\n   \
    \ \"条款号\": \"无具体条款号，但明确要求\",\n    \"内容概述\": \"要求推行农村公路建设“七公开”制度，即年度建设计划公开、补助政策公开、资金来源公开、招标投标公开、施工管理公开、质量监督公开、竣工验收公开，主动接受社会监督。\"\
    \n  }\n]"
