name: audit/合同协议类/买卖合同
type: model
description: 从合同协议类类文档（买卖合同）中提取结构化元数据。涵盖字段如：买方信息、产权取得日期。文档范围包括：房屋买卖合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 买卖合同
  member_count: 1
  member_details:
  - 房屋买卖合同
output:
  fields:
  - name: 买方信息
    type: string
    description: 提取 买方信息 的文本值
  - name: 产权取得日期
    type: date
    description: 提取 产权取得日期 的日期值，格式 YYYY-MM-DD
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (明细表.交易日期 - 时间表.购买日期（合同备案日/产权登记日）) < 5年 && 登记表.限制标记（是否限制上市） = '限制上市'
  description: 判定交易过户日期与保障房购买取得日期（以产权登记或合同备案较早者为准）间隔是否不足5年，同时产权限制登记仍为限制状态，两者均满足则视为未满5年违规上市交易。5年按1825天计算，可容差1天。若限制标记已解除但实际年限未满仍视为违规，表达式可简化为ABS(交易日期-取得日期)<1825。
  audit_item: 经济适用住房和限价商品住房违规上市交易
  suspicion: 经济适用住房未满5年违规上市交易
  regulation: "[\n  {\n    \"法规名称\": \"经济适用住房管理办法\",\n    \"法规文号\": \"建住房[2007]258号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十条\",\n    \"内容概述\": \"购买经济适用住房不满5年，不得直接上市交易。购房人因特殊原因确需转让的，由政府按照原价格并考虑折旧和物价水平等因素进行回购。\"\n  }\n]"
