name: audit/合同协议类/出让合同
type: model
description: 从合同协议类类文档（出让合同）中提取结构化元数据。涵盖字段如：付款时间要求、出让时间、受让人、合同条款、土地取得方式、土地用途、地块编号、拆迁责任条款。文档范围包括：土地使用权出让合同、土地出让合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 合同
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 出让合同
  member_count: 1
  member_details:
  - 土地使用权出让合同
  - 土地出让合同
output:
  fields:
  - name: 付款时间要求
    type: date
    description: 提取 付款时间要求 的日期值，格式 YYYY-MM-DD
  - name: 出让时间
    type: date
    description: 提取 出让时间 的日期值，格式 YYYY-MM-DD
  - name: 受让人
    type: string
    description: 提取 受让人 的文本值
  - name: 合同条款
    type: number
    description: 提取 合同条款 的数值（含单位，如万元、吨等）
  - name: 土地取得方式
    type: string
    description: 提取 土地取得方式 的文本值
  - name: 土地用途
    type: string
    description: 提取 土地用途 的文本值
  - name: 地块编号
    type: string
    description: 提取 地块编号 的文本值
  - name: 拆迁责任条款
    type: number
    description: 提取 拆迁责任条款 的数值（含单位，如万元、吨等）
  - name: 无偿代建内容
    type: string
    description: 提取 无偿代建内容 的文本值
  - name: 禁止性条款
    type: number
    description: 提取 禁止性条款 的数值（含单位，如万元、吨等）
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 约定土地用途
    type: string
    description: 提取 约定土地用途 的文本值
  - name: 约定容积率
    type: string
    description: 提取 约定容积率 的文本值
  - name: 附加产业配套条款
    type: number
    description: 提取 附加产业配套条款 的数值（含单位，如万元、吨等）
  - name: 首付比例
    type: number
    description: 提取 首付比例 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (对比表.合规性判断 == '不合规' && 对比表.违规类型 == '与项目无关的资质要求') && (信息表[地块编号].竞买人数量 < 3)
  description: 当资质条件设置与政策要求对比表判定资质要求不合规且违规类型确认为无关资质，同时该地块符合条件的竞买人少于3家，表明竞争受限，触发违规疑点。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 设置与项目无关的资质要求
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让人在招标拍卖挂牌出让公告中不得设定影响公平、公正竞争的限制条件。\"\n  },\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有土地使用权规范\"\
    ,\n    \"法规文号\": \"国土资发〔2006〕114号\",\n    \"效力级别\": \"行业规范\",\n    \"条款号\": \"第5.4.2条\",\n    \"内容概述\": \"竞买资格条件不得设置要求特定行业、特"
- expression: (保证金与起始价比对表.保证金比例 > 0.5) && (信息表[地块编号].是否缴纳保证金 < 3 || 存在放弃竞买记录) || (出让合同.付款时间要求 <= 3个自然日  && 出让合同.首付比例 == 1.0
    && 竞买人报名数量 == 1)
  description: 保证金比例超过50%（远高于常规的20%）或要求成交后3日内一次性付清全部出让金，且出现大量弃购或唯一竞买人情形的，判定为通过资金门槛操纵排斥竞争。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 操纵保证金或付款条件
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让公告不得设定影响公平竞争的其他条件，包括通过不合理的保证金或付款要求限制竞买人。\"\n  },\n  {\n    \"法规名称\": \"关于落实工业用地招标拍卖挂牌出让制度有关问题的通知\"\
    ,\n    \"法规文号\": \"国土资发〔2007〕78号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条第（三）款\",\n    \"内容概述\": \"竞买"
- expression: 对比表.违规类型 == '违规产业配套' && (出让合同.附加产业配套条款 == '无偿代建内容' > 0.3 * 清单表.出让起始价 || 出让合同.合同条款 == '附加产业配套条款') && (出让合同.地块编号
    == '受让人'.地块编号 < 3)
  description: 住宅或商服用地上强制要求无偿代建大型公共设施或引进世界500强总部等，若代建成本超过土地起始价的30%或产业要求明显超出地块辐射能力且无合理政策依据，导致报名少于3家，则构成利用附加条件限制竞争。
  audit_item: 违反建设管理相关政策规定-土地招拍挂活动中违规设置限制条件
  suspicion: 违规设置产业配套要求
  regulation: "[\n  {\n    \"法规名称\": \"招标拍卖挂牌出让国有建设用地使用权规定\",\n    \"法规文号\": \"国土资源部令第39号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第十一条\",\n    \"内容概述\": \"出让公告不得设定影响公平竞争的限制条件，附加不合理产业配套要求实质上提高了进入门槛。\"\n  },\n  {\n    \"法规名称\": \"节约集约利用土地规定\"\
    ,\n    \"法规文号\": \"国土资源部令第61号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"不得以招商引资等名义先行圈占土地，不得违背公平竞"
- expression: (许可证.容积率 < 1.0 && 其他.实际建设形态 IN ('独栋别墅', '联排别墅')) || (出让合同.禁止性条款 LIKE '%禁止别墅%' && 许可证.建筑密度 < 30%)
  description: 容积率低于1.0且实际建筑形态为独栋或联排别墅，或土地出让合同明确禁止别墅开发而实际建筑密度低于30%，视为违规建设别墅。以‘康养社区’、‘颐养中心’等名义报批但实际建成低密独栋住宅的，均属此类。
  audit_item: 未按规定落实去库存政策措施
  suspicion: 以虚假名义违规建设别墅类项目
  regulation: "[\n  {\n    \"法规名称\": \"关于发布实施《限制用地项目目录（2012年本）》和《禁止用地项目目录（2012年本）》的通知\",\n    \"法规文号\": \"国土资发〔2012〕98号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"《禁止用地项目目录》中“别墅类房地产开发项目”\",\n    \"内容概述\": \"禁止用地项目目录明确将别墅类房地产开发项目列为禁止用地项目，任何单位不得批准供地。\"\
    \n  }\n]"
- expression: ((核查表.实际用途 != 出让合同.约定土地用途) && (核查表.实际用途 != 许可证.许可土地用途)) && (批复文件.批复文号 IS NULL || 批复文件.批准变更用途 != 核查表.实际用途)
  description: 实际核查用途既不符合土地出让合同约定，也不符合规划许可证许可，且未取得合法的政府批准变更文件，或批准用途与实际用途仍不一致时，判定为违规改变用途。触发条件为合同、规划、实际三者不一致且无有效审批。
  audit_item: 未经批准改变土地用途、性质或容积率
  suspicion: 未经批准擅自改变土地实际用途
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第32号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第五十六条\",\n    \"内容概述\": \"建设单位使用国有土地应按照合同约定或批准文件的规定使用土地；确需改变土地建设用途的，应经自然资源主管部门同意，并报原批准用地的人民政府批准。\"\n  },\n  {\n\
    \    \"法规名称\": \"中华人民共和国城市房地产管理法\",\n    \"法规文号\": \"主席令第18号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十八条\"\
    ,\n  "
- expression: ((出让合同.土地取得方式（划拨/出让） == '划拨') && (存在转让行为) && (缴纳凭证.缴纳金额 IS NULL || 缴纳凭证.缴纳金额 == 0)) || ((信息表.权利性质 == '出让') &&
    (批复文件.批复文号 IS NULL))
  description: 划拨土地使用权发生转让，必须经政府批准并补缴土地出让金转为出让性质。若取得方式为划拨但已发生转让却无出让金补缴记录，或不动产登记簿显示权利性质为出让但无对应的政府批复文件，均视为违规改变土地性质。触发条件为划拨地转让未补缴出让金或出让性质无合法审批来源。
  audit_item: 未经批准改变土地用途、性质或容积率
  suspicion: 未经批准擅自改变土地权利性质
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城市房地产管理法\",\n    \"法规文号\": \"主席令第18号（2019年修正）\",\n    \"效力级别\": \"法律\",\n  \
    \  \"条款号\": \"第四十条\",\n    \"内容概述\": \"以划拨方式取得土地使用权的，转让房地产时，应当报有批准权的人民政府审批。准予转让的，应当由受让方办理土地使用权出让手续，并依照国家有关规定缴纳土地使用权出让金。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国土地管理法\",\n    \"法规文号\": \"主席令第32号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \""
- expression: 实际容积率 > IF(论证报告.批复文号 IS NOT NULL, 论证报告.调整后容积率, 许可证.许可容积率)
  description: 实际容积率 = 实测总建筑面积/用地面积。当实际容积率大于规划许可证许可容积率或经批准的调整容积率时，即构成违规。若无容积率调整审批文件，则以规划许可证为准；若有审批文件，则与批复容积率比较。任何超出行为均触发疑点，无容差。
  audit_item: 未经批准改变土地用途、性质或容积率
  suspicion: 未经批准擅自提高建筑容积率
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国城乡规划法\",\n    \"法规文号\": \"主席令第74号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十三条\",\n    \"内容概述\": \"建设单位应当按照规划条件进行建设；确需变更的，必须向城市、县人民政府城乡规划主管部门提出申请。变更内容不符合控制性详细规划的，不得批准。变更后的规划条件应及时通报土地主管部门并公示。\"\
    \n  },\n  {\n    \"法规名称\": \"建设用地容积率管理办法\",\n    \"法规文号\": \"建规〔2012〕22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款"
- expression: EXISTS(SELECT 1 FROM 关系表 WHERE 关系表.出让公告编号 = 登记表.公告编号) OR (出让合同.合同条款 LIKE '%同时竞得%' OR '%整体开发%' OR '%打包出让%')
  description: 若捆绑地块关联关系表存在对应出让公告记录，则认定为捆绑出让；或在合同条款中检索‘同时竞得’‘整体开发’‘打包出让’等强制关联竞买关键词。满足任一条件即判定为疑点。
  audit_item: 违规捆绑或以“毛地”方式出让土地
  suspicion: 违规将两宗以上地块捆绑出让土地
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步规范土地出让管理工作的通知\",\n    \"法规文号\": \"国土资发〔2003〕400号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"严禁将两宗以上地块捆绑出让，严禁以各种名义规避招标拍卖挂牌出让。\"\n  }\n]"
- expression: (登记表.现状条件字段 IN ('毛地','未完成拆迁','未通平')) OR (跟踪表.拆迁完成时间 > 登记表.出让时间) OR (出让合同.合同条款 LIKE '%竞得人负责拆迁%' OR '%拆迁补偿由受让人承担%')
  description: 出让时登记表中现状条件标注为‘毛地’或‘未完成拆迁’；或拆迁进度表记载的拆迁完成时间晚于实际出让时间；或合同中存在将拆迁责任及费用违规转嫁给受让人的条款。任一条件成立即构成疑点。
  audit_item: 违规捆绑或以“毛地”方式出让土地
  suspicion: 违规以“毛地”方式出让土地
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有土地使用权出让收支管理的通知\",\n    \"法规文号\": \"财综〔2006〕68号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第一条\",\n    \"内容概述\": \"实行‘净地’出让，拟出让的土地应当是完成拆迁补偿安置等前期工作的‘净地’，具备开发建设条件。\"\n  }\n]"
