name: audit/合同协议类/代持协议
type: model
description: 从合同协议类类文档（代持协议）中提取结构化元数据。涵盖字段如：代持人、代持股权比例、代持起止日期、被代持人。文档范围包括：股权代持协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 代持协议
  member_count: 1
  member_details:
  - 股权代持协议
output:
  fields:
  - name: 代持人
    type: string
    description: 提取 代持人 的文本值
  - name: 代持股权比例
    type: number
    description: 提取 代持股权比例 的数值（含单位，如万元、吨等）
  - name: 代持起止日期
    type: date
    description: 提取 代持起止日期 的日期值，格式 YYYY-MM-DD
  - name: 被代持人
    type: string
    description: 提取 被代持人 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: SELECT 其他.穿透后的最终受益人国籍/注册地, 投资协议.投资项目最终标的公司及业务描述, 代持协议.代持人 FROM 其他 INNER JOIN 投资协议 ON 投资协议.投资项目最终标的公司及业务描述 =
    投资协议.投资标的 WHERE 其他.穿透后的最终受益人国籍/注册地 IN ('外商投资负面清单中限制/禁止的领域对应的投资主体') AND 其他.控制路径 LIKE '%代持%' AND 代持协议.代持人 != 其他.穿透后的最终受益人国籍/注册地
  description: 该表达式专门用于挖掘隐藏的股权代持。当穿透后的最终受益人国籍显示为《外商投资准入特别管理措施（负面清单）》中禁止或限制投资领域的境外主体，且其投资是通过境内企业或个人代持的方式实现的，即代持方与最终受益人不一致，则构成典型的规避外资准入监管的违规行为。
  audit_item: 违规进行重大投资
  suspicion: 违规决策为外资代持限制性文化机构股权
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国外商投资法\",\n    \"法规文号\": \"中华人民共和国主席令第二十六号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十八条\",\n    \"内容概述\": \"外国投资者投资负面清单规定禁止投资的领域，由国务院商务主管部门责令停止投资活动，限期处分股份、资产或者采取其他必要措施，恢复到实施投资前的状态。\"\n  }\n]"
