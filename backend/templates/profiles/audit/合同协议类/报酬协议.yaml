name: audit/合同协议类/报酬协议
type: model
description: 从合同协议类类文档（报酬协议）中提取结构化元数据。涵盖字段如：受雇人、受雇人姓名、报酬条款、报酬标准、支付方式、聘用单位。文档范围包括：兼职报酬协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 报酬协议
  member_count: 1
  member_details:
  - 兼职报酬协议
output:
  fields:
  - name: 受雇人
    type: string
    description: 提取 受雇人 的文本值
  - name: 受雇人姓名
    type: string
    description: 提取 受雇人姓名 的文本值
  - name: 报酬条款
    type: number
    description: 提取 报酬条款 的数值（含单位，如万元、吨等）
  - name: 报酬标准
    type: string
    description: 提取 报酬标准 的文本值
  - name: 支付方式
    type: string
    description: 提取 支付方式 的文本值
  - name: 聘用单位
    type: string
    description: 提取 聘用单位 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (经济实体股东高管名单.人员姓名 IN (在职人员兼职申报审批表.姓名) AND (在职人员兼职申报审批表.审批状态 != '批准' OR 在职人员兼职申报审批表.兼职单位 != 经济实体股东高管名单.企业名称))
    AND (薪酬发放凭证.收款人姓名 == 经济实体股东高管名单.人员姓名 OR 工资外收入明细表.对方单位 == 经济实体股东高管名单.企业名称 AND 工资外收入明细表.金额 > 0)
  description: 首先识别在职人员在经济实体兼任股东或高管且未履行批准程序，然后判定存在从该实体收取报酬的证据（如银行流水显示顾问费、工资外收入明细中的劳务费等）。两个条件同时满足即构成违规兼职取酬。若仅兼职未发现取酬，仍可能构成违规兼职，另案处理。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 在职人员违规兼职取酬
  regulation: "[\n  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第九十四条\",\n    \"内容概述\": \"违反有关规定在经济组织、社会组织等单位中兼职，或者经批准兼职但获取薪酬、奖金、津贴等额外利益的，依照前款规定处理。\"\n  },\n  {\n    \"法规名称\": \"\
    中华人民共和国公职人员政务处分法\",\n    \"法规文号\": \"中华人民共和国主席令第四十六号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十六条\",\n    \"内容概述\"\
    : \"违反规定从"
- expression: (离退休人员信息登记表.离职日期 <= (当前日期 - 1095)) AND (行业协会商会领导成员任职表.是否领取报酬 == '是' OR 薪酬发放凭证.付款方 IN (行业协会商会领导成员任职表.任职单位) OR
    经济实体股东高管名单.人员姓名 IN (离退休人员信息登记表.姓名) AND 经济实体股东高管名单.企业名称 IN (原任职务管辖地区和业务范围内的企业名单))
  description: 对退休已满3年人员，仍须检查其在行业协会兼职是否违规取酬，或是否在原管辖范围企业违规任职、取酬。表达式判定三类情形：1.在协会兼职但领取报酬；2.从协会或原管辖企业获取薪酬；3.在原管辖业务范围内企业持股或任职。存在任一情形则触发疑点。
  audit_item: 党员领导干部违反规定兼职或者兼职取酬以及从事有偿中介活动
  suspicion: 退（离）休三年后违规兼职或变相取酬
  regulation: "[\n  {\n    \"法规名称\": \"关于规范退（离）休领导干部在社会团体兼职问题的通知\",\n    \"法规文号\": \"中组发〔2013〕18号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"退（离）休领导干部经批准兼任社会团体职务，兼职不得领取社会团体的薪酬、奖金、津贴等报酬和获取其他额外利益，也不得领取各种名目的补贴等。\"\n  },\n\
    \  {\n    \"法规名称\": \"中国共产党纪律处分条例\",\n    \"法规文号\": \"中发〔2018〕31号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第九十五条\"\
    ,\n  "
