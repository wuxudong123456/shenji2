name: audit/合同协议类/服务合同
type: model
description: 从合同协议类类文档（服务合同）中提取结构化元数据。涵盖字段如：付费优先服务条款、优惠率、会员服务条款、单个服务地块面积、合同名称、合同期限、合同签订日期、合同签订时间与审批申请时间先后。文档范围包括：中介机构服务合同、农资供应、配方施肥等服务合同、城市垃圾处置服务合同、政府购买服务合同、政府采购定点服务合同、服务合同、电子政务平台服务合同、第三方服务合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 审批
- 金额
- 项目
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 服务合同
  member_count: 1
  member_details:
  - 中介机构服务合同
  - 农资供应、配方施肥等服务合同
  - 城市垃圾处置服务合同
  - 政府购买服务合同
  - 政府采购定点服务合同
  - 服务合同
  - 电子政务平台服务合同
  - 第三方服务合同
output:
  fields:
  - name: 付费优先服务条款
    type: number
    description: 提取 付费优先服务条款 的数值（含单位，如万元、吨等）
  - name: 优惠率
    type: string
    description: 提取 优惠率 的文本值
  - name: 会员服务条款
    type: number
    description: 提取 会员服务条款 的数值（含单位，如万元、吨等）
  - name: 单个服务地块面积
    type: string
    description: 提取 单个服务地块面积 的文本值
  - name: 合同名称
    type: string
    description: 提取 合同名称 的文本值
  - name: 合同期限
    type: string
    description: 提取 合同期限 的文本值
  - name: 合同签订日期
    type: date
    description: 提取 合同签订日期 的日期值，格式 YYYY-MM-DD
  - name: 合同签订时间与审批申请时间先后
    type: date
    description: 提取 合同签订时间与审批申请时间先后 的日期值，格式 YYYY-MM-DD
  - name: 合同约定处置范围
    type: string
    description: 提取 合同约定处置范围 的文本值
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 定点供应商名称
    type: string
    description: 提取 定点供应商名称 的文本值
  - name: 技术维护费描述
    type: number
    description: 提取 技术维护费描述 的数值（含单位，如万元、吨等）
  - name: 捆绑服务项目
    type: string
    description: 提取 捆绑服务项目 的文本值
  - name: 支付方约定
    type: string
    description: 提取 支付方约定 的文本值
  - name: 收款账户
    type: number
    description: 提取 收款账户 的数值（含单位，如万元、吨等）
  - name: 收费方式
    type: number
    description: 提取 收费方式 的数值（含单位，如万元、吨等）
  - name: 收费条款
    type: number
    description: 提取 收费条款 的数值（含单位，如万元、吨等）
  - name: 收费项目描述
    type: number
    description: 提取 收费项目描述 的数值（含单位，如万元、吨等）
  - name: 是否强制或唯一
    type: boolean
    description: 提取 是否强制或唯一 的布尔值（是/否）
