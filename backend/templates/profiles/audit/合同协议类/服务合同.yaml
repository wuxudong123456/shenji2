violations:
- expression: 统计表.收款协会 IN 行业协会商会名单 AND (统计表.拨款依据 LIKE '%行业管理%' OR 预算文件.预算科目 IN ('行政事业经费', '专项业务费', '行业管理专项经费')) AND 统计表.拨款金额
    > 0 AND (服务合同 IS NULL OR 服务合同.服务内容 NOT IN 政府购买服务目录)
  description: 财政部门直接向协会拨款，拨款用途或预算科目涉及行政管理、行业管理，且无规范的政府购买服务合同或服务不在目录内，即属违规。金额阈值>0。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 违规为行业协会商会安排财政资金
  regulation: "[\n  {\n    \"法规名称\": \"行业协会商会与行政机关脱钩总体方案\",\n    \"法规文号\": \"中办发〔2015〕39号\",\n    \"效力级别\": \"党内法规/规范性文件\"\
    ,\n    \"条款号\": \"第三条配套政策（三）财政支持\",\n    \"内容概述\": \"财政部门不得向行业协会商会安排财政资金。确需委托其提供的服务，可通过政府购买服务方式实施。\"\n  }\n]"
- expression: (保险单.承保机构名称 != 服务合同.定点供应商名称) OR (记录表.维修站点名称 != 服务合同.定点供应商名称) OR (明细表.加油站名称 != 服务合同.定点供应商名称) OR (明细表.收款方名称 NOT
    IN 服务合同.定点供应商名称)
  description: 将实际发生费用的供应商与有效的政府采购定点合同进行比对，若保险、维修、加油服务的实际提供者不在定点名录内，或虽然名称相同但没有签订当期有效合同，即判定为未执行定点服务制度。
  audit_item: 违规管理或使用公务用车
  suspicion: 未执行定点服务政府采购制度
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第七条\",\n    \"内容概述\": \"政府采购实行集中采购和分散采购相结合。纳入集中采购目录的政府采购项目，应当实行集中采购。\"\n  },\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n \
    \   \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\": \"第十五条\",\n    \"内容概述\": \"公务用车保险、维修、加油等实行政府集中采购和定点服务，严格执行"
- expression: ( 收费明细台账.对应审批事项 && 服务合同.服务提供方 IN (名录.机构名称) && ABS(服务合同.是否强制或唯一 - 1) = 0 ) && ( ABS(收费明细台账.收费总额 - 流水.收款金额) <
    0.01 )
  description: 触发条件：在办理行政许可、资质认定等事项时，官方明确要求或暗中诱导必须通过特定名录内的中介机构提供服务，且该名录无公开竞争、无同等替代选项；同时，审计期间发现该中介服务的收费记录数量与被审计单位审批业务量呈明显同步变动，表明两者已捆绑。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 利用审批权指定中介服务并收费
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于进一步清理规范国务院部门行政审批中介服务的通知\",\n    \"法规文号\": \"国办发〔2015〕31号\",\n    \"效力级别\":\
    \ \"制度文件\",\n    \"条款号\": \"第二条第三项\",\n    \"内容概述\": \"审批部门不得以任何形式指定中介服务机构，对各类中介服务机构提供的服务不得以任何形式附加限制性或歧视性条件。\"\n  },\n\
    \  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十三条\",\n  \
    \  \"内容概述\": "
- expression: ( 办事指南.有无指定供应商说明 && 收费明细.对应审批事项 && 办事指南.办理条件 )
  description: 若在审批所需材料中，被审计单位自行设置的办事指南将某项有偿服务捆绑为受理前置条件，且指定唯一或特定范围的机构提供该服务（即使表面上未写死唯一，但通过技术参数等限制只能某几家满足），同时该服务并非法律法规明确规定必须购买的，则构成捆绑收费。需排除法律法规强制要求的法定检测评估。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 行政审批捆绑购买指定商品服务
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十四条\",\n    \"内容概述\": \"行政审批机关不得将特定的中介服务作为受理的前置条件，不得强制企业接受指定的中介服务。\"\n  },\n  {\n    \"法规名称\": \"国务院关于在市场体系建设中建立公平竞争审查制度的意见\"\
    ,\n    \"法规文号\": \"国发〔2016〕34号\",\n    \"效力级别\": \"制度文件\",\n    \"条款号\": \"审查标准-商品和要素自由流动标准\",\n    \"内容概述\": \"不得限定经营"
- expression: 收费明细表.收费项目名称 CONTAINS ('技术维护费','系统维护费','平台运维费') && (收费明细表.收费项目名称 NOT IN (政策文件.服务费类项目允许范围) || (对照表.电子政务平台运维专项经费预算金额
    >= 其他.年度运维成本总额 && 收费明细表.金额 > 0))
  description: 当收费明细中的项目名称为技术维护费、系统维护费或平台运维费时，若该类收费不在政策文件允许的收费清单内，或者财政已足额拨付平台运维经费但依然向企业收取费用，则判定为违规。若财政拨款未完全覆盖成本，但收费无政策依据，同样违规。
  audit_item: 违规收费-要求企业承担电子政务平台技术维护费、服务费、电子介质成本费等经营服务性费用
  suspicion: 违规收取电子政务平台技术维护费
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委 财政部关于清理规范电子政务平台收费有关问题的通知\",\n    \"法规文号\": \"发改价格〔2011〕2352号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"全文\",\n    \"内容概述\": \"电子政务平台是政府为社会提供公共服务的窗口，平台的建设和运行费用应由各级财政经费保障，不得以技术维护费、服务费、电子介质成本费等名义向企业收费。\"\
    \n  },\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第"
- expression: 收费明细表.收费项目名称 CONTAINS ('服务费','平台服务费','数据对接服务费') && (收费明细表.收费项目名称 NOT IN (政策文件.服务费类项目允许范围) || 收费明细表.金额 > 0 &&
    财政拨款明细对照表.政府购买服务支出金额 已覆盖同类服务成本)
  description: 当收费项目为服务费类时，若不在政策允许的清单内，或财政已通过政府购买服务等方式支付了该类服务费用但仍向企业重复收取，即构成违规。用于判断是否将行政职责应免费提供的服务转化为有偿服务。
  audit_item: 违规收费-要求企业承担电子政务平台技术维护费、服务费、电子介质成本费等经营服务性费用
  suspicion: 违规收取电子政务平台服务费
  regulation: "[\n  {\n    \"法规名称\": \"国家发展改革委 财政部关于清理规范电子政务平台收费有关问题的通知\",\n    \"法规文号\": \"发改价格〔2011〕2352号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"全文\",\n    \"内容概述\": \"电子政务平台提供的服务属于公共服务范畴，不得以服务费、接入费等名义向企业收取费用。\"\n  },\n  {\n    \"法规名称\"\
    : \"财政部 国家发展改革委关于清理规范一批行政事业性收费有关政策的通知\",\n    \"法规文号\": \"财税〔2017〕20号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\"\
    ,"
- expression: (收费对象、收费项目名称、收费金额、收费时间、收费项目名称（如数据对接服务费、平台服务费）、收费项目名称（如CA证书费、U盾费）、单价、数量、收费项目（如高级会员费、加急服务费）、金额、收费频次.收费项目名称 CONTAINS
    ('会员','VIP','加急','优先','高级') || 收费条款、技术维护费描述、服务费条款、收费项目描述、合同期限、会员服务条款、付费优先服务条款、捆绑服务项目.付费优先服务条款 包含 ('付费方可使用','不缴费将关闭','必须购买'))
    && (收费对象、收费项目名称、收费金额、收费时间、收费项目名称（如数据对接服务费、平台服务费）、收费项目名称（如CA证书
  description: 当存在会员费、VIP费、加急费等名义的收费，且合同条款或平台权限设置将政府必须提供的基础服务与付费服务捆绑，或企业多次投诉被强制购买会员，即判定为变相违规收费。投诉次数阈值可设定为3次以上以降低误报。
  audit_item: 违规收费-要求企业承担电子政务平台技术维护费、服务费、电子介质成本费等经营服务性费用
  suspicion: 变相收费或捆绑收费
