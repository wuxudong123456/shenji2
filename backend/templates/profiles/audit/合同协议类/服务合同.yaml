  - name: 服务提供方
    type: string
    description: 提取 服务提供方 的文本值
  - name: 服务期限
    type: string
    description: 提取 服务期限 的文本值
  - name: 服务类型
    type: string
    description: 提取 服务类型 的文本值
  - name: 服务约定条款
    type: number
    description: 提取 服务约定条款 的数值（含单位，如万元、吨等）
  - name: 服务记录
    type: string
    description: 提取 服务记录 的文本值
  - name: 服务费支付记录
    type: number
    description: 提取 服务费支付记录 的数值（含单位，如万元、吨等）
  - name: 服务费条款
    type: number
    description: 提取 服务费条款 的数值（含单位，如万元、吨等）
  - name: 服务项目
    type: string
    description: 提取 服务项目 的文本值
  - name: 签订时间
    type: date
    description: 提取 签订时间 的日期值，格式 YYYY-MM-DD
  - name: 考古勘探工作内容
    type: string
    description: 提取 考古勘探工作内容 的文本值
  - name: 评审服务内容
    type: string
    description: 提取 评审服务内容 的文本值
  - name: 费用支付方约定
    type: number
    description: 提取 费用支付方约定 的数值（含单位，如万元、吨等）
  - name: 费用条款
    type: number
    description: 提取 费用条款 的数值（含单位，如万元、吨等）
  - name: 费用标准
    type: number
    description: 提取 费用标准 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
