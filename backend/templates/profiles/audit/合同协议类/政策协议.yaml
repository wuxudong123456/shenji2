name: audit/合同协议类/政策协议
type: model
description: 从合同协议类类文档（政策协议）中提取结构化元数据。涵盖字段如：担保条件、贴息比例、贷款利率优惠幅度。文档范围包括：金融支持政策协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 政策协议
  member_count: 1
  member_details:
  - 金融支持政策协议
output:
  fields:
  - name: 担保条件
    type: string
    description: 提取 担保条件 的文本值
  - name: 贴息比例
    type: number
    description: 提取 贴息比例 的数值（含单位，如万元、吨等）
  - name: 贷款利率优惠幅度
    type: number
    description: 提取 贷款利率优惠幅度 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (企业名称、实际用电价格、实际税费减免额、贷款获得及贴息金额.实际用电价格 > 税费减免比例.优惠电价标准) || (企业名称、实际用电价格、实际税费减免额、贷款获得及贴息金额.实际税费减免额 < 税费减免比例.税费减免比例)
    || (企业名称、实际用电价格、实际税费减免额、贷款获得及贴息金额.贷款获得及贴息金额 > 0 AND 企业名称、实际用电价格、实际税费减免额、贷款获得及贴息金额.贷款获得及贴息金额 = 0)
  description: 对照表记录的实际执行标准未达到政策文件承诺的优惠力度，包括电价未降、税费少免、贴息未到位等，即构成支持政策未落实。
  audit_item: 新型职业农民培育、农民工技能提升和返乡创业就业不符合相关规定
  suspicion: 返乡创业用地、用电、税费等支持政策执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于支持农民工等人员返乡创业的意见\",\n    \"法规文号\": \"国办发〔2015〕47号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"三、完善扶持政策 (四)至(六)\",\n    \"内容概述\": \"落实定向减税和普遍降费政策，对返乡创业人员按规定减免登记类、管理类和证照类行政事业性收费；对入驻创业园区的企业给予水电费、租金减免；加大返乡创业金融支持，落实创业担保贷款及贴息政策。\"\
    \n  }\n]"
