name: audit/合同协议类/补偿协议
type: model
description: 从合同协议类类文档（补偿协议）中提取结构化元数据。涵盖字段如：产权性质、人员安置补偿金额、付款方、其他收益性补偿金额、协议签订时间、房产证号、房屋产权证地址、房屋原址用途。文档范围包括：土地征收补偿协议、征地拆迁补偿协议、拆迁安置补偿协议、拆迁补偿协议、村民补偿协议、退捕渔民补偿协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 人员
- 付款
- 协议
- 资产
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 补偿协议
  member_count: 1
  member_details:
  - 土地征收补偿协议
  - 征地拆迁补偿协议
  - 拆迁安置补偿协议
  - 拆迁补偿协议
  - 村民补偿协议
  - 退捕渔民补偿协议
output:
  fields:
  - name: 产权性质
    type: string
    description: 提取 产权性质 的文本值
  - name: 人员安置补偿金额
    type: number
    description: 提取 人员安置补偿金额 的数值（含单位，如万元、吨等）
  - name: 付款方
    type: number
    description: 提取 付款方 的数值（含单位，如万元、吨等）
  - name: 其他收益性补偿金额
    type: number
    description: 提取 其他收益性补偿金额 的数值（含单位，如万元、吨等）
  - name: 协议签订时间
    type: date
    description: 提取 协议签订时间 的日期值，格式 YYYY-MM-DD
  - name: 房产证号
    type: string
    description: 提取 房产证号 的文本值
  - name: 房屋产权证地址
    type: string
    description: 提取 房屋产权证地址 的文本值
  - name: 房屋原址用途
    type: string
    description: 提取 房屋原址用途 的文本值
  - name: 房屋地址
    type: string
    description: 提取 房屋地址 的文本值
  - name: 批准日期
    type: date
    description: 提取 批准日期 的日期值，格式 YYYY-MM-DD
  - name: 拆迁性质
    type: string
    description: 提取 拆迁性质 的文本值
  - name: 是否有居民搬迁安置记录
    type: boolean
    description: 提取 是否有居民搬迁安置记录 的布尔值（是/否）
  - name: 村民签字记录
    type: string
    description: 提取 村民签字记录 的文本值
  - name: 签约时间
    type: date
    description: 提取 签约时间 的日期值，格式 YYYY-MM-DD
  - name: 签约状态
    type: boolean
    description: 提取 签约状态 的布尔值（是/否）
  - name: 补偿总金额
    type: number
    description: 提取 补偿总金额 的数值（含单位，如万元、吨等）
  - name: 补偿标准
    type: string
    description: 提取 补偿标准 的文本值
  - name: 补偿款发放金额
    type: number
    description: 提取 补偿款发放金额 的数值（含单位，如万元、吨等）
  - name: 补偿金额
    type: number
    description: 提取 补偿金额 的数值（含单位，如万元、吨等）
  - name: 被拆迁人户籍性质
    type: string
    description: 提取 被拆迁人户籍性质 的文本值
  - name: 被拆迁房屋用途
    type: string
    description: 提取 被拆迁房屋用途 的文本值
  - name: 被补偿人签字
    type: string
    description: 提取 被补偿人签字 的文本值
  - name: 资产重置补偿金额
    type: number
    description: 提取 资产重置补偿金额 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: 补偿协议.资产重置补偿金额 > 0 AND ( (COALESCE(SUM(明细账.贷方金额) FILTER (WHERE 摘要 ~ '拆迁补偿'), 0) == 0 ) OR (SUM(明细账.金额) FILTER
    (WHERE 摘要 ~ '拆迁补偿') > 0) OR ( (补偿协议.资产重置补偿金额 - 明细账.账面净值 - 明细账.清理费用) > 0 AND (补偿协议.资产重置补偿金额 - 明细账.账面净值 - 明细账.清理费用) != COALESCE(SUM(明细账.贷方金额)
    FILTER (WHERE 摘要 ~ '拆迁补偿'), 0) ) )
  description: 拆迁补偿款中明确用于固定资产重置的部分，按规定应先冲减拆除资产的账面净值及清理费用，剩余净额应全部转入资本公积。若资本公积科目未增加该部分金额（增加额=0），或拆迁补偿款被全额或部分计入营业外收入，或实际转入资本公积的金额不等于应转净额（差异>0），均构成违规。
  audit_item: 未按规定核算所有者权益
  suspicion: 拆迁补偿款未按规定转增资本公积
  regulation: "[\n  {\n    \"法规名称\": \"企业财务通则\",\n    \"法规文号\": \"财政部令第41号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十九条\"\
    ,\n    \"内容概述\": \"企业收到政府从财政预算直接拨付的搬迁补偿款，应作为专项应付款处理。其中，属于对搬迁过程中固定资产进行重置的补偿部分，应将相应的补偿款转为资本公积，不得计入当期损益。\"\n  }\n]"
- expression: (退捕渔民信息登记.审核通过时间 > 退捕渔民建档立卡操作规范.建档立卡完成时限) || (ABS(退捕渔民信息登记.审核通过时间 - 退捕渔民信息登记.登记时间) > 15) || (COUNT(退捕渔民信息登记.渔民身份信息)
    > 2 && 退捕渔民信息登记.审核通过时间 > 退捕渔民建档立卡操作规范.建档立卡完成时限) || (退捕渔民补偿协议.协议签订时间 > 退捕渔民建档立卡操作规范.建档立卡完成时限 + 30)
  description: 建档立卡规定时限来源于操作规范或上级文件。若渔民信息登记明细表中，最终审核通过日期超过该时限，即判为未按时完成。审核流程中村、镇、县等环节平均滞留天数超过15天，表明流程拖沓。同一渔民信息因质量问题被退回修改超过2次且最终完成时间已超期，属典型的因返工导致延迟。补偿协议签订时间超出建档立卡完成时限30天以上，说明建档完成后补偿工作滞后，整体时效性差。
  audit_item: 任务目标未按时完成（长江全面禁捕）
  suspicion: 退捕渔民建档立卡工作未按时完成
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部 财政部 人力资源社会保障部关于印发<长江流域重点水域禁捕和退捕渔民安置保障工作实施方案>的通知\",\n    \"法规文号\": \"农办计财〔2020〕13号\"\
    ,\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、（二）项\",\n    \"内容概述\": \"要求各地按照统一标准，及时完成退捕渔民建档立卡工作，做到不落一船、不落一户、不落一人。\"\n\
    \  }\n]"
- expression: (支付凭证.发票金额 > 项目合同.单价 * 项目合同.数量 * 1.2) || (支付凭证.开具方为个人 AND 支付凭证.开具方 NOT IN (拆迁补偿协议.被补偿人签字)) || ((项目进度表.累计已拨付资金
    / 项目合同.合同金额) - 项目进度表.实际完工比例 > 0.15)
  description: 工程款支付超过按实际进度计算应付金额的20%，或个人收款缺乏拆迁协议支撑，或资金拨付进度严重超前于实际工程进度15个百分点以上，即触发虚报套取疑点。
  audit_item: 保障性安居工程企业债券使用不合规
  suspicion: 虚报工程进度或成本套取债券资金
  regulation: "[\n  {\n    \"法规名称\": \"保障性安居工程资金管理办法\",\n    \"法规文号\": \"财综〔2019〕31号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"严禁在保障性安居工程专项资金中虚列支出、套取资金，不得以任何形式弄虚作假骗取财政补助。\"\n  }\n]"
- expression: (保障性安居工程供地明细表.计划供地时间 < 审计年度 && 保障性安居工程供地明细表.实际供地面积 = 0) || (保障性安居工程供地明细表.计划供地时间 IS NOT NULL && DATEDIFF(当前日期,
    保障性安居工程供地明细表.计划供地时间) > 180 && 保障房项目建设进度跟踪表.土地交付时间 IS NULL)
  description: 计划供地年份已过但实际供地面积为0，或供地合同约定交付日期后超过180天仍未实际交付土地，即判定为供地未落实。其中180天为通用审计预警阈值，可根据项目规模适当调整。
  audit_item: 保障性安居工程项目建设用地未落实
  suspicion: 因前期准备不足导致保障房供地未落实
  regulation: "[\n  {\n    \"法规名称\": \"关于保障性安居工程用地供应管理的通知\",\n    \"法规文号\": \"国土资发〔2011〕218号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"通知正文相关要求\",\n    \"内容概述\": \"市、县国土资源管理部门要根据保障性安居工程建设计划，及时供应土地，确保保障性安居工程用地落实，不得因前期工作不到位延误供地。\"\n  }\n]"
- expression: (立项批复金额.建设内容 LIKE '%房地产开发%' OR 立项批复金额.建设内容 LIKE '%商业综合体%' OR 立项批复金额.建设内容 LIKE '%商品住宅%' OR 施工合同.工程内容 LIKE '%商品房%'
    OR 施工合同.工程内容 LIKE '%商业配套%' OR 许可证.用地类型 IN ('商业用地','商住用地')) AND 项目类型 = '棚户区改造项目'
  description: 项目申报为棚改，但可研报告或施工合同中包含房地产开发、商品房建设、商业综合体等非棚改建设内容，或规划用地为商业/商住性质，即判定为违规打包。
  audit_item: 未严格执行棚户区改造范围和标准
  suspicion: 将房地产开发项目违规打包纳入棚改
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步做好棚户区改造工作有关问题的通知\",\n    \"法规文号\": \"建保〔2016〕156号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"严禁将商业房地产开发、城市基础设施建设等项目打包纳入棚户区改造，不得将城市规划区外的城中村改造项目纳入棚改。\"\n  }\n]"
- expression: (申报材料.建设内容 LIKE '%道路拓宽%' OR 申报材料.建设内容 LIKE '%道路建设%' OR 申报材料.建设内容 LIKE '%文物修缮%' OR 申报材料.建设内容 LIKE '%历史街区保护%'
    OR 申报材料.建设内容 LIKE '%古建筑修复%' OR 施工合同.工程内容 LIKE '%路面工程%' OR 施工合同.工程内容 LIKE '%道路扩建%') AND 申报材料.申报项目类型 = '棚户区改造项目'
  description: 项目申报为棚改，但可研报告或施工合同中建设内容包含道路工程、文物修缮、历史街区保护等非棚改内容，即判定违规。
  audit_item: 未严格执行棚户区改造范围和标准
  suspicion: 将道路拓展及文物修缮项目违规纳入棚改
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步做好棚户区改造工作有关问题的通知\",\n    \"法规文号\": \"建保〔2016〕156号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"严禁将城市道路拓展、历史街区保护、文物修缮等拆迁改造项目纳入棚户区改造。\"\n  }\n]"
- expression: (补偿协议.被拆迁人户籍性质 = '农业户口' OR 信息表.土地性质 = '集体建设用地' OR 审批文件.项目选址 NOT IN (城镇规划区)) AND 审批文件.建设内容 = '棚户区改造项目'
  description: 拆迁户中存在农业户口，或改造房屋土地为集体建设用地，或项目所在地不属于城市规划区范围内的，即判定为将农村危房改造项目纳入棚改的违规行为。
  audit_item: 未严格执行棚户区改造范围和标准
  suspicion: 将农村危房改造项目违规纳入棚改
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步做好棚户区改造工作有关问题的通知\",\n    \"法规文号\": \"建保〔2016〕156号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"严禁将农村危房改造项目纳入棚户区改造。\"\n  }\n]"
- expression: (房屋坐落、土地性质、建成年份、结构类型、房屋安全鉴定等级、危房鉴定结论.建成年份 > (当前年份-20) AND 房屋坐落、土地性质、建成年份、结构类型、房屋安全鉴定等级、危房鉴定结论.房屋安全鉴定等级 IN ('A','B','安全'))
    OR (房屋坐落、土地性质、建成年份、结构类型、房屋安全鉴定等级、危房鉴定结论.危房鉴定结论 NOT LIKE '%D级%') AND 项目类型 = '棚户区改造项目'
  description: 当地政策通常要求列入棚改的房屋房龄不低于20年且为C、D级危房，若房屋建成年份距今不足20年且鉴定为A、B级（安全）或未鉴定为D级危房，则属于违规扩大改造标准。
  audit_item: 未严格执行棚户区改造范围和标准
  suspicion: 将不达标房龄及安全房屋纳入棚改
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步做好棚户区改造工作有关问题的通知\",\n    \"法规文号\": \"建保〔2016〕156号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"严禁将房龄不足、结构安全的居民楼纳入棚户区改造。\"\n  }\n]"
- expression: (施工合同.工程内容 LIKE '%外墙粉刷%' OR 施工合同.工程内容 LIKE '%外立面整治%' OR 施工合同.工程内容 LIKE '%亮化%' OR 施工合同.工程内容 LIKE '%小区绿化%') AND
    施工合同.工程内容 NOT LIKE '%拆除%' AND 项目类型 = '棚户区改造项目'
  description: 施工合同中明确包含粉刷、外立面整治、亮化、绿化等美化亮化类工程，且不包含房屋拆除或主体结构改造内容，表明项目未涉及实质性安置改造，属于违规搭车行为。
  audit_item: 未严格执行棚户区改造范围和标准
  suspicion: 将小区美化亮化工程违规纳入棚改
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步做好棚户区改造工作有关问题的通知\",\n    \"法规文号\": \"建保〔2016〕156号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二条\",\n    \"内容概述\": \"严禁将小区美化亮化、居民房屋外立面整治等项目纳入棚户区改造。\"\n  }\n]"
- expression: (登记表.现状条件字段 IN ('毛地','未完成拆迁','未通平')) OR (跟踪表.拆迁完成时间 > 登记表.出让时间) OR (出让合同.合同条款 LIKE '%竞得人负责拆迁%' OR '%拆迁补偿由受让人承担%')
  description: 出让时登记表中现状条件标注为‘毛地’或‘未完成拆迁’；或拆迁进度表记载的拆迁完成时间晚于实际出让时间；或合同中存在将拆迁责任及费用违规转嫁给受让人的条款。任一条件成立即构成疑点。
  audit_item: 违规捆绑或以“毛地”方式出让土地
