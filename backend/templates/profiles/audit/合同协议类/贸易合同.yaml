name: audit/合同协议类/贸易合同
type: model
description: 从合同协议类类文档（贸易合同）中提取结构化元数据。涵盖字段如：交易对手全称、合同签订日期、合同金额、货权转移条款、货物名称。文档范围包括：融资性贸易合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 贸易合同
  member_count: 1
  member_details:
  - 融资性贸易合同
output:
  fields:
  - name: 交易对手全称
    type: string
    description: 提取 交易对手全称 的文本值
  - name: 合同签订日期
    type: date
    description: 提取 合同签订日期 的日期值，格式 YYYY-MM-DD
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 货权转移条款
    type: number
    description: 提取 货权转移条款 的数值（含单位，如万元、吨等）
  - name: 货物名称
    type: string
    description: 提取 货物名称 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: ( (业务台账.资金收付时间 - 业务台账.货权转移时间 > 180天) AND (业务台账.客户名称 为 新成立空壳公司) ) OR ( 监控表.质押率 > 0.7 AND 监控表.货值变动率 < -10% ) OR
    ( 对比表.对外担保总额 / 对比表.净资产 > 0.5 ) OR ( 同一质押登记编号 出现在多份合同的质押协议中 )
  description: 该表达式从四个方面筛查：①融资性贸易周转天数远超行业合理水平（超过180天）且交易对手为无实质性经营的空壳公司，表明贸易背景虚假；②仓单质押率超过70%且对应货物市场价格跌幅超过10%，已突破风险预警线，担保效力严重不足；③对外担保总额超过企业净资产的50%，违反上市公司或国有企业担保限额规定；④存在“一女多嫁”现象，同一批货物仓单被重复质押给不同银行。任一条件触发即属严重违规。
  audit_item: 违规进行重大资本运作及高风险投资
  suspicion: 违规开展融资性贸易或仓单质押业务
  regulation: "[\n  {\n    \"法规名称\": \"关于规范上市公司对外担保行为的通知\",\n    \"法规文号\": \"证监发〔2005〕120号\",\n    \"效力级别\": \"部门规章\",\n \
    \   \"条款号\": \"第一条\",\n    \"内容概述\": \"上市公司对外担保总额不得超过最近一个会计年度经审计净资产的50%，超过该限额须经特别决议，并履行信息披露义务。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于加强中央企业融资性贸易业务管控有关事项的通知\",\n    \"法规文号\": \"国资发财评规〔2017〕327号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二点\",\n\
    \    \""
