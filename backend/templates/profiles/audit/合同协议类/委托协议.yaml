name: audit/合同协议类/委托协议
type: model
description: 从合同协议类类文档（委托协议）中提取结构化元数据。涵盖字段如：具体任务描述、委托事项、委托费用、工作内容、涉密标记、签订日期。文档范围包括：第三方机构委托协议、职能委托协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 委托协议
  member_count: 1
  member_details:
  - 第三方机构委托协议
  - 职能委托协议
output:
  fields:
  - name: 具体任务描述
    type: string
    description: 提取 具体任务描述 的文本值
  - name: 委托事项
    type: string
    description: 提取 委托事项 的文本值
  - name: 委托费用
    type: number
    description: 提取 委托费用 的数值（含单位，如万元、吨等）
  - name: 工作内容
    type: string
    description: 提取 工作内容 的文本值
  - name: 涉密标记
    type: string
    description: 提取 涉密标记 的文本值
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: 委托协议.委托事项 IN 职能清单.法定行政职能事项 AND 委托协议.签订日期 >= '2015-07-08' AND 收费清单.收费项目 对应 委托事项
  description: 以委托协议方式将本应由行政机关实施的法定行政职能（如审批、年检、认证）交由协会办理，且协会向服务对象收取费用，无论是否经财政拨款，均属违规。脱钩方案发布后新签此类协议尤其违规。
  audit_item: 未按规定与行业协会商会脱钩
  suspicion: 违规转移或委托法定职能
  regulation: "[\n  {\n    \"法规名称\": \"关于全面推开行业协会商会与行政机关脱钩改革的实施意见\",\n    \"法规文号\": \"发改经体〔2019〕1063号\",\n    \"效力级别\": \"\
    部门规章\",\n    \"条款号\": \"三、脱钩任务和措施（二）职能分离\",\n    \"内容概述\": \"行政机关不得将法定职能转移或委托给行业协会商会，不得以购买服务等名义变相转移职能。\"\n  }\n]"
- expression: (委托协议工作内容 CONTAINS '绩效目标设定' OR CONTAINS '绩效运行监控' OR CONTAINS '部门整体支出绩效评价' 且制度规定禁止外包) OR (委托事项对照表.是否超范围标记 = '是'
    AND 项目已执行) OR (涉密标记 = '是' AND 无保密部门审批记录)
  description: 委托内容包含制度明确禁止外包的核心职能（如绩效目标设定、监控）即触发；对照表已标记为超范围但仍实际委托代表流程失控；涉密项目未经保密审批即为严重违规。
  audit_item: 部门、单位引入第三方机构参与绩效评价不规范
  suspicion: 超范围委托第三方机构参与预算绩效管理工作
  regulation: "[\n  {\n    \"法规名称\": \"关于委托第三方机构参与预算绩效管理的指导意见\",\n    \"法规文号\": \"财预〔2021〕6号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三条\",\n    \"内容概述\": \"委托第三方机构参与预算绩效管理的范围应当严格界定，不得将应当由自身履行的绩效管理主体责任委托第三方，如绩效目标设定、绩效运行监控等。\"\n  }\n]"
