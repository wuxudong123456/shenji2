name: audit/合同协议类/承包合同
type: model
description: 从合同协议类类文档（承包合同）中提取结构化元数据。涵盖字段如：中标通知书、合同约定的费用项目及金额、合同金额、已约定的服务项目及费用、承包/租赁期限、承包范围、承租人、禁止转/分包条款。文档范围包括：农机企业承包合同、学校食堂承包合同、总承包合同、施工总承包合同、资产租赁/承包合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 人员
- 合同
- 资产
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 承包合同
  member_count: 1
  member_details:
  - 农机企业承包合同
  - 学校食堂承包合同
  - 总承包合同
  - 施工总承包合同
  - 资产租赁/承包合同
output:
  fields:
  - name: 中标通知书
    type: string
    description: 提取 中标通知书 的文本值
  - name: 合同约定的费用项目及金额
    type: number
    description: 提取 合同约定的费用项目及金额 的数值（含单位，如万元、吨等）
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 已约定的服务项目及费用
    type: number
    description: 提取 已约定的服务项目及费用 的数值（含单位，如万元、吨等）
  - name: 承包-租赁期限
    type: string
    description: 提取 承包-租赁期限 的文本值
  - name: 承包范围
    type: string
    description: 提取 承包范围 的文本值
  - name: 承租人
    type: string
    description: 提取 承租人 的文本值
  - name: 禁止转-分包条款
    type: number
    description: 提取 禁止转-分包条款 的数值（含单位，如万元、吨等）
  - name: 租金金额
    type: number
    description: 提取 租金金额 的数值（含单位，如万元、吨等）
  - name: 签约时间
    type: date
    description: 提取 签约时间 的日期值，格式 YYYY-MM-DD
  - name: 约定的费用条款
    type: number
    description: 提取 约定的费用条款 的数值（含单位，如万元、吨等）
  - name: 费用分摊约定
    type: number
    description: 提取 费用分摊约定 的数值（含单位，如万元、吨等）
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 项目经理及主要管理人员名单
    type: string
    description: 提取 项目经理及主要管理人员名单 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (分包合同.合同金额 / 承包合同.禁止转/分包条款 > 50%) || (其他.缴费单位 != 承包合同.禁止转/分包条款) || (采购合同.采购方 != 承包合同.禁止转/分包条款)
  description: 审计三要素：1.劳务分包占比超过总合同50%，疑似以包代管或整体转包；2.工程施工的主要管理人员社保非总承包单位缴纳，表明其人企分离，工程实质由其他单位管理；3.主要材料设备直接由分包单位或其他单位采购而非总承包，表明总包仅收取管理费，未履行主体结构及核心义务。满足任意条件即触发违规预警。
