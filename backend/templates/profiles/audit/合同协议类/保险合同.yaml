name: audit/合同协议类/保险合同
type: model
description: 从合同协议类类文档（保险合同）中提取结构化元数据。涵盖字段如：保费补贴金额、保费金额、投保人、投保数量、标的名称。文档范围包括：农业保险合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 补贴
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 保险合同
  member_count: 1
  member_details:
  - 农业保险合同
output:
  fields:
  - name: 保费补贴金额
    type: number
    description: 提取 保费补贴金额 的数值（含单位，如万元、吨等）
  - name: 保费金额
    type: number
    description: 提取 保费金额 的数值（含单位，如万元、吨等）
  - name: 投保人
    type: string
    description: 提取 投保人 的文本值
  - name: 投保数量
    type: number
    description: 提取 投保数量 的数值（含单位，如万元、吨等）
  - name: 标的名称
    type: string
    description: 提取 标的名称 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (ABS(标的清单.投保数量 - 实地核查记录.实际数量) / 实地核查记录.实际数量 > 0.2) || (实地核查记录.核查标志 = '无标的' && 保险合同.保费补贴状态 = '已拨付') || (COUNT(理赔记录.保单号)
    / COUNT(保险标的清单.保单号) > 0.5 && 气象记录.无对应灾害) || (银行流水.理赔款到账后3日内转回保险公司关联账户金额 > 理赔额的0.8)
  description: 投保数量与实地核查实际数量偏差超过20%，或核查确认标的物根本不存在但保费补贴已拨付，或同一区域相同灾害原因导致的理赔率异常偏高且无气象部门灾害记录佐证，或理赔资金在极短时间内回流至保险公司或其关联方，均指向虚构标的骗取补贴。
  audit_item: 骗取套取涉农财政专项资金
  suspicion: 虚构农业保险标的骗取财政保费补贴
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条\"\
    ,\n    \"内容概述\": \"保险机构经营农业保险业务，有下列行为之一的，由保险监督管理机构责令改正，处五万元以上三十万元以下罚款……（一）编制虚假的农业保险承保、查勘定损、理赔资料，骗取农业保险补贴或者补贴资金……\"\n \
    \ },\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第六条\"\
    ,\n"
