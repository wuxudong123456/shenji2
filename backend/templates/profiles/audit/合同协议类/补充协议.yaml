violations:
- expression: 补充协议.调整后的装修标准 != 招标文件.装修标准（国标） && 补充协议.签订时间 > 合同签订时间 && 缺少合规变更审批
  description: 补充协议擅自降低招标文件确定的国家标准为地方标准，属于通过补充协议背离实质性内容，且无正当审批流程，构成阴阳合同。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 签订补充协议降低技术标准背离招标文件
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n]"
- expression: 投标文件.投标品牌及型号 == 'A' && 补充协议.变更后品牌、型号 == 'B' && 补充协议.签订时间 > 合同签订时间
  description: 补充协议将中标的A品牌变更为B品牌，且后者价格更低、质量较差，属于改变投标承诺的实质性变更。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 补充协议变更中标设备品牌背离投标承诺
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十六条\",\n    \"内容概述\": \"招标人和中标人应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同。招标人和中标人不得再行订立背离合同实质性内容的其他协议。\"\n  }\n]"
- expression: 补充协议.分包比例 > 0 && (文本.转分包条款 == true || 补充协议.分包比例 > 0.3) && 分包单位与中标人存在关联关系
  description: 招标文件或主合同明确禁止转包或限制分包比例，而补充协议却允许大比例分包（超过30%）或将主体工程分包，且分包单位多为中标人关联企业，构成利用补充协议变相转包。
  audit_item: 违法订立与招投标文件不符的合同或协议
  suspicion: 通过补充协议将工程整体转包或违法分包
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四十八条\",\n    \"内容概述\": \"中标人应当按照合同约定履行义务，完成中标项目。中标人不得向他人转让中标项目，也不得将中标项目肢解后分别向他人转让。中标人按照合同约定或者经招标人同意，可以将中标项目的部分非主体、非关键性工作分包给他人完成。接受分包的人应当具备相应的资格条件，并不得再次分包。\"\
    \n  }\n]"
- expression: (明细表.保证金类型 NOT IN ('投标保证金','履约保证金','工程质量保证金','农民工工资保证金') OR (明细表.保证金类型 = '农民工工资保证金' AND 明细表.缴纳形式 = '现金' AND
    明细表.合同签订日期 > '2016-06-27')) && 明细表.合同签订日期 > '2016-06-27'
  description: 按照国办发〔2016〕49号文，2016年6月27日后新签合同仅可保留四类保证金，且农民工工资保证金推荐采用银行保函形式，若以现金预留且非特殊情形即属违规；同时，保证金名称若不属于上述四类（如信誉保证金、安全风险抵押金等），直接判定违规。阈值为合同签订日期在政策出台后。
  audit_item: 违规收费-工程建设领域保证金清理规范不到位
  suspicion: 违规预留已取消的保证金
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于清理规范工程建设领域保证金的通知\",\n    \"法规文号\": \"国办发〔2016〕49号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"一、全面清理各类保证金...\",\n    \"内容概述\": \"除依法依规设立的投标保证金、履约保证金、工程质量保证金、农民工工资保证金外，其他保证金一律取消。对取消的保证金，一律停止收取。\"\
    \n  },\n  {\n    \"法规名称\": \"国务院办公厅关于清理规范工程建设领域保证金的通知\",\n    \"法规文号\": \"国办发〔2016〕49号\",\n    \"效力级别\": \"行政法规\",\n  "
- expression: ((台账记录.保证金类型 = '履约保证金' AND (台账记录.实际缴纳金额 / 清单表.合同金额) > 0.1) OR (台账记录.保证金类型 = '工程质量保证金' AND (台账记录.实际缴纳金额 / 清单表.合同金额)
    > 0.03) OR (台账记录.保证金类型 = '投标保证金' AND (台账记录.实际缴纳金额 / 清单表.中标金额) > 0.02))
  description: 履约保证金上限为合同金额10%，工程质量保证金上限为工程价款结算总额3%（依据建质〔2017〕138号），投标保证金上限为中标金额2%。凡超过对应法定比例，直接判定违规。比例计算以实际缴纳金额与企业计价基数（合同金额/中标金额）的比值为准。
