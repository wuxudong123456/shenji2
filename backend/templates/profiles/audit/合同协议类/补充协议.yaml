name: audit/合同协议类/补充协议
type: model
description: 从合同协议类类文档（补充协议）中提取结构化元数据。涵盖字段如：专项用途约束条款、交易总价、人工费用占比、付款条件、付款节点、价款、供应商名称、保证金条款。文档范围包括：与中小企业签订的合同补充协议、借款合同及融资协议相关补充协议、分包合同补充协议、合同补充协议、商业银行贷款合同补充协议、土地使用权出让合同补充协议、工程合同补充协议、工程项目合同补充协议、政策性银行贷款合同补充协议、施工合同补充协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 合同
- 工程
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 补充协议
  member_count: 1
  member_details:
  - 与中小企业签订的合同补充协议
  - 借款合同及融资协议相关补充协议
  - 分包合同补充协议
  - 合同补充协议
  - 商业银行贷款合同补充协议
  - 土地使用权出让合同补充协议
  - 工程合同补充协议
  - 工程项目合同补充协议
  - 政策性银行贷款合同补充协议
  - 施工合同补充协议
  - 相关业务合同补充协议
  - 租赁合同补充协议
  - 补充协议
  - 被审计单位与施工单位签订的工程合同补充协议
  - 销售合同补充协议
  - 项目合同补充协议
  - 项目贷款合同补充协议（含利率条款）
