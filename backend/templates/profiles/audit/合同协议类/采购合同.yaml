violations:
- expression: 明细表.采购金额 >= 公开招标限额标准 AND 明细表.采购方式 != '公开招标' AND (事项说明.审批意见 != '同意' OR 事项说明 IS NULL)
  description: 公开招标限额标准依据当地当年度政府集中采购目录及限额标准执行，如货物或服务单项或批量预算金额达到200万元以上须公开招标。当项目金额达到限额但采购方式非公开招标，且无有效审批记录或审批未通过时，判定为违规规避公开招标。
  audit_item: 政府采购组织管理不规范
  suspicion: 应公开招标未招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十六条、第二十七条、第二十八条\",\n    \"内容概述\": \"政府采购公开招标应作为主要采购方式；采购人不得将应当以公开招标方式采购的货物或服务化整为零或者以其他任何方式规避公开招标采购；达到公开招标数额标准的项目，因特殊情况需要采用公开招标以外方式的，应当在采购活动开始前获得设区的市、自治州以上人民政府采购监督管理部门的批准。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\",\n   "
- expression: SAME_DEPT_AND_SUPPLIER_GROUP(采购单位, 供应商) AND SAME_CATEGORY_OR_SIMILAR(采购品目) AND (MAX(合同签订日期) - MIN(合同签订日期)) <=
    180天 AND SUM(采购金额) >= 公开招标限额标准 AND COUNT(合同) >= 2 AND 采购方式 NOT IN ('公开招标') AND (审批记录缺失 OR 审批意见 != '同意')
  description: 利用分组聚合判断：同一采购单位、同一供应商、采购品目相同或类似、在半年内（180天）签订多份合同，累计金额达到公开招标限额标准但均未采用公开招标，且无合法拆分审批手续的，认定为化整为零规避招标。时间窗口可根据审计需要调整。
  audit_item: 政府采购组织管理不规范
  suspicion: 化整为零规避公开招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十八条\",\n    \"内容概述\": \"采购人不得将应当以公开招标方式采购的货物或者服务化整为零或者以其他任何方式规避公开招标采购。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国政府采购法实施条例\"\
    ,\n    \"法规文号\": \"国务院令第658号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十八条\",\n    \"内容概述\": \"在一个财政年度内，采购人将一个预算项目下的同一品目"
- expression: 明细表.采购方式 = '单一来源采购' AND (审批文件 IS NULL OR 审批文件.批准文号 IS NULL) AND (审批表.审批结论 != '同意' OR 审批表.论证专家意见 IS NULL)
  description: 单一来源采购属于非竞争性采购方式，必须经过严格的专家论证和审批程序。若项目采用单一来源采购但缺少审批文件或论证审批表未通过，即判定为违规。
  audit_item: 政府采购组织管理不规范
  suspicion: 未经批准擅自采用单一来源方式采购
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第三十一条\",\n    \"内容概述\": \"符合下列情形之一的货物或者服务，可以依照本法采用单一来源方式采购：（一）只能从唯一供应商处采购的；（二）发生了不可预见的紧急情况不能从其他供应商处采购的；（三）必须保证原有采购项目一致性或者服务配套的要求，需要继续从原供应商处添购，且添购资金总额不超过原合同采购金额百分之十的。采购人申请单一来源采购，应当报经主管预算单位同意，同级财政部门批准。\"\
    \n  },\n  {\n    \"法规名"
- expression: 明细台账.保证金项目名称 NOT IN (法定保证金项目名称、设立依据、法定保证金比例上限（如质量保证金不超过3%）.法定保证金项目名称) || (收取通知.保证金项目名称 未在单位设定的保证金项目名称、设立依据中载明  &&
    无任何政策文件依据)
  description: 若实际收取的保证金项目名称未出现在国务院或省级公布的涉企保证金目录清单中，或单位无法提供该保证金项目的设立依据文件、政策文件编号，则判定为违规收取无依据保证金。
  audit_item: 政府采购违规收取保证金或拖欠企业账款
  suspicion: 违规收取无政策依据的涉企保证金
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于清理规范工程建设领域保证金的通知\",\n    \"法规文号\": \"国办发〔2016〕49号\",\n    \"效力级别\": \"行政法规\"\
