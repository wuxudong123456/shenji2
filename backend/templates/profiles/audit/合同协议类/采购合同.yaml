name: audit/合同协议类/采购合同
type: model
description: 从合同协议类类文档（采购合同）中提取结构化元数据。涵盖字段如：中标单位、书目名称、交货期限、产品规格、付款方、付款条件、供应商、供应商名称。文档范围包括：农业电气化设备采购合同、农药生产企业原材料采购合同、厕具采购合同、图书采购合同、存货采购合同、学校食堂食材采购合同、彩票设备/技术服务采购合同、政府采购合同、文化设施设备采购合同、材料采购合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 合同
- 采购
- 金额
- 元数据提取
