name: audit/合同协议类/分摊协议
type: model
description: 从合同协议类类文档（分摊协议）中提取结构化元数据。涵盖字段如：分摊依据、分摊单位、分摊方、分摊方式、分摊金额、加盖公章情况、协议存在性、协议签订方。文档范围包括：下属单位/关联方会议费分摊协议、与所属单位/外单位签订的经费分摊协议、公务用车费用分摊协议、关联企业费用分摊协议、所属单位费用分摊协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 协议
- 审批
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 分摊协议
  member_count: 1
  member_details:
  - 下属单位/关联方会议费分摊协议
  - 与所属单位/外单位签订的经费分摊协议
  - 公务用车费用分摊协议
  - 关联企业费用分摊协议
  - 所属单位费用分摊协议
output:
  fields:
  - name: 分摊依据
    type: string
    description: 提取 分摊依据 的文本值
  - name: 分摊单位
    type: string
    description: 提取 分摊单位 的文本值
  - name: 分摊方
    type: string
    description: 提取 分摊方 的文本值
  - name: 分摊方式
    type: string
    description: 提取 分摊方式 的文本值
  - name: 分摊金额
    type: number
    description: 提取 分摊金额 的数值（含单位，如万元、吨等）
  - name: 加盖公章情况
    type: string
    description: 提取 加盖公章情况 的文本值
  - name: 协议存在性
    type: string
    description: 提取 协议存在性 的文本值
  - name: 协议签订方
    type: string
    description: 提取 协议签订方 的文本值
  - name: 双方签章
    type: string
    description: 提取 双方签章 的文本值
  - name: 审批状态
    type: boolean
    description: 提取 审批状态 的布尔值（是/否）
  - name: 收费标准
    type: number
    description: 提取 收费标准 的数值（含单位，如万元、吨等）
  - name: 服务内容
    type: string
    description: 提取 服务内容 的文本值
  - name: 费用承担事由
    type: number
    description: 提取 费用承担事由 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (下属单位会议费支出明细表.会议费支出摘要 LIKE '%上级会议%' || 会议费转嫁/分摊台账.分摊金额 > 0) && (下属单位/关联方会议费分摊协议.分摊方 IS NULL || 银行流水.用途 = '会议分摊费')
  description: 若下属单位账面出现与上级单位会议相关的费用支出，或无正式分摊协议但资金已划转，或分摊台账显示存在分摊行为，则判定为转嫁或摊派会议费。重点确认分摊是否经正式协议且合规，缺乏协议或资金流向明确为会议分摊费即构成违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 向下属机构、企事业单位、地方转嫁或摊派会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"会议费由召开单位承担，不得向参会人员收取，不得以任何方式向下属机构、企事业单位、地方转嫁或摊派。\"\n  }\n]"
- expression: (分析表.预算金额 == 0 OR 分析表.实际支出 > 分析表.预算金额) && 明细表.分摊金额 > 0 && (分摊协议.审批状态 != '已审批' OR 分摊协议.分摊依据 NOT IN ('参训人数比例','实际费用分摊'))
  description: 当年度培训费预算为零或实际支出突破预算批复总额，同时存在向所属单位分摊培训费的记录，且无法提供经批准的合规分摊协议或分摊依据不合法（如未按参训人数比例分摊）时，触发预警，属于无预算或超预算违规摊派。
  audit_item: 向所属单位转嫁、摊派培训费，挪用、套取培训费
  suspicion: 无预算或超预算摊派培训费
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第六条第（五）项\",\n    \"内容概述\": \"国家机关及其工作人员不得违反规定扩大开支范围、提高开支标准，不得转嫁、摊派费用。\"\n  }\n]"
- expression: (任务批件中文.所属单位 = 本单位) AND (明细台账.收款单位 != 本单位 AND 明细台账.对应出国任务 = 任务批件中文.任务名称) OR (单据.付款方 != 本单位 AND 单据.收款方 = 本单位
    且摘要含出国事由)
  description: 本单位人员的出国费用理应由本单位承担，若发现费用由所属单位或外单位支付（即分摊台账中收款方为外单位，但对应的是本单位人员任务，或银行流水显示外单位向本单位支付出国相关费用），可能构成摊派。无合规分摊协议或协议显失公平均属违规。
  audit_item: 因公出国（境）经费预算执行不合规
  suspicion: 向所属或其他单位摊派因公出国费用
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"党政机关不得向下属单位、企业、社会组织等摊派或转嫁因公出国（境）等费用，不得以任何名义要求其他单位提供资金或物品。\"\n  }\n]"
- expression: 车辆费用汇总表.实际使用单位 = '本单位' AND (费用分摊协议.协议存在性 = '否' OR 费用凭证.付款单位 = '下属单位' AND 费用凭证.费用摘要 LIKE '%车辆%' AND 费用分摊统计表.费用转出单位
    = '下属单位' AND 费用分摊统计表.转入单位 = '本单位' AND 费用分摊统计表.分摊金额 > 0)
  description: 下属单位账上列支的车辆费用，实际用于本单位，且不存在合规分摊协议，或者本单位收到下属单位转入的车辆费用分摊，表明存在费用转嫁。
  audit_item: 未按规定编制和执行公务用车购置和运行费预算
  suspicion: 向外单位或下属单位转嫁公务用车费用
  regulation: "[\n  {\n    \"法规名称\": \"党政机关公务用车管理办法\",\n    \"法规文号\": \"中办发〔2017〕71号\",\n    \"效力级别\": \"党内法规\",\n    \"条款号\"\
    : \"第十五条\",\n    \"内容概述\": \"党政机关不得以任何方式换用、借用、占用下属单位或者其他单位的车辆，不得接受企事业单位和个人赠送的车辆，不得向下属单位摊派、报销公务用车费用。\"\n  },\n  {\n   \
    \ \"法规名称\": \"中华人民共和国预算法实施条例\",\n    \"法规文号\": \"国务院令第729号（2020年修订）\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第七十条\"\
    ,\n  "
- expression: 跨企业费用转嫁明细对照表.费用类型 IN ('物业服务费','咨询服务费','服务管理费') && 关联企业费用分摊协议.服务内容 = '无实质服务' && 公款消费卡使用流水记录表.消费地点 出现 非公务场所 &&
    公款消费卡使用流水记录表.支付企业 = 跨企业费用转嫁明细对照表.接收企业
  description: 母公司将无商业实质的费用以分摊名义转移给子公司支付，且子公司名义支付的实际为领导个人消费，如家庭保姆费，即为费用转嫁。
  audit_item: 公款用于个人支出
  suspicion: 向关联企业转嫁领导人员个人支出
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有企业负责人职务消费的指导意见\",\n    \"法规文号\": \"国资发分配〔2006〕69号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业负责人职务消费应坚持从紧必需原则，不得用于应由个人承担的费用，不得随意扩大职务消费范围或提高消费标准。\"\n  }\n]"
