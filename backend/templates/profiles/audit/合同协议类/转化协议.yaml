name: audit/合同协议类/转化协议
type: model
description: 从合同协议类类文档（转化协议）中提取结构化元数据。涵盖字段如：专利号/品种权号、受让方信息、成果名称、技术合同成交额、转让/许可合同金额。文档范围包括：科技成果转化协议、科研成果转化协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 知识产权
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 转化协议
  member_count: 1
  member_details:
  - 科技成果转化协议
  - 科研成果转化协议
output:
  fields:
  - name: 专利号-品种权号
    type: string
    description: 提取 专利号-品种权号 的文本值
  - name: 受让方信息
    type: string
    description: 提取 受让方信息 的文本值
  - name: 成果名称
    type: string
    description: 提取 成果名称 的文本值
  - name: 技术合同成交额
    type: string
    description: 提取 技术合同成交额 的文本值
  - name: 转让-许可合同金额
    type: number
    description: 提取 转让-许可合同金额 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (已转化成果数量 / 成果总量) < 转化率 * 0.5 || (许可费用 / 技术合同成交额) < 0.2 || (技术合同成交额连续下降且年降幅>20%)
  description: 专利转化率低于同行业全国平均水平的50%为严重不足（如高校全国平均转化率8.3%，低于4.15%即为异常）。专利许可收入远低于预期或技术交易市场不活跃，反映成果转化极为低下。连续两年技术合同成交额下降超20%也是警示信号。
  audit_item: 未按规定落实补短板政策措施
  suspicion: 科技成果转化效果不理想
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国促进科技成果转化法\",\n    \"法规文号\": \"主席令第46号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
