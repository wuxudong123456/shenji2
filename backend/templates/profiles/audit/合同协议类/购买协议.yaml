name: audit/合同协议类/购买协议
type: model
description: 从合同协议类类文档（购买协议）中提取结构化元数据。涵盖字段如：产品名称、合同签订时间与审批申请时间先后、指定使用人、服务内容、服务内容与审批事项关联性、服务提供方、购买卡类型、购买金额。文档范围包括：公款消费卡购买协议、理财产品购买协议、购买协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 审批
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 购买协议
  member_count: 1
  member_details:
  - 公款消费卡购买协议
  - 理财产品购买协议
  - 购买协议
output:
  fields:
  - name: 产品名称
    type: string
    description: 提取 产品名称 的文本值
  - name: 合同签订时间与审批申请时间先后
    type: date
    description: 提取 合同签订时间与审批申请时间先后 的日期值，格式 YYYY-MM-DD
  - name: 指定使用人
    type: string
    description: 提取 指定使用人 的文本值
  - name: 服务内容
    type: string
    description: 提取 服务内容 的文本值
  - name: 服务内容与审批事项关联性
    type: string
    description: 提取 服务内容与审批事项关联性 的文本值
  - name: 服务提供方
    type: string
    description: 提取 服务提供方 的文本值
  - name: 购买卡类型
    type: string
    description: 提取 购买卡类型 的文本值
  - name: 购买金额
    type: number
    description: 提取 购买金额 的数值（含单位，如万元、吨等）
  - name: 起息日
    type: string
    description: 提取 起息日 的文本值
  - name: 面值
    type: string
    description: 提取 面值 的文本值
  - name: 预约到期日
    type: string
    description: 提取 预约到期日 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (费用报销明细表.费用类别 = '福利费' && 费用报销明细表.摘要 包含 '充值') && (公款消费卡使用流水记录表.消费项目 NOT IN ('会议费','差旅费','业务招待') && 公款消费卡使用流水记录表.消费时间
    IN ('周末','法定节假日','20:00-次日08:00')) && (领导人员个人消费与公务消费对比分析表.个人消费占比 > 0.3)
  description: 定额发放的消费卡若主要用于非公务消费项目，且消费时间集中在非工作时段或个人消费金额占比超过30%，则判定为公款支付个人消费。
  audit_item: 公款用于个人支出
  suspicion: 违规为领导人员定额发放个人消费卡
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有企业负责人职务消费的指导意见\",\n    \"法规文号\": \"国资发分配〔2006〕69号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业负责人职务消费应坚持从紧必需原则，不得用于应由个人承担的费用，不得随意扩大职务消费范围或提高消费标准。\"\n  }\n]"
- expression: (公款消费卡购买协议.购买卡类型 IN ('理疗保健卡','运动健身卡','高尔夫球卡','会所会员卡')) && (公款消费卡使用流水记录表.使用人登记 = '领导人员') && (费用报销明细表.费用类别 = '职工福利费'
    OR 费用报销明细表.费用类别 = '管理费用-其他') && (公款消费卡使用流水记录表.消费金额 / 公款消费卡购买协议.面值 > 0.8 AND 公款消费卡使用流水记录表.消费次数 > 12)
  description: 公款办理的理疗、健身、高尔夫等高端消费卡，若指定使用人仅为少数领导，且年消费次数及金额接近卡面值，与职工普惠福利不符，判定为个人消费。
  audit_item: 公款用于个人支出
  suspicion: 公款违规办理个人理疗健身等高消费卡
  regulation: "[\n  {\n    \"法规名称\": \"关于规范国有企业负责人职务消费的指导意见\",\n    \"法规文号\": \"国资发分配〔2006〕69号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业负责人职务消费应坚持从紧必需原则，不得用于应由个人承担的费用，不得随意扩大职务消费范围或提高消费标准。\"\n  }\n]"
- expression: 专项账户银行对账单.交易类型 = '理财' && 专项账户银行对账单.金额 > 0 && (项目进度表.实际开工日期 IS NULL || DATEDIFF(项目进度表.实际开工日期, 专项账户银行对账单.交易日期)
    > 90)
  description: 债券资金到账后超过90天未进入实质性施工阶段，且专项账户存在购买理财产品记录，即认定为违规闲置并挪用资金进行理财。
  audit_item: 保障性安居工程企业债券使用不合规
  suspicion: 债券资金闲置且用于违规理财
  regulation: "[\n  {\n    \"法规名称\": \"保障性安居工程资金管理办法\",\n    \"法规文号\": \"财综〔2019〕31号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"专项资金不得用于购买理财产品、发放工资福利、偿还债务等与保障性安居工程无关的支出。\"\n  }\n]"
