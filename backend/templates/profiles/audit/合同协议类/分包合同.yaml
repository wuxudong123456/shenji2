name: audit/合同协议类/分包合同
type: model
description: 从合同协议类类文档（分包合同）中提取结构化元数据。涵盖字段如：分包单位名称、分包工程类别、分包工程范围、分包范围、合同金额、禁止再分包条款。文档范围包括：分包合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 工程
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 分包合同
  member_count: 1
  member_details:
  - 分包合同
output:
  fields:
  - name: 分包单位名称
    type: string
    description: 提取 分包单位名称 的文本值
  - name: 分包工程类别
    type: string
    description: 提取 分包工程类别 的文本值
  - name: 分包工程范围
    type: string
    description: 提取 分包工程范围 的文本值
  - name: 分包范围
    type: string
    description: 提取 分包范围 的文本值
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 禁止再分包条款
    type: number
    description: 提取 禁止再分包条款 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (分包合同.合同金额 / 承包合同.禁止转/分包条款 > 50%) || (其他.缴费单位 != 承包合同.禁止转/分包条款) || (采购合同.采购方 != 承包合同.禁止转/分包条款)
  description: 审计三要素：1.劳务分包占比超过总合同50%，疑似以包代管或整体转包；2.工程施工的主要管理人员社保非总承包单位缴纳，表明其人企分离，工程实质由其他单位管理；3.主要材料设备直接由分包单位或其他单位采购而非总承包，表明总包仅收取管理费，未履行主体结构及核心义务。满足任意条件即触发违规预警。
  audit_item: 某公共建筑合同履行审
  suspicion: 违法转包或违规分包工程
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号（2019年修正）\",\n    \"效力级别\": \"行政法规\",\n   \
    \ \"条款号\": \"第七十八条\",\n    \"内容概述\": \"本条例所称转包，是指承包单位承包建设工程后，不履行合同约定的责任和义务，将其承包的全部建设工程转给他人或者将其承包的全部建设工程肢解以后以分包的名义分别转给其他单位承包的行为。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第29号（2019年修正）\",\n    \"效力级别\": \"法律\",\n    \"条"
- expression: 分包合同.分包范围 包含主体结构施工 || (分包合同.分包范围 总包合同.总承包范围 的绝大部分 && 项目管理人员社保缴纳单位 != 总包单位) || 工程款支付凭证.收款单位 为 个人且金额巨大并备注‘管理费’
  description: 根据规定，建设工程主体结构不得分包。若分包合同涉及主体结构，直接认定违法分包。若实际关键管理人员非总包单位员工，且主要材料设备款、分包款由总包单位收取后仅扣除一定比例再转付，则存在转包嫌疑。
  audit_item: 重大工程项目全过程审计
  suspicion: 非法转包或违法分包导致工程质量失控
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第七十八条\",\n    \"内容概述\": \"本条例所称转包，是指承包单位承包建设工程后，不履行合同约定的责任和义务，将其承包的全部建设工程转给他人或者将其承包的全部建设工程肢解以后以分包的名义分别转给其他单位承包的行为。……本条例所称违法分包，是指下列行为：（一）总承包单位将建设工程分包给不具备相应资质条件的单位的；……（三）施工总承包单位将建设工程主体结构的施工分包给其他单位的；……\"\
    \n  },\n  {\n    \"法规"
- expression: 合同编号.分包层级 > 1 || (分包单位名称.再分包记录 != "无" && 分包单位名称.禁止再分包条款 = "禁止")
  description: 总包单位依法选定的分包商，将其承接的分包工程再次分包给其他单位，即构成二次分包。表达式判断是否存在第二层及以上分包记录，或分包合同中明确禁止再分包但存在再分包事实，直接判定违规。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 分包单位再次违法分包
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十九条\"\
    ,\n    \"内容概述\": \"禁止分包单位将其承包的工程再分包。\"\n  }\n]"
- expression: (工程款支付明细表.收款方名称 != 总承包单位名称 AND 付款比例 > 80%) OR (项目经理到岗率 < 30% AND 分包合同.工作范围 = 施工合同.工作范围) OR (分包合同.合同金额 / 总合同金额
    > 0.9)
  description: 主要工程款流向非合同单位且比例异常，或项目经理长期不在岗，或分包范围基本覆盖全部工程，均为转包表征。通常转包伴随“管理费”模式。
  audit_item: 项目建设不符合规定
  suspicion: 中标单位将工程整体转包
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十八条\"\
    ,\n    \"内容概述\": \"禁止承包单位将其承包的全部建筑工程转包给他人，禁止承包单位将其承包的全部建筑工程肢解以后以分包的名义分别转包给他人。\"\n  },\n  {\n    \"法规名称\": \"建设工程质量管理条例\"\
    ,\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第七十八条\",\n    \"内容概述\": \"本条例所称转包，是指承包单位承包建设工程后"
- expression: (分包工程类别 = '专业工程' AND (分包单位资质等级 < 所需最低等级 OR 分包单位资质.有效期 < 施工期)) OR (分包工程类别 = '劳务作业' AND 分包单位资质 = 无 ) OR (分包单位资质审查记录
    = '未审查' AND 监理意见 = '通过')
  description: 专业分包需具备相应专业承包资质，劳务分包需具备施工劳务资质。若分包单位资质不满足或未审查即进场，属违法分包。
  audit_item: 项目建设不符合规定
  suspicion: 违法分包给不具备资质单位
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第七十八条\",\n    \"内容概述\": \"本条例所称违法分包，是指下列行为：...（二）建设工程总承包合同中未有约定，又未经建设单位认可，承包单位将其承包的部分建设工程交由其他单位完成的；（三）施工总承包单位将建设工程主体结构的施工分包给其他单位的；（四）分包单位将其承包的建设工程再分包的。\"\
    \n  },\n  {\n    \"法规名称\": \"建筑业企业资质管理规定\",\n    \"法规文号\": \"住房和城乡建设部令第22号\""
