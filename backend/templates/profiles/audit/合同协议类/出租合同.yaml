name: audit/合同协议类/出租合同
type: model
description: 从合同协议类类文档（出租合同）中提取结构化元数据。涵盖字段如：付款方式、收款账户、租赁期、租赁目的、租赁资产名称、租金总额。文档范围包括：资产出租合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 资产
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 出租合同
  member_count: 1
  member_details:
  - 资产出租合同
output:
  fields:
  - name: 付款方式
    type: number
    description: 提取 付款方式 的数值（含单位，如万元、吨等）
  - name: 收款账户
    type: number
    description: 提取 收款账户 的数值（含单位，如万元、吨等）
  - name: 租赁期
    type: string
    description: 提取 租赁期 的文本值
  - name: 租赁目的
    type: string
    description: 提取 租赁目的 的文本值
  - name: 租赁资产名称
    type: string
    description: 提取 租赁资产名称 的文本值
  - name: 租金总额
    type: number
    description: 提取 租金总额 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: EXISTS(出租合同.合同编号) && (出租合同.租金总额 - SUM(明细账.确认收入金额)) > 0
  description: 存在出租合同，但账面未全额确认相应租金收入，差额部分资金可能落入账外账户或个人账户，形成“小金库”。
  audit_item: 未按规定核算资产
  suspicion: 违规设置“小金库”
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"中华人民共和国主席令第81号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"各单位发生的各项经济业务事项应当在依法设置的会计账簿上统一登记、核算，不得违反本法和国家统一的会计制度的规定私设会计账簿登记、核算。\"\n  }\n]"
- expression: 出租合同.租赁期 > 0 && 出租合同.租赁资产名称 NOT IN (认定文件.已认定的投资性房地产清单) && 明细账.使用状态 = '出租'
  description: 已出租的房屋应当确认为投资性房地产，若仍在固定资产列报，则分类错误，后续计量方式可能不符合准则规定。
  audit_item: 未按规定核算资产
  suspicion: 已出租房产未重分类为投资性房地产
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第3号——投资性房地产\",\n    \"法规文号\": \"财会〔2006〕3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二条、第六条\",\n    \"内容概述\": \"投资性房地产是指为赚取租金或资本增值而持有的房地产；已出租的建筑物应当适用本准则。\"\n  }\n]"
