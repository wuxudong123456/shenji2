name: audit/合同协议类/同或协议
type: model
description: 从合同协议类类文档（同或协议）中提取结构化元数据。涵盖字段如：位置、利益联结方式、单价、合同签订方、合同约定费用明细、场地名称、就业岗位约定、房间类型。文档范围包括：会议合同或协议、会议场地租赁合同或协议、外宾接待合同或协议、脱贫群众参与项目合同或协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 合同
- 培训
- 明细
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 同或协议
  member_count: 1
  member_details:
  - 会议合同或协议
  - 会议场地租赁合同或协议
  - 外宾接待合同或协议
  - 脱贫群众参与项目合同或协议
output:
  fields:
  - name: 位置
    type: string
    description: 提取 位置 的文本值
  - name: 利益联结方式
    type: string
    description: 提取 利益联结方式 的文本值
  - name: 单价
    type: number
    description: 提取 单价 的数值（含单位，如万元、吨等）
  - name: 合同签订方
    type: string
    description: 提取 合同签订方 的文本值
  - name: 合同约定费用明细
    type: number
    description: 提取 合同约定费用明细 的数值（含单位，如万元、吨等）
  - name: 场地名称
    type: string
    description: 提取 场地名称 的文本值
  - name: 就业岗位约定
    type: string
    description: 提取 就业岗位约定 的文本值
  - name: 房间类型
    type: string
    description: 提取 房间类型 的文本值
  - name: 技能培训条款
    type: number
    description: 提取 技能培训条款 的数值（含单位，如万元、吨等）
  - name: 星级
    type: string
    description: 提取 星级 的文本值
  - name: 租赁单价
    type: number
    description: 提取 租赁单价 的数值（含单位，如万元、吨等）
  - name: 约定付款方式
    type: number
    description: 提取 约定付款方式 的数值（含单位，如万元、吨等）
  - name: 股权配置
    type: string
    description: 提取 股权配置 的文本值
  - name: 费用承担条款
    type: number
    description: 提取 费用承担条款 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: （会议费预算编制与执行对比表.分项实际支出金额 > 会议费预算编制与执行对比表.分项预算金额 * 1.2） || （会议费报销明细表.费用科目 IN ['住宿费','资料印刷费','设备租赁费'] && 年度会议费预算申报表.预算明细科目
    NOT INCLUDE 会议费报销明细表.费用科目）
  description: 若某项费用实际支出超出预算20%以上，或实际发生了住宿费、资料费等必要支出但预算申报时未列示该科目，判定为预算编制不完整。预算编制应涵盖会议必要的全部费用构成，缺失关键科目即构成违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 会议费预算编制不完整
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第九条\",\n    \"内容概述\": \"各单位应当按照规定编制会议费预算，详细列示会议名称、主要内容、时间、地点、代表人数、工作人员数、所需经费及列支渠道等。\"\n  }\n]"
- expression: 会议费结算方式统计表.现金金额占比 > 0 && (会议费结算方式统计表.现金金额占比 > 0.05 || 会议费报销明细表.金额 >= 1000)
  description: 根据规定，会议费应使用银行转账或公务卡结算，禁止现金方式。凡存在现金结算且现金总额占总费用比例超过5%，或单笔现金支付达到1000元及以上，均构成违规。特殊情况下确需现金支付的应提供书面说明，若无合理说明则判定违规。
  audit_item: 会议费预算编制和执行不规范，转嫁、摊派会议费
  suspicion: 违规以现金方式结算会议费
  regulation: "[\n  {\n    \"法规名称\": \"中央和国家机关会议费管理办法\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十一条\",\n    \"内容概述\": \"会议费支付，应当严格按照国库集中支付制度和公务卡管理制度的有关规定执行，以银行转账或公务卡方式结算，禁止以现金方式结算。\"\n  }\n]"
- expression: (明细表.住宿费总额 / (明细表.住宿人数 × 明细表.住宿天数)) > 标准.住宿费标准（元/人·天或房间标准） || 明细表.房间类型不属于标准间
  description: 计算人均每天住宿实际支出，与制度规定的人均住宿费标准比较，超出即违规；或者安排高档套房、行政楼层等超出标准间的行为，直接判定违规。
  audit_item: 超标准举办会议
  suspicion: 会议住宿安排超出规定标准
  regulation: "[\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十四条、第十七条\",\n    \"内容概述\": \"会议住宿费按标准控制；不得安排高档套房；单位应严格执行会议用房标准。\"\n  }\n]"
- expression: 租赁场所 NOT IN 定点饭店名单.定点饭店名单 || (租赁价格 > 定点饭店名单.对应协议价格)
  description: 选择非定点饭店或未执行政府采购协议价的，视为场地选择违规；在定点饭店消费但价格高于协议价且无合理解释，同样违规。
  audit_item: 超标准举办会议
  suspicion: 会议在非定点饭店召开或场地费未执行协议价格
  regulation: "[\n  {\n    \"法规名称\": \"《中央和国家机关会议费管理办法》\",\n    \"法规文号\": \"财行〔2016〕214号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第十三条\",\n    \"内容概述\": \"会议在定点饭店召开，按照协议价格结算费用。未定点饭店不能出具会议费发票的，不得报销。\"\n  }\n]"
- expression: (人员名单.单位 != 通知发布时间.通知参会单位及人员范围) || (同或协议.位置 包含 风景区) || (情况记录.实际活动内容 包含 旅游、考察、休闲 且 未在正式议程中)
  description: 参会人员超出规定范围（如家属、无关单位），或在风景区高消费场所办会，或议程外安排旅游休闲活动，任一条件满足即构成超范围。
  audit_item: 超标准举办会议
  suspicion: 超范围举办会议（含无关人员或变相旅游）
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规\",\n    \"\
    条款号\": \"第三十条\",\n    \"内容概述\": \"严禁到风景名胜区开会，不得借会议名义组织旅游或安排与会议无关的参观活动，不得宴请与会人员或发放纪念品。\"\n  }\n]"
- expression: (付款方 != 本接待单位) || (收款方 == 本单位 && 转账事由 IN ('赞助','协作','接待') && 付款方 IN (下级,关联单位)) || (费用承担条款 LIKE '%第三方%' AND 费用承担条款
    NOT LIKE '%明确依据%')
  description: 判定逻辑：1.本应由本单位承担的接待费用，其付款记录显示由其他单位支付；2.存在下级或关联企业以“赞助费”、“协作费”等名义向本单位划转资金，且资金额度与某次接待费用吻合；3.签订的接待合同中，无故约定由第三方支付费用。满足任一条件，均表示存在费用转嫁行为。
  audit_item: 违反外宾接待管理相关规定
  suspicion: 向关联单位转嫁接待费用
  regulation: "[\n  {\n    \"法规名称\": \"党政机关厉行节约反对浪费条例\",\n    \"法规文号\": \"中发〔2013〕13号\",\n    \"效力级别\": \"党内法规制度\",\n    \"\
    条款号\": \"第二十一条\",\n    \"内容概述\": \"党政机关应当严格执行国内公务接待标准，不得向下级单位及其他单位、企业、个人转嫁接待费用。\"\n  },\n  {\n    \"法规名称\": \"党政机关外宾接待管理办法\"\
    ,\n    \"法规文号\": \"财行〔2013〕533号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十六条\",\n    \"内容概述\": \"各单位应当严格执行外宾接待经费预算，不"
- expression: (收益分配表.实际签约人数 / 收益分配表.应覆盖人数) < 0.7 || (合同或协议.技能培训条款 == '无' && 合同或协议.就业岗位约定 == '无' && 合同或协议.股权配置 == '无') || ABS(合同或协议.分配比例
    - 收益分配表.分配比例) > 0.05
  description: 实际签约带动率低于70%表明覆盖面不足；合同缺乏技能培训、就业岗位、股权配置等实质性联结条款，属于简单分红式联结；合同约定分配比例与实际执行偏差超过5%，反映利益分配不规范。上述条件满足任一即视为利益联结机制不健全。
  audit_item: 帮扶产业项目联农带农机制不够持续稳固
  suspicion: 帮扶项目未与脱贫群众建立有效利益联结
  regulation: "[\n  {\n    \"法规名称\": \"中央财政衔接推进乡村振兴补助资金管理办法\",\n    \"法规文号\": \"财农〔2021〕19号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十三条\",\n    \"内容概述\": \"严禁简单发钱发物，帮扶项目应通过订单收购、吸纳就业、入股分红等方式，带动脱贫人口直接参与产业发展并稳定增收。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于建立健全帮扶项目联农带农机制的实施意见\",\n    \"法规文号\": \"国乡振发〔2022〕19号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三条、第五条\",\n \
    \   \"内"
