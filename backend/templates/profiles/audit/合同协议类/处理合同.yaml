name: audit/合同协议类/处理合同
type: model
description: 从合同协议类类文档（处理合同）中提取结构化元数据。涵盖字段如：合同约定接收单位、约定的处理标准及资质要求条款。文档范围包括：农药包装废弃物回收处理合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 处理合同
  member_count: 1
  member_details:
  - 农药包装废弃物回收处理合同
output:
  fields:
  - name: 合同约定接收单位
    type: string
    description: 提取 合同约定接收单位 的文本值
  - name: 约定的处理标准及资质要求条款
    type: number
    description: 提取 约定的处理标准及资质要求条款 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (许可证有效期、许可处理范围（类别、能力）、合法资质单位清单.许可证有效期 < 当前日期) || (处理量、产出物检测结果.实际处理温度 < 贮存设施防渗漏、防雨、防扬散标准、处理工艺参数标准（如焚烧温度、停留时间）.最低温度)
    || (处理量、产出物检测结果.处理量 > 许可证有效期、许可处理范围（类别、能力）、合法资质单位清单.许可能力上限) || (处理量、产出物检测结果.产出物检测结果 > 标准限值)
  description: 处置单位资质过期、处理工艺参数（如焚烧温度）未达到技术标准、超许可能力处理、或资源化产品残留超标，均构成资源化利用不合规，未依法进行无害化处理。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 农药包装废弃物资源化利用不合规
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国固体废物污染环境防治法》\",\n    \"法规文号\": \"主席令第四十三号（2020年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第八十条、第八十二条\",\n    \"内容概述\": \"从事危险废物利用、处置经营活动须取得许可证并按证经营；资源化利用的产品应当符合国家规定的产品质量标准。\"\n  }\n]"
- expression: (记录表.收款方名称 不为空 且 收款方名称 不在 处理合同.合同约定接收单位 列表) && (记录表.金额 > 0) || (交接单.接收方 不在 证明文件.合法资质单位清单 内) || (台账表.处理去向 !=
    处理合同.合同约定接收单位)
  description: 存在向非合同约定或非资质的个人/单位支付大额款项，转运接收方与资质单位不符，或台账去向与合同约定不一致，均表明存在违规倒卖或非法转交行为。
  audit_item: 农药包装废弃物回收使用管理不符合规定
  suspicion: 违规倒卖农药包装废弃物
  regulation: "[\n  {\n    \"法规名称\": \"《中华人民共和国固体废物污染环境防治法》\",\n    \"法规文号\": \"主席令第四十三号（2020年修订）\",\n    \"效力级别\": \"法律\"\
    ,\n    \"条款号\": \"第八十条\",\n    \"内容概述\": \"禁止将危险废物提供或者委托给无许可证的单位或者其他生产经营者从事收集、贮存、利用、处置活动。\"\n  }\n]"
