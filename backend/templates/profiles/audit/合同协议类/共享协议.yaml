name: audit/合同协议类/共享协议
type: model
description: 从合同协议类类文档（共享协议）中提取结构化元数据。涵盖字段如：交换字段清单、信息共享频率、共享协议签署状态、共享数据字段、共享范围、共享设施名称、协议中共享条款内容、协议签署方。文档范围包括：政府部门数据共享协议、数据共享协议、设施共享协议、资源共享协议、部门间信息共享协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 协议
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 共享协议
  member_count: 1
  member_details:
  - 政府部门数据共享协议
  - 数据共享协议
  - 设施共享协议
  - 资源共享协议
  - 部门间信息共享协议
output:
  fields:
  - name: 交换字段清单
    type: string
    description: 提取 交换字段清单 的文本值
  - name: 信息共享频率
    type: string
    description: 提取 信息共享频率 的文本值
  - name: 共享协议签署状态
    type: boolean
    description: 提取 共享协议签署状态 的布尔值（是/否）
  - name: 共享数据字段
    type: string
    description: 提取 共享数据字段 的文本值
  - name: 共享范围
    type: string
    description: 提取 共享范围 的文本值
  - name: 共享设施名称
    type: string
    description: 提取 共享设施名称 的文本值
  - name: 协议中共享条款内容
    type: number
    description: 提取 协议中共享条款内容 的数值（含单位，如万元、吨等）
  - name: 协议签署方
    type: string
    description: 提取 协议签署方 的文本值
  - name: 合作内容
    type: string
    description: 提取 合作内容 的文本值
  - name: 接口定义字段
    type: string
    description: 提取 接口定义字段 的文本值
  - name: 数据交换标准
    type: string
    description: 提取 数据交换标准 的文本值
  - name: 数据交换频率
    type: string
    description: 提取 数据交换频率 的文本值
  - name: 签约企业
    type: string
    description: 提取 签约企业 的文本值
  - name: 签约方
    type: string
    description: 提取 签约方 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (信息系统整合情况对照表.系统编号 / 农村电子商务系统建设规划.应整合系统清单) < 0.8 || (数据共享交换统计表.成功/失败次数 / 数据共享交换统计表.交换频次 > 0.05)
  description: 整合完成率低于80%，或数据交换失败率超过5%，均视为系统整合不力、数据共享不充分，存在信息孤岛风险。完成率越低、失败率越高则违规程度越严重。
  audit_item: 信息系统在线服务支撑和保障不足
  suspicion: 农村电商系统整合率低存在信息孤岛
  regulation: "[\n  {\n    \"法规名称\": \"政务信息资源共享管理暂行办法\",\n    \"法规文号\": \"国发〔2016〕51号\",\n    \"效力级别\": \"行政法规\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"政务信息资源以共享为原则，不共享为例外。各政务部门应按规定编制政务信息资源目录，明确共享条件，推动数据共享。\"\n  },\n  {\n    \"法规名称\": \"\
    促进大数据发展行动纲要\",\n    \"法规文号\": \"国发〔2015〕50号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三部分第(二)项\",\n    \"内容概述\": \"\
    大力推动政府信息系统"
- expression: 部门间信息共享协议.共享协议签署状态 = '未签署' || 财政与保险机构数据接口日志.接口调用记录 IS NULL || 跨部门数据比对差异分析表.差异金额 > 0 && 跨部门数据比对差异分析表.差异原因 !=
    '已整改闭环'
  description: 未签署共享协议、无任何数据交换记录，或发现关键数据（如投保基数）存在重大差异且无纠正措施，即表明共享机制缺失或失效。
  audit_item: 农业保险保费补贴政策落实不到位
  suspicion: 部门间农业保险信息共享机制未建立
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十二条\"\
    ,\n    \"内容概述\": \"财政部门、保险监督管理机构等有关部门应当建立信息共享机制，加强对农业保险的监管。\"\n  },\n  {\n    \"法规名称\": \"中央财政农业保险保险费补贴管理办法\",\n    \"\
    法规文号\": \"财金〔2021〕94号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第三十八条\",\n    \"内容概述\": \"省级财政部门应当建立农业保险信息共享机制，推动财政、农业农村"
- expression: 跨部门保单信息比对差异表.差异金额 > 0 && (跨部门保单信息比对差异表.差异类型 IN ('面积超限','撂荒投保','多头补贴')) && (财政补贴资金发放清单.发放时间 > 农业部门种植/养殖面积统计表.数据生成日期)
  description: 跨部门差异表中存在差异金额，且差异属于面积虚增、已撂荒地块投保或多头补贴类型，同时财政补贴发放时点晚于农业部门数据更新日期，表明共享数据未有效利用，造成无效补贴。差异金额大于零即触发疑点。
  audit_item: 农业保险保费补贴被骗取、套取，损失浪费
  suspicion: 部门数据共享不足导致财政资金浪费
  regulation: "[\n  {\n    \"法规名称\": \"农业保险条例\",\n    \"法规文号\": \"国务院令第629号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第四条\"\
    ,\n    \"内容概述\": \"国务院财政、农业、林业、保险监督管理等部门应当建立农业保险相关信息的共享机制。\"\n  },\n  {\n    \"法规名称\": \"中央财政农业保险保险费补贴管理办法\",\n    \"\
    法规文号\": \"财金〔2021〕41号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十八条\",\n    \"内容概述\": \"地方财政部门应会同有关部门加强投保标的真实性、准确性审核，确保财政补"
