name: audit/合同协议类/协议
type: model
description: 从合同协议类类文档（协议）中提取结构化元数据。涵盖字段如：交易价格、交易金额、付款方式与期限、付款条件、代收总金额、价格条款、减免约定、协议类型。文档范围包括：开发商代收维修资金的协议、服务合同/协议、资产处置合同/协议、资产转让合同/协议、项目单位与政府部门签订的协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 协议
- 合同
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 协议
  member_count: 1
  member_details:
  - 开发商代收维修资金的协议
  - 服务合同/协议
  - 资产处置合同/协议
  - 资产转让合同/协议
  - 项目单位与政府部门签订的协议
output:
  fields:
  - name: 交易价格
    type: number
    description: 提取 交易价格 的数值（含单位，如万元、吨等）
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款方式与期限
    type: number
    description: 提取 付款方式与期限 的数值（含单位，如万元、吨等）
  - name: 付款条件
    type: number
    description: 提取 付款条件 的数值（含单位，如万元、吨等）
  - name: 代收总金额
    type: number
    description: 提取 代收总金额 的数值（含单位，如万元、吨等）
  - name: 价格条款
    type: number
    description: 提取 价格条款 的数值（含单位，如万元、吨等）
  - name: 减免约定
    type: string
    description: 提取 减免约定 的文本值
  - name: 协议类型
    type: string
    description: 提取 协议类型 的文本值
  - name: 协议约定缴存时限
    type: string
    description: 提取 协议约定缴存时限 的文本值
  - name: 受让方全称
    type: string
    description: 提取 受让方全称 的文本值
  - name: 合同签署日期
    type: date
    description: 提取 合同签署日期 的日期值，格式 YYYY-MM-DD
  - name: 合同签订主体
    type: string
    description: 提取 合同签订主体 的文本值
  - name: 实际交易方式
    type: string
    description: 提取 实际交易方式 的文本值
  - name: 开发商名称
    type: string
    description: 提取 开发商名称 的文本值
  - name: 成交价格
    type: number
    description: 提取 成交价格 的数值（含单位，如万元、吨等）
  - name: 排他性条款
    type: number
    description: 提取 排他性条款 的数值（含单位，如万元、吨等）
  - name: 服务提供方
    type: string
    description: 提取 服务提供方 的文本值
  - name: 费用条款
    type: number
    description: 提取 费用条款 的数值（含单位，如万元、吨等）
  - name: 转让标的行业描述
    type: string
    description: 提取 转让标的行业描述 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (协议.实际交易方式 != 审批文件.批准的处置方式（拍卖、招标、协议等）) || (ABS(协议.成交价格 - 评估报告.评估价值) / 评估报告.评估价值 > 0.2) || (记录表.上缴国库金额 < 协议.成交价格)
  description: 实际处置方式与批准方式不一致，或成交价偏离评估价超过20%（低价转让），或处置收入未全额上缴国库，均构成未按规定处置。可根据实际情况调整偏离阈值。
  audit_item: 违规处置国有资产
  suspicion: 经审批同意处置的国有资产未按规定进行处置
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国资委 财政部令第32号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十二条、第四十四条\",\n    \"内容概述\": \"企业国有资产交易应在依法设立的产权交易机构中公开进行；转让价格应以经核准或备案的资产评估结果为参考依据；处置收入应按规定上缴。\"\n  },\n  {\n\
    \    \"法规名称\": \"行政事业性国有资产管理条例\",\n    \"法规文号\": \"国务院令第738号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第三十条\",\n   \
    \ \"内容概述\""
- expression: ( 流水.付款方名称 = 信息.高管名单 && 信息.与被审计单位人事关联情况 = '人事或股权关联' && 协议.排他性条款 = '指定/唯一/必须' ) && ( ABS(明细台账.收费标准 - 调查资料.同类服务市场均价)/调查资料.同类服务市场均价
    > 0.3 || 明细台账.服务提供方 != '公开竞争方式确定' )
  description: 当满足以下条件时触发疑点：①收款方为被审计单位下属、控股或存在人事关联的企业；②服务合同明确限定唯一服务提供商或变相排除其他竞争者；③收费标准与同类服务市场均价的偏差率大于30%，或根本未履行招标、竞争性谈判等公开选取程序。三项条件同时满足，即可判定为依托行政权力垄断经营且高价收费。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 依托行政权力垄断经营并高价收费
  regulation: "[\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第二十三条\",\n    \"内容概述\": \"行政机关和法律、法规授权的具有管理公共事务职能的组织不得强制或者变相强制市场主体接受中介服务、购买指定商品、参加有偿培训等，不得指定或者变相指定中介服务机构、商品供应商、培训机构。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国反垄断法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第三十二条\"\
    ,\n   "
- expression: (开发商代收资金与专户实际到账金额对比表.代收金额 - 开发商代收资金与专户实际到账金额对比表.实际到账金额) > 0 AND (开发商代收资金与专户实际到账金额对比表.最晚到账日期 - 开发商代收维修资金的协议.协议约定缴存时限)
    > 30天
  description: 开发商代收资金与专户实际到账存在差异，且超过代收协议约定的缴存期限30天以上仍未足额转入的，视为占用挪用。差异金额直接体现占用规模。
  audit_item: 住宅专项维修资金归集不到位
  suspicion: 开发商代收维修资金后长期占用挪用
  regulation: "[\n  {\n    \"法规名称\": \"住宅专项维修资金管理办法\",\n    \"法规文号\": \"建设部、财政部令第165号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十七条\",\n    \"内容概述\": \"挪用住宅专项维修资金的，由主管部门追回挪用的资金，没收违法所得，可处罚款；构成犯罪的，依法追究刑事责任。\"\n  }\n]"
- expression: ((协议.用地性质 == '划拨' && 项目性质 IN ('经济适用房','公租房','棚改房')) || (政策文件.减免税种 == '城市基础设施配套费' && 项目性质 IN ('经济适用房','公租房','棚改房')))
    && (税费凭证.缴纳金额 > 0 && 税费凭证.票据备注 != '已减免')
  description: 当保障性安居工程项目以划拨方式供地或按规定免征城市基础设施配套费时，若土地出让合同或票据显示实际缴纳了出让金、配套费且未标记减免，则判定为违规。缴纳金额大于0且无对应减免备案记录的，视为违规收取。
  audit_item: 违规向保障性安居工程项目收取应减免税费
  suspicion: 违规向安居工程项目征收土地出让金或配套费
  regulation: "[\n  {\n    \"法规名称\": \"国务院关于解决城市低收入家庭住房困难的若干意见\",\n    \"法规文号\": \"国发〔2007〕24号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第五条第（十九）项\",\n    \"内容概述\": \"经济适用住房和廉租住房建设用地实行行政划拨方式供应，免收城市基础设施配套费等各种行政事业性收费和政府性基金。\"\n  }\n]"
