name: audit/合同协议类/交易合同
type: model
description: 从合同协议类类文档（交易合同）中提取结构化元数据。涵盖字段如：交易价格、交易品种、交易条件、合同价格、合同单价、合同签订日期、合同编号、合同金额。文档范围包括：交易合同、关联交易合同、重大交易合同、金融衍生品交易合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 交易合同
  member_count: 1
  member_details:
  - 交易合同
  - 关联交易合同
  - 重大交易合同
  - 金融衍生品交易合同
output:
  fields:
  - name: 交易价格
    type: number
    description: 提取 交易价格 的数值（含单位，如万元、吨等）
  - name: 交易品种
    type: string
    description: 提取 交易品种 的文本值
  - name: 交易条件
    type: string
    description: 提取 交易条件 的文本值
  - name: 合同价格
    type: number
    description: 提取 合同价格 的数值（含单位，如万元、吨等）
  - name: 合同单价
    type: number
    description: 提取 合同单价 的数值（含单位，如万元、吨等）
  - name: 合同签订日期
    type: date
    description: 提取 合同签订日期 的日期值，格式 YYYY-MM-DD
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 名义本金
    type: string
    description: 提取 名义本金 的文本值
  - name: 对方单位
    type: string
    description: 提取 对方单位 的文本值
  - name: 支付方式
    type: string
    description: 提取 支付方式 的文本值
  - name: 标的物或服务内容
    type: string
    description: 提取 标的物或服务内容 的文本值
  - name: 签约方名称
    type: string
    description: 提取 签约方名称 的文本值
  - name: 签订方
    type: string
    description: 提取 签订方 的文本值
  - name: 纳税识别号
    type: string
    description: 提取 纳税识别号 的文本值
  - name: 货物-服务交付条款
    type: number
    description: 提取 货物-服务交付条款 的数值（含单位，如万元、吨等）
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (重大交易合同.货物/服务交付条款 == 无物流单证 || 无交付记录) && (应付账款明细表.账龄 > 360天) || (原始会计凭证.对方单位 IN (关联方交易披露文件.关联方名称 WHERE 关联方交易披露文件.交易内容
    == NULL) && (银行对账单.交易对手 != 原始会计凭证.对方单位))
  description: 筛查虚构交易以虚增收入的疑点：条件一，合同缺乏关键交付证明且形成长期大额应收款（超过360天），可能为虚假销售；条件二，交易对手为未披露的关联方且资金未直接流向对手方，表明交易可能无商业实质。满足任一组合条件即判定为疑点。
  audit_item: 会计账簿不真实、不完整或以虚假的经济业务事项或者资料进行会计核算
  suspicion: 虚构经济业务交易进行虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条、第十六条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者事项为依据进行会计确认、计量和报告，如实反映符合确认和计量要求的各项会计要素及其他相关信息，保证会计信息真实可靠、内容完整。\"\n  }\n\
    ]"
- expression: (明细表.交易对手方 IN (系申报表.特定关系人企业名称)) && (ABS(合同单价.合同单价-信息.同期同类商品/服务市场价格)/信息.同期同类商品/服务市场价格 > 0.15 || 其他.验收合格率 > 0.1
    || 明细表.付款条件为'预付80%以上' || 账期超过180天)
  description: 筛查与特定关系人企业的交易是否存在价格不公（偏差±15%以上）、质量低劣（不合格率超10%）或付款条件异常（大额预付或超长账期）等问题，任一异常即触发。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 特定关系人企业与本企业发生可能侵害利益的经济业务往来
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第五项\",\n    \"内容概述\": \"不得有本人的配偶、子女及其他特定关系人投资或者经营的企业与本企业或者有出资关系的企业发生可能侵害公共利益、企业利益的经济业务往来。\"\n  }\n]"
- expression: (ABS(分析表.实际成交价格 - 评估报告.评估价值) / 评估报告.评估价值 > 0.2) AND (交易合同.对方单位 IN 关系名单) AND (交易类型 = ‘领导人员卖出’ OR 交易类型 = ‘领导人员买入’)
  description: 企业领导人员与特定关系人交易的资产价格偏离评估价值或市场均价超过20%，即为异常。卖出价格明显低于评估价值（<0.8倍），或买入价格明显高于评估价值（>1.2倍）均触发。特定关系人包括亲属、特定关联方。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 向特定关系人低价出售或高价购买资产
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（三）项\",\n    \"内容概述\": \"不得以明显低于市场的价格向请托人购买或者以明显高于市场的价格向请托人出售房屋、汽车等物品，或者以其他交易形式非法收受请托人财物。\"\n  }\n]"
- expression: (关联台账.对应合同编号 IS NULL AND 发票.金额 > 5000) OR (ABS(发票.金额 - 交易合同.合同金额) / 交易合同.合同金额 > 0.1 AND 明细表.审批意见 NOT LIKE '%补充协议%')
  description: 发票无对应合同且金额较大（>5000元），或发票金额与合同金额偏差率超过10%且报销审批未注明补充协议，表明发票业务可能不实。
  audit_item: 未按照规定填制、取得原始凭证或者填制、取得的原始凭证不符合规定
  suspicion: 使用票面记载事项与实际经济业务不符的发票报销入账
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国会计法\",\n    \"法规文号\": \"主席令第24号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第九条\"\
    ,\n    \"内容概述\": \"各单位必须根据实际发生的经济业务事项进行会计核算，不得以虚假的经济业务事项或者资料进行会计核算。\"\n  }\n]"
- expression: 验真结果、开票单位、开票方纳税识别号.验真结果 != '真实' OR (验真结果、开票单位、开票方纳税识别号.开票方纳税识别号 != 交易合同.纳税识别号 AND 交易合同.签约方类型 != '个人' AND 发票及附件.金额
    > 5000)
  description: 发票验真结果为假票，或开票方纳税识别号与任意有效合同签约方均不匹配且金额较大（>5000元），表明发票可能来自非法渠道，属代开、虚开发票。
  audit_item: 未按照规定填制、取得原始凭证或者填制、取得的原始凭证不符合规定
  suspicion: 使用未按法定渠道取得的发票报销入账
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国发票管理办法\",\n    \"法规文号\": \"国务院令第587号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"不符合规定的发票，不得作为财务报销凭证，任何单位和个人有权拒收。\"\n  }\n]"
- expression: ( (审批表.表决结果 IS NULL OR 审批表.审批日期 > 明细表.交易日期) AND 明细表.金额 > 0 ) OR ( 明细表.风险敞口占净资产比例 > 管理制度.止损限额 ) OR ( 明细表.品种 IN
    (管理制度.禁止交易品种清单) )
  description: 分三部分判定：①交易发生但无对应集体决策审批记录，或者审批日期晚于实际交易日期，表明先斩后奏或未经审批；②风险敞口占净资产比例超过企业风险管理制度规定的最高限额，表明内控执行失效；③交易品种属于企业制度明令禁止的高风险衍生品，属于违规超范围经营。任一条件成立即触发疑点。
  audit_item: 违规进行重大资本运作及高风险投资
  suspicion: 未经集体决策或违规决策开展高风险金融衍生品交易
  regulation: "[\n  {\n    \"法规名称\": \"中央企业投资监督管理办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会令第34号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第十四条\",\n    \"内容概述\": \"中央企业应当建立健全投资管理制度，明确投资决策程序，重大投资应当经董事会审议决定，不得违规决策，严禁任何个人或组织擅自决定重大投资事项。\"\n  },\n\
    \  {\n    \"法规名称\": \"关于切实加强金融衍生业务管理有关事项的通知\",\n    \"法规文号\": \"国资发财评规〔2020〕8号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第"
- expression: (资产评估报告.评估基准日 IS NULL) || (资产交易明细表.交易价格 / 资产评估报告.评估价值 < 0.9) || (资产交易明细表.是否关联方 = '是' && 改革决策文件.公示记录 IS NULL)
    || (改革决策文件.改革方案是否经职工代表大会审议 IS NULL)
  description: 无评估报告直接违规；交易价格低于评估价90%视为异常低价；交易对象为管理层亲属等关联方且未披露或未经职工代表大会审议，存在利益输送嫌疑；缺少职工代表大会决议，程序违规。
  audit_item: 供销合作社联合社治理机制不健全
  suspicion: 社有企业改革过程中资产交易不公开透明导致资产流失
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产评估管理暂行办法\",\n    \"法规文号\": \"国务院国资委令第12号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第六条、第二十二条\",\n    \"内容概述\": \"企业改制、产权转让等经济行为应当对相关资产进行评估；评估结果作为交易价格的参考依据，交易价格低于评估结果的90%时，应当暂停交易。\"\n  }\n]"
