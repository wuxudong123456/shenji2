    type: number
    description: 提取 专项用途约束条款 的数值（含单位，如万元、吨等）
  - name: 借款企业名称
    type: number
    description: 提取 借款企业名称 的数值（含单位，如万元、吨等）
  - name: 借款方
    type: number
    description: 提取 借款方 的数值（含单位，如万元、吨等）
  - name: 借款用途
    type: number
    description: 提取 借款用途 的数值（含单位，如万元、吨等）
  - name: 利率
    type: string
    description: 提取 利率 的文本值
  - name: 利率条款
    type: number
    description: 提取 利率条款 的数值（含单位，如万元、吨等）
  - name: 利率确定方式
