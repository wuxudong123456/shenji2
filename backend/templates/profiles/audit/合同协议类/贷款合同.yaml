violations:
- expression: (明细表.服务内容摘要 IS NULL OR 明细表.服务内容摘要 == '' OR 不存在对应的服务成果文件) && 明细表.客户名称（中小微企业标识） == '中小微企业'
  description: 向中小微企业收取了财务顾问费等中间业务费用，但无法提供任何能证明其提供了实质性服务、令客户受益的文件记录（如尽调报告、融资方案、管理建议书、咨询回复等），即判定为无实质服务违规收费。
  audit_item: 未按规定落实降成本政策措施
  suspicion: 金融机构无实质服务违规收取财务顾问费
  regulation: "[\n  {\n    \"法规名称\": \"中国银监会关于整治银行业金融机构不规范经营的通知\",\n    \"法规文号\": \"银监发〔2012〕3号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条第（一）款、第（二）款\",\n    \"内容概述\": \"“以贷收费”：不得在发放贷款或以其他方式提供融资时强制捆绑、搭售理财、保险、基金等产品。“浮利分费”：不得将利息分解为费用收取，严禁变相提高利率。服务收费应遵循质价相符原则，即提供服务、质价相符。\"\
    \n  },\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\": \"国务院令第722号\",\n    \"效力"
- expression: 监控表.受托支付对象 = 贷款合同.借款方 && (ABS = 0 || 贷款合同.贷款金额 > 税申报表.销售收入 * 0.5) && 评估报告.评估价值 > 0
  description: 贷款资金支付给关联虚构供应商，且申请材料中贸易合同规模远超实际经营能力，抵押物价值虚高，三者结合判定骗取贷款。
  audit_item: 资金管理方面存在的问题
  suspicion: 虚构贸易背景套取贷款
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国刑法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第一百七十五条之一\"\
    ,\n    \"内容概述\": \"以欺骗手段取得银行或者其他金融机构贷款，给银行或者其他金融机构造成重大损失的，构成骗取贷款罪。\"\n  }\n]"
- expression: 资产抵押登记查询记录.债务人 IN ("政府融资平台","政府项目公司") && 资产抵押登记查询记录.抵押权人 == "供销合作社" && (理事会决议文件 IS NULL || 理事会决议文件.表决记录 != "通过")
    && 贷款资金用途明细.最终使用方 != "供销社自身经营"
  description: 供销社以自有资产为政府融资平台或政府项目提供抵押担保，且未经理事会同意、贷款资金也未用于自身为农服务，违反禁止规定。高风险。
  audit_item: 供销合作社综合改革不合规
  suspicion: 社有资产违规为政府融资抵押
  regulation: "[\n  {\n    \"法规名称\": \"中共中央 国务院关于深化供销合作社综合改革的决定\",\n    \"法规文号\": \"中发〔2015〕11号\",\n    \"效力级别\": \"规范性文件\"\
    ,\n    \"条款号\": \"第三部分（十）\",\n    \"内容概述\": \"不得将社有资产纳入地方政府融资平台或用于为政府项目提供担保，确保社有资产安全完整。\"\n  }\n]"
- expression: （明细表.实际执行利率 - 政策规定的贷款利率.贴息率） > 政策规定的贷款利率.政策规定的贷款利率 || ABS(贷款合同.实际支付利息 - 贷款本金 * 政策规定的贷款利率.政策规定的贷款利率 * 贷款期限) >
    阈值
  description: 审查两个层面：1. 银行向企业收取的名义利率在扣除财政贴息后，企业实际承担的成本是否高于政策设定的低息目标；2. 是否存在以“手续费”、“咨询费”等名义额外收费，导致企业融资总成本偏离政策要求。
  audit_item: 畜禽粪污资源化利用方面不符合相关规定
  suspicion: 贷款贴息政策执行中变相提高融资成本
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国中小企业促进法\",\n    \"法规文号\": \"中华人民共和国主席令第七十四号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十四条\",\n    \"内容概述\": \"金融机构应当根据中小企业特点，为其提供公平、透明的金融服务，不得违规收取费用。\"\n  }\n]"
- expression: 贴息资金预算科目.安排金额 = 0 && 贴息文件.兑现周期 || (贴息文件.兑现周期 - 申报材料.申报贴息额) > 180 天 && 发放记录.发放金额 < 申报材料.申报贴息额 * 0.8
  description: 已出台明确贴息政策但财政未安排对应预算，或兑现延迟超过6个月，或实际发放金额不足应发额的80%，视为贴息政策空转。
  audit_item: 相关支持政策落实不到位
  suspicion: 涉农贷款贴息资金未安排或长期拖欠
  regulation: "[\n  {\n    \"法规名称\": \"财政部 农业农村部关于进一步做好农业相关财政金融政策落实工作的通知\",\n    \"法规文号\": \"财农〔2020〕XX号（示例）\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"各级财政要将涉农贷款贴息资金足额纳入年度预算，及时审核拨付，不得无故拖延或降低兑现标准。\"\n  }\n]"
- expression: (SUM(统计表.发放金额 WHERE 统计表.担保方式 == '信用') / SUM(统计表.发放金额)) < 普惠型涉农贷款增速或信用贷款占比等监管目标、贴息比例、贴息资金申请与拨付流程.普惠型涉农贷款增速或信用贷款占比等监管目标
  description: 计算所有涉农贷款中，以纯信用方式发放的贷款金额占比。若该占比低于政策考核文件要求的提升新型农业经营主体信用贷款占比的目标值（该目标值需从具体监管文件提取，如“力争信用贷款占比显著提高”可设定一个审计假设阈值进行筛查），则表明银行偏好抵押担保物，政策落实可能存在棚架。
  audit_item: 相关支持政策落实不到位
  suspicion: 涉农贷款信用放款占比不达监管要求
  regulation: "[\n  {\n    \"法规名称\": \"中国银保监会办公厅关于2021年银行业保险业高质量服务乡村振兴的通知\",\n    \"法规文号\": \"银保监办发〔2021〕44号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"各级监管部门要督促银行机构建立服务乡村振兴内设机构，保持同口径涉农贷款余额和普惠型涉农贷款余额持续增长。鼓励银行业金融机构建立服务乡村振兴的内部转移定价和绩效考核机制，适当提高信用贷款占比。\"\
    \n  }\n]"
- expression: (明细表.支出收款方 NOT IN (批复文件.建设内容)) || (明细表.用途说明 NOT LIKE '%安居工程%' && 明细表.用途说明 NOT LIKE '%棚改%' && 明细表.用途说明 NOT LIKE
    '%保障房%') || (明细表.支出日期 < 匹配表.实际已付款) || (对比表.偏差率 ABS > 0.3 && 对比表.预算科目 NOT IN ('不可预见费','材料价差'))
  description: 判定规则：1)贷款资金收款单位不在项目批复或合同约定的参建单位清单中，疑为挪用；2)资金用途摘要与保障房建设关键词（安居工程、棚改、保障房）均不相关；3)支付日期早于合同约定应付日期，可能存在超前支付挪用；4)实际支出超出预算30%以上且非合理科目，疑为虚列成本挪用。以上条件满足任一即触发高风险疑点。
  audit_item: 挪用或违规使用保障性安居工程银行贷款或住房公积金项目贷款
  suspicion: 商业银行保障房贷款资金挪用
  regulation: "[\n  {\n    \"法规名称\": \"固定资产贷款管理暂行办法\",\n    \"法规文号\": \"中国银行业监督管理委员会令2009年第2号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第三十八条\",\n    \"内容概述\": \"贷款人应与借款人约定明确、合法的贷款用途，并按照约定检查、监督贷款的使用情况，防止贷款被挪用。\"\n  },\n  {\n    \"法规名称\":\
    \ \"国务院办公厅关于保障性安居工程建设和管理的指导意见\",\n    \"法规文号\": \"国办发〔2011〕45号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"三（六）\",\n \
    \   \"内容概述\""
- expression: (支出明细表.收款单位 NOT IN (项目立项批复文件.建设内容)) && (支出明细表.支出类别 IN ('市政道路','工资发放','偿还旧债') ) || (支出明细表.金额 > 1000000 && 支出明细表.用途说明
    NOT LIKE '%棚改%' && 支出明细表.用途说明 NOT LIKE '%保障房%') && (匹配表.累计支付比例 - 匹配表.实际工程进度 > 0.2)
  description: 判定规则：1)收款方非参建名录且支出类别为市政道路、工资、还债等非工程支出，直接判为挪用；2)单笔大于100万元的支付，用途与棚改或保障房不相关，且资金支付比例高于工程进度20个百分点以上，表明资金已拨付但工程严重滞后，存在截留挪用。满足任一条件触发高风险。
  audit_item: 挪用或违规使用保障性安居工程银行贷款或住房公积金项目贷款
  suspicion: 政策性银行贷款挪用于非保障房项目
