name: audit/合同协议类/贷款合同
type: model
description: 从合同协议类类文档（贷款合同）中提取结构化元数据。涵盖字段如：专项用途约束条款、借款企业名称、借款方、借款用途、利率、利率条款、利率确定方式、利率调整条款。文档范围包括：养殖企业贷款合同、商业银行贷款合同、政策性银行贷款合同、贷款合同、金融机构涉农贷款合同、项目贷款合同（含利率条款）等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 项目
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 贷款合同
  member_count: 1
  member_details:
  - 养殖企业贷款合同
  - 商业银行贷款合同
  - 政策性银行贷款合同
  - 贷款合同
  - 金融机构涉农贷款合同
  - 项目贷款合同（含利率条款）
