name: audit/合同协议类/出借合同
type: model
description: 从合同协议类类文档（出借合同）中提取结构化元数据。涵盖字段如：上缴时限要求、出租租金金额、合同租金单价、合同签订日期、承租方信息、承租方名称、租期、租赁期限。文档范围包括：国有资产出租/出借合同、国有资产出租出借合同、资产出租出借合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 合同
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 出借合同
  member_count: 1
  member_details:
  - 国有资产出租/出借合同
  - 国有资产出租出借合同
  - 资产出租出借合同
output:
  fields:
  - name: 上缴时限要求
    type: string
    description: 提取 上缴时限要求 的文本值
  - name: 出租租金金额
    type: number
    description: 提取 出租租金金额 的数值（含单位，如万元、吨等）
  - name: 合同租金单价
    type: number
    description: 提取 合同租金单价 的数值（含单位，如万元、吨等）
  - name: 合同签订日期
    type: date
    description: 提取 合同签订日期 的日期值，格式 YYYY-MM-DD
  - name: 承租方信息
    type: string
    description: 提取 承租方信息 的文本值
  - name: 承租方名称
    type: string
    description: 提取 承租方名称 的文本值
  - name: 租期
    type: string
    description: 提取 租期 的文本值
  - name: 租赁期限
    type: string
    description: 提取 租赁期限 的文本值
  - name: 租金单价
    type: number
    description: 提取 租金单价 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (出借合同.合同租金单价 < 评估报告.同期同类资产市场租金下限 * 0.8) || (闲置资产认定标准、处置时限要求、出租审批权限、招租程序要求、租金定价规则.出租审批权限缺失关键节点) || (出借台账.收款金额
    != 出借合同.实收租金与合同应计差异 && 无减免审批文件) || (出借合同.承租方股东 in (员工亲属名单) && 会议纪要.表决结果 != '通过')
  description: 当租金明显低于市场价（低于市场下限80%）、审批流程缺失关键控制节点、实收租金与合同约定不一致且无有效减免审批，或关联人承租未经集体决策时，均构成违反规定出租出借。
  audit_item: 资产管理方面存在的问题
  suspicion: 违反内部规定出租出借资产
  regulation: "[\n  {\n    \"法规名称\": \"企业国有资产交易监督管理办法\",\n    \"法规文号\": \"国务院国有资产监督管理委员会 财政部令第32号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"企业国有资产交易应当遵守国家法律法规和政策规定，遵循等价有偿和公开、公平、公正的原则，在依法设立的产权交易机构中公开进行。\"\n  }\n]"
