name: audit/合同协议类/项目合同
type: model
description: 从合同协议类类文档（项目合同）中提取结构化元数据。涵盖字段如：中标供应商、人工费用占比、付款节点、付款节点及比例、供应商名称、保底收益条款、分包单位名称、劳务合同总价。文档范围包括：PPP项目合同、公路养护项目合同、农村公路建设项目合同、工程项目合同、项目合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 合同
- 工程
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 项目合同
  member_count: 1
  member_details:
  - PPP项目合同
  - 公路养护项目合同
  - 农村公路建设项目合同
  - 工程项目合同
  - 项目合同
