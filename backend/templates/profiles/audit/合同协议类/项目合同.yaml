violations:
- expression: (投资台账.单项工程实际投资额 - 单项工程概算金额.单项工程概算金额 > 单项工程概算金额.单项工程概算金额 * 0.1) && (支付报表.累计已计量工程量 > 项目合同.合同工程量 * 1.1 || 支付报表.累计已支付金额
    > 项目合同.合同总价 * 1.1) && (申请单.费用增加金额 == null || 申请单.批复意见 != "同意")
  description: 单项工程实际投资超出概算10%以上，并且计量工程量或支付金额超出原合同10%以上，同时缺乏有效变更批复文件，判定为成本控制违规。10%阈值参照水利工程变更管理的一般规定，超出且未批可视为擅自扩大建设规模或提高标准。
  audit_item: 大型水利工程进度与成本审计
  suspicion: 成本超支项目未履行变更审批程序
  regulation: "[\n  {\n    \"法规名称\": \"水利工程建设项目管理暂行规定\",\n    \"法规文号\": \"水建[1995]128号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第二十六条\",\n    \"内容概述\": \"建设项目投资必须严格控制在批准的概算范围内。确需调整概算的，必须按原审批程序报批。\"\n  },\n  {\n    \"法规名称\": \"水利工程设计变更管理暂行办法\"\
    ,\n    \"法规文号\": \"水规计[2012]93号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十条、第十七条\",\n    \"内容概述\": \"重大设计变更及涉及投资增加的变更必"
- expression: SUM(汇总表.预算金额) GROUP BY (建设单位, LEFT(建设内容摘要,10), YEAR(审批时间)) HAVING SUM(预算金额) > (SELECT 审批金额门槛 FROM 制度文件 WHERE
    层级='上级') AND COUNT(*)>1 AND MAX(汇总表.预算金额) <= (SELECT 审批金额门槛 FROM 制度文件 WHERE 层级='本级')
  description: 分组条件：同一建设单位，建设内容前10字相似（如含相同关键词），且审批时间在同一年度内。若分组后项目总预算超过上级审批金额阈值，且单个项目预算均未超过本级审批阈值，且子项目数量大于1，则高度疑似拆分规避审批。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 以拆分项目方式规避审批权限
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照规定的程序审批，不得超越审批权限审批政府投资项目；禁止通过化整为零等方式规避审批权限。\"\n  }\n]"
- expression: (汇总表.批准标准参数（如设计使用年限、材料规格、排放标准） < 标准编号.强制性技术参数（如抗震设防烈度、环保排放浓度、防火等级）) OR (项目合同.合同技术条款中的实际执行标准参数 < 汇总表.批准标准参数（如设计使用年限、材料规格、排放标准）)
    OR (验收报告.实测质量数据 < 汇总表.批准标准参数（如设计使用年限、材料规格、排放标准）)
  description: 三重判定：1.审批环节即降低强制性标准（批准值低于国家强制值）；2.合同约定进一步低于批准标准（执行值低于批准值）；3.实际建设成果未达到批准标准（验收实测值低于批准值）。任一环节成立即可认定为降低标准违规。
  audit_item: 违规审批、越权审批建设项目
  suspicion: 降低建设标准批准建设项目
  regulation: "[\n  {\n    \"法规名称\": \"建设工程质量管理条例\",\n    \"法规文号\": \"国务院令第279号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第十条\",\n    \"内容概述\": \"建设单位不得明示或者暗示设计单位或者施工单位违反工程建设强制性标准，降低建设工程质量。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国标准化法\",\n\
    \    \"法规文号\": \"中华人民共和国主席令第78号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十五条\",\n    \"内容概述\": \"不符合强制性标准的产品、服务，不得生产、销售、进口或者提供。"
- expression: SUM(项目合同.合同金额) GROUP BY 项目合同.承包单位名称, YEAR(项目合同.合同签订日期) > 招标投标管理办法及招标文件.强制招标金额标准 && COUNT(项目合同.合同编号) > 1 && MAX(项目合同.合同金额)
    < 招标投标管理办法及招标文件.强制招标金额标准
  description: 将同一时期内本应作为一个整体招标的项目，人为拆分为若干个小额合同，使每个合同金额均低于招标限额，从而逃避招标监管。表达式按年、按承包单位汇总合同金额，若总额超过限额但单笔合同均未达到，则判定为化整为零。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 化整为零规避招标
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国招标投标法\",\n    \"法规文号\": \"主席令第21号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第四条\",\n    \"内容概述\": \"任何单位和个人不得将依法必须进行招标的项目化整为零或者以其他任何方式规避招标。\"\n  }\n]"
- expression: 各级分包商资质等级.资质等级 < 核查表.项目要求的最低资质等级 || (项目合同.承包单位名称 != 各级分包商资质等级.企业名称) || 各级分包商资质等级.有效期 < 项目合同.合同签订日期
  description: 承包单位不具备承接该工程所必需的资质等级，或资质证书过期、借用资质等情形。表达式将实际承包单位的资质与项目所需最低资质比对，等级不足、证书有效期已过或单位名称不一致均判定违规。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 违规发包给无资质单位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国建筑法\",\n    \"法规文号\": \"主席令第91号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\"\
    ,\n    \"内容概述\": \"承包建筑工程的单位应当持有依法取得的资质证书，并在其资质等级许可的业务范围内承揽工程。禁止建筑施工企业超越本企业资质等级许可的业务范围或者以任何形式用其他建筑施工企业的名义承揽工程。\"\n  }\n\
    ]"
- expression: 支付明细表.累计已支付金额 / 项目合同.合同金额 > 支付凭证.实际完成工程量百分比 + 合同约定偏差
  description: 工程进度款支付应与实际完成工程量相匹配。表达式将累计支付比例与经确认的实际进度比例进行比较，若支付比例远超进度，超出约定允许偏差（如10%），则认定为超拨。一般无特殊约定时，偏差阈值超过10%即预警。
  audit_item: 工程项目管理方面存在的问题
  suspicion: 未按合同约定进度超拨工程款
  regulation: "[\n  {\n    \"法规名称\": \"建设工程价款结算暂行办法\",\n    \"法规文号\": \"财建〔2004〕369号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十三条\",\n    \"内容概述\": \"工程进度款根据确定的工程计量结果，承包人向发包人提出支付申请，发包人应按不低于工程价款的60%，不高于工程价款的90%向承包人支付工程进度款，但须强调按实际完成工程量结算。\"\n\
    \  }\n]"
- expression: GIS_OVERLAP(规划路线坐标.规划路线坐标, 政策文件.基本农田保护区范围) == TRUE && (登记台账.整改状态 != '已解决' || 登记台账.解决时效超过6个月)
  description: 通过空间分析发现公路规划线与基本农田、生态红线等禁止建设区重叠，且未及时调整规划或未在规定期限（如6个月）内解决冲突，判定为规划不协调。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 农村公路建设规划与土地利用总体规划冲突
  regulation: "[\n  {\n    \"法规名称\": \"农村公路建设管理办法\",\n    \"法规文号\": \"交通运输部令2018年第4号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"农村公路建设规划应当符合国民经济和社会发展规划、土地利用总体规划，并与城乡规划、环境保护规划等相协调。\"\n  }\n]"
- expression: SET_DIFF(验收移交并达到养护标准的路线编码集合, 登记表.列养路段编码).COUNT > 0 || (TABLE(明细表).分配路段编码 无资金分配的路线编码存在于验收合格路线中)
  description: 已竣工并移交的农村公路，未在列养路段登记表中，或养护资金未覆盖，即为有路未养。
  audit_item: 农村公路管理养护体制的建立，以及建设规划、建设计划的编制不符合相关规定
  suspicion: 农村公路未纳入列养范围
  regulation: "[\n  {\n    \"法规名称\": \"农村公路养护管理办法\",\n    \"法规文号\": \"交通运输部令2015年第22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"农村公路养护管理应当遵循县道县管、乡村道乡村管的原则，将所有农村公路纳入养护范围。\"\n  }\n]"
- expression: 政府支出责任.保底收益条款 == '是' OR 政府支出责任.隐性担保条款 == '是' OR (年度财政支出责任.年度财政支出责任 / 本级一般公共预算支出.本级一般公共预算支出 * 100 > 10)
  description: 合同存在固定回报或隐性担保，或者测算的年度财政支出责任超过一般公共预算支出的10%，即认定为变相举债，形成政府隐性债务。
  audit_item: 违反高标准农田项目规划和管理规定的行为
  suspicion: 利用PPP模式变相举债建设高标准农田
  regulation: "[\n  {\n    \"法规名称\": \"财政部关于推进政府和社会资本合作规范发展的实施意见\",\n    \"法规文号\": \"财金〔2019〕10号\",\n    \"效力级别\": \"部门规范性文件\"\
    ,\n    \"条款号\": \"二（二）\",\n    \"内容概述\": \"确保每一年度本级全部PPP项目从一般公共预算列支的财政支出责任，不超过当年本级一般公共预算支出的10%。严禁通过‘保底承诺’‘回购安排’等方式变相举债。\"\
    \n  }\n]"
- expression: (年度政府支出责任 / 一般公共预算支出 > 10%) || (社会资本方实际出资 / 约定出资 < 0.9) || (合同中存在固定回报承诺条款)
  description: PPP项目政府支出责任占比超过一般公共预算支出10%红线，直接违反财经纪律；社会资本方资本金到位率低于90%为出资不实；合同中存在固定回报或政府兜底条款即构成隐性债务。
  audit_item: 项目实施不到位
  suspicion: PPP项目突破财政承受能力红线
  regulation: "[\n  {\n    \"法规名称\": \"政府和社会资本合作项目财政承受能力论证指引\",\n    \"法规文号\": \"财金〔2015〕21号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"第二十二条、第二十五条\",\n    \"内容概述\": \"每一年度全部PPP项目需要从预算中安排的支出责任，占一般公共预算支出比例应当不超过10%。\"\n  },\n  {\n    \"法规名称\"\
    : \"关于进一步规范地方政府举债融资行为的通知\",\n    \"法规文号\": \"财预〔2017〕50号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"三\",\n    \"内容概述\"\
    : \"地方政"
- expression: ((项目建设进度跟踪表.实际进度-项目建设进度跟踪表.计划进度)/项目建设进度跟踪表.计划进度<-0.3 && 项目延期申请及批复记录.批复 IS NULL) || (项目合同及补充协议.计划竣工日期 < 当前日期-180天
    && 项目验收报告.实际验收日期 IS NULL) || (项目资金使用明细表.累计支付比例>=0.8 && 项目建设进度跟踪表.实际完工比例<0.6)
  description: 进度偏差超过-30%且无合规延期批复、或竣工日期超期180天仍未验收、或资金支付比例达80%但实际进度不足60%，均属于严重进度滞后，触发违规认定。
  audit_item: 项目实施管理不到位
  suspicion: 项目建设进度慢、未按时完工或验收
  regulation: "[\n  {\n    \"法规名称\": \"政府投资条例\",\n    \"法规文号\": \"国务院令第712号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十四条\"\
    ,\n    \"内容概述\": \"政府投资项目应当按照国家有关规定和合同约定执行建设工期，不得随意压缩合理工期，项目单位应严格管理，确保项目按期建成发挥效益。\"\n  },\n  {\n    \"法规名称\": \"基本建设财务规则\"\
    ,\n    \"法规文号\": \"财政部令第81号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第二十七条\",\n    \"内容概述\": \"项目单位应按照合同约定和工程进度支付工程"
- expression: (项目交叉比对清单.相似度评分>0.8 && 项目资金使用明细表.拨付总额>0) || (项目设备采购清单.设备型号 IN (SELECT 设备型号 FROM 其他项目设备采购清单 WHERE 采购年度 BETWEEN
    本年度-2 AND 本年度) && 项目单位相同) || (项目效益产出对比分析表.投入产出比-同类项目.投入产出比<-0.3)
  description: 通过交叉比对清单发现相似度超80%、或同一单位3年内采购相同型号设备、或新项目投入产出比低于同类项目30%以上，即认定为重复建设。
  audit_item: 项目实施管理不到位
  suspicion: 同类项目重复建设造成资金浪费
  regulation: "[\n  {\n    \"法规名称\": \"农业农村部关于进一步加强农业建设项目管理工作的通知\",\n    \"法规文号\": \"农计财发〔2017〕4号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第三条\",\n    \"内容概述\": \"严格项目立项储备，建立项目库查重机制，防止多头申报、重复建设同一建设内容。\"\n  },\n  {\n    \"法规名称\": \"中央预算内投资补助和贴息项目管理办法\"\
    ,\n    \"法规文号\": \"国家发展改革委令第45号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"项目单位不得通过重复申报"
- expression: (项目资金使用明细表.收款方名称 != 项目合同.供应商名称 && 项目资金使用明细表.收款方性质='个人') || (项目设备采购清单.验收日期 < 项目设备采购清单.发票日期) || (项目申报材料真实性核查对照表.资质伪造=TRUE)
    || (项目验收报告.验收工程量 > 项目现场核查记录.实际测量工程量*1.1)
  description: 资金去向与合同方不一致、验收日期早于发票日期（时间倒挂）、资质材料伪造、或验收工程量虚报超10%，均构成弄虚作假行为。
  audit_item: 项目实施管理不到位
  suspicion: 项目申报建设环节弄虚作假
  regulation: "[\n  {\n    \"法规名称\": \"财政违法行为处罚处分条例\",\n    \"法规文号\": \"国务院令第427号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第九条\",\n    \"内容概述\": \"单位和个人违反国家投资建设项目规定，虚报投资完成额、虚列支出、骗取财政资金的，责令改正，追回有关财政资金，并依法给予处罚。\"\n  },\n  {\n    \"法规名称\":\
    \ \"中华人民共和国政府采购法\",\n    \"法规文号\": \"主席令第68号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第七十七条\",\n    \"内容概述\": \"供应商提供虚假材料谋取中标、成交"
- expression: 统计表.劳务报酬总额 / 统计表.项目总投资 < 规定最低劳务报酬比例(如0.3)
  description: 计算以工代赈项目实际发放的劳务报酬占总投资的比重，若低于国家规定的比例（通常为30%），则判定为违规。
  audit_item: 项目建设养护资金管理使用不规范
  suspicion: 以工代赈项目劳务报酬比例低于规定标准
  regulation: "[\n  {\n    \"法规名称\": \"《国家以工代赈管理办法》\",\n    \"法规文号\": \"国家发展改革委令第58号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第三十六条\",\n    \"内容概述\": \"实施以工代赈项目应按照不低于中央投资30%的比例发放劳务报酬，确保群众就近务工增收。\"\n  }\n]"
- expression: (支付凭证.发票金额 > 项目合同.单价 * 项目合同.数量 * 1.2) || (支付凭证.开具方为个人 AND 支付凭证.开具方 NOT IN (拆迁补偿协议.被补偿人签字)) || ((项目进度表.累计已拨付资金
    / 项目合同.合同金额) - 项目进度表.实际完工比例 > 0.15)
  description: 工程款支付超过按实际进度计算应付金额的20%，或个人收款缺乏拆迁协议支撑，或资金拨付进度严重超前于实际工程进度15个百分点以上，即触发虚报套取疑点。
  audit_item: 保障性安居工程企业债券使用不合规
  suspicion: 虚报工程进度或成本套取债券资金
  regulation: "[\n  {\n    \"法规名称\": \"保障性安居工程资金管理办法\",\n    \"法规文号\": \"财综〔2019〕31号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十七条\",\n    \"内容概述\": \"严禁在保障性安居工程专项资金中虚列支出、套取资金，不得以任何形式弄虚作假骗取财政补助。\"\n  }\n]"
- expression: (工程款支付进度对比表.实际付款日期 - 工程款支付进度对比表.合同约定付款日期 > 30天) || ((应付账款明细表.账龄 > 180天) && (应付账款明细表.欠款事由 == '工程款' || 应付账款明细表.欠款事由
    == '材料款'))
  description: 判定规则：1. 单个付款节点实际支付日期超出合同约定日期30天以上，视为违规延期支付；2. 在应付账款明细表中，与工程或材料相关的应付款项账龄超过6个月（180天）未支付，视为严重拖欠。符合任一条件即触发疑点。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 工程款项支付超合同约定期限
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第八条、第九条\",\n    \"内容概述\": \"机关、事业单位从中小企业采购货物、工程、服务，应当自货物、工程、服务交付之日起30日内支付款项；合同另有约定的，付款期限最长不得超过60日。不得强制中小企业接受商业汇票等非现金支付方式，不得利用商业汇票等非现金支付方式变相延长付款期限。\"\
    \n  }\n]"
- expression: (项目竣工验收报告.结算报告出具日期 - 项目竣工验收报告.实际竣工验收日期 > 180天) && (投诉举报记录.投诉内容 CONTAINS '结算' || 投诉举报记录.投诉内容 CONTAINS '审计')
  description: 判定规则：项目自竣工验收合格之日起，发包人无故拖延办理竣工结算超过6个月（180天），且同时存在相关投诉记录，视为利用审计程序故意拖延结算。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 以审计未完成为由拖延竣工结算
  regulation: "[\n  {\n    \"法规名称\": \"保障中小企业款项支付条例\",\n    \"法规文号\": \"国务院令第728号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第十一条\",\n    \"内容概述\": \"机关、事业单位和大型企业不得强制要求以审计机关的审计结果作为结算依据，但合同另有约定或者法律、行政法规另有规定的除外。不得以法定代表人或者主要负责人变更，履行内部付款流程，或者在合同未作约定的情况下以等待竣工验收批复、决算审计等为由，拒绝或者迟延支付中小企业款项。\"\
    \n  }\n]"
- expression: (资金划拨凭证.累计入账总额 / (工程款支付凭证.同期拨付给施工单位的工程进度款总额 * 工程项目合同.人工费用占比)) < 0.8
  description: 判定规则：在项目施工期间，建设方或总包方拨入农民工工资专用账户的累计金额，低于同期应拨付到账的工程进度款中预估人工费总额的80%，视为专户资金划拨不足，存在人工费用被挤占、挪用的风险。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 农民工工资专用账户资金划拨不足
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十七条、第二十九条\",\n    \"内容概述\": \"施工总承包单位应当按照有关规定开设农民工工资专用账户，专项用于支付该工程建设项目农民工工资。建设单位应当按照合同约定及时拨付工程款，并将人工费用及时足额拨付至农民工工资专用账户，人工费用拨付周期不得超过1个月。\"\
    \n  }\n]"
- expression: (COUNT(工资发放表.姓名) != COUNT(农民工实名制管理台账.姓名)) || (工资发放表.银行转账记录/现金签收笔迹 == "无" && 对工资发放表.银行转账记录/现金签收笔迹进行相似度分析 > 90%)
  description: 判定规则：1. 工资发放表中的人员数量或姓名与实名制考勤台账中的人员不一致，存在虚增人头、顶替名额等情况；2. 工资发放记录为现金发放且无银行转账凭证，同时多人签名字迹高度雷同（相似度超90%），疑似集中代签、伪造工资发放记录套取资金。符合任一条件即判定可疑。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 虚列农民工考勤及工资发放表
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十八条、第三十一条\",\n    \"内容概述\": \"施工总承包单位或者分包单位应当依法与所招用的农民工订立劳动合同并进行用工实名登记。施工总承包单位、分包单位应当建立用工管理台账，并保存至工程完工且工资全部结清后至少3年。用于支付农民工工资的银行账户所绑定的农民工本人社会保障卡或者银行卡，用人单位或者其他人员不得以任何理由扣押或者变相扣押。\"\
    \n  }\n]"
- expression: (工程项目合同.开工日期 > 2020年5月1日) && (资金划拨凭证.专户开户许可证/协议 IS NULL) || (农民工工资保证金缴纳情况表.保证金缴纳凭证 IS NULL)
  description: 判定规则：1. 《保障农民工工资支付条例》施行（2020年5月1日）后开工的安居工程项目，未取得任何工资专户相关凭证的，视为未开立专用账户；2. 无农民工工资保证金缴纳记录的，视为未按规定存储保证金。符合任一条件均为严重违规。
  audit_item: 保障性安居工程项目有关部门、单位和大型企业等拖欠民营企业、中小企业款项和农民工工资
  suspicion: 未按规定开设或使用农民工工资专用账户
  regulation: "[\n  {\n    \"法规名称\": \"保障农民工工资支付条例\",\n    \"法规文号\": \"国务院令第724号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十六条、第三十二条\",\n    \"内容概述\": \"施工总承包单位应当按照有关规定开设农民工工资专用账户，专项用于支付该工程建设项目农民工工资。施工总承包单位应当按照有关规定存储工资保证金，专项用于支付为所承包工程提供劳动的农民工被拖欠的工资。\"\
    \n  }\n]"
