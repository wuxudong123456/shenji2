    第十七条\",\n    \"内容概述\": \"禁止具有市场支配地位的经营者没有正当理由，限定交易相对人只能与其进行交易或者只能与其指定的经营者进行交易。\"\n  },\n  {\n    \"法规名称\": \"优化营商环境条例\"\
    ,\n    \"法规文号\": \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第二十六条\",\n    \"内容概述\": \"任何单位和个人不得强制或者变相强制市场主体接受中介服务、"
- expression: 同一行政村内 COUNT(DISTINCT 快递企业) > 1 AND MAX(日均件量) < 10 AND (合作协议.共享范围 NOT LIKE '%村级网点共享%' OR 合作协议为空)
  description: 在同一行政村存在2家及以上快递企业独立设立网点，且所有网点日均业务量均低于10件，企业间未签订村级网点共享协议，即判定为重复建设导致资源浪费。
  audit_item: 农村寄递物流服务体系不健全
  suspicion: 快递企业间重复建设农村物流设施
  regulation: "[\n  {\n    \"法规名称\": \"国务院办公厅关于加快农村寄递物流体系建设的意见\",\n    \"法规文号\": \"国办发〔2021〕26号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"第三条（九）\",\n    \"内容概述\": \"推动快递企业整合，支持共建共享末端服务设施，避免重复建设\"\n  }\n]"
- expression: EXISTS(统计表.快递企业) AND 统计表.邮政网点行政村覆盖率=1 AND (合作协议.合作内容（是否含邮快合作）=否 OR 使用台账.邮政网点代投民营快递件数=0) AND 数据表.单件配送成本 > 数据表.派费收入*1.2
