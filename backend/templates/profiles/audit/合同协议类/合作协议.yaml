  regulation: "[\n  {\n    \"法规名称\": \"“互联网+”农产品出村进城工程试点工作方案\",\n    \"法规文号\": \"农办市〔2020〕7号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"三、试点企业遴选条件\",\n    \"内容概述\": \"参与试点企业应为具备较强实力的农业龙头企业、电商企业或物流企业，无严重失信记录，经营范围涵盖农产品生产、加工、流通、电商等相关领域。\"\n\
    \  }\n]"
- expression: (农机企业缴费台账.实际收费项目名称 NOT IN (国家和地方涉农收费政策文件.合法收费项目名称)) && (农机企业缴费台账.实际收费项目名称 NOT IN (被审计单位收费项目审批备案文件.获批收费项目名称))
    && (农机企业缴费台账.收费依据 IS NULL OR 农机企业缴费台账.票据类型 != '财政票据')
