  audit_item: 截留挪用涉农财政专项资金
  suspicion: 无依据向农机生产或销售企业收取费用
  regulation: "[\n  {\n    \"法规名称\": \"农业专项转移支付资金管理办法\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第X条（关于禁止向项目实施主体收费的规定）\"\
    ,\n    \"内容概述\": \"任何单位和个人不得以任何名义向申请或使用涉农专项转移支付资金的农机生产、销售企业收取管理费、赞助费、保证金等，不得设置与项目无关的收费条件。\"\n  }\n]"
- expression: (统计表.获得贷款企业数/统计表.申请企业数 < 0.5) || (统计表.实际贴息额/统计表.应贴息额 < 0.8) || (发放记录.实际利率 > 政策文件.贴息利率*1.1) || (偿金台账.使用余额/偿金台账.补偿金规模
    < 0.2)
  description: 贷款支持覆盖率低于申请企业的50%，或贴息兑现率低于80%，或企业实际承担的贷款利率超过政策承诺利率的110%，或风险补偿金到位规模不足应设规模的20%，任一条件成立即判定金融扶持政策缺失或落实不到位。
  audit_item: 现代农业产业园（集群、强镇）政策扶持不到位
  suspicion: 现代农业产业园金融扶持政策未建立或执行不到位
  regulation: "[\n  {\n    \"法规名称\": \"关于金融服务乡村振兴的指导意见\",\n    \"法规文号\": \"银发〔2019〕11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"五、强化金融产品和服务方式创新\",\n    \"内容概述\": \"鼓励银行业金融机构单列涉农信贷计划，下放审批权限，优化审批流程，开发专属金融产品，加大信用贷款投放力度，合理确定贷款利率水平。\"\n  },\n\
    \  {\n    \"法规名称\": \"国务院办公厅关于支持返乡下乡人员创业创新促进农村一二三产业融合发展的意见\",\n    \"法规文号\": \"国办发〔2016〕84号\",\n    \"效力级别\": \"规范性文件\""
- expression: (数据表.分红收入年增长率 < 0.05) || (数据表.本地农民就业占比 < 0.6) || (合作协议.分红比例条款 != 分红记录.年度分红金额) || (数据表.农民工资性收入年增长率 < 0.05)
  description: 分红收入或工资性收入年增长率低于5%视为带动增收效果不显著；本地农民就业比例低于60%表明未优先带动当地农户；协议分红与实际发放不符则直接判定机制执行不到位。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 利益联结机制缺失未带动农民增收
  regulation: "[\n  {\n    \"法规名称\": \"《关于促进农业产业化联合体发展的指导意见》\",\n    \"法规文号\": \"农经发〔2017〕13号\",\n    \"效力级别\": \"部门规章\",\n\
    \    \"条款号\": \"二、基本原则和任务目标\",\n    \"内容概述\": \"要建立紧密的利益共享机制，保障农民分享产业链增值收益，带动农户增收致富。\"\n  }\n]"
- expression: (分析表.各环节交易占比 < 0.3) || (合同协议.采购量 < 0.5) || (结构表.农业相关收入 < 0.3) || (评价文件.实际达成指标 < 0)
  description: 一二三产企业间交易额占总营收比例低于30%表明产业链关联度弱；深加工企业本地原料采购率低于50%说明种养与加工脱节；企业农业相关收入（种养、加工、休闲农业）占比低于30%说明企业偏离农业主业；绩效评价中三产融合指标未达标直接判定。
  audit_item: 现代农业产业园（集群、强镇）管理不规范、效益不佳
  suspicion: 一二三产业关联度低未形成融合发展
  regulation: "[\n  {\n    \"法规名称\": \"《关于推进农村一二三产业融合发展的指导意见》\",\n    \"法规文号\": \"国办发〔2015〕93号\",\n    \"效力级别\": \"行政法规\"\
    ,\n    \"条款号\": \"二、发展多类型农村产业融合方式\",\n    \"内容概述\": \"鼓励通过延伸产业链、打造供应链、提升价值链等方式，推动种养业与加工流通、休闲旅游等深度融合。\"\n  }\n]"
