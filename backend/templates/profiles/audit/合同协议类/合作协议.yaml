violations:
- expression: 明细表.报销凭证摘要 CONTAINS '中介服务费' &&明细表.支付对象为旅行社||中介机构) &&其他.联系方式 无法验证 || (其他.邀请事由 !=审批单.拟访单位名称) &&对比表.实际行程 中无任何对应会议/洽谈记录
  description: 判定规则：1.存在向旅行社或中介机构支付服务费的记录，且该机构提供的邀请函经查证，其联系方式、单位信息虚假或无法核实；2.邀请函上的事由与出访团组主业的业务范围毫无关联，且在实际行程中无法找到任何与该邀请事由匹配的公务活动记录。两个条件必须同时满足：有中介服务费支出，且有伪劣邀请函或虚假日程的证据。
  audit_item: 违反出国团组管理相关规定
  suspicion: 通过中介机构获取虚假邀请函或编造日程
  regulation: "[\n  {\n    \"法规名称\": \"关于进一步加强因公出国（境）管理的若干规定\",\n    \"法规文号\": \"中办发〔2008〕9号\",\n    \"效力级别\": \"行政法规\",\n\
    \    \"条款号\": \"第七条\",\n    \"内容概述\": \"严禁通过中介机构联系、购买或出具虚假邀请函。\"\n  },\n  {\n    \"法规名称\": \"因公临时出国（境）管理办法\",\n    \"\
    法规文号\": \"中办发〔2012〕5号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十条\",\n    \"内容概述\": \"邀请单位应当业务对口、级别对等，严禁通过中介机构联系或出具邀请函。\"\
    \n  }\n"
- expression: (明细表.费用项目 LIKE '%邀请函%' OR 明细表.费用项目 LIKE '%联络费%') && 明细表.支付对象 LIKE '%旅行社%'
  description: 向旅行社支付包含'邀请函'或'联络费'等名目的费用，是购买或通过中介获取邀请函的典型特征。由于公务邀请函应由外方直接发出，无需通过旅行社代办，此类支付高度预示虚假邀请风险。
  audit_item: 违反出国团组管理相关规定
  suspicion: 通过中介机构购买虚假邀请函或编造日程
  regulation: "[\n  {\n    \"法规名称\": \"《关于进一步规范省部级以下国家工作人员因公临时出国的意见》\",\n    \"法规文号\": \"中办发〔2013〕16号\",\n    \"效力级别\": \"\
    规范性文件\",\n    \"条款号\": \"相关内容\",\n    \"内容概述\": \"严禁通过旅行社或中介机构联系邀请函、编造虚假日程，邀请函应由境外业务对口单位或国际组织直接发出。\"\n  }\n]"
- expression: (费用报销原始凭证.收款单位名称 IN (外部利益关系单位合作协议.合作方名称)) AND (费用报销原始凭证.报销事项摘要 LIKE '%个人%' OR 费用报销原始凭证.金额异常偏高) OR (个人费用转嫁核查对照表.是否确认转嫁
    = TRUE) OR (外部利益关系单位合作协议.合同金额 - 市场评估价 > 外部利益关系单位合作协议.合同金额*0.3 AND 存在资金回流)
  description: 筛查企业向外部利益关系单位支付的费用是否实际用于报销领导人员个人消费。通过比对收款单位与外部关系单位清单，发现异常报销；若转嫁核查表直接确认转嫁，即违规；合作合同溢价超过市场价30%且伴随资金回流，可识别隐蔽转嫁。
  audit_item: 其他违反中央八项规定及其实施细则精神问题
  suspicion: 向外部利益关系单位转嫁应由个人承担的费用
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"无\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"\
    第五条\",\n    \"内容概述\": \"国有企业领导人员应当忠实履行职责，不得利用职权谋取私利。不得将企业经济往来中的折扣费、中介费、佣金、礼金据为己有，不得利用职务之便为他人谋取利益，其配偶、子女和其他特定关系人收受对方财物。\"\
    \n  }\n]"
- expression: (投资金额、回购条款、固定收益条款、清算优先权 WHERE (固定收益条款包含 '保证本金' OR '年化收益率' OR '强制回购') AND 明细项目 IN ('实收资本','资本公积')) && (计提利息金额、对应借款、利息支出、收款人
    WHERE 收款人 = 上述投资方 AND 支付固定回报不依赖利润分配决议)
  description: 若股权投资合同中明确约定了刚性兑付义务（如保本、固定收益及无条件回购条款），且该出资已计入了权益科目，同时企业定期向投资方支付与利润无关的固定款项，该笔“股”实质为债，必须重分类为金融负债，支付的回报应作为利息费用处理。
  audit_item: 未按规定核算负债
  suspicion: 通过名股实债方式隐匿负债
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第37号——金融工具列报\",\n    \"法规文号\": \"财会[2017]14号\",\n    \"效力级别\": \"部门规章\",\n  \
    \  \"条款号\": \"第七条\",\n    \"内容概述\": \"企业应当根据所发行金融工具的合同条款及其所反映的经济实质而非仅以法律形式，结合金融资产、金融负债和权益工具的定义，在初始确认时将该金融工具或其组成部分分类为金融资产、金融负债或权益工具。\"\
    \n  }\n]"
- expression: 明细账.业务类型 = '代理' && (收入金额 = 代收货款总额) && (合同条款表明不承担存货风险) && (行对账单.收款金额 - 支付给委托方金额 ≠ 确认的收入金额)
  description: 代理业务中，企业未承担主要责任却按代收总额确认收入，实际应仅确认佣金净额，此时名义收入远大于实际收益。
  audit_item: 未按规定确认收入
  suspicion: 代理业务全额计入收入虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十四条\",\n    \"内容概述\": \"企业为主要责任人的，按照已收或应收对价总额确认收入；否则为代理人，按照预期有权收取的佣金或手续费的金额确认收入。\"\n  }\n]"
- expression: (记录表.接收方名称 in (文件清单) && (记录表.转移费用 = 0 || 资产使用条款.费用约定 = '无偿使用')) && (批准文件.批准状态 != '已批准' || 评估报告.评估价值 != 资产使用条款.费用约定)
  description: 向职工持股企业调拨资产且未收取任何费用或无对价约定，同时缺少董事会关联交易批准或评估定价依据缺失的，直接构成违规无偿提供资产。
  audit_item: 资产管理方面存在的问题
  suspicion: 无偿向职工持股企业提供资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十四条\",\n    \"内容概述\": \"国有独资企业、国有独资公司、国有资本控股公司不得无偿向关联方提供资金、商品、服务或者其他资产，不得以不公平的价格与关联方进行交易。\"\n  }\n]"
- expression: (参与企业的营业执照.经营范围 NOT LIKE '%农产品%' && 参与企业的营业执照.经营范围 NOT LIKE '%电商%') || (资质证书.有效期 < 当前审计基准日) || (国家企业信用信息公示系统查询记录.严重违法失信名单
    = '是') || (企业资质审查结果汇总表.一票否决项命中标记 = '是' && 企业资质审查结果汇总表.最终审批意见 = '是') || (合作协议.约定投资额 > 银行流水.金额 * 1.5)
  description: 营业执照经营范围不含农产品或电商相关即为不符；资质证书过期失效；存在严重失信记录却未一票否决；审查表中命中否决项但获批通过；合作协议承诺投资远超实际到位资金50%以上，表明企业履约能力存疑或虚假承诺。
  audit_item: “互联网+”农产品出村进城工程实施不到位
