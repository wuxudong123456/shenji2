name: audit/合同协议类/合作协议
type: model
description: 从合同协议类类文档（合作协议）中提取结构化元数据。涵盖字段如：专项信贷产品名称、交易金额、付款义务、付款条件、代理商名称、佣金比例、使用期限、公章。文档范围包括：与房地产开发企业签订的按揭合作协议、与服务机构的合作协议、与第三方合作协议、产业链合作协议、代理业务合作协议、代理商合作协议、农机企业合作协议、农机生产/销售企业合作协议、合作协议、外部利益关系单位合作协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 协议
- 合同
- 金额
- 元数据提取
