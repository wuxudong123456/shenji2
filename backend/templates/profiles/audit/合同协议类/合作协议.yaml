  suspicion: 在合同约定费用外向农机企业重复收取服务费
  regulation: "[\n  {\n    \"法规名称\": \"禁止向企业摊派暂行条例\",\n    \"法规文号\": \"国务院令第29号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\":\
    \ \"第四条\",\n    \"内容概述\": \"禁止在法律、法规的规定之外向企业征收费用，禁止以任何形式进行摊派。\"\n  }\n]"
- expression: (设备采购供应商清单.采购占比 = 100% AND 设备采购供应商清单.是否用户自选 = '否') OR (设备采购供应商清单.采购占比 = 100% AND 用户投诉工单数据库.内容 包含 '强制购买') OR
    (电力设施供应商合作协议.排他性约定 包含 '必须向乙方采购') OR (设备采购单价 > 市场均价 * 1.3)
  description: 判定逻辑：任一条件满足即视为违规。1.某一区域（如一个乡镇）内所有农户新装或改造设备采购均来自同一供应商且无用户自主选择记录；2.用户投诉工单中出现强制消费描述经核实属实；3.合作协议中订有不公平排他条款，限制用户从其他渠道购买；4.指定设备单价明显高于同期市场均价30%以上。
