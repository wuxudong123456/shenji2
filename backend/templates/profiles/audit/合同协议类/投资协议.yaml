name: audit/合同协议类/投资协议
type: model
description: 从合同协议类类文档（投资协议）中提取结构化元数据。涵盖字段如：交易对价及定价依据、分派方式、分红条件、分红比例、投向的最终底层资产、投资主体、投资性质、投资标的。文档范围包括：参股企业投资协议、子公司的投资协议、对外投资协议、投资协议、母公司的投资协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 资产
- 项目
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 投资协议
  member_count: 1
  member_details:
  - 参股企业投资协议
  - 子公司的投资协议
  - 对外投资协议
  - 投资协议
  - 母公司的投资协议
output:
  fields:
  - name: 交易对价及定价依据
    type: string
    description: 提取 交易对价及定价依据 的文本值
  - name: 分派方式
    type: string
    description: 提取 分派方式 的文本值
  - name: 分红条件
    type: string
    description: 提取 分红条件 的文本值
  - name: 分红比例
    type: number
    description: 提取 分红比例 的数值（含单位，如万元、吨等）
  - name: 投向的最终底层资产
    type: string
    description: 提取 投向的最终底层资产 的文本值
  - name: 投资主体
    type: string
    description: 提取 投资主体 的文本值
  - name: 投资性质
    type: string
    description: 提取 投资性质 的文本值
  - name: 投资标的
    type: string
    description: 提取 投资标的 的文本值
  - name: 投资项目最终标的公司及业务描述
    type: string
    description: 提取 投资项目最终标的公司及业务描述 的文本值
  - name: 持股比例
    type: number
    description: 提取 持股比例 的数值（含单位，如万元、吨等）
  - name: 支付时间
    type: date
    description: 提取 支付时间 的日期值，格式 YYYY-MM-DD
  - name: 是否派驻董事
    type: boolean
    description: 提取 是否派驻董事 的布尔值（是/否）
  - name: 最终投资架构
    type: string
    description: 提取 最终投资架构 的文本值
  - name: 特殊权利条款
    type: number
    description: 提取 特殊权利条款 的数值（含单位，如万元、吨等）
  - name: 签约日期
    type: date
    description: 提取 签约日期 的日期值，格式 YYYY-MM-DD
  - name: 约定分红比例
    type: number
    description: 提取 约定分红比例 的数值（含单位，如万元、吨等）
  - name: 表决权比例
    type: number
    description: 提取 表决权比例 的数值（含单位，如万元、吨等）
  - name: 违约条款
    type: number
    description: 提取 违约条款 的数值（含单位，如万元、吨等）
  - name: 重大事项决策条款
    type: number
    description: 提取 重大事项决策条款 的数值（含单位，如万元、吨等）
  - name: 附件清单
    type: string
    description: 提取 附件清单 的文本值
  - name: 项目名称
    type: string
    description: 提取 项目名称 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (分配表.实际分红到账金额 > 0) && ( (缴款凭证.上缴收益金额 IS NULL) || (ABS(分配表.实际分红到账金额 - 批复文件.非税收入-国有资本经营收益预算金额) / 分配表.实际分红到账金额
    > 0.1) || (预算编制及调整文件未列示投资收益预算) )
  description: 若事业单位取得对外投资收益，但未开具非税收入缴款书缴库，或实际到账金额与预算列入数偏差超过10%，或预算未安排该笔收益，即属于未按规定纳入预算管理。
  audit_item: 国有资产收入管理不合规
  suspicion: 事业单位对外投资收益未纳入预算管理
  regulation: "[\n  {\n    \"法规名称\": \"事业单位国有资产管理暂行办法\",\n    \"法规文号\": \"财政部令第36号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"事业单位对外投资收益以及利用国有资产出租、出借取得的收入，应当纳入单位预算，统一核算，统一管理。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国预算法\"\
    ,\n    \"法规文号\": \"中华人民共和国主席令第12号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第五十六条\",\n    \"内容概述\": \"政府的全部收入应当上缴国家金库，任何部门、"
- expression: 累计应收分红、实收分红、投资年限、未收回金额.投资年限 > 3 && (累计应收分红、实收分红、投资年限、未收回金额.实收分红 / (累计应收分红、实收分红、投资年限、未收回金额.实收分红) < 0.3) && 违约条款、分红条件、分红比例、分派方式.分红条件
  description: 筛选投资超过3年、累计实际收到分红占应归属我方累计净利润比例低于30%（即存在大量利润未分配），且投资协议中分红条件已触发但未执行的参股项目。若投资协议未明确分红条款，但被投资企业有可分配利润而长期未分配，亦视同违规。
  audit_item: 投融资管理方面存在的问题
  suspicion: 对外股权投资收益长期不收回且未主张权利
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"中华人民共和国主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第34条、第166条\",\n    \"内容概述\": \"股东按照实缴的出资比例分取红利，公司弥补亏损和提取公积金后所余税后利润，有限责任公司依照本法第三十四条的规定分配。\"\n  },\n  {\n    \"法规名称\"\
    : \"企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第5号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第21条\",\n    \"内容概述\": \"国家出资企业应当依照法律"
- expression: (投资协议.持股比例 >= 20% || 事会决议.是否派驻董事 = TRUE) && 大额往来款的对方单位、账龄、利息条款.大额往来款的对方单位 = 被投资单位 && 大额往来款的对方单位、账龄、利息条款.利息条款
    = FALSE
  description: 若对被投资单位持股比例超过20%或有董事席位，表明存在重大影响或控制，该投资应确认为长期股权投资，挂账其他应收款且不计息的，属于违规分类。
  audit_item: 未按规定核算资产
  suspicion: 长期股权投资隐藏于其他应收款
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第2号——长期股权投资\",\n    \"法规文号\": \"财会〔2014〕14号\",\n    \"效力级别\": \"部门规章\",\n   \
    \ \"条款号\": \"第二条\",\n    \"内容概述\": \"长期股权投资是指投资方对被投资单位实施控制、重大影响的权益性投资。\"\n  }\n]"
- expression: SELECT 项目台账.项目名称, 项目台账.投资方式（现金/非货币资产/混合）, 投资协议.交易对价及定价依据 FROM 项目台账 INNER JOIN 投资协议 ON 项目台账.项目名称 = 投资协议.项目名称
    LEFT JOIN 评估报告 ON 项目台账.项目名称 = 评估报告.项目名称 WHERE 评估报告.评估报告文号 IS NULL && (项目台账.投资方式（现金/非货币资产/混合） != '全额现金' || 投资协议.交易对价及定价依据
    NOT LIKE '%审计报告%' && 投资协议.交易对价及定价依据 NOT LIKE '%评估报告%')
  description: 该表达式筛查在项目台账中，无法找到对应资产评估报告（即报告文号为空）的投资项目，特别是针对以非货币资产出资或者虽以现金出资但定价依据不清晰且无评估报告作为支撑的情况。若以现金出资并参考第三方审计报告定价，可视为有替代依据，否则判定为高度违规疑点。
  audit_item: 违规进行重大投资
  suspicion: 资产未经评估即进行对外投资
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国企业国有资产法\",\n    \"法规文号\": \"中华人民共和国主席令第五号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四十七条\",\n    \"内容概述\": \"国有独资企业、国有独资公司、国有资本控股公司合并、分立、改制，转让重大财产，以非货币财产对外投资，清算或者有法律、行政法规以及企业章程规定应当进行资产评估的其他情形的，应当按照规定对有关资产进行评估。\"\
    \n  }\n]"
- expression: SELECT 投资协议.项目名称, 投资协议.投资标的, 统计表.与主业的关联度描述 FROM 投资协议 INNER JOIN 调查报告 ON 投资协议.投资项目最终标的公司及业务描述 = 调查报告.被投资企业的实际经营范围
    LEFT JOIN 国资委批复的主业范围关键词、主业目录 ON ... WHERE (调查报告.被投资企业的实际经营范围 NOT LIKE '%'||国资委批复的主业范围关键词、主业目录.国资委批复的主业范围关键词||'%' AND 统计表.与主业的关联度描述
    IS NULL) || 调查报告.被投资企业的实际经营范围 REGEXP MATCH (负面清单.禁止及限制类投
  description: 该表达式通过模糊匹配，筛查投资标的公司的工商注册经营范围，与企业经国资委认定的主业范围及《市场准入负面清单》进行比对。若项目既不属于主业，也无法提供合理的投资方向合规性说明以证明其符合战略性新兴产业等高相关度，或者直接触及负面清单中的禁止类领域，则判定为违规。
  audit_item: 违规进行重大投资
  suspicion: 违规决策投资非主业与禁止类项目
  regulation: "[\n  {\n    \"法规名称\": \"关于中央企业加强参股管理有关事项的通知\",\n    \"法规文号\": \"国资发改革〔2019〕126号\",\n    \"效力级别\": \"部门规章\"\
    ,\n    \"条款号\": \"第二条\",\n    \"内容概述\": \"严把主业投资方向。中央企业不得为规避主业监管，通过参股等方式开展中央企业投资项目负面清单规定的商业性房地产等禁止类业务。\"\n  }\n]"
- expression: SELECT 项目台账.项目名称, 项目台账.项目类型, 批文.银保监会/证监会的行政许可文号 FROM 项目台账 LEFT JOIN 批文 ON 项目台账.项目名称 = 批文.银保监会/证监会的行政许可文号 WHERE
    项目台账.项目类型 IN ('境外投资', '金融衍生品投资', '限制性文化投资') AND (批文.银保监会/证监会的行政许可文号 != '已批准' || 批文.银保监会/证监会的行政许可文号 IS NULL || 批文.银保监会/证监会的行政许可文号
    IS NULL)
  description: 该表达式针对项目类型被标记为境外投资、金融衍生品或限制性文化领域等受特别监管的项目，检查其审批流程跟踪表中的最终审批状态是否为“已批准”，且必备的批文号（如境外投资的发改委备案号、金融业务的经营许可证、文化领域的行业批文）是否完整存在。任何缺失或未批准状态均视为重大违规疑点。
  audit_item: 违规进行重大投资
  suspicion: 未经审批违规开展特别监管类项目投资
  regulation: "[\n  {\n    \"法规名称\": \"企业境外投资管理办法\",\n    \"法规文号\": \"国家发展和改革委员会令第11号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条、第十四条\",\n    \"内容概述\": \"投资主体开展境外投资，应当履行境外投资项目核准、备案等手续。属于核准、备案管理范围的项目，投资主体未取得核准文件或备案通知书的，不得擅自实施。\"\n  }\n\
    ]"
- expression: SELECT 其他.穿透后的最终受益人国籍/注册地, 投资协议.投资项目最终标的公司及业务描述, 代持协议.代持人 FROM 其他 INNER JOIN 投资协议 ON 投资协议.投资项目最终标的公司及业务描述 =
    投资协议.投资标的 WHERE 其他.穿透后的最终受益人国籍/注册地 IN ('外商投资负面清单中限制/禁止的领域对应的投资主体') AND 其他.控制路径 LIKE '%代持%' AND 代持协议.代持人 != 其他.穿透后的最终受益人国籍/注册地
  description: 该表达式专门用于挖掘隐藏的股权代持。当穿透后的最终受益人国籍显示为《外商投资准入特别管理措施（负面清单）》中禁止或限制投资领域的境外主体，且其投资是通过境内企业或个人代持的方式实现的，即代持方与最终受益人不一致，则构成典型的规避外资准入监管的违规行为。
  audit_item: 违规进行重大投资
  suspicion: 违规决策为外资代持限制性文化机构股权
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国外商投资法\",\n    \"法规文号\": \"中华人民共和国主席令第二十六号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第二十八条\",\n    \"内容概述\": \"外国投资者投资负面清单规定禁止投资的领域，由国务院商务主管部门责令停止投资活动，限期处分股份、资产或者采取其他必要措施，恢复到实施投资前的状态。\"\n  }\n]"
