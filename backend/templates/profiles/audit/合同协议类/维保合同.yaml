name: audit/合同协议类/维保合同
type: model
description: 从合同协议类类文档（维保合同）中提取结构化元数据。涵盖字段如：付款记录、服务商名称、服务期限、维保范围。文档范围包括：消防维保合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 维保合同
  member_count: 1
  member_details:
  - 消防维保合同
output:
  fields:
  - name: 付款记录
    type: number
    description: 提取 付款记录 的数值（含单位，如万元、吨等）
  - name: 服务商名称
    type: string
    description: 提取 服务商名称 的文本值
  - name: 服务期限
    type: string
    description: 提取 服务期限 的文本值
  - name: 维保范围
    type: string
    description: 提取 维保范围 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (机构名称.有效期至 < 当前日期) || (机构名称.压力表状态 = '失效' || '无记录') || (检查日期.复查结果 = '未整改' && 限期整改日期 < 当前日期) || (抽检记录.压力表指针位置不在绿区
    或 应急灯功能状态 = '应急灯不亮') || (机构名称.检查日期距当前 > 30天 且 无合理说明)
  description: 条件一：器材已过有效期；条件二：台账记录显示器材失效或无检查记录；条件三：消防部门下达的整改通知超期未闭环；条件四：现场抽检发现器材功能失效；条件五：未按规定频率（如每月一次）进行维护检查。满足任一视为消防安全隐患疑点。
  audit_item: 农村养老机构建后管护不到位、使用效果不佳
  suspicion: 消防器材过期或失效存在安全隐患
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国消防法\",\n    \"法规文号\": \"主席令第81号（2021年修正）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第十六条、第二十八条\",\n    \"内容概述\": \"单位应当按照国家标准、行业标准配置消防设施、器材，设置消防安全标志，并定期组织检验、维修，确保完好有效；任何单位、个人不得损坏、挪用或者擅自拆除、停用消防设施、器材。\"\
    \n  }\n]"
