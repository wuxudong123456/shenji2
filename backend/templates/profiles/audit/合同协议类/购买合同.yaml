name: audit/合同协议类/购买合同
type: model
description: 从合同协议类类文档（购买合同）中提取结构化元数据。涵盖字段如：产品名称、理财产品类型、签约对方、购买金额。文档范围包括：理财产品购买合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 购买合同
  member_count: 1
  member_details:
  - 理财产品购买合同
output:
  fields:
  - name: 产品名称
    type: string
    description: 提取 产品名称 的文本值
  - name: 理财产品类型
    type: string
    description: 提取 理财产品类型 的文本值
  - name: 签约对方
    type: string
    description: 提取 签约对方 的文本值
  - name: 购买金额
    type: number
    description: 提取 购买金额 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (银行对账单.交易摘要 CONTAINS ('理财','申购','赎回','结构性存款') AND 银行对账单.交易对方（金融机构） IN ('银行','券商','信托等金融机构列表')) AND (银行对账单.对方账户类型
    IN ('财政专户','零余额账户','国库集中支付户')) AND (管理制度.财政资金投资理财的禁止规定 == FALSE)
  description: 筛查银行流水中与金融机构发生的理财类交易，且交易账户为财政性资金专户，并且单位内部制度或上级文件明确禁止购买理财。当三项条件均满足时，判定为违规。
  audit_item: 挤占挪用套取财政资金
  suspicion: 违规使用财政资金购买理财产品
  regulation: "[\n  {\n    \"法规名称\": \"财政专户管理办法\",\n    \"法规文号\": \"财库〔2013〕46号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\":\
    \ \"第十二条\",\n    \"内容概述\": \"财政专户资金应按规定用途使用，不得挪作他用，不得违规用于投资理财。\"\n  },\n  {\n    \"法规名称\": \"关于进一步加强财政部门和预算单位资金存放管理的指导意见\"\
    ,\n    \"法规文号\": \"财库〔2017〕76号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"二、主要措施\",\n    \"内容概述\": \"严格规范资金存放管理，不得违规投资理财，确保财"
