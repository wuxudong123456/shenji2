name: audit/合同协议类/理财协议
type: model
description: 从合同协议类类文档（理财协议）中提取结构化元数据。涵盖字段如：出资额、协议收益率、委托人姓名、理财期间。文档范围包括：委托理财协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 协议
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 理财协议
  member_count: 1
  member_details:
  - 委托理财协议
output:
  fields:
  - name: 出资额
    type: string
    description: 提取 出资额 的文本值
  - name: 协议收益率
    type: string
    description: 提取 协议收益率 的文本值
  - name: 委托人姓名
    type: string
    description: 提取 委托人姓名 的文本值
  - name: 理财期间
    type: string
    description: 提取 理财期间 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: ((委托人姓名、出资额、协议收益率、理财期间.收益金额 / 委托人姓名、出资额、协议收益率、理财期间.出资额 - 1) > 同期同类产品平均收益率 * 2) OR (委托人姓名、出资额、协议收益率、理财期间.出资额
    = 0 AND 委托人姓名、出资额、协议收益率、理财期间.收益金额 > 0)
  description: 实际年化收益率超出同期同类产品市场平均收益率一倍以上，或者未实际出资却获得收益，均视为异常。出资额为零但存在收益流入即触发“虚假出资”违规。
  audit_item: 国有企业领导人员利用职权谋取私利以及损害本企业利益
  suspicion: 委托理财获取明显高于出资的收益
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中纪发〔2009〕7号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条第（四）项\",\n    \"内容概述\": \"不得以委托他人投资证券、期货或者其他委托理财名义，未实际出资而获取收益，或者虽然实际出资，但获取收益明显高于出资应得收益。\"\n  }\n]"
