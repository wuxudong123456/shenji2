name: audit/合同协议类/往来协议
type: model
description: 从合同协议类类文档（往来协议）中提取结构化元数据。涵盖字段如：关联交易定价政策、关联方名称、利率、往来金额、是否为关联方、期限、款项性质、金额。文档范围包括：关联方资金往来协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 往来协议
  member_count: 1
  member_details:
  - 关联方资金往来协议
output:
  fields:
  - name: 关联交易定价政策
    type: string
    description: 提取 关联交易定价政策 的文本值
  - name: 关联方名称
    type: string
    description: 提取 关联方名称 的文本值
  - name: 利率
    type: string
    description: 提取 利率 的文本值
  - name: 往来金额
    type: number
    description: 提取 往来金额 的数值（含单位，如万元、吨等）
  - name: 是否为关联方
    type: boolean
    description: 提取 是否为关联方 的布尔值（是/否）
  - name: 期限
    type: string
    description: 提取 期限 的文本值
  - name: 款项性质
    type: number
    description: 提取 款项性质 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: 登记台账.收票人 IN (上市公司或集团内部信誉较高企业) || 登记台账.背书人 IN (上市公司或集团内部信誉较高企业) && 登记台账.贴现资金去向账户 = '关联方清单' && 登记台账.贴现利率 < 同期贷款市场报价利率(LPR)
    * 0.8
  description: 利用自身信用收取票据后，通过关联方贴现并以明显低于市场利率获取资金，实质是为关联方融资，涉嫌利益输送。
  audit_item: 资金管理方面存在的问题
  suspicion: 违规收取票据为关联企业融资
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国票据法\",\n    \"法规文号\": \"主席令第22号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第十条\"\
    ,\n    \"内容概述\": \"票据的签发、取得和转让，应当具有真实的交易关系和债权债务关系。\"\n  },\n  {\n    \"法规名称\": \"企业内部控制应用指引第6号——资金活动\",\n    \"法规文号\"\
    : \"财会[2010]11号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第六条\",\n    \"内容概述\": \"企业应当加强对银行承兑汇票等重要票据的管理，严禁将以自身信用为基础的票据用于为关联"
- expression: (明细表.借款利率 = 0 || 明细表.借款利率 < 同期LPR * 0.5) && 明细表.借款金额 > 500000 && 往来协议.是否为关联方 || (往来协议.是否为关联方 && 出借协议.抵押担保条款)
  description: 对外提供资金时，若利率远低于成本或无抵押，且对手方为关联方，构成利益输送；对非关联方无担保则存在巨大回收风险。
  audit_item: 资金管理方面存在的问题
  suspicion: 违规对外无息或低息出借资金
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公司法\",\n    \"法规文号\": \"主席令第15号\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十一条\"\
    ,\n    \"内容概述\": \"公司的控股股东、实际控制人、董事、监事、高级管理人员不得利用其关联关系损害公司利益。\"\n  },\n  {\n    \"法规名称\": \"关于规范上市公司与关联方资金往来及上市公司对外担保若干问题的通知\"\
    ,\n    \"法规文号\": \"证监发[2003]56号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"上市公司不得以下列方式将资金"
- expression: 占用形式（预付款、借款、无商业实质的票据等） == '无商业背景的支付' && 占用金额 > 0 && 未计提资金占用费 || 利率 < 同期存款利率 && 占用时间 == '超过1个季度'
  description: 控股股东通过预付款、借款、代偿债务等方式占款持续存在且未按市场化原则支付占用费，即构成侵占上市公司利益。
  audit_item: 资金管理方面存在的问题
  suspicion: 控股股东非经营性占用上市公司资金
  regulation: "[\n  {\n    \"法规名称\": \"关于规范上市公司与关联方资金往来及上市公司对外担保若干问题的通知\",\n    \"法规文号\": \"证监发[2003]56号\",\n    \"效力级别\"\
    : \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"控股股东及其他关联方不得要求上市公司为其垫支工资、福利、保险、广告等期间费用，也不得互相代为承担成本和其他支出。\"\n  },\n\
    \  {\n    \"法规名称\": \"上市公司治理准则\",\n    \"法规文号\": \"证监发[2002]1号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十四条\",\n \
    \   \"内容概述\""
