name: audit/合同协议类/业务合同
type: model
description: 从合同协议类类文档（业务合同）中提取结构化元数据。涵盖字段如：交易总价、交易金额、付款条件、佣金条款、公章、合同标的、合同生效日、合同签订方。文档范围包括：业务合同、大型企业与中小企业的业务合同、担保业务合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 合同
- 金额
- 验收
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 业务合同
  member_count: 1
  member_details:
  - 业务合同
  - 大型企业与中小企业的业务合同
  - 担保业务合同
output:
  fields:
  - name: 交易总价
    type: string
    description: 提取 交易总价 的文本值
  - name: 交易金额
    type: number
    description: 提取 交易金额 的数值（含单位，如万元、吨等）
  - name: 付款条件
    type: number
    description: 提取 付款条件 的数值（含单位，如万元、吨等）
  - name: 佣金条款
    type: number
    description: 提取 佣金条款 的数值（含单位，如万元、吨等）
  - name: 公章
    type: string
    description: 提取 公章 的文本值
  - name: 合同标的
    type: string
    description: 提取 合同标的 的文本值
  - name: 合同生效日
    type: string
    description: 提取 合同生效日 的文本值
  - name: 合同签订方
    type: string
    description: 提取 合同签订方 的文本值
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 履约义务条款
    type: number
    description: 提取 履约义务条款 的数值（含单位，如万元、吨等）
  - name: 履行期限
    type: string
    description: 提取 履行期限 的文本值
  - name: 担保人名称
    type: string
    description: 提取 担保人名称 的文本值
  - name: 持股比例
    type: number
    description: 提取 持股比例 的数值（含单位，如万元、吨等）
  - name: 收款时点
    type: number
    description: 提取 收款时点 的数值（含单位，如万元、吨等）
  - name: 是否派驻董事
    type: boolean
    description: 提取 是否派驻董事 的布尔值（是/否）
  - name: 签约方
    type: string
    description: 提取 签约方 的文本值
  - name: 签署日期
    type: date
