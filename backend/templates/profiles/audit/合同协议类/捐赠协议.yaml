name: audit/合同协议类/捐赠协议
type: model
description: 从合同协议类类文档（捐赠协议）中提取结构化元数据。涵盖字段如：价值、募捐项目名称、受赠方名称、回馈承诺、承诺捐赠时间、承诺捐赠金额/物资数量、指定用途、捐赠人。文档范围包括：捐赠协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 资产
- 金额
- 项目
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 捐赠协议
  member_count: 1
  member_details:
  - 捐赠协议
output:
  fields:
  - name: 价值
    type: string
    description: 提取 价值 的文本值
  - name: 募捐项目名称
    type: string
    description: 提取 募捐项目名称 的文本值
  - name: 受赠方名称
    type: string
    description: 提取 受赠方名称 的文本值
  - name: 回馈承诺
    type: string
    description: 提取 回馈承诺 的文本值
  - name: 承诺捐赠时间
    type: date
    description: 提取 承诺捐赠时间 的日期值，格式 YYYY-MM-DD
  - name: 承诺捐赠金额-物资数量
    type: number
    description: 提取 承诺捐赠金额-物资数量 的数值（含单位，如万元、吨等）
  - name: 指定用途
    type: string
    description: 提取 指定用途 的文本值
  - name: 捐赠人
    type: string
    description: 提取 捐赠人 的文本值
  - name: 捐赠人名称
    type: string
    description: 提取 捐赠人名称 的文本值
  - name: 捐赠目的
    type: string
    description: 提取 捐赠目的 的文本值
  - name: 捐赠金额
    type: number
    description: 提取 捐赠金额 的数值（含单位，如万元、吨等）
  - name: 接收日期
    type: date
    description: 提取 接收日期 的日期值，格式 YYYY-MM-DD
  - name: 是否附带行政业务条件
    type: boolean
    description: 提取 是否附带行政业务条件 的布尔值（是/否）
  - name: 禁止用途
    type: string
    description: 提取 禁止用途 的文本值
  - name: 资产名称
    type: string
    description: 提取 资产名称 的文本值
  - name: 违约责任条款
    type: number
    description: 提取 违约责任条款 的数值（含单位，如万元、吨等）
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 附加商业条款
    type: number
    description: 提取 附加商业条款 的数值（含单位，如万元、吨等）
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: ( 其他.项目名称（如‘捐款’‘赞助费’）为‘捐赠’‘赞助’ && 其他.收款方与被审计单位存在关联或为指定账户 ) && ( 缴费企业均系被审计单位管理服务对象 && 会议纪要.目标金额分配表 ) && 流水.收款账户性质（财政专户还是自有账户）
  description: 当以‘自愿捐赠’‘支持地方建设’等名义收款，但实际上存在向管理服务对象下达摊派任务（如文件、会议划定指标），且资金未进入财政专户管理，而是流入单位自有账户或指定社团组织账户，同时付款企业与该机关有审批、监管、检查等利害关系时，判定为变相摊派收费。
  audit_item: 违规收费-依托行政职权、行政资源及影响力通过垄断经营、指定服务、强制培训等违规收费
  suspicion: 以捐赠赞助名义变相摊派收费
  regulation: "[\n  {\n    \"法规名称\": \"关于治理向企业乱收费、乱罚款和各种摊派等问题的决定\",\n    \"法规文号\": \"中发〔1997〕14号\",\n    \"效力级别\": \"制度文件\"\
    ,\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"严禁向企业摊派、索要赞助和无偿占用企业人财物。\"\n  },\n  {\n    \"法规名称\": \"优化营商环境条例\",\n    \"法规文号\"\
    : \"国务院令第722号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"第十四条\",\n    \"内容概述\": \"禁止向市场主体强制或者变相强制摊派、募捐。\"\n  }\n]"
- expression: EXISTS(捐赠协议) && (捐赠协议.价值 > 0) && (资产台账.资产名称 != 捐赠协议.资产名称 || 资产台账.入账金额 = 0) && (明细账.捐赠收入金额 = 0)
  description: 企业已接收捐赠资产但固定资产账上无对应资产记录，且未确认捐赠收入，表明资产被隐匿形成账外资产。
  audit_item: 未按规定核算资产
  suspicion: 接受捐赠资产不入账
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第76号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十二条\",\n    \"内容概述\": \"企业应当以实际发生的交易或者事项为依据进行会计确认、计量和报告，如实反映符合确认和计量要求的各项会计要素，保证会计信息真实可靠、内容完整。\"\n  }\n]"
- expression: (流向证明.最终收款方名称 != 捐赠协议.受赠方名称) OR (核对表.收款方 IN 捐赠协议.捐赠人名称) OR (捐赠协议.附加商业条款 != '') OR (调查资料.实际控制人 IN 交易清单.关联方名称)
  description: 资金收款方与协议受赠方不一致，或存在资金闭环回流，均表明捐赠不真实；协议中含有商业回报条款，借捐赠名义获取对价，属于变相交易；若受赠方与捐赠方存在未披露关联关系，构成利益输送；上述任一条件满足即触发疑点。
  audit_item: 违规对外大额捐赠
  suspicion: 借捐赠之名从事营利活动或转移资产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公益事业捐赠法\",\n    \"法规文号\": \"中华人民共和国主席令第十九号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"捐赠应当是自愿和无偿的，不得以捐赠为名从事营利活动。\"\n  },\n  {\n    \"法规名称\": \"关于加强企业对外捐赠财务管理的通知\",\n    \"\
    法规文号\": \"财企〔2003〕95号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"企业对外捐赠后，不得要求受赠方在融资、市场准入、行政许可、占有其他资源等"
- expression: (单据.签收单位 ∉ 捐赠协议.指定用途) || (说明表.接收单位 存在 商业合作关系 && 说明表.分配理由 == 无公益性质说明) || (单据.签收单位对捐赠财产进行了销售或收费)
  description: 该表达式用于识别捐赠财产被挪作私用或商业输送。一是签收单位不在捐赠协议约定的受益范围内，属于改变用途。二是向存在商业合作关系的企业分配高价值物资且无合理公益理由，涉嫌利益输送。三是受益单位将本应免费的捐赠物资进行销售或收费，属于变相侵吞。
  audit_item: 社会捐赠款物使用不合规
  suspicion: 违规向相关利益人分配捐赠财产
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国公益事业捐赠法\",\n    \"法规文号\": \"中华人民共和国主席令第19号\",\n    \"效力级别\": \"法律\",\n    \"\
    条款号\": \"第十八条\",\n    \"内容概述\": \"受赠人应当依照国家有关规定，建立健全财务会计制度，将受赠财产的使用、管理情况及时向社会公开，并接受监督。不得擅自改变捐赠财产的用途。如果确需改变用途的，应当征得捐赠人的同意。\"\
    \n  },\n  {\n    \"法规名称\": \"慈善组织信息公开办法\",\n    \"法规文号\": \"民政部令第61号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条、"
- expression: (活动名称、活动时间、募捐主体、审批文号、募集金额.审批文号 == null || 活动名称、活动时间、募捐主体、审批文号、募集金额.审批文号 NOT IN (备案号、备案活动范围、有效期.备案号)) || (公开募捐资格证书编号、有效期限、业务范围.公开募捐资格证书编号
    == null || 公开募捐资格证书编号、有效期限、业务范围.有效期限 < 当前日期) || (公开募捐资格证书编号、有效期限、业务范围.业务范围 NOT LIKE '%公开募捐%')
  description: 判定规则：①存在实际募捐活动但无对应备案审批文号；②机构未取得公开募捐资格证书或证书已过期；③机构登记业务范围不含公开募捐。满足任一条件即判定为违规开展募捐。
  audit_item: 社会捐赠款物接收管理不合规
  suspicion: 无资质或超范围开展公开募捐
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号（2016年）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"慈善组织开展公开募捐，应当取得公开募捐资格。\"\n  },\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号（2016年）\"\
    ,\n    \"效力级别\": \"法律\",\n    \"条款号\": \"第二十六条\",\n    \"内容概述\": \"开展公开募捐，应当制定募捐方案并报民政部门备案。\"\n  }\n]"
- expression: (捐赠人名称、承诺捐赠金额、实际到账金额、到账日期.承诺捐赠金额 - 捐赠人名称、承诺捐赠金额、实际到账金额、到账日期.实际到账金额) > 0 && (当前日期 - 捐赠人名称、承诺捐赠金额、实际到账金额、到账日期.到账日期)
    > 30
  description: 承诺捐赠金额与实际到账金额存在差异，且超过协议约定的最晚到账日期30天以上仍未足额到位，视为捐赠承诺未履行。金额差异大于零且逾期天数大于30触发违规。单笔金额超过10万元且无书面协议的可直接标注为高风险。
  audit_item: 社会捐赠款物接收管理不合规
  suspicion: 捐赠承诺款物未按期足额到位
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国慈善法\",\n    \"法规文号\": \"主席令第43号（2016年）\",\n    \"效力级别\": \"法律\",\n    \"条款号\"\
    : \"第四十一条\",\n    \"内容概述\": \"捐赠人应当按照捐赠协议履行捐赠义务。捐赠人违反协议逾期未交付捐赠财产，慈善组织可以要求交付；拒不交付的，可依法申请支付令或提起诉讼。\"\n  }\n]"
