name: audit/合同协议类/处理协议
type: model
description: 从合同协议类类文档（处理协议）中提取结构化元数据。涵盖字段如：处置方式、约定处置去向。文档范围包括：废旧农膜回收处理协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 处理协议
  member_count: 1
  member_details:
  - 废旧农膜回收处理协议
output:
  fields:
  - name: 处置方式
    type: string
    description: 提取 处置方式 的文本值
  - name: 约定处置去向
    type: string
    description: 提取 约定处置去向 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (联单记录.收货方 不在 合规处置企业名录) || (联单台账.最终处置方式（再生/填埋/焚烧） != '资源化利用' && 联单台账.最终处置方式（再生/填埋/焚烧） != '卫生填埋') || (监测报告.二噁英浓度
    > 0.5 ng TEQ/Nm³) || (决定书.违规事实 包含 '焚烧' || '掩埋' || '弃置') || (投诉记录.投诉内容 包含 '烧膜' || '埋膜' || '乱倒' )
  description: 合规处置企业名录由回收协议确定。非资源化利用或卫生填埋的，可能为非法处置；二噁英超标参照《危险废物焚烧污染控制标准》中限值（0.5ng TEQ/Nm³）；其他字段通过关键文本匹配判定。
  audit_item: 农膜生产、销售、使用、回收和利用不符合规定
  suspicion: 随意弃置、掩埋或者焚烧废旧农膜
  regulation: "[\n  {\n    \"法规名称\": \"农用薄膜管理办法\",\n    \"法规文号\": \"农业农村部、工业和信息化部、生态环境部、市场监管总局令2020年第4号\",\n    \"效力级别\":\
    \ \"部门规章\",\n    \"条款号\": \"第十二条\",\n    \"内容概述\": \"农用薄膜使用者应当在使用期限届满前捡拾田间的非全生物降解农用薄膜废弃物，交至回收网点或回收工作者，不得随意弃置、掩埋或者焚烧。\"\
    \n  },\n  {\n    \"法规名称\": \"中华人民共和国固体废物污染环境防治法\",\n    \"法规文号\": \"2020年修订\",\n    \"效力级别\": \"法律\",\n    \"条款号\": \"\
    第二十条\","
