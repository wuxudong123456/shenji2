name: audit/合同协议类/销售合同
type: model
description: 从合同协议类类文档（销售合同）中提取结构化元数据。涵盖字段如：乙方名称、交付条款、交易条件、产品规格条款、付款方式、付款节点与进度挂钩条款、价格条款、单价。文档范围包括：住房销售合同、农膜销售合同、己方采购/销售合同、采购/销售合同、销售合同等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 付款
- 合同
- 金额
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 销售合同
  member_count: 1
  member_details:
  - 住房销售合同
  - 农膜销售合同
  - 己方采购/销售合同
  - 采购/销售合同
  - 销售合同
output:
  fields:
  - name: 乙方名称
    type: string
    description: 提取 乙方名称 的文本值
  - name: 交付条款
    type: number
    description: 提取 交付条款 的数值（含单位，如万元、吨等）
  - name: 交易条件
    type: string
    description: 提取 交易条件 的文本值
  - name: 产品规格条款
    type: number
    description: 提取 产品规格条款 的数值（含单位，如万元、吨等）
  - name: 付款方式
    type: number
    description: 提取 付款方式 的数值（含单位，如万元、吨等）
  - name: 付款节点与进度挂钩条款
    type: number
    description: 提取 付款节点与进度挂钩条款 的数值（含单位，如万元、吨等）
  - name: 价格条款
    type: number
    description: 提取 价格条款 的数值（含单位，如万元、吨等）
  - name: 单价
    type: number
    description: 提取 单价 的数值（含单位，如万元、吨等）
  - name: 合同价格
    type: number
    description: 提取 合同价格 的数值（含单位，如万元、吨等）
  - name: 合同相对方
    type: string
    description: 提取 合同相对方 的文本值
  - name: 合同签订人
    type: string
    description: 提取 合同签订人 的文本值
  - name: 合同签订日期
    type: date
    description: 提取 合同签订日期 的日期值，格式 YYYY-MM-DD
  - name: 合同编号
    type: string
    description: 提取 合同编号 的文本值
  - name: 合同金额
    type: number
    description: 提取 合同金额 的数值（含单位，如万元、吨等）
  - name: 商品规格
    type: string
    description: 提取 商品规格 的文本值
  - name: 收款节点
    type: number
    description: 提取 收款节点 的数值（含单位，如万元、吨等）
  - name: 数量
    type: number
    description: 提取 数量 的数值（含单位，如万元、吨等）
  - name: 服务-货物内容
    type: string
    description: 提取 服务-货物内容 的文本值
  - name: 签约方
    type: string
    description: 提取 签约方 的文本值
  - name: 签订日期
    type: date
    description: 提取 签订日期 的日期值，格式 YYYY-MM-DD
  - name: 经销商信息
    type: string
    description: 提取 经销商信息 的文本值
  - name: 货权转移条款
    type: number
    description: 提取 货权转移条款 的数值（含单位，如万元、吨等）
  - name: 货物名称
    type: string
    description: 提取 货物名称 的文本值
  - name: 购买农户
    type: string
    description: 提取 购买农户 的文本值
  - name: 购买数量
    type: number
    description: 提取 购买数量 的数值（含单位，如万元、吨等）
  - name: 购买日期
    type: date
    description: 提取 购买日期 的日期值，格式 YYYY-MM-DD
  - name: 购方名称
    type: string
    description: 提取 购方名称 的文本值
  - name: 购货方
    type: string
    description: 提取 购货方 的文本值
  - name: 金额
    type: number
    description: 提取 金额 的数值（含单位，如万元、吨等）
  - name: 销售产品型号
    type: string
    description: 提取 销售产品型号 的文本值
  - name: 销售对象
    type: string
    description: 提取 销售对象 的文本值
  - name: 销售数量
    type: number
    description: 提取 销售数量 的数值（含单位，如万元、吨等）
  - name: 销售日期
    type: date
    description: 提取 销售日期 的日期值，格式 YYYY-MM-DD
  - name: 销售金额
    type: number
    description: 提取 销售金额 的数值（含单位，如万元、吨等）
  - name: 销方名称
    type: string
    description: 提取 销方名称 的文本值
  - name: 风险承担约定
    type: string
    description: 提取 风险承担约定 的文本值
  - name: 验收条款
    type: number
    description: 提取 验收条款 的数值（含单位，如万元、吨等）
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 违约责任
    type: string
    description: 违约责任条款摘要
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (销售合同.购方名称 IN (系申报表.特定关系人企业名称)) && (审批记录.采购方式 == '单一来源采购' || 审批记录.是否必需) && (明细表.交易价格 > 明细表.同期其他供应商报价 * 1.2)
  description: 筛查领导人员利用职权直接指定特定关系人企业作为供应商且价格显著高于其他供应商（高20%以上），或采购方式不合规的情况。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 利用职权为特定关系人营利性经营活动提供便利
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第三项\",\n    \"内容概述\": \"不得利用职权为配偶、子女及其他特定关系人从事营利性经营活动提供便利条件。\"\n  }\n]"
- expression: (亲属姓名.关联企业 IN (交易记录.交易对手方名称)) && (亲属姓名.关联企业 IN (交易记录.交易对手方名称)) && (合同协议类-销售合同-合同相对方 > 1000000 || 交易记录.付款条件 >
    交易记录.付款条件)
  description: 筛查两家或多家国企领导之间互相照顾对方亲属企业的业务，形成利益互换。以累计采购额100万元或付款条件异常优惠为初步阈值。
  audit_item: 国有企业领导人员不正确行使经营管理权，可能侵害公共利益、企业利益的行为
  suspicion: 领导人员相互为对方特定关系人提供经营便利
  regulation: "[\n  {\n    \"法规名称\": \"国有企业领导人员廉洁从业若干规定\",\n    \"法规文号\": \"中办发〔2009〕26号\",\n    \"效力级别\": \"党内法规/制度文件\",\n\
    \    \"条款号\": \"第六条第四项\",\n    \"内容概述\": \"不得利用职权相互为对方及其配偶、子女和其他特定关系人从事营利性经营活动提供便利条件。\"\n  }\n]"
- expression: (明细账.发票号码 NOT IN 发票号码.发票号码) || (发票号码.购方名称 != 单据.收货单位) || (行对账单.付款方 != 销售合同.购方名称) || (发存台账.数量 < 发票号码.数量)
  description: 存在发票号码未正式登记、购货方与收货方不一致、付款方非合同购方或出库数量低于开票数量任一情况，即为虚开嫌疑。
  audit_item: 未按规定确认收入
  suspicion: 虚开商品销售发票虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"中华人民共和国发票管理办法\",\n    \"法规文号\": \"国务院令第587号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\"\
    : \"第二十二条\",\n    \"内容概述\": \"任何单位和个人不得为他人、为自己开具与实际经营业务情况不符的发票。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"\
    法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"企业应当在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入"
- expression: 对照表.毛利率 < 3% && (行对账单.付款方与收款方存在短期内金额相近的反向流转) && (单据.货物流转记录缺失或货物直接从供应商发往最终客户) && (销售合同.风险承担约定未约定实质性存货风险转移条款)
  description: 毛利率极低（<3%）、资金闭环回流、企业不承担货权风险、无实际物流控制，即符合融资性贸易特征。
  audit_item: 未按规定确认收入
  suspicion: 开展融资性贸易虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三十四条\",\n    \"内容概述\": \"企业应当根据其在向客户转让商品前是否拥有对该商品的控制权，判断从事交易时身份是主要责任人还是代理人。\"\n  },\n  {\n    \"法规名称\": \"关于进一步排查中央企业融资性贸易业务风险的通知\"\
    ,\n    \"法规文号\": \"国资发财评[2017]63号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第一条\",\n    \"内容概述\": \"严禁中"
- expression: (明细账.客户名称 IN 关联方清单) && (交易商品名称相同) && (购销金额相近) && (资金在30个自然日内形成回流) && (物流单据显示未实际移动或同一批货物反复出库)
  description: 关联方之间以相同商品进行金额相近的购销，资金短期内回流，且无实质物流，属于无真实贸易背景的循环交易。
  audit_item: 未按规定确认收入
  suspicion: 通过无实际贸易背景的循环交易虚增收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则——基本准则\",\n    \"法规文号\": \"财政部令第33号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\"\
    : \"第十六条\",\n    \"内容概述\": \"企业应当按照交易或者事项的经济实质进行会计确认、计量和报告，不应仅以交易或者事项的法律形式为依据。\"\n  },\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\"\
    ,\n    \"法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"条款号\": \"第四条\",\n    \"内容概述\": \"收入确认应反映向客户转让商品的对价金额，交易"
- expression: 贷方发生额对应科目、客户名称、贷方余额、挂账天数.贷方余额 > 0 && DATEDIFF(当前日期, 销售合同.验收条款) > 90天 && 明细账.客户名称 && 该时段内无相等收入确认
  description: 已收到款项且商品控制权已转移超过90天，仍未确认收入，仍挂在预收账款或其他应付款，构成推迟确认。
  audit_item: 未按规定确认收入
  suspicion: 货款收入作为负债挂账少计收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第五条\",\n    \"内容概述\": \"当企业与客户之间的合同同时满足相关条件时，企业应当在客户取得相关商品控制权时确认收入。\"\n  }\n]"
- expression: (明细账.确认日期 < 单据.客户签收日期) && (合同条约定需验收或安装) || (明细账.确认日期 在资产负债表日后但单据.发货日期在日前) && (期后事项未显示该推迟)
  description: 在合同约定验收条件下，未取得验收便确认收入，属于提前确认；商品已交付却延后至下期确认，属于推迟确认。
  audit_item: 未按规定确认收入
  suspicion: 推迟或提前确认销售收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十三条\",\n    \"内容概述\": \"对于在某一时点履行的履约义务，企业应当在客户取得相关商品控制权时点确认收入。\"\n  }\n]"
- expression: (交易对手 未 在 关联方清单 中 但通过穿透查询属潜在关联方) && (销售合同.单价 > 关联方与非关联方相同商品价格.非关联方可比价格 * 1.2) && (盈利能力显著高于行业) && (异常交易审批记录缺失或后补)
  description: 交易对手虽未正式披露，但存在潜在关联关系（如家属、协议控制），且价格偏离非关联方均价20%以上，属于向潜在关联方进行的利益输送。
  audit_item: 未按规定确认收入
  suspicion: 通过潜在关联方进行显失公允的交易
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第36号——关联方披露\",\n    \"法规文号\": \"财会[2006]3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第三条\",\n    \"内容概述\": \"一方控制、共同控制另一方或对另一方施加重大影响，以及两方或两方以上同受一方控制、共同控制或重大影响的，构成关联方。\"\n  }\n]"
- expression: ABS(测完进度百分比.测完进度百分比 - 确认单.监理确认进度百分比) > 5% || (合同约定进度款比例 ≠ 分析表.预收账款余额与合同进度对应/合同总金额 且 按进度应确认收入未确认)
  description: 企业自行测算的履约进度与独立监理确认进度偏差超过5%，或已按进度收款却未相应确认收入，均提示履约进度核算违规。
  audit_item: 未按规定确认收入
  suspicion: 未在资产负债表日按履约进度确认收入
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第14号——收入\",\n    \"法规文号\": \"财会[2017]22号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第十二条\",\n    \"内容概述\": \"对于在某一时段内履行的履约义务，企业应当在该段时间内按照履约进度确认收入。\"\n  }\n]"
- expression: 交易对手 NOT IN 关联方清单.已披露关联方名单 && (通过穿透发现与企业管理层存在关联) && (销售合同.单价 > 分析表.非关联方可比价格 * 1.2 或 < 分析表.非关联方可比价格 * 0.8)
  description: 交易对手虽未披露为关联方，但实际存在关联关系，且交易价格偏离市场公允价值20%以上，属于规避披露的关联不公允交易。
  audit_item: 未按规定确认收入
  suspicion: 通过未披露关联方进行显失公允的交易
  regulation: "[\n  {\n    \"法规名称\": \"企业会计准则第36号——关联方披露\",\n    \"法规文号\": \"财会[2006]3号\",\n    \"效力级别\": \"部门规章\",\n    \"\
    条款号\": \"第四条\",\n    \"内容概述\": \"下列各方构成企业的关联方：……（十）该企业主要投资者个人、关键管理人员或与其关系密切的家庭成员控制、共同控制或施加重大影响的其他企业。\"\n  }\n]"
- expression: (销售合同.签订日期 < 许可证批准日期.许可证批准日期) || (许可证批准日期.许可证批准日期 IS NULL && 流水.企业银行账户收支明细)
