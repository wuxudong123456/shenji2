name: audit/合同协议类/保障协议
type: model
description: 从合同协议类类文档（保障协议）中提取结构化元数据。涵盖字段如：保供量、最小供气压力、照付不议条款、违约责任。文档范围包括：气源保障协议等。
guideline: '1. 从文档内容中提取所有可识别的元数据字段，逐字段返回原文精确值，不做归纳概括。

  2. 文档中未出现的字段返回「未提供」。

  3. 重点关注日期、金额、当事方名称/身份、审批/决策节点、合规性标志。

  4. 金额字段保留币种和单位（万元/亿元），日期格式统一为 YYYY-MM-DD。'
domain: audit
tags:
- 合同协议类
- 审计
- 元数据提取
template_class:
  category: 合同协议类
  member_types:
  - 保障协议
  member_count: 1
  member_details:
  - 气源保障协议
output:
  fields:
  - name: 保供量
    type: string
    description: 提取 保供量 的文本值
  - name: 最小供气压力
    type: string
    description: 提取 最小供气压力 的文本值
  - name: 照付不议条款
    type: number
    description: 提取 照付不议条款 的数值（含单位，如万元、吨等）
  - name: 违约责任
    type: string
    description: 提取 违约责任 的文本值
  - name: 合同编号
    type: string
    description: 合同唯一编号
    required: false
  - name: 合同名称
    type: string
    description: 合同/协议全称
    required: false
  - name: 合同类型
    type: string
    description: 合同分类（买卖/服务/租赁/承揽/借款等）
    required: false
  - name: 签订日期
    type: date
    description: 合同签订日期，格式 YYYY-MM-DD
    required: false
  - name: 生效日期
    type: date
    description: 合同生效日期，格式 YYYY-MM-DD
    required: false
  - name: 终止日期
    type: date
    description: 合同终止/到期日期，格式 YYYY-MM-DD
    required: false
  - name: 甲方名称
    type: string
    description: 甲方（委托方/发包方/买方）全称
    required: false
  - name: 乙方名称
    type: string
    description: 乙方（受托方/承包方/卖方）全称
    required: false
  - name: 丙方名称
    type: string
    description: 丙方全称（如有）
    required: false
  - name: 合同金额
    type: number
    description: 合同总金额（含币种）
    required: false
  - name: 币种
    type: string
    description: 金额币种
    required: false
  - name: 合同标的
    type: string
    description: 合同标的/服务内容/项目概述
    required: false
  - name: 履约期限
    type: string
    description: 履约期限/工期
    required: false
  - name: 履约地点
    type: string
    description: 履约地点/项目所在地
    required: false
  - name: 付款方式
    type: string
    description: 付款方式/结算方式
    required: false
  - name: 争议解决方式
    type: string
    description: 争议解决方式（仲裁/诉讼）
    required: false
  - name: 签订地点
    type: string
    description: 合同签订地点/城市
    required: false
  - name: 联系电话
    type: string
    description: 主要联系电话
    required: false
  - name: 统一社会信用代码
    type: string
    description: 统一社会信用代码/纳税人识别号（甲方或乙方）
    required: false
violations:
- expression: (保供量 < 需求量 * 1.1) || (应急储备天数 < 3) || (照付不议条款 == '无' ) || (实际通气率 < 0.8 && 散煤复烧率 > 0.3)
  description: 气源协议保供量未达需求量的110%，或应急储备不足3天，或未签订照付不议合同，均视为气源保障不足；管道已通但实际通气率低于80%且散煤复烧率超30%，反映气源或气价问题导致弃用。
  audit_item: 项目规划统筹衔接不到位
  suspicion: 煤改气工程气源保障存在断供风险
  regulation: "[\n  {\n    \"法规名称\": \"城镇燃气管理条例\",\n    \"法规文号\": \"国务院令第583号\",\n    \"效力级别\": \"行政法规\",\n    \"条款号\": \"\
    第十四条、第十八条\",\n    \"内容概述\": \"县级以上地方人民政府应当建立健全燃气应急储备制度；燃气经营者应当保障燃气稳定供应，不得擅自停气、换气。\"\n  }\n]"
