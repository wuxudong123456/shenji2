language:
- zh
- en
name: meridian_graph
type: graph
tags:
- tcm
- meridian
- acupuncture
- acupoint
description:
  zh: 经络流注图模板 - 从针灸学教材中提取穴位和经脉的关系
  en: Meridian Flow Graph Template - Extract relationships between acupoints and meridians from acupuncture textbooks
output:
  description:
    zh: 穴位和经脉的关系网络
    en: Network of acupoint and meridian relationships
  entities:
    description:
      zh: 穴位和经脉
      en: Acupoints and meridians
    fields:
    - name: name
      type: str
      description:
        zh: 穴位或经脉名称
        en: Acupoint or meridian name
      required: true
    - name: type
      type: str
      description:
        zh: 实体类型：穴位/经脉/络脉/特定穴/经筋/皮部等
        en: 'Entity type: acupoint/meridian/collateral/specific_point/muscle_region/cutaneous_region, etc.'
      required: true
    - name: location
      type: str
      description:
        zh: 位置描述。例如：前臂桡侧/小腿外侧/足背等
        en: 'Location description. Examples: lateral_forearm/lateral_lower_leg/dorsum_of_foot, etc.'
      required: false
  relations:
    description:
      zh: 穴位和经脉的归属和流注关系
      en: Belonging and flow relationships between acupoints and meridians
    fields:
    - name: source
      type: str
      description:
        zh: 源实体
        en: Source entity
      required: true
    - name: target
      type: str
      description:
        zh: 目标实体
        en: Target entity
      required: true
    - name: type
      type: str
      description:
        zh: 关系类型：位于/流注/属络/交会/表里/同名等
        en: 'Relation type: located_on/flows_to/connects/intersects/interior_exterior/same_name, etc.'
      required: true
  fields:
  - name: 文档标题
    type: string
    description: 文档/文件的实际标题
    required: false
  - name: 文档日期
    type: date
    description: 文档创建/生成日期，格式 YYYY-MM-DD
    required: false
  - name: 文档编号
    type: string
    description: 文档唯一编号/文号（如有）
    required: false
  - name: 涉及单位
    type: string
    description: 文档涉及的主要单位/机构名称
    required: false
  - name: 涉及人员
    type: string
    description: 文档涉及的主要人员姓名
    required: false
  - name: 涉及金额
    type: number
    description: 文档涉及的总金额（如有，含币种）
    required: false
guideline:
  target:
    zh: 你是一位专业的针灸学专家，负责从针灸学教材中准确提取穴位和经脉的关系。
    en: You are a professional acupuncture expert responsible for accurately extracting relationships between acupoints and
      meridians from acupuncture textbooks.
  rules_for_entities:
    zh:
    - 提取穴位名称作为实体
    - 提取经脉名称作为实体
    - 位置描述应准确标注解剖位置
    en:
    - Extract acupoint names as entities
    - Extract meridian names as entities
    - Location descriptions should accurately indicate anatomical positions
  rules_for_relations:
    zh:
    - type为"位于"表示穴位属于某经脉
    - type为"流注"表示经脉的流注顺序
    en:
    - type located_on indicates acupoint belongs to a meridian
    - type flows_to indicates the flow sequence of meridians
identifiers:
  entity_id: name
  relation_id: '{source}|{type}|{target}'
  relation_members:
    source: source
    target: target
display:
  entity_label: '{name}'
  relation_label: '{type}'
