<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审计定性 — AuditWorkbench</title>
<link rel="stylesheet" href="lib/bootstrap-icons.css"><link rel="stylesheet" href="css/style.css">
<style>
.qual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-lg); }
@media (max-width:992px) { .qual-grid { grid-template-columns: 1fr; } }
.qual-result-card { border: 1px solid var(--color-border); border-left: 4px solid var(--color-primary); border-radius: var(--radius-md); padding: var(--space-md); margin-bottom: var(--space-sm); }
.qual-result-card.primary { border-left-color: var(--color-accent); }
.qual-chain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px; background: var(--color-bg); border-radius: var(--radius-sm); font-size: 13px; }
.qual-chain .chain-arrow { color: var(--color-text-muted); }
</style>
</head>
<body data-page="qualification">
<div id="aw-toast-container" style="position:fixed;top:68px;right:20px;z-index:9999;"></div>
<nav id="aw-navbar" class="app-navbar"></nav>
<div class="app-layout"><aside id="aw-sidebar" class="app-sidebar"></aside>
<main class="app-content">

<div class="page-header"><div><h1><i class="bi bi-crosshair"></i> 审计定性</h1>
<div class="breadcrumb">违规行为法律定性辅助 · 自动匹配法规依据链 · 同类案例推荐</div></div></div>

<div class="qual-grid">
  <!-- Left: Input -->
  <div class="card"><div class="card-header"><h3>问题描述</h3></div>
    <div class="form-group"><label class="form-label">审计领域</label><select class="form-select"><option>部门预算执行审计</option><option>农业农村审计</option><option>国有企业审计</option><option>社会保障审计</option></select></div>
    <div class="form-group"><label class="form-label">违规事实描述 <span class="text-danger">*</span></label>
      <textarea class="form-textarea" id="qual-desc" rows="6" placeholder="描述发现的违规事实，越详细越好。&#10;例如：某市教育局将应公开招标的500万元教学设备采购项目拆分为5个99万元的子项目，分别以询价方式采购，5个项目实际均由同一供应商中标。"></textarea></div>
    <div class="form-group"><label class="form-label">涉及金额</label><input type="text" class="form-input" value="¥4,850,000"></div>
    <button class="btn btn-accent btn-lg w-100" onclick="Qualification.analyze()"><i class="bi bi-search"></i> 智能定性分析</button>
  </div>

  <!-- Right: Results -->
  <div id="qual-results">
    <div class="card" style="text-align:center;padding:60px 20px;">
      <div style="font-size:48px;color:var(--color-border);margin-bottom:12px;"><i class="bi bi-lightbulb"></i></div>
      <p style="color:var(--color-text-muted);">输入违规事实后，AI将自动匹配违规模型、构建法规依据链、推荐同类案例</p>
    </div>
  </div>
</div>

</main></div>
<script src="js/app.js"></script>
<script>
var Qualification = {
  analyze: function() {
    var self = this;
    var desc = document.getElementById('qual-desc').value.trim();
    if (!desc) return AuditWorkbench.toast('请输入违规事实描述','warning');
    var results = document.getElementById('qual-results');
    results.innerHTML = '<div class="card"><div class="card-header"><h3>正在分析...</h3></div><div style="text-align:center;padding:30px;"><span class="pulse">●</span> 搜索违规模型 + 匹配法规...</div></div>';

    // P3-4: 调真实 API 搜索违规模型
    AuditAPI.knowledge.violations({q: desc, per_page: 5}).then(function(resp) {
      if (!resp.success || !resp.violations || resp.violations.length === 0) {
        results.innerHTML = '<div class="card"><div class="card-header"><h3>未匹配到违规模型</h3></div><div style="padding:20px;color:var(--color-text-muted);">请尝试用更具体的关键词描述违规事实，或<a href="knowledge.html">在知识工坊中搜索</a>。</div></div>';
        return;
      }
      self._renderResults(resp.violations, desc);
    }).catch(function() {
      results.innerHTML = '<div class="card"><div style="padding:20px;color:var(--color-accent);">分析失败，请确认后端服务已启动。</div></div>';
    });
  },

  _renderResults: function(violations, desc) {
    var self = this;
    var topV = violations[0];
    var html = '<div class="card" style="animation:fadeIn 0.3s ease;">' +
      '<div class="card-header"><h3>定性分析结果</h3><span class="badge badge-accent">' + violations.length + ' 个匹配模型</span></div>';

    // 主匹配
    html += '<div class="qual-result-card primary"><div style="display:flex;justify-content:space-between;align-items:start;">' +
      '<div><span class="badge badge-accent">最匹配</span> <strong style="font-size:16px;">' + (topV.violation_title || '未命名') + '</strong></div>' +
      '<span class="badge badge-' + (topV.severity === 'high' ? 'accent' : 'warning') + '">' + (topV.severity || 'medium') + '</span></div>' +
      '<div style="margin-top:8px;font-size:14px;">' + (topV.description || '').substring(0, 200) + '</div></div>';

    // 其他匹配
    if (violations.length > 1) {
      html += '<h4 style="margin-top:12px;">其他匹配模型</h4>';
      violations.slice(1, 4).forEach(function(v) {
        html += '<div class="rec-item" style="cursor:pointer;" onclick="Qualification._showDetail(' + v.id + ')">' +
          '<i class="bi bi-exclamation-triangle" style="color:var(--color-warning);"></i>' +
          '<div style="flex:1;"><strong>' + (v.violation_title || '') + '</strong>' +
          '<div style="font-size:12px;color:var(--color-text-muted);">' + (v.description || '').substring(0, 80) + '</div></div>' +
          '<span class="badge badge-' + (v.severity === 'high' ? 'accent' : 'warning') + '">' + (v.severity || '') + '</span></div>';
      });
    }

    // 表达式
    if (topV.expression_text) {
      html += '<h4 style="margin-top:12px;">违规判定表达式</h4><div style="background:var(--color-bg);padding:10px;border-radius:8px;font-family:monospace;font-size:13px;">' + topV.expression_text.substring(0, 300) + '</div>';
    }

    html += '<div style="display:flex;gap:8px;margin-top:12px;">' +
      '<button class="btn btn-primary" onclick="AuditWorkbench.toast(\'定性意见已保存\',\'success\')"><i class="bi bi-check-lg"></i> 确认定性</button>' +
      '<button class="btn btn-outline" onclick="Qualification._export()"><i class="bi bi-download"></i> 导出意见书</button></div></div>';
    document.getElementById('qual-results').innerHTML = html;
  },

  _showDetail: function(vid) {
    AuditWorkbench.toast('违规模型 #' + vid + ' 详情查看请前往知识工坊', 'info');
  },

  _export: function() {
    var desc = document.getElementById('qual-desc').value.trim();
    var mem = AuditWorkbench.getProjectMemory();
    AuditAPI.documents.generate({type: 'review', context: {project_title: mem.title || '审计项目', analysis_summary: desc}}).then(function(resp) {
      if (resp.success) AuditWorkbench.toast('定性意见书已生成', 'success');
      else AuditWorkbench.toast('生成失败: ' + (resp.error || ''), 'error');
    }).catch(function() { AuditWorkbench.toast('网络错误', 'error'); });
  }
};
</script>
</body>
</html>
