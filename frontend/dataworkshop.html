<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据工坊 — AuditWorkbench</title>
  <link rel="stylesheet" href="lib/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .smart-query-box {
      background: linear-gradient(135deg, rgba(26,58,92,0.03) 0%, rgba(26,58,92,0.06) 100%);
      border: 2px solid var(--color-border); border-radius: var(--radius-lg);
      padding: 24px; margin-bottom: var(--space-lg);
    }
    .smart-query-box textarea {
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      font-size: 15px; resize: none;
    }
    .result-bar {
      display: flex; align-items: center; gap: var(--space-lg); padding: 12px 16px;
      background: var(--color-card); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); margin-bottom: var(--space-md);
    }
    .result-stat { text-align: center; }
    .result-stat .val { font-size: 24px; font-weight: 700; }
    .result-stat .lbl { font-size: 12px; color: var(--color-text-muted); }
  </style>
</head>
<body data-page="dataworkshop">

  <div id="aw-toast-container" style="position:fixed;top:68px;right:20px;z-index:9999;"></div>
  <nav id="aw-navbar" class="app-navbar"></nav>
  <div class="app-layout">
    <aside id="aw-sidebar" class="app-sidebar"></aside>
    <main class="app-content">

      <div class="page-header">
        <div>
          <h1><i class="bi bi-grid-3x3-gap"></i> 数据工坊</h1>
          <div class="breadcrumb">非结构化 → 结构化 → 可查询 · 智能问数LLM自动生成表达式</div>
        </div>
      </div>

      <!-- Structured Data Tables -->
      <h3>结构化数据表 <span class="text-sm text-muted">（从上传资料自动生成）</span></h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-md);margin-bottom:var(--space-lg);">
        <div class="card" style="cursor:pointer;" onclick="DataWorkshop.selectTable('补贴发放')">
          <div style="font-size:20px;margin-bottom:4px;"><i class="bi bi-table" style="color:var(--color-primary);"></i> 补贴发放明细_结构化表</div>
          <div style="font-size:12px;color:var(--color-text-muted);">来源: 补贴发放明细.pdf</div>
          <div style="font-size:12px;color:var(--color-text-muted);">15字段 · 1,248条 · 2026-07-04</div>
        </div>
        <div class="card" style="cursor:pointer;border:2px solid var(--color-primary);" onclick="DataWorkshop.selectTable('采购合同')">
          <div style="font-size:20px;margin-bottom:4px;"><i class="bi bi-table" style="color:var(--color-primary);"></i> 采购合同_结构化表</div>
          <div style="font-size:12px;color:var(--color-text-muted);">来源: 采购合同汇总.pdf</div>
          <div style="font-size:12px;color:var(--color-text-muted);">8字段 · 5条 · 2026-07-03</div>
          <div style="font-size:12px;color:var(--color-primary);margin-top:4px;">← 当前选中</div>
        </div>
        <div class="card" style="cursor:pointer;" onclick="DataWorkshop.selectTable('银行流水')">
          <div style="font-size:20px;margin-bottom:4px;"><i class="bi bi-table" style="color:var(--color-warning);"></i> 银行流水_结构化表</div>
          <div style="font-size:12px;color:var(--color-text-muted);">来源: 银行流水2026Q1.csv</div>
          <div style="font-size:12px;color:var(--color-warning);">解析中...</div>
        </div>
      </div>

      <!-- Smart Query -->
      <div class="smart-query-box">
        <h3 style="margin-bottom:8px;"><i class="bi bi-magic"></i> 智能问数</h3>
        <p style="font-size:13px;color:var(--color-text-muted);margin-bottom:12px;">
          口述查询需求，LLM自动映射到结构化表字段并生成比对表达式。确认后自动执行。
        </p>
        <textarea class="form-textarea" id="nl-query" rows="2"
          placeholder="例如：查2026年3月所有采购方式为询价但金额超过100万的合同，按金额从大到小排列"></textarea>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
          <button class="btn btn-primary" onclick="DataWorkshop.nlToExpression()"><i class="bi bi-magic"></i> AI生成表达式</button>
          <span style="font-size:12px;color:var(--color-text-muted);">当前表: 采购合同_结构化表 (8字段, 5条)</span>
        </div>
        <div id="expression-result" style="margin-top:12px;"></div>
      </div>

      <!-- Multi-dimension Filter -->
      <h3>多维筛选</h3>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-md);" id="filters">
        <div class="form-group"><label class="form-label">签订日期(起)</label><input type="date" class="form-input" value="2026-01-01"></div>
        <div class="form-group"><label class="form-label">签订日期(止)</label><input type="date" class="form-input" value="2026-06-30"></div>
        <div class="form-group"><label class="form-label">采购方式</label><select class="form-select"><option>全部</option><option>询价</option><option>公开招标</option></select></div>
        <div class="form-group"><label class="form-label">金额范围</label><input type="number" class="form-input" placeholder="最低金额" value="0"></div>
      </div>
      <button class="btn btn-primary" onclick="DataWorkshop.executeQuery()"><i class="bi bi-search"></i> 执行查询</button>

      <div id="query-result" style="margin-top:var(--space-lg);"></div>

    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    const DataWorkshop = {
      nlToExpression() {
        const q = document.getElementById('nl-query').value.trim();
        if (!q) return AuditWorkbench.toast('请输入查询需求','warning');
        document.getElementById('expression-result').innerHTML = `
          <div class="card" style="margin-top:8px;animation:fadeIn 0.3s ease;">
            <div style="font-size:12px;color:var(--color-text-muted);margin-bottom:4px;"><i class="bi bi-magic"></i> LLM已理解您的需求，生成比对逻辑：</div>
            <div style="background:var(--color-bg);padding:10px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:13px;">
              签订日期 BETWEEN '2026-03-01' AND '2026-03-31'<br>
              AND 采购方式 = '询价'<br>
              AND 金额 >= 1000000<br>
              ORDER BY 金额 DESC
            </div>
            <div class="alert alert-info" style="margin-top:8px;margin-bottom:0;">
              <strong>预计扫描:</strong> 2条记录 · <strong>预计命中:</strong> 1条 · <strong>数据来源:</strong> 采购合同_结构化表
            </div>
            <div style="margin-top:8px;display:flex;gap:8px;">
              <button class="btn btn-accent btn-sm" onclick="DataWorkshop.executeQuery()"><i class="bi bi-check-lg"></i> 确认并执行</button>
              <button class="btn btn-outline btn-sm"><i class="bi bi-pencil"></i> 修改</button>
              <button class="btn btn-outline btn-sm" onclick="this.closest('.card').remove()"><i class="bi bi-x-lg"></i> 取消</button>
            </div>
          </div>`;
      },
      executeQuery() {
        document.getElementById('query-result').innerHTML = `
          <div class="card">
            <div class="card-header"><h3>查询结果</h3><span class="badge badge-accent">命中 1 条</span></div>
            <div class="result-bar">
              <div class="result-stat"><div class="val text-muted">5</div><div class="lbl">扫描总数</div></div>
              <div class="result-stat"><div class="val" style="color:var(--color-accent);">1</div><div class="lbl">命中数</div></div>
              <div class="result-stat"><div class="val" style="color:var(--color-primary);">20%</div><div class="lbl">命中率</div></div>
              <div class="result-stat"><div class="val" style="color:var(--color-accent);">¥1,200,000</div><div class="lbl">涉及金额</div></div>
              <div style="margin-left:auto;display:flex;gap:4px;">
                <button class="btn btn-sm btn-outline"><i class="bi bi-download"></i> 导出</button>
                <button class="btn btn-sm btn-primary" onclick="location.href='analysis.html'">提交智能分析</button>
              </div>
            </div>
            <div class="table-wrap">
              <table class="table">
                <thead><tr><th>合同号</th><th>金额</th><th>采购方式</th><th>供应商</th><th>签订日期</th><th>结果</th></tr></thead>
                <tbody>
                  <tr class="row-danger"><td>HT-003</td><td>¥1,200,000</td><td><span style="color:var(--color-accent);">询价</span></td><td>XX科技</td><td>2026-03-12</td><td><span class="badge badge-accent">🔴 命中</span></td></tr>
                </tbody>
              </table>
            </div>
          </div>`;
      }
    };
  </script>
</body>
</html>
