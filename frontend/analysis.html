<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>智能分析 — AuditWorkbench</title>
<link rel="stylesheet" href="lib/bootstrap-icons.css"><link rel="stylesheet" href="css/style.css">
<style>
.analysis-wrap { width:100%; }
.step-panel { display:none; }
.step-panel.active { display:block; animation:fadeIn 0.3s ease; }
</style>
</head>
<body data-page="analysis">
<div id="aw-toast-container" style="position:fixed;top:68px;right:20px;z-index:9999;"></div>
<nav id="aw-navbar" class="app-navbar"></nav>
<div class="app-layout"><aside id="aw-sidebar" class="app-sidebar"></aside>
<main class="app-content"><div class="analysis-wrap">

<div class="page-header"><div><h1>智能分析</h1><div class="breadcrumb">AI 审计助手引导式分析 · 自然语言交互 · 全程可溯源</div></div></div>

<div class="steps" id="step-bar">
  <div class="step active" onclick="AW.goBack(1)"><div class="step-num">1</div>意图判断</div>
  <div class="step" onclick="AW.goBack(2)"><div class="step-num">2</div>方法推荐</div>
  <div class="step" onclick="AW.goBack(3)"><div class="step-num">3</div>审计依据</div>
  <div class="step" onclick="AW.goBack(4)"><div class="step-num">4</div>资料分析</div>
  <div class="step" onclick="AW.goBack(5)"><div class="step-num">5</div>审核比对</div>
  <div class="step" onclick="AW.goBack(6)"><div class="step-num">6</div>疑点核实</div>
  <div class="step" onclick="AW.goBack(7)"><div class="step-num">7</div>文书编撰</div>
</div>

<!-- 主工作区 -->
<div style="display:grid;grid-template-columns:380px 1fr;gap:var(--space-lg);margin-top:var(--space-lg);min-height:500px;">

  <!-- 左侧：AI 审计助手聊天 -->
  <div class="card" style="display:flex;flex-direction:column;height:calc(100vh - 200px);">
    <div class="card-header"><h3 style="font-size:14px;"><i class="bi bi-robot"></i> AI 审计助手</h3></div>
    <div id="chat-msgs" style="flex:1;overflow-y:auto;padding:12px;font-size:14px;line-height:1.7;"></div>
    <div style="padding:8px;border-top:1px solid var(--color-border);">
      <textarea id="chat-input" rows="2" style="width:100%;border:1px solid var(--color-border);border-radius:8px;padding:8px;font-size:13px;resize:none;" placeholder="输入指令或描述审计需求..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();AW.send()}"></textarea>
      <div style="display:flex;gap:6px;margin-top:4px;">
        <button class="btn btn-primary btn-sm" style="flex:1;" onclick="AW.send()"><i class="bi bi-send"></i> 发送</button>
        <button class="btn btn-outline btn-sm" onclick="AW.uploadFile()" title="上传文件到项目资料库"><i class="bi bi-paperclip"></i></button>
      </div>
    </div>
  </div>

  <!-- 右侧：结构化确认区 -->
  <div id="right-panel"></div>

</div>

<!-- 隐藏的旧面板 S5 已改为动态渲染（renderS5），S6/S7 仍在此 -->
<!-- 隐藏的旧面板 S6 已改为动态渲染（renderS6），S7 仍在此 -->

<div class="step-panel" id="s7"><div class="card"><div class="card-header"><h3>第七步：文书编撰</h3></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;">
    <div class="card" style="text-align:center;cursor:pointer;border-top:3px solid var(--color-primary);" onclick="AuditWorkbench.toast('取证单预览','info')"><i class="bi bi-file-earmark-text" style="font-size:32px;color:var(--color-primary);"></i><h4 style="margin-top:6px;">取证单</h4><p style="font-size:12px;color:var(--color-text-muted);">从疑点提取关键事实</p><span class="badge badge-primary">3份</span></div>
    <div class="card" style="text-align:center;cursor:pointer;border-top:3px solid var(--color-warning);" onclick="AuditWorkbench.toast('审计底稿预览','info')"><i class="bi bi-file-earmark-spreadsheet" style="font-size:32px;color:var(--color-warning);"></i><h4 style="margin-top:6px;">审计底稿</h4><p style="font-size:12px;color:var(--color-text-muted);">程序+证据+结论</p><span class="badge badge-warning">3份</span></div>
    <div class="card" style="text-align:center;cursor:pointer;border-top:3px solid var(--color-accent);" onclick="AuditWorkbench.toast('报告初稿预览','info')"><i class="bi bi-file-earmark-pdf" style="font-size:32px;color:var(--color-accent);"></i><h4 style="margin-top:6px;">报告初稿</h4><p style="font-size:12px;color:var(--color-text-muted);">评价+发现+建议</p><span class="badge badge-accent">1份</span></div>
    <div class="card" style="text-align:center;cursor:pointer;border-top:3px solid var(--color-success);" onclick="AuditWorkbench.toast('定性复核预览','info')"><i class="bi bi-check2-all" style="font-size:32px;color:var(--color-success);"></i><h4 style="margin-top:6px;">定性复核</h4><p style="font-size:12px;color:var(--color-text-muted);">AI vs 人工复核</p><span class="badge badge-success">1份</span></div>
  </div>
  <div style="display:flex;gap:8px;"><button class="btn btn-outline" onclick="AW.step=6;AW.showStep(6);AW.updateStepBar(6);">返回</button><button class="btn btn-accent btn-lg"><i class="bi bi-download"></i> 导出全部文书</button></div></div></div>

</div></main></div>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/analysis-wiz.js"></script>
</body>
</html>
