<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文书生成 — AuditWorkbench</title>
<link rel="stylesheet" href="lib/bootstrap-icons.css"><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="documents">
<div id="aw-toast-container" style="position:fixed;top:68px;right:20px;z-index:9999;"></div>
<nav id="aw-navbar" class="app-navbar"></nav>
<div class="app-layout"><aside id="aw-sidebar" class="app-sidebar"></aside>
<main class="app-content">
<div class="page-header"><div><h1><i class="bi bi-file-earmark-pdf"></i> 文书生成</h1>
<div class="breadcrumb">疑点报告 → 一键生成取证单 · 审计底稿 · 报告初稿 · 定性复核意见</div></div></div>

<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-md);margin-bottom:var(--space-lg);">
  <div class="card" style="text-align:center;cursor:pointer;border-top:3px solid var(--color-primary);" onclick="DocGen.preview('evidence')">
    <i class="bi bi-file-earmark-text" style="font-size:40px;color:var(--color-primary);"></i>
    <h3 style="margin-top:8px;">取证单</h3><p style="font-size:12px;color:var(--color-text-muted);">从疑点提取关键事实<br>自动生成标准取证单</p>
    <span class="badge badge-primary">可生成 2 份</span>
  </div>
  <div class="card" style="text-align:center;cursor:pointer;border-top:3px solid var(--color-warning);" onclick="DocGen.preview('workpaper')">
    <i class="bi bi-file-earmark-spreadsheet" style="font-size:40px;color:var(--color-warning);"></i>
    <h3 style="margin-top:8px;">审计底稿</h3><p style="font-size:12px;color:var(--color-text-muted);">取证单扩展+审计程序<br>+证据链+审计结论</p>
    <span class="badge badge-warning">可生成 2 份</span>
  </div>
  <div class="card" style="text-align:center;cursor:pointer;border-top:3px solid var(--color-accent);" onclick="DocGen.preview('report')">
    <i class="bi bi-file-earmark-pdf" style="font-size:40px;color:var(--color-accent);"></i>
    <h3 style="margin-top:8px;">报告初稿</h3><p style="font-size:12px;color:var(--color-text-muted);">底稿提炼+审计评价<br>+审计发现+审计建议</p>
    <span class="badge badge-accent">可生成 1 份</span>
  </div>
  <div class="card" style="text-align:center;cursor:pointer;border-top:3px solid var(--color-success);" onclick="DocGen.preview('review')">
    <i class="bi bi-check2-all" style="font-size:40px;color:var(--color-success);"></i>
    <h3 style="margin-top:8px;">定性复核意见</h3><p style="font-size:12px;color:var(--color-text-muted);">AI建议 vs 人工复核<br>双栏对比+自由裁量建议</p>
    <span class="badge badge-success">可生成 1 份</span>
  </div>
</div>

<!-- 操作区 — 置顶 -->
<div class="card" style="margin-bottom:var(--space-md);">
  <div class="card-header"><h3><i class="bi bi-gear"></i> 生成操作</h3></div>
  <div style="display:flex;gap:var(--space-md);align-items:center;flex-wrap:wrap;">
    <select id="doc-project-select" class="form-select" style="width:280px;" onchange="DocProj.select(this.value)"><option value="">加载项目...</option></select>
    <label style="display:flex;align-items:center;gap:4px;font-size:14px;"><input type="checkbox" checked> 取证单</label>
    <label style="display:flex;align-items:center;gap:4px;font-size:14px;"><input type="checkbox" checked> 审计底稿</label>
    <label style="display:flex;align-items:center;gap:4px;font-size:14px;"><input type="checkbox"> 报告初稿</label>
    <label style="display:flex;align-items:center;gap:4px;font-size:14px;"><input type="checkbox"> 定性复核</label>
    <div style="flex:1;"></div>
    <button class="btn btn-accent btn-lg"><i class="bi bi-play-fill"></i> 一键生成全部</button>
    <button class="btn btn-outline"><i class="bi bi-file-earmark-text"></i> 预览选中</button>
  </div>
</div>

<div id="doc-preview" style="display:none;">
  <div class="card">
    <div class="card-header"><h3 id="preview-title">文书预览</h3>
      <div><button class="btn btn-sm btn-primary"><i class="bi bi-download"></i> 导出Word</button>
      <button class="btn btn-sm btn-outline" onclick="document.getElementById('doc-preview').style.display='none'"><i class="bi bi-x-lg"></i></button></div>
    </div>
    <div id="preview-content"></div>
  </div>
</div>

</main></div>
<script src="js/app.js"></script>
<script>
var DocGen = {
  _currentType: null,
  _context: function() {
    var mem = {};
    mem = AuditWorkbench.getProjectMemory();
    return {
      project_title: mem.title || '审计项目',
      auditor: '审计员',
      suspicions: [],
      laws: [],
      analysis_summary: mem.summary || '',
      domain: mem.domain || '',
      audit_period: mem.period || ''
    };
  },

  preview: function(type) {
    var self = this;
    self._currentType = type;
    var panel = document.getElementById('doc-preview');
    var content = document.getElementById('preview-content');
    var titles = {evidence:'审计取证单', workpaper:'审计工作底稿', report:'审计报告', review:'审理复核意见书'};
    document.getElementById('preview-title').textContent = titles[type] || '文书预览';
    panel.style.display = 'block';
    content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--color-text-muted);"><span class="pulse">●</span> 正在生成' + (titles[type]||'文书') + '...</div>';
    panel.scrollIntoView({behavior:'smooth'});

    // P3-3: 调真实文书生成 API
    AuditAPI.documents.generate({type: type, context: self._context()}).then(function(resp) {
      if (resp.success && resp.document) {
        content.innerHTML = self._renderDocument(resp.document, type);
      } else {
        content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--color-text-muted);">生成失败：' + (resp.error || '服务不可用') + '<br><button class="btn btn-outline" style="margin-top:12px;" onclick="DocGen.preview(\'' + type + '\')">重试</button></div>';
      }
    }).catch(function() {
      content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--color-text-muted);">网络错误，请确认后端服务已启动</div>';
    });
  },

  _renderDocument: function(doc, type) {
    var h = '<div style="background:var(--color-card);border:1px solid var(--color-border);padding:24px;max-width:700px;margin:0 auto;font-size:14px;line-height:2;">';
    h += '<h2 style="text-align:center;margin-bottom:16px;">' + (doc.title || '文书') + '</h2>';
    if (doc.code) h += '<p><strong>编号:</strong> ' + doc.code + '</p>';
    if (doc.project) h += '<p><strong>项目:</strong> ' + doc.project + '</p>';
    if (doc.date) h += '<p><strong>日期:</strong> ' + doc.date + '</p>';
    if (doc.auditor) h += '<p><strong>审计员:</strong> ' + doc.auditor + '</p>';

    // 取证单：审计事项列表
    if (doc.audit_items && doc.audit_items.length > 0) {
      h += '<hr><p><strong>审计事项</strong></p>';
      doc.audit_items.forEach(function(item, i) {
        h += '<p>' + (i+1) + '. ' + (item.audit_item || item.finding || '') + '';
        if (item.amount) h += '（涉及金额：' + item.amount + '）';
        if (item.legal_basis) {
          var laws = item.legal_basis.map(function(l) { return '《' + (l.law || l.law_title || '') + '》' + (l.clause || ''); });
          h += '<br><em>依据：' + laws.join('；') + '</em>';
        }
        h += '</p>';
      });
    }

    // 底稿：程序
    if (doc.procedures && doc.procedures.length > 0) {
      h += '<hr><p><strong>审计程序</strong></p>';
      doc.procedures.forEach(function(p, i) { h += '<p>' + (i+1) + '. ' + p + '</p>'; });
    }
    if (doc.findings) h += '<hr><p><strong>审计发现</strong></p><p>' + doc.findings + '</p>';

    // 报告：疑点
    if (doc.suspicions && doc.suspicions.length > 0) {
      h += '<hr><p><strong>审计发现疑点（' + (doc.total_suspicions || doc.suspicions.length) + '条）</strong></p>';
      doc.suspicions.forEach(function(s, i) {
        h += '<p>' + (i+1) + '. <strong>' + (s.title || '') + '</strong>';
        if (s.risk_level) h += ' <span class="badge badge-' + (s.risk_level === 'high' ? 'accent' : 'warning') + '">' + s.risk_level + '</span>';
        if (s.description) h += '<br>' + s.description;
        h += '</p>';
      });
    }
    if (doc.summary) h += '<hr><p><strong>摘要</strong></p><p>' + doc.summary + '</p>';
    if (doc.recommendations && doc.recommendations.length) {
      h += '<hr><p><strong>审计建议</strong></p>';
      doc.recommendations.forEach(function(r) { h += '<p>• ' + r + '</p>'; });
    }

    // 复核意见书
    if (doc.review_items && doc.review_items.length) {
      h += '<hr><p><strong>复核事项</strong></p>';
      doc.review_items.forEach(function(r) {
        h += '<p>• ' + (r.item || '') + '：AI评估=' + (r.ai_assessment || '') + ' ▸ 人工复核=<input type="text" placeholder="填写意见" style="width:200px;border:1px solid var(--color-border);border-radius:4px;padding:2px 6px;"></p>';
      });
    }

    h += '<div style="display:flex;gap:8px;margin-top:16px;justify-content:center;">';
    h += '<button class="btn btn-primary" onclick="DocGen.confirmGenerate()"><i class="bi bi-check-lg"></i> 确认生成</button>';
    h += '<button class="btn btn-outline" onclick="DocGen.exportWord()"><i class="bi bi-download"></i> 导出Word</button>';
    h += '<button class="btn btn-outline" onclick="document.getElementById(\'doc-preview\').style.display=\'none\'">关闭</button>';
    h += '</div></div>';
    return h;
  },

  confirmGenerate: function() {
    AuditWorkbench.toast((this._currentType || '文书') + '已生成', 'success');
    document.getElementById('doc-preview').style.display = 'none';
  },

  exportWord: function() {
    if (!this._currentType) return;
    var self = this;
    AuditWorkbench.toast('正在导出Word文档...', 'info');
    // 调导出端点（返回 .docx 文件）
    fetch(AuditAPI.base + '/api/audit/documents/export', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({doc_type: self._currentType, context: self._context()})
    }).then(function(r) {
      if (!r.ok) throw new Error('导出失败');
      return r.blob();
    }).then(function(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = (self._currentType || 'document') + '.docx';
      a.click(); URL.revokeObjectURL(url);
      AuditWorkbench.toast('Word文档已下载', 'success');
    }).catch(function(e) {
      AuditWorkbench.toast('导出失败：' + e.message, 'error');
    });
  }
};

// 2.7: 项目下拉联动 — 真实项目列表 + 选中写入 aw_project_memory（供 DocGen.preview 读取）
var DocProj = {
  _projects: [],
  load: function() {
    var sel = document.getElementById('doc-project-select');
    if (!sel) return;
    AuditAPI.projects.list().then(function(resp) {
      var projects = (resp && resp.projects) || [];
      DocProj._projects = projects;
      if (!projects.length) {
        sel.innerHTML = '<option value="">暂无项目，请先创建</option>';
        return;
      }
      sel.innerHTML = projects.map(function(p) {
        return '<option value="' + p.id + '">' + (p.name || '未命名') + '</option>';
      }).join('');
      sel.value = projects[0].id;
      DocProj.select(sel.value);
    }).catch(function() {
      sel.innerHTML = '<option value="">加载失败，请确认后端服务</option>';
    });
  },
  select: function(pid) {
    var p = this._projects.find(function(x) { return x.id === pid; }) || {};
    var mem = {
      title: p.name || '审计项目',
      domain: '审计项目',
      unit: p.description || '',
      period: p.audit_period || '',
      project_id: pid,
      createdAt: new Date().toISOString()
    };
    mem.compressedPrompt = '【项目】' + mem.title + '，' + (mem.unit || '') + '，期间' + (mem.period || '—') + '。';
    localStorage.setItem('aw_project_memory', JSON.stringify(mem));
  }
};
DocProj.load();
</script>
</body>
</html>
