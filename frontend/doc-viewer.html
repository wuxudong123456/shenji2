<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资料查看器 — AuditWorkbench</title>
  <link rel="stylesheet" href="lib/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .viewer-layout { display: grid; grid-template-columns: 280px 1fr 1fr; gap: 12px; height: calc(100vh - 200px); }
    .viewer-panel {
      background: #fff; border-radius: 10px; border: 1px solid var(--color-border);
      overflow-y: auto; padding: 16px;
    }
    .viewer-panel h4 { font-size: 14px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--color-border); }
    .meta-field { margin-bottom: 10px; }
    .meta-field label { font-size: 11px; color: var(--color-text-muted); display: block; }
    .meta-field .val { font-size: 14px; font-weight: 500; }
    .meta-conf { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .meta-conf .bar { flex:1; height:4px; background:var(--color-border); border-radius:2px; overflow:hidden; }
    .meta-conf .bar .fill { height:100%; border-radius:2px; }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--color-border); border-radius: 10px;
      padding: 16px 24px; margin-bottom: 12px; text-align: center;
      cursor: pointer; transition: all 0.2s; background: var(--color-bg);
    }
    .upload-zone:hover, .upload-zone.drag { border-color: var(--color-primary); background: rgba(26,58,92,0.03); }
    .upload-zone.has-file { border-style: solid; border-color: var(--color-success); background: rgba(45,125,70,0.03); }

    /* Status badge */
    .parse-status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
    .parse-status.ready { background: rgba(45,125,70,0.1); color: var(--color-success); }
    .parse-status.parsing { background: rgba(184,94,26,0.1); color: var(--color-warning); }
    .parse-status.empty { background: rgba(127,140,141,0.1); color: var(--color-text-muted); }
  </style>
</head>
<body data-page="docworkshop">

<div id="aw-toast-container" style="position:fixed;top:68px;right:20px;z-index:9999;"></div>
<nav id="aw-navbar" class="app-navbar"></nav>

<div class="app-layout">
  <aside id="aw-sidebar" class="app-sidebar"></aside>
  <main class="app-content">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <h1 style="margin:0;"><i class="bi bi-file-earmark-text"></i> 资料查看器</h1>
        <div class="breadcrumb" id="doc-name" style="margin-top:2px;">上传 PDF → LiteParse Markdown 化</div>
      </div>
      <div style="display:flex;gap:8px;">
        <span class="parse-status empty" id="parse-status"><i class="bi bi-circle"></i> 未加载</span>
        <button class="btn btn-outline btn-sm" onclick="DocViewer.toggleSource()"><i class="bi bi-layout-split"></i> 对比源文件</button>
        <button class="btn btn-outline btn-sm" onclick="DocViewer.openInEditor()"><i class="bi bi-pencil-square"></i> MD编辑器</button>
        <button class="btn btn-outline btn-sm" onclick="DocViewer.clearAll()"><i class="bi bi-arrow-repeat"></i> 重新开始</button>
      </div>
    </div>

    <!-- Upload Zone -->
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()"
         ondragover="event.preventDefault();this.classList.add('drag')"
         ondragleave="this.classList.remove('drag')"
         ondrop="event.preventDefault();this.classList.remove('drag');DocViewer.handleDrop(event)">
      <i class="bi bi-cloud-upload" style="font-size:28px;color:var(--color-text-muted);"></i>
      <p style="margin:4px 0 8px;font-size:14px;" id="upload-text">拖拽 PDF/DOCX 到此处，或点击下方按钮选择文件</p>
      <button class="btn btn-primary" onclick="event.stopPropagation();document.getElementById('file-input').click()" style="pointer-events:auto;">
        <i class="bi bi-folder2-open"></i> 选择文件</button>
      <p style="margin:4px 0 0;font-size:11px;color:var(--color-text-muted);">LiteParse 引擎 · 本地解析 · 不做 OCR · 支持 PDF / DOCX / XLSX</p>
    </div>
    <input type="file" id="file-input" accept=".pdf,.docx,.doc,.xlsx,.xls" style="display:none"
           onchange="if(this.files.length){console.log('File selected:',this.files[0].name);DocViewer.parseFile(this.files[0])}">

    <div class="viewer-layout">
      <!-- 左栏：元数据 Tab -->
      <div>
        <div class="viewer-panel" style="margin-bottom:12px;">
          <!-- Tab bar -->
          <div style="display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid var(--color-border);">
            <button class="meta-tab active" onclick="DocViewer.switchMetaTab('parse')" id="tab-parse" style="flex:1;padding:6px 0;border:none;background:none;font-size:12px;font-weight:600;color:var(--color-primary);border-bottom:2px solid var(--color-primary);margin-bottom:-2px;cursor:pointer;">📄 解析</button>
            <button class="meta-tab" onclick="DocViewer.switchMetaTab('fields')" id="tab-fields" style="flex:1;padding:6px 0;border:none;background:none;font-size:12px;font-weight:600;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;">📋 字段</button>
            <button class="meta-tab" onclick="DocViewer.switchMetaTab('trace')" id="tab-trace" style="flex:1;padding:6px 0;border:none;background:none;font-size:12px;font-weight:600;color:var(--color-text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;">📍 溯源</button>
          </div>

          <!-- Tab: 解析信息 -->
          <div id="panel-parse" class="meta-panel">
            <div style="text-align:center;padding:20px;color:var(--color-text-muted);font-size:13px;">
              <i class="bi bi-arrow-up" style="font-size:20px;opacity:0.3;"></i>
              <p style="margin-top:8px;">上传文件后自动解析</p>
            </div>
          </div>

          <!-- Tab: 提取字段 -->
          <div id="panel-fields" class="meta-panel" style="display:none;">
            <!-- Auto-match -->
            <button class="btn btn-sm btn-primary" style="width:100%;margin-bottom:8px;" id="btn-auto-match"
                    onclick="DocViewer.autoMatchTemplate()" disabled>
              <i class="bi bi-magic"></i> 🤖 自动匹配模板
            </button>
            <div id="match-results" style="display:none;margin-bottom:8px;"></div>
            <details style="font-size:12px;" id="manual-select">
              <summary style="cursor:pointer;color:var(--color-text-muted);">或手动选择模板 ▾</summary>
              <select id="tpl-domain" style="width:100%;margin-top:6px;margin-bottom:4px;font-size:11px;padding:4px;" onchange="DocViewer.onDomainChange()">
                <option value="">选择领域...</option>
              </select>
              <select id="tpl-category" style="width:100%;margin-bottom:4px;font-size:11px;padding:4px;" onchange="DocViewer.onCategoryChange()">
                <option value="">选择类别...</option>
              </select>
              <select id="tpl-select" style="width:100%;margin-bottom:4px;font-size:11px;padding:4px;" onchange="DocViewer.onTemplateSelect()" size="3">
                <option value="">先选领域和类别...</option>
              </select>
            </details>
            <div id="template-fields" style="margin-top:8px;display:none;border-top:1px solid var(--color-border);padding-top:8px;">
              <div style="font-size:11px;color:var(--color-text-muted);margin-bottom:4px;" id="tpl-fields-title">提取字段</div>
              <div id="tpl-fields-list" style="font-size:12px;max-height:180px;overflow-y:auto;"></div>
              <button class="btn btn-sm btn-primary" style="margin-top:8px;width:100%;" onclick="DocViewer.extractWithTemplate(event)">
                <i class="bi bi-magic"></i> 按此模板提取
              </button>
            </div>
            <div id="extraction-results" style="margin-top:8px;"></div>
          </div>

          <!-- Tab: 溯源 -->
          <div id="panel-trace" class="meta-panel" style="display:none;">
            <div style="text-align:center;padding:20px;color:var(--color-text-muted);font-size:13px;">
              <i class="bi bi-link-45deg" style="font-size:20px;opacity:0.3;"></i>
              <p style="margin-top:8px;">提取字段后可查看溯源</p>
            </div>
            <div id="trace-content"></div>
          </div>
        </div>

        <!-- 模板信息 -->
        <div class="viewer-panel">
          <h4 style="font-size:13px;"><span id="tpl-count-label">提取模板</span></h4>
          <div id="tpl-info" style="font-size:12px;color:var(--color-text-muted);">加载中...</div>
        </div>
      </div>

      <!-- 中栏：Markdown 内容 -->
      <div class="viewer-panel" id="md-view" style="overflow-y:auto;">
        <h4 style="display:flex;align-items:center;justify-content:space-between;">
          <span><i class="bi bi-markdown"></i> Markdown 内容</span>
          <span style="font-size:11px;color:var(--color-text-muted);" id="md-info"></span>
        </h4>
        <div id="md-placeholder" style="text-align:center;padding:40px;color:var(--color-text-muted);font-size:14px;">
          <i class="bi bi-markdown" style="font-size:48px;opacity:0.2;"></i>
          <p style="margin-top:12px;">上传文件后这里展示 Markdown</p>
        </div>
        <pre id="md-content" style="display:none;white-space:pre-wrap;word-break:break-all;font-family:Consolas,'Microsoft YaHei',monospace;font-size:13px;line-height:1.7;padding:12px;background:var(--color-bg);border-radius:8px;max-height:calc(100vh - 280px);overflow-y:auto;"></pre>
      </div>

      <!-- 右栏：源文件对比（默认隐藏） -->
      <div class="viewer-panel" id="source-view" style="display:none;">
        <h4><i class="bi bi-file-earmark-pdf"></i> 原始文本</h4>
        <pre style="background:var(--color-bg);border-radius:8px;padding:12px;height:calc(100% - 40px);overflow-y:auto;font-family:Consolas,'Microsoft YaHei',monospace;font-size:13px;white-space:pre-wrap;word-break:break-all;" id="raw-text"></pre>
      </div>
    </div>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
var DocViewer = {
  sourceVisible: false,
  currentResult: null,

  init: function() {
    this.loadTemplateTree();
  },

  switchMetaTab: function(tab) {
    document.querySelectorAll('.meta-tab').forEach(function(b) {
      b.style.color = 'var(--color-text-muted)';
      b.style.borderBottomColor = 'transparent';
    });
    document.querySelectorAll('.meta-panel').forEach(function(p) { p.style.display = 'none'; });
    var btn = document.getElementById('tab-' + tab);
    var panel = document.getElementById('panel-' + tab);
    if (btn) { btn.style.color = 'var(--color-primary)'; btn.style.borderBottomColor = 'var(--color-primary)'; }
    if (panel) panel.style.display = '';
  },

  // ===== 模板系统 =====
  templateTree: null,
  selectedTemplate: null,

  loadTemplateTree: function() {
    var self = this;
    fetch(MinioAPI.base + '/api/templates/categories')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.success) return;
        self.templateTree = data.tree;
        document.getElementById('tpl-count-label').textContent = '提取模板 (' + data.total + ')';

        // Populate domain dropdown
        var sel = document.getElementById('tpl-domain');
        sel.innerHTML = '<option value="">选择领域 (' + data.tree.length + ')...</option>';
        data.tree.forEach(function(d) {
          sel.innerHTML += '<option value="' + d.domain + '">' + d.domain + ' (' + d.total + ')</option>';
        });
      })
      .catch(function() {
        document.getElementById('tpl-count-label').textContent = '提取模板 (不可用)';
      });
  },

  onDomainChange: function() {
    var domain = document.getElementById('tpl-domain').value;
    var catSel = document.getElementById('tpl-category');
    var tplSel = document.getElementById('tpl-select');
    catSel.innerHTML = '<option value="">选择类别...</option>';
    tplSel.innerHTML = '<option value="">先选类别...</option>';
    document.getElementById('template-fields').style.display = 'none';

    if (!domain || !this.templateTree) return;
    var node = this.templateTree.find(function(d) { return d.domain === domain; });
    if (!node) return;
    node.categories.forEach(function(c) {
      catSel.innerHTML += '<option value="' + c.name + '">' + c.name + ' (' + c.count + ')</option>';
    });
  },

  onCategoryChange: function() {
    var domain = document.getElementById('tpl-domain').value;
    var category = document.getElementById('tpl-category').value;
    var tplSel = document.getElementById('tpl-select');
    tplSel.innerHTML = '<option value="">加载中...</option>';
    document.getElementById('template-fields').style.display = 'none';

    if (!domain || !category) {
      tplSel.innerHTML = '<option value="">先选领域和类别...</option>';
      return;
    }

    var self = this;
    var url = MinioAPI.base + '/api/templates?domain=' + encodeURIComponent(domain) + '&category=' + encodeURIComponent(category) + '&limit=200';
    fetch(url).then(function(r) { return r.json(); }).then(function(data) {
      if (!data.success) return;
      tplSel.innerHTML = '';
      data.templates.forEach(function(t) {
        tplSel.innerHTML += '<option value="' + t.name + '">' + t.name.split('/').pop() + ' (' + t.field_count + '字段)</option>';
      });
      if (data.templates.length === 0) {
        tplSel.innerHTML = '<option value="">无模板</option>';
      }
    });
  },

  onTemplateSelect: function() {
    var name = document.getElementById('tpl-select').value;
    if (!name) { document.getElementById('template-fields').style.display = 'none'; return; }

    var self = this;
    fetch(MinioAPI.base + '/api/templates/' + encodeURIComponent(name))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.success) return;
        self.selectedTemplate = data.template;
        self.showTemplateFields(data.template);
      });
  },

  showTemplateFields: function(tmpl) {
    var panel = document.getElementById('template-fields');
    panel.style.display = 'block';
    document.getElementById('tpl-fields-title').textContent = '提取字段 (' + tmpl.fields.length + '个)';

    var html = '';
    tmpl.fields.forEach(function(f) {
      html += '<div style="display:flex;align-items:center;gap:4px;padding:2px 0;">' +
        '<span class="badge" style="font-size:10px;background:rgba(26,58,92,0.1);color:var(--color-primary);">' + f.type + '</span>' +
        '<span style="font-size:11px;">' + f.name + '</span>' +
        '</div>';
    });
    if (tmpl.violations && tmpl.violations.length > 0) {
      html += '<div style="font-size:11px;color:var(--color-text-muted);margin-top:4px;">含 ' + tmpl.violations.length + ' 条违规表达式</div>';
    }
    document.getElementById('tpl-fields-list').innerHTML = html;
  },

  autoMatchTemplate: function() {
    if (!this.currentResult || !this.currentResult.full_markdown) {
      AuditWorkbench.toast('请先上传并解析文档', 'warning'); return;
    }

    var self = this;
    var btn = document.getElementById('btn-auto-match');
    var panel = document.getElementById('match-results');
    btn.disabled = true;
    btn.innerHTML = '<span class="pulse">●</span> AI 分类中...';
    panel.style.display = 'block';
    panel.innerHTML = '<div style="font-size:12px;color:var(--color-text-muted);padding:8px;text-align:center;"><span class="pulse">●</span> LLM 正在分析文档类型...</div>';

    fetch(MinioAPI.base + '/api/templates/classify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ markdown: self.currentResult.full_markdown })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-magic"></i> 🤖 自动匹配模板';

      if (!data.success) {
        panel.innerHTML = '<div style="font-size:12px;color:var(--color-accent);padding:8px;">分类失败: ' + (data.error || '') + '</div>';
        return;
      }

      var cls = data.classification;
      var html = '<div style="font-size:11px;color:var(--color-success);margin-bottom:6px;">' +
        '🤖 AI 判断: <strong>' + (cls.doc_type || '未知') + '</strong> → ' + (cls.category || '') +
        '</div>' +
        '<div style="font-size:10px;color:var(--color-text-muted);margin-bottom:8px;">' + (cls.reasoning || '') + '</div>';

      if (data.matches && data.matches.length > 0) {
        html += '<div style="font-size:11px;font-weight:600;margin-bottom:4px;">匹配模板:</div>';
        data.matches.slice(0, 5).forEach(function(m, i) {
          var name = m.name.split('/').pop();
          html += '<div class="template-item' + (i === 0 ? ' active' : '') + '" ' +
            'style="padding:6px 8px;font-size:11px;cursor:pointer;display:flex;justify-content:space-between;" ' +
            'onclick="DocViewer.selectMatchedTemplate(\'' + m.name.replace(/'/g, "\\'") + '\')">' +
            '<span>' + name + '</span>' +
            '<span style="color:var(--color-text-muted);">' + m.field_count + '字段</span>' +
            '</div>';
        });

        // Auto-select the first match
        setTimeout(function() {
          self.selectMatchedTemplate(data.matches[0].name);
        }, 100);
      }
      panel.innerHTML = html;
    })
    .catch(function(e) {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-magic"></i> 🤖 自动匹配模板';
      panel.innerHTML = '<div style="font-size:12px;color:var(--color-accent);padding:8px;">' +
        '分类失败: ' + (e.message || '网络错误') + '<br>' +
        '<small style="color:var(--color-text-muted);">请确认后端 :5000 已启动且 LLM 配置正确</small></div>';
    });
  },

  selectMatchedTemplate: function(name) {
    var self = this;
    fetch(MinioAPI.base + '/api/templates/' + encodeURIComponent(name))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.success) return;
        self.selectedTemplate = data.template;
        self.showTemplateFields(data.template);
        // Highlight the selected item
        document.querySelectorAll('#match-results .template-item').forEach(function(el, i) {
          el.classList.remove('active');
        });
      });
  },

  searchTemplates: function(q) {
    if (!q || q.length < 1) {
      // Reset to dropdown mode
      return;
    }
    if (q.length < 2) return;

    var self = this;
    fetch(MinioAPI.base + '/api/templates?q=' + encodeURIComponent(q) + '&limit=15')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.success) return;
        var tplSel = document.getElementById('tpl-select');
        tplSel.innerHTML = '';
        data.templates.forEach(function(t) {
          tplSel.innerHTML += '<option value="' + t.name + '">' + t.name.split('/').pop() + ' [' + t.domain + '/' + t.field_count + '字段]</option>';
        });
        tplSel.size = Math.min(8, data.templates.length || 3);
      });
  },

  extractWithTemplate: function() {
    if (!this.selectedTemplate) { AuditWorkbench.toast('请先选择模板', 'warning'); return; }
    if (!this.currentResult || !this.currentResult.full_markdown) { AuditWorkbench.toast('请先上传并解析文档', 'warning'); return; }

    var self = this;
    var btn = event.target;
    btn.disabled = true;
    btn.innerHTML = '<span class="pulse">●</span> LLM 提取中...';
    AuditWorkbench.toast('正在调用 LLM 提取...', 'info');

    fetch(MinioAPI.base + '/api/templates/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        template_name: self.selectedTemplate.name,
        markdown: self.currentResult.full_markdown
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      btn.disabled = false;
      if (data.success) {
        btn.innerHTML = '<i class="bi bi-check-lg"></i> 提取完成';
        AuditWorkbench.toast('LLM 提取完成 · ' + data.fields.length + ' 个字段', 'success');
        self.showExtractionResult(data);
      } else {
        btn.innerHTML = '<i class="bi bi-magic"></i> 按此模板提取';
        AuditWorkbench.toast('提取失败: ' + (data.error || '未知错误'), 'danger');
      }
    })
    .catch(function(e) {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-magic"></i> 按此模板提取';
      AuditWorkbench.toast('提取失败: ' + (e.message || '网络错误'), 'danger');
    });
  },

  showExtractionResult: function(data) {
    var self = this;
    // Populate fields tab
    var providedFields = data.fields.filter(function(f) { return f.value && f.value !== '未提供' && f.value !== 'None'; });
    var emptyFields = data.fields.filter(function(f) { return !f.value || f.value === '未提供' || f.value === 'None'; });

    var html = '<div style="font-size:12px;color:var(--color-success);font-weight:600;margin-bottom:8px;">' +
      '<i class="bi bi-check-circle"></i> 提取完成 · ' + providedFields.length + ' 个字段有值</div>';

    // Show provided fields
    var traceItems = [];
    providedFields.forEach(function(f, idx) {
      var traceInfo = self.findTraceItem(f.value);
      html += '<div class="meta-field" style="position:relative;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<label>' + f.name + ' <span style="font-size:9px;color:var(--color-text-muted);">[' + f.type + ']</span></label>' +
          (traceInfo ? '<a href="#" onclick="DocViewer.showTrace(\'p' + idx + '\');return false;" style="font-size:10px;color:var(--color-primary);text-decoration:none;" title="溯源">📍 溯源</a>' : '') +
        '</div>' +
        '<div class="val" style="font-size:13px;color:var(--color-text);" id="field-val-p' + idx + '">' + f.value + '</div>' +
        '</div>';
      if (traceInfo) traceItems.push({ field: f, trace: traceInfo, idx: 'p' + idx });
    });

    // Collapsible empty fields
    if (emptyFields.length > 0) {
      html += '<details style="margin-top:8px;font-size:11px;">' +
        '<summary style="cursor:pointer;color:var(--color-text-muted);">' + emptyFields.length + ' 个字段未提供 ▾</summary>' +
        '<div style="max-height:150px;overflow-y:auto;margin-top:4px;">';
      emptyFields.forEach(function(f) {
        html += '<div style="padding:1px 0;color:var(--color-text-muted);">' + f.name + ' <span style="font-size:9px;">[' + f.type + ']</span></div>';
      });
      html += '</div></details>';
    }

    document.getElementById('extraction-results').innerHTML = html;
    self.switchMetaTab('fields');

    // Populate trace tab
    self._traceItems = traceItems;
    var traceHtml = traceItems.length > 0 ? '' :
      '<div style="text-align:center;padding:12px;color:var(--color-text-muted);font-size:12px;">所有字段均可在 PDF 原文中找到对应位置</div>';
    traceItems.forEach(function(ti) {
      traceHtml += '<div class="meta-field" style="cursor:pointer;padding:6px 8px;border-radius:6px;margin-bottom:4px;border:1px solid var(--color-border);" onclick="DocViewer.highlightTrace(\'' + ti.idx + '\')">' +
        '<label style="color:var(--color-primary);">' + ti.field.name + '</label>' +
        '<div class="val" style="font-size:12px;">' + ti.field.value + '</div>' +
        '<div style="font-size:10px;color:var(--color-text-muted);">📍 第 ' + ti.trace.page + ' 页 · 坐标(' + ti.trace.x + ', ' + ti.trace.y + ') · 置信度 ' + ti.trace.confidence + '</div>' +
        '</div>';
    });
    document.getElementById('trace-content').innerHTML = traceHtml;
  },

  /** Find matching text item for extracted value */
  findTraceItem: function(value) {
    if (!this.textItems || !this.textItems.length || !value) return null;
    var clean = value.replace(/[¥，,\s]/g, '').toLowerCase();
    if (clean.length < 2) return null;

    for (var i = 0; i < this.textItems.length; i++) {
      var ti = this.textItems[i];
      var tiClean = ti.text.replace(/[：:，,\s]/g, '').toLowerCase();
      if (tiClean.indexOf(clean) >= 0 || clean.indexOf(tiClean) >= 0) {
        return ti;
      }
    }
    // Partial match
    for (var i = 0; i < this.textItems.length; i++) {
      var ti = this.textItems[i];
      if (ti.text.toLowerCase().indexOf(clean.substring(0, Math.min(4, clean.length))) >= 0) {
        return ti;
      }
    }
    return null;
  },

  /** Show trace for a field — switch to trace tab and highlight */
  showTrace: function(idx) {
    this.switchMetaTab('trace');
    var el = document.getElementById('field-val-' + idx);
    if (el) {
      el.style.background = 'rgba(26,58,92,0.08)';
      setTimeout(function() { el.style.background = ''; }, 2000);
    }
  },

  highlightTrace: function(idx) {
    this.switchMetaTab('fields');
    var el = document.getElementById('field-val-' + idx);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.background = 'rgba(26,58,92,0.15)';
      setTimeout(function() { el.style.background = ''; }, 2000);
    }
  },

  handleDrop: function(e) {
    var file = e.dataTransfer.files[0];
    if (file) this.parseFile(file);
  },

  parseFile: function(file) {
    var self = this;
    var zone = document.getElementById('upload-zone');
    var status = document.getElementById('parse-status');

    // UI: parsing state
    zone.classList.add('has-file');
    document.getElementById('upload-text').innerHTML = '<strong>' + file.name + '</strong> (' + (file.size/1024).toFixed(1) + ' KB)';
    status.className = 'parse-status parsing';
    status.innerHTML = '<span class="pulse">●</span> LiteParse 解析中...';
    document.getElementById('doc-name').textContent = file.name;
    var parsePanel = document.getElementById('panel-parse');
    if (parsePanel) parsePanel.innerHTML = '<div style="text-align:center;padding:20px;"><span class="pulse">●</span> 解析中...</div>';

    var apiUrl = MinioAPI.liteparse.base + '/md';
    console.log('Parsing file:', file.name, 'size:', file.size, 'to:', apiUrl);
    MinioAPI.liteparse.toMarkdown(file).then(function(r) {
      if (!r.success) {
        AuditWorkbench.toast('解析失败: ' + (r.error || '未知错误'), 'danger');
        status.className = 'parse-status empty';
        status.innerHTML = '<i class="bi bi-x-circle"></i> 失败';
        return;
      }

      self.currentResult = r;
      status.className = 'parse-status ready';
      status.innerHTML = '<i class="bi bi-check-circle"></i> 已解析 · ' + r.metadata.pages + '页 · ' + (r.full_markdown ? r.full_markdown.length : 0) + '字符';
      AuditWorkbench.toast('LiteParse 解析完成 · ' + r.metadata.pages + ' 页', 'success');

      // Render metadata
      self.renderMeta(r);

      // Enable auto-match button
      var btn = document.getElementById('btn-auto-match');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-magic"></i> 🤖 自动匹配模板';

      // Auto-match after a short delay (let user see the markdown first)
      setTimeout(function() { self.autoMatchTemplate(); }, 500);

      // Render markdown
      self.renderMarkdown(r.full_markdown || '');

      // Show raw text in source panel
      document.getElementById('raw-text').textContent = r.full_markdown || '(empty)';

      // Update template info
      var tplInfo = document.getElementById('tpl-info');
      if (tplInfo) tplInfo.innerHTML = '<span style="color:var(--color-success);">✅ 已解析 · ' + r.metadata.pages + ' 页 · ' + (r.full_markdown ? r.full_markdown.length.toLocaleString() : 0) + ' 字符</span>';
    }).catch(function(e) {
      console.error('Parse error:', e);
      AuditWorkbench.toast('LiteParse 连接失败: ' + (e.message || '请确认 :5006 已启动'), 'danger');
      status.className = 'parse-status empty';
      status.innerHTML = '<i class="bi bi-x-circle"></i> 服务不可达';
    });
  },

  renderMeta: function(r) {
    // Store text items for tracing
    this.textItems = r.text_items || [];

    var html = '';
    html += '<div class="meta-field"><label>文件名</label><div class="val">' + (r.metadata.filename || '-') + '</div></div>';
    html += '<div class="meta-field"><label>页数 / 文本项</label><div class="val">' + r.metadata.pages + ' 页 · ' + (r.text_items ? r.text_items.length : 0) + ' 项</div></div>';
    html += '<div class="meta-field"><label>Markdown</label><div class="val">' + (r.full_markdown ? r.full_markdown.length.toLocaleString() : 0) + ' 字符</div></div>';
    html += '<div class="meta-field"><label>引擎</label><div class="val">LiteParse v2.4.0</div></div>';

    r.pages.forEach(function(p) {
      var itemsOnPage = r.text_items ? r.text_items.filter(function(ti) { return ti.page === p.page; }).length : 0;
      html += '<div class="meta-field">' +
        '<label>第 ' + p.page + ' 页</label>' +
        '<div class="val">' + itemsOnPage + ' 个文本项 · ' + (p.text ? p.text.length : 0) + ' 字符</div>' +
        '</div>';
    });

    document.getElementById('panel-parse').innerHTML = html;

    // Update template info
    document.getElementById('tpl-info').innerHTML =
      '<span style="color:var(--color-success);">✅ 已解析 · ' + r.metadata.pages + ' 页 · ' + (r.full_markdown ? r.full_markdown.length.toLocaleString() : 0) + ' 字符</span>';
  },

  renderMarkdown: function(md) {
    var placeholder = document.getElementById('md-placeholder');
    var content = document.getElementById('md-content');
    var info = document.getElementById('md-info');

    if (md) {
      if (placeholder) placeholder.style.display = 'none';
      content.style.display = '';
      content.textContent = md;
      if (info) info.textContent = md.length.toLocaleString() + ' 字符';
    } else {
      if (placeholder) placeholder.style.display = '';
      content.style.display = 'none';
      if (info) info.textContent = '';
    }
  },

  openInEditor: function() {
    if (!this.currentResult || !this.currentResult.full_markdown) {
      AuditWorkbench.toast('请先上传并解析文档','warning'); return;
    }
    localStorage.setItem('md_editor_content', this.currentResult.full_markdown);
    localStorage.setItem('md_editor_filename', this.currentResult.metadata?.filename || 'document.md');
    window.open('lib/lengyi-md-editor/lengyi-md-editor/markdown-editor.html', '_blank');
  },

  onEditorLoaded: function() {
    // No-op: using <pre> instead of iframe
  },

  _sendToEditor: function(md) {
    // No-op: using <pre> instead of iframe
  },

  toggleSource: function() {
    this.sourceVisible = !this.sourceVisible;
    var sv = document.getElementById('source-view');
    var mv = document.getElementById('md-view');
    sv.style.display = this.sourceVisible ? 'block' : 'none';
    mv.style.gridColumn = this.sourceVisible ? '' : 'span 2';
    // Copy raw text if available
    if (this.sourceVisible && this.currentResult) {
      document.getElementById('raw-text').textContent = this.currentResult.full_markdown || '(empty)';
    }
  },

  clearAll: function() {
    this.currentResult = null;
    this._pendingMd = null;
    document.getElementById('upload-zone').classList.remove('has-file');
    document.getElementById('upload-text').innerHTML = '拖拽 PDF/DOCX 到此处，或 <strong>点击选择文件</strong>';
    document.getElementById('parse-status').className = 'parse-status empty';
    document.getElementById('parse-status').innerHTML = '<i class="bi bi-circle"></i> 未加载';
    document.getElementById('doc-name').textContent = '上传 PDF → LiteParse Markdown 化';
    var pp = document.getElementById('panel-parse');
    if (pp) pp.innerHTML = '<div style="text-align:center;padding:20px;color:var(--color-text-muted);font-size:13px;"><i class="bi bi-arrow-up" style="font-size:20px;opacity:0.3;"></i><p style="margin-top:8px;">上传文件后自动解析</p></div>';
    var ep = document.getElementById('extraction-results');
    if (ep) ep.innerHTML = '';
    var tc = document.getElementById('trace-content');
    if (tc) tc.innerHTML = '';
    var ti = document.getElementById('tpl-info');
    if (ti) ti.innerHTML = '<span style="color:var(--color-text-muted);">加载中...</span>';
    document.getElementById('raw-text').textContent = '';
    var mdContent = document.getElementById('md-content');
    var mdPlaceholder = document.getElementById('md-placeholder');
    if (mdContent) mdContent.style.display = 'none';
    if (mdPlaceholder) mdPlaceholder.style.display = '';
  }
};

document.addEventListener('DOMContentLoaded', function() { DocViewer.init(); });
</script>
