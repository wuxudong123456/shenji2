<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>审理复核 — AuditWorkbench</title>
<link rel="stylesheet" href="lib/bootstrap-icons.css"><link rel="stylesheet" href="css/style.css">
<style>
.review-split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-lg); }
@media(max-width:992px){.review-split{grid-template-columns:1fr;}}
.review-col { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md); }
.review-col.ai { border-left: 4px solid var(--color-primary); }
.review-col.human { border-left: 4px solid var(--color-success); }
.check-item { display: flex; align-items: center; gap: var(--space-sm); padding: 8px 0; font-size: 14px; }
.check-item + .check-item { border-top: 1px solid var(--color-border); }
</style>
</head>
<body data-page="review">
<div id="aw-toast-container" style="position:fixed;top:68px;right:20px;z-index:9999;"></div>
<nav id="aw-navbar" class="app-navbar"></nav>
<div class="app-layout"><aside id="aw-sidebar" class="app-sidebar"></aside>
<main class="app-content">

<div class="page-header"><div><h1><i class="bi bi-check2-all"></i> 审理复核</h1>
<div class="breadcrumb">审计疑点复核 · 定性结论审查 · 证据链完整性检查</div></div></div>

<div style="margin-bottom:var(--space-lg);">
  <div class="form-group"><label class="form-label">选择待复核项目</label>
    <select class="form-select" id="review-project-select" onchange="Review.loadAnalysis(this.value)"><option value="">— 选择项目 —</option></select></div>
</div>

<div class="review-split">
  <!-- AI Column -->
  <div class="review-col ai">
    <h3 style="color:var(--color-primary);margin-bottom:12px;"><i class="bi bi-robot"></i> AI推理结论</h3>
    <div id="review-ai-content" style="color:var(--color-text-muted);font-size:14px;padding:20px;text-align:center;">请先选择一个已完成分析的项目</div>
  </div>

  <!-- Human Column -->
  <div class="review-col human">
    <h3 style="color:var(--color-success);margin-bottom:12px;"><i class="bi bi-person-check"></i> 人工复核意见</h3>
    <div id="review-human-content" style="color:var(--color-text-muted);font-size:14px;padding:20px;text-align:center;">选择项目后可填写复核意见</div>
  </div>
    <div class="check-item"><strong>证据链:</strong>
      <label style="font-size:13px;"><input type="checkbox" checked> ☑ 充分</label>
      <label style="font-size:13px;color:var(--color-warning);"><input type="checkbox"> ⚠️ 建议补充评标委员会意见</label>
    </div>
    <div class="check-item"><strong>处罚幅度:</strong>
      <select class="form-select form-select-sm" style="width:auto;display:inline;"><option selected>7.5‰ (中位值)</option><option>5‰</option><option>10‰ (上限)</option></select>
      <span>☑ 同意AI建议</span>
    </div>
    <div class="check-item"><strong>复核意见:</strong> <textarea class="form-textarea" rows="2" style="font-size:13px;" placeholder="补充复核意见...">同意AI定性结论。建议补充该市教育局自行制定的采购管理办法作为地方依据。</textarea></div>
  </div>
</div>

<div style="margin-top:var(--space-lg);display:flex;gap:8px;">
  <button class="btn btn-accent btn-lg"><i class="bi bi-check-lg"></i> 确认复核通过</button>
  <button class="btn btn-outline btn-lg"><i class="bi bi-arrow-return-left"></i> 退回重审</button>
  <button class="btn btn-outline"><i class="bi bi-download"></i> 导出复核意见</button>
</div>

</main></div>
<script src="js/app.js"></script>
<script>
var Review = {
  init: function() {
    var self = this;
    if (typeof AuditAPI === 'undefined') return;
    // 加载有分析任务的项目列表
    AuditAPI.tasks.list({type: 'analysis', limit: 20}).then(function(resp) {
      if (!resp || !resp.success || !resp.tasks) return;
      var sel = document.getElementById('review-project-select');
      var completed = resp.tasks.filter(function(t) { return t.status === 'completed'; });
      completed.forEach(function(t) {
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = (t.task_name || '分析任务') + ' (' + (t.completed_at || '').substring(0, 10) + ')';
        sel.appendChild(opt);
      });
      if (completed.length === 0) {
        document.getElementById('review-ai-content').textContent = '暂无已完成的AI分析任务，请先在智能分析中完成分析流程。';
      }
    }).catch(function() {});
  },

  loadAnalysis: function(taskId) {
    if (!taskId) return;
    var self = this;
    var aiBox = document.getElementById('review-ai-content');
    aiBox.innerHTML = '<span class="pulse">●</span> 加载AI分析结果...';

    AuditAPI.tasks.get(taskId).then(function(resp) {
      if (!resp || !resp.success || !resp.task) { aiBox.textContent = '加载失败'; return; }
      var result = resp.task.result || {};
      self._renderAI(result);
      self._renderHuman(result);
    }).catch(function() { aiBox.textContent = '网络错误'; });
  },

  _renderAI: function(result) {
    var items = [];
    if (result.analysis_results) {
      var ar = result.analysis_results;
      if (Array.isArray(ar)) {
        ar.forEach(function(a) {
          items.push('<div class="check-item"><strong>违规模型:</strong> ' + (a.violation_model || a.violation_title || '—') + '</div>');
          if (a.scan_summary) items.push('<div class="check-item"><strong>扫描结果:</strong> ' + (a.scan_summary.hits||0) + '/' + (a.scan_summary.total_records||0) + ' 命中</div>');
          if (a.severity_assessment) items.push('<div class="check-item"><strong>严重程度:</strong> ' + a.severity_assessment + '</div>');
        });
      }
    }
    if (result.suspicion_report) {
      var sr = result.suspicion_report;
      items.push('<div class="check-item"><strong>疑点总数:</strong> ' + (sr.total_suspicions || 0) + '（高风险 ' + (sr.high_risk_count || 0) + '）</div>');
    }
    if (result.overall_assessment) {
      items.push('<div class="check-item"><strong>整体评估:</strong> ' + result.overall_assessment.substring(0, 100) + '</div>');
    }
    document.getElementById('review-ai-content').innerHTML = items.length > 0 ? items.join('') : '<div style="color:var(--color-text-muted);">该任务无分析结果数据</div>';
  },

  _renderHuman: function(result) {
    document.getElementById('review-human-content').innerHTML =
      '<div class="check-item"><strong>定性结论:</strong> <select class="form-select form-select-sm" style="width:auto;display:inline;"><option>同意AI结论</option><option>部分同意</option><option>不同意</option></select></div>' +
      '<div class="check-item"><strong>法规适用:</strong> <input type="checkbox" checked> 同意AI引用的法规</div>' +
      '<div class="check-item"><strong>证据链:</strong> <input type="checkbox" checked> 充分</div>' +
      '<div class="check-item"><strong>复核意见:</strong> <textarea class="form-textarea" rows="2" style="font-size:13px;" placeholder="补充复核意见..."></textarea></div>' +
      '<div style="margin-top:8px;"><button class="btn btn-primary" onclick="Review.submit()"><i class="bi bi-check-lg"></i> 确认复核</button></div>';
  },

  submit: function() {
    var sel = document.getElementById('review-project-select');
    if (!sel.value) return AuditWorkbench.toast('请先选择项目', 'warning');
    AuditWorkbench.toast('复核意见已提交', 'success');
  }
};
document.addEventListener('DOMContentLoaded', function() { Review.init(); });
</script>
</body>
</html>
